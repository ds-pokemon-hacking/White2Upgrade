[msg]
trailing_data = "a0a0"

[msg.section_0.entries.0]
text = [
  "[VAR TRNAME(1)]: You found them!\\n",
  "I knew you could do it!\\c$",
]

[msg.section_0.entries.1]
text = [
  "But...\\n",
  "How do we get in?\\c$",
]

[msg.section_0.entries.2]
text = [
  "???: Hold up!\\c$",
]

[msg.section_0.entries.3]
text = [
  "A heavy gangplank fell\\n",
  "with a solid thud...\\c$",
]

[msg.section_0.entries.4]
text = [
  "Marlon: Eh, this should do it!\\c$",
]

[msg.section_0.entries.5]
text = [
  "[VAR TRNAME(1)]: I thought you weren't\\n",
  "going to fight Team Plasma?\\c$",
]

[msg.section_0.entries.6]
text = [
  "Marlon: Hey, friends!\\n",
  "Team Plasma's not botherin' me.\\c\\n",
  "They could be up to no good\\n",
  "for reals, and...\\c\\n",
  "It's not my style to go around\\n",
  "decidin' Team Plasma's bad\\l\\n",
  "without thinkin' 'bout it\\l\\n",
  "just 'cause everyone says so!\\c$",
]

[msg.section_0.entries.7]
text = [
  "But, eh, you're havin' trouble,\\n",
  "so I've got to help out!\\l\\n",
  "That's what I want to do!\\c$",
]

[msg.section_0.entries.8]
text = [
  "[VAR TRNAME(1)]: Thanks...\\c$",
]

[msg.section_0.entries.9]
text = [
  "Marlon: Listen, 'K.\\n",
  "Believe in somethin'!\\c\\n",
  "Searchin' for stolen\\n",
  "Pokémon is fine!\\c\\n",
  "Keepin' Unova from bein'\\n",
  "iced over's fine too!\\c\\n",
  "It's all good.\\n",
  "But think 'bout why you're doin' that.\\c\\n",
  "The strength of your beliefs is what\\n",
  "gives you and your Pokémon power!\\c$",
]

[msg.section_0.entries.10]
text = [
  "I made some noise,\\n",
  "so some people came out!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Hey, be careful, 'K!\\c$",
]

[msg.section_0.entries.12]
text = [
  "[VAR TRNAME(1)]: What was that?!\\n",
  "The guy sure doesn't follow through!\\c$",
]

[msg.section_0.entries.13]
text = [
  "Well, I guess he was being\\n",
  "kind in his own way...\\c\\n",
  "All right, I'm going in!\\c$",
]

[msg.section_0.entries.14]
text = [
  "[VAR TRNAME(1)]: Team Plasma!\\c\\n",
  "No matter where you fly,\\n",
  "I won't let you get away!\\c\\n",
  "But, what's over there anyway?\\c$",
]

[msg.section_0.entries.15]
text = [
  "Cheren: Sorry I'm late...\\c\\n",
  "I suspect that they're flying\\n",
  "toward the Giant Chasm.\\c$",
]

[msg.section_0.entries.16]
text = [
  "[VAR TRNAME(1)]: The Giant Chasm!\\n",
  "That's deep in Route 22, right?\\c\\n",
  "OK, I'm going!\\n",
  "[VAR TRNAME(0)]! You come too!\\c$",
]

[msg.section_0.entries.17]
text = [
  "That Pokémon...\\c\\n",
  "Kyurem, was it?\\c\\n",
  "Its cry sounded\\n",
  "lonely somehow.\\c$",
]

[msg.section_0.entries.18]
text = [
  "Cheren: Kyurem!\\c\\n",
  "Team Plasma is using Kyurem's\\n",
  "power for evil?!\\c$",
]

[msg.section_0.entries.19]
text = [
  "Then how should we stop\\n",
  "Team Plasma?\\c\\n",
  "If Kyurem is, like Drayden said,\\n",
  "a legendary Dragon-type Pokémon,\\l\\n",
  "the only ones who could stand up\\l\\n",
  "to it are Reshiram or Zekrom!\\c\\n",
  "But...\\n",
  "Neither of them is here right now...\\c\\n",
  "Where are the ones the legendary\\n",
  "Pokémon recognized as heroes, anyway?\\l\\n",
  "I guess I just have to find one of them!$",
]

[msg.section_0.entries.20]
text = [
  "Then how should we stop\\n",
  "Team Plasma?\\c\\n",
  "If Kyurem is, like Drayden said,\\n",
  "a legendary Dragon-type Pokémon,\\l\\n",
  "the only ones who could stand up\\l\\n",
  "to it are Zekrom or Reshiram!\\c\\n",
  "But...\\n",
  "Neither of them is here right now...\\c\\n",
  "Where are the ones the legendary\\n",
  "Pokémon recognized as heroes, anyway?\\l\\n",
  "I guess I just have to find one of them!$",
]

[msg.section_0.entries.21]
text = [
  "Cheren: Yeah...\\c\\n",
  "You can get to the Giant Chasm\\n",
  "from Route 22.$",
]

[msg.section_0.entries.0]
text = [
  "Do you want to go back to Castelia City?$",
]

[msg.section_0.entries.1]
text = [
  "We are just about to leave, so please\\n",
  "get on board and wait a moment.\\c$",
]

[msg.section_0.entries.2]
text = [
  "Just come talk to me when you want\\n",
  "to return to Castelia City!$",
]

[msg.section_0.entries.3]
text = [
  "Somehow, coming here gives me power!$",
]

[msg.section_0.entries.4]
text = [
  "Have you heard about this?\\c\\n",
  "A rich person was protecting\\n",
  "a Pokémon from bad people here!$",
]

[msg.section_0.entries.5]
text = [
  "Have you heard about this?\\c\\n",
  "A rich person was protecting\\n",
  "a Pokémon from bad people here!$",
]

[msg.section_0.entries.6]
text = [
  "I wonder how the Pokémon felt\\n",
  "while it was in that room...\\l\\n",
  "It must have been lonely for a long time.$",
]

[msg.section_0.entries.7]
text = [
  "The Victory Pokémon, Victini...\\c\\n",
  "They say it can give its Trainer\\n",
  "incredible power.\\c\\n",
  "I wonder who has access\\n",
  "to that power now...$",
]

[msg.section_0.entries.8]
text = [
  "Th...that... Your Pokémon...\\n",
  "Is that the Victory Pokémon, Victini?!\\c\\n",
  "Is it true?\\n",
  "Have you just kept winning and winning\\l\\n",
  "with Victini's help?\\c\\n",
  "I wish I had your luck...$",
]

[msg.section_0.entries.9]
text = [
  "Pokémon follow their Trainers'\\n",
  "orders without question.\\c\\n",
  "And yet, some people try\\n",
  "to make Pokémon do bad things!$",
]

[msg.section_0.entries.10]
text = [
  "Nowadays, there aren't as many tourists\\n",
  "visiting here. It's boring...\\c\\n",
  "But if the alternative is guys like\\n",
  "Team Plasma, I'm OK with being bored!$",
]

[msg.section_0.entries.11]
text = [
  "Two hundred years ago, an ultra-rich\\n",
  "family bought this island.\\n",
  "They named it Liberty Garden.\\n",
  "\\n",
  "It's a place where people and Pokémon\\n",
  "can live freely.$",
]

[msg.section_0.entries.12]
text = [
  "Dock 2\\n",
  "To board the tour boat, go to Dock 1.$",
]

[msg.section_0.entries.13]
text = [
  "This lighthouse shines with the light\\n",
  "of freedom.\\c\\n",
  "Only authorized personnel may enter.$",
]

[msg.section_0.entries.14]
text = [
  "Professor Juniper: Oh?\\n",
  "Victini!\\c$",
]

[msg.section_0.entries.15]
text = [
  "Professor Juniper: Oh?\\n",
  "Your Pokédex...\\c\\n",
  "You've caught Victini!\\c$",
]

[msg.section_0.entries.16]
text = [
  "Professor Juniper: Oh?\\n",
  "Your Pokédex...\\c\\n",
  "You've seen Victini!\\c$",
]

[msg.section_0.entries.17]
text = [
  "In the Unova Pokédex, Victini was\\n",
  "assigned a special number: zero.\\c\\n",
  "I've heard the special number was\\n",
  "assigned in the hope that Victini's power\\l\\n",
  "to bring victory would be shared with the\\l\\n",
  "Trainer who travels with this Pokédex...\\c$",
]

[msg.section_0.entries.18]
text = [
  "How do you relate to Pokémon?\\c\\n",
  "As you fill your Pokédex,\\n",
  "you'll find your own answer.\\c\\n",
  "That's what I'm hoping for.\\n",
  "See you!\\c$",
]

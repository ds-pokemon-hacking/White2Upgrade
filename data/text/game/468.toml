[msg.section_0.entries.0]
text = [
  "        $$",
]

[msg.section_0.entries.1]
text = [
  "                       $$",
]

[msg.section_0.entries.2]
text = [
  "The Entree Forest connects dreams\\n",
  "and reality.\\c\\n",
  "People say dreams come true here.\\c$",
]

[msg.section_0.entries.3]
text = [
  "Is there anything you'd like to know\\n",
  "about the Entree Forest?$",
]

[msg.section_0.entries.4]
text = [
  "The Entree Forest is a place where\\n",
  "dreams come true.\\c\\n",
  "When a dreaming Pokémon wakes up in\\n",
  "Game Sync, its dream will come true in\\l\\n",
  "this forest.\\c$",
]

[msg.section_0.entries.5]
text = [
  "Pokémon that your Pokémon met in its\\n",
  "dream will show up in the Entralink\\l\\n",
  "in a Forest Clearing.\\c\\n",
  "Pokémon in a Forest Clearing will be\\n",
  "your friends for sure!\\c\\n",
  "If you move the Pokémon to the Deepest\\n",
  "Clearing, they will wait for you there.\\c$",
]

[msg.section_0.entries.6]
text = [
  "When your Pokémon wakes up from a\\n",
  "dream, please come to this forest.$",
]

[msg.section_0.entries.7]
text = [
  "Entree Forest$",
]

[msg.section_0.entries.8]
text = [
  "Forest Clearing and Deepest Clearing$",
]

[msg.section_0.entries.9]
text = [
  "Cancel$",
]

[msg.section_0.entries.10]
text = [
  "You can go back to the original world\\n",
  "from this place.\\c\\n",
  "If you want to go back to the original\\n",
  "world, please come back here.$",
]

[msg.section_0.entries.11]
text = [
  "The Funfest Mission will be started.\\n",
  "Please wait a moment.$",
]

[msg.section_0.entries.12]
text = [
  "You can go back to your\\n",
  "own world from here.\\c\\n",
  "Do you want to go back?$",
]

[msg.section_0.entries.13]
text = [
  "Checked your Entree.\\c$",
]

[msg.section_0.entries.14]
text = [
  "Welcome to the Entralink.\\c\\n",
  "Hmm?\\c\\n",
  "Judging by your expression, you don't\\n",
  "seem to know where you are.\\c$",
]

[msg.section_0.entries.15]
text = [
  "This place is called the Entralink...\\n",
  "It's a mysterious place\\l\\n",
  "that links people.\\c\\n",
  "It is also a place where you can hone\\n",
  "your skills by helping out\\l\\n",
  "nearby adventurers.\\c$",
]

[msg.section_0.entries.16]
text = [
  "...Hmm.\\n",
  "It's a bit hard to explain with words.\\c\\n",
  "As an adventurer,\\n",
  "you should test yourself\\l\\n",
  "to learn what it is...\\c$",
]

[msg.section_0.entries.17]
text = [
  "As a start, talk to this Entree\\n",
  "to receive a mission.\\c\\n",
  "Then deliver your power to it!$",
]

[msg.section_0.entries.18]
text = [
  "Good! You've managed\\n",
  "to receive a mission.\\c\\n",
  "The first mission is the...\\n",
  "Berry search, I see.\\c\\n",
  "That should be just\\n",
  "the mission for a beginner like you.\\c\\n",
  "Cities and routes have places\\n",
  "that glow.\\c\\n",
  "You should find Berries there.\\n",
  "Search carefully!\\c\\n",
  "After the mission, come back here, and\\n",
  "a new power will be granted...\\c\\n",
  "That's it for now.\\n",
  "Get going!\\c$",
]

[msg.section_0.entries.19]
text = [
  "Oh, you're back...\\c\\n",
  "Whoa!\\n",
  "This is wonderful!\\l\\n",
  "You've completed the mission!\\c\\n",
  "As I promised, you'll receive a\\n",
  "new power...not from me, but\\l\\n",
  "from this Entree.\\c$",
]

[msg.section_0.entries.20]
text = [
  "Oh, you're back...\\c\\n",
  "Hmm...\\n",
  "The mission failed, I see...\\c\\n",
  "It's a bit difficult in the beginning,\\n",
  "so you need to try again and again.\\l\\n",
  "You'll get better before too long.\\c\\n",
  "Anyway, I'll give you these\\n",
  "for your hard work!\\c$",
]

[msg.section_0.entries.21]
text = [
  "As I promised, you'll receive\\n",
  "a new power...not from me,\\l\\n",
  "but from this Entree.\\c$",
]

[msg.section_0.entries.22]
text = [
  "The Entree gathers\\n",
  "wishes from people.\\c\\n",
  "These wishes resonate with each other\\n",
  "and turn into Pass Powers, which\\l\\n",
  "help adventurers.\\c$",
]

[msg.section_0.entries.23]
text = [
  "Go ahead and receive it.\\n",
  "Talk to the Entree\\l\\n",
  "and receive a Pass Power!$",
]

[msg.section_0.entries.24]
text = [
  "You've received Pass Power(s), I see.\\c\\n",
  "Now you've become a real adventurer.\\c\\n",
  "Use your Pass Powers to help\\n",
  "nearby adventurers!\\c\\n",
  "To use a Pass Power, you need a certain\\n",
  "number of Pass Orbs.\\c\\n",
  "Receive missions from time to time\\n",
  "and collect Pass Orbs.\\c\\n",
  "That's all from me.\\c\\n",
  "It is now up to you\\n",
  "what you think and do.\\c\\n",
  "I hope you have a wonderful\\n",
  "adventure waiting for you...\\c$",
]

[msg.section_0.entries.25]
text = [
  "You can use a Pass Power by tapping\\n",
  "the Tag Log on your C-Gear.\\c\\n",
  "Tap the green triangle icon in\\n",
  "the Tag Log.$",
]

[msg.section_0.entries.26]
text = [
  "Is there anything you'd like to know\\n",
  "about the Entralink?$",
]

[msg.section_0.entries.27]
text = [
  "About Funfest Missions$",
]

[msg.section_0.entries.28]
text = [
  "About Pass Powers$",
]

[msg.section_0.entries.29]
text = [
  "Cancel$",
]

[msg.section_0.entries.30]
text = [
  "The Entralink is an island where\\n",
  "adventurers are linked...\\c\\n",
  "Meet many adventurers\\n",
  "and hone your skills.$",
]

[msg.section_0.entries.31]
text = [
  "Missions test adventurers.\\c\\n",
  "Complete these missions and you'll\\n",
  "receive helpful things like Pass Orbs\\l\\n",
  "and Pass Powers.\\c\\n",
  "Talk to the Entree to start a mission, or\\n",
  "use Tag Log on your C-Gear\\l\\n",
  "to join someone else's mission.\\c\\n",
  "You'll gain more power that way.\\c$",
]

[msg.section_0.entries.32]
text = [
  "Pass Powers are mysterious powers.\\c\\n",
  "You can register up to three of them\\n",
  "in your C-Gear.\\c\\n",
  "You use them by aiming at\\n",
  "people you pass by with the\\l\\n",
  "Tag Log.\\c\\n",
  "But you need Pass Orbs to use\\n",
  "Pass Powers.\\c\\n",
  "You should carry out a mission\\n",
  "and collect Pass Orbs.\\c$",
]

[msg.section_0.entries.33]
text = [
  "First, talk to the Entree and\\n",
  "accept a mission.\\c\\n",
  "Then deliver your wishes\\n",
  "to the Entree!$",
]

[msg.section_0.entries.34]
text = [
  "Go ahead!\\n",
  "Receive the Pass Power from the Entree!$",
]

[msg.section_0.entries.35]
text = [
  "Is there anything you'd like to know\\n",
  "about the Entree?$",
]

[msg.section_0.entries.36]
text = [
  "Mission Types$",
]

[msg.section_0.entries.37]
text = [
  "Pass Power Types$",
]

[msg.section_0.entries.38]
text = [
  "Cancel$",
]

[msg.section_0.entries.39]
text = [
  "You'll find more and more types of\\n",
  "Funfest Missions you can receive from the\\l\\n",
  "Entree as you advance in your adventure.\\c\\n",
  "Talking to people or battling other\\n",
  "Trainers will give you more mission types.\\c\\n",
  "Please listen to other people\\n",
  "when they express their wishes.\\c$",
]

[msg.section_0.entries.40]
text = [
  "Raising the Entralink's level\\n",
  "gives you new types of Pass Powers.\\c\\n",
  "The Entralink level can sometimes go\\n",
  "up as you complete a Funfest Mission.\\c\\n",
  "The higher the score is,\\n",
  "the more likely the level is to go up.\\c$",
]

[msg.section_0.entries.41]
text = [
  "The Entree grows little by little,\\n",
  "as if it responds to people's wishes.$",
]

[msg.section_0.entries.42]
text = [
  "Is there anything you'd like to know\\n",
  "about participants?$",
]

[msg.section_0.entries.43]
text = [
  "About participants$",
]

[msg.section_0.entries.44]
text = [
  "About collaboration$",
]

[msg.section_0.entries.45]
text = [
  "Cancel$",
]

[msg.section_0.entries.46]
text = [
  "When you start a Funfest Mission,\\n",
  "nearby adventurers can participate\\l\\n",
  "in the same mission using the Tag Log\\l\\n",
  "on their C-Gear.\\c\\n",
  "It may take some time before the mission\\n",
  "invitations are received. They should wait\\l\\n",
  "a little while and check their Tag Logs.\\c$",
]

[msg.section_0.entries.47]
text = [
  "When you have participants in your\\n",
  "Funfest Mission, their actions also count\\l\\n",
  "as part of your score.\\c\\n",
  "In a mission, items are found at the same\\n",
  "location for everyone.\\c\\n",
  "You may be able to talk to each other\\n",
  "to make missions easier for everybody.\\c\\n",
  "One more thing. Sometimes you may fail\\n",
  "to receive scores from other people.\\c\\n",
  "Worlds don't always resonate\\n",
  "as they should, it seems.\\c$",
]

[msg.section_0.entries.48]
text = [
  "It seems that the more adventurers\\n",
  "you gather, the more power you bring\\l\\n",
  "to the Entralink.$",
]

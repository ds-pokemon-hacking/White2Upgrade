[msg.section_0.entries.0]
text = [
  "The power of science is amazing!\\c\\n",
  "Now you can use infrared to trade\\n",
  "Pokémon and have battles--\\l\\n",
  "all in the blink of an eye!$",
]

[msg.section_0.entries.1]
text = [
  "Do you think traveling with Pokémon\\n",
  "changes people?$",
]

[msg.section_0.entries.2]
text = [
  "Me too! Traveling and thinking about many\\n",
  "things can definitely make a difference!$",
]

[msg.section_0.entries.3]
text = [
  "You're right! It's fine to just enjoy the\\n",
  "journey without overthinking it!$",
]

[msg.section_0.entries.4]
text = [
  "Know what? On my next birthday,\\n",
  "Professor Juniper is going to\\l\\n",
  "give me a Pokémon as a present!\\c\\n",
  "I'll get a Pokédex, too, of course!\\c\\n",
  "Maybe I'll grow up to be a Pokémon\\n",
  "professor, or a Champion!\\c\\n",
  "I haven't decided yet, but\\n",
  "I'll pick my own dream to pursue!$",
]


[msg.section_0.entries.11]
text = [
  "Ha ha! I am a football player!\\c\\n",
  "I injured my hand, so I can't sign\\n",
  "autographs! I'm sorry about that.\\c\\n",
  "So, what does the autograph on your\\n",
  "Trainer Card look like?$",
]

[msg.section_0.entries.12]
text = [
  "Yeah! I am an Infielder!\\c\\n",
  "I hurt my hand, so I can't write\\n",
  "an autograph! Sorry!\\c\\n",
  "Say, how did you sign your Trainer Card?$",
]

[msg.section_0.entries.13]
text = [
  "Bwa ha ha! I am a Striker!\\c\\n",
  "My hand got hurt, so I won't be able\\n",
  "to sign any autographs! Regrets!\\c\\n",
  "What does your Trainer Card signature\\n",
  "look like?$",
]

[msg.section_0.entries.14]

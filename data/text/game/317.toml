[msg.section_0.entries.0]
text = [
  "Hey there, Trainer!\\n",
  "It looks like you've got energetic\\l\\n",
  "Pokémon there with ya!\\c\\n",
  "Can I ask a favor?\\c\\n",
  "I need to get the Workers\\n",
  "in this complex fired up!\\c\\n",
  "How about it?\\n",
  "Help a guy out, will ya?$",
]

[msg.section_0.entries.1]
text = [
  "Yeah! That's what I like to hear!\\c\\n",
  "There are some new Workers\\n",
  "here in the complex!\\c\\n",
  "Go get those three raring to go!$",
]

[msg.section_0.entries.2]
text = [
  "Really? Nobody really wants\\n",
  "anything enough anymore!$",
]

[msg.section_0.entries.3]
text = [
  "OK!\\c\\n",
  "The three new Workers are\\n",
  "in different parts of the complex!$",
]

[msg.section_0.entries.4]
text = [
  "Hey! Ya did it, didn't ya!\\n",
  "This is a token of my thanks!\\c$",
]

[msg.section_0.entries.5]
text = [
  "The complex is lively, because everyone\\n",
  "is so fired up and ready to go!$",
]

[msg.section_0.entries.6]
text = [
  "Working at this complex\\n",
  "was my dream...\\c\\n",
  "But now that it's come true,\\n",
  "I've got everything I want...$",
]

[msg.section_0.entries.7]
text = [
  "Working at this complex\\n",
  "was my dream...\\c\\n",
  "But now that it's come true,\\n",
  "I've got everything I want...\\c\\n",
  "What? The foreman said so? OK, fine.\\n",
  "We just have to battle, right?\\c$",
]

[msg.section_0.entries.8]
text = [
  "I came to this complex so\\n",
  "my Pokémon could accomplish a lot!\\c\\n",
  "That means that as a Trainer,\\n",
  "I have to work like crazy!$",
]

[msg.section_0.entries.9]
text = [
  "I'm happy just to be with\\n",
  "my awesome Pokémon!$",
]

[msg.section_0.entries.10]
text = [
  "I'm happy just to be with\\n",
  "my awesome Pokémon!\\c\\n",
  "What? A battle?\\n",
  "I guess so... I'll play a bit.\\c$",
]

[msg.section_0.entries.11]
text = [
  "I completely forgot!\\c\\n",
  "If I don't work really hard, my Pokémon\\n",
  "won't have a chance to shine!\\c\\n",
  "All riiight! Time to get to work!$",
]

[msg.section_0.entries.12]
text = [
  "Every day is the same...$",
]

[msg.section_0.entries.13]
text = [
  "Every day is the same...\\c\\n",
  "I get bored when things don't change,\\n",
  "so I don't mind battling you!\\c$",
]

[msg.section_0.entries.14]
text = [
  "It's OK if every day's the same\\n",
  "when I'm working at this complex!\\l\\n",
  "It means there aren't any problems!$",
]

[msg.section_0.entries.15]
text = [
  "Heating crude oil separates\\n",
  "it into many different components...\\l\\n",
  "That's what this distillation tower is for!\\c\\n",
  "It's also known as a topper,\\n",
  "but I want to call it a distillation tower.$",
]

[msg.section_0.entries.16]
text = [
  "Oh! My knowledge overflowed,\\n",
  "and it was overheard!$",
]

[msg.section_0.entries.17]
text = [
  "The smokestacks of the complex\\n",
  "rise up into the sky.\\c\\n",
  "That powerful silhouette\\n",
  "is sure breathtaking, isn't it?\\c\\n",
  "By the way, they're burning up\\n",
  "waste gas.\\c\\n",
  "Recently, they've found all sorts\\n",
  "of uses for this gas, though.$",
]

[msg.section_0.entries.18]
text = [
  "Oh! You overheard some\\n",
  "of my vast stock of knowledge!$",
]

[msg.section_0.entries.19]
text = [
  "Those gas holders are sure an\\n",
  "expression of harmony, aren't they?\\c\\n",
  "There's a reason behind that shape.\\c\\n",
  "A sphere is best for withstanding\\n",
  "the tremendous pressure inside.\\c\\n",
  "It would be nice if they would draw\\n",
  "a Pokémon on these gas holders, too.$",
]

[msg.section_0.entries.20]
text = [
  "Oh! You overheard some\\n",
  "of my breathtaking knowledge.\\c\\n",
  "Are you actually...interested\\n",
  "in what I have to say?\\c\\n",
  "That would mean I have\\n",
  "a complex buddy!\\c\\n",
  "That makes me really happy!\\n",
  "Well then, take this with you!$",
]

[msg.section_0.entries.21]
text = [
  "I know a lot about the complex, right?\\c\\n",
  "I was even scouted by the foreman,\\n",
  "but I'm happy just looking at it!$",
]

[msg.section_0.entries.22]
text = [
  "Oh my! Why, you have a\\n",
  "Pokédex, don't you?\\c\\n",
  "I heard that the newest Pokédex\\n",
  "has an amazing function called\\l\\n",
  "the Habitat List!\\c\\n",
  "Could you use it to show me what kind\\n",
  "of Pokémon live in this complex?\\c$",
]

[msg.section_0.entries.23]
text = [
  "Oh? You don't have the\\n",
  "Habitat List for the complex\\l\\n",
  "filled up yet...$",
]

[msg.section_0.entries.24]
text = [
  "Amazing!\\n",
  "The Habitat List is filled up!\\c\\n",
  "So amazing! There are so many\\n",
  "Pokémon living in this complex!\\c\\n",
  "Here, take these as thanks!\\c$",
]

[msg.section_0.entries.25]
text = [
  "If you fill up the Habitat Lists, you might\\n",
  "complete the Pokédex before you know it!$",
]

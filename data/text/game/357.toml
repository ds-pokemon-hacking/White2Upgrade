[msg.section_0.entries.0]
text = [
  "Zinzolin: You're an impressive\\n",
  "Trainer to have made it this far.\\c$",
]

[msg.section_0.entries.1]
text = [
  "Since you went to such trouble\\n",
  "to come here, I'll show you something.\\c\\n",
  "This is...\\c$",
]

[msg.section_0.entries.2]
text = [
  "The legendary Pokémon of ice!\\n",
  "Its name is Kyurem!\\c$",
]

[msg.section_0.entries.3]
text = [
  "The ice missiles we fired\\n",
  "into Opelucid City were\\l\\n",
  "created with Kyurem's power\\l\\n",
  "and Team Plasma's technology!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Well...\\c\\n",
  "You could become a\\n",
  "threat to Team Plasma,\\l\\n",
  "so we will eliminate you here!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Not with me around, you won't!\\c$",
]

[msg.section_0.entries.6]
text = [
  "Thanks for removing the barrier!\\n",
  "That was a big help!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Zinzolin: Hmph!\\n",
  "We'll simply eliminate both of you!\\c$",
]

[msg.section_0.entries.8]
text = [
  "[VAR TRNAME(1)]: I'm not going\\n",
  "to lose to Team Plasma!\\c\\n",
  "By the way, what is this place?\\c$",
]

[msg.section_0.entries.9]
text = [
  "That Pokémon...\\c\\n",
  "It's so icy...\\c\\n",
  "Could that be the source of\\n",
  "the attack on Opelucid City?\\c$",
]

[msg.section_0.entries.10]
text = [
  "Zinzolin: Hmph. You're a smarter\\n",
  "Trainer than I expected.\\c\\n",
  "If you've got that much sense,\\n",
  "why did you do something as\\l\\n",
  "dangerous as sneaking into our base?\\c$",
]

[msg.section_0.entries.11]
text = [
  "[VAR TRNAME(1)]: That should be obvious!\\c\\n",
  "I'll do whatever it takes to get\\n",
  "my sister's Pokémon back!\\c\\n",
  "Are YOU the one who stole a\\n",
  "Purrloin in Aspertia five years ago?\\c$",
]

[msg.section_0.entries.12]
text = [
  "Zinzolin: If it's just a Purrloin,\\n",
  "someone probably stole it\\l\\n",
  "and is using it.\\c\\n",
  "Why can't you understand?\\c\\n",
  "There are other Purrloin.\\n",
  "Why are you so fixated on this one?\\c$",
]

[msg.section_0.entries.13]
text = [
  "[VAR TRNAME(1)]: That's the ONLY Purrloin\\n",
  "in the world that my late grandpa\\l\\n",
  "caught for my little sister!\\c$",
]

[msg.section_0.entries.14]
text = [
  "Zinzolin: An individual's feelings...\\c\\n",
  "To you, that's probably a\\n",
  "matter of great importance.\\c\\n",
  "But from the perspective of other\\n",
  "people, it is a trifling matter indeed.\\c\\n",
  "Compare those feelings against\\n",
  "the majesty of this ship!\\c\\n",
  "This ship itself is a device that\\n",
  "uses the Pokémon Kyurem's power!\\c\\n",
  "With this ship, this time we will\\n",
  "conquer Unova!\\c$",
]

[msg.section_0.entries.15]
text = [
  "It looks like Kyurem\\n",
  "has fully recovered.\\c\\n",
  "We'll put the DNA Splicers\\n",
  "to good use.\\c\\n",
  "I'll let you take care of them,\\n",
  "Shadow Triad!\\c$",
]

[msg.section_0.entries.16]
text = [
  "[VAR TRNAME(1)]: Don't mess with me!\\n",
  "You were the one who lost!\\c$",
]

[msg.section_0.entries.17]
text = [
  "Haaahraa...$",
]

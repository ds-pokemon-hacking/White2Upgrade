[msg.section_0.entries.0]
text = [
  "Hey! This is our secret spot!\\c\\n",
  "You can't come waltzin' in\\n",
  "here like you own the place!\\c$",
]

[msg.section_0.entries.1]
text = [
  "You aren't one of us...\\n",
  "But I don't mind tough Trainers.$",
]

[msg.section_0.entries.2]
text = [
  "If you beat all three of us, maybe\\n",
  "we will let you be in our group.$",
]

[msg.section_0.entries.3]
text = [
  "I recognize toughness when I see it.\\n",
  "So you're one of us now!$",
]

[msg.section_0.entries.4]
text = [
  "This worn-out lot is our paradise!\\c\\n",
  "We're not gonna let some stranger\\n",
  "come in and trash the place!\\c$",
]

[msg.section_0.entries.5]
text = [
  "What's with you anyway?!\\n",
  "Your fighting has a tight rhythm.\\l\\n",
  "I was groovin' with it before I knew it!$",
]

[msg.section_0.entries.6]
text = [
  "We've always stuck together!\\n",
  "I'm not going to trust some outsider!$",
]

[msg.section_0.entries.7]
text = [
  "You're our leader now, and Tina's\\n",
  "the second in command!\\l\\n",
  "All right! Let's dance!$",
]

[msg.section_0.entries.8]
text = [
  "You made my crew cry!\\c\\n",
  "I'm gonna pay you back in spades!\\c$",
]

[msg.section_0.entries.9]
text = [
  "People like you deserve a Medal...\\c\\n",
  "OK. I've decided.\\n",
  "You're the new boss of this area!$",
]

[msg.section_0.entries.10]
text = [
  "New buildings create old places.\\c\\n",
  "Got it?\\n",
  "Even Castelia City has an underbelly.$",
]

[msg.section_0.entries.11]
text = [
  "If you want to battle me, you'll\\n",
  "have to defeat Jean-Paul first!$",
]

[msg.section_0.entries.0]
text = [
  "Professor Juniper: Well, I suppose\\n",
  "I should tell you why\\l\\n",
  "I brought you out here.\\c$",
]

[msg.section_0.entries.1]
text = [
  "Cheren told me that a group of people\\n",
  "calling themselves Team Plasma\\l\\n",
  "are planning to use legendary Pokémon\\l\\n",
  "to take over the Unova region.\\c$",
]

[msg.section_0.entries.2]
text = [
  "As you may know, in the Unova region,\\n",
  "there are two legendary\\l\\n",
  "Dragon-type Pokémon:\\l\\n",
  "Zekrom and Reshiram...\\c$",
]

[msg.section_0.entries.3]
text = [
  "As you may know, in the Unova region,\\n",
  "there are two legendary\\l\\n",
  "Dragon-type Pokémon:\\l\\n",
  "Reshiram and Zekrom...\\c$",
]

[msg.section_0.entries.4]
text = [
  "But two years ago, Zekrom and Reshiram\\n",
  "each recognized a Trainer as a hero.\\l\\n",
  "They are following those Trainers.\\c\\n",
  "So Team Plasma shouldn't be able\\n",
  "to use the Dragon-type Pokémon...\\c$",
]

[msg.section_0.entries.5]
text = [
  "But two years ago, Reshiram and Zekrom\\n",
  "each recognized a Trainer as a hero.\\l\\n",
  "They are following those Trainers.\\c\\n",
  "So Team Plasma shouldn't be able\\n",
  "to use the Dragon-type Pokémon...\\c$",
]

[msg.section_0.entries.6]
text = [
  "Bianca: That's true...\\n",
  "What could they be planning?\\c$",
]

[msg.section_0.entries.7]
text = [
  "Professor Juniper: There is much we\\n",
  "don't know about Zekrom and Reshiram...\\c\\n",
  "That's why I want to hear what\\n",
  "Opelucid City's Gym Leader, Drayden,\\l\\n",
  "has to say about this.\\c\\n",
  "He's a Dragon-type Gym Leader,\\n",
  "so he might know something.\\c\\n",
  "So, we're finally to the reason\\n",
  "why I brought you here.\\c\\n",
  "I want you to go to Opelucid City\\n",
  "and hear what Drayden has to say.\\c\\n",
  "And, I would also like you\\n",
  "to help me if something happens!$",
]

[msg.section_0.entries.8]
text = [
  "Professor Juniper: There is much we\\n",
  "don't know about Reshiram and Zekrom...\\c\\n",
  "That's why I want to hear what\\n",
  "Opelucid City's Gym Leader, Drayden,\\l\\n",
  "has to say about this.\\c\\n",
  "He's a Dragon-type Gym Leader,\\n",
  "so he might know something.\\c\\n",
  "So, we're finally to the reason\\n",
  "why I brought you here.\\c\\n",
  "I want you to go to Opelucid City\\n",
  "and hear what Drayden has to say.\\c\\n",
  "And, I would also like you\\n",
  "to help me if something happens!$",
]

[msg.section_0.entries.9]
text = [
  "Thank you!\\c\\n",
  "It's really best not to get\\n",
  "involved with Team Plasma\\l\\n",
  "to start with.\\c\\n",
  "But still...\\c$",
]

[msg.section_0.entries.10]
text = [
  "Yes.\\n",
  "That is the more reasonable response.\\c\\n",
  "It's best not to get involved\\n",
  "with Team Plasma.\\c\\n",
  "But...\\c$",
]

[msg.section_0.entries.11]
text = [
  "Hearing what Drayden has to say\\n",
  "about the Dragon-type Pokémon\\l\\n",
  "will be really interesting.\\c\\n",
  "And more importantly, it will help\\n",
  "fill up the pages of your Pokédex!\\c$",
]

[msg.section_0.entries.12]
text = [
  "Bianca: I'll be in the volcano\\n",
  "just beyond here...\\c\\n",
  "I'm going to investigate the rumors\\n",
  "I've been hearing about a rare\\l\\n",
  "Fire-type Pokémon in Reversal Mountain.\\c$",
]

[msg.section_0.entries.13]
text = [
  "Drayden is a Gym Leader,\\n",
  "so unless you defeat him in a Pokémon\\l\\n",
  "battle, he probably won't talk to you.$",
]

[msg.section_0.entries.14]
text = [
  "If the season changes,\\n",
  "the scenery from the plane changes.\\c\\n",
  "If the climate changes,\\n",
  "the local architecture changes!$",
]

[msg.section_0.entries.15]
text = [
  "Why am I on a journey?\\c\\n",
  "Do you remember exactly\\n",
  "why you're traveling?$",
]

[msg.section_0.entries.16]
text = [
  "I'm fine even right by a volcano\\n",
  "thanks to my li'l Krokorok!\\l\\n",
  "It really rocks!$",
]

[msg.section_0.entries.17]
text = [
  "Rah feh feh!$",
]

[msg.section_0.entries.18]
text = [
  "Deliver a lot of cargo quickly!\\n",
  "This is Lentimas Cargo Service.\\c\\n",
  "Would you like to board the plane\\n",
  "and fly back to Mistralton City?$",
]

[msg.section_0.entries.19]
text = [
  "OK! Please board the plane and wait!\\c$",
]

[msg.section_0.entries.20]
text = [
  "OK!\\n",
  "Feel free to ride anytime!$",
]

[msg.section_0.entries.21]
text = [
  "Lentimas Town\\n",
  "Where Rough Mountain Trails Lead$",
]

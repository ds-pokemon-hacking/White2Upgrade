  "or get it out of Team Plasma,\\l\\n",
  "to deactivate the barriers.\\c\\n",
  "[VAR TRNAME(0)]!\\n",
  "Let's split up and find that password!\\c$",
]

[msg.section_0.entries.8]
text = [
  "There is a device...\\c\\n",
  "It seems that a card key is necessary\\n",

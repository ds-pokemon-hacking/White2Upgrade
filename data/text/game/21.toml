[msg.section_0.entries.0]
text = [
  "'Scuse me! Got a minute?\\c\\n",
  "You look like you know\\n",
  "a lot about Pokémon.\\c\\n",
  "Could you use your knowledge\\n",
  "to help me out?$",
]

[msg.section_0.entries.1]
text = [
  "Hey, thanks!\\n",
  "Here's what I'm wondering about.\\c\\n",
  "Usually, Ground-type moves can't hit\\n",
  "a Pokémon with the Levitate Ability.\\c\\n",
  "But I'm sure there's some way to do it.\\n",
  "I just can't for the life of me\\l\\n",
  "figure out how...\\c\\n",
  "I have several ideas, but\\n",
  "I can't decide which one to try.\\c\\n",
  "That's why I want to get\\n",
  "your opinion on the matter!$",
]

[msg.section_0.entries.2]
text = [
  "Oh... Well, can't be helped.\\c\\n",
  "If you change your mind,\\n",
  "I'd still like to pick your brain...$",
]

[msg.section_0.entries.3]
text = [
  "First, I'd like some advice about items.\\c\\n",
  "I want to use Trick or Switcheroo\\n",
  "to give an item to a Pokémon that\\l\\n",
  "has the Levitate Ability so I can\\l\\n",
  "hit it with Ground-type moves!\\c\\n",
  "After considering which item to give,\\n",
  "I thought the Iron Ball might work.\\l\\n",
  "I'm not sure, though...\\c\\n",
  "What do you think?\\n",
  "Is the Iron Ball a good idea?$",
]

[msg.section_0.entries.4]
text = [
  "Yes$",
]

[msg.section_0.entries.5]
text = [
  "Sure$",
]

[msg.section_0.entries.6]
text = [
  "Sounds Good$",
]

[msg.section_0.entries.7]
text = [
  "Oh! I knew it!\\c\\n",
  "Hearing you say it makes\\n",
  "me feel much more confident!\\c\\n",
  "Passing the Iron Ball to a\\n",
  "Pokémon with Levitate\\l\\n",
  "means Ground-type moves can hit it!\\c\\n",
  "Thanks!$",
]

[msg.section_0.entries.8]
text = [
  "I'd like to pick your brain again.\\n",
  "Is that OK?$",
]

[msg.section_0.entries.9]
text = [
  "I'd like to get your advice on moves.\\c\\n",
  "If I use a certain move on a Pokémon\\n",
  "with the Levitate Ability, and then\\l\\n",
  "use a Ground-type move on it,\\l\\n",
  "I think that could work.\\c\\n",
  "Which move should I choose:\\n",
  "Smack Down, Gravity, or Gastro Acid?$",
]

[msg.section_0.entries.10]
text = [
  "Smack Down$",
]

[msg.section_0.entries.11]
text = [
  "Gravity$",
]

[msg.section_0.entries.12]
text = [
  "Gastro Acid$",
]

[msg.section_0.entries.13]
text = [
  "I see! Smack Down!\\c\\n",
  "That move will knock a Flying-type\\n",
  "Pokémon or a Pokémon with Levitate\\l\\n",
  "out of the air, so Ground-type moves\\l\\n",
  "will work on it!\\c\\n",
  "So if I use Smack Down and then use\\n",
  "a Ground-type move...\\c\\n",
  "I get it now!\\n",
  "Thanks!$",
]

[msg.section_0.entries.14]
text = [
  "I see! Gravity!\\c\\n",
  "The move Gravity makes gravity stronger,\\n",
  "so Ground-type moves will work on\\l\\n",
  "Pokémon with the Levitate Ability or\\l\\n",
  "Flying-type Pokémon.\\c\\n",
  "So if I use Gravity and then use\\n",
  "a Ground-type move...\\c\\n",
  "I get it now!\\n",
  "Thanks!$",
]

[msg.section_0.entries.15]
text = [
  "I see! Gastro Acid!\\c\\n",
  "That's right--Gastro Acid eliminates the\\n",
  "effects of Abilities.\\c\\n",
  "That means Levitate won't work anymore!\\c\\n",
  "So if I use Gastro Acid and then use\\n",
  "a Ground-type move...\\c\\n",
  "I get it now!\\n",
  "Thanks!$",
]

[msg.section_0.entries.16]
text = [
  "Finally, I'd like a little advice\\n",
  "about Abilities.\\c\\n",
  "Apparently, some Abilities will let you\\n",
  "hit Pokémon that have Levitate\\l\\n",
  "with Ground-type moves!\\c\\n",
  "But...\\n",
  "I'm not sure which one to use!\\c\\n",
  "Mold Breaker, Teravolt, and Turboblaze\\n",
  "all seem like good choices...\\c\\n",
  "I'm close, but I can't decide.\\c\\n",
  "Hey! Please decide for me!$",
]

[msg.section_0.entries.17]
text = [
  "Mold Breaker$",
]

[msg.section_0.entries.18]
text = [
  "Teravolt$",
]

[msg.section_0.entries.19]
text = [
  "Turboblaze$",
]

[msg.section_0.entries.20]
text = [
  "So it's Mold Breaker, then?\\c\\n",
  "I guess that's right.\\n",
  "Mold Breaker lets you use moves\\l\\n",
  "regardless of the target's Ability!\\c\\n",
  "Levitate won't matter, so you can land\\n",
  "hit after hit with Ground-type moves!\\c\\n",
  "Mold Breaker's so cool!\\n",
  "Viva Mold Breaker!$",
]

[msg.section_0.entries.21]
text = [
  "So it's Teravolt, then?!\\c\\n",
  "I guess that's right.\\n",
  "Teravolt lets you use moves\\l\\n",
  "regardless of the target's Ability!\\c\\n",
  "Levitate won't matter, so you can land\\n",
  "hit after hit with Ground-type moves!\\c\\n",
  "Teravolt's so cool!\\n",
  "Viva Teravolt!$",
]

[msg.section_0.entries.22]
text = [
  "So it's Turboblaze, then?!\\c\\n",
  "I guess that's right.\\n",
  "Turboblaze lets you use moves\\l\\n",
  "regardless of the target's Ability!\\c\\n",
  "Levitate won't matter, so you can land\\n",
  "hit after hit with Ground-type moves!\\c\\n",
  "Turboblaze is so cool!\\n",
  "Viva Turboblaze!$",
]

[msg.section_0.entries.23]
text = [
  "Thanks! Because of you,\\n",
  "I'm prepared for Levitate!\\c\\n",
  "And I'm even more prepared\\n",
  "for anti-Levitate tactics!\\c\\n",
  "Heh heh heh...\\c\\n",
  "Now, no matter which Pokémon I face,\\n",
  "victory is assured for my\\l\\n",
  "levitating Pokémon!$",
]

[msg.section_0.entries.24]
text = [
  "Well! Do you dare battle my\\n",
  "invincible Pokémon with Levitate?$",
]

[msg.section_0.entries.25]
text = [
  "Hmm...\\c\\n",
  "I thought I was completely\\n",
  "prepared for anti-Levitate tactics...\\c\\n",
  "In real battles, things never\\n",
  "go as well as you would think.\\c\\n",
  "Or maybe you're just that good!$",
]

[msg.section_0.entries.26]
text = [
  "If you want to battle, come talk\\n",
  "to me again! I'll take you on anytime!$",
]

[msg.section_0.entries.27]
text = [
  "We increased the number of Trainers'\\n",
  "Schools to meet the demands of\\l\\n",
  "Trainers who want to know\\l\\n",
  "more about Pokémon because they\\l\\n",
  "love them!$",
]

[msg.section_0.entries.28]
text = [
  "Pokémon have mysterious powers\\n",
  "called Abilities.\\c\\n",
  "Some work even when the Pokémon\\n",
  "is not in battle.\\c\\n",
  "For example, when a Pokémon with the\\n",
  "Suction Cups or Sticky Hold Ability is at\\l\\n",
  "the front of your party, you're more\\l\\n",
  "likely to get a bite when fishing!$",
]

[msg.section_0.entries.29]
text = [
  "The Wide Lens and Zoom Lens are very\\n",
  "similar. Here's the difference.\\c\\n",
  "The Wide Lens boosts accuracy by 10%!\\c\\n",
  "The Zoom Lens boosts accuracy by 20%,\\n",
  "but only if the holder moves after\\l\\n",
  "the target.\\c\\n",
  "That means the Zoom Lens is best for\\n",
  "slower Pokémon!$",
]

[msg.section_0.entries.30]
text = [
  "Would you like to take a simple quiz?$",
]

[msg.section_0.entries.31]
text = [
  "So here is the question:\\c\\n",
  "Which of the following Berries\\n",
  "cures confusion?$",
]

[msg.section_0.entries.32]
text = [
  "Persim Berry$",
]

[msg.section_0.entries.33]
text = [
  "Aspear Berry$",
]

[msg.section_0.entries.34]
text = [
  "Pecha Berry$",
]

[msg.section_0.entries.35]
text = [
  "Ding ding ding!\\c\\n",
  "Right answer!\\n",
  "Now for the next question.\\c$",
]

[msg.section_0.entries.36]
text = [
  "OK! The move Swagger raises the target's\\n",
  "Attack, but it also causes which\\l\\n",
  "status condition?$",
]

[msg.section_0.entries.37]
text = [
  "Asleep$",
]

[msg.section_0.entries.38]
text = [
  "Flinch$",
]

[msg.section_0.entries.39]
text = [
  "Confused$",
]

[msg.section_0.entries.40]
text = [
  "Ding ding ding! We have a winner!\\n",
  "Fantastic answer!\\c\\n",
  "Here's a prize for you!\\c$",
]

[msg.section_0.entries.41]
text = [
  "Here's a combo you can use in a\\n",
  "Double Battle!\\c\\n",
  "Have one of your Pokémon hold a\\n",
  "Persim Berry.\\c\\n",
  "Then, have the other one use Swagger\\n",
  "on that Pokémon.\\c\\n",
  "Its Attack will go up, and the Berry will\\n",
  "heal the confusion immediately.\\l\\n",
  "Then it can hit the opponent harder!\\c\\n",
  "There are many possible combinations\\n",
  "in Double Battle!$",
]

[msg.section_0.entries.42]
text = [
  "Come talk to me if you want\\n",
  "to take a quiz.$",
]

[msg.section_0.entries.43]
text = [
  "Buzzzzz!\\c\\n",
  "Too bad... That's incorrect.\\n",
  "Please try again sometime!$",
]

[msg.section_0.entries.44]
text = [
  "The blackboard explains Pokémon\\n",
  "status changes in battle.\\c$",
]

[msg.section_0.entries.45]
text = [
  "What do you want to read about?$",
]

[msg.section_0.entries.46]
text = [
  "If poisoned, a Pokémon steadily loses HP\\n",
  "when battling.\\c\\n",
  "The poison lingers after the battle.\\n",
  "To cure it, use an Antidote.\\c$",
]

[msg.section_0.entries.47]
text = [
  "Paralysis reduces the Speed stat\\n",
  "and may prevent movement.\\c\\n",
  "It remains after battle, so use a\\n",
  "Parlyz Heal.\\c$",
]

[msg.section_0.entries.48]
text = [
  "If a Pokémon falls asleep,\\n",
  "it will be unable to attack.\\c\\n",
  "The Pokémon may wake up on its own,\\n",
  "but if a battle ends while it is sleeping,\\l\\n",
  "it will stay asleep.\\c\\n",
  "Wake it up using an Awakening.\\c$",
]

[msg.section_0.entries.49]
text = [
  "A burn reduces the Attack stat and\\n",
  "steadily reduces the victim's HP.\\c\\n",
  "A burn lingers after battle.\\n",
  "Cure a burn using a Burn Heal.\\c$",
]

[msg.section_0.entries.50]
text = [
  "If a Pokémon is frozen, it becomes\\n",
  "completely helpless.\\c\\n",
  "The Pokémon may thaw out on its own,\\n",
  "but if a battle ends while it is frozen,\\l\\n",
  "it will stay frozen.\\c\\n",
  "Thaw it out using an Ice Heal.\\c$",
]

[msg.section_0.entries.51]
text = [
  "Poison$",
]

[msg.section_0.entries.52]
text = [
  "Paralysis$",
]

[msg.section_0.entries.53]
text = [
  "Sleep$",
]

[msg.section_0.entries.54]
text = [
  "Burn$",
]

[msg.section_0.entries.55]
text = [
  "Frozen$",
]

[msg.section_0.entries.56]
text = [
  "Cancel$",
]

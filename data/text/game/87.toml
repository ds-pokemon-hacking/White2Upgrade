[msg.section_0.entries.0]
text = [
  "Hello! How do you do?\\c\\n",
  "I'm the owner of this theater.\\n",
  "Pleasure to meet you!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Ooh! I must say that you seem like\\n",
  "a phenomenal Trainer!\\c\\n",
  "What do we do here? We use Props to make\\n",
  "your Pokémon fashionable and glamorous!\\c\\n",
  "Do you want to join in and play Dress Up?\\n",
  "To get you started, here's a Prop Case!\\c$",
]

[msg.section_0.entries.2]
text = [
  "This Prop Case lets you store Props for\\n",
  "decorating your Pokémon!\\c\\n",
  "First off, you need to pick a Pokémon!\\c$",
]

[msg.section_0.entries.3]
text = [
  "Aw, I'm sorry, but that Pokémon can't\\n",
  "play Dress Up. Please choose a\\l\\n",
  "different Pokémon next time.\\c$",
]

[msg.section_0.entries.4]
text = [
  "Hmm, I guess I get it! You are expressing\\n",
  "your Pokémon's innate charm by choosing\\l\\n",
  "not to decorate it!\\c\\n",
  "Honestly, though, I think using Props\\n",
  "would be better received in this musical.\\c$",
]

[msg.section_0.entries.5]
text = [
  "Now, now. Don't be like that.\\n",
  "Please reconsider and select a Pokémon!\\c$",
]

[msg.section_0.entries.6]
text = [
  "Then... It's time to play Dress Up!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Wow! You have the talent! You did a\\n",
  "fantastic job coordinating everything!\\l\\n",
  "Utterly charming!\\c$",
]

[msg.section_0.entries.8]
text = [
  "If you have a Pokémon that can play\\n",
  "Dress Up, you can participate in the\\l\\n",
  "Pokémon Musical!\\c\\n",
  "Would you please join us?\\n",
  "The receptionist can explain everything.\\c\\n",
  "Let us say a brief farewell!\\n",
  "I eagerly anticipate seeing you on stage!\\c$",
]

[msg.section_0.entries.9]
text = [
  "       $$",
]

[msg.section_0.entries.10]
text = [
  "We really want you to participate in\\n",
  "the musical!\\c\\n",
  "I apologize in advance if any of our\\n",
  "Props don't suit some kinds of Pokémon.\\c\\n",
  "Pokémon are individuals, after all!$",
]

[msg.section_0.entries.11]
text = [
  "Wait! Please, wait!\\c\\n",
  "You participated in a musical\\n",
  "with your friends, right?\\c\\n",
  "I felt like you opened up new possibilities\\n",
  "for musicals!\\c\\n",
  "That's why I feel impelled to give you\\n",
  "this present! Please accept it!\\c$",
]

[msg.section_0.entries.12]
text = [
  "I eagerly anticipate seeing you\\n",
  "on stage again!$",
]

[msg.section_0.entries.13]
text = [
  "Your continued participation makes me\\n",
  "a happy owner!\\c\\n",
  "You're attracting a lot of attention as\\n",
  "an up-and-coming stylist.\\c\\n",
  "Of course, I'm watching you closely,\\n",
  "as well.\\c\\n",
  "Please accept this as a token of\\n",
  "my appreciation.\\c$",
]

[msg.section_0.entries.14]
text = [
  "Ah, I eagerly anticipate seeing you\\n",
  "on stage again!\\c\\n",
  "...Actually, it feels like I've said this\\n",
  "line before.\\c\\n",
  "Well, that's OK. Because I'm the owner!$",
]

[msg.section_0.entries.15]
text = [
  "Seeing your continued participation\\n",
  "makes me a happy owner.\\c\\n",
  "Apparently, some audience members have\\n",
  "been calling you a top stylist as of late!\\c\\n",
  "Best of all... How impressive am I for\\n",
  "recognizing your talent?\\c\\n",
  "Please accept this as a token of\\n",
  "my gratitude!\\c$",
]

[msg.section_0.entries.16]
text = [
  "I hope you continue to enjoy the musical!$",
]

[msg.section_0.entries.17]
text = [
  "Happy birthday!\\n",
  "I've got this festive Prop to give you!\\c\\n",
  "It's a cake from me, the owner!\\c\\n",
  "Of course, this is a Prop, so you should\\n",
  "attach it to your Pokémon and not eat it.\\c\\n",
  "By the way, even if today isn't your\\n",
  "birthday, I won't take it back!\\c\\n",
  "Why?\\n",
  "Because I'm the owner!\\c$",
]

[msg.section_0.entries.18]
text = [
  "I want to make Pokémon more glamorous\\n",
  "than ever before, so I'm researching the\\l\\n",
  "styles others use when playing Dress Up.$",
]

[msg.section_0.entries.19]
text = [
  "Great work! I saw your Pokémon up\\n",
  "there today!\\c\\n",
  "Overall, totally [VAR DRESSUPSHOWFEELING(0)]!\\c\\n",
  "The [VAR DRESSUPSHOWFEELING(1)] Prop\\n",
  "was a great accent.\\c\\n",
  "I noticed that your [VAR DRESSUPSHOWFEELING(2)]\\n",
  "factor was a bit subdued today.\\c\\n",
  "OK! I'm not going to lose!$",
]

[msg.section_0.entries.20]
text = [
  "Gwah!$",
]

[msg.section_0.entries.21]
text = [
  "When you play Dress Up, matching the\\n",
  "show you're performing in is im-por-tant!\\c\\n",
  "If it's a good match, you can win the\\n",
  "hearts of the audience!\\l\\n",
  "You'll be sure to attract attention.\\c\\n",
  "If you're going to get on stage,\\n",
  "it's a waste if you don't stand out!$",
]

[msg.section_0.entries.22]
text = [
  "Pokémon Props each have their own image:\\n",
  "cool, cute, elegant, or quirky.\\c\\n",
  "Before you play Dress Up, take a moment\\n",
  "to think about the image you prefer.$",
]

[msg.section_0.entries.23]
text = [
  "I'm not trying to brag, but we're\\n",
  "rather rich.\\c\\n",
  "When you say rich people, you think\\n",
  "musical. It's a matter of taste, I guess.$",
]

[msg.section_0.entries.24]
text = [
  "It is such a treat when Trainers have\\n",
  "played Dress Up with their Pokémon\\l\\n",
  "with such charming results.$",
]

[msg.section_0.entries.25]
text = [
  "Your Pokémon are wonderful!\\n",
  "I'm always watching them.\\c\\n",
  "I hope you can keep entertaining us with\\n",
  "your performances.$",
]

[msg.section_0.entries.26]
text = [
  "I always make sure to watch the\\n",
  "shows you participate in!\\c\\n",
  "Even from the perspective of a rich\\n",
  "man like me, the Pokémon Musical\\l\\n",
  "is impressive!\\c\\n",
  "It's unparalleled entertainment!$",
]

[msg.section_0.entries.27]
text = [
  "There is a Musical Photo saved from\\n",
  "last time!\\c$",
]

[msg.section_0.entries.28]
text = [
  "You can hang Musical Photos from your\\n",
  "previous shows here.$",
]

[msg.section_0.entries.29]
text = [
  "Know what? When there are cute Pokémon,\\n",
  "my eyes are glued to the stage!$",
]

[msg.section_0.entries.30]
text = [
  "Originally, people performed in this\\n",
  "Musical Theater.\\c\\n",
  "One time, a Pokémon wandered up on\\n",
  "stage and started imitating the actors.\\c\\n",
  "Everybody thought it was sensational!\\n",
  "Ta-daaa! The Pokémon Musical was born.$",
]

[msg.section_0.entries.31]
text = [
  "If you are active in the musical, people\\n",
  "will become your fans and give you Props.\\c\\n",
  "I don't have any Props, so I'll give you\\n",
  "this instead!\\c$",
]

[msg.section_0.entries.32]
text = [
  "With the move Echoed Voice, the power is\\n",
  "boosted more and more if it's used\\l\\n",
  "every turn.\\c\\n",
  "Having a group use it might work well!$",
]

[msg.section_0.entries.33]
text = [
  "Persistence is important, so keep\\n",
  "participating in the musical, and keep\\l\\n",
  "using Echoed Voice!\\c\\n",
  "You'll make more fans in the musical, and\\n",
  "you'll do more damage with Echoed Voice!$",
]

[msg.section_0.entries.34]
text = [
  "Musical Theater\\n",
  "Props + Music + Dance = Moving Spectacle!$",
]

[msg.section_0.entries.35]
text = [
  "The seats are beyond this entrance,\\n",
  "but I think you belong on the\\l\\n",
  "spectacular stage!$",
]

[msg.section_0.entries.36]
text = [
  "Hello! How do you do?\\c\\n",
  "I'm the owner of this theater.\\n",
  "Pleasure to meet you!\\c$",
]

[msg.section_0.entries.37]
text = [
  "Ooh! I must say that you seem like\\n",
  "a phenomenal Trainer!\\c\\n",
  "What do we do here? We use Props to make\\n",
  "your Pokémon fashionable and glamorous!\\c\\n",
  "Do you want to join in and play Dress Up?\\n",
  "To get you started, here's a Prop Case!\\c$",
]

[msg.section_0.entries.38]
text = [
  "Hmm... Have we met\\n",
  "before?\\l\\n",
  "Never mind. I must be imagining things.\\c\\n",
  "I'm the owner of this theater.\\n",
  "Pleasure to meet you!\\c$",
]

[msg.section_0.entries.39]
text = [
  "Whoa!\\n",
  "You have no ordinary aura.\\c\\n",
  "It resembles that of a superstar\\n",
  "who attracts a lot of attention.\\c\\n",
  "By the way, do you know\\n",
  "what Dress Up is?\\c$",
]

[msg.section_0.entries.40]
text = [
  "That makes it easy!\\n",
  "Here's a Prop Case for you.\\c$",
]

[msg.section_0.entries.41]
text = [
  "In Dress Up, we use Props to make\\n",
  "your Pokémon fashionable and glamorous!\\c\\n",
  "To get you started, here's a Prop Case!\\c$",
]

[msg.section_0.entries.42]
text = [
  "You know what? I'll give you this\\n",
  "Prop Case!\\c\\n",
  "It contains all the Props our superstar\\n",
  "[VAR TRNAME(0)] used to have.\\c$",
]

[msg.section_0.entries.43]
text = [
  "I hope you'll be the superstar of a\\n",
  "new generation!\\c\\n",
  "It's time to play Dress Up!\\c$",
]

[msg.section_0.entries.44]
text = [
  "Hmm...\\c\\n",
  "Your aura is definitely similar\\n",
  "to that of the superstar who\\l\\n",
  "attracted a lot of attention.\\c\\n",
  "Here is a present for you!\\c\\n",
  "These are the same Props that\\n",
  "[VAR TRNAME(0)] used to have.\\c$",
]

[msg.section_0.entries.45]
text = [
  "I believe you'll find a good use\\n",
  "for these Props!\\c\\n",
  "I hope you'll enjoy the musical!$",
]

[msg.section_0.entries.46]
text = [
  "[VAR TRNAME(0)] received\\n",
  "a set of Props!\\c$",
]

[msg.section_0.entries.47]
text = [
  "[VAR TRNAME(0)] received\\n",
  "a [VAR ITEM2(1)] and a set of Props!\\c$",
]

[msg.section_0.entries.48]
text = [
  "Are you sure?\\c\\n",
  "Please talk to me again if you want a set\\n",
  "of Props that are the same as the\\l\\n",
  "ones [VAR TRNAME(0)] used!$",
]

[msg.section_0.entries.49]
text = [
  "Oh my!\\c\\n",
  "You already have all the Props\\n",
  "the superstar used to have.\\c\\n",
  "I knew you were something!$",
]

[msg.section_0.entries.50]
text = [
  "There used to be a Trainer\\n",
  "who performed wonderful shows.\\l\\n",
  "I was a big fan back then.\\c\\n",
  "I wonder if we'll ever see\\n",
  "another superstar like that...$",
]

[msg.section_0.entries.51]
text = [
  "Oh, you seem a bit like [VAR TRNAME(0)]!\\n",
  "I was a big fan a while ago.\\c\\n",
  "You still lack a certain charisma\\n",
  "compared to [VAR TRNAME(0)], though.$",
]

[msg.section_0.entries.52]
text = [
  "Oh, you are as wonderful an entertainer\\n",
  "as [VAR TRNAME(0)]!\\c\\n",
  "I'm a big fan of you now!\\n",
  "Thank you for a wonderful show!$",
]

[msg.section_0.entries.53]
text = [
  "Oh, you!\\n",
  "You remind me of...\\c$",
]

[msg.section_0.entries.54]
text = [
  "Mmm, that takes me back!$",
]

[msg.section_0.entries.55]
text = [
  "Would you like a set of Props that are\\n",
  "the same as the ones [VAR TRNAME(0)] used?$",
]

[msg.section_0.entries.56]
text = [
  "You can receive this set of Props\\n",
  "only once. Do you want it?$",
]

[msg.section_0.entries.57]
text = [
  "no data$",
]

[msg.section_0.entries.58]
text = [
  "no data$",
]

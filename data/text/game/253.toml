[msg.section_0.entries.0]
text = [
  "Heeey!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Hi there!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Bianca: Did you know this?\\c\\n",
  "If you push the floating stones,\\n",
  "they move!\\c$",
]

[msg.section_0.entries.3]
text = [
  "As always, this place is charged with\\n",
  "lots of electricity that Pokémon like!\\c\\n",
  "The electric charges react from one\\n",
  "stone to another, so that's why\\l\\n",
  "there are floating stones!\\c\\n",
  "You can't push all of them, though.\\c$",
]

[msg.section_0.entries.4]
text = [
  "Oh, that's right!\\n",
  "I came here to research something!\\c\\n",
  "Be seeing you!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Bianca: The bridge fell apart,\\n",
  "but it's being fixed right now!$",
]

[msg.section_0.entries.6]
text = [
  "What could have happened?\\n",
  "Maybe wild Pokémon ran into it.\\c\\n",
  "At any rate, it's going to take some\\n",
  "time to fix. Go wait around Driftveil!$",
]

[msg.section_0.entries.7]
text = [
  "     $$",
]

[msg.section_0.entries.8]
text = [
  "[SPEED(1)]Chargestone Cave--\\n",
  "I really like it here.\\c\\n",
  "Formulas express the\\n",
  "forces behind electricity,\\l\\n",
  "its connection to Pokémon,\\l\\n",
  "and humans and Pokémon themselves.\\c\\n",
  "This--this is my ideal place.[SPEED(0)]\\c$",
]

[msg.section_0.entries.9]
text = [
  "[SPEED(1)]I have to go...\\c\\n",
  "I have to go in order to save\\n",
  "Pokémon and protect the very\\l\\n",
  "friend that I have to stop![SPEED(0)]\\c$",
]

[msg.section_0.entries.10]
text = [
  "What beautiful stones!\\c\\n",
  "Wouldn't it be lovely if I could\\n",
  "have such pretty gems on the\\l\\n",
  "walls of my room?\\c$",
]

[msg.section_0.entries.11]
text = [
  "The Funfest Mission\\n",
  "“[VAR FUNFESTMISSION(0)]\\\"\\l\\n",
  "has been added to the Entralink.$",
]

[msg.section_0.entries.12]
text = [
  "The Funfest Mission\\n",
  "“[VAR FUNFESTMISSION(0)]\\\"\\l\\n",
  "has been added to the Entralink.$",
]

[msg.section_0.entries.13]
text = [
  "I'll live here!\\c\\n",
  "From today on, my home will be here,\\n",
  "among the beautiful stones!$",
]

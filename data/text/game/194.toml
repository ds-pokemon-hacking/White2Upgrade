[msg]
trailing_data = "0202"

[msg.section_0.entries.0]
text = [
  "Somehow, customers don't come\\n",
  "to this place.\\c\\n",
  "Oh! I have an idea!\\n",
  "You're a Trainer, aren't you?\\c\\n",
  "Do your best and become\\n",
  "the Champion!\\c\\n",
  "Then, I can advertise this place\\n",
  "as a room that the Champion visited!$",
]

[msg.section_0.entries.1]
text = [
  "To choose this place for our honeymoon.\\n",
  "That's the man I chose!$",
]

[msg.section_0.entries.2]
text = [
  "You're a wonderful person.\\n",
  "You can do things for others.\\c\\n",
  "If such a person rings the bell,\\n",
  "the sound should reach here...$",
]

[msg.section_0.entries.3]
text = [
  "If the sound of the bell at the\\n",
  "Celestial Tower on Route 7 reaches\\l\\n",
  "this room, we can be happy!\\c\\n",
  "I heard such a rumor.\\n",
  "Can I ask you a favor?\\l\\n",
  "Will you ring the bell for my wife?$",
]

[msg.section_0.entries.4]
text = [
  "You're so nice!\\c\\n",
  "It would be great if this world\\n",
  "was full of people like you!$",
]

[msg.section_0.entries.5]
text = [
  "Oh, come on. Please ring the bell\\n",
  "to make us happy!$",
]

[msg.section_0.entries.6]
text = [
  "I wonder if the sound of the bell on\\n",
  "Route 7 will reach here.$",
]

[msg.section_0.entries.7]
text = [
  "Oh, you! As for the sound of the bell,\\n",
  "I don't think I've heard it yet...\\c\\n",
  "...\\c\\n",
  "What? Did they say such things\\n",
  "at the Celestial Tower...?\\l\\n",
  "Well, putting that aside...\\c\\n",
  "Here! This is a thank-you gift!$",
]

[msg.section_0.entries.8]
text = [
  "I wish for their happiness...$",
]

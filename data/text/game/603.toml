[msg]
trailing_data = "0606"

[msg.section_0.entries.0]
text = [
  "Pokémon battles begin\\n",
  "when eyes meet!\\l\\n",
  "That's a rule for Trainers!$",
]

[msg.section_0.entries.1]
text = [
  "Come on! A kid without a single\\n",
  "Gym Badge continuing on past here?\\c\\n",
  "Battle with the Trainers and Pokémon\\n",
  "in this area, then battle some more!$",
]

[msg.section_0.entries.2]
text = [
  "Come on! A kid without a single\\n",
  "Gym Badge continuing on past here?\\c\\n",
  "Battle with the Trainers and Pokémon\\n",
  "in this area, then battle some more!\\c$",
]

[msg.section_0.entries.3]
text = [
  "Hey! That gleaming thing there\\n",
  "is the Basic Badge!\\c\\n",
  "But don't get a swelled head!\\n",
  "It's a rough world out there!\\l\\n",
  "Here, I'll show you!\\c$",
]

[msg.section_0.entries.4]
text = [
  "All right... I'm beat!\\c\\n",
  "With dependable Pokémon like that,\\n",
  "even a kid like you can\\l\\n",
  "hold your own against an adult. Yup!$",
]

[msg.section_0.entries.5]
text = [
  "Route 20$",
]

[msg.section_0.entries.6]
text = [
  "[VAR TRNAME(0)]! Wait!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Cheren: Come with me, you two.\\c$",
]

[msg.section_0.entries.8]
text = [
  "See the dark tall grass here?\\c\\n",
  "It's rare, but sometimes two\\n",
  "Pokémon pop out at the same time.\\c\\n",
  "Also, the Pokémon that hide in\\n",
  "dark grass are slightly stronger.\\c\\n",
  "So be careful if you walk through.\\c$",
]

[msg.section_0.entries.9]
text = [
  "If you're going to challenge the\\n",
  "next Gym, it's the Virbank Gym.\\l\\n",
  "These might help!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Here are some for you, [VAR TRNAME(1)]!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Both of you, do your best!\\c\\n",
  "If you need anything,\\n",
  "call me on the Xtransceiver.\\c$",
]

[msg.section_0.entries.12]
text = [
  "[VAR TRNAME(1)]: Cheren sure knows a lot.\\c\\n",
  "And he fought those\\n",
  "Team Plasma thugs, too...\\c$",
]

[msg.section_0.entries.13]
text = [
  "I've decided!\\n",
  "I'm going to get stronger than him!\\c\\n",
  "You should...\\c\\n",
  "Do your best! Fill up the Pokédex\\n",
  "and have my back. Got it?\\c$",
]

[msg.section_0.entries.14]
text = [
  "I have to get stronger\\n",
  "than Team Plasma!$",
]

[msg.section_0.entries.15]
text = [
  "Yeesh! I really hate it when\\n",
  "people won't let things go!\\c$",
]

[msg.section_0.entries.16]
text = [
  "Now that I think about it...\\c\\n",
  "If I run this way, no one can help me!\\n",
  "I have to head toward the ocean!\\c\\n",
  "So, with that in mind...\\c\\n",
  "I'm going to flee again!\\n",
  "Good-bye, Virbank City!\\c$",
]

[msg.section_0.entries.17]
text = [
  "[VAR TRNAME(1)]: Well, they're\\n",
  "really good at running, anyway...\\c\\n",
  "Still, she just said something useful!\\c\\n",
  "They must be moving around by boat!\\c\\n",
  "Castelia City has a big port...\\n",
  "I wonder if they headed there.\\c\\n",
  "OK! Let’s go back to Virbank\\n",
  "and look for someone who looks like\\l\\n",
  "they know a lot about ships.\\c\\n",
  "If I remember right, there was a place\\n",
  "to board boats on the docks.\\c$",
]

[msg.section_0.entries.18]
text = [
  "[VAR TRNAME(1)]: Help me check Route 20!$",
]

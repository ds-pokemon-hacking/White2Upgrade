[msg.section_0.entries.0]
text = [
  "N: [SPEED(1)]You came...[SPEED(0)]\\c$",
]

[msg.section_0.entries.1]
text = [
  "[SPEED(1)]The Pokémon League is\\n",
  "just past Victory Road.[SPEED(0)]\\c$",
]

[msg.section_0.entries.2]
text = [
  "[SPEED(1)]Pokémon battles do nothing\\n",
  "more than hurt Pokémon...\\c\\n",
  "That's how I understood it,\\n",
  "and that's why I hated battles.\\c\\n",
  "But it's not that simple.[SPEED(0)]\\c$",
]

[msg.section_0.entries.3]
text = [
  "[SPEED(1)]Pokémon battles decide\\n",
  "winners and losers, it's true.\\c\\n",
  "Yet they do so much more.\\c\\n",
  "Your Pokémon! You!\\n",
  "Your opponents! And their Pokémon!\\c\\n",
  "Everyone can see what wonderful\\n",
  "things the others have to contribute!\\c\\n",
  "That's right! Accepting different ideas--\\n",
  "different beings--changes the world\\l\\n",
  "like a chemical reaction!\\c\\n",
  "Pokémon battles are like a catalyst:\\n",
  "a small component that leads to\\l\\n",
  "big changes![SPEED(0)]\\c$",
]

[msg.section_0.entries.4]
text = [
  "[SPEED(1)]My friend Zekrom taught me that...\\c\\n",
  "And it's the formula I've derived\\n",
  "from traveling the world.\\c\\n",
  "I want you to think for\\n",
  "yourself about what it means.[SPEED(0)]\\c$",
]

[msg.section_0.entries.5]
text = [
  "[SPEED(1)]My friend Reshiram taught me that...\\c\\n",
  "And it's the formula I've\\n",
  "derived from traveling the world.\\c\\n",
  "I want you to think for\\n",
  "yourself about what it means.[SPEED(0)]\\c$",
]

[msg.section_0.entries.6]
text = [
  "[SPEED(1)]What's this?\\n",
  "Why, you're the...\\c\\n",
  "You're the [VAR PKNAME(0)] that helped me\\n",
  "that time, aren't you?\\l\\n",
  "Hey, thanks!\\c$",
]

[msg.section_0.entries.7]
text = [
  "[SPEED(1)]Here!\\n",
  "Take this with you!\\c\\n",
  "The new Victory Road has areas that\\n",
  "are only accessible with Waterfall.[SPEED(0)]\\c$",
]

[msg.section_0.entries.8]
text = [
  "[SPEED(1)]Yes!\\n",
  "If it's your Pokémon and you...\\c\\n",
  "You will get past the Pokémon League\\n",
  "and recognize your own ideals!\\c\\n",
  "That's what I see in store for you!\\c$",
]

[msg.section_0.entries.9]
text = [
  "[SPEED(1)]Yes!\\n",
  "If it's your Pokémon and you...\\c\\n",
  "You will get past the Pokémon League\\n",
  "and recognize your own truth!\\c\\n",
  "That's what I see in store for you!\\c$",
]


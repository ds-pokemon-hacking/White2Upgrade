[msg.section_0.entries.0]
text = [
  "[SPEED(1)]That's the place![SPEED(0)]\\c$",
]

[msg.section_0.entries.1]
text = [
  "[SPEED(1)]It was two years ago.\\c\\n",
  "For the sake of Pokémon...\\c\\n",
  "For my ideal world...\\c\\n",
  "I put my beliefs on the line\\n",
  "and battled a certain Trainer![SPEED(0)]\\c$",
]

[msg.section_0.entries.2]
text = [
  "[SPEED(1)]It was two years ago.\\c\\n",
  "For the sake of Pokémon...\\c\\n",
  "For my world of truth...\\c\\n",
  "I put my beliefs on the line\\n",
  "and battled a certain Trainer![SPEED(0)]\\c$",
]

[msg.section_0.entries.3]
text = [
  "[SPEED(1)]And I lost...\\c\\n",
  "But at the same time,\\n",
  "I learned something important.\\c\\n",
  "To make the world better,\\n",
  "you must accept different ideas!\\c\\n",
  "I learned that this is the formula\\n",
  "for changing the world.[SPEED(0)]\\c$",
]

[msg.section_0.entries.4]
text = [
  "[SPEED(1)]Accepting different ideas...\\c\\n",
  "I want to see if you're a Trainer whose\\n",
  "heart is strong enough to do that.[SPEED(0)]\\c$",
]

[msg.section_0.entries.5]
text = [
  "[SPEED(1)]Zekrom, come![SPEED(0)]\\c$",
]

[msg.section_0.entries.6]
text = [
  "[SPEED(1)]Reshiram, come![SPEED(0)]\\c$",
]

[msg.section_0.entries.7]
text = [
  "Shaaaaaak!$",
]

[msg.section_0.entries.8]
text = [
  "Baaaaaaaahn!$",
]

[msg.section_0.entries.9]
text = [
  "[SPEED(1)]Zekrom also wants to know\\n",
  "what ideals you seek\\l\\n",
  "and how good a Trainer you are.[SPEED(0)]\\c$",
]

[msg.section_0.entries.10]
text = [
  "[SPEED(1)]Reshiram also wants to know\\n",
  "which truths you seek\\l\\n",
  "and how good a Trainer you are.[SPEED(0)]\\c$",
]

[msg.section_0.entries.11]
text = [
  "[SPEED(1)]Battle with me.\\n",
  "Are you prepared?[SPEED(0)]$",
]

[msg.section_0.entries.12]
text = [
  "[SPEED(1)]Show me the depth\\n",
  "of your determination![SPEED(0)]\\c$",
]

[msg.section_0.entries.13]
text = [
  "Bazzazzazzash!$",
]

[msg.section_0.entries.14]
text = [
  "Preeeeaah!$",
]

[msg.section_0.entries.15]
text = [
  "[SPEED(1)]I'm ready whenever you are!\\n",
  "I'll wait as long as it takes![SPEED(0)]$",
]

[msg.section_0.entries.16]
text = [
  "[SPEED(1)]Zekrom and I were defeated.\\c\\n",
  "Your feelings,\\n",
  "your desire to know the truth--\\l\\n",
  "that's what surpassed us.[SPEED(0)]\\c$",
]

[msg.section_0.entries.17]
text = [
  "[SPEED(1)]Reshiram and I were defeated.\\c\\n",
  "Your feelings,\\n",
  "your desire to pursue ideals--\\l\\n",
  "that's what surpassed us.[SPEED(0)]\\c$",
]

[msg.section_0.entries.18]
text = [
  "[SPEED(1)]Battling with you reminded\\n",
  "me of two years ago...\\c\\n",
  "It may just be a little,\\n",
  "but I know you better...\\l\\n",
  "That's how I feel.[SPEED(0)]\\c$",
]

[msg.section_0.entries.19]
text = [
  "[SPEED(1)]And Zekrom...\\n",
  "Thank you for everything.\\c\\n",
  "My journey with you\\n",
  "has been truly wonderful!\\c\\n",
  "From now on, I want you to use\\n",
  "your power to help this Trainer\\l\\n",
  "realize his dreams.[SPEED(0)]\\c$",
]

[msg.section_0.entries.20]
text = [
  "[SPEED(1)]And Zekrom...\\n",
  "Thank you for everything.\\c\\n",
  "My journey with you\\n",
  "has been truly wonderful!\\c\\n",
  "From now on, I want you to use\\n",
  "your power to help this Trainer\\l\\n",
  "realize her dreams.[SPEED(0)]\\c$",
]

[msg.section_0.entries.21]
text = [
  "[SPEED(1)]And Reshiram...\\n",
  "Thank you for everything.\\c\\n",
  "My journey with you\\n",
  "has been truly wonderful!\\c\\n",
  "From now on, I want you to use\\n",
  "your power to help this Trainer\\l\\n",
  "realize his dreams.[SPEED(0)]\\c$",
]

[msg.section_0.entries.22]
text = [
  "[SPEED(1)]And Reshiram...\\n",
  "Thank you for everything you've done.\\c\\n",
  "My journey with you\\n",
  "has been truly wonderful!\\c\\n",
  "From now on, I want you to use\\n",
  "your power to help this Trainer\\l\\n",
  "realize her dreams.[SPEED(0)]\\c$",
]

[msg.section_0.entries.23]
text = [
  "Bazz...$",
]

[msg.section_0.entries.24]
text = [
  "Pree...$",
]

[msg.section_0.entries.25]
text = [
  "[SPEED(1)]I know. I'll miss you, too...\\c\\n",
  "But your task is to help\\n",
  "humans who seek ideals.\\c\\n",
  "I've learned so much from you.\\c\\n",
  "I'll do my best to tell everyone\\n",
  "else what I learned on my own.\\c\\n",
  "I'll be OK!\\n",
  "I can talk to Pokémon!\\c\\n",
  "I'll become the bridge\\n",
  "between Pokémon and humans!\\l\\n",
  "That's my ideal![SPEED(0)]\\c$",
]

[msg.section_0.entries.26]
text = [
  "[SPEED(1)]I know. I'll miss you, too...\\c\\n",
  "But your task is to help\\n",
  "humans who seek the truth.\\c\\n",
  "I've learned so much from you.\\c\\n",
  "I'll do my best to tell everyone\\n",
  "else what I learned on my own.\\c\\n",
  "I'll be OK!\\n",
  "I can talk to Pokémon!\\c\\n",
  "I'll become the bridge\\n",
  "between Pokémon and humans!\\l\\n",
  "That's my truth![SPEED(0)]\\c$",
]

[msg.section_0.entries.27]
text = [
  "[SPEED(1)]So...\\c\\n",
  "Rest well...[SPEED(0)]\\c$",
]

[msg.section_0.entries.28]
text = [
  "[SPEED(1)][VAR TRNAME(0)]!\\c\\n",
  "I'll entrust you\\n",
  "with this Dark Stone![SPEED(0)]\\c$",
]

[msg.section_0.entries.29]
text = [
  "[SPEED(1)][VAR TRNAME(0)]!\\c\\n",
  "I'll entrust you\\n",
  "with this Light Stone![SPEED(0)]\\c$",
]

[msg.section_0.entries.30]
text = [
  "[SPEED(1)]Take that Dark Stone\\n",
  "to Dragonspiral Tower![SPEED(0)]\\c$",
]

[msg.section_0.entries.31]
text = [
  "[SPEED(1)]Take that Light Stone\\n",
  "to Dragonspiral Tower![SPEED(0)]\\c$",
]

[msg.section_0.entries.32]
text = [
  "[SPEED(1)]Go to Dragonspiral Tower.\\c\\n",
  "I will...\\c\\n",
  "I'll search for that Trainer\\n",
  "I battled two years ago.\\c\\n",
  "And...\\c\\n",
  "I plan to say thank you.[SPEED(0)]$",
]

[msg.section_0.entries.33]
text = [
  "N: [SPEED(1)]How surprising...\\n",
  "I didn't expect you'd come here.\\c\\n",
  "Well, that is the formula for\\n",
  "understanding other Trainers,\\l\\n",
  "after all...\\l\\n",
  "You're OK with a Pokémon battle, right?[SPEED(0)]$",
]

[msg.section_0.entries.34]
text = [
  "[SPEED(1)]Good...[SPEED(0)]\\c$",
]

[msg.section_0.entries.35]
text = [
  "[SPEED(1)]I remember something Zekrom\\n",
  "told me once...\\c\\n",
  "Zekrom and Reshiram\\n",
  "are searching for new possibilities\\l\\n",
  "by walking alongside humans...\\c\\n",
  "Meanwhile, those that live in the wild\\n",
  "try to better themselves\\l\\n",
  "without relying on anyone else.\\c\\n",
  "There are many different Pokémon...\\c\\n",
  "And their different ways of living...\\n",
  "That is the true freedom of Pokémon.\\l\\n",
  "That is what connects Pokémon to us.[SPEED(0)]\\c$",
]

[msg.section_0.entries.36]
text = [
  "[SPEED(1)]I remember something Reshiram\\n",
  "told me once...\\c\\n",
  "Reshiram and Zekrom\\n",
  "are searching for new possibilities\\l\\n",
  "by walking alongside humans...\\c\\n",
  "Meanwhile, those that live in the wild\\n",
  "try to better themselves\\l\\n",
  "without relying on anyone else.\\c\\n",
  "There are many different Pokémon...\\c\\n",
  "And their different ways of living...\\n",
  "That is the true freedom of Pokémon.\\l\\n",
  "That is what connects Pokémon to us.[SPEED(0)]\\c$",
]

[msg.section_0.entries.37]
text = [
  "[SPEED(1)]I will set off on another journey.\\c\\n",
  "There are still many Pokémon\\n",
  "in the world I should talk to.\\c\\n",
  "And there is also a Trainer\\n",
  "I want to tell how I feel...[SPEED(0)]\\c$",
]

[msg.section_0.entries.38]
text = [
  "[SPEED(1)]Very well...\\n",
  "You're free to choose that, too.[SPEED(0)]$",
]

[msg.section_0.entries.39]
text = [
  "[SPEED(1)]Your Pokémon are saying they\\n",
  "want to battle with my friend...\\c\\n",
  "What would you like to do?\\n",
  "Will you have a Pokémon battle with me?[SPEED(0)]$",
]

[msg]
trailing_data = "9696"

[msg.section_0.entries.0]
text = [
  "Welcome!\\n",
  "Welcome to my party!\\c\\n",
  "Please enjoy conversations\\n",
  "with everyone!$",
]

[msg.section_0.entries.1]
text = [
  "Ich habe mir nun ein Auto zugelegt!\\c\\n",
  "Damit ist die nächste Stadt auch\\n",
  "ganz ohne Orden zum Greifen nah!\\c\\n",
  "Es sei denn, ich rassele durch\\n",
  "meine Führerscheinprüfung...\\c\\n",
  "Um...\\n",
  "I just bought a car!\\c\\n",
  "Now, even without the Gym Badge, it's\\n",
  "a quick trip to the next city!\\c\\n",
  "Well, it will be after I get my license...$",
]

[msg.section_0.entries.2]
text = [
  "Hello. Have you tried a Casteliacone yet?$",
]

[msg.section_0.entries.3]
text = [
  "Hey, Trainer!\\n",
  "Check out my moves!\\c\\n",
  "Have you gone to the next city yet?\\n",
  "I learned this move at the\\l\\n",
  "Musical Theater over there.\\l\\n",
  "Pretty cool, isn't it?$",
]

[msg.section_0.entries.4]
text = [
  "Ohhhh! Your Pokémon are so charming!\\c\\n",
  "I want cute Pokémon, too, so I can\\n",
  "use this!\\c$",
]

[msg.section_0.entries.5]
text = [
  "This move makes your Pokémon\\n",
  "unbearably charming!\\c\\n",
  "All Pokémon of the opposite gender\\n",
  "will fall in love!$",
]

[msg.section_0.entries.6]
text = [
  "Did you see the outfit that the\\n",
  "supermodel, Elesa, was wearing?\\c$",
]

[msg.section_0.entries.7]
text = [
  "Whatever Elesa wears is beautiful.\\n",
  "A stunning ensemble!$",
]

[msg.section_0.entries.8]
text = [
  "My boyfriend isn't good at getting out of\\n",
  "bed in the morning...\\c\\n",
  "In fact, he's so slow getting out of bed\\n",
  "that I asked his Pokémon to use\\l\\n",
  "Wake-Up Slap on him!$",
]

[msg.section_0.entries.9]
text = [
  "Ciao!\\n",
  "Ti stai divertendo?\\c\\n",
  "Non sentirti in imbarazzo.\\n",
  "Parla pure con chi vuoi.\\c\\n",
  "Umm... Hi there.\\n",
  "Having a good time?\\c\\n",
  "You don't have to be shy.\\n",
  "Feel free to talk to anyone.$",
]

[msg.section_0.entries.10]
text = [
  "It's hard to get up the morning after\\n",
  "a fun day like today.$",
]

[msg.section_0.entries.11]
text = [
  "I've asked my Pokémon to use Sing\\n",
  "instead of setting an alarm clock.\\c\\n",
  "But I cannot get up at all.\\n",
  "I don't know why.$",
]

[msg.section_0.entries.12]
text = [
  "¡Es la primera vez que vengo aquí!\\c\\n",
  "¡Pero este precioso paisaje hace\\n",
  "que me sienta como en casa!\\c\\n",
  "¡La próxima vez traeré a mis amigos!\\c\\n",
  "Oh, excuse me.\\n",
  "Do you understand me now?\\c\\n",
  "This is the first time I've come here,\\n",
  "and the scenery and the homey\\l\\n",
  "environment are wonderful!\\c\\n",
  "Next time, I'll bring my friends!$",
]

[msg.section_0.entries.0]
text = [
  "Oh! You are the Pokémon Trainer\\n",
  "I met at the entrance!\\c\\n",
  "You've come this far. That means\\n",
  "you must be quite strong.\\c\\n",
  "Are you prepared to face the strongest\\n",
  "person in this building?\\c\\n",
  "Then, the time has come to challenge\\n",
  "my grandson, the company president!\\c$",
]

[msg.section_0.entries.1]
text = [
  "I'll show you just how much\\n",
  "this Battle Company has researched\\l\\n",
  "Pokémon and Trainers!\\c$",
]

[msg.section_0.entries.2]
text = [
  "I lost...\\c\\n",
  "Because you were strong,\\n",
  "and I was weak.\\c\\n",
  "We must do even more research\\n",
  "for Pokémon and for Trainers!$",
]

[msg.section_0.entries.3]
text = [
  "Thinking that when you win\\n",
  "it's because of your Pokémon\\l\\n",
  "and that when you lose\\l\\n",
  "it's because of yourself\\l\\n",
  "might make you stronger...\\c\\n",
  "But enjoying yourself\\n",
  "is much, much more important!$",
]

[msg.section_0.entries.4]
text = [
  "If you want to make a weak\\n",
  "Pokémon stronger, you should\\l\\n",
  "use that Exp. Share.\\c\\n",
  "Any Pokémon that holds it receives\\n",
  "Exp. Points, even when it doesn't\\l\\n",
  "participate in battle!$",
]

[msg.section_0.entries.5]
text = [
  "My dream as president is to\\n",
  "release a device that lets\\l\\n",
  "people talk to Pokémon!$",
]

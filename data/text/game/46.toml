[msg.section_0.entries.0]
text = [
  "Welcome to the Royal Unova!\\c\\n",
  "The scenery is exhilarating.\\n",
  "The battles are exciting.\\c\\n",
  "The ticket is \\$1,000.\\n",
  "Would you like to get on board?$",
]

[msg.section_0.entries.1]
text = [
  "The Royal Unova leaves once a day.\\c$",
]

[msg.section_0.entries.2]
text = [
  "The Royal Unova operates only in\\n",
  "the evening.\\l\\n",
  "Please come back again.$",
]

[msg.section_0.entries.3]
text = [
  "I'm sorry, you don't have enough money.\\n",
  "Please come back again.$",
]

[msg.section_0.entries.4]
text = [
  "The ticket is \\$1,000.\\n",
  "Would you like to get on board?$",
]

[msg.section_0.entries.5]
text = [
  "The ship goes under a big bridge called\\n",
  "the Skyarrow Bridge in the Unova region,\\l\\n",
  "then turns around at Marvelous Bridge\\l\\n",
  "and returns to Castelia City.\\c\\n",
  "When the whistle blows five times,\\n",
  "it means we've arrived at the dock.\\c$",
]

[msg.section_0.entries.6]
text = [
  "From the deck of the world-famous Royal\\n",
  "Unova, you can enjoy a spectacular view.\\c\\n",
  "And the passenger cabins are full of\\n",
  "Trainers who love to battle.\\c\\n",
  "Please enjoy both the view and\\n",
  "the battles!\\c\\n",
  "Note that as C-Gears may affect radio\\n",
  "signals or instruments in the ship,\\l\\n",
  "we ask that you refrain from using them.\\l\\n",
  "Thank you.\\c$",
]

[msg.section_0.entries.7]
text = [
  "The power of the C-Gear will be turned\\n",
  "off. Is that OK?$",
]

[msg.section_0.entries.8]
text = [
  "We are leaving the port shortly.\\n",
  "Bon voyage!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Certainly.\\n",
  "Please come back again.$",
]

[msg.section_0.entries.10]
text = [
  "Thank you for sailing with us on the\\n",
  "Royal Unova.\\c\\n",
  "Have a nice day!$",
]

[msg.section_0.entries.11]
text = [
  "We are closed for the day.\\n",
  "Please come again tomorrow.$",
]

[msg.section_0.entries.12]
text = [
  "Congratulations!\\c\\n",
  "You've defeated all the Trainers\\n",
  "on the ship!\\c\\n",
  "Please accept this prize.\\c$",
]

[msg.section_0.entries.13]
text = [
  "Get On Board$",
]

[msg.section_0.entries.14]
text = [
  "About the Ship$",
]

[msg.section_0.entries.15]
text = [
  "Cancel$",
]

[msg]
trailing_data = "0404"

[msg.section_0.entries.0]
text = [
  "???: What's this?\\c$",
]

[msg.section_0.entries.1]
text = [
  "What's your name?\\c\\n",
  "...\\c\\n",
  "OK. I'll remember that!\\n",
  "[VAR TRNAME(0)], nice to meet you.\\c\\n",
  "I'm Cynthia.\\n",
  "I'm a Pokémon Trainer, too, like you.\\c\\n",
  "I have an insatiable curiosity for\\n",
  "researching Pokémon myths.\\c$",
]

[msg.section_0.entries.2]
text = [
  "I'm sure you know about Undella Bay's\\n",
  "Abyssal Ruins, right?\\c\\n",
  "I'm staying here at my friend's villa\\n",
  "so I can investigate them.\\c$",
]

[msg.section_0.entries.3]
text = [
  "In order to get to know each other\\n",
  "better as Pokémon Trainers,\\l\\n",
  "I would like our Pokémon to have a match.\\c\\n",
  "Would you care to be my opponent?$",
]

[msg.section_0.entries.4]
text = [
  "Before I send out my Pokémon,\\n",
  "my heart always begins to race...\\c\\n",
  "Interesting...\\n",
  "My Pokémon in their Poké Balls are\\l\\n",
  "radiating a happy feeling.\\c\\n",
  "Are you the reason?\\n",
  "What are you?\\c$",
]

[msg.section_0.entries.5]
text = [
  "Ha ha. You prefer to take things slowly\\n",
  "and rationally, am I right?\\c\\n",
  "When you're ready, come and talk to me.\\n",
  "I'll be happy to see you.$",
]

[msg.section_0.entries.6]
text = [
  "Cynthia: Oh.\\n",
  "You've had a chance to get ready?\\c\\n",
  "I do want our Pokémon to have a match...\\n",
  "Are you prepared to be my opponent?$",
]

[msg.section_0.entries.7]
text = [
  "Cynthia: That was beyond my expectation!\\n",
  "What an exceptional battle!\\c\\n",
  "I love being here in spring and summer.\\c\\n",
  "I can't stay all year, because there's\\n",
  "so much to investigate in Sinnoh, as well.\\c\\n",
  "You're a great Trainer, and it would make\\n",
  "me happy to see you again sometime.$",
]

[msg.section_0.entries.8]
text = [
  "Cynthia: I come here in spring and summer\\n",
  "because there are a lot of things\\l\\n",
  "to investigate in Sinnoh, as well.\\c\\n",
  "I'd be delighted to see you again.\\n",
  "You're an awesome Pokémon Trainer!$",
]

[msg.section_0.entries.9]
text = [
  "Cynthia: How terrific to see you again!\\c\\n",
  "I've got to tell you...\\n",
  "My Pokémon are excited to battle yours.\\c\\n",
  "Would you care to be my opponent?$",
]

[msg.section_0.entries.10]
text = [
  "Cynthia: This will be such fun!\\n",
  "No holds barred!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Cynthia: Oh, what a pity.\\c\\n",
  "Summers in Undella Town make me feel like\\n",
  "I'm on holiday. I forget about battling!\\c\\n",
  "But in spring, I feel like getting\\n",
  "worked up with a good battle.$",
]

[msg.section_0.entries.12]
text = [
  "Cynthia: I can tell that my Pokémon are\\n",
  "excited about battling your Pokémon...\\c\\n",
  "Would you care to be my opponent?$",
]

[msg.section_0.entries.13]
text = [
  "Cynthia: For me, it has really been\\n",
  "worthwhile to come all the way\\l\\n",
  "to far Unova.\\c\\n",
  "Why? Because...\\n",
  "I met you, and my world got wider!$",
]

[msg.section_0.entries.14]
text = [
  "Cynthia: To live their lives to the\\n",
  "fullest, people and Pokémon need\\l\\n",
  "the chance to throw themselves into\\l\\n",
  "battle against the fiercest opposition.\\c\\n",
  "That's why I want to battle you.\\n",
  "How about it?$",
]

[msg.section_0.entries.15]
text = [
  "Cynthia: As our Pokémon meet in battle,\\n",
  "I'll learn more about you\\l\\n",
  "and how you've taken care of them.\\c$",
]

[msg.section_0.entries.16]
text = [
  "Cynthia: I'm a little disappointed.\\c\\n",
  "I know you can battle on bigger\\n",
  "stages than you've done so far!\\c\\n",
  "It's so plain to me that your light can\\n",
  "shine brighter than this...$",
]

[msg.section_0.entries.17]
text = [
  "Cynthia: Are you prepared?\\c\\n",
  "Let's battle at full strength and see\\n",
  "how bright our lights can shine!$",
]

[msg.section_0.entries.18]
text = [
  "Cynthia: When you meet Trainers, battle\\n",
  "them to learn about the kind of people\\l\\n",
  "they are. Observe the Pokémon they\\l\\n",
  "choose, which moves they taught them,\\l\\n",
  "and which items the Pokémon hold.\\c\\n",
  "You don't need words at such times...\\c\\n",
  "If you want to know more about me...\\n",
  "Come to Sinnoh!$",
]

[msg.section_0.entries.19]
text = [
  "Caitlin: I used to own Battle Castles.\\n",
  "Then I became one of Unova's Elite Four.\\c\\n",
  "Will I be a Champion somewhere next?\\c\\n",
  "You never know!$",
]

[msg.section_0.entries.20]
text = [
  "Caitlin: Darach is as neat as always.\\c\\n",
  "He came all the way to Unova,\\n",
  "cleaned the villa, and then went home...$",
]

[msg.section_0.entries.21]
text = [
  "Caitlin: Tell me something.\\n",
  "Are you familiar with Battle Castles?\\c\\n",
  "You can find them in Johto and Sinnoh,\\n",
  "so challenge them to improve yourself.$",
]

[msg.section_0.entries.22]
text = [
  "Caitlin: This is my villa.\\c\\n",
  "I have villas all over the world,\\n",
  "and I allow Cynthia to use them.\\c\\n",
  "You are welcome to come and play\\n",
  "whenever you wish.$",
]

[msg.section_0.entries.23]
text = [
  "Caitlin: Having no psychic powers at all\\n",
  "is better than having psychic powers\\l\\n",
  "you can't control.$",
]

[msg.section_0.entries.24]
text = [
  "Shauntal: When I'm writing novels,\\n",
  "if I don't have enough input,\\l\\n",
  "my output suffers.\\c\\n",
  "It's the same thing for Trainers.\\c\\n",
  "To grow stronger, Trainers need to have\\n",
  "countless battles and learn many things.\\c\\n",
  "Then, they must put what they've learned\\n",
  "to the test in real battles.$",
]

[msg.section_0.entries.25]
text = [
  "Shauntal: Rainbow Wing...\\n",
  "Silver Wing...\\l\\n",
  "They stir the imagination!$",
]

[msg.section_0.entries.26]
text = [
  "Shauntal: Distortion World...\\n",
  "and the single Pokémon found there...\\l\\n",
  "What an amazing scene!$",
]

[msg.section_0.entries.27]
text = [
  "Shauntal: No matter how much research\\n",
  "I do, I still have no clue.\\c\\n",
  "How old do you think Cynthia is?\\n",
  "Any idea?$",
]

[msg.section_0.entries.28]
text = [
  "Shauntal: I chose my scarf with a\\n",
  "certain Pokémon in mind.\\c\\n",
  "Do you get it?\\n",
  "Using your imagination is important!$",
]

[msg.section_0.entries.29]
text = [
  "Cynthia: What is necessary for becoming\\n",
  "stronger than you are now?\\c\\n",
  "My answer is simply loving Pokémon\\n",
  "with all your heart.\\c\\n",
  "That's how I am, so that's all I can say.$",
]

[msg.section_0.entries.30]
text = [
  "Cynthia: The Champions of each region\\n",
  "gather and compete to see who is\\l\\n",
  "the strongest!\\c\\n",
  "That is the Champions Tournament!$",
]

[msg.section_0.entries.31]
text = [
  "Cynthia: I'd love to live here...\\c\\n",
  "But if I did, there would be a mountain\\n",
  "of research materials piled up...\\c\\n",
  "Am I right? Cynthia, enough for now!\\n",
  "Next time, clean up.$",
]

[msg.section_0.entries.32]
text = [
  "Cynthia: Here's my problem.\\c\\n",
  "I have a white swimsuit and\\n",
  "a black swimsuit...\\l\\n",
  "Which one would look better on me?$",
]

[msg.section_0.entries.33]
text = [
  "Cynthia: Hmm. This is difficult.\\c\\n",
  "I was greedy and brought\\n",
  "a lot of swimsuits, but now I can't pick\\l\\n",
  "which one to wear.$",
]

[msg.section_0.entries.34]
text = [
  "Roxie: I want to be a strong Trainer\\n",
  "and get even better on the bass.\\c\\n",
  "I'll make both come true,\\n",
  "so life will be twice as sweet!$",
]

[msg.section_0.entries.35]
text = [
  "Roxie: You can use a pick\\n",
  "or your fingers to play bass.\\c\\n",
  "Play the way you like!\\n",
  "It's more fun that way!$",
]

[msg.section_0.entries.36]
text = [
  "Roxie: A bass guitar is heavier\\n",
  "than a regular guitar!\\c\\n",
  "So it's more destructive--both in volume\\n",
  "and as a weapon!$",
]

[msg.section_0.entries.37]
text = [
  "Roxie: Don't ever be satisfied!$",
]

[msg.section_0.entries.38]
text = [
  "Roxie: I...\\n",
  "Am I living in you?\\c\\n",
  "Argh!\\n",
  "It's so hard to think of lyrics!\\c\\n",
  "When I start singing, though,\\n",
  "they just come naturally.$",
]

[msg.section_0.entries.39]
text = [
  "Skyla: I get along well with Elesa, but\\n",
  "Pokémon battles are a different story!\\c\\n",
  "If you're not super prepared,\\n",
  "your battles with Electric types\\l\\n",
  "will leave you in shock!$",
]

[msg.section_0.entries.40]
text = [
  "Skyla: Seeing the ground again after\\n",
  "safely passing through a rain cloud\\l\\n",
  "in a violent rainstorm...\\c\\n",
  "Someday, I'd like to share\\n",
  "that moment with you.$",
]

[msg.section_0.entries.41]
text = [
  "Skyla: I was just thinking about that.\\c\\n",
  "When it comes to swimsuits...\\c\\n",
  "You're either about self-composure\\n",
  "or you're about self-exposure!$",
]

[msg.section_0.entries.42]
text = [
  "Skyla: Even distant Sinnoh is just a hop,\\n",
  "skip, and a jump if I use a plane.\\c\\n",
  "But... I also love to travel the sky\\n",
  "with a Pokémon when it's using Fly!$",
]

[msg.section_0.entries.43]
text = [
  "Skyla: Mmm...\\n",
  "Swimming in the ocean sure feels great!$",
]

[msg.section_0.entries.44]
text = [
  "Elesa: I must say it's difficult for people\\n",
  "to draw out a Pokémon's charm\\l\\n",
  "if they don't have any themselves.$",
]

[msg.section_0.entries.45]
text = [
  "Elesa: You know Nimbasa City?\\c\\n",
  "You know it runs on energy generated\\n",
  "by Electric-type Pokémon?\\c\\n",
  "...Just kidding!$",
]

[msg.section_0.entries.46]
text = [
  "Elesa: Getting wrapped up in worries\\n",
  "is bad for your body and spirit.\\c\\n",
  "That's when you must short out your\\n",
  "logic circuits and reboot your heart.$",
]

[msg.section_0.entries.47]
text = [
  "Elesa: Without a word...\\n",
  "Without even a whisper...\\c\\n",
  "My Pokémon connect me to other Trainers,\\n",
  "transmitting the current of my feelings.$",
]

[msg.section_0.entries.48]
text = [
  "Elesa: Put bluntly,\\n",
  "swimsuits are nothing but cloth, right?$",
]

[msg.section_0.entries.49]
text = [
  "This villa belongs to Caitlin, one of the\\n",
  "Pokémon League's Elite Four.$",
]

[msg.section_0.entries.0]
text = [
  "       $$",
]

[msg.section_0.entries.1]
text = [
  "Hey, Trainer!\\n",
  "The move I recommend for you\\l\\n",
  "is none other than Skill Swap!\\c\\n",
  "Skill Swap switches your\\n",
  "Ability with the target's!\\c\\n",
  "Not only can you make an\\n",
  "advantageous Ability your own,\\l\\n",
  "you can dump a harmful Ability\\l\\n",
  "onto your opponent!\\c\\n",
  "There are some Abilities that you can't\\n",
  "swap, but be good to it even if it fails!$",
]

[msg.section_0.entries.2]
text = [
  "Hey, Trainer!\\n",
  "The move I recommend for you\\l\\n",
  "is none other than After You!\\c\\n",
  "After You makes the selected\\n",
  "Pokémon use its move\\l\\n",
  "right after After You is used!\\c\\n",
  "It doesn't work in Single Battles\\n",
  "or Rotation Battles.\\c\\n",
  "But Pokémon using it can make a\\n",
  "slow ally move faster, or you can\\l\\n",
  "throw off your opponent's timing!\\c\\n",
  "This is a great technique for catching\\n",
  "an opponent off guard!$",
]

[msg.section_0.entries.3]
text = [
  "Hey, Trainer!\\n",
  "The move I recommend for you\\l\\n",
  "is none other than Magic Room!\\c\\n",
  "Magic Room makes it so items\\n",
  "held by Pokémon have no effect\\l\\n",
  "for five turns after it's used!\\c\\n",
  "You can stop the effects of items\\n",
  "that help your opponent.\\c\\n",
  "Plus, you can get rid of held-item\\n",
  "effects that hurt your team!\\c\\n",
  "Even better, it interferes with\\n",
  "moves like Fling and Natural Gift!$",
]

[msg.section_0.entries.4]
text = [
  "Hey, Trainer!\\n",
  "The move I recommend for you\\l\\n",
  "is none other than Wonder Room!\\c\\n",
  "Wonder Room swaps the Defense and\\n",
  "Sp. Defense of all Pokémon for\\l\\n",
  "five turns after it's used!\\c\\n",
  "The best choices for attack and defense\\n",
  "change completely, depending on whether\\l\\n",
  "physical moves or special moves\\l\\n",
  "are effective.\\c\\n",
  "This move has a monumental effect\\n",
  "on battles!$",
]

[msg.section_0.entries.5]
text = [
  "Hey, Trainer!\\n",
  "The move I recommend for you\\l\\n",
  "is none other than Sleep Talk!\\c\\n",
  "Sleep Talk can only be used\\n",
  "by a Pokémon that's asleep!\\c\\n",
  "The Pokémon using Sleep Talk\\n",
  "randomly uses any other move\\l\\n",
  "that it knows!\\c\\n",
  "With this move, you don't have\\n",
  "to worry about not being able\\l\\n",
  "to use moves when asleep!$",
]

[msg.section_0.entries.6]
text = [
  "Dire Hit? In Unova, it's called Dire Hit.\\n",
  "Huh? No difference?$",
]

[msg.section_0.entries.7]
text = [
  "It's been two years since I opened for\\n",
  "business, and thanks to everyone,\\l\\n",
  "I'm doing great!\\c$",
]

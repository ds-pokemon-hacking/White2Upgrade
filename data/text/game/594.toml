[msg.section_0.entries.0]
text = [
  "By any chance, have you caught a\\n",
  "Pokémon called Rotom?\\c\\n",
  "I would be very happy if you would trade\\n",
  "my Rotom for your Ditto.$",
]

[msg.section_0.entries.1]
text = [
  "My heart is beating so fast!\\n",
  "OK, let's trade!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Thank you very much! Please treat my\\n",
  "Rotom with love!\\c\\n",
  "I will also take good care of the\\n",
  "Ditto that you traded to me!$",
]

[msg.section_0.entries.3]
text = [
  "I'd like to trade for a Ditto...$",
]

[msg.section_0.entries.4]
text = [
  "Well, if you don't want to, I understand.\\c\\n",
  "But if you ever change your mind, please\\n",
  "trade Pokémon with me!$",
]

[msg.section_0.entries.5]
text = [
  "I am so grateful that you traded Pokémon\\n",
  "with me!\\c\\n",
  "I've traded a Rotom and a Ditto\\n",
  "before as well...\\c\\n",
  "I guess I just like Ditto!$",
]

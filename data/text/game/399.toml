text = [
  "Mmm!\\c\\n",
  "My Roggenrola and I\\n",
  "have been waiting for\\l\\n",
  "a strong Trainer like you!\\c\\n",
  "If you want to pass, you must beat\\n",
  "my Roggenrola and me!\\c\\n",
  "Can you defeat our rock-hard will?$",
]


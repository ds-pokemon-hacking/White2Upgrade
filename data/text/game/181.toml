[msg.section_0.entries.0]
text = [
  "This is a Pokémon Gym, and\\n",
  "it's also a rock club!\\c\\n",
  "The Gym Leader and the others\\n",
  "are practicing inside, but please\\l\\n",
  "feel free to challenge all of them!\\c\\n",
  "Oh! You'll need to stay hydrated.\\n",
  "Here you go!\\c$",
]

[msg.section_0.entries.1]
text = [
  "The Trainers in this Pokémon Gym\\n",
  "all use Poison-type Pokémon!\\c\\n",
  "Grass- and Bug-type attacks\\n",
  "don't work well against Poison types,\\l\\n",
  "so be careful!\\c\\n",
  "Also, if your Pokémon are poisoned,\\n",
  "their HP will keep decreasing. Watch out!\\c\\n",
  "And you should know that Poison-type\\n",
  "Pokémon can't be poisoned!$",
]

[msg.section_0.entries.2]
text = [
  "The shining Gym Badge is important\\n",
  "because you and your Pokémon\\l\\n",
  "won it together!\\l\\n",
  "Please remember that always!$",
]

[msg.section_0.entries.3]
text = [
  "Virbank City Pokémon Gym\\c\\n",

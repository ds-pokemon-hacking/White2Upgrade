[msg.section_0.entries.0]
text = [
  "Watch a movie$",
]

[msg.section_0.entries.1]
text = [
  "Info$",
]

[msg.section_0.entries.2]
text = [
  "Quit$",
]

[msg.section_0.entries.3]
text = [
  "Welcome to Pokéstar Studios.\\n",
  "How may I help you?$",
]

[msg.section_0.entries.4]
text = [
  "This is where the movies developed\\n",
  "at the film studio are released.\\c\\n",
  "You'll find a monitor in the movie theater\\n",
  "to check the records of these movies.\\c$",
]

[msg.section_0.entries.5]
text = [
  "Please select the movie\\n",
  "you'd like to watch.\\c$",
]

[msg.section_0.entries.6]
text = [
  "I apologize.\\n",
  "We have no movies available to show.\\c\\n",
  "I wonder if anyone would be interested\\n",
  "in helping to create new movies, hmm...\\c$",
]

[msg.section_0.entries.7]
text = [
  "The movie is about to begin.\\n",
  "Please enjoy.\\c$",
]

[msg.section_0.entries.8]
text = [
  "Please come again!$",
]

[msg.section_0.entries.9]
text = [
  "This monitor is currently being tested.$",
]

[msg.section_0.entries.10]
text = [
  "Well, well!\\n",
  "If it isn't [VAR TRNAME(0)], dahling!\\c$",
]

[msg.section_0.entries.11]
text = [
  "[VAR TRNAME(0)]--this particular effort\\n",
  "turned out to be...\\c\\n",
  "...a complete flop, dahling.\\n",
  "But I thought it was quite a unique\\l\\n",
  "little film in its own way. I liked it!\\c$",
]

[msg.section_0.entries.12]
text = [
  "[VAR TRNAME(0)], this time your movie\\n",
  "turned out to...\\c\\n",
  "...exceed everyone's expectations!\\n",
  "Everybody's talking about it, dahling.\\c\\n",
  "With an amazing film like this, movie\\n",
  "buffs--and our staff--will definitely\\l\\n",
  "notice you, [VAR TRNAME(0)]!\\c$",
]

[msg.section_0.entries.13]
text = [
  "[VAR TRNAME(0)]--this particular effort\\n",
  "turned out to be...\\c\\n",
  "...a spec-tac-ulah hit, dahling!\\c\\n",
  "Keep it up, and you'll be loved by\\n",
  "movie buffs everywhere--and our staff.\\c$",
]

[msg.section_0.entries.14]
text = [
  "Dahling, [VAR TRNAME(0)], I must tell you...\\n",
  "Your Pokémon that performed\\l\\n",
  "in this movie may be showing more\\l\\n",
  "acting chops than before.\\c$",
]

[msg.section_0.entries.15]
text = [
  "Bye for now, [VAR TRNAME(0)]! I'm so looking\\n",
  "forward to your next picture, dahling!\\c$",
]

[msg.section_0.entries.16]
text = [
  "Here we are!\\n",
  "This is the reception area.\\c$",
]

[msg.section_0.entries.17]
text = [
  "Oh, if it isn't the scout himself!\\n",
  "Thanks to you, I've made my movie debut!\\c$",
]

[msg.section_0.entries.18]
text = [
  "Wow!\\n",
  "I'm glad to hear that!\\c$",
]

[msg.section_0.entries.19]
text = [
  "And who would that be?\\c$",
]

[msg.section_0.entries.20]
text = [
  "This is [VAR TRNAME(0)]!\\c\\n",
  "I witnessed this Trainer challenging your\\n",
  "daughter. It struck me--here's someone\\l\\n",
  "with real potential!\\c\\n",
  "A fresh discovery for Pokéstar Studios!\\c$",
]

[msg.section_0.entries.21]
text = [
  "You beat Roxie, I see.\\n",
  "You must be a pretty good Trainer.\\c\\n",
  "Oh, you know what?\\n",
  "They're releasing my movie now!\\c\\n",
  "Are you thinking about making a\\n",
  "Pokéstar Studios debut, too?\\c\\n",
  "Then, I do insist you watch my movie\\n",
  "in order to gain acting tips from a\\l\\n",
  "professional such as myself.\\c$",
]

[msg.section_0.entries.22]
text = [
  "That's a good idea!\\c\\n",
  "[VAR TRNAME(0)], it should be a good\\n",
  "introduction to filmmaking for you!\\c$",
]

[msg.section_0.entries.23]
text = [
  "Awesome! Let's go!\\c$",
]

[msg.section_0.entries.24]
text = [
  "Welcome to the Pokéstar Studios theater.\\n",
  "This is the reception counter.\\c$",
]

[msg.section_0.entries.25]
text = [
  "This is where you choose\\n",
  "the movie you want to watch.\\c\\n",
  "There are eight screens in the theater\\n",
  "here in Pokéstar Studios!\\l\\n",
  "Pretty impressive, huh?\\c\\n",
  "Now...\\n",
  "Huh?\\c\\n",
  "It seems my movie will be\\n",
  "shown on a special screen.\\c$",
]

[msg.section_0.entries.26]
text = [
  "...\\c$",
]

[msg.section_0.entries.27]
text = [
  "I hope you had a good time!\\n",
  "How did you enjoy the movie?\\c$",
]

[msg.section_0.entries.28]
text = [
  "...\\c$",
]

[msg.section_0.entries.29]
text = [
  "What's the matter?$",
]

[msg.section_0.entries.30]
text = [
  "Ha ha ha. I've always dreamed of making\\n",
  "my debut on the silver screen...\\c\\n",
  "Now I've fulfilled that dream...\\c$",
]

[msg.section_0.entries.31]
text = [
  "What are you saying?\\c$",
]

[msg.section_0.entries.32]
text = [
  "Different people have different talents.\\n",
  "I knew it all along.\\c\\n",
  "But I see my daughter striving to\\n",
  "balance the responsibility of being a\\l\\n",
  "Gym Leader while pursuing her own\\l\\n",
  "dream of being in a band.\\c\\n",
  "Although I'm a father, I really wanted\\n",
  "to pursue my own long-held dream...\\c\\n",
  "If you stop pursuing your dreams,\\n",
  "your life might as well be over, right?\\c$",
]

[msg.section_0.entries.33]
text = [
  "...\\c$",
]

[msg.section_0.entries.34]
text = [
  "I'm going back to my duties as a ship\\n",
  "captain for now.\\c\\n",
  "Someday, I'll return to the screen!\\c\\n",
  "Until that day comes, I'll leave\\n",
  "all the starring roles to you!\\c$",
]

[msg.section_0.entries.35]
text = [
  "We had better get going.\\n",
  "Mr. Deeoh should be ready by now.\\c$",
]

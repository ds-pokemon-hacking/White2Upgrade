[msg.section_0.entries.7]
text = [
  "I'll come watch again, [VAR TRNAME(0)].\\c\\n",
  "That was so wonderful...\\n",
  "It may have changed my life.$",
]

[msg.section_0.entries.8]
text = [
  "[VAR TRNAME(0)]! That musical was the\\n",
  "best ever!\\c\\n",

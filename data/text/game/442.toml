[msg.section_0.entries.5]
text = [
  "Oh, [VAR TRNAME(0)], [VAR TRNAME(0)]...\\c\\n",
  "I'm so very moved, I'm at a loss\\n",
  "for words...$",
]

[msg.section_0.entries.6]

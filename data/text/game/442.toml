[msg.section_0.entries.56]
text = [
  "Welcome to the Pokémon Musical!\\c\\n",
  "This is a changing room for Dress Up only.\\n",
  "Would you like to Dress Up your Pokémon?$",
]

[msg.section_0.entries.57]
text = [
  "This way, please!\\c$",
]

[msg.section_0.entries.58]
text = [
  "Would you like to Dress Up your Pokémon?$",
]

[msg.section_0.entries.59]
text = [
  "What would you like me to explain?$",
]

[msg.section_0.entries.60]
text = [
  "What's the Pokémon Musical?$",
]

[msg.section_0.entries.61]
text = [
  "The Pokémon Musical is a show where\\n",
  "Pokémon wearing Props perform on stage.\\l\\n",
  "Anyone can participate!\\c\\n",
  "We encourage all Trainers to show the\\n",
  "world how charming their Pokémon are!\\c\\n",
  "The audience is looking forward to seeing\\n",
  "how you Dress Up your Pokémon, and how\\l\\n",
  "your Pokémon perform!\\c$",
]

[msg.section_0.entries.62]
text = [
  "How to Participate$",
]

[msg.section_0.entries.63]
text = [
  "You can join the musical from any of the\\n",
  "three reception areas.\\c\\n",
  "The reception area in the center is for\\n",
  "participating alone.\\c\\n",
  "When you participate alone, you will\\n",
  "be joined by other Trainers from around\\l\\n",
  "the Unova region.\\c\\n",
  "If you want to put on a musical with your\\n",
  "friends, go to the left reception area.\\c\\n",
  "You'll be asked to pick a Leader who\\n",
  "will choose which show to perform,\\l\\n",
  "and the others will join the group.\\c\\n",
  "The reception area to the right is where\\n",
  "you go to Dress Up only.\\c$",
]

[msg.section_0.entries.64]
text = [
  "Eligible Pokémon$",
]

[msg.section_0.entries.65]
text = [
  "The Pokémon that will participate in the\\n",
  "musical are chosen from your party at\\l\\n",
  "the reception area.\\c\\n",
  "Because of their shape, some Pokémon\\n",
  "have a hard time wearing certain Props.\\c\\n",
  "You might want to try Dress Up in the\\n",
  "changing room first if you're worried!\\c$",
]

[msg.section_0.entries.66]
text = [
  "Dress Up$",
]

[msg.section_0.entries.67]
text = [
  "Oh, Dress Up is my favorite part! That's\\n",
  "where you put the Props you've collected\\l\\n",
  "on the Pokémon that will be performing.\\c\\n",
  "Depending on the Pokémon, you can put\\n",
  "the Props in different places.\\c\\n",
  "When you use Props that fit the theme of\\n",
  "the show you've chosen, the audience\\l\\n",
  "will notice your Pokémon more!\\c\\n",
  "Sometimes a Prop that doesn't fit the\\n",
  "theme will also make your Pokémon\\l\\n",
  "stand out.\\c\\n",
  "If you want to get an idea of how it's\\n",
  "done, you can watch how other people\\l\\n",
  "Dress Up and then try it yourself!\\c$",
]

[msg.section_0.entries.68]
text = [
  "Shows$",
]

[msg.section_0.entries.69]
text = [
  "You can choose which show to perform\\n",
  "when you participate in the musical.\\c\\n",
  "There is no need for Trainers to give\\n",
  "commands, but if your Pokémon is carrying\\l\\n",
  "a Prop in its arms, it can use that Prop\\l\\n",
  "to show off and appeal to the audience.\\c\\n",
  "Depending on how you Dress Up your\\n",
  "Pokémon, the reactions from the audience\\l\\n",
  "will change!\\c$",
]

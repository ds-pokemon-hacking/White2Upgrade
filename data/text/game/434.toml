[msg]
trailing_data = "3838"

[msg.section_0.entries.0]
text = [
  "How is your Pokédex coming along?\\n",
  "Can I see it?$",
]

[msg.section_0.entries.1]
text = [
  "Let me see...\\c\\n",
  "Oh, you've seen [VAR NUM3(0)] Pokémon in the\\n",
  "Unova region!$",
]

[msg.section_0.entries.2]
text = [
  "Let me see...\\c\\n",
  "Oh, you've caught [VAR NUM3(0)] Pokémon in the\\n",
  "Unova region!$",
]

[msg.section_0.entries.3]
text = [
  "This Pokédex is full of memories from your\\n",
  "journey. It's a treasure you can cherish\\l\\n",
  "for your entire life.$",
]

[msg.section_0.entries.4]
text = [
  "If you want to meet more Pokémon, you\\n",
  "should try walking through tall grass!\\c$",
]

[msg.section_0.entries.5]
text = [
  "It seems a little more like a Pokédex now!\\n",
  "You're getting off to a good start!\\c$",
]

[msg.section_0.entries.6]
text = [
  "Some Pokémon are hard to find, but don't\\n",
  "give up! Keep checking the tall grass.\\c$",
]

[msg.section_0.entries.7]
text = [
  "Trainers have a lot of different Pokémon.\\c\\n",
  "So battling them is a great way to fill up\\n",
  "your Pokédex, too!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Some Pokémon are only found in\\n",
  "certain caves!\\c\\n",
  "You might want to go back and search\\n",
  "caves you've already passed through.\\c$",
]

[msg.section_0.entries.9]
text = [
  "Wow, it's getting really full!\\c\\n",
  "I'm sure looking over your Pokédex will\\n",
  "bring back memories of your journey.\\c$",
]

[msg.section_0.entries.10]
text = [
  "Over 100 Pokémon...\\c\\n",
  "It's so much fun looking over all their\\n",
  "different characteristics!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Bianca probably told you about it,\\n",
  "but are you checking the\\l\\n",
  "rustling grass, too?\\c\\n",
  "The more you walk, the more your chance\\n",
  "of finding rustling grass increases.\\c$",
]

[msg.section_0.entries.12]
text = [
  "There are various Abilities, but\\n",
  "do you fully understand them?\\c\\n",
  "Certain Abilities make wild Pokémon\\n",
  "come out more often!\\c$",
]

[msg.section_0.entries.13]
text = [
  "It may be hard to find their\\n",
  "entrances in the trees,\\l\\n",
  "but you should look for Hidden Grottoes.\\c\\n",
  "I don't know why, but Pokémon that live\\n",
  "there all have quite uncommon Abilities!\\c$",
]

[msg.section_0.entries.14]
text = [
  "Over 200 different Pokémon!\\c\\n",
  "This world is filled with so many\\n",
  "Pokémon interacting with one another!\\c$",
]

[msg.section_0.entries.15]
text = [
  "It's incredible that the number of kinds\\n",
  "of Pokémon has increased this much\\l\\n",
  "over such a short time.\\c\\n",
  "The adaptability of Pokémon is amazing.\\c$",
]

[msg.section_0.entries.16]
text = [
  "That is an excellent Pokédex!\\n",
  "Just a little more, and it will be full!\\c$",
]

[msg.section_0.entries.17]
text = [
  "What a wonderful Pokédex!\\n",
  "A little more work, and it'll be complete!\\c\\n",
  "I'm really glad I asked you to do this!\\c$",
]

[msg.section_0.entries.18]
text = [
  "Amazing! Truly amazing!\\c\\n",
  "You've met all of the Pokémon in the\\n",
  "Unova region!\\c\\n",
  "Congratulations!\\c\\n",
  "Now here's your next challenge: see how\\n",
  "many of those Pokémon you can catch!\\l\\n",
  "I'll keep evaluating for you!\\c$",
]

[msg.section_0.entries.19]
text = [
  "Little by little, more detailed information\\n",
  "is being entered into the Pokédex!\\l\\n",
  "Do your best!\\c$",
]

[msg.section_0.entries.20]
text = [
  "Are you trying out different kinds of\\n",
  "Poké Balls for your captures?\\c\\n",
  "They come in lots of varieties, so be sure\\n",
  "to use the right one at the right time!\\c$",
]

[msg.section_0.entries.21]
text = [
  "If you read the Pokédex descriptions,\\n",
  "you can learn a lot of unexpected facts\\l\\n",
  "about Pokémon! It's fun!\\c$",
]

[msg.section_0.entries.22]
text = [
  "Evolving Pokémon is another important\\n",
  "way to fill up your Pokédex. It's not\\l\\n",
  "just about catching them!\\c$",
]

[msg.section_0.entries.23]
text = [
  "Trading Pokémon with friends also\\n",
  "counts as catching them!\\c$",
]

[msg.section_0.entries.24]
text = [
  "When you've met this many Pokémon, do\\n",
  "you have trouble picking which ones to\\l\\n",
  "travel with?\\c$",
]

[msg.section_0.entries.25]
text = [
  "Over 100 different Pokémon! Great!\\c\\n",
  "Identify your goal using the\\n",
  "Habitat List.\\c\\n",
  "That way, you may be able to motivate\\n",
  "yourself even more.\\c$",
]

[msg.section_0.entries.26]
text = [
  "Some moves are very useful\\n",
  "for catching Pokémon, right?\\c\\n",
  "Teaching False Swipe to your Pokémon\\n",
  "is one such approach.\\c$",
]

[msg.section_0.entries.27]
text = [
  "You can't meet some Pokémon\\n",
  "unless you find their Eggs!\\c$",
]

[msg.section_0.entries.28]
text = [
  "Depending on the season,\\n",
  "some Pokémon are easier to find\\l\\n",
  "and some Pokémon are harder to find.\\c$",
]

[msg.section_0.entries.29]
text = [
  "You've caught more than 200 different\\n",
  "Pokémon!\\c\\n",
  "I'm glad that I entrusted the Pokédex\\n",
  "to such a wonderful Trainer.\\c$",
]

[msg.section_0.entries.30]
text = [
  "Even after researching so\\n",
  "many Pokémon...\\l\\n",
  "their origin...\\l\\n",
  "where they were born...\\c\\n",
  "There are so many things\\n",
  "we still don't know.\\c$",
]

[msg.section_0.entries.31]
text = [
  "You've caught so many Pokémon.\\n",
  "You might know more than me now!\\c\\n",
  "I'm cheering for you to complete\\n",
  "your Pokédex!\\c$",
]

[msg.section_0.entries.32]
text = [
  "With just a little more effort, you will\\n",
  "have completed a perfect Pokédex!\\c\\n",
  "You've come this far, so don't give up...\\n",
  "No, just enjoy it as much as possible!\\c$",
]

[msg.section_0.entries.33]
text = [
  "Amazing! Absolutely amazing!\\c\\n",
  "You've caught every Pokémon\\n",
  "in the Unova region!\\c\\n",
  "Congratulations!!\\c$",
]

[msg.section_0.entries.34]
text = [
  "It seems like you are meeting Pokémon at\\n",
  "a good clip!\\c\\n",
  "I have something I want to give you!\\n",
  "Please come to the lab when you can.$",
]

[msg.section_0.entries.35]
text = [
  "It seems like you are meeting Pokémon at\\n",
  "a good clip!\\c\\n",
  "Here! This is a gift to thank you for all\\n",
  "your hard work!\\c$",
]

[msg.section_0.entries.36]
text = [
  "If you have a Permit,\\n",
  "you can go to the Nature Preserve\\l\\n",
  "from Mistralton City by plane!\\c\\n",
  "Go check it out to see\\n",
  "what kind of place it is!\\c$",
]

[msg.section_0.entries.37]
text = [
  "If you have an Oval Charm,\\n",
  "we don't know why,\\l\\n",
  "but you'll have a better chance to\\l\\n",
  "find Eggs at the Pokémon Day Care!\\c$",
]

[msg.section_0.entries.38]
text = [
  "If you have a Shiny Charm,\\n",
  "we don't know why, but you'll have a\\l\\n",
  "better chance to find Shiny Pokémon!\\c$",
]

[msg.section_0.entries.39]
text = [
  "Try using this, too!\\c$",
]

[msg.section_0.entries.40]
text = [
  "Keep up the good work!$",
]

[msg.section_0.entries.41]
text = [
  "You're here to show me how your\\n",
  "Pokédex is coming along, right?$",
]

[msg.section_0.entries.42]
text = [
  "I see!\\c\\n",
  "You've caught [VAR NUM3(0)] Pokémon, then...$",
]

[msg.section_0.entries.43]
text = [
  "Oh, really...\\c\\n",
  "If you want me to have a look at\\n",
  "your Pokédex, come here again!$",
]

[msg.section_0.entries.44]
text = [
  "Nationally, there are more than\\n",
  "600 Pokémon!\\c\\n",
  "You'll have to be persistent and\\n",
  "catch them at your own pace.$",
]

[msg.section_0.entries.45]
text = [
  "First, you might want to revisit places\\n",
  "you've already been.\\c\\n",
  "Retrace your steps in the Unova region\\n",
  "and see what new Pokémon turn up!$",
]

[msg.section_0.entries.46]
text = [
  "Remember Rule No. 1! To catch a Pokémon,\\n",
  "you first have to reduce its HP.\\c\\n",
  "You're pretty good at this now,\\n",
  "but don't forget the basics!$",
]

[msg.section_0.entries.47]
text = [
  "Are you going to the Day Care?\\c\\n",
  "I've heard that some Pokémon can only be\\n",
  "caught if they are hatched from Eggs.$",
]

[msg.section_0.entries.48]
text = [
  "Do you have a fishing rod?\\c\\n",
  "There are many Pokémon that live in the\\n",
  "water. Try searching rivers and oceans!$",
]

[msg.section_0.entries.49]
text = [
  "Do you know the move False Swipe?\\c\\n",
  "False Swipe always leaves a tiny bit of\\n",
  "the targeted Pokémon's HP.\\c\\n",
  "It's great for catching, because it\\n",
  "doesn't make them faint!$",
]

[msg.section_0.entries.50]
text = [
  "Do you know the move Mean Look?\\c\\n",
  "If you use Mean Look on a Pokémon,\\n",
  "it can't run away!$",
]

[msg.section_0.entries.51]
text = [
  "There are several ways for Pokémon to\\n",
  "evolve. Some Pokémon even evolve\\l\\n",
  "through friendship!$",
]

[msg.section_0.entries.52]
text = [
  "Have you heard of mass outbreaks?\\c\\n",
  "Big groups of Pokémon appear during a\\n",
  "mass outbreak. It's a great chance to\\l\\n",
  "catch them!$",
]

[msg.section_0.entries.53]
text = [
  "You've caught more than 400\\n",
  "different Pokémon?!\\c\\n",
  "That's incredible!\\n",
  "You're an amazing Trainer!$",
]

[msg.section_0.entries.54]
text = [
  "Apparently, some Pokémon\\n",
  "evolve when they are leveled up\\l\\n",
  "in a certain area.$",
]

[msg.section_0.entries.55]
text = [
  "You've caught 500 different Pokémon...\\c\\n",
  "My, the variation of these beings called\\n",
  "Pokémon certainly is surprising!\\c\\n",
  "And the fact that you've caught so many\\n",
  "different kinds... That's pretty\\l\\n",
  "surprising, too!$",
]

[msg.section_0.entries.56]
text = [
  "Have you been to the Poké Transfer Lab\\n",
  "on Route 15?\\c\\n",
  "Mastering a facility like that is an\\n",
  "accomplishment for a Pokémon Trainer.$",
]

[msg.section_0.entries.57]
text = [
  "Just a little more until you complete\\n",
  "your Pokédex, huh?\\c\\n",
  "Catching this many Pokémon must mean...\\n",
  "You really like Pokémon, don't you!$",
]

[msg.section_0.entries.58]
text = [
  "Oh! That's a wonderful Pokédex.\\c\\n",
  "How about it? Would you research Pokémon\\n",
  "with me?$",
]

[msg.section_0.entries.59]
text = [
  "Oh! Just a little more until your\\n",
  "Pokédex is complete!\\c\\n",
  "Make sure you go trade with friends\\n",
  "to get the ones you're missing!$",
]

[msg.section_0.entries.60]
text = [
  "...\\n",
  "...\\c\\n",
  "This blows me away! It's so wonderful,\\n",
  "I'm at a loss for words.\\c\\n",
  "You... You've accomplished something\\n",
  "truly outstanding.\\c\\n",
  "Filling up the National Pokédex makes you\\n",
  "a Trainer among Trainers!\\c\\n",
  "I'm so happy I was able to meet a\\n",
  "fantastic Trainer like you!\\l\\n",
  "I thank you from the bottom of my heart.$",
]

[msg.section_0.entries.61]
text = [
  "Oh! We have a gift for you.\\n",
  "My daughter has it.\\l\\n",
  "Go speak to her and get it!$",
]

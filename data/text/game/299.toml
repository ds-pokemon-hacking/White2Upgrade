[msg.section_0.entries.0]
text = [
  "Lots of toxins build up in the sewer\\n",
  "system. I think I can use them to make\\l\\n",
  "medicines. So I'm running an experiment!\\c\\n",
  "If this works, I might be able to use the\\n",
  "venom of Poison-type Pokémon to make\\l\\n",
  "different medicines. How exciting!\\c\\n",
  "Well, well...\\n",
  "The result of today's experiment was...\\c$",
]

[msg.section_0.entries.1]
text = [
  "Well, today's experiment could have\\n",
  "gone better.\\c\\n",
  "But I did manage to make a Potion.\\n",
  "Here, you can have it!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Today's experiment was a success!\\c\\n",
  "Here! Please accept the\\n",
  "Super Potion I made.\\c$",
]

[msg.section_0.entries.3]
text = [
  "Wow! Today's experiment\\n",
  "was super successful!\\c\\n",
  "Here! Please accept\\n",
  "the Revive I made!\\c$",
]

[msg.section_0.entries.4]
text = [
  "I'll keep experimenting every day!\\n",
  "It's important to keep trying.\\l\\n",
  "Come back and see how it's going!$",
]

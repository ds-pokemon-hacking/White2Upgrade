[msg]
trailing_data = "c8c8"

[msg.section_0.entries.0]
text = [
  "Professor Juniper: Hi there!\\n",
  "How were things with Skyla?\\c\\n",
  "Oh? You still haven't\\n",
  "earned the Gym Badge yet?\\c\\n",
  "Well, if that's the case,\\n",
  "I'll keep up the field work\\l\\n",
  "until the plane is ready to fly.\\c\\n",
  "Oh yeah!\\n",
  "Why don't you try using this?\\c$",
]

[msg.section_0.entries.1]
text = [
  "Professor Juniper: Giving that Lucky Egg\\n",
  "to a Pokémon to hold increases the\\l\\n",
  "amount of Exp. Points received in\\l\\n",
  "battle a little bit!\\c\\n",
  "Having strong Pokémon will make\\n",
  "it easier to fill your Pokédex pages!$",
]

[msg.section_0.entries.2]
text = [
  "Professor Juniper: Celestial Tower...\\n",
  "It's a giant memorial...\\c\\n",
  "I wonder if this building was built\\n",
  "in a place with many Ghost- and\\l\\n",
  "Psychic-type Pokémon or if those\\l\\n",
  "Pokémon gathered here because it\\l\\n",
  "was built.$",
]

[msg.section_0.entries.3]
text = [
  "Professor Juniper: Celestial Tower...\\n",
  "It's a giant memorial...\\c\\n",
  "I wonder if this building was built\\n",
  "in a place with many Ghost- and\\l\\n",
  "Psychic-type Pokémon or if those\\l\\n",
  "Pokémon gathered here because it\\l\\n",
  "was built.\\c$",
]

[msg.section_0.entries.4]
text = [
  "Professor Juniper: Oh, right!\\n",
  "How were things with Skyla?\\c\\n",
  "Oh my! You won the Jet Badge!\\c\\n",
  "Well, the plane should be ready\\n",
  "to fly, then!\\c\\n",
  "Thanks for coming to get me!\\n",
  "Take this as thanks!\\l\\n",
  "Try using it!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Professor Juniper: Giving that Lucky Egg\\n",
  "to a Pokémon to hold increases the\\l\\n",
  "amount of Exp. Points received in\\l\\n",
  "battle by a little bit!\\c\\n",
  "Having strong Pokémon will make\\n",
  "it easier to fill your Pokédex pages!\\c$",
]

[msg.section_0.entries.6]
text = [
  "OK! I'll be waiting for you\\n",
  "in Mistralton City!\\c$",
]

[msg.section_0.entries.7]
text = [
  "This is Celestial Tower, where Pokémon\\n",
  "are laid to rest...$",
]

[msg.section_0.entries.8]
text = [
  "At the very top of the Tower,\\n",
  "there's a big bell.\\c\\n",
  "I've heard that when you\\n",
  "ring it, it pleases the spirits.$",
]

[msg.section_0.entries.9]
text = [
  "You! You came here at the request of\\n",
  "the couple in Humilau City, didn't you?!\\c\\n",
  "No need for a reply!\\n",
  "If you want to ring the bell,\\l\\n",
  "you'll have to battle with me!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Win or lose...\\n",
  "I'm a Waitress...\\c\\n",
  "I carry the customers' orders\\n",
  "with a heaping side of love...$",
]

[msg.section_0.entries.0]
text = [
  "Sometimes, above the bridge, you can\\n",
  "see the shadows of bird Pokémon, right?\\c\\n",
  "Their feathers drift to the ground here!\\c\\n",
  "And when you try to pick them up,\\n",
  "occasionally you'll run into a Pokémon.$",
]

[msg.section_0.entries.1]
text = [
  "The Funfest Mission\\n",
  "“[VAR FUNFESTMISSION(0)]\\\"\\l\\n",
  "has been added to the Entralink!$",
]

[msg.section_0.entries.2]
text = [
  "Driftveil City is famous for this\\n",
  "drawbridge, the PWT, and of course,\\l\\n",
  "the heartbreaker, Charles.$",
]

[msg.section_0.entries.3]
text = [
  "The Driftveil Drawbridge...\\n",
  "It's also known as the Charizard Bridge!\\c\\n",
  "Because the raised drawbridge looks like\\n",
  "the Pokémon called Charizard.\\c\\n",
  "...But, I've never seen Charizard,\\n",
  "so I don't know...$",
]

[msg.section_0.entries.4]
text = [
  "The Driftveil Drawbridge...\\n",
  "It's also known as the Charizard Bridge!\\c\\n",
  "Because the raised drawbridge looks like\\n",
  "the Pokémon called Charizard.\\c\\n",
  "...But, I've never seen Charizard,\\n",
  "so I don't know...\\c\\n",
  "...What?!\\n",
  "Are you with Charizard?\\c$",
]

[msg.section_0.entries.5]
text = [
  "Wow! Awesome!\\n",
  "Yeah, I think it looks like Charizard.\\c\\n",
  "Thanks! As a token of my appreciation,\\n",
  "please accept this!\\c$",
]

[msg.section_0.entries.6]
text = [
  "I wonder if the people who made\\n",
  "this drawbridge were with Charizard.$",
]

[msg.section_0.entries.7]
text = [
  "[SPEED(2)]Panting... Panting...\\n",
  "I'm...thirsty...\\c\\n",
  "I met you on the Skyarrow Bridge...\\c\\n",
  "G-g-give me...\\n",
  "Fresh Water...?[SPEED(0)]$",
]

[msg.section_0.entries.8]
text = [
  "Refreshed!!\\c\\n",
  "I'm 100% rehydrated!\\n",
  "I feel better now! Thank you!\\c\\n",
  "I'll dash to the next bridge!$",
]

[msg.section_0.entries.9]
text = [
  "[SPEED(2)]But... You don't have Fresh Water...\\n",
  "I appreciate the thought, though...[SPEED(0)]$",
]

[msg.section_0.entries.10]
text = [
  "[SPEED(2)]Thank...\\c\\n",
  "What?\\n",
  "Oh...\\c\\n",
  "Without Fresh Water...\\n",
  "I can't run on bridges anymore.[SPEED(0)]$",
]

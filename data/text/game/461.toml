[msg.section_0.entries.0]
text = [
  "Leaving the Prop Case behind...\\n",
  "Huh. Did [VAR TRNAME(0)] do that\\l\\n",
  "accidentally or on purpose?\\c\\n",
  "Whatever the reason, there's no doubt\\n",
  "that [VAR TRNAME(0)] had a great talent\\l\\n",
  "for coordinating Pokémon Props!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Open the Prop Case--and voilà!\\n",
  "Colorful Props for Pokémon!\\c\\n",
  "Aw, yeah! It is time to play Dress Up!\\c$",
]

[msg.section_0.entries.2]
text = [
  "The Top Hat is an elegant Prop that\\n",
  "adds class to any Pokémon's head!\\c$",
]

[msg.section_0.entries.3]
text = [
  "How about popping some cute\\n",
  "Blue Barrettes on a Pokémon's ears?\\c$",
]

[msg.section_0.entries.4]
text = [
  "The Square Glasses are eye catching.\\n",
  "They nicely frame a Pokémon's face!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Maraca, Maraca, Maraca!\\n",
  "It's a sharp look for a Pokémon's arm.\\c$",
]

[msg.section_0.entries.6]
text = [
  "The Umber Belt accentuates a waistline!\\n",
  "Belts are decorative as well as useful.\\c$",
]

[msg.section_0.entries.7]
text = [
  "Putting a Tie on a Pokémon's body makes\\n",
  "it look dignified or charming--or both!\\c$",
]

[msg.section_0.entries.8]
text = [
  "There's nothing to worry about.\\c\\n",
  "If [VAR TRNAME(0)] comes back, we'll return\\n",
  "this trusty Prop Case in a trice.\\c$",
]

[msg.section_0.entries.9]
text = [
  "In the meantime, we see in you a\\n",
  "worthy successor to [VAR TRNAME(0)].\\c\\n",
  "Yes! You'll do!\\n",
  "With your talent and this Prop Case,\\l\\n",
  "we foresee the rising of a future star!\\c\\n",
  "Props to you!\\c$",
]

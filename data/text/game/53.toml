[msg.section_0.entries.0]
text = [
  "People who work in this building have\\n",
  "Pokémon battles, not opinion battles.\\c\\n",
  "You appear to be strong, but if you go\\n",
  "upstairs, please be extra careful.\\c$",
]

[msg.section_0.entries.1]
text = [
  "Oh, yes! If you'd like, you should\\n",
  "have your Pokémon hold this!\\c$",
]

[msg.section_0.entries.2]
text = [
  "That's the Exp. Share!\\c\\n",
  "A Pokémon holding an Exp. Share gets\\n",
  "some of the Exp. Points from every\\l\\n",
  "battle, even if it's not involved.\\c\\n",
  "It may be useful for\\n",
  "raising weak Pokémon!\\c$",
]

[msg.section_0.entries.3]
text = [
  "I am a janitorial man. ♪\\n",
  "I make everything spick and span. ♪\\c$",
]

[msg.section_0.entries.4]
text = [
  "Welcome!\\c\\n",
  "If you use the elevator, please use the\\n",
  "buttons on the door or next to the door.$",
]

[msg.section_0.entries.5]
text = [
  "Every morning, my Pokémon wakes me\\n",
  "with Uproar, so I always look like\\l\\n",
  "a wreck.\\c\\n",
  "But I appreciate its good intentions.\\n",
  "I'll work my hardest to provide for it\\l\\n",
  "today, as always.$",
]

[msg.section_0.entries.6]
text = [
  "That thing you have is a Pokédex,\\n",
  "isn't it?\\c\\n",
  "Wow! Coooooool! You collect Pokémon!\\n",
  "OK! I'll help you.\\c\\n",
  "Which Pokémon did you choose at the\\n",
  "beginning of your journey?$",
]

[msg.section_0.entries.7]
text = [
  "You have Snivy! Then I will give you this!\\c\\n",
  "When you have your Pokémon hold it, it\\n",
  "can raise the power of Grass-type moves!\\c$",
]

[msg.section_0.entries.8]
text = [
  "You have Oshawott! Then I will give\\n",
  "you this!\\c\\n",
  "When you have your Pokémon hold it, it\\n",
  "can raise the power of Water-type moves!\\c$",
]

[msg.section_0.entries.9]
text = [
  "You have Tepig! Then I will give you this!\\c\\n",
  "When you have your Pokémon hold it, it\\n",
  "can raise the power of Fire-type moves!\\c$",
]

[msg.section_0.entries.10]
text = [
  "A lot of items have effects when Pokémon\\n",
  "hold them, so be on the lookout for\\l\\n",
  "these items!\\c\\n",
  "Well, work hard to fill up your Pokédex!\\n",
  "Good luck!$",
]

[msg.section_0.entries.11]
text = [
  "Snivy$",
]

[msg.section_0.entries.12]
text = [
  "Oshawott$",
]

[msg.section_0.entries.13]

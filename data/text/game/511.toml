[msg.section_0.entries.31]
text = [
  "Everybody calls me the reminder girl.\\c\\n",
  "I know every move that Pokémon learn\\n",
  "while they're leveling up.\\c\\n",
  "And I can make Pokémon remember\\n",
  "those moves!\\c\\n",
  "If you bring me a Heart Scale, I'll make\\n",
  "a Pokémon remember a move.\\c$",
]


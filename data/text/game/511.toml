[msg.section_0.entries.0]
text = [
  "Er...\\n",
  "Who was I again?\\c\\n",
  "...\\n",
  "...\\c\\n",
  "...Oh, that's right!\\n",
  "I am the Move Deleter!\\c$",
]

[msg.section_0.entries.1]
text = [
  "You've come to make me force your\\n",
  "Pokémon to forget some moves?$",
]

[msg.section_0.entries.2]
text = [
  "Which Pokémon should forget a move?\\c$",
]

[msg.section_0.entries.3]
text = [
  "Remember me if there are moves that\\n",
  "need to be forgotten.$",
]

[msg.section_0.entries.4]
text = [
  "That Pokémon knows only one move,\\n",
  "so it can't be forgotten...\\c$",
]

[msg.section_0.entries.5]
text = [
  "What? That's an Egg.\\n",
  "No Egg should know any moves.\\c$",
]

[msg.section_0.entries.6]
text = [
  "OK, then.\\n",
  "Which move should be forgotten?\\c$",
]

[msg.section_0.entries.7]
text = [
  "Hm! The move [VAR MOVE(0)]?\\n",
  "Should that move be forgotten?$",
]

[msg.section_0.entries.8]
text = [
  "It worked perfectly!\\c\\n",
  "Your Pokémon has forgotten the move\\n",
  "[VAR MOVE(0)] completely.$",
]


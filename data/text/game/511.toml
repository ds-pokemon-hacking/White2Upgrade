  "But [VAR PKNICK(0)] can't learn more\\n",
  "than four moves.\\c\\n",
  "Delete an existing move to make\\n",
  "room for [VAR MOVE(1)]?$",
]

[msg.section_0.entries.25]
text = [
  "1, [WAIT(20)]2, and[WAIT(20)]... [WAIT(20)]... [WAIT(20)]... Ta-da![VAR 0xBE05(3)][VAR 0xBE05(5)]\\c\\n",

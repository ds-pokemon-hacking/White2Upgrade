[msg]
trailing_data = "2a2a"

[msg.section_0.entries.0]
text = [
  "[VAR TRNAME(1)]: Come here.\\c$",
]

[msg.section_0.entries.1]
text = [
  "Wait a sec.\\c\\n",
  "He said he wants to talk to them\\n",
  "so his old allies won't get hurt.\\c$",
]

[msg.section_0.entries.2]
text = [
  "Rood: Aah! I will say it as many times\\n",
  "as it takes until you understand!\\c\\n",
  "Ghetsis's real plan was\\n",
  "to take over the Unova region!\\c\\n",
  "Liberating Pokémon was nothing\\n",
  "more than an excuse!\\c\\n",
  "If anything, it would've made\\n",
  "Pokémon suffer!\\c$",
]

[msg.section_0.entries.3]
text = [
  "Team Plasma: Uh-huh, yeah.\\n",
  "That's a pretty speech, gramps!\\c\\n",
  "You fool!\\c\\n",
  "We're not going to listen\\n",
  "to what a traitor has to say!\\c$",
]

[msg.section_0.entries.4]
text = [
  "[VAR TRNAME(1)]: Well, that didn't work...\\c$",
]

[msg.section_0.entries.5]
text = [
  "[VAR TRNAME(1)]: Hey!\\c$",
]

[msg.section_0.entries.6]
text = [
  "Let me through!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Team Plasma: What are you saying?\\n",
  "Looking to get hurt?\\c$",
]

[msg.section_0.entries.8]
text = [
  "[VAR TRNAME(1)]: I'm going to get a\\n",
  "stolen Pokémon back!\\c\\n",
  "I'm not gonna listen to villains\\n",
  "like you!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Rood!\\n",
  "Ex-Team Plasma!\\c\\n",
  "Why do you have\\n",
  "Pokémon by your sides?\\c$",
]

[msg.section_0.entries.10]
text = [
  "To protect what's important\\n",
  "to you, right?\\c\\n",
  "Even if your precious Pokémon get hurt,\\n",
  "even if your ideals are damaged,\\l\\n",
  "the time to fight is NOW!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Team Plasma: You're just a kid!\\n",
  "Quit trying to act so cool!\\c\\n",
  "Whatever! Nobody's getting\\n",
  "close to the Plasma Frigate!\\l\\n",
  "Wipe them ALL out!\\c$",
]

[msg.section_0.entries.12]
text = [
  "[VAR TRNAME(1)]: [VAR TRNAME(0)]!\\n",
  "As usual, take the other one!\\c$",
]

[msg.section_0.entries.13]
text = [
  "Team Plasma: Like he said!\\c\\n",
  "We're going to crush you\\n",
  "along with the traitors!\\c\\n",
  "Because Team Plasma exists\\n",
  "to cause trouble!\\c$",
]

[msg.section_0.entries.14]
text = [
  "Rood: Are your Pokémon OK?\\n",
  "You should take these with you!\\c$",
]

[msg.section_0.entries.15]
text = [
  "You, too.\\c$",
]

[msg.section_0.entries.16]
text = [
  "[VAR TRNAME(1)]: Thanks...\\c$",
]

[msg.section_0.entries.17]
text = [
  "I'm passing through!\\c\\n",
  "Oh, it looks like their backup\\n",
  "has arrived.\\c$",
]

[msg.section_0.entries.18]
text = [
  "Rood: At times like these,\\n",
  "those whose hearts weaken,\\l\\n",
  "those whose determination falters,\\l\\n",
  "can accomplish nothing!\\c\\n",
  "To save our old allies,\\n",
  "to protect Unova,\\l\\n",
  "we will fight!\\c$",
]

[msg.section_0.entries.19]
text = [
  "Both of you, go!\\c\\n",
  "No, just a moment...\\n",
  "[VAR TRNAME(1)], was it?\\c\\n",
  "About the Pokémon you're looking for...\\n",
  "In all likelihood, it is in the possession\\l\\n",
  "of the Shadow Triad--the dark warriors\\l\\n",
  "who appear silently.\\c$",
]

[msg.section_0.entries.20]
text = [
  "[VAR TRNAME(1)]: Got it!\\c\\n",
  "If I rescue it, that helps you guys\\n",
  "absolve your guilt, doesn't it?\\l\\n",
  "Guess I'll help you out!\\c$",
]

[msg.section_0.entries.21]
text = [
  "Rood: At that time, I believed\\n",
  "we were on the side of justice.\\c\\n",
  "By serving my king, N,\\n",
  "I was going to make a world without war.\\c\\n",
  "But I was conceited, and I couldn't\\n",
  "see the unhappiness we were causing.\\c\\n",
  "That's why I can't let it happen again!$",
]

[msg.section_0.entries.22]
text = [
  "Don't ignore Pokémon's feelings\\n",
  "and separate them from their Trainers!$",
]

[msg.section_0.entries.23]
text = [
  "Is this where you come to an\\n",
  "understanding by trading blows?\\l\\n",
  "This is what being young is, right?$",
]

[msg.section_0.entries.24]
text = [
  "That traitorous Sage!\\n",
  "I'm going to pound him into a pulp!$",
]

[msg.section_0.entries.25]
text = [
  "We're going to conquer Unova and\\n",
  "make all the Pokémon ours!\\c\\n",
  "Then our failure two years ago\\n",
  "won't matter anymore!$",
]

[msg.section_0.entries.26]
text = [
  "Oh! I can feel how strongly\\n",
  "this person feels!\\l\\n",
  "I-it's making me doubt myself!$",
]

[msg.section_0.entries.27]
text = [
  "I don't care about you at all!\\n",
  "'Cause you can't beat our boss!\\c\\n",
  "I'll stay here and pound these traitors!$",
]

[msg.section_0.entries.28]
text = [
  "We're gonna freeze Unova solid\\n",
  "and steal everyone's Pokémon!$",
]

[msg.section_0.entries.29]
text = [
  "That's what I would expect from\\n",
  "someone who binds their Pokémon\\l\\n",
  "with Poké Balls!$",
]

[msg.section_0.entries.30]
text = [
  "What you're doing now is nothing\\n",
  "more than a futile struggle!$",
]

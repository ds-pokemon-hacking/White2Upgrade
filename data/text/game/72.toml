[msg.section_0.entries.0]
text = [
  "[VAR TRNAME(1)]: Hold it!\\n",
  "What are you guys up to here anyway?\\c$",
]

[msg.section_0.entries.1]
text = [
  "Team Plasma: Nothing...\\n",
  "We're just standing here.\\c\\n",
  "So what did we do to you that\\n",
  "you're bothering us with questions?\\c$",
]

[msg.section_0.entries.2]
text = [
  "[VAR TRNAME(1)]: You didn't do anything.\\n",
  "Not to me, at least...\\c\\n",
  "But I can never forgive\\n",
  "Pokémon thieves like you!\\c\\n",
  "Just to let you know...\\c\\n",
  "You're about to feel my rage!\\c$",
]

[msg.section_0.entries.3]
text = [
  "Team Plasma: Yeesh...\\n",
  "Trainers sure are unruly these days.\\c\\n",
  "Is that it? You're mistaking your\\n",
  "Pokémon's strength for your own?\\c\\n",
  "I couldn't care less about a runt like\\n",
  "you, but I don't like being messed with!\\c$",
]

[msg.section_0.entries.4]
text = [
  "[VAR TRNAME(1)]: [VAR TRNAME(0)]!\\n",
  "Cover me!$",
]

[msg.section_0.entries.5]
text = [
  "[VAR TRNAME(1)]: [VAR TRNAME(0)]!\\n",
  "Cover me!\\c$",
]

[msg.section_0.entries.6]
text = [
  "Team Plasma: Heh heh heh!\\c\\n",
  "I stole this Pokémon two years ago,\\n",
  "and I've been training it ever since!\\l\\n",
  "It's tough!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Team Plasma: I'm next!\\c\\n",
  "I stole this Pokémon two years ago,\\n",
  "and I've been training it ever since!\\l\\n",
  "It's tough!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Team Plasma: You've got to be kidding!\\c\\n",
  "And I bullied it so much over the last\\n",
  "two years to toughen it up, too!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Team Plasma: M-me, losing in an instant?!\\n",
  "Who IS this guy?$",
]

[msg.section_0.entries.10]
text = [
  "Team Plasma: You've got some nerve\\n",
  "for a little brat!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Team Plasma: Looks like I'm up next!\\n",
  "Just to warn you, I show no mercy!\\c$",
]

[msg.section_0.entries.12]
text = [
  "Team Plasma: If we keep going like this,\\n",
  "it'll end up like it did two years ago!\\c$",
]

[msg.section_0.entries.13]
text = [
  "Team Plasma: We give up!\\n",
  "I can't believe we lost to two kids!\\c\\n",
  "Just because you're strong,\\n",
  "I'll tell you this...\\c\\n",
  "We, Team Plasma,\\n",
  "are searching for something...\\c\\n",
  "When we find it, that's when our secret\\n",
  "weapon will be able to use its true power!\\c\\n",
  "Farewell!\\c$",
]

[msg.section_0.entries.14]
text = [
  "[VAR TRNAME(1)]: Five years ago...\\c\\n",
  "Team Plasma stole\\n",
  "my little sister's Purrloin.\\l\\n",
  "It had been given to her as a present.\\c\\n",
  "I was only a little kid...\\n",
  "I couldn't do anything...\\c\\n",
  "So... So that's why I have\\n",
  "to get stronger!\\c$",
]

[msg.section_0.entries.15]
text = [
  "Good work! I knew you\\n",
  "had good instincts!\\c\\n",
  "Well then...\\c$",
]

[msg.section_0.entries.16]
text = [
  "[VAR TRNAME(1)] fully healed\\n",
  "[VAR TRNAME(0)]'s Pokémon!$",
]

[msg.section_0.entries.17]
text = [
  "[VAR TRNAME(1)]: Listen up!\\n",
  "You fill up that Pokédex.\\c\\n",
  "Keep getting stronger and stronger,\\n",
  "and back me up!\\c\\n",
  "I'll be counting on you from\\n",
  "here on out, too!\\c$",
]

[msg.section_0.entries.18]
text = [
  "I heard that in Gear Station\\n",
  "you can have Pokémon battles\\l\\n",
  "in the subway!\\c\\n",
  "So I came here to test my skills,\\n",
  "and, what do you know...\\l\\n",
  "the Subway Bosses were here!\\c\\n",
  "Isn't that amazing? I mean, they're\\n",
  "the strongest Trainers in Gear Station!\\c\\n",
  "And they said they'd battle\\n",
  "if it's two on two!\\c\\n",
  "This is an a-MAZ-ing opportunity!\\n",
  "Would you PLEASE battle with me?$",
]

[msg.section_0.entries.19]
text = [
  "Oh, I see!\\n",
  "You aren't prepared right now!\\c\\n",
  "OK, I'll stop them for now, but\\n",
  "let's battle together sometime!$",
]

[msg.section_0.entries.20]
text = [
  "You're prepared, right?\\n",
  "Will you battle alongside me?$",
]

[msg.section_0.entries.21]
text = [
  "Thanks!\\c\\n",
  "Oh! The name's Rosa!\\c\\n",
  "Let's become the best partners ever\\n",
  "and surpass the Subway Bosses!\\c$",
]

[msg.section_0.entries.22]
text = [
  "So I'll have you challenge the\\n",
  "Subway Bosses with me, then!\\c$",
]

[msg.section_0.entries.23]
text = [
  "They were so tough, even when they were\\n",
  "holding back for us!\\l\\n",
  "That's the Subway Bosses for you!\\c\\n",
  "I want to get even stronger and\\n",
  "battle the Subway Bosses when\\l\\n",
  "they're giving it their all!\\c\\n",
  "Thanks, [VAR TRNAME(0)]!\\n",
  "This is a token of my appreciation!\\l\\n",
  "Please take it!\\c$",
]

[msg.section_0.entries.24]
text = [

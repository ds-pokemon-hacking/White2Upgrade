[msg.section_0.entries.0]
text = [
  "A mysterious presence can be felt here!\\n",
  "Check the surrounding area?$",
]

[msg.section_0.entries.1]
text = [
  "Kyouuuun!$",
]

[msg.section_0.entries.2]
text = [
  "Uxie went flying off somewhere...$",
]

[msg.section_0.entries.3]
text = [
  "These old textile storehouses\\n",
  "are being reused as studios.\\c\\n",
  "How innovative!\\c\\n",
  "New ideas create new values, don't they!$",
]

[msg.section_0.entries.4]
text = [
  "Hey, Trainer! Step inside for a moment!$",
]

[msg.section_0.entries.5]
text = [
  "You see, I believed it would become\\n",
  "popular because it was a storehouse!$",
]

[msg.section_0.entries.6]
text = [
  "The rail line was abandoned, and\\n",
  "the storehouses went unused...\\c\\n",
  "Then young people with artistic\\n",
  "aspirations started renting them\\l\\n",
  "cheaply as art studios.\\c\\n",
  "If people hadn't been so creative,\\n",
  "Pokémon might be living here now.$",
]

[msg.section_0.entries.7]
text = [
  "My accordion's heavy!\\n",
  "It weighs over 20 pounds.$",
]

[msg.section_0.entries.8]
text = [
  "What do you call a storehouse\\n",
  "you can't find? A where-house!$",
]

[msg.section_0.entries.9]
text = [
  "How many houses could a warehouse\\n",
  "wear if a warehouse could wear houses?$",
]

[msg.section_0.entries.10]
text = [
  "I heard there's a café in [VAR 0x0139(0)]\\n",
  "where Pokémon can eat!\\c\\n",
  "Maybe I should go try it and see how it\\n",
  "compares to Café Warehouse!$",
]

[msg.section_0.entries.11]
text = [
  "Nacrene City\\n",
  "A Pearl of a Place$",
]

[msg.section_0.entries.12]
text = [
  "Café Warehouse\\c\\n",
  "\\n",
  "Try our delicious specials\\n",
  "on Wednesdays and Saturdays!$",
]

[msg.section_0.entries.13]
text = [
  "Nacrene Museum$",
]

[msg.section_0.entries.14]
text = [
  "Nacrene Museum\\n",
  "Exhibit Schedule$",
]

[msg.section_0.entries.15]
text = [
  "Special Exhibit\\n",
  "That Pokémon's dormant form!$",
]

[msg.section_0.entries.16]
text = [
  "Walking on abandoned railroad tracks...\\n",
  "Everyone does it sometimes, right?$",
]

[msg.section_0.entries.17]
text = [
  "I was just collecting the Pokémon\\n",
  "I like, and before I knew it, I had six!$",
]

[msg.section_0.entries.18]
text = [
  "The one trying to draw\\n",
  "Smeargle's move Sketch is me!$",
]

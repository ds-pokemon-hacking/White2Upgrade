[msg]
trailing_data = "ecec"

[msg.section_0.entries.0]
text = [
  "Good work back there in the sewers.\\c\\n",
  "My Bug-type Pokémon have been scurrying\\n",
  "with excitement about getting to\\l\\n",
  "battle you.\\c\\n",
  "I'd say my Bug-type Pokémon are\\n",
  "pretty great!\\l\\n",
  "C'mon, let me brag a little!\\c\\n",
  "Dwebble's round little eyes are cute!\\n",
  "It's resilient and reliable!\\c\\n",
  "My ace is Leavanny!\\n",
  "It's really the best!\\c\\n",
  "I think it's so sweet how it makes clothes\\n",
  "for other Pokémon out of leaves.\\c\\n",
  "Of course, I'm really proud\\n",
  "of all of my Pokémon!\\c\\n",
  "Well now...\\n",
  "Let's get right to it!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Oh hoo...\\n",
  "You are very strong indeed!\\c\\n",
  "I guess it's no surprise I lost.\\c\\n",
  "Here! Take this Insect Badge!\\n",
  "I think it'll suit you!\\c$",
]

[msg.section_0.entries.2]
text = [
  "[VAR TRNAME(0)] received the\\n",
  "Insect Badge from Burgh.\\c$",
]

[msg.section_0.entries.3]
text = [
  "Ooh! The Insect Badge suits you even\\n",
  "better than I thought it would!\\c\\n",
  "If you have three Badges,\\n",
  "Pokémon up to Lv. 40 will obey you,\\l\\n",
  "including traded Pokémon.\\c\\n",
  "And, uh, you know what,\\n",
  "I'll also give you this.\\c$",
]

[msg.section_0.entries.4]
text = [
  "Struggle Bug also lowers the\\n",
  "Sp. Atk of the target that was damaged.\\c\\n",
  "I'm the best guy to tell you this.\\n",
  "It's the little things that count!$",
]

[msg.section_0.entries.5]
text = [
  "How many discoveries have you made\\n",
  "since you started your adventure?\\c\\n",
  "When I was a kid, my innocent heart was\\n",
  "captured by the beauty of\\l\\n",
  "Bug-type Pokémon.\\c\\n",
  "I drew with them and battled with them,\\n",
  "and after all this time, I continue\\l\\n",
  "to discover new things.\\c\\n",
  "A world shared with Pokémon is a world\\n",
  "swarming with mysteries.$",
]

[msg.section_0.entries.6]
text = [
  "Burgh: Hello!\\n",
  "How have you been?\\c\\n",
  "So, now I'm working on\\n",
  "a piece with a Pokémon motif!\\l\\n",
  "Well, I always do that, really.\\c\\n",
  "Every now and then, I get artist's block.\\n",
  "But when I look at my Pokémon...\\c\\n",
  "I get filled with the urge to\\n",
  "draw, and I can't stop!$",
]

[msg.section_0.entries.0]
text = [
  "Welcome to Café Warehouse,\\n",
  "a stylish café in a rural area!$",
]

[msg.section_0.entries.1]
text = [
  "Welcome to Café Warehouse,\\n",
  "a stylish café in a rural area!\\c\\n",
  "Our café has a special on Wednesdays!\\n",
  "Here, have a Soda Pop!\\c\\n",
  "Enjoy the taste of our specialty!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Enjoy the taste of our specialty!$",
]

[msg.section_0.entries.3]
text = [
  "Welcome to Café Warehouse,\\n",
  "the stylish café in the country!\\c\\n",
  "We have a special on Saturdays!\\n",
  "Have a complimentary Lemonade!\\c\\n",
  "We're really proud of our original recipe!\\c$",
]

[msg.section_0.entries.4]
text = [
  "This café has a special on\\n",
  "Wednesdays and Saturdays!$",
]

[msg.section_0.entries.5]
text = [
  "I found a handkerchief.\\n",
  "I think one of our regulars dropped it.\\c\\n",
  "I think that the customer had a brown\\n",
  "Pokémon that can use Super Fang...\\c\\n",
  "I'm the kind of person who instantly\\n",
  "forgets about these kinds of things...\\c\\n",
  "If you don't mind, would you look\\n",
  "for the owner of this handkerchief?$",
]

[msg.section_0.entries.6]
text = [
  "Thank you!\\n",
  "I'll let you hang on to it.\\c\\n",
  "Every day, we get a lot of different\\n",
  "customers, so all ya gotta do is ask 'em!$",
]

[msg.section_0.entries.7]
text = [
  "Sniff...\\c\\n",
  "I sure want to give this forgotten\\n",
  "handkerchief back to its owner...$",
]

[msg.section_0.entries.8]
text = [
  "I think it might have been the customer\\n",
  "who had a brown Pokémon\\l\\n",
  "that can use Super Fang...$",
]

[msg.section_0.entries.9]
text = [
  "What? You found the customer\\n",
  "who lost his handkerchief?!\\c\\n",
  "It was the person with Patrat, you say?\\n",
  "What a relief. Thank you so much!\\c\\n",
  "Here, this is for you!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Work is so much fun!\\c\\n",
  "I mean, I get to meet so many\\n",
  "people and Pokémon!$",
]

[msg.section_0.entries.11]
text = [
  "It's Monday! I'm drinking a Moomoo Milk\\n",
  "to get myself stoked up for the week!\\c\\n",
  "It makes me feel like Krokorok and I\\n",
  "are both ready to take on another week!$",
]

[msg.section_0.entries.12]
text = [
  "Hm? Did I lose something?\\n",
  "No, I don't think so...\\c\\n",
  "I bet it was a customer on another day.$",
]

[msg.section_0.entries.13]
text = [
  "I always come here to relax with Lillipup\\n",
  "and look at lovely Fossils in the museum.\\c\\n",
  "By the way, my little Lillipup's\\n",
  "specialty is Roar.$",
]

[msg.section_0.entries.14]
text = [
  "What? No, I haven't lost anything.\\c\\n",
  "My sweet Lillipup can't use\\n",
  "Super Fang, either.\\c\\n",
  "Perhaps it was another customer.\\c\\n",
  "Many people come to this café only\\n",
  "on a certain day.$",
]

[msg.section_0.entries.15]
text = [
  "Don't you think my Munna would\\n",
  "be a superstar if it was in\\l\\n",
  "a Pokémon Musical?\\c\\n",
  "It's on the path to success, just like\\n",
  "me and my career as a Pokémon Trainer!$",
]

[msg.section_0.entries.16]
text = [
  "You're looking for someone\\n",
  "who lost something? Aren't you nice?\\c\\n",
  "Munna isn't brown, though,\\n",
  "so it must be a different customer.\\c\\n",
  "I think I might have seen someone with a\\n",
  "brown Pokémon on Thursday...$",
]

[msg.section_0.entries.17]
text = [
  "I always come to Café Warehouse\\n",
  "to relax after Patrat and I go\\l\\n",
  "for a jog in Pinwheel Forest.\\c\\n",
  "Getting a refreshing drink after\\n",
  "exercising is just the best! Right?$",
]

[msg.section_0.entries.18]
text = [
  "Huh?\\n",
  "Did I lose something?\\c\\n",
  "Hey! That handkerchief!\\n",
  "It's mine!\\c$",
]

[msg.section_0.entries.19]
text = [
  "[VAR TRNAME(0)]\\n",
  "handed over the Grubby Hanky!$",
]

[msg.section_0.entries.20]
text = [
  "Thank you so much for\\n",
  "finding that for me!\\c\\n",
  "I need that handkerchief so I can wipe\\n",
  "Patrat's cheeks after it eats Berries.$",
]

[msg.section_0.entries.21]
text = [
  "Wa ha ha! My Watchog has nice fur!\\n",
  "Doesn't it look impressive?\\c\\n",
  "I always come here to Café Warehouse\\n",
  "every week and brag myself silly about it!\\c\\n",
  "Its Super Fang is super cool!$",
]

[msg.section_0.entries.22]
text = [
  "I haven't lost anything.\\n",
  "Watchog doesn't let anything get by it!\\c\\n",
  "I'm sure whatever it is belongs\\n",
  "to some other customer.$",
]

[msg.section_0.entries.23]
text = [
  "Taking it easy in the café on weekends\\n",
  "makes me forget the stress of workdays.$",
]

[msg.section_0.entries.24]
text = [
  "My! That handkerchief looks just like\\n",
  "mine, but it belongs to someone else.\\c\\n",
  "It does have a certain, hmm, ah,\\n",
  "je ne sais quoi about it.\\c\\n",
  "What's with that look?\\c\\n",
  "OK. OK. It smells like a Patrat.$",
]

[msg.section_0.entries.25]
text = [
  "Sei jii!$",
]

[msg.section_0.entries.26]
text = [
  "Bwaa!$",
]

[msg.section_0.entries.27]
text = [
  "Yap, yap! ♪$",
]

[msg.section_0.entries.28]
text = [
  "Muuuuuuuuuun!$",
]

[msg.section_0.entries.29]
text = [
  "Kee keeh!$",
]

[msg.section_0.entries.30]
text = [
  "Waach-ch-ch!$",
]

[msg.section_0.entries.31]
text = [
  "Skraaa!$",
]

[msg.section_0.entries.32]
text = [
  "Some things may be famous and good,\\n",
  "but some good things aren't famous.\\c\\n",
  "What matters is whether you like them.\\n",
  "Don't you agree?$",
]

[msg.section_0.entries.33]
text = [
  "I've been getting really, really heavy,\\n",
  "but I just can't stop getting seconds.\\c\\n",
  "Who was it?\\n",
  "Who used the move Encore on me?!$",
]

[msg.section_0.entries.34]
text = [
  "I like Nacrene's Café Warehouse\\n",
  "and Striaton's restaurant, too.\\c\\n",
  "Each offers such different flavors!$",
]

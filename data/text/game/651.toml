[msg.section_0.entries.0]
text = [
  "Alder: Oh, that's right! [VAR TRNAME(0)],\\n",
  "are your Pokémon well?\\c\\n",
  "Your Pokémon are always doing\\n",
  "their best for you, the Trainer,\\l\\n",
  "so you must always be kind to them!\\c$",
]

[msg.section_0.entries.1]
text = [
  "My house is just a little farther!\\c\\n",
  "Stop by the Pokémon Center\\n",
  "first if you'd like!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Alder: Hey, this way!\\n",
  "Shall we start training?\\c$",
]

[msg.section_0.entries.3]
text = [
  "By the way...why are you\\n",
  "holding two Town Maps?\\c\\n",
  "...\\c$",
]

[msg.section_0.entries.4]
text = [
  "Oh ho!\\n",
  "It's your friend's Town Map, is it?\\c$",
]

[msg.section_0.entries.5]
text = [
  "Your friend is the one with\\n",
  "the [VAR PKNAME(0)], isn't he?\\c\\n",
  "It just so happens, he was training\\n",
  "his Pokémon on Route 20...\\c\\n",
  "Well, if that's the case, you should\\n",
  "go give him the Town Map first!\\c$",
]

[msg.section_0.entries.6]
text = [
  "Just follow this road.\\n",
  "It goes to Route 20!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Just follow this road.\\n",
  "It goes right to Route 20!\\c\\n",
  "I'll be waiting here until you\\n",
  "deliver the Town Map!$",
]

[msg.section_0.entries.8]
text = [
  "Alder: Oh! It looks like you've\\n",
  "delivered the Town Map to your friend!\\c\\n",
  "Hrm...\\c\\n",
  "You were only gone a moment,\\n",
  "but you and your Pokémon have grown.\\c\\n",
  "Why, I could almost mistake you\\n",
  "for someone else!\\c\\n",
  "Well then. Instead of training you,\\n",
  "I would like you and your Pokémon\\l\\n",
  "to give me a hand!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Alder: [VAR TRNAME(0)]!\\c\\n",
  "You know the Trainers' School\\n",
  "and Pokémon Gym that\\l\\n",
  "were just built in Aspertia?\\c\\n",
  "I received notice that\\n",
  "the Gym Leader has arrived!\\c\\n",
  "So I have some advice for you.\\c\\n",
  "If you want to see how much\\n",
  "you understand your partners,\\l\\n",
  "your Pokémon, then you should\\l\\n",
  "challenge the Gym Leader!\\c$",
]

[msg.section_0.entries.10]
text = [
  "In the morning, my Pokémon come\\n",
  "to wake me up when they're hungry.\\c\\n",
  "At night, my Pokémon get tired\\n",
  "from playing and take up the whole bed!\\c\\n",
  "Oh! It fills me with so much joy!$",
]

[msg.section_0.entries.11]
text = [
  "You see, in Floccesy Ranch,\\n",
  "wild Pokémon might surprise you!\\c\\n",
  "At times like that, only your\\n",
  "own Pokémon can help you out!$",
]

[msg.section_0.entries.12]
text = [
  "I always save a record of my adventure,\\n",
  "so I don't forget what I've done so far!\\l\\n",
  "It's a good idea for any Trainer!$",
]

[msg.section_0.entries.13]
text = [
  "People always think the past\\n",
  "or the future would be so wonderful.\\c\\n",
  "But the great time we're\\n",
  "spending with Pokémon\\l\\n",
  "is right now!$",
]

[msg.section_0.entries.14]
text = [
  "Want to know what Alder taught me?$",
]

[msg.section_0.entries.15]
text = [
  "He said the Pokémon you throw out at\\n",
  "the start of battle is the one\\l\\n",
  "in the upper-left slot in your party!\\c\\n",
  "That's why I put a Pokémon I want\\n",
  "to make stronger or a Pokémon that's\\l\\n",
  "already tough in that spot!$",
]

[msg.section_0.entries.16]
text = [
  "You're being too bashful!\\n",
  "It's a good opportunity! Ask away!$",
]

[msg.section_0.entries.17]
text = [
  "Are you happy you're\\n",
  "able to train Pokémon?$",
]

[msg.section_0.entries.18]
text = [
  "Right?!\\n",
  "Me too!$",
]

[msg.section_0.entries.19]
text = [
  "Huh? But you're traveling\\n",
  "with Pokémon!$",
]

[msg.section_0.entries.20]
text = [
  "Floccesy Town\\n",
  "Prophecy Flocks Here$",
]

[msg.section_0.entries.21]
text = [
  "It's an old clock tower...$",
]

[msg.section_0.entries.22]
text = [
  "Bianca: Heeey!\\c$",
]

[msg.section_0.entries.23]
text = [
  "Bianca: Hey there!\\c$",
]

[msg.section_0.entries.24]
text = [
  "I'm sorry!\\c\\n",
  "I forgot to upgrade the Pokédex\\n",
  "that I gave you!\\c\\n",
  "I'm going to add the Habitat List!\\n",
  "It's an amazing feature!\\c\\n",
  "I'm just going to borrow your\\n",
  "Pokédex for a second!\\c$",
]

[msg.section_0.entries.25]
text = [
  "[VAR TRNAME(0)]'s Pokédex\\n",
  "was upgraded!$",
]

[msg.section_0.entries.26]
text = [
  "With the Habitat List, you can check\\n",
  "which Pokémon are in the area!\\c\\n",
  "It's a mode in the Pokédex!\\c$",
]

[msg.section_0.entries.27]
text = [
  "To use it, open up the Pokédex\\n",
  "and tap the Habitat List button\\l\\n",
  "on the lower left of the Touch Screen!\\c\\n",
  "Next, pick the area you want to see!\\c\\n",
  "You can see all the Pokémon that live in\\n",
  "that area. It even tells you which ones\\l\\n",
  "you've already caught!\\c\\n",
  "Would you like to hear\\n",
  "my explanation again?$",
]

[msg.section_0.entries.28]
text = [
  "I have a tip for you!\\c\\n",
  "When you're walking down\\n",
  "a path, you'll sometimes see\\l\\n",
  "rustling grass!\\l\\n",
  "If you go to that spot...\\c\\n",
  "Well, I'll let the rest\\n",
  "be a surprise!\\c$",
]

[msg.section_0.entries.29]
text = [
  "Filling up the Pokédex will\\n",
  "make your world bigger!\\c\\n",
  "So go to many different places\\n",
  "and meet many different Pokémon, OK?\\c\\n",
  "See you!\\c$",
]

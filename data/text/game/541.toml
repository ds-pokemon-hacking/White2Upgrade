text = [
  "I'm a heartbreaker...\\n",
  "My name... Charles.\\c\\n",
  "Riding a bike and becoming the wind fits a\\n",
  "bad boy like me.\\c$",
]

[msg.section_0.entries.20]
text = [
  "Am I going to lose to the heartbreaker?\\n",
  "I have a girlfriend!$",
]

[msg.section_0.entries.21]
text = [
  "You have four Gym Badges...\\n",
  "You might be able to defeat Charles!\\c\\n",
  "Please beat him for me!$",
]

[msg.section_0.entries.22]
text = [
  "Because it's a battle, one person has\\n",
  "to win and one person has to lose.\\c\\n",
  "I wish my boyfriend could just enjoy\\n",
  "the battle and not worry about losing.\\l\\n",
  "Sometimes he gets too serious.$",
]

[msg.section_0.entries.23]
text = [
  "There seems to be a lot to think about,\\n",
  "but it looks really fun!$",
]

[msg.section_0.entries.24]
text = [
  "Battling with three Pokémon.\\n",
  "That itself makes me very excited!$",
]

[msg.section_0.entries.25]
text = [
  "Triple Battle and\\n",
  "Rotation Battle...\\c\\n",
  "There are various styles of\\n",
  "Pokémon battling.$",
]

[msg.section_0.entries.26]
text = [
  "The Trainer called Charles\\n",
  "is quite tough to beat.\\c\\n",
  "If you have four Gym Badges,\\n",
  "you might be a match for him.$",
]

[msg.section_0.entries.27]
text = [
  "There are so many different Pokémon,\\n",
  "it's difficult to decide which ones\\l\\n",
  "to battle with.$",
]

[msg.section_0.entries.28]
text = [
  "There are a lot of Pokémon.\\n",
  "So I like this!$",
]

[msg.section_0.entries.29]
text = [
  "Looking at this kind of battle\\n",
  "makes me curious about the\\l\\n",
  "Pokémon World Tournament.\\l\\n",
  "I hear it will be held in Driftveil City.$",
]

[msg.section_0.entries.30]
text = [
  "Hi, Trainer! Will you buy the Berries\\n",
  "I gathered?\\c\\n",
  "Five [VAR ITEM2(0)] for just \\$200!\\n",
  "You want them. You'll buy them, right?$",
]

[msg.section_0.entries.31]
text = [
  "Boo!\\n",
  "And I went to all that trouble\\l\\n",
  "to gather Berries.$",
]

[msg.section_0.entries.32]
text = [
  "Five [VAR ITEM2(0)] for \\$200!\\n",
  "You're a smart shopper!\\c$",
]

[msg.section_0.entries.33]
text = [
  "Oh! But your Bag is full!$",
]

[msg.section_0.entries.34]
text = [
  "Oh! But you don't have enough money.$",
]

[msg.section_0.entries.35]
text = [
  "I'll keep gathering Berries. Come back\\n",
  "tomorrow if you want more!$",
]

[msg.section_0.entries.36]
text = [
  "I'll sell you five [VAR ITEM2(0)]\\n",
  "for just \\$200.\\l\\n",
  "You want them. You'll buy them, right?$",
]

[msg.section_0.entries.37]
text = [
  "The drawbridge goes up\\n",
  "when a ship needs to pass.\\c\\n",
  "Then, the Pokémon that are resting\\n",
  "on the bridge fly away all at once!$",
]

[msg.section_0.entries.38]
text = [
  "Hum fiercely! My battle song!\\n",
  "Battle fiercely! My Pokémon!\\c\\n",
  "Huh?\\n",
  "You don't have a Prop Case, do you?\\l\\n",
  "Then I won't battle you!$",
]

[msg.section_0.entries.39]
text = [
  "Hum fiercely! My battle song!\\n",
  "Battle fiercely! My Pokémon!\\c$",
]

[msg.section_0.entries.40]
text = [
  "In battling you, I came to understand...\\c\\n",
  "You're the best!\\n",
  "Here! This is for you!\\c$",
]

[msg.section_0.entries.41]
text = [
  "If you want your Pokémon to\\n",
  "hold this Electric Guitar,\\l\\n",
  "go to the Musical Theater!\\l\\n",
  "Cooler than cool!$",
]

[msg.section_0.entries.42]
text = [
  "In battling you, I came to understand...\\c\\n",
  "You're the best!\\c\\n",
  "After all, you have the\\n",
  "Electric Guitar Prop!$",
]

[msg.section_0.entries.43]
text = [
  "In hot summer, I want to cool down\\n",
  "with Water-type Pokémon.\\c\\n",
  "On the other hand, in cold winter,\\n",
  "I want to warm up with Fire-type Pokémon.$",
]

[msg.section_0.entries.44]
text = [
  "A Pokémon you are proud of\\n",
  "wins with your favorite move!\\c\\n",
  "That's when a Trainer definitely smiles.$",
]

[msg.section_0.entries.45]
text = [
  "Bianca: Heeey!$",
]

[msg.section_0.entries.46]
text = [
  "Bianca: Hey!$",
]

[msg.section_0.entries.47]
text = [
  "Nice timing!\\n",
  "I was wanting to give you this!$",
]

[msg.section_0.entries.48]
text = [
  "Ta-da!\\c\\n",
  "It's a Hidden Machine, Fly!\\c\\n",
  "When you use this move outside of battle,\\n",
  "you can go to places you want to go,\\l\\n",
  "like a Pokémon Center.\\c\\n",
  "By the way, [VAR TRNAME(0)],\\n",
  "do you know about Hidden Grottoes?$",
]

[msg.section_0.entries.49]
text = [
  "Ta-da!\\c\\n",
  "It's a Hidden Machine, Fly!\\c\\n",
  "When you use this move outside of battle,\\n",
  "you can go to places you want to go,\\l\\n",
  "like a Pokémon Center.\\c\\n",
  "By the way, [VAR TRNAME(0)],\\n",
  "do you know about Hidden Grottoes?$",
]

[msg.section_0.entries.50]
text = [
  "Great!\\n",
  "You might find one soon!\\c$",
]

[msg.section_0.entries.51]
text = [
  "OK! Then I'll explain!\\c\\n",
  "Sometimes you can find a grotto\\n",
  "among trees where Pokémon\\l\\n",
  "like to hide.\\c\\n",
  "That place is called a Hidden Grotto.\\n",
  "Makes sense, right?\\c$",
]

[msg.section_0.entries.52]
text = [
  "Wait!\\c\\n",
  "...\\c$",
]

[msg.section_0.entries.53]
text = [
  "Over there!\\c\\n",
  "I heard something from that direction!\\c\\n",
  "I have good ears.\\n",
  "Hey! Come with me!\\c$",
]

[msg.section_0.entries.54]
text = [
  "The sound is coming from\\n",
  "somewhere around here.\\c$",
]

[msg.section_0.entries.55]
text = [
  "Wow! Here it is!\\c\\n",
  "There's a gap, and it looks like\\n",
  "we can fit through!\\c\\n",
  "C'mon! Let's go have a look!\\c$",
]

[msg.section_0.entries.56]
text = [
  "Look!\\n",
  "You've found a narrow path!\\c\\n",
  "Will you follow it?$",
]

[msg.section_0.entries.57]
text = [
  "This is too good to pass up! Let's go in!\\c$",
]

[msg.section_0.entries.58]
text = [
  "Route 5\\n",
  "Performer Street$",
]

[msg.section_0.entries.59]
text = [
  "Driftveil Drawbridge$",
]

[msg.section_0.entries.60]
text = [
  "Trainer Tips!\\c\\n",
  "\\n",
  "There are different Cases\\n",
  "for each type of item.\\c\\n",
  "Items are placed automatically in\\n",
  "the correct Case by their type.\\c\\n",
  "The name of the Case tells you\\n",
  "what type of items will be kept there.\\c\\n",
  "Also, you can place anything in\\n",
  "Free Space, no matter what it is.\\c\\n",
  "So you can keep items you often use\\n",
  "in one place.$",
]

[msg.section_0.entries.61]
text = [
  "Cheren: I heard that you met\\n",
  "a Pokémon Trainer called N.\\c\\n",
  "That's not really why I'm here, though.\\n",
  "Will you battle me?$",
]

[msg.section_0.entries.62]
text = [
  "Cheren: There's something I want\\n",
  "to check by having a battle with you.\\c\\n",
  "How about it?$",
]

[msg.section_0.entries.63]
text = [
  "You remind me of [VAR TRNAME(1)].\\n",
  "That makes me excited about\\l\\n",
  "this Pokémon battle!\\c$",
]

[msg.section_0.entries.64]
text = [
  "Not interested?\\c\\n",
  "Well, I'll be here, so when you change\\n",
  "your mind, please come battle me.$",
]

[msg.section_0.entries.65]
text = [
  "I talked with [VAR TRNAME(1)] here before.\\c\\n",
  "We all have our own brand of strength,\\n",
  "people and Pokémon both.\\c\\n",
  "The strength to make our dreams\\n",
  "a reality, the strength to protect\\l\\n",
  "what we hold most dear...\\l\\n",
  "That's what I said.\\c$",
]

[msg.section_0.entries.66]
text = [
  "I was thinking about how I hope N can see\\n",
  "the same thing...but during our battle,\\l\\n",
  "I came to understand something.\\c\\n",
  "During his journey, N also saw\\n",
  "what we saw.\\c\\n",
  "If I tell this story, [VAR TRNAME(1)]\\n",
  "will probably be happy.\\c\\n",
  "Thank you!\\c$",
]

[msg.section_0.entries.67]
text = [
  "You were great!\\c\\n",
  "Charles, too.\\n",
  "He was great to some extent, I guess!\\c$",
]

[msg.section_0.entries.68]
text = [
  "Three Pokémon!$",
]

[msg.section_0.entries.69]
text = [
  "Love!$",
]

[msg.section_0.entries.70]
text = [
  "Good, good, good.$",
]

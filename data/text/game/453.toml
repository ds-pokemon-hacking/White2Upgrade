[msg.section_0.entries.0]
text = [
  "N: [SPEED(1)]This place...\\n",
  "was my entire world...[SPEED(0)]\\c$",
]

[msg.section_0.entries.1]
text = [
  "[SPEED(1)]When I was little, I was abandoned\\n",
  "deep in the woods.\\c\\n",
  "The ones who took me in and raised me\\n",
  "were the Pokémon who lived there.[SPEED(0)]\\c$",
]

[msg.section_0.entries.2]
text = [
  "[SPEED(1)]Then, one day, a man appeared\\n",
  "before me, claiming to be my father.\\c\\n",
  "That...was Ghetsis.[SPEED(0)]\\c$",
]

[msg.section_0.entries.3]
text = [
  "[SPEED(1)]The things he gave me were...\\n",
  "the name “Harmonia\\\"...\\c\\n",
  "the knowledge a king would need...\\c\\n",
  "Pokémon with their hearts shut so very\\n",
  "tightly I couldn't even talk to them...\\c\\n",
  "and this room...[SPEED(0)]\\c$",
]

[msg.section_0.entries.4]
text = [
  "[SPEED(1)]I'll be outside...[SPEED(0)]\\c$",
]

[msg.section_0.entries.5]
text = [
  "It's a slightly dirty basketball.\\n",
  "The name “Harmonia\\\" is written on it.$",
]

[msg.section_0.entries.6]
text = [
  "It's a home-style basketball hoop.\\n",
  "It's been knocked over.$",
]

[msg.section_0.entries.7]
text = [
  "It's a toy box, but its contents\\n",
  "have spilled out.$",
]

[msg.section_0.entries.8]
text = [
  "The rubber of these wheels\\n",
  "has rotted away.$",
]

[msg.section_0.entries.9]
text = [
  "A halfpipe for skateboards...\\c\\n",
  "It has Pokémon scratch marks\\n",
  "on it here and there...$",
]

[msg.section_0.entries.10]
text = [
  "An art panel with a\\n",
  "printed geometric pattern.$",
]

[msg.section_0.entries.11]
text = [
  "This panel has a dart stuck in it.$",
]

[msg.section_0.entries.12]
text = [
  "It's a set of trains and tracks.\\n",
  "It hasn't been touched in a long time.$",
]

[msg.section_0.entries.13]
text = [
  "This toy box has been tipped over.$",
]

[msg.section_0.entries.0]
text = [
  "In the Unova region, you see,\\n",
  "there's a Pokémon called Thundurus\\l\\n",
  "that causes thunder, and another called\\l\\n",
  "Tornadus that causes heavy rain.\\c\\n",
  "They fly around the region lettin' wild\\n",
  "winds loose while the rain pounds and\\l\\n",
  "the lightnin' crashes.\\c\\n",
  "They ruin the crops I work so hard\\n",
  "to raise.$",
]

[msg.section_0.entries.1]
text = [
  "Long ago, I was a sharp-lookin' young\\n",
  "man, and my wife was a fine-lookin' girl.\\l\\n",
  "This is a story from way back then.\\c\\n",
  "Right around here, a certain Pokémon\\n",
  "taught Tornadus and Thundurus a lesson.\\c\\n",
  "For about 30 years after that, those\\n",
  "two Pokémon kept it calm and quiet.\\c$",
]

[msg.section_0.entries.2]
text = [
  "Those two Pokémon were quieted\\n",
  "by a Pokémon known as Landorus.\\c\\n",
  "I remember hearin' that there's a\\n",
  "shrine built in honor of Landorus\\l\\n",
  "somewhere on Route 14.$",
]

[msg.section_0.entries.3]
text = [
  "Long ago, I was a sharp-lookin' young\\n",
  "man, and my wife was a fine-lookin' girl.\\l\\n",
  "This is a story from way back then.\\c\\n",
  "Right around here, a certain Pokémon\\n",
  "taught Tornadus and Thundurus a lesson.\\c\\n",
  "For about 30 years after that, those\\n",
  "two Pokémon kept it calm and quiet.\\c$",
]

[msg.section_0.entries.4]
text = [
  "I'll show them to you.\\n",
  "This is Tornadus.\\c$",
]

[msg.section_0.entries.5]
text = [
  "And this is Thundurus!\\c$",
]

[msg.section_0.entries.6]
text = [
  "Tornadus and Thundurus have been\\n",
  "registered in the Pokédex.$",
]

[msg.section_0.entries.7]
text = [
  "The Pokémon who quieted the others\\n",
  "is known as Landorus.\\c\\n",
  "Feast yer eyes!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Landorus has been registered\\n",
  "in the Pokédex.$",
]

[msg.section_0.entries.9]
text = [
  "Oh, dear. Your Pokémon team...\\n",
  "It seems a bit sluggish.\\c\\n",
  "Rest for just a moment now!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Walking on the raised walkways is\\n",
  "more tiring than you think, right?$",
]

[msg.section_0.entries.11]
text = [
  "I saw them!\\c\\n",
  "Their appearances were totally\\n",
  "different, but they must be Landorus,\\l\\n",
  "Tornadus, and Thundurus!$",
]

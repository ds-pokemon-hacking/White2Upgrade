[msg]
trailing_data = "9c9c"

[msg.section_0.entries.0]
text = [
  "Gurooooohhh!$",
]

[msg.section_0.entries.1]
text = [
  "Terrakion ran away past\\n",
  "the end of the route...$",
]

[msg.section_0.entries.2]
text = [
  "The one radiating such a\\n",
  "tremendous presence before you\\l\\n",
  "is none other than Terrakion!\\c$",
]

[msg.section_0.entries.3]
text = [
  "Colress: It's been a long time.\\c\\n",
  "Terrakion is one of the three Pokémon\\n",
  "who protected Pokémon from\\l\\n",
  "the flames of a human conflict!\\c$",
]

[msg.section_0.entries.4]
text = [
  "It seems likely that Terrakion has\\n",
  "picked up the scent of danger that\\l\\n",
  "emanates from Team Plasma.\\c\\n",
  "It's probably seeking a Pokémon\\n",
  "Trainer who has the strength\\l\\n",
  "to stand up to them.\\c$",
]

[msg.section_0.entries.5]
text = [
  "It's very interesting indeed that\\n",
  "Terrakion appeared before you!\\c\\n",
  "That aside, do you plan\\n",
  "to confront Team Plasma?\\c$",
]

[msg.section_0.entries.6]
text = [
  "I see. If that's the case,\\n",
  "you must have the power to protect\\l\\n",
  "your own Pokémon!\\c\\n",
  "Being protected by Pokémon\\n",
  "alone doesn't make you a Trainer!\\c\\n",
  "It's because Trainers are strong,\\n",
  "because they care about their Pokémon,\\l\\n",
  "that these Pokémon can also be strong!\\c\\n",
  "Here!\\n",
  "This is from me!\\c$",
]

[msg.section_0.entries.7]
text = [
  "I see!\\n",
  "That works as well.\\c\\n",
  "You and your Pokémon\\n",
  "can proceed down your own path!\\c\\n",
  "What you should do is care\\n",
  "about your Pokémon to bring out\\l\\n",
  "their power to its fullest potential!\\c\\n",
  "Here!\\n",
  "This is from me!\\c$",
]

[msg.section_0.entries.8]
text = [
  "This is a prototype of my device\\n",
  "that energizes Pokémon!\\c\\n",
  "It doesn't work on battling Pokémon,\\n",
  "but you may find it useful for something!\\c\\n",
  "Well then, I wish you and your Pokémon\\n",
  "a safe journey!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Now that I think about it!\\c\\n",
  "In the Seaside Cave on Route 21,\\n",
  "I saw something that reminded\\l\\n",
  "me of when we met on Route 4.\\c$",
]

[msg.section_0.entries.10]
text = [
  "Route 22$",
]

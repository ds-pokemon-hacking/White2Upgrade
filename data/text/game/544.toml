[msg]
trailing_data = "d6d6"

[msg.section_0.entries.0]
text = [
  "Cheren: No one really talks about it, but\\n",
  "the record shows that there was a\\l\\n",
  "sudden drop in temperature near\\l\\n",
  "Lacunosa Town.\\c\\n",
  "It was only for a moment, but it went\\n",
  "down as low as -58° F.\\c$",
]

[msg.section_0.entries.1]
text = [
  "Not only that, but similar temperatures\\n",
  "were recorded around Castelia City\\l\\n",
  "and Driftveil City.\\c$",
]

[msg.section_0.entries.2]
text = [
  "On top of that, that incident with\\n",
  "Team Plasma!\\c\\n",
  "I think this needs some investigation\\n",
  "before things go bad.\\c\\n",
  "I hate cold weather, though.\\c$",
]

[msg.section_0.entries.3]
text = [
  "I'll give you this...\\c\\n",
  "It's a Hidden Machine that contains Surf.\\n",
  "With this, please go to different places\\l\\n",
  "and check what's going on.\\c\\n",
  "Let one of your Pokémon learn Surf,\\n",
  "and you can travel across the water.\\c$",
]

[msg.section_0.entries.4]
text = [
  "Sorry to have slowed you down.\\c\\n",
  "Some strange things may be happening,\\n",
  "so be careful on your journey!$",
]

[msg.section_0.entries.5]
text = [
  "This is the Season Research Lab.\\c\\n",
  "Twist Mountain, just beyond Mistralton,\\n",
  "has snow, depending on the season.$",
]

[msg.section_0.entries.6]
text = [
  "Some Pokémon change their appearance\\n",
  "depending on the season.\\c\\n",
  "Could that also be considered\\n",
  "a type of evolution?$",
]

[msg.section_0.entries.7]
text = [
  "You can see Deerling from\\n",
  "all four seasons in our lab!\\c\\n",
  "When it comes to Deerling,\\n",
  "we're sort of the experts.\\c\\n",
  "We found a rather rare Deerling.\\n",
  "Will you raise it for us? What do you say?$",
]

[msg.section_0.entries.8]
text = [
  "Here you are!\\n",
  "Take good care of it!\\c$",
]

[msg.section_0.entries.9]
text = [
  "[VAR TRNAME(0)] received Deerling!$",
]

[msg.section_0.entries.10]
text = [
  "Give a nickname\\n",
  "to the Deerling you received?$",
]

[msg.section_0.entries.11]
text = [
  "You're traveling with lots of\\n",
  "Pokémon already!$",
]

[msg.section_0.entries.12]
text = [
  "Are you sure? It's quite a rare\\n",
  "Deerling, you know!$",
]

[msg.section_0.entries.13]
text = [
  "Its Ability is Serene Grace.\\c\\n",
  "They say this Ability doubles the chances\\n",
  "of getting a move's additional effect.$",
]

[msg.section_0.entries.14]
text = [
  "Dreee!$",
]

[msg.section_0.entries.15]
text = [
  "Dreee! Dree dree!$",
]

[msg.section_0.entries.16]
text = [
  "Dreen! Droooon!$",
]

[msg.section_0.entries.17]
text = [
  "Droon...$",
]

[msg.section_0.entries.18]
text = [
  "The temperature and humidity\\n",
  "inside the case next to me\\l\\n",
  "are controlled by a machine.$",
]

[msg.section_0.entries.19]
text = [
  "The glass is slightly cold to the touch.\\c\\n",
  "The plants inside the case\\n",
  "have grown some pretty Berries.$",
]

[msg.section_0.entries.20]
text = [
  "The glass is very cold to the touch.\\c\\n",
  "The plants inside the case\\n",
  "have lost all their leaves.$",
]

[msg.section_0.entries.21]
text = [
  "The glass is slightly warm to the touch.\\c\\n",
  "The plants inside the case\\n",
  "have grown small buds.$",
]

[msg.section_0.entries.22]
text = [
  "The glass is very warm to the touch.\\c\\n",
  "The plants inside the case\\n",
  "have big, healthy leaves.$",
]

[msg.section_0.entries.23]
text = [
  "Route 6's temperature [VAR NUM2(0)] °C$",
]

[msg.section_0.entries.24]
text = [
  "Route 6's temperature [VAR NUM2(0)] °C$",
]

[msg.section_0.entries.25]
text = [
  "Route 6's temperature [VAR NUM2(0)] °C$",
]

[msg.section_0.entries.26]
text = [
  "Route 6's temperature -[VAR NUM1(0)] °C$",
]

[msg.section_0.entries.27]
text = [
  "Oh, my! Your [VAR PKNAME(0)] knows the\\n",
  "move [VAR MOVE(1)]!\\c\\n",
  "For a Trainer like you,\\n",
  "here comes a Pokémon weather forecast!$",
]

[msg.section_0.entries.28]
text = [
  "Oh, my!\\n",
  "This is something I don't see often!\\c\\n",
  "Your [VAR PKNAME(0)]'s Ability\\n",
  "is [VAR ABILITY(2)]!\\c\\n",
  "For a Trainer like you,\\n",
  "here comes a Pokémon weather forecast!$",
]

[msg.section_0.entries.29]
text = [
  "Ahem!\\c\\n",
  "Using the move Rain Dance or sending out\\n",
  "a Pokémon with the Ability Drizzle\\l\\n",
  "will cause it to rain.$",
]

[msg.section_0.entries.30]
text = [
  "When it's raining, the power of\\n",
  "Water-type moves will be boosted by\\l\\n",
  "50 percent!\\c\\n",
  "The powers of Fire-type moves and\\n",
  "SolarBeam will be reduced by 50 percent!\\c\\n",
  "Weather Ball will become a Water-type\\n",
  "move, and its power will be boosted by\\l\\n",
  "100 percent!$",
]

[msg.section_0.entries.31]
text = [
  "By the way, the Pokémon called Castform\\n",
  "is known to change its form in rain and\\l\\n",
  "become a Water type.$",
]

[msg.section_0.entries.32]
text = [
  "The darkened sky reduces the amount\\n",
  "of HP recovered from the moves\\l\\n",
  "Morning Sun, Synthesis, and Moonlight.$",
]

[msg.section_0.entries.33]
text = [
  "This is a weather advisory!\\c\\n",
  "Please be aware that the moves Thunder\\n",
  "and Hurricane will not miss in the rain!$",
]

[msg.section_0.entries.34]
text = [
  "By the way, there are some Abilities that\\n",
  "take effect when it's raining, such as\\l\\n",
  "Swift Swim, Rain Dish,\\l\\n",
  "Dry Skin, and Forecast.\\c\\n",
  "Please check your Pokémon's status!$",
]

[msg.section_0.entries.35]
text = [
  "The lucky item on a rainy day is\\n",
  "the Damp Rock!\\c\\n",
  "Parasol Ladies like me are in our element\\n",
  "in rain, like a Basculin in water!$",
]

[msg.section_0.entries.36]
text = [
  "Ahem!\\c\\n",
  "Using the move Sunny Day or sending out\\n",
  "a Pokémon with the Ability Drought\\l\\n",
  "will cause the sun to shine brightly.$",
]

[msg.section_0.entries.37]
text = [
  "When it's sunny, the power of Fire-type\\n",
  "moves will be boosted by 50 percent!\\c\\n",
  "The power of Water-type moves\\n",
  "will be reduced by 50 percent!\\c\\n",
  "Weather Ball will become a Fire-type\\n",
  "move, and its power will be boosted by\\l\\n",
  "100 percent!\\c\\n",
  "The stat increase of the move Growth\\n",
  "is boosted by 200 percent!$",
]

[msg.section_0.entries.38]
text = [
  "When it's sunny, it's been reported that\\n",
  "Pokémon can't be frozen, and frozen\\l\\n",
  "Pokémon are defrosted!\\c\\n",
  "By the way, the Pokémon called Castform\\n",
  "is known to change its form when it's\\l\\n",
  "sunny and become a Fire type.$",
]

[msg.section_0.entries.39]
text = [
  "The clear sky increases the amount of\\n",
  "HP recovered from the moves\\l\\n",
  "Morning Sun, Synthesis, and Moonlight.$",
]

[msg.section_0.entries.40]
text = [
  "This is a weather advisory!\\c\\n",
  "When it's sunny, the move SolarBeam can\\n",
  "be used every turn. It doesn't have\\l\\n",
  "to charge up first!\\c\\n",
  "Please be aware that the moves\\n",
  "Thunder and Hurricane will be\\l\\n",
  "more likely to miss!$",
]

[msg.section_0.entries.41]
text = [
  "By the way, there are some Abilities that\\n",
  "take effect when it's sunny, such as\\l\\n",
  "Chlorophyll, Harvest, Solar Power,\\l\\n",
  "and Forecast.\\c\\n",
  "Please check your Pokémon's status!$",
]

[msg.section_0.entries.42]
text = [
  "The lucky item on a sunny day is\\n",
  "the Heat Rock!\\c\\n",
  "By the way, the sunshine may feel nice,\\n",
  "but remember to take care of your skin\\l\\n",
  "and try not to get a sunburn.$",
]

[msg.section_0.entries.43]
text = [
  "Ahem!\\c\\n",
  "Using the move Hail or sending out\\n",
  "a Pokémon with the Ability Snow Warning\\l\\n",
  "will cause it to hail.$",
]

[msg.section_0.entries.44]
text = [
  "When it's hailing, Pokémon take\\n",
  "damage at the end of every turn\\l\\n",
  "unless they are Ice types!\\c\\n",
  "The power of SolarBeam will be\\n",
  "reduced by 50 percent!\\c\\n",
  "Weather Ball will become an Ice-type\\n",
  "move, and the power will be boosted by\\l\\n",
  "100 percent!$",
]

[msg.section_0.entries.45]
text = [
  "By the way, the Pokémon called Castform\\n",
  "is known to change its form when it's\\l\\n",
  "hailing and become an Ice type.$",
]

[msg.section_0.entries.46]
text = [
  "The darkened sky reduces the amount\\n",
  "of HP recovered from the moves\\l\\n",
  "Morning Sun, Synthesis, and Moonlight.$",
]

[msg.section_0.entries.47]
text = [
  "This is a weather advisory!\\c\\n",
  "Please be aware that Blizzard\\n",
  "will not miss when it's hailing!$",
]

[msg.section_0.entries.48]
text = [
  "By the way, there are some Abilities that\\n",
  "take effect when it's hailing, such as\\l\\n",
  "Ice Body, Snow Cloak, and Forecast.\\c\\n",
  "Please check your Pokémon's status!$",
]

[msg.section_0.entries.49]
text = [
  "The lucky item in a hailstorm is\\n",
  "the Icy Rock!\\c\\n",
  "By the way, it gets quiet when it snows\\n",
  "because the icy particles absorb sound!$",
]

[msg.section_0.entries.50]
text = [
  "Ahem!\\c\\n",
  "Using the move Sandstorm or sending out\\n",
  "a Pokémon with the Ability Sand Stream\\l\\n",
  "will cause a sandstorm.$",
]

[msg.section_0.entries.51]
text = [
  "When in a sandstorm, Pokémon take\\n",
  "damage at the end of every turn unless\\l\\n",
  "they are Rock types, Ground types, or\\l\\n",
  "Steel types!\\c\\n",
  "The power of the move SolarBeam will be\\n",
  "reduced by 50 percent!\\c\\n",
  "Weather Ball will become a Rock-type\\n",
  "move, and its power will be boosted\\l\\n",
  "by 100 percent!$",
]

[msg.section_0.entries.52]
text = [
  "When in a sandstorm, it's been reported\\n",
  "that Rock-type Pokémon boost their\\l\\n",
  "Sp. Defense by 50 percent!\\c\\n",
  "By the way, the Pokémon called Castform\\n",
  "is known to change its form and type\\l\\n",
  "depending on the weather, but\\l\\n",
  "sandstorms don't affect it in that way.$",
]

[msg.section_0.entries.53]
text = [
  "The darkened sky reduces the amount of\\n",
  "HP recovered from the moves\\l\\n",
  "Morning Sun, Synthesis, and Moonlight.$",
]

[msg.section_0.entries.54]
text = [
  "By the way, there are some Abilities that\\n",
  "take effect in a sandstorm, such as\\l\\n",
  "Sand Rush, Sand Veil, and Sand Force.\\c\\n",
  "Please check your Pokémon's status!$",
]

[msg.section_0.entries.55]
text = [
  "The lucky item in a sandstorm is\\n",
  "the Smooth Rock!\\c\\n",
  "By the way, I long for a life where\\n",
  "I could be a free spirit and soar\\l\\n",
  "anywhere, like sand blown by the wind!$",
]

[msg.section_0.entries.56]
text = [
  "How did you enjoy my Pokémon\\n",
  "weather forecast?\\c\\n",
  "Please bring me a Pokémon with other\\n",
  "moves or Abilities if you want to hear\\l\\n",
  "a different forecast!$",
]

[msg.section_0.entries.57]
text = [
  "Oh, my! None of the Pokémon traveling\\n",
  "with you have moves or Abilities that\\l\\n",
  "change the weather.\\c\\n",
  "If you find one that does, bring it to me.\\n",
  "I'll give you a Pokémon weather forecast!$",
]

[msg.section_0.entries.58]
text = [
  "My Pokémon weather forecast for you!\\c\\n",
  "Well, that's how it normally goes, but...\\n",
  "Your [VAR PKNAME(0)]'s Ability is\\l\\n",
  "none other than [VAR ABILITY(2)]!\\c\\n",
  "That's a problematic one for me.\\c\\n",
  "Since [VAR ABILITY(2)] turns off the effects\\n",
  "of weather, it means my Pokémon weather\\l\\n",
  "forecast isn't too helpful!$",
]

[msg.section_0.entries.59]
text = [
  "Is today a special day for some reason?\\c\\n",
  "It feels like my mind has cleared up...\\n",
  "as if a fog has lifted!\\c\\n",
  "Maybe the weather somewhere\\n",
  "is cleared up just like my mind...\\c$",
]

[msg.section_0.entries.60]
text = [
  "Here comes a question out of a clear sky!\\n",
  "Have you heard of diamond dust?\\c\\n",
  "It's a breathtaking phenomenon that is\\n",
  "created by shiny icy particles coming\\l\\n",
  "down from the sky!\\c\\n",
  "I heard it can be seen in a certain city\\n",
  "around this time of year.\\c\\n",
  "Ahh... I would love to watch the\\n",
  "diamond dust flutter down with\\l\\n",
  "someone special! Teehee!\\c$",
]

[msg.section_0.entries.0]
text = [
  "To be good at something, you have to do\\n",
  "it repeatedly, day after day after day.$",
]

[msg.section_0.entries.1]
text = [
  "When I was a kid, I played catch with\\n",
  "my Pokémon!$",
]

[msg.section_0.entries.2]
text = [
  "It's not bad to grow up.\\c\\n",
  "But it's bad to forget what it felt like\\n",
  "to be a child.$",
]

[msg.section_0.entries.3]
text = [
  "I have baseball, and I have Pokémon...\\n",
  "How happy I am!$",
]

[msg.section_0.entries.4]
text = [
  "If you don't swing a bat, you can't hit\\n",
  "a ball.\\c\\n",
  "If you don't do things, you won't fail...\\n",
  "but you won't succeed, either.$",
]

[msg.section_0.entries.5]
text = [
  "I give 100 percent of my energy all the\\n",
  "time! That is the only thing I can do.$",
]

[msg.section_0.entries.6]
text = [
  "What I brag about is my bat!$",
]

[msg.section_0.entries.7]
text = [
  "Bwoof!$",
]

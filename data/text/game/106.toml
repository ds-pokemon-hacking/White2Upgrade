[msg.section_0.entries.0]
text = [
  "Oh my! Did you come here\\n",
  "looking for the Gym Leader?\\c\\n",
  "I'm sorry, you just missed her.\\n",
  "She just left for the Gym.\\c\\n",
  "Take this for making it\\n",
  "all the way here!\\c$",
]

[msg.section_0.entries.1]
text = [
  "So, I hear the Gym Leader\\n",
  "likes the thrill of this roller coaster.$",
]

[msg.section_0.entries.2]
text = [
  "Hey there!\\n",
  "Are you cool riding a roller coaster?\\c$",
]

[msg.section_0.entries.3]
text = [
  "I'm going to overwhelm you with the speed\\n",
  "I learned riding the roller coaster!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Your way of battling...\\n",
  "It's elegant! You've got style!\\c$",
]

[msg.section_0.entries.5]
text = [
  "If you press the switches, the\\n",
  "roller coaster's path will change.$",
]

[msg.section_0.entries.6]
text = [
  "Your roller-coaster ride is finally\\n",
  "nearing its finale.\\c$",
]

[msg.section_0.entries.7]
text = [
  "I'm also a Pokémon Trainer who was\\n",
  "toughened up by Ms. Elesa.\\l\\n",
  "I won't give up easily!\\c$",
]

[msg.section_0.entries.8]
text = [
  "It pleases me to be the opponent of a\\n",
  "strong and honorable Trainer like you!\\c$",
]

[msg.section_0.entries.9]
text = [
  "In other places, roller coasters\\n",
  "are called jet coasters.$",
]

[msg.section_0.entries.10]
text = [
  "[VAR TRNAME(0)] pressed the switch.\\c\\n",
  "The roller coaster's path\\n",
  "has been changed!$",
]

[msg.section_0.entries.11]
text = [
  "To ride this roller coaster,\\n",
  "the first step is to get in the car.\\c\\n",
  "Next comes the platform!\\n",
  "There, you can change\\l\\n",
  "where the coaster is going!\\c\\n",
  "Sometimes you continue by riding\\n",
  "the cars of opponents you defeat.\\l\\n",
  "That's how you aim for the back!$",
]

[msg.section_0.entries.12]
text = [
  "Elesa's really amazing!\\c\\n",
  "Usually, you just remodel the Gym,\\n",
  "but she built a completely new one!\\c\\n",
  "Elesa's really amazing!$",
]

[msg.section_0.entries.13]
text = [
  "Faster! Faster!\\n",
  "A speed boost makes you feel great!$",
]

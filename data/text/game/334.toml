[msg.section_0.entries.0]
text = [
  "There is a Pokémon called Cresselia\\n",
  "in the far Sinnoh region.\\c\\n",
  "Its wings shine like the crescent moon\\n",
  "and keep nightmares away.$",
]

[msg.section_0.entries.1]
text = [
  "There is a Pokémon called Darkrai\\n",
  "in the far Sinnoh region.\\c\\n",
  "To protect itself, it drives people and\\n",
  "Pokémon away with terrible nightmares.$",
]

[msg.section_0.entries.2]
text = [
  "There are Pokémon called Drowzee.\\c\\n",
  "They put others to sleep and eat their\\n",
  "dreams. Eating nightmares can upset\\l\\n",
  "their stomachs.$",
]

[msg.section_0.entries.3]
text = [
  "There are Pokémon called Hypno.\\c\\n",
  "Each one carries a pendulum that\\n",
  "it can swing to make people drowsy.\\c\\n",
  "It has been said that a Hypno once\\n",
  "hypnotized a child and took it away...$",
]

[msg.section_0.entries.4]
text = [
  "Some Pokémon know a move called\\n",
  "Dream Eater.\\c\\n",
  "With this move, a Pokémon attacks while\\n",
  "the target is asleep and eats its dream.\\c\\n",
  "It restores HP equal to half of\\n",
  "the damage inflicted on the target.$",
]

[msg.section_0.entries.5]
text = [
  "Some Pokémon have the Forewarn Ability.\\c\\n",
  "A Pokémon with this Ability is alerted to\\n",
  "one of the opposing Pokémon's moves.\\c\\n",
  "High-power moves will be recognized first.$",
]

[msg.section_0.entries.6]
text = [
  "A lot of books from other regions\\n",
  "are stored on the tall shelf.$",
]

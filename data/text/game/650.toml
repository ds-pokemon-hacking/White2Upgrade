[msg.section_0.entries.0]
text = [
  "Oh ho! With a face like that,\\n",
  "I'll bet you're a Pokémon Trainer!\\c\\n",
  "I work as a Depot Agent on the\\n",
  "Battle Subway!\\c\\n",
  "Have you tried challenging the\\n",
  "Battle Subway yet?\\c\\n",
  "It's a hot spot for those who want\\n",
  "some serious battling action!\\c\\n",
  "But some people get too wrapped up\\n",
  "in their battles, and there's no end\\l\\n",
  "to the lost-and-found items.\\c\\n",
  "That's right. Nobody ever came to\\n",
  "pick this up, so I'll give it to you!\\c$",
]

[msg.section_0.entries.1]
text = [
  "I have a lost-and-found item\\n",
  "that no one has claimed.\\c\\n",
  "If you don't mind, could you take it\\n",
  "off my hands?\\c$",
]

[msg.section_0.entries.2]
text = [
  "Oh! I've been waiting for you!\\c\\n",
  "Recently, we've gotten more passengers,\\n",
  "so there's more lost-and-found items!\\c\\n",
  "No one has claimed this, so if you don't\\n",
  "mind, could you take it off my hands?\\c$",
]

[msg.section_0.entries.3]
text = [
  "No worries. No worries.\\n",
  "Just take it!\\c\\n",
  "It's better for a Trainer to use it than\\n",
  "for me to hold on to it.\\c\\n",
  "I'm sure the item is happier, too!$",
]

[msg.section_0.entries.4]
text = [
  "If I have another lost-and-found\\n",
  "item, come get it, OK?\\c\\n",
  "Also, if you're interested, take on the\\n",
  "Battle Subway in Nimbasa City!$",
]

[msg.section_0.entries.5]
text = [
  "Oh, my. There's no more room for\\n",
  "the [VAR ITEM2(0)].\\c\\n",
  "You'll need to remove some from your Bag\\n",
  "before you can accept any more!$",
]

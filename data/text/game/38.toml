[msg]
trailing_data = "7878"

[msg.section_0.entries.0]
text = [
  "If you're looking for the Gym Leader,\\n",
  "Burgh, he said there might be trouble\\l\\n",
  "and then he took off!\\c\\n",
  "You can go look for him if you'd like!\\c$",
]

[msg.section_0.entries.1]
text = [
  "???: Huh? Burgh vanished again?\\c$",
]

[msg.section_0.entries.2]
text = [
  "Clyde: Oh! Hello, Iris.\\c\\n",
  "Something came up, and Burgh\\n",
  "isn't here right now.\\c$",
]

[msg.section_0.entries.3]
text = [
  "Iris: Hmm...\\c\\n",
  "Isn't Burgh always vanishing, though?\\c\\n",
  "He always says he's got artist's block\\n",
  "and just goes wandering out of the Gym.\\c$",
]

[msg.section_0.entries.4]
text = [
  "Hi there! Who are you?\\c\\n",
  "...\\c\\n",
  "Looking for Team Plasma?\\c\\n",
  "But Team Plasma disbanded\\n",
  "two years ago!\\c\\n",
  "I guess that doesn't matter!\\n",
  "You're having problems,\\l\\n",
  "so I'll help you out!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Hmm... Now where would\\n",
  "suspicious people go to hide?\\c$",
]

[msg.section_0.entries.6]
text = [
  "That's it!\\n",
  "That might be where they are!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Clyde: Good grief...\\n",
  "Burgh and Iris are so similar.\\c\\n",
  "It looks like she went around the corner,\\n",
  "toward the Pokémon Center.\\c\\n",
  "Do you know where the Pokémon Center is?\\c\\n",
  "If you keep following the street\\n",
  "that goes around Castelia City,\\l\\n",
  "it's right there!$",
]

[msg.section_0.entries.8]
text = [
  "When it comes to loving my Pokémon,\\n",
  "I won't lose to anybody!\\c\\n",
  "I hope that gets through\\n",
  "to my Pokémon...$",
]

[msg.section_0.entries.9]
text = [
  "I've got plenty of Potions!\\n",
  "With them, I'll bet I can\\l\\n",
  "beat the Gym Leader!$",
]

[msg.section_0.entries.10]
text = [
  "Wanting to become stronger\\n",
  "as a Pokémon Trainer is good!\\c\\n",
  "You can have a good time playing with\\n",
  "Pokémon or put them to work instead!$",
]

[msg.section_0.entries.11]
text = [
  "If I only had five Badges,\\n",
  "I could buy Ultra Balls...$",
]

[msg.section_0.entries.12]
text = [
  "My little Palpitoad\\n",
  "is utterly charming!\\c\\n",
  "When I come home tired,\\n",
  "it makes me feel better!$",
]

[msg.section_0.entries.13]
text = [
  "Castelia City Pokémon Gym\\n",
  "Leader: Burgh\\l\\n",
  "Premier Insect Artist$",
]

[msg.section_0.entries.0]
text = [
  "[VAR TRNAME(1)]: Go on ahead!\\c\\n",
  "I'm going to make them tell me\\n",
  "about the Shadow Triad!\\c\\n",
  "If you find Purrloin or the Shadow Triad,\\n",
  "let me know!$",
]

[msg.section_0.entries.1]
text = [
  "You...\\n",
  "Where are the Shadow Triad?$",
]

[msg.section_0.entries.2]
text = [
  "Cretin! Don't interfere with\\n",
  "Team Plasma's conquest of Unova!$",
]

[msg.section_0.entries.3]
text = [
  "Struggle and squirm!\\c\\n",
  "Kyurem's ice is more powerful\\n",
  "than Reshiram's columns of fire\\l\\n",
  "or Zekrom's crackling lightning!$",
]

[msg.section_0.entries.4]
text = [
  "H-he's terrifying!\\n",
  "He can't be human!\\c\\n",
  "But he has a silly-looking\\n",
  "Qwilfish hairstyle!$",
]

[msg.section_0.entries.5]
text = [
  "All of Unova will be\\n",
  "frozen with Kyurem's ice!\\c\\n",
  "I wonder if Zinzolin will be OK...\\n",
  "He really doesn't like the cold.$",
]

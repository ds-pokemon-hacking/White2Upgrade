[msg]
trailing_data = "f2f2"

[msg.section_0.entries.0]
text = [
  "[VAR TRNAME(0)] received [VAR NUM2(1)] BP!$",
]

[msg.section_0.entries.1]
text = [
  "Saving your record data...\\n",
  "Don't turn off the power.$",
]

[msg.section_0.entries.2]
text = [
  "Saving...\\n",
  "Don't turn off the power.$",
]

[msg.section_0.entries.3]
text = [
  "Congratulations! You've successfully\\n",
  "reached a seven-win streak!\\c\\n",
  "Since you've won seven in a row,\\n",
  "I present you with these Battle Points!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Congratulations!\\c\\n",
  "You had a seven-win streak and\\n",
  "brilliantly beat the Subway Boss!\\c\\n",
  "To commemorate this,\\n",
  "I present you with these Battle Points.\\c$",
]

[msg.section_0.entries.5]
text = [
  "And, [VAR TRNAME(0)], now you have earned\\n",
  "the right to challenge\\l\\n",
  "the Super Single Train!\\c$",
]

[msg.section_0.entries.6]
text = [
  "And, [VAR TRNAME(0)], now you have earned\\n",
  "the right to challenge\\l\\n",
  "the Super Double Train!\\c$",
]

[msg.section_0.entries.7]
text = [
  "And, [VAR TRNAME(0)], now you have earned\\n",
  "the right to challenge\\l\\n",
  "the Super Multi Train!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Also, to commemorate this, I give you\\n",
  "this trophy.\\c\\n",
  "Please display it in your home!$",
]

[msg.section_0.entries.9]
text = [
  "Please enjoy your time here.\\c\\n",
  "If you would like to continue your\\n",
  "challenge or go back to Nimbasa City,\\l\\n",
  "please talk to me.$",
]

[msg.section_0.entries.10]
text = [
  "This is the end of the Single Train line.\\c\\n",
  "When you want to return to Nimbasa City,\\n",
  "please talk to me again.\\c\\n",
  "Please enjoy your time here.$",
]

[msg.section_0.entries.11]
text = [
  "This is the end of the Double Train line.\\c\\n",
  "When you want to return to Nimbasa City,\\n",
  "please talk to me again.\\c\\n",
  "Please enjoy your time here.$",
]

[msg.section_0.entries.12]
text = [
  "This is the end of the Multi Train line.\\c\\n",
  "When you want to return to Nimbasa City,\\n",
  "please talk to me again.\\c\\n",
  "Please enjoy your time here.$",
]

[msg.section_0.entries.13]
text = [
  "Do you want to return to Nimbasa City?$",
]

[msg.section_0.entries.14]
text = [
  "Well then, we'll return to Nimbasa City.\\c$",
]

[msg.section_0.entries.15]
text = [
  "What would you like to do?$",
]

[msg.section_0.entries.16]
text = [
  "Continue Challenge$",
]

[msg.section_0.entries.17]
text = [
  "Return to Nimbasa City$",
]

[msg.section_0.entries.18]
text = [
  "Stay Here$",
]

[msg.section_0.entries.19]
text = [
  "Awaiting your friend's response...$",
]

[msg.section_0.entries.20]
text = [
  "“Return to Nimbasa City\\\" was chosen, so\\n",
  "your challenge\\l\\n",
  "will end for now.$",
]

[msg.section_0.entries.21]
text = [
  "[VAR TRNAME(0)], you have been promoted\\n",
  "to Rank [VAR NUM2(1)]!\\c$",
]

[msg.section_0.entries.22]
text = [
  "Would you like to send these results\\n",
  "using Nintendo WFC?$",
]

[msg.section_0.entries.23]
text = [
  "Looking good!\\n",
  "Let's keep doing our best!$",
]

[msg.section_0.entries.24]
text = [
  "Looking good!\\n",
  "Let's keep doing our best!$",
]

[msg.section_0.entries.25]
text = [
  "Our opponents will get tougher,\\n",
  "but that's no problem for you and me!\\l\\n",
  "Let's keep on winning!$",
]

[msg.section_0.entries.26]
text = [
  "Our opponents will get tougher,\\n",
  "but we can handle them! No problem!\\l\\n",
  "Let's keep on winning and having fun!$",
]

[msg.section_0.entries.27]
text = [
  "Thanks to you, we made it this far!\\c\\n",
  "Let's keep showing everyone the\\n",
  "power of this awesome team!$",
]

[msg.section_0.entries.28]
text = [
  "Thanks to you, we finally made it here!\\c\\n",
  "...Could we be the best partners ever?!$",
]

[msg.section_0.entries.29]
text = [
  "This is the end of the Wi-Fi Train line.\\c\\n",
  "When you want to return to Nimbasa City,\\n",
  "please talk to me again.\\c\\n",
  "Please enjoy your time here.$",
]

[msg.section_0.entries.30]
text = [
  "The challenge was interrupted.$",
]

[msg.section_0.entries.31]
text = [
  "The selection was canceled.$",
]

[msg.section_0.entries.32]
text = [
  "Constant battles make me nervous.\\n",
  "I'm taking a little rest here.$",
]

[msg.section_0.entries.33]
text = [
  "I'm going to save up Battle Points and\\n",
  "get some items for my Pokémon to hold.$",
]

[msg.section_0.entries.34]
text = [
  "For each seven-win streak, the Trainers\\n",
  "and Pokémon who challenge you become\\l\\n",
  "progressively tougher.$",
]

[msg.section_0.entries.35]
text = [
  "I've decided to use only cute Pokémon!\\c\\n",
  "Do you have any unique thing you're\\n",
  "particular about?$",
]

[msg.section_0.entries.36]
text = [
  "OK! I'm all prepared!\\n",
  "All aboard for a battle journey!$",
]

[msg.section_0.entries.37]
text = [
  "Phew...I'm worn out.\\c\\n",
  "These Trainers are tough. I wonder\\n",
  "how far I'll get with my skills.$",
]

[msg.section_0.entries.38]
text = [
  "Have you heard of the Subway Bosses?\\c\\n",
  "They appear only to strong Trainers,\\n",
  "and they challenge them to battles.\\c\\n",
  "They are the Battle Subway's bosses.$",
]

[msg.section_0.entries.39]
text = [
  "That last battle was tough...\\c\\n",
  "I should've traded in my BP for a\\n",
  "better item.$",
]

[msg.section_0.entries.40]
text = [
  "If you have wooon, the trip goes ooon!\\n",
  "Relying on Pokémon, this vagabooond!$",
]

[msg.section_0.entries.41]
text = [
  "About time to take it to the next level.\\n",
  "Give it your best shot, too!$",
]

[msg.section_0.entries.42]
text = [
  "The Trainers here are really tough\\n",
  "from the very start.$",
]

[msg.section_0.entries.43]
text = [
  "My 42nd straight win...\\n",
  "Not too shabby, eh?$",
]

[msg.section_0.entries.44]
text = [
  "Can't believe I won 84 straight...\\n",
  "Is this a dream or a hallucination?$",
]

[msg.section_0.entries.45]
text = [
  "You've got a 14-win streak!\\n",
  "Pretty good! Not bad!$",
]

[msg.section_0.entries.46]
text = [
  "I hear the Super Train is endless!\\c\\n",
  "In other words, if you keep winning, you\\n",
  "can keep going, on and on to wherever!$",
]

[msg.section_0.entries.47]
text = [
  "I can go a lot further!\\n",
  "I can win a lot more!$",
]

[msg.section_0.entries.48]
text = [
  "The eyes of the Trainers here are very\\n",
  "serious, or maybe you could say glinting.$",
]

[msg.section_0.entries.49]
text = [
  "Is this the best this officer can do...?\\c\\n",
  "The light from the passing trains seems\\n",
  "way too bright.$",
]

[msg.section_0.entries.50]
text = [
  "The Subway Boss was a suspicious,\\n",
  "strange fellow.\\c\\n",
  "I still don't believe he was giving it\\n",
  "his all.$",
]

[msg.section_0.entries.51]
text = [
  "Challenging people is also part of my\\n",
  "police training.$",
]

[msg.section_0.entries.52]
text = [
  "I can legally go as wild as I want!\\n",
  "This place! It's paradise, isn't it?$",
]

[msg.section_0.entries.53]
text = [
  "My journey has just started!\\n",
  "Neither of us can afford to lose!$",
]

[msg.section_0.entries.54]
text = [
  "Being alone on the station's platform\\n",
  "somehow makes me feel a little sad.\\c\\n",
  "People leave on their journeys here, and\\n",
  "it reminds me of those memories.$",
]

[msg.section_0.entries.55]
text = [
  "The Subway Boss was a piece of cake!\\c\\n",
  "Maybe I should cut loose on the\\n",
  "Super Train next time!$",
]

[msg.section_0.entries.56]
text = [
  "The Trainers sure have become stronger.\\n",
  "I'm feeling a little uneasy...$",
]

[msg.section_0.entries.57]
text = [
  "It looks like my Pokémon skill has\\n",
  "reached its peak power.\\c\\n",
  "I couldn't let go of my dreams...\\n",
  "I'll hang them on you, stranger,\\l\\n",
  "young Trainer.\\c\\n",
  "And this is proof.\\n",
  "Please accept this, youngster...\\c$",
]

[msg.section_0.entries.58]
text = [
  "I'm going to return to my home and\\n",
  "quietly cheer myself up with art!$",
]

[msg.section_0.entries.59]
text = [
  "Oh ho ho ho...\\c\\n",
  "I've already done better than I did\\n",
  "during my last challenge!$",
]

[msg.section_0.entries.60]
text = [
  "Battle between two excellent Trainers is\\n",
  "very artistic.$",
]

[msg.section_0.entries.61]
text = [
  "For being called a Subway Boss,\\n",
  "that Trainer sure wasn't as strong\\l\\n",
  "as “Boss\\\" suggests.\\c\\n",
  "It was almost as if...\\c\\n",
  "As if they are simply gauging\\n",
  "how strong we really are.$",
]

[msg.section_0.entries.62]
text = [
  "Well then!\\c\\n",
  "It's about time to get on\\n",
  "the train!$",
]

[msg.section_0.entries.63]
text = [
  "Now just wait a minute, little Pokémon!\\n",
  "I'll let you battle lots and lots soon!$",
]

[msg.section_0.entries.64]
text = [
  "Urk!\\c\\n",
  "I got motion sickness on the train...$",
]

[msg.section_0.entries.65]
text = [
  "You beat our boss, right?\\n",
  "Not half bad, hey!\\c\\n",
  "And now, super Trainer, you've\\n",
  "earned the qualification to take on the\\l\\n",
  "Super Train!\\c\\n",
  "The Trainers on the Super Train are\\n",
  "really tough.\\c\\n",
  "If you want to know the essence of the\\n",
  "Battle Subway, you should give it a try!$",
]

[msg.section_0.entries.66]
text = [
  "I'd rather have an exciting battle than\\n",
  "slowly drive the train.$",
]

[msg.section_0.entries.67]
text = [
  "Where did you come from?\\n",
  "And where are you going?$",
]

[msg.section_0.entries.68]
text = [
  "We Depot Agents are the protectors of\\n",
  "peace and order in the station.\\c\\n",
  "We are verrry opposed to littering on\\n",
  "the platform, shouting or playing\\l\\n",
  "instruments, loitering, or any activities\\l\\n",
  "that bother other people!$",
]

[msg.section_0.entries.69]
text = [
  "Just like how a machine needs fine-tuning,\\n",
  "Pokémon need maintenance, too.\\c\\n",
  "It's a necessity.\\c\\n",
  "For example, rethinking the moves that a\\n",
  "Pokémon knows.$",
]

[msg.section_0.entries.70]
text = [
  "No clumsy gimmicks...\\n",
  "No unnecessary items...\\c\\n",
  "The only thing you can rely on is the\\n",
  "strength of you and your Pokémon.\\c\\n",
  "This place is wonderful, isn't it?$",
]

[msg.section_0.entries.71]
text = [
  "Over 100 straight victories...\\c\\n",
  "If this is all due to your strength,\\n",
  "you're even a match for the Champion.$",
]

[msg.section_0.entries.72]
text = [
  "The strength of the Trainers on\\n",
  "the Super Train is beyond imagination!$",
]

[msg.section_0.entries.73]
text = [
  "I had a taste of it...\\n",
  "The rush of battle...\\c\\n",
  "I shouldn't...\\n",
  "It's too wild...\\c\\n",
  "But at this rate, I'm going to\\n",
  "end up on the path of battlers...$",
]

[msg.section_0.entries.74]
text = [
  "Howdy! I'm a genius Pilot!\\n",
  "Unova's finest!\\c\\n",
  "And I'm comin' in first here, too!$",
]

[msg.section_0.entries.75]
text = [
  "I've seen elite Trainers like me\\n",
  "all over the place, but...\\c\\n",
  "Seems like the battles will be tough\\n",
  "from here on.$",
]

[msg.section_0.entries.76]
text = [
  "Even for an elite Trainer such as myself,\\n",
  "it's starting to get hard.$",
]

[msg.section_0.entries.77]
text = [
  "Hey, how are you doing?\\n",
  "I'm still going strong!$",
]

[msg.section_0.entries.78]
text = [
  "I've a-done it--77 straight wins!\\n",
  "That number has a lucky sound!$",
]

[msg.section_0.entries.79]
text = [
  "We've defeated over 300 Trainers...$",
]

[msg.section_0.entries.80]
text = [
  "My my, what a weak-looking Trainer...\\c\\n",
  "I think I would just get bored if I\\n",
  "battled you...\\c\\n",
  "I'll give you this, so just get a little\\n",
  "tougher, OK?\\c$",
]

[msg.section_0.entries.81]
text = [
  "I'm only interested in strong\\n",
  "opponents...\\c\\n",
  "If you get tougher, I wouldn't\\n",
  "mind battling you.$",
]

[msg.section_0.entries.82]
text = [
  "Not many people left on the platform...\\c\\n",
  "Guess that shows how hard it is\\n",
  "to keep winning on the Battle Subway.$",
]

[msg.section_0.entries.83]
text = [
  "...\\c\\n",
  "Huh? What? What do you want?\\c\\n",
  "I'm busy planning my tactics for my\\n",
  "next battle.\\c\\n",
  "I don't mean to be rude, but I really\\n",
  "need to concentrate. Would you mind\\l\\n",
  "not talking to me right now?$",
]

[msg.section_0.entries.84]
text = [
  "Ninety-one straight victories is nothing\\n",
  "more than a natural result for me.\\c\\n",
  "My glorious record will just keep\\n",
  "going up!$",
]

[msg.section_0.entries.85]
text = [
  "You...\\n",
  "You have the same eyes as me.\\c\\n",
  "You love battling so much...\\n",
  "No, it's not just that...\\c\\n",
  "Battling is your reason for living.\\n",
  "You and I are the same type, aren't we?\\c\\n",
  "So...I'll give you this.\\c$",
]

[msg.section_0.entries.86]
text = [
  "You're continuing your battle, right?\\c\\n",
  "That's because we are that type of\\n",
  "person, aren't we...$",
]

[msg.section_0.entries.87]
text = [
  "I'm going to leave a rockin' record and\\n",
  "turn into a big star!$",
]

[msg.section_0.entries.88]
text = [
  "Hey, how are you doing?\\n",
  "I'm still going strong!$",
]

[msg.section_0.entries.89]
text = [
  "There's more to Pokémon than it seems.\\c\\n",
  "The world of Pokémon battling really gets\\n",
  "deeper and deeper.$",
]

[msg.section_0.entries.90]
text = [
  "I found this when I was cleaning.\\n",
  "You can have it if you'd like.\\c$",
]

[msg.section_0.entries.91]
text = [
  "Oh, no need to thank me!\\n",
  "After all, I just found it in the trash.\\c\\n",
  "I don't understand it. Recently, many\\n",
  "folks have just been throwing away\\l\\n",
  "perfectly good things.$",
]

[msg.section_0.entries.92]
text = [
  "I may be a Janitor, but I have a lot\\n",
  "of confidence in my abilities!$",
]

[msg.section_0.entries.93]
text = [
  "All right! Bring out your Poké Balls!\\n",
  "Now is the time for a battle!$",
]

[msg.section_0.entries.94]
text = [
  "You like battles, too!$",
]

[msg.section_0.entries.95]
text = [
  "I can't believe a Veteran like me\\n",
  "would get into trouble like that.\\c\\n",
  "Where in the world are the Trainers\\n",
  "here training?$",
]

[msg.section_0.entries.96]
text = [
  "How are you doing, Trainer?\\n",
  "Are you starting to get tired yet?$",
]

[msg.section_0.entries.97]
text = [
  "Mumble, mumble, mumble...\\c\\n",
  "In order to bring good fortune, I always\\n",
  "think about my family before a battle.$",
]

[msg.section_0.entries.98]
text = [
  "I've been watching you battle.\\c\\n",
  "Nice technique and judgment... Not\\n",
  "surprising, after a win streak like yours.$",
]

[msg.section_0.entries.99]
text = [
  "Not many people around.\\c\\n",
  "But each person who is still here has\\n",
  "shown true strength.$",
]

[msg.section_0.entries.100]
text = [
  "Even a Veteran can lose to a Preschooler\\n",
  "if they get careless.\\c\\n",
  "Pokémon battling requires that you\\n",
  "always be on guard.$",
]

[msg.section_0.entries.101]
text = [
  "Just a little more to 50 straight wins!\\n",
  "Suddenly, I'm all pumped up!$",
]

[msg.section_0.entries.102]
text = [
  "You have the face of someone who\\n",
  "absolutely loves Pokémon battling.\\c\\n",
  "Even now, you're still completely hooked\\n",
  "on battling. Amazing.\\c\\n",
  "Hee hee...\\n",
  "You have a promising future!$",
]

[msg.section_0.entries.103]
text = [
  "You and I both have 91 straight wins!\\c\\n",
  "Which of us will reach a 100-win\\n",
  "streak first?$",
]

[msg.section_0.entries.104]
text = [
  "Dawn and dusk behind my battles...\\c\\n",
  "The rocking train softly rattles...\\c\\n",
  "How many hours have now passed\\n",
  "since we left Nimbasa in the past?$",
]

[msg.section_0.entries.105]
text = [
  "This is the end of the line...\\c\\n",
  "The trip sure ended quickly.\\n",
  "I don't want to go home yet.$",
]

[msg.section_0.entries.106]
text = [
  "If you've made it this far, that means\\n",
  "you've won 14 in a row.\\c\\n",
  "What a fluke! Fourteen is how old I am!\\c\\n",
  "Ha ha ha...$",
]

[msg.section_0.entries.107]
text = [
  "I'm going to let people know I'm still\\n",
  "as active as ever!$",
]

[msg.section_0.entries.108]
text = [
  "It's the end of the line already...\\c\\n",
  "I guess that means my Pokémon\\n",
  "battle journey is over for now.$",
]

[msg.section_0.entries.109]
text = [
  "Phew...\\c\\n",
  "This long journey is hard on this\\n",
  "old body.$",
]

[msg.section_0.entries.110]
text = [
  "Hmm. You've got 28 straight wins, huh?\\c\\n",
  "This time, I want to keep going\\n",
  "with this momentum.$",
]

[msg.section_0.entries.111]
text = [
  "You also beat the Subway Boss, right?\\n",
  "Someday I want to battle you, too!$",
]

[msg.section_0.entries.112]
text = [
  "When my favorite Poké Ball begins\\n",
  "to shake, I tremble with excitement!\\c\\n",
  "You're no ordinary Trainer, are you?\\n",
  "Perhaps you are the Champion somewhere?$",
]

[msg.section_0.entries.113]
text = [
  "Winning battles feels good, but I've\\n",
  "traveled quite far... I wonder if I can\\l\\n",
  "get back in time for work tomorrow...$",
]

[msg.section_0.entries.114]
text = [
  "I finally have a 49-battle win streak.\\c\\n",
  "If I can do this well at work, I wonder\\n",
  "if I can get promoted...$",
]

[msg.section_0.entries.115]
text = [
  "Both you and I have won more than\\n",
  "100 straight battles!\\c\\n",
  "I may have too much time on my hands,\\n",
  "but so do you.\\c\\n",
  "Take this to commemorate our meeting of\\n",
  "two similar people!\\c$",
]

[msg.section_0.entries.116]
text = [
  "It's a really precious Berry, but I don't\\n",
  "know how to use it other than to eat it\\l\\n",
  "as a snack...$",
]

[msg.section_0.entries.117]
text = [
  "It's a subway map of the Unova region.\\c$",
]

[msg.section_0.entries.118]
text = [
  "Communicating. Please stand by...$",
]

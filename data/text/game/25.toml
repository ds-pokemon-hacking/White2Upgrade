  "Some problems have different answers\\n",
  "depending on the person.\\c\\n",
  "Still, the reason I can't keep my\\n",
  "curiosity down is this:\\l\\n",
  "I want to figure out the truth, but I\\l\\n",
  "also have a desire for adventure!$",

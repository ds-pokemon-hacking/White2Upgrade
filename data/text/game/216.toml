[msg.section_0.entries.0]
text = [
  "I came clear out to the Desert Resort\\n",
  "to train, but...\\c\\n",
  "It would be so much easier to\\n",
  "proceed if I had a Water-type Pokémon...$",
]

[msg.section_0.entries.1]
text = [
  "You're the second person to come\\n",
  "clear out here to talk to me!\\c\\n",
  "I'm so moved!\\n",
  "So, I'll give you this!\\c$",
]

[msg.section_0.entries.2]
text = [
  "If a Pokémon holds this Soft Sand, the\\n",
  "power of its Ground-type moves goes up!$",
]

[msg.section_0.entries.3]
text = [
  "According to what I've heard, that\\n",
  "Relic Castle is the ruins of a city built\\l\\n",
  "by the hero of old and the dragon\\l\\n",
  "Pokémon that accompanied the hero.$",
]

[msg.section_0.entries.4]
text = [
  "Oh! A sea of sand! I don't need\\n",
  "Go-Goggles here!\\c\\n",
  "The Mirage Tower in a desert\\n",
  "of the Hoenn region has disappeared.\\c\\n",
  "Unova's desert is also swallowing\\n",
  "up the Relic Castle little by little.$",
]

[msg.section_0.entries.5]
text = [
  "An expansive desert and\\n",
  "a castle buried in sand!\\c\\n",
  "There's no doubt about it!\\n",
  "Treasure is here!\\c\\n",
  "It's been a year since the day my\\n",
  "internal treasure detector went off,\\l\\n",
  "but I still haven't found any yet.\\l\\n",
  "I'm still following my dream, though...\\c\\n",
  "And I'm having so much fun\\n",
  "I can barely stand it!\\c$",
]

[msg.section_0.entries.6]
text = [
  "The Funfest Mission\\n",
  "“[VAR FUNFESTMISSION(0)]\\\"\\l\\n",
  "has been added to the Entralink!$",
]

[msg.section_0.entries.7]
text = [
  "Spending each day living my dream...\\n",
  "Is THAT my treasure?!$",
]

[msg.section_0.entries.0]
text = [
  "Greetings, challenger.\\n",
  "My name is Marshal.\\c\\n",
  "I am the No. 1 pupil of my mentor, Alder.\\c\\n",
  "In order to master the art of fighting,\\n",
  "I've kept training.\\c\\n",
  "You're also walking a similar path\\n",
  "with your Pokémon.\\c\\n",
  "It is my intention to test you--to take\\n",
  "you to the limits of your strength. Kiai!\\c$",
]

[msg.section_0.entries.1]
text = [
  "You look familiar...\\n",
  "Ah, yes. I met you at Twist Mountain.\\c\\n",
  "The strength you are radiating\\n",
  "is far greater now than before!\\c\\n",
  "Greetings, challenger.\\n",
  "My name is Marshal.\\c\\n",
  "I am the No. 1 pupil of my mentor, Alder.\\c\\n",
  "In order to master the art of fighting,\\n",
  "I've kept training.\\c\\n",
  "You're also walking a similar path\\n",
  "with your Pokémon.\\c\\n",
  "It is my intention to test you--to take\\n",
  "you to the limits of your strength. Kiai!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Whew! Well done!\\c\\n",
  "As your battles continue,\\n",
  "aim for even greater heights!$",
]

[msg.section_0.entries.3]
text = [
  "You are a strong challenger.\\c\\n",
  "Walk the path you believe in\\n",
  "with the Pokémon you believe in.\\c\\n",
  "The other members of the Elite Four\\n",
  "are far more powerful than I am.\\c\\n",
  "Do not underestimate them!$",
]

[msg.section_0.entries.4]
text = [
  "Now... You have become the strongest\\n",
  "Trainer in this Pokémon League.\\c\\n",
  "The statue in the central chamber will\\n",
  "take you to the Champion's room.$",
]

[msg.section_0.entries.5]
text = [
  "I thank you deeply for the chance for\\n",
  "another round of combat against you.\\c\\n",
  "In myself, I seek to develop\\n",
  "the strength of a fighter.\\c\\n",
  "And shatter any weakness in myself!\\c\\n",
  "Prevailing with the force of\\n",
  "my convictions!\\c\\n",
  "Victory, decisive victory, is my intention!\\n",
  "Challenger, here I come!\\c$",
]

[msg.section_0.entries.6]
text = [
  "There are still many strong Trainers\\n",
  "in this Pokémon League.\\c\\n",
  "You should deepen your bonds with\\n",
  "your Pokémon by battling with them.$",
]

[msg.section_0.entries.7]
text = [
  "During the days when I was young,\\n",
  "I was wandering all the regions\\l\\n",
  "of the world.\\c\\n",
  "I was devoted only to training,\\n",
  "in order to surpass my mentor.\\c\\n",
  "And when I felt so ashamed\\n",
  "two years ago...\\c\\n",
  "My Pokémon were always there for me.\\c\\n",
  "That thought crossed my mind\\n",
  "even though I was completely focused\\l\\n",
  "on our battle...\\c\\n",
  "You're a mysterious Trainer.$",
]

[msg.section_0.entries.8]
text = [
  "The strength shown by you and your\\n",
  "Pokémon has deeply impressed me...\\c\\n",
  "Please, continue to the next room\\n",
  "to face the strongest Trainer\\l\\n",
  "of the Unova region!$",
]

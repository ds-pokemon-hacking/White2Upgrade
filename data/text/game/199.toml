[msg]
trailing_data = "3232"

[msg.section_0.entries.0]
text = [
  "The jumpsuit I'm wearing is an essential\\n",
  "part of creating visual effects!\\c\\n",
  "It may be cutting-edge technology,\\n",
  "but it's pretty embarrassing to wear!$",
]

[msg.section_0.entries.1]
text = [
  "Hey, ya got this, kid?\\n",
  "What we mean by VFX\\l\\n",
  "is visual effects.\\c\\n",
  "It's a technology that lets us\\n",
  "use computers to process images.\\c\\n",
  "In Pokéstar Studios movies,\\n",
  "the effects are really important!$",
]

[msg.section_0.entries.2]
text = [
  "I'm the screenwriter!\\c\\n",
  "I write the scripts that become\\n",
  "the movie's stories.\\c\\n",
  "Feels like my head is packed\\n",
  "with nothing but stories.$",
]

[msg.section_0.entries.3]
text = [
  "I'm a big guy, but I work with\\n",
  "small movie props.\\c\\n",
  "Sometimes I even make\\n",
  "the items actors use or the\\l\\n",
  "furniture on the sets!$",
]

[msg.section_0.entries.4]
text = [
  "Hello! I'm the cinematographer.\\c\\n",
  "Well, put more simply,\\n",
  "I'm the cameraman.$",
]

[msg.section_0.entries.5]
text = [
  "Hey there! I'm the audio engineer!\\c\\n",
  "My job is doing things like\\n",
  "recording the actor's lines.\\c\\n",
  "Most of Pokéstar Studios'\\n",
  "dialog is dubbed in later, so right now,\\l\\n",
  "I have a bit of time on my hands!$",
]

[msg.section_0.entries.6]
text = [
  "C'mon... Where could it be?\\c\\n",
  "I'm going to get in trouble again\\n",
  "if I can't find that megaphone!\\c\\n",
  "Oh, do you work in films?\\n",
  "I'm working as the AD.\\c\\n",
  "I guess you could call the\\n",
  "AD the assistant director.$",
]

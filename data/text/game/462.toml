[msg.section_0.entries.0]
text = [
  "Grunt 1: Did you hear?\\c$",
]

[msg.section_0.entries.1]
text = [
  "Grunt 2: Did I hear what?\\c$",
]

[msg.section_0.entries.2]
text = [
  "Grunt 1: Well, I ran into some of\\n",
  "our old allies.\\c$",
]

[msg.section_0.entries.3]
text = [
  "Grunt 2: Oh! Those who are still\\n",
  "in Team Plasma?\\c$",
]

[msg.section_0.entries.4]
text = [
  "Grunt 1: They tried to convince me\\n",
  "to rejoin Team Plasma.\\c$",
]

[msg.section_0.entries.5]
text = [
  "Grunt 2: Seriously?\\c\\n",
  "Well, quite a few of them\\n",
  "are still in Team Plasma.\\c\\n",
  "Lord Ghetsis... No, just Ghetsis.\\c\\n",
  "I guess he was actually pretty good.\\c\\n",
  "He's awesome!\\n",
  "Haha. Just kidding!\\c$",
]

[msg.section_0.entries.6]
text = [
  "Grunt 1: What? How dare you say that?\\c\\n",
  "How can you say such a thing even after\\n",
  "you know what he's done to Lord N?!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Grunt 2: Of course,\\n",
  "that was disgusting.\\c\\n",
  "But even if you live honestly,\\n",
  "I'm telling you, the world is cold.\\c\\n",
  "As if you were surrounded by Cryogonal.\\c$",
]

[msg.section_0.entries.8]
text = [
  "Grunt 1: Yeah, you're right.\\c\\n",
  "It has flaws, but\\n",
  "Team Plasma is Team Plasma.\\c$",
]

[msg.section_0.entries.9]
text = [
  "Grunt 2: Don't you think we could have\\n",
  "gone to a region far away?\\c\\n",
  "Organizations like Team Plasma\\n",
  "must exist everywhere.\\l\\n",
  "We might have gotten favorable treatment\\l\\n",
  "because of our experience!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Grunt 1: Stupid, stupid, stupid!\\c\\n",
  "And did I mention stupid?\\c\\n",
  "It all adds up to nincompoop!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Ouch, ouch, ouch, ouch, ouch!\\n",
  "Owwwww!\\c$",
]

[msg.section_0.entries.12]
text = [
  "Grunt 1: We have to do something\\n",
  "for Pokémon. Did you forget that?\\c$",
]

[msg.section_0.entries.13]
text = [
  "Grunt 2: Honestly, I'm sorry.\\c\\n",
  "But Pokémon have a hard time, too.\\n",
  "Don't you think?\\c\\n",
  "Once they are in Poké Balls, that's it...\\c\\n",
  "That might happen. Still, do they really\\n",
  "like their Trainers?\\c$",
]

[msg.section_0.entries.14]
text = [
  "Grunt 1: Yeah!\\c\\n",
  "But Lord N was listening to such feelings\\n",
  "and words from Pokémon...\\c\\n",
  "Just imagining it\\n",
  "can break my heart.\\c$",
]

[msg.section_0.entries.15]
text = [
  "Grunt 2: Lord N...\\n",
  "I wonder where he is...\\c\\n",
  "Now, let's go find the Pokémon\\n",
  "in N's Castle.\\l\\n",
  "We have to protect them.\\c$",
]

[msg.section_0.entries.16]
text = [
  "N: [SPEED(1)]I'm here, though...[SPEED(0)]\\c$",
]

[msg.section_0.entries.17]
text = [
  "[SPEED(1)]I've been worried about\\n",
  "the people who believed in me...\\c\\n",
  "But it seems they know\\n",
  "what they can do for Pokémon\\l\\n",
  "in their own ways.[SPEED(0)]\\c$",
]

[msg.section_0.entries.18]
text = [
  "[SPEED(1)]Compared to them...\\n",
  "What was I doing?\\c\\n",
  "What I really should have done was\\n",
  "tell people about how Pokémon feel...![SPEED(0)]\\c$",
]

[msg.section_0.entries.19]
text = [
  "[SPEED(1)]The legendary Dragon-type\\n",
  "Pokémon knew that.\\c\\n",
  "It has lived long\\n",
  "and known many people.\\c\\n",
  "It knew humans and Pokémon have lived\\n",
  "and will live together.\\c\\n",
  "It knew that in this relationship,\\n",
  "humans' actions have an enormous impact\\l\\n",
  "on Pokémon.\\c\\n",
  "That's why it helps the one\\n",
  "who searches for truth...\\l\\n",
  "the one who opens the way to the future.[SPEED(0)]\\c$",
]

[msg.section_0.entries.20]
text = [
  "[SPEED(1)]The legendary Dragon-type\\n",
  "Pokémon knew that.\\c\\n",
  "It has lived long\\n",
  "and known many people.\\c\\n",
  "It knew humans and Pokémon have lived\\n",
  "and will live together.\\c\\n",
  "It knew that in this relationship,\\n",
  "humans' actions have an enormous impact\\l\\n",
  "on Pokémon.\\c\\n",
  "That's why it helps the one\\n",
  "who searches for truth...\\l\\n",
  "the one who opens the way to the future.[SPEED(0)]\\c$",
]

[msg.section_0.entries.21]
text = [
  "[SPEED(1)]It's not necessary...\\c\\n",
  "Separating black from white\\n",
  "and humans from Pokémon!\\c\\n",
  "If you think in terms of each\\n",
  "individual life, this world was in a state\\l\\n",
  "that couldn't be divided any further.\\c\\n",
  "Possibilities are born out of\\n",
  "combining and fusing these\\l\\n",
  "different lives!\\c\\n",
  "There are some things we can\\n",
  "understand only by doing this.\\c\\n",
  "It will give form to unseen things.\\c\\n",
  "These formulae will restructure\\n",
  "the world and make it richer![SPEED(0)]\\c$",
]

[msg.section_0.entries.22]
text = [
  "[SPEED(1)]From their Poké Balls, I can hear the\\n",
  "many different feelings Pokémon have\\l\\n",
  "about their Trainers!\\c\\n",
  "More than anything, I can hear their joy\\n",
  "that they met people who need them!\\c$",
]

[msg.section_0.entries.23]
text = [
  "[SPEED(1)]I'll go...\\c\\n",
  "For Pokémon,\\n",
  "for Trainers,\\l\\n",
  "and for all lives...\\c\\n",
  "And for my friends\\n",
  "who saved me![SPEED(0)]\\c$",
]

[msg.section_0.entries.0]
text = [
  "Bianca: Heeey!\\n",
  "This way!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Bianca: Come on!\\n",
  "This way!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Bianca: This kinda reminds me\\n",
  "of that day on Route 1.\\c$",
]

[msg.section_0.entries.3]
text = [
  "OK, here's how it works.\\c\\n",
  "The Pokédex's pages fill up\\n",
  "automatically when you meet Pokémon!\\c\\n",
  "And when you catch a Pokémon,\\n",
  "more detailed information on it\\l\\n",
  "is added to the Pokédex!\\c\\n",
  "Here, I'll show you how to catch\\n",
  "a Pokémon! Starting...NOW!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Bianca: What a relief!\\n",
  "I caught a Pokémon!\\c\\n",
  "Oh! Um...\\n",
  "Right. I'll go over the important stuff.\\c\\n",
  "First, go find a healthy\\n",
  "Pokémon to catch!\\l\\n",
  "You need to remember this next bit!\\c\\n",
  "It's best to lower the Pokémon's HP\\n",
  "before you try to catch it.\\c\\n",
  "Use your Pokémon's moves to lower the HP\\n",
  "of the Pokémon you want to catch.\\l\\n",
  "Making it fall asleep or paralyzing it\\l\\n",
  "will make it even easier to catch!\\c$",
]

[msg.section_0.entries.5]
text = [
  "You're going to go deliver\\n",
  "the Town Map to your friend, right?\\c$",
]

[msg.section_0.entries.6]
text = [
  "Continue straight this way\\n",
  "to get to Floccesy Town!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Bye now!\\n",
  "Meet lots of Pokémon\\l\\n",
  "and catch a lot of them, OK?\\c$",
]

[msg.section_0.entries.8]
text = [
  "???: You there, Trainer!\\c$",
]

[msg.section_0.entries.9]
text = [
  "My name is Alder!\\c\\n",
  "I'm a Trainer with a keen interest in the\\n",
  "world. One of my goals is to tell people\\l\\n",
  "about how wonderful it is to walk toward\\l\\n",
  "the future together with Pokémon.\\c$",
]

[msg.section_0.entries.10]
text = [
  "And you are?\\c\\n",
  "...\\n",
  "...\\c\\n",
  "Hmph! So you're [VAR TRNAME(0)]\\n",
  "from Aspertia City!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Your [VAR PKNAME(1)] is\\n",
  "a fine-looking Pokémon!\\c\\n",
  "But, you're not exactly\\n",
  "a seasoned Trainer yet...\\c\\n",
  "Indeed! I'll train you a little!\\n",
  "Follow me!\\c$",
]

[msg.section_0.entries.12]
text = [
  "Hey, you know about ledge jumping?$",
]

[msg.section_0.entries.13]
text = [
  "Oh...\\c\\n",
  "I guess you would know you can\\n",
  "jump off these little ledges.$",
]

[msg.section_0.entries.14]
text = [
  "That so...\\n",
  "Well then, watch me carefully!\\c$",
]

[msg.section_0.entries.15]
text = [
  "From the top of the ledge!\\c\\n",
  "Boing!\\c$",
]

[msg.section_0.entries.16]
text = [
  "It's really cool how you can take\\n",
  "shortcuts by jumping off these, right?$",
]

[msg.section_0.entries.17]
text = [
  "          $$",
]

[msg.section_0.entries.18]
text = [
  "           $$",
]

[msg.section_0.entries.19]
text = [
  "                                                                                               $$",
]

[msg.section_0.entries.20]
text = [
  "                         $$",
]

[msg.section_0.entries.21]
text = [
  "                                                                      $$",
]

[msg.section_0.entries.22]
text = [
  "                                                                                                                                                      $$",
]

[msg.section_0.entries.23]
text = [
  "                                                                                   $$",
]

[msg.section_0.entries.24]
text = [
  "Know what? I'm searching for\\n",
  "Pokémon in the tall grass!\\c\\n",
  "That's right! If you don't want\\n",
  "to meet Pokémon, avoid the tall grass!$",
]

[msg.section_0.entries.25]
text = [
  "[VAR TRNAME(0)]!\\c$",
]

[msg.section_0.entries.26]
text = [
  "Excuse me! I forgot to tell\\n",
  "you something important!\\c\\n",
  "First, take these!\\c$",
]

[msg.section_0.entries.27]
text = [
  "Those are Oran Berries!\\c\\n",
  "If you give one to your Pokémon,\\n",
  "its HP will be restored.\\c$",
]

[msg.section_0.entries.28]
text = [
  "What's more! You can give your Pokémon\\n",
  "a Berry to hold!\\c\\n",
  "Like this Oran Berry, for instance.\\n",
  "When a Pokémon holds this Berry, it can\\l\\n",
  "eat the Berry if it gets hurt in the heat\\l\\n",
  "of battle and regain some of its lost HP!\\c$",
]

[msg.section_0.entries.29]
text = [
  "Well... I just told you\\n",
  "to challenge the Gym Leader.\\c\\n",
  "Aspertia's Gym Leader\\n",
  "is a very strong Pokémon Trainer!\\c\\n",
  "But you have nothing to worry about!\\c\\n",
  "If you think hard about what the\\n",
  "Pokémon at your side can do,\\l\\n",
  "and what you should do as a Trainer,\\l\\n",
  "victory will be yours!\\c$",
]

[msg.section_0.entries.30]
text = [
  "And then you should take on\\n",
  "stronger and stronger Trainers...\\l\\n",
  "Actually, take on the Gym Leaders\\l\\n",
  "of each city!\\c\\n",
  "Working together with your Pokémon\\n",
  "is what makes you grow as a Trainer.\\c\\n",
  "As you and your Pokémon grow stronger,\\n",
  "your world will get broader!\\c$",
]

[msg.section_0.entries.31]
text = [
  "Route 19$",
]

[msg.section_0.entries.32]
text = [
  "Route 19$",
]

[msg.section_0.entries.33]
text = [
  "Trainer Tips!\\c\\n",
  "\\n",
  "Make an effort to talk to all the\\n",
  "people you meet during your journey!\\c\\n",
  "Chances are they will have something\\n",
  "useful to tell you.$",
]

[msg.section_0.entries.34]
text = [
  "You can use Surf?\\n",
  "Nice! We can be Surf buddies!$",
]

[msg.section_0.entries.0]
text = [
  "I am researching Pokémon Fossils here.\\c$",
]

[msg.section_0.entries.1]
text = [
  "You have a Fossil, don't you?\\n",
  "Shall I turn it back into a Pokémon?$",
]

[msg.section_0.entries.2]
text = [
  "Which Fossil should I turn back\\n",
  "into a Pokémon?$",
]

[msg.section_0.entries.3]
text = [
  "OK, then!\\c\\n",
  "I'll turn that [VAR ITEM2(0)]\\n",
  "back into a Pokémon for you!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Oh, you'd like to keep it as a Fossil? OK!$",
]

[msg.section_0.entries.5]
text = [
  "                         $$",
]

[msg.section_0.entries.6]
text = [
  "The Fossil you gave me turned back into\\n",
  "a Pokémon!\\c\\n",
  "This is [VAR PKNAME(0)]!\\n",
  "Please take good care of it.\\c$",
]

[msg.section_0.entries.7]
text = [
  "[VAR TRNAME(0)] received\\n",
  "[VAR PKNAME(1)]!$",
]

[msg.section_0.entries.8]
text = [
  "Would you like to give a nickname to the\\n",
  "newly received [VAR PKNAME(0)]?$",
]

[msg.section_0.entries.9]
text = [
  "Oh, I'm sorry. Your party is full.\\c\\n",
  "I will keep it with extra care, so please\\n",
  "come back to pick it up when you can!$",
]


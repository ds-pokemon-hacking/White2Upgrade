[msg.section_0.entries.0]
text = [
  "The legendary Pokémon Reshiram\\n",
  "shared its wisdom with the hero\\l\\n",
  "and defied foes with columns of fire.\\c\\n",
  "The hero and that Pokémon were as\\n",
  "close as a parent and child.\\c\\n",
  "It was indeed awe inspiring\\n",
  "to see them!$",
]

[msg.section_0.entries.1]
text = [
  "The legendary Pokémon Zekrom\\n",
  "shared its wisdom with the hero\\l\\n",
  "and defied foes with fierce lightning.\\c\\n",
  "The hero and that Pokémon were as\\n",
  "close as a parent and child.\\c\\n",
  "It was indeed awe inspiring\\n",
  "to see them!$",
]

[msg.section_0.entries.2]
text = [
  "Always, the tower looms,\\n",
  "disdainful of the wind and snow.\\c\\n",
  "Perhaps its presence is telling us\\n",
  "not to forget dreams and ideals...$",
]

[msg.section_0.entries.3]
text = [
  "The legendary Pokémon gave help\\n",
  "to the hero who sought truth.\\l\\n",
  "Because of that, a region was created.\\c\\n",
  "Then, when its physical form was lost,\\n",
  "the Pokémon became the Light Stone,\\l\\n",
  "waiting patiently for a new hero.\\c\\n",
  "The story I heard when I was little\\n",
  "turned out to be true.$",
]

[msg.section_0.entries.4]
text = [
  "The legendary Pokémon gave help\\n",
  "to the hero who sought ideals.\\l\\n",
  "Because of that, a region was created.\\c\\n",
  "Then, when its physical form was lost,\\n",
  "the Pokémon became the Dark Stone,\\l\\n",
  "waiting patiently for a new hero.\\c\\n",
  "The story I heard when I was little\\n",
  "turned out to be true.$",
]

[msg.section_0.entries.5]
text = [
  "Brycen has been surrounded by\\n",
  "Ice-type Pokémon and has trained in the\\l\\n",
  "martial arts ever since he was a child.\\c\\n",
  "He's become an action star\\n",
  "using that experience!$",
]

[msg.section_0.entries.6]
text = [
  "Truth! Ideals!\\n",
  "Two dragons!$",
]

[msg.section_0.entries.7]
text = [
  "When one is divided, ♪\\n",
  "the world will broaden. ♪$",
]

[msg.section_0.entries.8]
text = [
  "Fused by splicers.\\n",
  "Divided by splicers.$",
]

[msg.section_0.entries.9]
text = [
  "Truth and ideals.\\n",
  "Move forward hand in hand. ♪$",
]

[msg.section_0.entries.10]
text = [
  "If you walk in the wetlands, you might\\n",
  "surprise wild Pokémon into popping out!$",
]

[msg.section_0.entries.11]
text = [
  "When the wetlands freeze, it's slippery.\\n",
  "I wonder how wetland Pokémon manage?$",
]

[msg.section_0.entries.12]
text = [
  "You...\\n",
  "Congratulations.\\c\\n",
  "Ghetsis won't do anything anymore...\\c\\n",
  "No, to be more precise,\\n",
  "he can't do anything anymore...\\c\\n",
  "That's why we won't forgive you.\\n",
  "Battle us!$",
]

[msg.section_0.entries.13]
text = [
  "Battle us!$",
]

[msg.section_0.entries.14]
text = [
  "I'll win! That is the only way\\n",
  "to regain his lost heart!\\c$",
]

[msg.section_0.entries.15]
text = [
  "The next is me...\\c\\n",
  "But you don't have enough Pokémon\\n",
  "for a Triple Battle.\\c\\n",
  "I'll battle you when the season changes.\\c$",
]

[msg.section_0.entries.16]
text = [
  "What do you want?\\n",
  "Do you want to keep battling?$",
]

[msg.section_0.entries.17]
text = [
  "Battle for Ghetsis!\\c\\n",
  "That is the only proof\\n",
  "that I'm living now.\\c$",
]

[msg.section_0.entries.18]
text = [
  "I see...\\c\\n",
  "When the season changes,\\n",
  "I'll battle you.\\c$",
]

[msg.section_0.entries.19]

[msg.section_0.entries.0]
text = [
  "       $$",
]

[msg.section_0.entries.1]
text = [
  "Hm... I see...\\n",
  "That kid sounds promising...\\c$",
]

[msg.section_0.entries.2]
text = [
  "Indeed... And that kid should\\n",
  "be here any moment!\\c$",
]

[msg.section_0.entries.3]
text = [
  "Oh!\\n",
  "And look who should appear!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Welcome...to Pokéstar Studios!\\c\\n",
  "Hey, [VAR TRNAME(0)]!\\n",
  "We've been waiting for you!\\c\\n",
  "This is our boss,\\n",
  "Mr. Stu Deeoh!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Bonsoir! Hello!\\n",
  "I'm Stu Deeoh! Charmed, I'm sure!\\c\\n",
  "So you must be [VAR TRNAME(0)].\\n",
  "We were just talking about you!\\c\\n",
  "I'd like to explain Pokéstar Studios,\\n",
  "but I need a little time to prepare!\\c\\n",
  "I'm so sorry, dahling,\\n",
  "could you wait an eensy moment?\\c$",
]

[msg.section_0.entries.6]
text = [
  "In the meantime, I'll show you around\\n",
  "Pokéstar Studios!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Oh, that would be maaarvelous!\\c\\n",
  "Movies! They're amazing!\\c\\n",
  "Pokéstar Studios inspires and\\n",
  "moves people all over the world!\\l\\n",
  "You can make sure [VAR TRNAME(0)]\\l\\n",
  "experiences its many charms!\\c\\n",
  "Well then, I absolutely must\\n",
  "be off and start my preparations!\\l\\n",
  "I'll see you in a minute!$",
]

[msg.section_0.entries.8]
text = [
  "That's my boss for you!\\n",
  "What graceful footwork!\\c\\n",
  "Well then, [VAR TRNAME(0)],\\n",
  "come with me!\\c$",
]

[msg.section_0.entries.9]
text = [
  "First, let me tell you briefly\\n",
  "what Pokéstar Studios is all about!\\c\\n",
  "Pokéstar Studios was built for making\\n",
  "films--it's a movie metropolis!\\c\\n",
  "Many films are made and released\\n",
  "right here!\\c$",
]

[msg.section_0.entries.10]
text = [
  "This is the theater!\\c\\n",
  "Of course, this is where\\n",
  "the films are shown.\\l\\n",
  "Movie fans from all over\\l\\n",
  "also gather here!\\c\\n",
  "How about we have a look inside?\\c$",
]

[msg.section_0.entries.11]
text = [
  "This is the filming studio!\\c\\n",
  "This is where Pokéstar Studios\\n",
  "movies are born!\\c\\n",
  "Well now, come inside!\\n",
  "Mr. Deeoh should be waiting!\\c$",
]

[msg.section_0.entries.12]
text = [
  "Hey, AD!\\c\\n",
  "That set is in the way of my film!\\c\\n",
  "It's slowing down shooting,\\n",
  "so go get it out of the way right now!$",
]

[msg.section_0.entries.13]
text = [
  "Hey, AD!\\c\\n",
  "The shape of those clouds in the sky\\n",
  "doesn't work with my film at all!\\c\\n",
  "It's slowing down shooting, so go\\n",
  "get them out of the way right now!$",
]

[msg.section_0.entries.14]
text = [
  "You did it, AD!\\c\\n",
  "We got the perfect scene!\\n",
  "So now, we have to go back and\\l\\n",
  "reshoot all of the others from scratch!$",
]

[msg.section_0.entries.15]
text = [
  "Hey, AD!!\\c\\n",
  "This Lillipup's fur is different from\\n",
  "what I'd envisioned!\\c\\n",
  "Hurry up and bring another Lillipup!$",
]

[msg.section_0.entries.16]
text = [
  "Why, if it isn't [VAR TRNAME(0)]!\\n",
  "I thought you were my AD!\\c\\n",
  "A star as big as you\\n",
  "can be in one of my films!\\c\\n",
  "Would you replace that Lillipup\\n",
  "and play the Pokémon's part?$",
]

[msg.section_0.entries.17]
text = [
  "Man... That director's\\n",
  "going off again...\\c\\n",
  "His films may be pretty good,\\n",
  "but there's a fine line between\\l\\n",
  "genius and insanity...$",
]

[msg.section_0.entries.18]
text = [
  "Bwoo! Bowoof!$",
]

[msg.section_0.entries.19]
text = [
  "I'm a rookie assistant director.\\c\\n",
  "I love movies, but\\n",
  "I'm not good at making them yet.\\c\\n",
  "The director is really strict,\\n",
  "and he's always getting mad at me.\\c\\n",
  "But...\\c\\n",
  "Working for him is teaching me a lot.$",
]

[msg.section_0.entries.20]
text = [
  "You're a Pokéstar Studios\\n",
  "actor as well, right?\\c\\n",
  "A single line from an actor\\n",
  "can change an entire film!\\c\\n",
  "Movie shoots are full of\\n",
  "possibilities at Pokéstar Studios!$",
]

[msg.section_0.entries.21]
text = [
  "I'm rehearsing right now.\\c\\n",
  "In order to make a good film,\\n",
  "doing a lot of work before the shoot\\l\\n",
  "is really important!$",
]

[msg.section_0.entries.22]
text = [
  "There's a dressing room\\n",
  "inside this trailer.\\c\\n",
  "Inside they're doing costume fitting,\\n",
  "makeup, and script checks!\\c\\n",
  "I just finished changing!\\n",
  "I'm going to give it my best today, too!$",
]

[msg.section_0.entries.23]
text = [
  "Special sets and movie props\\n",
  "are stored inside!\\c\\n",
  "Before VFX became so advanced,\\n",
  "we actually had to make a lot of things!$",
]

[msg.section_0.entries.24]
text = [
  "Hey, darling!\\n",
  "What are we going to watch today?$",
]

[msg.section_0.entries.25]
text = [
  "C'mon, darling!\\n",
  "Let's watch one of [VAR TRNAME(0)]'s\\l\\n",
  "movies today!$",
]

[msg.section_0.entries.26]
text = [
  "Well now...\\c\\n",
  "I'd like to see a love story\\n",
  "just like ours!$",
]

[msg.section_0.entries.27]
text = [
  "Hm... What movie to see...\\c\\n",
  "[VAR TRNAME(0)] is the one who\\n",
  "always acts really well, right?$",
]

[msg.section_0.entries.28]
text = [
  "Hello there! How about a portrait of one\\n",
  "of Pokéstar Studios' famous stars?\\c\\n",
  "Right now...\\c\\n",
  "Brycen's is a hot ticket\\n",
  "with women and kids.\\c\\n",
  "Sabrina's is extremely popular with guys!\\c\\n",
  "Huh? I'm afraid we don't carry one\\n",
  "of [VAR TRNAME(0)].$",
]

[msg.section_0.entries.29]
text = [
  "Good day! How about a portrait of one of\\n",
  "Pokéstar Studios' famous stars?\\c\\n",
  "Right now...\\c\\n",
  "Brycen's is very popular with\\n",
  "women and kids.\\c\\n",
  "Sabrina's is extremely popular with guys!\\c\\n",
  "Huh? We've started stocking portraits\\n",
  "of [VAR TRNAME(0)] recently, but the sales\\l\\n",
  "are nothing to write home about.$",
]

[msg.section_0.entries.30]
text = [
  "Hello there! How about a portrait of one\\n",
  "of Pokéstar Studios' famous stars?\\c\\n",
  "Right now, the most popular is...\\c\\n",
  "[VAR TRNAME(0)]. There's no doubt about it!\\n",
  "Hey, has anyone ever mentioned\\l\\n",
  "you look kinda like [VAR TRNAME(0)]?\\c\\n",
  "I'm really jealous!\\n",
  "I wish I resembled a star like that.$",
]

[msg.section_0.entries.31]
text = [
  "Brilliant actors come to Pokéstar Studios\\n",
  "from all over the world to make movies!\\c\\n",
  "That's why the titles of movies are\\n",
  "in so many different languages!$",
]

[msg.section_0.entries.32]
text = [
  "Someday, I'm going to be in pictures,\\n",
  "become a famous actor,\\l\\n",
  "and buy a mansion!\\c\\n",
  "A really big mansion! A huge one!$",
]

[msg.section_0.entries.33]
text = [
  "Oh! It's the star who was in the movie\\n",
  "I just watched--[VAR TRNAME(0)]!\\c\\n",
  "[VAR TRNAME(0)], you're a star,\\n",
  "so you're living in a mansion, right?\\l\\n",
  "A really big one? A huge one?$",
]

[msg.section_0.entries.34]
text = [
  "I hear Pokéstar Studios\\n",
  "makes horror films as well.\\c\\n",
  "Man, who even watches kids'\\n",
  "stuff like that anyway?!$",
]

[msg.section_0.entries.35]
text = [
  "Hey, I know him!\\c\\n",
  "He was the guy yelling “Mama!\\\"\\n",
  "during the movie with ghosts!$",
]

[msg.section_0.entries.36]
text = [
  "When I look at this from here,\\n",
  "I feel like I've become a monster!\\c\\n",
  "Roar!\\c\\n",
  "Ha ha ha...$",
]

[msg.section_0.entries.37]
text = [
  "Just looking at the posters is exciting!\\n",
  "Which movie should I watch today?$",
]

[msg.section_0.entries.38]
text = [
  "Good grief...\\n",
  "I've been waiting for three hours...\\c\\n",
  "How long does it take\\n",
  "to put on makeup anyway?$",
]

[msg.section_0.entries.39]
text = [
  "Not just anybody can take part\\n",
  "in filming at Pokéstar Studios.\\c\\n",
  "Only Trainers approved by the owner\\n",
  "can participate.$",
]

[msg.section_0.entries.40]
text = [
  "The captain of the illustrious guard\\n",
  "protecting the star Sabrina is me!\\c\\n",
  "I rushed here when I heard she had\\n",
  "made a shocking debut as an actress.\\c\\n",
  "But recently, I've been interested\\n",
  "in a star named [VAR TRNAME(0)]!$",
]

[msg.section_0.entries.41]
text = [
  "Recently, films starring\\n",
  "[VAR TRNAME(0)] are getting a lot of buzz.\\c\\n",
  "...Wait? [VAR TRNAME(0)]?\\n",
  "I wish I had something for you to sign!$",
]

[msg.section_0.entries.42]
text = [
  "Ciao! Come va?\\n",
  "Are you used to Pokéstar Studios yet?\\c\\n",
  "The staff here is very international!\\n",
  "It's very exciting, isn't it?\\c\\n",
  "See you during a shoot someday!\\n",
  "Buona giornata!$",
]

[msg.section_0.entries.43]
text = [
  "¡Todos me consideran\\n",
  "una niña prodigio de la actuación! ¡Por no\\l\\n",
  "hablar de que soy una auténtica estrella!\\c\\n",
  "¡Mi popularidad y mi destreza como actriz\\n",
  "están a años luz de ti, principiante!$",
]

[msg.section_0.entries.44]
text = [
  "Excuse me, I'm her manager.\\c\\n",
  "What she just said is,\\c\\n",
  "“People know me as a\\n",
  "brilliant child actress!\\l\\n",
  "Not to mention I’m a top star!\\l\\n",
  "My popularity and acting skills\\l\\n",
  "are way beyond yours, rookie!\\\"$",
]

[msg.section_0.entries.45]
text = [
  "Guten Tag!\\c\\n",
  "Since you've come to Pokéstar Studios,\\n",
  "we suit actors have been busy.\\c\\n",
  "Bis bald!$",
]

[msg.section_0.entries.46]
text = [
  "Hey! It's [VAR TRNAME(0)]!\\n",
  "C'mon, give me an autograph!$",
]

[msg.section_0.entries.47]
text = [
  "Why, [VAR TRNAME(0)]...\\c\\n",
  "Let me ask you dis... When will you do me\\n",
  "da honor of being in one of my films?$",
]

[msg.section_0.entries.48]
text = [
  "¡Hola! ¿Qué tal?\\n",
  "You've become so famous!\\c\\n",
  "Even me, the top star in my country,\\n",
  "can't compete with you in Unova!$",
]

[msg.section_0.entries.49]
text = [
  "Hey! [VAR TRNAME(0)]!\\n",
  "Today, Pokéstar Studios is having\\l\\n",
  "a special ceremony!\\c\\n",
  "Mr. Stu Deeoh is waiting!\\n",
  "Come with me, won't you?!$",
]

[msg.section_0.entries.50]
text = [
  "[VAR TRNAME(0)], congratulations!\\c\\n",
  "Today is a special day for you\\n",
  "and for Pokéstar Studios!\\c\\n",
  "I treasure the time I've\\n",
  "spent acting with you!$",
]

[msg.section_0.entries.51]
text = [
  "Hey, [VAR TRNAME(0)]!\\c\\n",
  "I'm honored to have\\n",
  "been in a movie with you!\\c\\n",
  "Me? You don't remember me?\\c\\n",
  "You can't be serious!\\n",
  "I was the UFO!$",
]

[msg.section_0.entries.52]
text = [
  "If it isn't [VAR TRNAME(0)]!\\n",
  "You're too much! I'm so moved!\\l\\n",
  "Congratulations and everything!\\c\\n",
  "I-I'm so glad I was your\\n",
  "fan, [VAR TRNAME(0)]!$",
]

[msg.section_0.entries.53]
text = [
  "Acting with you...\\c\\n",
  "It was pretty fun and a\\n",
  "good experience.\\c\\n",
  "Coming clear out here\\n",
  "was worth it.$",
]

[msg.section_0.entries.54]
text = [
  "I'm proud that I was\\n",
  "able to make movies with you!\\c\\n",
  "Congratulations, [VAR TRNAME(0)]!$",
]

[msg.section_0.entries.55]
text = [
  "How great, [VAR TRNAME(0)]!\\c\\n",
  "Now listen!\\n",
  "I was the director of your debut!\\c\\n",
  "So I'm almost like your parent!\\n",
  "Don't forget to be grateful!$",
]

[msg.section_0.entries.56]
text = [
  "Hey, boss!\\n",
  "We're here!$",
]

[msg.section_0.entries.57]
text = [
  "Hm...\\c\\n",
  "[VAR TRNAME(0)],\\n",
  "today's a day to be remembered.\\c\\n",
  "When I built this place,\\n",
  "I made a wish and a promise.\\c\\n",
  "For the day Pokéstar Studios\\n",
  "would grow until it was a temple\\l\\n",
  "of entertainment that would\\l\\n",
  "amaze the whole world...\\c\\n",
  "And for the day that Pokéstar Studios\\n",
  "created a new star worthy of it...\\c\\n",
  "I wouldn't build anything\\n",
  "on this platform.\\c\\n",
  "But look...\\c\\n",
  "There's a bronze statue here now.\\n",
  "In other words, my wish has come true,\\l\\n",
  "and I fulfilled my promise.\\c\\n",
  "That's right, [VAR TRNAME(0)]...\\n",
  "It's all thanks to you!$",
]

[msg.section_0.entries.58]
text = [
  "Your acting excites the staff\\n",
  "and the other actors...\\c\\n",
  "Your acting charms audiences...\\c\\n",
  "You're amazing...\\c\\n",
  "Better said...\\c\\n",
  "You're the best...$",
]

[msg.section_0.entries.59]
text = [
  "[VAR TRNAME(0)]!\\c\\n",
  "You are the true star\\n",
  "of Pokéstar Studios!\\c\\n",
  "You're the shooting star across\\n",
  "the night sky that is the silver screen!$",
]

[msg.section_0.entries.60]
text = [
  "So that's why we got this\\n",
  "small gift for you.$",
]

[msg.section_0.entries.61]
text = [
  "Yessir, boss!\\c\\n",
  "OK! [VAR TRNAME(0)]!\\n",
  "Come this way!$",
]

[msg.section_0.entries.62]
text = [
  "Pokéstar Studios Sound Stage\\n",
  "No public access!$",
]

[msg.section_0.entries.63]
text = [
  "This fake building is so\\n",
  "detailed it looks real.$",
]

[msg.section_0.entries.64]
text = [
  "It's filled with movie props\\n",
  "for shooting films.$",
]

[msg.section_0.entries.65]
text = [
  "This detailed model of the Royal Unova\\n",
  "is a set for a movie.$",
]

[msg.section_0.entries.66]
text = [
  "It's a set for a movie.\\c\\n",
  "It's a model of the Skyarrow Bridge\\n",
  "done to 1/144 scale.$",
]

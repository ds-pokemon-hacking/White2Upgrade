[msg.section_0.entries.0]
text = [
  "Welcome to the Union Room.\\c\\n",
  "If there is anything you need help\\n",
  "with, please let me know!\\c$",
]

[msg.section_0.entries.1]
text = [
  "                     $$",
]

[msg.section_0.entries.2]
text = [
  "Which topic would you\\n",
  "like me to explain?$",
]

[msg.section_0.entries.3]
text = [
  "There are five Battle Formats.\\c\\n",
  "Single Battle is for two Trainers\\n",
  "with one or more Pokémon each.\\c\\n",
  "Each Trainer can have one Pokémon\\n",
  "in battle at a time.\\c\\n",
  "Double Battle is for two Trainers\\n",
  "with two or more Pokémon each.\\c\\n",
  "Each Trainer will send out two\\n",
  "Pokémon to battle at a time.\\c\\n",
  "Triple Battle is for two Trainers\\n",
  "with three or more Pokémon each.\\c\\n",
  "Each Trainer will send out three\\n",
  "Pokémon to battle at a time.\\c$",
]

[msg.section_0.entries.4]
text = [
  "Rotation Battle is for two Trainers\\n",
  "with three or more Pokémon each.\\c\\n",
  "Each Trainer sends out three Pokémon at\\n",
  "a time, one in front and two in the back.\\c\\n",
  "Multi Battle is for four Trainers\\n",
  "with one or more Pokémon each.\\c\\n",
  "Each Trainer can have one Pokémon\\n",
  "in battle at a time.\\c$",
]

[msg.section_0.entries.5]
text = [
  "You may trade your Pokémon with\\n",
  "other players.\\c\\n",
  "Meeting new people could be a\\n",
  "shortcut to meeting rare Pokémon!\\c$",
]

[msg.section_0.entries.6]
text = [
  "                                                                                                                                                   $$",
]

[msg.section_0.entries.7]
text = [
  "In a Spin Trade, participants each bring\\n",
  "an Egg for trading with others.\\c\\n",
  "Which Egg will you end up with?\\n",
  "What kind of Pokémon is in that Egg?\\l\\n",
  "It's quite exciting and fun!\\c\\n",
  "Up to five players can take part, so\\n",
  "try it with your friends!\\c$",
]

[msg.section_0.entries.8]
text = [
  "You may get together with others\\n",
  "and draw a picture.\\c\\n",
  "You all get to work on one sheet\\n",
  "of paper at the same time.\\c\\n",
  "I'm sure a drawing made by friends\\n",
  "will be a memorable masterpiece!\\c\\n",
  "Up to five players can take part,\\n",
  "so try it with your friends!\\c$",
]

[msg.section_0.entries.9]
text = [
  "If you touch an icon on the bar\\n",
  "on the Touch Screen below,\\l\\n",
  "you can choose words for chatting\\l\\n",
  "or tell others what you want to do,\\l\\n",
  "such as battles or trades.\\c\\n",
  "Also, players who have chosen the same\\n",
  "icon as you will jump up and down\\l\\n",
  "so you can spot them easily.\\c\\n",
  "Touch any icon to find a person you want\\n",
  "to play with.\\c$",
]


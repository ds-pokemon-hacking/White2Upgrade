[msg.section_0.entries.17]
text = [
  "This book collects research on\\n",
  "Pokémon bones and fossils.\\c\\n",
  "Not only can we learn about ancient\\n",
  "Pokémon's bodies from bones and fossils,\\l\\n",
  "we can learn about how people of ancient\\l\\n",
  "times interacted with Pokémon.\\c\\n",
  "To ancient people, Pokémon were a sacred\\n",
  "presence. They were revered to a much\\l\\n",
  "greater extent than happens today.$",
]

[msg.section_0.entries.18]
text = [
  "This book introduces the various Pokémon\\n",
  "that help out in the world of work.\\c\\n",
  "For a potter to fire plates and pots in a\\n",
  "kiln, the temperature must reach 600° F.\\c\\n",
  "This is where Pansear can help!\\c\\n",
  "It increases the temperature in its\\n",
  "prized tuft and fires the pottery!$",
]

[msg.section_0.entries.19]
text = [
  "This book is about how much the\\n",
  "Unova region has changed in two years.\\c\\n",
  "Each year, many people move to Unova,\\n",
  "so the environment and cities change\\l\\n",
  "at a dizzying pace.$",
]

[msg.section_0.entries.20]
text = [
  "This book is about the things you\\n",
  "can ride in the Unova region,\\l\\n",
  "such as Castelia City's cruise ship\\l\\n",
  "and Mistralton City's planes.\\c\\n",
  "Before there were planes, locomotives\\n",
  "carried people all over Unova.\\c\\n",
  "The railway in Nacrene City is\\n",
  "a legacy of those lines.$",
]

[msg.section_0.entries.21]
text = [
  "This is a book a Backpacker wrote\\n",
  "about visiting the Unova region's\\l\\n",
  "five famous bridges.\\c\\n",
  "There are around 200 pages dedicated\\n",
  "to the charms of drinking Lemonade\\l\\n",
  "and watching the cruise ship\\l\\n",
  "from the Skyarrow Bridge at sunset.$",
]

[msg.section_0.entries.22]
text = [
  "This is a magazine about the\\n",
  "gourmet foods in the Unova region.\\c\\n",
  "People in the know start out with\\n",
  "Moomoo Milk and a Village Sandwich.\\c\\n",
  "Then, to finish off the meal, a\\n",
  "classic favorite, a Casteliacone!$",
]


[msg.section_0.entries.25]
text = [
  "This is a story about a kind but\\n",
  "cowardly Lillipup.\\c\\n",
  "In order to save its sick grandmother,\\n",
  "it goes in search of medicine\\l\\n",
  "in a cave where a scary ghost lives.\\c\\n",
  "This volume tells the story of how the\\n",
  "crybaby Lillipup summons the courage\\l\\n",
  "to set off on its journey.$",
]

[msg.section_0.entries.26]
text = [
  "This is the story of a cowardly Lillipup\\n",
  "and a short-tempered Zorua.\\c\\n",
  "A violent Zorua blocks the path\\n",
  "of Lillipup, who is headed to\\l\\n",
  "a cave to get medicine.\\c\\n",
  "After this, that, and the other thing,\\n",
  "the two of them become friends\\l\\n",
  "and decide to travel together.$",
]

[msg.section_0.entries.27]
text = [
  "This is the story of a cowardly Lillipup,\\n",
  "a short-tempered Zorua, and\\l\\n",
  "a lonely Yamask.\\c\\n",
  "When Lillipup and Zorua enter the cave,\\n",
  "they hear a creepy cry!\\c\\n",
  "Sticking close to each other, deep into\\n",
  "the cave they go.\\c\\n",
  "They find a Yamask loudly crying.\\c\\n",
  "It wanted very much to make friends,\\n",
  "but everyone was scared of it,\\l\\n",
  "and nobody would be its friend.\\c\\n",
  "After this, that, and the other, they\\n",
  "figure this out, and the three new\\l\\n",
  "friends continue into the cave.$",
]

[msg.section_0.entries.28]
text = [
  "This is a story about three pals,\\n",
  "Lillipup, Zorua, and Yamask.\\c\\n",
  "After fleeing from a colony of Woobat\\n",
  "and working together to defeat a\\l\\n",
  "Krokorok that was being a bully, they\\l\\n",
  "find the medicinal herb Lillipup needs.\\c\\n",
  "The three of them make a pinky promise\\n",
  "to play together again, and each returns\\l\\n",
  "home, although they want to play more.\\c\\n",
  "Lillipup gives the medicinal herb to its\\n",
  "grandmother, and she feels better! Yay!\\c\\n",
  "From then on, the three Pokémon became\\n",
  "the best of friends forever, and\\l\\n",
  "everyone lived happily ever after!$",
]

[msg.section_0.entries.29]
text = [
  "I'll read to you from my favorite book--\\n",
  "“The Mythology of the Sinnoh Region.\\\"\\c\\n",
  "Long ago, when Sinnoh had just been\\n",
  "formed, Pokémon and humans led\\l\\n",
  "separate lives.\\c\\n",
  "That is not to say they did not help\\n",
  "one another. Indeed, they did.\\c\\n",
  "They supplied one another with necessary\\n",
  "items, and they supported one another.\\c\\n",
  "One Pokémon said to the others that they\\n",
  "should always be ready to help humans.\\c\\n",
  "It proposed that Pokémon be ready to\\n",
  "appear before humans whenever needed.\\c\\n",
  "Thus, to this day, Pokémon appear to\\n",
  "humans if they venture into tall grass.$",
]


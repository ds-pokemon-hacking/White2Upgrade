[msg.section_0.entries.0]
text = [
  "I've been searching for the legendary\\n",
  "Pokémon Cobalion for decades...$",
]

[msg.section_0.entries.1]
text = [
  "Oh! It's...\\n",
  "It's Cobalion!\\c\\n",
  "Now I understand.\\c\\n",
  "You were able to show it that\\n",
  "there are humans and Pokémon\\l\\n",
  "that understand one another\\l\\n",
  "and help each other out!\\c\\n",
  "But it's not just humans and Pokémon...\\n",
  "All living things must accept\\l\\n",
  "and trust each other.\\c\\n",
  "That's the best way to look at it.$",
]

[msg.section_0.entries.2]
text = [
  "I wonder if it still hates humans.\\c\\n",
  "Or...maybe it looks at this world\\n",
  "where Pokémon and people coexist\\l\\n",
  "and has thoughts about it...$",
]

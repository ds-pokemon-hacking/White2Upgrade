[msg]
trailing_data = "1c1c"

[msg.section_0.entries.0]
text = [
  "Lenora: Why hello, Burgh.\\c\\n",
  "What's up?\\n",
  "Suffering from artist's block again?\\c$",
]

[msg.section_0.entries.1]
text = [
  "Burgh: Hmm...\\n",
  "Bones, perhaps...\\c$",
]

[msg.section_0.entries.2]
text = [
  "Lenora: Bones...?\\c\\n",
  "This is a museum,\\n",
  "so of course we have bones.\\c\\n",
  "What are you looking for?\\n",
  "Your next motif?\\c$",
]

[msg.section_0.entries.3]
text = [
  "Burgh: Maybe...\\c\\n",
  "Or maybe not...\\c\\n",
  "Many Bug-type Pokémon have\\n",
  "hard coverings, right?\\l\\n",
  "Their so-called exoskeletons.\\c\\n",
  "So I don't quite understand bones.\\n",
  "Not at all, actually.\\c$",
]

[msg.section_0.entries.4]
text = [
  "Lenora: So, did you think you would\\n",
  "understand something about bones\\l\\n",
  "if you came here?\\c\\n",
  "Sure thing!\\n",
  "Make yourself at home!\\c\\n",
  "If you'd like, I can have my husband\\n",
  "explain them to you.\\c$",
]

[msg.section_0.entries.5]
text = [
  "Burgh: Mmm...\\c\\n",
  "Well, for starters, what do bones\\n",
  "mean to you?\\c$",
]

[msg.section_0.entries.6]
text = [
  "Lenora: When I was little, my dad\\n",
  "worked in a mine, and he would always\\l\\n",
  "bring home bones he dug up.\\c\\n",
  "I was just a child, but I was brought\\n",
  "under the spell of bones.\\c\\n",
  "What did the bones look like\\n",
  "when they were part of a living being?\\c\\n",
  "Why are they shaped the way they are?\\n",
  "Things like that captivated me.\\c$",
]

[msg.section_0.entries.7]
text = [
  "Burgh: Oohhh...\\n",
  "I kind of understand.\\c\\n",
  "I'm also fascinated by the functional,\\n",
  "efficient designs of Bug-type Pokémon,\\l\\n",
  "such as the shape of their legs.\\c$",
]

[msg.section_0.entries.8]
text = [
  "???: Hey there!\\n",
  "What's everyone all gathered up for?\\c$",
]

[msg.section_0.entries.9]
text = [
  "Burgh: What brings you here?\\c$",
]

[msg.section_0.entries.10]
text = [
  "Clay: Found a Fossil\\n",
  "in Twist Mountain.\\c\\n",
  "I came to have Lenora look at it and see\\n",
  "if ya wanted to keep it here or somethin'.\\c$",
]

[msg.section_0.entries.11]
text = [
  "Burgh: Clay.\\n",
  "What do bones mean to you?\\c$",
]

[msg.section_0.entries.12]
text = [
  "Clay: Hmm?\\n",
  "Well now...\\c\\n",
  "No matter who ya are or when ya die,\\n",
  "bones are all that'll be left of ya.\\c\\n",
  "When ya think about it, it's amazin'.\\n",
  "Even if ya die, ya can make money!\\l\\n",
  "Some Fossils are worth a lot, ya know!\\c$",
]

[msg.section_0.entries.13]
text = [
  "Lenora: I can't tell if you're kidding,\\n",
  "but of course you would think that way.\\c\\n",
  "Burgh is trying hard to think\\n",
  "about what bones mean to him.\\c\\n",
  "Don't be so flippant!\\c\\n",
  "So what kind of Fossil have you got\\n",
  "there? Let me see.\\c$",
]

[msg.section_0.entries.14]
text = [
  "Clay: Here ya go!\\c\\n",
  "Whaddaya think?\\c\\n",
  "It's gotta be worth a mint\\n",
  "as a specimen or as a collectible!\\l\\n",
  "Which is it?\\c$",
]

[msg.section_0.entries.15]
text = [
  "Lenora: Well, I mean this in a good way,\\n",
  "but it's an ordinary Fossil.\\c\\n",
  "If it isn't worth much as a specimen,\\n",
  "you can't sell it for much.\\c\\n",
  "But I'm curious about the soil\\n",
  "attached to the Fossil...\\c$",
]

[msg.section_0.entries.16]
text = [
  "Burgh: What do you mean?\\c$",
]

[msg.section_0.entries.17]
text = [
  "Lenora: It's very subtle,\\n",
  "but it's a bit different from the soil\\l\\n",
  "I usually see from Twist Mountain.\\c$",
]

[msg.section_0.entries.18]
text = [
  "Clay: That so?\\c\\n",
  "Guess my Twist Mountain\\n",
  "still has unlimited potential!\\c\\n",
  "All right!\\n",
  "I'll keep on diggin' my Clay Tunnel!\\c$",
]

[msg.section_0.entries.19]
text = [
  "Here, Burgh!\\c\\n",
  "That plain ol' Fossil's yours!\\c\\n",
  "Have a look at it\\n",
  "and think about what bones mean to ya.\\c$",
]

[msg.section_0.entries.20]
text = [
  "Burgh: Thank you, Lenora.\\c\\n",
  "I guess it's OK that I have\\n",
  "my own perspective on what\\l\\n",
  "bones mean to me, right?\\c$",
]

[msg.section_0.entries.21]
text = [
  "Lenora: Why not?\\c\\n",
  "You, me, Clay...\\n",
  "We all have a different way of thinking\\l\\n",
  "about what bones mean to us.\\c\\n",
  "It would be kind of creepy if we all felt\\n",
  "the exact same way, right?\\c\\n",
  "Anyway, I feel sorry for this Fossil.\\c\\n",
  "It's just resting, minding its own\\n",
  "business, and everyone is saying\\l\\n",
  "this and that about it.\\c$",
]

[msg.section_0.entries.22]
text = [
  "Burgh: I know.\\c\\n",
  "I'll thank this Fossil\\n",
  "by using it as a motif\\l\\n",
  "for one of my works.\\c\\n",
  "See you, Lenora.\\c$",
]

[msg.section_0.entries.0]
text = [
  "Hello, hello!\\n",
  "I am the official Name Rater!\\c\\n",
  "Want me to rate the nicknames\\n",
  "of your Pokémon?$",
]

[msg.section_0.entries.1]
text = [
  "Which Pokémon's nickname\\n",
  "should I critique?\\c$",
]

[msg.section_0.entries.2]
text = [
  "Hmmm. [VAR PKNICK(0)], is it?\\c\\n",
  "That sounds good! It's a very “you\\\"\\n",
  "sort of name.\\c\\n",
  "But if you'd like to change it, I can help\\n",
  "you do that. How about it?$",
]

[msg.section_0.entries.3]
text = [
  "Excellent! What would you like\\n",
  "the new nickname to be?\\c$",
]

[msg.section_0.entries.4]
text = [
  "Done! From now on, this Pokémon\\n",
  "shall be known as [VAR PKNICK(0)]!\\c\\n",
  "You're right, that does seem to fit it\\n",
  "better. Nicely done!$",
]

[msg.section_0.entries.5]
text = [
  "OK! Come see me again if you\\n",
  "change your mind.$",
]

[msg.section_0.entries.6]
text = [
  "Done! From now on, this Pokémon\\n",
  "shall be known as [VAR PKNICK(0)]!\\c\\n",
  "It looks no different from before, but we\\n",
  "both know this name is vastly superior!\\l\\n",
  "How fortunate for you!$",
]

[msg.section_0.entries.7]
text = [
  "Hmmm. [VAR PKNICK(0)]!\\n",
  "That is a truly impeccable nickname!\\c\\n",
  "Take good care of [VAR PKNICK(0)]!$",
]

[msg.section_0.entries.8]
text = [
  "Now, now...\\n",
  "That is merely an Egg!$",
]

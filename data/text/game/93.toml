[msg]
trailing_data = "4a4a"

[msg.section_0.entries.0]
text = [
  "Everybody makes mistakes.\\c\\n",
  "But goalkeepers cannot afford a mistake,\\n",
  "because they cannot score goals to make\\l\\n",
  "up for it.\\c\\n",
  "If one Pokémon on a team makes a\\n",
  "mistake, however, the other Pokémon\\l\\n",
  "and their Trainer can cover for it!$",
]

[msg.section_0.entries.1]
text = [
  "If a Striker catches a teammate's eye,\\n",
  "they understand each other.\\c\\n",
  "A Pokémon and its Trainer are the same.\\n",
  "Don't you agree?$",
]

[msg.section_0.entries.2]
text = [
  "Really strong Trainers thoroughly do\\n",
  "whatever they can do!$",
]

[msg.section_0.entries.3]
text = [
  "Soccer is beautiful and fun!\\n",
  "Pokémon are also beautiful and fun!$",
]

[msg.section_0.entries.4]
text = [
  "Soccer with Pokémon is Pokémon soccer.\\n",
  "The abbreviation is...Poker?\\l\\n",
  "No, wait, that's a fireplace tool.\\l\\n",
  "How about Poccer?$",
]

[msg.section_0.entries.5]
text = [
  "Throw a sound pass to a team member!\\c\\n",
  "After that, to receive a sound pass,\\n",
  "you'll need to move swiftly.$",
]

[msg.section_0.entries.6]
text = [
  "Run! Run!\\n",
  "Just think about running!$",
]

[msg.section_0.entries.7]
text = [
  "Squeeskwaa!$",
]

[msg.section_0.entries.8]
text = [
  "Meep! ♪$",
]

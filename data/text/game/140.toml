[msg.section_0.entries.0]
text = [
  "Always aim for the top,\\n",
  "like a dragon taking flight!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Trainers far stronger than I\\n",
  "wait for you above!\\c\\n",
  "The ones on the right\\n",
  "emphasize attack.\\c\\n",
  "The ones on the left\\n",
  "emphasize defense.\\c\\n",
  "Return to the dragon's head,\\n",
  "and step on the glowing triangle.\\l\\n",
  "Then, choose either right or left!$",
]

[msg.section_0.entries.2]
text = [
  "Offense is everything!\\c$",
]

[msg.section_0.entries.3]
text = [
  "As for the Trainers above me...\\c\\n",
  "The one on the right fights\\n",
  "only Triple Battles.\\c\\n",
  "The one on the left fights\\n",
  "only Rotation Battles.\\c\\n",
  "Choose the style of battle\\n",
  "that fits you better!\\c\\n",
  "Remember, they won't even battle you\\n",
  "if you don't have three or more\\l\\n",
  "Pokémon with you!$",
]

[msg.section_0.entries.4]
text = [
  "Defense is everything!\\c$",
]

[msg.section_0.entries.5]
text = [
  "The Trainers that wait above\\n",
  "have different fighting styles.\\c\\n",
  "The one on the right fights\\n",
  "only Triple Battles.\\c\\n",
  "The one on the left fights\\n",
  "only Rotation Battles.\\c\\n",
  "Choose the style of battle\\n",
  "you're better at!\\c\\n",
  "Remember, they won't even battle you\\n",
  "if you don't have three or more\\l\\n",
  "Pokémon with you!$",
]

[msg.section_0.entries.6]
text = [
  "If you want to battle with me,\\n",
  "bring three or more healthy\\l\\n",
  "Pokémon with you!$",
]

[msg.section_0.entries.7]
text = [
  "Triple Battles!\\c\\n",
  "It's a combination that raises\\n",
  "three Pokémon's destructive power!\\c$",
]

[msg.section_0.entries.8]
text = [
  "You are strong enough to challenge\\n",
  "Mayor Drayden!\\c\\n",
  "You have the power to unleash the\\n",
  "full force of your deep desire to win!$",
]

[msg.section_0.entries.9]
text = [
  "If you plan on battling with me,\\n",
  "bring three or more healthy\\l\\n",
  "Pokémon with you!$",
]

[msg.section_0.entries.10]
text = [
  "In Rotation Battles, how the three\\n",
  "Pokémon follow one another is key.\\c$",
]

[msg.section_0.entries.11]
text = [
  "A battle between you and Mayor\\n",
  "Drayden must be stirring!\\c\\n",
  "You must desire victory\\n",
  "more than anything! Now, go!$",
]

[msg.section_0.entries.12]
text = [
  "Welcome. Thank you for coming. I am the\\n",
  "Opelucid Pokémon Gym Leader, Drayden.\\c\\n",
  "As the mayor, I've given everything\\n",
  "to developing the city.\\c\\n",
  "As a Trainer, I've simply been pursuing\\n",
  "greater strength.\\c\\n",
  "But what I'm searching for now is a young\\n",
  "Trainer who can show me a bright future.\\c\\n",
  "Perhaps you can show me that future,\\n",
  "the way Iris has?\\c$",
]

[msg.section_0.entries.13]
text = [
  "Welcome. Thank you for coming. I am the\\n",
  "Opelucid Pokémon Gym Leader, Drayden.\\c\\n",
  "As the mayor, I've given everything\\n",
  "to developing the city.\\c\\n",
  "As a Trainer, I've simply been pursuing\\n",
  "greater strength.\\c\\n",
  "But what I'm searching for now is a young\\n",
  "Trainer who can show me a bright future.\\c\\n",
  "Perhaps you can show me that future,\\n",
  "the way [VAR TRNAME(2)] and Iris have?\\c$",
]

[msg.section_0.entries.14]
text = [
  "Wonderful.\\c\\n",
  "I'm grateful that we had a chance\\n",
  "to meet and battle.\\c\\n",
  "It reminded me that Pokémon battles\\n",
  "are about working with others\\l\\n",
  "to meet our challenges together.\\c$",
]

[msg.section_0.entries.15]
text = [
  "[VAR TRNAME(0)] received the Legend Badge\\n",
  "from Drayden!\\c$",
]

[msg.section_0.entries.16]
text = [
  "Well, now. You've obtained seven of\\n",
  "the Gym Badges in Unova.\\c\\n",
  "That means Pokémon up to Lv. 80,\\n",
  "including those received in trades,\\l\\n",
  "will follow your commands obediently.\\c\\n",
  "I also want you to have this.\\n",
  "It's a TM I'm particularly fond of.\\c\\n",
  "It's called Dragon Tail.\\c$",
]

[msg.section_0.entries.17]
text = [
  "Dragon Tail is a move that returns the\\n",
  "damaged Pokémon to its Poké Ball.\\c\\n",
  "In other words, it switches your\\n",
  "opponent's Pokémon.\\c$",
]

[msg.section_0.entries.18]
text = [
  "Professor Juniper asked me to tell you\\n",
  "about the legendary Dragon-type Pokémon\\l\\n",
  "that created Unova.\\c\\n",
  "Please wait outside.$",
]

[msg.section_0.entries.19]
text = [
  "It is not the passage of time that\\n",
  "causes Pokémon and people to age.\\c\\n",
  "When the energy that flows in their\\n",
  "heart dries up, that's when they get old.\\c\\n",
  "The heart's energy is powered by\\n",
  "truth, ideals, or maybe dreams...\\c\\n",
  "No doubt it changes depending on\\n",
  "what you most hope for in life.$",
]

[msg.section_0.entries.20]
text = [
  "Welcome to the Opelucid City Gym!\\c\\n",
  "Here's some Fresh Water. Stay hydrated!\\c$",
]

[msg.section_0.entries.21]
text = [
  "How do you like these dragon statues?\\c\\n",
  "This Gym is the only place in Unova\\n",
  "with statues this size!\\c\\n",
  "Climb on the dragon's head and aim\\n",
  "for the top of the other dragon, where\\l\\n",
  "Drayden, the Gym Leader, is waiting!\\c\\n",
  "Dragon-type Pokémon are his specialty.\\c\\n",
  "Just between you and me, Dragon types\\n",
  "are weak to Ice-type moves as well as to\\l\\n",
  "moves of their own type, meaning Dragon.$",
]

[msg.section_0.entries.22]
text = [
  "You defeated the Gym Leader!\\n",
  "Congratulations!\\c\\n",
  "The collision of the two dragon statues\\n",
  "had quite an impact! Like something out\\l\\n",
  "of a Pokéstar Studios film!$",
]

[msg.section_0.entries.23]
text = [
  "Opelucid Pokémon Gym\\c\\n",
  "Gym Leader: Drayden\\n",
  "Certified Trainers:\\l\\n",
  "[VAR TRNAME(1)]$",
]

[msg.section_0.entries.24]
text = [
  "Opelucid Pokémon Gym\\c\\n",
  "Gym Leader: Drayden\\n",
  "Certified Trainers:\\l\\n",
  "[VAR TRNAME(0)], [VAR TRNAME(1)]$",
]

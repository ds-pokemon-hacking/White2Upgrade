[msg.section_0.entries.0]
text = [
  "Helping someone even though the person\\n",
  "doesn't ask for help...\\l\\n",
  "It's like, “Who do you think you are?\\\"\\c\\n",
  "I don't get it, because I can't tell\\n",
  "whether another person is happy or not.$",
]

[msg.section_0.entries.1]
text = [
  "Nobody has used the beds\\n",
  "in this room.\\c\\n",
  "If you think I'm lying, take a look,\\n",
  "then take a rest!$",
]

[msg.section_0.entries.2]
text = [
  "The bed looks nice and comfortable.\\n",
  "Will you take a quick rest?$",
]

[msg.section_0.entries.3]
text = [
  "[VAR TRNAME(0)] hopped into bed and\\n",
  "fell asleep...\\c$",
]

[msg.section_0.entries.4]
text = [
  "[VAR TRNAME(0)] and the Pokémon\\n",
  "took a nap and regained energy!$",
]

[msg]
trailing_data = "c8c8"

[msg.section_0.entries.0]
text = [
  "Oh, it's just a kid...\\c$",
]

[msg.section_0.entries.1]
text = [
  "You... It couldn't be...\\c\\n",
  "The fact that you are here means you\\n",
  "came to learn about the secret\\l\\n",
  "of Genesect!\\c$",
]

[msg.section_0.entries.2]
text = [
  "We, Team Plasma, revived Genesect from\\n",
  "a Fossil.\\c\\n",
  "Then we enhanced the Pokémon with the\\n",
  "power of science!\\c$",
]

[msg.section_0.entries.3]
text = [
  "It is the strongest Pokémon in history!!\\c$",
]

[msg.section_0.entries.4]
text = [
  "But, our lord N was not interested in\\n",
  "this Genesect that was modified by the\\l\\n",
  "power of science!\\c$",
]

[msg.section_0.entries.5]
text = [
  "“Science damages the natural beauty\\n",
  "of Pokémon! They're perfect beings!\\\"\\c$",
]

[msg.section_0.entries.6]
text = [
  "That's what he said...\\c\\n",
  "So our research was halted, and this\\n",
  "facility was closed...\\c$",
]

[msg.section_0.entries.7]
text = [
  "However!!\\n",
  "The Genesect research is all mine!\\c\\n",
  "So if you want to know Genesect's\\n",
  "secret, you'll have to beat me in battle!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Battle the Scientist?$",
]

[msg.section_0.entries.9]
text = [
  "I've lost everything...\\c\\n",
  "I forgot my duty as a Scientist is\\n",
  "to make the world happy.\\c\\n",
  "So, this must be what I get for trying to\\n",
  "make a Pokémon into a tool for fighting...\\c$",
]

[msg.section_0.entries.10]
text = [
  "I'm going to wash my hands of this\\n",
  "Genesect matter...\\c\\n",
  "I don't need this anymore...\\n",
  "I'll give it to you.\\c$",
]

[msg.section_0.entries.11]
text = [
  "There was another one in my\\n",
  "other pocket...\\c$",
]

[msg.section_0.entries.12]
text = [
  "The item I just gave you was made\\n",
  "for Genesect.\\c\\n",
  "When it holds an item like this, it\\n",
  "changes the type of the move called\\l\\n",
  "Techno Blast, so it can always have\\l\\n",
  "an advantage.\\c$",
]

[msg.section_0.entries.13]
text = [
  "There sure are some very cowardly\\n",
  "Trainers, aren't there!$",
]

[msg.section_0.entries.14]
text = [
  "So you want to battle me?!$",
]

[msg.section_0.entries.15]
text = [
  "I've given you all of the Drives.\\n",
  "Use them how you wish...$",
]

[msg.section_0.entries.16]
text = [
  "There is a memo stuck to the\\n",
  "side of the monitor.\\c\\n",
  "Read it?$",
]

[msg.section_0.entries.17]
text = [
  "“My lord N apparently rejected\\n",
  "my research...\\l\\n",
  "But my research is necessary for\\l\\n",
  "Team Plasma to reach its goal...\\l\\n",
  "The strongest Pokémon...\\\"\\c\\n",
  "The rest of the memo is torn and\\n",
  "impossible to read.$",
]

[msg.section_0.entries.0]
text = [
  "Hello, boy!\\c\\n",
  "Do you have a villa in Undella?\\n",
  "You are rich!\\c\\n",
  "As a token of our new acquaintance,\\n",
  "please accept this!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Hello, girl!\\c\\n",
  "Do you have a villa in Undella?\\n",
  "You are rich!\\c\\n",
  "As a token of our new acquaintance,\\n",
  "please accept this!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Isn't the Prism Scale beautiful?\\n",
  "It may be good to let a Pokémon hold it.$",
]

[msg.section_0.entries.3]
text = [
  "Undella Bay's Abyssal Ruins\\n",
  "have messages carved into the walls...$",
]

[msg.section_0.entries.4]
text = [
  "I can buy the Poké Balls sold here,\\n",
  "because somewhere, somebody\\l\\n",
  "is making them.\\c\\n",
  "Thank you, person I don't know,\\n",
  "making Poké Balls somewhere!$",
]

[msg.section_0.entries.5]
text = [
  "Heh heh... Hey, you.\\n",
  "If someone offered you\\l\\n",
  "a plain old Sitrus Berry for \\$1,000,\\l\\n",
  "would you buy it?$",
]

[msg.section_0.entries.6]
text = [
  "Heh heh...\\n",
  "You're all right.\\c\\n",
  "Well, whatever. If that's a price\\n",
  "you feel you agree with, then great!\\c\\n",
  "That's what shopping's all about, right?\\c$",
]

[msg.section_0.entries.7]
text = [
  "Heh heh...\\n",
  "Figured as much.\\c\\n",
  "Well, either way is fine. If you don't\\n",
  "agree with the price, don't buy it...\\c\\n",
  "That's what shopping's all about, right?\\c$",
]

[msg.section_0.entries.8]
text = [
  "The Funfest Mission\\n",
  "“[VAR FUNFESTMISSION(0)]\\\"\\l\\n",
  "has been added to the Entralink.$",
]

[msg.section_0.entries.9]
text = [
  "Heh heh...\\c\\n",
  "What's important is\\n",
  "whether you agree or not!$",
]

[msg.section_0.entries.0]
text = [
  "Bianca: Heeey!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Bianca: Hey there!\\c$",
]

[msg.section_0.entries.2]
text = [
  "When I saw you in the city,\\n",
  "I just had to catch up with you!\\c\\n",
  "Here, take this!\\n",
  "This is a Dowsing Machine!\\c$",
]

[msg.section_0.entries.3]
text = [
  "You can use the Dowsing Machine\\n",
  "to find places where items are hidden.\\c\\n",
  "It's exciting to find an item while\\n",
  "you're looking for a Pokémon.\\c\\n",
  "Ooh, good luck!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Oh!\\c\\n",
  "If you often use the Dowsing Machine,\\n",
  "the Habitat List, and so on,\\l\\n",
  "why don't you register them?\\c\\n",
  "Er...\\n",
  "I think it's written in this book...\\c\\n",
  "I found it!\\n",
  "OK. I'll read it.\\c\\n",
  "“You can use the registered item\\n",
  "just by pressing the Y Button!\\\"\\l\\n",
  "See? OK. Bye!\\c$",
]

[msg.section_0.entries.5]
text = [
  "The Pokémon Breeder on Route 4 past\\n",
  "this gate always challenges Trainers\\l\\n",
  "to battle when she sees them.\\c\\n",
  "Just what you expect from Route 4, which\\n",
  "has ruins. Discovery is so exciting!$",
]

[msg.section_0.entries.6]
text = [
  "The Pokémon Breeder on Route 4 past\\n",
  "this gate always challenges Trainers\\l\\n",
  "to battle when she sees them.\\c\\n",
  "Just what you expect from Route 4,\\n",
  "which has a lot of buildings.\\l\\n",
  "Changes are so exciting!$",
]

[msg.section_0.entries.7]
text = [
  "Nimbasa City is at the end\\n",
  "of Route 4.$",
]

[msg.section_0.entries.8]
text = [
  "Free-for-all! It's the Castelia\\n",
  "Harlequin Hunt! You haven't visited...\\c$",
]

[msg.section_0.entries.9]
text = [
  "The Medal Office!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Passerby Analytics HQ!\\c$",
]

[msg.section_0.entries.11]
text = [
  "The Battle Company!\\c$",
]

[msg.section_0.entries.12]
text = [
  "You still need to visit\\n",
  "this many places: [VAR NUM1(0)]!\\c\\n",
  "So explore Castelia City, and enjoy\\n",
  "the Castelia Harlequin Hunt!$",
]

[msg.section_0.entries.13]
text = [
  "You still need to visit\\n",
  "this many places: Wow! Zero!\\c\\n",
  "That means you've completed\\n",
  "the Castelia Harlequin Hunt!\\c\\n",
  "Congratulations!\\n",
  "This is a small commemorative gift!\\c$",
]

[msg.section_0.entries.14]
text = [
  "The Castelia Harlequin Hunt is a way\\n",
  "to make more people love Castelia City!\\c\\n",
  "That's why we generously gave you a\\n",
  "Bicycle at the beginning. It's the best\\l\\n",
  "way to get around Castelia City!\\c\\n",
  "Keep loving Castelia City!\\c\\n",
  "Castelia City, Castelia City,\\n",
  "Castelia City! ♪ Here we go! ♪$",
]

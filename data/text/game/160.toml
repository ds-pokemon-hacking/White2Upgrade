[msg.section_0.entries.0]
text = [
  "What will be determined here is\\n",
  "which of us can absorb the opponent's\\l\\n",
  "light and shine...\\c\\n",
  "But who will decide that?\\c\\n",
  "It shall be I, Grimsley of the Elite Four,\\n",
  "and I will fulfill my duty to be\\l\\n",
  "your opponent.\\c$",
]

[msg.section_0.entries.1]
text = [
  "Whether or not you get to fight at full\\n",
  "strength, whether or not luck smiles\\l\\n",
  "on you--none of that matters.\\c\\n",
  "Only results matter. And a loss is a loss.\\c\\n",
  "See, victory shines like a bright light.\\c\\n",
  "And right now, you and your Pokémon\\n",
  "are shining brilliantly.$",
]

[msg.section_0.entries.2]
text = [
  "Now, I'm nothing more than\\n",
  "the one who lost his light...\\c\\n",
  "But this loss will make me shine\\n",
  "even brighter next time...\\c\\n",
  "If I think that way, it's not too bad.\\c\\n",
  "Sigh...\\c\\n",
  "You should take that strength and test\\n",
  "it against the rest of the Elite Four.$",
]

[msg.section_0.entries.3]
text = [
  "Astonishing!\\c\\n",
  "You have defeated every member of\\n",
  "the Pokémon League's Elite Four.\\c\\n",
  "But it isn't over yet.\\c\\n",
  "There is one more opponent against whom\\n",
  "you must prove your strength.\\c\\n",
  "Check the statue in the central plaza,\\n",
  "and continue to the final room.$",
]

[msg.section_0.entries.4]
text = [
  "Life is a serious battle, and you have\\n",
  "to use the tools you're given.\\c\\n",
  "It's more important to master the cards\\n",
  "you're holding than to complain about\\l\\n",
  "the ones your opponents were dealt.\\c\\n",
  "Let us begin.\\n",
  "And may the best Trainer win!\\c\\n",
  "Contests like this are proof\\n",
  "that you are really living...\\c$",
]

[msg.section_0.entries.5]
text = [
  "There are bad ways to win--\\n",
  "and good ways to lose.\\c\\n",
  "What's interesting and troubling is that\\n",
  "it's not always clear which is which.\\c\\n",
  "A flipped coin doesn't always land\\n",
  "heads or tails.\\c\\n",
  "Sometimes it may never land at all...$",
]

[msg.section_0.entries.6]
text = [
  "There's nothing left\\n",
  "for the loser.\\c\\n",
  "I guess that's not true...\\n",
  "Everything has a meaning.\\c\\n",
  "I just have to use the disappointment\\n",
  "as a motivation to get strong.\\c\\n",
  "That said...\\n",
  "You should take that strength and test\\l\\n",
  "it against the rest of the Elite Four!$",
]

[msg.section_0.entries.7]
text = [
  "Astonishing!\\c\\n",
  "You have defeated every member of\\n",
  "the Pokémon League's Elite Four.\\c\\n",
  "But it isn't over yet.\\c\\n",
  "There is one more opponent against whom\\n",
  "you must prove your strength.\\c\\n",
  "Check the statue in the central plaza,\\n",
  "and continue to the final room.$",
]

[msg.section_0.entries.57]
text = [
  "In Triple Battles, you send out three\\n",
  "Pokémon at a time and battle!\\c\\n",
  "The rules are simple: just make all of\\n",
  "your opponent's Pokémon faint.\\c\\n",
  "And that's a rough explanation\\n",
  "of Triple Battles.\\c$",
]


[msg.section_0.entries.0]
text = [
  "Construction on a shortcut\\n",
  "to Twist Mountain has started.\\c\\n",
  "But it's going to take a while\\n",
  "'cause digging's difficult.$",
]

[msg.section_0.entries.1]
text = [
  "Construction on a shortcut\\n",
  "to Twist Mountain has started.\\c\\n",
  "But it's going to take a while\\n",
  "'cause digging's difficult.\\c$",
]

[msg.section_0.entries.2]
text = [
  "The Gym Leader, Clay, is currently\\n",
  "in the middle of something.\\l\\n",
  "Please come back again later.$",
]

[msg.section_0.entries.3]
text = [
  "Team Plasma: C'mon!\\c\\n",
  "Let's have fun stealing Pokémon\\n",
  "together, like we did before!\\c$",
]

[msg.section_0.entries.4]
text = [
  "???: I can't.\\c\\n",
  "I've learned the hard way\\n",
  "that stealing from others is wrong!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Team Plasma: Oh, come on! It's too late\\n",
  "to start acting all goody-two-shoes now!\\c$",
]

[msg.section_0.entries.6]
text = [
  "Team Plasma: People don't understand\\n",
  "our just cause!\\c\\n",
  "Don't they call you a villain\\n",
  "who was plotting world domination?\\c\\n",
  "Even though you quit Team Plasma, people\\n",
  "are still really cold to you, right?\\c\\n",
  "So, you might as well just come\\n",
  "steal Pokémon with us and\\l\\n",
  "take over the world!\\c\\n",
  "The people who are mean to you now\\n",
  "will be groveling at your feet\\l\\n",
  "and saying how great you are!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Ex-Team Plasma: I can't...\\c\\n",
  "My lord N will be sad...\\n",
  "I can't do that to him...\\c$",
]

[msg.section_0.entries.8]
text = [
  "Team Plasma: N!\\c\\n",
  "Team Plasma's king... What a joke!\\n",
  "He's nothing more than a traitor!\\c\\n",
  "He disappeared somewhere and abandoned\\n",
  "us when we needed him!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Hey!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Start talking, you Team Plasma trash!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Team Plasma: Oww...\\c\\n",
  "You're gonna pay for that!\\c\\n",
  "Oh, yeah. Almost forgot...\\n",
  "I'm not supposed to cause any trouble.\\c\\n",
  "I'll get you next time!\\c$",
]

[msg.section_0.entries.12]
text = [
  "[VAR TRNAME(1)]: You're not getting away!\\c$",
]

[msg.section_0.entries.13]
text = [
  "Ex-Team Plasma: I'm OK!\\c\\n",
  "We were friends when we\\n",
  "were both in Team Plasma...\\c\\n",
  "But two years ago, Team Plasma\\n",
  "split into a group that follows Lord N,\\l\\n",
  "who just wants to save Pokémon,\\l\\n",
  "and a group that follows Ghetsis,\\l\\n",
  "who plans to take over the world.\\c\\n",
  "You can hear the rest\\n",
  "of the story in our home.\\c\\n",
  "It's on that little hill next\\n",
  "to the Pokémon Gym.\\c$",
]

[msg.section_0.entries.14]
text = [
  "Ex-Team Plasma: Sir, that's the person\\n",
  "I was talking about!\\c$",
]

[msg.section_0.entries.15]
text = [
  "Over here! This way!\\c$",
]

[msg.section_0.entries.16]
text = [
  "Rood: Oh! So you're interested\\n",
  "in Team Plasma, are you?\\c$",
]

[msg.section_0.entries.17]
text = [
  "Ex-Team Plasma: If you hear what\\n",
  "we have to say, you might be able\\l\\n",
  "to understand us.\\c$",
]

[msg.section_0.entries.18]
text = [
  "Rood: My guest.\\c\\n",
  "If you're going to come inside,\\n",
  "I would like to see what kind\\l\\n",
  "of person you are, Trainer.\\c\\n",
  "That's right. In a Pokémon battle.\\n",
  "Do you find this acceptable?$",
]

[msg.section_0.entries.19]
text = [
  "Rood: Let us begin!\\c$",
]

[msg.section_0.entries.20]
text = [
  "Rood: Then, I'm afraid I must\\n",
  "ask you to leave.$",
]

[msg.section_0.entries.21]
text = [
  "Rood: If you're going to come inside,\\n",
  "I would like to see what kind\\l\\n",
  "of person you are, Trainer.\\c\\n",
  "That's right. In a Pokémon battle.\\n",
  "Do you find this acceptable?$",
]

[msg.section_0.entries.22]
text = [
  "Ex-Team Plasma: I'm sorry...\\c\\n",
  "Sage Rood is only saying\\n",
  "that in order to protect us.$",
]

[msg.section_0.entries.23]
text = [
  "Rood: I apologize for testing you.\\c\\n",
  "Being former members of Team Plasma,\\n",
  "we must deal with a lot...\\c$",
]

[msg.section_0.entries.24]
text = [
  "[VAR TRNAME(1)]: He got away!\\c$",
]

[msg.section_0.entries.25]
text = [
  "Rood: And that is?\\c\\n",
  "...\\c\\n",
  "Your friend?\\n",
  "He may join us.\\c$",
]

[msg.section_0.entries.26]
text = [
  "[VAR TRNAME(1)]: Challenging the Gym, huh?\\n",
  "Nice! Keep getting stronger!\\c\\n",
  "Let me tell you, though,\\n",
  "Clay's tough!\\c\\n",
  "Even if all you have to use against\\n",
  "Ground types is Water-type Pokémon,\\l\\n",
  "you might still be in for a rough fight!$",
]

[msg.section_0.entries.27]
text = [
  "[VAR TRNAME(1)]: You got a Gym Badge, too!\\n",
  "I knew you could do it!\\c\\n",
  "You know... My partners are the reason\\n",
  "I was able to get that Badge.\\c\\n",
  "But I'm sure there's more connecting\\n",
  "us to each other than Poké Balls!\\c\\n",
  "If that's all there is, the stolen\\n",
  "Purrloin's feelings will never be\\l\\n",
  "what they were!\\c$",
]

[msg.section_0.entries.28]
text = [
  "Clay: Oh, so you two squirts\\n",
  "know each other, huh?\\c\\n",
  "Ya both ain't bad, so\\n",
  "I wanna show ya somethin'.\\c$",
]

[msg.section_0.entries.29]
text = [
  "[VAR TRNAME(1)]: Wait!\\n",
  "I just remembered. Clay...\\c\\n",
  "Why? What's the reason?\\n",
  "Why have you forgiven Team Plasma?\\c$",
]

[msg.section_0.entries.30]
text = [
  "Clay: There's always room for folks\\n",
  "to grow and change, ain't there?\\c\\n",
  "And, if ya only go after what ya think is\\n",
  "right, ya might end up rejectin' all\\l\\n",
  "thoughts and opinions other than\\l\\n",
  "yer own. That's mighty dangerous.\\c$",
]

[msg.section_0.entries.31]
text = [
  "[VAR TRNAME(1)]: Hmph...\\n",
  "Is that one of those compromises\\l\\n",
  "adults are supposed to make?\\c\\n",
  "Whatever!\\n",
  "I'm gonna fight Team Plasma!\\c\\n",
  "Oh yeah, what were you wanting\\n",
  "to show us?\\c$",
]

[msg.section_0.entries.32]
text = [
  "Clay: Ya ever heard of the\\n",
  "Pokémon World Tournament?\\c\\n",
  "Trainers from all over the world\\n",
  "gather on up to see who's toughest!\\c\\n",
  "Well then, I'll be waitin' for you at the\\n",
  "south end of town!\\c$",
]

[msg.section_0.entries.33]
text = [
  "[VAR TRNAME(1)]: A tournament\\n",
  "to decide who's strongest, huh?\\c\\n",
  "Right on!\\n",
  "It's time for some special training!\\c$",
]

[msg.section_0.entries.34]
text = [
  "So how about this city's pride and joy,\\n",
  "the drawbridge?\\c\\n",
  "We also call it the Charizard Bridge\\n",
  "due to its elegant form!$",
]

[msg.section_0.entries.35]
text = [
  "The Elite Four of the Pokémon League\\n",
  "are extremely tough!\\c\\n",
  "I hear you can't battle them unless\\n",
  "you have eight Gym Badges!$",
]

[msg.section_0.entries.36]
text = [
  "When there's an item in your Bag\\n",
  "you want to switch,\\l\\n",
  "just press SELECT\\l\\n",
  "and give it a new niche! ♪\\c\\n",
  "Doesn't that jingle take you back?$",
]

[msg.section_0.entries.37]
text = [
  "A long time ago, Team Plasma\\n",
  "stole my Pokémon...\\c\\n",
  "Well, they did give it back later!$",
]

[msg.section_0.entries.38]
text = [
  "Rokorroook!$",
]

[msg.section_0.entries.39]
text = [
  "I want to level up my dear Pokémon\\n",
  "so they never have to feel\\l\\n",
  "the sting of defeat!$",
]

[msg.section_0.entries.40]
text = [
  "Whoooa, dude! If a Pokémon uses the move\\n",
  "Surf, it can catch a wave!$",
]

[msg.section_0.entries.41]
text = [
  "Even though I used to look\\n",
  "at the Cold Storage every day...\\c\\n",
  "I've already forgotten\\n",
  "what it looked like...$",
]

[msg.section_0.entries.42]
text = [
  "A Pokémon of thunder and\\n",
  "a Pokémon of wind were roaming\\l\\n",
  "everywhere and causing trouble!\\c\\n",
  "Then they were punished\\n",
  "by a Pokémon of the soil.\\c\\n",
  "I like that story!$",
]

[msg.section_0.entries.43]
text = [
  "On the other side of the ocean...\\n",
  "And all over the world, there sure\\l\\n",
  "are a lot of different Pokémon!$",
]

[msg.section_0.entries.44]
text = [
  "There are former members of\\n",
  "Team Plasma in there...\\c\\n",
  "I'm worried that they might\\n",
  "be up to no good again...$",
]

[msg.section_0.entries.45]
text = [
  "Bridges connect different lands.\\c\\n",
  "Trading and battling with Pokémon\\n",
  "can connect different people.\\c\\n",
  "I guess that means Pokémon\\n",
  "are a kind of bridge as well!$",
]

[msg.section_0.entries.46]
text = [
  "I'm a heartbreaker...\\n",
  "My name... Charles.\\c\\n",
  "I wanted to get the attention of a girl\\n",
  "I like, so I learned a new style of\\l\\n",
  "Pokémon battling.\\c\\n",
  "Its name... Rotation Battle!\\n",
  "Want to learn about it?$",
]

[msg.section_0.entries.47]
text = [
  "Oh, man! Getting someone's attention is\\n",
  "really hard.$",
]

[msg.section_0.entries.48]
text = [
  "In Rotation Battles, you send out three\\n",
  "Pokémon at a time and battle!\\c\\n",
  "One Pokémon takes the lead position,\\n",
  "and the other two stand on each side.\\c\\n",
  "The trick is, each turn you can change\\n",
  "their positions...\\c\\n",
  "And that's a rough explanation\\n",
  "of Rotation Battles.\\c$",
]

[msg.section_0.entries.49]
text = [
  "I'm a heartbreaker...\\n",
  "My name... Charles.\\c\\n",
  "Hey! If you're a Trainer, how about a\\n",
  "Rotation Battle?$",
]

[msg.section_0.entries.50]
text = [
  "You've got a good attitude, don't you!\\c\\n",
  "I'm a heartbreaker...\\n",
  "My name... Charles.\\c\\n",
  "I'm always at full throttle.\\c$",
]

[msg.section_0.entries.51]
text = [
  "I hate to burst your bubble when you're\\n",
  "all fired up, but...\\c\\n",
  "In Rotation Battles, you need three or\\n",
  "more Pokémon to battle.$",
]

[msg.section_0.entries.52]
text = [
  "I'm a heartbreaker...\\n",
  "My name... Charles.\\c\\n",
  "I have some advice for you.\\n",
  "Challenge is the essence of life!$",
]

[msg.section_0.entries.53]
text = [
  "Sheesh. That's embarrassing. Getting\\n",
  "schooled when I was planning to teach.\\c\\n",
  "Still, you have potential!\\c\\n",
  "You have to understand your Pokémon\\n",
  "to win in a Rotation Battle.\\c\\n",
  "If you want more Rotation Battles,\\n",
  "go to the Pokémon World Tournament!$",
]

[msg.section_0.entries.54]
text = [
  "I'm a heartbreaker...\\n",
  "My name... Charles.\\c\\n",
  "Riding a bike and becoming the wind fits\\n",
  "a bad boy like me.$",
]

[msg.section_0.entries.55]
text = [
  "I'm a heartbreaker...\\n",

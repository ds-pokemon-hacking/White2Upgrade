[msg.section_0.entries.0]
text = [
  "Hello, hello!\\n",
  "Would you like to go to Unity Tower?$",
]

[msg.section_0.entries.1]
text = [
  "Hello! This is the ship for Unity Tower.$",
]

[msg.section_0.entries.2]
text = [
  "One person will be on board!\\n",
  "Please get on board!\\c$",
]

[msg.section_0.entries.3]
text = [
  "Unity Tower is a place where Trainers\\n",
  "gather from all over the world!\\c\\n",
  "If you have friends who live far away,\\n",
  "you may be able to have a merry reunion!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Please come again!$",
]

[msg.section_0.entries.5]
text = [
  "Yes$",
]

[msg.section_0.entries.6]
text = [
  "No$",
]

[msg.section_0.entries.7]
text = [
  "What is it?$",
]

[msg.section_0.entries.8]
text = [
  "We're all tied together\\n",
  "by destiny.\\c\\n",
  "But really, we each choose\\n",
  "our own red thread.\\c\\n",
  "That's why I want you to have this!\\c$",
]

[msg.section_0.entries.9]
text = [
  "If a Pokémon is infatuated by\\n",
  "another Pokémon, that Pokémon\\l\\n",
  "will become infatuated as well!$",

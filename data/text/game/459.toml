[msg.section_0.entries.0]
text = [
  "Cilan: Chili, are you listening to me?\\c\\n",
  "We have to study hard\\n",
  "and become full-fledged Gym Leaders\\l\\n",
  "as soon as possible...\\c$",
]

[msg.section_0.entries.1]
text = [
  "Chili: About that.\\c\\n",
  "If we had gone to N's Castle a year\\n",
  "ago, the Seven Sages and the\\l\\n",
  "Shadow Triad wouldn't have escaped!\\c\\n",
  "Then, nobody would say something like\\n",
  "“Three of you together make...\\\"\\c$",
]

[msg.section_0.entries.2]
text = [
  "Cress: I guess you're right.\\c$",
]

[msg.section_0.entries.3]
text = [
  "Cilan: You think so?\\n",
  "But it isn't that big of a deal.\\c\\n",
  "We may not have made it in time,\\n",
  "but Team Plasma is still gone.\\c$",
]

[msg.section_0.entries.4]
text = [
  "Chili: Argh!\\c\\n",
  "It's because you say things like that.\\n",
  "That's why people treat us like a joke!\\c\\n",
  "Like it takes all three of us together\\n",
  "to make one great Trainer!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Cress: You're overthinking it,\\n",
  "but I can't say the possibility is zero.\\c$",
]

[msg.section_0.entries.6]
text = [
  "Cilan: Come on, you two...\\c\\n",
  "Don't you think it's a bit strange\\n",
  "to get recognition and respect as\\l\\n",
  "Gym Leaders just for beating bad guys?\\c$",
]

[msg.section_0.entries.7]
text = [
  "Chili: I understand what you're saying.\\c\\n",
  "But if things go on like this,\\n",
  "nothing will ever change.\\c\\n",
  "Even if we train, the other Gym Leaders\\n",
  "will become that much stronger as well.\\c$",
]

[msg.section_0.entries.8]
text = [
  "???: Then...\\n",
  "We'll battle you.\\c$",
]

[msg.section_0.entries.9]
text = [
  "Cress: Based on your appearance,\\n",
  "you must be the Shadow Triad.\\l\\n",
  "But why are you here?\\c$",
]

[msg.section_0.entries.10]
text = [
  "Shadow Triad: We came on a whim...\\c\\n",
  "To vent...\\c\\n",
  "To pass time...\\c\\n",
  "It doesn't matter.\\c$",
]

[msg.section_0.entries.11]
text = [
  "Chili: Three on three!\\c\\n",
  "The first one to beat them\\n",
  "is the strongest among us!\\c$",
]

[msg.section_0.entries.12]
text = [
  "Shadow Triad: Too easy...\\c$",
]

[msg.section_0.entries.13]
text = [
  "Shadow Triad: These three aren't worth\\n",
  "worrying about.\\c\\n",
  "We must focus on the other\\n",
  "Gym Leaders so that next time\\l\\n",
  "they won't get in our way...\\c$",
]

[msg.section_0.entries.14]
text = [
  "Shadow Triad: Well...\\n",
  "Lord Ghetsis is waiting.\\c\\n",
  "We must catch that Pokémon.\\c$",
]

[msg.section_0.entries.15]
text = [
  "Chili: C'mon!\\c\\n",
  "What was that?\\n",
  "Come back here and say that again!\\c$",
]

[msg.section_0.entries.16]
text = [
  "Cilan: I mean...\\n",
  "They were overwhelmingly strong.\\c$",
]

[msg.section_0.entries.17]
text = [
  "Cress: We have to admit it.\\c\\n",
  "The three Leaders of Striaton City\\n",
  "make one full-fledged Trainer.\\c$",
]

[msg.section_0.entries.18]
text = [
  "Cilan: You're right.\\c\\n",
  "Chili. Cress.\\c\\n",
  "I think as long as the three of us\\n",
  "act like the Gym Leaders we are now,\\l\\n",
  "nothing will ever change.\\c$",
]

[msg.section_0.entries.19]
text = [
  "Chili: I didn't think\\n",
  "you would be the first to say that.\\c$",
]

[msg.section_0.entries.20]
text = [
  "Cress: Of course, I, Cress,\\n",
  "was thinking about that, too.\\c$",
]

[msg.section_0.entries.21]
text = [
  "Cilan: All right.\\c\\n",
  "Let's resign as Gym Leaders\\n",
  "and start our training over\\l\\n",
  "from the ground up.\\c\\n",
  "Then, I'm sure one of us\\n",
  "will become a Trainer\\l\\n",
  "everyone recognizes as great.\\c$",
]

[msg.section_0.entries.22]
text = [
  "Chili: We're triplets.\\n",
  "What we think is the same.\\c\\n",
  "So we just have to become\\n",
  "as strong as each other,\\l\\n",
  "and then we can be\\l\\n",
  "Gym Leaders together again!\\c$",
]

[msg.section_0.entries.23]
text = [
  "Cress: OK. So as for the replacement\\n",
  "Gym Leader...\\c$",
]

trailing_data = "8282"

[msg.section_0.entries.0]
text = [
  "Welcome to Black City.\\c\\n",
  "This is the city of dreams, greed, and\\n",
  "more greed.\\c\\n",
  "And I am Black City's boss, so I'm\\n",
  "a whirlpool of greed!$",
]

[msg.section_0.entries.1]
text = [
  "Your greed is impressive.\\n",
  "I know.\\c\\n",
  "You climbed right up the Black Tower.\\n",
  "That's great!\\c\\n",
  "I like people who are\\n",
  "filled with ambition and greed.$",
]

[msg.section_0.entries.2]
text = [
  "Having amazing Trainers like\\n",
  "you here in Black City makes\\l\\n",
  "me seem less impressive.\\c\\n",
  "But, whatever!\\n",
  "My greed knows no bounds...\\c\\n",
  "That's right! That's why I'm\\n",
  "the boss of Black City!$",
]

[msg.section_0.entries.3]
text = [
  "It has worth because it's expensive.\\n",
  "If you think that, you'll get burned!\\c\\n",
  "You have to get smarter so you\\n",
  "won't get tricked!$",
]

[msg.section_0.entries.4]
text = [
  "I want to become really powerful\\n",
  "so I can make more money!$",
]

[msg.section_0.entries.5]
text = [
  "Money can't get you everything.\\c\\n",
  "Still, if you have it,\\n",
  "you can get almost anything!$",
]

[msg.section_0.entries.6]
text = [
  "You can't be satisfied by\\n",
  "being the same as everyone else!\\c\\n",
  "If you are, you're just not thinking,\\n",
  "and you'll be tricked by bad people.$",
]

[msg.section_0.entries.7]
text = [
  "Hmmm... Isn't there a better job where\\n",
  "I can make more money?\\c\\n",
  "I mean, come on!\\c\\n",
  "I want more money\\n",
  "if I'm going to do the same job!$",
]

[msg.section_0.entries.8]
text = [
  "I wonder how strong this Pokémon\\n",
  "could become...\\c\\n",
  "Strength is a measure of worth, right?$",
]

[msg.section_0.entries.9]
text = [
  "Everything I want is here!\\n",
  "If I only had money! If only!\\l\\n",
  "That's right!\\l\\n",
  "I'm going to work hard to make money!$",
]

[msg.section_0.entries.10]
text = [
  "Did civilization develop so that\\n",
  "people can get what they want?$",
]

[msg.section_0.entries.11]
text = [
  "We're the hottest store in town!\\c\\n",
  "When people mention the\\n",
  "famous store in Black City,\\l\\n",
  "they're talking about us!\\c\\n",
  "Today, you can get [VAR ITEM2(0)]\\n",
  "for a low, low \\$[VAR NUM5(1)]!\\l\\n",
  "How about it?$",
]


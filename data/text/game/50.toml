[msg.section_0.entries.0]
text = [
  "Your favorite is [VAR PKNAME(0)], isn't it?$",
]

[msg.section_0.entries.1]
text = [
  "Your favorite is that Egg, isn't it?$",
]

[msg.section_0.entries.2]
text = [
  "Yes, I was right! I thought so!$",
]

[msg.section_0.entries.3]
text = [
  "What? Your favorite isn't [VAR PKNAME(0)]?!$",
]

[msg.section_0.entries.4]
text = [
  "...Oh? Your favorite really is that Egg,\\n",
  "isn't it?$",
]

[msg.section_0.entries.5]
text = [
  "I want to know\\n",
  "everyone's favorite kind of Pokémon!$",
]

[msg.section_0.entries.6]
text = [
  "Fennel has moved to Castelia City!\\c\\n",
  "Fennel is a professor who is\\n",
  "researching about Pokémon Trainers!$",
]

[msg.section_0.entries.7]
text = [
  "Au-di-no?$",
]

[msg.section_0.entries.8]
text = [
  "Wanna recover Pokémon?\\n",
  "Oh, soooooorry!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Do you know Geonet?$",
]

[msg.section_0.entries.10]
text = [
  "You! You, using Geonet!\\n",
  "I'll tell you something good\\l\\n",
  "because you're great.\\c\\n",
  "With the latest technology, we can trade\\n",
  "Pokémon with people far away!\\c\\n",
  "...I know it sounds crazy,\\n",
  "but give it a try. You'll be surprised!$",
]

[msg.section_0.entries.11]
text = [
  "Oh! You know Geonet!\\n",
  "Great, great!\\c\\n",
  "This is even greater, lemme tell ya!\\c\\n",
  "If you try Geonet, you can register\\n",
  "the place where you live!$",
]

[msg.section_0.entries.12]
text = [
  "You see the globe on the second floor\\n",
  "of this Pokémon Center?\\c\\n",
  "That is Geonet.\\c\\n",
  "If you check on Geonet, you can register\\n",
  "the place where you live!$",
]

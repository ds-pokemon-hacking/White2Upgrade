[msg]
trailing_data = "e8e8"

[msg.section_0.entries.0]
text = [
  "[VAR TRNAME(1)]: Oh! Nice!\\n",
  "You've come here to toughen up!\\c\\n",
  "All right! Let's see how much\\n",
  "stronger you've become! Come at me!\\c$",
]

[msg.section_0.entries.1]
text = [
  "[VAR TRNAME(1)]: Not bad...\\c\\n",
  "You're thinking about how to bring out\\n",
  "your Pokémon's strength.\\c\\n",
  "I should be able to count\\n",
  "on you for backup!\\c\\n",
  "What are you doing here anyway?\\c\\n",
  "Huh?\\n",
  "A Town Map?\\c$",
]

[msg.section_0.entries.2]
text = [
  "[VAR TRNAME(0)] handed over\\n",
  "the Town Map!\\c$",
]

[msg.section_0.entries.3]
text = [
  "[VAR TRNAME(1)]: Tch...\\n",
  "She didn't have to do that...\\c\\n",
  "Thanks to you, too. We just left,\\n",
  "and you've already helped me out.\\c$",
]

[msg.section_0.entries.4]
text = [
  "???: I thought it was lively around here!\\n",
  "You were having a Pokémon battle, huh?\\l\\n",
  "Isn't it nice to be young!\\c$",
]

[msg.section_0.entries.5]
text = [
  "[VAR TRNAME(1)]: Who are you?\\c$",
]

[msg.section_0.entries.6]
text = [
  "???: Who am I?\\c\\n",
  "I'm the owner of this ranch!\\n",
  "And this is my wife!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Wife: After a Pokémon battle, you\\n",
  "should heal your Pokémon's HP, right?\\l\\n",
  "Here, I'll give you this!\\c$",
]

[msg.section_0.entries.8]
text = [
  "And one for you!\\c$",
]

[msg.section_0.entries.9]
text = [
  "It's nice to have Potions when\\n",
  "you're far away from a Pokémon Center.\\c$",
]

[msg.section_0.entries.10]
text = [
  "Owner: By the way, you didn't happen\\n",
  "to see a Herdier around here, did you?\\c\\n",
  "I can't figure out where it went.\\c\\n",
  "Our two Herdier are always together\\n",
  "and this is the first time one has\\l\\n",
  "wandered off, so I'm a little worried...\\c$",
]

[msg.section_0.entries.11]
text = [
  "[VAR TRNAME(1)]: You're a little worried?\\n",
  "Are you KIDDING me?!\\c\\n",
  "Your Pokémon might be lost forever!\\c\\n",
  "Whatever! I'll look!\\n",
  "[VAR TRNAME(0)]! Help out!\\c$",
]

[msg.section_0.entries.12]
text = [
  "Owner: Why did he get so mad?\\c\\n",
  "I think it's probably just\\n",
  "playing somewhere in the ranch.\\c$",
]

[msg.section_0.entries.13]
text = [
  "Wife: I wonder...\\c\\n",
  "By the way, dear, if your Pokémon\\n",
  "get hurt, let me know.\\l\\n",
  "I'll make them feel better for you!$",
]

[msg.section_0.entries.14]
text = [
  "Herdier, where did you go?$",
]

[msg.section_0.entries.15]
text = [
  "[VAR TRNAME(1)]: Did Herdier...\\n",
  "wander somewhere back here?\\c\\n",
  "Let's have a look!\\c$",
]

[msg.section_0.entries.16]
text = [
  "Wow, this ranch is really big!$",
]

[msg.section_0.entries.17]
text = [
  "Why haven't we found it yet?\\n",
  "I'm worried about Herdier...$",
]

[msg.section_0.entries.18]
text = [
  "Oh! Here! I'll share something\\n",
  "good with you!\\c$",
]

[msg.section_0.entries.19]
text = [
  "If your Pokémon is paralyzed,\\n",
  "use one of these on it!\\c$",
]

[msg.section_0.entries.20]
text = [
  "Still, Pokémon don't just wander\\n",
  "off on their own.\\c\\n",
  "In a worst-case scenario,\\n",
  "it might be involved in some trouble!$",
]

[msg.section_0.entries.21]
text = [
  "Yawrp!$",
]

[msg.section_0.entries.22]
text = [
  "Did you hear that just now?\\c$",
]

[msg.section_0.entries.23]
text = [
  "I'll check this area!\\c\\n",
  "You go deeper in the grove\\n",
  "and look!\\c$",
]

[msg.section_0.entries.24]
text = [
  "Look deeper in the grove!$",
]

[msg.section_0.entries.25]
text = [
  "Herdier: Yaarrrp...$",
]

[msg.section_0.entries.26]
text = [
  "[VAR TRNAME(1)]: That cry!\\n",
  "You found it!\\c\\n",
  "What a relief!\\c\\n",
  "OK, I'll go call its Trainer,\\n",
  "so you stay here with it!\\c$",
]

[msg.section_0.entries.27]
text = [
  "???: Tch...\\n",
  "You little pest!\\c\\n",
  "I'm a member of a group that strikes\\n",
  "fear into the hearts of those who\\l\\n",
  "stand before it: Team Plasma!\\c\\n",
  "Ever heard of it?$",
]

[msg.section_0.entries.28]
text = [
  "That's right! We're the righteous group\\n",
  "that tried to conquer Unova two years\\l\\n",
  "back in order to liberate Pokémon!\\c$",
]

[msg.section_0.entries.29]
text = [
  "Really? We're the righteous group\\n",
  "that tried to conquer Unova two years\\l\\n",
  "back in order to liberate Pokémon!\\c$",
]

[msg.section_0.entries.30]
text = [
  "Whatever...\\c\\n",
  "Fools will never understand us...\\c\\n",
  "Still...\\c\\n",
  "First I got lost chasing Herdier...\\n",
  "and now some nosy kid caught me!\\c\\n",
  "All of this is your fault!\\n",
  "Take this!\\c$",
]

[msg.section_0.entries.31]
text = [
  "OK! I'll use this opportunity\\n",
  "to retreat for now!\\c$",
]

[msg.section_0.entries.32]
text = [
  "Yap! Bwoof!$",
]

[msg.section_0.entries.33]
text = [
  "Owner: Herdier!\\c\\n",
  "What made you come all\\n",
  "the way back here?\\c\\n",
  "Well, at any rate, I'm really grateful\\n",
  "for your help, you two!\\c$",
]

[msg.section_0.entries.34]
text = [
  "[VAR TRNAME(1)]: You're awfully calm\\n",
  "about this!\\c\\n",
  "Your Pokémon might have\\n",
  "been gone for good!\\c\\n",
  "Take better care of it!\\c$",
]

[msg.section_0.entries.35]
text = [
  "Owner: Hmm...\\n",
  "I wonder if something happened to him...\\c\\n",
  "It's like he's afraid of\\n",
  "losing Pokémon...\\c\\n",
  "Come on, Herdier!\\n",
  "Everyone's waiting! Let's go home!\\c$",
]

[msg.section_0.entries.36]
text = [
  "Owner: Thanks! It's all thanks\\n",
  "to you and your Pokémon!\\c\\n",
  "You're really great! Hey, is that it?\\n",
  "Did Alder train you?$",
]

[msg.section_0.entries.37]
text = [
  "This ranch started when a fence\\n",
  "was made to protect Pokémon!$",
]

[msg.section_0.entries.38]
text = [
  "Owner: It is strange for Herdier\\n",
  "to wander off on its own.\\c\\n",
  "It always plays with the other\\n",
  "one or works on the ranch...$",
]

[msg.section_0.entries.39]
text = [
  "Yup! You and your Pokémon\\n",
  "are full of energy!$",
]

[msg.section_0.entries.40]
text = [
  "You and your Pokémon\\n",
  "look a little worn out...\\c\\n",
  "Rest here a minute--you won't\\n",
  "get anywhere all tired like that!\\c$",
]

[msg.section_0.entries.41]
text = [
  "You and your Pokémon\\n",
  "found Herdier! Great!$",
]


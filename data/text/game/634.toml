[msg]
trailing_data = "5050"

[msg.section_0.entries.0]
text = [
  "Playing the piano isn't much fun lately...\\c\\n",
  "Maybe what I need is to hear a cry\\n",
  "with a wonderful melody.\\l\\n",
  "That might get my imagination going.\\c$",
]

[msg.section_0.entries.1]
text = [
  "Do you know about this?\\c\\n",
  "A Pokémon called Kricketot has a cry\\n",
  "that sounds like an instrument!\\l\\n",
  "I'd sure like to hear it sometime.$",
]

[msg.section_0.entries.2]
text = [
  "The cry of that Kricketot with you...\\c\\n",
  "Dedelee dun dun dun dum! ♪\\n",
  "It sounds just like a xylophone!\\c$",
]

[msg.section_0.entries.3]
text = [
  "One more thing...\\c\\n",
  "If I could hear just one more cry,\\n",
  "my heart would flutter and my fingers\\l\\n",
  "would dance over the keys!$",
]

[msg.section_0.entries.4]
text = [
  "I hear a Pokémon called Whismur\\n",
  "has a very quiet cry.\\c\\n",
  "If I knew what it sounded like,\\n",
  "I could play perfect pianissimo!$",
]

[msg.section_0.entries.5]
text = [
  "The cry of that Whismur with you...\\c\\n",
  "It's wonderfully pianissimo!\\n",
  "It reverberates like a sweet murmur!$",
]

[msg.section_0.entries.6]
text = [
  "Thanks to you and your Pokémon,\\n",
  "my mind is overflowing with melodies!\\c\\n",
  "I can play the piano again!\\c$",
]

[msg.section_0.entries.7]
text = [
  "This is a token of my appreciation for\\n",
  "your getting me out of my slump. Thanks!$",
]

[msg.section_0.entries.8]
text = [
  "Shall I play a song I like for you?$",
]

[msg.section_0.entries.9]
text = [
  "Hee hee!\\n",
  "Listen closely, then!$",
]

[msg.section_0.entries.10]
text = [
  "Alas. That's unfortunate...\\n",
  "If you change your mind, let me know!$",
]

[msg.section_0.entries.11]
text = [
  "She's absorbed in her performance!$",
]

[msg.section_0.entries.12]
text = [
  "Do you want to listen to my drum?$",
]

[msg.section_0.entries.13]
text = [
  "My! Heart!\\n",
  "As long as my heart beats!\\l\\n",
  "I will keep! On! Drumming!!$",
]

[msg.section_0.entries.14]
text = [
  "...I thought so.$",
]

[msg.section_0.entries.15]
text = [
  "He is concentrating on his performance!$",
]

[msg.section_0.entries.16]
text = [
  "Chip kwip!$",
]

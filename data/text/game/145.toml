[msg.section_0.entries.0]
text = [
  "Mimicking somebody is fun, isn't it?\\c\\n",
  "Do you want to find the one who\\n",
  "mimics me among my friends?$",
]

[msg.section_0.entries.1]
text = [
  "I see...$",
]

[msg.section_0.entries.2]
text = [
  "OK! Here goes!$",
]

[msg.section_0.entries.3]
text = [
  "Klang$",
]

[msg.section_0.entries.4]
text = [
  "Swoobat$",
]

[msg.section_0.entries.5]
text = [
  "Azumarill$",
]

[msg.section_0.entries.6]
text = [
  "Eelektross$",
]

[msg.section_0.entries.7]
text = [
  "Who mimicked me?\\n",
  "Speak to that person.$",
]

[msg.section_0.entries.8]
text = [
  "Did that friend mimic me?$",
]

[msg.section_0.entries.9]
text = [
  "Correct!\\c\\n",
  "Trainer, you're great!\\n",
  "Do you want to try again?$",
]

[msg.section_0.entries.10]
text = [
  "Hmmm... Too bad.\\n",
  "Do you want to try again?$",
]

[msg.section_0.entries.11]
text = [
  "Which of my friends\\n",
  "mimicked me?$",
]

[msg.section_0.entries.12]
text = [
  "Klink$",
]

[msg.section_0.entries.13]
text = [
  "Klinklang$",
]

[msg.section_0.entries.14]

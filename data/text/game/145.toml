]

[msg.section_0.entries.19]
text = [
  "Eelektrik$",
]

[msg.section_0.entries.20]
text = [
  "I'm not a mimicker.\\n",
  "But mimicking is fun.$",
]

[msg.section_0.entries.21]
text = [
  "I want to cherish my originality.$",
]

[msg.section_0.entries.22]
text = [
  "It's nicer to be mimicked\\n",
  "than to mimic somebody!$",
]

[msg.section_0.entries.23]
text = [
  "You can use the target's\\n",
  "last move during a battle.\\c\\n",
  "That is Mimic!\\c\\n",
  "My Galvantula is charming,\\n",
  "even though it won't learn Mimic!$",
]


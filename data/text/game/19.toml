[msg.section_0.entries.0]
text = [
  "Oh my! You have eight Gym Badges?!\\n",
  "Why, you must be very strong!\\c\\n",
  "But, I wonder what would separate\\n",
  "Trainers who both have eight Badges...$",
]

[msg.section_0.entries.1]
text = [
  "There's a model who I've been\\n",
  "a fan of for years!\\c\\n",
  "Her name is Elesa,\\n",
  "and her Pokémon are strong, too!\\c\\n",
  "Huh? You've battled with her?\\n",
  "You're really something!$",
]

[msg.section_0.entries.2]
text = [
  "The GTS! It links the world from the\\n",
  "second floor of a Pokémon Center!\\c\\n",
  "The full name of the GTS is the\\n",
  "Global Trade Station!\\c\\n",
  "Now in Driftveil City, you can find the\\n",
  "Pokémon World Tournament.\\l\\n",
  "It's the PWT for short!$",
]

[msg.section_0.entries.3]
text = [
  "Hi, hi!\\n",
  "Let's play Pokémon rock-paper-scissors!\\c\\n",
  "I'm really good at it!\\n",
  "I've beaten all of my friends!\\l\\n",
  "Are you ready?\\c\\n",
  "Here we go!$",
]

[msg.section_0.entries.4]
text = [
  "Rock$",
]

[msg.section_0.entries.5]
text = [
  "Scissors$",
]

[msg.section_0.entries.6]
text = [
  "Paper$",
]

[msg.section_0.entries.7]
text = [
  "Shoot!$",
]

[msg.section_0.entries.8]
text = [
  "Waaaah! I lost!\\n",
  "My win streak's over... Sniff...\\c$",
]

[msg.section_0.entries.9]
text = [
  "The Funfest Mission\\n",
  "“[VAR FUNFESTMISSION(0)]\\\"\\l\\n",
  "has been added to the Entralink!$",
]

[msg.section_0.entries.10]
text = [
  "Until I figure out a way\\n",
  "to win every time for sure,\\l\\n",
  "I won't play anymore!$",
]

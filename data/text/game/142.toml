[msg.section_0.entries.0]
text = [
  "Drayden: Let me tell you the story.\\n",
  "It's a long story, but listen closely.\\c$",
]

[msg.section_0.entries.1]
text = [
  "It was two years ago when the two\\n",
  "dragon Pokémon were awakened.\\c\\n",
  "The black dragon Pokémon, Zekrom,\\n",
  "pursued what is ideal, with the desire\\l\\n",
  "to usher in a new world of hope.\\c\\n",
  "And the white dragon Pokémon, Reshiram,\\n",
  "sought what is true, with the desire\\l\\n",
  "to usher in a new world of goodness.\\c\\n",
  "Zekrom and Reshiram\\n",
  "were once a single Pokémon.\\c$",
]

[msg.section_0.entries.2]
text = [
  "It was two years ago when the two\\n",
  "dragon Pokémon were awakened.\\c\\n",
  "The white dragon Pokémon, Reshiram,\\n",
  "sought what is true, with the desire\\l\\n",
  "to usher in a new world of goodness.\\c\\n",
  "And the black dragon Pokémon, Zekrom,\\n",
  "pursued what is ideal, with the desire\\l\\n",
  "to usher in a new world of hope.\\c\\n",
  "Reshiram and Zekrom\\n",
  "were once a single Pokémon.\\c$",
]

[msg.section_0.entries.3]
text = [
  "You may wonder why it split in two.\\c\\n",
  "The single dragon Pokémon had helped the\\n",
  "twin heroes bring a new region into being.\\c\\n",
  "But the twin heroes--the older brother\\n",
  "who sought the truth and the\\l\\n",
  "younger brother who sought ideals--\\l\\n",
  "sundered the region in two as they\\l\\n",
  "fought to see which of them was right.\\c\\n",
  "In that desperate hour, the single\\n",
  "dragon Pokémon split its body into a\\l\\n",
  "black Pokémon and a white Pokémon,\\l\\n",
  "even though ideals and truth\\l\\n",
  "don't need to be in opposition!\\c$",
]

[msg.section_0.entries.4]
text = [
  "You may wonder why it split in two.\\c\\n",
  "The single dragon Pokémon had helped the\\n",
  "twin heroes bring a new region into being.\\c\\n",
  "But the twin heroes--the younger\\n",
  "brother who sought ideals and the older\\l\\n",
  "brother who sought the truth--sundered\\l\\n",
  "the region in two as they fought to see\\l\\n",
  "which of them was right.\\c\\n",
  "In that desperate hour, the single\\n",
  "dragon Pokémon split its body into a\\l\\n",
  "white Pokémon and a black Pokémon,\\l\\n",
  "even though ideals and truth\\l\\n",
  "don't need to be in opposition!\\c$",
]

[msg.section_0.entries.5]
text = [
  "As the story goes, a third\\n",
  "dragon Pokémon, [COLOR(2)]Kyurem[COLOR(0)],\\l\\n",
  "also came into existence in that era.\\c\\n",
  "And there may be proof of this to be\\n",
  "found in a treasure passed down in my\\l\\n",
  "family for generations: the DNA Splicers.\\c\\n",
  "Professor Juniper's research determined\\n",
  "that the materials in the splicers date\\l\\n",
  "back to the same era as the materials\\l\\n",
  "used in building the Dragonspiral Tower.\\c$",
]

[msg.section_0.entries.6]
text = [
  "Oh, the DNA Splicers\\n",
  "are stored very safely.\\c\\n",
  "I guard them because I don't know\\n",
  "what kind of power might lie within them.\\c\\n",
  "But here's what's been bothering me...\\n",
  "Could there be one more dragon Pokémon?\\c\\n",
  "Even if Kyurem really exists,\\n",
  "we don't know what kind of Pokémon it is.\\c\\n",
  "For starters, the two Pokémon\\n",
  "the ancient Pokémon split into\\l\\n",
  "are both overwhelmingly powerful.\\c\\n",
  "So if Kyurem exists, could it be just\\n",
  "a husk--a shell that was left over?\\c$",
]

[msg.section_0.entries.7]
text = [
  "Boom!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Drayden: Hm?\\c\\n",
  "What was that sound?\\c$",
]

[msg.section_0.entries.9]
text = [
  "Ax! Axew!$",
]


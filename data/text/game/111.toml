[msg.section_0.entries.1]
text = [
  "Hey, Trainer!\\n",
  "The move I recommend for you\\l\\n",
  "is none other than Bug Bite!\\c\\n",
  "When Bug Bite hits a target,\\n",
  "you can steal any Berry it's holding\\l\\n",
  "and use the effect for yourself!\\c\\n",
  "If the user steals an Oran Berry\\n",
  "or a Sitrus Berry, the user will not only\\l\\n",
  "do damage, but it will heal itself as well!\\c\\n",
  "It's doubly effective!$",
]

[msg.section_0.entries.2]
text = [
  "Hey, Trainer!\\n",
  "The move I recommend for you\\l\\n",
  "is none other than Covet!\\c\\n",
  "When a Pokémon hits a target\\n",
  "with Covet, it can steal the\\l\\n",
  "item the target is holding!\\c\\n",
  "If you steal a held item from a\\n",
  "wild Pokémon, that item becomes\\l\\n",
  "yours when the battle ends!$",
]

[msg.section_0.entries.3]
text = [
  "Hey, Trainer!\\n",
  "The move I recommend for you\\l\\n",
  "is none other than Super Fang!\\c\\n",
  "Super Fang halves the target's HP!\\c\\n",
  "The user can do a consistent amount\\n",
  "of damage even if it has low Attack\\l\\n",
  "or the target has high Defense!$",
]

[msg.section_0.entries.4]
text = [
  "Hey, Trainer!\\n",
  "The move I recommend for you\\l\\n",
  "is none other than Low Kick!\\c\\n",
  "The heavier the target,\\n",
  "the more damage Low Kick does!\\c\\n",
  "It's a Fighting-type move,\\n",
  "so it works well against\\l\\n",
  "Rock- and Steel-type Pokémon,\\l\\n",
  "which are often heavy!$",
]

[msg.section_0.entries.5]
text = [
  "Hey, Trainer!\\n",
  "The move I recommend for you\\l\\n",
  "is none other than Uproar!\\c\\n",
  "Uproar does damage for\\n",
  "three turns after one use!\\c\\n",
  "A Pokémon that's in an uproar\\n",
  "can't use any other moves,\\l\\n",
  "and no Pokémon in battle can sleep!\\c\\n",
  "Whether that's an advantage or\\n",
  "disadvantage is up to you!$",
]

[msg.section_0.entries.6]
text = [
  "Welcome to the Driftveil Chateau Hotel.\\n",
  "We're currently all booked up,\\l\\n",
  "but feel free to enjoy the ambiance.$",
]

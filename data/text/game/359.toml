[msg]
trailing_data = "a0a0"

[msg.section_0.entries.0]
text = [
  "[VAR TRNAME(1)]: Again?!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Team Plasma: Wait!\\c$",
]

[msg.section_0.entries.2]
text = [
  "No need to be suspicious!\\c\\n",
  "This uniform is just a disguise.\\n",
  "I'm ex-Team Plasma!\\c\\n",
  "What I am now is a spy, to guard against\\n",
  "anything bad they might cook up.\\c$",
]

[msg.section_0.entries.3]
text = [
  "[VAR TRNAME(1)]: It must be a hard job,\\n",
  "keeping an eye on your former allies.\\c\\n",
  "Say, you don't know anything about a\\n",
  "Purrloin stolen in Aspertia, do you?\\c$",
]

[msg.section_0.entries.4]
text = [
  "S-sorry, but I don't know\\n",
  "anything about that...\\c$",
]

[msg.section_0.entries.5]
text = [
  "[VAR TRNAME(1)]: That's what I figured.\\c\\n",
  "I wouldn't expect someone from a\\n",
  "group bent on world domination\\l\\n",
  "to be all that quick on the uptake.\\c$",
]

[msg.section_0.entries.6]
text = [
  "Oh...\\c\\n",
  "But I honestly wanted\\n",
  "to save Pokémon...$",
]

[msg.section_0.entries.7]
text = [
  "In this ship, the Plasma Frigate,\\n",
  "you move around by using warp panels.\\l\\n",
  "Look sharp!$",
]

[msg.section_0.entries.8]
text = [
  "In order to reach the heart of\\n",
  "this ship, you need a password.\\c\\n",
  "Please get the password from\\n",
  "the members of Team Plasma.$",
]

[msg.section_0.entries.9]
text = [
  "I can't remember how to use\\n",
  "the warp panels to get around.\\l\\n",
  "And they won't give me a Pokémon yet...\\c\\n",
  "But even a guy like me has\\n",
  "something useful to share.\\c\\n",
  "You step on four switches\\n",
  "to remove the barrier!$",
]

[msg.section_0.entries.10]
text = [
  "I just joined Team Plasma, and\\n",
  "they won't give me a Pokémon yet.\\c\\n",
  "But even a guy like me has\\n",
  "something useful to share.\\c\\n",
  "You need the Plasma Card\\n",
  "to enter the password!$",
]

[msg.section_0.entries.11]
text = [
  "Team Plasma has disbanded...\\c\\n",
  "And I finally just learned how to\\n",
  "use the warp panels to get around!\\c\\n",
  "I'm so frustrated!\\c\\n",
  "So I'm going to stay here and use\\n",
  "the warp panels as much as I want!$",
]

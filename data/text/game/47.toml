[msg]
trailing_data = "3434"

[msg.section_0.entries.0]
text = [
  "Iris: You can go inside\\n",
  "the sewers from here!\\c\\n",
  "Whaddaya think?\\n",
  "Seems pretty suspicious, right?\\c$",
]

[msg.section_0.entries.1]
text = [
  "[VAR TRNAME(1)]: [VAR TRNAME(0)]!\\n",
  "Did you find Team Plasma?!$",
]

[msg.section_0.entries.2]
text = [
  "Uh, thanks...\\c\\n",
  "But you don't need to lie just\\n",
  "so I won't be disappointed!\\c$",
]

[msg.section_0.entries.3]
text = [
  "Augh! Those dirty Pokémon thieves!\\c$",
]

[msg.section_0.entries.4]
text = [
  "That means the only place\\n",
  "I still haven't checked is...\\c\\n",
  "[VAR TRNAME(0)]!\\n",
  "Help me out!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Iris: Yep! The sewers are\\n",
  "a perfect place for hiding!$",
]

[msg.section_0.entries.6]
text = [
  "Iris: Your friend...\\c\\n",
  "He seemed pretty mad.\\n",
  "Did everything go OK in the sewers?\\c$",
]

[msg.section_0.entries.7]
text = [
  "So what are you going to do now?\\c\\n",
  "You ran into Gym Leader Burgh\\n",
  "in the sewers, didn't you?\\c\\n",
  "Maybe you should go to the Pokémon Gym\\n",
  "and see how far you've come!\\c\\n",
  "I'm sure battling will help your Pokémon\\n",
  "come to understand you better\\l\\n",
  "as a Trainer, too!$",
]

[msg.section_0.entries.8]
text = [
  "Some Trainers even toughen up\\n",
  "their Pokémon in the sewers...$",
]

[msg.section_0.entries.9]
text = [
  "What?\\n",
  "You want to go into the sewers?\\c\\n",
  "Well, OK... But watch out\\n",
  "for wild Pokémon.$",
]

[msg.section_0.entries.10]
text = [
  "Because of the tide, you sometimes\\n",
  "might not be able to get into\\l\\n",
  "the Castelia Sewers.\\l\\n",
  "It depends on the season.$",
]

[msg.section_0.entries.11]
text = [
  "Stick up your thumbs, and curl in\\n",
  "your fingers.\\c\\n",
  "This is a thumbs-up pose. That means OK!\\n",
  "In some places, it also means well done!$",
]

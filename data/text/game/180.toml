[msg]
trailing_data = "caca"

[msg.section_0.entries.0]
text = [
  "???: Roxie,\\n",
  "don't try to stop me!\\c\\n",
  "I'm off to Pokéstar Studios\\n",
  "to live up to my true potential!\\c\\n",
  "My dream is to be a ship captain\\n",
  "and a movie star!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Roxie: Get real!\\n",
  "You're a captain already, aren't you?\\c\\n",
  "If that ship doesn't move,\\n",
  "you're going to cause lots of trouble!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Captain: Oh, dear daughter.\\c\\n",
  "You split your time between your\\n",
  "responsibilities as a Gym Leader and\\l\\n",
  "with your band, right?\\l\\n",
  "I can do that, too!\\c$",
]

[msg.section_0.entries.3]
text = [
  "Roxie: AAAAAAH!\\c\\n",
  "You dim-witted...dense...dumb...daft...\\n",
  "dippy...dorky...doltish DOOFUS!\\c\\n",
  "Doing double duty isn't the problem!\\n",
  "You're causing problems for people!\\c\\n",
  "Keeping people from getting where\\n",
  "they're going because of sheer\\l\\n",
  "selfishness is unforgivable!\\c\\n",
  "I've HAD it!\\n",
  "I'm going to the Gym!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Past here is the charming wonderland--\\n",
  "Pokéstar Studios!\\c\\n",
  "It's a movie studio, but right\\n",
  "now auditions are in progress...\\c\\n",
  "They're having a look at the captain's\\n",
  "acting. No unauthorized people allowed!$",
]

[msg.section_0.entries.5]
text = [
  "Past here is the charming wonderland--\\n",
  "Pokéstar Studios!\\c\\n",
  "It's a movie studio, but right\\n",
  "now auditions are in progress...\\c\\n",
  "They're having a look at the captain's\\n",
  "acting. No unauthorized people allowed!\\c$",
]

[msg.section_0.entries.6]
text = [
  "The Xtransceiver is ringing!$",
]

[msg.section_0.entries.7]
text = [
  "[VAR TRNAME(0)] picked up the\\n",
  "Xtransceiver!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Roxie: So, are you guys\\n",
  "Team Plasma, then?\\c$",
]

[msg.section_0.entries.9]
text = [
  "That's right!\\n",
  "We're Team Plasma!\\c\\n",
  "Two years ago...\\n",
  "We were betrayed by the man\\l\\n",
  "we respected as our king and hero!\\c\\n",
  "So our conquest of the Unova region\\n",
  "ended in failure!\\c\\n",
  "However! We'll never give up!\\n",
  "We will persevere!\\c\\n",
  "We already have another\\n",
  "plan in motion.\\c$",
]

[msg.section_0.entries.10]
text = [
  "[VAR TRNAME(1)]: Shut it!\\c\\n",
  "You guys are the worst.\\n",
  "You talk about saving Pokémon,\\l\\n",
  "but you're just Pokémon thieves!\\l\\n",
  "Don't think I'll ever forgive you!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Team Plasma: In the ranch,\\n",
  "we got chased by Lillipup...\\c$",
]

[msg.section_0.entries.12]
text = [
  "Team Plasma: And now we're getting\\n",
  "involved in trouble. This kinda stinks.\\c$",
]

[msg.section_0.entries.13]
text = [
  "Team Plasma: Well, it's OK, isn't it?\\n",
  "If we steal their Pokémon...\\c\\n",
  "OK, kiddos, when you're\\n",
  "ready, give it your best shot!\\c$",
]

[msg.section_0.entries.14]
text = [
  "[VAR TRNAME(1)]: I'll crush you\\n",
  "and your new plans!\\c\\n",
  "I can never forgive Team Plasma!\\c$",
]

[msg.section_0.entries.15]
text = [
  "Roxie: [VAR TRNAME(0)]!\\n",
  "Help out!$",
]

[msg.section_0.entries.16]
text = [
  "[VAR TRNAME(1)]: Dirty Pokémon thieves...$",
]

[msg.section_0.entries.17]
text = [
  "Team Plasma: What?\\n",
  "Think you can beat me?$",
]

[msg.section_0.entries.18]
text = [
  "Ha ha! Your Pokémon will be\\n",
  "helping us take over the world\\l\\n",
  "in a few seconds!\\c$",
]

[msg.section_0.entries.19]
text = [
  "That's right!\\n",
  "Don't try opposing us!$",
]

[msg.section_0.entries.20]
text = [
  "Team Plasma: I can't believe\\n",
  "kids like these caught us off guard!\\c\\n",
  "Tch... Let's run!\\c$",
]

[msg.section_0.entries.21]
text = [
  "[VAR TRNAME(1)]: Tsk!\\n",
  "What a bunch of creeps!\\c$",
]

[msg.section_0.entries.22]
text = [
  "Roxie: Split up! You,\\n",
  "go check Route 20!\\c$",
]

[msg.section_0.entries.23]
text = [
  "If I'd lost, my precious\\n",
  "Pokémon would've been taken!\\c\\n",
  "Thanks, you two!\\c\\n",
  "Use this!\\c$",
]

[msg.section_0.entries.24]
text = [
  "[VAR TRNAME(1)]: That's...\\n",
  "a Hidden Machine, right?\\l\\n",
  "It's Cut!\\c\\n",
  "Pokémon that know Cut\\n",
  "can use it even when they're not\\l\\n",
  "in battle to cut down small trees!\\c\\n",
  "Oh! But more importantly,\\n",
  "let's go after Team Plasma!\\c\\n",
  "C’mon! We’re splitting up\\n",
  "and searching Route 20!\\c$",
]

[msg.section_0.entries.25]
text = [
  "Roxie's poison is intense!\\n",
  "It stings, stings, and stiiiings!\\c\\n",
  "But, know what I did?\\n",
  "I caught a Magnemite in the complex,\\l\\n",
  "and I was just fine!\\c\\n",
  "Here, I'll give you these,\\n",
  "so go catch a Magnemite or something!\\c$",
]

[msg.section_0.entries.26]
text = [
  "Roxie's poison is intense!\\n",
  "It stings, stings, and stiiiings!\\c\\n",
  "But, know what I did?\\n",
  "I caught a Magnemite in the complex,\\l\\n",
  "and I was just fine!$",
]

[msg.section_0.entries.27]
text = [
  "If I didn't have Pokémon, all of the work\\n",
  "at the complex would make me a wreck!$",
]

[msg.section_0.entries.28]
text = [
  "Kid!\\n",
  "Do you know about the Battle Box?\\c\\n",
  "It's a convenient feature you can use\\n",
  "on the PCs at the Pokémon Center.$",
]

[msg.section_0.entries.29]
text = [
  "This Watchog has been with me\\n",
  "since I was born!\\c\\n",
  "Its Keen Eye Ability\\n",
  "has helped me so many times!$",
]

[msg.section_0.entries.30]
text = [
  "Hoooog!$",
]

[msg.section_0.entries.31]
text = [
  "Roxie's band!\\c\\n",
  "It's getting hard to buy\\n",
  "tickets to their shows lately! ♪\\c\\n",
  "Maybe they'll go on a world\\n",
  "tour soon!$",
]

[msg.section_0.entries.32]
text = [
  "My Medal's really pretty, isn't it?!\\c\\n",
  "If you solve the Hint Medal riddles,\\n",
  "you can collect more and more of them!$",
]

[msg.section_0.entries.33]
text = [
  "First, turn the C-Gear's power on!\\c\\n",
  "Then tap [COLOR(1)]CONNECTED[COLOR(0)]\\n",
  "in the center of the C-Gear screen\\l\\n",
  "to check the Tag Log!$",
]

[msg.section_0.entries.34]
text = [
  "First, turn the C-Gear's power on!\\c\\n",
  "Then tap [COLOR(1)]WIRELESS[COLOR(0)].\\n",
  "Finally, tap [COLOR(1)]ENTRALINK[COLOR(0)]!\\l\\n",
  "If you have some time, give it a try!\\l\\n",
  "It's amazing!$",
]

[msg.section_0.entries.35]
text = [
  "One, two, three, four, five, six!\\c\\n",
  "The number of Poké Balls\\n",
  "you can put in your belt is six.\\l\\n",
  "So you can take six Pokémon with you!$",
]

[msg.section_0.entries.36]
text = [
  "Roxie: I thought your movie\\n",
  "was pretty good.\\c$",
]

[msg.section_0.entries.37]
text = [
  "Pop Roxie: So you saw it...\\c\\n",
  "That movie was...\\c\\n",
  "No, it wasn't the movie. It was me.\\n",
  "I was so excited that I didn't really\\l\\n",
  "become Riolu-Man!\\c\\n",
  "Acting like that won't\\n",
  "thrill or excite anyone...\\c$",
]

[msg.section_0.entries.38]
text = [
  "Roxie: C'mon!\\n",
  "Don't get down!\\c\\n",
  "You can keep trying while\\n",
  "you continue on as captain!\\c\\n",
  "As long as you don't cause anyone\\n",
  "trouble, I won't get mad.\\c\\n",
  "I don't know how the Pokéstar Studios\\n",
  "people feel about that, though!\\c$",
]

[msg.section_0.entries.39]
text = [
  "Oh...\\n",
  "Did you hear us?\\c\\n",
  "Well, it looks like everyone\\n",
  "from Team Plasma got away...\\c\\n",
  "I don't feel really good about it,\\n",
  "but at least they're gone.\\c\\n",
  "Oh! There was a lot of ruckus, but\\n",
  "you can sail to Castelia City now!\\c$",
]

[msg.section_0.entries.40]
text = [
  "Pop Roxie: OK! I guess\\n",
  "I'll do my best as a captain!\\c\\n",
  "I'll excite and thrill everyone\\n",
  "by barreling through rough waves!\\c$",
]

[msg.section_0.entries.41]
text = [
  "This is Virbank City!\\n",
  "City of falling fog and rising stars!$",
]

[msg.section_0.entries.42]
text = [
  "Pokéstar Studios Ahead\\n",
  "Bringing a new golden age of cinema!$",
]

[msg.section_0.entries.43]
text = [
  "Virbank City Pokémon Gym\\n",
  "Leader: Roxie\\l\\n",
  "Poison days, poison on the stage!$",
]

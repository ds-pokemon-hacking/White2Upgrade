[msg.section_0.entries.0]
text = [
  "[VAR TRNAME(1)]: This ship...\\c\\n",
  "Why is it so cold?\\c$",
]

[msg.section_0.entries.1]
text = [
  "Cheren: And...\\c$",
]

[msg.section_0.entries.2]
text = [
  "It seems like it's disguised\\n",
  "as an old sailboat...\\l\\n",
  "But that can't be it, right?\\c$",
]

[msg.section_0.entries.3]
text = [
  "Team Plasma: Why should you care?\\c\\n",
  "By the time we're done with you,\\n",
  "it won't matter anyway!\\c$",
]

[msg.section_0.entries.4]
text = [
  "[VAR TRNAME(1)]: You guys...\\n",
  "Seriously, this is Team Plasma's base?\\c$",
]

[msg.section_0.entries.5]
text = [
  "Team Plasma: Correct answer!\\c\\n",
  "So that's why, as you can see...\\c$",
]

[msg.section_0.entries.6]
text = [
  "There are so many of us here!\\c$",
]

[msg.section_0.entries.7]
text = [
  "[VAR TRNAME(1)]: Is this all?\\n",
  "I think you need more backup.\\c$",
]

[msg.section_0.entries.8]
text = [
  "Team Plasma: Ha ha ha! Oooh, I'm\\n",
  "so scared, big tough guy!\\c\\n",
  "OK!\\n",
  "Pulverize these punks!\\l\\n",
  "Plasmaaaa!\\c$",
]

[msg.section_0.entries.9]
text = [
  "[VAR TRNAME(1)]: Hey, just to let you know...\\c\\n",
  "I'm about to unleash my rage!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Team Plasma: You're first!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Team Plasma: Next! Next!\\n",
  "Hurry up already!\\c$",
]

[msg.section_0.entries.12]
text = [
  "Team Plasma: Go! Go!\\c\\n",
  "Somebody avenge me\\n",
  "and take these guys out!$",
]

[msg.section_0.entries.13]
text = [
  "Team Plasma: It's my turn!\\n",
  "Actually, it's Trubbish time!\\c$",
]

[msg.section_0.entries.14]
text = [
  "Team Plasma: What's with this Trainer?!\\c\\n",
  "This reminds me of that Trainer who\\n",
  "messed with us two years ago...\\c$",
]

[msg.section_0.entries.15]
text = [
  "Team Plasma: What's with this Trainer?!\\c\\n",
  "This reminds me of that Trainer who\\n",
  "messed with us two years ago...$",
]

[msg.section_0.entries.16]
text = [
  "Team Plasma: Tch!\\n",
  "It's two against one now!\\c$",
]

[msg.section_0.entries.17]
text = [
  "Cheren: [VAR TRNAME(0)]!\\c\\n",
  "I'd like to show them what the two of us\\n",
  "can do, so could you help me out?\\c$",
]

[msg.section_0.entries.18]
text = [
  "Cheren: Thanks!\\n",
  "You've really become much stronger!\\c\\n",
  "Help out [VAR TRNAME(1)]\\n",
  "next, OK?\\c$",
]

[msg.section_0.entries.19]
text = [
  "Cheren: There are so many of them.\\n",
  "What a bother!$",
]

[msg.section_0.entries.20]
text = [
  "Team Plasma: Hey, I remember you!\\n",
  "You're gonna pay for Virbank!\\c\\n",
  "You and the Gym Leader are going\\n",
  "down, so you'd better brace yourself!$",
]

[msg.section_0.entries.21]
text = [
  "Team Plasma: The Gym Leader is\\n",
  "irritating, but you...\\l\\n",
  "You are a horrible little brat!$",
]

[msg.section_0.entries.22]
text = [
  "Team Plasma: This guy...\\n",
  "More than strong, he's scary!\\l\\n",
  "He's really cheesed off!$",
]

[msg.section_0.entries.23]
text = [
  "Team Plasma: Look around you!\\c\\n",
  "See how many of us there are?\\n",
  "Just surrender already!$",
]

[msg.section_0.entries.24]
text = [
  "Team Plasma: Ooogz...\\n",
  "Strong for such a little brat!$",
]

[msg.section_0.entries.25]
text = [
  "Team Plasma: That little punk\\n",
  "was too intense!\\c\\n",
  "Especially for someone whose head\\n",
  "looks like a Qwilfish!$",
]

[msg.section_0.entries.26]
text = [
  "Team Plasma: You guys are too intense!$",
]

[msg.section_0.entries.27]
text = [
  "Team Plasma: I'm not losing!\\c\\n",
  "Well, actually, I haven't\\n",
  "received a Pokémon yet!$",
]

[msg.section_0.entries.28]
text = [
  "Team Plasma: What's this?\\c\\n",
  "Are the Gym Leaders\\n",
  "going to interfere with us again?$",
]

[msg.section_0.entries.29]
text = [
  "Team Plasma: I didn't stand a chance...\\c\\n",
  "And I bullied--I mean trained--my\\n",
  "Pokémon for two whole years, too!$",
]

[msg.section_0.entries.30]
text = [
  "Team Plasma: Sniff...\\n",
  "Our plans might fail again...$",
]

[msg.section_0.entries.31]
text = [
  "[VAR TRNAME(1)]: This is a piece of cake!\\n",
  "Go back up Cheren!$",
]

[msg.section_0.entries.32]
text = [
  "[VAR TRNAME(1)]: I'm gonna end this,\\n",
  "so back me up!\\c\\n",
  "OK, Plasma punk, are YOU the thief\\n",
  "who stole a Purrloin in Aspertia\\l\\n",
  "five years back?\\c$",
]

[msg.section_0.entries.33]
text = [
  "[VAR TRNAME(1)]: That's the last of 'em!\\c\\n",
  "Well now... Why don't you tell me\\n",
  "everything you know about Purrloin?\\c$",
]

[msg.section_0.entries.34]
text = [
  "Cheren: Good idea...\\c\\n",
  "There are a lot of things I want\\n",
  "to ask about as well.\\c$",
]

[msg.section_0.entries.35]
text = [
  "???: What is going on?\\c$",
]

[msg.section_0.entries.36]
text = [
  "Cheren: Oh, good grief...\\c\\n",
  "You're the person who was\\n",
  "shivering in the Cold Storage, right?\\c\\n",
  "Wasn't your name Zinzolin?\\c\\n",
  "You're going to have to tell me what\\n",
  "you're planning to do with this ship.\\c$",
]

[msg.section_0.entries.37]
text = [
  "Zinzolin: YOU!\\c\\n",
  "Once again, we will use the\\n",
  "legendary Dragon-type Pokémon\\l\\n",
  "and we will rule the Unova region!\\c\\n",
  "Curious Trainers, we shall not\\n",
  "let you run around as you please!\\c$",
]

[msg.section_0.entries.38]
text = [
  "Shadow Triad!\\n",
  "Get them out of here!\\c$",
]

[msg.section_0.entries.39]
text = [
  "Shadow Triad: By the way,\\n",
  "we are not your...\\c$",
]

[msg.section_0.entries.40]
text = [
  "Zinzolin: I know!\\n",
  "But kick them out of here now!\\c$",
]

[msg.section_0.entries.41]
text = [
  "Shadow Triad: Move.\\c$",
]

[msg.section_0.entries.42]
text = [
  "The hatch is closed tightly.$",
]

[msg.section_0.entries.43]
text = [
  "[VAR TRNAME(1)]: Take care of that guy!\\n",
  "He's no problem for you, right?\\c$",
]

[msg.section_0.entries.44]
text = [
  "[VAR TRNAME(1)]: I'm fine...\\n",
  "Let's try to find a way inside.$",
]

[msg.section_0.entries.45]
text = [
  "[VAR TRNAME(1)]: OK!\\n",
  "This time we'll check out the ship!\\c\\n",
  "When we were in Driftveil City,\\n",
  "Zinzolin came from this direction!\\c$",
]

[msg.section_0.entries.46]
text = [
  "This is the place...\\c\\n",
  "OK! I'm going!\\c$",
]

[msg.section_0.entries.47]
text = [
  "[VAR TRNAME(1)]: Hey!\\n",
  "Come here for a sec!\\c$",
]

[msg.section_0.entries.48]
text = [
  "Team Plasma: You!\\c\\n",
  "You must be friends of Smiley Swimsuit,\\n",
  "that guy who lowered the gangplank!\\c\\n",
  "Aaargh! You even got the roadblock\\n",
  "Crustle out of the way!\\c\\n",
  "Here I come!\\n",
  "Plasmaaaa!\\c$",
]

[msg.section_0.entries.49]
text = [
  "Team Plasma: Oh no!\\n",
  "The hatch is still open!\\c$",
]

[msg.section_0.entries.50]
text = [
  "Team Plasma: I don't know anything\\n",
  "about your Purrloin or whatever!$",
]

[msg.section_0.entries.51]
text = [
  "Zzz...\\n",
  "Zzz...\\c\\n",
  "Looks like he's asleep.$",
]

[msg.section_0.entries.52]
text = [
  "Team Plasma: The sky sure is vast.$",
]

[msg.section_0.entries.53]
text = [
  "Team Plasma: I knew...\\c\\n",
  "I knew that Ghetsis\\n",
  "was using me...\\c\\n",
  "But I had friends here...$",
]

[msg.section_0.entries.54]
text = [
  "Intruders!$",
]

[msg.section_0.entries.55]
text = [
  "For now, let them through!$",
]

[msg.section_0.entries.56]
text = [
  "Don't try to get out of your\\n",
  "watch with stupid talk like that!$",
]

[msg.section_0.entries.57]
text = [
  "And, um, did you find the swimsuit\\n",
  "guy who lowered the gangplank?$",
]

[msg.section_0.entries.58]
text = [
  "Even the same Pokémon\\n",
  "can exhibit different strengths\\l\\n",
  "depending on the Trainer!\\c\\n",
  "It's so interesting!\\n",
  "Very, very interesting!\\c\\n",
  "Well, now!\\n",
  "Give me but a moment of your time!$",
]

[msg.section_0.entries.59]
text = [
  "The invisible force that exists between\\n",
  "you and Pokémon...\\l\\n",
  "This time I will determine what it is!\\c$",
]

[msg.section_0.entries.60]
text = [
  "And I went to all the\\n",
  "trouble to come here, too...\\l\\n",
  "You're an unkind person.$",
]

[msg.section_0.entries.61]
text = [
  "Well, now!\\n",
  "Give me but a moment of your time!$",
]

[msg.section_0.entries.62]
text = [
  "The things you and your Pokémon\\n",
  "have seen and felt...\\l\\n",
  "Do they belong to you and you alone?\\c\\n",
  "If you would, please have another\\n",
  "Pokémon battle with me.\\c\\n",
  "By facing you, I feel as if I can see\\n",
  "what I should do from now on.$",
]

[msg.section_0.entries.63]
text = [
  "Hey!$",
]

[msg.section_0.entries.64]
text = [
  "You're kidding!$",
]

[msg.section_0.entries.65]
text = [
  "This is no good...$",
]

[msg.section_0.entries.66]
text = [
  "What should we do?$",
]

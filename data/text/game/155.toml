[msg.section_0.entries.0]
text = [
  "The Pokémon League is a place where you\\n",
  "both pursue strength and express it.\\c\\n",
  "The way to express it is simple...\\c\\n",
  "You just have to beat the Elite Four and\\n",
  "the Champion!\\c\\n",
  "You can start your challenge by battling\\n",
  "any of the Elite Four, and if you defeat\\l\\n",
  "them all, you can challenge the Champion!\\c\\n",
  "However! I warn you, once you start\\n",
  "your challenge, there's no turning back.\\c\\n",
  "You must keep battling until you defeat\\n",
  "them all...or are defeated yourself.\\c\\n",
  "Do you want to go in?$",
]

[msg.section_0.entries.1]
text = [
  "Once you start your challenge,\\n",
  "you cannot leave until you win against all\\l\\n",
  "or lose! Do you want to go in?$",
]

[msg.section_0.entries.2]
text = [
  "Then, proceed!\\c$",
]

[msg.section_0.entries.3]
text = [
  "Don't neglect preparation!\\c\\n",
  "Go through the entrance there, and\\n",
  "prepare as much as possible. Make sure\\l\\n",
  "your Pokémon are fully recovered!\\c$",
]


[msg.section_0.entries.0]
text = [
  "Hey, le Trainer fantastique! Want to be\\n",
  "part of the experiment of the century?\\c\\n",
  "You need two DS systems to play with\\n",
  "Poké Transfer!\\c\\n",
  "Do you have a second DS system that you\\n",
  "can use?$",
]

[msg.section_0.entries.1]
text = [
  "If you decide that you want to play with\\n",
  "Poké Transfer sometime, you're welcome\\l\\n",
  "to come back and ask me.$",
]

[msg.section_0.entries.2]
text = [
  "I'm sorry! Sumimasen! But you don't have\\n",
  "enough space in your PC Box.\\c\\n",
  "Please make room for six Pokémon and\\n",
  "try again.$",
]

[msg.section_0.entries.3]
text = [
  "OK! But just remember! ¡Muy importante!\\c\\n",
  "Once you bring a Pokémon here, you can't\\n",
  "send it back. Do you still want to do it?$",
]

[msg.section_0.entries.4]
text = [
  "DS Wireless Communications will\\n",
  "be launched.$",
]

[msg.section_0.entries.5]
text = [
  "                              $$",
]

[msg.section_0.entries.6]
text = [
  "OK, OK. Come here. Stand right there!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Well, let's begin! Allons-y!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Great! Molto bene!\\c$",
]

[msg.section_0.entries.9]
text = [
  "You're just as skillful as I expected!\\n",
  "Poké Transfer is working!\\c\\n",
  "But hey, [VAR TRNAME(0)], you can't fool me!\\n",
  "I bet you can do even better than this.\\c\\n",
  "A Trainer of your caliber can make\\n",
  "really good use of Poké Transfer!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Wunderbar! Magnifique! Brilliant!\\n",
  "Your skill is impressive!\\c\\n",
  "This is the very reason why we scientists\\n",
  "are doing research!\\c\\n",
  "But, [VAR TRNAME(0)]! I think a Trainer with\\n",
  "your experience can make use of it\\l\\n",
  "even more elegantly.\\c\\n",
  "Please master your genius handling of\\n",
  "Poké Transfer, and show us how\\l\\n",
  "it's done!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Great! Greeeeeeat!\\c\\n",
  "Poké Transfer is making\\n",
  "tremendous progress!\\c\\n",
  "Well, it's unbelievable! ¡Es gigante!\\n",
  "I owe everything to you!\\c\\n",
  "Please assist our research in the\\n",
  "future, too!\\c\\n",
  "Please feel free to use Poké Transfer\\n",
  "anytime you want!\\c$",
]

[msg.section_0.entries.12]
text = [
  "...\\n",
  "G...\\c\\n",
  "Great!\\n",
  "Greeeat!\\c\\n",
  "F--a--n--t--a--s--t--i--c!\\c\\n",
  "Your handling of Poké Transfer\\n",
  "is reeeally exhilarating!\\c\\n",
  "Ohhhh, our invention is\\n",
  "near completion!\\c\\n",
  "Come again very soon!\\n",
  "Come again immediately!\\c\\n",
  "And please show us even more wonderful\\n",
  "handling of Poké Transfer!\\c$",
]

[msg.section_0.entries.13]
text = [
  "Ohhhhhhhh.\\n",
  "Any moment! Any moment!\\c\\n",
  "Poké Transfer is only one step away\\n",
  "from going down in history as a\\l\\n",
  "fantastic invention!\\c$",
]

[msg.section_0.entries.14]
text = [
  "[VAR TRNAME(0)]!\\c\\n",
  "As I thought, my instinct was right...\\n",
  "You are a prodigy! A genius!\\c\\n",
  "There won't be anyone else who can\\n",
  "handle Poké Transfer in such a\\l\\n",
  "professional manner.\\c\\n",
  "Please use Poké Transfer anytime you\\n",
  "want in the future!\\c\\n",
  "We will be here any time to continue to do\\n",
  "further research!\\c\\n",
  "If you want to use Poké Transfer, please\\n",
  "let us know!\\c$",
]

[msg.section_0.entries.15]
text = [
  "I put the Pokémon you caught\\n",
  "in your PC Box.\\c$",
]

[msg.section_0.entries.16]
text = [
  "But, it seems you could not\\n",
  "catch any Pokémon.\\c$",
]

[msg.section_0.entries.17]
text = [
  "Ugh...\\n",
  "There seems to be a communication error.\\c\\n",
  "I'm afraid you have to try it again!\\c$",
]

[msg.section_0.entries.18]
text = [
  "Hi, hello!\\c\\n",
  "You came here.\\n",
  "That means you are a visitor?\\c\\n",
  "Huh? No?\\n",
  "You came all the way here?\\c\\n",
  "Ah, you are a Trainer?\\n",
  "Are you in the middle of your journey?\\c\\n",
  "Ah, this is your Trainer Card?\\c$",
]

[msg.section_0.entries.19]
text = [
  "W-w-what? You!\\n",
  "You have all the Gym Badges?!\\c$",
]

[msg.section_0.entries.20]
text = [
  "Great!\\n",
  "You may be able to...\\c$",
]

[msg.section_0.entries.21]
text = [
  "Professor Paaaaaark!\\c$",
]

[msg.section_0.entries.22]
text = [
  "Quick, quick!\\c$",
]

[msg.section_0.entries.23]
text = [
  "Oh, there you are!\\c$",
]

[msg.section_0.entries.24]
text = [
  "Professor!\\c\\n",
  "Do you have a minute?\\n",
  "I think you do. Listen!\\c\\n",
  "This kid is a Trainer who has all the\\n",
  "Gym Badges. All of them!\\c\\n",
  "I am sure this Trainer can operate it!\\c$",
]

[msg.section_0.entries.25]
text = [
  "I have told you many times.\\c\\n",
  "This invention is great indeed, but\\n",
  "without a professional Trainer...\\c$",
]

[msg.section_0.entries.26]
text = [
  "What? You have the Gym Badges?\\n",
  "ALL of them?!\\c$",
]

[msg.section_0.entries.27]
text = [
  "Fantastic!\\c\\n",
  "Fantastico!\\c$",
]

[msg.section_0.entries.28]
text = [
  "Yahoooooooooooooooo!\\c$",
]

[msg.section_0.entries.29]
text = [
  "What a great day! Great! Unbelievable!\\n",
  "Hi, I am Professor Andrew Park!\\c\\n",
  "You!\\n",
  "Er...\\c$",
]

[msg.section_0.entries.30]
text = [
  "[VAR TRNAME(0)]!\\c$",
]

[msg.section_0.entries.31]
text = [
  "[VAR TRNAME(0)]! Are you willing to\\n",
  "participate in an ambitious experiment\\l\\n",
  "that will make history?\\c\\n",
  "This device is called Poké Transfer.\\c\\n",
  "It connects...blah blah blah...\\n",
  "...called DS system...meanwhile...\\c\\n",
  "...blah blah...of molecules...and then...\\n",
  "...while evoking...blah blah...\\c\\n",
  "...ergo, energy particles will...\\n",
  "...blah blah...and if the frequency...\\c\\n",
  "...as you see...with faraway Pokémon...\\n",
  "...the Alpha waves...blah blah...\\c\\n",
  "...following which...reach convergence...\\n",
  "...blah blah...spectacular results!\\c$",
]

[msg.section_0.entries.32]
text = [
  "To put it more simply, if you use this\\n",
  "device, you may be able to bring Pokémon\\l\\n",
  "here from other regions.\\c\\n",
  "But just for safety's sake, the Pokémon\\n",
  "you're transferring shouldn't be holding\\l\\n",
  "anything! So make sure to take their\\l\\n",
  "items first.\\c$",
]

[msg.section_0.entries.33]
text = [
  "...So! You!\\c$",
]

[msg.section_0.entries.34]
text = [
  "You are a fantastic Pokémon Trainer!\\c\\n",
  "Will you participate in the great\\n",
  "experiment of the century?\\c\\n",
  "You need two DS systems to use\\n",
  "Poké Transfer!\\c\\n",
  "We will conduct the experiment with\\n",
  "another DS. Is that OK?$",
]

[msg.section_0.entries.35]
text = [
  "Your Pokémon can't be holding items when\\n",
  "you transfer them. It's safer that way.\\c\\n",
  "In rare cases, there are Pokémon that\\n",
  "cannot be transferred, but\\l\\n",
  "Professor Park will explain it to you.$",
]

[msg.section_0.entries.36]
text = [
  "With this research of mine, I also want to\\n",
  "have an impact on people in the future...\\l\\n",
  "people living 100 or 200 years from now!$",
]

[msg.section_0.entries.37]
text = [
  "Here, we are monitoring Poké Transfer.\\c\\n",
  "We're keeping a careful eye to make sure\\n",
  "all the Pokémon have safe travels!$",
]

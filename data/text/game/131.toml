[msg.section_0.entries.0]
text = [
  "Trading Sweet Hearts you receive\\n",
  "through Feeling Checks is one way\\l\\n",
  "to get Heart Scales.\\c\\n",
  "If you show off your Pokémon\\n",
  "to a lady in Driftveil City, you\\l\\n",
  "can get Heart Scales, too.$",
]

[msg.section_0.entries.1]
text = [
  "I'm very fussy about\\n",
  "Pokémon moves.\\c\\n",
  "I'm extra fussy about\\n",
  "Technical Machines! Yes, TMs!\\c\\n",
  "How many TMs have you collected\\n",
  "so far?$",
]

[msg.section_0.entries.2]
text = [
  "I'll give you something great\\n",
  "when you collect a lot of TMs!\\l\\n",
  "Let me see a lot of TMs!$",
]

[msg.section_0.entries.3]
text = [
  "Oh! You're a TM Master!\\c\\n",
  "Thank you for showing me\\n",
  "a lot of TMs.\\c\\n",
  "Use lots of different moves, and\\n",
  "bring out your Pokémon's power!$",
]

[msg.section_0.entries.4]
text = [
  "Hmm...\\c\\n",
  "You have [VAR NUM2(0)] TMs!$",
]

[msg.section_0.entries.5]
text = [
  "Oh!\\n",
  "I've never seen some of these before!\\c\\n",
  "Wow!\\n",
  "I didn't even know such TMs existed.\\c\\n",
  "I can tell you've selected each one\\n",
  "with so much care.\\c\\n",
  "Thank you! I was thrilled to see them!\\c\\n",
  "As a reward, please accept this\\n",
  "[VAR ITEM2(0)] as a gift!\\c$",
]

[msg.section_0.entries.6]
text = [
  "There must be a lot more TMs!\\c\\n",
  "If you collect even more of them,\\n",
  "I'll give you another fantastic gift!$",
]

[msg.section_0.entries.7]
text = [
  "Wow! Great job!\\n",
  "You've got great technical points!\\c\\n",
  "I didn't know there were so many TMs!\\c\\n",
  "Thanks to you, I realized\\n",
  "the true depth of TMs!\\c\\n",
  "You are a TM Master!\\n",
  "Thank you very much!$",
]

[msg.section_0.entries.8]
text = [
  "Some kind people will give you TMs.\\n",
  "So don't be shy! Talk to everyone!$",
]

[msg.section_0.entries.9]
text = [
  "Gym Leaders will give you a TM for sure\\n",
  "if you beat them!\\c\\n",
  "But you already know that, don't you?$",
]

[msg.section_0.entries.10]
text = [
  "Do you know the Battle Subway\\n",
  "in Nimbasa City?\\c\\n",
  "Defeat Trainers there and\\n",
  "collect a lot of BP,\\l\\n",
  "and you can get TMs!$",
]

[msg.section_0.entries.11]
text = [
  "I don't know who would be careless\\n",
  "enough to drop them, but you can\\l\\n",
  "sometimes find TMs in places where\\l\\n",
  "you'd least expect them.$",
]

[msg.section_0.entries.12]
text = [
  "You can also buy TMs\\n",
  "at Poké Marts!\\c\\n",
  "They're a bit expensive, though.$",
]

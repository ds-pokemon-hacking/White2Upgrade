[msg]
trailing_data = "cece"

[msg.section_0.entries.0]
text = [
  "Hee-hee!\\n",
  "I've been waiting for you.\\c\\n",
  "You're a tough Trainer who can face the\\n",
  "wind and not get blown off your feet!\\c\\n",
  "I'm kinda excited about this battle!\\n",
  "Why don't you and I have some fun?\\c$",
]

[msg.section_0.entries.1]
text = [
  "You're an amazing Pokémon Trainer.\\c\\n",
  "My Pokémon and I are happy\\n",
  "because for the first time in quite a\\l\\n",
  "while--about two years, I'd say--we\\l\\n",
  "could fight with our full strength.\\c\\n",
  "This is an official League Gym Badge.\\n",
  "But this is just a stepping-stone.\\c$",
]

[msg.section_0.entries.2]
text = [
  "[VAR TRNAME(0)] received the\\n",
  "Jet Badge from Skyla.\\c$",
]

[msg.section_0.entries.3]
text = [
  "Wow, hot stuff!\\c\\n",
  "With that many Gym Badges,\\n",
  "Pokémon up to Lv. 70 will obey you.\\c\\n",
  "Also, I want you to have this TM\\n",
  "so that you'll always remember\\l\\n",
  "this Pokémon battle.\\c$",
]

[msg.section_0.entries.4]
text = [
  "I wonder what Professor Juniper\\n",
  "is up to?\\c\\n",
  "I did promise her a ride in my plane...$",
]

[msg.section_0.entries.5]
text = [
  "Two things that are both really fun:\\n",
  "flying my own plane and having my\\l\\n",
  "Pokémon take me places using Fly!$",
]

[msg.section_0.entries.6]
text = [
  "Skyla: Are you and your Pokémon well?\\n",
  "Our battle together was a ton of fun.\\c\\n",
  "Whenever my Pokémon think of our battle,\\n",
  "they want to start training again.\\c\\n",
  "It might be a cool idea to take my plane\\n",
  "and go on a training trip together!$",
]

[msg.section_0.entries.7]
text = [
  "Ow...\\c\\n",
  "Oh, I'm sorry!\\c\\n",
  "Allow me to apologize by giving you this\\n",
  "Fresh Water! Take it, please.\\c$",
]

[msg.section_0.entries.8]
text = [
  "This Gym is a wind tunnel!\\c\\n",
  "When the propellers in back start\\n",
  "spinning quickly, you'll be blown\\l\\n",
  "away like a certain someone just was!\\c\\n",
  "When you think the wind will blow,\\n",
  "stay hidden behind a wall\\l\\n",
  "and wait for it to stop.\\c\\n",
  "By the way, Flying-type Pokémon have\\n",
  "more weaknesses than you might expect,\\l\\n",
  "including to Rock-, Electric-, and\\l\\n",
  "Ice-type moves!$",
]

[msg.section_0.entries.9]
text = [
  "This Gym is a wind tunnel!\\c\\n",

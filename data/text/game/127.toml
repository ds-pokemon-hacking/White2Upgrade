]

[msg.section_0.entries.10]
text = [
  "Letting yourself be blown away is almost\\n",
  "like being hit by a Pokémon move!\\l\\n",
  "It's kinda fun!\\c\\n",
  "Oh, yeah! Congrats on defeating\\n",
  "the Gym Leader!$",
]


[msg.section_0.entries.0]
text = [
  "Harrumph! Kept me waitin', didn't ya, kid?\\c\\n",
  "All right, time to see what\\n",
  "ya can do!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Phew...\\n",
  "You're really somethin'!\\c\\n",
  "Li'l whippersnapper Trainers\\n",
  "who pack a real punch keep\\l\\n",
  "showin' up one after another.\\c\\n",
  "Mrmph.\\n",
  "Here! Take this!\\c$",
]

[msg.section_0.entries.2]
text = [
  "[VAR TRNAME(0)] received the Quake Badge\\n",
  "from Clay!\\c$",
]

[msg.section_0.entries.3]
text = [
  "So this is yer fifth Badge, huh?\\c\\n",
  "If that's so, Pokémon up to Lv. 60\\n",
  "will obey ya.\\c\\n",
  "Here!\\n",
  "Take this, too!\\c$",
]

[msg.section_0.entries.4]
text = [
  "I don't know how much potential ya got,\\n",
  "but if ya think ya can go, go wherever,\\l\\n",
  "and if ya think ya can do somethin',\\l\\n",
  "keep doin' it.\\c\\n",
  "Do things how ya want!\\n",
  "Decide yer own limits.$",
]

[msg.section_0.entries.5]
text = [
  "Well, I suppose...\\n",
  "Come thisaway!\\c$",
]

[msg.section_0.entries.6]
text = [
  "Clay: Mrrmph! You, huh?\\n",
  "Remember what I done told ya?\\c\\n",
  "If ya think ya can go, go wherever,\\n",
  "and if ya think ya can do somethin',\\l\\n",
  "keep doin' it.\\c\\n",
  "Do things how ya want!\\n",
  "Decide yer own limits.$",
]

[msg.section_0.entries.7]
text = [
  "My Pokémon dig because they\\n",
  "believe they're gonna find something,\\l\\n",
  "and they battle because they believe\\l\\n",
  "they're gonna win!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Clay's awesome!\\n",
  "He can just tell if minerals will be there!\\c\\n",
  "Got it? Another way to say it is\\n",
  "that Clay will be wherever\\l\\n",
  "there are oodles of ores!$",
]

[msg.section_0.entries.9]
text = [
  "The one you meet when you get on this\\n",
  "conveyor is none other than me!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Have you used the elevator?\\c\\n",
  "If you get on the elevator,\\n",
  "you can figure out where you\\l\\n",
  "haven't been, right?$",
]

[msg.section_0.entries.11]
text = [
  "Just because you work hard doesn't\\n",
  "mean you're gonna get what you want!\\c\\n",
  "But if you don't work hard,\\n",
  "there are many things you can't do.\\c\\n",
  "Let me show you how tough\\n",
  "my hard work has made me!\\c$",
]

[msg.section_0.entries.12]
text = [
  "Driftveil City's Pokémon Gym is soaked in\\n",
  "the sweat and tears of the Pokémon that\\l\\n",
  "worked so hard to dig it out of the rock.\\l\\n",
  "So...well...it smells kinda funny!$",
]

[msg.section_0.entries.13]
text = [
  "Me and my Pokémon are\\n",
  "professional tunnelers!\\c\\n",
  "My Pokémon can't be outdug\\n",
  "or outburrowed! We have no rival!\\c$",
]

[msg.section_0.entries.14]
text = [
  "Drilbur and Excadrill know the move\\n",
  "Drill Run!\\c\\n",
  "When I order them to use that move,\\n",
  "I get all wound up!$",
]

[msg.section_0.entries.15]
text = [
  "I have a riddle for you!\\n",
  "Do you know what is distant but close?\\c$",
]

[msg.section_0.entries.16]
text = [
  "Something distant but close...\\c\\n",
  "I'm talking about Clay, who is near here\\n",
  "but is rather reserved.\\c\\n",
  "Sorry... I think you were expecting\\n",
  "something more interesting!$",
]

[msg.section_0.entries.17]
text = [
  "Here in the darkness...\\c\\n",
  "I proceeded step by step\\n",
  "while feeling my Pokémon's every breath!\\c\\n",
  "I'll show you the power of the bonds\\n",
  "my Pokémon and I built in this way!\\c$",
]

[msg.section_0.entries.18]
text = [
  "Isn't darkness great?\\c\\n",
  "It's the space of dreams where\\n",
  "you don't know what's even there!$",
]

[msg.section_0.entries.19]
text = [
  "When I say dig,\\n",
  "you say, “How low?\\\"\\c$",
]

[msg.section_0.entries.20]
text = [
  "Life is filled with pitfalls!\\n",
  "If you fall in, do your best to crawl out!$",
]

[msg.section_0.entries.21]
text = [
  "Welcome to the Driftveil Gym!\\n",
  "This is for you!\\c$",
]

[msg.section_0.entries.22]
text = [
  "Gym Leader Clay uses\\n",
  "Ground-type Pokémon!\\c\\n",
  "Well, just between you and me,\\n",
  "Ground-type Pokémon aren't good against\\l\\n",
  "Water-type attacks.\\c\\n",
  "They also don't like Grass-\\n",
  "or Ice-type attacks!\\c\\n",
  "Oh, and in this Gym, the area you\\n",
  "walk on will light up.\\c\\n",
  "Where you've been is a hint\\n",
  "for where you need to go!$",
]

[msg.section_0.entries.23]
text = [
  "Every now and again, I hope you look at\\n",
  "the Quake Badge you won here and\\l\\n",
  "remember your battle with Clay!$",
]

[msg.section_0.entries.24]
text = [
  "[VAR TRNAME(0)] pressed the\\n",
  "switch on the elevator!$",
]

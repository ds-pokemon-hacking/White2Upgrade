[msg.section_0.entries.0]
text = [
  "Hello!\\n",
  "Oh, you...\\c$",
]

[msg.section_0.entries.1]
text = [
  "You are with one Pokémon!\\n",
  "You love [VAR PKNAME(0)] very much, right?\\c\\n",
  "But are you OK?\\n",
  "You'll be in trouble when you encounter\\l\\n",
  "Pokémon that [VAR PKNAME(0)] is weak against.\\c\\n",
  "Here! I'll give you these,\\n",
  "so you can have more Pokémon.\\c$",
]

[msg.section_0.entries.2]
text = [
  "You are with [VAR NUM1(1)] Pokémon.\\c\\n",
  "But if you have more Pokémon,\\n",
  "your journey should be even more fun!\\c\\n",
  "Here! I'll give you these,\\n",
  "so why don't you catch more Pokémon?\\c$",
]

[msg.section_0.entries.3]
text = [
  "You know what they say.\\n",
  "Cheerful company shortens the miles!$",
]

[msg.section_0.entries.4]
text = [
  "Do you know about Audino, the Pokémon\\n",
  "who hide in rustling grass?\\c\\n",
  "I wonder why Audino give other Pokémon\\n",
  "so many Exp. Points.$",
]

[msg.section_0.entries.5]
text = [
  "When we walk, grass rustles!\\n",
  "It's Pokémon hide-and-seek!$",
]

  "I shouldn't have forced myself to battle\\n",
  "and should have looked for a Nurse.\\c\\n",
  "The White Treehollow is not known as\\n",
  "Unova's Challenge for nothing.$",
]

[msg.section_0.entries.1]
text = [
  "I heard you already cleared\\n",
  "Area 5!\\c\\n",
  "Argh! I have to keep up!\\n",
  "I'll catch up with you soon!$",
]

[msg.section_0.entries.2]
text = [
  "Hey, you! I heard you finished\\n",
  "all of the Areas.\\c\\n",
  "I can't believe it...\\n",
  "But anyway, congratulations!$",
]

[msg.section_0.entries.3]
text = [

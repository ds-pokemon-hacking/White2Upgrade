[msg.section_0.entries.46]
text = [
  "Hey, boss!\\c\\n",
  "I brought [VAR TRNAME(0)]!\\c$",
]

[msg.section_0.entries.47]
text = [
  "Well now, thanks for coming!\\c\\n",
  "First, let me reintroduce myself.\\n",
  "My name is Stu Deeoh!\\l\\n",
  "I'm the owner of Pokéstar Studios!\\c\\n",
  "So, [VAR TRNAME(0)], dahling,\\n",
  "I brought you here because I have\\l\\n",
  "a very important request of you!\\c\\n",
  "I'll bet you've figured it out,\\n",
  "but I want you to be in\\l\\n",
  "Pokéstar Studios' movies!\\c\\n",
  "The scout said you were absolutely,\\n",
  "positively oozing with star potential!\\c\\n",
  "And when I saw you,\\n",
  "your potential struck me\\l\\n",
  "like a lightning bolt!\\c$",
]

[msg.section_0.entries.48]
text = [
  "Yessir, boss!\\c\\n",
  "There's no doubt in my mind that\\n",
  "this Trainer will become a top star\\l\\n",
  "of Pokéstar Studios' silver screen!\\c$",
]

[msg.section_0.entries.49]
text = [
  "I know! Isn't it fabulous?!\\c\\n",
  "I am sure you'll be\\n",
  "a big star, dahling!\\c\\n",
  "So I beg of you! Be in a movie!\\c\\n",
  "Today I've even called on\\n",

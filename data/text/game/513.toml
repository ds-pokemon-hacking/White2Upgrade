  "costar for you!\\c$",
]

[msg.section_0.entries.50]
text = [
  "Brycen!\\n",
  "Would you join us?\\c$",
]

[msg.section_0.entries.51]
text = [
  "I'm Brycen...\\n",
  "Pleased to meet you...\\c$",
]

[msg.section_0.entries.52]
text = [
  "Brycen is Pokéstar Studios'\\n",
  "pride and joy--our marquee star!\\c\\n",
  "I've prepared a positively perfect\\n",
  "script for a big, veteran star like him\\l\\n",
  "and a fresh, new talent like you!\\c$",
]

[msg.section_0.entries.53]
text = [
  "Those eyes...\\n",
  "I look forward to acting with you...\\c$",
]

[msg.section_0.entries.54]
text = [
  "Mhm!\\n",
  "As cool as ever!\\c\\n",
  "So that's the situation!\\c\\n",
  "If you talk to that fine staff member\\n",
  "over there, you can shoot the film!\\c\\n",
  "Don't be afraid of making mistakes!\\n",
  "To start with, try going big!$",
]

[msg.section_0.entries.55]
text = [
  "Movies! They're amazement itself!\\c\\n",
  "Come now, [VAR TRNAME(0)], dahling,\\n",
  "be surprised and moved!\\l\\n",
  "Try the experience for yourself!$",
]

[msg.section_0.entries.56]
text = [
  "Well now, [VAR TRNAME(0)]!\\n",
  "Looking forward to working with you!\\c\\n",
  "Please do your best until we make\\n",

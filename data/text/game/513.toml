[msg.section_0.entries.0]
text = [
  "Welcome to the soundstage\\n",
  "of Pokéstar Studios!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Hey, [VAR TRNAME(0)]!\\n",
  "The movie you were just in\\l\\n",
  "was a smash hit, right?\\c\\n",
  "Thanks to that, the screenwriter\\n",
  "wrote a new script in the series.\\c\\n",
  "The sequel is called\\n",
  "“[COLOR(1)][VAR MOVIENAME(1)][COLOR(0)].\\\"\\c\\n",
  "We'd love for you to give it a try\\n",
  "and make another smash hit!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Would you like to\\n",
  "try to shoot a film?$",
]

[msg.section_0.entries.3]
text = [
  "You can make movies here\\n",
  "at Pokéstar Studios!\\c\\n",
  "You act with other actors\\n",
  "as determined by the script.\\c\\n",
  "If you meet all of the conditions\\n",
  "for completing the movie,\\l\\n",

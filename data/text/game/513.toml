  "Then, we use the most\\n",
  "cutting-edge VFX technology\\l\\n",
  "and finish the movie in an instant!\\c\\n",
  "Be careful, because the\\n",
  "necessary conditions for\\l\\n",
  "making a good movie are\\l\\n",
  "different from script to script!\\c\\n",
  "The final movie is released\\n",
  "in the Pokéstar Studios Theater,\\l\\n",
  "so be sure to check it out!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Whoa! The screens are full!\\c\\n",
  "If you want to release a new\\n",
  "movie, you're going to have\\l\\n",
  "to end another movie's run!\\l\\n",
  "Is that OK?$",
]

[msg.section_0.entries.5]

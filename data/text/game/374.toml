[msg]
trailing_data = "b4b4"

[msg.section_0.entries.0]
text = [
  "I have what you want!\\c\\n",
  "But if you want it...\\n",
  "You know, don't you? Battle me!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Phew!\\n",
  "You're good!\\c\\n",
  "I'll give you this, then!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Without the Plasma Card,\\n",
  "you can't enter the password.\\c\\n",
  "The rest is up to you.$",
]

[msg.section_0.entries.3]
text = [
  "I make bread every day.\\c\\n",
  "That's what I like, so I'm satisfied,\\n",
  "but I wonder if everybody is fine\\l\\n",
  "with only bread and water every day.$",
]

[msg.section_0.entries.4]
text = [
  "Eat a lot!\\c\\n",
  "You can't love anyone\\n",
  "on an empty stomach!$",
]

[msg.section_0.entries.5]
text = [
  "Colress told me that if I can bring out\\n",
  "the power of Pokémon by taking good care\\l\\n",
  "of them, I can stay here!$",
]

[msg.section_0.entries.6]
text = [
  "As long as I did what Team Plasma\\n",
  "ordered, I was able to eat bread...\\c\\n",
  "I didn't think for myself, and\\n",
  "that's why I became like this.\\c\\n",
  "Ah!\\n",
  "But the bread here is yummy!$",
]

[msg.section_0.entries.7]
text = [
  "The legendary Fire-type\\n",
  "Pokémon Reshiram!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Reshiram has been registered\\n",
  "in the Pokédex.$",
]

[msg.section_0.entries.9]
text = [
  "And this is the legendary Electric-type\\n",
  "Pokémon Zekrom.\\c$",
]

[msg.section_0.entries.10]
text = [
  "Zekrom has been registered\\n",
  "in the Pokédex.$",
]

[msg.section_0.entries.11]
text = [
  "I yearned for them since I was a child.\\n",
  "When I saw them two years ago,\\l\\n",
  "I was so moved that I cried!$",
]

[msg.section_0.entries.12]
text = [
  "Warning! Warning!\\n",
  "Intruders in the vessel!\\l\\n",
  "Everyone, please respond.$",
]

[msg.section_0.entries.13]
text = [
  "It's you the announcement\\n",
  "was warning about?\\c\\n",
  "Fine.\\n",
  "I'm very strong.\\c\\n",
  "I'll look the other way\\n",
  "for a child like you...$",
]

[msg.section_0.entries.14]
text = [
  "I failed in my duty,\\n",
  "and my Pokémon were taken away.\\c\\n",
  "I lost a lot of Pokémon\\n",
  "I had stolen, too...$",
]

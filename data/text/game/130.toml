[msg]
trailing_data = "8484"

[msg.section_0.entries.0]
text = [
  "Professor Juniper is researching\\n",
  "Pokémon at Celestial Tower,\\l\\n",
  "which is at the end of Route 7.\\c\\n",
  "Pay attention to the signs\\n",
  "so you don't get lost on the way.$",
]

[msg.section_0.entries.1]
text = [
  "Looks like the Professor's reached a\\n",
  "stopping point in her investigation.\\c\\n",
  "Ready to hop aboard my plane?$",
]

[msg.section_0.entries.2]
text = [
  "Hee-hee!\\n",
  "Ready for takeoff!$",
]

[msg.section_0.entries.3]
text = [
  "Roger!\\n",
  "Come talk to me when you're ready.$",
]

[msg.section_0.entries.4]
text = [
  "Are you ready to get aboard the plane?\\n",
  "The sky is calling!$",
]

[msg.section_0.entries.5]
text = [
  "Professor Juniper: Hi there!\\n",
  "Looks like I kept you waiting! Sorry...\\c\\n",
  "Shall we give Skyla her chance to\\n",
  "show us her piloting skills?$",
]

[msg.section_0.entries.6]
text = [
  "OK, Skyla, we're ready.\\n",
  "Please take us to Lentimas Town!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Bianca: Waaaaaaaaaaait!\\c\\n",
  "You guys! Wait, wait, wait, wait!\\n",
  "Hff...pff...I want to fly, too!\\c\\n",
  "I want to do some research\\n",
  "in Reversal Mountain...hff...pff...\\c$",
]

[msg.section_0.entries.8]
text = [
  "Professor Juniper: Bianca, you're here?\\c\\n",
  "You're starting to show the dedication\\n",
  "of a serious researcher these days!\\c\\n",
  "OK, everyone, off we go to Lentimas Town!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Skyla: Hee-hee!\\n",
  "Looks like everyone's here!\\c\\n",
  "Finally, it's time to fly\\n",
  "the Unova skies!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Hello!\\n",
  "This is Mistralton Cargo Service.\\c\\n",
  "“Deliver a lot of cargo quickly!\\\"\\c\\n",
  "We can also carry passengers now,\\n",
  "but that's up to the Gym Leader.$",
]

[msg.section_0.entries.11]
text = [
  "Hello!\\n",
  "This is Mistralton Cargo Service.\\c\\n",
  "“Deliver a lot of cargo quickly!\\\"\\n",
  "Would you like to board the flight\\l\\n",
  "to Lentimas Town?$",
]

[msg.section_0.entries.12]
text = [
  "OK. We will contact Skyla,\\n",
  "so please board the plane and wait.\\c$",
]

[msg.section_0.entries.13]
text = [
  "OK!\\n",
  "Feel free to fly with us anytime!$",
]

[msg.section_0.entries.14]
text = [
  "This is Mistralton Cargo Service.\\n",
  "“Deliver a lot of cargo quickly!\\\"\\c$",
]

[msg.section_0.entries.15]
text = [
  "Oh!\\n",
  "That's a Permit!\\c\\n",
  "That lets you enter the\\n",
  "Nature Preserve, which is far,\\l\\n",
  "far away from the Unova region!\\c\\n",
  "Would you like to go to the\\n",
  "Nature Preserve, then?$",
]

[msg.section_0.entries.16]
text = [
  "“Deliver a lot of cargo quickly!\\\"\\n",
  "This is Mistralton Cargo Service.\\c\\n",
  "Where would you like to fly?$",
]

[msg.section_0.entries.17]
text = [
  "Lentimas Town$",
]

[msg.section_0.entries.18]
text = [
  "Nature Preserve$",
]

[msg.section_0.entries.19]
text = [
  "Quit$",
]

[msg.section_0.entries.20]
text = [
  "When you use the move Fly,\\n",
  "you can return to a Pokémon Center\\l\\n",
  "you've already visited.$",
]

[msg.section_0.entries.21]
text = [
  "If you don't know a lot about the\\n",
  "structure of planes, how can you\\l\\n",
  "maintain them?\\c\\n",
  "Pokémon battling is the same.\\c\\n",
  "The more you know about Pokémon,\\n",
  "the more you can win!$",
]

[msg.section_0.entries.22]
text = [
  "Hey!\\n",
  "Do you have any Flying- or\\l\\n",
  "Psychic-type Pokémon with you?\\c$",
]

[msg.section_0.entries.23]
text = [
  "Oh!\\n",
  "[VAR PKNAME(0)] is with you!\\c\\n",
  "Would you help me get some luggage\\n",
  "that's too high for me to reach?\\c$",
]

[msg.section_0.entries.24]
text = [
  "Here's a little something to\\n",
  "thank you for helping me!\\c$",
]

[msg.section_0.entries.25]
text = [
  "Having Pokémon with you\\n",
  "can be a big help sometimes, eh?$",
]

[msg.section_0.entries.26]
text = [
  "That's too bad.\\c\\n",
  "I need a Flying- or Psychic-type\\n",
  "Pokémon to help me out.$",
]

[msg.section_0.entries.27]
text = [
  "Chulululuwa!$",
]

[msg.section_0.entries.28]
text = [
  "Hrmph! You there!\\n",
  "Do you have the Ace Pilot Medal?\\c\\n",
  "We Pilots figure that's the coolest\\n",
  "Medal of them all, so I thought a\\l\\n",
  "cool customer like you might have it!$",
]

[msg.section_0.entries.29]
text = [
  "If you get the Ace Pilot Medal,\\n",
  "please come show it to me!$",
]

[msg.section_0.entries.30]
text = [
  "Ooh! Is that it? Shiny!\\c\\n",
  "Th-the Ace Pilot Medal...\\c\\n",
  "Brimming with adventure,\\n",
  "shimmering like the sky--\\l\\n",
  "the Ace Pilot Medal!\\c\\n",
  "So cool.\\n",
  "Thank you for letting me see it!$",
]

[msg.section_0.entries.31]
text = [
  "“Ace Pilot\\\"...\\n",
  "There's a splendid sound to that.\\c\\n",
  "Here's to you and your Pokémon\\n",
  "for flying freely through the skies!\\c\\n",
  "For my part, I'll keep working on\\n",
  "my skills as an airplane pilot!$",
]

[msg.section_0.entries.32]
text = [
  "Welcome to the city of the skies,\\n",
  "Mistralton City!\\l\\n",
  "Here's a souvenir for you.\\c$",
]

[msg.section_0.entries.33]
text = [
  "When Pokémon hold the Sharp Beak,\\n",
  "it increases the power\\l\\n",
  "of Flying-type moves!$",
]

[msg.section_0.entries.34]
text = [
  "Sweets, lovely Sweet Hearts! ♪\\n",
  "Check feelings between two people.\\c\\n",
  "If you are a great match, you can\\n",
  "get sweet on Sweet Hearts! ♪\\l\\n",
  "Meltingly sweet Sweet Hearts! ♪\\c$",
]

[msg.section_0.entries.35]
text = [
  "Oh, uh, you?\\n",
  "You have Sweet Hearts!\\c\\n",
  "Will you trade 10 Sweet Hearts\\n",
  "for my Heart Scale?$",
]

[msg.section_0.entries.36]
text = [
  "I'm in a special mood today!\\c\\n",
  "Would you trade me five Sweet Hearts\\n",
  "for a Heart Scale?$",
]

[msg.section_0.entries.37]
text = [
  "If you bring a lot of Sweet Hearts,\\n",
  "I will trade you for something happy!$",
]

[msg.section_0.entries.38]
text = [
  "Yaaaay!\\n",
  "I have a lot of your heart!\\c$",
]

[msg.section_0.entries.39]
text = [
  "Oh... What a pity.\\n",
  "What a great pity!\\c\\n",
  "You must have a lot of\\n",
  "Heart Scales already.$",
]

[msg.section_0.entries.40]
text = [
  "OK...\\n",
  "Aww...that's too bad.$",
]

[msg.section_0.entries.41]
text = [
  "Gave the Sweet Hearts and received\\n",
  "a Heart Scale in return.\\c$",
]

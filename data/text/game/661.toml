[msg.section_0.entries.0]
text = [
  "I will judge your battles in a\\n",
  "Battle Test!\\c\\n",
  "What would you like to do?$",
]

[msg.section_0.entries.1]
text = [
  "The master returns! Would you like to\\n",
  "challenge a Battle Test?$",
]

[msg.section_0.entries.2]
text = [
  "I am sorry...\\c\\n",
  "It may be too early for you to challenge\\n",
  "a Battle Test.\\c\\n",
  "Please come back after you finish\\n",
  "your journey and build your strength.$",
]

[msg.section_0.entries.3]
text = [
  "See you again.$",
]

[msg.section_0.entries.4]
text = [
  "Which challenge would you like,\\n",
  "Single or Double?$",
]

[msg.section_0.entries.5]
text = [
  "Then, let's begin.\\c\\n",
  "Please bear in mind that once you start\\n",
  "the challenge, you will face five battles\\l\\n",
  "without a break.\\c\\n",
  "Now, please choose the Pokémon you would\\n",
  "like to battle with.\\c$",
]

[msg.section_0.entries.6]
text = [
  "Saving...\\n",
  "Don't turn off the power.$",
]

[msg.section_0.entries.7]
text = [
  "Now, the Battle Test begins!\\n",
  "Please go inside!\\c$",
]

[msg.section_0.entries.8]
text = [
  "All right.\\c\\n",
  "I will tell you the result of your\\n",
  "Battle Test.\\c\\n",
  "The test result is...\\c$",
]

[msg.section_0.entries.9]

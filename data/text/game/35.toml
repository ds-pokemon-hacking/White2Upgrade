[msg.section_0.entries.5]
text = [
  "Clyde: Hello! You're probably\\n",
  "tired from wandering all over\\l\\n",
  "the crowded streets of Castelia City\\l\\n",
  "looking for Team Plasma and\\l\\n",
  "the Gym Leader.\\c\\n",
  "So, here,\\n",
  "I'll give you this!\\c$",
]

[msg.section_0.entries.6]
text = [
  "The theme of this Gym\\n",
  "is none other than cocoons!\\c\\n",
  "You head upward by going inside\\n",
  "the cocoons and traveling\\l\\n",
  "up the threads!\\c\\n",
  "The threads are definitely\\n",
  "connected to Burgh...eventually!$",
]

[msg.section_0.entries.7]
text = [
  "Wow! That's amazing!\\c\\n",
  "You swatted aside our Gym Leader\\n",
  "Burgh's tricky attacks...\\c\\n",
  "I can barely imagine how much\\n",
  "stronger you're going to get!$",
]


[msg]
trailing_data = "8888"

[msg.section_0.entries.0]
text = [
  "Hey, Trainer!\\c\\n",
  "These boulders suddenly\\n",
  "lined up like this...\\c\\n",
  "What's more, the HM Strength\\n",
  "won't budge them.$",
]

[msg.section_0.entries.1]
text = [
  "I never would have guessed\\n",
  "they were Crustle...\\c\\n",
  "If you're interested in Crustle,\\n",
  "you'll find them in the Desert Resort,\\l\\n",
  "which is just past here!$",
]

[msg.section_0.entries.2]
text = [
  "It's a big boulder, but it doesn't\\n",
  "look like a Pokémon can move it...$",
]

[msg.section_0.entries.3]
text = [
  "Colress: I've been waiting for you!\\c\\n",
  "What's the matter?\\n",
  "Interested in what's behind me?\\c$",
]

[msg.section_0.entries.4]
text = [
  "These are not mere rocks, but\\n",
  "the Pokémon known as Crustle.\\c\\n",
  "Observe.\\c\\n",
  "With this device I created\\n",
  "to energize Pokémon, I'll...\\c$",
]

[msg.section_0.entries.5]
text = [
  "      $$",
]

[msg.section_0.entries.6]
text = [
  "Colress: Those Crustle...\\c\\n",
  "Were they just lying here,\\n",
  "out of energy, with their\\l\\n",
  "boulders on their backs?\\c$",
]

[msg.section_0.entries.7]
text = [
  "Team Plasma said we should recognize\\n",
  "the potential in Pokémon and\\l\\n",
  "liberate them from humans.\\c\\n",
  "I disagree.\\c\\n",
  "Conversely, it should be humans who bring\\n",
  "out the hidden potential in Pokémon!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Now that I think of it,\\n",
  "I never asked your name.\\c\\n",
  "...\\n",
  "...\\c\\n",
  "[VAR TRNAME(0)]...\\n",
  "I'll remember that name.\\c\\n",
  "Well then, I will test you to see if\\n",
  "you're a Trainer who can bring out\\l\\n",
  "the hidden potential of Pokémon!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Colress: I see! Just like the\\n",
  "Gym Leaders in each area or the\\l\\n",
  "Elite Four and Champion in the\\l\\n",
  "Pokémon League, you bring out the\\l\\n",
  "power in Pokémon by being kind to them!\\c\\n",
  "That's the kind of person you are.\\c\\n",
  "I'm extremely grateful for your help.\\n",
  "This is a token of my gratitude.\\c$",
]

[msg.section_0.entries.10]
text = [
  "Colress: It's so frustrating!\\c\\n",
  "If only we could talk to Pokémon\\n",
  "in order to bring out their power!\\c\\n",
  "But there's no way a person\\n",
  "like that could ever exist!\\c\\n",
  "Well then, [VAR TRNAME(0)],\\n",
  "I hope to see you again sometime.\\c$",
]

[msg.section_0.entries.11]
text = [
  "Ra ra ra ra!$",
]

[msg.section_0.entries.12]
text = [
  "Braviary flew off into the sky...$",
]

[msg.section_0.entries.13]
text = [
  "All I do is look at the cars\\n",
  "driving down the freeway.$",
]

[msg.section_0.entries.14]
text = [
  "When the ruins were discovered,\\n",
  "new construction was stopped...\\c\\n",
  "Guess you can't compete\\n",
  "against the weight of history.$",
]

[msg.section_0.entries.15]
text = [
  "Oh! Trainer, take a look at the sand.\\c\\n",
  "Do you see how some areas are lighter?\\n",
  "And some of the sand looks...darker...\\c\\n",
  "Pokémon are hiding in the darker sand!$",
]

[msg.section_0.entries.16]
text = [
  "Route 4$",
]

[msg.section_0.entries.17]
text = [
  "Trainer Tips!\\c\\n",
  "\\n",
  "Pokémon have a source of energy\\n",
  "for using moves.\\c\\n",
  "It's called PP, meaning Power Points.\\n",
  "They have PP for each move.\\c\\n",
  "When a move has no PP remaining,\\n",
  "that Pokémon cannot use that move.\\c\\n",
  "That's a good time to head for\\n",
  "the Pokémon Center!$",
]

[msg.section_0.entries.18]
text = [
  "Desert Resort Ahead\\n",
  "Right: Nimbasa City$",
]

[msg.section_0.entries.19]
text = [
  "                         $$",
]

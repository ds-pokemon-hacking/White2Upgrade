[msg.section_0.entries.0]
text = [
  "Welcome home, dear.\\c\\n",
  "Did you find the friend you\\n",
  "were looking for?\\c\\n",
  "Wasn't his name something like N?\\c$",
]

[msg.section_0.entries.1]
text = [
  "Huh...?\\c\\n",
  "Excuse me!\\c\\n",
  "How embarrassing!\\n",
  "Mistaking a visitor for my own child!\\c$",
]

[msg.section_0.entries.2]
text = [
  "You're [VAR TRNAME(0)]?$",
]

[msg.section_0.entries.3]
text = [
  "You're [VAR TRNAME(0)]?$",
]

[msg.section_0.entries.4]
text = [
  "I knew it!\\n",
  "You look just like her!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Come now! Don't say that!\\n",
  "My eyes are actually quite sharp!\\c$",
]

[msg.section_0.entries.6]
text = [
  "I know your mom!\\c\\n",
  "I met her when she was working\\n",
  "at the Pokémon Center\\l\\n",
  "and I was a Trainer.\\c\\n",
  "That's right! How are your Pokémon?\\c\\n",
  "You're always welcome to let\\n",
  "them rest here!$",
]

[msg.section_0.entries.7]
text = [
  "My, now how are your Pokémon?\\n",
  "Let them rest here for a moment!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Great! You and your Pokémon\\n",
  "look raring to go!$",
]

[msg.section_0.entries.9]
text = [
  "Pokémon work so hard to help you out!\\c\\n",
  "Be sure to be kind to them, OK!$",
]

[msg.section_0.entries.10]
text = [
  "No news is good news they say.\\c\\n",
  "Being happy about something\\n",
  "like that is a little difficult though.\\c\\n",
  "Being a parent is tough.$",
]

[msg.section_0.entries.11]
text = [
  "Maybe I should go on a journey\\n",
  "to go find my child!\\c\\n",
  "Oh, but I would feel really bad\\n",
  "if they stopped by while I was gone.$",
]

[msg.section_0.entries.12]
text = [
  "I sure wish you two could meet!$",
]


[msg.section_0.entries.0]
text = [
  "Where did I put those sunglasses?\\c$",
]

[msg.section_0.entries.1]
text = [
  "Ah, I found them.\\c\\n",
  "And you've really got to have more\\n",
  "light to see your way by.\\c\\n",
  "Take this--it'll help you see in\\n",
  "dark places.\\c$",
]

[msg.section_0.entries.2]
text = [
  "Meow!\\n",
  "How did you find me?!\\c\\n",
  "You are something else!\\n",
  "So, I'm going to give you something. This!\\c$",
]

[msg.section_0.entries.3]
text = [
  "If you use the move Flash, the accuracy\\n",
  "of the opponent's moves goes down.\\c\\n",
  "When you use it twice, the rate to get\\n",
  "hit by a move will be about half.\\c\\n",
  "'Cause it means more light!\\c$",
]


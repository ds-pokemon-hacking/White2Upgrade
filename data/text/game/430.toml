[msg.section_0.entries.0]
text = [
  "The Lunar Wing started shining!\\n",
  "Do you want to hold it up high?$",
]

[msg.section_0.entries.1]
text = [
  "Lunaaan...$",
]

[msg.section_0.entries.2]
text = [
  "Cresselia disappeared somewhere...$",
]

[msg.section_0.entries.3]
text = [
  "[SPEED(2)]Oh... Oh...\\n",
  "So...thirsty...\\c\\n",
  "I met you on Village Bridge...\\c\\n",
  "G-g-give me...\\n",
  "Fresh Water...?[SPEED(0)]$",
]

[msg.section_0.entries.4]
text = [
  "Refreshed!!\\c\\n",
  "I'm 100% rehydrated!\\n",
  "I feel better now! Thank you!\\c\\n",
  "I'll dash to the next bridge...\\n",
  "No, I'll leave for the Marine Tube!$",
]

[msg.section_0.entries.5]
text = [
  "[SPEED(2)]But... You don't have Fresh Water...\\n",
  "I appreciate the thought, though...[SPEED(0)]$",
]

[msg.section_0.entries.6]
text = [
  "[SPEED(2)]Thank...\\c\\n",
  "What?\\n",
  "Oh...\\c\\n",
  "Without Fresh Water...\\n",
  "I can't run on bridges anymore.[SPEED(0)]$",
]

[msg.section_0.entries.7]
text = [
  "Man: Son!\\n",
  "I have a deal for YOU! And for you alone.\\c\\n",
  "Here's your chance. I will sell you the\\n",
  "secret Pokémon Magikarp...\\l\\n",
  "For an unbelievable \\$500!\\c\\n",
  "How about it? Interested?$",
]

[msg.section_0.entries.8]
text = [
  "Man: Miss!\\n",
  "I have a deal for YOU! And for you alone.\\c\\n",
  "Here's your chance. I will sell you the\\n",
  "secret Pokémon Magikarp...\\l\\n",
  "For an unbelievable \\$500!\\c\\n",
  "How about it? Interested?$",
]

[msg.section_0.entries.9]
text = [
  "[VAR TRNAME(0)] bought the Magikarp\\n",
  "for \\$500.$",
]

[msg.section_0.entries.10]
text = [
  "Would you like to give a\\n",
  "nickname to this Magikarp?$",
]

[msg.section_0.entries.11]
text = [
  "Looks like you don't have enough money.$",
]

[msg.section_0.entries.12]
text = [
  "You have no room in your party!$",
]

[msg.section_0.entries.13]
text = [
  "Oh, that's too bad...$",
]

[msg.section_0.entries.14]
text = [
  "Man: Oh, yeah...\\n",
  "Returns not accepted, got that?$",
]

[msg.section_0.entries.15]
text = [
  "Ahh...\\n",
  "Such magnificent scenery...$",
]

[msg.section_0.entries.16]
text = [
  "Huh... Wha...\\n",
  "D-did she just disappear?$",
]

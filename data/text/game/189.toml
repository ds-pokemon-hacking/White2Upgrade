[msg.section_0.entries.0]
text = [
  "[VAR TRNAME(1)]: We'll get the DNA Splicers\\n",
  "back for sure!\\c\\n",
  "So you should focus on\\n",
  "defeating the Gym Leader first!$",
]

[msg.section_0.entries.1]
text = [
  "                                                               $$",
]

[msg.section_0.entries.2]
text = [
  "After you get the Badge,\\n",
  "we'll look for Team Plasma!\\c\\n",
  "I'm not gonna let the Unova region\\n",
  "become an ice sculpture!$",
]

[msg.section_0.entries.3]
text = [
  "                               $$",
]

[msg.section_0.entries.4]
text = [
  "Uihaa!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Sup, you must be here to\\n",
  "challenge the Pokémon Gym!\\c\\n",
  "I'm the Gym Leader, Marlon.\\n",
  "Sorry to make you look for me, yo.\\c\\n",
  "I was swimmin' with the Pokémon,\\n",
  "and it felt real good,\\l\\n",
  "so I kept goin' and goin'.\\c\\n",
  "I'll be waitin' in the Gym, 'K?\\c$",
]

[msg.section_0.entries.6]
text = [
  "[VAR TRNAME(1)]: You got all of the Badges!\\n",
  "You're really something!\\c\\n",
  "Usually, you'd go to\\n",
  "the Pokémon League now, but...\\l\\n",
  "dealing with Team Plasma comes first!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Marlon: Sup yo!\\c\\n",
  "What's this Team Plasma\\n",
  "you're talking about do?\\c$",
]

[msg.section_0.entries.8]
text = [
  "[VAR TRNAME(1)]: Team Plasma does things\\n",
  "like steal my sister's...\\l\\n",
  "I mean people's Pokémon.\\c\\n",
  "They plan on conquering Unova\\n",
  "by using Pokémon to freeze it solid!\\l\\n",
  "They're really evil!\\c\\n",
  "Haven't you heard of them, Marlon?\\c$",
]

[msg.section_0.entries.9]
text = [
  "Marlon: Nope!\\c\\n",
  "When the ocean's your home,\\n",
  "you don't worry about things like that.\\c\\n",
  "'Cause the ocean accepts all rivers!\\c$",
]

[msg.section_0.entries.10]
text = [
  "So you think Team Plasma's bad, then?$",
]

[msg.section_0.entries.11]
text = [
  "Marlon: I get it.\\n",
  "They're bad, so you fight 'em.\\c\\n",
  "But, first, you got to say\\n",
  "that in your own words.\\c\\n",
  "When you do, you'll understand\\n",
  "better what you want to do\\l\\n",
  "and what you're hopin' for!\\c$",
]

[msg.section_0.entries.12]
text = [
  "Marlon: Shoots! Not bad...\\n",
  "You think that but still fight!\\c\\n",
  "But, first, you got to say\\n",
  "that in your own words.\\c\\n",
  "When you do, you'll understand\\n",
  "better what you want to do\\l\\n",
  "and what you're hopin' for!\\c$",
]

[msg.section_0.entries.13]
text = [
  "Well then...\\c$",
]

[msg.section_0.entries.14]
text = [
  "[VAR TRNAME(1)]: Man, I don't know if that\\n",
  "guy is laid back or just irresponsible.\\c\\n",
  "That kinda got me down,\\n",
  "but our opponent is Team Plasma!\\c\\n",
  "We have to focus! But, before that,\\n",
  "we have to find where they are!\\c\\n",
  "OK! We'll split up!\\n",
  "You check Route 22! Got it?\\c$",
]

[msg.section_0.entries.15]
text = [
  "Oh, are you taking on the Gym Leader?\\c\\n",
  "But can you find ol' Marlon?\\n",
  "He does whatever he wants!$",
]

[msg.section_0.entries.16]
text = [
  "When I float between the waves\\n",
  "like this, I'm like a mermaid.\\c\\n",
  "Now that I think of it,\\n",
  "there was a tomboyish-mermaid\\l\\n",
  "Gym Leader in Kanto.$",
]

[msg.section_0.entries.17]
text = [
  "Do you know about Seaside Cave?\\c\\n",
  "If you use the HM Surf\\n",
  "to go down Route 21,\\l\\n",
  "you'll find the cave there.\\c\\n",
  "If you go through it,\\n",
  "you'll reach Undella Town.$",
]

[msg.section_0.entries.18]
text = [
  "This dress is comfy and easy\\n",
  "to wear...$",
]

[msg.section_0.entries.19]

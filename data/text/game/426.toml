[msg.section_0.entries.0]
text = [
  "A woman was living here with\\n",
  "a group of Patrat.\\c\\n",
  "I wonder where they went.$",
]

[msg.section_0.entries.1]
text = [
  "Seeing Watchy Watchog on TV\\n",
  "reminds me of those Patrat.$",
]

[msg.section_0.entries.2]
text = [
  "Why don't we move into this house?\\c\\n",
  "Those musicians are always nearby.\\n",
  "Isn't that nice?$",
]

[msg.section_0.entries.3]
text = [
  "I learned all the names\\n",
  "of the musicians!\\c\\n",
  "Derleth, Aickman,\\n",
  "Russo, and Koontz.$",
]

[msg.section_0.entries.4]
text = [
  "What do you think? We've been indecisive\\n",
  "for two years. Let's live here, shall we?$",
]

[msg.section_0.entries.5]
text = [
  "Maybe we should move in.\\c\\n",
  "We don't even know when the villa\\n",
  "in Undella Town will be finished...$",
]

[msg]
trailing_data = "7676"

[msg.section_0.entries.0]
text = [
  "Hello!\\n",
  "I am the Game Director.\\c\\n",
  "Ah! You are working on your Pokédex!\\n",
  "If you fill it up a lot, please let me see!$",
]

[msg.section_0.entries.1]
text = [
  "Hello!\\n",
  "I am the Game Director.\\c\\n",
  "Oh! You've caught every kind of\\n",
  "Pokémon in Unova!\\c\\n",
  "It's truly amazing!\\n",
  "Now, we'll give you an award!!\\c$",
]

[msg.section_0.entries.2]
text = [
  "I will send this award certificate\\n",
  "to your house!$",
]

[msg.section_0.entries.3]
text = [
  "Hello!\\n",
  "I am the Game Director.\\c\\n",
  "Oh?\\c\\n",
  "By any chance, did you...\\n",
  "obtain all the Pokémon and\\l\\n",
  "complete your Pokédex?\\c\\n",
  "Great.\\c\\n",
  "I am very happy\\n",
  "that you made great efforts\\l\\n",
  "to obtain so many Pokémon.\\c\\n",
  "Please, please, please\\n",
  "allow me to present you with this award!\\c$",
]

[msg.section_0.entries.4]
text = [
  "The Pokédex.\\n",
  "How did you obtain so many Pokémon?\\c\\n",
  "Obviously, you caught some by yourself,\\n",
  "but you can't complete the Pokédex\\l\\n",
  "by just catching them, right?\\c\\n",
  "You probably traded Pokémon\\n",
  "with your friends and people\\l\\n",
  "all over the world to complete it...\\c\\n",
  "If that's the case, the Pokédex is\\n",
  "not only a wealth of Pokémon information\\l\\n",
  "but also a compilation of\\l\\n",
  "your communication with others.$",
]

[msg.section_0.entries.5]
text = [
  "I will send this award certificate\\n",
  "to your house, too!$",
]

[msg.section_0.entries.6]
text = [
  "A game is something\\n",
  "to think about, program,\\l\\n",
  "and, at the end, hope for!\\c\\n",
  "Work! Work!\\n",
  "Work! Please work!$",
]

[msg.section_0.entries.7]
text = [
  "I am the Graphic Designer.\\c\\n",
  "To draw something I've never seen,\\n",
  "I need to observe a lot of objects.\\c\\n",
  "Not only do I have to look at them,\\n",
  "but also I need to analyze them\\l\\n",
  "and truly absorb them.$",
]

[msg.section_0.entries.8]
text = [
  "A tip for getting strong\\n",
  "in Pokémon battles...\\c\\n",
  "Let me see.\\n",
  "I guess the most important thing is...\\l\\n",
  "having a lot of battles!\\c\\n",
  "Do you want to battle?$",
]

[msg.section_0.entries.9]
text = [
  "Well, let's begin!\\c$",
]

[msg.section_0.entries.10]
text = [
  "OK. I hope we can battle next time.$",
]

[msg.section_0.entries.11]
text = [
  "Oh! You've become strong! I can tell.\\n",
  "Do you want to have a battle with me?$",
]

[msg.section_0.entries.12]
text = [
  "Well, let's begin!\\c$",
]

[msg.section_0.entries.13]
text = [
  "You think about battles very thoroughly.\\c\\n",
  "I lost, but I learned a lot from you.\\n",
  "Besides, it was fun!\\c\\n",
  "Come back again tomorrow.$",
]

[msg.section_0.entries.14]
text = [
  "No?\\c\\n",
  "I've been raising Pokémon, thinking about\\n",
  "their Abilities and just the right\\l\\n",
  "combination of held items.\\c\\n",
  "What a pity...$",
]

[msg.section_0.entries.15]
text = [
  "I'm Snorlax.\\c\\n",
  "No, no. I'm the Planner!\\c\\n",
  "I don't mean to butt in, but the\\n",
  "item Leftovers is important, isn't it?\\c\\n",
  "It's pretty useful in battle.\\n",
  "Do you want to battle and test it?$",
]

[msg.section_0.entries.16]
text = [
  "I like to win using my favorite Pokémon!\\c$",
]

[msg.section_0.entries.17]
text = [
  "Awww! What great Pokémon!\\c\\n",
  "The great number of steps seems to have\\n",
  "increased their trust in you...\\c\\n",
  "I hope we can battle again tomorrow.$",
]

[msg.section_0.entries.18]
text = [
  "No?! Really?\\n",
  "My Pokémon are pretty, though...$",
]

[msg.section_0.entries.19]
text = [
  "I'm the Sound Designer. I just woke up.\\n",
  "I wonder what kind of music people like.$",
]

[msg.section_0.entries.20]
text = [
  "Hello!\\n",
  "This is GAME FREAK.$",
]

[msg.section_0.entries.21]
text = [
  "Now, er, I'm, er...\\c\\n",
  "I'm thinking, er, a new plan of, er...\\c\\n",
  "...Of a game.$",
]

[msg.section_0.entries.22]
text = [
  "This place is cold because we have to\\n",
  "keep the server cool.$",
]

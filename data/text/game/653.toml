[msg.section_0.entries.0]
text = [
  "Girl: Oh! Are we going to help\\n",
  "train that person, sir?\\c$",
]

[msg.section_0.entries.1]
text = [
  "Boy: Really? But that Trainer\\n",
  "looks really tough!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Alder: That's right! This Trainer may\\n",
  "be tough, but you can learn from\\l\\n",
  "losing as well.\\c\\n",
  "More importantly, haven't I been telling\\n",
  "you just to enjoy Pokémon battles?\\c$",
]

[msg.section_0.entries.3]
text = [
  "So, [VAR TRNAME(0)]!\\n",
  "Please be their opponent!\\c$",
]

[msg.section_0.entries.4]
text = [
  "I'll show you what's\\n",
  "cool about my Pokémon!\\c$",
]

[msg.section_0.entries.5]
text = [
  "That was a fine battle,\\n",
  "both of you.\\c\\n",
  "Well, next we have...\\c$",
]

[msg.section_0.entries.6]
text = [
  "Ready!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Alder: First we have to heal\\n",
  "your Pokémon, [VAR TRNAME(0)].\\c$",
]

[msg.section_0.entries.8]
text = [
  "Girl: Some Pokémon battles are\\n",
  "decided by type matchups!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Alder: That was truly\\n",
  "a rousing battle!\\c\\n",
  "I could tell that all of the Pokémon\\n",
  "were enjoying themselves as well!\\c$",
]

[msg.section_0.entries.10]
text = [
  "How about it, [VAR TRNAME(0)]?\\c\\n",
  "Pokémon types are very important\\n",
  "in battle, aren't they?\\c\\n",
  "Water is strong against Fire...\\n",
  "Fire is strong against Grass...\\l\\n",
  "Grass is strong against Water...\\c\\n",
  "Type matchups don't\\n",
  "decide everything, though!\\c$",
]

[msg.section_0.entries.11]
text = [
  "But, listen!\\c\\n",
  "When a Pokémon uses a move\\n",
  "that matches its type, the move\\l\\n",
  "becomes more powerful!\\c$",
]

[msg.section_0.entries.12]
text = [
  "Let's heal those hard-working Pokémon!\\c\\n",
  "[VAR PKNAME(1)]!\\n",
  "You did a great job for [VAR TRNAME(0)]!\\c$",
]

[msg.section_0.entries.13]
text = [
  "Meeting Pokémon and people you\\n",
  "never would have met otherwise\\l\\n",
  "is truly one of the great things\\l\\n",
  "about traveling!$",
]

[msg.section_0.entries.14]
text = [
  "Alder: Oh!\\n",
  "You won a Gym Badge!\\c\\n",
  "That's the result of\\n",
  "understanding your Pokémon\\l\\n",
  "and bringing out their power!$",
]

[msg.section_0.entries.15]
text = [
  "Alder: Getting that many\\n",
  "Gym Badges is impressive!\\c\\n",
  "But you're only partway\\n",
  "through your journey...\\c\\n",
  "What does being strong\\n",
  "really mean?$",
]

[msg.section_0.entries.16]
text = [
  "Alder: Oh! You've come!\\c\\n",
  "Could I spar with you,\\n",
  "the strongest Trainer\\l\\n",
  "in the Unova region?$",
]

[msg.section_0.entries.17]
text = [
  "Alder: Oh! You've come!\\c\\n",
  "I want to show them what's\\n",
  "incredible about Trainers as well!\\c\\n",
  "Could I spar with you,\\n",
  "the strongest Trainer\\l\\n",
  "in the Unova region?$",
]

[msg.section_0.entries.18]
text = [
  "Oh!\\n",
  "My heart jumps for joy!\\c\\n",
  "Well, then, prepare yourself\\n",
  "for battle!\\c\\n",
  "Kiai!\\c$",
]

[msg.section_0.entries.19]
text = [
  "Hrm...\\n",
  "Well, I shall wait here, then.$",
]

[msg.section_0.entries.20]
text = [
  "Alder: That's the Champion for you!\\c$",
]

[msg.section_0.entries.21]
text = [
  "???: Gramps!\\c\\n",
  "I did it!\\c\\n",
  "I did it!\\c\\n",
  "I DID it!\\c\\n",
  "The Black Tower!\\c\\n",
  "I made it to the top!\\c$",
]

[msg.section_0.entries.22]
text = [
  "???: Gramps!\\c\\n",
  "I did it!\\c\\n",
  "I did it!\\c\\n",
  "I DID it!\\c\\n",
  "The White Treehollow!\\c\\n",
  "I made it to the deepest part!\\c$",
]

[msg.section_0.entries.23]
text = [
  "Alder: Why, if it isn't Benga!\\c\\n",
  "Are you serious, boy?\\c$",
]

[msg.section_0.entries.24]
text = [
  "Benga: Hey!\\c\\n",
  "Gramps!\\c\\n",
  "You know how\\n",
  "strong I am!\\c\\n",
  "Hey, hey!\\c$",
]

[msg.section_0.entries.25]
text = [
  "Who's that?\\c$",
]

[msg.section_0.entries.26]
text = [
  "Alder: His name is\\n",
  "[VAR TRNAME(0)]!\\c\\n",
  "He's the strongest\\n",
  "Trainer in the Unova region.\\c$",
]

[msg.section_0.entries.27]
text = [
  "Alder: Her name is\\n",
  "[VAR TRNAME(0)]!\\c\\n",
  "She's the strongest\\n",
  "Trainer in the Unova region.\\c$",
]

[msg.section_0.entries.28]
text = [
  "Benga: I knew it!\\c\\n",
  "That Trainer smells tough!\\c$",
]

[msg.section_0.entries.29]
text = [
  "Alder: How about it, Benga?\\n",
  "Do you want to spar, perhaps?\\c$",
]

[msg.section_0.entries.30]
text = [
  "Benga: No!\\c\\n",
  "I know that Trainer's strong!\\c\\n",
  "And I want to battle!\\c\\n",
  "But those Pokémon\\n",
  "haven't been through enough!\\c$",
]

[msg.section_0.entries.31]
text = [
  "Me!\\c\\n",
  "And my Pokémon!\\c\\n",
  "We climbed to the top of the Black Tower!\\c\\n",
  "You do that, too!\\c\\n",
  "There we'll see who's stronger!\\c\\n",
  "Let's try hard to be the best!\\c$",
]

[msg.section_0.entries.32]
text = [
  "Me!\\c\\n",
  "And my Pokémon!\\c\\n",
  "We made it to the deepest part\\n",
  "of the White Treehollow!\\c\\n",
  "You do that, too!\\c\\n",
  "There we'll see who's stronger!\\c\\n",
  "Let's try hard to be the best!\\c$",
]

[msg.section_0.entries.33]
text = [
  "Later!\\c\\n",
  "Gramps and [VAR TRNAME(0)]!\\c$",
]

[msg.section_0.entries.34]
text = [
  "Alder: He's a lively one,\\n",
  "even for MY grandson!\\c\\n",
  "I'll explain what he was\\n",
  "talking about.\\c\\n",
  "He challenged a place called\\n",
  "the Black Tower, which\\l\\n",
  "appeared in Black City.\\c\\n",
  "You'll find out what kind of\\n",
  "place it is if you go there.\\c\\n",
  "An ordinary Trainer, however,\\n",
  "can't make it to where he is.\\c\\n",
  "So that's the story!\\n",
  "If you'd like, you should take\\l\\n",
  "the challenge as well.$",
]

[msg.section_0.entries.35]
text = [
  "Alder: He's a lively one,\\n",
  "even for MY grandson!\\c\\n",
  "I'll explain what he was\\n",
  "talking about.\\c\\n",
  "He challenged a place called\\n",
  "the White Treehollow, which\\l\\n",
  "appeared in White Forest.\\c\\n",
  "You'll find out what kind of\\n",
  "place it is if you go there.\\c\\n",
  "An ordinary Trainer, however,\\n",
  "can't make it to where he is.\\c\\n",
  "So that's the story!\\n",
  "If you'd like, you should take\\l\\n",
  "the challenge as well.$",
]

[msg.section_0.entries.36]
text = [
  "Alder: When you find something\\n",
  "you want to do, you should\\l\\n",
  "take it on without a moment of doubt!\\c\\n",
  "Don't worry!\\n",
  "You have Pokémon by your side, right?\\c\\n",
  "If you're together,\\n",
  "you can do things you can't do alone,\\l\\n",
  "and your Pokémon can go places\\l\\n",
  "they couldn't go on their own.$",
]

[msg.section_0.entries.37]
text = [
  "My dream is to strengthen my Pokémon\\n",
  "here and become the strongest\\l\\n",
  "Trainer in Unova!$",
]

[msg.section_0.entries.38]
text = [
  "I think I can get even stronger\\n",
  "if I learn more about Pokémon!\\c\\n",
  "That's why I want to go to many\\n",
  "different places--so I can learn a lot!$",
]

[msg.section_0.entries.39]
text = [
  "Hey!\\c\\n",
  "Hey!\\c\\n",
  "Hey!\\c\\n",
  "It was a promise!\\c\\n",
  "Between me and you!\\c\\n",
  "We had the best match!\\c\\n",
  "This is to remember it by!\\c\\n",
  "Raise this Gible!\\c$",
]

[msg.section_0.entries.40]
text = [
  "Hey!\\c\\n",
  "Hey!\\c\\n",
  "Hey!\\c\\n",
  "It was a promise!\\c\\n",
  "Between me and you!\\c\\n",
  "We had the best match!\\c\\n",
  "This is to remember it by!\\c\\n",
  "Raise this Dratini!\\c$",
]

[msg.section_0.entries.41]
text = [
  "[VAR TRNAME(0)] received\\n",
  "[VAR PKNAME(1)]!$",
]

[msg.section_0.entries.42]
text = [
  "Would you like to give a\\n",
  "nickname to this [VAR PKNAME(1)]?$",
]

[msg.section_0.entries.43]
text = [
  "Hey! What's going on?\\c\\n",
  "Your party's full, huh?\\c\\n",
  "OK!\\c\\n",
  "OK!\\c\\n",
  "Got it!\\c\\n",
  "I'll wait here!$",
]

[msg.section_0.entries.44]
text = [
  "I'll leave it with you!\\c\\n",
  "Take good care of it!\\c\\n",
  "[VAR TRNAME(0)]!\\c\\n",
  "I'll be waiting for you in the Black Tower!\\c$",
]


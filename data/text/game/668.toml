]

[msg.section_0.entries.17]
text = [
  "Rental Tournament is a unique tournament\\n",
  "where we prepare the Pokémon with which\\l\\n",
  "you will battle.\\c\\n",
  "Rental Pokémon will be randomly selected\\n",
  "for you. So luck plays a big part!\\c\\n",
  "The winner will be rewarded\\n",
  "with BP.\\l\\n",
  "Good luck!\\c$",
]

[msg.section_0.entries.18]
text = [
  "Mix Tournament is a unique tournament\\n",
  "where you and your opponent swap\\l\\n",
  "Pokémon before battling.\\c\\n",
  "You'll normally swap one Pokémon,\\n",
  "but you'll swap two in Triple Battles.\\c\\n",
  "Swapped Pokémon will be returned\\n",
  "after the battle, so don't be alarmed.\\c\\n",
  "For these battles, all Pokémon will be\\n",
  "set to Level 50.\\c\\n",
  "The winner will be rewarded\\n",
  "with BP.\\l\\n",
  "Good luck!\\c$",
]

[msg.section_0.entries.19]
text = [
  "Rental Master Tournament is a unique\\n",
  "tournament where we prepare the\\l\\n",
  "Pokémon with which you will battle.\\c\\n",
  "Rental Pokémon will be randomly\\n",
  "selected for you. They are more rare\\l\\n",
  "than the ones in the Rental Tournament.\\c\\n",
  "To make the battles more thrilling, the\\n",
  "participants are Gym Leaders from\\l\\n",
  "various regions.\\c\\n",
  "The winner will be rewarded\\n",
  "with a little more BP than usual.\\l\\n",
  "Good luck!\\c$",
]

[msg.section_0.entries.20]
text = [
  "Mix Master Tournament is a unique\\n",
  "tournament where you and your opponent\\l\\n",
  "swap Pokémon before battling.\\c\\n",
  "You'll normally swap one Pokémon,\\n",
  "but you'll swap two in Triple Battles.\\c\\n",
  "Swapped Pokémon will be returned\\n",
  "after the battle, so don't be alarmed.\\c\\n",
  "For these battles, all Pokémon\\n",
  "will be set to Level 50.\\c\\n",
  "The participants in the Mix Master\\n",
  "Tournament are Unova Gym Leaders,\\l\\n",
  "so there will be rare Pokémon in the mix.\\c\\n",
  "The winner will be rewarded\\n",
  "with a little more BP than usual.\\l\\n",
  "Good luck!\\c$",
]

[msg.section_0.entries.21]
text = [
  "There are four battle formats\\n",
  "to a tournament:\\l\\n",
  "Single, Double, Triple, and Rotation.\\c\\n",
  "Single Battles need three Pokémon.\\c\\n",
  "Double Battles need four Pokémon.\\c\\n",
  "Triple Battles need six Pokémon.\\c\\n",
  "Rotation Battles need four Pokémon.\\c\\n",
  "Triple Battles and Rotation Battles\\n",
  "give you more points than other formats\\l\\n",
  "when you manage to win, so jump in!\\l\\n",
  "It's worthwhile to try these formats!\\c$",
]


[msg.section_0.entries.5]
text = [
  "Which tournament do you\\n",
  "want to know about?$",
]

[msg.section_0.entries.6]
text = [
  "We hope to see you again!$",
]

[msg.section_0.entries.7]
text = [
  "Type Expert Tournament is a tournament\\n",
  "in which only Pokémon of a specific type\\l\\n",
  "can participate.\\c\\n",
  "For example, if you choose\\n",
  "Fire-type Expert Tournament, only\\l\\n",
  "Fire-type Pokémon can participate.\\c\\n",
  "You'll need different Pokémon\\n",
  "of the same type.\\c\\n",
  "Make sure no two Pokémon are\\n",
  "holding the same item.\\c\\n",
  "The item Soul Dew and the\\n",
  "move Sky Drop are banned.\\c\\n",
  "Legendary or mythical Pokémon\\n",
  "may not participate, either.\\c\\n",
  "For these battles, all Pokémon will be\\n",
  "set to Level 50.\\c\\n",
  "The winner will be rewarded\\n",
  "with a little more BP than usual.\\l\\n",
  "Good luck!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Champions Tournament is a tournament\\n",
  "in which only the Champions of the\\l\\n",
  "Champions can participate.\\c\\n",
  "You may not have duplicate Pokémon\\n",
  "or duplicate held items.\\c\\n",
  "The item Soul Dew and the\\n",
  "move Sky Drop are banned.\\c\\n",
  "Legendary or mythical Pokémon\\n",
  "may not participate, either.\\c\\n",
  "For these battles, all Pokémon\\n",
  "will be set to Level 50.\\c\\n",
  "The winner will be rewarded with BP,\\n",
  "depending on how many Pokémon\\l\\n",
  "are left standing.\\c\\n",
  "Aim for total victory! Good luck!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Download Tournament is a tournament\\n",
  "that you can download from the\\l\\n",
  "black PC next to me.\\c\\n",
  "The rules are different for\\n",
  "each tournament.\\c\\n",
  "Please check the detailed rules\\n",
  "before participating.\\c\\n",
  "The winner will be rewarded\\n",
  "with a little more BP than usual.\\l\\n",
  "Good luck!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Driftveil Tournament is a tournament\\n",
  "where anything goes.\\c\\n",
  "You may use any Pokémon or\\n",
  "held items of your choice.\\c\\n",
  "For these battles, all Pokémon\\n",
  "will be set to Level 25.\\c\\n",
  "The winner will be rewarded\\n",
  "with BP.\\l\\n",
  "Good luck!\\c$",
]


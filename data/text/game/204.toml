]

[msg.section_0.entries.51]
text = [
  "Today, I want to say how grateful I am.\\c\\n",
  "Thank you for doing so much to\\n",
  "develop this avenue!\\c\\n",
  "You're a truly deserving “[VAR 0x013A(1)]\\\"!\\n",
  "I'd say you've made the avenue your own!\\c\\n",
  "Because of that, you have earned\\n",
  "the privilege of renaming the avenue.\\c\\n",
  "Please consider a new name for Join\\n",
  "Avenue that describes its character.\\c$",
]

[msg.section_0.entries.52]
text = [
  "Wonderful!\\c\\n",
  "[VAR 0x013A(1)],\\n",
  "[VAR 0x0139(2)] belongs to you now!\\l\\n",
  "I'll leave everything to you.\\c\\n",
  "Continue developing the avenue\\n",
  "so visitors will be even more delighted.\\c$",
]

[msg.section_0.entries.53]
text = [
  "Today, I have a present for you.\\c\\n",
  "Now you can change the avenue's\\n",
  "neon arch as you wish.\\c\\n",
  "It will give a fresh look to the avenue.\\n",
  "Won't it delight our visitors even more?!\\c$",
]

[msg.section_0.entries.54]
text = [
  "I have a piece of advice for you today.\\c\\n",
  "You'd want an assistant that suits\\n",
  "your preferences, wouldn't you?\\c\\n",
  "Why don't you choose one of the visitors?\\n",
  "It's quite easy.\\c\\n",
  "Talk to a person and choose “Recruit.\\\"\\c\\n",
  "The higher the current avenue rank is\\n",
  "compared to the person's ideals,\\l\\n",
  "the better chance you'll have of\\l\\n",
  "recruiting him or her successfully.\\c\\n",
  "Please bring even more delight\\n",
  "to our visitors!\\c$",
]

[msg.section_0.entries.55]
text = [
  "Today, I have a big present for you!\\c\\n",
  "To commemorate your entering the\\n",
  "Hall of Fame, shops have been renovated.\\c\\n",
  "You'll notice new services and items,\\n",
  "so you might want to check those out.\\c\\n",
  "What's more...\\n",
  "Have you heard of Pokémon Eggs?\\c\\n",
  "You'll now be able to build what they call\\n",
  "a “Nursery,\\\" which enables Eggs to\\l\\n",
  "be hatched more quickly than normal.\\c\\n",
  "Find a visitor who wants to build a\\n",
  "Nursery, and give it a try!\\c$",
]

[msg.section_0.entries.56]
text = [
  "Today, I have a surprise for you.\\c\\n",
  "Everybody here is celebrating the\\n",
  "great effort you've been putting in.\\c\\n",
  "What are you waiting for? Don't be shy!\\n",
  "Go and greet everyone!\\c$",
]

[msg.section_0.entries.57]
text = [
  "I have a present for you to recognize\\n",
  "all your continuous effort.\\c\\n",
  "It's just a little something.\\n",

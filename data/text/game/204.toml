[msg.section_0.entries.0]
text = [
  "[VAR 0x013A(0)]!\\n",
  "Do you have any questions?$",
]

[msg.section_0.entries.1]
text = [
  "This is the brand-new avenue in the\\n",
  "Unova region, [VAR 0x0139(1)]!\\c\\n",
  "It is still under major development\\n",
  "to create an avenue that's perfect for\\l\\n",
  "meeting people, making discoveries,\\l\\n",
  "and having fun. Good times!\\c$",
]

[msg.section_0.entries.2]
text = [
  "[VAR 0x013A(0)], you've been signed up\\n",
  "by the owner to manage the avenue.\\c\\n",
  "Your goal is simple:\\n",
  "create a dazzling, delightful avenue!\\c\\n",
  "Design an avenue that will fill all visitors\\n",
  "with joy and the desire to visit often.\\c\\n",
  "You'll have assistants, so please let us\\n",
  "know how we can help you.\\c$",
]

[msg.section_0.entries.3]
text = [
  "You can use various communication\\n",
  "features to encourage people to visit.\\c\\n",
  "Talk to people during their visits here.\\n",
  "There are two things you can do.\\c\\n",
  "The first thing is to “invite\\\" someone.\\n",
  "The other thing is to “recommend\\\" a shop\\l\\n",
  "to someone.\\c\\n",
  "To really get the idea of all you can do,\\n",
  "stay and listen to a little more about it.\\c$",
]

[msg.section_0.entries.4]
text = [
  "You can bring in more customers by\\n",
  "using the communication features.\\c\\n",
  "When you have the C-Gear turned on,\\n",
  "passersby will visit the avenue.\\c\\n",
  "People you've met through the Union\\n",
  "Room, Infrared Communication, Random\\l\\n",
  "Matchups, and GTS visit the avenue, too.\\c\\n",
  "Communication features aren't the\\n",
  "only way to bring in visitors.\\c\\n",
  "As your adventure progresses,\\n",
  "fans might sometimes visit the avenue.\\c\\n",
  "You can use your Town Map to check\\n",
  "the current number of visitors.\\c\\n",
  "It might be fun to check it now and then.\\c$",
]

[msg.section_0.entries.5]
text = [
  "When you select “Invite,\\\" the visitor\\n",
  "will begin to live here and create a shop.\\c\\n",
  "Each person has his or her own\\n",
  "hopes and dreams.\\c\\n",
  "I recommend listening carefully to the\\n",
  "person before you decide.\\c$",
]

[msg.section_0.entries.6]
text = [
  "“Recommend\\\" a shop to a visitor.\\c\\n",
  "If the visitor is happy with the shop,\\n",
  "the popularity of the shop and\\l\\n",
  "this avenue will go up.\\c\\n",
  "As their popularity goes up, shops and\\n",
  "this avenue reach higher ranks.\\c\\n",
  "The higher the shop rank goes up,\\n",
  "the more items and services it'll have.\\c\\n",
  "When the current avenue rank goes up,\\n",
  "item prices will become slightly\\l\\n",
  "more reasonable.\\c\\n",
  "Try to recommend shops that your\\n",
  "visitors will be delighted with so the\\l\\n",
  "popularity of the shops goes up!\\c$",
]

[msg.section_0.entries.7]
text = [
  "[VAR 0x013A(0)], this is your office.\\c\\n",
  "Your assistants and I will support you\\n",
  "in developing [VAR 0x0139(1)].\\c\\n",
  "As the avenue grows bigger and bigger,\\n",
  "there will be more and more visitors.\\c\\n",
  "You may enjoy hearing what they have to\\n",
  "say, so please drop by from time to time.\\c$",
]

[msg.section_0.entries.8]
text = [
  "At Markets, you'll be able to purchase\\n",
  "various items useful for your adventure.\\c\\n",
  "Sometimes they carry items not available\\n",
  "at Poké Marts, or so I've heard.\\c$",
]

[msg.section_0.entries.9]
text = [
  "At Raffle Shops, you can win cool prizes.\\c\\n",
  "The grand prize is a Master Ball!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Flower Shops carry Berries.\\c\\n",
  "Different shops may have\\n",
  "different Berries.\\c$",
]

[msg.section_0.entries.11]
text = [
  "At Nurseries, you can put Pokémon Eggs\\n",
  "in incubators to speed up hatching.\\c$",
]

[msg.section_0.entries.12]
text = [
  "Dojos train Pokémon.\\c\\n",
  "They can level up Pokémon and\\n",
  "raise the base stats of Pokémon.\\c\\n",
  "Be aware that Pokémon won't learn\\n",
  "certain moves or evolve while they\\l\\n",
  "level up this way.\\c$",
]

[msg.section_0.entries.13]
text = [
  "Antique Shops carry rare finds.\\c\\n",
  "You may find out you have really rare\\n",
  "items when you have them appraised.\\c$",
]

[msg.section_0.entries.14]
text = [
  "Cafés give you and your Pokémon\\n",
  "the chance to have a nice meal.\\c\\n",
  "Meals make Pokémon happy,\\n",
  "and they will grow friendly faster.\\c\\n",
  "You can also level Pokémon up and\\n",
  "raise their base stats.\\c\\n",
  "Be aware that Pokémon won't learn\\n",
  "certain moves or evolve while they\\l\\n",
  "level up this way.\\c$",
]

[msg.section_0.entries.15]
text = [
  "Beauty Salons keep Pokémon tidy.\\c\\n",
  "Haircuts and cosmetics make Pokémon\\n",
  "happy, and they grow friendlier faster.\\c$",
]

[msg.section_0.entries.16]
text = [
  "There are seven different kinds of shops\\n",
  "that can be built in [VAR 0x0139(0)].\\c\\n",
  "When someone is invited to build a shop,\\n",
  "the type of shop they open is based\\l\\n",
  "on that person's hopes and dreams.\\c\\n",
  "When you recommend shops to visitors,\\n",
  "the shops get more popular and their\\l\\n",
  "rank improves.\\c\\n",
  "Talk to assistant 2 for advice on what\\n",
  "kinds of shops will grow the fastest.\\c$",
]

[msg.section_0.entries.17]
text = [
  "There are eight different kinds of shops\\n",
  "you can build in [VAR 0x0139(0)].\\c\\n",
  "When someone is invited to build a shop,\\n",
  "the type of shop they open is based\\l\\n",
  "on that person's hopes and dreams.\\c\\n",
  "When you recommend shops to visitors,\\n",
  "the shops get more popular and their\\l\\n",
  "rank improves.\\c\\n",
  "Talk to assistant 2 for advice on what\\n",
  "kinds of shops will grow the fastest.\\c$",
]

[msg.section_0.entries.18]
text = [
  "Is there anything you'd like to know\\n",
  "about shops?$",
]

[msg.section_0.entries.19]
text = [
  "I'm looking forward to seeing this grow\\n",
  "into a fantastic avenue!$",
]

[msg.section_0.entries.20]
text = [
  "Bring in more customers by using\\n",
  "the communication features.\\c\\n",
  "People you've met through communication\\n",
  "features will visit the avenue.\\c\\n",
  "When you talk to them, there are three\\n",
  "things you can choose to do.\\c\\n",
  "You can “invite\\\" the person to join\\n",
  "the avenue, “recommend\\\" a shop, or\\l\\n",
  "“recruit\\\" that person as an assistant.\\c\\n",
  "For details, please listen to\\n",
  "each explanation.\\c$",
]

[msg.section_0.entries.21]
text = [
  "If you choose to “Recruit,\\\" the visitor\\n",
  "will become your assistant and help you.\\c\\n",
  "Your chances of recruiting the visitor\\n",
  "improve if your avenue ranks higher\\l\\n",
  "than the person's ideals.\\c$",
]


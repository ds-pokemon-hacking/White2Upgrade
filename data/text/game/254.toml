[msg.section_0.entries.0]
text = [
  "Bianca: Know what?\\n",
  "I'm here at Professor Juniper's request!\\c\\n",
  "I'm researching a Pokémon\\n",
  "called Tynamo!\\c\\n",
  "But there aren't very many,\\n",
  "and they don't seem very strong...$",
]

[msg.section_0.entries.1]
text = [
  "Hi! I'm the Nugget man.\\c$",
]

[msg.section_0.entries.2]
text = [
  "And I'm the Nugget boy!\\c$",
]

[msg.section_0.entries.3]
text = [
  "Glad you showed up!\\n",
  "I want to give you this.\\c$",
]

[msg.section_0.entries.4]
text = [
  "I want to give you this, too.\\c$",
]

[msg.section_0.entries.5]
text = [
  "That's a Nugget!\\c\\n",
  "How'd it get so golden without\\n",
  "deep-frying? Trade secret!$",
]

[msg.section_0.entries.6]
text = [
  "Nuggetaboutit!$",
]

[msg]
trailing_data = "5858"

[msg.section_0.entries.0]
text = [
  "???: That blasted Colress!\\c$",
]

[msg.section_0.entries.1]
text = [
  "The fool is far too committed\\n",
  "to pure science.\\c\\n",
  "This is how he repays me for\\n",
  "making him the boss of Team Plasma?\\c\\n",
  "How dare he put his personal\\n",
  "intellectual curiosity before our\\l\\n",
  "ultimate mission of conquering Unova!\\c$",
]

[msg.section_0.entries.2]
text = [
  "How fortunate for you!\\c\\n",
  "Few get to be the sole audience member\\n",
  "for one of my speeches.\\c$",
]

[msg.section_0.entries.3]
text = [
  "Team Plasma will use its\\n",
  "knowledge and technology\\l\\n",
  "to take Kyurem's true\\l\\n",
  "power to its absolute limit\\l\\n",
  "and freeze the Unova region.\\c\\n",
  "The terrified people and Pokémon\\n",
  "will bow at Team Plasma's...no...\\l\\n",
  "at MY feet!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Kyurem is an empty being.\\c\\n",
  "The remnants of a certain Pokémon\\n",
  "when it split into Reshiram and\\l\\n",
  "Zekrom...\\c\\n",
  "My desire is absolute rule of Unova!\\c$",
]

[msg.section_0.entries.5]
text = [
  "That's right! Kyurem will be the vessel\\n",
  "into which my desires will be poured!\\c$",
]

[msg.section_0.entries.6]
text = [
  "Shadow Triad: Lord Ghetsis.\\n",
  "Kyurem has been transferred!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Ghetsis: It's finally here!\\c\\n",
  "The wonderful era in which\\n",
  "I am the absolute ruler of Unova\\l\\n",
  "has finally arrived!\\c\\n",
  "I'll let you take care of this!\\c$",
]

[msg.section_0.entries.8]
text = [
  "[VAR TRNAME(1)]: Wait...\\n",
  "You're one of the Shadow Triad, right?\\c\\n",
  "Tell me about the Purrloin\\n",
  "that was stolen in Aspertia.\\c$",
]

[msg.section_0.entries.9]
text = [
  "Shadow Triad: Very well...\\c\\n",
  "This might be it.\\c$",
]

[msg.section_0.entries.10]
text = [
  "Grrooowwwl!$",
]

[msg.section_0.entries.11]
text = [
  "Shadow Triad: I stole this Pokémon\\n",
  "five years ago in Aspertia.\\c\\n",
  "So it seems likely that it is the\\n",
  "Pokémon you're talking about.\\c\\n",
  "But now, it only listens to my commands.\\c\\n",
  "Such is the fate of Pokémon\\n",
  "that are trapped in Poké Balls!\\c$",
]

[msg.section_0.entries.12]
text = [
  "[VAR TRNAME(1)]: Wh-what?\\c\\n",
  "Don't mess with me...\\n",
  "That's someone else's Pokémon!\\c$",
]

[msg.section_0.entries.13]
text = [
  "Shadow Triad: Ah...\\n",
  "I feel sorry for Pokémon.\\c\\n",
  "They're ruled by Poké Balls\\n",
  "and the whims of their Trainers...\\c\\n",
  "Lord Ghetsis spoke of\\n",
  "Pokémon liberation two years ago\\l\\n",
  "simply for his own ambitions, but...\\c\\n",
  "If his plans had succeeded, many Pokémon\\n",
  "would have been saved.\\c\\n",
  "This Liepard--well, you knew it as a\\n",
  "Purrloin--if it had been released,\\l\\n",
  "it might have returned to you.\\c\\n",
  "Well then...\\c$",
]

[msg.section_0.entries.14]
text = [
  "You there!\\n",
  "I won't let you interfere with\\l\\n",
  "Lord Ghetsis's plans!\\c$",
]

[msg.section_0.entries.15]
text = [
  "Shadow Triad: You're not done yet...$",
]

[msg.section_0.entries.16]
text = [
  "Shadow Triad: If you want to go any\\n",
  "further, you'll have to get past us.\\c$",
]

[msg.section_0.entries.17]
text = [
  "Shadow Triad: I have no problem\\n",
  "with you, but this is for Lord Ghetsis!\\c$",
]

[msg.section_0.entries.18]
text = [
  "Shadow Triad: Even if I lose,\\n",
  "Lord Ghetsis simply has to win...$",
]

[msg.section_0.entries.19]
text = [
  "Shadow Triad: We swore to be loyal\\n",
  "to Lord Ghetsis since he saved us!\\c$",
]

[msg.section_0.entries.20]
text = [
  "Shadow Triad: Listen well!\\c\\n",
  "The only thing we want is\\n",
  "the world Lord Ghetsis desires!$",
]

[msg.section_0.entries.21]
text = [
  "Shadow Triad: Can you defeat\\n",
  "all three of us?$",
]

[msg.section_0.entries.22]
text = [
  "Shadow Triad: No matter...\\c\\n",
  "The only thing you can do is\\n",
  "watch Lord Ghetsis use Kyurem\\l\\n",
  "to freeze Unova solid. That's all...\\c$",
]

[msg.section_0.entries.23]
text = [
  "You...\\n",
  "I'll return this Pokémon to you.\\c\\n",
  "Considering what Lord Ghetsis\\n",
  "is about to do,\\l\\n",
  "I have no further need of it.\\c$",
]

[msg.section_0.entries.24]
text = [
  "[VAR TRNAME(1)]: Sorry...\\c\\n",
  "This situation is messing with my head...\\n",
  "I just don't know what to do...\\c\\n",
  "I finally found my sister's Pokémon,\\n",
  "but now it's glaring at me...\\c\\n",
  "Why?!$",
]

[msg.section_0.entries.25]
text = [
  "[VAR TRNAME(1)]: ...\\c\\n",
  "...\\c\\n",
  "Hey...\\n",
  "[VAR TRNAME(0)]...\\c\\n",
  "If we let Team Plasma\\n",
  "do whatever they want...\\c\\n",
  "There'll be more sad Pokémon\\n",
  "like Purrloin and Kyurem...$",
]

[msg.section_0.entries.26]
text = [
  "A map of the Unova region\\n",
  "is being displayed.$",
]

[msg.section_0.entries.27]
text = [
  "Data about the ship\\n",
  "is being displayed.$",
]

[msg.section_0.entries.28]
text = [
  "The monitor is showing static...\\c\\n",
  "The voices of Team Plasma members\\n",
  "who should be in the ship can be heard.$",
]

[msg.section_0.entries.29]
text = [
  "The monitor is showing static...$",
]

[msg.section_0.entries.30]
text = [
  "Grrrrrr...$",
]

[msg]
trailing_data = "a8a8"

[msg.section_0.entries.0]
text = [
  "If you want all the TMs, the\\n",
  "Shopping Mall is a must-visit!\\c\\n",
  "That's right! You should brag about\\n",
  "coming here to the TM Collector\\l\\n",
  "in Mistralton City!$",
]

[msg.section_0.entries.1]
text = [
  "On the first floor, they sell medicines.\\c\\n",
  "On the second floor, they sell TMs\\n",
  "and different kinds of Mail.\\c\\n",
  "On the third floor, they sell items for\\n",
  "raising stats and battle items.\\c\\n",
  "I really admire Mr. Clyde, the\\n",
  "Pokémon Gym guide, so I'm practicing\\l\\n",
  "being a guide, too!$",
]

[msg.section_0.entries.2]
text = [
  "I was challenged to a Pokémon\\n",
  "battle inside the Shopping Mall!\\c\\n",
  "That means it's a place where\\n",
  "only the strong survive. Got it?$",
]

[msg.section_0.entries.3]
text = [
  "The thing I buy most often is the item\\n",
  "that raises a Pokémon's HP, called HP Up.\\c\\n",
  "There are also a lot of other items that\\n",
  "catch my eye.$",
]

[msg.section_0.entries.4]
text = [
  "I can't wait for evening!\\n",
  "That's right! Evening itself is a fever!$",
]

[msg.section_0.entries.5]
text = [
  "It's tonight's special evening deal!\\c\\n",
  "Poké Balls are on sale!\\c\\n",
  "For an a-m-a-z-i-n-g...\\c\\n",
  "10% off!\\n",
  "They're on sale now!$",
]

[msg.section_0.entries.6]
text = [
  "It's tonight's special evening deal!\\c\\n",
  "Potions are on sale!\\c\\n",
  "For an a-m-a-z-i-n-g...\\c\\n",
  "10% off!\\n",
  "They're on sale now!$",
]

[msg.section_0.entries.7]
text = [
  "OK, then that will be \\$0 for no items!\\c\\n",
  "Thanks for nothing!\\n",
  "Please come again!$",
]

[msg.section_0.entries.8]
text = [
  "Well, at 10% off, your\\n",
  "Poké Ball purchase will be \\$180!$",
]

[msg.section_0.entries.9]
text = [
  "Well, at 10% off, your\\n",
  "Potion purchase will be \\$270!$",
]

[msg.section_0.entries.10]
text = [
  "What? You don't have enough money,\\n",
  "even when it's 10% off?!$",
]

[msg.section_0.entries.11]
text = [
  "What? You can't hold any more\\n",
  "even when you'd get 10% off?!$",
]

[msg.section_0.entries.12]
text = [
  "The better Trainer you are,\\n",
  "the more you'll find yourself thinking!\\c\\n",
  "That's so you can help your\\n",
  "Pokémon partners win!$",
]

[msg.section_0.entries.13]
text = [
  "If I were to play hide-and-seek with\\n",
  "my Pokémon, they'd find me right away!\\c\\n",
  "But if I were to get lost,\\n",
  "I'd be glad they could find me right away!$",
]

[msg.section_0.entries.14]
text = [
  "Welcome to Shopping Mall Nine!\\n",
  "It's called Nine because it's on Route 9.\\c\\n",
  "You can remember it by thinking of this:\\n",
  "“Done shopping? Nein!\\\"$",
]

[msg.section_0.entries.15]
text = [
  "My Lampent's not good at\\n",
  "Pokémon battles,\\l\\n",
  "but it's great at making toast!$",
]

[msg.section_0.entries.16]
text = [
  "I'm a Lady...\\c\\n",
  "I've come to do some shopping,\\n",
  "but I'm having ever so much trouble\\l\\n",
  "finding out what is sold where.\\c\\n",
  "Would you be so kind as to buy\\n",
  "a Hyper Potion for me?\\l\\n",
  "I'll give you the money for it.$",
]

[msg.section_0.entries.17]
text = [
  "Why, thank you!\\n",
  "Here is the money for it.\\c\\n",
  "Just a Hyper Potion, please.\\n",
  "Thank you ever so much for your help.$",
]

[msg.section_0.entries.18]
text = [
  "[VAR TRNAME(0)] received \\$1,200!$",
]

[msg.section_0.entries.19]
text = [
  "Someone refusing a request from me?\\n",
  "What a novel sensation!\\c\\n",
  "Now, where could they be\\n",
  "selling those Hyper Potions?$",
]

[msg.section_0.entries.20]
text = [
  "I want a Hyper Potion!\\n",
  "Did you already buy one for me?$",
]

[msg.section_0.entries.21]
text = [
  "Did I not ask you to buy\\n",
  "a Hyper Potion for me?\\c\\n",
  "Please! I'm waiting.\\c\\n",
  "Or did you already buy it, perhaps?$",
]

[msg.section_0.entries.22]
text = [
  "It's a Hyper Potion!\\n",
  "Thank you for buying it so quickly!\\c\\n",
  "This isn't much, but please take it!$",
]

[msg.section_0.entries.23]
text = [
  "It's a Hyper Potion! It feels as though\\n",
  "I've been waiting ever so long for this.\\c\\n",
  "But I am happy to finally have it.\\n",
  "This isn't much, but please take it.$",
]

[msg.section_0.entries.24]
text = [
  "Excuse me? It seems as though\\n",
  "there's no Hyper Potion in your Bag.\\c\\n",
  "Please!\\n",
  "Buy a Hyper Potion for me!$",
]

[msg.section_0.entries.25]
text = [
  "What I want is a Hyper Potion!\\n",
  "Please! I'm waiting...$",
]

[msg.section_0.entries.26]
text = [
  "Shopping is so much fun!\\n",
  "I'm thrilled with all I've accomplished!$",
]

[msg.section_0.entries.27]
text = [
  "Shopping Mall Nine\\n",
  "Colorful and wonderful!$",
]

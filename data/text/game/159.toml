[msg.section_0.entries.8]
text = [
  "“The woman who uses Ghost types,\\n",
  "  and the woman who uses Ground types.\\c\\n",
  "  I couldn't ask the reason\\n",
  "  why their names and appearances\\l\\n",
  "  are so similar.\\\"\\c\\n",
  "That's part of a novel I wrote.\\c\\n",
  "I absolutely love writing about the close\\n",
  "bonds between the Trainers and\\l\\n",
  "the Pokémon that I've competed against.\\c\\n",
  "Could I use you and your Pokémon as\\n",
  "a subject?\\c$",
]

[msg.section_0.entries.9]
text = [
  "“‘Yes. My code name is Looker.'\\c\\n",
  "  He sounded a bit aloof, but his partner\\n",
  "  Croagunk's strategy was tricky.\\\"\\c\\n",
  "That's part of a novel I wrote.\\c\\n",
  "I absolutely love writing about the close\\n",
  "bonds between the Trainers and\\l\\n",
  "the Pokémon that I've competed against.\\c\\n",
  "Could I use you and your Pokémon as\\n",
  "a subject?\\c$",
]

[msg.section_0.entries.10]
text = [
  "All the Pokémon on both sides\\n",
  "battled so bravely.\\l\\n",
  "Even though they got hurt...\\c\\n",
  "Thank you.$",
]

[msg.section_0.entries.11]
text = [
  "It's important to be tough and resilient\\n",
  "when you battle, don't you think?\\c\\n",
  "You have to accept that both sides will\\n",
  "get hurt. You have to understand that\\l\\n",
  "the pain of losing is a natural outcome.\\c\\n",
  "If you just focus on winning, you can\\n",
  "forget that the bond between you and\\l\\n",
  "your Pokémon is the most important thing.\\c\\n",
  "I try to focus on that bond in my novels.\\n",
  "I want them to be full of heart and soul!$",
]

[msg.section_0.entries.12]
text = [
  "Challenger, if you defeat the entire\\n",
  "Elite Four of the Pokémon League, you\\l\\n",
  "can go on to challenge the Champion.\\c\\n",
  "And you have earned that right.\\c\\n",
  "Your story is yours and yours alone.\\n",
  "Please weave a wonderful tale!$",
]

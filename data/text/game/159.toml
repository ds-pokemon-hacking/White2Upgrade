[msg.section_0.entries.0]
text = [
  "“There is one man\\n",
  "  who wanders the world\\l\\n",
  "  with a black dragon Pokémon\\l\\n",
  "  to pursue ideals...\\\"\\c\\n",
  "That's part of a novel I'm writing.\\n",
  "I want to write down the event\\l\\n",
  "that happened on that day...\\c\\n",
  "Sorry, it has nothing to do with you...\\n",
  "You're a challenger, right?\\c\\n",
  "I'm the Elite Four's Ghost-type\\n",
  "Pokémon user, Shauntal, and I\\l\\n",
  "shall be your opponent.\\c$",
]

[msg.section_0.entries.1]
text = [
  "“There is one man\\n",
  "  who wanders the world\\l\\n",
  "  with a white dragon Pokémon\\l\\n",
  "  to search for truth...\\\"\\c\\n",
  "That's part of a novel I'm writing.\\n",
  "I want to write down the event\\l\\n",
  "that happened on that day...\\c\\n",
  "Sorry, it has nothing to do with you...\\n",
  "You're a challenger, right?\\c\\n",
  "I'm the Elite Four's Ghost-type\\n",
  "Pokémon user, Shauntal, and I\\l\\n",
  "shall be your opponent.\\c$",
]

[msg.section_0.entries.2]
text = [
  "My Pokémon and the challenger's Pokémon.\\c\\n",
  "Everyone battled even though\\n",
  "they were hurt... Thank you.$",
]

[msg.section_0.entries.3]
text = [
  "Fortitude is needed if you're going\\n",
  "to battle, don't you think?\\c\\n",
  "Because both you and your opponent\\n",
  "get hurt.\\c\\n",
  "But if you don't understand the pain,\\n",
  "you'll focus on the result and forget\\l\\n",
  "about the bonds with your Pokémon.\\c\\n",
  "That's why I want to write passages\\n",
  "full of heart and soul in my novels.$",
]

[msg.section_0.entries.4]
text = [
  "Challenger, if you defeat the entire\\n",
  "Elite Four of the Pokémon League,\\l\\n",
  "you can go on to challenge the Champion.\\c\\n",
  "And you have earned that right.\\c\\n",
  "Return to the plaza in the center\\n",
  "and check the statue.$",
]

[msg.section_0.entries.5]
text = [
  "“‘Go, Volcarona!\\n",
  "  Use Heat Wave here!'\\l\\n",
  "  The Trainer solemnly ordered\\l\\n",
  "  the Pokémon who resembled\\l\\n",
  "  his first partner...\\\"\\c\\n",
  "That's part of a novel I wrote.\\c\\n",
  "I absolutely love writing about the close\\n",
  "bonds between the Trainers and\\l\\n",
  "the Pokémon that I've competed against.\\c\\n",
  "Could I use you and your Pokémon as\\n",
  "a subject?\\c$",
]

[msg.section_0.entries.6]
text = [
  "“‘Do you know Thunderbolt?' was\\n",

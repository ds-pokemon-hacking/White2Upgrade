[msg.section_0.entries.0]
text = [
  "Why did we put greenhouses\\n",
  "around the runway, you ask?\\c\\n",
  "That's so we can send freshly picked\\n",
  "vegetables as fast as possible!$",
]

[msg.section_0.entries.1]
text = [
  "Why do we make vegetable gardens\\n",
  "around the runway, you ask?\\c\\n",
  "That's so we can send freshly picked\\n",
  "vegetables as fast as possible!$",
]

[msg.section_0.entries.2]
text = [
  "Woooosh! Whooosh!\\c\\n",
  "The wind blows really hard\\n",
  "in Skyla's Gym!$",
]

[msg.section_0.entries.3]
text = [
  "Ruuunwaaaay! Ruuunwaaaay!\\n",
  "A Technical Machine on the ruuuunwaaaay!$",
]

[msg.section_0.entries.4]
text = [
  "Ruuunwaaaay! Ruuunwaaaay!\\n",
  "Racing there is so much fun!\\c\\n",
  "Hey, hey, which Pokémon\\n",
  "flies the fastest?$",
]

[msg.section_0.entries.5]
text = [
  "If you have a Gym Badge from Mistralton,\\n",
  "I'll tell you something cool!$",
]

[msg.section_0.entries.6]
text = [
  "Wow! A Jet Badge! You won against Skyla!\\n",
  "OK, I'll tell you something cool!\\c\\n",
  "We left our treasure at the edge of\\n",
  "the runway!$",
]

[msg.section_0.entries.7]
text = [
  "It's TM40, Aerial Ace!\\c\\n",
  "We'll be happy if we gave you\\n",
  "the key to victory!$",
]

[msg.section_0.entries.8]
text = [
  "Kwa!$",
]

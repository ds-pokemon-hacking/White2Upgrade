[msg.section_0.entries.0]
text = [
  "[VAR TRNAME(1)]: [VAR TRNAME(0)]!\\n",
  "I need you to get tougher!\\c\\n",
  "Even I'm going to have trouble\\n",
  "taking them on all by myself...\\c\\n",
  "Anyway, it's OK!\\n",
  "I'll take care of healing our Pokémon!\\c\\n",
  "I'm counting on you, [VAR TRNAME(0)]!\\n",
  "Are you ready to go?$",
]

[msg.section_0.entries.1]
text = [
  "[VAR TRNAME(1)]: C'mon!\\n",
  "Hurry up and get ready!\\c$",
]

[msg.section_0.entries.2]
text = [
  "[VAR TRNAME(1)]: OK!\\n",
  "Let's find Team Plasma!\\c$",
]

[msg.section_0.entries.3]
text = [
  "[VAR TRNAME(1)]: I suppose.\\n",
  "Going to step outside for a minute?$",
]

[msg.section_0.entries.4]
text = [
  "[VAR TRNAME(1)]: I'm sorry\\n",
  "I got you mixed up in this,\\l\\n",
  "but I can't forgive Team Plasma!$",
]

[msg.section_0.entries.5]
text = [
  "[VAR TRNAME(1)]: So this is the sewer...\\n",
  "Well, it's not as stinky as I expected.$",
]

[msg.section_0.entries.6]
text = [
  "[VAR TRNAME(1)]: Still...\\n",
  "Pokémon live everywhere, don't they?$",
]

[msg.section_0.entries.7]
text = [
  "[VAR TRNAME(1)]: If you don't get strong,\\n",
  "you can't protect the things that are\\l\\n",
  "important to you!$",
]

[msg.section_0.entries.8]
text = [
  "[VAR TRNAME(1)]: Don't worry about me!\\n",
  "Let's hurry and find Team Plasma!$",
]

[msg.section_0.entries.9]
text = [
  "                                    $$",
]

[msg.section_0.entries.10]
text = [
  "                                  $$",
]

[msg.section_0.entries.11]
text = [
  "Hey!\\c$",
]

[msg.section_0.entries.12]
text = [
  "Team Plasma: What do you want?\\c$",
]

[msg.section_0.entries.13]
text = [
  "[VAR TRNAME(1)]: Team Plasma!\\n",
  "You villains!\\c$",
]

[msg.section_0.entries.14]
text = [
  "Team Plasma: What?\\n",
  "Don't treat us like villains!\\c\\n",
  "And don't interfere with our\\n",
  "plans to liberate Pokémon!\\c$",
]

[msg.section_0.entries.15]
text = [
  "[VAR TRNAME(1)]: Liberate? Ha!\\n",
  "You're just ordinary Pokémon thieves!\\c\\n",
  "And what's more, you use those\\n",
  "stolen Pokémon like they're tools!\\c$",
]

[msg.section_0.entries.16]
text = [
  "Team Plasma: Shaddap!\\n",
  "Hand over your Pokémon!\\c$",
]

[msg.section_0.entries.17]
text = [
  "[VAR TRNAME(1)]: Let's do this, [VAR TRNAME(0)]!\\c$",
]

[msg.section_0.entries.18]
text = [
  "Team Plasma: They're really tough!\\c\\n",
  "But whatever!\\n",
  "We've got the Pokémon we need!\\l\\n",
  "Now, we flee!\\c$",
]

[msg.section_0.entries.19]
text = [
  "[VAR TRNAME(1)]: Tch!\\n",
  "They run away like Patrat!\\c\\n",
  "OK! Let's go farther inside!\\n",
  "There might be more in there!\\c$",
]

[msg.section_0.entries.20]
text = [
  "???: I don't think that's\\n",
  "necessary, you two.\\c$",
]

[msg.section_0.entries.21]
text = [
  "[VAR TRNAME(1)]: Could you be\\n",
  "Gym Leader Burgh?\\c$",
]

[msg.section_0.entries.22]
text = [
  "Burgh: Yessir! One and the same!\\n",
  "I'm Burgh.\\c\\n",
  "And there was no one suspicious\\n",
  "beyond here!\\c$",
]

[msg.section_0.entries.23]
text = [
  "[VAR TRNAME(1)]: Is that...so?\\c$",
]

[msg.section_0.entries.24]
text = [
  "Burgh: Yes indeedy!\\c\\n",
  "I'm concerned about\\n",
  "Team Plasma as well.\\c\\n",
  "More importantly, shall\\n",
  "we leave this place?\\c\\n",
  "For some reason,\\n",
  "this sewer is bugging me.\\c$",
]

[msg.section_0.entries.25]
text = [
  "[VAR TRNAME(1)]: Huh...\\c\\n",
  "Didn't you and the other Gym Leaders\\n",
  "fight Team Plasma two years ago?\\c$",
]

[msg.section_0.entries.26]
text = [
  "[VAR TRNAME(1)]: Thanks for your help.\\n",
  "Here, use this!\\c$",
]

[msg.section_0.entries.27]
text = [
  "I'll find those other\\n",
  "Team Plasma punks!\\c\\n",
  "I... I'll never forgive Pokémon thieves!\\n",
  "No way!\\c$",
]

[msg.section_0.entries.28]
text = [
  "Burgh: He's gone...\\c$",
]

[msg.section_0.entries.29]
text = [
  "???: You there!\\c$",
]

[msg.section_0.entries.30]
text = [
  "That was an excellent demonstration\\n",
  "of battling. The way you brought out\\l\\n",
  "the power of your Pokémon against\\l\\n",
  "an opponent like Team Plasma...\\c\\n",
  "Astounding. Simply astounding.\\n",
  "Interesting as well. I see...\\c$",
]

[msg.section_0.entries.31]
text = [
  "Burgh: Who...was that?\\c$",
]

[msg.section_0.entries.32]
text = [
  "Well. No matter.\\n",
  "What are you going to do?\\c\\n",
  "You can stay here\\n",
  "and train your Pokémon.\\c\\n",
  "Or maybe you should come\\n",
  "challenge me, the Gym Leader!\\c\\n",
  "Be seeing you!\\c$",
]

[msg.section_0.entries.33]
text = [
  "Waitasecond!\\c\\n",
  "I dropped something here!\\n",
  "Just wait until I find it!$",
]

[msg.section_0.entries.34]
text = [
  "Waitasecond!\\c\\n",
  "I dropped something here!\\n",
  "Just wait until I find it!\\c$",
]

[msg.section_0.entries.35]
text = [
  "Phew...\\n",
  "I finally made it back here.\\c\\n",
  "Are you going farther inside?\\n",
  "There's nothing in there but Trainers.$",
]

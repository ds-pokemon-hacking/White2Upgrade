[msg.section_0.entries.0]
text = [
  "My great-great-great-grandfather and\\n",
  "his Gurdurr worked together and built\\l\\n",
  "this Village Bridge.$",
]

[msg.section_0.entries.1]
text = [
  "I'll be a stonecutter like my grandpa!\\n",
  "I can get help from powerful Pokémon!$",
]

[msg.section_0.entries.2]
text = [
  "If Team Plasma had tricked everyone\\n",
  "into releasing all their Pokémon,\\l\\n",
  "it would have been impossible\\l\\n",
  "to build a bridge like this.\\c\\n",
  "People and Pokémon are inseparable...\\c\\n",
  "The relationship is not more or less\\n",
  "than that. That's what I believe.$",
]

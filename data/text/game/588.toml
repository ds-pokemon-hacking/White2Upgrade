[msg.section_0.entries.0]
text = [
  "Hmm!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Wow! Wow!\\n",
  "What an awesome Trainer!\\c\\n",
  "That Pokémon you are traveling with\\n",
  "is Landorus in Therian Forme!\\c$",
]

[msg.section_0.entries.2]
text = [
  "A long, long time ago...\\c\\n",
  "Tornadus and Thundurus\\n",
  "started a rampage in Therian Forme.\\c\\n",
  "When everybody thought the Unova region\\n",
  "would be ruined and gave up hope,\\l\\n",
  "Landorus, also in Therian Forme,\\l\\n",
  "appeared out of nowhere\\l\\n",
  "and stopped them.\\c\\n",
  "That's what they say.\\c$",
]

[msg.section_0.entries.3]
text = [
  "Oh! Hey!\\n",
  "Wait a second.\\c$",
]

[msg.section_0.entries.4]
text = [
  "This has been placed in the shrine.\\n",
  "Take this.\\c$",
]

[msg.section_0.entries.5]
text = [
  "They say the Reveal Glass brings\\n",
  "Thundurus, Tornadus, and Landorus\\l\\n",
  "back to their original appearance.\\c\\n",
  "However, I don't know whether\\n",
  "Incarnate Forme or Therian Forme\\l\\n",
  "is the true Forme.\\c$",
]

[msg.section_0.entries.6]
text = [
  "Why do delicious vegetables grow in the\\n",
  "fields of Mistralton City?\\c\\n",
  "It's because the ones who grow them are\\n",
  "very picky about the mulch they use.\\c\\n",
  "It's good mulch. Strong mulch. It's\\n",
  "stored up a lot of energy from nature.\\l\\n",
  "And that makes it really stinky!\\c\\n",
  "Such a powerful aroma! It burns\\n",
  "all the way to the back of your nose!\\c\\n",
  "Aww. Just remembering it\\n",
  "makes me dizzy!\\c$",
]

[msg.section_0.entries.7]
text = [
  "The Funfest Mission\\n",
  "“[VAR FUNFESTMISSION(0)]\\\"\\l\\n",
  "has been added to the Entralink.$",
]

[msg.section_0.entries.8]
text = [
  "Stinky, stinky mulch\\n",
  "grows delicious vegetables!$",
]

[msg.section_0.entries.9]
text = [
  "So you know what Landorus is like\\n",
  "when it means business, huh?\\c$",
]

[msg.section_0.entries.10]
text = [
  "Yeah! I do!\\c\\n",
  "It changes into another Forme\\n",
  "and flies around the sky!\\c\\n",
  "Tornadus and Thundurus\\n",
  "change Formes, too!\\l\\n",
  "...Well, that's the story, anyway.$",
]

[msg.section_0.entries.11]
text = [
  "Yeah! I do!\\c\\n",
  "It changes into another Forme\\n",
  "and flies around the sky!\\c\\n",
  "Thundurus and Tornadus\\n",
  "change Formes, too!\\l\\n",
  "...Well, that's the story, anyway.$",
]

[msg.section_0.entries.12]
text = [
  "That's good, then!\\c\\n",
  "...You know, I've only heard\\n",
  "about it in stories, too.$",
]


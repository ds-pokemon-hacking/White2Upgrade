[msg.section_0.entries.16]
text = [
  "This little shrine is dedicated to a\\n",
  "Pokémon called Landorus.\\c\\n",
  "They say that when Tornadus and\\n",
  "Thundurus were whipping up storms that\\l\\n",
  "damaged houses and fields all over the\\l\\n",
  "Unova region, Landorus made them stop.\\c\\n",
  "That's a story from when my\\n",
  "grandpa was just a little kid!$",
]


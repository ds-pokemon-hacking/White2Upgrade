  "for this variable...[SPEED(0)]$",
]

[msg.section_0.entries.6]
text = [
  "[SPEED(1)]Fine...\\n",
  "I'll be waiting here for you, then.[SPEED(0)]\\c$",
]

[msg.section_0.entries.7]
text = [
  "[SPEED(1)]Fine...\\n",

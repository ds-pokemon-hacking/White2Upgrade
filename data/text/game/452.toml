[msg.section_0.entries.3]
text = [
  "[SPEED(1)]Actually...\\c\\n",
  "Rather than just leading you there,\\n",
  "I'd prefer to follow. That way, I can\\l\\n",
  "see which path you choose and observe\\l\\n",
  "what catches your interest.\\c\\n",
  "So, I ask this of you!\\c\\n",
  "Take me to the deepest chamber\\n",
  "of this castle![SPEED(0)]$",
]

[msg.section_0.entries.4]
text = [
  "[SPEED(1)]You lead and I'll follow![SPEED(0)]\\c$",
]

[msg.section_0.entries.5]
text = [
  "[SPEED(1)]What?\\c\\n",
  "You're leaving at a time like this?\\c\\n",

[msg]
trailing_data = "4040"

[msg.section_0.entries.0]
text = [
  "Colress: Welcome!\\c$",
]

[msg.section_0.entries.1]
text = [
  "I was asked by an acquaintance\\n",
  "to help with his research.\\c\\n",
  "What I desire is to bring out\\n",
  "the entirety of Pokémon potential!\\c\\n",
  "If I can accomplish that,\\n",
  "I don't care what it takes!\\c$",
]

[msg.section_0.entries.2]
text = [
  "If it means this strength must be\\n",
  "brought out by the interactions\\l\\n",
  "between Pokémon and Trainers,\\l\\n",
  "then so be it!\\c\\n",
  "If it means you have to use a merciless\\n",
  "approach, like Team Plasma's,\\l\\n",
  "and force out all of the Pokémon's power,\\l\\n",
  "then so be it!\\c\\n",
  "And yes, if the entire world\\n",
  "is destroyed as a result,\\l\\n",
  "then so be it...\\c$",
]

[msg.section_0.entries.3]
text = [
  "That aside!\\c\\n",
  "The reason I have been traveling all over\\n",
  "Unova and battling many Pokémon Trainers\\l\\n",
  "is because I was testing the viability of\\l\\n",
  "this approach to bringing out the full\\l\\n",
  "strength of Pokémon.\\c\\n",
  "In that respect, you've done\\n",
  "an amazing job.\\c\\n",
  "Well now! Tell me if you have\\n",
  "the answer I desire or not!\\c\\n",
  "If you're ready, come at me!$",
]

[msg.section_0.entries.4]
text = [
  "It looks like you're ready, then!\\n",
  "OK! Let us begin!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Colress: So strong!\\c\\n",
  "You're a very strong Trainer indeed!\\n",
  "So let me ask you this!\\c\\n",
  "Are you thinking of reaching\\n",
  "even higher heights by understanding\\l\\n",
  "each other as Pokémon and Trainer?$",
]

[msg.section_0.entries.6]
text = [
  "I see...\\c\\n",
  "To me, that is an ideal answer.\\c\\n",
  "To think! That's what you\\n",
  "actually believe!\\c\\n",
  "You bring out the power of your\\n",
  "Pokémon with respect and love!\\c$",
]

[msg.section_0.entries.7]
text = [
  "I see...\\c\\n",
  "Is that answer my truth?\\c\\n",
  "Even if that's your answer,\\n",
  "don't give up!\\c\\n",
  "The reason you're so strong\\n",
  "is that you treat your Pokémon\\l\\n",
  "with respect and love!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Excuse me for repeating myself,\\n",
  "but if it will make Pokémon stronger,\\l\\n",
  "I don't care what it takes!\\c\\n",
  "If interacting with Pokémon can increase\\n",
  "their powers only to a certain point,\\l\\n",
  "then their full strength must be brought\\l\\n",
  "out using a scientific approach.\\l\\n",
  "Even one without a conscience.\\c$",
]

[msg.section_0.entries.9]
text = [
  "But you have shown me the\\n",
  "potential of your approach.\\c\\n",
  "To me, whether Team Plasma wins\\n",
  "or whether you win will decide\\l\\n",
  "how the relationship between\\l\\n",
  "people and Pokémon should be!\\c\\n",
  "So where will this be settled?\\c\\n",
  "Step on the warp panel on the other\\n",
  "side of the room where Kyurem is\\l\\n",
  "being held.\\c\\n",
  "Good luck in your battle!$",
]

[msg.section_0.entries.10]
text = [
  "Colress: Could I say that you're\\n",
  "curious for coming clear out here?\\c\\n",
  "I dissolved Team Plasma.\\c\\n",
  "The ones who are left here are deciding\\n",
  "what they want to do.\\c\\n",
  "I would like to have them decide\\n",
  "how to live on their own!\\c\\n",
  "There are far more questions in this\\n",
  "world that don't have any answers!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Well then...\\c\\n",
  "Please show me you and your\\n",
  "Pokémon's strength once again!\\c$",
]

[msg.section_0.entries.12]
text = [
  "In Pokémon battles where you can't\\n",
  "afford to make a mistake,\\l\\n",
  "the true nature of the Trainer's\\l\\n",
  "personality becomes clear.\\c\\n",
  "I see!\\c\\n",
  "If Trainers believe in their Pokémon\\n",
  "to the fullest extreme, as you do,\\l\\n",
  "their Pokémon partners will also\\l\\n",
  "give everything they have!\\c\\n",
  "So that must be the answer\\n",
  "I've been looking for.\\c\\n",
  "Still, I'm glad you won.\\c\\n",
  "For one thing, I detested Ghetsis\\n",
  "from the start!\\c$",
]

[msg.section_0.entries.13]
text = [
  "Take this with you!\\c\\n",
  "This Master Ball can catch\\n",
  "any kind of Pokémon!\\c\\n",
  "Ghetsis was saving it,\\n",
  "but you'll probably put it to better use!\\c$",
]

[msg.section_0.entries.14]
text = [
  "If you'd like, please have a\\n",
  "Pokémon battle with me again!\\c\\n",
  "Indeed, I'm having trouble deciding\\n",
  "what to do next as well.$",
]

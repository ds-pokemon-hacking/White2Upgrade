  "...$",
]

[msg.section_0.entries.166]
text = [
  "Narrator: On “The Pokémon Whisperer,\\\"\\n",
  "Pokémon with many different problems\\l\\n",
  "are brought to Pokémon Breeder Paul,\\l\\n",
  "who works to build a good relationship.\\c\\n",
  "Today's problem Pokémon is\\n",
  "a runaway Audino!\\c\\n",
  "Since it can tell how people feel,\\n",
  "it can also detect bad things,\\l\\n",
  "and it no longer trusts people.\\c\\n",
  "Wanting to teach it that people\\n",
  "aren't all that bad, Paul sets\\l\\n",
  "off in search of Audino!\\c\\n",
  "Paul: Audino! Where are you?\\c\\n",
  "Narrator: Paul searches deserts,\\n",
  "cities, even the depths of the ocean,\\l\\n",
  "but is unable to find it...\\c\\n",
  "Paul: Oh! What's that?\\c\\n",
  "Narrator: Finally, Paul finds\\n",
  "Audino in the depths of the forest!\\c\\n",

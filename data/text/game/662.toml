]

[msg.section_0.entries.165]
text = [
  "Narrator: On this episode of\\n",
  "“The Pokémon Whisperer,\\\" we will finish\\l\\n",
  "the story of Stunfisk in Love!\\c\\n",
  "Paul takes the depressed, lovelorn\\n",
  "Stunfisk to the swamp!\\l\\n",
  "And here's what they find...\\c\\n",
  "Stunfisk: Unnnnnn!\\c\\n",
  "Paul: What?\\c\\n",
  "That Stunfisk over there\\n",
  "is the one who left you?\\c\\n",
  "Stunfisk: Unnn...\\c\\n",
  "Paul: Oh, my. And it's hanging out with\\n",
  "a new Stunfisk now...\\c\\n",
  "Narrator: Paul is at a loss for words.\\n",
  "But then, the lovelorn Stunfisk\\l\\n",
  "takes him by surprise!\\c\\n",
  "Paul: Wait! You're going over there\\n",

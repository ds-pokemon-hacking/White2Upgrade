  "Agehunt! A-ge-ha-n-to!\\c\\n",
  "The “hunt\\\" part makes it sound\\n",
  "ferocious for such a pretty Pokémon.\\c\\n",
  "OK, see you next week!\\n",
  "Farewell!\\c\\n",
  "...$",
]

[msg.section_0.entries.160]

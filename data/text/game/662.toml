  "makes a terrible mistake...\\c\\n",
  "We'll continue the story of\\n",
  "What Audino Wants next time!\\c\\n",
  "...$",
]

[msg.section_0.entries.167]
text = [
  "Narrator: On this episode of\\n",
  "“The Pokémon Whisperer,\\\" the story of\\l\\n",
  "What Audino Wants continues!\\c\\n",
  "Paul finally finds the runaway Audino and\\n",
  "tries to talk to it...\\c\\n",
  "Paul: I know you can sense negative\\n",
  "things about people, and that's\\l\\n",
  "what scared you away!\\c\\n",
  "But there are so many good things\\n",
  "about people, too!\\l\\n",
  "Please give us another chance!\\c\\n",
  "Narrator: Startled by Paul's\\n",
  "shouting, Audino runs away again!\\c\\n",
  "That's right! Because Audino have such\\n",
  "good hearing, they dislike loud noises...\\l\\n",
  "and Paul has a hard time talking quietly!\\c\\n",
  "Paul: Guess that was a bad idea, huh...\\c\\n",
  "Narrator: Paul's usual way of doing\\n",
  "things won't work this time!\\c\\n",
  "How will he communicate\\n",
  "his feelings to Audino?\\c\\n",
  "Watch next week for the conclusion\\n",
  "to What Audino Wants, and find out\\l\\n",
  "how Paul solves this dilemma!\\c\\n",
  "...$",
]

[msg.section_0.entries.168]
text = [
  "Narrator: On this episode of\\n",
  "“The Pokémon Whisperer,\\\" it's\\l\\n",
  "the conclusion of What Audino Wants!\\c\\n",
  "A worried Paul searches once again\\n",
  "for a runaway Audino, after scaring it\\l\\n",
  "away by shouting.\\c\\n",
  "Paul: This is so hard!\\n",
  "How can I communicate to Audino\\l\\n",
  "without shouting?\\l\\n",
  "I want to tell it so many things!\\c\\n",
  "Narrator: After a long journey, he finds\\n",
  "Audino in a cave deep in the mountains.\\c\\n",
  "With a great effort, he manages not\\n",
  "to shout about his feelings. Instead, he\\l\\n",
  "runs up to Audino and gives it a big hug!\\c\\n",
  "Paul: Audino...\\c\\n",
  "Narrator: Audino can sense\\n",
  "people's feelings.\\c\\n",
  "When it senses Paul's intense, sincere\\n",
  "caring for Pokémon, its distrust\\l\\n",
  "of humans melts away...\\c\\n",
  "Paul: That's right! If you sincerely\\n",
  "care about Pokémon, they will understand\\l\\n",
  "even if you don't use words!\\c\\n",
  "It's your feelings that are important!\\c\\n",
  "...$",
]

[msg.section_0.entries.169]
text = [
  "Narrator: On today's special episode\\n",
  "of “The Pokémon Whisperer,\\\" the\\l\\n",
  "dedicated Breeder Paul talks about\\l\\n",
  "special techniques for getting along\\l\\n",
  "with Pokémon!\\c\\n",
  "This is a must-watch\\n",
  "episode for all Trainers!\\c\\n",
  "Paul: Let's begin right away!\\n",
  "When you meet a Pokémon,\\l\\n",
  "these things are very important!\\c\\n",
  "Tip 1: Talk loudly!\\n",
  "Tip 2: Act sincerely!\\l\\n",
  "Tip 3: Capture its interest!\\l\\n",
  "Tip 4: Open up to it!\\c\\n",
  "With these techniques, any Pokémon\\n",
  "will hop into the Poké Ball you throw\\l\\n",
  "with just one try!\\c\\n",
  "Remember these tips with “TACO.\\\"\\n",
  "I'm more of a pasta guy, though...\\l\\n",
  "OK! See you next week!\\c\\n",
  "...$",
]

[msg.section_0.entries.170]
text = [
  "Narrator: On today's special episode\\n",
  "of “The Pokémon Whisperer,\\\" the\\l\\n",
  "dedicated Breeder Paul talks about\\l\\n",
  "how to raise Pokémon.\\c\\n",
  "These tips will help get any Pokémon\\n",
  "on the road to success.\\c\\n",
  "Paul: Take good notes!\\n",
  "First, gently let the Pokémon\\l\\n",
  "out of the Poké Ball!\\c\\n",
  "Then loudly tell it how much you enjoy\\n",
  "its company! Shouting is best!\\c\\n",
  "That's it! Just repeat this\\n",
  "30 times a day!\\l\\n",
  "They'll grow with the power of love!\\l\\n",
  "...Probably!\\c\\n",
  "OK. See you next week!\\c\\n",
  "...$",
]

[msg.section_0.entries.171]
text = [
  "Best of Sinnoh TV\\c\\n",
  "I was just your average girl until I was\\n",
  "literally stricken by a ThunderShock.\\c\\n",
  "It was love at first sight, baby!\\n",
  "And my target, a Gym Leader!\\c\\n",
  "I didn't have any Pokémon then, but\\n",
  "not a problem for a resourceful gal!\\c\\n",
  "The answer was simple!\\n",
  "And we all know simple is best!\\c\\n",
  "I just had to become a Trainer.\\n",
  "That's all it took for me!\\c\\n",
  "“The Diary of a Poké Romantic\\\" will soon\\n",
  "make its debut!\\c\\n",
  "The pilot episode: “Love at First\\n",
  "Sight! The Rules of the Move Attract!\\\"\\c\\n",
  "By the way, how did everyone get their\\n",
  "first Pokémon anyway?\\c\\n",
  "...$",
]

[msg.section_0.entries.172]
text = [
  "Best of Sinnoh TV\\c\\n",
  "After some fits and starts, a childhood\\n",
  "friend gave me my first Pokémon!\\c\\n",
  "...But it was a Kricketot.\\n",
  "When I don't like the legs of bugs...\\c\\n",
  "I bet he gave me this because I picked\\n",
  "on him when he was little...\\c\\n",
  "But though the road has been long and\\n",
  "hard, I'm finally at the starting line!\\c\\n",
  "Next week: “The Diary of a Poké\\n",
  "Romantic,\\\" episode 2!\\c\\n",
  "“The Maiden in Love and the Kricketot.\\n",
  "The Magic of Romance Never Ends!\\\"\\c\\n",
  "Oh, this Kricketot is a female.\\n",
  "Maybe we can be friends.\\c\\n",
  "...$",
]

[msg.section_0.entries.173]
text = [
  "Best of Sinnoh TV\\c\\n",
  "I checked out my Kricketot and learned\\n",
  "about its moves.\\c\\n",
  "...It only knows Growl and Bide.\\n",
  "That's worse than just challenging!\\c\\n",
  "I was about to say that, when my\\n",
  "childhood friend stopped me.\\c\\n",
  "“Let it hold an Oran Berry so that\\n",
  "it can survive while using Bide.\\\"\\c\\n",
  "Hey, that's smart!\\n",
  "That's from a former Bug Catcher!\\c\\n",
  "While we're at it, can I have an Oran\\n",
  "Berry, too?\\c\\n",
  "Next week: “The Diary of a Poké\\n",
  "Romantic,\\\" episode 3!\\c\\n",
  "“Love Conquers All. Covering Weakness\\n",
  "with Ideas!\\\"\\c\\n",
  "We're a Trainer and Pokémon now!\\n",
  "We'll get stronger together!\\c\\n",
  "...$",
]

[msg.section_0.entries.174]
text = [
  "Best of Sinnoh TV\\c\\n",
  "I had my first ever Pokémon battle,\\n",
  "and it ended badly...\\c\\n",
  "My childhood friend, a former\\n",
  "Bug Catcher, had this to say.\\c\\n",
  "“Pokémon get tougher by battling.\\n",
  "The key to victory is type matchups.\\\"\\c\\n",
  "Type matchups?\\n",
  "Types affect battles?\\c\\n",
  "The only type matchup I care about is\\n",
  "with that Gym Leader!\\c\\n",
  "Next week: “The Diary of a Poké\\n",
  "Romantic,\\\" episode 4!\\c\\n",
  "“Type Matchups Settle Battles!\\n",
  "Moves That Exploit Weak Points!\\\"\\c\\n",
  "Fire, Flying, and Rock...\\n",
  "Kricketot has some disadvantages!\\c\\n",
  "...$",
]

[msg.section_0.entries.175]
text = [
  "Best of Sinnoh TV\\c\\n",
  "We'd win a battle, and lose one.\\n",
  "Lose one, then win one.\\c\\n",
  "Though it was discouraging, I had to\\n",
  "keep battling to toughen us up.\\c\\n",
  "With me and Kricketot, it was always\\n",
  "three steps forward, two steps back.\\c\\n",
  "But we were getting stronger. Then one\\n",
  "day, Kricketot started to shine!\\c\\n",
  "Next week: “The Diary of a Poké\\n",
  "Romantic,\\\" episode 5!\\c\\n",
  "“Kricketot Becomes Kricketune! Watch\\n",
  "Me! I'll Change, Too!\\\"\\c\\n",
  "And, to cancel evolution, press the\\n",
  "B Button... Tell me that first!\\c\\n",
  "...$",
]

[msg.section_0.entries.176]
text = [
  "Best of Sinnoh TV\\c\\n",
  "After Kricketot evolved, it became\\n",
  "stronger as Kricketune.\\c\\n",
  "We also got other Pokémon, so we could\\n",
  "go farther and farther from home.\\c\\n",
  "But where is my beloved Gym Leader?\\n",
  "Where is that city he said he's from?\\c\\n",
  "I do have the Town Map, but maps\\n",
  "baffle me.\\c\\n",
  "It doesn't matter, though.\\n",
  "If we keep moving, we'll get somewhere.\\c\\n",
  "Next week: “The Diary of a Poké\\n",
  "Romantic,\\\" episode 6!\\c\\n",
  "“How Is This Possible? Pokémon Gyms\\n",
  "Can't Be Found Everywhere!\\\"\\c\\n",
  "The more lost you are, the less useful\\n",
  "a map becomes! You know it's true!\\c\\n",
  "...$",
]

[msg.section_0.entries.177]
text = [
  "Best of Sinnoh TV\\c\\n",
  "Our journey was long, and it was hard.\\n",
  "But no one wants to hear that!\\c\\n",
  "So, I finally found my Gym Leader.\\n",
  "But, he has an incurable disease!\\c\\n",
  "He begged me, out of the blue, with his\\n",
  "last wish.\\c\\n",
  "He asked for my Pokémon!\\n",
  "But my Kricketune's my partner!\\c\\n",
  "Next week: “The Diary of a Poké\\n",
  "Romantic,\\\" episode 7!\\c\\n",
  "“My Trail of Footprints Shortened\\n",
  "the Distance Between Us!\\\"\\c\\n",
  "Every time I see Kricketune's face, I\\n",
  "get reminded of our time together...\\c\\n",
  "...$",
]

[msg.section_0.entries.178]
text = [
  "Best of Sinnoh TV\\c\\n",
  "My beloved Gym Leader, whom I\\n",
  "fought so hard to meet, was a fraud!\\c\\n",
  "How dare he con this pure maiden!\\n",
  "How dare he toy with my emotions!\\c\\n",
  "But whose fault was it?\\n",
  "Was it mine for being taken in?\\c\\n",
  "All I know is that my tears overflow,\\n",
  "and despair is my world...\\c\\n",
  "Next week: “The Diary of a Poké\\n",
  "Romantic,\\\" episode 8!\\c\\n",
  "“Kricketune and I! Our Bond Is True!\\\"\\c\\n",
  "That Gym Leader's eating a Giga Impact\\n",
  "for playing me for a fool!\\c\\n",
  "...$",
]

[msg.section_0.entries.179]
text = [
  "Best of Sinnoh TV\\c\\n",
  "Having defeated the fake Gym Leader,\\n",
  "Kricketune and I stood in a daze.\\c\\n",
  "We were spent. Drained by a romance\\n",
  "that ended as a nightmare.\\c\\n",
  "It was then my childhood friend, the\\n",
  "former Bug Catcher, arrived.\\c\\n",
  "He did more than that.\\n",
  "He confessed his love to me!\\c\\n",
  "“I wanted to become an Elite Four\\n",
  "member, so I quit as a Gym Leader.\\c\\n",
  "But, then, that faker appeared.\\n",
  "You took care of him, though!\\\"\\c\\n",
  "Wait, ex-Bug Catcher! What?\\n",
  "What are you saying?!\\c\\n",
  "Next week: “The Diary of a Poké\\n",
  "Romantic,\\\" final episode!\\c\\n",
  "“Do it, Kricketune! Silver Wind over\\n",
  "Sinnoh Skies!\\\"\\c\\n",
  "You were laughing at me for falling for\\n",
  "that fraud, weren't you?\\c\\n",
  "...$",
]


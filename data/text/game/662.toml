[msg.section_0.entries.163]
text = [
  "Narrator: On this episode of\\n",
  "“The Pokémon Whisperer,\\\" we will finish\\l\\n",
  "the story of Taming Timburr!\\c\\n",
  "Last time, Paul was approaching Timburr\\n",

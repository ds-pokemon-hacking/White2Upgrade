  "Stunfisk: Un! Un!\\c\\n",
  "Narrator: Stunfisk professes\\n",
  "its affection yet again...and is\\l\\n",
  "rejected once more!\\c\\n",
  "Stunfisk: Uuuuuuunnn!\\c\\n",
  "Narrator: But in the process, Stunfisk\\n",

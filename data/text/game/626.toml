[msg.section_0.entries.0]
text = [
  "What's this?\\c\\n",
  "You and your Pokémon\\n",
  "somehow resemble one another!\\c\\n",
  "I'm sure you came to look like\\n",
  "one another during all of the time\\l\\n",
  "you spent together!$",
]

[msg.section_0.entries.1]
text = [
  "What's this?\\c\\n",
  "You and your Pokémon\\n",
  "somehow resemble one another!$",
]

[msg.section_0.entries.2]
text = [
  "Do you like Pokémon?$",
]

[msg.section_0.entries.3]
text = [
  "Yes, yes, you have Pokémon with you,\\n",
  "so I'm sure you do!$",
]

[msg.section_0.entries.4]
text = [
  "That so? Then why are you\\n",
  "on a journey with Pokémon?$",
]

[msg.section_0.entries.5]
text = [
  "Now, I wonder which person\\n",
  "was the first person in the\\l\\n",
  "world to get along with Pokémon...$",
]

[msg.section_0.entries.6]
text = [
  "See my Audino?\\c\\n",
  "She popped out of the\\n",
  "swaying tall grass just to meet me!$",
]

[msg.section_0.entries.7]
text = [
  "Di chee! ♪$",
]

[msg.section_0.entries.8]
text = [
  "Sorry to bother you, but I like low\\n",
  "places like this and little tiny things.\\c\\n",
  "Tiny Pokémon are the most interesting!\\c\\n",
  "I particularly like Pokémon that have a\\n",
  "height of eight inches or less.\\c\\n",
  "By the way...\\n",
  "Do you have any tiny Pokémon?\\c\\n",
  "If you do, could you show me?$",
]

[msg.section_0.entries.9]
text = [
  "Will you show me a tiny Pokémon?$",
]

[msg.section_0.entries.10]
text = [
  "Wow! Amazing!\\n",
  "[VAR PKNAME(0)] is so tiny!\\c\\n",
  "I wonder what it would feel like\\n",
  "to become [VAR PKNAME(0)]...\\c\\n",
  "I bet I'd get a way different outlook\\n",
  "on life...\\c\\n",
  "Just imagining it gets me excited!\\n",
  "Tiny things are super interesting!$",
]

[msg.section_0.entries.11]
text = [
  "Hm...\\c\\n",
  "You don't even have a teensy\\n",
  "number of tiny Pokémon.\\c\\n",
  "I'd sure like to see a Pokémon\\n",
  "that's eight inches high or smaller...$",
]

[msg.section_0.entries.12]
text = [
  "Thanks for showing me a tiny Pokémon!\\n",
  "It was super interesting!\\c\\n",
  "I'd sure like it if you'd\\n",
  "show me one again tomorrow...$",
]

[msg.section_0.entries.13]
text = [
  "You know what?!\\c\\n",
  "I love high places like this,\\n",
  "and really big things!\\c\\n",
  "My favorite Pokémon\\n",
  "are big ones, too!\\c\\n",
  "What I mean by big, you know,\\n",
  "is being more than 17 feet tall!\\c\\n",
  "C'mon! If you have a big\\n",
  "Pokémon, show it to me!$",
]

[msg.section_0.entries.14]
text = [
  "Have you come to show me a big Pokémon?$",
]

[msg.section_0.entries.15]
text = [
  "Wow! Amazing!\\n",
  "[VAR PKNAME(0)] is sooooo big!\\c\\n",
  "Riding on top of [VAR PKNAME(0)]\\n",
  "would be so much fun!\\c\\n",
  "When you look from high places, you can\\n",
  "see rooftops and faraway mountains\\l\\n",
  "and other things you usually can't see.\\c\\n",
  "That's why I like big things so much!$",
]

[msg.section_0.entries.16]
text = [
  "What?!\\n",
  "No big Pokémon for me?\\c\\n",
  "I wanna see a Pokémon\\n",
  "bigger than 17 feet!$",
]

[msg.section_0.entries.17]
text = [
  "Big thanks for showing me a big Pokémon!\\c\\n",
  "I'd be even more happy if you'd show me\\n",
  "one tomorrow, too!$",
]

[msg.section_0.entries.18]
text = [
  "My cute little Foongus\\n",
  "looks just like a Poké Ball!$",
]

[msg.section_0.entries.19]
text = [
  "This is a Foongus?$",
]

[msg.section_0.entries.20]
text = [
  "Accumula Town\\n",
  "The Fast-Growing Town!$",
]

[msg.section_0.entries.0]
text = [
  "Cheren's Dad: Hm? That's Aspertia City's\\n",
  "Gym Badge you have there!\\c\\n",
  "...\\c\\n",
  "Wow, so you were the first challenger\\n",
  "of my son's Gym!\\c\\n",
  "Thanks! A Gym Leader without\\n",
  "challengers is just an ordinary Trainer!\\c\\n",
  "In other words, thanks to you, Cheren\\n",
  "became a real Gym Leader!\\l\\n",
  "Let me give you this as thanks!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Cheren's Dad: Traveling is great!\\c\\n",
  "You encounter so much you've never seen\\n",
  "and many things you don't\\l\\n",
  "yet understand.\\c\\n",
  "For each new thing you come across,\\n",
  "you grow and change a little bit more!$",
]

[msg.section_0.entries.2]
text = [
  "Cheren's Mom: Oh my...\\n",
  "You resemble [VAR TRNAME(1)] somehow...\\c\\n",
  "Your name's [VAR TRNAME(0)], you say?\\n",
  "Wow! You have a Pokédex, too!\\c\\n",
  "Everyone grows up like this\\n",
  "now, don't they?$",
]

[msg.section_0.entries.3]
text = [
  "Cheren's Mom: Oh... So your name's\\n",
  "[VAR TRNAME(0)], then.\\c\\n",
  "Wow! You have a Pokédex, too!\\c\\n",
  "Everyone grows up like this now,\\n",
  "don't they?$",
]

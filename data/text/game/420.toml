[msg]
trailing_data = "fefe"

[msg.section_0.entries.0]
text = [
  "Argh! Loud! It's way too noisy!\\c\\n",
  "It's all the trains! They never stop!\\c\\n",
  "When the train runs below,\\n",
  "it's unbearably noisy!$",
]

[msg.section_0.entries.1]
text = [
  "To be more specific...\\n",
  "The noise level is about 70 decibels!\\c\\n",
  "It's as noisy as the main street\\n",
  "in Castelia City\\l\\n",
  "when there are a lot of people!$",
]

[msg.section_0.entries.2]
text = [
  "To be more specific...\\n",
  "The noise level is about 80 decibels!\\c\\n",
  "It's as noisy as loud people!$",
]

[msg.section_0.entries.3]
text = [
  "To be more specific...\\n",
  "The noise level is about 100 decibels!\\c\\n",
  "It's as noisy as the horn of\\n",
  "a truck right next to my ear!$",
]

[msg.section_0.entries.4]
text = [
  "To be more specific...\\n",
  "The noise level is about 120 decibels!\\c\\n",
  "It's as noisy as an engine of a plane\\n",
  "in top gear!$",
]

[msg.section_0.entries.5]
text = [
  "Argh! So loud! If we just had a Pokémon\\n",
  "with the Soundproof Ability, we could\\l\\n",
  "make all this noise go away!$",
]

[msg.section_0.entries.6]
text = [
  "Oh, hey! Hey!\\c\\n",
  "That [VAR PKNAME(0)]'s Ability is\\n",
  "Soundproof, isn't it?\\c\\n",
  "Great! I'll catch my own [VAR PKNAME(0)]\\n",
  "and get rid of all this noise!\\c\\n",
  "Wait! What was that? I can't hear you!\\n",
  "Argh! It's not getting any quieter!\\c\\n",
  "Even though your [VAR PKNAME(0)]\\n",
  "with the Soundproof Ability\\l\\n",
  "is right here, it's still so noisy.\\c\\n",
  "...\\c\\n",
  "Could it be?\\n",
  "Am I the one making the most noise?$",
]

[msg.section_0.entries.7]
text = [
  "This is what I've discovered.\\c\\n",
  "When I speak in a low voice,\\n",
  "I don't mind the train noise.\\c\\n",
  "I was the one being noisy, after all...\\c\\n",
  "Thanks to you and your [VAR PKNAME(0)],\\n",
  "now I know. Thank you.$",
]

[msg.section_0.entries.8]
text = [
  "We were riding our motorbikes\\n",
  "to our hearts' content...\\c\\n",
  "We believed we could\\n",
  "ride forever and ever...\\c\\n",
  "Yes, it's an infinite,\\n",
  "limitless, breakneck road...\\c\\n",
  "With the breakneck team, Black Empoleon!\\c\\n",
  "Back when I had a one-on-one\\n",
  "battle with [VAR TRNAME(1)]...\\l\\n",
  "that was our golden age.\\c\\n",
  "It was the age of gold.$",
]

[msg.section_0.entries.9]
text = [
  "We were riding our motorbikes\\n",

[msg.section_0.entries.97]
text = [
  "In the Global Terminal, you can\\n",
  "trade Pokémon with Pokémon fans from\\l\\n",
  "around the world by connecting to\\l\\n",
  "Nintendo Wi-Fi Connection.\\c\\n",
  "For details, please listen to the\\n",
  "explanation at each facility.\\c$",
]

[msg.section_0.entries.98]
text = [
  "Since the system was turned off or lost\\n",
  "power during a Wi-Fi Competition or\\l\\n",
  "a Random Matchup, you cannot participate\\l\\n",
  "in a competition or a Random Matchup\\l\\n",
  "for one hour.\\c\\n",
  "Please come back again\\n",
  "after one hour has passed.$",
]

[msg.section_0.entries.99]
text = [
  "System turned off or loses power$",
]

[msg.section_0.entries.100]
text = [
  "Be aware that if the system is turned\\n",
  "off or loses power during a\\l\\n",
  "Wi-Fi Competition or a Random Matchup,\\l\\n",
  "you cannot participate in a competition\\l\\n",
  "or a Random Matchup again for one hour.\\c$",
]

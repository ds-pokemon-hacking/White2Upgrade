  "Confirm$",
]

[msg.section_0.entries.79]
text = [
  "Rules$",
]

[msg.section_0.entries.80]
text = [
  "Back$",
]

[msg.section_0.entries.81]
text = [
  "For a Single Battle, you need to have\\n",
  "three to six Pokémon.\\c\\n",
  "Before a battle, you and your opponent\\n",
  "show your Pokémon to each other,\\l\\n",
  "then choose three Pokémon and battle.\\c\\n",
  "You may not have duplicate Pokémon\\n",
  "or duplicate held items.\\c\\n",
  "Also, you can't take special Pokémon\\n",
  "or Eggs into battle.\\c$",
]

[msg.section_0.entries.82]
text = [
  "For a Double Battle, you need to have\\n",
  "four to six Pokémon.\\c\\n",
  "Before a battle, you and your opponent\\n",
  "show your Pokémon to each other,\\l\\n",
  "then choose four Pokémon and battle.\\c\\n",
  "You may not have duplicate Pokémon\\n",
  "or duplicate held items.\\c\\n",
  "Also, you can't take special Pokémon\\n",
  "or Eggs into battle.\\c$",
]

[msg.section_0.entries.83]
text = [
  "For a Triple Battle, you need to have\\n",
  "six Pokémon.\\c\\n",
  "Before a battle, you and your opponent\\n",
  "show your Pokémon to each other,\\l\\n",
  "then decide their order and battle.\\c\\n",
  "You may not have duplicate Pokémon\\n",
  "or duplicate held items.\\c\\n",
  "Also, you can't take special Pokémon\\n",
  "or Eggs into battle.\\c$",
]

[msg.section_0.entries.84]
text = [
  "In a Rotation Battle, you need to have\\n",
  "four to six Pokémon.\\c\\n",
  "Before a battle, you and your opponent\\n",
  "show your Pokémon to each other,\\l\\n",
  "then choose four Pokémon and battle.\\c\\n",
  "You may not have duplicate Pokémon\\n",
  "or duplicate held items.\\c\\n",
  "Also, you can't take special Pokémon\\n",
  "or Eggs into battle.\\c$",
]

[msg.section_0.entries.85]
text = [
  "In a Launcher Battle, you have a\\n",
  "Triple Battle with your Wonder Launcher.\\l\\n",
  "You need to have six Pokémon.\\c\\n",
  "Before a battle, you and your opponent\\n",
  "show your Pokémon to each other,\\l\\n",
  "then decide their order and battle.\\c\\n",
  "You may not have duplicate Pokémon\\n",
  "or duplicate held items.\\c\\n",
  "Also, you can't take special Pokémon\\n",
  "or Eggs into battle.\\c$",
]


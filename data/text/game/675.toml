[msg.section_0.entries.0]
text = [
  "Welcome to the Global Terminal!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Would you like to use\\n",
  "Nintendo Wi-Fi Connection?$",
]

[msg.section_0.entries.2]
text = [
  "Please do visit again.$",
]

[msg.section_0.entries.3]
text = [
  "                     $$",
]

[msg.section_0.entries.4]
text = [
  "Right this way, please.\\c$",
]

[msg.section_0.entries.5]
text = [
  "In the Global Terminal, you can battle or\\n",
  "trade Pokémon with Pokémon fans from\\l\\n",
  "around the world by connecting to\\l\\n",
  "Nintendo Wi-Fi Connection.\\c\\n",
  "For details, please listen to the\\n",
  "explanation at each facility.\\c$",
]

[msg.section_0.entries.6]
text = [
  "Sorry, we're getting things ready.\\n",
  "Please come back later.$",
]

[msg.section_0.entries.7]
text = [
  "You have at least one Pokémon\\n",
  "that can't be taken in.$",
]

[msg.section_0.entries.8]
text = [
  "Communication error.$",
]

[msg.section_0.entries.9]
text = [
  "Random Matchup$",
]

[msg.section_0.entries.10]
text = [
  "Global Trade$",
]

[msg.section_0.entries.11]
text = [
  "Musical Photos$",
]

[msg.section_0.entries.12]
text = [
  "Battle Videos$",
]

[msg.section_0.entries.13]
text = [
  "Info$",
]

[msg.section_0.entries.14]
text = [
  "Cancel$",
]

[msg.section_0.entries.15]
text = [
  "Would you like to make a Global Trade?$",
]

[msg.section_0.entries.16]
text = [
  "You may trade Pokémon with other\\n",
  "Pokémon fans from around the world with\\l\\n",
  "Global Trade.\\c\\n",
  "Global Trade has two forms: GTS and\\n",
  "GTS Negotiations.\\c\\n",
  "Please be careful, because each has a\\n",
  "different way of trading.\\c$",
]

[msg.section_0.entries.17]
text = [
  "GTS$",
]

[msg.section_0.entries.18]
text = [
  "GTS Negotiations$",
]

[msg.section_0.entries.19]
text = [
  "Info$",
]

[msg.section_0.entries.20]
text = [
  "Back$",
]

[msg.section_0.entries.21]
text = [
  "Would you like to make a GTS trade?$",
]

[msg.section_0.entries.22]
text = [
  "Trade$",
]

[msg.section_0.entries.23]
text = [
  "Info$",
]

[msg.section_0.entries.24]
text = [
  "Back$",
]

[msg.section_0.entries.25]
text = [
  "You may trade Pokémon in two ways when\\n",
  "using GTS.\\c\\n",
  "You may offer a Pokémon for trade\\n",
  "or search among offered Pokémon.\\c$",
]

[msg.section_0.entries.26]
text = [
  "Should I describe things in\\n",
  "greater detail?$",
]

[msg.section_0.entries.27]
text = [
  "You will be asked to put up the\\n",
  "Pokémon you are offering to trade.\\c\\n",
  "At that time, you will be asked what\\n",
  "Pokémon you would like in return.\\c\\n",
  "If another player offers your desired\\n",
  "Pokémon in return for your offered\\l\\n",
  "Pokémon, the trade will go through.\\c$",
]

[msg.section_0.entries.28]
text = [
  "You may search among the Pokémon\\n",
  "that are offered by other Trainers.\\c\\n",
  "They will all identify what Pokémon\\n",
  "their Trainers want back in return.\\c\\n",
  "If you find one that you want, you\\n",
  "must provide us with the kind of\\l\\n",
  "Pokémon wanted in return.\\c$",
]

[msg.section_0.entries.29]
text = [
  "Offer Pokémon?$",
]

[msg.section_0.entries.30]
text = [
  "Seek Pokémon?$",
]

[msg.section_0.entries.31]
text = [
  "Understood$",
]

[msg.section_0.entries.32]
text = [
  "Would you like to start\\n",
  "Pokémon GTS Negotiations?$",
]

[msg.section_0.entries.33]
text = [
  "Start Negotiations$",
]

[msg.section_0.entries.34]
text = [
  "Info$",
]

[msg.section_0.entries.35]
text = [
  "Back$",
]

[msg.section_0.entries.36]
text = [
  "In GTS Negotiations, you set the trading\\n",
  "conditions based on what kinds of\\l\\n",
  "Pokémon you'd like to trade.\\c\\n",
  "If you find a person with matching\\n",
  "conditions, you may proceed to a\\l\\n",
  "Negotiation Trade with that person.\\c\\n",
  "In order to trade, you need to have two\\n",
  "or more Pokémon in your party.\\c$",
]

[msg.section_0.entries.37]
text = [
  "Should I describe things in\\n",
  "greater detail?$",
]

[msg.section_0.entries.38]
text = [
  "In a Negotiation Trade, each person\\n",
  "offers three Pokémon to trade.\\c\\n",
  "Then, each person will choose one of the\\n",
  "other person's three Pokémon.\\c$",
]

[msg.section_0.entries.39]
text = [
  "You can set three conditions in a\\n",
  "Negotiation Trade: the level of Pokémon\\l\\n",
  "to trade, the Pokémon you want to\\l\\n",
  "receive, and the Pokémon up for offer.\\c\\n",
  "You may trade with a person whose\\n",
  "conditions match yours, or choose\\l\\n",
  "Trade Rendezvous to try another trade\\l\\n",
  "with a previous trading partner.\\c$",
]

[msg.section_0.entries.40]
text = [
  "Negotiation Trade?$",
]

[msg.section_0.entries.41]
text = [
  "Trading Conditions?$",
]

[msg.section_0.entries.42]
text = [
  "Understood$",
]

[msg.section_0.entries.43]
text = [
  "Would you like to view or upload\\n",
  "Battle Videos?$",
]

[msg.section_0.entries.44]
text = [
  "With Battle Videos, you may post a\\n",
  "Battle Video you took with your\\l\\n",
  "Vs. Recorder or view Battle Videos from\\l\\n",
  "other Trainers.\\c\\n",
  "You may search the Battle Videos by\\n",
  "Pokémon, battle facility, ranking, etc.\\c\\n",
  "The Battle Video you post will be assigned\\n",
  "a 12-digit code.\\c\\n",
  "Your friends may view your Battle Video\\n",
  "by entering this 12-digit code here.\\c$",
]

[msg.section_0.entries.45]
text = [
  "View or upload$",
]

[msg.section_0.entries.46]
text = [
  "Info$",
]

[msg.section_0.entries.47]
text = [
  "Back$",
]

[msg.section_0.entries.48]
text = [
  "Would you like to view or upload\\n",
  "Musical Photos?$",
]

[msg.section_0.entries.49]
text = [
  "With Musical Photos, you may post a photo\\n",
  "you took at the Pokémon Musical in\\l\\n",
  "Nimbasa City by using the Vs. Recorder.\\c\\n",
  "You may also view photos taken by other\\n",
  "people, sorted by the Pokémon you like.\\c$",
]

[msg.section_0.entries.50]
text = [
  "View or upload$",
]

[msg.section_0.entries.51]
text = [
  "Info$",
]

[msg.section_0.entries.52]
text = [
  "Back$",
]

[msg.section_0.entries.53]
text = [
  "Would you like to take the\\n",
  "Random Matchup challenge?$",
]

[msg.section_0.entries.54]
text = [
  "Challenge$",
]

[msg.section_0.entries.55]
text = [
  "Info$",
]

[msg.section_0.entries.56]
text = [
  "Back$",
]

[msg.section_0.entries.57]
text = [
  "A Random Matchup is a battle with other\\n",
  "Pokémon fans from around the world.\\c\\n",
  "There are five kinds of Random Matchups:\\n",
  "Single, Double, Triple, Rotation,\\l\\n",
  "and Launcher.\\c\\n",
  "Also, Random Matchups have two modes:\\n",
  "Free mode and Rating mode.\\c\\n",
  "In Free mode, everyone can participate\\n",
  "in battles freely.\\c\\n",
  "In Rating mode, you may participate in\\n",
  "battles after you set Game Sync, access\\l\\n",
  "the Pokémon Global Link website with your\\l\\n",
  "computer, and register your\\l\\n",
  "Game Sync ID.\\c\\n",
  "http://www.pokemon-gl.com/\\n",
  "(Pokémon Global Link)\\c$",
]

[msg.section_0.entries.58]
text = [
  "Would you like to know more details?$",
]

[msg.section_0.entries.59]
text = [
  "Free Mode$",
]

[msg.section_0.entries.60]
text = [
  "Rating Mode$",
]

[msg.section_0.entries.61]
text = [
  "Special Rules$",
]

[msg.section_0.entries.62]
text = [
  "Understood$",
]

[msg.section_0.entries.63]
text = [
  "Free mode is for casual battles against\\n",
  "other Pokémon fans around the world.\\c\\n",
  "Feel free to challenge it!\\c$",
]

[msg.section_0.entries.64]
text = [
  "Rating mode is recommended for those who\\n",
  "want to master battles.\\c\\n",
  "When communication is established, you\\n",
  "are likely to battle against a person with\\l\\n",
  "a similar Rating.\\c\\n",
  "Your Rating starts at 1500. When you win,\\n",
  "it goes up. When you lose, it goes down.\\c\\n",
  "So the higher your Rating is, the\\n",
  "stronger you are as a Trainer!\\c\\n",
  "There's one thing you should be careful\\n",
  "about in Rating mode.\\c\\n",
  "Your record and Rating will be erased if\\n",
  "you connect to Nintendo Wi-Fi Connection\\l\\n",
  "with a different DS System.\\c\\n",
  "So please be careful if you switch!\\c$",
]

[msg.section_0.entries.65]
text = [
  "There are several special rules\\n",
  "for Random Matchups.\\c\\n",
  "Any Pokémon higher than Lv. 50 will be\\n",
  "set to that level for the battle.\\c\\n",
  "Pokémon nicknames won't be used.\\c\\n",
  "You have a limited time to choose Pokémon\\n",
  "for a battle and to give orders to your\\l\\n",
  "Pokémon during the battle.\\c\\n",
  "Don't exceed the time limit,\\n",
  "or your Pokémon and its moves\\l\\n",
  "will be chosen for you!\\c\\n",
  "There's also a time limit on the battle.\\c\\n",
  "The winner will be determined when time\\n",
  "runs out, even if both sides still have\\l\\n",
  "Pokémon standing.\\c$",
]

[msg.section_0.entries.66]
text = [
  "Which Battle would you like\\n",
  "to choose?$",
]


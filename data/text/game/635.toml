[msg.section_0.entries.0]
text = [
  "Professor Juniper: Hi there, [VAR TRNAME(0)]!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Bianca: Hee hee!\\c\\n",
  "I used Fly, so it looks like\\n",
  "I beat you here.\\c\\n",
  "Thanks for your help\\n",
  "in Reversal Mountain!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Professor Juniper: If you go straight\\n",
  "past Lacunosa Town, you'll reach\\l\\n",
  "Opelucid City!\\c\\n",
  "But before you go, there's something\\n",
  "I want you two to hear.\\c$",
]

[msg.section_0.entries.3]
text = [
  "Bianca: What is it?\\c$",
]

[msg.section_0.entries.4]
text = [
  "Professor Juniper: You'll know soon\\n",
  "enough. Hurry now!\\c$",
]

[msg.section_0.entries.5]
text = [
  "You must be the ones who want to hear\\n",
  "that old tale about Lacunosa Town.$",
]

[msg.section_0.entries.6]
text = [
  "Professor Juniper: That's right.\\n",
  "Please tell us.\\c$",
]

[msg.section_0.entries.7]
text = [
  "All right, my dearies.\\n",
  "Please come in.\\c$",
]

[msg.section_0.entries.8]
text = [
  "Professor Juniper: This is the place!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Professor Juniper: Wasn't that\\n",
  "an interesting folktale?\\c\\n",
  "The Pokémon's true identity may be\\n",
  "unknown, but the power mentioned\\l\\n",
  "in the story is incredible!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Bianca: I know...\\c\\n",
  "The power to freeze everything around it\\n",
  "could even rival the power of the\\l\\n",
  "legendary Dragon-type Pokémon.\\c$",
]

[msg.section_0.entries.11]
text = [
  "Yes, Bianca.\\c\\n",
  "It's almost like Zekrom, who scorched\\n",
  "Unova with intense lightning long ago.\\c$",
]

[msg.section_0.entries.12]
text = [
  "Yes, Bianca.\\c\\n",
  "It's almost like Reshiram, who scorched\\n",
  "Unova with blazing fire long ago.\\c$",
]

[msg.section_0.entries.13]
text = [
  "By the way, [VAR TRNAME(0)],\\n",
  "do you remember the story of Zekrom?$",
]

[msg.section_0.entries.14]
text = [
  "By the way, [VAR TRNAME(0)],\\n",
  "do you remember the story of Reshiram?$",
]

[msg.section_0.entries.15]
text = [
  "I told you a little about it in\\n",
  "Lentimas Town, remember?\\c\\n",
  "Zekrom is a legendary Dragon-type\\n",
  "Pokémon that lends its power to the\\l\\n",
  "person it recognizes as a hero\\l\\n",
  "pursuing ideals.\\c\\n",
  "It has a black body, and it can\\n",
  "unleash fearsome lightning!\\c$",
]

[msg.section_0.entries.16]
text = [
  "Oh, [VAR TRNAME(0)]...\\c\\n",
  "I even told you a little about\\n",
  "it in Lentimas Town.\\c\\n",
  "Zekrom is a legendary Dragon-type\\n",
  "Pokémon that lends its power to the\\l\\n",
  "person it recognizes as a hero\\l\\n",
  "pursuing ideals.\\c\\n",
  "It has a black body, and it can\\n",
  "unleash fearsome lightning!\\c$",
]

[msg.section_0.entries.17]
text = [
  "So you remember I told you a little\\n",
  "about it in Lentimas Town!\\c\\n",
  "Reshiram is a legendary Dragon-type\\n",
  "Pokémon that lends its power to the\\l\\n",
  "person it recognizes as a hero who\\l\\n",
  "seeks truth.\\c\\n",
  "It has a white body, and it can send\\n",
  "forth ferocious flames!\\c$",
]

[msg.section_0.entries.18]
text = [
  "Oh, [VAR TRNAME(0)]...\\c\\n",
  "I even told you a little about\\n",
  "it in Lentimas Town.\\c\\n",
  "Reshiram is a legendary Dragon-type\\n",
  "Pokémon that lends its power to the\\l\\n",
  "person it recognizes as a hero who\\l\\n",
  "seeks truth.\\c\\n",
  "It has a white body, and it can send\\n",
  "forth ferocious flames!\\c$",
]

[msg.section_0.entries.19]
text = [
  "Bianca: Professor, do you think\\n",
  "there's a connection between\\l\\n",
  "the Pokémon from the old story\\l\\n",
  "and the legendary Dragon-type Pokémon?\\c$",
]

[msg.section_0.entries.20]
text = [
  "Professor Juniper: The meteorite.\\c$",
]

[msg.section_0.entries.21]
text = [
  "Bianca: The meteorite?\\c$",
]

[msg.section_0.entries.22]
text = [
  "Zekrom was revived from a\\n",
  "rock called the Dark Stone.\\c\\n",
  "Let's suppose the meteorite\\n",
  "from the story and this stone\\l\\n",
  "are one and the same...\\c\\n",
  "Take into account that elements\\n",
  "from the same era were found in\\l\\n",
  "Dragonspiral Tower, where Zekrom was,\\l\\n",
  "and in the Giant Chasm...\\c\\n",
  "It doesn't prove anything, but it\\n",
  "could be a piece of the puzzle.\\c\\n",
  "Let's not write it off as a\\n",
  "coincidence just yet...\\c$",
]

[msg.section_0.entries.23]
text = [
  "Reshiram was revived from a\\n",
  "rock called the Light Stone.\\c\\n",
  "Let's suppose the meteorite\\n",
  "from the story and this stone\\l\\n",
  "are one and the same...\\c\\n",
  "Take into account that elements\\n",
  "from the same era were found in\\l\\n",
  "Dragonspiral Tower, where Reshiram was,\\l\\n",
  "and in the Giant Chasm...\\c\\n",
  "It doesn't prove anything, but it\\n",
  "could be a piece of the puzzle.\\c\\n",
  "Let's not write it off as a\\n",
  "coincidence just yet...\\c$",
]

[msg.section_0.entries.24]
text = [
  "Bianca: If your theories are true,\\n",
  "it should be a really strong Pokémon.\\c\\n",
  "What kind of a reason would there be\\n",
  "for it to come out only at night?\\c\\n",
  "Like, if, like, it doesn't like sunlight\\n",
  "or something like that...\\c$",
]

[msg.section_0.entries.25]
text = [
  "Until we look into it more deeply, it would\\n",
  "be hard to say anything about that.\\c\\n",
  "Now that I think about it, the name\\n",
  "“Lacunosa\\\" could be derived from\\l\\n",
  "lacunosus clouds, which are clouds\\l\\n",
  "that resemble a net or a fence.\\c\\n",
  "I wonder if the name is related to\\n",
  "the part of the story where they\\l\\n",
  "built walls to protect the town\\l\\n",
  "from that Pokémon.\\c$",
]

[msg.section_0.entries.26]
text = [
  "Sorry, I rambled on a bit, didn't I?\\c\\n",
  "[VAR TRNAME(0)], could you ask Drayden\\n",
  "about this, if you get a chance?\\c\\n",
  "I'm going to do a little fieldwork.\\n",
  "Bianca, help out, OK!\\c$",
]

[msg.section_0.entries.27]
text = [
  "Bianca: Sure thing!\\c$",
]

[msg.section_0.entries.28]
text = [
  "Oh, just so you know, Opelucid City's\\n",
  "mayor, Drayden, wrestles with his\\l\\n",
  "Pokémon to toughen them up!\\c$",
]

[msg.section_0.entries.29]
text = [
  "Professor Juniper, wait up!\\c$",
]

[msg.section_0.entries.30]
text = [
  "[VAR TRNAME(1)]: What's up?\\c\\n",
  "Have you seen Team Plasma\\n",
  "anywhere around here?\\l\\n",
  "I heard a rumor to that effect...\\c$",
]

[msg.section_0.entries.31]
text = [
  "Zinzolin: Oh, for crying out loud...\\n",
  "This is troublesome indeed,\\l\\n",
  "my curious Trainers.\\c\\n",
  "Perhaps I should satiate\\n",
  "your curiosity somewhat.\\c\\n",
  "The reason I am still part\\n",
  "of Team Plasma is this:\\c\\n",
  "I want to know how the world will change.\\c\\n",
  "Listen. Pokémon are nature.\\n",
  "Poké Balls are civilization.\\c\\n",
  "Humans who are used to civilization\\n",
  "don't relinquish it easily.\\c\\n",
  "Of course, both nature and\\n",
  "civilization are important.\\c\\n",
  "But what will happen to a world\\n",
  "taken over by Team Plasma?\\c\\n",
  "People will be forced to throw out\\n",
  "Poké Balls--a product of civilization.\\c\\n",
  "I want to know what that looks like!\\n",
  "And I want to enjoy it!\\c$",
]

[msg.section_0.entries.32]
text = [
  "[VAR TRNAME(1)]: Shut your mouth.\\c\\n",
  "All I want is to get back\\n",
  "a stolen Pokémon!\\c\\n",
  "[VAR TRNAME(0)]! Give me a hand!\\n",
  "You ready?$",
]

[msg.section_0.entries.33]
text = [
  "[VAR TRNAME(1)]: Just to let you know...\\c\\n",
  "You're about to feel my rage!\\c$",
]

[msg.section_0.entries.34]
text = [
  "[VAR TRNAME(1)]: Got it!\\n",
  "Go get ready and then come back here!\\c\\n",
  "Being careful against opponents\\n",
  "like these isn't a bad thing!$",
]

[msg.section_0.entries.35]
text = [
  "[VAR TRNAME(1)]: Are you ready to pitch in?\\n",
  "OK, let's go!$",
]

[msg.section_0.entries.36]
text = [
  "Team Plasma: What's with these two?\\n",
  "I'm battling alongside Zinzolin!\\l\\n",
  "This shouldn't be happening!\\c$",
]

[msg.section_0.entries.37]
text = [
  "Zinzolin: These Trainers remind me\\n",
  "of that one from two years ago.\\c\\n",
  "More important, we must continue\\n",
  "our search.\\c\\n",
  "Like that scientist said,\\n",
  "it might be in Opelucid City!\\c\\n",
  "We'll play with you again later!\\c$",
]

[msg.section_0.entries.38]
text = [
  "[VAR TRNAME(1)]: Get back here!\\c$",
]

[msg.section_0.entries.39]
text = [
  "Do you want to hear that old tale\\n",
  "of Lacunosa Town again?\\c\\n",
  "It always takes me a little time\\n",
  "to tell it.$",
]

[msg.section_0.entries.40]
text = [
  "There's a great big hole behind\\n",
  "this town.\\c\\n",
  "A long time ago, a huge meteorite fell\\n",
  "from the sky and made the big hole.\\c\\n",
  "A very scary monster was hiding\\n",
  "inside the meteorite!\\c\\n",
  "People say the monster appeared in the\\n",
  "village at night, with a freezing wind,\\l\\n",
  "and it stole away people and Pokémon...\\c\\n",
  "So the villagers built big walls to keep\\n",
  "the monster out and made a rule that\\l\\n",
  "no one could go out after dark.\\c$",
]

[msg.section_0.entries.41]
text = [
  "Whether you believe it or not\\n",
  "is up to you...\\c\\n",
  "But even now, the people of this town\\n",
  "stay inside after dark.\\c\\n",
  "The old stories and legends\\n",
  "continue to influence our lives.$",
]

[msg.section_0.entries.42]
text = [
  "Oh, fine, fine.\\n",
  "Come back again when you have time.$",
]

[msg.section_0.entries.43]
text = [
  "Welcome to Lacunosa Town.\\c\\n",
  "In this town, people live as methodically\\n",
  "as clockwork from morning to night.\\c\\n",
  "If you live your life soaking up sunlight,\\n",
  "you can sleep very well at night.$",
]

[msg.section_0.entries.44]
text = [
  "Lacunosa Town\\n",
  "Methodical and Orderly for Safety$",
]

[msg.section_0.entries.45]
text = [
  "The big scary monster that\\n",
  "comes out at night is\\l\\n",
  "a Pokémon, right?\\c\\n",
  "It must be a really scary Pokémon\\n",
  "if everyone believes the legend\\l\\n",
  "and follows these rules...$",
]

[msg.section_0.entries.46]
text = [
  "My granny loves old stories!\\c\\n",
  "I'm always having to listen\\n",
  "to her really, really long stories.$",
]

[msg.section_0.entries.47]
text = [
  "My grandma's stories were\\n",
  "really about Kyurem, it seems.\\c\\n",
  "I guess old stories sometimes\\n",
  "have a kernel of truth to them.$",
]

[msg.section_0.entries.48]
text = [
  "There are a lot of people in the world,\\n",
  "and there are just as many different\\l\\n",
  "characteristics and ideas.$",
]

[msg.section_0.entries.49]
text = [
  "I don't have anything to do ever since\\n",
  "I took a post here.\\c\\n",
  "Since nobody goes outside at night,\\n",
  "it's very peaceful.$",
]

[msg.section_0.entries.50]
text = [
  "So the reason nobody goes outside\\n",
  "at night and it's so peaceful\\l\\n",
  "is because of a Pokémon?\\l\\n",
  "I don't know how to feel about that!$",
]

[msg.section_0.entries.51]
text = [
  "Gahoo! Gahoo!$",
]

[msg.section_0.entries.52]
text = [
  "My Pokémon just runs around on its own.\\n",
  "Maybe it doesn't need a Trainer?$",
]

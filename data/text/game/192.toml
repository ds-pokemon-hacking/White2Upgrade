  "Roost is a move that can restore HP!\\c\\n",
  "Also, if a Flying-type Pokémon uses it,\\n",
  "it won't be Flying type during the turn,\\l\\n",
  "which means the type matchup will change.\\c\\n",
  "A supereffective move will be an\\n",
  "ordinary move, or a move that would\\l\\n",
  "otherwise have no effect will land on it.\\c\\n",
  "It's a quite tricky move.$",
]


[msg.section_0.entries.0]
text = [
  "I see!$",
]

[msg.section_0.entries.1]
text = [
  "Yes.$",
]

[msg.section_0.entries.2]
text = [
  "Mmmh!$",
]

[msg.section_0.entries.3]
text = [
  "Well then...$",
]

[msg.section_0.entries.4]
text = [
  "Looking forward to it.$",
]

[msg.section_0.entries.5]
text = [
  "Sensei!\\n",
  "You called?\\c$",
]

[msg.section_0.entries.6]
text = [
  "Alder: You're looking well!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Marshal: Hey, I heard you're\\n",
  "going back to acting!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Brycen: Indeed!\\c\\n",
  "Team Plasma's actions\\n",
  "stirred the hearts of the public.\\c\\n",
  "People even worry about\\n",
  "how to interact with Pokémon.\\c\\n",
  "Of course, it's good to think\\n",
  "about that relationship, but still...\\c$",
]

[msg.section_0.entries.9]
text = [
  "Alder: Even if you're told to find\\n",
  "an answer on your own...\\c\\n",
  "It's not exactly an easy thing\\n",
  "to do now, is it?\\c$",
]

[msg.section_0.entries.10]
text = [
  "Brycen: That's why...\\c\\n",
  "If people can see my bond with my Pokémon\\n",
  "when they're watching my movies,\\l\\n",
  "it might ease their worries...\\c\\n",
  "That was my reasoning...\\c$",
]

[msg.section_0.entries.11]
text = [
  "Marshal: Oh! I get it now!\\c\\n",
  "Can't communicate that just\\n",
  "by holing up in the Gym and\\l\\n",
  "talking to challengers.\\c\\n",
  "But, are you gonna be all right?\\n",
  "What if you get hurt during filming again?\\c$",
]

[msg.section_0.entries.12]
text = [
  "Alder: Marshal...\\n",
  "Brycen has already decided.\\c\\n",
  "Sometimes worrying can\\n",
  "destroy potential.\\c$",
]

[msg.section_0.entries.13]
text = [
  "Brycen: I'm fine.\\n",
  "I have no doubts about my decision.\\c\\n",
  "Also, I appreciate Marshal's concern.\\c$",
]

[msg.section_0.entries.14]
text = [
  "I was young...\\c\\n",
  "I thought I could do\\n",
  "any kind of action scene.\\c\\n",
  "So I would put myself in\\n",
  "unnecessary danger.\\c\\n",
  "I thought this bravery was\\n",
  "my value as a person.\\c$",
]

[msg.section_0.entries.15]
text = [
  "So... Instead of trying to communicate\\n",
  "something through my acting,\\l\\n",
  "I simply sought amazing action.\\c\\n",
  "That was how I got hurt.\\c$",
]

[msg.section_0.entries.16]
text = [
  "Marshal: I think I understand.\\c\\n",
  "If you seek strength for its own sake,\\n",
  "the reason why you wanted it\\l\\n",
  "in the first place becomes vague.\\c\\n",
  "And you end up desiring\\n",
  "victory and nothing else.\\c$",
]

[msg.section_0.entries.17]
text = [
  "Alder: That's why I've also made\\n",
  "an important decision.\\c\\n",
  "I'm going to resign as Champion!\\c$",
]

[msg.section_0.entries.18]
text = [
  "We in particular need to take another\\n",
  "look at what it means to live together\\l\\n",
  "with Pokémon.\\c\\n",
  "The world at large is still shaken\\n",
  "by uncertainty.\\c\\n",
  "So I have to show everyone\\n",
  "a new hope.\\c$",
]

[msg.section_0.entries.19]
text = [
  "Marshal: Well, if that's what\\n",
  "you've decided, Sensei.\\c\\n",
  "Even if I argue, that won't\\n",
  "change your decision, will it?\\c$",
]

[msg.section_0.entries.20]
text = [
  "Alder: You've grown so much since you\\n",
  "sought me out and asked to be my pupil.\\c\\n",
  "Could that be it?\\c\\n",
  "Did becoming part of the Elite Four\\n",
  "help you grow up in its own way?\\c$",
]

[msg.section_0.entries.21]
text = [
  "Marshal: I thought that if I were strong,\\n",
  "my Pokémon would become stronger.\\c\\n",
  "Maybe I grew up because my Pokémon\\n",
  "taught me that this isn't always\\l\\n",
  "the case...\\c\\n",
  "Well then, will you spar with me?\\c$",
]

[msg.section_0.entries.22]
text = [
  "Brycen: I will observe.\\c$",
]

[msg.section_0.entries.23]
text = [
  "Alder: Thank you.\\c\\n",
  "I want to be sure my Pokémon are in\\n",
  "top condition to challenge the Trainer\\l\\n",
  "who will become the next Champion.\\c$",
]

[msg.section_0.entries.24]
text = [
  "Alder: To strength!\\c$",
]

[msg.section_0.entries.25]
text = [
  "Marshal: To Pokémon!\\c$",
]

[msg.section_0.entries.0]
text = [
  "Well, how many gates do you think\\n",
  "there are in the Unova region?$",
]

[msg.section_0.entries.1]
text = [
  "My friend's friend was saying that\\n",
  "Pokémon Eggs are sometimes discovered\\l\\n",
  "at the Day Care on Route 3!$",
]

[msg.section_0.entries.2]
text = [
  "Are you checking the electric\\n",
  "bulletin boards?\\c\\n",
  "Right now, news about mass outbreaks\\n",
  "of Pokémon is really hot!$",
]

[msg.section_0.entries.3]
text = [
  "Um... Excuse me...\\n",
  "Trainer?\\c\\n",
  "This Pokémon Egg was found at the\\n",
  "Day Care. Would you raise it?$",
]

[msg.section_0.entries.4]
text = [
  "This Pokémon Egg was\\n",
  "found at the Day Care.\\l\\n",
  "Would you raise it?$",
]

[msg.section_0.entries.5]
text = [
  "Um...\\c\\n",
  "Your party is full.\\n",
  "You don't have room to hold the Egg.$",
]

[msg.section_0.entries.6]
text = [
  "Oh... OK.\\n",
  "I understand.\\c\\n",
  "If you change your mind,\\n",
  "please come talk to me again.$",
]

[msg.section_0.entries.7]
text = [
  "Oh! OK!\\c\\n",
  "Please take good care of this Egg!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Apparently, putting Pokémon Eggs next\\n",
  "to healthy Pokémon is a good thing.\\c\\n",
  "In other words, walk with the Egg.\\c\\n",
  "You know, the Day Care is on Route 3.\\n",
  "They might be able to tell you more.$",
]

[msg.section_0.entries.9]
text = [
  "[VAR TRNAME(0)] received the Egg!$",
]

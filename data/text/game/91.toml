[msg.section_0.entries.0]
text = [
  "Athletes who score points, and athletes\\n",
  "who support them...\\c\\n",
  "Determining their different roles is the\\n",
  "key to building a team!$",
]

[msg.section_0.entries.1]
text = [
  "Football is a fun sport that is divided\\n",
  "into offense and defense.$",
]

[msg.section_0.entries.2]
text = [
  "His... Those eyes...\\c\\n",
  "It looks like he's coming\\n",
  "right at me!$",
]

[msg.section_0.entries.3]
text = [
  "The helmet and pads weigh\\n",
  "15 to 18 pounds!$",
]

[msg.section_0.entries.4]
text = [
  "I've trained and built up my muscles\\n",
  "by tackling Pokémon!\\c\\n",
  "Nothing can move me!$",
]

[msg.section_0.entries.5]
text = [
  "OK! I will defend to the end with moves\\n",
  "like Protect and Detect!$",
]

[msg.section_0.entries.6]
text = [
  "My favorite moves?\\c\\n",
  "...Hmm.\\n",
  "I'd say Tackle and Take Down.$",
]

[msg.section_0.entries.7]
text = [
  "Reading your opponent's attack and\\n",
  "deciding your next move...\\c\\n",
  "Both Pokémon battles and football have\\n",
  "the same thrill!$",
]

[msg.section_0.entries.8]
text = [
  "The appeal of football?\\n",
  "Let me see...\\c\\n",
  "First, just watch a game without thinking\\n",
  "about the rules!$",
]

[msg.section_0.entries.9]
text = [
  "I'll protect my team with my whole body\\n",
  "to avoid our opponents' interference!$",
]

[msg.section_0.entries.10]
text = [
  "In football, the quarterback is the\\n",
  "athlete who decides a strategy and\\l\\n",
  "carries it out.\\c\\n",
  "He's kind of like a Pokémon Trainer!$",
]

[msg.section_0.entries.11]
text = [
  "In football, you have to learn each and\\n",
  "every formation by heart!$",
]

[msg.section_0.entries.12]
text = [
  "The ball used in football is oval-shaped\\n",
  "and hard to throw, isn't it?\\c\\n",
  "But once you get the hang of it, you can\\n",
  "throw it perfectly!$",
]

[msg.section_0.entries.13]
text = [
  "I am a greeeeeat secret weapon!\\c\\n",
  "The only problem is, I am so secret that\\n",
  "I've never been in a game...$",
]

[msg.section_0.entries.14]
text = [
  "Yoo-hoo! Pass me the ball!$",
]

[msg.section_0.entries.15]
text = [
  "Bodies crashing into other bodies!\\n",
  "Go, go, go!\\c\\n",
  "I am the owner. That’s what\\n",
  "I like to see.$",
]

[msg.section_0.entries.16]
text = [
  "Ook!$",
]

[msg.section_0.entries.17]
text = [
  "Ookiii!$",
]

[msg.section_0.entries.18]
text = [
  "Ook! Ook!$",
]

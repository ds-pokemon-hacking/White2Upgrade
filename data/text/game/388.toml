[msg]
trailing_data = "1818"

[msg.section_0.entries.0]
text = [
  "The soaring Black Tower...\\n",
  "It's piercing through the end of the sky.\\c\\n",
  "It's also known as Unova's Challenge.\\n",
  "It's an interesting building...$",
]

[msg.section_0.entries.1]
text = [
  "They say Area 6 is located so high\\n",
  "that you cannot see it from\\l\\n",
  "the ground...\\c\\n",
  "I wonder how high it is.\\c\\n",
  "As a researcher, I'm very interested.$",
]

[msg.section_0.entries.2]
text = [
  "I heard that you cleared the\\n",
  "Area at the top, too...\\c\\n",
  "Great! Literally, you're a person\\n",
  "above the clouds!$",
]

[msg.section_0.entries.3]
text = [
  "I sense strong power\\n",
  "that I've never felt before...\\c\\n",
  "I can't stop...trembling...\\c\\n",
  "I wonder what is hidden\\n",
  "in this Unova's Challenge?$",
]

[msg.section_0.entries.4]
text = [
  "What is this power?\\n",
  "It's getting stronger and stronger!\\c\\n",
  "Uh... I'm all tingly inside...\\c\\n",
  "Unova's Challenge, the Black Tower...\\n",
  "What kind of secret does it have...?$",
]

[msg.section_0.entries.5]
text = [
  "When I heard that you cleared all of\\n",
  "the Areas, all became clear to me.\\c\\n",
  "The power that I've felt... The power\\n",
  "that made me tremble...\\c\\n",
  "It was the potential\\n",
  "you possess!$",
]

[msg.section_0.entries.6]
text = [
  "What? That Trainer named Benga is\\n",
  "Alder's grandson?\\c\\n",
  "I should ask Alder in Floccesy Town\\n",
  "to train me, too.$",
]

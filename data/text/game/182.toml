[msg]
trailing_data = "5454"

[msg.section_0.entries.0]
text = [
  "It's too loud!\\n",
  "She can't hear your voice!$",
]

[msg.section_0.entries.1]
text = [
  "Get ready! I'm gonna knock\\n",
  "some sense outta ya!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Sigh!\\n",
  "What are you doing losing, Roxie?!\\c\\n",
  "Well...\\n",
  "I guess that means you're strong!\\c\\n",
  "This stinks,\\n",
  "but I gave it everything I had, and\\l\\n",
  "I feel revitalized and refreshed now!\\c\\n",
  "Here!\\n",
  "Proof that you beat me!\\c$",
]

[msg.section_0.entries.3]
text = [
  "[VAR TRNAME(0)] received the\\n",
  "Toxic Badge from Roxie!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Two Badges!\\c\\n",
  "Now Pokémon up to Lv. 30,\\n",
  "even Pokémon you got in trades,\\l\\n",
  "will realize how good you are\\l\\n",
  "and won't ignore your commands!\\c\\n",
  "Also, here!\\n",
  "Use this TM!\\c$",
]

[msg.section_0.entries.5]
text = [
  "TM09 is Venoshock!\\n",
  "It covers the target in\\l\\n",
  "a special poisonous liquid!\\c\\n",
  "Even better, if your target's already\\n",
  "poisoned, it does double damage!\\l\\n",
  "Heh heh! It almost packs too much\\l\\n",
  "of a punch!$",
]

[msg.section_0.entries.6]
text = [
  "Your Pokémon WANTED this win!\\c\\n",
  "Keep on going on like this,\\n",
  "and do all sorts of stuff!$",
]

[msg.section_0.entries.7]
text = [
  "You're going to Pokéstar Studios?!\\c\\n",
  "OH! I forgot! The old man!\\n",
  "I have to get him back to work\\l\\n",
  "as captain!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Using the Pokémon I like and\\n",
  "getting through to people with\\l\\n",
  "the music I like is who I am!\\c\\n",
  "If you can do what you enjoy\\n",
  "in the way you want, then great!\\c\\n",
  "Just be sure not to cause\\n",
  "anyone any trouble!$",
]

[msg.section_0.entries.9]
text = [
  "That's a Gym Leader for you!\\n",
  "She really brings out the charms\\l\\n",
  "of her Pokémon!\\c\\n",
  "But she's too wrapped up\\n",
  "in what she's doing here...$",
]

[msg.section_0.entries.10]
text = [
  "Hey you!\\c\\n",
  "I felt like you were something special\\n",
  "during your battle with Roxie.\\c\\n",
  "Please come with me to Pokéstar Studios!\\c$",
]

[msg.section_0.entries.11]
text = [
  "I'm running the PA!\\c\\n",
  "I balance the sound in the venue\\n",
  "so it's easy to hear!\\c\\n",
  "Are you a Trainer?\\c\\n",
  "So does that mean you're thinking about\\n",
  "the type balance of the Pokémon in\\l\\n",
  "your party?$",
]

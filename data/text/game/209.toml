]

[msg.section_0.entries.4]
text = [
  "Every day, the city has more people...$",
]

[msg.section_0.entries.5]
text = [
  "When I work, I do it all out!\\n",
  "When I loaf, I do it all out, too!$",
]

[msg.section_0.entries.6]

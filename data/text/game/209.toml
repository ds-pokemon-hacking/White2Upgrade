]

[msg.section_0.entries.12]
text = [
  "You need to enjoy your work.\\n",
  "Otherwise life is boring!\\c\\n",
  "Because we spend most of the day\\n",
  "at work.$",
]

[msg.section_0.entries.13]
text = [

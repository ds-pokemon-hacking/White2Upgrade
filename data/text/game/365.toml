[msg.section_0.entries.0]
text = [
  "                                             $$",
]

[msg.section_0.entries.1]
text = [
  "                                         $$",
]

[msg.section_0.entries.2]
text = [
  "                   $$",
]

[msg.section_0.entries.3]
text = [
  "A barrier was deactivated!$",
]

[msg.section_0.entries.4]
text = [
  "All barriers were deactivated,\\n",
  "and you can proceed now.$",
]

[msg.section_0.entries.5]
text = [
  "Team Plasma: At last, we meet again!\\c\\n",
  "Remember me? Formerly of Team Plasma?\\n",
  "I've been waiting for you.\\c$",
]

[msg.section_0.entries.6]
text = [
  "Gah! Spying is such a rotten job.\\n",
  "I contacted Rood of the Seven Sages,\\l\\n",
  "but nobody showed up to help me.\\c\\n",
  "I can't stand it. Everybody around me is\\n",
  "always saying bad stuff about Lord N.\\c\\n",
  "But Lord N learned the error of his ways\\n",
  "and changed course to a better path.\\c\\n",
  "Yet they call him a betrayer!\\n",
  "People really stink sometimes.\\c\\n",
  "They selfishly counted on him, and\\n",
  "now they selfishly make a big fuss\\l\\n",
  "about being betrayed.\\c$",
]

[msg.section_0.entries.7]
text = [
  "Oh! I nearly forgot to tell you!\\n",
  "This floor is a maze of pipes.\\c\\n",
  "You've got to step on switches\\n",
  "to connect or disconnect the pipes.\\c\\n",
  "It's a good thing you can walk\\n",
  "on the pipes.\\c$",
]

[msg.section_0.entries.8]
text = [
  "You know what troubles me...\\c\\n",
  "How come all of us who were in\\n",
  "Team Plasma together--thinking we\\l\\n",
  "knew what was right--are now divided\\l\\n",
  "into former Team Plasma members and\\l\\n",
  "continuing Team Plasma members,\\l\\n",
  "both with opposing points of view?\\c\\n",
  "Where's the line between friend and foe?\\n",
  "I spend a lot of time asking myself that.\\c\\n",
  "As for you, on this floor, you'll need\\n",
  "to deactivate barriers to continue on.\\l\\n",
  "Deactivate them by stepping on switches.\\c\\n",
  "Move around by stepping on warp panels,\\n",
  "and you'll find four switches.$",
]

[msg.section_0.entries.9]
text = [
  "Zinzolin: The device is indestructible!\\c\\n",
  "You will never be able to release Kyurem!\\c$",
]

[msg.section_0.entries.10]
text = [
  "You don't have the sense to know\\n",
  "when to quit, it seems.\\c\\n",
  "It's an act of mercy on my part\\n",
  "to bring this to an end now!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Zinzolin: Beaten again?!\\c\\n",
  "No matter!\\n",
  "Team Plasma will get the last laugh!$",
]

[msg.section_0.entries.12]
text = [
  "It looks like it controls the\\n",
  "temperature inside the ship.$",
]

[msg.section_0.entries.13]
text = [
  "It's a device to control\\n",
  "the ship's energy system.$",
]

[msg.section_0.entries.14]
text = [
  "Haahra...$",
]

[msg.section_0.entries.15]
text = [
  "Humph! If you intend to continue,\\n",
  "step on the other warp panel.\\c\\n",
  "Keep in mind that you're going\\n",
  "to get beaten up if you do!$",
]

[msg.section_0.entries.16]
text = [
  "What?! You beat Colress?!\\c\\n",
  "Waaah! I pretended to be strong,\\n",
  "but I don't have any Pokémon!\\c$",
]

[msg.section_0.entries.17]
text = [
  "Oh, poor Kyurem. Ghetsis's device\\n",
  "cruelly forced it to work.\\c\\n",
  "It must have felt terrible.$",
]

[msg.section_0.entries.18]
text = [
  "The Plasma Frigate is a ship designed\\n",
  "to be ecological. It runs on\\l\\n",
  "Kyurem's ice energy and solar panels.\\c\\n",
  "You've got to keep the environment in\\n",
  "mind when ruling a region like Unova.$",
]

[msg.section_0.entries.19]
text = [
  "Colress doesn't know N.\\n",
  "I wonder how he'll react if he meets him.$",
]

[msg.section_0.entries.20]
text = [
  "Be careful!\\n",
  "The barriers are electrified!$",
]

[msg.section_0.entries.29]
text = [
  "The Medal Rally is a competition to\\n",
  "evaluate various activities of Trainers.\\c\\n",
  "Data and records are sent from Medal\\n",
  "Rally participants' Medal Boxes and then\\l\\n",
  "evaluated by staff at the Medal Office.\\c\\n",
  "The details aren't important.\\n",
  "Just enjoy your journey!\\c$",
]

[msg.section_0.entries.30]
text = [
  "Medals are gifts from the Medal Office\\n",
  "for rally participants.\\c\\n",
  "If you meet the requirements to\\n",
  "receive Medals, you can get them\\l\\n",
  "from Mr. Medal at a Pokémon Center.\\c\\n",
  "For your information, there are\\n",
  "five types of Medals:\\l\\n",
  "orange Adventure Medals,\\l\\n",
  "blue Battle Medals,\\l\\n",
  "pink Entertainment Medals,\\l\\n",
  "purple Challenge Medals,\\l\\n",
  "and yellow Special Medals.\\c\\n",
  "Also, the more difficult the Medals are to\\n",
  "earn, the more decorative they become.\\c$",
]

[msg.section_0.entries.31]
text = [
  "Hint Medals are gray Medals\\n",
  "for you to see hints to obtain Medals.\\c\\n",
  "When you receive proper Medals,\\n",
  "Mr. Medal will collect the Hint Medals\\l\\n",
  "that achieved their purpose.\\c\\n",
  "Even if you wanted to keep\\n",
  "a lot of Hint Medals, they wouldn't fit\\l\\n",
  "in your Medal Box anyway.\\c$",
]

[msg.section_0.entries.32]
text = [
  "A Medal Box is a box-shaped device\\n",
  "for storing Medals.\\c\\n",
  "You can check the number of Medals,\\n",
  "names of Medals,\\l\\n",
  "descriptions of Medals,\\l\\n",
  "dates you received them, and so on.\\c\\n",
  "Press START to change the shape\\n",
  "of the box so that you can see\\l\\n",
  "a lot of Medals at once, or you can\\l\\n",
  "change the order of Medals.\\c\\n",
  "For your information, I'm the one who\\n",
  "created the Medal Box!\\c$",
]

[msg.section_0.entries.33]
text = [
  "A Favorite Medal is a Medal\\n",
  "that is shown to the public\\l\\n",
  "in communication.\\c\\n",
  "You can recommend or brag\\n",
  "about the Medal in the Tag Log\\l\\n",
  "or in the Union Room.\\c\\n",
  "To register your Favorite Medal,\\n",
  "press the A Button after choosing\\l\\n",
  "a Medal in your Medal Box.\\c\\n",
  "Press the A Button again\\n",
  "to cancel it.\\c$",
]


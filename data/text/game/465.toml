[msg.section_0.entries.0]
text = [
  "Elesa: Skyla,\\n",
  "can I ask you a favor?\\c$",
]

[msg.section_0.entries.1]
text = [
  "Skyla: Sure, what's up?\\c$",
]

[msg.section_0.entries.2]
text = [
  "Elesa: I've decided I need\\n",
  "a PR makeover!\\c\\n",
  "I wanted to try out my new ideas\\n",
  "with you, Skyla!\\c$",
]

[msg.section_0.entries.3]
text = [
  "Skyla: A PR makeover?\\c$",
]

[msg.section_0.entries.4]
text = [
  "Elesa: That's right!\\c\\n",
  "Here's the thing. I make what everyone\\n",
  "thinks is cool into a reality, right?\\c\\n",
  "Well, I get to do what I want to do,\\n",
  "and while being a model may be difficult,\\l\\n",
  "most importantly, it's fun!\\c\\n",
  "But the hard parts are really hard.\\n",
  "I mean, everyone judges me\\l\\n",
  "simply based on my appearance.\\c\\n",
  "People say that I'm reserved,\\n",
  "and that I don't look like the\\l\\n",
  "type who would tell jokes!\\c$",
]

[msg.section_0.entries.5]
text = [
  "...$",
]

[msg.section_0.entries.6]
text = [
  "Elesa: So, I've been thinking about\\n",
  "it constantly since then!\\c$",
]

[msg.section_0.entries.7]
text = [
  "A sophisticated joke!\\c$",
]

[msg.section_0.entries.8]
text = [
  "How should I put it...\\c\\n",
  "My looks suggest that\\n",
  "I'm not a lot of fun.\\c\\n",
  "But I'll tear down that mistaken\\n",
  "image with my own hands!\\c\\n",
  "I'll say something silly and give someone\\n",
  "an opportunity to call me out,\\l\\n",
  "so we can all have a good laugh!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Skyla: Uh... OK...\\c$",
]

[msg.section_0.entries.10]
text = [
  "Elesa: OK, get a load of this!\\c\\n",
  "Throw that misbehaving Klink\\n",
  "in the clink!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Elesa: Cofagrigus is so cool!\\n",
  "Don't you *cough* agree, Gus?\\c$",
]

[msg.section_0.entries.12]
text = [
  "Elesa: You bought those Fossils from\\n",
  "Clay? Did you buy them on Clay-away?\\c$",
]

[msg.section_0.entries.13]
text = [
  "Skyla: Elesa...\\c\\n",
  "Those are just a bunch of bad puns.\\n",
  "Where's the joke?\\c$",
]

[msg.section_0.entries.14]
text = [
  "Elesa: Exactly! If I make bad puns when\\n",
  "I'm supposed to be telling a joke,\\l\\n",
  "doesn't it give people even more\\l\\n",
  "of an opportunity to tease me\\l\\n",
  "and start a funny back-and-forth?\\c$",
]

[msg.section_0.entries.15]
text = [
  "Skyla: Um...\\c\\n",
  "That's a little too sophisticated for me.\\n",
  "Actually, it's really hard to understand.\\c$",
]

[msg.section_0.entries.16]
text = [
  "Elesa: Really?\\c\\n",
  "I guess I'll just rethink\\n",
  "my fashion first.\\c$",
]

[msg.section_0.entries.17]
text = [
  "Skyla: Sounds good!\\c\\n",
  "Hey, as long as we're hanging out,\\n",
  "surely you wouldn't mind having\\l\\n",
  "a Pokémon battle with me, right?\\c$",
]

[msg.section_0.entries.18]
text = [
  "Elesa: You bet!\\n",
  "And don't call me Shirley!\\c$",
]

[msg.section_0.entries.19]
text = [
  "Skyla: Oh, Elesa...\\c$",
]

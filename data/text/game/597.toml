[msg.section_0.entries.0]
text = [
  "Hi, Trainer!\\n",
  "You have a Pokédex, I see.\\c\\n",
  "I'm a traveler. I enjoy trekking around\\n",
  "the world and talking with various people.\\c\\n",
  "By the way, do you know a Pokémon\\n",
  "called Zoroark?$",
]

[msg.section_0.entries.1]
text = [
  "Great!\\c\\n",
  "Are you armed with knowledge\\n",
  "so that it won't trick you?\\c$",
]

[msg.section_0.entries.2]
text = [
  "Oh my...\\c\\n",
  "Don't you know anything of the world?\\n",
  "It may trick you.\\c$",
]

[msg.section_0.entries.3]
text = [
  "It's your choice to trust it and be\\n",
  "tricked, or to live in doubt.\\c\\n",
  "I enjoyed talking with you.\\n",
  "This is a small present.\\c$",
]

[msg.section_0.entries.4]
text = [
  "They say Zoroark settled in around here\\n",
  "about two years ago.\\c\\n",
  "It changed the appearance of this\\n",
  "grassland with its Illusion Ability\\l\\n",
  "and tricked people and Pokémon.\\c\\n",
  "It's an outrageous rumor, but\\n",
  "a rumor has some truth in it.\\c\\n",
  "Every rumor has a kernel of truth to it.\\c$",
]

[msg.section_0.entries.5]
text = [
  "Growwwwf!$",
]

[msg.section_0.entries.0]
text = [
  "Currently, we're exhibiting works\\n",
  "from up-and-coming young artists!$",
]

[msg.section_0.entries.1]
text = [
  "In Castelia City, the Pokémon Gym\\n",
  "itself is Burgh's artwork!$",
]

[msg.section_0.entries.2]
text = [
  "Title “White and Black Dragons\\\"$",
]

[msg.section_0.entries.3]
text = [
  "Title “Sin and Money Stack Up\\\"$",
]

[msg.section_0.entries.4]
text = [
  "Title “Ugly Truth\\\"$",
]

[msg.section_0.entries.5]
text = [
  "Title “Vanished Hero\\\"$",
]

[msg.section_0.entries.6]
text = [
  "Title “Eternal Ideals\\\"$",
]

[msg.section_0.entries.7]
text = [
  "Title “Two Beings--A Meeting\\n",
  "That Must Occur\\\"$",
]

[msg.section_0.entries.8]
text = [
  "I am not as good an artist as Burgh,\\n",
  "but I have a liking for paintings.\\c\\n",
  "Let me see. Today, I'd like to paint\\n",
  "[VAR TYPE(0)]-type Pokémon!\\c\\n",
  "Will you show me what kinds of Pokémon\\n",
  "you have?$",
]

[msg.section_0.entries.9]
text = [
  "Please show me a Pokémon that's\\n",
  "[VAR TYPE(0)] type!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Oh! You have that type!\\n",
  "I'm inspired!\\c\\n",
  "Thank you! As a token of my gratitude,\\n",
  "which one would you like?$",
]

[msg.section_0.entries.11]
text = [
  "Cheri Berry$",
]

[msg.section_0.entries.12]
text = [
  "Chesto Berry$",
]

[msg.section_0.entries.13]
text = [
  "Pecha Berry$",
]

[msg.section_0.entries.14]
text = [
  "Rawst Berry$",
]

[msg.section_0.entries.15]
text = [
  "Aspear Berry$",
]

[msg.section_0.entries.16]
text = [
  "One [VAR ITEM2(0)]!\\n",
  "It's all yours now!\\c$",
]

[msg.section_0.entries.17]
text = [
  "Aww. You are the best!\\n",
  "Please come back tomorrow, too!$",
]

[msg.section_0.entries.18]
text = [
  "As long as the artist enjoys creating\\n",
  "an artwork, it doesn't matter if the\\l\\n",
  "result is judged as bad or good.$",
]

[msg.section_0.entries.19]
text = [
  "If you catch a Pokémon that's\\n",
  "[VAR TYPE(0)] type, please show it to me!\\l\\n",
  "I'll give you a little something.$",
]

[msg.section_0.entries.20]
text = [
  "The Pokémon you chose is not the one\\n",
  "I requested.\\c\\n",
  "What I want to paint is a Pokémon that's\\n",
  "[VAR TYPE(0)] type!$",
]

[msg.section_0.entries.21]
text = [
  "Oh!\\n",
  "The shape of this Egg...\\c\\n",
  "Superb! It gives me chills!\\n",
  "It's electrifying! It makes me tremble!\\c\\n",
  "Alas, even I cannot tell what type\\n",
  "an Egg is!$",
]

[msg.section_0.entries.22]
text = [
  "Title “The Recipient\\\"$",
]

[msg.section_0.entries.23]
text = [
  "Title “The Moving Pokémon\\\"$",
]

[msg.section_0.entries.24]
text = [
  "Title “A Gift\\\"$",
]

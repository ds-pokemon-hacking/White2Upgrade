[msg.section_0.entries.0]
text = [
  "The number of Trainers on the\\n",
  "Royal Unova today is [VAR NUM1(3)].\\l\\n",
  "And you've won against [VAR NUM1(4)].\\c\\n",
  "The ship is nearing the port.\\n",
  "Would you like to get off the ship?$",
]

[msg.section_0.entries.1]
text = [
  "The number of Trainers on the\\n",
  "Royal Unova today is [VAR NUM1(3)].\\c\\n",
  "The ship is nearing the port.\\n",
  "Would you like to get off the ship?$",
]

[msg.section_0.entries.2]
text = [
  "There are a lot of cabins in this big ship!\\n",
  "I would like to give you advice 'cause\\l\\n",
  "you need help finding Trainers!\\c\\n",
  "Do you want to listen to my hint?$",
]

[msg.section_0.entries.3]
text = [
  "Some guests like to tell really long\\n",
  "stories, and they just keep talking\\l\\n",
  "until they hear a whistle!$",
]

[msg.section_0.entries.4]
text = [
  "The Royal Unova's renowned observation\\n",
  "deck is just ahead.$",
]

[msg.section_0.entries.5]
text = [
  "If you’re looking in the cabins with\\n",
  "blue doors for someone to battle,\\l\\n",
  "you’ll find only one Trainer there today.$",
]

[msg.section_0.entries.6]
text = [
  "It seems the number of Trainers in the\\n",
  "cabins with blue doors today is [VAR NUM1(2)].$",
]

[msg.section_0.entries.7]
text = [
  "It's running on the ocean!\\n",
  "What a peculiar thing to see!$",
]

[msg.section_0.entries.8]
text = [
  "I can't make up my mind whether to go to\\n",
  "the observation deck or battle some\\l\\n",
  "Trainers in the cabins.$",
]

[msg.section_0.entries.9]
text = [
  "I'm running with the rhythm of the waves,\\n",
  "but it's a real challenge!$",
]

[msg.section_0.entries.10]
text = [
  "Having battles on the ship and seeing\\n",
  "the scenery from the deck...\\l\\n",
  "This ship is the best!$",
]

[msg.section_0.entries.11]
text = [
  "I've been wondering which cabin to enter\\n",
  "this whole time!$",
]

[msg.section_0.entries.12]
text = [
  "I came here from Johto for business,\\n",
  "but everything is dynamic here.$",
]

[msg.section_0.entries.13]
text = [
  "Oh! Nice timing!\\n",
  "I wanted to talk to someone!\\c\\n",
  "I'm here from Johto\\n",
  "on a business trip!\\c\\n",
  "Don't you feel like people here are\\n",
  "a little cold? A little too suave, maybe?\\c\\n",
  "That's why I get nervous and have a\\n",
  "hard time making friends.\\c\\n",
  "I mean, even today, it's my day off,\\n",
  "and I'm here riding a ship all alone!\\c\\n",
  "That's it!\\c\\n",
  "Tell me how people make\\n",
  "friends here in Unova!\\l\\n",
  "Please! Come on!\\c\\n",
  "You're busy?\\n",
  "Couldn't you do something? Please!\\c\\n",
  "...\\c\\n",
  "Ah, it's so nice to have a nice\\n",
  "long conversation. Thanks!\\c$",
]

[msg.section_0.entries.14]
text = [
  "Oh! A whistle is blowing!\\c\\n",
  "Sorry to bother you when you're busy!\\n",
  "I hope you find some Trainers!\\c\\n",
  "I'll find some friends here\\n",
  "by doing what you said!$",
]

[msg.section_0.entries.15]
text = [
  "Even on their days off, corporate\\n",
  "warriors are ready for battle! Let's go!\\c$",
]

[msg.section_0.entries.16]
text = [
  "No matter how many times we battle,\\n",
  "I can't compete with you...\\c\\n",
  "I'll just relax and enjoy\\n",
  "my boat ride!$",
]

[msg.section_0.entries.17]
text = [
  "You see, when going to a town on the\\n",
  "coast, I always travel by cruise ship.\\c\\n",
  "You can take another look at places\\n",
  "that you've walked and get a new\\l\\n",
  "perspective on them from the sea.$",
]

[msg.section_0.entries.18]
text = [
  "When I'm relaxing like this,\\n",
  "I often remember the Pokémon\\l\\n",
  "I've raised up until this point.\\c\\n",
  "There were a few clumsy ones,\\n",
  "but they were all the best\\l\\n",
  "group of Pokémon you could want!$",
]

[msg.section_0.entries.19]
text = [
  "I've been traveling all over\\n",
  "because I wanted to prove\\l\\n",
  "Pokémon from the same place as me\\l\\n",
  "can make it anywhere in the world!\\c\\n",
  "I won't lose to you either!\\c$",
]

[msg.section_0.entries.20]
text = [
  "Trainers like you are hanging\\n",
  "out all over the world!\\c\\n",
  "Thinking about that gets\\n",
  "me really pumped up!$",
]

[msg.section_0.entries.21]
text = [
  "I hear there are people on this ship\\n",
  "from many places, like Kanto, Johto,\\l\\n",
  "and Sinnoh...\\c\\n",
  "Not only can you see pretty scenery\\n",
  "from the ship, it looks like you can\\l\\n",
  "see some unusual Pokémon!$",
]

[msg.section_0.entries.22]
text = [
  "I was on the deck with my arms\\n",
  "spread out and feeling like\\l\\n",
  "I was a Pokémon.\\c\\n",
  "Then the ship suddenly shook,\\n",
  "and I thought I was going to fall!\\c\\n",
  "Sigh... I wish I had someone to save\\n",
  "me right away at times like that.$",
]

[msg.section_0.entries.23]
text = [
  "Ta daaah! Good guess!\\n",
  "Get ready for battle. Here I come!\\c$",
]

[msg.section_0.entries.24]
text = [
  "I've been waiting\\n",
  "for a Trainer to challenge me!\\l\\n",
  "I was really sick of waiting!\\c\\n",
  "Thanks for talking to me!$",
]

[msg.section_0.entries.25]
text = [
  "Hey! Doesn't this ship\\n",
  "get you all excited?!\\c\\n",
  "I went completely wild while\\n",
  "I was all wound up like this...\\c\\n",
  "Then they locked me up in this room...\\c\\n",
  "I won't cause any more trouble!\\n",
  "Let me out of this room!$",
]

[msg.section_0.entries.26]
text = [
  "Pickin' a fight with me, huh?\\n",
  "Heh! You don't know what\\l\\n",
  "you're getting yourself into!\\c\\n",
  "Huh? What? Where are my Poké Balls?\\n",
  "Oh! I left them at home!$",
]

[msg.section_0.entries.27]
text = [
  "I feel sick...\\n",
  "But I'm a Trainer!\\c\\n",
  "I'm not going to lose to seasickness!\\n",
  "Let's battle!\\c$",
]

[msg.section_0.entries.28]
text = [
  "Urrg!\\c\\n",
  "Sorry!\\n",
  "Leave me alone for a minute...$",
]

[msg.section_0.entries.29]
text = [
  "Know what? I love this ship!\\n",
  "I mean, it's royal!$",
]

[msg.section_0.entries.30]
text = [
  "Hey, get a load of this!\\n",
  "Everyone's so mean!\\c\\n",
  "They're calling me selfish\\n",
  "and saying I blabber too much!\\c\\n",
  "Even though I'm the quiet and kind\\n",
  "and cute girl that everyone adores!\\c\\n",
  "Changing the subject,\\n",
  "what kind of Pokémon do you like?\\c\\n",
  "Oh... Never mind. More importantly,\\n",
  "isn't this outfit cute?\\c\\n",
  "I really like this brand...\\c\\n",
  "...\\n",
  "...\\c\\n",
  "How rude!\\n",
  "How dare you say I talk too much!\\c$",
]

[msg.section_0.entries.31]
text = [
  "Oh! A whistle!\\c\\n",
  "I just talked a little, and\\n",
  "now it's already this late!$",
]

[msg.section_0.entries.32]
text = [
  "So, I recently moved here to Unova!\\c\\n",
  "Hey, I've got some Pokémon you\\n",
  "don't usually see around here!\\l\\n",
  "Let's have a battle!\\c$",
]

[msg.section_0.entries.33]
text = [
  "Aren't my Pokémon cute?\\c\\n",
  "I want to catch lots of\\n",
  "Pokémon here, too!$",
]

[msg.section_0.entries.34]
text = [
  "You want to battle?\\c\\n",
  "Oh for pity's sake, this is why Trainers\\n",
  "are just a bunch of uncouth brutes...\\c\\n",
  "Do something other than\\n",
  "battle for a change.\\c\\n",
  "How about you enjoy this\\n",
  "elegant moment quietly?$",
]

[msg.section_0.entries.35]
text = [
  "I hear the Royal Unova\\n",
  "has been sailing around Castelia City\\l\\n",
  "since before I was born!$",
]

[msg.section_0.entries.36]
text = [
  "Nice!\\c\\n",
  "I was bored, because Mommy and Daddy\\n",
  "are on the deck! Let's battle!\\c$",
]

[msg.section_0.entries.37]
text = [
  "I have to wonder about parents\\n",
  "who would leave their child to\\l\\n",
  "go talk about love on the deck!$",
]

[msg.section_0.entries.38]
text = [
  "The wind's strong today,\\n",
  "so I'm relaxing in my room.\\c\\n",
  "I'll have this lovely room\\n",
  "all to myself until we return to port! ♪$",
]

[msg.section_0.entries.39]
text = [
  "The first whistle means\\n",
  "“Hello, nice to meet you!\\\"\\c\\n",
  "The second whistle means\\n",
  "“The ocean's lovely today!\\\"\\c\\n",
  "The third and fourth whistles mean\\n",
  "“Are you enjoying your sea voyage?\\\"\\c\\n",
  "The fifth whistle means\\n",
  "“Thanks, and see you again!\\\"\\c\\n",
  "Isn't it a nice feeling to think\\n",
  "the ship talks like this?$",
]

[msg.section_0.entries.40]
text = [
  "You! You came to pick up\\n",
  "cute little me?\\c\\n",
  "Tee hee hee! I'll be your opponent\\n",
  "in an amazing Pokémon battle!\\c$",
]

[msg.section_0.entries.41]
text = [
  "That's right... You're going to\\n",
  "take Pokémon with you, not me!$",
]

[msg.section_0.entries.42]
text = [
  "From your standpoint,\\n",
  "I'm a Trainer from beyond the sea,\\l\\n",
  "and from my standpoint,\\l\\n",
  "you're a Trainer from beyond the sea!$",
]

[msg.section_0.entries.43]
text = [
  "Oh! Welcome. Please sit down.\\n",
  "I'll pour you some tea.\\c\\n",
  "Please, don't be bashful!\\n",
  "A Gentleman must entertain\\l\\n",
  "guests who are kind enough\\l\\n",
  "to visit his room.\\c\\n",
  "Come now. Forget about battles\\n",
  "for one moment.\\c\\n",
  "Would you like tea or coffee?\\n",
  "Doesn't it have a lovely fragrance?\\c\\n",
  "...\\c\\n",
  "That was a lot of fun.\\n",
  "Come again!\\c$",
]

[msg.section_0.entries.44]
text = [
  "That was a lot of fun.\\c\\n",
  "If you'd like to relax again sometime,\\n",
  "please come again!$",
]

[msg.section_0.entries.45]
text = [
  "Oh! Welcome. Please sit down.\\n",
  "I'll pour you some tea...\\c\\n",
  "Kidding! I'm a Trainer!\\n",
  "I'll entertain you with Pokémon!\\c$",
]

[msg.section_0.entries.46]
text = [
  "Nothing like a tea break after\\n",
  "an intense Pokémon battle!\\c\\n",
  "Would you like to join me for a cup?\\n",
  "Ah... Out of tea...$",
]

[msg.section_0.entries.47]
text = [
  "Are you looking for Pokémon Trainers?\\n",
  "Sorry, I don't know where to find them.\\c\\n",
  "But the crew may know where they are.$",
]

[msg.section_0.entries.48]
text = [
  "As I left my body to the\\n",
  "swaying of the sea,\\l\\n",
  "a rich poem sprung\\l\\n",
  "up from the depths of my soul.\\c\\n",
  "The title is,\\n",
  "“Everything's Blue!\\\"\\c\\n",
  "Let me read it to you!\\c\\n",
  "Oh, ocean! You're blue!\\n",
  "Sky! You're blue, too!\\l\\n",
  "I talk a blue streak!\\l\\n",
  "I'm afraid that in a blue moon,\\l\\n",
  "that sunset will turn a baby blue!\\l\\n",
  "That's it!\\c\\n",
  "My next poem is,\\n",
  "“Everything's Red!\\\"\\c\\n",
  "OK! Here I go!\\c\\n",
  "...\\c\\n",
  "Mmm! Isn't that a moving poem?\\n",
  "Hee hee! Feel free to cry!\\c$",
]

[msg.section_0.entries.49]
text = [
  "You're looking for a Trainer?\\n",
  "I'm sorry I didn't notice!\\c\\n",
  "I was sure that you were\\n",
  "wandering around looking\\l\\n",
  "for a wonderful poem!$",
]

[msg.section_0.entries.50]
text = [
  "Hee hee! Looking for a Trainer?\\n",
  "I'm an old woman, but do you mind?\\c$",
]

[msg.section_0.entries.51]
text = [
  "Battling on the ocean\\n",
  "sure has charm, doesn't it?$",
]

[msg.section_0.entries.52]
text = [
  "I hear there is a troublesome\\n",
  "guy somewhere in the cabins\\l\\n",
  "who just goes on and on.\\c\\n",
  "He's called the Seviper guy because\\n",
  "he resembles a Pokémon.$",
]

[msg.section_0.entries.53]
text = [
  "Ho ho! You talked to me, didn't you?\\c\\n",
  "Once I've sunk my fangs into you,\\n",
  "I never let go!\\c\\n",
  "Everyone on this cruise ship\\n",
  "likens me to a Pokémon--\\l\\n",
  "I'm the Seviper guy!\\c\\n",
  "I mean, c'mon. I'm so lonely!\\n",
  "I want to talk to young people!\\c\\n",
  "Well now, first of all, listen\\n",
  "to me complain about work...\\c\\n",
  "...\\c\\n",
  "...Huh?\\n",
  "What was I going to talk about again?\\c$",
]

[msg.section_0.entries.54]
text = [
  "I don't care how many\\n",
  "times the whistle blew--I'm lonely!\\c\\n",
  "Don't leave me!$",
]

[msg.section_0.entries.55]
text = [
  "I'm sorry! This room is being cleaned...\\n",
  "Oh my! You're a Trainer, aren't you?\\c\\n",
  "Hee hee! Why don't we have\\n",
  "a quiet little Pokémon battle?\\c$",
]

[msg.section_0.entries.56]
text = [
  "The fact I stopped working\\n",
  "to battle is our secret, OK?$",
]

[msg.section_0.entries.57]
text = [
  "Today...\\c\\n",
  "As for people, we have [VAR NUM1(0)] on the\\n",
  "port side and [VAR NUM1(1)] on the starboard side.$",
]

[msg.section_0.entries.58]
text = [
  "Today...\\c\\n",
  "The number of people on the starboard\\n",
  "side is [VAR NUM1(1)], and...none on the port side.$",
]

[msg.section_0.entries.59]
text = [
  "Today...\\c\\n",
  "The number of people on the port side is\\n",
  "[VAR NUM1(0)], and...none on the starboard side.$",
]

[msg.section_0.entries.60]
text = [
  "If you're so inclined, speak to me.\\n",
  "I will give you a hint anytime.$",
]

[msg.section_0.entries.61]
text = [
  "Do you want to know a hint\\n",
  "about looking for Trainers?$",
]

[msg.section_0.entries.62]
text = [
  "Certainly. Just a moment, please.\\c$",
]

[msg.section_0.entries.63]
text = [
  "Certainly.\\n",
  "Please continue to have a great time!$",
]

[msg.section_0.entries.64]
text = [
  "Won against every Trainer on the ship!$",
]

[msg.section_0.entries.65]
text = [
  "Thank you very much for sailing with us\\n",
  "on the Royal Unova.\\c\\n",
  "The number of Trainers aboard the\\n",
  "Royal Unova today is [VAR NUM1(3)].\\l\\n",
  "Please enjoy the trip.\\c$",
]

[msg.section_0.entries.66]
text = [
  "The number of Trainers aboard the\\n",
  "Royal Unova today is [VAR NUM1(3)].\\l\\n",
  "You... Congratulations!\\c\\n",
  "You've won against every Trainer\\n",
  "on the ship!\\c\\n",
  "The ship is nearing the port.\\n",
  "Would you like to get off the ship?$",
]

[msg.section_0.entries.67]
text = [
  "Thank you for sailing with us.\\c\\n",
  "This cruise ship will arrive\\n",
  "in Castelia City shortly.\\c$",
]

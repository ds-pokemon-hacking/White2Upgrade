[msg.section_0.entries.0]
text = [
  "If I compared the glow of Nimbasa to\\n",
  "something, it would be the sun!\\c\\n",
  "Yes, the sun!\\n",
  "It inspires me to give you this!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Sun Stones are stones that make certain\\n",
  "Pokémon evolve!\\c\\n",
  "I gave it to Petilil as a present!$",
]

[msg.section_0.entries.2]
text = [
  "Sun Stones are stones that make certain\\n",
  "Pokémon evolve!\\c\\n",
  "I gave it to Cottonee as a present!$",
]

[msg.section_0.entries.3]
text = [
  "If you love your Pokémon, even if it\\n",
  "changes its appearance, you'll stay\\l\\n",
  "connected with your Pokémon.\\c\\n",
  "You and [VAR PKNAME(0)] are...\\c$",
]

[msg.section_0.entries.4]
text = [
  "Very connected to each other!\\n",
  "That's what it looks like to me!$",
]

[msg.section_0.entries.5]
text = [
  "Just starting to understand\\n",
  "each other. That's what it seems like...$",
]

[msg.section_0.entries.6]
text = [
  "Perhaps capable of being more connected.\\n",
  "I hope you enjoy the changes.$",
]

[msg.section_0.entries.7]
text = [
  "Pokémon evolve in many different ways.\\c\\n",
  "Some evolve by becoming stronger\\n",
  "through battle.\\c\\n",
  "Others evolve when certain items\\n",
  "are used on them.\\c\\n",
  "Some even evolve during Link Trades.\\c\\n",
  "If you ask Professor Juniper, she'll\\n",
  "tell you anything you need to know!$",
]

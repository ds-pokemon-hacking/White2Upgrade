[msg.section_0.entries.0]
text = [
  "Hi there! You're participating\\n",
  "in the Medal Rally, aren't you?\\c\\n",
  "Let me have a look here.\\n",
  "The number of Medals you have is...\\l\\n",
  "[VAR NUM3(0)]!\\c$",
]

[msg.section_0.entries.1]
text = [
  "I have 10!\\n",
  "I'm ahead of you!$",
]

[msg.section_0.entries.2]
text = [
  "I have 30!\\n",
  "You've collected many,\\l\\n",
  "but I'm not going to lose!$",
]

[msg.section_0.entries.3]
text = [
  "I have 50!\\c\\n",
  "Did you know? If you collect\\n",
  "50 Medals, something good happens.$",
]

[msg.section_0.entries.4]
text = [
  "Whoa! You reached the goal, too?\\c\\n",
  "Me?\\c\\n",
  "I have 100!\\n",
  "Heh heh!$",
]

[msg.section_0.entries.5]
text = [
  "Amazing!\\n",
  "You've collected that many?\\c\\n",
  "You have more than me!\\c\\n",
  "I've been having trouble\\n",
  "getting more since I collected 100...$",
]

[msg.section_0.entries.6]
text = [
  "If anyone can collect every\\n",
  "Medal, it's you!\\c\\n",
  "I don't know how many\\n",
  "there are in all, but...\\c\\n",
  "Me? I only have 150...\\c\\n",
  "I'll do my best!$",
]

[msg.section_0.entries.7]
text = [
  "Wow!\\c\\n",
  "You collected every Medal?!\\n",
  "A-amazing! That's too incredible!\\c\\n",
  "I finally collected 200!\\c\\n",
  "I'll use you as an inspiration,\\n",
  "and I'll do my best to get every one!$",
]

[msg.section_0.entries.8]
text = [
  "The maniacs for items are sure odd!\\c\\n",
  "They'll buy ordinary items\\n",
  "for much more than normal!\\c\\n",
  "If you hold on to items, even ones\\n",
  "you have no use for, you might be able to\\l\\n",
  "sell them to a maniac!$",
]

[msg.section_0.entries.9]
text = [
  "My Roggenrola's Ability is Sturdy!\\c\\n",
  "If an attack that would knock it out\\n",
  "hits it when its HP is full,\\l\\n",
  "it will stay standing with one HP!$",
]

[msg.section_0.entries.10]
text = [
  "Sturrr!$",
]

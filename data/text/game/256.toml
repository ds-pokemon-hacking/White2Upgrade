[msg]
trailing_data = "4242"

[msg.section_0.entries.0]
text = [
  "I'm Marshal, one of the Elite Four!\\c\\n",
  "You look like you're a\\n",
  "Pokémon Trainer with potential,\\l\\n",
  "but I can't let you into Twist Mountain!\\c\\n",
  "The inside collapsed,\\n",
  "and you can't get through!$",
]

[msg.section_0.entries.1]
text = [
  "[VAR TRNAME(0)]!\\c\\n",
  "Oh, I see! So, you travel all around\\n",
  "like this and toughen yourself up, then.$",
]

[msg.section_0.entries.2]
text = [
  "Well, I suppose you have\\n",
  "many battles ahead of you.\\c\\n",
  "Pokémon battles as a Pokémon Trainer.\\c\\n",
  "Battles about how you\\n",
  "should live your life...\\c\\n",
  "You'll lose sometimes,\\n",
  "but I think what matters\\l\\n",
  "is that you do things your own way.\\c\\n",
  "If you surpass what you've done before,\\n",
  "you have bested yourself.$",
]

[msg.section_0.entries.3]
text = [
  "Well then. I'll be waiting for\\n",
  "your challenge at the Pokémon League!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Twist Mountain ahead.\\n",
  "Watch out for wild Pokémon.$",
]

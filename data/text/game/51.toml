  "This survey is...\\n",
  "a request from a cartoonist.\\c\\n",
  "This survey requires you to pass by\\n",
  "40 or more people to find out\\l\\n",
  "what people would do with magical powers\\l\\n",
  "and what they would do if they were rich.\\c\\n",
  "The result of the survey\\n",
  "will help with writing a story.\\c$",
]

[msg.section_0.entries.94]

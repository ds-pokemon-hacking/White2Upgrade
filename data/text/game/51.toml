  "This survey requires you to pass by\\n",
  "50 or more people to find out\\l\\n",
  "the most popular kind of game.\\c\\n",
  "The results will help the\\n",
  "company make games.\\c$",
]

[msg.section_0.entries.95]
text = [
  "This survey is...\\n",
  "a request from me.\\c\\n",
  "This survey requires you to pass by\\n",
  "50 or more people to find out\\l\\n",
  "the most popular way to spend a holiday\\l\\n",
  "and the most popular way\\l\\n",
  "to play with friends.\\c\\n",
  "Why? Well, to tell you the truth,\\n",
  "I'm meeting some friends next weekend.\\c\\n",
  "I wanted to do something different\\n",
  "than usual during my days off.\\c$",
]


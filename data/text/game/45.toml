[msg]
trailing_data = "9e9e"

[msg.section_0.entries.0]
text = [
  "Everyone, we've arrived at\\n",
  "Castelia City!\\c$",
]

[msg.section_0.entries.1]
text = [
  "[VAR TRNAME(1)]: So this is Castelia City...\\n",
  "It's much bigger than I'd heard!\\c\\n",
  "But, it doesn't matter!\\c\\n",
  "I'm going to find Team Plasma\\n",
  "no matter where they run!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Oh yeah. [VAR TRNAME(0)]!\\c\\n",
  "Here, let's register each other's\\n",
  "Xtransceiver number.\\c\\n",
  "We didn't even need to in Aspertia.\\n",
  "We could see each other anytime!\\c$",
]

[msg.section_0.entries.3]
text = [
  "That's a strange ship.\\n",
  "A sailing ship in this day and age?\\c$",
]

[msg.section_0.entries.4]
text = [
  "What can I do for you?\\n",
  "Would you like to sail to Virbank City?$",
]

[msg.section_0.entries.5]
text = [
  "Of course!\\n",
  "Please, step this way!\\c$",
]

[msg.section_0.entries.6]
text = [
  "OK then! Please come talk to me\\n",
  "whenever you'd like to board!$",
]

[msg.section_0.entries.7]
text = [
  "When you just can't stand it anymore,\\n",
  "scream at the ocean!$",
]

[msg.section_0.entries.8]
text = [
  "That black sailing ship...\\n",
  "What could it be?$",
]

[msg.section_0.entries.9]
text = [
  "That black sailing ship...\\n",
  "What could it have been?$",
]

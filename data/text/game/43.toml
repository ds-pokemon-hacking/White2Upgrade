[msg.section_0.entries.0]
text = [
  "Liberty Garden, huh?\\c\\n",
  "A long time ago, an extremely rich\\n",
  "person hid a very amazing\\l\\n",
  "Pokémon called Victini there!$",
]

[msg.section_0.entries.1]
text = [
  "Ho ho! Trying to become stronger\\n",
  "by misusing Victini's powers...\\c\\n",
  "Team Plasma fell apart exactly because\\n",
  "they planned to do things like that!$",
]

[msg.section_0.entries.2]
text = [
  "It is small compared to a luxury liner.\\c\\n",
  "But the size of a ship doesn't change the\\n",
  "feeling of adventure when you're out on\\l\\n",
  "the open sea.\\c$",
]

[msg.section_0.entries.3]
text = [
  "Would you like to go to Liberty Garden?$",
]

[msg.section_0.entries.4]
text = [
  "Your timing is perfect.\\c\\n",
  "The ship is about to leave.\\n",
  "Please get aboard the ship and wait.\\c$",
]

[msg.section_0.entries.5]
text = [
  "If you'd like to go to Liberty Garden,\\n",
  "please let me know.\\c$",
]

[msg.section_0.entries.6]
text = [
  "Would you like to go\\n",
  "to Liberty Garden again?$",
]

[msg]
trailing_data = "b0b0"

[msg.section_0.entries.0]
text = [
  "Hi there, Trainer!\\n",
  "My name is Fennel.\\c\\n",
  "I'm researching\\n",
  "Pokémon Trainers!\\c$",
]

[msg.section_0.entries.1]
text = [
  "The [COLOR(2)]Game Sync[COLOR(0)] is a vital\\n",
  "part of that research!\\c\\n",
  "Let me explain the system\\n",
  "for collecting Trainers' save files.\\c$",
]

[msg.section_0.entries.2]
text = [
  "[COLOR(2)]Game Sync [COLOR(0)]is a system that retrieves\\n",
  "the memories of sleeping Pokémon!\\c\\n",
  "That's right! We can collect save files of\\n",
  "Trainers from all over the world!\\c$",
]

[msg.section_0.entries.3]
text = [
  "What's more, we learned that if you use\\n",
  "[COLOR(2)]Game Sync[COLOR(0)] to make a Pokémon sleep,\\l\\n",
  "it will have dreams.\\c\\n",
  "Then, when you wake up that Pokémon,\\n",
  "its dream becomes the reality in a\\l\\n",
  "space called the [COLOR(1)]Entralink [COLOR(0)]in the middle\\l\\n",
  "of the Unova region.\\c\\n",
  "Amazing, right?!\\n",
  "If you like, please send your save file.\\c\\n",
  "My assistant can explain the details,\\n",
  "so if you're interested,\\l\\n",
  "please talk to her.$",
]

[msg.section_0.entries.4]
text = [
  "Fennel: [COLOR(2)]Game Sync[COLOR(0)] is amazing, right?!\\n",
  "If you like, please send your save file.\\c\\n",
  "My assistant can explain the details,\\n",
  "so if you're interested,\\l\\n",
  "please talk to her.$",
]

[msg.section_0.entries.5]
text = [
  "Fennel: Oh, thank you!\\c\\n",
  "You also sent your save file. I saw it\\n",
  "while I was researching Trainers!\\c\\n",
  "[COLOR(2)]Game Sync[COLOR(0)] is amazing, right?$",
]

[msg.section_0.entries.6]
text = [
  "Are you a Trainer?\\c\\n",
  "Do you use the PC at Pokémon Centers?\\c\\n",
  "I am Amanita. I maintain the Box system.\\c$",
]

[msg.section_0.entries.7]
text = [
  "Oh!\\n",
  "You have a Pal Pad, I see!\\c\\n",
  "You can register your friends in your\\n",
  "Pal Pad.\\c\\n",
  "After you register, you can link with\\n",
  "those friends over Nintendo Wi-Fi\\l\\n",
  "Connection to do all kinds of fun things!\\c\\n",
  "You can trade Pokémon, challenge\\n",
  "your friends to a battle, and so on.\\c\\n",
  "Let me give you a quick how-to on\\n",
  "registering your friends.\\c\\n",
  "You can either input your friend's code\\n",
  "directly by using your Pal Pad...\\c\\n",
  "Or you can use the IR Connection\\n",
  "feature of the C-Gear.\\c\\n",
  "Then, you can register your friend!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Amanita: Is there something you'd like\\n",
  "to ask me?$",
]

[msg.section_0.entries.9]
text = [
  "Box$",
]

[msg.section_0.entries.10]
text = [
  "Battle Box$",
]

[msg.section_0.entries.11]
text = [
  "Pal Pad$",
]

[msg.section_0.entries.12]
text = [
  "Cancel$",
]

[msg.section_0.entries.13]
text = [
  "You can store up to 30 Pokémon\\n",
  "you caught in one Box.\\c\\n",
  "At first, there are only eight Boxes,\\n",
  "but as you store more Pokémon,\\l\\n",
  "the number of Boxes increases!$",
]

[msg.section_0.entries.14]
text = [
  "In the Battle Box, you can register one\\n",
  "to six Pokémon that you often use\\l\\n",
  "in battles.\\c\\n",
  "When you battle using Infrared\\n",
  "Connection, you can also battle with\\l\\n",
  "the Pokémon in the Battle Box!\\c\\n",
  "It's convenient because you don't\\n",
  "have to move Pokémon around!$",
]

[msg.section_0.entries.15]
text = [
  "In order to register your friend\\n",
  "in your Pal Pad...\\c\\n",
  "You can either input your friend's code\\n",
  "directly by using your Pal Pad in the\\l\\n",
  "Key Item case...\\c\\n",
  "Or you can use the IR Connection\\n",
  "feature of the C-Gear.\\c\\n",
  "Then, you can register your friend!$",
]

[msg.section_0.entries.16]
text = [
  "Catch a lot of Pokémon,\\n",
  "and use the Boxes a lot!$",
]

[msg.section_0.entries.17]
text = [
  "Oh! How are the Boxes working?\\c\\n",
  "Hey, that's right!\\n",
  "I have a bunch of Eevee!\\l\\n",
  "Would you take one for me?$",
]

[msg.section_0.entries.18]
text = [
  "This is an Eevee I received from\\n",
  "my friend in the Kanto region!\\c$",
]

[msg.section_0.entries.19]
text = [
  "[VAR TRNAME(0)] received\\n",
  "an Eevee!$",
]

[msg.section_0.entries.20]
text = [
  "Would you like to give a\\n",
  "nickname to this Eevee?$",
]

[msg.section_0.entries.21]
text = [
  "Oh! Your party is full!\\c\\n",
  "The PC Boxes were designed for\\n",
  "situations just like this!$",
]

[msg.section_0.entries.22]
text = [
  "How disappointing.\\c\\n",
  "Well, if you change your mind,\\n",
  "please come talk to me again!$",
]

[msg.section_0.entries.23]
text = [
  "Eevee is an amazing Pokémon\\n",
  "that has many potential evolutions!$",
]

[msg.section_0.entries.24]
text = [
  "I'm working as Fennel's assistant.\\c$",
]

[msg.section_0.entries.25]
text = [
  "Is there something you would\\n",
  "like to know about researching dreams?$",
]

[msg.section_0.entries.26]
text = [
  "Game Sync$",
]

[msg.section_0.entries.27]
text = [
  "Pokémon Dreams$",
]

[msg.section_0.entries.28]
text = [
  "Cancel$",
]

[msg.section_0.entries.29]
text = [
  "Game Sync is a system to collect save\\n",
  "files from Trainers all over the world\\l\\n",
  "through Nintendo Wi-Fi Connection\\l\\n",
  "by making Pokémon sleep and retrieving\\l\\n",
  "their dreams.\\c\\n",
  "Touch the Online button on the C-Gear\\n",
  "screen, and a button called\\l\\n",
  "[COLOR(1)]Game Sync [COLOR(0)]appears.\\c\\n",
  "Choose a Pokémon to tuck in, then\\n",
  "you can send your save file through\\l\\n",
  "Nintendo Wi-Fi Connection.\\c\\n",
  "You should be able to make more Pokémon\\n",
  "sleep as a result of the research.\\c$",
]

[msg.section_0.entries.30]
text = [
  "Pokémon Dreams...\\c\\n",
  "If you use Game Sync to make a\\n",
  "Pokémon sleep, it will have dreams.\\c\\n",
  "When you wake up the Pokémon with\\n",
  "Game Sync, its dream becomes the\\l\\n",
  "reality in a space called the [COLOR(1)]Entralink[COLOR(0)]\\l\\n",
  "in the middle of the Unova region...\\c$",
]

[msg.section_0.entries.31]
text = [
  "C-Gear Help\\c\\n",
  "If you have trouble using it, touch the\\n",
  "“?\\\" icon on the C-Gear screen!$",
]

[msg.section_0.entries.32]
text = [
  "What is the Pokémon Storage System?\\c\\n",
  "The person who developed the\\n",
  "Pokémon Storage System for the PC\\l\\n",
  "connection is Bill in the Kanto region.$",
]

[msg.section_0.entries.0]
text = [
  "Wait up!\\c$",
]

[msg.section_0.entries.1]
text = [
  "[VAR TRNAME(1)]: I'll battle with you\\n",
  "before you take on the Pokémon League.\\c\\n",
  "The more Pokémon battles you have,\\n",
  "the stronger you get, right?\\c$",
]

[msg.section_0.entries.2]
text = [
  "[VAR TRNAME(1)]: [VAR TRNAME(0)]!\\c\\n",
  "Thanks to you, I accomplished what\\n",
  "I set out to do during my journey!\\c\\n",
  "I wish I could've shown you\\n",
  "my little sister's huge smile!\\c\\n",
  "This is my thanks!\\c$",
]

[msg.section_0.entries.3]
text = [
  "I think you're really amazing!\\c\\n",
  "So become the Champion!\\c\\n",
  "Get the proof that you're a Trainer\\n",
  "your Pokémon can be proud of!\\c\\n",
  "See you!\\c$",
]

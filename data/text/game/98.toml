[msg.section_0.entries.0]
text = [
  "When you battle with a friend via\\n",
  "wireless communications, you can\\l\\n",
  "use the Wonder Launcher rule\\l\\n",
  "to use items in battle!$",
]

[msg.section_0.entries.1]
text = [
  "As the Wonder Launcher's energy\\n",
  "charges up, you get more points.\\c\\n",
  "You can spend those points\\n",
  "to use various battle items.$",
]

[msg.section_0.entries.2]
text = [
  "A few years ago, Nimbasa's\\n",
  "glitz and glamor was pleasant,\\l\\n",
  "but recently it's too much for me...\\c\\n",
  "Maybe I should go relax in the country.\\n",
  "My Pokémon might find that\\l\\n",
  "more comfortable as well.$",
]

[msg.section_0.entries.3]
text = [
  "I hear that some people's Pokémon\\n",
  "were stolen by Team Plasma,\\l\\n",
  "and they still haven't been reunited.$",
]

[msg.section_0.entries.4]
text = [
  "So about those people whose Pokémon\\n",
  "were stolen...\\c\\n",
  "I hear former Team Plasma members\\n",
  "came around and returned the Pokémon\\l\\n",
  "they took from a guy.\\c\\n",
  "But is that enough?\\n",
  "I'm not satisfied by that!$",
]

[msg.section_0.entries.5]
text = [
  "Tyyyym!$",
]

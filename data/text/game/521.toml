[msg.section_0.entries.0]
text = [
  "We don't raise little ones,\\n",
  "we help them grow.\\c\\n",
  "That's what I think, and the Day-Care\\n",
  "Couple next door feels the same.$",
]

[msg.section_0.entries.1]
text = [
  "Are you aware of the Pokémon Ability\\n",
  "Flame Body?$",
]

[msg.section_0.entries.2]
text = [
  "Impressive! I often see\\n",
  "Volcarona on Route 3!$",
]

[msg.section_0.entries.3]
text = [
  "OK! Listen to this, then.\\c\\n",
  "When a Pokémon with the Flame Body\\n",
  "Ability is with you, Eggs hatch faster!$",
]

[msg.section_0.entries.4]
text = [
  "Nice guys from Striaton City\\n",
  "gave this preschool its Pokémon!$",
]

[msg.section_0.entries.5]
text = [
  "I'm gonna be a Pokémon\\n",
  "when I grow up!$",
]

[msg.section_0.entries.6]
text = [

[msg.section_0.entries.1]
text = [
  "Wait! Waaait!\\c\\n",
  "I've been waiting for this day!\\n",
  "You're the 1,000th opponent!\\c\\n",
  "I've got a 999-win streak.\\n",
  "Be my battle opponent!$",
]

[msg.section_0.entries.2]
text = [
  "Gwa ha ha!\\n",
  "Even though you're just a fledgling,\\l\\n",
  "you'll still be my 1,000th win in a row!\\c$",
]

[msg.section_0.entries.3]
text = [
  "I understand. I've got a 999-win streak!\\n",
  "It's natural to be intimidated.\\c\\n",
  "But I can't let you go further\\n",
  "unless you battle me!\\c\\n",
  "And there's definitely no way around me.\\n",
  "Nope. You shouldn't use Surf\\l\\n",
  "to cross the river, for example.$",
]

[msg.section_0.entries.4]
text = [
  "I've steadily extended my win streak\\n",
  "for two years... And now it's over...\\c\\n",
  "But I have a strong will.\\n",
  "I declare that I'll try again\\l\\n",
  "to have a 1,000-win streak!\\c\\n",
  "I won't battle you next time, though.\\n",
  "You'll just break my streak.$",
]

[msg.section_0.entries.5]
text = [
  "[SPEED(2)]Oh... Oh...\\n",
  "So...thirsty...\\c\\n",
  "I met you on\\n",
  "the Tubeline Bridge...\\c\\n",
  "G-g-give me...\\n",
  "Fresh Water...?[SPEED(0)]$",
]

[msg.section_0.entries.6]
text = [
  "Refreshed!!\\c\\n",
  "I'm 100% rehydrated!\\n",
  "I feel better now! Thank you!\\c\\n",
  "I'll dash to the next bridge!$",
]

[msg.section_0.entries.7]
text = [
  "[SPEED(2)]But... You don't have Fresh Water...\\n",
  "I appreciate the thought, though...[SPEED(0)]$",
]

[msg.section_0.entries.8]
text = [
  "[SPEED(2)]Thank...\\c\\n",
  "What?\\n",
  "Oh...\\c\\n",
  "Without Fresh Water...\\n",
  "I can't run on bridges anymore.[SPEED(0)]$",
]

[msg.section_0.entries.9]
text = [
  "My favorite thing nowadays\\n",
  "is to compete in the PWT!$",
]

[msg.section_0.entries.10]
text = [
  "Practice as if it were a real game! Play\\n",
  "in a real game as if it were a practice!$",
]

[msg.section_0.entries.11]
text = [
  "I'll cross all the bridges\\n",
  "in the Unova region!\\c\\n",
  "Even the Marine Tube from Undella Town!\\n",
  "Hmm! I am so looking forward to it!$",
]

[msg.section_0.entries.12]
text = [
  "Derleth: Fweet fweet...\\n",
  "Fweeeeeet fweet fweet...$",
]

[msg.section_0.entries.13]
text = [
  "Derleth: What is piercing my mind is\\n",
  "a sad sound.\\c\\n",
  "What is piercing my heart is\\n",
  "a cold night wind.$",
]

[msg.section_0.entries.14]
text = [
  "Derleth: Fwee... Fwee...\\n",
  "Fffweeet fweet...$",
]

[msg.section_0.entries.15]
text = [
  "Derleth: The only things that come out\\n",
  "of my mouth are my whistle tunes and\\l\\n",
  "complaints about my life.\\c\\n",
  "This bridge is a meeting place for people\\n",
  "like me who like to complain.$",
]

[msg.section_0.entries.16]
text = [
  "Aickman: How about this? This sound!\\n",
  "Doesn't it get to your heart? Your mind?$",
]

[msg.section_0.entries.17]
text = [
  "Aickman: I know my sound doesn't fit\\n",
  "this city, this town.\\c\\n",
  "But I... I cannot change\\n",
  "my life, my style.$",
]

[msg.section_0.entries.18]
text = [
  "Aickman: This is my best friend, my pal.\\n",
  "It knows all my sorrow, all my tears.$",
]

[msg.section_0.entries.19]
text = [
  "Aickman: Y-you have great sparkles...\\n",
  "Sparkles in your eyes.\\c\\n",
  "Please make our hopes, our dreams,\\n",
  "come true for us.\\c\\n",
  "Go grab the glory--go take on the world!$",
]

[msg.section_0.entries.20]
text = [
  "Russo: La la la la la...$",
]

[msg.section_0.entries.21]
text = [
  "Russo: Ahem, ahem!\\n",
  "Now, something's not quite right.\\c\\n",
  "This here microphone's all screwy.\\n",
  "I can sing real good, promise!$",
]

[msg.section_0.entries.22]
text = [
  "Russo: Testing...\\n",
  "Check one, check two, check, check, yup.$",
]

[msg.section_0.entries.23]
text = [
  "Russo: Now, you're the first person in an\\n",
  "awful long time who's hung around to\\l\\n",
  "listen and hear what I was singin' about.\\c\\n",
  "Much obliged!$",
]

[msg.section_0.entries.24]
text = [
  "Koontz: Singing gives life to my spirit.\\n",
  "Will you listen to the voice of my spirit?$",
]

[msg.section_0.entries.25]
text = [
  "Koontz: Huh? Are you leaving already?\\n",
  "I am always here.$",
]

[msg.section_0.entries.26]
text = [
  "Koontz: Oh, you want to listen to my song\\n",
  "after all! Yes!$",
]

[msg.section_0.entries.27]
text = [
  "Koontz: My song...\\n",
  "Don't you like it?$",
]

[msg.section_0.entries.28]
text = [
  "I hear a sound from somewhere.\\n",
  "Sometimes it sounds sad.\\l\\n",
  "Sometimes it sounds a little goofy...\\l\\n",
  "Do you think it could be a ghost?$",
]

[msg.section_0.entries.29]
text = [
  "I hear a sound from somewhere.\\n",
  "Sometimes it sounds sad.\\l\\n",
  "Sometimes it sounds a little goofy...\\l\\n",
  "Do you think it could be a ghost?\\c\\n",
  "What?\\n",
  "A girl practicing music in that house?\\c\\n",
  "I see! I got it! Thank you!\\n",
  "Accept these as a thank-you gift!\\c$",
]

[msg.section_0.entries.30]
text = [
  "Keep somebody's secret.\\n",
  "Otherwise, your secret will be out.$",
]

[msg.section_0.entries.31]
text = [
  "I tried to ask for directions, but\\n",
  "it turned out I was talking to a\\l\\n",
  "Pokémon Trainer!\\c\\n",
  "You need to be careful, too.$",
]


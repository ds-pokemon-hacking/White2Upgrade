[msg.section_0.entries.0]
text = [
  "Brycen: In the past, when I was hurt and\\n",
  "depressed, Alder shared this with me...\\c\\n",
  "There is strength in being with other\\n",
  "people and Pokémon.\\c\\n",
  "Receiving their support makes\\n",
  "you stronger.\\c$",
]

[msg.section_0.entries.1]
text = [
  "I worked as a Gym Leader,\\n",
  "and I came to understand\\l\\n",
  "what he meant by that.\\c\\n",
  "My desire became to strengthen\\n",
  "this relationship that makes everyone\\l\\n",
  "stronger--the relationship between\\l\\n",
  "people and Pokémon.\\c\\n",
  "By focusing on the path of an actor,\\n",
  "I want to make everyone think\\l\\n",
  "that living together with Pokémon\\l\\n",
  "is exciting and wonderful.\\c$",
]

[msg.section_0.entries.2]
text = [
  "Teaching is being taught...\\n",
  "Excuse me, it's time for training.\\c$",
]

[msg.section_0.entries.3]
text = [
  "So cool, isn't it?\\c\\n",
  "That strong figure standing\\n",
  "there in the background!$",
]

[msg.section_0.entries.4]
text = [
  "Oh, I'm so sorry.\\c\\n",
  "Brycen decided to try to\\n",
  "return to his acting roots.\\c\\n",
  "Currently, he's working hard at\\n",
  "Pokéstar Studios!$",
]

[msg.section_0.entries.5]
text = [
  "Well, since you came all the way here...\\c$",
]

[msg.section_0.entries.6]
text = [
  "I'm grateful for everyone's support...$",
]

[msg.section_0.entries.7]
text = [
  "Former Icirrus City\\n",
  "Pokémon Gym$",
]

[msg]
trailing_data = "c4c4"

[msg.section_0.entries.0]
text = [
  "What could be the perfect\\n",
  "instrument for me?\\c\\n",
  "For example...\\c\\n",
  "I want a strong impact--\\n",
  "an impact as strong as a Pokémon\\l\\n",
  "with a tough Ability like Solid Rock\\l\\n",
  "that reduces the power\\l\\n",
  "of supereffective moves!\\c\\n",
  "If you have a Pokémon like that,\\n",
  "please show it to me!$",
]

[msg.section_0.entries.1]
text = [
  "Th-that [VAR PKNAME(0)]...\\n",
  "That Ability is Solid Rock!\\c\\n",
  "[VAR PKNAME(0)]\\n",
  "is as hard as a rock!\\c\\n",
  "And has a rocking heart!\\c\\n",
  "In other words, it has an impact\\n",
  "that rocks those who see it!\\c\\n",
  "Solid Rock... Like a hard rock...\\n",
  "Hard rock?!\\l\\n",
  "Could that be the sound\\l\\n",
  "I've been looking for?\\c\\n",
  "At any rate, thanks!\\n",
  "Take this, OK?\\c$",
]

[msg.section_0.entries.2]
text = [
  "Oh, you can't fit any\\n",
  "more in your Bag.$",
]

[msg.section_0.entries.3]
text = [
  "What is this feeling\\n",
  "coursing through my veins?$",
]

[msg.section_0.entries.4]
text = [
  "Jugga jya jaaaan!\\c\\n",
  "Deedley deeedly deeedly deeedly,\\n",
  "meedley meedley meedley meedley,\\l\\n",
  "MEEEEEEE!\\c\\n",
  "Yeeeeah! Your [VAR PKNAME(0)]'s\\n",
  "hard-rockin' Ability opened my eyes!\\c\\n",
  "Juggah juggah jah!\\n",
  "Duddah daaaaaah, bwan!\\c\\n",
  "That's it! I should join Roxie's band!\\n",
  "I could rock out with her! Dual guitars!\\l\\n",
  "Awesome!$",
]

[msg.section_0.entries.5]
text = [
  "Know what?\\c\\n",
  "You know the guy at the ledge\\n",
  "on Route 19? He's my rival!$",
]

[msg.section_0.entries.6]
text = [
  "My Pokémon aren't feeling well,\\n",
  "so I'm not walking in the tall grass.\\c\\n",
  "Oh, wait... You have eight Badges!\\n",
  "Eep! I'm so embarrassed!\\c\\n",
  "You already know this stuff!\\n",
  "I shouldn't try to show off!$",
]

[msg.section_0.entries.7]
text = [
  "Battles between Pokémon Trainers\\n",
  "are serious affairs you can't run from!\\c\\n",
  "I mean, more than anything, you can't\\n",
  "run away from other Trainers\\l\\n",
  "in front of your beloved Pokémon!$",
]

[msg.section_0.entries.8]
text = [
  "Route 2$",
]

[msg.section_0.entries.9]
text = [
  "Route 2$",
]

[msg.section_0.entries.10]
text = [
  "Trainer Tips!\\c\\n",
  "\\n",
  "Pokémon that participate in battle\\n",
  "receive Exp. Points.\\c\\n",
  "Have your Pokémon battle often,\\n",
  "and make them stronger and stronger!$",
]

[msg.section_0.entries.11]
text = [
  "There's some graffiti\\n",
  "on the other side of the signboard...\\c\\n",
  "Nothing ventured, nothing gained.\\n",
  "Medals await the adventurous!$",
]

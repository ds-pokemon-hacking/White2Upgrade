[msg]
trailing_data = "c4c4"

[msg.section_0.entries.0]
text = [
  "It's me who appeared\\n",
  "when the flower opened up.\\c\\n",
  "You, standing over there...\\c\\n",
  "You look like a Pokémon Trainer\\n",
  "with strength and kindness.\\c\\n",
  "What I look for in my opponent is\\n",
  "superb strength...\\c\\n",
  "I'm counting on you!\\c$",
]

[msg.section_0.entries.1]
text = [
  "You haven't faced all of the members\\n",
  "of the Elite Four yet, have you?\\c\\n",
  "Don't concern yourself about me.\\n",
  "Go on ahead.$",
]

[msg.section_0.entries.2]
text = [
  "Winning is important,\\n",
  "but what's more important is\\l\\n",
  "whether I've done better this time.\\c\\n",
  "Because if I can't surpass myself,\\n",
  "I can't get close to my ideals.\\c\\n",
  "I want to improve and win more elegantly,\\n",
  "so I invite you to be my opponent\\l\\n",
  "again in the future, if you wish.$",
]

[msg.section_0.entries.3]
text = [
  "Somehow, you managed to defeat the\\n",
  "entire Elite Four of the Pokémon League.\\c\\n",
  "Check the statue in the center of the\\n",
  "plaza for the way to the Champion's room.$",
]

[msg.section_0.entries.4]
text = [
  "It's me who appeared\\n",
  "when the flower opened up.\\c\\n",
  "You who have been waiting...\\c\\n",
  "You look like a Pokémon Trainer\\n",
  "with refined strength and\\l\\n",
  "deepened kindness.\\c\\n",
  "What I look for in my opponent is\\n",
  "superb strength...\\c\\n",
  "Please unleash your power\\n",
  "to the fullest!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Alas! Even with the knowledge and skill\\n",
  "passed down in my family of Trainers,\\l\\n",
  "I still can't win.\\c\\n",
  "The reason I came here in the first place\\n",
  "was to encounter Trainers like you...$",
]

[msg.section_0.entries.6]
text = [
  "When I battle you,\\n",
  "I can't help but smile...\\c\\n",
  "Because I was able to improve myself,\\n",
  "and because you're an excellent Trainer.\\c\\n",
  "I want to improve and win more elegantly,\\n",
  "so I invite you to be my opponent\\l\\n",
  "again in the future, if you wish.$",
]

[msg.section_0.entries.7]
text = [
  "You have defeated the\\n",
  "Pokémon League's Elite Four.\\c\\n",
  "You have earned the right to\\n",
  "proceed to the Champion's room.\\c\\n",
  "Making an entrance is not the point.\\c\\n",
  "Once you're there, you'll need to\\n",
  "unleash your power to the fullest!$",
]

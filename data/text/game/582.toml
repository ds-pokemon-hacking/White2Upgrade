[msg.section_0.entries.0]
text = [
  "Kawbraa!$",
]

[msg.section_0.entries.1]
text = [
  "Cobalion ran away\\n",
  "beyond the road...$",
]

[msg.section_0.entries.2]
text = [
  "What am I doing?\\n",
  "I'm hunting for TREASURE!\\c\\n",
  "Treasure hunting is fun. Sometimes things\\n",
  "are buried in the sand dunes.\\c\\n",
  "Actually, I just found something!\\c\\n",
  "But it's the same one as I found before,\\n",
  "so I will give this to you.\\c$",
]

[msg.section_0.entries.3]
text = [
  "I just found a treasure.\\c\\n",
  "But it's the same one as I found before,\\n",
  "so I'll give you this one.\\c$",
]

[msg.section_0.entries.4]
text = [
  "I'll be hunting for treasure here\\n",
  "tomorrow, too.\\c\\n",
  "I may find something, so if you have\\n",
  "time, stop by.\\c\\n",
  "I don't find as many things\\n",
  "as I used to, though...$",
]

[msg.section_0.entries.5]

[msg]
trailing_data = "9e9e"

[msg.section_0.entries.0]
text = [
  "I asked Alder from Floccesy Town\\n",
  "to teach here.\\c\\n",
  "He declined, saying it was the\\n",
  "era of young people now.$",
]

[msg.section_0.entries.1]
text = [
  "Do you use items during\\n",
  "Pokémon battles?\\l\\n",
  "If you'd like, try using this!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Use X Defend to make a\\n",
  "Pokémon's Defense go up!\\c\\n",
  "A Trainer's judgment about whether to\\n",
  "use items or moves is important in battle!$",
]

[msg.section_0.entries.3]
text = [
  "There's a technique that enables you\\n",
  "to cancel evolution!\\c\\n",
  "Here, I'll read the textbook to you.\\c\\n",
  "“You can surprise a Pokémon and stop\\n",
  "its evolution by pressing the B Button\\l\\n",
  "when a Pokémon is evolving.\\\"$",
]

[msg.section_0.entries.4]
text = [
  "You know how you can have\\n",
  "your Pokémon hold items?\\c\\n",
  "Well, it seems like they don't know\\n",
  "how to use items made by people,\\l\\n",
  "like Potions.$",
]

[msg.section_0.entries.5]
text = [
  "Normal-type Pokémon are weak\\n",
  "to Fighting-type Pokémon.\\c\\n",
  "But the only Pokémon around here like\\n",
  "that are the Riolu in Floccesy Ranch...\\c\\n",
  "If you're going to battle with a Fire-,\\n",
  "Water-, or Grass-type Pokémon,\\l\\n",
  "it'll be a simple test of strength!$",
]

[msg.section_0.entries.6]
text = [
  "The blackboard explains Pokémon\\n",
  "status changes in battle.\\c$",
]

[msg.section_0.entries.7]
text = [
  "What do you want to read about?$",
]

[msg.section_0.entries.8]
text = [
  "If poisoned, a Pokémon steadily loses HP\\n",
  "when battling.\\c\\n",
  "The poison lingers after the battle.\\n",
  "To cure it, use an Antidote.\\c$",
]

[msg.section_0.entries.9]
text = [
  "Paralysis reduces the Speed stat\\n",
  "and may prevent movement.\\c\\n",
  "It remains after battle, so use a\\n",
  "Parlyz Heal.\\c$",
]

[msg.section_0.entries.10]
text = [
  "If a Pokémon falls asleep, it will be\\n",
  "unable to attack.\\c\\n",
  "The Pokémon may wake up on its own,\\n",
  "but if a battle ends while it is\\l\\n",
  "sleeping, it will stay asleep.\\c\\n",
  "Wake it up using an Awakening.\\c$",
]

[msg.section_0.entries.11]
text = [
  "A burn reduces the Attack stat and\\n",
  "steadily reduces the victim's HP.\\c\\n",
  "A burn lingers after battle.\\n",
  "Cure a burn using a Burn Heal.\\c$",
]

[msg.section_0.entries.12]
text = [
  "If a Pokémon is frozen, it becomes\\n",
  "completely helpless.\\c\\n",
  "The Pokémon may thaw out on its own,\\n",
  "but if a battle ends while it is\\l\\n",
  "frozen, it will stay frozen.\\c\\n",
  "Thaw it out using an Ice Heal.\\c$",
]


[msg.section_0.entries.0]
text = [
  "Ahem!\\c\\n",
  "I am the chairman who loves Pokémon the\\n",
  "most among Pokéfans in the entire world!\\c$",
]

[msg.section_0.entries.1]
text = [
  "If you are a Trainer, will you show me\\n",
  "how you are raising your Pokémon\\l\\n",
  "with loving care?$",
]

[msg.section_0.entries.2]
text = [
  "You're a shy Trainer, aren't you?$",
]

[msg.section_0.entries.3]
text = [
  "Oh!\\n",
  "Which Pokémon will you show me?\\c$",
]

[msg.section_0.entries.4]
text = [
  "...Hmmm.\\n",
  "It's hard to tell...$",
]

[msg.section_0.entries.5]
text = [
  "Well...it's a bit hard to tell how much\\n",
  "that Egg has grown.$",
]

[msg.section_0.entries.6]
text = [
  "Oh! This [VAR PKNAME(0)] was level [VAR NUM3(1)]\\n",
  "when you met, but now it's level [VAR NUM3(2)]!\\c$",
]

[msg.section_0.entries.7]
text = [
  "You've raised it very well.\\n",
  "It's received a lot of love from you.\\c$",
]

[msg.section_0.entries.8]
text = [
  "You've raised it quite well.\\n",
  "I feel your love for this Pokémon.\\c$",
]

[msg.section_0.entries.9]
text = [
  "You've raised it well.\\n",
  "You must be affectionate.\\c$",
]

[msg.section_0.entries.10]
text = [
  "I see! Although it's just a smidgen,\\n",
  "I can feel your love for your Pokémon.\\c$",
]

[msg.section_0.entries.11]
text = [
  "That is a token of gratitude for showing\\n",
  "me your great love for your Pokémon!$",
]

[msg.section_0.entries.12]
text = [
  "Well, you showed me good stuff!\\c\\n",
  "Please keep raising your Pokémon\\n",
  "with loving care!$",
]

[msg.section_0.entries.13]
text = [
  "What? It has not grown at all.\\c\\n",
  "Still, if you travel with your Pokémon\\n",
  "from now on, I am sure it will grow!$",
]

[msg.section_0.entries.14]
text = [
  "Welcome to the Pokémon Fan Club.\\c\\n",
  "Shall I check how friendly your Pokémon\\n",
  "is toward you?$",
]

[msg.section_0.entries.15]
text = [
  "I can't tell whether or not you and\\n",
  "the Egg are close friends.$",
]

[msg.section_0.entries.16]
text = [
  "Oh, my. Your [VAR PKNAME(0)]...\\c$",
]

[msg.section_0.entries.17]
text = [
  "It is super friendly to you!\\n",
  "I'm a bit jealous!$",
]

[msg.section_0.entries.18]
text = [
  "It is quite friendly to you!\\n",
  "You must be a kind person!$",
]

[msg.section_0.entries.19]
text = [
  "It is friendly to you.\\n",
  "It must be happy with you.$",
]

[msg.section_0.entries.20]
text = [
  "It is a little friendly to you...\\n",
  "That's what I'm getting.$",
]

[msg.section_0.entries.21]
text = [
  "The relationship is neither good\\n",
  "nor bad... It looks neutral.$",
]

[msg.section_0.entries.22]
text = [
  "Hmmm...\\n",
  "It may not like you very much.$",
]

[msg.section_0.entries.23]
text = [
  "By any chance, you...\\c\\n",
  "Are you a very strict person?\\n",
  "I feel that it really doesn't like you...$",
]

[msg.section_0.entries.24]
text = [
  "Oh, you are so shy! Come on,\\n",
  "don't hide your Pokémon from me.$",
]

[msg.section_0.entries.25]
text = [
  "Muuun!$",
]

[msg.section_0.entries.26]
text = [
  "Glibalugga!$",
]

[msg.section_0.entries.27]
text = [
  "Dii?$",
]

[msg.section_0.entries.28]

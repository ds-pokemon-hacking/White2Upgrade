[msg.section_0.entries.0]
text = [
  "As they wandered in search of Pokémon,\\n",
  "people began making homes in more places.\\c\\n",
  "This ranch used to be a grassy meadow.\\c\\n",
  "It's now become a place where people\\n",
  "and Pokémon have homes together!$",
]

[msg.section_0.entries.1]
text = [
  "I don't really know much about\\n",
  "Pokémon types and stuff like that.\\c\\n",
  "I just focus on raising one Pokémon\\n",
  "and charge ahead!\\c\\n",
  "But it's kinda the hard way to do things.\\c\\n",
  "When I run into a Pokémon that mine is\\n",
  "not good against, I can't win anymore!$",
]

[msg.section_0.entries.2]
text = [
  "Oh, you have so many Pokémon!\\c\\n",
  "Seems to me that thinking about how\\n",
  "to raise each one would be a lot of fun!$",
]

[msg.section_0.entries.3]
text = [
  "Yip!$",
]

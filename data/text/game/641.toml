[msg]
trailing_data = "9696"

[msg.section_0.entries.0]
text = [
  "[VAR TRNAME(1)]: Wait up!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Let's see how well we've\\n",
  "raised our Pokémon!\\c$",
]

[msg.section_0.entries.2]
text = [
  "[VAR TRNAME(1)]: Great!\\c\\n",
  "If we're this strong, Team Plasma will\\n",
  "run screaming when they see us!\\c$",
]

[msg.section_0.entries.3]
text = [
  "I won't let 'em get away, though!\\c\\n",
  "Her Purrloin...\\n",
  "I'll get it back for sure!\\c$",
]

[msg.section_0.entries.4]
text = [
  "So, [VAR TRNAME(0)]!\\n",
  "Keep helping me out!\\c\\n",
  "Also, continue to work hard\\n",
  "on the Pokédex!\\c\\n",
  "You're the one who was officially\\n",
  "asked to complete it, after all!\\c$",
]

[msg.section_0.entries.5]
text = [
  "[VAR TRNAME(1)]: What?!\\c\\n",
  "It isn't like I came here because\\n",
  "I heard rumors about Cynthia\\l\\n",
  "being here and I wanted to challenge\\l\\n",
  "her or anything...\\c\\n",
  "I was interested in the Abyssal Ruins!\\c\\n",
  "See! Here's proof! You can have it!\\c$",
]

[msg.section_0.entries.6]
text = [
  "[VAR TRNAME(1)]: It's Dive!\\c\\n",
  "If you have a Pokémon that knows it,\\n",
  "you can dive to the ocean floor.\\c\\n",
  "If it wasn't for you, I wouldn't have\\n",
  "found my sister's Purrloin...\\l\\n",
  "Or should I say her Liepard...\\c$",
]

[msg.section_0.entries.7]
text = [
  "OK! [VAR TRNAME(0)]!\\c\\n",
  "Let's see who are Aspertia's\\n",
  "strongest Pokémon!$",
]

[msg.section_0.entries.8]
text = [
  "Go get 'em, guys!\\c$",
]

[msg.section_0.entries.9]
text = [
  "What's the deal?\\n",
  "Don't act all cool.$",
]

[msg.section_0.entries.10]
text = [
  "[VAR TRNAME(1)]: [VAR TRNAME(0)]...\\c\\n",
  "I'm really glad you're my friend!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Undellaaaaa!$",
]

[msg.section_0.entries.12]
text = [
  "The Pokémon World Tournament...\\n",
  "I wonder if Cynthia will participate, too.$",
]

[msg.section_0.entries.13]
text = [
  "Cynthia is participating in the\\n",
  "Pokémon World Tournament!\\l\\n",
  "I have to cheer for her!$",
]

[msg.section_0.entries.14]
text = [
  "The Riches moved far away,\\n",
  "and it's a little bit lonelier around here.$",
]

[msg.section_0.entries.15]
text = [
  "The sunlight is strong...\\c\\n",
  "Depending on the Pokémon, that can be\\n",
  "either an advantage or a disadvantage.\\c\\n",
  "Strong sunlight makes Fire-type moves\\n",
  "stronger and Water-type moves weaker.$",
]

[msg.section_0.entries.16]
text = [
  "Yaaaay! Yaaay!\\n",
  "Undella Town!!$",
]

[msg.section_0.entries.17]
text = [
  "Sometimes Jellicent\\n",
  "float into Undella Bay.\\l\\n",
  "They have a reputation for\\l\\n",
  "being a little...unusual.$",
]

[msg.section_0.entries.18]
text = [
  "We're starting construction to\\n",
  "further develop Undella's resorts.\\c\\n",
  "We just connected to the volcano,\\n",
  "and we're in awe of nature's power!$",
]

[msg.section_0.entries.19]
text = [
  "Undella Town\\n",
  "A Town of Rippling Waves$",
]

[msg.section_0.entries.20]
text = [
  "Reversal Mountain Ahead$",
]

[msg.section_0.entries.21]
text = [
  "Marine Tube Ahead\\n",
  "The Walk-Through Aquarium$",
]

[msg.section_0.entries.22]
text = [
  "Zinzolin: Mmm, it's so warm here.\\c\\n",
  "Let me get to the point.\\c\\n",
  "I have papers that\\n",
  "Lord Ghetsis left behind.\\c\\n",
  "With these, you can read the ancient\\n",
  "scripts in the Abyssal Ruins.\\c\\n",
  "As my own small, little way to atone\\n",
  "for my sins, I'll read them to you!\\c$",
]

[msg.section_0.entries.23]
text = [
  "[VAR TRNAME(0)] is now able to read\\n",
  "the Abyssal Ruins script!$",
]

[msg.section_0.entries.24]
text = [
  "Just to make sure you know,\\n",
  "you reach the Abyssal Ruins\\l\\n",
  "by using Dive in Undella Bay.\\c\\n",
  "And you must write down the\\n",
  "ciphers you find in the\\l\\n",
  "Abyssal Ruins by yourself.$",
]

[msg.section_0.entries.25]
text = [
  "According to Lord Ghetsis's papers,\\n",
  "the ancient peoples read in the\\l\\n",
  "opposite direction to how we read now.\\c$",
]

[msg.section_0.entries.26]
text = [
  "This is what was written\\n",
  "in the papers...\\c\\n",
  "If you reach the second floor,\\n",
  "read by shifting one letter.\\c\\n",
  "If you reach the third floor,\\n",
  "read by shifting two letters.\\c\\n",
  "What I mean by “shifting\\\" is replacing\\n",
  "a letter with the previous\\l\\n",
  "letter in the alphabet.\\c$",
]

[msg.section_0.entries.27]
text = [
  "The king must be the presence that\\n",
  "stopped the war and united the people.\\c$",
]

[msg.section_0.entries.28]
text = [
  "The king could see the future\\n",
  "and talk to all living things.\\l\\n",
  "He united the people.\\c\\n",
  "If that is the truth,\\n",
  "he was just like the hero!\\c$",
]

[msg.section_0.entries.29]
text = [
  "There are some characters I can't\\n",
  "recognize, but based on the context...\\c\\n",
  "An extremely wonderful king\\n",
  "was laid to rest in those ruins.\\c\\n",
  "If that king has descendants,\\n",
  "maybe those special powers\\l\\n",
  "were passed down...\\c$",
]

[msg.section_0.entries.30]
text = [
  "What?!\\n",
  "You made it even further, you say?\\c\\n",
  "And what kind of ciphers were there?\\c\\n",
  "...\\n",
  "...\\c\\n",
  "Ahem... Oh, yes, now I see.\\c$",
]

[msg.section_0.entries.31]
text = [
  "Keep searching!\\c\\n",
  "You need to write down the\\n",
  "Abyssal Ruins ciphers.$",
]

[msg.section_0.entries.32]
text = [
  "Now that I've learned everything\\n",
  "I wanted to know about the\\l\\n",
  "Abyssal Ruins, I take my leave.\\c\\n",
  "You are my enemy,\\n",
  "but your accomplishments and skill\\l\\n",
  "make you a worthwhile enemy. Adieu!\\c$",
]

[msg.section_0.entries.33]
text = [
  "The Xtransceiver is ringing.$",
]

[msg.section_0.entries.34]
text = [
  "[VAR TRNAME(0)] picked up the Xtransceiver.\\c$",
]

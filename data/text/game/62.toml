[msg.section_0.entries.11]
text = [
  "This is your first visit to this café.\\n",
  "Am I correct?\\c\\n",
  "Please...\\c$",
]

[msg.section_0.entries.12]
text = [
  "Give this to your dear Pokémon.$",
]

[msg.section_0.entries.13]
text = [
  "You came all the way here.\\n",
  "Enjoy...$",
]

[msg.section_0.entries.14]
text = [
  "I've been letting my tired mind relax\\n",
  "in this café this whole time...$",
]

[msg.section_0.entries.15]
text = [
  "Listen to him playing guitar...\\n",
  "I went back to the home I'd left behind,\\l\\n",
  "and my mother cried tears of joy...\\l\\n",
  "That's mothers for you.$",
]

[msg.section_0.entries.16]
text = [
  "You can't change your family,\\n",
  "but you can change how you\\l\\n",
  "interact with one another.\\c\\n",
  "Still, that said...$",
]

[msg.section_0.entries.17]
text = [
  "Thanks to you and Meloetta,\\n",
  "memories of my birthplace...\\l\\n",
  "memories of when I was little...\\l\\n",
  "memories of singing together after\\l\\n",
  "we finished gathering Berries...\\l\\n",
  "All these memories came flooding back.\\c$",
]

[msg.section_0.entries.18]
text = [
  "The Funfest Mission\\n",
  "“[VAR FUNFESTMISSION(0)]\\\"\\l\\n",
  "has been added to the Entralink.$",
]

[msg.section_0.entries.19]
text = [
  "I'm going to have fun gathering Berries\\n",
  "with the people living in the countryside\\l\\n",
  "and the Pokémon I've met here in\\l\\n",
  "Castelia City!\\c\\n",
  "Of course, I'll be humming\\n",
  "Meloetta's tune while I gather them!$",
]


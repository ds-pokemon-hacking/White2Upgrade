[msg.section_0.entries.0]
text = [
  "A beautiful melody makes people happy.\\n",
  "A sad melody makes people sorrowful...\\l\\n",
  "That's the power of melodies...$",
]

[msg.section_0.entries.1]
text = [
  "The scent you brought me reminded me of\\n",
  "a long-ago melody from the fringes of my\\l\\n",
  "sepia-toned memories.\\c\\n",
  "It was a song my mother loved...\\n",
  "It makes me feel so nostalgic.\\c\\n",
  "Would you like to hear the melody?\\c$",
]

[msg.section_0.entries.2]
text = [
  "My mother once told me of a Pokémon that\\n",
  "played a melody and danced so lightly\\l\\n",
  "that it filled people's hearts with joy.\\c\\n",
  "Then sorrow darkened the entire world,\\n",
  "and the Pokémon's melody was lost...\\c\\n",
  "At the same time, somewhere,\\n",
  "some red shoes were lost...\\c$",
]

[msg.section_0.entries.3]
text = [
  "When you came through the door,\\n",
  "I remembered the melody!\\c\\n",
  "And the Pokémon that had forgotten how\\n",
  "to dance began to step lightly once more!\\c\\n",
  "You are the inspiration.\\n",
  "You are a mysterious child...$",
]

[msg.section_0.entries.4]
text = [
  "Let it sing the Relic Song.\\c\\n",
  "Aria Forme will become Pirouette Forme,\\n",
  "and vice versa.$",
]

[msg.section_0.entries.5]
text = [
  "[VAR PKNICK(0)] remembered the\\n",
  "Relic Song it had forgotten!\\c$",
]


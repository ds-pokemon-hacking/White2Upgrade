[msg]
trailing_data = "baba"

[msg.section_0.entries.0]
text = [
  "Bianca: Heeey! [VAR TRNAME(0)]!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Bianca: Hi there, [VAR TRNAME(0)]!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Um, you know what?\\c\\n",
  "There's something I want to investigate\\n",
  "here in Reversal Mountain.\\c\\n",
  "But the wild Pokémon here are really\\n",
  "tough, and I'm having trouble with them!\\c\\n",
  "Could you come with me? Please?\\c$",
]

[msg.section_0.entries.3]
text = [
  "Oh! Don't worry!\\c\\n",
  "I'll take care of healing\\n",
  "our Pokémon, OK?\\c\\n",
  "Ready? Let's go!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Oh! [VAR TRNAME(0)]!\\c\\n",
  "Here! This is the place!\\n",
  "Let's look around a little!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Oh! [VAR TRNAME(0)]!\\c\\n",
  "Here! This is the place!\\n",
  "Let's look around a little!\\c$",
]

[msg.section_0.entries.6]
text = [
  "Know what?\\n",
  "I didn't know what I was capable of,\\l\\n",
  "so I left on a journey to find out!$",
]

[msg.section_0.entries.7]
text = [
  "I'm...\\n",
  "Well, I'm not the toughest Trainer.\\c\\n",
  "But I was able to continue my journey\\n",
  "because my Pokémon worked so hard\\l\\n",
  "for me.$",
]

[msg.section_0.entries.8]
text = [
  "Trying to keep winning against\\n",
  "everyone is really hard...\\c\\n",
  "But it's easy to keep loving Pokémon,\\n",
  "and that makes it all worthwhile.$",
]

[msg.section_0.entries.9]
text = [
  "I always want to know more\\n",
  "about the Pokémon I like!\\c\\n",
  "That's why I started working as\\n",
  "Professor Juniper's assistant!$",
]

[msg.section_0.entries.10]
text = [
  "Actually, I'm not sure being a\\n",
  "professor's assistant is really\\l\\n",
  "what I want to do...\\c\\n",
  "But when I do the work,\\n",
  "I have lots and lots of fun!$",
]

[msg.section_0.entries.11]
text = [
  "                              $$",
]

[msg.section_0.entries.12]
text = [
  "                                $$",
]

[msg.section_0.entries.13]
text = [
  "Oh! I want to do a little\\n",
  "more looking around.\\l\\n",
  "Want to split up for now?$",
]

[msg.section_0.entries.14]
text = [
  "OK, then!\\c\\n",
  "I want to do a little more research\\n",
  "about where Heatran might be!\\c\\n",
  "Thank you for coming with me!\\n",
  "Be careful on the rest of your journey!\\c$",
]

[msg.section_0.entries.15]
text = [
  "Oh, OK!\\c\\n",
  "I want to do a little more\\n",
  "investigating about Heatran.\\c\\n",
  "Heatran is a very rarely seen Pokémon,\\n",
  "so if I find out more about it,\\l\\n",
  "Professor Juniper will be really happy!\\c\\n",
  "Thanks for helping me!\\n",
  "Be careful on your journey!\\c$",
]

[msg.section_0.entries.16]
text = [
  "OK! Then let's do a little more\\n",
  "looking around!\\c$",
]

[msg.section_0.entries.17]
text = [
  "Reversal Mountain... I wonder...\\n",
  "Could a Magma Stone be in there?\\c\\n",
  "Have you heard of it?\\n",
  "They say a Magma Stone was found\\l\\n",
  "in a volcano in the distant Sinnoh region.\\c\\n",
  "Apparently, it had something\\n",
  "to do with Heatran!$",
]

[msg.section_0.entries.18]
text = [
  "There's still something I want to\\n",
  "look for in Reversal Mountain.\\l\\n",
  "Come with me!\\c\\n",
  "Don't worry. I'll take care of healing\\n",
  "our Pokémon, OK?\\c\\n",
  "OK, here we go!\\c$",
]

[msg.section_0.entries.19]
text = [
  "You strike me as the type\\n",
  "who fills out the Habitat List!\\c\\n",
  "C'mon, tell me what kind of Pokémon\\n",
  "live in Reversal Mountain!\\c$",
]

[msg.section_0.entries.20]
text = [
  "Oh... Still looking into it, huh?\\c\\n",
  "Some of the Pokémon are on the\\n",
  "outside of Reversal Mountain as well.$",
]

[msg.section_0.entries.21]
text = [
  "Huh! That's amazing.\\n",
  "So these Pokémon live here, then!\\c\\n",
  "Thanks for showing me something good!\\n",
  "Let me pay you back with this!\\c$",
]

[msg.section_0.entries.22]
text = [
  "False Swipe leaves a Pokémon\\n",
  "with 1 HP when it would have fainted.\\c\\n",
  "It's a very restrained move.\\c\\n",
  "It's a great TM to use for catching\\n",
  "Pokémon and filling out the Habitat List!$",
]

[msg.section_0.entries.0]
text = [
  "Professor Juniper: Why, hello!\\n",
  "Thanks for coming clear out here!\\c\\n",
  "It's surprising how far Nuvema Town is\\n",
  "from Aspertia City, don't you agree?\\c\\n",
  "Did you take Skyarrow Bridge and\\n",
  "encounter a lot of Pokémon?\\c\\n",
  "On that note...\\c$",
]

[msg.section_0.entries.1]
text = [
  "Professor Juniper: Hi there!\\n",
  "How have you been doing lately?\\c$",
]

[msg.section_0.entries.2]
text = [
  "If you have a Permit,\\n",
  "you can fly from Mistralton City\\l\\n",
  "and go to the Nature Preserve!\\c\\n",
  "I won't spoil the surprise about\\n",
  "what kind of place it is.$",
]

[msg.section_0.entries.3]
text = [
  "I have no idea why, but when you hold\\n",
  "an Oval Charm, it's more likely\\l\\n",
  "that a Pokémon Egg will be found\\l\\n",
  "at the Day Care!$",
]

[msg.section_0.entries.4]
text = [
  "Somehow, when you hold the Shiny Charm,\\n",
  "shiny Pokémon pop out of the tall grass\\l\\n",
  "more often than usual.$",
]

[msg.section_0.entries.5]
text = [
  "I have something I'd be delighted to\\n",
  "give you if you meet every Pokémon\\l\\n",
  "registered in the Unova Pokédex!\\c\\n",
  "Check every corner of the Unova region\\n",
  "for Pokémon! Do your best!$",
]


[msg.section_0.entries.14]
text = [
  "Cedric: Hey, [VAR TRNAME(0)]!\\n",
  "Are you meeting lots of Pokémon?\\c\\n",
  "There really are lots of Pokémon in the\\n",
  "Unova region and the rest of the world!\\c\\n",
  "I made the Habitat List\\n",
  "so people would know that!\\c\\n",
  "I'll bet you're here because...\\c$",
]

[msg.section_0.entries.15]
text = [
  "Cedric: Hey, [VAR TRNAME(0)]!\\c$",
]

[msg.section_0.entries.16]
text = [
  "Oh, that's right! I completely forgot\\n",
  "to give this to you in Aspertia!\\c\\n",
  "Here, this is the Super Rod!\\c$",
]

[msg.section_0.entries.17]
text = [
  "With this Super Rod, you can even catch\\n",
  "Pokémon who live underwater!\\c\\n",
  "Here, I'll read you the directions.\\c\\n",
  "First...\\n",
  "Face the water and cast!\\c\\n",
  "Second...\\n",
  "Con-cen-trate!\\c\\n",
  "When a Pokémon bites, you'll see a “!\\\"\\n",
  "That means start reeling in!\\c\\n",
  "So cool!$",
]

[msg.section_0.entries.18]
text = [
  "Skreet! Skreet!$",
]

[msg.section_0.entries.19]
text = [
  "Father and daughter...\\c\\n",
  "It's a picture of the two\\n",
  "Professor Junipers.$",
]

[msg.section_0.entries.20]
text = [
  "       $$",
]

[msg.section_0.entries.21]
text = [
  "Adventure Rule No. 1\\n",
  "The X Button opens the menu.$",
]

[msg.section_0.entries.22]
text = [
  "Adventure Rule No. 2\\n",
  "Record your progress with SAVE.$",
]

[msg.section_0.entries.23]
text = [
  "There are lots of books about Pokémon!$",
]

[msg.section_0.entries.24]
text = [
  "There are lots of materials and\\n",
  "research reports about Pokémon!$",
]

[msg.section_0.entries.25]
text = [
  "Pfoooh!$",
]

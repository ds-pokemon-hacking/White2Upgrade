[msg.section_0.entries.0]
text = [
  "Cheren: I learned something\\n",
  "from this battle...\\c\\n",
  "But only a little.\\c\\n",
  "What does it mean to be strong...?\\n",
  "What are Pokémon...?\\l\\n",
  "There are so many things I don't know!$",
]

[msg.section_0.entries.1]
text = [
  "Roxie: Congrats on taking first!\\c\\n",
  "Losing stinks, but still...\\n",
  "You're a fun Pokémon Trainer to battle!\\c\\n",
  "I mean, c'mon! The Pokémon battling with\\n",
  "you are all like, “We're gonna win!\\\"$",
]

[msg.section_0.entries.2]
text = [
  "Burgh: Ummm... That's right.\\n",
  "Bug-type Pokémon are cool, aren't they?\\c\\n",
  "Win or lose, they're always beautiful.$",
]

[msg.section_0.entries.3]
text = [
  "Elesa: My Pokémon work hard for me,\\n",
  "so I want to do what I can for them.\\c\\n",
  "And I want them to bathe in\\n",
  "the glamorous spotlight as well.\\c\\n",
  "In that sense, your Pokémon were\\n",
  "gleaming very brightly!$",
]

[msg.section_0.entries.4]
text = [
  "Clay: Am I all right with a Trainer\\n",
  "like ya winning the Tournament, ya say?\\c\\n",
  "Ya think there're stronger Trainers\\n",
  "out there yet?\\c\\n",
  "Talented Trainers who think like that\\n",
  "are just who I want to come\\l\\n",
  "here to Driftveil City!$",
]

[msg.section_0.entries.5]
text = [
  "Skyla: I'm in top form, and I can see\\n",
  "what my opponent is trying to do.\\c\\n",
  "And I still couldn't win!\\n",
  "That's because Pokémon battling\\l\\n",
  "is really deep, and you're really great!$",
]

[msg.section_0.entries.6]
text = [
  "Drayden: I may be old,\\n",
  "but I desire victory!\\c\\n",
  "This desire is the energy for life!\\n",
  "It's the power to surpass who I was\\l\\n",
  "the previous day!\\c\\n",
  "I complement you on your victory,\\n",
  "but next time, victory will be mine!$",
]

[msg.section_0.entries.7]
text = [
  "Marlon: Eh, right now,\\n",
  "you're like a ragin' sea\\l\\n",
  "that washes everythin' away!\\c\\n",
  "Uihaa! What a great battle, yo!$",
]

[msg.section_0.entries.8]
text = [
  "Bianca: Even if it's just little by little,\\n",
  "I'm learning about Pokémon.\\c\\n",
  "I'm thinking about how to bring\\n",
  "out the best from everyone,\\l\\n",
  "but I still have a ways to go.\\c\\n",
  "Oh, I almost forgot!\\n",
  "Congratulations on your victory!$",
]

[msg.section_0.entries.9]
text = [
  "Chili: You scorched everyone, huh?\\n",
  "That's amazing!\\c\\n",
  "I want to win too and become Chili,\\n",
  "the world's best Trainer of\\l\\n",
  "Fire-type Pokémon!$",
]

[msg.section_0.entries.10]
text = [
  "Cress: The pairings for the tournament\\n",
  "partly contributed to your victory.\\c\\n",
  "Please keep training.\\c\\n",
  "I plan on retraining myself\\n",
  "with the aim of defeating you\\l\\n",
  "after you've become even stronger.$",
]

[msg.section_0.entries.11]
text = [
  "Cilan: Well...I'm just glad I was able to\\n",
  "bring out the delectable charm of\\l\\n",
  "Grass-type Pokémon.\\c\\n",
  "I lost, though...\\c\\n",
  "Well, more importantly, congratulations!$",
]

[msg.section_0.entries.12]
text = [
  "Lenora: Battling is second nature\\n",
  "to you, isn't it?\\c\\n",
  "It's always best to be natural,\\n",
  "no matter when it is and\\l\\n",
  "what kind of situation you're in.\\c\\n",
  "Your victory is the result\\n",
  "of that, right?$",
]

[msg.section_0.entries.13]
text = [
  "Brycen: A tournament is a story, too...\\c\\n",
  "And the stars of this story\\n",
  "were you and your Pokémon.$",
]

[msg.section_0.entries.14]
text = [
  "Blue: Three wins and you've done it!\\c\\n",
  "Luck can also be a factor,\\n",
  "and I'm still not satisfied at all!\\c\\n",
  "Oh, I didn't think you won\\n",
  "because of luck, though!$",
]

[msg.section_0.entries.15]
text = [
  "Lance: I'm sure you already know,\\n",
  "but dragons are sacred\\l\\n",
  "and legendary creatures!\\c\\n",
  "That's why I won't lose next time!$",
]

[msg.section_0.entries.16]
text = [
  "Steven: Hmm. Emerald can be mined\\n",
  "in Driftveil City?!$",
]

[msg.section_0.entries.17]
text = [
  "Wallace: The reason for my defeat...\\n",
  "It's...\\c\\n",
  "The grand illusion of water!\\n",
  "It wasn't enough!$",
]

[msg.section_0.entries.18]
text = [
  "Cynthia: I sincerely applaud\\n",
  "your victory in the tournament.\\c\\n",
  "However, there must be many other\\n",
  "strong opponents in the world...\\c\\n",
  "I want to keep meeting many different\\n",
  "people and Pokémon in different places.$",
]

[msg.section_0.entries.19]
text = [
  "Alder: Well done!\\n",
  "That was an impressive battle.\\c\\n",
  "The spirit of my first partner,\\n",
  "Larvesta--no, Volcarona--lives on\\l\\n",
  "in my current partners, too!\\c\\n",
  "I want to add your strength\\n",
  "to their experience as well!$",
]

[msg.section_0.entries.20]
text = [
  "Brock: Awesome...\\n",
  "That was a really great battle.\\c\\n",
  "I compliment you on your victory!$",
]

[msg.section_0.entries.21]
text = [
  "Misty: My pride and joy are my\\n",
  "Water-type Pokémon.\\c\\n",
  "But they were no match for yours.\\c\\n",
  "Thank you for teaching me\\n",
  "the world is a really big place.$",
]

[msg.section_0.entries.22]
text = [
  "Lt. Surge: You are very strong!\\n",
  "You're the victor!\\c\\n",
  "I'm not gonna lose! I'll train hard\\n",
  "and be number one in Pokémon battling!$",
]

[msg.section_0.entries.23]
text = [
  "Erika: Oh! I admire your technique.\\c\\n",
  "It would make me very happy\\n",
  "if I could battle with you again.$",
]

[msg.section_0.entries.24]
text = [
  "Sabrina: Your victory...\\n",
  "It's exactly as I foresaw actually.\\c\\n",
  "But I wanted to turn that future on its\\n",
  "head with my conviction as a Trainer!$",
]

[msg.section_0.entries.25]
text = [
  "Blaine: Whoa hey!\\c\\n",
  "This time I'm sure of\\n",
  "the victor's strength!\\c\\n",
  "Next time, I'll be even more\\n",
  "of a raging inferno!$",
]

[msg.section_0.entries.26]
text = [
  "Giovanni: I'll tell you this now...\\c\\n",
  "No matter how strong you are,\\n",
  "someday you'll lose.$",
]

[msg.section_0.entries.27]
text = [
  "Falkner: As long as I have lofty\\n",
  "ambitions, I can fly as far as I want.\\c\\n",
  "I'll keep flying and aiming high!\\n",
  "Just like you!$",
]

[msg.section_0.entries.28]
text = [
  "Bugsy: I never lose when it comes to\\n",
  "Bug-type Pokémon.\\l\\n",
  "I'm so embarrassed to have said that.\\c\\n",
  "I'll start my studies of other Pokémon\\n",
  "over from the beginning, too.\\c\\n",
  "I'm truly grateful that you made me\\n",
  "realize I need to do that.$",
]

[msg.section_0.entries.29]
text = [
  "Whitney: I was surprised\\n",
  "by how strong you were!\\c\\n",
  "I can see why you won the tournament.\\c\\n",
  "When you have a chance,\\n",
  "tell me all about why you're so strong!$",
]

[msg.section_0.entries.30]
text = [
  "Morty: I'm desperate to know\\n",
  "the secret of your strength.\\c\\n",
  "If I unlock the secret,\\n",
  "my dream to see the legendary Pokémon\\l\\n",
  "may come true!\\c\\n",
  "Excuse me. I got ahead of myself.\\n",
  "Congratulations on your victory.$",
]

[msg.section_0.entries.31]
text = [
  "Chuck: Hmmm!\\n",
  "I enjoyed battling you.\\c\\n",
  "The Trainer who wins the tournament\\n",
  "has got something special!$",
]

[msg.section_0.entries.32]
text = [
  "Jasmine: The blend of your kindness\\n",
  "and your Pokémon's strength brought\\l\\n",
  "this victory to you.\\c\\n",
  "Um...\\n",
  "Keep on doing your best...\\l\\n",
  "with your Pokémon.$",
]

[msg.section_0.entries.33]
text = [
  "Pryce: If it's someone like you,\\n",
  "I'm sure you'll keep winning\\l\\n",
  "and will find something important.\\c\\n",
  "Keep it up.$",
]

[msg.section_0.entries.34]
text = [
  "Clair: What?!\\n",
  "Come to brag about your victory?\\c\\n",
  "Fine. I'll say it to you.\\c\\n",
  "Congratulations!\\n",
  "You were really tough!\\c\\n",
  "There! Are you happy now?$",
]

[msg.section_0.entries.35]
text = [
  "Janine: While I admire your victory,\\n",
  "I'm disappointed that I lost...\\c\\n",
  "I'm still not a full-fledged Trainer yet.\\c\\n",
  "I'll train with my father to be better\\n",
  "than before and challenge you again!$",
]

[msg.section_0.entries.36]
text = [
  "Roxanne: You were flawless.\\n",
  "You're a role model for Trainers.\\c\\n",
  "The way you battle makes it hard\\n",
  "to put it any other way.\\c\\n",
  "I can understand why you won!\\n",
  "I want to learn even more about you!$",
]

[msg.section_0.entries.37]
text = [
  "Brawly: Your skill is top notch...\\n",
  "You made a big splash!\\c\\n",
  "Do you want to Surf with me?$",
]

[msg.section_0.entries.38]
text = [
  "Wattson: Wahahahah!\\n",
  "That was a great victory!\\c\\n",
  "I'm so impressed by the way you battle\\n",
  "that I can't help but laugh!$",
]

[msg.section_0.entries.39]
text = [
  "Flannery: Your strength is the way\\n",
  "you're able to express yourself.\\c\\n",
  "Everybody was very excited\\n",
  "by your victory!$",
]

[msg.section_0.entries.40]
text = [
  "Norman: You went all out\\n",
  "and earned that victory...\\l\\n",
  "You're a wonderful Trainer!\\c\\n",
  "I want my kid to learn from you.$",
]

[msg.section_0.entries.41]
text = [
  "Winona: Your devotion...\\n",
  "That's what brought you victory.\\l\\n",
  "It's praiseworthy.$",
]

[msg.section_0.entries.42]
text = [
  "Tate: The fact that you won means\\n",
  "your combination with your Pokémon\\l\\n",
  "must've been super perfect!$",
]

[msg.section_0.entries.43]
text = [
  "Liza: The fact that you won means\\n",
  "your combination with your Pokémon\\l\\n",
  "must've been super perfect!$",
]

[msg.section_0.entries.44]
text = [
  "Juan: I see!\\c\\n",
  "Your elegance radiates glitz and glamor.\\c\\n",
  "It's only natural\\n",
  "that you won the tournament.$",
]

[msg.section_0.entries.45]
text = [
  "Roark: With skill like yours,\\n",
  "it's natural for you to win.\\c\\n",
  "Still, wasn't it hard to train\\n",
  "Pokémon that much?\\c\\n",
  "By the way, are there any Fossils\\n",
  "in Nacrene City's museum?$",
]

[msg.section_0.entries.46]
text = [
  "Gardenia: Amazing!\\c\\n",
  "Hey! How do you feel?\\c\\n",
  "I want to win and brag about\\n",
  "my Pokémon, too!$",
]

[msg.section_0.entries.47]
text = [
  "Fantina: I'm so very happy!\\n",
  "Because you're so very strong!\\c\\n",
  "There's so much I can learn from you.\\c\\n",
  "I can become even stronger.\\n",
  "When I do, let's battle again!$",
]

[msg.section_0.entries.48]
text = [
  "Maylene: Looking at the way you battle,\\n",
  "I learned something!\\c\\n",
  "You like your Pokémon!\\n",
  "I think it's wonderful!$",
]

[msg.section_0.entries.49]
text = [
  "Crasher Wake: I may have lost,\\n",
  "but battling with you was fun!\\c\\n",
  "I hope your victory will put\\n",
  "more smiles on people's faces!$",
]

[msg.section_0.entries.50]
text = [
  "Byron: Guhahahaha!\\c\\n",
  "I lost, but I saw something great.\\c\\n",
  "Well, guess I'll go back to Sinnoh\\n",
  "and start my son's training over!\\c\\n",
  "All right! Next time I take part in the\\n",
  "tournament, I'll play to win!$",
]

[msg.section_0.entries.51]
text = [
  "Candice: You won because your focus\\n",
  "was far greater than the others!\\c\\n",
  "Yes! I have to focus even more as well!$",
]

[msg.section_0.entries.52]
text = [
  "Volkner: I like how your Pokémon respond\\n",
  "to your earnest enthusiasm.\\c\\n",
  "I'm glad someone who knows how to enjoy\\n",
  "Pokémon battles won the tournament.$",
]

[msg.section_0.entries.53]
text = [
  "Red: ...!$",
]


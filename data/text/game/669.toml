[msg.section_0.entries.121]
text = [
  "Cheren is a new Gym Leader\\n",
  "in Aspertia City.\\c\\n",
  "Nonetheless, for his age,\\n",
  "he's very experienced and brilliant.\\c$",
]

[msg.section_0.entries.122]
text = [
  "Roxie!\\c\\n",
  "Roxie is performing brilliantly in her band\\n",
  "while being a Gym Leader in Virbank City.\\c\\n",
  "She is a vocalist and bass guitarist!\\c$",
]

[msg.section_0.entries.123]
text = [
  "Burgh is an artist and\\n",
  "also the Gym Leader of Castelia City.\\c\\n",
  "I heard he polished his skills\\n",
  "in Nacrene City.\\c$",
]

[msg.section_0.entries.124]
text = [
  "Elesa!\\c\\n",
  "She's the Gym Leader of Nimbasa City\\n",
  "and also a top model.\\c\\n",
  "No, she's the top model among\\n",
  "top models! The best top model!\\c\\n",
  "Er... Everybody in the Unova region\\n",
  "knows it, right?\\c$",
]

[msg.section_0.entries.125]
text = [
  "Clay... He doesn't look it,\\n",
  "but he's a hardworking man.\\c\\n",
  "You'll know much more about him\\n",
  "if you go to the Pokémon Gym\\l\\n",
  "in Driftveil City.\\c$",
]

[msg.section_0.entries.126]
text = [
  "Skyla!\\c\\n",
  "As a pilot, she exceeded her grandfather\\n",
  "who was called a gifted pilot.\\c\\n",
  "On top of that, she's the Gym Leader\\n",
  "of Mistralton City! She's great!\\c\\n",
  "She's a good friend of Elesa.\\c$",
]

[msg.section_0.entries.127]
text = [
  "Drayden is the mayor and\\n",
  "the Gym Leader of Opelucid City.\\c\\n",
  "He recognized Iris's talent\\n",
  "and brought her to the Unova region.\\c$",
]

[msg.section_0.entries.128]
text = [
  "Marlon is the Gym Leader of Humilau City!\\c\\n",
  "Putting that aside, being a man of the\\n",
  "sea is not a profession, is it?\\c$",
]

[msg.section_0.entries.129]
text = [
  "Bianca!\\n",
  "She's an assistant of Professor Juniper!\\c\\n",
  "She's from Nuvema Town and started her\\n",
  "journey of adventure with Cheren\\l\\n",
  "and another friend!\\c\\n",
  "She's humble, but she's a pretty\\n",
  "strong Trainer.\\c$",
]

[msg.section_0.entries.130]
text = [
  "Chili!\\n",
  "He's a triplet in Striaton City!\\l\\n",
  "I believe he uses Fire-type Pokémon.\\c$",
]

[msg.section_0.entries.131]
text = [
  "Cress!\\n",
  "He's a triplet in Striaton City!\\l\\n",
  "I believe he uses Water-type Pokémon.\\c$",
]

[msg.section_0.entries.132]
text = [
  "Cilan!\\n",
  "He's a triplet in Striaton City!\\l\\n",
  "I believe he uses Grass-type Pokémon.\\c$",
]

[msg.section_0.entries.133]
text = [
  "Lenora!\\c\\n",
  "She's the director of Nacrene Museum.\\c\\n",
  "I guess she was too busy with her\\n",
  "research and quit being the Gym Leader.\\c\\n",
  "Retaliate that her Watchog used\\n",
  "was impressive!\\c$",
]

[msg.section_0.entries.134]
text = [
  "Brycen! He's now an outstanding\\n",
  "movie star in Pokéstar Studios.\\c\\n",
  "Having said that, he was originally\\n",
  "an actor.\\c$",
]

[msg.section_0.entries.135]
text = [
  "Blue is a grandson of\\n",
  "Professor Oak.\\c\\n",
  "Anything else?\\c\\n",
  "Oh, I believe he's a former Champion\\n",
  "and the Gym Leader of Viridian City.\\c$",
]

[msg.section_0.entries.136]
text = [
  "Lance.\\c\\n",
  "He's the Champion of the Pokémon League\\n",
  "in the Kanto region.\\c\\n",
  "I think that he uses Dragon-type Pokémon\\n",
  "and that he's from Blackthorn City.\\c$",
]

[msg.section_0.entries.137]
text = [
  "Steven is a son of a wealthy family\\n",
  "and a former Champion of Hoenn.\\c\\n",
  "It might ring a bell if I say\\n",
  "his hobby is to collect Stones!\\c$",
]

[msg.section_0.entries.138]
text = [
  "Wallace is the Champion of Hoenn.\\n",
  "He was originally a Gym Leader.\\c\\n",
  "I wonder why he replaced Steven.\\c$",
]

[msg.section_0.entries.139]
text = [
  "Cynthia!!\\c\\n",
  "She's the Champion of the Sinnoh region\\n",
  "and an archeologist!\\c\\n",
  "She balances the use of various types\\n",
  "of Pokémon!\\c\\n",
  "Rumor has it that she comes to a villa\\n",
  "in Undella Town for her research!\\c$",
]

[msg.section_0.entries.140]
text = [
  "Alder!\\c\\n",
  "He's the previous Champion of\\n",
  "the Unova region.\\c\\n",
  "He's gone through a lot of hardship,\\n",
  "but he's a person of high caliber.\\c$",
]

[msg.section_0.entries.141]
text = [
  "Brock!\\n",
  "He's the Gym Leader of Pewter City.\\c\\n",
  "He uses Rock-type Pokémon. I heard\\n",
  "he's proud of his strong defense.\\c$",
]

[msg.section_0.entries.142]
text = [
  "Misty!\\c\\n",
  "Misty is the Gym Leader of\\n",
  "Cerulean City.\\c\\n",
  "As she's called the Tomboyish Mermaid,\\n",
  "she's an active, beautiful girl!\\c$",
]

[msg.section_0.entries.143]
text = [
  "Lt. Surge!\\c\\n",
  "He used to be a soldier and acts as\\n",
  "the Gym Leader of Vermilion City.\\c\\n",
  "Is he from the Unova region?\\c$",
]

[msg.section_0.entries.144]
text = [
  "Lady Erika!\\c\\n",
  "She's a lady who is the Gym Leader\\n",
  "of Celadon City!\\c\\n",
  "Is her hobby flower arrangement?\\c\\n",
  "She dozes off quite often, but her\\n",
  "laid-back personality is part of\\l\\n",
  "her charm.\\c$",
]

[msg.section_0.entries.145]
text = [
  "Queen Sabrina!\\c\\n",
  "She's a psychic and the Gym Leader\\n",
  "that Saffron City is proud of!\\c\\n",
  "Aww, calling her “queen\\\" fits her image\\n",
  "for me.\\c\\n",
  "Ah! I want her to see my future\\n",
  "by Future Sight!\\c$",
]

[msg.section_0.entries.146]
text = [
  "Blaine!\\n",
  "The Hotheaded Quiz Master.\\c\\n",
  "He's the Gym Leader of Cinnabar Island,\\n",
  "but he had a tough time.\\c\\n",
  "The original Gym was destroyed and\\n",
  "he had to go to Seafoam Islands.\\c$",
]

[msg.section_0.entries.147]
text = [
  "Giovanni...\\c\\n",
  "I heard a lot of rumors about him,\\n",
  "but I don't know much about him.\\c$",
]

[msg.section_0.entries.148]
text = [
  "Falkner!\\c\\n",
  "He's the Gym Leader of Violet City.\\n",
  "He's a young man who battles with\\l\\n",
  "Pokémon that his father counted on.\\c$",
]

[msg.section_0.entries.149]
text = [
  "Bugsy.\\c\\n",
  "He's a Gym Leader who's called\\n",
  "“The Walking Bug Pokémon Encyclopedia.\\\"\\c\\n",
  "Oh! The town he's in is Azalea!\\n",
  "...I think.\\c$",
]

[msg.section_0.entries.150]
text = [
  "Whitney!\\n",
  "She's the Gym Leader of Goldenrod City!\\c\\n",
  "I believe she loves softball and\\n",
  "wears clothes that look like a uniform.\\c\\n",
  "The first thing I think about her\\n",
  "is Rollout!\\c$",
]

[msg.section_0.entries.151]
text = [
  "Morty! He's a stoic Gym Leader.\\n",
  "He's training to see the legendary\\l\\n",
  "Pokémon in Ecruteak City.\\c$",
]

[msg.section_0.entries.152]
text = [
  "Chuck.\\c\\n",
  "His wife thinks he's getting chubby.\\n",
  "He's the Gym Leader of Cianwood City!\\c$",
]

[msg.section_0.entries.153]
text = [
  "Jasmine!\\c\\n",
  "She's a compassionate woman of Steel!\\c\\n",
  "She's the Gym Leader of Olivine City.\\n",
  "She participates in Contests\\l\\n",
  "in the Sinnoh region.\\c\\n",
  "I heard she used to use\\n",
  "Rock-type Pokémon!\\c$",
]

[msg.section_0.entries.154]
text = [
  "Pryce.\\c\\n",
  "He's the Gym Leader of Mahogany Town.\\n",
  "He's a cool gentleman!\\c$",
]

[msg.section_0.entries.155]
text = [
  "Clair!\\c\\n",
  "She uses Dragon-type Pokémon, and she's\\n",
  "the Gym Leader of Blackthorn City!\\c\\n",
  "I heard Lance is her senior when it comes\\n",
  "to training, and she's no match for him!\\c\\n",
  "I hope Clair will be stronger than\\n",
  "Lance very soon!\\c$",
]

[msg.section_0.entries.156]
text = [
  "Janine!\\c\\n",
  "Again.\\n",
  "Janine!\\c\\n",
  "She's the Gym Leader of Fuchsia City,\\n",
  "and her father is Koga!\\l\\n",
  "He's one of the Elite Four!\\c$",
]

[msg.section_0.entries.157]
text = [
  "Roxanne!\\c\\n",
  "She's a teacher of a Trainers' School\\n",
  "and also the Gym Leader of\\l\\n",
  "Rustboro City!\\c\\n",
  "It's hard to tell how old she is--\\n",
  "or any other women.\\c$",
]

[msg.section_0.entries.158]
text = [
  "Brawly.\\n",
  "He's the Gym Leader of Dewford Town.\\c\\n",
  "Is he a Gym Leader or a surfer?\\c$",
]

[msg.section_0.entries.159]
text = [
  "Wattson.\\c\\n",
  "He's the Gym Leader of Mauville City.\\c\\n",
  "Being cheerful all the time\\n",
  "is the secret to his health.\\c$",
]

[msg.section_0.entries.160]
text = [
  "Flannery!\\c\\n",
  "She's the Gym Leader of Lavaridge Town.\\n",
  "I heard she loves hot springs!\\c\\n",
  "And, I also heard her grandfather\\n",
  "used to be one of the Elite Four!\\c$",
]

[msg.section_0.entries.161]
text = [
  "Norman.\\c\\n",
  "He's the Gym Leader of Petalburg City.\\n",
  "He is a friend of Professor Birch,\\l\\n",
  "who is famous in the Hoenn region.\\c$",
]

[msg.section_0.entries.162]
text = [
  "Winona!\\c\\n",
  "She's the Gym Leader of Fortree City.\\n",
  "She spreads her wings around the world.\\c\\n",
  "She's a perfect Trainer\\n",
  "for this tournament!\\c$",
]

[msg.section_0.entries.163]
text = [
  "Tate is one of the Gym Leaders of\\n",
  "Mossdeep City.\\c\\n",
  "He'll challenge you for Double Battle\\n",
  "with his twin, Liza.\\c$",
]

[msg.section_0.entries.164]
text = [
  "Liza!\\c\\n",
  "She and her twin, Tate, are\\n",
  "the Gym Leaders of Mossdeep City.\\c\\n",
  "As you expect of twins,\\n",
  "they're good at Double Battles!\\c$",
]

[msg.section_0.entries.165]
text = [
  "Juan!\\c\\n",
  "He's Wallace's teacher\\n",
  "and the Gym Leader of Sootopolis City.\\c\\n",
  "I guess he's a ladies man.\\c$",
]

[msg.section_0.entries.166]
text = [
  "Roark.\\c\\n",
  "He's the young Gym Leader\\n",
  "of Oreburgh City.\\c\\n",
  "He supervises people who work in\\n",
  "the mines in the city.\\c$",
]

[msg.section_0.entries.167]
text = [
  "Gardenia!\\n",
  "I heard she's afraid of ghosts!\\c\\n",
  "She's the respectable Gym Leader\\n",
  "of Eterna City, though!\\c\\n",
  "Having said that, everybody has\\n",
  "something they don't like, right?\\c$",
]

[msg.section_0.entries.168]
text = [
  "Fantina!\\c\\n",
  "She tends to be misunderstood\\n",
  "due to her flashy appearance,\\l\\n",
  "but she's a Gym Leader\\l\\n",
  "with a compassionate heart!\\c\\n",
  "She consoles Pokémon's spirits\\n",
  "at the Lost Tower near Hearthome City.\\c$",
]

[msg.section_0.entries.169]
text = [
  "Maylene!\\n",
  "The barefoot fighting genius!\\c\\n",
  "She's the Gym Leader of Veilstone City\\n",
  "and very serious about learning\\l\\n",
  "what it is to be strong!\\c$",
]

[msg.section_0.entries.170]
text = [
  "Crasher Wake!\\c\\n",
  "He's a professional wrestler and\\n",
  "a Gym Leader.\\c\\n",
  "He's an admirable man who uses his\\n",
  "prize money for Pastoria City.\\c$",
]

[msg.section_0.entries.171]
text = [
  "Byron!\\n",
  "He's the Gym Leader of Canalave City.\\l\\n",
  "He always carries a shovel.\\c\\n",
  "By the way, he's the father of Roark,\\n",
  "who's the Gym Leader of\\l\\n",
  "Oreburgh City.\\c$",
]

[msg.section_0.entries.172]
text = [
  "Candice!\\c\\n",
  "She's the spirited Gym Leader\\n",
  "of Snowpoint City!\\c\\n",
  "She also guards the temple\\n",
  "in the city!\\c$",
]

[msg.section_0.entries.173]
text = [
  "Volkner...\\c\\n",
  "He's the Leader of Sunyshore City.\\n",
  "I heard he renovated the Pokémon Gym\\l\\n",
  "and caused blackouts in the city.\\c$",
]

[msg.section_0.entries.174]
text = [
  "Red...?\\c\\n",
  "I don't know much about him,\\n",
  "but I heard he is a legendary Trainer.\\c$",
]

[msg.section_0.entries.175]
text = [
  "       $$",
]

[msg.section_0.entries.176]
text = [
  "I know much about strong Trainers!\\c\\n",
  "So, I'll tell you about Gym Leaders and\\n",
  "Champions and so on\\l\\n",
  "once you've battled them!$",
]

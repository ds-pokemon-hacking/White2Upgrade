[msg]
trailing_data = "8a8a"

[msg.section_0.entries.0]
text = [
  "Three sharp marks are deeply\\n",
  "cut into the rock.$",
]

[msg.section_0.entries.1]
text = [
  "[VAR PKNICK(0)] seems to want to get out of\\n",
  "the Poké Ball!\\c\\n",
  "Will you let it out?$",
]

[msg.section_0.entries.2]
text = [
  "The Poké Ball has stopped moving...$",
]

[msg.section_0.entries.3]
text = [
  "The determination carved into the rock\\n",
  "by Cobalion, Virizion, and Terrakion\\l\\n",
  "reminded [VAR PKNICK(0)] of Secret Sword!$",
]

[msg.section_0.entries.4]
text = [
  "But [VAR PKNICK(0)] can't know more\\n",
  "than four moves.\\c\\n",
  "Delete an existing move to make\\n",
  "room for Secret Sword?\\c$",
]

[msg.section_0.entries.5]
text = [
  "Give up on remembering the\\n",
  "move Secret Sword?$",
]

[msg.section_0.entries.6]
text = [
  "[VAR PKNICK(0)] did not remember the\\n",
  "move Secret Sword.\\c$",
]

[msg.section_0.entries.7]
text = [
  "Is it OK to forget the\\n",
  "move [VAR MOVE(1)]?$",
]

[msg.section_0.entries.8]
text = [
  "1, [WAIT(20)]2, and[WAIT(20)]... [WAIT(20)]... [WAIT(20)]... Ta-da![VAR 0xBE05(3)][VAR 0xBE06(2)][VAR 0xBE07][VAR 0xBE04]\\c\\n",
  "[VAR PKNICK(0)] forgot how to\\n",
  "use [VAR MOVE(1)].\\c\\n",
  "And...\\c$",
]

[msg.section_0.entries.9]
text = [
  "[VAR PKNICK(0)] remembered the move\\n",
  "Secret Sword!$",
]

[msg.section_0.entries.10]
text = [
  "What?\\n",
  "[VAR PKNICK(0)] is...\\c$",
]

[msg.section_0.entries.11]
text = [
  "[VAR PKNICK(0)] has resolved to battle\\n",
  "and has changed into Resolute Form!$",
]

[msg.section_0.entries.0]
text = [
  "[SPEED(2)]Oh... Oh...\\n",
  "So...thirsty...\\c\\n",
  "I met you on Marvelous Bridge...\\c\\n",
  "G-g-give me...\\n",
  "Fresh Water...?[SPEED(0)]$",
]

[msg.section_0.entries.1]
text = [
  "Refreshed!!\\c\\n",
  "I'm 100% rehydrated!\\n",
  "I feel better now! Thank you!\\c\\n",
  "I'll dash to the next bridge!$",
]

[msg.section_0.entries.2]
text = [
  "[SPEED(2)]But... You don't have Fresh Water...\\n",
  "I appreciate the thought, though...[SPEED(0)]$",
]

[msg.section_0.entries.3]
text = [
  "[SPEED(2)]Thank...\\c\\n",
  "What?\\n",
  "Oh...\\c\\n",
  "Without Fresh Water...\\n",
  "I can't run on bridges anymore.[SPEED(0)]$",
]

[msg.section_0.entries.4]
text = [
  "This is what the undersea world\\n",
  "looks like!\\c\\n",
  "I've never seen this before,\\n",
  "because I can't swim!\\c\\n",
  "I'd given up on seeing this.\\n",
  "I'm so moved!$",
]

[msg.section_0.entries.5]
text = [
  "This place is like a walk-through\\n",
  "aquarium, but isn't this a place\\l\\n",
  "for Pokémon to see us?$",
]

[msg.section_0.entries.6]
text = [
  "Wow!\\n",
  "It's an ocean trench!\\c\\n",
  "So deep!\\n",
  "Maybe six miles deep?$",
]

[msg.section_0.entries.7]
text = [
  "That's right... It's deep...\\n",
  "Love is infinitely deep...$",
]

[msg.section_0.entries.8]
text = [
  "Rain Dance is a move to use\\n",
  "with a feeling of yearning.\\c\\n",
  "As for when to use it...\\c\\n",
  "Sigh... What's wrong with me?\\n",
  "I can't think of any gripping ideas.\\c\\n",
  "With a condition like this,\\n",
  "I can't explain well on TV.$",
]

[msg.section_0.entries.9]
text = [
  "Does your Pokémon have\\n",
  "a Poison Barb?$",
]

[msg.section_0.entries.10]
text = [
  "Does your Pokémon have\\n",
  "a Poison Barb?\\c\\n",
  "Wow! [VAR PKNAME(0)] has\\n",
  "a Poison Barb!\\c\\n",
  "Good going. I think you can\\n",
  "use this well, too!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Black Sludge! Few Pokémon\\n",
  "like to hold it, though.\\c\\n",
  "FYI, I'm the first fan of Roxie!$",
]

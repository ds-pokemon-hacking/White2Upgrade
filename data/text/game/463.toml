[msg.section_0.entries.0]
text = [
  "Iris: Yay! I did it!\\n",
  "Haxorus, thank you!\\l\\n",
  "I won because of you!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Drayden: Well done, Iris.\\c$",
]

[msg.section_0.entries.2]
text = [
  "Iris: What did you want\\n",
  "to talk to me about, Grandpa?\\c$",
]

[msg.section_0.entries.3]
text = [
  "Drayden: Ah yes...\\n",
  "I was thinking about the past.\\c\\n",
  "I traveled all over the world\\n",
  "looking for a successor.\\c\\n",
  "I even went to remote places\\n",
  "such as the Village of Dragons.\\c\\n",
  "That's where I met you, Iris.\\c$",
]

[msg.section_0.entries.4]
text = [
  "Iris: Yep!\\n",
  "I was the strongest!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Drayden: Yes.\\n",
  "I was surprised.\\c\\n",
  "You were one with your Pokémon\\n",
  "and battling with so much joy.\\c\\n",
  "Just watching you made me smile.\\c\\n",
  "Your opponents felt disappointed by\\n",
  "their defeat, but at the same time\\l\\n",
  "they enjoyed the battle.\\c\\n",
  "It was completely natural for me\\n",
  "to decide I wanted to make you\\l\\n",
  "my successor.\\c$",
]

[msg.section_0.entries.6]
text = [
  "Iris: I'm so glad I came to Unova!\\c\\n",
  "There are many different people\\n",
  "and so many different Pokémon!\\c\\n",
  "And you know what...\\c\\n",
  "In the Village of Dragons, people take\\n",
  "living alongside Pokémon for granted.\\c\\n",
  "I was surprised some people\\n",
  "in Unova didn't think that way!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Drayden: I found your reactions\\n",
  "to be a breath of fresh air.\\c\\n",
  "And as a condition to leave the\\n",
  "Village of Dragons, you wanted\\l\\n",
  "to broaden your experiences\\l\\n",
  "and become the Champion...\\c\\n",
  "So as I promised,\\n",
  "I've been training you as a Trainer\\l\\n",
  "and as a Gym Leader.\\c\\n",
  "An order directly from Alder\\n",
  "came as I was training you.\\c$",
]

[msg.section_0.entries.8]
text = [
  "Iris: Alder was smiling, though.\\c$",
]

[msg.section_0.entries.9]
text = [
  "Drayden: He lost to N\\n",
  "and retrained himself.\\c\\n",
  "He asked me to help him with his special\\n",
  "training, but it was ghastly.\\c\\n",
  "He wanted to become an immense\\n",
  "obstacle for you, the new Champion...\\c\\n",
  "For that alone, he pushed himself\\n",
  "incredibly hard.\\c$",
]

[msg.section_0.entries.10]
text = [
  "Iris: Alder was really, really strong!\\c\\n",
  "And even when I felt a bit weak,\\n",
  "he encouraged us!\\c\\n",
  "He said that even when their backs\\n",
  "are against the wall, my Pokémon\\l\\n",
  "have an intense look in their eyes.\\c\\n",
  "So, that's why I won, but I feel\\n",
  "like I still have a lot to learn.\\c$",
]

[msg.section_0.entries.11]
text = [
  "Drayden: Don't forget that feeling.\\c\\n",
  "And now, if I may change the subject...\\c\\n",
  "When you came to Opelucid City,\\n",
  "I gave you those clothes, right?\\c$",
]

[msg.section_0.entries.12]
text = [
  "You're the Champion, now.\\n",
  "It's all right to dress up a little.\\c$",
]

[msg.section_0.entries.13]
text = [
  "Iris: Are these new clothes?\\n",
  "OK. I'll change into them right now!\\c$",
]

[msg.section_0.entries.14]
text = [
  "Iris: Wooow!\\n",
  "It's such a flowing dress!\\c$",
]

[msg.section_0.entries.15]
text = [
  "Drayden: What is important is\\n",
  "your mental preparation\\l\\n",
  "as the Champion, Iris.\\c$",
]

[msg.section_0.entries.16]
text = [
  "When I was little,\\n",
  "Poké Balls didn't exist yet.\\c\\n",
  "Sometimes Pokémon would run away\\n",
  "from awful Trainers who didn't try\\l\\n",
  "to understand them.\\c$",
]

[msg.section_0.entries.17]
text = [
  "Iris: But you were fine, right?\\c\\n",
  "I can tell!\\c\\n",
  "Your Haxorus loves you very much!\\c$",
]

[msg.section_0.entries.18]
text = [
  "I've already decided!\\n",
  "I know what kind of Champion I will be!\\c\\n",
  "There's a myth in Sinnoh that says\\n",
  "the reason why Pokémon jump out\\l\\n",
  "is because they want to thank people.\\c\\n",
  "I'm sure that we and Pokémon have helped\\n",
  "each other and enriched the world\\l\\n",
  "since ancient times.\\c\\n",
  "These memories have been engraved in\\n",
  "each Pokémon's heart!\\c\\n",
  "So, I want Pokémon and people\\n",
  "to get closer and closer!\\c\\n",
  "As the Champion,\\n",
  "I want to tell that to everybody!\\c$",
]

[msg.section_0.entries.19]
text = [
  "Drayden: Good!\\n",
  "If anyone can do it, you can.\\c$",
]

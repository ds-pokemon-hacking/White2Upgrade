[msg.section_0.entries.0]
text = [
  "Iris: Yahoo! I haven't seen you since\\n",
  "I ran into you in Castelia City!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Are you here to battle Grandpa?\\c\\n",
  "Yep! Opelucid City's Gym Leader,\\n",
  "Drayden, is my grandpa.\\c\\n",
  "We're not really related, though!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Oh! The Gym is that way!\\c\\n",
  "Before challenging it,\\n",
  "you might want to go to Route 9!\\c$",
]

[msg.section_0.entries.3]
text = [
  "Still, your Pokémon really respect you!\\c\\n",
  "I feel how much fun your Pokémon are\\n",
  "having, even from inside their Poké Balls!\\c\\n",
  "Good luck!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Still, your Pokémon really respect you!\\c\\n",
  "I feel how much fun they're having,\\n",
  "even from inside their Poké Balls!\\c\\n",
  "Good luck!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Drayden: I'll show you the way.\\n",
  "Follow me.\\c$",
]

[msg.section_0.entries.6]
text = [
  "This way.\\c$",
]

[msg.section_0.entries.7]
text = [
  "We're here.\\n",
  "OK! Come inside.\\c$",
]

[msg.section_0.entries.8]
text = [
  "What was that?\\c$",
]

[msg.section_0.entries.9]
text = [
  "This world of ice...\\c$",
]

[msg.section_0.entries.10]
text = [
  "Haxorus!\\n",
  "Use Dragon Tail!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Rarh raaaah!$",
]

[msg.section_0.entries.12]
text = [
  "That's enough, Haxorus!\\c$",
]

[msg.section_0.entries.13]
text = [
  "Not only did the ice stay unbroken,\\n",
  "there's not even a scratch on it!\\l\\n",
  "What's going on?\\c$",
]

[msg.section_0.entries.14]
text = [
  "???: I don't think that's going to work.\\c$",
]

[msg.section_0.entries.15]
text = [
  "Drayden: I remember you from N's Castle.\\c$",
]

[msg.section_0.entries.16]
text = [
  "Zinzolin: It's bitter cold.\\c\\n",
  "I'm shivering.\\n",
  "I'm suffering, but I'm alive!\\c\\n",
  "It's what the essence of life feels like!\\n",
  "It's proof of my existence!\\c\\n",
  "But that's enough of philosophy.\\n",
  "Here are the facts for your admiration:\\c\\n",
  "This ice was specially created by\\n",
  "Team Plasma's technology.\\c\\n",
  "As long as we have our secret weapon,\\n",
  "you'll never be able\\l\\n",
  "to melt or break this ice!\\c$",
]

[msg.section_0.entries.17]
text = [
  "Let me explain our purpose here.\\c\\n",
  "Drayden, hand over the DNA Splicers!\\c\\n",
  "Opelucid City is a city where the\\n",
  "past and the future are entwined.\\c\\n",
  "Could there be a more perfect place\\n",
  "for the splicers that connect the\\l\\n",
  "separated Pokémon?\\c$",
]

[msg.section_0.entries.18]
text = [
  "Drayden: Do you think someone\\n",
  "who knows what you did two years\\l\\n",
  "ago will just hand them over quietly?\\c$",
]

[msg.section_0.entries.19]
text = [
  "Zinzolin: Humph.\\n",
  "That's what I thought you'd say.\\c\\n",
  "At this point, I'd like to threaten\\n",
  "you with another volley of ice,\\l\\n",
  "but we can't use it for a moment...\\c\\n",
  "Sigh. It won't be enjoyable in this cold,\\n",
  "but I guess we'll just search for them.\\c$",
]

[msg.section_0.entries.20]
text = [
  "Drayden: Those foul villains!\\c$",
]

[msg.section_0.entries.21]
text = [
  "[VAR TRNAME(0)]!\\n",
  "I want you to help me!\\c\\n",
  "We're going to drive Team Plasma\\n",
  "out of Opelucid City!\\c$",
]

[msg.section_0.entries.22]
text = [
  "Team Plasma: Pokémon are pawns!\\n",
  "They're a means to an end.\\c\\n",
  "That's what I was taught!\\c\\n",
  "Don't think about it too much.\\n",
  "It's easier that way!\\c$",
]

[msg.section_0.entries.23]
text = [
  "Team Plasma: How can this be?\\c\\n",
  "Is that the kind of power Pokémon have\\n",
  "when they're not treated like objects?$",
]

[msg.section_0.entries.24]
text = [
  "Team Plasma: The others were saying\\n",
  "that the only place we haven't yet\\l\\n",
  "searched is the Pokémon Gym!$",
]

[msg.section_0.entries.25]
text = [
  "Team Plasma: This time, we'll take over\\n",
  "the Unova region!\\c\\n",
  "You! You're trembling already?\\n",
  "From fear or from cold--either's good!\\c$",
]

[msg.section_0.entries.26]
text = [
  "Team Plasma: It's not over!\\n",
  "The others will find the DNA Splicers!\\l\\n",
  "When they do, the Unova region is ours!$",
]

[msg.section_0.entries.27]
text = [
  "Team Plasma: Now that you mention it,\\n",
  "I think I might have been ordered\\l\\n",
  "to comb the Pokémon Gym...$",
]

[msg.section_0.entries.28]
text = [
  "Team Plasma: Don't get in our way!\\n",
  "You bother!\\l\\n",
  "Bother, bother, bother!\\c$",
]

[msg.section_0.entries.29]
text = [
  "Team Plasma: How humiliating...\\n",
  "Being bothered by a bother...$",
]

[msg.section_0.entries.30]
text = [
  "Team Plasma: Zinzolin said to stick to\\n",
  "Drayden, because that's where we'll\\l\\n",
  "find anything important!$",
]

[msg.section_0.entries.31]
text = [
  "Team Plasma: I lost.\\n",
  "I didn't stand a chance...\\c\\n",
  "I can't believe Haxorus blasted me\\n",
  "all the way over here!$",
]

[msg.section_0.entries.32]
text = [
  "Team Plasma: I think Zinzolin was going\\n",
  "to check the Pokémon Gym...$",
]

[msg.section_0.entries.33]
text = [
  "Team Plasma: I've been nursing a\\n",
  "grudge for two years, old man.\\c\\n",
  "...Even if this is the first time\\n",
  "I've battled you!$",
]

[msg.section_0.entries.34]
text = [
  "Drayden: They're getting tougher!\\c\\n",
  "[VAR TRNAME(0)]!\\n",
  "Take care of the others!$",
]

[msg.section_0.entries.35]
text = [
  "Drayden: The only one left is\\n",
  "Zinzolin of the Seven Sages!\\l\\n",
  "Where could he be?\\c\\n",
  "Oh!\\n",
  "What's going on at the Pokémon Gym?!$",
]

[msg.section_0.entries.36]
text = [
  "Team Plasma: That old guy won't hold\\n",
  "back even if his opponent is a young girl.$",
]

[msg.section_0.entries.37]
text = [
  "Team Plasma: Oh, that Drayden!\\n",
  "Where did he hide the DNA Splicers?\\l\\n",
  "Somewhere familiar and common, right?$",
]

[msg.section_0.entries.38]
text = [
  "Zinzolin: Oh, for crying out loud...\\c\\n",
  "I didn't expect to have to fight\\n",
  "hampered by cold like this.\\c\\n",
  "Well, no matter! The fact that I'm\\n",
  "shivering means I'm truly alive!\\c$",
]

[msg.section_0.entries.39]
text = [
  "Zinzolin: You're a strong Trainer.\\c\\n",
  "You definitely are adept\\n",
  "at handling Pokémon.\\c\\n",
  "I believe I'll take my leave, simply\\n",
  "because I can't stand this cold.\\c\\n",
  "But...imagine this...\\c\\n",
  "A Unova region...completely...covered...\\n",
  "in...ice.\\c\\n",
  "To achieve that splendor,\\n",
  "we'll do whatever it takes\\l\\n",
  "to obtain the DNA Splicers.\\c$",
]

[msg.section_0.entries.40]
text = [
  "Drayden: You're even better than I\\n",
  "hoped. Thanks to you, we drove them off.\\c\\n",
  "I'm grateful to your Pokémon, also.\\c\\n",
  "After all that, the least I can do\\n",
  "is heal them with this medicine.\\c$",
]

[msg.section_0.entries.41]
text = [
  "Wait here a moment.\\n",
  "I'll be right back.\\c$",
]

[msg.section_0.entries.42]
text = [
  "Harrumph...\\c\\n",
  "That's a new record for\\n",
  "making it there and back.\\c$",
]

[msg.section_0.entries.43]
text = [
  "Look, [VAR TRNAME(0)].\\n",
  "These are the DNA Splicers!\\c$",
]

[msg.section_0.entries.44]
text = [
  "This is what they were after!\\c\\n",
  "We're really fortunate Team Plasma\\n",
  "didn't get their hands on them!\\c\\n",
  "I don't know what their goal is, but I'm\\n",
  "sure they're planning something wicked.\\c$",
]

[msg.section_0.entries.45]
text = [
  "Shadow Triad: As we suspected...\\n",
  "The hiding place was in the Gym.\\c\\n",
  "Well thought out.\\n",
  "If Drayden isn't there, we can't get in.\\c\\n",
  "If he is there, he's the strongest\\n",
  "guard we could possibly face.\\c\\n",
  "It also explains why the\\n",
  "Pokémon Gym was remodeled.\\c\\n",
  "Whatever.\\n",
  "The DNA Splicers are in our hands now.\\c$",
]

[msg.section_0.entries.46]
text = [
  "Drayden: It's beyond my imagination to\\n",
  "think you'd use one of the Seven Sages\\l\\n",
  "to find out where the splicers were!\\c$",
]

[msg.section_0.entries.47]
text = [
  "Shadow Triad: Now you know, then.\\c\\n",
  "We will accomplish our goals,\\n",
  "no matter what the cost.\\c\\n",
  "We don't have the ability to captivate\\n",
  "the hearts of others like Lord N does.\\c\\n",
  "Instead, we will bend people\\n",
  "to our will with brute force.\\l\\n",
  "Two years was a surprisingly long wait.\\c$",
]

[msg.section_0.entries.48]
text = [
  "Drayden: If they've been stolen from us,\\n",
  "we'll just have to take them back!\\c$",
]

[msg.section_0.entries.49]
text = [
  "Drayden: They don't seem to be in\\n",
  "this area. However, they can hide their\\l\\n",
  "presence, so be on guard as you look!$",
]

[msg.section_0.entries.50]
text = [
  "Shadow Triad: Heh heh...\\c\\n",
  "You don't really think you can take\\n",
  "the DNA Splicers back, do you?\\c$",
]

[msg.section_0.entries.51]
text = [
  "Shadow Triad: Awww. How unlucky.\\c\\n",
  "I don't happen to be the one\\n",
  "holding the DNA Splicers.\\c\\n",
  "I was just buying time\\n",
  "for the others to escape.\\l\\n",
  "Cheerio, bye-bye, whatever.\\c$",
]

[msg.section_0.entries.52]
text = [
  "Drayden: Oh no! Ah! No!\\c\\n",
  "No, no, it's not your fault, [VAR TRNAME(0)].\\n",
  "You were impressive!\\c\\n",
  "It's me who's let everybody down.\\c$",
]

[msg.section_0.entries.53]
text = [
  "The Xtransceiver is ringing.$",
]

[msg.section_0.entries.54]
text = [
  "[VAR TRNAME(0)] picked up the Xtransceiver.\\c$",
]

[msg.section_0.entries.55]
text = [
  "Drayden: Augh!\\n",
  "If there were only two of me!\\c\\n",
  "Then I could protect the town\\n",
  "and chase after them, too!\\c$",
]

[msg.section_0.entries.56]
text = [
  "Cheren: [VAR TRNAME(0)].\\n",
  "Drayden, glad to see you're safe as well.\\c$",
]

[msg.section_0.entries.57]
text = [
  "Drayden: Hello, Cheren.\\n",
  "You have certainly grown.\\c\\n",
  "I hear you filled in for Lenora by\\n",
  "becoming the Gym Leader in\\l\\n",
  "Aspertia City.\\c$",
]

[msg.section_0.entries.58]
text = [
  "Cheren: Thanks.\\n",
  "We should save catching up for later.\\c\\n",
  "I have a good idea of where\\n",
  "Team Plasma is hiding.\\c\\n",
  "The place with the lowest temperature\\n",
  "in the Unova region right now is\\l\\n",
  "an area close to Humilau City.\\c\\n",
  "Drayden, please protect Opelucid City.\\n",
  "[VAR TRNAME(1)] and I will find Team Plasma!\\c$",
]

[msg.section_0.entries.59]
text = [
  "Drayden: Very well.\\n",
  "I'll do my part--and thanks.\\c\\n",
  "The chase I'll leave to you!\\n",
  "But...don't do anything reckless.\\c$",
]

[msg.section_0.entries.60]
text = [
  "Cheren: [VAR TRNAME(0)]!\\n",
  "I could use your help, if you're willing.\\c\\n",
  "You're a skilled Trainer who can go\\n",
  "toe-to-toe with Team Plasma.\\l\\n",
  "That's my definition of useful.\\c\\n",
  "Drayden, we're off!\\c$",
]

[msg.section_0.entries.61]
text = [
  "Drayden: Humilau City, huh...\\c\\n",
  "Is there anything to the\\n",
  "north of Undella Town?\\c\\n",
  "[VAR TRNAME(0)], protect Pokémon\\n",
  "from Team Plasma!\\c\\n",
  "All people should think for themselves\\n",
  "about the nature of the relationship\\l\\n",
  "between people and Pokémon.\\c\\n",
  "It's not something Team Plasma gets\\n",
  "to decide for everyone!$",
]

[msg.section_0.entries.62]
text = [
  "Drayden: Little by little,\\n",
  "the ice is starting to melt.\\c\\n",
  "It's all thanks to you.\\n",
  "As a fellow Trainer, I heartily thank you!$",
]

[msg.section_0.entries.63]
text = [
  "Why do Pokémon stay by our sides?\\c\\n",
  "If we could talk to them, we could ask.\\n",
  "I'm a bit scared about what they'd say.$",
]

[msg.section_0.entries.64]
text = [
  "The memories of everyone who has lived\\n",
  "in this city have built up over the years\\l\\n",
  "without changing much.$",
]

[msg.section_0.entries.65]
text = [
  "This city changes endlessly.\\c\\n",
  "And every change is engraved in the\\n",
  "memories of the people who live here.$",
]

[msg.section_0.entries.66]
text = [
  "I reached heights I never could\\n",
  "have arrived at because I had\\l\\n",
  "Pokémon by my side.\\c\\n",
  "And I believe my Pokémon became\\n",
  "tough because they were with me!$",
]

[msg.section_0.entries.67]
text = [
  "I think some things shouldn't be\\n",
  "changed, even if it's inconvenient.$",
]

[msg.section_0.entries.68]
text = [
  "I think some things must be changed\\n",
  "no matter how much you love them!$",
]

[msg.section_0.entries.69]
text = [
  "A person called N had the\\n",
  "legendary Pokémon with him,\\l\\n",
  "but was he really the hero?$",
]

[msg.section_0.entries.70]
text = [
  "A world of ice.\\c\\n",
  "Such beauty goes beyond old and new--\\n",
  "inspirational, yet terrifying.\\c\\n",
  "Though, to me, there's a comfort in\\n",
  "old things that you can't find in the new.$",
]

[msg.section_0.entries.71]
text = [
  "A world of ice.\\c\\n",
  "Such beauty goes beyond new and old--\\n",
  "inspirational, yet terrifying.\\c\\n",
  "Though, to me, there's a coolness to new\\n",
  "things that I prize more than the old.$",
]

[msg.section_0.entries.72]
text = [
  "Gym Leader Drayden leads\\n",
  "Opelucid City as its mayor!\\c\\n",
  "He's always training by wrestling\\n",
  "with his Pokémon.$",
]

[msg.section_0.entries.73]
text = [
  "My Pokémon show me affection,\\n",
  "so I'm not lonely!\\c\\n",
  "And I return their affection even more!$",
]

[msg.section_0.entries.74]
text = [
  "There was a group that told\\n",
  "people to release their Pokémon.\\c\\n",
  "They were great big liars, but it\\n",
  "created a good opportunity to think.$",
]

[msg.section_0.entries.75]
text = [
  "After that speech, my Pokémon\\n",
  "and I have been thinking about\\l\\n",
  "what's true for us.$",
]

[msg.section_0.entries.76]
text = [
  "After that speech, I've been thinking\\n",
  "about the ideal relationship for me and\\l\\n",
  "my Pokémon as we move forward together.$",
]

[msg.section_0.entries.77]
text = [
  "Unova's symbols are\\n",
  "Zekrom and Reshiram,\\l\\n",
  "but I wonder where they are now.\\c\\n",
  "Are they passing along their\\n",
  "ancient knowledge to someone?$",
]

[msg.section_0.entries.78]
text = [
  "Pursuing ideals is different from person\\n",
  "to person and Pokémon to Pokémon.\\c\\n",
  "In this city, it seems the ideal is\\n",
  "to cherish the past.$",
]

[msg.section_0.entries.79]
text = [
  "The truth people pursue is different\\n",
  "from person to person and\\l\\n",
  "Pokémon to Pokémon.\\c\\n",
  "In this city, it seems the truth is\\n",
  "constant change.$",
]

[msg.section_0.entries.80]
text = [
  "The hopes of an ancient people are put\\n",
  "into this melody...\\c\\n",
  "I will bring them back to us now.$",
]

[msg.section_0.entries.81]
text = [
  "Our hopes are put into this melody...\\n",
  "I will send them to the future.$",
]

[msg.section_0.entries.82]
text = [
  "I was just reminded of Iris.\\c\\n",
  "Yes, the Champion.\\n",
  "That Iris...\\c$",
]

[msg.section_0.entries.83]
text = [
  "I wonder what kind of\\n",
  "Champion she'll become.$",
]

[msg.section_0.entries.84]
text = [
  "Opelucid City\\n",
  "Time's Dividing Line$",
]

[msg.section_0.entries.85]
text = [
  "Drayden's House$",
]

[msg.section_0.entries.86]
text = [
  "Formerly the Battle House...$",
]

[msg.section_0.entries.87]
text = [
  "Formerly the Battle House...$",
]

[msg.section_0.entries.88]
text = [
  "Trainer Tips!\\c\\n",
  "\\n",
  "Mayor Drayden will teach you if he\\n",
  "recognizes you as a strong Trainer.\\c\\n",
  "Visit his home to learn the\\n",
  "most powerful Dragon-type move!$",
]

[msg.section_0.entries.89]
text = [
  "Opelucid City Pokémon Gym\\n",
  "Leader: Drayden\\l\\n",
  "The Spartan Mayor$",
]

[msg.section_0.entries.90]
text = [
  "Opelucid City Pokémon Gym\\n",
  "Leader: Drayden\\l\\n",
  "The Spartan Mayor$",
]

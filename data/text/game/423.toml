[msg.section_0.entries.0]
text = [
  "Oh!\\n",
  "You're a newcomer, aren't you?\\c\\n",
  "Then, let's battle without saying a word!\\n",
  "Are you ready?$",
]

[msg.section_0.entries.1]
text = [
  "All right!\\c\\n",
  "I want to bake tasty bread\\n",
  "for strong Pokémon!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Uh-oh... That's fine.\\n",
  "When you change your mind, come back!$",
]

[msg.section_0.entries.3]
text = [
  "Let's battle without saying a word!\\n",
  "Are you ready?$",
]

[msg.section_0.entries.4]
text = [
  "Wow, what a Trainer!\\c\\n",
  "You understand and trust your Pokémon.\\n",
  "That's why you got this result!$",
]

[msg.section_0.entries.5]
text = [
  "I have a favor to ask\\n",
  "of such a wonderful Trainer!\\c\\n",
  "I'm planning to bake bread\\n",
  "with tons of Honey!\\c\\n",
  "Would you show me a Pokémon\\n",
  "with the Honey Gather Ability?$",
]

[msg.section_0.entries.6]
text = [
  "This [VAR PKNAME(0)]\\n",
  "will gather Honey!\\c\\n",
  "Thank you!\\n",
  "This gift is a token of my gratitude!\\c$",
]

[msg.section_0.entries.7]
text = [
  "This [VAR PKNAME(0)]\\n",
  "will gather Honey!\\c\\n",
  "Thank you!\\n",
  "This gift is a token of my gratitude!\\c$",
]

[msg.section_0.entries.8]
text = [
  "This bread will have tons of Honey.\\n",
  "I'll call it Honey Bread!\\c\\n",
  "I want to bake it soon, but I'm busy\\n",
  "making Village Sandwiches.$",
]

[msg.section_0.entries.9]
text = [
  "I'm totally hooked on Village Sandwiches!\\c\\n",
  "I come here every day to eat them!$",
]

[msg.section_0.entries.10]
text = [
  "Pokémon make the most adorable\\n",
  "faces when they bite into sandwiches!$",
]

[msg.section_0.entries.11]
text = [
  "I'm so happy to be able to eat\\n",
  "with my Pokémon.$",
]

[msg.section_0.entries.12]
text = [
  "Myu myuweee.$",
]

[msg.section_0.entries.13]
text = [
  "Skwee weep...$",
]

[msg.section_0.entries.14]
text = [
  "Kroooko!$",
]

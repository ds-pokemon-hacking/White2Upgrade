[msg]
trailing_data = "a2a2"

[msg.section_0.entries.0]
text = [
  "This is a delicious restaurant where\\n",
  "you can also enjoy Pokémon battles!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Well, I'll be!\\n",
  "Those are some sparkling Gym Badges!\\c\\n",
  "And you have eight of them, too!\\c\\n",
  "Those Badges shine so brightly, it's like\\n",
  "you're gleaming as much as they are!$",
]

[msg.section_0.entries.2]
text = [
  "I still haven't defeated the\\n",
  "Striaton City Gym Leaders...\\c\\n",
  "But that's all right.\\c\\n",
  "I'm going to become such a strong\\n",
  "Trainer, they'll want to challenge me!$",
]

[msg.section_0.entries.3]
text = [
  "If a Pokémon type and a move type are\\n",
  "the same, the move's power will increase!\\c\\n",
  "If the Pokémon is holding a gem of that\\n",
  "type, the move's power goes up yet more!$",
]

[msg.section_0.entries.4]
text = [
  "From the factory's once-busy days, many\\n",
  "dreams still linger in the Dreamyard.\\c\\n",
  "A Pokémon led there by those dreams\\n",
  "may be somewhere about.$",
]

[msg.section_0.entries.5]
text = [
  "When I explain to someone what I learned\\n",
  "at school, I'm more connected to people,\\l\\n",
  "thanks to Pokémon!$",
]

[msg.section_0.entries.6]
text = [
  "Technical Machines can be used\\n",
  "over and over, right?\\c\\n",
  "I tried so many different things!\\n",
  "It's sure hard to decide, eh?$",
]

[msg.section_0.entries.7]
text = [
  "Er... Um...\\c\\n",
  "Grass-type Pokémon are weak\\n",
  "against Fire-type moves.\\c\\n",
  "That's why Cilan has trouble\\n",
  "winning against Chili!$",
]

[msg.section_0.entries.8]
text = [
  "Er... Um...\\c\\n",
  "Water-type Pokémon are weak\\n",
  "against Grass-type moves.\\c\\n",
  "That's why Cress has trouble\\n",
  "winning against Cilan.$",
]

[msg.section_0.entries.9]
text = [
  "Um... Er...\\c\\n",
  "Fire-type Pokémon are weak\\n",
  "against Water-type moves.\\c\\n",
  "That's why Chili has trouble\\n",
  "winning against Cress.$",
]

[msg.section_0.entries.10]
text = [
  "The Gym is gone, but the Dreamyard still\\n",
  "bustles with Trainers looking to improve!$",
]

[msg.section_0.entries.11]
text = [
  "Hm...\\n",
  "I'd like to give you this!\\c$",
]

[msg.section_0.entries.12]
text = [
  "To live quietly and do a lot of fishing...\\n",
  "I truly live my ideal existence...$",
]

[msg.section_0.entries.13]
text = [
  "There are times when you want\\n",
  "to catch Pokémon in dark places, right?\\l\\n",
  "I'll share some of these with you.\\c$",
]

[msg.section_0.entries.14]
text = [
  "A Dusk Ball works well at night\\n",
  "or in a cave.\\c\\n",
  "Plus, it has a most excellent name!\\n",
  "Dusk! The Dusk Ball.\\c\\n",
  "I believe it can even catch and control\\n",
  "the darkness found in hearts.$",
]

[msg.section_0.entries.15]
text = [
  "Oh, my!\\n",
  "Your Medal Box...\\c$",
]

[msg.section_0.entries.16]
text = [
  "The orange Adventure Medals\\n",
  "are particularly sparkly!\\c\\n",
  "Life is an adventure!\\c\\n",
  "No matter how old you get,\\n",
  "don't lose your sense of adventure!$",
]

[msg.section_0.entries.17]
text = [
  "The blue Battle Medals\\n",
  "are particularly sparkly!\\c\\n",
  "In life, you have to draw a line\\n",
  "between black and white.\\c\\n",
  "Compete, aim for the top,\\n",
  "and grow together!$",
]

[msg.section_0.entries.18]
text = [
  "The pink Fun Medals\\n",
  "are particularly sparkly!\\c\\n",
  "Life is entertainment!\\c\\n",
  "Always have a smile on your face!\\n",
  "The one who has the most fun wins!$",
]

[msg.section_0.entries.19]
text = [
  "The purple Challenge Medals\\n",
  "are particularly sparkly!\\c\\n",
  "Life is a challenge!\\c\\n",
  "The harder it is to do,\\n",
  "the more it's worth doing!\\c\\n",
  "You can feel happy when\\n",
  "you've grown as a person!$",
]

[msg.section_0.entries.20]
text = [
  "The gold Special Medals\\n",
  "are particularly sparkly!\\c\\n",
  "Life is special!\\c\\n",
  "Treasure every day, and don't\\n",
  "pass a day the same way twice!$",
]

[msg.section_0.entries.21]
text = [
  "Summer's so far away. I want to see\\n",
  "again the sight I saw that night.$",
]

[msg.section_0.entries.22]
text = [
  "Recently, you can see Stunfisk\\n",
  "in this pond when the sun goes down!$",
]

[msg.section_0.entries.23]
text = [
  "Right now, the hot thing is\\n",
  "Striaton City's Stunfisk nights!\\c\\n",
  "A huge school of them gathers.\\n",
  "It's a sight that's hard to describe.\\c\\n",
  "You have to be careful not to\\n",
  "step on them.$",
]

[msg.section_0.entries.24]
text = [
  "Unn unnn?!$",
]

[msg.section_0.entries.25]
text = [
  "       $$",
]

[msg.section_0.entries.26]
text = [
  "Striaton City\\n",
  "Three Stand Together as One!$",
]

[msg.section_0.entries.27]
text = [
  "Dreamyard Ahead$",
]

[msg.section_0.entries.28]
text = [
  "Trainers' School\\n",
  "Brush up on Pokémon knowledge!$",
]

[msg.section_0.entries.29]
text = [
  "It's a well-kept flower bed.\\c\\n",
  "Someone who loves plants\\n",
  "must be taking care of it.$",
]

[msg]
trailing_data = "f6f6"

[msg.section_0.entries.0]
text = [
  "You must be the ones who want to hear\\n",
  "that old tale about Lacunosa Town.\\c$",
]

[msg.section_0.entries.1]
text = [
  "Professor Juniper: That's right.\\n",
  "Please tell us.\\c$",
]

[msg.section_0.entries.2]
text = [
  "Behind Lacunosa Town,\\n",
  "there's a mighty big hole.\\c\\n",
  "Have you heard of the Giant Chasm?\\c$",
]

[msg.section_0.entries.3]
text = [
  "Bianca: Oh, I've heard that around the\\n",
  "Giant Chasm, there have been brief\\l\\n",
  "temperature readings of -58° F!\\c\\n",
  "That's what Cheren told me, anyway!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Professor Juniper: The road is blocked,\\n",
  "so we can't get there right now...\\c$",
]

[msg.section_0.entries.5]
text = [
  "A long, long time ago, the\\n",
  "Giant Chasm was created when\\l\\n",
  "a big meteorite fell from the sky.\\c\\n",
  "A really scary Pokémon was\\n",
  "hidden inside that meteorite...\\c$",
]

[msg.section_0.entries.6]
text = [
  "Professor Juniper: A meteorite...\\c$",
]

[msg.section_0.entries.7]
text = [
  "When darkness falls over the land,\\n",
  "this Pokémon appears.\\l\\n",
  "A frigid wind follows it.\\c\\n",
  "It freezes everything around\\n",
  "and eats people and Pokémon...\\c\\n",
  "That's why everyone was afraid.\\c$",
]

[msg.section_0.entries.8]
text = [
  "Bianca: The Pokémon ate p-people?\\c$",
]

[msg.section_0.entries.9]
text = [
  "So our ancestors surrounded the town\\n",
  "with walls, to prevent the Pokémon\\l\\n",
  "from getting inside the town.\\c\\n",
  "Also, a rule was made forbidding\\n",
  "anyone to go outside after dark.\\c\\n",
  "...And that's the end of the old tale!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Professor Juniper: A fascinating story!\\n",
  "I'll add it to my research records.\\c$",
]

[msg.section_0.entries.11]
text = [
  "Everyone, we should be going.\\c$",
]

[msg.section_0.entries.12]
text = [
  "That's sure a scary-sounding Pokémon,\\n",
  "even in an old folktale.$",
]

[msg.section_0.entries.13]
text = [
  "Zzz... Zzz...\\c\\n",
  "...Wh-what?\\n",
  "What do you want, now?\\c\\n",
  "Did you pick now to listen to my stories?$",
]

[msg.section_0.entries.14]
text = [
  "Mmm... OK, I'll tell you...\\c\\n",
  "Behind our Lacunosa Town,\\n",
  "there's a big hole in the ground.\\c\\n",
  "That hole, way in the past...\\c\\n",
  "Aaaahhh, I'm so tired...\\c\\n",
  "That hole, there was a...a big...\\n",
  "crashed down...inside was...\\c\\n",
  "big, scary...really scary...\\c\\n",
  "Zzz... Zzz... Zzz...$",
]

[msg.section_0.entries.15]
text = [
  "Aaaahhh... Oh, I should...\\n",
  "OK, I'll sleep, then...\\c\\n",
  "Goodni... Zzz...\\n",
  "Zzz... Zzz...$",
]

[msg.section_0.entries.16]
text = [
  "My grandma loves old stories!\\c\\n",
  "I'm always having to listen\\n",
  "to her really long stories.\\c\\n",
  "But sometimes if it's night, she'll\\n",
  "fall asleep right in the middle of a story.\\c\\n",
  "It's OK, though. She's not only healthy,\\n",
  "she's a free-spirited grandma, too!$",
]

[msg]
trailing_data = "b6b6"

[msg.section_0.entries.0]
text = [
  "[VAR TRNAME(0)]!\\n",
  "I'm home!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Do you know Professor Juniper?\\n",
  "She's a famous Pokémon researcher.\\c\\n",
  "Actually, she's an old friend of mine,\\n",
  "and she called me today for the\\l\\n",
  "first time in ages!\\c$",
]

[msg.section_0.entries.2]
text = [
  "This is out of the blue,\\n",
  "but, [VAR TRNAME(0)]!\\c\\n",
  "Do you want to have a Pokémon?$",
]

[msg.section_0.entries.3]
text = [
  "I'll ask you again.\\c\\n",
  "Do you want a Pokémon?$",
]

[msg.section_0.entries.4]
text = [
  "What?!\\n",
  "That's a shock!\\c$",
]

[msg.section_0.entries.5]
text = [
  "OK!\\n",
  "Step one completed!\\c\\n",
  "Well then, do you know what a\\n",
  "Pokédex is?$",
]

[msg.section_0.entries.6]
text = [
  "I knew you would!\\c\\n",
  "Isn't it amazing how it automatically\\n",
  "records Pokémon you encounter?\\c$",
]

[msg.section_0.entries.7]
text = [
  "I see...\\c\\n",
  "It's an amazing device that automatically\\n",
  "records the Pokémon you encounter!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Yet another question!\\c\\n",
  "You want a Pokédex, right?$",
]

[msg.section_0.entries.9]
text = [
  "OK!\\n",
  "Step two completed!\\c$",
]

[msg.section_0.entries.10]
text = [
  "I don't mean to be selfish, but I'd like it\\n",
  "if you were a bit more agreeable.\\c\\n",
  "Having a Pokédex means\\n",
  "traveling around the world!\\l\\n",
  "Think about that for a second.\\c\\n",
  "So I'll ask you again...\\c\\n",
  "You want a Pokédex, right?$",
]

[msg.section_0.entries.11]
text = [
  "[VAR TRNAME(0)]!\\n",
  "Your course of action has been set!\\c\\n",
  "A girl named Bianca has come\\n",
  "here to meet you!\\c\\n",
  "She's Professor Juniper's assistant.\\n",
  "I was told to simply look for\\l\\n",
  "a big, green hat!\\c\\n",
  "That's right! You're going to\\n",
  "go look for Bianca.\\c\\n",
  "And then you'll get a Pokédex and a\\n",
  "Pokémon to be your partner!$",
]

[msg.section_0.entries.12]
text = [
  "[VAR TRNAME(0)]!\\n",
  "Your course of action has been set!\\c\\n",
  "A girl named Bianca has come\\n",
  "here to meet you!\\c\\n",
  "She's Professor Juniper's assistant.\\n",
  "I was told to simply look for\\l\\n",
  "a big, green hat!\\c\\n",
  "That's right! You're going\\n",
  "to go look for Bianca.\\c\\n",
  "And then you'll get a Pokédex and a\\n",
  "Pokémon to be your partner!\\c\\n",
  "Oh! Your Xtransceiver's in your\\n",
  "Bag, right?\\l\\n",
  "Do you know how to open your Bag?$",
]

[msg.section_0.entries.13]
text = [
  "I'll send you off with these\\n",
  "words from “Adventure Rules.\\\"\\l\\n",
  "“The X Button is vitally important\\l\\n",
  "for Trainers.\\\"\\c\\n",
  "OK! Off with you now!\\n",
  "Go look for Bianca, OK!$",
]

[msg.section_0.entries.14]
text = [
  "The girl's name is Bianca. I was told\\n",
  "you should look for a big, green hat!\\c\\n",
  "She might be lost because\\n",
  "this is her first time here.\\l\\n",
  "Go look for her!$",
]

[msg.section_0.entries.15]
text = [
  "Oh? Are the both of you\\n",
  "out looking for Bianca?\\c\\n",
  "You still haven't found her?\\n",
  "Look for the big, green hat!$",
]

[msg.section_0.entries.16]
text = [
  "Bianca: I was just talking to your mom!\\c\\n",
  "She told me an amazing\\n",
  "story about Professor Juniper!$",
]

[msg.section_0.entries.17]
text = [
  "Mom: Welcome back!\\n",
  "Hey, how are your Pokémon?\\c\\n",
  "Well, why don't you rest for a moment?\\n",
  "Nothing but hard work will wear you out!\\c$",
]

[msg.section_0.entries.18]
text = [
  "Mom: Looking good!\\c\\n",
  "Both you and your Pokémon\\n",
  "seem raring to go!$",
]

[msg.section_0.entries.19]
text = [
  "Mom: The same step is a lot more\\n",
  "wonderful if it's made while\\l\\n",
  "thinking about Pokémon!$",
]

[msg.section_0.entries.20]
text = [
  "Mom: When I was younger,\\n",
  "I worked at Pokémon Centers\\l\\n",
  "all over the place!$",
]

[msg.section_0.entries.21]
text = [
  "Mom: I wish we knew how\\n",
  "Pokémon felt...$",
]

[msg.section_0.entries.22]
text = [
  "Mom: Seeing energetic Pokémon\\n",
  "fills me up with energy, too!\\c\\n",
  "It reminds me of when I used\\n",
  "to work in the Pokémon Center!$",
]

[msg.section_0.entries.23]
text = [
  "Mom: Welcome home, [VAR TRNAME(0)]!\\n",
  "Seems like you've had a rough time.\\l\\n",
  "Rest here awhile.\\c\\n",
  "...\\c$",
]

[msg.section_0.entries.24]
text = [
  "Mom: OK! You and your Pokémon\\n",
  "are full of energy!\\c\\n",
  "This is a little advice from\\n",
  "your mother!\\c\\n",
  "When your Pokémon's stamina,\\n",
  "I mean HP, goes down,\\l\\n",
  "heal them regularly at the\\l\\n",
  "Pokémon Center!\\c\\n",
  "If you're going on a long adventure,\\n",
  "stock up on Potions\\l\\n",
  "at the Poké Mart!\\c\\n",
  "I'm cheering for you!\\n",
  "Have a wonderful journey!$",
]

[msg.section_0.entries.25]
text = [
  "Mom: Welcome home, [VAR TRNAME(0)]!\\c$",
]

[msg.section_0.entries.26]
text = [
  "Hmm. I barely recognize you!\\c\\n",
  "It seems like you've seen\\n",
  "and thought about a lot\\l\\n",
  "and grown into an adult!\\c\\n",
  "Oh! Seems we're about to have\\n",
  "a visitor!\\c$",
]

[msg.section_0.entries.27]
text = [
  "???: Oh, so you're [VAR TRNAME(0)]!\\c\\n",
  "My name's Juniper!\\c\\n",
  "The one who gave you\\n",
  "your Pokédex is my daughter!\\c$",
]

[msg.section_0.entries.28]
text = [
  "Mom: It's been a long time,\\n",
  "Professor Juniper!\\c$",
]

[msg.section_0.entries.29]
text = [
  "Cedric Juniper: Has it been that long?\\n",
  "I can't remember...\\c\\n",
  "Well, that's not really why I came.\\c$",
]

[msg.section_0.entries.30]
text = [
  "[VAR TRNAME(0)]!\\c\\n",
  "To commemorate your entering the\\n",
  "Hall of Fame, I'm going to upgrade\\l\\n",
  "your Pokédex!\\c$",
]

[msg.section_0.entries.31]
text = [
  "[VAR TRNAME(0)]'s Pokédex\\n",
  "was upgraded!$",
]

[msg.section_0.entries.32]
text = [
  "Cedric Juniper: I'll tell you what\\n",
  "I upgraded, so why don't you ask?\\c\\n",
  "Well, actually, it's really simple!\\c\\n",
  "I made it so you can register\\n",
  "all of the National Pokédex Pokémon.\\c$",
]

[msg.section_0.entries.33]
text = [
  "Mom: Wow! That's amazing!\\n",
  "That must be why you and\\l\\n",
  "your daughter are Pokémon Professors!\\c$",
]

[msg.section_0.entries.34]
text = [
  "Cedric Juniper: Ha ha ha!\\n",
  "Flattery won't get you anywhere!\\c\\n",
  "Well then, think I'd best\\n",
  "be taking my leave!\\c$",
]

[msg.section_0.entries.35]
text = [
  "Listen up! There are still many, many\\n",
  "Pokémon in this world!\\c\\n",
  "Sometimes Pokémon attack\\n",
  "each other for food.\\c\\n",
  "Sometimes they help one another.\\n",
  "They protect each other's places.\\c\\n",
  "I'd be happy if you think about things\\n",
  "like that while looking at the Pokédex.\\c$",
]

[msg.section_0.entries.36]
text = [
  "Mom: He left...\\c\\n",
  "Oh, that's right! [VAR TRNAME(0)]!\\n",
  "I have a present for you, too!\\c$",
]

[msg.section_0.entries.37]
text = [
  "Mom: No matter what you do, your time\\n",
  "is yours and your Pokémon's alone!\\c\\n",
  "So decide what you want to do\\n",
  "for yourself and do it!\\c\\n",
  "I enjoy my own time\\n",
  "in my own way, too!$",
]

[msg.section_0.entries.38]
text = [
  "       $$",
]

[msg.section_0.entries.39]
text = [
  "It's a Wii console!\\n",
  "It has a Wii Remote!$",
]

[msg.section_0.entries.40]
text = [
  "It's a brand-new bed!$",
]

[msg.section_0.entries.41]
text = [
  "[VAR TRNAME(0)] checked the PC.\\c\\n",
  "Adventure Rule No. 1\\n",
  "The X Button opens the menu!\\c\\n",
  "Adventure Rule No. 2\\n",
  "Record your progress with SAVE.$",
]

[msg.section_0.entries.42]
text = [
  "It's an award for completing\\n",
  "the Unova Pokédex!\\c$",
]

[msg.section_0.entries.43]
text = [
  "It's an award for completing\\n",
  "the National Mode Pokédex!\\c$",
]

[msg.section_0.entries.44]
text = [
  "It's a trophy proving you defeated\\n",
  "the Single Master in the Battle Subway!$",
]

[msg.section_0.entries.45]
text = [
  "It's a trophy proving you defeated\\n",
  "the Double Master in the Battle Subway!$",
]

[msg.section_0.entries.46]
text = [
  "It's a trophy proving you defeated\\n",
  "the Multi Master in the Battle Subway!$",
]

[msg.section_0.entries.47]
text = [
  "It's a model of a Ferris wheel\\n",
  "Mom bought as a souvenir.$",
]

[msg.section_0.entries.48]
text = [
  "It's a Darumaka Pokémon doll\\n",
  "Mom received in the past.\\c\\n",
  "When you get knocked down,\\n",
  "just get up again!$",
]

[msg.section_0.entries.49]
text = [
  "Hee hee!\\n",
  "I came to visit!\\c\\n",
  "Professor Juniper is investigating\\n",
  "a cave on Route 20!$",
]

[msg.section_0.entries.50]
text = [
  "The Cave of Being...\\c\\n",
  "I wonder where those three Pokémon--\\n",
  "Uxie, Mesprit, and Azelf--flew off to?\\c\\n",
  "Uxie is a Pokémon that\\n",
  "symbolizes knowledge...\\c\\n",
  "If you mention a place in Unova\\n",
  "where knowledge is gathered,\\l\\n",
  "the first thing that comes to mind\\l\\n",
  "is Nacrene City's museum...\\c\\n",
  "Mesprit is the Pokémon that\\n",
  "presides over emotion, right?\\c\\n",
  "Celestial Tower's bell stirs emotions...\\c\\n",
  "And Azelf is willpower...\\c\\n",
  "The desire to see something through...\\n",
  "What place could represent that?$",
]

[msg.section_0.entries.51]
text = [
  "Route 23's mysterious Pokémon...\\c\\n",
  "Just by being near it you can feel\\n",
  "some kind of willpower...\\c\\n",
  "It's best to go have a look\\n",
  "for yourself!$",
]

[msg.section_0.entries.52]
text = [
  "Sometimes, there are mass outbreaks\\n",
  "of Pokémon, right?\\c\\n",
  "A lot of the exact same Pokémon\\n",
  "show up at the same time,\\l\\n",
  "and it's such a surprise!\\c\\n",
  "Like where were all of you before?\\c\\n",
  "If you look at the electronic bulletin\\n",
  "boards, you can learn about them!$",
]

[msg.section_0.entries.53]
text = [
  "Professor Juniper--I'm talking about\\n",
  "Aurea Juniper, mind you...\\c\\n",
  "She's researching the origins of Pokémon!\\c\\n",
  "It's interesting!\\n",
  "Among the Pokémon that exist now,\\l\\n",
  "there were some that have been\\l\\n",
  "around from the past and some\\l\\n",
  "that were discovered recently.\\c\\n",
  "By the way, her dad is researching\\n",
  "Pokémon distribution and biology!$",
]

[msg.section_0.entries.54]
text = [
  "Your mom's amazing!\\c\\n",
  "It's sweet how she met\\n",
  "your dad while working\\l\\n",
  "reception at the Pokémon Center.\\c\\n",
  "Hee hee!\\n",
  "She's taught me a lot!$",
]

[msg.section_0.entries.0]
text = [
  "The slow passage of time in\\n",
  "Opelucid City...\\l\\n",
  "It fits an old woman like me perfectly.$",
]

[msg.section_0.entries.1]
text = [
  "In Opelucid City, you can spend your\\n",
  "days in leisure and opulence...$",
]

[msg.section_0.entries.2]
text = [
  "What was that?\\n",
  "How did whatever happen? Why now?$",
]

[msg.section_0.entries.3]
text = [
  "You never know what\\n",
  "will happen in life.\\c\\n",
  "So maybe it's best to take care of\\n",
  "what you should do while you can.$",
]

[msg.section_0.entries.4]
text = [
  "You never know what\\n",
  "will happen in life.\\c\\n",
  "So maybe it's best to take care of\\n",
  "what you want to do while you can.$",
]

[msg.section_0.entries.5]
text = [
  "Sometimes, I think this...\\c\\n",
  "There could be another world, where\\n",
  "a person who looks just like me\\l\\n",
  "lives in a completely different way...$",
]

[msg.section_0.entries.6]
text = [
  "I imagine that even the exact same\\n",
  "person would change a lot by living in a\\l\\n",
  "different world.$",
]

[msg.section_0.entries.7]
text = [
  "Oh...\\n",
  "I thought it was chilly...$",
]

[msg.section_0.entries.8]
text = [
  "No matter what the world is like,\\n",
  "I want to live in it as myself.\\l\\n",
  "That's the truth!$",
]

[msg.section_0.entries.9]
text = [
  "No matter what the world is like,\\n",
  "I want to live in it as myself.\\l\\n",
  "That's my ideal!$",
]

[msg.section_0.entries.10]
text = [
  "I want to see how the Pokémon Gym has\\n",
  "changed, but I'm not a Trainer yet...\\c\\n",
  "I wonder if there's a Pokémon\\n",
  "somewhere that will travel with me...$",
]

[msg.section_0.entries.11]
text = [
  "Know what I saw?\\n",
  "A huuuge icicle fall from the sky!$",
]

[msg.section_0.entries.12]
text = [
  "Drayden said that if I want to\\n",
  "travel with Pokémon, I should\\l\\n",
  "feel a Pokémon's pain as my own!$",
]

[msg.section_0.entries.13]
text = [
  "Oh!\\n",
  "Your Medal Box...\\c$",
]

[msg.section_0.entries.14]
text = [
  "Wh-what in the world?\\n",

[msg.section_0.entries.0]
text = [
  "Iris: Hey, c'mon!\\c\\n",
  "Thumb Pier is past here!\\c\\n",
  "If you mention a suspicious\\n",
  "place in Castelia City, the\\l\\n",
  "only places that come to mind\\l\\n",
  "are Narrow Street and here!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Iris: This way! This way!\\n",
  "C'mon! Have a look!\\c$",
]

[msg.section_0.entries.2]
text = [
  "...When I fall asleep in my bed.\\c\\n",
  "...When my Pokémon's attack\\n",
  "hits critically!\\c\\n",
  "My life is full of things\\n",
  "that bring me joy!$",
]

[msg.section_0.entries.3]
text = [
  "I'm a battling Clerk ⑭!\\n",
  "If I don't give up, I'll win someday!$",
]

[msg.section_0.entries.4]
text = [
  "Everyone's faces blend together!\\n",
  "Is that because I'm tired?$",
]

[msg.section_0.entries.5]
text = [
  "When you're tired, rest!\\n",
  "Don't force yourself to be energetic!$",
]

[msg.section_0.entries.6]
text = [
  "Should I change my Pokémon's moves\\n",
  "or its held items?$",
]

[msg.section_0.entries.7]
text = [
  "To live surrounded by people,\\n",
  "do you have to grow to like everyone,\\l\\n",
  "or do you only have to like yourself?$",
]

[msg.section_0.entries.8]
text = [
  "I wonder what Castelia\\n",
  "was like before it got this big.$",
]

[msg.section_0.entries.9]
text = [
  "It's wonderful how the Pokémon\\n",
  "and women here are so full of life!$",
]

[msg.section_0.entries.10]
text = [
  "The Battle Company needs\\n",
  "people for focus testing.\\c\\n",
  "Trainers who are confident in\\n",
  "their abilities should come try it!$",
]

[msg.section_0.entries.11]
text = [
  "Seasons and trends always pass...$",
]

[msg.section_0.entries.12]
text = [
  "Welcome to Castelia City!!\\n",
  "It's the Castelia Harlequin Hunt!\\c\\n",
  "I bet this is your first visit to\\n",
  "Castelia City.\\c\\n",
  "That's great!\\n",
  "Here, have this Bicycle!\\c$",
]

[msg.section_0.entries.13]
text = [
  "The Castelia Harlequin Hunt's\\n",
  "rules are simple!\\c\\n",
  "All you have to do is visit specific\\n",
  "places and talk to the Harlequin there!\\l\\n",
  "Whether you participate is up to you!\\l\\n",
  "The places to look are...\\c\\n",
  "The Medal Office!\\c\\n",
  "Passerby Analytics HQ!\\c\\n",
  "And the Battle Company!\\c\\n",
  "Ride the Bicycle I gave\\n",
  "you, and go, go, go!$",
]

[msg.section_0.entries.14]
text = [
  "Free-for-all! It's the Castelia\\n",
  "Harlequin Hunt! You haven't visited...\\c$",
]

[msg.section_0.entries.15]
text = [

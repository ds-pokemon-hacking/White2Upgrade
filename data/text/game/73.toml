[msg.section_0.entries.0]
text = [
  "Welcome to the main stage!\\c\\n",
  "My beloved Pokémon\\n",
  "and your Pokémon shall compete!\\c\\n",
  "We're going to see whose\\n",
  "star shines brightest!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Well...\\c\\n",
  "Now, you...you're an even more wonderful\\n",
  "Trainer than I expected.\\c\\n",
  "Your sweet fighting style\\n",
  "swept me off my feet!\\l\\n",
  "Take this!\\c$",
]

[msg.section_0.entries.2]
text = [
  "[VAR TRNAME(0)] received the\\n",
  "Bolt Badge from Elesa!\\c$",
]

[msg.section_0.entries.3]
text = [
  "If you have four Badges, including this\\n",
  "Bolt Badge, Pokémon up to Lv. 50,\\l\\n",
  "including traded Pokémon, will obey you.\\c\\n",
  "Also, here's this move I like.\\n",
  "Feel free to use it, um, if you want to.\\c$",
]

[msg.section_0.entries.4]
text = [
  "Volt Switch lets the Pokémon switch with\\n",
  "a different Pokémon after attacking.\\c\\n",
  "Of course, if you don't have another\\n",
  "Pokémon in your party, you can't switch.$",
]

[msg.section_0.entries.5]
text = [
  "I want my relationship with my Pokémon\\n",
  "to be less like sun and moon\\l\\n",
  "and more like two blazing suns!\\c\\n",
  "There'd be no limit to how bright\\n",
  "we could shine!$",
]

[msg.section_0.entries.6]
text = [
  "What my Pokémon want to do\\n",
  "and what I want to do...\\l\\n",
  "When they are the same...\\c\\n",
  "We have more than twice\\n",
  "the energy to shine!$",
]

[msg.section_0.entries.7]
text = [
  "Wait!\\c\\n",
  "Please walk with us.\\c$",
]

[msg.section_0.entries.8]
text = [
  "A shining example of a Trainer...\\c\\n",
  "Since that's what you are, you should\\n",
  "be able to collect all the Gym Badges\\l\\n",
  "and reach the Pokémon League!\\c\\n",
  "Then, you and your Pokémon\\n",
  "will shine even brighter!$",
]

[msg.section_0.entries.9]
text = [
  "Elesa: A model always has to make\\n",
  "other people's dreams a reality\\l\\n",
  "without losing sight of herself.\\c\\n",
  "It's similar for Trainers and Pokémon.\\n",
  "Trainers have to give everything they\\l\\n",
  "have to make their Pokémon feel like\\l\\n",
  "they can win, no matter the situation.\\c\\n",
  "When I realized that, modeling\\n",
  "became that much more fun.$",
]

[msg.section_0.entries.10]
text = [
  "Welcome to the Nimbasa Gym!\\c\\n",
  "A stylish Pokémon battle and\\n",
  "fashion show created by Pokémon\\l\\n",
  "and Trainers is starting now!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Isn't this Gym beautiful when it's lit up?\\c\\n",
  "The Pokémon also look beautiful\\n",
  "in this lighting!$",
]

[msg.section_0.entries.12]
text = [
  "You and your Pokémon\\n",
  "sparkle and shine!$",
]

[msg.section_0.entries.13]
text = [
  "Are you beautiful as a Trainer?\\n",
  "Surprise me!\\c$",
]

[msg.section_0.entries.14]
text = [
  "Ms. Elesa is strong and beautiful...\\c\\n",
  "Don't make the mistake of thinking\\n",
  "she's the same as us.$",
]

[msg.section_0.entries.15]
text = [
  "Beauty isn't just about looks.\\c\\n",
  "Strength is a part of beauty,\\n",
  "both for you and for Elesa.$",
]

[msg.section_0.entries.16]
text = [
  "The show is coming to its finale.\\n",
  "Now, I'll see if you are worthy\\l\\n",
  "to stand on the same stage as Elesa!\\c$",
]

[msg.section_0.entries.17]
text = [
  "Being able to see a match between\\n",
  "a challenger and Elesa this close...\\c\\n",
  "That makes even us gleam with joy!$",
]

[msg.section_0.entries.18]
text = [
  "That was a beautiful Pokémon battle\\n",
  "you and Elesa had!\\c\\n",
  "I was captivated by it!\\n",
  "What an absolutely marvelous show!$",
]

[msg.section_0.entries.19]
text = [
  "What do you think? Surprised, right?\\c\\n",
  "This Gym is, speaking frankly, a glittering\\n",
  "fashion show and a dazzling stage!\\c\\n",
  "Well, for now, I'll give you this!\\c$",
]

[msg.section_0.entries.20]
text = [
  "In this Pokémon Gym, we'll have you\\n",
  "proceed by defeating the Trainers waiting\\l\\n",
  "on the catwalk!\\c\\n",
  "By the way, Electric-type Pokémon don't\\n",
  "do well against Ground-type moves...\\c\\n",
  "Oh!\\c\\n",
  "But Ground-type moves don't work\\n",
  "against a Pokémon called Emolga,\\l\\n",
  "so please be careful!$",
]

[msg.section_0.entries.21]
text = [
  "Elesa uses sparkling, bright\\n",
  "Electric-type attacks!\\c\\n",
  "But the combination of you and your\\n",
  "Pokémon shone even brighter!\\c\\n",
  "Why, you're...you're...\\n",
  "a supermodel!\\c\\n",
  "Well, no. You're just a really good\\n",
  "Trainer with great Pokémon!$",
]

[msg.section_0.entries.22]
text = [
  "Nimbasa City Pokémon Gym\\c\\n",
  "Leader: Elesa\\n",
  "Certified Trainers:$",
]

[msg.section_0.entries.23]
text = [
  "Nimbasa City Pokémon Gym\\c\\n",
  "Leader: Elesa\\n",
  "Certified Trainers:\\l\\n",
  "[VAR TRNAME(0)]$",
]

[msg.section_0.entries.24]
text = [
  "Nimbasa City Pokémon Gym\\c\\n",
  "Leader: Elesa\\n",
  "Certified Trainers:\\l\\n",
  "[VAR TRNAME(0)], [VAR TRNAME(1)]$",
]

[msg.section_0.entries.25]
text = [
  "[VAR TRNAME(0)]!$",
]

[msg.section_0.entries.26]
text = [
  "So cool!$",
]

[msg.section_0.entries.27]
text = [
  "Stunning!$",
]

[msg.section_0.entries.28]
text = [
  "Bravo!$",
]

[msg.section_0.entries.29]
text = [
  "[VAR TRNAME(0)]! Woo!$",
]

[msg.section_0.entries.30]
text = [
  "Wonderful!$",
]

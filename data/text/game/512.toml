[msg.section_0.entries.3]
text = [
  "Welcome to the Pokémon Center.\\c\\n",
  "Hey! Is today your birthday?$",
]

[msg.section_0.entries.4]
text = [
  "Happy birthday!\\c\\n",
  "Please keep visiting the Pokémon Center\\n",
  "for many years to come.\\c\\n",
  "Now, would you like to rest\\n",
  "your Pokémon?$",
]

[msg.section_0.entries.5]
text = [
  "It isn't? Oh, I must have been confused.\\c\\n",
  "Would you like to rest your Pokémon?$",
]

[msg.section_0.entries.6]
text = [
  "OK, I'll take your Pokémon for\\n",
  "a few seconds.$",
]

[msg.section_0.entries.7]
text = [
  "Thank you for waiting.\\c\\n",
  "We've restored your Pokémon\\n",
  "to full health.\\c$",
]

[msg.section_0.entries.8]
text = [
  "We hope to see you again!$",
]

[msg.section_0.entries.9]
text = [
  "Hello, and welcome to\\n",
  "the Pokémon Center.\\c\\n",
  "We restore your tired Pokémon\\n",
  "to full health.\\c\\n",
  "Would you like to...\\c$",
]

[msg.section_0.entries.10]
text = [
  "Th-that Trainer Card!\\n",
  "That wonderful shade! That sparkle!\\c\\n",
  "I've seen several Trainers with\\n",
  "Silver Trainer Cards already...\\c\\n",
  "But you're the first to top them all with\\n",
  "that impressive Trainer Card.\\c\\n",
  "Oh, [VAR TRNAME(0)], may I please heal\\n",
  "your Pokémon?$",
]

[msg.section_0.entries.11]
text = [
  "Great to see you, [VAR TRNAME(0)]!\\n",
  "You want the usual, right?$",
]

[msg.section_0.entries.12]
text = [
  "Oh... It looks like your Pokémon may be\\n",
  "infected with the Pokérus.\\c\\n",
  "Little is known about the Pokérus,\\n",
  "except that it is a microscopic life-form\\l\\n",
  "that attaches to Pokémon.\\c\\n",
  "While infected, Pokémon are said to\\n",
  "grow exceptionally well.$",
]

[msg.section_0.entries.13]
text = [
  "Welcome to the Pokémon Wireless\\n",
  "Club Union Room.\\c\\n",
  "You may interact directly with\\n",
  "many Trainers here.\\c\\n",
  "Would you like to enter the room?$",
]

[msg.section_0.entries.14]
text = [
  "The Trainers in the Union Room\\n",
  "will be those players around you\\l\\n",
  "who have also entered the room.\\c\\n",
  "You may trade your Pokémon here\\n",
  "or have battles for two or four.\\c\\n",
  "Also, you may exchange Eggs\\n",
  "or draw pictures with other players.\\c\\n",
  "You may also chat with other\\n",
  "players in the room.\\c\\n",
  "Or you may locate friends in the room\\n",
  "by touching their spoken words.\\c\\n",
  "Would you like to enter the room?$",
]

[msg.section_0.entries.15]
text = [
  "DS Wireless Communications\\n",
  "will be launched.$",
]

[msg.section_0.entries.16]
text = [
  "I hope you enjoy your time in\\n",
  "the Union Room.\\c$",
]

[msg.section_0.entries.17]
text = [
  "Please do visit again.$",
]

[msg.section_0.entries.18]
text = [
  "Enter the Union Room$",
]

[msg.section_0.entries.19]
text = [
  "Cancel$",
]

[msg.section_0.entries.20]
text = [
  "Info$",
]

[msg.section_0.entries.21]
text = [
  "I am sorry...\\n",
  "You can't enter the Union Room yet.\\c$",
]

[msg.section_0.entries.22]
text = [
  "You have at least one Pokémon\\n",
  "that can't be taken in.\\c$",
]

[msg.section_0.entries.23]
text = [
  "Wait, Trainer!\\c\\n",
  "Your title on your Trainer Card\\n",
  "is still just “Pokémon Trainer,\\\" isn't it?\\c\\n",
  "If you change your title, you can easily\\n",
  "project your image to others when you\\l\\n",
  "greet them in the Union Room.\\c\\n",
  "Let's see...\\n",
  "How about [VAR TRCLASS(0)]?\\l\\n",
  "What do you think?\\c\\n",
  "That is the impression I got from you.\\n",
  "First, let's change your title.\\c\\n",
  "If you don't like the new one, you can\\n",
  "change it by selecting your Trainer Card.\\c$",
]

[msg.section_0.entries.24]
text = [
  "It seems you can't use it yet.$",
]

[msg.section_0.entries.25]
text = [
  "The Xtransceiver is ringing.$",
]

[msg.section_0.entries.26]
text = [
  "[VAR TRNAME(0)] picked up the\\n",
  "Xtransceiver.\\c$",
]

[msg.section_0.entries.27]
text = [
  "Oh?\\n",
  "You're...\\c$",
]

[msg.section_0.entries.28]
text = [
  "Sorry...\\c\\n",
  "When I saw you,\\n",
  "I just started talking for some reason.$",
]

[msg.section_0.entries.29]
text = [
  "I'm sorry!\\c\\n",
  "Your system's power was turned\\n",
  "off during a Random Matchup!\\c\\n",
  "You will not be able to participate\\n",
  "in a Random Matchup\\l\\n",
  "or Wi-Fi Competition for an hour.\\c\\n",
  "Please come back later.\\c$",
]

[msg.section_0.entries.30]
text = [
  "In honor of your achievement in battle,\\n",
  "I present you with these Battle Points!\\c$",
]

[msg.section_0.entries.31]
text = [
  "[VAR TRNAME(0)] received [VAR NUM2(1)] BP!$",
]

[msg.section_0.entries.32]
text = [
  "Saving...\\n",
  "Don't turn off the power.$",
]

[msg.section_0.entries.0]
text = [
  "The flat part of Stunfisk is\\n",
  "very charming, isn't it?$",
]

[msg.section_0.entries.1]
text = [
  "The flat part of Stunfisk is\\n",
  "very charming, isn't it?\\c\\n",
  "Do you know other Water-type Pokémon\\n",
  "with a slender body?$",
]

[msg.section_0.entries.2]
text = [
  "Oh!\\n",
  "The heart-shaped Pokémon!\\c\\n",
  "Wow! It's called Luvdisc!\\n",
  "Great! So slender!$",
]

[msg.section_0.entries.3]
text = [
  "Oh? Your Bag is full of\\n",
  "Heart Scales!\\c\\n",
  "Come visit me again\\n",
  "with Luvdisc!$",
]

[msg.section_0.entries.4]
text = [
  "Stunfisk and Luvdisc both\\n",
  "have slender bodies!\\c\\n",
  "But whether it is vertically slender\\n",
  "or horizontally slender\\l\\n",
  "gives a different impression!$",
]

[msg.section_0.entries.5]
text = [
  "The Pokémon's name starts with “L\\\"\\n",
  "and it looks like a heart! I think.$",
]

[msg.section_0.entries.6]
text = [
  "If you sleep on Stunfisk,\\n",
  "its electricity relaxes the body!$",
]

[msg.section_0.entries.7]
text = [
  "Stuun!$",
]

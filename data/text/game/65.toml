[msg]
trailing_data = "b4b4"

[msg.section_0.entries.0]
text = [
  "By taking a Feeling Check, you can get\\n",
  "a Sweet Heart. That's a good item, right?$",
]

[msg.section_0.entries.1]
text = [
  "I am the Feeling Reader.\\c\\n",
  "I've heard a lot of people take\\n",
  "Feeling Checks using the C-Gear.$",
]

[msg.section_0.entries.2]
text = [
  "I am the Feeling Reader.\\c\\n",
  "From the results of your Feeling Checks,\\n",
  "I'll tell you your lucky person\\l\\n",
  "for today!\\c\\n",
  "Are you interested?\\n",
  "Do you want to know your lucky person?$",
]

[msg.section_0.entries.3]
text = [
  "The person who can make your day\\n",
  "exceptionally happy...\\c\\n",
  "It's [VAR TRNAME(0)]!$",
]

[msg.section_0.entries.4]
text = [
  "Oh, you don't have to hesitate.\\n",
  "I will read it for free!$",
]

[msg.section_0.entries.5]
text = [
  "The person who can make your day\\n",
  "exceptionally happy is...\\c\\n",
  "Oh dear. You've taken a Feeling Check\\n",
  "only with [VAR TRNAME(0)].\\c\\n",
  "I suggest that you take Feeling Checks\\n",
  "with a lot of people!$",
]

[msg.section_0.entries.6]
text = [
  "Hello!\\c\\n",
  "If you'd like, I will massage\\n",
  "your Pokémon.$",
]

[msg.section_0.entries.7]
text = [
  "Oh, I see.\\n",
  "Please see me if you change your mind.$",
]

[msg.section_0.entries.8]
text = [
  "All right! Let me get started.\\c$",
]

[msg.section_0.entries.9]
text = [
  "Massage the Egg?\\n",
  "It may be a bit too early for that.$",
]

[msg.section_0.entries.10]
text = [
  "There. All done!\\c\\n",
  "The massage has made your Pokémon\\n",
  "much more friendly to you!$",
]

[msg.section_0.entries.11]
text = [
  "There. All done!\\c\\n",
  "The massage has made your Pokémon\\n",
  "more friendly to you!$",
]

[msg.section_0.entries.12]
text = [
  "There. All done!\\c\\n",
  "The massage has made your Pokémon\\n",
  "a little bit more friendly to you!$",
]

[msg.section_0.entries.13]
text = [
  "Sorry!\\n",
  "I am exhausted from the massage earlier.\\c\\n",
  "Please come back again tomorrow!$",
]

[msg.section_0.entries.14]
text = [
  "You can't change the name of a Pokémon\\n",
  "you got from someone.\\c\\n",
  "Because the name contains wishes\\n",
  "of the person who named it!$",
]

[msg.section_0.entries.15]
text = [
  "Detect: Faafoon!$",
]

[msg]
trailing_data = "e0e0"

[msg.section_0.entries.0]
text = [
  "???: You must be a challenger!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Welcome to Aspertia City's Pokémon Gym.\\c\\n",
  "I'm Cheren, the Gym Leader!\\c\\n",
  "Hm? Well, maybe I'd better say that I\\n",
  "just became the Gym Leader!\\c\\n",
  "More importantly, we need to prepare\\n",
  "before welcoming you to the Gym.\\c$",
]

[msg.section_0.entries.2]
text = [
  "We have a challenger!\\n",
  "You two, take your places!\\c$",
]

[msg.section_0.entries.3]
text = [
  "If you can defeat these two,\\n",
  "then I'll be your opponent!$",
]

[msg.section_0.entries.4]
text = [
  "If you want to battle me,\\n",
  "please defeat those two first, OK?$",
]

[msg.section_0.entries.5]
text = [
  "Just as this is your first Gym challenge,\\n",
  "this is my first Pokémon battle\\l\\n",
  "as a Gym Leader!\\c\\n",
  "Let's both do our best and have\\n",
  "a battle we can be proud of!\\c$",
]

[msg.section_0.entries.6]
text = [
  "That battle has made me feel really\\n",
  "glad you were my first challenger\\l\\n",
  "as a Gym Leader...\\c\\n",
  "I give you this in honor of the strength\\n",
  "you and your Pokémon showed!\\c$",
]

[msg.section_0.entries.7]
text = [
  "[VAR TRNAME(0)] received the\\n",
  "Basic Badge from Cheren!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Here is your first Gym Badge,\\n",
  "the Basic Badge!\\l\\n",
  "This is an important milestone!\\c\\n",
  "With this Badge, Pokémon up to Lv. 20\\n",
  "will obey you, including traded Pokémon.\\c\\n",
  "And I want you to take this!\\c$",
]

[msg.section_0.entries.9]
text = [
  "TM83 can teach your\\n",
  "Pokémon the move Work Up!\\c\\n",
  "When you use Work Up\\n",
  "while battling, it raises\\l\\n",
  "the user's Attack and Sp. Atk.\\c\\n",
  "By the way, TMs can be used\\n",
  "as many times as you want!\\c$",
]

[msg.section_0.entries.10]
text = [
  "In the Unova region, there are eight\\n",
  "Pokémon Gyms and eight Gym Badges!\\c\\n",
  "If you're a Trainer,\\n",
  "you could collect all of them!\\c\\n",
  "That will make it easier to fill\\n",
  "the pages of the Pokédex as well!\\c\\n",
  "Yes, two years ago, Pokédex in hand,\\n",
  "I left on a journey with my friends.$",
]

[msg.section_0.entries.11]
text = [
  "Cheren: You should decide what\\n",
  "you're going to do from here out!\\c\\n",
  "Don't worry about losing your way--\\n",
  "you have Pokémon by your side!$",
]

[msg.section_0.entries.12]
text = [
  "Cheren saw potential in me and\\n",
  "made me a Trainer in this Gym!\\c$",
]

[msg.section_0.entries.13]
text = [
  "If you can defeat the girl, too,\\n",
  "you can challenge the Gym Leader!$",
]

[msg.section_0.entries.14]
text = [
  "Wow! You can challenge\\n",
  "the Gym Leader!$",
]

[msg.section_0.entries.15]
text = [
  "The reason Cheren saw potential\\n",
  "in me was there was no one else...?\\c\\n",
  "No way! Even if that is the case,\\n",
  "I just have to get stronger!$",
]

[msg.section_0.entries.16]
text = [
  "Now I'll show you all of the\\n",
  "things I learned from Cheren!\\c$",
]

[msg.section_0.entries.17]
text = [
  "I guess you can battle a little!\\n",
  "Think you can beat the other Trainer?$",
]

[msg.section_0.entries.18]
text = [
  "OK. You're pretty good!\\n",
  "But, can you beat Cheren?$",
]

[msg.section_0.entries.19]
text = [
  "I have to learn even more\\n",
  "about my Pokémon!$",
]

[msg.section_0.entries.20]
text = [
  "Hello! I'm Clyde, the guide for Trainers\\n",
  "who challenge Pokémon Gyms.\\c\\n",
  "Thank you for taking on the Gym!\\n",
  "Take this to commemorate\\l\\n",
  "your debut!\\c$",
]

[msg.section_0.entries.21]
text = [
  "Pokémon Gyms are facilities\\n",
  "for testing Trainers' abilities!\\c\\n",
  "Put simply, if you can defeat\\n",
  "the Gym Leader, it means\\l\\n",
  "you're a really good Trainer!\\c$",
]

[msg.section_0.entries.22]
text = [
  "If you run out of Pokémon that can fight\\n",
  "during a Pokémon battle, you lose!\\c\\n",
  "So having a lot of Pokémon with you\\n",
  "might work to your advantage!$",
]

[msg.section_0.entries.23]
text = [
  "I hope you'll remember the wonderful\\n",
  "moment in which you received\\l\\n",
  "that Badge forever.$",
]

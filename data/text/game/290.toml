[msg.section_0.entries.0]
text = [
  "How long does “wait until everyone\\n",
  "else arrives\\\" mean, exactly?\\c$",
]

[msg.section_0.entries.1]
text = [
  "The area past here is important!\\c\\n",
  "The people heading to Route 21\\n",
  "are definitely important, but we have\\l\\n",
  "an important role as well!$",
]

[msg.section_0.entries.2]
text = [
  "[VAR TRNAME(1)]: You're already here, huh?\\c\\n",
  "Anyone who tries to block us\\n",
  "will go running away with\\l\\n",
  "their tail between their legs!\\c$",
]

[msg.section_0.entries.3]
text = [
  "Hey, it's good! We're all set here!\\c$",
]

[msg.section_0.entries.4]
text = [
  "It's finally time!\\n",
  "C'mon! Let's go!\\c$",
]

[msg.section_0.entries.5]
text = [
  "[VAR TRNAME(1)]: You're all alone now...\\n",
  "So, which one of us are you gonna tackle?\\c$",
]

[msg.section_0.entries.6]
text = [
  "Oi! It's me! Me!\\n",
  "The ex-Team Plasma guy!\\l\\n",
  "The one Rood asked to be a spy!\\c$",
]

[msg.section_0.entries.7]
text = [
  "[VAR TRNAME(1)]: Oh, yeah...\\n",
  "I remember you.\\c\\n",
  "Being ex-Team Plasma\\n",
  "is really rough, eh?\\c$",
]

[msg.section_0.entries.8]
text = [
  "You know, N was so nice to Pokémon...\\c\\n",
  "And all I wanted to do was protect\\n",
  "Pokémon from bad people...\\c$",
]

[msg.section_0.entries.9]
text = [
  "[VAR TRNAME(1)]: Well, I suppose...\\c\\n",
  "If we don't crush Team Plasma, then\\n",
  "guys like you and that N guy\\l\\n",
  "will always be treated like villains.\\c\\n",
  "OK!\\n",
  "I'm outta here, [VAR TRNAME(0)]!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Oh, thank you.\\n",
  "That's so nice.\\c\\n",
  "Even if we said it was for Pokémon, in the\\n",
  "end, we were doing what we wanted to do.\\c\\n",
  "Please excuse me.\\n",
  "There's still something I have to do!\\c$",
]

[msg.section_0.entries.11]
text = [
  "We're standing watch here\\n",
  "so our allies don't go AWOL!$",
]

[msg.section_0.entries.12]
text = [
  "None shall pass!\\n",
  "Sages' orders!$",
]

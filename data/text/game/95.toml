]

[msg.section_0.entries.2]
text = [
  "Hey! Now! There!\\n",
  "Ah! No! No, no!\\c\\n",
  "Yes! Yes, yes!\\n",
  "That's right! Ha!\\c\\n",
  "Why don't you do it like I said?!$",
]

[msg.section_0.entries.3]
text = [
  "I watch them practice quietly.\\n",
  "Because I trust the athletes!$",
]

[msg.section_0.entries.4]
text = [
  "Hm-hum! I can copy that play in my\\n",
  "next game.$",
]

[msg.section_0.entries.5]
text = [
  "Did you see it?\\n",
  "That's a great muscle move!\\c\\n",
  "Good muscle! Good hustle!$",
]

[msg.section_0.entries.6]
text = [
  "Oh! This could be a once-in-a-lifetime\\n",

[msg.section_0.entries.0]
text = [
  "Hello, and welcome to Unity Tower!\\n",
  "Would you like to go upstairs?$",
]

[msg.section_0.entries.1]
text = [
  "Indeed.\\n",
  "Please step inside the elevator.\\c$",
]

[msg.section_0.entries.2]
text = [
  "Please come again.$",
]

[msg.section_0.entries.3]
text = [
  "This is Unity Tower.\\c\\n",
  "Trainers from all over the world cross\\n",
  "borders and oceans to gather here.\\c\\n",
  "Visit whichever floor you like!\\c\\n",
  "The more people you know worldwide,\\n",
  "the more floors you can visit.\\c\\n",
  "Please enjoy all that we have to offer!$",
]

[msg.section_0.entries.4]
text = [
  "Right now, the number of visitors in\\n",
  "Unity Tower is [VAR NUM2(11)].$",
]

[msg.section_0.entries.5]
text = [
  "Wow! So you like\\n",
  "[VAR HOBBY(6)], then!$",
]

[msg.section_0.entries.6]
text = [
  "Awesome! The ceiling is sooo high!\\c\\n",
  "I wonder how many of me\\n",
  "you'd have to stack up to reach it?$",
]

[msg.section_0.entries.7]
text = [
  "Coming to Unity Tower always\\n",
  "gets me excited!\\c\\n",
  "Being here always reminds me of how big\\n",
  "the world really is!$",
]

[msg.section_0.entries.8]
text = [
  "You're a new face.\\n",
  "Is this your first time here?\\c\\n",
  "Unity Tower is the place where\\n",
  "Trainers come from all over the world.\\c\\n",
  "That's why I work hard every day doing\\n",
  "security checks to protect those\\l\\n",
  "young Trainers.\\c\\n",
  "Don't loiter around here\\n",
  "and cause trouble.\\l\\n",
  "...'Kay, you can pass.\\c$",
]

[msg.section_0.entries.9]
text = [
  "                                          $$",
]

[msg.section_0.entries.10]
text = [
  "Seems like I've met you somewhere...\\n",
  "Anyway, don't get too wound up and fall.\\c\\n",
  "When guests get hurt, it causes me\\n",
  "no end of trouble.\\c\\n",
  "...'Kay, you can pass.\\c$",
]

[msg.section_0.entries.11]
text = [
  "Oh! So you're a Trainer, then!\\c\\n",
  "I see. You're far from family\\n",
  "and traveling the world, huh?\\c\\n",
  "I suppose it's fine if you contact them\\n",
  "once in a while.\\c\\n",
  "'Kay, you can pass.\\c$",
]

[msg.section_0.entries.12]
text = [
  "Oh, it's you.\\c\\n",
  "Hmm... You like trading, do you now?\\c\\n",
  "Well, that's all right, isn't it.\\n",
  "You're active--just like a young person\\l\\n",
  "should be.\\c\\n",
  "'Kay, you can pass.\\c$",
]

[msg.section_0.entries.13]
text = [
  "Oh, it's you.\\c\\n",
  "Seems like you come here a lot.\\n",
  "Do you have friends all over the world?\\c\\n",
  "I'd never have imagined a world like this\\n",
  "when I was young.\\c\\n",
  "'Kay, you can pass.\\c$",
]

[msg.section_0.entries.14]
text = [
  "Oh, it's you, [VAR TRNAME(3)]!\\c\\n",
  "Lately, lots of Trainers have been\\n",
  "looking for you.\\l\\n",
  "You're just like a movie star, aren't ya?\\c\\n",
  "When I was your age, the ladies\\n",
  "used to get worked up over me. Ha ha.\\c\\n",
  "'Kay, you can pass.\\c$",
]

[msg.section_0.entries.15]
text = [
  "Hey, it's you, [VAR TRNAME(3)]!\\c\\n",
  "Recently, it looks like there have been\\n",
  "lots of global Trainers like you.\\c\\n",
  "That means--how do I put it--world peace\\n",
  "can't be far off!\\l\\n",
  "Should I get my hopes up?\\c\\n",
  "'Kay, pass on through!\\c$",
]

[msg.section_0.entries.16]
text = [
  "Oh, it's you, [VAR TRNAME(3)]!\\c\\n",
  "It feels like since you've started\\n",
  "coming, Unity Tower has gotten busier.\\c\\n",
  "There's been a lot more work for this\\n",
  "old guy, but that's a problem I'm\\l\\n",
  "happy to have.\\c\\n",
  "Keep up the good work!\\c$",
]

[msg.section_0.entries.17]
text = [
  "Hey, [VAR TRNAME(3)].\\c\\n",
  "You've managed to trade with folks in\\n",
  "even more places, huh?\\c\\n",
  "That's really something!\\n",
  "I'd imagine your Pokédex is getting\\l\\n",
  "pretty full, then?\\c\\n",
  "Wow, you're amazing!\\n",
  "'Kay, pass on through.\\c$",
]

[msg.section_0.entries.18]
text = [
  "Hey, [VAR TRNAME(3)].\\c\\n",
  "Unity Tower is as lively as ever\\n",
  "with people who come here to see you.\\c\\n",
  "Well, enjoy yourself today!\\c$",
]

[msg.section_0.entries.19]
text = [
  "Why, if it isn't [VAR TRNAME(3)]!\\n",
  "What? F-fifty countries?!\\c\\n",
  "I've never seen a Trainer who has traded\\n",
  "with folks in over 50 countries!\\c\\n",
  "How in the world did you manage that?\\c\\n",
  "'Kay, please pass through--and feel free\\n",
  "to wander around!\\c$",
]

[msg.section_0.entries.20]
text = [
  "Hey, it's you, [VAR TRNAME(3)].\\c\\n",
  "After trading with this many people, you\\n",
  "must have friends all over the world!\\c\\n",
  "Ha ha. If you go on a trip, no worries\\n",
  "about not knowing anyone, huh?\\c\\n",
  "'Kay, please pass through!\\c$",
]

[msg.section_0.entries.21]
text = [
  "Why, if it isn't [VAR TRNAME(3)]!\\c\\n",
  "I almost feel like I don't need to bother\\n",
  "with a security check for you anymore.\\l\\n",
  "You can go ahead and pass.\\c\\n",
  "...Gotcha!\\n",
  "I've been a security guard for 30 years!\\c\\n",
  "I know trouble just waits for you\\n",
  "to let your guard down.\\l\\n",
  "...'Kay, you can pass.\\c$",
]

[msg.section_0.entries.22]
text = [
  "Why, if it isn't [VAR TRNAME(3)].\\c\\n",
  "I'll just do a brief security check.\\c\\n",
  "...W-what's this? Ooh, it's a kind of gum\\n",
  "I've never seen! Is it a new brand?\\l\\n",
  "Maybe I'll buy some later.\\c\\n",
  "'Kay, you can pass.\\c$",
]

[msg.section_0.entries.23]
text = [
  "Why, if it isn't [VAR TRNAME(3)].\\c\\n",
  "Just a little more, and you'll have\\n",
  "traded with every place here, huh?\\c\\n",
  "It's really reassuring to me that kids\\n",
  "like you are going to be the ones running\\l\\n",
  "the world!\\l\\n",
  "Just a little more to go. You can do it!\\c\\n",
  "'Kay, you can pass!\\c$",
]

[msg.section_0.entries.24]
text = [
  "It's you, [VAR TRNAME(3)]!\\n",
  "I already heard!\\c\\n",
  "You've finally managed to trade with\\n",
  "people from every location, right?\\c\\n",
  "It might just be me, but Unity Tower\\n",
  "feels more exciting when you visit.\\l\\n",
  "I'm sure it's happy to see you.\\c\\n",
  "Hey, [VAR TRNAME(3)], I'd like to give my\\n",
  "thanks as the Unity Tower guard for\\l\\n",
  "making this building out in the middle\\l\\n",
  "of nowhere so lively.\\c\\n",
  "'Kay, you can pass. Think of this place\\n",
  "as your own backyard and feel free to go\\l\\n",
  "where you please.\\c$",
]

[msg.section_0.entries.25]
text = [
  "Please select a floor.\\c$",
]

[msg.section_0.entries.26]
text = [
  "Hey, you over there!\\n",
  "Come here for a second.\\c$",
]

[msg.section_0.entries.27]
text = [
  "Don't just loiter around\\n",
  "and cause trouble.$",
]

[msg.section_0.entries.28]
text = [
  "Don't get too wound up.\\c\\n",
  "If you run around, fall, and get hurt,\\n",
  "it'll cause me no end of trouble.$",
]

[msg.section_0.entries.29]
text = [
  "I suppose it's fine if you contact them\\n",
  "once in a while.\\c\\n",
  "I'm sure it'll make your folks happy.$",
]

[msg.section_0.entries.30]
text = [
  "That's all right. You're active--just like\\n",
  "a young person should be.\\c\\n",
  "Do your best!$",
]

[msg.section_0.entries.31]
text = [
  "Do you know people all over the world?\\c\\n",
  "I never would've imagined a world\\n",
  "like this when I was young.$",
]

[msg.section_0.entries.32]
text = [
  "When I was your age, the ladies\\n",
  "used to get worked up over me. Ha ha!$",
]

[msg.section_0.entries.33]
text = [
  "Recently, it looks like there have been\\n",
  "lots of global Trainers like you.$",
]

[msg.section_0.entries.34]
text = [
  "It feels like since you started coming,\\n",
  "Unity Tower has gotten busier.\\c\\n",
  "Keep up the good work!$",
]

[msg.section_0.entries.35]
text = [
  "I'd imagine your Pokédex is getting\\n",
  "pretty full, then?\\c\\n",
  "Well, that's really something.$",
]

[msg.section_0.entries.36]
text = [
  "Unity Tower is as lively as ever\\n",
  "with people who come here to see you.\\c\\n",
  "Well, hope you enjoy yourself today.$",
]

[msg.section_0.entries.37]
text = [
  "How in the world did you manage to trade\\n",
  "with so many different places?$",
]

[msg.section_0.entries.38]
text = [
  "You must know a lot of people in\\n",
  "different places in the world.\\c\\n",
  "Ha ha. Even if you go on a trip, no\\n",
  "worries about not knowing anyone, huh?$",
]

[msg.section_0.entries.39]
text = [
  "I've been a guard for 30 years.\\n",
  "Today, all is well, too.\\l\\n",
  "Mmm... That's great!$",
]

[msg.section_0.entries.40]
text = [
  "I think I'll try buying that new gum\\n",
  "next time.$",
]

[msg.section_0.entries.41]
text = [
  "When I see you, I suddenly feel very\\n",
  "sure that the future will be full of hope.$",
]

[msg.section_0.entries.42]
text = [
  "When you visit, Unity Tower gets exciting!\\c\\n",
  "Think of this place as your own backyard\\n",
  "and feel free to go where you please.$",
]

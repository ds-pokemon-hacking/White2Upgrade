[msg]
trailing_data = "f6f6"

[msg.section_0.entries.0]
text = [
  "N: [SPEED(1)]Thank you, my friend.\\c\\n",
  "Return to the peaceful\\n",
  "life you lived before.[SPEED(0)]\\c$",
]

[msg.section_0.entries.1]
text = [
  "Grunt: Lord N.\\n",
  "Why are you releasing your Pokémon?\\c$",
]

[msg.section_0.entries.2]
text = [
  "N: [SPEED(1)]I can't...\\c\\n",
  "I just can't keep Pokémon\\n",
  "confined in Poké Balls!\\c\\n",
  "Also, if they stay with their Trainers,\\n",
  "Pokémon will battle,\\l\\n",
  "and they will be hurt...\\c\\n",
  "Even if it is for changing the\\n",
  "world to protect Pokémon...\\c\\n",
  "It's too hard for me to put\\n",
  "them through such pain...[SPEED(0)]\\c$",
]

[msg.section_0.entries.3]
text = [
  "Grunt: But...\\c\\n",
  "Ever since we were young,\\n",
  "we've caught Pokémon and\\l\\n",
  "made them battle.\\c\\n",
  "That's just how the world\\n",
  "works, isn't it?\\c$",
]

[msg.section_0.entries.4]
text = [
  "N: [SPEED(1)]Who decided that catching Pokémon\\n",
  "and making them battle each other\\l\\n",
  "is how the world works?\\c\\n",
  "That wasn't how things were\\n",
  "before Poké Balls were invented...\\c\\n",
  "The rules that govern\\n",
  "this world are wrong![SPEED(0)]\\c$",
]

[msg.section_0.entries.5]
text = [
  "Grunt: Th-that's true...\\c\\n",
  "Well, I guess I'll let\\n",
  "my Pokémon go, then.\\c$",
]

[msg.section_0.entries.6]
text = [
  "N: [SPEED(1)]Not yet!\\n",
  "The world hasn't changed yet!\\c\\n",
  "The time to free your Pokémon\\n",
  "will be when I befriend the Unova region's\\l\\n",
  "legendary Dragon-type Pokémon,\\l\\n",
  "surpass the Champion,\\l\\n",
  "and become the hero![SPEED(0)]\\c$",
]

[msg.section_0.entries.7]
text = [
  "N: [SPEED(1)]Not yet!\\n",
  "The world hasn't changed yet!\\c\\n",
  "The time to free your Pokémon\\n",
  "will be when I befriend the Unova region's\\l\\n",
  "legendary Dragon-type Pokémon,\\l\\n",
  "surpass the Champion,\\l\\n",
  "and become the hero![SPEED(0)]\\c$",
]

[msg.section_0.entries.8]
text = [
  "Grunt: Well then, I'll\\n",
  "head to the next destination.\\c$",
]

[msg.section_0.entries.9]
text = [
  "[SPEED(1)]I will separate Pokémon and people, and\\n",
  "black and white will be clearly distinct!\\c\\n",
  "Only then will Pokémon become\\n",
  "perfect beings!\\c\\n",
  "But then why...\\c\\n",
  "Why did those Pokémon\\n",
  "seem so sad to leave me?[SPEED(0)]\\c$",
]

[msg.section_0.entries.10]
text = [
  "[SPEED(1)][VAR TRNAME(0)]!\\c\\n",
  "Is it because of that Trainer\\n",
  "that my heart wavers now?\\c\\n",
  "Were the words of the Pokémon\\n",
  "in Accumula Town really true?\\c\\n",
  "Does that mean [VAR TRNAME(0)]\\n",
  "is an ideal Trainer?[SPEED(0)]\\c$",
]

[msg.section_0.entries.11]
text = [
  "[SPEED(1)]The cries of the suffering\\n",
  "Pokémon filling that room...\\c\\n",
  "The borderline between Pokémon\\n",
  "and humans...\\c\\n",
  "I exist on that line.\\n",
  "I live in the margins between everyone,\\l\\n",
  "so I will save them!\\l\\n",
  "I will change the world!\\c\\n",
  "And to that end, I must\\n",
  "fight to the finish with [VAR TRNAME(0)]![SPEED(0)]\\c$",
]

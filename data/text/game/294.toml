[msg.section_0.entries.0]
text = [
  "Ghetsis: The Giant Chasm!\\c\\n",
  "This is the spot where\\n",
  "Kyurem's power resonates.\\c\\n",
  "Here, Kyurem can use the\\n",
  "full extent of its power\\l\\n",
  "and easily cover all of Unova in ice!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Kyurem, come!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Haaahraaan!$",
]

[msg.section_0.entries.3]
text = [
  "Ghetsis: I have a memory that\\n",
  "has continued to haunt me.\\l\\n",
  "Just one.\\c\\n",
  "That unpleasant look in your eyes\\n",
  "reminds me of it.\\c\\n",
  "That aside, this is my gift to you\\n",
  "to show my respect for making\\l\\n",
  "it this far.\\c\\n",
  "I'll freeze you solid right here\\n",
  "so you can watch my glorious ascent!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Kyurem!\\n",
  "Glaciate!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Haahraa!$",
]

[msg.section_0.entries.6]
text = [
  "[SPEED(1)][COLOR(2)]Zekrom!\\n",
  "Fusion Bolt!![SPEED(0)][COLOR(0)]$",
]

[msg.section_0.entries.7]
text = [
  "[SPEED(1)][COLOR(1)]Reshiram!\\n",
  "Fusion Flare!![COLOR(0)][SPEED(0)]$",
]

[msg.section_0.entries.8]
text = [
  "Ghetsis: So you came...\\c\\n",
  "The freak without a human heart...\\n",
  "N!\\c$",
]

[msg.section_0.entries.9]
text = [
  "N: [SPEED(1)]Zekrom told me\\n",
  "Kyurem is suffering!\\c\\n",
  "I can't allow selfish humans\\n",
  "to make Pokémon suffer!\\c\\n",
  "And I like Unova.\\c\\n",
  "It's the place that taught me\\n",
  "how to live as a human...\\c\\n",
  "It's the place that made me notice the\\n",
  "harmony between Pokémon and humans\\l\\n",
  "living together...\\c\\n",
  "I will protect the Pokémon\\n",
  "and humans who live here![SPEED(0)]\\c$",
]

[msg.section_0.entries.10]
text = [
  "N: [SPEED(1)]Reshiram told me\\n",
  "Kyurem is suffering!\\c\\n",
  "I can't allow selfish humans\\n",
  "to make Pokémon suffer!\\c\\n",
  "And I like Unova.\\c\\n",
  "It's the place that taught me\\n",
  "how to live as a human...\\c\\n",
  "It's the place that made me notice the\\n",
  "harmony between Pokémon and humans\\l\\n",
  "living together...\\c\\n",
  "I will protect the Pokémon\\n",
  "and humans who live here![SPEED(0)]\\c$",
]

[msg.section_0.entries.11]
text = [
  "Bazzazzazzash!$",
]

[msg.section_0.entries.12]
text = [
  "Preeeeaah!$",
]

[msg.section_0.entries.13]
text = [
  "Ghetsis: Excellent!\\n",
  "That was a moving expression\\l\\n",
  "of your determination!\\c\\n",
  "So the education I provided\\n",
  "to make you king wasn't\\l\\n",
  "a complete waste, then!\\c$",
]

[msg.section_0.entries.14]
text = [
  "But I still haven't forgotten that even\\n",
  "though I was kind enough to find you\\l\\n",
  "when you were living in the forest with\\l\\n",
  "Pokémon, and take you in, and care\\l\\n",
  "for you, in the end you were selfish\\l\\n",
  "and disrupted my plans.\\c\\n",
  "I was supposed to use your\\n",
  "abilities to rule Unova!\\c$",
]

[msg.section_0.entries.15]
text = [
  "But I'll forgive you for that as well.\\c\\n",
  "Zekrom, which you were kind enough\\n",
  "to bring with you, can shatter ice!\\c\\n",
  "Now you've saved me the work\\n",
  "of searching for it!\\c\\n",
  "Well, actually, I knew you'd appear\\n",
  "if we fired ice missiles into Opelucid City\\l\\n",
  "and you noticed the change!\\c$",
]

[msg.section_0.entries.16]
text = [
  "But I'll forgive you for that as well.\\c\\n",
  "Reshiram, which you were kind enough\\n",
  "to bring with you, can melt ice!\\c\\n",
  "Now you've saved me the work\\n",
  "of searching for it!\\c\\n",
  "Well, actually, I knew you'd appear\\n",
  "if we fired ice missiles into Opelucid City\\l\\n",
  "and you noticed the change!\\c$",
]

[msg.section_0.entries.17]
text = [
  "N: [SPEED(1)]That's an ugly formula!\\n",
  "It won't work![SPEED(0)]\\c$",
]

[msg.section_0.entries.18]
text = [
  "Ghetsis: Oh, but it will!\\c\\n",
  "If I use these!\\c\\n",
  "The DNA Splicers!\\c$",
]

[msg.section_0.entries.19]
text = [
  "N: [SPEED(1)]?!\\c\\n",
  "Z-Zekrom![SPEED(0)]\\c$",
]

[msg.section_0.entries.20]
text = [
  "N: [SPEED(1)]?!\\c\\n",
  "R-Reshiram!![SPEED(0)]\\c$",
]

[msg.section_0.entries.21]
text = [
  "Kyurem!\\n",
  "Absorb Zekrom!\\l\\n",
  "Use Absofusion!\\c$",
]

[msg.section_0.entries.22]
text = [
  "Kyurem!\\n",
  "Absorb Reshiram!\\l\\n",
  "Use Absofusion!\\c$",
]

[msg.section_0.entries.23]
text = [
  "N: [SPEED(1)]...!\\c\\n",
  "I never would have believed that\\n",
  "Pokémon could fuse together...\\l\\n",
  "That there was a formula like this...[SPEED(0)]\\c$",
]

[msg.section_0.entries.24]
text = [
  "Ghetsis: You fool...\\c\\n",
  "Last time, I was going to use\\n",
  "you to capture people's hearts\\l\\n",
  "and minds to rule them!\\c\\n",
  "But this time, I'm simply going to use\\n",
  "overwhelming power and rule\\l\\n",
  "with an iron fist!\\c\\n",
  "Do you understand?\\n",
  "If you had simply become king,\\l\\n",
  "Unova would have remained beautiful!\\c$",
]

[msg.section_0.entries.25]
text = [
  "Come now, Trainer.\\n",
  "This time no one will save you!\\c\\n",
  "But to make things interesting,\\n",
  "I'll give you a chance.\\c\\n",
  "Let's see if you can stop\\n",
  "THIS Kyurem!\\c$",
]

[msg.section_0.entries.26]
text = [
  "What's this?\\n",
  "Your Poké Balls are trembling.\\c\\n",
  "Could your Pokémon\\n",
  "be shaking with rage?\\c$",
]

[msg.section_0.entries.27]
text = [
  "No!\\n",
  "That's not possible!\\c\\n",
  "Simple tools don't have emotion\\n",
  "or thought!\\c\\n",
  "Come!\\n",
  "Challenge Kyurem!\\c\\n",
  "Just so you know,\\n",
  "catching it is impossible!\\c\\n",
  "My cane emits signals that disrupt\\n",
  "the function of all Poké Balls!\\c$",
]

[msg.section_0.entries.28]
text = [
  "N: [SPEED(1)]It's faint, but I can hear my friend.\\n",
  "I can hear Zekrom's voice.\\l\\n",
  "It says they can be separated again!\\c\\n",
  "I beg you!\\n",
  "Please save my friend!\\c\\n",
  "And all of Unova's\\n",
  "Pokémon and humans...[SPEED(0)]$",
]

[msg.section_0.entries.29]
text = [
  "N: [SPEED(1)]It's faint, but I can hear my friend.\\n",
  "I can hear Reshiram's voice.\\l\\n",
  "It says they can be separated again!\\c\\n",
  "I beg you!\\n",
  "Please save my friend!\\c\\n",
  "And all of Unova's\\n",
  "Pokémon and humans...[SPEED(0)]$",
]

[msg.section_0.entries.30]
text = [
  "Ghetsis: Come now!\\c\\n",
  "I want to see your face at the moment\\n",
  "you lose all hope!\\c\\n",
  "Battle to protect Unova!\\c\\n",
  "I've prepared the finest stage, and\\n",
  "it's wasted on a bit player like you!\\l\\n",
  "Lose and go down in flames!$",
]

[msg.section_0.entries.31]
text = [
  "Bazzakyurom!$",
]

[msg.section_0.entries.32]
text = [
  "Preeeahkyuram!$",
]

[msg.section_0.entries.33]
text = [
  "Bazzash!$",
]

[msg.section_0.entries.34]
text = [
  "Preeeeaah!$",
]

[msg.section_0.entries.35]
text = [
  "Haaahraaan!$",
]

[msg.section_0.entries.36]
text = [
  "Kyurem and Zekrom\\n",
  "were separated!$",
]

[msg.section_0.entries.37]
text = [
  "Kyurem and Reshiram\\n",
  "were separated!$",
]

[msg.section_0.entries.38]
text = [
  "Ghetsis: I can't believe it!\\n",
  "The Black Kyurem I went to\\l\\n",
  "all the trouble of preparing!\\c\\n",
  "How irritating!\\c\\n",
  "Now I have to go recapture\\n",
  "Kyurem, don't I?\\c\\n",
  "But first, I'll take down this disgusting\\n",
  "Trainer with my own hand!\\c\\n",
  "This time I WILL succeed!\\n",
  "No matter what they try,\\l\\n",
  "no one will be able to stop me!\\c$",
]

[msg.section_0.entries.39]
text = [
  "Ghetsis: I can't believe it!\\n",
  "The White Kyurem I went to\\l\\n",
  "all the trouble of preparing!\\c\\n",
  "How irritating!\\c\\n",
  "Now I have to go recapture\\n",
  "Kyurem, don't I?\\c\\n",
  "But first, I'll take down this disgusting\\n",
  "Trainer with my own hand!\\c\\n",
  "This time I WILL succeed!\\n",
  "No matter what they try,\\l\\n",
  "no one will be able to stop me!\\c$",
]

[msg.section_0.entries.40]
text = [
  "Ghetsis: I'll take down this\\n",
  "disgusting Trainer with my own hand!\\c\\n",
  "This time I WILL succeed!\\n",
  "No matter what they try,\\l\\n",
  "no one will be able to stop me!\\c$",
]

[msg.section_0.entries.41]
text = [
  "Ghetsis: I'll take down this\\n",
  "disgusting Trainer with my own hand!\\c\\n",
  "This time I WILL succeed!\\n",
  "No matter what they try,\\l\\n",
  "no one will be able to stop me!\\c$",
]

[msg.section_0.entries.42]
text = [
  "N: [SPEED(1)]...![SPEED(0)]\\c$",
]

[msg.section_0.entries.43]
text = [
  "Ghetsis: How can this be?\\c\\n",
  "I'm the creator of Team Plasma!\\n",
  "I'm perfect!\\c\\n",
  "I'm the absolute ruler\\n",
  "who will change the world!\\c\\n",
  "And I've lost to some unknown\\n",
  "Trainer not once, but TWICE?!\\c$",
]

[msg.section_0.entries.44]
text = [
  "I can't accept this!\\n",
  "This isn't possible!\\c\\n",
  "I can't be bested by\\n",
  "fools who can't even\\l\\n",
  "use Pokémon correctly!\\c$",
]

[msg.section_0.entries.45]
text = [
  "N: [SPEED(1)]It's hard to call you this, but...\\c\\n",
  "Father!\\n",
  "Please understand.\\c\\n",
  "Pokémon are not tools.\\c\\n",
  "Pokémon and humans take\\n",
  "each other to greater heights.\\l\\n",
  "They are our wonderful partners.\\c\\n",
  "Some humans understand this.\\c\\n",
  "Why can't you?[SPEED(0)]\\c$",
]

[msg.section_0.entries.46]
text = [
  "Ghetsis: Shut your mouth!\\c\\n",
  "Shut up! Shut up! Shut UP!\\c\\n",
  "Don't talk like a person, you freak!\\n",
  "No real person could talk to Pokémon!\\c$",
]

[msg.section_0.entries.47]
text = [
  "Shadow Triad: Lord Ghetsis has...\\n",
  "lost control...\\c\\n",
  "We'll take it from here...\\c$",
]

[msg.section_0.entries.48]
text = [
  "N: [SPEED(1)]OK...\\c\\n",
  "Without Father,\\n",
  "Team Plasma is...[SPEED(0)]\\c$",
]

[msg.section_0.entries.49]
text = [
  "Shadow Triad: Farewell...\\c$",
]

[msg.section_0.entries.50]
text = [
  "N: [SPEED(1)]On behalf of everyone...\\c\\n",
  "Thank you.\\c\\n",
  "Kyurem is fine.\\c\\n",
  "Now, it has lost its power,\\n",
  "but it will come here again.[SPEED(0)]\\c$",
]

[msg.section_0.entries.51]
text = [
  "Bazzash!$",
]

[msg.section_0.entries.52]
text = [
  "Preeeeaah!$",
]

[msg.section_0.entries.53]
text = [
  "N: [SPEED(1)]Zekrom says thank you as well!\\c\\n",
  "That's right...\\n",
  "I can talk with Pokémon.[SPEED(0)]\\c$",
]

[msg.section_0.entries.54]
text = [
  "N: [SPEED(1)]Reshiram says thank you as well!\\c\\n",
  "That's right...\\n",
  "I can talk with Pokémon.[SPEED(0)]\\c$",
]

[msg.section_0.entries.55]
text = [
  "[SPEED(1)]On that day two years ago, a certain\\n",
  "Trainer and Alder taught me something...\\c\\n",
  "By accepting different ideas, this world\\n",
  "creates a chemical reaction...\\c\\n",
  "So I met many different Pokémon\\n",
  "and people and heard so much...\\c\\n",
  "And that's how my world\\n",
  "quietly grew bigger...[SPEED(0)]\\c$",
]

[msg.section_0.entries.56]
text = [
  "[SPEED(1)]On that day two years ago, [VAR TRNAME(1)]\\n",
  "and Alder taught me something...\\c\\n",
  "By accepting different ideas, this world\\n",
  "creates a chemical reaction...\\c\\n",
  "So I met many different Pokémon\\n",
  "and people and heard so much...\\c\\n",
  "And that's how my world\\n",
  "quietly grew bigger...[SPEED(0)]\\c$",
]

[msg.section_0.entries.57]
text = [
  "[SPEED(1)]By being with Pokémon, humans\\n",
  "can continue toward new horizons.\\c\\n",
  "By being with humans, Pokémon\\n",
  "can exhibit their true power.\\c\\n",
  "That's what Zekrom taught me:\\n",
  "the ideal for Pokémon and me.\\c\\n",
  "And someday both ideals and truth\\n",
  "will come together...\\c\\n",
  "Then Pokémon and humans will be\\n",
  "free from the oppression of Poké Balls.[SPEED(0)]\\c$",
]

[msg.section_0.entries.58]
text = [
  "[SPEED(1)]By being with Pokémon, humans\\n",
  "can continue toward new horizons.\\c\\n",
  "By being with humans, Pokémon\\n",
  "can exhibit their true power.\\c\\n",
  "That's what Reshiram taught me:\\n",
  "the truth for Pokémon and me.\\c\\n",
  "And someday both truth and ideals\\n",
  "will come together...\\c\\n",
  "Then Pokémon and humans will be\\n",
  "free from the oppression of Poké Balls.[SPEED(0)]\\c$",
]

[msg.section_0.entries.59]
text = [
  "[SPEED(1)]You!\\c\\n",
  "What are you and your Pokémon\\n",
  "striving for?\\c\\n",
  "You should head to the Pokémon League\\n",
  "and put your ideals to the test![SPEED(0)]\\c$",
]

[msg.section_0.entries.60]
text = [
  "[SPEED(1)]You!\\c\\n",
  "What are you and your Pokémon\\n",
  "striving for?\\c\\n",
  "You should head to the Pokémon League\\n",
  "and put your truths to the test![SPEED(0)]\\c$",
]

[msg.section_0.entries.61]
text = [
  "Haaahraaan!$",
]

[msg.section_0.entries.62]
text = [
  "Kyurem vanished into the darkness\\n",
  "of the cave...$",
]

[msg.section_0.entries.63]
text = [
  "It's the cane Ghetsis was holding.\\c\\n",
  "Was he controlling Kyurem with it?$",
]

[msg.section_0.entries.64]
text = [
  "Cheren: [VAR TRNAME(0)]!\\n",
  "That was Kyurem just now, right?\\c\\n",
  "So that's the legendary Pokémon\\n",
  "Team Plasma, or should I say Ghetsis,\\l\\n",
  "was using...\\c$",
]

[msg.section_0.entries.65]
text = [
  "Bianca: [VAR TRNAME(0)], you're amazing!\\n",
  "You've met so many Pokémon!\\c$",
]

[msg.section_0.entries.66]
text = [
  "Hey now! Your Pokédex should be\\n",
  "pretty full, right?\\c\\n",
  "I'm sure Professor Juniper will\\n",
  "be really happy if you show her!\\c$",
]

[msg.section_0.entries.67]
text = [
  "You showed Professor Juniper\\n",
  "your Pokédex, didn't you?\\c\\n",
  "She told me about how\\n",
  "happy she was!\\c$",
]

[msg.section_0.entries.68]
text = [
  "Cheren: I'm sure she was!\\c\\n",
  "In Unova, actually in the whole world,\\n",
  "there are still many Pokémon\\l\\n",
  "that are waiting to meet you, though!\\c$",
]

[msg.section_0.entries.69]
text = [
  "Bianca: Still...\\n",
  "How many Pokémon\\l\\n",
  "could there be in all?\\c\\n",
  "I think I'll go back to Nuvema Town\\n",
  "and ask Professor Juniper!\\c$",
]

[msg.section_0.entries.70]
text = [
  "Team Plasma's ship flew away...\\n",
  "Is it over?$",
]

[msg.section_0.entries.71]
text = [
  "I see...\\n",
  "So it's finally over.\\c\\n",
  "More importantly, you rescued\\n",
  "Kyurem from Team Plasma, right?\\l\\n",
  "You're really something!\\c$",
]

[msg.section_0.entries.72]
text = [
  "I suppose... You have to be the one\\n",
  "who decides when it's over.\\c\\n",
  "More importantly, you rescued\\n",
  "Kyurem from Team Plasma, right?\\l\\n",
  "You're really something!\\c$",
]

[msg.section_0.entries.73]
text = [
  "I'm...gonna make sure Purrloin\\n",
  "gets back to my sister!\\c\\n",
  "Still can't take it out of\\n",
  "the Poké Ball yet, though...\\c$",
]

[msg.section_0.entries.74]
text = [
  "What are you gonna do?\\c\\n",
  "...\\n",
  "...\\c\\n",
  "He said go to the Pokémon League?\\n",
  "That's a good idea!\\c\\n",
  "I mean, now you're the\\n",
  "strongest in Unova, right?\\l\\n",
  "Go prove it!\\c$",
]

[msg.section_0.entries.75]
text = [
  "Do you remember where we first\\n",
  "met up in the Giant Chasm?\\c\\n",
  "If you follow the path from there,\\n",
  "it goes out onto Route 23.\\c\\n",
  "Victory Road and the Pokémon League\\n",
  "are just past there!$",
]

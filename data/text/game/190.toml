[msg]
trailing_data = "6c6c"

[msg.section_0.entries.0]
text = [
  "Sup! Here already, huh?\\c\\n",
  "You look strong!\\n",
  "Shoots! Let's start!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Marlon: You don't just look\\n",
  "strong, you're strong fo' reals!\\c\\n",
  "Eh, I was swept away, too!\\c\\n",
  "Oh yeah, yo. I was so surprised that\\n",
  "I forgot! I gotta give this to you!\\c$",
]

[msg.section_0.entries.2]
text = [
  "[VAR TRNAME(0)] received the Wave Badge\\n",
  "from Marlon!\\c$",
]

[msg.section_0.entries.3]
text = [
  "That's the Wave Badge,\\n",
  "the Unova region's new\\l\\n",
  "Gym Badge! Pretty sweet, right?\\c\\n",
  "Now you got all eight Badges,\\n",
  "so you can be tight with any Pokémon!\\c\\n",
  "Oh yeah, got a TM for you, too!\\c$",
]

[msg.section_0.entries.4]
text = [
  "So Scald sometimes burns\\n",
  "the target, 'K.\\c\\n",
  "Oh, and you can even use\\n",
  "it when you're all frozen and\\l\\n",
  "chillin' and stuff!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Shoots! I'm off then!\\n",
  "Hope it's useful!\\c$",
]

[msg.section_0.entries.6]
text = [
  "Uihaa!$",
]

[msg.section_0.entries.7]
text = [
  "Waves can be rough or calm,\\n",
  "but it's still the same sea!\\c\\n",
  "Eh, there're lots of ways\\n",
  "to look at the same thing!$",
]

[msg.section_0.entries.8]
text = [
  "If you're looking for the Gym Leader,\\n",
  "he went swimming off into the ocean\\l\\n",
  "yelling about the sea!\\c\\n",
  "Please look for him if you'd like.$",
]

[msg.section_0.entries.9]
text = [
  "This Gym may feel like a resort,\\n",
  "but the Gym Leader's no picnic!\\c\\n",
  "This is a present from me.\\n",
  "Please focus and prepare!\\c$",
]

[msg.section_0.entries.10]
text = [
  "In Humilau's Pokémon Gym,\\n",
  "you proceed by hopping on the lily pads\\l\\n",
  "and sliding across the water's surface.\\c\\n",
  "Here's another piece of advice!\\c\\n",
  "Water-type Pokémon really don't\\n",
  "like Electric- or Grass-type moves!\\c\\n",
  "But I'm sure the Gym Leader\\n",
  "has planned for that!$",
]

[msg.section_0.entries.11]
text = [
  "Marlon's swimming around, isn't he...$",
]

[msg.section_0.entries.12]
text = [
  "Humilau City Pokémon Gym\\c\\n",
  "Gym Leader: Marlon\\n",
  "Certified Trainers:\\l\\n",
  "[VAR TRNAME(1)]$",
]


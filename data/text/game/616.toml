[msg.section_0.entries.6]
text = [
  "Ah, it's you!\\c\\n",
  "We were raising your Pokémon,\\n",
  "and my goodness, were we surprised!\\c\\n",
  "Your Pokémon was holding an Egg!\\c\\n",
  "We don't know how it got there,\\n",
  "but your Pokémon had it.\\c\\n",
  "You do want it, don't you?$",
]

[msg.section_0.entries.7]
text = [
  "[VAR TRNAME(0)] received the Egg from\\n",
  "the Day-Care Man.$",
]

[msg.section_0.entries.8]
text = [
  "You take good care of it.$",
]

[msg.section_0.entries.9]
text = [
  "You have no room for it right now...\\n",
  "Come back when you've made room.$",
]

[msg.section_0.entries.10]
text = [
  "I really will keep it.\\n",
  "You do want this Egg, yes?$",
]

[msg.section_0.entries.11]
text = [
  "Well then, I'll hang on to it.\\n",
  "Thanks!$",
]

[msg.section_0.entries.12]
text = [
  "I'm the Day-Care Lady.\\n",
  "We can raise Pokémon for you.\\c\\n",
  "Would you like us to raise\\n",
  "your Pokémon?$",
]

[msg.section_0.entries.13]
text = [
  "I'm the Day-Care Lady.\\c\\n",
  "We can raise Pokémon for you.\\n",
  "What do you want to do today?$",
]

[msg.section_0.entries.14]
text = [
  "Very good.\\n",
  "Come again.$",
]

[msg.section_0.entries.15]
text = [
  "Ah, there you are!\\n",
  "My husband was looking for you.$",
]

[msg.section_0.entries.16]
text = [
  "You can't leave your only Pokémon\\n",
  "with me! How would you battle?\\c\\n",
  "Come back another time.$",
]

[msg.section_0.entries.17]
text = [
  "Which Pokémon should we raise\\n",
  "for you?\\c$",
]

[msg.section_0.entries.18]
text = [
  "Now, now.\\n",
  "That is merely an Egg!$",
]

[msg.section_0.entries.19]
text = [
  "Fine, we'll raise your [VAR PKNICK(0)]\\n",

[msg.section_0.entries.0]
text = [
  "I love Tympole more than anyone!\\n",
  "I'm a Tympole fanatic!\\c\\n",
  "If I just had one more Tympole,\\n",
  "they would sing together!\\c\\n",
  "If you have a Tympole with you,\\n",
  "would you show it to me?$",
]

[msg.section_0.entries.1]
text = [
  "Thanks!\\n",
  "Could you show me a Tympole, then?$",
]

[msg.section_0.entries.2]
text = [
  "OK... Can't do anything about that!\\c\\n",
  "If you catch a Tympole,\\n",
  "show it to me!\\l\\n",
  "I'll let you hear a great song!$",
]

[msg.section_0.entries.3]
text = [
  "That's not a Tympole, is it?\\n",
  "Too bad!$",
]

[msg.section_0.entries.4]
text = [
  "I'm Tympole-xcited!!!\\c\\n",
  "Finally!\\n",
  "I have six Tympole in one place!\\c\\n",
  "OK, Tympole!\\n",
  "Show us those cute,\\l\\n",
  "lovely voices of yours!$",
]

[msg.section_0.entries.5]
text = [
  "Aaaah! That was a wonderful choir!\\c\\n",
  "My love for Tympole\\n",
  "just gets deeper and deeper!\\c\\n",
  "If it wasn't for you,\\n",
  "I never would've heard that song!\\l\\n",
  "Really, seriously, thanks!\\c\\n",
  "If you want to hear the Tympole's\\n",
  "Tympole song again sometime,\\l\\n",
  "bring a Tympole back to me, OK?$",
]

[msg.section_0.entries.6]
text = [
  "Hmm? Would you like to hear\\n",
  "the cute, lovely voices of Tympole?$",
]

[msg.section_0.entries.7]
text = [
  "Come on, Tympole!\\n",
  "Let's hear that harmony!$",
]

[msg.section_0.entries.8]
text = [
  "Oh my! Aren't Tympole just the cutest?\\c\\n",
  "No matter how many times I hear\\n",
  "that song, it gets me right here!\\c\\n",
  "My love for Tympole gets\\n",
  "deeper and deeper!$",
]

[msg.section_0.entries.9]
text = [
  "Pi pi kiii!$",
]

[msg.section_0.entries.10]

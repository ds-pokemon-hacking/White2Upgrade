[msg.section_0.entries.4]
text = [
  "Silvia: Ommm...\\c\\n",
  "Oh! I'm sorry! I was sunbathing, and my\\n",
  "mind went blank, like I was meditating...\\l\\n",
  "Ommm...\\c\\n",
  "Isn't the weather great?\\n",
  "Would you like to “om\\\" with me?$",
]

[msg.section_0.entries.5]
text = [
  "Silvia: W-wow! Did you see that?\\c\\n",
  "That lazybones store owner put\\n",
  "new items in the shop!\\l\\n",
  "He's had the same old stuff\\l\\n",
  "on display forever!\\c\\n",
  "Hmmm...\\c\\n",
  "It's fine as long as it doesn't\\n",
  "rain, I guess.$",
]

[msg.section_0.entries.6]
text = [
  "Silvia: While I was just standing around\\n",
  "and watching Pokémon play,\\l\\n",
  "I started to feel so happy and peaceful!\\c\\n",
  "I hope tomorrow is a pleasant\\n",
  "day just like today!$",
]


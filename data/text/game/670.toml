[msg.section_0.entries.104]
text = [
  "Rosaline: Oh no! This is no good at all...\\n",
  "Every day, I just nap away,\\l\\n",
  "and now I'm really rusty!\\c\\n",
  "OK! OK! I'm going to get back\\n",
  "into fighting shape by training\\l\\n",
  "in the White Treehollow!$",
]

[msg.section_0.entries.105]
text = [
  "Rosaline: I'm also taking on the\\n",
  "White Treehollow!\\c\\n",
  "There are nothing but strange\\n",
  "Trainers inside!\\c\\n",
  "But everyone in there\\n",
  "is really tough!$",
]

[msg.section_0.entries.106]
text = [
  "Rosaline: I went back to basics and\\n",
  "was training at the White Treehollow.\\c\\n",
  "It made me remember the simple\\n",
  "joys of Pokémon battling, the way\\l\\n",
  "I felt when I'd just started my journey.\\c\\n",
  "[VAR TRNAME(0)], did you find anything\\n",
  "important when you were battling there?$",
]


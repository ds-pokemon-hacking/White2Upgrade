[msg.section_0.entries.16]
text = [
  "Robbie: My big brother is working\\n",
  "in the shop, but he thinks putting\\l\\n",
  "new goods out is too much trouble.\\c\\n",
  "So go explore a hollow or something,\\n",
  "and check back later.$",
]

[msg.section_0.entries.17]
text = [
  "Robbie: Amazing! My brother\\n",
  "finally put some new items\\l\\n",
  "in the shop he's working at.\\c\\n",
  "He's the type who can do\\n",
  "anything if he wants to!$",
]

[msg.section_0.entries.18]
text = [
  "Robbie: My brother is just\\n",
  "raring to go lately!\\c\\n",
  "He keeps putting all sorts of\\n",
  "new products in the store!\\c\\n",
  "He said he was inspired by a\\n",
  "Trainer named [VAR TRNAME(0)]\\l\\n",
  "who became the best Trainer\\l\\n",
  "in the White Treehollow!$",
]


[msg.section_0.entries.24]
text = [
  "Ryder: Recently in Unova's Challenge--\\n",
  "the White Treehollow--\\l\\n",
  "talented Trainers are falling\\l\\n",
  "one after another.\\c\\n",
  "Apparently, a Trainer named\\n",
  "[VAR TRNAME(0)] is on a rampage.\\c\\n",
  "That's not you, is it? I want to have\\n",
  "a match with that Trainer sometime.$",
]

[msg.section_0.entries.25]
text = [
  "Ryder: You're [VAR TRNAME(0)]?!\\n",
  "You're the best in the White Treehollow!\\c\\n",
  "That's incredible. I'm still\\n",
  "having problems with the first area...\\c\\n",
  "Give me some tips later, all right?$",
]


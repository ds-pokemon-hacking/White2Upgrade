[msg.section_0.entries.48]
text = [
  "Carlos: In White Forest, everyone\\n",
  "shares the gathered Berries.\\c\\n",
  "I picked some extra ones\\n",
  "for the older folks.$",
]

[msg.section_0.entries.49]
text = [
  "Carlos: Living here every day,\\n",
  "eating Berries, makes me miss\\l\\n",
  "the exciting and exotic food\\l\\n",
  "you can get in the city sometimes.\\c\\n",
  "Maybe it's time again to go on\\n",
  "a quest for delicious food.\\l\\n",
  "It's been a while.$",
]

[msg.section_0.entries.50]
text = [
  "Carlos: When I went to the shop\\n",
  "to prepare for my trip,\\l\\n",
  "I noticed the selection\\l\\n",
  "of items has gotten much better.\\c\\n",
  "But the guy in the shop was saying\\n",
  "he can't lose to [VAR TRNAME(0)].\\l\\n",
  "What could he have been talking about?$",
]


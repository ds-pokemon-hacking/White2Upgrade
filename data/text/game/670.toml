[msg.section_0.entries.76]
text = [
  "Miho: Waah! I'm so bored!\\c\\n",
  "I just got here, but I can't\\n",
  "handle living like this\\l\\n",
  "where there's nothing to do!\\c\\n",
  "I miss the neon so much!$",
]

[msg.section_0.entries.77]
text = [
  "Miho: Since I've moved here,\\n",
  "my skin has become so smooth!\\c\\n",
  "I wonder if it's because I'm\\n",
  "eating fresh-picked Berries every day.\\c\\n",
  "Nature is so amazing!\\n",
  "Hooray for nature!$",
]

[msg.section_0.entries.78]
text = [
  "Miho: Lying on my back in a meadow\\n",
  "and idly watching the sun sink\\l\\n",
  "behind the trees...\\c\\n",
  "It's these simple, ordinary things\\n",
  "that are the most fun in this place!\\l\\n",
  "The people here taught me that!$",
]


[msg.section_0.entries.68]
text = [
  "Gene: A hollow has suddenly appeared in\\n",
  "the white tree! That tree is really\\l\\n",
  "important to us here in White Forest!\\c\\n",
  "Investigators and Trainers\\n",
  "have come out of the woodwork,\\l\\n",
  "but we locals will be the ones\\l\\n",
  "who make it to the lowest floor!$",
]

[msg.section_0.entries.69]
text = [
  "Gene: Hey, [VAR TRNAME(0)]!\\c\\n",
  "I heard the news!\\n",
  "You made it really deep\\l\\n",
  "into the hollow, didn't you?\\c\\n",
  "Hurry and get to the lowest level\\n",
  "for me--I'm about to give up!$",
]

[msg.section_0.entries.70]
text = [
  "Gene: On behalf of everyone in the\\n",
  "forest, I want to congratulate you\\l\\n",
  "on becoming the top Trainer of\\l\\n",
  "the White Treehollow!\\c\\n",
  "Congratulations!\\n",
  "That was a major accomplishment!$",
]


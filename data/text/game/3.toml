[msg.section_0.entries.28]
text = [
  "Karenna: I heard strong people gather\\n",
  "to train somewhere around here,\\l\\n",
  "so I brought my Pokémon!\\c\\n",
  "You're a Trainer too, right?\\n",
  "Let's cheer each other on!$",
]

[msg.section_0.entries.29]
text = [
  "Karenna: You're [VAR TRNAME(0)], right?\\c\\n",
  "It sounds like you've conquered\\n",
  "a lot of the Black Tower!\\l\\n",
  "I won't lose either!$",
]

[msg.section_0.entries.30]
text = [
  "Karenna: Congratulations on clearing\\n",

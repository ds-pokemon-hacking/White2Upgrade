[msg.section_0.entries.112]
text = [
  "Emi: When I'm not at my part-time job,\\n",
  "I make piles of prize money by\\l\\n",
  "battling in the Black Tower!\\c\\n",
  "I'm glad I came here.\\n",
  "I like quiet places, but...\\c\\n",
  "I couldn't make money like\\n",
  "this in White Forest.$",
]

[msg.section_0.entries.113]
text = [
  "Emi: I hear you made it pretty\\n",
  "far up in the Black Tower?\\c\\n",
  "That's really amazing!\\n",
  "I couldn't get past the first area!\\c\\n",
  "Still, I can make a lot of money\\n",
  "there, so I don't really mind.$",
]

[msg.section_0.entries.114]
text = [
  "Emi: Even if I'm making good money,\\n",
  "I've never lived in the same place\\l\\n",
  "for this long before...\\c\\n",
  "I've met a lot of people and\\n",
  "found some shops I really like.\\c\\n",
  "But it's about time for me to leave.\\n",
  "Maybe it would be nice to go to\\l\\n",
  "White Forest and relax for a while.$",
]


[msg.section_0.entries.96]
text = [
  "Ken: Unova's Challenge...\\c\\n",
  "Trainers come from all over the\\n",
  "world to challenge the Black Tower.\\c\\n",
  "Are you taking it on too, [VAR TRNAME(0)]?\\c\\n",
  "A difficult battle lies ahead!\\n",
  "Take some amazing Pokémon with you!$",
]

[msg.section_0.entries.97]
text = [
  "Ken: I heard about your exploits in\\n",
  "Unova's Challenge, the Black Tower!\\c\\n",
  "But don't get cocky!\\n",
  "The higher the area,\\l\\n",
  "the odder the Trainers get...\\c\\n",
  "Well, that was my experience anyway.\\n",
  "Do your best and aim for the top!$",
]

[msg.section_0.entries.98]
text = [
  "Ken: You finally overcame Unova's\\n",
  "Challenge, the Black Tower!\\c\\n",
  "[VAR TRNAME(0)]...\\n",
  "You are truly amazing!\\c\\n",
  "I've tried many times myself,\\n",
  "but I failed every time,\\l\\n",
  "and before long, I gave up.\\c\\n",
  "I respect you for believing in\\n",
  "your Pokémon and yourself!$",
]


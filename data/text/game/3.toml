[msg.section_0.entries.72]
text = [
  "Piper: I managed to get a job at one\\n",
  "of the best companies in Black City,\\l\\n",
  "which is full of amazing businesses!\\c\\n",
  "I'm going to work really hard\\n",
  "and move up through the ranks!$",
]

[msg.section_0.entries.73]
text = [
  "Piper: I can't take it! I'm done!\\n",
  "Waaah!\\c\\n",
  "Sigh... I keep making mistakes at work,\\n",
  "I got dumped...\\c\\n",
  "I want to run away to White Forest\\n",
  "and relax in the woods with Pokémon.$",
]

[msg.section_0.entries.74]
text = [
  "Piper: The other day, I solved\\n",
  "a big problem at work!\\l\\n",
  "Everyone complimented me! ♪\\c\\n",
  "A lot has happened recently,\\n",
  "but I'm glad I stuck with my job!\\c\\n",
  "I'll keep making money\\n",
  "here in Black City!$",
]


[msg.section_0.entries.40]
text = [
  "Marie: I came to Black City\\n",
  "to write my thesis.\\c\\n",
  "The theme of my research is\\n",
  "Pokémon that live in cities.\\c\\n",
  "I came to research the soothing\\n",
  "effect Pokémon have on tired\\l\\n",
  "urban dwellers!$",
]

[msg.section_0.entries.41]
text = [
  "Marie: I've finally organized\\n",
  "the research I've been\\l\\n",
  "doing in Black City!\\c\\n",
  "I knew the best way to relieve\\n",
  "stress is to interact with Pokémon,\\l\\n",
  "even in the big city!$",
]


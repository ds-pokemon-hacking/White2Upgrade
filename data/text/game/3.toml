[msg.section_0.entries.8]
text = [
  "Dave: People who've got it goin' on\\n",
  "always get what they want!\\c\\n",
  "If there's a Pokémon you want\\n",
  "to catch, keep on goin' on!\\c\\n",
  "You gotta get whatcha want\\n",
  "the right way--honestly and thoroughly!$",
]

[msg.section_0.entries.9]
text = [
  "Dave: There's a shop where those\\n",
  "who've got it goin' on go.\\c\\n",
  "I heard they got some\\n",
  "new items in recently.$",
]

[msg.section_0.entries.10]
text = [
  "Dave: Used to be a lot of thugs\\n",
  "hangin' around here looking for cash.\\l\\n",
  "I drove most of them off!\\c\\n",
  "Yeah! That's right! Black City\\n",
  "got its peace on all because of me!$",
]


[msg.section_0.entries.92]
text = [
  "Collin: There's something I want,\\n",
  "but it is never in stock at the shops.\\c\\n",
  "The guy at one of the shops said they\\n",
  "would have it in stock soon.\\l\\n",
  "But I just can't wait!$",
]

[msg.section_0.entries.93]
text = [
  "Collin: Have you been to the shop?\\n",
  "They got a new item in stock!\\c\\n",
  "But it's still not the item I want...\\c\\n",
  "If I don't get my hands on it soon,\\n",
  "I'm going to be in a lot of trouble!$",
]

[msg.section_0.entries.94]
text = [
  "Collin: They finally got\\n",
  "what I wanted in stock!\\l\\n",
  "I've waited so long for this!\\c\\n",
  "...Huh? What did I want?\\c\\n",
  "That's kind of a nosy question!\\n",
  "I'll never tell you!$",
]


[msg.section_0.entries.0]
text = [
  "My flaky fortune-telling says that\\n",
  "you'll meet a Pokémon!$",
]

[msg.section_0.entries.1]
text = [
  "Going to the next town was a big\\n",
  "adventure when I was a kid!\\c\\n",
  "Oh yeah! Here, I'll give you something\\n",
  "I always used to take with me back then!\\c\\n",
  "Um... Now, where is it?\\n",
  "I'll look for it! Sorry!$",
]

[msg.section_0.entries.2]
text = [
  "Oh! You already have a Gym Badge!\\c\\n",
  "This is a present from me!\\n",
  "I hope it helps you out!\\c$",
]

[msg.section_0.entries.3]
text = [
  "The Ultra Ball is really good.\\n",
  "It performs much better\\l\\n",
  "than a regular Poké Ball!$",
]

[msg.section_0.entries.4]
text = [
  "I wonder if there's a Pokémon that was\\n",
  "dropped on the ground somewhere...$",
]

[msg.section_0.entries.5]
text = [
  "It's the worst when you find the Pokémon\\n",
  "you were looking for and you don't\\l\\n",
  "have any Poké Balls.$",
]

[msg.section_0.entries.0]
text = [
  "Is your Pokémon's HP all right?\\c\\n",
  "If there's room in your Bag,\\n",
  "I'll give you this.\\c\\n",
  "Put it in your Bag's Medicine Case.\\c$",
]

[msg.section_0.entries.1]
text = [
  "When your Pokémon's HP decreases,\\n",
  "they no longer have the energy to fight.\\c\\n",
  "So, don't push your Pokémon too hard,\\n",
  "and let them rest often.$",
]

[msg.section_0.entries.2]
text = [
  "Two years ago, a Trainer from Nuvema\\n",
  "did some amazing things, including\\l\\n",
  "battling Team Plasma and saving Unova!\\c\\n",
  "I was the one who told that Trainer that\\n",
  "wild Pokémon are hiding in the tall grass.\\c\\n",
  "And that you can battle\\n",
  "or capture wild Pokémon there!\\c\\n",
  "So, you could say that I'm one\\n",
  "of the people who saved Unova, too!$",
]

[msg.section_0.entries.3]
text = [
  "Two years ago, [VAR TRNAME(0)], a Trainer\\n",
  "from Nuvema did some amazing things,\\l\\n",
  "including battling Team Plasma\\l\\n",
  "and saving Unova!\\c\\n",
  "I was the one who told that Trainer that\\n",
  "wild Pokémon are hiding in the tall grass.\\c\\n",
  "And that you can battle\\n",
  "or capture wild Pokémon there!\\c\\n",
  "So, you could say that I'm one\\n",
  "of the people who saved Unova, too!$",
]

[msg.section_0.entries.4]
text = [
  "I'd like to land all of the\\n",
  "Pokémon beyond here, too!$",
]

[msg.section_0.entries.5]
text = [
  "Route 1$",
]

[msg.section_0.entries.6]
text = [
  "Route 1$",
]

[msg.section_0.entries.7]
text = [
  "Trainer Tips!\\c\\n",
  "\\n",
  "Make an effort to talk to all the\\n",
  "people you meet during your journey!\\c\\n",
  "Chances are they will have something\\n",
  "useful to tell you.$",
]

[msg.section_0.entries.8]
text = [
  "Bianca: Heeey!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Bianca: Hi there!\\c$",
]

[msg.section_0.entries.10]
text = [
  "I have fond memories of this place...\\c$",
]

[msg.section_0.entries.11]
text = [
  "One day...\\c\\n",
  "[VAR TRNAME(1)], Cheren, and I\\n",
  "all gathered right here and took\\l\\n",
  "the first step of our adventure.\\c\\n",
  "It's a very special spot.\\c$",
]

[msg.section_0.entries.12]
text = [
  "Bianca: Hey, [VAR TRNAME(1)]!\\c\\n",
  "Let's all take our first step\\n",
  "on Route 1 together!\\c$",
]

[msg.section_0.entries.13]
text = [
  "One, two!\\c$",
]

[msg.section_0.entries.14]
text = [
  "Ha ha! That's what I said.\\c\\n",
  "Hey, while we're here,\\n",
  "have a Pokémon battle with me!\\c\\n",
  "Talking about [VAR TRNAME(1)] put me\\n",
  "in the mood for a Pokémon battle!\\c$",
]

[msg.section_0.entries.15]
text = [
  "Tee-hee! You're so tough!\\n",
  "You're just like [VAR TRNAME(1)]!\\c\\n",
  "OK!\\c\\n",
  "I just have to remember what\\n",
  "I felt like back then and work hard, too!\\c\\n",
  "Thanks!\\n",
  "See you!\\c$",
]

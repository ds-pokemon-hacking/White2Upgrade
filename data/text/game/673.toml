[msg]
trailing_data = "bcbc"

[msg.section_0.entries.0]
text = [
  "Ah...ah...achoo!\\c\\n",
  "I can't stop sneezing.\\n",
  "Spring is here, huh? Blech...\\c\\n",
  "What in the...? You there!\\n",
  "You were just looking at me, right?!\\c\\n",
  "When eyes meet, it's a fight!\\c\\n",
  "...In other words, you just picked\\n",
  "a fight with me, Nimbasa's Feral Liepard!\\c\\n",
  "I hope you've got insurance! Ready?$",
]

[msg.section_0.entries.1]
text = [
  "Harrumph...\\n",
  "You've got guts, I'll give you that.\\c\\n",
  "You're gonna regret this as you go\\n",
  "limping back to the Pokémon Center!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Lame! You're bolting?\\n",
  "What a pathetic excuse for a guy!$",
]

[msg.section_0.entries.3]
text = [
  "Whaa! How could I have lost!\\n",
  "Aaagh! I could just scream!\\c\\n",
  "All right then, let's see\\n",
  "what you're really made of.\\c\\n",
  "We'll ride this old, run-down\\n",
  "Ferris wheel, which puts the “F\\\" in frail.\\c\\n",
  "The first one to get scared loses!\\n",
  "OK. Let's ride!\\c$",
]

[msg.section_0.entries.4]
text = [
  "...\\c\\n",
  "What...\\c\\n",
  "What...\\n",
  "Stop lookin' at me...\\l\\n",
  "...Tsk!\\l\\n",
  "OK! OK! All right already.\\c\\n",
  "I'll let you go this time.\\n",
  "Next time, you're going down!\\c\\n",
  "Don't forget it!$",
]

[msg.section_0.entries.5]
text = [
  "Ah...ah...achoo!\\n",
  "Achoo! Achoo!\\c\\n",
  "Ah, my nose won't stop running!\\c\\n",
  "What?! You there!\\n",
  "You're looking at me again?\\c\\n",
  "Do you need something?\\n",
  "You got a crush on me?\\l\\n",
  "Seriously, just lemme alone!\\c\\n",
  "Aagh! I'm so embarrassed!\\n",
  "Don't bother a sweet, innocent\\l\\n",
  "damsel like me in a moment of weakness!\\c\\n",
  "I owe you for last time, too.\\n",
  "You're gonna pay! You ready? Huh?$",
]

[msg.section_0.entries.6]
text = [
  "Sheesh... You can sure fight.\\n",
  "Next time, you're going down!\\c\\n",
  "I'm going to crush you!\\n",
  "Crush, crush, crush you!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Huh? What?! You're running?\\n",
  "I can't believe you'd stoop to that!$",
]

[msg.section_0.entries.8]
text = [
  "Oh, man... Again...\\c\\n",
  "This is awful!\\c\\n",
  "I seriously can't take any more\\n",
  "of these tests of courage.\\c\\n",
  "Oh! Whoa, whoa, whoa!\\n",
  "Over there! It's my hoodlum hero!\\c\\n",
  "It's the living legend of larceny,\\n",
  "the one who once took down an entire\\l\\n",
  "group of Conkeldurr, the Foongus!\\c\\n",
  "I can't go talk to the Foongus\\n",
  "after losing to a brat like you!\\c\\n",
  "All right! There's no other option!\\n",
  "I'm a woman! Show me your worst!\\c\\n",
  "You! It's on!\\n",
  "Get on that Ferris wheel!\\c\\n",
  "I ain't getting scared this time!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Aaarrrgh... That's seriously annoying.\\n",
  "At least the Foongus is long gone.\\c\\n",
  "I got away without my\\n",
  "lameness being seen.\\c\\n",
  "But, either way, I lost!\\n",
  "Tch.\\c\\n",
  "You!\\n",
  "I've had it! I admit I lost!\\c\\n",
  "You're Nimbasa's Feral Liepard now!\\n",
  "But don't you dare tell the Foongus\\l\\n",
  "about what happened today!\\c\\n",
  "Don't think I've forgiven you, either!\\c\\n",
  "Someday, I'm gonna make you bawl!\\n",
  "Never forget that! Seriously!$",
]

[msg.section_0.entries.10]
text = [
  "Yawn. Every day, I'm sure sleepy.\\n",
  "Hey, what are you looking at me for?\\c\\n",
  "Could you be a fan of mine?\\c\\n",
  "I'm sorry, but today's my first\\n",
  "day off in some time.\\c\\n",
  "Could you leave me alone?\\c\\n",
  "Well, I guess I could have a\\n",
  "battle with you. Would that be enough?$",
]

[msg.section_0.entries.11]
text = [
  "Thanks for understanding!\\n",
  "It's nice to have such great fans.\\c\\n",
  "Let me introduce my beloved Pokémon!\\c$",
]

[msg.section_0.entries.12]
text = [
  "OK. You don't need one!\\n",
  "See you then!$",
]

[msg.section_0.entries.13]
text = [
  "Er, [VAR TRNAME(0)]? Did I get that right?\\c\\n",
  "You rocked the house!\\c\\n",
  "Sorry about the mistake!\\n",
  "So you're not a fan of mine?\\c\\n",
  "Man... Dirk and the Darumakas still\\n",
  "have a ways to go then...\\c\\n",
  "Well, whatever. Since we're here,\\n",
  "let's go and ride the Ferris wheel!\\c$",
]

[msg.section_0.entries.14]
text = [
  "Wh-what?\\c\\n",
  "Why are you asking if something's wrong?\\c\\n",
  "I'm OK! I'm OK!\\n",
  "This just reminded me of a good memory.\\c\\n",
  "Anyway, thanks, [VAR TRNAME(0)].\\c\\n",
  "I had a nice time on a rare day off,\\n",
  "and it's all thanks to you.\\c\\n",
  "If I get another day off,\\n",
  "I might stop by again.\\c\\n",
  "See ya, [VAR TRNAME(0)]!$",
]

[msg.section_0.entries.15]
text = [
  "Hey! If it isn't [VAR TRNAME(0)]!\\n",
  "How are you and your Pokémon doing?\\c\\n",
  "I've got a show after this,\\n",
  "but I felt like you might be coming,\\l\\n",
  "so I've been passing time here.\\c\\n",
  "Hey, [VAR TRNAME(0)]!\\n",
  "If you've got a little time,\\l\\n",
  "want to hang out for a bit?\\c\\n",
  "Um...for starters,\\n",
  "how about a Pokémon battle?$",
]

[msg.section_0.entries.16]
text = [
  "Oh, seriously? Thanks!\\n",
  "You're awesome!\\c\\n",
  "I'm going to come at you with\\n",
  "everything I've got!\\c\\n",
  "Hit me with your best!\\c$",
]

[msg.section_0.entries.17]
text = [
  "Oh...\\n",
  "Didn't mean to cause trouble.\\c\\n",
  "Well, when you're free,\\n",
  "give me a shout sometime.\\l\\n",
  "See ya, [VAR TRNAME(0)]!$",
]

[msg.section_0.entries.18]
text = [
  "Aww, man... I get it!\\n",
  "You're definitely tough, [VAR TRNAME(0)].\\c\\n",
  "Are you aiming to be the Champion, too?\\n",
  "Uh, sorry about that. It was nothing.\\l\\n",
  "Just talking to myself.\\c\\n",
  "Anyway, let's go ride the Ferris wheel!\\n",
  "The view is really nice and\\l\\n",
  "makes you feel really mellow!\\c$",
]

[msg.section_0.entries.19]
text = [
  "Was it about two years ago?\\c\\n",
  "Right around here I made a\\n",
  "friend at this Ferris wheel.\\c\\n",
  "We'd battle, but I could never win.\\n",
  "It always made me feel like\\l\\n",
  "I had to work harder,\\l\\n",
  "and it really motivated me!\\l\\n",
  "That's why I made my dance team.\\c\\n",
  "Hey, sorry...\\n",
  "I didn't mean to go on about\\l\\n",
  "someone you've never met\\l\\n",
  "while we're hanging out.\\c\\n",
  "But you know what?\\n",
  "Something about you makes me\\l\\n",
  "think about those times...\\c\\n",
  "The fact that you're really\\n",
  "strong is part of it--that's for sure.\\c\\n",
  "All right! Thanks! Let's hang out again!\\n",
  "See ya, [VAR TRNAME(0)]!$",
]

[msg.section_0.entries.20]
text = [
  "Phew... It's so hot every day lately...\\c\\n",
  "Oh, my. What's wrong, dear?\\n",
  "Are you lost?\\l\\n",
  "I guess you're a little old for that.\\c\\n",
  "Well, what do you need, then?\\n",
  "Would you like to have a Pokémon battle?$",
]

[msg.section_0.entries.21]
text = [
  "I specialize in taking care of Pokémon\\n",
  "more than I do battling with them...\\c\\n",
  "Well, why not?\\c\\n",
  "I'm feeling a little down, and it would be\\n",
  "a nice change of pace.\\c$",
]

[msg.section_0.entries.22]
text = [
  "Oh, well.\\n",
  "OK, then. See you.$",
]

[msg.section_0.entries.23]
text = [
  "Wow...\\n",
  "Your Pokémon are sure strong.\\l\\n",
  "I can tell you've raised them with care.\\c\\n",
  "Tee hee. I work at a preschool taking\\n",
  "care of kids and Pokémon, so I can tell\\l\\n",
  "how a Pokémon is feeling!\\c\\n",
  "Well, recently, I've been so tired that it\\n",
  "feels like I'm up to my ears in Pokémon...\\l\\n",
  "But, that's enough of that.\\c\\n",
  "There has to be some reason we met.\\n",
  "Let's spend a little more time together!\\l\\n",
  "C'mon! Come with me!\\c$",
]

[msg.section_0.entries.24]
text = [
  "Hee hee... That was so fun!\\n",
  "You know...\\c\\n",
  "My job is taking care of kids and\\n",
  "Pokémon in place of busy Trainers.\\c\\n",
  "So, for example, if a Pokémon I'm\\n",
  "watching gets hurt while playing,\\l\\n",
  "when the Trainer comes to pick\\l\\n",
  "it up, the Trainer will go after us without\\l\\n",
  "even listening to what happened...\\c\\n",
  "I know you love your Pokémon,\\n",
  "but you're completely different...\\c\\n",
  "When I talk to you, I feel like\\n",
  "Pokémon Trainers are pretty great.\\c\\n",
  "It makes me happy.\\n",
  "Thank you! See you again!$",
]

[msg.section_0.entries.25]
text = [
  "Oh! Hi, [VAR TRNAME(0)]!\\n",
  "How are you? How have you been?\\c\\n",
  "Do you have some time? There's something\\n",
  "I want to talk to you about!$",
]

[msg.section_0.entries.26]
text = [
  "Yay! Thanks, [VAR TRNAME(0)]!\\c\\n",
  "But...\\n",
  "Just talking is a little\\l\\n",
  "boring for you, isn't it?\\c\\n",
  "How about we play a little?\\c\\n",
  "My Pokémon is in pretty\\n",
  "good condition today!\\c$",
]

[msg.section_0.entries.27]
text = [
  "Is that so? That's a shame...\\n",
  "Well, if you have time, let me know!$",
]

[msg.section_0.entries.28]
text = [
  "Boy, that was fun!\\c\\n",
  "I'd love to just play like this\\n",
  "and quit my job...\\c\\n",
  "You know what?\\n",
  "I was watching a Pokémon yesterday,\\l\\n",
  "and I got yelled at by a Trainer.\\c\\n",
  "Hey, [VAR TRNAME(0)].\\c\\n",
  "What do you think about Pokémon\\n",
  "getting hurt battling one another?\\c\\n",
  "I feel like those are important\\n",
  "experiences, but recently I just\\l\\n",
  "don't know anymore.\\c\\n",
  "...Well, there's time to complain later.\\n",
  "Let's ride the Ferris wheel!\\c$",
]

[msg.section_0.entries.29]
text = [
  "Hmm... Summer isn't the best\\n",
  "season to ride this Ferris wheel.\\c\\n",
  "Huh? Are you OK, [VAR TRNAME(0)]?\\c\\n",
  "Your face is as red as a Pansear!\\n",
  "It's OK if you roll up your sleeves,\\l\\n",
  "you know. Don't be embarrassed.\\c\\n",
  "Here, I'll roll up my sleeves, too.\\n",
  "I have to do that a lot at work.\\l\\n",
  "Working with kids is messy, but I love it!\\c\\n",
  "I almost didn't get the job, though.\\n",
  "They were looking for someone with more\\l\\n",
  "experience. But I knew I could do it!\\c\\n",
  "I begged and pleaded, so they said I\\n",
  "could start as a volunteer and learn\\l\\n",
  "the ropes for a while.\\c\\n",
  "I took them up on it!\\n",
  "I wanted this job THAT much.\\c\\n",
  "I guess if I don't try harder,\\n",
  "it will really be a waste.\\c\\n",
  "Hee hee. Thanks, [VAR TRNAME(0)]!\\n",
  "I feel much better about my job now.$",
]

[msg.section_0.entries.30]
text = [
  "Aaaaah! It's sooo hot!\\n",
  "How are you so full\\l\\n",
  "of energy when it's so hot?\\c\\n",
  "What? What's wrong?\\n",
  "Do you want to ride the Ferris wheel?\\c\\n",
  "Or do you want to battle?\\c\\n",
  "I don't care either way,\\n",
  "but I'm not very tough.$",
]

[msg.section_0.entries.31]
text = [
  "Hmmm... I see.\\c\\n",
  "Shall we begin then?\\n",
  "I'm just hanging around anyway.\\c$",
]

[msg.section_0.entries.32]
text = [
  "Oh. I see... Well, be seeing you.\\n",
  "Be careful not to get heatstroke!$",
]

[msg.section_0.entries.33]
text = [
  "See? I'm not very good, right?\\c\\n",
  "Recently, I've been busy with work,\\n",
  "and I don't have time for Pokémon.\\c\\n",
  "Thanks, though.\\n",
  "I actually had fun.\\c\\n",
  "That was a nice way to relieve stress.\\c\\n",
  "I don't know if this is a good way\\n",
  "to say thanks, but I'll treat you\\l\\n",
  "to a Ferris-wheel ride.\\c$",
]

[msg.section_0.entries.34]
text = [
  "How is this Ferris wheel?\\c\\n",
  "There's no air conditioning,\\n",
  "and it's really worn out, right?\\c\\n",
  "Actually, my company is\\n",
  "running this Ferris wheel.\\c\\n",
  "It's old, and customers don't\\n",
  "come anymore.\\c\\n",
  "It's in a secluded place where people\\n",
  "can get into trouble, so\\l\\n",
  "the authorities say it's bad for safety.\\c\\n",
  "For our company, it's just a burden,\\n",
  "and we actually plan to tear it down.\\c\\n",
  "But for the time being, it will stay,\\n",
  "so come again if you have time.$",
]

[msg.section_0.entries.35]
text = [
  "Hey there! How have you been doing?\\c\\n",
  "Truth is, I was waiting for you.\\n",
  "Could you do me a favor\\l\\n",
  "and battle me again?\\c\\n",
  "Then, I'd like to ride the\\n",
  "Ferris wheel again.\\c\\n",
  "The rule is you have to have\\n",
  "two people to ride, and I don't\\l\\n",
  "have anyone to ride with me.\\c$",
]

[msg.section_0.entries.36]
text = [
  "You don't mind?\\n",
  "Thanks.\\c\\n",
  "I thought you'd turn me down\\n",
  "because you might think a\\l\\n",
  "sudden request like this is creepy...\\c\\n",
  "As the one who invited you, maybe I\\n",
  "shouldn't be saying this, but you need\\l\\n",
  "to be a bit more cautious in this world.\\c\\n",
  "...Well, then.\\c\\n",
  "Let's have a Pokémon battle\\n",
  "to start off with.\\c$",
]

[msg.section_0.entries.37]
text = [
  "I see. Well, that's perfectly reasonable.\\c\\n",
  "If you think about it, it's kinda creepy,\\n",
  "making such a sudden request.\\c\\n",
  "But, anyway, let me know if you change\\n",
  "your mind.$",
]

[msg.section_0.entries.38]
text = [
  "Hmm. I thought I might lose...\\n",
  "Well, that's OK. I'm not the type\\l\\n",
  "to obsess about winning anyway.\\l\\n",
  "Now I feel more relaxed.\\c\\n",
  "Shall we ride the Ferris wheel?\\c$",
]

[msg.section_0.entries.39]
text = [
  "Hmmm... On a thing like THIS, huh...\\c\\n",
  "Oh... I'm sorry.\\n",
  "Just thinking out loud.\\c\\n",
  "Truth is, I just happened to be\\n",
  "talking to my mom and dad\\l\\n",
  "about this old Ferris wheel.\\c\\n",
  "The two of them got all excited,\\n",
  "and they told me this is where\\l\\n",
  "they had their first date.\\c\\n",
  "They said that if it wasn't for\\n",
  "this Ferris wheel, I wouldn't exist.\\c\\n",
  "Hearing that made me feel\\n",
  "really bad...\\c\\n",
  "But, things have changed since\\n",
  "my parents were young.\\c\\n",
  "Hurrying and tearing this\\n",
  "Ferris wheel down would be for the best.\\c\\n",
  "Before we tear it down, though,\\n",
  "I wanted to look at the scenery and\\l\\n",
  "think about my mom and dad's youth...\\c\\n",
  "Thanks for riding with me.\\n",
  "OK. Take care!$",
]

[msg.section_0.entries.40]
text = [
  "The wind has become colder...\\n",
  "I wonder if the doctor will\\l\\n",
  "be upset with me for being out too long...\\c\\n",
  "Huh? Who are you?\\n",
  "Do you want to battle, perhaps?$",
]

[msg.section_0.entries.41]
text = [
  "You're a funny one.\\n",
  "Wanting to battle an old lady like me!\\c\\n",
  "Hee hee hee...\\n",
  "But it's nice of you to invite me.\\l\\n",
  "OK. Let's have a good battle.\\c$",
]

[msg.section_0.entries.42]
text = [
  "I see...\\n",
  "Well, be well.$",
]

[msg.section_0.entries.43]
text = [
  "Aww... That was over in an instant.\\n",
  "Sorry. I'm not very good.\\c\\n",
  "[VAR TRNAME(0)], was it?\\n",
  "Have you ever ridden this Ferris wheel?\\c\\n",
  "The view is really really pretty.\\n",
  "But, it's a little odd--two people\\l\\n",
  "have to ride in one car.\\c\\n",
  "Um... Talking about it makes me\\n",
  "want to ride it again...\\c\\n",
  "Hey, come ride with me!\\c$",
]

[msg.section_0.entries.44]
text = [
  "Hee hee... That was a lot of fun...\\n",
  "I might not look like it, but I'm a mom.\\c\\n",
  "Well, I should say I'll be a mom soon.\\c\\n",
  "Recently, the doctor's been telling\\n",
  "me to take it easy, and I'm a little\\l\\n",
  "stressed out.\\c\\n",
  "But today, I managed to relax enough\\n",
  "for two.\\c\\n",
  "Thanks, [VAR TRNAME(0)].\\n",
  "I hope we can meet again sometime.$",
]

[msg.section_0.entries.45]
text = [
  "Why hello, [VAR TRNAME(0)]! How are you?\\n",
  "Do you want to battle again?$",
]

[msg.section_0.entries.46]
text = [
  "Hee hee hee... Sure thing.\\c\\n",
  "I have to build up strength\\n",
  "for the little bundle of joy inside me.\\c\\n",
  "But, I'm not supposed to do anything\\n",
  "strenuous, so take it easy on me, OK?\\c$",
]

[msg.section_0.entries.47]
text = [
  "I see...\\n",
  "I was expecting a fun battle, but...$",
]

[msg.section_0.entries.48]
text = [
  "Hee hee hee... I just can't keep up!\\c\\n",
  "Still, you have such a cool expression,\\n",
  "but when you battle, it's rather wild!\\c\\n",
  "I think guys like that are great.\\n",
  "You definitely would've been my\\l\\n",
  "type when I was younger.\\c\\n",
  "Well now, [VAR TRNAME(0)].\\n",
  "Since you're here, hang out\\l\\n",
  "with this old lady a little longer!\\c$",
]

[msg.section_0.entries.49]
text = [
  "Hee hee. That was fun...\\c\\n",
  "You're good at Pokémon,\\n",
  "and you're really wonderful.\\l\\n",
  "You remind me of that person.\\c\\n",
  "I hope my child grows up to\\n",
  "be a nice kid like you, [VAR TRNAME(0)].\\c\\n",
  "I have to work very hard to\\n",
  "make that happen!\\c\\n",
  "See you, [VAR TRNAME(0)]!\\n",
  "I had a great time! Thanks!$",
]

[msg.section_0.entries.50]
text = [
  "My sentiment doesn't stop\\n",
  "at each falling leaf...\\c\\n",
  "Huh? What do you want, girl?\\n",
  "Do you want something from me?\\c\\n",
  "It looks like you're a Trainer.\\n",
  "Are you asking me to battle?$",
]

[msg.section_0.entries.51]
text = [
  "Harrumph.\\c\\n",
  "I have zero interest in girls like you,\\n",
  "but I accept your challenge.\\l\\n",
  "Shall we get this over with?\\c$",
]

[msg.section_0.entries.52]
text = [
  "Really...\\n",
  "Then leave me alone.$",
]

[msg.section_0.entries.53]
text = [
  "Ah... I can't stand it...\\n",
  "Every time I have a Pokémon battle,\\l\\n",
  "memories of that summer pull at\\l\\n",
  "my heart and tear it apart.\\c\\n",
  "That's right... You.\\c\\n",
  "Meeting you here must be fate.\\n",
  "Will you listen to how I ended\\l\\n",
  "up this way?\\c\\n",
  "I hear telling someone what\\n",
  "makes your heart ache\\l\\n",
  "eases the pain.\\c\\n",
  "My painful, painful memories of love...\\c\\n",
  "I don't want anyone else to hear them.\\n",
  "Come here with me...\\c$",
]

[msg.section_0.entries.54]
text = [
  "Sniff... Ex-excuse me.\\c\\n",
  "Just remembering that summer\\n",
  "makes it hard to hold back the tears...\\c\\n",
  "Tore me up inside, and when that person\\n",
  "disappeared...\\c\\n",
  "Of course I was betrayed...\\c\\n",
  "But still, my heart is still\\n",
  "not used to it...\\c\\n",
  "I'm sorry...\\n",
  "But I want to be alone for a moment...$",
]

[msg.section_0.entries.55]
text = [
  "Oh... It's you.\\n",
  "I'm sorry. [VAR TRNAME(0)], wasn't it?\\c\\n",
  "How are you? Doing well?\\n",
  "Honestly, I'm still the same.\\c\\n",
  "My shaking heart is still waiting\\n",
  "for the rescue squad to save it...\\c\\n",
  "If you don't mind, could you spare\\n",
  "a moment. Please?$",
]

[msg.section_0.entries.56]
text = [
  "Really? Thank you...\\n",
  "But, shall we have a battle first...\\c\\n",
  "I have to be able to have\\n",
  "a decent Pokémon battle by now...\\c$",
]

[msg.section_0.entries.57]
text = [
  "Oh... Sorry about the trouble...$",
]

[msg.section_0.entries.58]
text = [
  "It's no good! No good at all!!\\n",
  "It's like I can't concentrate at all!!\\c\\n",
  "Why is this empty, too?\\n",
  "Why do I keep remembering?\\l\\n",
  "Why can't I forget that summer?\\l\\n",
  "Why?! Why can't I forget\\l\\n",
  "that sunshine?!\\c\\n",
  "Excuse me for losing control.\\n",
  "Wait just one moment...\\c\\n",
  "I'm picking up the pieces of\\n",
  "my broken heart...\\c\\n",
  "So, [VAR TRNAME(0)]...\\n",
  "Can you stay with me a little longer?\\c$",
]

[msg.section_0.entries.59]
text = [
  "Sniff... Sob...\\c\\n",
  "You know, [VAR TRNAME(0)]...\\n",
  "Love and breakups are sure hard...\\c\\n",
  "But, do you know what I think...\\n",
  "Even if something is waiting ahead,\\l\\n",
  "you should tell the person that you\\l\\n",
  "have feelings in your heart...\\c\\n",
  "You don't have to worry about\\n",
  "being hurt. If you give up on\\l\\n",
  "telling people how you feel because\\l\\n",
  "you're afraid you can't be together...\\c\\n",
  "All that's waiting on that flat line\\n",
  "of fear is eternal loneliness.\\c\\n",
  "...\\n",
  "Thanks for listening to me.\\c\\n",
  "You're a girl, but our souls are\\n",
  "on the same wavelength.\\l\\n",
  "You're a true friend...$",
]

[msg.section_0.entries.60]
text = [
  "Who are you?\\n",
  "Do you want to battle me?$",
]

[msg.section_0.entries.61]
text = [
  "Hmm...\\c\\n",
  "They must be getting desperate--\\n",
  "sending a kid like you...\\c\\n",
  "They really want to take me\\n",
  "back to the manor, don't they?\\c\\n",
  "Well, if I think of what I'm worth,\\n",
  "that's to be expected...\\c\\n",
  "Fine!\\c\\n",
  "I'll be your opponent in a\\n",
  "Pokémon battle!\\c\\n",
  "Now listen. In exchange, if you lose,\\n",
  "you will get out of my sight immediately!\\c$",
]

[msg.section_0.entries.62]
text = [
  "Would you be off, then?!\\n",
  "I really don't like kids...$",
]

[msg.section_0.entries.63]
text = [
  "Who ARE you?\\n",
  "I've never seen you at the manor.\\c\\n",
  "It doesn't seem like you're a member\\n",
  "of an organization or a hospital...\\c\\n",
  "Could it be?\\n",
  "Did you just want to battle?\\c\\n",
  "Or did you want to ride the\\n",
  "Ferris wheel and talk?\\c\\n",
  "Well, OK then!\\c\\n",
  "Let's ride the Ferris wheel.\\n",
  "Come now, hurry!\\c$",
]

[msg.section_0.entries.64]
text = [
  "What a relief...\\c\\n",
  "If you weren't such an honest\\n",
  "person, that might have been your end...\\c\\n",
  "That's right...\\n",
  "I'm being targeted by his organization.\\c\\n",
  "...\\c\\n",
  "Oh, that's fine.\\n",
  "You don't need to believe me.\\c\\n",
  "But just listen to this.\\c\\n",
  "If I'm safe, the world will\\n",
  "be at peace tomorrow as well...\\c\\n",
  "If not...\\c\\n",
  "You should hope that\\n",
  "we both can meet again.$",
]

[msg.section_0.entries.65]
text = [
  "Why if it isn't [VAR TRNAME(0)]?\\c\\n",
  "Oh! That's it!\\n",
  "Stay with me for a moment!\\c\\n",
  "Why? For a Pokémon battle of course!\\n",
  "A simple Pokémon battle!\\c\\n",
  "The people they have chasing\\n",
  "me are getting tougher recently...\\c\\n",
  "Think of it as helping me out.\\n",
  "Will you battle with me?$",
]

[msg.section_0.entries.66]
text = [
  "You...\\n",
  "You have a lot of promise.\\c$",
]

[msg.section_0.entries.67]
text = [
  "Fine then! Go away, then!\\c\\n",
  "If they see you with me,\\n",
  "you'll be in danger, too!$",
]

[msg.section_0.entries.68]
text = [
  "You're just as good as ever.\\c\\n",
  "You should be able to\\n",
  "defend yourself with no trouble.\\c\\n",
  "I'll be OK!\\c\\n",
  "That fight made me stronger,\\n",
  "and I always take care of myself...\\c\\n",
  "Always have...\\n",
  "Always will...\\c\\n",
  "Come now, let's ride the Ferris wheel.\\n",
  "Even they can't strike there.\\c$",
]

[msg.section_0.entries.69]
text = [
  "World peace is protected\\n",
  "by something truly simple...\\c\\n",
  "It's best if you don't know\\n",
  "any more than that...\\c\\n",
  "If you know, that organization\\n",
  "will come after you as well...\\c\\n",
  "But, it's OK.\\c\\n",
  "As you live out each day,\\n",
  "I'll try to stay one step ahead of them.\\c\\n",
  "Well let's hope we can see each other\\n",
  "again someday.\\c\\n",
  "Then when you become an adult,\\n",
  "together we can...\\l\\n",
  "No. I'm sorry...\\c\\n",
  "I shouldn't make promises I can't keep.\\n",
  "Now, go!$",
]

[msg.section_0.entries.70]
text = [
  "Yeah! You over there!\\n",
  "Wearing those cold-lookin' threads\\l\\n",
  "in the middle of winter is pretty\\l\\n",
  "rock 'n' roll!\\c\\n",
  "But listen, there ain't anyone\\n",
  "who rocks harder than me!\\c\\n",
  "Let's have a battle and prove\\n",
  "who rocks hardest! Yeeeooow!$",
]

[msg.section_0.entries.71]
text = [
  "OK! Hard-rock grrrl!\\n",
  "Prepare to be rocked by my beat!\\c$",
]

[msg.section_0.entries.72]
text = [
  "You're just gonna rock 'n' roll away?\\n",
  "That's not cool, grrrl!$",
]

[msg.section_0.entries.73]
text = [
  "Whoo hoo! Way to rock, grrrl!\\c\\n",
  "No one can stop your\\n",
  "hard-rockin' heart!\\c\\n",
  "Hey! To thank you for the\\n",
  "funky battle, I'll sing you a song!\\c\\n",
  "I can't give it away here!\\n",
  "My beats are premium!\\c\\n",
  "This is a song for you alone!\\n",
  "Hey! Roll on over this way! Yeeoow!\\c$",
]

[msg.section_0.entries.74]
text = [
  "How was it, hard-rock grrl?\\n",
  "My rockin' music bowl you over?\\c\\n",
  "I dropped a heartbreaking\\n",
  "beat in a country style\\l\\n",
  "about the unending yearning\\l\\n",
  "heart of a sad woman who has lost love.\\c\\n",
  "It's a tragic masterpiece!\\n",
  "That's it for today.\\l\\n",
  "I'll end with an ad!\\c\\n",
  "I'm playing streets all over\\n",
  "the world right now!\\c\\n",
  "I'll be here for a while!\\n",
  "I'm waiting for your encore!$",
]

[msg.section_0.entries.75]
text = [
  "Hey! It's...rocki...\\n",
  "No. How are you?\\l\\n",
  "Is that so.\\c\\n",
  "Please excuse me for interrupting\\n",
  "your busy day, but would you be\\l\\n",
  "so kind as to have a battle with me?\\c$",
]

[msg.section_0.entries.76]
text = [
  "Thank you very much\\n",
  "for accepting my challenge...\\c\\n",
  "Gr...\\n",
  "Excuse me. Please come at me\\l\\n",
  "with everything you have.\\c$",
]

[msg.section_0.entries.77]
text = [
  "Oh. That's unfortunate.\\n",
  "I'm very sorry to have\\l\\n",
  "stopped you when you were busy...$",
]

[msg.section_0.entries.78]
text = [
  "Thank you so much...\\n",
  "I knew you rocked...\\c\\n",
  "Excuse me, but I think you're wonderful.\\n",
  "...\\c\\n",
  "...Truth is, the other day after\\n",
  "we parted, I was scouted, and\\l\\n",
  "my producer offered me a\\l\\n",
  "massive debut.\\c\\n",
  "But that's...\\n",
  "Actually, before I continue,\\l\\n",
  "I want to ask you a favor, [VAR TRNAME(0)].\\c\\n",
  "Please listen to my song again!\\c$",
]

[msg.section_0.entries.79]
text = [
  "How was my song?\\n",
  "...\\c\\n",
  "Well, to continue my story,\\n",
  "I'm supposed to debut as\\l\\n",
  "a sweet and pure pop singer.\\c\\n",
  "They listened to my songs\\n",
  "but said they wouldn't be popular now.\\c\\n",
  "Even more, they said I should\\n",
  "speak more politely.\\c\\n",
  "This isn't me...\\c\\n",
  "But I may never get a chance like\\n",
  "this again. I can't let it pass me by...\\c\\n",
  "So I'm going to change.\\n",
  "I'll be cute, pretty, and classy\\l\\n",
  "so everyone will love me...\\c\\n",
  "But, [VAR TRNAME(0)],\\n",
  "let me be the real me in front of you!\\l\\n",
  "I'll sing that song just for you...\\c\\n",
  "So, [VAR TRNAME(0)],\\n",
  "please come and meet me sometime!$",
]

[msg.section_0.entries.80]
text = [
  "You can only ride this\\n",
  "Ferris wheel with two people.\\c\\n",
  "Too bad. I wanted to tell\\n",
  "my sister about it...\\c\\n",
  "Hey. Wait a minute!\\n",
  "Ride with me!\\c$",
]

[msg.section_0.entries.81]
text = [
  "OK!\\n",
  "I'm gonna brag about this to my sister!$",
]

[msg.section_0.entries.82]
text = [
  "What? You came here because of the\\n",
  "Ferris wheel, right?!\\c$",
]

[msg.section_0.entries.83]
text = [
  "That was a nice change of pace.\\n",
  "Time to get back to work and train!$",
]

[msg.section_0.entries.84]
text = [
  "It's sure big!\\c\\n",
  "I bet if you ride it,\\n",
  "you can see really far away!\\c\\n",
  "Think you can see Nuvema Town?\\n",
  "Hey, c'mon! Ride with me!\\c$",
]

[msg.section_0.entries.85]
text = [
  "This sure makes me smile!\\n",
  "See you!$",
]

[msg.section_0.entries.86]
text = [
  "Hee hee!\\n",
  "We're already here! Let's ride!\\c$",
]

[msg.section_0.entries.87]
text = [
  "That was so much fun!\\n",
  "See yooou!$",
]

[msg.section_0.entries.88]
text = [
  "[SPEED(1)]This sure takes me back...\\c\\n",
  "You! Ride this Ferris wheel with me![SPEED(0)]\\c$",
]

[msg.section_0.entries.89]
text = [
  "[SPEED(1)]...That made me remember that day.\\n",
  "...Sorry. I'll be going.[SPEED(0)]$",
]

[msg.section_0.entries.90]
text = [
  "[SPEED(1)]I love Ferris wheels.\\c\\n",
  "So, you there!\\n",
  "Come with me![SPEED(0)]\\c$",
]

[msg.section_0.entries.91]
text = [
  "[SPEED(1)]Ferris wheels sure are great.\\c\\n",
  "But that can't be proved with numbers.\\n",
  "It's the incompleteness theorem...[SPEED(0)]$",
]

[msg.section_0.entries.92]
text = [
  "Now that you mention it,\\n",
  "I've been to Nimbasa City many times,\\l\\n",
  "but I've never ridden the Ferris wheel.\\c$",
]

[msg.section_0.entries.93]
text = [
  "Everything is an experience.\\c\\n",
  "Thanks for riding with me.\\n",
  "That's a big help.$",
]

[msg.section_0.entries.94]
text = [
  "Well... In order to put what's good\\n",
  "about Ferris wheels into words,\\l\\n",
  "the only thing to do is ride one.\\c$",
]

[msg.section_0.entries.95]
text = [
  "The scenery changes along with the\\n",
  "movement of the Ferris wheel, but\\l\\n",
  "I prefer it when things stay the same.$",
]

[msg.section_0.entries.96]
text = [
  "Oh, [VAR TRNAME(0)]!\\c\\n",
  "You came!\\c\\n",
  "I'm so glad.\\c\\n",
  "...\\n",
  "...\\c\\n",
  "What?\\c\\n",
  "N-no! I haven't been waiting.\\n",
  "I just got here a minute ago.\\c\\n",
  "Ah ha ha!\\c\\n",
  "Hey, if you don't mind,\\n",
  "do you want to ride the Ferris wheel?\\c\\n",
  "Nimbasa City's Ferris wheel\\n",
  "is really famous for having\\l\\n",
  "a beautiful view.\\c\\n",
  "...\\n",
  "...\\c\\n",
  "Really? You don't mind?\\c\\n",
  "Great!\\c\\n",
  "I've been wanting to ride\\n",
  "this Ferris wheel for a long time!\\c\\n",
  "But...\\n",
  "Only two people can ride it,\\l\\n",
  "so I've held out this whole time!\\c\\n",
  "I'm so happy, I'm all worked up!\\c\\n",
  "Let's hurry up and ride, [VAR TRNAME(0)]!\\c$",
]

[msg.section_0.entries.97]
text = [
  "...\\c\\n",
  "Ah ha ha!\\c\\n",
  "I'm so thankful for everything\\n",
  "you've done for me.\\c\\n",
  "I feel like I can work so hard\\n",
  "at this job thanks to you, [VAR TRNAME(0)].\\c\\n",
  "I'd like it if we could keep\\n",
  "talking from time to time...\\c\\n",
  "...\\c\\n",
  "OK. I'm going to get going...\\c\\n",
  "Today was a lot of fun!\\n",
  "See you later, [VAR TRNAME(0)]!$",
]

[msg.section_0.entries.98]
text = [
  "Oh! [VAR TRNAME(0)]!\\c\\n",
  "Ah ha ha!\\c\\n",
  "I couldn't wait, so I hurried here.\\c\\n",
  "I'm happy to see you!\\c\\n",

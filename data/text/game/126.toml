[msg.section_0.entries.0]
text = [
  "Hi there, [VAR TRNAME(0)]!\\c$",
]

[msg.section_0.entries.1]
text = [
  "It's nice to finally be able\\n",
  "to talk to you in person!\\c\\n",
  "I'm Professor Juniper!\\c$",
]

[msg.section_0.entries.2]
text = [
  "You accepted the Pokédex and\\n",
  "came all the way out here with\\l\\n",
  "your partners...\\c\\n",
  "Here, I'll evaluate your progress\\n",
  "for you!\\c$",
]

[msg.section_0.entries.3]
text = [
  "So, [VAR TRNAME(0)], you've seen\\n",
  "[VAR NUM3(1)] Pokémon up to this point!\\c\\n",
  "I see! Thank you!\\n",
  "This is a token of my gratitude.\\c$",
]

[msg.section_0.entries.4]
text = [
  "Juniper: This Master Ball is the most\\n",
  "powerful kind of Poké Ball.\\c\\n",
  "It can catch any Pokémon without fail.\\c\\n",
  "Journeys are about meeting Pokémon.\\n",
  "Don't let a chance get away!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Still, I'm amazed how much Pokémon\\n",
  "distribution changes in two years.\\c\\n",
  "That means my research will never end.\\n",
  "Still, you could say that's what\\l\\n",
  "makes it fun...\\c$",
]

[msg.section_0.entries.6]
text = [
  "???: Professor Juniperrrrr!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Professor Juniper: Why, if it isn't Skyla!\\c$",
]

[msg.section_0.entries.8]
text = [
  "This is Skyla.\\n",
  "She's Mistralton City's Gym Leader.\\c$",
]

[msg.section_0.entries.9]
text = [
  "Skyla: Why are you surprised, Professor?\\c\\n",
  "You did ask for a lift in my plane to\\n",
  "cross Twist Mountain, since you can't\\l\\n",
  "reach Opelucid City by foot.\\c$",
]

[msg.section_0.entries.10]
text = [
  "Professor Juniper: Aha ha! You're right.\\n",
  "But I have a quick favor to ask first.\\c\\n",
  "I want a look at Celestial Tower.\\n",
  "Do you mind waiting till I'm through?\\c$",
]

[msg.section_0.entries.11]
text = [
  "See you, [VAR TRNAME(0)]!\\c\\n",
  "Be sure to always get along\\n",
  "with all kinds of Pokémon!\\c$",
]

[msg.section_0.entries.12]
text = [
  "Skyla: Honestly! I can't tell if she's\\n",
  "just laid back or if she's not paying\\l\\n",
  "attention to anything outside her head.\\c\\n",
  "The apple sure doesn't\\n",
  "fall far from the tree.\\c$",
]

[msg.section_0.entries.13]
text = [
  "What's next?\\n",
  "Are you coming to my Gym to challenge me?\\c\\n",
  "Or are you going to follow the professor\\n",
  "to Celestial Tower and do some training?\\c\\n",
  "As long as I get to battle with a strong\\n",
  "Trainer, I'm fine either way!\\c$",
]

[msg.section_0.entries.14]
text = [
  "Skyla: Time for a quick hop in my plane!\\c\\n",
  "Hey, where did Professor Juniper get to?\\c$",
]

[msg.section_0.entries.15]
text = [
  "I wonder if she's still doing research\\n",
  "in Celestial Tower?\\c\\n",
  "Mmm... Could I ask you\\n",
  "to go get the professor?\\c\\n",
  "I've got to finish flight preparations\\n",
  "at Mistralton Cargo Service!\\c$",
]

[msg.section_0.entries.16]
text = [
  "Professor Juniper: Hi there!\\c\\n",
  "I hope we can get some good\\n",
  "research done on the other side\\l\\n",
  "of the mountain as well.\\c\\n",
  "That's right! I want you to\\n",
  "take this flight, too!\\c$",
]

[msg.section_0.entries.17]
text = [
  "There's someone I want you to\\n",
  "meet in Opelucid City,\\l\\n",
  "but we can't get through\\l\\n",
  "Twist Mountain right now.\\c\\n",
  "We'll just make a quick flight\\n",
  "over to Lentimas Town!\\c\\n",
  "I'll be waiting for you in\\n",
  "Mistralton Cargo Service!\\c$",
]

[msg.section_0.entries.18]
text = [
  "Skyla: Hey! Professor! Wait up!\\c\\n",
  "Honestly... She just does\\n",
  "everything at her own pace!\\c$",
]

[msg.section_0.entries.19]
text = [
  "OK! You come, too!\\c$",
]

[msg.section_0.entries.20]
text = [
  "We've arranged it so Mistralton's planes\\n",
  "are now available for passenger service.\\c\\n",
  "It's not like everyone's Pokémon\\n",
  "can use Fly!$",
]

[msg.section_0.entries.21]
text = [
  "Fly is an amazing move!\\c\\n",
  "Even a teeny-weeny Pokémon\\n",
  "can carry a person easily!$",
]

[msg.section_0.entries.22]
text = [
  "That Skyla...\\n",
  "She's even surpassed her grandpa,\\l\\n",
  "who was a legendary pilot!$",
]

[msg.section_0.entries.23]
text = [
  "Mistralton City used to be a\\n",
  "desolate patch of land...\\c\\n",
  "This place was built through the\\n",
  "cooperation of people and Pokémon.$",
]

[msg.section_0.entries.24]
text = [
  "Planes need a runway to fly,\\n",
  "but Pokémon don't need a thing!\\c\\n",
  "But planes can carry a lot more\\n",
  "cargo than Pokémon can.$",
]

[msg.section_0.entries.25]
text = [
  "Team Plasma went after certain\\n",
  "Pokémon, like Purrloin!\\c\\n",
  "Many people had their Pokémon stolen.\\n",
  "That's just unforgivable!$",
]

[msg.section_0.entries.26]
text = [
  "If you want to eat delicious vegetables,\\n",
  "the ones grown in the wild are the best.\\c\\n",
  "Sometimes they are eaten by Pokémon...\\n",
  "Ah, I mean we can give them to Pokémon.$",
]

[msg.section_0.entries.27]
text = [
  "Vegetables grown efficiently\\n",
  "in a greenhouse are the best.\\c\\n",
  "Their nutrients all go into forming\\n",
  "a very delicious vegetable!$",
]

[msg.section_0.entries.28]
text = [
  "Oh! You found our treasure!\\c$",
]

[msg.section_0.entries.29]
text = [
  "Found it!\\c$",
]

[msg.section_0.entries.30]
text = [
  "Just kidding!\\c\\n",
  "Our Ducklett already knows Aerial Ace.\\n",
  "So we'll give you this TM!\\c$",
]

[msg.section_0.entries.31]
text = [
  "Just kidding!\\c\\n",
  "Our Ducklett already knows Aerial Ace.\\n",
  "So we'll give you this TM!\\c$",
]

[msg.section_0.entries.32]
text = [
  "Aerial Ace always hits its target!\\n",
  "I hope it comes in handy!\\c$",
]

[msg.section_0.entries.33]
text = [
  "Kwa!$",
]

[msg.section_0.entries.34]
text = [
  "See you! Bye-bye!\\c$",
]

[msg.section_0.entries.35]
text = [
  "Hey, what's up?\\c\\n",
  "I know! Since you're here,\\n",
  "I'll tell you a little secret!\\c$",
]

[msg.section_0.entries.36]
text = [
  "Please keep this a secret from Elesa, OK?$",
]

[msg.section_0.entries.37]
text = [
  "Know what?\\n",
  "My Pokémon loves Berries!\\c\\n",
  "That's why I'm wandering all over,\\n",
  "looking for Berries!\\c\\n",
  "I dream about a wonderful city somewhere\\n",
  "that is overflowing with Berries...\\c$",
]

[msg.section_0.entries.38]
text = [
  "The Funfest Mission\\n",
  "“[VAR FUNFESTMISSION(0)]\\\"\\l\\n",
  "has been added to the Entralink.$",
]

[msg.section_0.entries.39]
text = [
  "My Pokémon's favorite\\n",
  "Berry is the Leppa Berry!\\c\\n",
  "It restores PP!\\n",
  "Isn't it a useful Berry?$",
]

[msg.section_0.entries.40]
text = [
  "Do you know the big street\\n",
  "called [VAR 0x0139(0)]?\\c\\n",
  "There are a lot of unique shops there!\\n",
  "It's so cool!$",
]

[msg.section_0.entries.41]
text = [
  "Mistralton City\\n",
  "Strewn with Windblown Leaves$",
]

[msg.section_0.entries.42]
text = [
  "Mistralton Cargo Service\\n",
  "Our slogan is “Quick and Safe!\\\"$",
]

[msg.section_0.entries.43]
text = [
  "Mistralton City Pokémon Gym\\n",
  "Leader: Skyla\\l\\n",
  "The Highflying Girl$",
]

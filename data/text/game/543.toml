[msg.section_0.entries.0]
text = [
  "Cheren: Oh, [VAR TRNAME(0)].\\n",
  "Can you come with me for a moment?\\c$",
]

[msg.section_0.entries.1]
text = [
  "Kawbraa!$",
]

[msg.section_0.entries.2]
text = [
  "Rood: That Pokémon...?\\c$",
]

[msg.section_0.entries.3]
text = [
  "Elderly Man: It's the legendary Pokémon\\n",
  "called Cobalion!\\c\\n",
  "I told you the story the other\\n",
  "day, right?\\c$",
]

[msg.section_0.entries.4]
text = [
  "Rood: Oh, Cobalion!\\n",
  "What a noble presence!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Elderly Man: They say the three Pokémon\\n",
  "Cobalion, Virizion, and Terrakion\\l\\n",
  "fought against people to protect\\l\\n",
  "Pokémon from the war those\\l\\n",
  "people started...\\c$",
]

[msg.section_0.entries.6]
text = [
  "When people fight, there's no peace for\\n",
  "Pokémon, either.\\c\\n",
  "The three legends learned that\\n",
  "the deeds of humans could lead\\l\\n",
  "to dire consequences for their world.\\c$",
]

[msg.section_0.entries.7]
text = [
  "But... Why did it show up\\n",
  "in front of people?\\c$",
]

[msg.section_0.entries.8]
text = [
  "Is it patrolling the Unova region\\n",
  "to protect Pokémon because it fears for\\l\\n",
  "their safety after the commotion caused\\l\\n",
  "by Team Plasma two years ago?\\c\\n",
  "Or does it sense a new problem...?\\c$",
]

[msg.section_0.entries.9]
text = [
  "Rood: Unforgivable...\\c\\n",
  "So the reach of Ghetsis's ambition\\n",
  "and malice is growing ever wider and\\l\\n",
  "warping the lives of all it touches...\\c$",
]

[msg.section_0.entries.10]
text = [
  "Did Cobalion appear in front of you\\n",
  "merely by accident?\\c\\n",
  "Or to plead with you to solve a problem?\\c\\n",
  "Unlike Lord N, I don't have the ability\\n",
  "to understand the minds of Pokémon.\\c\\n",
  "Therefore, I don't know\\n",
  "what that Pokémon is thinking.\\c\\n",
  "But if you can befriend Cobalion,\\n",
  "it will be a great asset to you\\l\\n",
  "on your journey.$",
]

[msg.section_0.entries.11]
text = [
  "Not just people and Pokémon...\\c\\n",
  "It's best for all creatures to accept\\n",
  "and trust one another...$",
]

[msg.section_0.entries.12]
text = [
  "Chargestone Cave is great!\\c\\n",
  "The Ferroseed I met here\\n",
  "were absolutely adorable!$",
]

[msg.section_0.entries.13]
text = [
  "Water Absorb and Dry Skin.\\c\\n",
  "Pokémon with those Abilities love\\n",
  "Water-type moves and rainy weather. ♪\\c\\n",
  "The Gym Leader in Aspertia City\\n",
  "is very familiar with Pokémon Abilities,\\l\\n",
  "isn't he?\\c\\n",
  "Oh, do you know him? Then you can ask him\\n",
  "about Abilities through the Xtransceiver!$",
]

[msg.section_0.entries.14]
text = [
  "Route 6$",
]

[msg.section_0.entries.15]
text = [
  "Trainer Tips!\\c\\n",
  "\\n",
  "You can register certain items with\\n",
  "the Y Button to use them easily!\\c\\n",
  "Look for a square check box beside\\n",
  "the name of a Key Item.$",
]

[msg.section_0.entries.16]
text = [
  "Researching the Year's Seasons:\\n",
  "The Season Research Lab$",
]

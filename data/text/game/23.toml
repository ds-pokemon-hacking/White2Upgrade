[msg.section_0.entries.0]
text = [
  "Welcome to the Nacrene Museum!$",
]

[msg.section_0.entries.1]
text = [
  "Currently, we're exhibiting a replica\\n",
  "of the Dark Stone, which was\\l\\n",
  "a legendary Pokémon's dormant form.$",
]

[msg.section_0.entries.2]
text = [
  "Currently, we're exhibiting a replica\\n",
  "of the Light Stone, which was\\l\\n",
  "a legendary Pokémon's dormant form.$",
]

[msg.section_0.entries.3]
text = [
  "Wow! Whenever I look at this skeleton,\\n",
  "I'm...fascinated.\\c$",
]

[msg.section_0.entries.4]
text = [
  "Welcome! I'm Hawes, the\\n",
  "assistant director.\\c\\n",
  "Since you were kind enough to visit,\\n",
  "I'll give you a tour of the museum.\\c$",
]

[msg.section_0.entries.5]
text = [
  "???: Why, you're [VAR TRNAME(0)], right?\\n",
  "You came all the way out here!\\c\\n",
  "Well now, which do you like better--\\n",
  "the Cover Fossil or the Plume Fossil?$",
]

[msg.section_0.entries.6]
text = [
  "Cover Fossil$",
]

[msg.section_0.entries.7]
text = [
  "Plume Fossil$",
]

[msg.section_0.entries.8]
text = [
  "Quit$",
]

[msg.section_0.entries.9]
text = [
  "Do you really want to choose\\n",
  "the Cover Fossil?$",
]

[msg.section_0.entries.10]
text = [
  "Do you really want to choose\\n",
  "the Plume Fossil?$",
]

[msg.section_0.entries.11]
text = [
  "Which do you like better,\\n",
  "the Cover Fossil or the Plume Fossil?$",
]

[msg.section_0.entries.12]
text = [
  "Oh, come now!\\c\\n",
  "Don't be shy!\\n",
  "You're too young to be bashful!\\c$",
]

[msg.section_0.entries.13]
text = [
  "The Cover Fossil!\\n",
  "Now, that's a nice choice!\\c\\n",
  "If you want to restore it,\\n",
  "go to our reception counter!\\c$",
]

[msg.section_0.entries.14]
text = [
  "The Plume Fossil!\\n",
  "Now, that's a nice choice!\\c\\n",
  "If you want to restore it,\\n",
  "go to our reception counter!\\c$",
]

[msg.section_0.entries.15]
text = [
  "Hawes: Dear!\\c\\n",
  "Suddenly interrupting my tours\\n",
  "will surprise the patrons.\\c\\n",
  "Oh, and you haven't even\\n",
  "introduced yourself yet, have you?\\c$",
]

[msg.section_0.entries.16]
text = [
  "Oh, that's right.\\c\\n",
  "I'm Lenora, the director of\\n",
  "this museum!\\c\\n",
  "I'm always in my study,\\n",
  "so come visit if you have time!\\c$",
]

[msg.section_0.entries.17]
text = [
  "Oh, that's right.\\c\\n",
  "I'm Lenora, the director of\\n",
  "this museum!\\c\\n",
  "I'm always in my study,\\n",
  "so if you want a Fossil,\\l\\n",
  "drop by and say hello!\\c$",
]

[msg.section_0.entries.18]
text = [
  "Hawes: Oh, dear...\\n",
  "Well, let's continue our tour.\\c\\n",
  "This skeleton is of a\\n",
  "Dragon-type Pokémon.\\c\\n",
  "There's a theory that it had an accident\\n",
  "while it was flying around the world, and\\l\\n",
  "so it became a Fossil.\\c$",
]

[msg.section_0.entries.19]
text = [
  "We learned that Deoxys changes\\n",
  "its Forme by coming into contact\\l\\n",
  "with the power of meteors.\\c$",
]

[msg.section_0.entries.20]
text = [
  "Oh!\\n",
  "Now, this is a truly interesting artifact!\\c\\n",
  "This is a replica of that Dark Stone!\\c\\n",
  "Have you heard of the\\n",
  "Dark Stone?\\c\\n",
  "This is the form of the legendary\\n",
  "Pokémon Zekrom while it rests...\\c\\n",
  "What? You've seen Zekrom?\\n",
  "That's amazing!\\c\\n",
  "In that case, my explanation\\n",
  "is superfluous, isn't it?\\c$",
]

[msg.section_0.entries.21]
text = [
  "Oh!\\n",
  "Now, this is a truly interesting artifact!\\c\\n",
  "This is a replica of that Light Stone!\\c\\n",
  "Have you heard of the\\n",
  "Light Stone?\\c\\n",
  "This is the form of the legendary\\n",
  "Pokémon Reshiram while it rests...\\c\\n",
  "What? You've seen Reshiram?\\n",
  "That's amazing!\\c\\n",
  "In that case, my explanation\\n",
  "is superfluous, isn't it?\\c$",
]

[msg.section_0.entries.22]
text = [
  "The library is in the next room.\\n",
  "Beyond that is the director's room.\\c\\n",
  "By the way, Lenora is a former\\n",
  "Gym Leader!$",
]

[msg.section_0.entries.23]
text = [
  "Skeletal specimens are so mysterious...\\c\\n",
  "From the outside, you can't see their\\n",
  "functional, efficient design.\\c\\n",
  "It's almost as if it is an embodiment of\\n",
  "their former essence... So fascinating!$",
]

[msg.section_0.entries.24]
text = [
  "Rarities from around the world...\\n",
  "Museums are packed with adventure!$",
]

[msg.section_0.entries.25]
text = [
  "I heard that the director, Lenora,\\n",
  "is too busy with her research\\l\\n",
  "on Fossils and Pokémon bones, so she\\l\\n",
  "took a break from being a Gym Leader.$",
]

[msg.section_0.entries.26]
text = [
  "Perhaps there is a Pokémon that came\\n",
  "from space along with this meteorite.$",
]

[msg.section_0.entries.27]
text = [
  "The Thick Club held by Marowak...\\c\\n",
  "Just like how Cubone wears\\n",
  "its mother's skull,\\l\\n",
  "Marowak could also battle with\\l\\n",
  "the bone of someone dear to it...$",
]

[msg.section_0.entries.28]
text = [
  "You!\\n",
  "Bones can talk!\\c$",
]

[msg.section_0.entries.29]
text = [
  "You seem all right,\\n",
  "but it's natural for people\\l\\n",
  "to have different opinions.\\c\\n",
  "Don't fight over it--enjoy it.\\n",
  "Consider why they might think like that!$",
]

[msg.section_0.entries.30]
text = [
  "This is a skeletal specimen from a\\n",
  "Pokémon that flew around the world.$",
]

[msg.section_0.entries.31]
text = [
  "It's a Fossil of a Pokémon that was\\n",
  "protected by a very hard shell.$",
]

[msg.section_0.entries.32]
text = [
  "A meteor that has a space virus\\n",
  "attached to it.$",
]


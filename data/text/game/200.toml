[msg.section_0.entries.0]
text = [
  "Heh heh heh...\\c\\n",
  "You see, this is the dressing room\\n",
  "for an amazing beauty scouted\\l\\n",
  "from the something-or-other region.\\c\\n",
  "I wonder what's going on inside...$",
]

[msg.section_0.entries.1]
text = [
  "Whaugh! [VAR TRNAME(0)]!\\c\\n",
  "Thanks as always for your hard work!\\n",
  "I'm putting my whole heart and soul\\l\\n",
  "into my guard duty and making sure\\l\\n",
  "not even a single Joltik will get through.$",
]

[msg.section_0.entries.2]
text = [
  "Only special stars approved\\n",
  "by our boss are allowed into\\l\\n",
  "this special dressing room.\\c\\n",
  "A brat like you has no business here.\\n",
  "Scram! Get out of here!$",
]

[msg.section_0.entries.3]
text = [
  "Good day!\\n",
  "Mr. Deeoh told me about it!\\c\\n",
  "[VAR TRNAME(0)], please,\\n",
  "enter the dressing room,\\l\\n",
  "and relax to your heart's content.$",
]

[msg.section_0.entries.4]
text = [
  "Pokéstar Studios movies are shot\\n",
  "using rental Pokémon, right?\\c\\n",
  "Does this mean my little\\n",
  "Lillipup can't be in the movies?\\c$",
]

[msg.section_0.entries.5]
text = [
  "If you shoot a movie with\\n",
  "rental Pokémon once successfully,\\l\\n",
  "then you can use your own Pokémon!\\c\\n",
  "That's why me and my Stunfisk\\n",
  "are shooting for the stars!\\c\\n",
  "Right, Stunfisk?$",
]

[msg.section_0.entries.6]
text = [
  "...$",
]

[msg.section_0.entries.7]
text = [
  "Welcome to the soundstage\\n",
  "of Pokéstar Studios!\\c\\n",
  "Oh... You're...\\c\\n",
  "I guess since I don't remember\\n",
  "your name, you must be new!$",
]

[msg.section_0.entries.8]
text = [
  "Welcome to the soundstage\\n",
  "of Pokéstar Studios!\\c\\n",
  "Oh... You're...\\c\\n",
  "You've been coming in and out quite a\\n",
  "bit recently! Are your movies good?\\c\\n",
  "Hee hee! Maybe I should go see one!$",
]

[msg.section_0.entries.9]
text = [
  "Welcome to the soundstage\\n",
  "of Pokéstar Studios!\\c\\n",
  "Oh... You're...\\c\\n",
  "[VAR TRNAME(0)], wasn't it?\\n",
  "I hear your name around here\\l\\n",
  "quite often lately!\\l\\n",
  "Tee hee! You're working hard, huh?$",
]

[msg.section_0.entries.10]
text = [
  "Welcome to the soundstage\\n",
  "of Pokéstar Studios!\\c\\n",
  "Oh...\\n",
  "Hello, [VAR TRNAME(0)].\\c\\n",
  "When we release your films,\\n",
  "the whole theater fills up!\\c\\n",
  "Tee hee hee! At some point you\\n",
  "joined the ranks of the big stars, huh?$",
]

[msg.section_0.entries.11]
text = [
  "Welcome to the soundstage\\n",
  "of Pokéstar Studios!\\c\\n",
  "Oh...\\n",
  "Hello, [VAR TRNAME(0)].\\c\\n",
  "Tee hee hee...\\c\\n",
  "I never would've imagined you\\n",
  "would become this famous...$",
]

[msg.section_0.entries.12]
text = [
  "Hi! You're new, right?\\c\\n",
  "Listen up! If you're an actor,\\n",
  "make sure to check the script!\\c\\n",
  "Work hard and try to be\\n",
  "a big star like Brycen!$",
]

[msg.section_0.entries.13]
text = [
  "Hey! You're [VAR TRNAME(0)], right?\\c\\n",
  "I've been hearing your name\\n",
  "here and there recently.\\l\\n",
  "So apparently they're making\\l\\n",
  "scripts with you in mind now, aren't they?$",
]

[msg.section_0.entries.14]
text = [
  "Why, if it isn't [VAR TRNAME(0)]!\\n",
  "You're quite popular now, too!\\c\\n",
  "The Pokéstar Studios staff is\\n",
  "really proud you're on our team!$",
]

[msg.section_0.entries.15]
text = [
  "I'm the VFX specialist!\\c\\n",
  "You've seen those green screens\\n",
  "in the soundstage, right?\\c\\n",
  "Images filmed in front of them\\n",
  "are turned into impressive\\l\\n",
  "movies using computers!$",
]

[msg.section_0.entries.16]
text = [
  "Hey! Want to know anything\\n",
  "about Pokéstar Studios?$",
]

[msg.section_0.entries.17]
text = [
  "Pokéstar Studios films are shot\\n",
  "while following a script!\\c\\n",
  "In other words, the script\\n",
  "is the foundation the rest\\l\\n",
  "of the movie is built on!\\c\\n",
  "Directions for making\\n",
  "filming work and information\\l\\n",
  "about the other actors is\\l\\n",
  "also written in the script!\\c\\n",
  "You can look at it while shooting,\\n",
  "so check it if you're in trouble!\\c\\n",
  "The scripts you can shoot increase\\n",
  "depending on things like the\\l\\n",
  "content of the movies you've made\\l\\n",
  "or how much they've grossed!\\c$",
]

[msg.section_0.entries.18]
text = [
  "Pokémon are an indispensable part\\n",
  "of moviemaking at Pokéstar Studios!\\c\\n",
  "The actor and the Pokémon's acting\\n",
  "are what make a shoot proceed.\\c\\n",
  "At first we have you rent Pokémon\\n",
  "for each different script.\\c\\n",
  "Once you can make a good film,\\n",
  "you'll be able to shoot it again\\l\\n",
  "with your own Pokémon!\\c$",
]

[msg.section_0.entries.19]
text = [
  "The basics of Pokéstar Studios film\\n",
  "acting resemble Pokémon battling.\\c\\n",
  "But it's not a battle, so winning\\n",
  "isn't always important!\\c\\n",
  "Hints about what to do are written\\n",
  "in the script, so check it carefully.\\c\\n",
  "The director's comments can also\\n",
  "be helpful!\\c$",
]

[msg.section_0.entries.20]
text = [
  "As the shoot goes on,\\n",
  "you can pick lines!\\c\\n",
  "Choose the line that makes you\\n",
  "think, “This is great!\\\"\\c\\n",
  "The lines you choose will change\\n",
  "your costars' acting and the story\\l\\n",
  "of the final film itself!\\c$",
]

[msg.section_0.entries.21]
text = [
  "As you make movies and they\\n",
  "are played in the theater,\\l\\n",
  "you'll become popular!\\c\\n",
  "If you become popular,\\n",
  "I'm sure some good things will happen!\\c$",
]

[msg.section_0.entries.22]
text = [
  "OK! Do your best!$",
]

[msg.section_0.entries.23]
text = [
  "Scripts$",
]

[msg.section_0.entries.24]
text = [
  "Pokémon 1$",
]

[msg.section_0.entries.25]
text = [
  "Acting$",
]

[msg.section_0.entries.26]
text = [
  "Lines$",
]

[msg.section_0.entries.27]
text = [
  "Popularity$",
]

[msg.section_0.entries.28]
text = [
  "I'm fine!$",
]

[msg.section_0.entries.29]
text = [
  "Pokémon 2$",
]

[msg.section_0.entries.30]
text = [
  "At Pokéstar Studios, any Pokémon\\n",
  "can participate in the filming!\\c\\n",
  "But you need to pay attention\\n",
  "to the moves it knows.\\c\\n",
  "If a Pokémon knows any of these moves,\\n",
  "it can't be in a movie:\\l\\n",
  "Transform,\\l\\n",
  "Torment,\\l\\n",
  "or Metronome.\\c\\n",
  "These moves get in your costars' way,\\n",
  "so they're banned at Pokéstar Studios.\\c\\n",
  "Keep this in mind when filming\\n",
  "with your own Pokémon!\\c$",
]

[msg.section_0.entries.0]
text = [
  "Hi, [VAR TRNAME(0)]!\\c$",
]

[msg.section_0.entries.1]
text = [
  "[VAR TRNAME(1)]: Hey!\\n",
  "You get a Pokémon yet?\\c\\n",
  "There aren't any Pokémon Trainers\\n",
  "around here, and I'm getting bored!\\c$",
]

[msg.section_0.entries.2]
text = [
  "What's that?\\c\\n",
  "...\\c$",
]

[msg.section_0.entries.3]
text = [
  "A person named Bianca is\\n",
  "giving you a Pokémon? Really?!\\c$",
]

[msg.section_0.entries.4]
text = [
  "[VAR TRNAME(1)]'s Sister: [VAR TRNAME(0)]...\\c\\n",
  "If you get a Pokémon,\\n",
  "take really, really good care of it, OK?\\c$",
]

[msg.section_0.entries.5]
text = [
  "[VAR TRNAME(1)]: Yeah...\\c$",
]

[msg.section_0.entries.6]
text = [
  "OK! Let's go get your Pokémon!\\c\\n",
  "There's something I have to do!\\c\\n",
  "And to do that, I need someone\\n",
  "I can trust besides my partner Pokémon.\\l\\n",
  "A person I can trust!\\c\\n",
  "That's right! I'm talking about you!\\n",
  "You seem like you've got good instincts!\\c$",
]

[msg.section_0.entries.7]
text = [
  "You head on home.\\c$",
]

[msg.section_0.entries.8]
text = [
  "OK, big brother!\\c\\n",
  "Bye-bye, [VAR TRNAME(0)]!\\c$",
]

[msg.section_0.entries.9]
text = [
  "[VAR TRNAME(1)]: All riiight!\\n",
  "Let's go find that person named Bianca!$",
]

[msg.section_0.entries.10]
text = [
  "                         $$",
]

[msg.section_0.entries.11]
text = [
  "[VAR TRNAME(1)]: Still...\\c\\n",
  "You're really lucky to get a Pokémon!$",
]

[msg.section_0.entries.12]
text = [
  "[VAR TRNAME(1)]: Once you get a Pokémon,\\n",
  "you leave on a journey right away.\\c\\n",
  "When you do that, I'm gonna have you\\n",
  "help me out!$",
]

[msg.section_0.entries.13]
text = [
  "[VAR TRNAME(1)]: Hurry up already!\\n",
  "Let's look for that Bianca person!$",
]

[msg.section_0.entries.14]
text = [
  "[VAR TRNAME(1)]: Wait!\\c\\n",
  "I was just in the Pokémon Center,\\n",
  "and there wasn't anyone like that there.\\c$",
]

[msg.section_0.entries.15]
text = [
  "[VAR TRNAME(1)]: The Trainers' School\\n",
  "was just finished!\\c\\n",
  "No one is allowed inside until a\\n",
  "Teacher, or better said, a Gym Leader,\\l\\n",
  "starts working there!\\c$",
]

[msg.section_0.entries.16]
text = [
  "[VAR TRNAME(1)]: That goes to Route 19.\\c\\n",
  "If we don't find Bianca here in town,\\n",
  "I'll go check it for you!\\c\\n",
  "'Cause I already have a Pokémon!\\c$",
]

[msg.section_0.entries.17]
text = [
  "[VAR TRNAME(1)]: Oh, I get it!\\c\\n",
  "The outlook is Aspertia's\\n",
  "most famous spot!\\c\\n",
  "I'll bet Bianca is up there\\n",
  "looking at the scenery!\\c\\n",
  "C'mon!\\n",
  "Go get your Pokémon already!\\c$",
]

[msg.section_0.entries.18]
text = [
  "[VAR TRNAME(1)]: Listen, there's no way\\n",
  "I got this wrong!$",
]

[msg.section_0.entries.19]
text = [
  "[VAR TRNAME(1)]: Listen, there's no way\\n",
  "I got this wrong!\\c$",
]

[msg.section_0.entries.20]
text = [
  "???: It's sooo pretty!\\c$",
]

[msg.section_0.entries.21]
text = [
  "Hey there!\\n",
  "Don't you agree?\\c$",
]

[msg.section_0.entries.22]
text = [
  "Oh!\\n",
  "My name is Bianca!\\c\\n",
  "I'm the assistant of the\\n",
  "Pokémon Professor--Professor Juniper.\\c\\n",
  "By the way, I'm looking for someone.\\n",
  "Do you know a person named [VAR TRNAME(0)]?$",
]

[msg.section_0.entries.23]
text = [
  "Oh, wait!\\n",
  "You're [VAR TRNAME(0)]!\\c\\n",
  "Wooow! You're ex-act-ly like\\n",
  "what I heard!\\c$",
]

[msg.section_0.entries.24]
text = [
  "Oh, wait!\\n",
  "You're [VAR TRNAME(0)]!\\c\\n",
  "Wooow! You're ex-act-ly like\\n",
  "what I heard!\\c$",
]

[msg.section_0.entries.25]
text = [
  "                                           $$",
]

[msg.section_0.entries.26]
text = [
  "Bianca: Nice to meet you!\\c\\n",
  "I have a really important request\\n",
  "to ask you!\\c\\n",
  "Will you help us complete\\n",
  "the Pokédex?$",
]

[msg.section_0.entries.27]
text = [
  "Oh, wow, thanks!\\c\\n",
  "Your support will help Professor\\n",
  "Juniper's research move forward!\\c\\n",
  "Anyway, filling up the\\n",
  "Pokédex is totally fun!$",
]

[msg.section_0.entries.28]
text = [
  "N-no way...\\c\\n",
  "I-I must have misheard you.\\n",
  "Right?\\c\\n",
  "This is a very important request.\\c\\n",
  "Will you please help us complete\\n",
  "the Pokédex?$",
]

[msg.section_0.entries.29]
text = [
  "[VAR TRNAME(1)]: See!\\n",
  "Bianca was here, right?\\c\\n",
  "Now, c'mon!\\n",
  "Go and get your Pokémon!$",
]

[msg.section_0.entries.30]
text = [
  "[VAR TRNAME(1)]: See!\\n",
  "Bianca was here, right?\\c\\n",
  "Now, c'mon!\\n",
  "Go and get your Pokémon!\\c$",
]

[msg.section_0.entries.31]
text = [
  "Bianca: OK, then!\\c\\n",
  "Ta-daaa!\\c\\n",
  "In here is the Pokémon\\n",
  "that will be your partner!\\c$",
]

[msg.section_0.entries.32]
text = [
  "                                              $$",
]

[msg.section_0.entries.33]
text = [
  "                                             $$",
]

[msg.section_0.entries.34]
text = [
  "                                             $$",
]

[msg.section_0.entries.35]
text = [
  "[CENTER]The Water-type Pokémon\\n",
  "[CENTER][VAR PKNAME(1)]$",
]

[msg.section_0.entries.36]
text = [
  "[CENTER]The Fire-type Pokémon\\n",
  "[CENTER][VAR PKNAME(1)]$",
]

[msg.section_0.entries.37]
text = [
  "[CENTER]The Grass-type Pokémon\\n",
  "[CENTER][VAR PKNAME(1)]$",
]

[msg.section_0.entries.38]
text = [
  "Choose a Pokémon.$",
]

[msg.section_0.entries.39]
text = [
  "Is this the Pokémon you want?$",
]

[msg.section_0.entries.40]
text = [
  "Pick this one!$",
]

[msg.section_0.entries.41]
text = [
  "YES$",
]

[msg.section_0.entries.42]
text = [
  "NO$",
]

[msg.section_0.entries.43]
text = [
  "[VAR TRNAME(0)] chose [VAR PKNAME(1)]!$",
]

[msg.section_0.entries.44]
text = [
  "Bianca: Oh, wow! You and [VAR PKNAME(2)]\\n",
  "are a perfect match!\\c\\n",
  "By the way, would you like to give\\n",
  "a nickname to the Pokémon you chose?$",
]

[msg.section_0.entries.45]
text = [
  "Bianca: Oh, OK, gotcha.\\n",
  "You're not going to give it a nickname.\\c$",
]

[msg.section_0.entries.46]
text = [
  "Bianca: [VAR PKNICK(0)]!\\n",
  "Is that the nickname you want?$",
]

[msg.section_0.entries.47]
text = [
  "Bianca: [VAR PKNICK(0)]!\\n",
  "That is such a great name!\\c$",
]

[msg.section_0.entries.48]
text = [
  "Bianca: Now you've got your Pokémon,\\n",
  "so I'll give you this, too--a Pokédex!\\c$",
]

[msg.section_0.entries.49]
text = [
  "[VAR TRNAME(0)] received\\n",
  "the [COLOR(2)]Pokédex[COLOR(0)]!$",
]

[msg.section_0.entries.50]
text = [
  "Bianca: You want to know what it does?\\c\\n",
  "The Pokédex is a high-tech device\\n",
  "that automatically records the\\l\\n",
  "Pokémon you encounter!\\c\\n",
  "So Professor Juniper wants you to carry\\n",
  "this Pokédex, visit a lot of places, and\\l\\n",
  "meet all the Pokémon in the Unova region!$",
]

[msg.section_0.entries.51]
text = [
  "Still, that Professor Juniper!\\c\\n",
  "The normal thing to do is to\\n",
  "get an OK before sending\\l\\n",
  "someone clear out here, right?$",
]

[msg.section_0.entries.52]
text = [
  "[VAR TRNAME(1)]: Heeey! How long are you\\n",
  "planning on keeping me waiting, anyway?\\c\\n",
  "Hey! What's that?\\c$",
]

[msg.section_0.entries.53]
text = [
  "So that's your partner, huh?\\c\\n",
  "That's great!\\c\\n",
  "My sister already said so, but\\n",
  "take really, really good care\\l\\n",
  "of your Pokémon! Got it?\\c\\n",
  "What's that you're holding there?\\c$",
]

[msg.section_0.entries.54]
text = [
  "Bianca: It's a Pokédex!\\c$",
]

[msg.section_0.entries.55]
text = [
  "[VAR TRNAME(1)]: Please give me\\n",
  "a Pokédex, too!\\c\\n",
  "I want to get stronger!\\c\\n",
  "If I have a Pokédex,\\n",
  "I can learn more about Pokémon...\\l\\n",
  "That'll make me tougher, right?\\c$",
]

[msg.section_0.entries.56]
text = [
  "Bianca: Um...who are you again?\\c$",
]

[msg.section_0.entries.57]
text = [
  "I'm [VAR TRNAME(1)]!\\c\\n",
  "I'm going to travel the Unova region\\n",
  "with my Pokémon partner in order\\l\\n",
  "to search for something very important!\\c$",
]

[msg.section_0.entries.58]
text = [
  "Bianca: Well, OK!\\c\\n",
  "I don't really get it, but going\\n",
  "on a journey is always good!\\c\\n",
  "Anyway, I just happen to have\\n",
  "another Pokédex on me!\\c\\n",
  "It looks like Pokémon distribution has\\n",
  "really changed compared to two years\\l\\n",
  "ago, so the more, the merrier!\\c$",
]

[msg.section_0.entries.59]
text = [
  "Bianca: Ooh, I thought of something cool!\\c\\n",
  "You both have Pokémon, right?\\n",
  "Why don't you have a Pokémon battle?$",
]

[msg.section_0.entries.60]
text = [
  "[VAR TRNAME(1)]: Let's see how good\\n",
  "a Trainer you are!\\c\\n",
  "I'll use my [VAR PKNAME(3)]\\n",
  "that I raised from an Egg!\\c$",
]

[msg.section_0.entries.61]
text = [
  "[VAR TRNAME(1)]: I lost...\\n",
  "This is different than battling\\l\\n",
  "with wild Pokémon!\\c\\n",
  "Well, whatever.\\n",
  "I'm just happy to know you're\\l\\n",
  "a Trainer I can count on!\\c\\n",
  "Cool. I'm heading off first!\\n",
  "Get stronger!\\c$",
]

[msg.section_0.entries.62]
text = [
  "[VAR TRNAME(1)]: That was good enough\\n",
  "for your first battle!\\c\\n",
  "Cool. I'm heading off first!\\n",
  "Get stronger!\\c$",
]

[msg.section_0.entries.63]
text = [
  "Bianca: The Pokémon on both\\n",
  "sides did their best!\\c\\n",
  "But this little one is still weak,\\n",
  "so battle with it and make it stronger!\\c$",
]

[msg.section_0.entries.64]
text = [
  "All righty, let's go make your Pokémon\\n",
  "better at the Pokémon Center!\\c\\n",
  "It's like the best place ever for\\n",
  "Pokémon who battle and get hurt!\\c$",
]

[msg.section_0.entries.65]
text = [
  "Bianca: The Pokémon Center is the\\n",
  "same no matter where you are!\\c\\n",
  "Let's go inside!\\c$",
]

[msg.section_0.entries.66]
text = [
  "Mom: Oh! Nice to meet you!\\n",
  "You must be Bianca, right?\\c\\n",
  "And [VAR TRNAME(0)] picked\\n",
  "[VAR PKNAME(2)], then!\\c\\n",
  "Hee hee.\\n",
  "Looking good!\\c$",
]

[msg.section_0.entries.67]
text = [
  "Oh!\\n",
  "I almost forgot!\\c\\n",
  "Here! Take these!\\n",
  "They're Running Shoes!\\c$",
]

[msg.section_0.entries.68]
text = [
  "[VAR TRNAME(0)] received\\n",
  "a pair of [COLOR(2)]Running Shoes[COLOR(0)]!$",
]

[msg.section_0.entries.69]
text = [
  "Mom: A perfect fit!\\n",
  "I'll read the instructions to you!\\c\\n",
  "“Hold the B Button to run faster than\\n",
  "normal. Put on the Running Shoes and\\l\\n",
  "race around to your heart's content!\\\"\\c\\n",
  "Now, you and [VAR PKNAME(2)] can\\n",
  "run anywhere you want!\\c$",
]

[msg.section_0.entries.70]
text = [
  "[VAR TRNAME(1)]'s Sister: Um...\\n",
  "This is from me!\\c$",
]

[msg.section_0.entries.71]
text = [
  "                           $$",
]

[msg.section_0.entries.72]
text = [
  "Bianca: Why are there\\n",
  "two Town Maps?\\c$",
]

[msg.section_0.entries.73]
text = [
  "[VAR TRNAME(1)]'s Sister: I want you to\\n",
  "give the other one to my big brother!\\c$",
]

[msg.section_0.entries.74]
text = [
  "Mom: That's a good idea! Even if it is\\n",
  "a single road to the ocean, having a\\l\\n",
  "Town Map is always nice.\\c\\n",
  "I mean, if you use a Town Map,\\n",
  "you'll know all about what the\\l\\n",
  "Unova region is like!\\c$",
]

[msg.section_0.entries.75]
text = [
  "Bianca: Aww, you guys!\\n",
  "Just watching this makes me happy!\\c\\n",
  "C'mon, we're headed for Route 19!\\n",
  "I'll teach you how to catch a Pokémon!\\c$",
]

[msg.section_0.entries.76]
text = [
  "Mom: Bon voyage!\\c\\n",
  "Take [VAR PKNAME(2)] and go see\\n",
  "many different Pokémon and\\l\\n",
  "people with your own eyes!$",
]

[msg.section_0.entries.77]
text = [
  "[VAR TRNAME(1)]'s Sister: Get along\\n",
  "with your Pokémon!$",
]

[msg.section_0.entries.78]
text = [
  "Bianca: Heeey!\\c$",
]

[msg.section_0.entries.79]
text = [
  "Bianca: Yoo-hoo!\\c$",
]

[msg.section_0.entries.80]
text = [
  "How was it?\\n",
  "How did your Pokémon battle with\\l\\n",
  "the Gym Leader go?\\c\\n",
  "Oh! If it isn't the Basic Badge!\\c\\n",
  "Wow! Amazing! And you just set off\\n",
  "on your journey with your Pokémon!\\c\\n",
  "You definitely have potential\\n",
  "as a Trainer! I'm sure of it!\\c\\n",
  "This is from me!\\n",
  "It's the TM for the move Return.\\c$",
]

[msg.section_0.entries.81]
text = [
  "When a Pokémon knows Return,\\n",
  "the more it gets along with the Trainer,\\l\\n",
  "the more powerful the move is!\\c$",
]

[msg.section_0.entries.82]
text = [
  "Still, that Cheren...\\c$",
]

[msg.section_0.entries.83]
text = [
  "Cheren: Bianca!\\c\\n",
  "It's been two years, hasn't it?\\c$",
]

[msg.section_0.entries.84]
text = [
  "Bianca: Oh wow!\\c$",
]

[msg.section_0.entries.85]
text = [
  "Wh-what's up?\\c$",
]

[msg.section_0.entries.86]
text = [
  "Cheren: I thought it would be a\\n",
  "good idea to register each other\\l\\n",
  "in the Xtransceiver!\\c$",
]

[msg.section_0.entries.87]
text = [
  "Now, you can communicate\\n",
  "with me from your Xtransceiver.\\c$",
]

[msg.section_0.entries.88]
text = [
  "Bianca: M-me, too!\\c$",
]

[msg.section_0.entries.89]
text = [
  "I registered Professor Juniper\\n",
  "for you, too!\\c$",
]

[msg.section_0.entries.90]
text = [
  "The Xtransceiver is ringing!$",
]

[msg.section_0.entries.91]
text = [
  "[VAR TRNAME(0)] picked up the\\n",
  "Xtransceiver!\\c$",
]

[msg.section_0.entries.92]
text = [
  "Bianca: Hey, [VAR TRNAME(0)]!\\n",
  "Isn't Professor Juniper cool?\\c\\n",
  "If you talk to her on the Xtransceiver,\\n",
  "she'll evaluate the completeness\\l\\n",
  "of your Pokédex or tell you a lot about\\l\\n",
  "how Pokémon evolve!\\c\\n",
  "And you can call us, too, of course!\\c$",
]

[msg.section_0.entries.93]
text = [
  "I'll tell you how well\\n",
  "you and your Pokémon\\l\\n",
  "are getting along, OK?!\\c$",
]

[msg.section_0.entries.94]
text = [
  "Cheren: Bianca makes a good point.\\c\\n",
  "I'll tell you what I know about Pokémon\\n",
  "Abilities and Pokémon type matchups.\\c$",
]

[msg.section_0.entries.95]
text = [
  "[VAR TRNAME(1)]: Are you the Gym Leader?\\n",
  "One, two, three--let's battle!\\c$",
]

[msg.section_0.entries.96]
text = [
  "Cheren: You look like a tough Trainer.\\c\\n",
  "Understood.\\n",
  "Please come into my Pokémon Gym!\\c$",
]

[msg.section_0.entries.97]
text = [
  "[VAR TRNAME(1)]: What was that weak answer?!\\n",
  "I'm definitely going to take you down!\\c$",
]

[msg.section_0.entries.98]
text = [
  "Bianca: Being a Gym Leader\\n",
  "is even harder than I imagined.\\c$",
]

[msg.section_0.entries.99]
text = [
  "The next thing is to make it so you\\n",
  "can use the C-Gear.\\c\\n",
  "The C-Gear is a cool device for\\n",
  "communications, such as Infrared\\l\\n",
  "Connection or Nintendo Wi-Fi Connection.\\c$",
]

[msg.section_0.entries.100]
text = [
  "[VAR TRNAME(0)] obtained\\n",
  "the [COLOR(1)]C-Gear[COLOR(0)]!$",
]

[msg.section_0.entries.101]
text = [
  "Turn on the C-Gear and\\n",
  "establish communications?$",
]

[msg.section_0.entries.102]
text = [
  "YES$",
]

[msg.section_0.entries.103]
text = [
  "NO$",
]

[msg.section_0.entries.104]
text = [
  "Some functions of the C-Gear\\n",
  "will be restricted. Is that OK?$",
]

[msg.section_0.entries.105]
text = [
  "Wireless communications\\n",
  "are turned OFF.\\c\\n",
  "Turn wireless communications\\n",
  "ON in the System Settings.\\l\\n",
  "Error code: 50699\\c$",
]

[msg.section_0.entries.106]
text = [
  "Check this! The C-Gear was activated,\\n",
  "and that screen showed up!\\c\\n",
  "If you touch the “?\\\" icon in the\\n",
  "bottom-right corner of the\\l\\n",
  "C-Gear screen, you can read about\\l\\n",
  "the C-Gear.\\c\\n",
  "Like, what are you going to do now?\\n",
  "You know, there's another Pokémon Gym\\l\\n",
  "in Virbank City, which is just past\\l\\n",
  "Floccesy Town.$",
]

[msg.section_0.entries.107]
text = [
  "If you want to turn on the C-Gear, touch\\n",
  "the Power symbol at the bottom right of\\l\\n",
  "the C-Gear screen.\\c\\n",
  "Then, after turning on the power,\\n",
  "if you touch the “?\\\" icon in the\\l\\n",
  "bottom-right corner of the\\l\\n",
  "C-Gear screen, you can read about\\l\\n",
  "the C-Gear.\\c\\n",
  "Like, what are you going to do now?\\n",
  "You know, there's another Pokémon Gym\\l\\n",
  "in Virbank City, which is just past\\l\\n",
  "Floccesy Town.$",
]

[msg.section_0.entries.108]
text = [
  "[VAR TRNAME(1)]: Hey! My sis has something\\n",
  "she wants to tell you!\\c$",
]

[msg.section_0.entries.109]
text = [
  "[VAR TRNAME(1)]'s Sister: Um...\\n",
  "[VAR TRNAME(0)]...\\c\\n",
  "My Purrloin...\\c\\n",
  "It evolved, but thank you\\n",
  "very much for finding it!\\c$",
]

[msg.section_0.entries.110]
text = [
  "[VAR TRNAME(1)]: There's more, right?\\c$",
]

[msg.section_0.entries.111]
text = [
  "[VAR TRNAME(1)]'s Sister: Um...\\n",
  "[VAR TRNAME(0)]...\\c\\n",
  "These days, I've been having\\n",
  "dreams about a Pokémon.\\l\\n",
  "A Pokémon called Zoroark.\\c\\n",
  "It was calling your name, [VAR TRNAME(0)]!\\c$",
]

[msg.section_0.entries.112]
text = [
  "[VAR TRNAME(1)]: I don't really get it,\\n",
  "but I hear that the Zoroark from her\\l\\n",
  "dreams is on Victory Road!\\c\\n",
  "That's what she wanted to say.\\n",
  "Be seeing you!\\c$",
]

[msg.section_0.entries.113]
text = [
  "Oh! Almost forgot.\\c\\n",
  "Congrats on becoming the Champion!\\c\\n",
  "I called it!\\n",
  "You've got good instincts!\\c$",
]

[msg.section_0.entries.114]
text = [
  "Trainers are the ones who\\n",
  "have their Pokémon partners battle.\\c\\n",
  "I hear Gym Leaders are\\n",
  "really strong Trainers!$",
]

[msg.section_0.entries.115]
text = [
  "So about the Gym Leader Cheren...\\c\\n",
  "A few years ago he traveled all over\\n",
  "the Unova region with his Pokémon.$",
]

[msg.section_0.entries.116]
text = [
  "I wish the Trainers' School\\n",
  "would hurry up and open!\\c\\n",
  "There's so much about\\n",
  "Pokémon I want to know!$",
]

[msg.section_0.entries.117]
text = [
  "I know lots about Pokémon!\\c\\n",
  "'Cause I learned so much\\n",
  "at the Trainers' School!$",
]

[msg.section_0.entries.118]
text = [
  "The view of Route 19\\n",
  "from the outlook is\\l\\n",
  "Aspertia City's pride and joy.$",
]

[msg.section_0.entries.119]
text = [
  "The power of science is amazing!\\c\\n",
  "Now you can use communications\\n",
  "to play with a hundred people\\l\\n",
  "at the same time!$",
]

[msg.section_0.entries.120]
text = [
  "People go on journeys and become adults.\\n",
  "Maybe I should leave this city, too...$",
]

[msg.section_0.entries.121]
text = [
  "Sometimes wild Pokémon attack people!\\c\\n",
  "But the ones you befriend, the ones that\\n",
  "stay by your side, are Pokémon, too!$",
]

[msg.section_0.entries.122]
text = [
  "Your mom's really good at\\n",
  "getting Pokémon to rest\\l\\n",
  "and making them feel better!$",
]

[msg.section_0.entries.123]
text = [
  "Oh, hi!\\c\\n",
  "Why, Aurea Juniper!\\c\\n",
  "It's been far too long!\\n",
  "What can I do for you?\\c\\n",
  "...\\c\\n",
  "Wow! A Pokédex...\\n",
  "For my child?\\c\\n",
  "Why, that's great! I think a journey\\n",
  "would be a wonderful experience!\\c$",
]

[msg.section_0.entries.124]
text = [
  "What now? She's already here?\\c\\n",
  "Oh, for Pete's sake.\\n",
  "You never change.\\c\\n",
  "Once you've decided on something,\\n",
  "you just start going.\\c\\n",
  "OK! Bianca, right?\\n",
  "A big, green hat. Got it.\\c\\n",
  "OK!\\n",
  "No worries!\\c$",
]

[msg.section_0.entries.125]
text = [
  "This is Aspertia City.\\n",
  "A city that reaches for the sky.$",
]

[msg.section_0.entries.126]
text = [
  "[VAR TRNAME(0)]'s House$",
]

[msg.section_0.entries.127]
text = [
  "Aspertia City Outlook Ahead\\n",
  "Unova Unfolds before Your Eyes$",
]

[msg.section_0.entries.128]
text = [
  "Trainers' School\\n",
  "Under Construction$",
]

[msg.section_0.entries.129]
text = [
  "Aspertia City Pokémon Gym\\n",
  "Gym Leader: Cheren\\l\\n",
  "The one who seeks the right path.$",
]

[msg.section_0.entries.130]
text = [
  "Let's go!$",
]

[msg.section_0.entries.2]
text = [
  "What do you like on TV?\\n",
  "I like the lady and Watchy Watchog!$",
]

[msg.section_0.entries.3]
text = [
  "Once when I tried to catch a Pokémon,\\n",
  "the Poké Ball only shook once!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Oh! That does happen sometimes!\\c\\n",
  "I've just been calling it a\\n",
  "critical capture!\\c\\n",
  "The more Pokémon you catch,\\n",
  "the more likely that phenomenon is!\\c\\n",
  "Apparently, when the Poké Ball\\n",

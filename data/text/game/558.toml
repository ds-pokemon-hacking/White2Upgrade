[msg.section_0.entries.3]
text = [
  "There is an old legend about this place.\\c\\n",
  "Long ago, when a war between people\\n",
  "started an intense fire in this forest,\\l\\n",
  "a single young Pokémon was separated\\l\\n",
  "from its parents.\\c\\n",
  "Cobalion, Terrakion, and Virizion\\n",
  "teamed up to take care of this Pokémon.\\c\\n",
  "I wonder what that young Pokémon\\n",
  "grew up to be like...$",
]

[msg.section_0.entries.4]
text = [
  "Ooh! That Pokémon! It couldn't be...\\c\\n",
  "A bright red mane...and a lush tail...and\\n",
  "a single, noble horn!\\c\\n",
  "It's exactly like the old legend!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Ooh! That Pokémon! It couldn't be...\\c\\n",
  "A bright red mane...and a lush tail...\\n",
  "And it even has a horn more magnificent\\l\\n",
  "than in the old legend!\\c$",
]

[msg.section_0.entries.6]
text = [
  "Long ago, when a war between people\\n",
  "started an intense fire in this forest,\\l\\n",
  "a single young Pokémon was separated\\l\\n",
  "from its parents.\\c\\n",
  "Cobalion, Terrakion, and Virizion\\n",
  "teamed up to take care of this Pokémon.\\c$",
]

[msg.section_0.entries.7]
text = [
  "The three acted as its parents and\\n",
  "taught it the knowledge and the moves\\l\\n",
  "it needed to survive...\\c$",
]

[msg.section_0.entries.8]
text = [
  "The young Pokémon grew rapidly and\\n",
  "developed a power that surpassed its\\l\\n",
  "three caretakers.\\c\\n",
  "However... One day, that Pokémon\\n",
  "disappeared from the forest.\\c\\n",
  "No one knows why.\\n",
  "But when I think about it...\\c\\n",
  "Young ones are always reckless and\\n",
  "drawn to adventure...$",
]


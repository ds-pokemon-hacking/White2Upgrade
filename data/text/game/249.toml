[msg]
trailing_data = "9494"

[msg.section_0.entries.0]
text = [
  "Clay: Here we are!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Whaddya think?\\n",
  "Great buildin', huh?\\c\\n",
  "Here's where the Pokémon World\\n",
  "Tournament takes place!\\l\\n",
  "Ain't she purty?\\c\\n",
  "Follow me, tads!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Cheren: I barely recognized\\n",
  "you and [VAR TRNAME(0)].\\c\\n",
  "You two are way different from when\\n",
  "we battled in Aspertia City!\\c\\n",
  "Traveling with Pokémon makes\\n",
  "everyone grow so much...\\c$",
]

[msg.section_0.entries.3]
text = [
  "[VAR TRNAME(1)]: What was that just now?!\\c$",
]

[msg.section_0.entries.4]
text = [
  "I'm going after him!\\n",
  "[VAR TRNAME(0)], come with me!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Stop.\\c$",
]

[msg.section_0.entries.6]
text = [
  "Colress: There's no reason\\n",
  "for you to stick your necks into\\l\\n",
  "something so dangerous!\\c$",
]

[msg.section_0.entries.7]
text = [
  "[VAR TRNAME(1)]: The Pokémon I'm looking\\n",
  "for--my little sister's Purrloin--it\\l\\n",
  "might be with them!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Cheren: I'm going, too!\\c\\n",
  "I've got his back!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Colress: I don't understand.\\n",
  "That's not courage, it's recklessness!\\c\\n",
  "Does he think anything is possible simply\\n",
  "because he has Pokémon with him?\\c\\n",
  "No, no...\\n",
  "That's not possible.\\c\\n",
  "All Trainers and Pokémon are bound\\n",
  "to one another by Poké Balls...\\c\\n",
  "Then maybe it is this bond that will allow\\n",
  "Trainers to overcome the impossible if\\l\\n",
  "they trust their partner Pokémon.\\c$",
]

[msg.section_0.entries.10]
text = [
  "Colress: Trust...\\n",
  "It's too much of an unknown factor.\\c\\n",
  "But if believing in your Pokémon\\n",
  "gives you the courage to stand up\\l\\n",
  "to Team Plasma...\\c\\n",
  "And the courage to help your friends...\\c\\n",
  "Then follow them south to the dock!$",
]

[msg.section_0.entries.11]
text = [
  "[VAR TRNAME(1)]: The Shadow Triad?\\n",
  "What's their deal, anyway!\\c\\n",
  "AAAAH!\\n",
  "Team Plasma! Where did you vanish to!\\c$",
]

[msg.section_0.entries.12]
text = [
  "Cheren: The Shadow Triad...\\c\\n",
  "With their superhuman powers, they\\n",
  "can immobilize people and then disappear!\\c\\n",
  "But I'm more concerned with what\\n",
  "Zinzolin said...\\c\\n",
  "“Once again, we will use the\\n",
  "legendary Dragon-type Pokémon\\l\\n",
  "and we will rule the Unova region!\\\"\\l\\n",
  "What could that mean?\\c\\n",
  "The legendary Dragon-type Pokémon\\n",
  "Reshiram and Zekrom\\l\\n",
  "aren't in Unova anymore...\\c$",
]

[msg.section_0.entries.13]
text = [
  "[VAR TRNAME(0)].\\c\\n",
  "There's something I want to look into,\\n",
  "so I'm going to head to Route 6!\\c\\n",
  "Be careful out there!\\c$",
]

[msg.section_0.entries.14]
text = [
  "A helmet is an important tool for\\n",
  "shock protection!\\c\\n",
  "It's good to let your Pokémon\\n",
  "have one, too!\\c$",
]

[msg.section_0.entries.15]
text = [
  "If you let a Pokémon hold a Rocky Helmet,\\n",
  "the foe will also be damaged if that foe's\\l\\n",
  "move makes physical contact.$",
]

[msg.section_0.entries.16]
text = [
  "       $$",
]

[msg.section_0.entries.17]
text = [
  "Water Pledge,\\n",
  "Fire Pledge,\\l\\n",
  "and Grass Pledge.\\c\\n",
  "When combinations of these\\n",
  "three moves are used in battle,\\l\\n",
  "special things happen!$",
]

[msg.section_0.entries.18]
text = [
  "       $$",
]

[msg.section_0.entries.19]
text = [
  "       $$",
]

[msg.section_0.entries.20]
text = [
  "       $$",
]

[msg.section_0.entries.21]
text = [
  "My husband can teach some Pokémon the\\n",
  "ultimate moves! I'll tell you their names.\\c\\n",
  "The blazing Fire-type Pokémon:\\n",
  "Charizard, Typhlosion, Blaziken,\\l\\n",
  "Infernape, and Emboar!\\c\\n",
  "The restless Water-type Pokémon:\\n",
  "Blastoise, Feraligatr, Swampert,\\l\\n",
  "Empoleon, and Samurott!\\c\\n",
  "The quiet Grass-type Pokémon:\\n",
  "Venusaur, Meganium, Sceptile,\\l\\n",
  "Torterra, and Serperior!$",
]

[msg.section_0.entries.22]
text = [
  "What kind of Trainers will come?\\n",
  "What kind of battle will it be?$",
]

[msg.section_0.entries.23]
text = [
  "When battling in front of people,\\n",
  "it's well known that you should stand\\l\\n",
  "your ground and not dance around.\\c\\n",
  "But I can't resist moves that groove,\\n",
  "like Petal Dance, Quiver Dance,\\l\\n",
  "Fiery Dance, and Dragon Dance.\\c\\n",
  "And on rare occasions, even Lunar Dance!$",
]

[msg.section_0.entries.24]
text = [
  "The crowd will go wild for my Pokémon!$",
]

[msg.section_0.entries.25]
text = [
  "Isn't it wonderful how people\\n",
  "challenging themselves helps\\l\\n",
  "bring the world together!$",
]

[msg.section_0.entries.26]
text = [
  "When a Pokémon learns the move\\n",
  "Hidden Power, somehow I can tell\\l\\n",
  "what type that move will be!\\c\\n",
  "Should I tell you what type of\\n",
  "Hidden Power your Pokémon will learn?$",
]

[msg.section_0.entries.27]
text = [
  "Now that I'm aware of my hidden power,\\n",
  "I can tell you what type of Hidden Power\\l\\n",
  "your Pokémon will learn!\\l\\n",
  "Do you want to know?$",
]

[msg.section_0.entries.28]
text = [
  "If this Pokémon were to learn\\n",
  "Hidden Power, the move's type\\l\\n",
  "would be [VAR TYPE(0)]!$",
]

[msg.section_0.entries.29]
text = [
  "The type of this Pokémon's\\n",
  "Hidden Power is [VAR TYPE(0)]!$",
]

[msg.section_0.entries.30]
text = [
  "If you want to know, ask me, and I'll\\n",
  "activate my hidden power for you!$",
]

[msg.section_0.entries.31]
text = [
  "It's not possible for an Egg to use\\n",
  "Hidden Power!$",
]

[msg.section_0.entries.32]
text = [
  "I'm sorry, but this Pokémon can't learn\\n",
  "to use Hidden Power.$",
]

[msg.section_0.entries.33]
text = [
  "That cave down there\\n",
  "is the Relic Passage!\\c\\n",
  "It was recently discovered,\\n",
  "but amazingly, it's...\\c\\n",
  "Wait? Where was it\\n",
  "connected to again?$",
]

[msg.section_0.entries.34]
text = [
  "A ship's only really a ship when\\n",
  "it's crossing an ocean.\\l\\n",
  "Docked ships sure look lonely.$",
]

[msg.section_0.entries.35]
text = [
  "       $$",
]

[msg.section_0.entries.36]
text = [
  "The Pokémon World Tournament\\n",
  "aka the PWT\\l\\n",
  "Call it what you like!$",
]

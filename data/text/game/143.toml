[msg.section_0.entries.0]
text = [
  "I was Iris's coach!\\c\\n",
  "Even from the day Iris came here,\\n",
  "she was so much stronger than me!\\c\\n",
  "Now, I wouldn't stand a chance!$",
]

[msg.section_0.entries.1]
text = [
  "Even Drayden can't handle a\\n",
  "strange situation like this alone...$",
]

[msg.section_0.entries.2]
text = [
  "Drayden teaches the move Draco Meteor.\\n",
  "It's the strongest Dragon-type move.\\c\\n",
  "But the Special Attack of the Pokémon\\n",
  "that uses it drops sharply.$",
]

[msg.section_0.entries.3]
text = [
  "Concerned about your Pokémon's weight?\\c\\n",
  "You don't need to put it on a diet!\\n",
  "Just let it hold this.\\c$",
]

[msg.section_0.entries.4]
text = [
  "The weight of a Pokémon holding a\\n",
  "Float Stone will be halved!\\c\\n",
  "That way, you can reduce the damage\\n",
  "caused by weight-based moves such as\\l\\n",
  "Low Kick and Grass Knot.$",
]

[msg.section_0.entries.5]
text = [
  "Wh-what's going\\n",
  "to happen to Opelucid City?$",
]

[msg.section_0.entries.6]
text = [
  "I have an item that I don't know how to\\n",
  "use. Would you give it a try and see if\\l\\n",
  "you can make it work?$",
]

[msg.section_0.entries.7]
text = [
  "I know...\\n",
  "You'll also have trouble figuring it out.$",
]

[msg.section_0.entries.8]
text = [
  "You may be able to master it. Here it is!\\c$",
]

[msg.section_0.entries.9]
text = [
  "If a Pokémon holds a Ring Target, it can\\n",
  "be hit even by a move that would usually\\l\\n",
  "have no effect.\\c\\n",
  "For example, a Normal-type move would\\n",
  "hit a Ghost-type Pokémon.\\c\\n",
  "Mastering this item is a bit tough...\\n",
  "Actually, it's very tough, but think\\l\\n",
  "how useful it could be!$",
]

[msg.section_0.entries.10]
text = [
  "It's cold...\\c\\n",
  "And Dragon types really don't like cold!$",
]

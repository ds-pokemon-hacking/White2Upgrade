[msg]
trailing_data = "dede"

[msg.section_0.entries.0]
text = [
  "Cheren: Hey, nice timing!\\c\\n",
  "I heard that Team Plasma was seen\\n",
  "in Pinwheel Forest...\\c\\n",
  "Could you help me look for them?$",
]

[msg.section_0.entries.1]
text = [
  "We don't know how many there are,\\n",
  "so splitting up doesn't seem like\\l\\n",
  "a very good tactic.\\c\\n",
  "Got it! I'll wait here until\\n",
  "you're ready to go!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Thank you!\\c\\n",
  "This is a good opportunity for me\\n",
  "to see up close what you can really do.\\l\\n",
  "I suppose I'll follow your lead.\\c\\n",
  "Leave recovery to me!\\c$",
]

[msg.section_0.entries.3]
text = [
  "Cheren: Stop!\\c\\n",
  "If you go past here, we'll leave\\n",
  "the Pinwheel Forest.\\c\\n",
  "We still haven't found Team Plasma,\\n",
  "but do you need to leave for a minute?$",
]

[msg.section_0.entries.4]
text = [
  "Cheren: Team Plasma was seen inside\\n",
  "Pinwheel Forest...\\c\\n",
  "But you already know that.\\n",
  "Will you help me look for them?$",
]

[msg.section_0.entries.5]
text = [
  "People and Pokémon\\n",
  "each have their own strengths--\\l\\n",
  "the strength to realize dreams,\\l\\n",
  "and the strength to protect others...\\c\\n",
  "I'm sure N understands that now.$",
]

[msg.section_0.entries.6]
text = [
  "Team Plasma...\\n",
  "Or better said, Ghetsis...\\c\\n",
  "It's almost like, to him, there was\\n",
  "nothing else in the world but himself...$",
]

[msg.section_0.entries.7]
text = [
  "My ideal is to be strong...\\c\\n",
  "But there are many ways to be strong\\n",
  "in this world.\\c\\n",
  "Simply winning battles doesn't help\\n",
  "me find the ideal strength I desire.$",
]

[msg.section_0.entries.8]
text = [
  "You remind me of a friend of mine\\n",
  "whose strength was amazing.\\c\\n",
  "I wonder what that friend\\n",
  "is up to these days...$",
]

[msg.section_0.entries.9]
text = [
  "Still no sign of Team Plasma. Why don't we\\n",
  "head deeper into the forest?$",
]

[msg.section_0.entries.10]
text = [
  "                                                                                            $$",
]

[msg.section_0.entries.11]
text = [
  "                                                                            $$",
]

[msg.section_0.entries.12]
text = [
  "Gorm: Boo!\\c$",
]

[msg.section_0.entries.13]
text = [
  "I am Gorm. I was once one\\n",
  "of Team Plasma's Seven Sages.\\c$",
]

[msg.section_0.entries.14]
text = [
  "Cheren: Team Plasma's finished.\\c\\n",
  "Despite that, you still haven't given up?\\n",
  "Are you here planning something?\\c$",
]

[msg.section_0.entries.15]
text = [
  "Gorm: Wait one moment!\\n",
  "I have no plans to confront you.\\c\\n",
  "I don't mean to disappoint you,\\n",
  "but I doubt I'm a match for either\\l\\n",
  "of you in the first place...\\c\\n",
  "Hm?\\n",
  "What happened to your glasses?\\c\\n",
  "Excuse me, but that's not important.\\c\\n",
  "I learned of my old ally's recklessness,\\n",
  "and I had come here to admonish him...\\c\\n",
  "But the matter had already been\\n",
  "resolved, and this place made me think...\\c\\n",
  "What did we believe in that made\\n",
  "us try to steal the Dragon Skull?\\c$",
]

[msg.section_0.entries.16]
text = [
  "A man who has committed a mistake\\n",
  "and doesn't correct it\\l\\n",
  "is committing another mistake.\\c\\n",
  "Do you understand what this means?\\c\\n",
  "Avoiding all mistakes is impossible,\\n",
  "but not fixing mistakes you've made--\\l\\n",
  "that is truly foolish.\\c\\n",
  "That being said, this doesn't\\n",
  "really concern you, does it?\\c\\n",
  "Well then, Trainers, may you and your\\n",
  "Pokémon be well.\\c$",
]

[msg.section_0.entries.17]
text = [
  "Cheren: You know...\\c\\n",
  "If it wasn't for Ghetsis,\\n",
  "he might've chosen another path...\\c\\n",
  "Or maybe not. He was the one who\\n",
  "decided to follow Ghetsis, after all...\\c$",
]

[msg.section_0.entries.18]
text = [
  "That aside, thank you!\\c\\n",
  "Your help made this\\n",
  "investigation go smoothly.\\c\\n",
  "This is my thanks!\\n",
  "Come on, just take it!\\c$",
]

[msg.section_0.entries.19]
text = [
  "OK! Be seeing you!\\c$",
]

[msg.section_0.entries.20]
text = [
  "I'm going to do a lap around Unova\\n",
  "clockwise from Nimbasa City\\l\\n",
  "without healing my Pokémon!\\c\\n",
  "It's the Unova Spartan Marathon,\\n",
  "and next time, I'm going to race!$",
]

[msg.section_0.entries.21]
text = [
  "We're thinning trees to\\n",
  "protect the forest.\\c\\n",
  "That's why we're having Pokémon\\n",
  "cut down trees.\\c\\n",
  "When there are too many trees,\\n",
  "the whole forest gets weaker...\\c\\n",
  "These trees are being cut down\\n",
  "so the whole forest will thrive...$",
]

[msg.section_0.entries.22]
text = [
  "Ah, wouldn't it be nice if the Pokémon\\n",
  "living in the forest liked the sunbeams\\l\\n",
  "filtering through the leaves, too!$",
]

[msg.section_0.entries.23]
text = [
  "Hi, Trainer.\\c\\n",
  "If you have a Pokédex, could you show me\\n",
  "your Habitat List?\\c\\n",
  "I want to know about the Pokémon\\n",
  "that live in Pinwheel Forest.\\c$",
]

[msg.section_0.entries.24]
text = [
  "You still have many meetings\\n",
  "waiting for you...\\c\\n",
  "Tell me when you've encountered\\n",
  "all of the Pokémon in Pinwheel Forest.$",
]

[msg.section_0.entries.25]
text = [
  "Perfect!\\n",
  "This is my thanks!\\c$",
]

[msg.section_0.entries.26]
text = [
  "Finding the Pokémon that can\\n",
  "only be found in the rustling grass\\l\\n",
  "is really amazing!$",
]

[msg.section_0.entries.27]
text = [
  "The legendary Pokémon...\\n",
  "Is it true it was really beyond here?$",
]

[msg.section_0.entries.28]
text = [
  "The surface is covered with moss.\\n",
  "Touching it feels good somehow.$",
]

[msg.section_0.entries.29]
text = [
  "Trainer Tips!\\c\\n",
  "\\n",
  "A forest is likely to contain many\\n",
  "well-hidden items!\\c\\n",
  "They may be hard to find,\\n",
  "so look carefully!$",
]

[msg.section_0.entries.0]
text = [
  "    $$",
]

[msg.section_0.entries.1]
text = [
  "Hmmmm... What should I do?\\n",
  "I can't possibly manage everything.\\c$",
]

[msg.section_0.entries.2]
text = [
  "Hello there!\\c$",
]

[msg.section_0.entries.3]
text = [
  "Welcome to Join Avenue!\\c\\n",
  "We don't have anything yet, as you see,\\n",
  "so it's just an avenue at this point.\\c\\n",
  "Oh, where are my manners?\\n",
  "Allow me to introduce myself.\\c\\n",
  "I am the owner of Join Avenue.\\n",
  "My dream is to go around the world\\l\\n",
  "building avenues that bustle with\\l\\n",
  "lots of people.\\c\\n",
  "The problem is...I have no one\\n",
  "I can trust to manage the avenue.\\c\\n",
  "...\\n",
  "...\\c\\n",
  "Something just struck me!\\c\\n",
  "You seem to be a Trainer traveling\\n",
  "around, aren't you?\\c\\n",
  "You naturally meet people from\\n",
  "all over this region, don't you?\\c\\n",
  "I know it seems sudden, but will you\\n",
  "manage the avenue for me?$",
]

[msg.section_0.entries.4]
text = [
  "Thank you so much!\\c\\n",
  "OK, tell me what kind of a person you are.\\c\\n",
  "What would be your favorite phrase\\n",
  "that you'd use to greet everyone?\\c$",
]

[msg.section_0.entries.5]
text = [
  "I really need you to help me.\\n",
  "You know what that means, don't you?$",
]

[msg.section_0.entries.6]
text = [
  "That's a great line!\\c\\n",
  "Then what would you say when\\n",
  "something truly moves your heart?\\c\\n",
  "You want to choose something universal,\\n",
  "a phrase that anyone will understand,\\l\\n",
  "you know?\\c$",
]

[msg.section_0.entries.7]
text = [
  "[VAR JOINAVINPUT(0)]\\n",
  "[VAR JOINAVINPUT(1)]\\c\\n",
  "I knew it!\\n",
  "You are the one!\\c\\n",
  "Who else could be so well suited\\n",
  "to managing the avenue?\\c$",
]

[msg.section_0.entries.8]
text = [
  "Oh, I almost forgot.\\c$",
]

[msg.section_0.entries.9]
text = [
  "My assistants!\\c\\n",
  "You heard me. I must leave now, so\\n",
  "please support our newest manager.\\c$",
]

[msg.section_0.entries.10]
text = [
  "Yes, sir! Please take care of yourself.\\c$",
]

[msg.section_0.entries.11]
text = [
  "Pleased to meet you!\\c\\n",
  "How should we address you?\\c$",
]

[msg.section_0.entries.12]
text = [
  "[VAR 0x013A(0)]!\\c\\n",
  "Now that you are the one to manage\\n",
  "the development of the avenue,\\l\\n",
  "please turn it into a wonderful\\l\\n",
  "attraction where many people visit.\\c\\n",
  "I'll explain how to develop the avenue,\\n",
  "so please talk to me when you are ready.$",
]

[msg.section_0.entries.13]
text = [
  "[VAR 0x013A(0)]!\\c\\n",
  "We will explain what you need to know\\n",
  "to become truly superior in this role.$",
]

[msg.section_0.entries.14]
text = [
  "To make it more attractive,\\n",
  "you'll want useful city improvements.\\c\\n",
  "For example...shops!\\c\\n",
  "In order for you to make a shop,\\n",
  "you'll need someone who has a dream.\\l\\n",
  "You then have to “invite\\\" that person\\l\\n",
  "to join the avenue.\\c\\n",
  "Speaking of invitation,\\n",
  "someone is coming this way.\\c\\n",
  "Why don't you “invite\\\" that person?$",
]

[msg.section_0.entries.15]
text = [
  "Let's build a shop first.\\c\\n",
  "You need to talk to a person\\n",
  "in the avenue to “invite\\\" that person\\l\\n",
  "so you can have the person build a shop.$",
]

[msg.section_0.entries.16]
text = [
  "Congratulations!\\n",
  "You've just made your first shop!\\c\\n",
  "But having a shop means nothing\\n",
  "if you don't have any customers.\\c\\n",
  "You'll need to talk to a customer and\\n",
  "“recommend\\\" the shop.\\c\\n",
  "Speaking of recommendation,\\n",
  "someone is coming this way.\\c\\n",
  "Why don't you “recommend\\\" our shop?$",
]

[msg.section_0.entries.17]
text = [
  "Let's “recommend\\\" the shop to someone.$",
]

[msg.section_0.entries.18]
text = [
  "Congratulations!\\c\\n",
  "You've just recommended the shop, and\\n",
  "that made the popularity of\\l\\n",
  "the avenue go up!\\c\\n",
  "Raise the popularities of shops and the\\n",
  "avenue to make it famous!\\c\\n",
  "A good tip for bringing more customers\\n",
  "is to use the communication features.\\c\\n",
  "You should turn on the C-Gear to attract\\n",
  "lots of passersby.\\c\\n",
  "You should also try communication\\n",
  "facilities, such as the Union Room\\l\\n",
  "and the Global Terminal.\\c\\n",
  "[VAR 0x013A(0)],\\n",
  "we'll be serving as your assistants\\l\\n",
  "in the room over here.\\c\\n",
  "Please come visit us.\\c\\n",
  "If you'll excuse us...\\c$",
]


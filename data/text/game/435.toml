[msg.section_0.entries.0]
text = [
  "Pokémon Trades help you connect with\\n",
  "the world!\\l\\n",
  "The world will be bigger!\\c\\n",
  "If you trade Pokémon with many people,\\n",
  "you will be happy!\\c\\n",
  "Because I will give you something good!\\c\\n",
  "So, Trainer, have you traded Pokémon\\n",
  "with many people?$",
]

[msg.section_0.entries.1]
text = [
  "Hello, Trainer!\\c\\n",
  "Have you traded Pokémon with\\n",
  "many people?$",
]

[msg.section_0.entries.2]
text = [
  "Oh, wonderful.\\c\\n",
  "Then, let me check how many people you\\n",
  "have traded Pokémon with.\\c$",
]

[msg.section_0.entries.3]
text = [
  "...\\c$",
]

[msg.section_0.entries.4]
text = [
  "Please trade Pokémon with many people!\\c\\n",
  "I will give you a present if you do.\\n",
  "Besides, it's fun!$",
]

[msg.section_0.entries.5]
text = [
  "You've traded Pokémon with [VAR NUM1(0)]?\\n",
  "The world is bigger than that!\\c\\n",
  "Please trade with your friends or use\\n",
  "the Global Trade Station!$",
]

[msg.section_0.entries.6]
text = [
  "Zero? You haven't traded with anybody?!\\n",
  "But the world is so big!\\c\\n",
  "Please trade with your friends or use\\n",
  "the Global Trade Station!$",
]

[msg.section_0.entries.7]
text = [
  "Wow!\\n",
  "You have traded with [VAR NUM1(0)] people!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Wow! Great!\\n",
  "You have traded with [VAR NUM2(0)] people!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Wow! Impressive!\\n",
  "You have traded with [VAR NUM2(0)] people!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Wow! Ecstatic!\\n",
  "You have traded with [VAR NUM2(0)] people!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Wow! Surprising!\\n",
  "You have traded with [VAR NUM2(0)] people!\\c$",
]

[msg.section_0.entries.12]
text = [
  "Wow! Wonderful!\\n",
  "You have traded with at least [VAR NUM2(0)] people!\\c$",

[msg.section_0.entries.0]
text = [
  "Hello! If you cross the Skyarrow Bridge\\n",
  "from here, you'll reach Castelia City.$",
]

[msg.section_0.entries.1]
text = [
  "They say the Skyarrow Bridge was built\\n",
  "as a result of the tireless pursuit\\l\\n",
  "of a safe and sturdy structure.\\c\\n",
  "I wonder what kind of Pokémon built it\\n",
  "and how they felt while building it.$",
]

[msg.section_0.entries.2]
text = [
  "Use Fly, and you'll be there in no time!\\c\\n",
  "But some people prefer to cross\\n",
  "that bridge to go to Castelia City.$",
]

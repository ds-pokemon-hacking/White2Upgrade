[msg.section_0.entries.0]
text = [
  "In winter, snow piles up\\n",
  "all over Twist Mountain.\\c\\n",
  "It gets totally white!$",
]

[msg.section_0.entries.1]
text = [
  "Whiteness of snow hides impurities,\\n",
  "and blackness of night conceals worries.$",
]

[msg.section_0.entries.2]
text = [
  "Twist and twist, twisting mountain. ♪\\n",
  "Spiraling up like a fountain. ♪$",
]

[msg.section_0.entries.3]
text = [
  "When you walk on snow,\\n",
  "your feet sink deeper than usual.\\c\\n",
  "The sensation is so powerful\\n",
  "and gripping!$",
]

[msg.section_0.entries.0]
text = [
  "Hey, you!\\n",
  "Would you walk with my dear Mienfoo?\\c$",
]

[msg.section_0.entries.1]
text = [
  "Oh my!\\n",
  "You're very understanding!\\c\\n",
  "Wonderful. Please walk a lot\\n",
  "with my cute Mienfoo!\\c\\n",
  "But...\\n",
  "Please don't go out of this house!\\c\\n",
  "It's dangerous outside.\\n",
  "All right. Take good care of my Mienfoo!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Oh my!\\c\\n",
  "You turned down my request.\\n",
  "You're mean.\\c\\n",
  "Some people say that I should walk\\n",
  "my Mienfoo myself.\\c\\n",
  "But, it's impossible, because I've never\\n",
  "carried anything heavier than\\l\\n",
  "a Poké Ball!\\c\\n",
  "...But if you change your mind,\\n",
  "I don't mind asking you to walk\\l\\n",
  "my Mienfoo again.$",
]

[msg.section_0.entries.3]
text = [
  "Oh my!\\c\\n",
  "My cute Mienfoo\\n",
  "looks very tough now.\\c\\n",
  "Thank you very much\\n",
  "for walking my Mienfoo.\\c\\n",
  "I'll give this to you\\n",
  "as a token of my appreciation.\\c$",
]

[msg.section_0.entries.4]
text = [
  "Please walk my cute Mienfoo again!$",
]

[msg.section_0.entries.5]
text = [
  "You've just started walking.\\n",
  "Please walk more!\\c\\n",
  "...Whaaat?\\c\\n",
  "You're not going to say\\n",
  "you will quit in the middle of\\l\\n",
  "walking my cute Mienfoo, are you?\\c$",
]

[msg.section_0.entries.6]
text = [
  "Continue$",
]

[msg.section_0.entries.7]
text = [
  "Quit$",
]

[msg.section_0.entries.8]
text = [
  "Of course!\\c\\n",
  "Please walk my cute Mienfoo\\n",
  "until it is totally satisfied.$",
]

[msg.section_0.entries.9]
text = [
  "Oh my!\\n",
  "What's the matter with you?\\c\\n",
  "It looks like my cute Mienfoo still\\n",
  "wants to walk!\\c\\n",
  "In that case, I can't give you a\\n",
  "thank-you gift.\\c\\n",
  "...But if you change your mind,\\n",
  "I don't mind asking you to walk\\l\\n",
  "with my Mienfoo again.\\c$",
]

[msg.section_0.entries.10]
text = [
  "But if you change your mind,\\n",
  "I don't mind asking you to walk\\l\\n",
  "with my Mienfoo again.$",
]

[msg.section_0.entries.11]
text = [
  "Hey, you!$",
]

[msg.section_0.entries.12]
text = [
  "What are you doing?\\c\\n",
  "I can understand very well\\n",
  "that my Mienfoo is so cute\\l\\n",
  "that you want to take it out,\\l\\n",
  "but you can't do that!\\c\\n",
  "It's dangerous outside!\\c\\n",
  "Will you take responsibility\\n",
  "if my Mienfoo gets hurt?\\c\\n",
  "Please walk INSIDE the room!\\c$",
]

[msg.section_0.entries.13]
text = [
  "What are you doing?\\c\\n",
  "You have the audacity to check\\n",
  "the trash can in my house.\\c\\n",
  "It's not good for the education of\\n",
  "my Mienfoo.\\c\\n",
  "No matter how many times you check,\\n",
  "the trash can is empty!\\c\\n",
  "Please focus on walking!\\c$",
]

[msg.section_0.entries.14]
text = [
  "What are you doing?\\c\\n",
  "In front of my very eyes,\\n",
  "you disrupt Mienfoo's walk...\\c\\n",
  "On top of that, you got engrossed\\n",
  "in watching TV.\\l\\n",
  "What nerve!\\c\\n",
  "Stop taking a break, and walk\\n",
  "my Mienfoo!\\c$",
]

[msg.section_0.entries.15]
text = [
  "...Yeep?$",
]

[msg.section_0.entries.16]
text = [
  "Yeep!$",
]

[msg.section_0.entries.17]
text = [
  "Yeeeep. ♪$",
]

[msg.section_0.entries.18]
text = [
  "The steps of the Mienfoo walking\\n",
  "with [VAR TRNAME(0)] are very light!\\c\\n",
  "Mienfoo seems to be\\n",
  "satisfied with the walk!$",
]

[msg.section_0.entries.19]
text = [
  "The steps of the Mienfoo walking\\n",
  "with [VAR TRNAME(0)] are light!$",
]

[msg.section_0.entries.20]
text = [
  "The steps of the Mienfoo walking\\n",
  "with [VAR TRNAME(0)] are getting smooth.$",
]

[msg.section_0.entries.21]
text = [
  "The steps of the Mienfoo walking\\n",
  "with [VAR TRNAME(0)] are still clumsy.$",
]

[msg.section_0.entries.22]
text = [
  "The steps of the Mienfoo walking\\n",
  "with [VAR TRNAME(0)] are somewhat clumsy.$",
]

[msg.section_0.entries.23]
text = [
  "Is this a home video?\\n",
  "Mienfoo is in it!$",
]

[msg.section_0.entries.24]
text = [
  "A somewhat expensive-looking...\\n",
  "but ordinary trash can.$",
]

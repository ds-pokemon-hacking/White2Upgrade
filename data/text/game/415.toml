[msg]
trailing_data = "2c2c"

[msg.section_0.entries.0]
text = [
  "Hello. Excuse me.\\c\\n",
  "I'm terribly sorry to ask, but\\n",
  "will you buy a bottle of Fresh Water\\l\\n",
  "for \\$300?$",
]

[msg.section_0.entries.1]
text = [
  "Thank you very much!\\c\\n",
  "Buying Fresh Water for \\$300,\\n",
  "which is more expensive than usual...\\l\\n",
  "What a generous person you are!\\c\\n",
  "I'll never forget your kindness\\n",
  "for the rest of my life!$",
]

[msg.section_0.entries.2]
text = [
  "Yes, I know.\\n",
  "I know!\\c\\n",
  "\\$300 a bottle is expensive!\\c\\n",
  "But, if I don't sell this,\\n",
  "I'll be in trouble...\\c$",
]

[msg.section_0.entries.3]
text = [
  "My wife wants to buy a Bag\\n",
  "from a really expensive brand...\\c\\n",
  "If I don't buy it for her,\\n",
  "our relationship might go sour...\\c$",
]

[msg.section_0.entries.4]
text = [
  "I have a daughter who's a Trainer.\\c\\n",
  "It's natural for a father to want to buy\\n",
  "a lot of things like new Ultra Balls and\\l\\n",
  "Hyper Potions for his daughter...\\c$",
]

[msg.section_0.entries.5]
text = [
  "My son and his wife send me money,\\n",
  "but they can't send very much...\\c\\n",
  "I know I shouldn't rely on them,\\n",
  "but there is a lot going on.\\c$",
]

[msg.section_0.entries.6]
text = [
  "I want to buy some toys\\n",
  "for my adorable grandchildren.\\c\\n",
  "Their tastes are quite expensive.\\n",
  "But I want to see their happy faces...\\c$",
]

[msg.section_0.entries.7]
text = [
  "I don't really have\\n",
  "any special reasons...\\c\\n",
  "But the full-course meal I ate\\n",
  "yesterday was incredibly expensive!\\c$",
]

[msg.section_0.entries.8]
text = [
  "So, to help this old man...\\c\\n",
  "Please buy my Fresh Water\\n",
  "for \\$300. Please.$",
]

[msg.section_0.entries.9]
text = [
  "Sigh...\\c\\n",
  "Well, since you're stubborn,\\n",
  "I'll stop asking.\\c\\n",
  "But when you change your mind,\\n",
  "please come back anytime.\\c\\n",
  "I'll be selling Fresh Water\\n",
  "for \\$300 right here!$",
]

[msg.section_0.entries.10]
text = [
  "Y-you... \\$300...\\n",
  "You don't have it?!\\c\\n",
  "I didn't say anything! Don't worry.\\n",
  "You don't have to buy Fresh Water.$",
]

[msg.section_0.entries.11]
text = [
  "You... You can't carry any more\\n",
  "Fresh Water!\\c\\n",
  "Wow! You're a Fresh Water maniac!\\n",
  "Please buy it from me\\l\\n",
  "next time you need some!$",
]

[msg.section_0.entries.12]
text = [
  "[SPEED(2)]Oh... Oh...\\n",
  "So...thirsty...\\c\\n",
  "G-g-give me...\\n",
  "Fresh Water...?[SPEED(0)]$",
]

[msg.section_0.entries.13]
text = [
  "Refreshed!!\\c\\n",
  "I'm 100% rehydrated!\\n",
  "I feel better now! Thank you!\\c\\n",
  "I'll dash to the next bridge!$",
]

[msg.section_0.entries.14]
text = [
  "[SPEED(2)]But... You don't have Fresh Water...\\n",
  "I appreciate the thought, though...[SPEED(0)]$",
]

[msg.section_0.entries.15]
text = [
  "[SPEED(2)]Thank...\\c\\n",
  "What?\\n",
  "Oh...\\c\\n",
  "Without Fresh Water...\\n",
  "I can't run on bridges anymore.[SPEED(0)]$",
]

[msg.section_0.entries.16]
text = [
  "Yay! I ran on all the bridges\\n",
  "in the Unova region!\\c\\n",
  "It's all thanks to you!\\n",
  "Please! Accept these!\\c$",
]

[msg.section_0.entries.17]
text = [
  "Oh... Your Bag is full.$",
]

[msg.section_0.entries.18]
text = [
  "The bridge I like best for running\\n",
  "is the Tubeline Bridge.\\c\\n",
  "I get to race the trains!\\n",
  "That gives me power!$",
]

[msg.section_0.entries.19]
text = [
  "The curve here is like...errrrk...\\n",
  "and then when you pass the curve,\\l\\n",
  "whoooosh, zoooom!\\c\\n",
  "...Do you understand the dialect\\n",
  "of Goldenrod City?$",
]

[msg.section_0.entries.20]
text = [
  "Hmm! That man!\\c\\n",
  "He's standing right in the middle of\\n",
  "the Skyarrow Bridge... I think.$",
]

[msg.section_0.entries.21]
text = [
  "Good-bye, Castelia City...\\n",
  "Good-bye, old me...$",
]

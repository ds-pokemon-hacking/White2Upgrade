[msg]
trailing_data = "fcfc"

[msg.section_0.entries.0]
text = [
  "Watch it! People use “railway fan\\\" as\\n",
  "a catchall term, but there are many\\l\\n",
  "types of railway fans!\\c\\n",
  "There are riding fans, detraining fans,\\n",
  "station fans, train-car fans,\\l\\n",
  "schedule-table fans, picture-taking fans,\\l\\n",
  "recording fans, and more!\\c\\n",
  "Don't go thinking they're all the same!$",
]

[msg.section_0.entries.1]
text = [
  "For someone like me, who is checking\\n",
  "out rail lines all over the world,\\l\\n",
  "Anville Town, where you can look at\\l\\n",
  "various trains, gets pretty high marks!$",
]

[msg.section_0.entries.2]
text = [
  "A giant steel bridge towering over\\n",
  "the road ahead...\\c\\n",
  "Just looking at this model of the\\n",
  "Tubeline Bridge fills me with energy!\\c\\n",
  "Speaking of energy...\\n",
  "I'll give you this!\\c$",
]

[msg.section_0.entries.3]
text = [
  "It's EnergyPowder!\\n",
  "Use it on a Pokémon to restore\\l\\n",
  "some of its HP!\\c\\n",
  "But be careful... It's really bitter,\\n",
  "so it might make your Pokémon unhappy!$",
]

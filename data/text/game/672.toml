[msg.section_0.entries.0]
text = [
  "Ho! Hoo!\\n",
  "Welcome to White Forest!\\c\\n",
  "In White Forest, people live\\n",
  "in harmony with nature and with Pokémon.\\c\\n",
  "Please listen to the voice of the forest\\n",
  "and of the White Treehollow.\\c\\n",
  "They're saying “Bienvenue!\\\"\\n",
  "Ho! Hoo! Hoo!$",
]

[msg.section_0.entries.1]
text = [
  "Ho! Hoo!\\c\\n",
  "It seems as if you have heard\\n",
  "the voice of the White Treehollow.\\c\\n",
  "But you can't hear its true voice\\n",
  "until you go to the deepest part.\\c\\n",
  "Come now, do your best!\\n",
  "Ho! Hoo! Hoo!$",
]

[msg.section_0.entries.2]
text = [
  "Ho! Hoo! Hoo!\\c\\n",
  "It seems as if you have heard the\\n",
  "voice of the White Treehollow's heart.\\l\\n",
  "Please let me hear it...\\c\\n",
  "No, wait!\\n",
  "Things like these shouldn't be\\l\\n",
  "heard from someone else!\\c\\n",
  "If I want to hear the true voice,\\n",
  "I should go to the deepest part\\l\\n",
  "on my own.\\c\\n",
  "Well, I guess I'll just have to\\n",
  "do my best, then!\\c\\n",
  "Ho! Hoo! Hoo!$",
]

[msg.section_0.entries.3]
text = [
  "When people build too many\\n",
  "tall buildings, the sky gets smaller,\\l\\n",
  "and you can't see the sun anymore!$",
]

[msg.section_0.entries.4]
text = [
  "I want to know about how Pokémon\\n",
  "feel, so I live in nature with them.$",
]

[msg.section_0.entries.5]
text = [
  "If you know how delicious a meal of\\n",
  "Berries can be, you don't have to worry\\l\\n",
  "about wanting to eat this and that!$",
]

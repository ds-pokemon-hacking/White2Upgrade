[msg.section_0.entries.0]
text = [
  "There are medicinal herbs that make\\n",
  "Pokémon healthy.\\c$",
]

[msg.section_0.entries.1]
text = [
  "The medicinal herbs imported from\\n",
  "another region work very well!\\c\\n",
  "But Pokémon don't seem to like them,\\n",
  "because they taste a little bitter.$",
]

[msg.section_0.entries.2]
text = [
  "Welcome! This is straight from the farm!\\c\\n",
  "Moomoo Milk--one bottle for \\$500.\\n",
  "Would you like some for your trip?$",
]

[msg.section_0.entries.3]
text = [
  "Here it is! Your Moomoo Milk!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Oh, my!\\n",
  "Your Bag is full!$",
]

[msg.section_0.entries.5]
text = [
  "Oh, my!\\n",
  "You don't have enough money!$",
]

[msg.section_0.entries.6]
text = [
  "Please buy it next time!\\c\\n",
  "Just so you know, our Moomoo Milk\\n",
  "is straight from the farm.\\c\\n",
  "It's super fresh!$",
]

[msg.section_0.entries.7]
text = [
  "A dozen! That's 12 bottles.\\n",
  "Here it is, your Moomoo Milk!\\c$",
]

[msg.section_0.entries.8]
text = [
  "One bottle$",
]

[msg.section_0.entries.9]
text = [
  "One dozen$",
]

[msg.section_0.entries.10]
text = [
  "No thanks!$",
]

[msg.section_0.entries.11]
text = [
  "Oh, I'm sorry. I'm all sold out.\\c\\n",
  "That Charles guy bought\\n",
  "everything I had.$",
]

[msg.section_0.entries.12]
text = [
  "You! Glad you came!\\n",
  "You want something good?$",
]

[msg.section_0.entries.13]
text = [
  "Then, show me a Pokémon Lv. 30 or more!\\c$",
]

[msg.section_0.entries.14]
text = [
  "Oh! Strong!\\c\\n",
  "You, great!\\n",
  "Take this!\\c$",
]

[msg.section_0.entries.15]
text = [
  "Oh! You--not so good yet!\\c\\n",
  "After training Pokémon,\\n",
  "come back here again!$",
]

[msg.section_0.entries.16]
text = [
  "You, modest!\\n",
  "You should just want something good!$",
]

[msg.section_0.entries.17]
text = [
  "You! Glad you came!\\n",
  "Get good at Expert Belts!\\c\\n",
  "If a Pokémon has an Expert Belt, the\\n",
  "power of its moves is slightly boosted\\l\\n",
  "when they are super effective!$",
]

[msg.section_0.entries.18]
text = [
  "There must be a convenient town where\\n",
  "everything is imported and everything\\l\\n",
  "is available.$",
]

[msg.section_0.entries.19]
text = [
  "Somewhere, there's a laid-back town\\n",
  "where people value the year's seasons.\\c\\n",
  "I heard we've imported a lot of goods\\n",
  "from that town!$",
]

[msg.section_0.entries.20]
text = [
  "Looking at seasonal vegetables is fun.\\c\\n",
  "Because when the seasons change,\\n",
  "the vegetables available change!$",
]

[msg.section_0.entries.21]
text = [
  "Whenever we come to the market,\\n",
  "vegetables of all seasons are available.\\c\\n",
  "Isn't that a marvel?$",
]

[msg.section_0.entries.22]
text = [
  "Goods carried away from Driftveil arrive\\n",
  "in a town somewhere else...\\c\\n",
  "Yeah. The world is connected.$",
]

[msg.section_0.entries.23]
text = [
  "Goods carried away from a town\\n",
  "somewhere else arrive in Driftveil...\\c\\n",
  "Yeah. The world is connected.$",
]

[msg.section_0.entries.24]
text = [
  "I used to be part of Team Plasma.\\n",
  "I have various kinds of incense.\\c$",
]

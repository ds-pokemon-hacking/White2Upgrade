[msg.section_0.entries.0]
text = [
  "Oh! Trainer!\\c\\n",
  "This is all I've got, but don't be shy.\\n",
  "Take it with you!\\c$",
]

[msg.section_0.entries.1]
text = [
  "You can't have too many Poké Balls!\\c\\n",
  "This may be a simple Great Ball,\\n",
  "but this one Great Ball may help you out!$",
]

[msg.section_0.entries.2]
text = [
  "Whatever your age, you can have Pokémon\\n",
  "battles if you have Pokémon by your side.\\c\\n",
  "If you use the Internet,\\n",
  "there are many people to battle!$",
]

[msg.section_0.entries.3]
text = [
  "After many battles, you start to see\\n",
  "more deeply and understand things.\\c\\n",
  "That's why I know exactly what\\n",
  "my husband is thinking!$",
]

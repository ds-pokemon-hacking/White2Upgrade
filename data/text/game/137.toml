[msg]
trailing_data = "c2c2"

[msg.section_0.entries.0]
text = [
  "We were going to make more land,\\n",
  "but we realized it would cause\\l\\n",
  "problems for Pokémon living in the sea...\\c\\n",
  "Oh! Don't tell my girlfriend!$",
]

[msg.section_0.entries.1]
text = [
  "We tried to expand the ocean,\\n",
  "but then there would be fewer\\l\\n",
  "Pokémon that live on land.\\c\\n",
  "That might make the Pokémon in\\n",
  "the ocean sad...\\c\\n",
  "Oh! This is a secret\\n",
  "from my darling boyfriend!$",
]

[msg.section_0.entries.2]
text = [
  "I might not look it,\\n",
  "but I'm the sound designer!\\c\\n",
  "I want folks to hear my wonderful music,\\n",
  "so I'm travelin' all over these parts.\\c\\n",
  "How about givin' my\\n",
  "favorite music a listen?\\c$",
]

[msg.section_0.entries.3]
text = [
  "Well, shucks!\\n",
  "Have a good listen, then!$",
]

[msg.section_0.entries.4]
text = [
  "He's lost in the music...$",
]

[msg.section_0.entries.5]
text = [
  "Oh now, don't be like that!\\n",
  "Listen as much as you want!$",
]

[msg.section_0.entries.0]
text = [
  "Heeey, [VAR TRNAME(0)]!\\n",
  "Come here!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Heeey, [VAR TRNAME(0)]!\\n",
  "Come here!\\c$",
]

[msg.section_0.entries.2]
text = [
  "My Pokémon have been with me\\n",
  "since I was little!\\c\\n",
  "They are always just\\n",
  "raring to battle!$",
]

[msg.section_0.entries.3]
text = [
  "You know how many people use\\n",
  "Protect or Detect in Double Battles?\\l\\n",
  "That's the time to use Feint!$",
]

[msg.section_0.entries.4]
text = [
  "Pokémon Trainer!\\n",
  "Do you have a Pokémon Egg?$",
]

[msg.section_0.entries.5]
text = [
  "Wow! It's a Pokémon Egg!\\n",
  "It feels sort of warm!\\l\\n",
  "A Pokémon will hatch from this, right?$",
]

[msg.section_0.entries.6]
text = [
  "Teacher says that\\n",
  "lies lead to a life of crime!$",
]

[msg.section_0.entries.7]
text = [
  "Aww...\\c\\n",
  "The old guy next door said he didn't\\n",
  "know when they'd find another Egg...\\c\\n",
  "But I really want to see one!$",
]

[msg.section_0.entries.8]
text = [
  "Sometimes they let my big brother\\n",
  "play together with Pokémon, too!$",
]

[msg.section_0.entries.9]
text = [
  "Don't you have a Bicycle?\\n",
  "Can you even ride one?$",
]

[msg.section_0.entries.10]
text = [
  "Go! Go! People who ride Bicycles\\n",
  "are so cool!$",
]

[msg.section_0.entries.11]
text = [
  "Hey! Come on!\\n",
  "Show me your Habitat List!\\c\\n",
  "I want to see all of Route 3's Pokémon!\\n",
  "The ones in the tall grass, the ones\\l\\n",
  "you fish for, and the ones on the water!\\c$",
]

[msg.section_0.entries.12]
text = [
  "If you fill up the Habitat List,\\n",
  "I'd like you to tell me!\\c\\n",
  "I want to see all of Route 3's Pokémon!\\n",
  "The ones in the tall grass, the ones\\l\\n",
  "you fish for, and the ones on the water.\\l\\n",
  "Got it?$",
]

[msg.section_0.entries.13]
text = [
  "Oh... Really?\\c\\n",
  "I never knew there were this\\n",
  "many Pokémon on Route 3!\\c\\n",
  "Pokémon Trainer, that's amazing!\\n",
  "I'm so moved, I'll give you this!\\c$",
]

[msg.section_0.entries.14]
text = [
  "Pokémon Trainers sure\\n",
  "are good at meeting Pokémon.$",
]

[msg.section_0.entries.15]
text = [
  "Route 3$",
]

[msg.section_0.entries.16]
text = [
  "Trainer Tips!\\n",
  "\\c\\n",
  "Tap the yellow button at the top of a\\n",
  "PC Box to switch to Group Move mode.\\c\\n",
  "It lets you move groups\\n",
  "of Pokémon in your PC Boxes.$",
]

[msg.section_0.entries.17]
text = [
  "Pokémon Day Care\\n",
  "We Take Care of Your Precious Pokémon$",
]

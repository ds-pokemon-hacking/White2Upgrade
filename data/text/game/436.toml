  "All the while, there's someone out there\\n",
  "monitoring and gathering data on all of\\l\\n",
  "these battles.\\c\\n",
  "But a Pokémon's true strength isn't\\n",
  "decided just by data.\\c\\n",
  "It's all about the teamwork between a\\n",
  "Trainer and his or her Pokémon.\\c\\n",
  "That's what really decides a Pokémon's\\n",
  "true strength.\\c\\n",
  "Well, I'm heading off to my next\\n",
  "investigation site.\\c\\n",
  "There's this quiet town, full of nature,\\n",
  "where suddenly a massive tree appeared!\\c\\n",
  "Well, I guess this is good-bye!\\c$",
]

[msg.section_0.entries.145]
text = [
  "Oh, hey! You made it this far, huh?\\c\\n",
  "You and your Pokémon sure make\\n",
  "a great team!\\c\\n",
  "I tell you, it's the teamwork between\\n",
  "humans and Pokémon that brought\\l\\n",
  "the world to where it is today.\\c\\n",
  "Throughout history we've complemented\\n",
  "each other to overcome all obstacles!\\c\\n",
  "It might be that this place exists so we\\n",
  "can experience that history firsthand!\\c\\n",
  "See you around!\\c$",
]

[msg.section_0.entries.146]
text = [
  "Hmm? Are you a new challenger?\\n",
  "Oh, my...\\c\\n",
  "That expression on your face is telling me\\n",
  "that you've got no idea what to do.\\c\\n",
  "All right! I suppose I can spare some\\n",
  "advice for a newcomer.\\c\\n",
  "First of all, you should know that in\\n",
  "order to complete an area and advance,\\l\\n",
  "you must defeat the Boss Trainer.\\c\\n",
  "You can try to seek out the Boss Trainer\\n",
  "without any leads if you want.\\c\\n",
  "However, it's probably a better idea to\\n",
  "challenge the other Trainers first.\\c\\n",
  "A lot of them know quite a bit about the\\n",
  "area and might be able to provide you\\l\\n",
  "with useful information!\\c$",
]

[msg.section_0.entries.147]
text = [
  "Oh? If it isn't the challenger that\\n",
  "everyone's talking about!\\c\\n",
  "I hear you're stronger than you look.\\c\\n",
  "You're still new here, so I'll give\\n",
  "you some advice.\\c\\n",
  "You know about the elevators, right?\\c\\n",
  "If you feel like you can't continue any\\n",
  "longer, come back to the elevator in the\\l\\n",
  "area and return to the lobby.\\c\\n",
  "Any prize money you won in the area will\\n",
  "be taken back, so it's important to know\\l\\n",
  "when to quit.\\c\\n",
  "Testing your limits can be a good thing,\\n",
  "but don't overdo it!\\c$",
]

[msg.section_0.entries.148]
text = [
  "Have you come to challenge the\\n",
  "White Treehollow?\\c\\n",
  "Oh, me? I'm here for a different reason.\\c\\n",
  "I'm just on a journey to become\\n",
  "even stronger.\\c\\n",
  "Enough about that... Don't you think\\n",
  "this place is strange?\\c\\n",
  "I mean, it wasn't even here\\n",
  "two years ago.\\c\\n",
  "It's full of mysteries, I'm telling you.\\c\\n",
  "Whatever. I'm satisfied as long as I\\n",
  "can continue my training.\\c\\n",
  "Anyway, see you around!\\c$",
]

[msg.section_0.entries.149]
text = [
  "Oh, hey!\\n",
  "It's you again!\\c\\n",
  "Get this! I heard a really strange\\n",
  "story about this place!\\c\\n",
  "Apparently, some conservation group did\\n",
  "a thorough investigation of this place\\l\\n",
  "before opening it up to the public.\\c\\n",
  "I wonder why they opened up this place\\n",
  "as a training facility...\\c\\n",
  "I guess it's because this place\\n",
  "is so huge.\\c\\n",
  "You don't have to worry about\\n",
  "other stuff and can focus on training.\\c\\n",
  "Anyway, see you around!\\c$",
]

[msg.section_0.entries.150]
text = [
  "Hey! You made it to Area 5!\\c\\n",
  "Oh yeah. I learned the reason why this\\n",
  "place was opened up for us Trainers!\\c\\n",
  "Apparently, this place wasn't actually\\n",
  "fully explored before they opened it up!\\c\\n",
  "They're letting Trainers battle and train\\n",
  "in here, but the real reason they opened\\l\\n",
  "this place up is to have strong Trainers\\l\\n",
  "explore the depths of this place!\\c\\n",
  "That is, Trainers just like you, who have\\n",
  "strong bonds with their Pokémon!\\c\\n",
  "I wonder if you'll ever make your\\n",
  "way to the bottom.\\c\\n",
  "Well, I think I'm just about done\\n",
  "training in here.\\c\\n",
  "For the next stop on my journey, I've\\n",
  "decided to check out the rumors about\\l\\n",
  "a building that was suddenly constructed\\l\\n",
  "in a certain city.\\c\\n",
  "Strength isn't something that you can\\n",
  "achieve in just one day.\\c\\n",
  "Let's both do our best!\\c$",
]

[msg.section_0.entries.151]
text = [
  "Oh, hey! You made it this far, huh?\\c\\n",
  "You and your Pokémon sure make\\n",
  "a great team!\\c\\n",
  "I tell you, it's the teamwork between\\n",
  "humans and Pokémon that brought\\l\\n",
  "the world to where it is today.\\c\\n",
  "Throughout history we've complemented\\n",
  "each other to overcome all obstacles!\\c\\n",
  "It might be that this place exists so we\\n",
  "can experience that history firsthand!\\c\\n",
  "See you around!\\c$",
]

[msg.section_0.entries.152]
text = [
  "Hey, newcomer! How are you doing?\\c\\n",
  "Take a look around this room.\\n",
  "See that strange door?\\c\\n",
  "That's a gate that leads into the\\n",
  "room where the Boss Trainer waits.\\c\\n",
  "The gate is closed right now, though,\\n",
  "so you can't go through.\\c\\n",
  "First, you'll need to find the gate\\n",
  "Trainer somewhere in this area and get\\l\\n",
  "him or her to open the gate for you.\\c\\n",
  "However, they'll only open the gate\\n",
  "for Trainers that they deem to be\\l\\n",
  "strong enough!\\c\\n",
  "So, it's up to you to battle the gate\\n",
  "Trainer and prove your strength!\\c\\n",
  "Oh, by the way, the gate Trainer of\\n",
  "this area is actually me!\\c\\n",
  "I'll be waiting for you somewhere in this\\n",
  "area, so come find me!\\c$",
]

[msg.section_0.entries.153]
text = [
  "Oh, hi! We meet again!\\n",
  "How are you doing?\\c\\n",
  "Remember, you can't use items in here.\\c\\n",
  "Aren't you and your Pokémon starting to\\n",
  "get a bit tired?\\c\\n",
  "If you are, seek out a Doctor!\\c\\n",
  "Just talk to one of them, and the\\n",
  "Doctor should recover your Pokémon.\\c\\n",
  "You'll have to have a battle\\n",
  "first, though.\\c\\n",
  "Well, I'm gonna go on ahead.\\n",
  "Don't keep me waiting too long!\\c$",
]

[msg.section_0.entries.154]
text = [
  "Wow, you've made it this far!\\n",
  "Impressive.\\c\\n",
  "Since you're trying so hard, I'll\\n",
  "give you another hint.\\c\\n",
  "When you've lost your way!\\c\\n",
  "When your Pokémon are feeling down!\\c\\n",
  "When you want to leave immediately!\\c\\n",
  "This book comes in handy in times\\n",
  "like those.\\c\\n",
  "The book is called “Adventure Rules for\\n",
  "Unova's Challenge\\\"!\\c\\n",
  "It says here, “Press the X Button to\\n",
  "make the RETIRE button appear. Press\\l\\n",
  "that to return to the lobby!\\\"\\c\\n",
  "Of course, if you choose to retire, your\\n",
  "challenge will be considered a failure,\\l\\n",
  "so choose wisely!\\c\\n",
  "I'm the gate Trainer for this area,\\n",
  "so I'll be waiting for you somewhere!\\l\\n",
  "Come find me!\\c$",
]


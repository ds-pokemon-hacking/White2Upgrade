[msg.section_0.entries.0]
text = [
  "Hi! I'll mimic a Pokémon's sound!\\n",
  "Please listen!$",
]

[msg.section_0.entries.1]
text = [
  "OK. I'll mimic the sound of\\n",
  "the Pokémon you're with...$",
]

[msg.section_0.entries.2]
text = [
  "It's just like the real Pokémon.\\n",
  "Won't you listen to me?$",
]

[msg.section_0.entries.3]
text = [
  "I mimicked one of your party Pokémon.\\n",
  "Which Pokémon was it?$",
]

[msg.section_0.entries.4]
text = [
  "Correct!\\c\\n",
  "You can recognize the sound of\\n",
  "Pokémon you always hear, right?\\c\\n",
  "Thank you for playing with me.\\n",
  "This is a small gift from me!$",
]

[msg.section_0.entries.5]
text = [
  "Correct!\\c\\n",
  "Of course, you won't mistake\\n",
  "the sound of your partner Pokémon!$",
]

[msg.section_0.entries.6]
text = [
  "Close! Too bad! I'm sad!\\n",
  "That was [VAR PKNAME(0)]!$",
]

[msg.section_0.entries.7]
text = [
  "...You have way too few Pokémon!\\n",
  "I can't give you a quiz like this.$",
]


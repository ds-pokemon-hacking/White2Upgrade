[msg.section_0.entries.0]
text = [
  "Words are engraved on the statue:\\c\\n",
  "“Four great warriors form\\n",
  " this Pokémon League.\\c\\n",
  " To the southwest is one who\\n",
  " does not fear the Ghost type.\\c\\n",
  " To the southeast is one who\\n",
  " channels the power of the Fighting type.\\c\\n",
  " To the northwest is one who\\n",
  " has mastered the Dark type.\\c\\n",
  " To the northeast is one who\\n",
  " knows the mind of the Psychic type.\\c\\n",
  " If you can defeat these warriors with\\n",
  " your courage and wisdom,\\l\\n",
  " you shall be led to the summit,\\l\\n",
  " where the strongest Champion awaits.\\\"$",
]


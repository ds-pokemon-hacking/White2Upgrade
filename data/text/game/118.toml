[msg.section_0.entries.0]
text = [
  "Getting to know someone\\n",
  "creates both joy and sorrow.\\c\\n",
  "Puns that were funny when you first met\\n",
  "get old when you hear them all the time.$",
]

[msg.section_0.entries.1]
text = [
  "As the Gym Leader of Nimbasa City,\\n",
  "Elesa has a shockingly packed schedule.\\c\\n",
  "That's what you'd expect\\n",
  "from an electrifying model!$",
]

[msg.section_0.entries.2]
text = [
  "Three years ago, Team Plasma talked me\\n",
  "into letting my dear Pokémon go.\\c\\n",
  "Ever since, I've been staying\\n",
  "in hotels as I please.\\c\\n",
  "...To be honest, I feel lonely,\\n",
  "but it's a good thing not to have Pokémon\\l\\n",
  "who'll be left behind and feel sad\\l\\n",
  "after I pass away...$",
]

[msg.section_0.entries.0]
text = [
  "Listen up! You Trainers should always\\n",
  "keep a smile on your face!\\c\\n",
  "If you're not smiling, your Pokémon might\\n",
  "feel like something's wrong, you know?$",
]

[msg.section_0.entries.1]
text = [
  "Which Pokémon should hold what item...\\c\\n",
  "There's no right answer,\\n",
  "so it's hard to decide.\\c\\n",
  "Still, I like spending time thinking\\n",
  "it over.$",
]

[msg.section_0.entries.2]
text = [
  "Wow! A Pokémon!\\n",
  "How cool! I'm so jealous!\\c\\n",
  "Ha ha! Just kidding!\\n",
  "I'm a Pokémon Trainer now!\\c\\n",
  "Just like the Trainer from\\n",
  "Nuvema I met two years ago!$",
]

[msg.section_0.entries.3]
text = [
  "Paaan!$",
]

[msg.section_0.entries.4]
text = [
  "Hey! If it's all right with you,\\n",
  "let's trade!\\c\\n",
  "I'll trade you my Ambipom\\n",
  "for your Excadrill!$",
]

[msg.section_0.entries.5]
text = [
  "Great!\\n",
  "Then, let's start the trade!\\c$",
]

[msg.section_0.entries.6]
text = [
  "My Ambipom knows Nasty Plot!\\c\\n",
  "I'll make your Excadrill really strong,\\n",
  "so let's battle sometime, OK?$",
]

[msg.section_0.entries.7]
text = [
  "I get it...\\n",
  "That's your trusty partner.\\c\\n",
  "If you change your mind,\\n",
  "let's trade Pokémon, OK?$",
]

[msg.section_0.entries.8]
text = [
  "The Excadrill I got from you\\n",
  "has become really strong!\\l\\n",
  "I'm sure you'll be bowled over!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Hey! If it's all right with you,\\n",
  "would you have a Pokémon battle with me?$",
]

[msg.section_0.entries.10]
text = [
  "OK! Here we go!\\c\\n",
  "We'll have an actual match, so you can\\n",
  "really see how I've raised Excadrill!\\c$",
]

[msg.section_0.entries.11]
text = [
  "I get it...\\c\\n",
  "You don't want to have battles\\n",
  "all the time.$",
]

[msg.section_0.entries.12]
text = [
  "Whew!\\n",
  "That was so fun!\\c\\n",
  "Hey! If it's all right with you,\\n",
  "could you give me a Hippowdon?\\c\\n",
  "I'll trade you my Alakazam!\\n",
  "C'mon, let's trade Pokémon!$",
]

[msg.section_0.entries.13]
text = [
  "Great!\\n",
  "Then, let's start the trade!\\c$",
]

[msg.section_0.entries.14]
text = [
  "My Alakazam knows Psycho Cut!\\c\\n",
  "I'll make your Hippowdon really\\n",
  "tough, so let's battle sometime, OK?$",
]

[msg.section_0.entries.15]
text = [
  "I get it...\\n",
  "That's your trusty partner.\\c\\n",
  "If you change your mind,\\n",
  "let's trade Pokémon, OK?$",
]

[msg.section_0.entries.16]
text = [
  "The Hippowdon I got from you\\n",
  "has become really strong!\\l\\n",
  "I'm sure you'll be bowled over!\\c$",
]

[msg.section_0.entries.17]
text = [
  "Hey! If it's all right with you,\\n",
  "would you have a Pokémon battle with me?$",
]

[msg.section_0.entries.18]
text = [
  "OK! Here we go!\\c\\n",
  "I'll show you how well I've raised\\n",
  "Hippowdon by having a battle with you!\\c$",
]

[msg.section_0.entries.19]
text = [
  "Hey! I'm so glad we were able\\n",
  "to trade Pokémon and have a battle!$",
]

[msg.section_0.entries.0]
text = [
  "[VAR TRNAME(0)]. Finally,\\n",
  "you've come this far.\\c\\n",
  "Well, to honor the best and ultimate\\n",
  "achievement, we'll have an extravagant\\l\\n",
  "event at the Medal Rally Office!\\c\\n",
  "Yo! You're the best!$",
]

[msg.section_0.entries.1]
text = [
  "Well, aim to receive [VAR NUM3(0)] Medals!\\n",
  "Good luck!$",
]

[msg.section_0.entries.2]
text = [
  "Well, good luck with getting a new Medal!$",
]

[msg.section_0.entries.3]
text = [
  "We'll have an award ceremony\\n",
  "at the Medal Rally Office\\l\\n",
  "in [VAR LOCATION(0)].\\c\\n",
  "So, please come to the office!$",
]

[msg.section_0.entries.4]
text = [
  "Oh! [VAR TRNAME(0)]!\\n",
  "Great! Really great!\\c\\n",
  "You know what? Just now\\n",
  "you passed the checkpoint\\l\\n",
  "the Medal Rally Office set\\l\\n",
  "and reached the goal!\\c\\n",
  "So, we'll have an award ceremony\\n",
  "at the Medal Rally Office\\l\\n",
  "in [VAR LOCATION(1)].\\c\\n",
  "So, please come to the office!$",
]

[msg.section_0.entries.5]
text = [
  "Hmm... [VAR TRNAME(0)]!\\c\\n",
  "I'd like you to collect more Medals.\\n",
  "So, I'll give you Hint Medals!\\c$",
]

[msg.section_0.entries.6]
text = [
  "Well... I don't have any more Hint Medals\\n",
  "I can give to you.\\c$",
]

[msg.section_0.entries.7]
text = [
  "Well... I don't have any more Hint Medals\\n",
  "I can give to you.\\c\\n",
  "Well, your goal is to find [VAR NUM3(0)] Medals.\\n",
  "Good luck!$",
]

[msg.section_0.entries.8]
text = [
  "Well... I don't have any more Hint Medals\\n",
  "I can give to you.\\c\\n",
  "Well, good luck with getting new Medals!$",
]

[msg.section_0.entries.9]
text = [
  "[VAR TRNAME(0)] received\\n",
  "[VAR NUM3(1)] [COLOR(2)]Hint Medals[COLOR(0)]!\\c$",
]

[msg.section_0.entries.10]
text = [
  "[VAR TRNAME(0)] received\\n",
  "a [COLOR(2)]Hint Medal[COLOR(0)]!\\c$",
]

[msg.section_0.entries.11]
text = [
  "I know this is sudden,\\n",
  "but nice to meet you!\\c\\n",
  "Now, don't say anything.\\n",
  "Just take this!\\c$",
]

[msg.section_0.entries.12]
text = [
  "That is a Medal Box!\\c\\n",
  "And, people call me\\n",
  "Mr. Medal!\\c\\n",
  "...By the way, do you know a competition\\n",
  "called the Medal Rally?$",
]

[msg.section_0.entries.13]
text = [
  "Whether you know it or not,\\n",
  "I'll explain it to you!\\c\\n",
  "The Medal Rally is an event\\n",
  "that evaluates various activities\\l\\n",
  "of Trainers.\\c\\n",
  "So...in commemoration of your\\n",
  "participation, please take this Medal!\\c$",
]

[msg.section_0.entries.14]
text = [
  "And here's some help for the Medal Rally!\\n",
  "I'll give you Hint Medals, too!\\c$",
]

[msg.section_0.entries.15]
text = [
  "For your information,\\n",
  "you can get Medals if you meet\\l\\n",
  "their conditions.\\c\\n",
  "Go to a Pokémon Center,\\n",
  "and you can get Medals from me\\l\\n",
  "one after another!\\c\\n",
  "First, please use your Medal Box and\\n",
  "check the inside!\\c$",
]

[msg.section_0.entries.16]
text = [
  "Wow! [VAR TRNAME(0)].\\n",
  "You collected a lot of Medals!\\c\\n",
  "I'll upgrade your Medal Box.\\c\\n",
  "Aiya! Yah!\\c$",
]

[msg.section_0.entries.17]
text = [
  "In commemoration of the upgrade,\\n",
  "I'll give you a Medal, as well!\\c$",
]

[msg.section_0.entries.18]
text = [
  "A further upgrade for you!\\n",
  "Haaah! Yaaah!\\c$",
]

[msg.section_0.entries.19]
text = [
  "[VAR TRNAME(0)]'s Medal Box\\n",
  "has been upgraded to\\l\\n",
  "[COLOR(2)][VAR MEDALISTRANK(1)][COLOR(0)] Rank!$",
]

[msg.section_0.entries.20]
text = [
  "[VAR TRNAME(0)]. I've been waiting for you!\\n",
  "You're doing terrific!\\l\\n",
  "Here's a new Medal!\\c$",
]

[msg.section_0.entries.21]
text = [
  "And! I have another Medal\\n",
  "I want to give! Please! Please!\\c$",
]

[msg.section_0.entries.22]
text = [
  "[VAR TRNAME(0)] obtained\\n",
  "the [COLOR(2)][VAR MEDAL(1)][COLOR(0)] Medal.\\c$",
]


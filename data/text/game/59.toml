[msg.section_0.entries.0]
text = [
  "I want Pokémon to be\\n",
  "in the new office...\\c\\n",
  "But I can't say such a thing\\n",
  "in front of my girlfriend.$",
]

[msg.section_0.entries.1]
text = [
  "Even before Poké Balls were created,\\n",
  "people and Pokémon were good friends.\\l\\n",
  "I wonder if this relationship will last\\l\\n",
  "in the future, too.$",
]

[msg.section_0.entries.2]
text = [
  "Missing Pokémon...\\c\\n",
  "Even if Team Plasma is responsible,\\n",
  "we don't know where they are.$",
]

[msg.section_0.entries.3]
text = [
  "I learned some Pokémon want to\\n",
  "be with Trainers...\\c\\n",
  "Of course, some Pokémon prefer\\n",
  "to live wild.\\c\\n",
  "For your information, I heard\\n",
  "Pokémon who have learned a hidden move\\l\\n",
  "may come back, even if you try to\\l\\n",
  "release them.$",
]

[msg.section_0.entries.4]
text = [
  "My Pokémon...\\n",
  "Where did it go...?$",
]

[msg.section_0.entries.5]
text = [
  "My Pokémon!\\n",
  "Scraggy came back!\\c\\n",
  "I don't know if it was held captive\\n",
  "by Team Plasma...\\l\\n",
  "or it was lost and came back by itself...\\c\\n",
  "But anyway, I'm happy!$",
]

[msg.section_0.entries.6]
text = [
  "Gyscragg!$",
]


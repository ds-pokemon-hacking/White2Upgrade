[msg.section_0.entries.0]
text = [
  "Let me introduce myself again.\\n",
  "My name is Rood.\\c$",
]

[msg.section_0.entries.1]
text = [
  "[VAR TRNAME(1)]: You guys are all\\n",
  "Team Plasma too, right?\\c\\n",
  "Tell me, what makes you different\\n",
  "from the Team Plasma back there?!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Rood: More accurately, we're\\n",
  "former members of Team Plasma.\\c\\n",
  "Because of the incident two years ago,\\n",
  "we started taking care of the Pokémon\\l\\n",
  "that were separated from their Trainers\\l\\n",
  "as a way to atone for our misdeeds.\\c\\n",
  "And you are?\\c$",
]

[msg.section_0.entries.3]
text = [
  "I'm [VAR TRNAME(1)].\\n",
  "From Aspertia City...\\c\\n",
  "Five years ago, Team Plasma--I mean\\n",
  "you--stole my little sister's Pokémon.\\c\\n",
  "I'm the pathetic Trainer who wasn't able\\n",
  "to stop you.\\c\\n",
  "“Separated?\\\" What a joke!\\n",
  "YOU were the thieves who STOLE them!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Rood: Is that so...\\n",
  "My sincerest apologies...\\c$",
]

[msg.section_0.entries.5]
text = [
  "[VAR TRNAME(1)]: Just an apology?\\n",
  "That's it?!\\c$",
]

[msg.section_0.entries.6]
text = [
  "Where's my sister's Pokémon?!\\c\\n",
  "Purrloin! WHERE'S PURRLOIN?\\c$",
]

[msg.section_0.entries.7]
text = [
  "Rood: The Pokémon you speak of\\n",
  "is not in this place.\\c\\n",
  "I imagine it is still being\\n",
  "used by Team Plasma now.\\c\\n",
  "Just as you say, our apologizing\\n",
  "doesn't solve anything.\\c\\n",
  "But you can't move forward unless\\n",
  "you admit you were wrong and apologize...\\c$",
]

[msg.section_0.entries.8]
text = [
  "[VAR TRNAME(1)]: Enough already!\\c\\n",
  "Apologizing isn't going to get\\n",
  "my sister's Pokémon back!\\c$",
]

[msg.section_0.entries.9]
text = [
  "[VAR TRNAME(0)]!\\n",
  "I'm going to the Pokémon Gym!\\c\\n",
  "I'll get stronger and crush every\\n",
  "single member of Team Plasma!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Rood: Team Plasma made\\n",
  "Trainers like him suffer...\\c\\n",
  "I feel terrible about it...\\n",
  "How foolish we were...\\c$",
]

[msg.section_0.entries.11]
text = [
  "[VAR TRNAME(0)], as you can see,\\n",
  "I can't do anything to thank you.\\c\\n",
  "Actually, I have a favor to ask of you.\\c\\n",
  "Could you please look after this\\n",
  "Pokémon, Zorua?$",
]

[msg.section_0.entries.12]
text = [
  "Rood: Could you please look after this\\n",
  "Pokémon, Zorua?$",
]

[msg.section_0.entries.13]
text = [
  "Rood: Oh! Thank you!\\c$",
]

[msg.section_0.entries.14]
text = [
  "Rood: Oh! Thank you!\\c\\n",
  "...But what's this? It seems you can't\\n",
  "take any more Pokémon with you.$",
]

[msg.section_0.entries.15]
text = [
  "Rood: If you change your mind,\\n",
  "please come speak to me again.$",
]

[msg.section_0.entries.16]
text = [
  "This Zorua was one of my lord N's friends,\\n",
  "and it supported him.\\c\\n",
  "In the Unova region, there are many\\n",
  "other Pokémon that helped my lord N\\l\\n",
  "besides this Zorua.$",
]

[msg.section_0.entries.17]
text = [
  "That Zorua is one of the Pokémon\\n",
  "that my lord N relied on as a friend\\l\\n",
  "during his journey.$",
]

[msg.section_0.entries.18]
text = [
  "My lord N is a wonderful person\\n",
  "who has the power to understand\\l\\n",
  "the hearts of Pokémon.\\c\\n",
  "But still, he has much to learn about\\n",
  "understanding the hearts of people...\\c\\n",
  "I hope he will develop this skill while\\n",
  "he travels with the legendary Pokémon\\l\\n",
  "to atone for the trouble he caused\\l\\n",
  "in Unova as the king of Team Plasma.$",
]

[msg.section_0.entries.19]
text = [
  "Team Plasma is an organization\\n",
  "created by a man named Ghetsis\\l\\n",
  "to help him take over the Unova region.\\c\\n",
  "The one he groomed to help him\\n",
  "further his nefarious aims was N.\\c\\n",
  "N was a strange boy who was\\n",
  "called the child of the Pokémon.$",
]

[msg.section_0.entries.20]
text = [
  "I wonder if N understands now.\\c\\n",
  "Trainers battle with Pokémon not to hurt\\n",
  "them, but so Trainers and Pokémon can\\l\\n",
  "understand one another better!\\c\\n",
  "It's the simplest way\\n",
  "for them to do this.\\c\\n",
  "The more serious the battle,\\n",
  "the more the true nature of Pokémon\\l\\n",
  "and people becomes apparent!$",
]

[msg.section_0.entries.21]
text = [
  "N was an orphan.\\c\\n",
  "I heard that right after he was born,\\n",
  "he upset people with behavior that\\l\\n",
  "suggested he could talk to Pokémon.\\c\\n",
  "When he was living in the woods\\n",
  "with Darmanitan and Zorua,\\l\\n",
  "Ghetsis took him in.\\c\\n",
  "We are also orphans Ghetsis took in.\\n",
  "Our task was to take care of N.$",
]

[msg.section_0.entries.22]
text = [
  "I don't understand N's\\n",
  "pure and innocent feelings.\\c\\n",
  "But I will be very happy if he\\n",
  "figured out what he wants to do\\l\\n",
  "on his own during his travels\\l\\n",
  "with the legendary Pokémon.$",
]

[msg.section_0.entries.23]
text = [
  "I'm waiting for my lord N to return.\\n",
  "He can talk to Pokémon.\\c\\n",
  "If he comes back, we can find out\\n",
  "what the Pokémon here want.$",
]

[msg.section_0.entries.24]
text = [
  "We're taking care of the Pokémon\\n",
  "whose Trainers we can't find.\\c\\n",
  "I know it seems arrogant,\\n",
  "but it's a small way to make up\\l\\n",
  "for what we've done.$",
]

[msg.section_0.entries.25]
text = [
  "You can't change the past,\\n",
  "but you can change the future!\\c\\n",
  "That's why I changed my outfit.\\n",
  "I can still fit into the old one, though!\\l\\n",
  "Really!$",
]

[msg.section_0.entries.26]
text = [
  "This Pokémon has become attached to me.\\c\\n",
  "That's why I'm treating it like\\n",
  "a friend and not like a tool!$",
]

[msg.section_0.entries.27]
text = [
  "Bwoaf bowoaf!$",
]

[msg.section_0.entries.28]
text = [
  "Swwaaa!$",
]

[msg.section_0.entries.29]
text = [
  "Scrarara!$",
]

[msg.section_0.entries.30]
text = [
  "Skreeree...$",
]

[msg.section_0.entries.31]
text = [
  "Yeowwln!$",
]

[msg.section_0.entries.32]
text = [
  "[VAR TRNAME(1)]: What?\\c\\n",
  "I heard that Team Plasma left\\n",
  "many Pokémon behind when they fled.\\c\\n",
  "And I'm helping find their\\n",
  "real Trainers...\\c\\n",
  "That aside...\\c\\n",
  "Since you're here, you should have a\\n",
  "battle with me before you go!$",
]

[msg.section_0.entries.33]
text = [
  "[VAR TRNAME(1)]: Hey, [VAR TRNAME(0)],\\n",
  "have a battle with me before you go!$",
]

[msg.section_0.entries.34]
text = [
  "[VAR TRNAME(1)]: Here I come!\\c$",
]

[msg.section_0.entries.35]
text = [
  "[VAR TRNAME(1)]: Well, that's all right\\n",
  "too, I guess!$",
]

[msg.section_0.entries.36]
text = [
  "[VAR TRNAME(1)]: I suppose that's it.\\c\\n",
  "If winning in battles is strength,\\n",
  "then believing that your Pokémon\\l\\n",
  "will come back and waiting for its return\\l\\n",
  "is also strength.\\c\\n",
  "Doing what you think is right\\n",
  "no matter what anyone else says,\\l\\n",
  "like these guys do, is strength, too.\\c\\n",
  "[VAR TRNAME(0)]!\\n",
  "Come back tomorrow!\\c\\n",
  "I'll take you on again!\\n",
  "That's my way of saying thanks!$",
]

[msg.section_0.entries.37]
text = [
  "Kwip yip!$",
]

[msg.section_0.entries.38]
text = [
  "[VAR TRNAME(0)] received Zorua!$",
]

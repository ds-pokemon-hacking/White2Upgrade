[msg.section_0.entries.0]
text = [
  "???: Oh, it's you again!\\c$",
]

[msg.section_0.entries.1]
text = [
  "If it's not an inconvenience,\\n",
  "may I have a look at your Pokémon?\\c$",
]

[msg.section_0.entries.2]
text = [
  "???: I appreciate your cooperation!\\c$",
]

[msg.section_0.entries.3]
text = [
  "???: Are you sure?\\n",
  "But this is for science!\\c$",
]

[msg.section_0.entries.4]
text = [
  "Oh!\\c\\n",
  "How interesting!\\c\\n",
  "Your [VAR PKNAME(0)] seems to display\\n",
  "more self-confidence than others\\l\\n",
  "of the same species.\\c\\n",
  "And you're a Trainer with\\n",
  "merely three Badges...\\c$",
]

[msg.section_0.entries.5]
text = [
  "Fantastic!\\c\\n",
  "I'm not sure how you're doing it,\\n",
  "but you're bringing out\\l\\n",
  "the power of your Pokémon!\\c$",
]

[msg.section_0.entries.6]
text = [
  "Oh, excuse me! I am a scientist.\\n",
  "My name is Colress.\\c\\n",
  "The theme of my research is:\\n",
  "“Bringing out the\\l\\n",
  "power of Pokémon.\\\"\\c$",
]

[msg.section_0.entries.7]
text = [
  "Bringing out the power of Pokémon!\\c\\n",
  "Is it possible to bring out their\\n",
  "maximum power through the bond\\l\\n",
  "they share with their Trainers?\\c\\n",
  "Or is there some other,\\n",
  "different method?\\c$",
]

[msg.section_0.entries.8]
text = [
  "I'd like to test my theory\\n",
  "by battling with you.\\l\\n",
  "Do you find this acceptable?\\c$",
]

[msg.section_0.entries.9]
text = [
  "Either way, I'll be waiting on\\n",
  "Route 4. It's just beyond here!\\c$",
]

[msg.section_0.entries.10]
text = [
  "I've got some advice for you!\\c\\n",
  "If you want to become strong,\\n",
  "battle lots of Trainers\\l\\n",
  "and know your Pokémon well!\\c$",
]

[msg.section_0.entries.11]
text = [
  "The Funfest Mission\\n",
  "“[VAR FUNFESTMISSION(0)]\\\"\\l\\n",
  "has been added to the Entralink!$",
]

[msg.section_0.entries.12]
text = [
  "If you keep on battling,\\n",
  "you'll get stronger someday!$",
]

[msg.section_0.entries.13]
text = [
  "Castelia City, Central Plaza\\n",
  "Ahead: Route 4$",
]

[msg.section_0.entries.14]
text = [
  "Ahead: Mode Street\\n",
  "Casteliacones and Studio Castelia$",
]

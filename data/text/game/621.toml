[msg.section_0.entries.0]
text = [
  "Bianca's Dad: I see! So you're\\n",
  "on a Pokémon journey, too!\\c\\n",
  "I'm quite impressed with you.\\n",
  "And with your parents, too.\\c\\n",
  "After always being together as a family,\\n",
  "and now not having you around...\\c\\n",
  "I'll bet--no, I'm sure--they're worried\\n",
  "about you out on your own.\\c\\n",
  "Be sure to tell them all about what\\n",
  "happens in your travels.$",
]

[msg.section_0.entries.1]
text = [
  "Bianca's Mom: Oh! So you also received\\n",
  "a Pokédex from Professor Juniper!\\c\\n",
  "That daughter of mine looks at her\\n",
  "Pokédex every chance she gets!\\c\\n",
  "She's always going on about the\\n",
  "many Pokémon and many\\l\\n",
  "memories it contains...$",
]

[msg.section_0.entries.0]
text = [
  "Clay: This time, I'm gonna have ya\\n",
  "participate in the Driftveil Tournament.\\c\\n",
  "Anything goes in this here tournament!\\c\\n",
  "Eight people will be participatin', and if\\n",
  "ya win three times, yer the champion!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Cheren: Why did you call me, too?\\n",
  "I'm busy looking into something!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Clay: Ya know somethin', Cheren.\\n",
  "The one who's gotta show everyone\\l\\n",
  "what Pokémon battlin' means--is you.\\c\\n",
  "And yer pal ain't here, either!\\c\\n",
  "I'm countin' on the power of youth,\\n",
  "'cause everyone likes\\l\\n",
  "up-and-comin' stars!\\c\\n",
  "OK! Whenever yer ready,\\n",
  "get on over to reception!\\c$",
]

[msg.section_0.entries.3]
text = [
  "Clay: Whenever yer ready,\\n",
  "get on over to reception!$",
]

[msg.section_0.entries.4]
text = [
  "Cheren: Man oh man...\\n",
  "You never change, Clay.\\c\\n",
  "But the tournament itself\\n",
  "does look pretty fun!\\c\\n",
  "OK!\\n",
  "I'll go register!\\c$",
]

[msg.section_0.entries.5]
text = [
  "[VAR TRNAME(1)]: Me, too!\\c$",
]

[msg.section_0.entries.6]
text = [
  "[VAR TRNAME(0)]. C'mon! Let's have some fun.\\n",
  "We'll battle, plain and simple!\\c$",
]

[msg.section_0.entries.7]
text = [
  "Clay: An outstandin' battle, runts!\\c\\n",
  "Now everybody's gonna want to\\n",
  "join in on this here tournament\\l\\n",
  "an' show their stuff!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Roxie: Hey! You two!\\c\\n",
  "Haven't you got any wild and crazy\\n",
  "Pokémon battles to show me?!\\c\\n",
  "Guess I'll have to enter the\\n",
  "tournament myself and rock the\\l\\n",
  "audience right outta their seats!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Clay: See what I mean?\\n",
  "People are pourin' in already!\\c\\n",
  "If the strongest Trainers from\\n",
  "all over join in, it'll raise up\\l\\n",
  "everybody's level of skill!\\c\\n",
  "An' then, li'l ol' Driftveil City\\n",
  "will grow even more and make\\l\\n",
  "a heap of money!\\c\\n",
  "So keep on bustin' those battles\\n",
  "and rilin' everybody up! See ya!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Colress: By having battles with\\n",
  "many Trainers, I can bring out\\l\\n",
  "Pokémon's abilities!\\c\\n",
  "Eventually, as I continue to battle,\\n",
  "the truth of my theory\\l\\n",
  "will be evident to all!$",
]

[msg.section_0.entries.11]
text = [
  "[VAR TRNAME(1)]: Aww...\\c\\n",
  "I wanted to win the tournament\\n",
  "the first time I participated!$",
]

[msg.section_0.entries.12]
text = [
  "Cheren: The Unova Gym Leaders\\n",
  "will probably participate in order\\l\\n",
  "to improve their skills.$",
]

[msg.section_0.entries.13]
text = [
  "Someday, I'll be a famous guy!\\c\\n",
  "But for now, I'm just a spectator here.$",
]

[msg.section_0.entries.14]
text = [
  "Many Trainers from far away will come\\n",
  "to participate!$",
]

[msg.section_0.entries.15]
text = [
  "Clay is awesome!\\c\\n",
  "I heard he started all this to encourage\\n",
  "Driftveil City's development!$",
]

[msg.section_0.entries.16]
text = [
  "Two years ago, this was\\n",
  "the Cold Storage area!$",
]

[msg.section_0.entries.17]
text = [
  "That's the Pokémon World Tournament\\n",
  "for you! It's packed with spectators!$",
]

[msg.section_0.entries.18]
text = [
  "It's crazy popular! This is what\\n",
  "packed to the rafters means!$",
]

[msg.section_0.entries.19]
text = [
  "What can I do when\\n",
  "everything's sold out?$",
]

[msg.section_0.entries.20]
text = [
  "It's the Pokémon World Tournament!\\n",
  "It's all in the name!\\c\\n",
  "Trainers have gathered\\n",
  "from all over the world!$",
]

[msg.section_0.entries.21]
text = [
  "Hello there, Trainer.\\n",
  "Let me fill you in about Battle Points.\\c\\n",
  "Battle Points, also known as BP, are\\n",
  "points you get for winning streaks in\\l\\n",
  "either Nimbasa City's Battle Subway\\l\\n",
  "or this tournament.\\c\\n",
  "Win a lot, save up lots of points, and\\n",
  "you can exchange them for useful items!$",
]

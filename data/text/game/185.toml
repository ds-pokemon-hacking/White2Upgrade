[msg]
trailing_data = "0000"

[msg.section_0.entries.0]
text = [
  "My Pokémon used to be wimpy,\\n",
  "but they've trained in the complex,\\l\\n",
  "and now they are very buff!$",
]

[msg.section_0.entries.1]
text = [
  "Trainer!\\c\\n",
  "Just in case your\\n",
  "Pokémon gets burned,\\l\\n",
  "please use this on the Pokémon.\\c$",
]

[msg.section_0.entries.2]
text = [
  "'Cause a Pokémon's HP and Attack stat\\n",
  "go down when it's burned.\\c\\n",
  "It'll be in a mess.$",
]

[msg.section_0.entries.3]
text = [
  "Children teach me many things,\\n",
  "so they are my teachers.\\l\\n",
  "Pokémon are your teachers!$",
]

[msg.section_0.entries.4]
text = [
  "Clerks in Poké Marts\\n",
  "sell different items!$",
]

[msg.section_0.entries.5]
text = [
  "When you use a Repel,\\n",
  "wild Pokémon won't come out as much!\\l\\n",
  "Did you know that?$",
]

[msg.section_0.entries.6]
text = [
  "A Pokémon that jumps out in a battle is\\n",
  "the Pokémon on the top left in the list.\\c\\n",
  "So have a weak Pokémon\\n",
  "on the top left!\\c\\n",
  "When a battle starts,\\n",
  "switch it to a strong Pokémon!\\l\\n",
  "See? I know a great thing, don't I?$",
]

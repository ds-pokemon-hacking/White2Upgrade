[msg.section_0.entries.1]
text = [
  "Hey, Trainer!\\n",
  "The move I recommend for you\\l\\n",
  "is none other than Magic Coat!\\c\\n",
  "Magic Coat can reflect any\\n",
  "opponent's move that lowers stats\\l\\n",
  "or inflicts status conditions during\\l\\n",
  "the turn the move is used.\\c\\n",
  "But, there are moves that\\n",
  "Magic Coat can't reflect,\\l\\n",
  "so be careful!$",
]

[msg.section_0.entries.2]
text = [
  "Hey, Trainer!\\n",
  "The move I recommend for you\\l\\n",
  "is none other than Block!\\c\\n",
  "Block prevents the target\\n",
  "from escaping or switching out.\\c\\n",
  "But, depending on the opponent's\\n",
  "move, held item, or Ability,\\l\\n",
  "it can switch out or escape.\\c\\n",
  "So, don't let your guard down.$",
]

[msg.section_0.entries.3]
text = [
  "Hey, Trainer!\\n",
  "The move I recommend for you\\l\\n",
  "is none other than Gravity!\\c\\n",
  "Gravity intensifies gravity\\n",
  "for five turns, from the turn the move\\l\\n",
  "is used!\\c\\n",
  "When gravity is intensified,\\n",
  "Ground-type moves can hit\\l\\n",
  "Flying-type Pokémon and\\l\\n",
  "Pokémon with the Levitate Ability.\\c\\n",
  "On top of that, the accuracy of\\n",
  "most moves will be boosted.\\c\\n",
  "It also has the effect of making\\n",
  "Fly and Jump Kick unusable.$",
]

[msg.section_0.entries.4]
text = [
  "Hey, Trainer!\\n",
  "The move I recommend for you\\l\\n",
  "is none other than Magnet Rise!\\c\\n",
  "Magnet Rise levitates the user\\n",
  "for five turns from the turn it's used.\\c\\n",
  "After using Magnet Rise,\\n",
  "the Pokémon won't be hit by\\l\\n",
  "Ground-type moves!\\c\\n",
  "Electric- and Steel-type Pokémon\\n",
  "are weak against Ground-type moves.\\c\\n",
  "Have them use the move,\\n",
  "and they can cover their weakness.$",
]

[msg.section_0.entries.5]
text = [
  "Hey, Trainer!\\n",
  "The move I recommend for you\\l\\n",
  "is none other than Last Resort!\\c\\n",
  "Last Resort is seemingly a very powerful\\n",
  "move, but it will fail if the Pokémon who\\l\\n",
  "learned the move hasn't used all of its\\l\\n",
  "other moves.\\c\\n",
  "When to use it is difficult to tell,\\n",
  "but it's a very powerful move!$",
]


[msg]
trailing_data = "baba"

[msg.section_0.entries.0]
text = [
  "[VAR TRNAME(1)]: You're going\\n",
  "to Castelia City, right?$",
]

[msg.section_0.entries.1]
text = [
  "I'm going to look for Team Plasma!\\n",
  "I can't forgive those guys!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Hey, captain!\\n",
  "Show us that ship you're so proud of!\\c$",
]

[msg.section_0.entries.3]
text = [
  "Really?\\c\\n",
  "Something you still need to take care of?\\n",
  "Go deal with it, then.\\c\\n",
  "You know that even after we go to\\n",
  "Castelia City, you can come\\l\\n",
  "back to Virbank anytime, right?$",
]

[msg.section_0.entries.4]
text = [
  "What can I do for you?\\n",
  "Shall we set sail for Castelia City?$",
]

[msg.section_0.entries.5]
text = [
  "Of course!\\n",
  "Please, step this way!\\c$",
]

[msg.section_0.entries.6]
text = [
  "OK then! Please come talk to me\\n",
  "whenever you'd like to board!$",
]

[msg.section_0.entries.7]
text = [
  "The ship to Castelia City\\n",
  "leaves from here!\\c\\n",
  "It can even cross seas that are too\\n",
  "rough for Pokémon to get through!$",
]

[msg.section_0.entries.8]
text = [
  "If you want the captain,\\n",
  "he's in Pokéstar Studios!\\c\\n",
  "His daughter, Roxie, is both a\\n",
  "Gym Leader and a band leader, you know.\\c\\n",
  "Not wanting to be outdone, he said he\\n",
  "needs to be a captain and an actor!$",
]

[msg.section_0.entries.9]
text = [
  "Your life is your own.\\c\\n",
  "You're free to work hard at one thing\\n",
  "or try many different things!$",
]

[msg.section_0.entries.0]
text = [
  "Movie Star$",
]

[msg.section_0.entries.1]
text = [
  "Masked Man$",
]

[msg.section_0.entries.2]
text = [
  "Brycen-Man: Mwahaha!\\c\\n",
  "Let me test you and see if you can defeat\\n",
  "my improved Pokémon party.$",
]

[msg.section_0.entries.3]
text = [
  "Crew: Passengers, we are closing the\\n",
  "boarding procedures. Please proceed.$",
]

[msg.section_0.entries.4]
text = [
  "Brycen-Man: You, again...\\c\\n",
  "Don't be thinking this will turn out\\n",
  "the same way as at the amusement park!$",
]

[msg.section_0.entries.5]
text = [
  "Crew: Passengers, we are departing soon.\\n",
  "Please proceed on board.$",
]

[msg.section_0.entries.6]
text = [
  "Brycen-Man: Arrgh...\\c\\n",
  "I better hurry...$",
]

[msg.section_0.entries.7]
text = [
  "Crew: Passengers, we are departing soon.\\n",
  "Please proceed on board.$",
]

[msg.section_0.entries.8]
text = [
  "Brycen-Man: I don't have much time left!\\n",
  "How annoying!$",
]

[msg.section_0.entries.9]
text = [
  "Crew: Passengers, we are departing now.$",
]

[msg.section_0.entries.10]
text = [
  "Brycen-Man: Arrgh...\\c\\n",
  "Nooooo! I missed the ship!$",
]

[msg.section_0.entries.11]
text = [
  "Brycen-Man: Go, my Pokémon!\\c\\n",
  "Unleash your power, and\\n",
  "destroy everything in the port!\\c\\n",
  "Buy time so I can...$",
]

[msg.section_0.entries.12]
text = [
  "???: Hold it right there!$",
]

[msg.section_0.entries.13]
text = [
  "Brycen-Man: Oh no!\\n",
  "That familiar voice...$",
]

[msg.section_0.entries.14]
text = [
  "???: The Messenger of Truths and Ideals,\\n",
  "The [VAR PKNICK(0)] Girl enters!\\c\\n",
  "Stop right there again, Brycen-Man!\\c\\n",
  "I cannot allow your mischief!$",
]

[msg.section_0.entries.15]
text = [
  "Brycen-Man: I knew it was you,\\n",
  "[VAR PKNICK(0)] Girl!\\c\\n",
  "Mwahaha...\\n",
  "Long time no see...\\c\\n",
  "I'd love to cause you pain slowly here, but\\n",
  "I have no time to play with you today!$",
]

[msg.section_0.entries.16]
text = [
  "Crew: I repeat.\\c\\n",
  "Passengers, we are closing the\\n",
  "boarding procedures. Please proceed.$",
]

[msg.section_0.entries.17]
text = [
  "Brycen-Man: Arrgh...\\n",
  "I don't have time for this...\\c\\n",
  "[VAR PKNICK(0)] Girl,\\n",
  "get out of my way!$",
]

[msg.section_0.entries.18]
text = [
  "The [VAR PKNICK(0)] Girl: Out of MY way!$",
]

[msg.section_0.entries.19]
text = [
  "Brycen-Man: Such a big mouth!\\c\\n",
  "Very well, [VAR PKNICK(0)] Girl!\\n",
  "Let me punish you for making me mad!\\c\\n",
  "I'll sink you and your Pokémon to the\\n",
  "bottom of the sea!$",
]

[msg.section_0.entries.20]
text = [
  "The [VAR PKNICK(0)] Girl: Why would I?$",
]

[msg.section_0.entries.21]
text = [
  "Brycen-Man: Arg! Shut your mouth!\\n",
  "I have nothing to chat with you about!\\c\\n",
  "Get out of my way already!$",
]

[msg.section_0.entries.22]
text = [
  "The [VAR PKNICK(0)] Girl: Bathroom?$",
]

[msg.section_0.entries.23]
text = [
  "Brycen-Man: Stop messing with me!\\c\\n",
  "Brycen-Man, the Masked Man,\\n",
  "never goes to the bathroom!$",
]

[msg.section_0.entries.24]
text = [
  "Crew: Attention, please.\\c\\n",
  "The ship is ready for departure.\\c\\n",
  "Passengers, please proceed to the\\n",
  "nearest counter.$",
]

[msg.section_0.entries.25]
text = [
  "Brycen-Man: Arrgh...\\c\\n",
  "I'm running out of time... The ship...$",
]

[msg.section_0.entries.26]
text = [
  "The [VAR PKNICK(0)] Girl: What's wrong?\\c\\n",
  "You've been acting funny!\\n",
  "You must be planning to do something bad!$",
]

[msg.section_0.entries.27]
text = [
  "Brycen-Man: Silence!\\c\\n",
  "I have no words for you!$",
]

[msg.section_0.entries.28]
text = [
  "The [VAR PKNICK(0)] Girl: You want what?$",
]

[msg.section_0.entries.29]
text = [
  "Brycen-Man: Don't make me repeat it!\\n",
  "I have nothing to tell you, OK!\\c\\n",
  "Just get out of my sight!$",
]

[msg.section_0.entries.30]
text = [
  "The [VAR PKNICK(0)] Girl: Bathroom, right?$",
]

[msg.section_0.entries.31]
text = [
  "Brycen-Man: You are persistent!\\n",
  "I don't need to go to the bathroom\\l\\n",
  "at this moment!\\c\\n",
  "You underestimate what a Masked Man can do!\\n",
  "Let me crush you!$",
]

[msg.section_0.entries.32]
text = [
  "The [VAR PKNICK(0)] Girl: So suspicious!$",
]

[msg.section_0.entries.33]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "I am a Masked Man!\\l\\n",
  "Being suspicious is part of wearing a mask!\\c\\n",
  "How could a little girl like you even begin\\n",
  "to understand my great ambition?!$",
]

[msg.section_0.entries.34]
text = [
  "Whistles: Toot toot toot!$",
]

[msg.section_0.entries.35]
text = [
  "Brycen-Man: Arrgh...\\c\\n",
  "The ship...\\n",
  "The ship has departed...$",
]

[msg.section_0.entries.36]
text = [
  "The [VAR PKNICK(0)] Girl: Brycen-Man!\\n",
  "You are so predictable!\\l\\n",
  "The cruise ship is gone!\\c\\n",
  "She departed safely with the\\n",
  "black diamond you were after!$",
]

[msg.section_0.entries.37]
text = [
  "Brycen-Man: Arrgh...\\c\\n",
  "I cannot give up yet... Desperate times call\\n",
  "for desperate measures!$",
]

[msg.section_0.entries.38]
text = [
  "The [VAR PKNICK(0)] Girl: Brycen-Man!$",
]

[msg.section_0.entries.39]
text = [
  "Splash!$",
]

[msg.section_0.entries.40]
text = [
  "The [VAR PKNICK(0)] Girl: Really?\\n",
  "Those were your desperate measures?\\c\\n",
  "I can't keep up with you...$",
]

[msg.section_0.entries.41]
text = [
  "Brycen-Man: To fulfill my great ambition,\\n",
  "the black diamond is absolutely necessary!\\c\\n",
  "I must obtain it no matter how many\\n",
  "sacrifices I have to make.\\l\\n",
  "Don't underestimate masked men!\\c\\n",
  "Farewell, [VAR PKNICK(0)] Girl!$",
]

[msg.section_0.entries.42]
text = [
  "Brycen-Man, the Masked Man,\\n",
  "disappeared into the ocean\\l\\n",
  "to go after the luxury liner.\\c\\n",
  "What is the nature of his terrible ambition?\\n",
  "What makes him go after the black diamond\\l\\n",
  "so persistently?\\c\\n",
  "Whatever his plan is,\\n",
  "we can count on the [VAR PKNICK(0)] Girl!\\c\\n",
  "Go on, [VAR PKNICK(0)] Girl!\\c\\n",
  "Good luck, [VAR PKNICK(0)] Girl!$",
]

[msg.section_0.entries.43]
text = [
  "Brycen-Man: This can't be...\\c\\n",
  "With my Pokémon defeated,\\n",
  "I cannot steal that hidden treasure,\\l\\n",
  "the black diamond, on the cruise ship...$",
]

[msg.section_0.entries.44]
text = [
  "The [VAR PKNICK(0)] Girl: ...What did you say?\\n",
  "A hidden treasure? A black diamond?$",
]

[msg.section_0.entries.45]
text = [
  "Brycen-Man: You don't know anything...\\c\\n",
  "The black diamond is a mysterious hidden\\n",
  "treasure that multiplies the power of\\l\\n",
  "its owner.$",
]

[msg.section_0.entries.46]
text = [
  "The [VAR PKNICK(0)] Girl: A jewel with\\n",
  "such a great power...$",
]

[msg.section_0.entries.47]
text = [
  "Brycen-Man: That's right!\\c\\n",
  "With the black diamond,\\n",
  "a little girl like you won't be...$",
]

[msg.section_0.entries.48]
text = [
  "The [VAR PKNICK(0)] Girl: Giggle giggle...$",
]

[msg.section_0.entries.49]
text = [
  "Brycen-Man: What's so funny...?$",
]

[msg.section_0.entries.50]
text = [
  "The [VAR PKNICK(0)] Girl: Giggle!\\c\\n",
  "Are you telling me with this black diamond,\\n",
  "I'll be an even cuter heroine?$",
]

[msg.section_0.entries.51]
text = [
  "Brycen-Man: Arrgh...\\n",
  "You are not thinking about...$",
]

[msg.section_0.entries.52]
text = [
  "The [VAR PKNICK(0)] Girl: Giggle.\\c\\n",
  "Something just came up.\\n",
  "See you!$",
]

[msg.section_0.entries.53]
text = [
  "Brycen-Man: Wow, wow... Wait!\\n",
  "Aren't you the heroine here?$",
]

[msg.section_0.entries.54]
text = [
  "The [VAR PKNICK(0)] Girl defeated\\n",
  "Brycen-Man, the Masked Man!\\c\\n",
  "Hearing from him the power of the black\\n",
  "diamond, she is now after the cruise ship!\\c\\n",
  "Come on, [VAR PKNICK(0)] Girl!\\c\\n",
  "Wake up, [VAR PKNICK(0)] Girl!$",
]

[msg.section_0.entries.55]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "I am always quite busy.\\c\\n",
  "So being quick is my second nature.\\n",
  "That's how a great Masked Man should be!$",
]

[msg.section_0.entries.56]
text = [
  "[VAR PKNICK(0)] Girl: Aiyee!\\n",
  "This can't be happening...$",
]

[msg.section_0.entries.57]
text = [
  "The [VAR PKNICK(0)] Girl was\\n",
  "defeated by Brycen-Man, the Masked Man...\\c\\n",
  "And what's worse...\\c\\n",
  "Brycen-Man managed to steal the black\\n",
  "diamond that was on board the luxury liner,\\l\\n",
  "sold it for a fortune to retire,\\l\\n",
  "and lived happily ever after.\\c\\n",
  "Long story short...\\c\\n",
  "Too bad, [VAR PKNICK(0)] Girl!\\c\\n",
  "Good-bye, [VAR PKNICK(0)] Girl!$",
]

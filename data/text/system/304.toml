[msg.section_0.entries.0]
text = [
  "[CENTER]Ghost Erasers...\\n",
  "\\n",
  "\\n",
  "[CENTER]Requests come from all over\\n",
  "[CENTER]due to their tremendous skill...$",
]

[msg.section_0.entries.1]
text = [
  "[CENTER]But for them,\\n",
  "[CENTER]business is everything...$",
]

[msg.section_0.entries.2]
text = [
  "[CENTER]If you can't pay their substantial fee,\\n",
  "[CENTER]they won't help you...$",
]

[msg.section_0.entries.3]
text = [
  "[CENTER]Ghost Eraser Case Files\\n",
  "\\n",
  "[CENTER]Case No. 003\\n",
  "\\n",
  "[CENTER]Code Name: [VAR PKNICK(0)]$",
]

[msg.section_0.entries.4]
text = [
  "[CENTER]This request is from an archeologist,\\n",
  "\\n",
  "[CENTER]and it concerns a cursed treasure.$",
]

[msg.section_0.entries.5]
text = [
  "[CENTER]The excavated statue apparently\\n",
  "\\n",
  "[CENTER]takes on a life of its own at midnight\\n",
  "\\n",
  "[CENTER]and attacks people.$",
]

[msg.section_0.entries.6]
text = [
  "[CENTER]Moreover, it is thought this statue\\n",
  "\\n",
  "[CENTER]was made by a group of people\\n",
  "\\n",
  "[CENTER]who followed the Majin of Mayhem!$",
]

[msg.section_0.entries.7]
text = [
  "[CENTER]For this investigation,\\n",
  "\\n",
  "[CENTER]we will handle it directly.$",
]


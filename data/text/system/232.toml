[msg.section_0.entries.0]
text = [
  "Fine Actor$",
]

[msg.section_0.entries.1]
text = [
  "Mystery Man$",
]

[msg.section_0.entries.2]
text = [
  "River: You're quite stubborn...$",
]

[msg.section_0.entries.3]
text = [
  "[VAR TRNAME(1)]: Arrrgh!\\n",
  "Please give up already!$",
]

[msg.section_0.entries.4]
text = [
  "River: Why do you care?\\c\\n",
  "For you, it's just some kind of Poké Ball.$",
]

[msg.section_0.entries.5]
text = [
  "???: Excuse me...$",
]

[msg.section_0.entries.6]
text = [
  "[VAR TRNAME(1)]: Who are you?$",
]

[msg.section_0.entries.7]
text = [
  "???: My name is River.\\c\\n",
  "I sold you a Poké Ball the other day.\\c\\n",
  "Do you have a minute?$",
]

[msg.section_0.entries.8]
text = [
  "[VAR TRNAME(1)]: Er...\\c\\n",
  "I'm sorry.\\n",
  "I'm busy right now.$",
]

[msg.section_0.entries.9]
text = [
  "River: I see.\\n",
  "Then I'll get right to the point.\\c\\n",
  "That Poké Ball I sold you...\\c\\n",
  "I need you to give it back.$",
]

[msg.section_0.entries.10]
text = [
  "[VAR TRNAME(1)]: Uh, why?$",
]

[msg.section_0.entries.11]
text = [
  "River: ...\\c\\n",
  "There was a small slipup, that's all.\\n",
  "Mind you, I'm not asking to get it\\l\\n",
  "back for free.\\c\\n",
  "I'll pay whatever price you want.$",
]

[msg.section_0.entries.12]
text = [
  "[VAR TRNAME(1)]: Well, er...\\n",
  "I'm sorry. I can't give it back.$",
]

[msg.section_0.entries.13]
text = [
  "River: Truly?\\n",
  "I'm sorry you won't agree to give it back.\\c\\n",
  "Sadly, I have to get it from you anyway...\\n",
  "By force, if I have to!$",
]

[msg.section_0.entries.14]
text = [
  "[VAR TRNAME(1)]: Huh?$",
]

[msg.section_0.entries.15]
text = [
  "River: Again, sorry...\\c\\n",
  "It's not your fault, but I have no choice.$",
]

[msg.section_0.entries.16]
text = [
  "[VAR TRNAME(1)]: Huh? You mean--violence?$",
]

[msg.section_0.entries.17]
text = [
  "River: I know, I know, and I'm sorry.\\n",
  "But it just cannot be helped...$",
]

[msg.section_0.entries.18]
text = [
  "[VAR TRNAME(1)]: No way!\\n",
  "What have I done to deserve this?$",
]

[msg.section_0.entries.19]
text = [
  "River: Apologies all over again...\\c\\n",
  "But...\\n",
  "I must get that Poké Ball back at any cost!$",
]

[msg.section_0.entries.20]
text = [
  "[VAR TRNAME(1)]: That's totally unfair!\\n",
  "Besides, no matter how much you want it,\\l\\n",
  "the Poké Ball was...$",
]

[msg.section_0.entries.21]
text = [
  "River: W-was? What happened?\\c\\n",
  "Did you...\\n",
  "Have you...used that Poké Ball already?!$",
]

[msg.section_0.entries.22]
text = [
  "[VAR TRNAME(1)]: Well...er...$",
]

[msg.section_0.entries.23]
text = [
  "River: No matter.\\c\\n",
  "Whatever happened,\\n",
  "I'll get that Poké Ball back!$",
]

[msg.section_0.entries.24]
text = [
  "[VAR TRNAME(1)]: It opened all by itself!$",
]

[msg.section_0.entries.25]
text = [
  "River: Opened all by itself...\\n",
  "That's what I was afraid of...$",
]

[msg.section_0.entries.26]
text = [
  "[VAR TRNAME(1)]: It wasn't me!$",
]

[msg.section_0.entries.27]
text = [
  "River: What are you talking about?\\n",
  "There's no one else here.\\c\\n",
  "Now stop making trouble and\\n",
  "give the Poké Ball back to me!$",
]

[msg.section_0.entries.28]
text = [
  "[VAR TRNAME(1)]: Never mind! No way!$",
]

[msg.section_0.entries.29]
text = [
  "River: Talk, don't talk... I don't care!\\n",
  "But I'm getting that Poké Ball back!$",
]

[msg.section_0.entries.30]
text = [
  "River: Urk...\\n",
  "You're quite good...$",
]

[msg.section_0.entries.31]
text = [
  "[VAR TRNAME(1)]: Hfff, hfff...\\c\\n",
  "Whew! Enough!\\c\\n",
  "I can't give you the Poké Ball back!\\c\\n",
  "So please leave now!$",
]

[msg.section_0.entries.32]
text = [
  "River: I am sorry, but I cannot leave.\\c\\n",
  "I wish I didn't have to go this far, but...$",
]

[msg.section_0.entries.33]
text = [
  "Wham!$",
]

[msg.section_0.entries.34]
text = [
  "[VAR TRNAME(1)]: Eek!$",
]

[msg.section_0.entries.35]
text = [
  "River: I apologize.\\c\\n",
  "But I cannot permit the existence of\\n",
  "this Poké Ball to be made public!$",
]

[msg.section_0.entries.36]
text = [
  "...I was attacked by a man\\n",
  "who identified himself as River...\\c\\n",
  "I lost consciousness...\\c\\n",
  "...When I regained consciousness,\\n",
  "the man had disappeared\\l\\n",
  "and the Poké Ball was gone.\\c\\n",
  "On the table in its place, there was\\n",
  "a pile of money I'd never seen before...\\c\\n",
  "Monica's inside the Poké Ball...\\n",
  "Oh, what will happen to her?$",
]

[msg.section_0.entries.37]
text = [
  "River: Apologies.\\n",
  "I didn't want to get rough with you, but...$",
]

[msg.section_0.entries.38]
text = [
  "[VAR TRNAME(1)]: Hfff, pfff... Hfff, pfff...$",
]

[msg.section_0.entries.39]
text = [
  "River: Sorry, but I must take the Poké Ball.$",
]

[msg.section_0.entries.40]
text = [
  "[VAR TRNAME(1)]: Wait!\\n",
  "My girlfriend is inside the Poké Ball!$",
]

[msg.section_0.entries.41]
text = [
  "River: Heh.\\n",
  "What are you talking about?\\c\\n",
  "I don't have time for jokes.\\c\\n",
  "Excuse me, if you please.$",
]

[msg.section_0.entries.42]
text = [
  "[VAR TRNAME(1)]: Agh! Hurry!\\n",
  "I have to catch up with him!$",
]

[msg.section_0.entries.43]
text = [
  "The man who identified himself as River\\n",
  "took the Poké Ball by force.\\c\\n",
  "Monica is inside the Poké Ball!\\n",
  "I have to catch up with him right away!$",
]

[msg.section_0.entries.44]
text = [
  "[VAR TRNAME(1)]: Hfff, pfff... Hfff, pfff...$",
]

[msg.section_0.entries.45]
text = [
  "River: Heh heh...\\c\\n",
  "You continue to challenge me,\\n",
  "and you're not afraid of me...\\c\\n",
  "I'm impressed.\\n",
  "But...\\c\\n",
  "It's just a Poké Ball to you, right?\\n",
  "Not to mention the money I offered!\\c\\n",
  "Why are you going to these lengths\\n",
  "to keep this Poké Ball?$",
]

[msg.section_0.entries.46]
text = [
  "[VAR TRNAME(1)]: Hfff, pfff... Hfff, pfff...\\c\\n",
  "I have to!\\n",
  "Inside the Poké Ball is Monica!\\c\\n",
  "My girlfriend is trapped inside\\n",
  "that strange Poké Ball!\\c$",
]

[msg.section_0.entries.47]
text = [
  "River: Your girlfriend?$",
]

[msg.section_0.entries.48]
text = [
  "[VAR TRNAME(1)]: Yes, my girlfriend! That's why\\n",
  "I can't let you have the Poké Ball!$",
]

[msg.section_0.entries.49]
text = [
  "River: Heh.\\c\\n",
  "It's touching that you can treasure a\\n",
  "Pokémon as much as you would a girlfriend.\\c\\n",
  "I like that.\\n",
  "I respect your feelings.$",
]

[msg.section_0.entries.50]
text = [
  "[VAR TRNAME(1)]: Wha...?$",
]

[msg.section_0.entries.51]
text = [
  "River: Heh.\\n",
  "Sweet. Here, you keep the Poké Ball.\\c\\n",
  "You can live happily ever after\\n",
  "with your Pokémon...$",
]

[msg.section_0.entries.52]
text = [
  "[VAR TRNAME(1)]: But...er...$",
]

[msg.section_0.entries.53]
text = [
  "River: Heh heh.\\c\\n",
  "You don't have to thank me.\\n",
  "Be happy with your “girlfriend\\\"...$",
]

[msg.section_0.entries.54]
text = [
  "[VAR TRNAME(1)]: Er...\\n",
  "That's not what I...$",
]

[msg.section_0.entries.55]
text = [
  "The man identified as River, who had\\n",
  "suddenly appeared, left just as suddenly,\\l\\n",
  "having misunderstood my words...\\c\\n",
  "Alone once more, I tried to open the\\n",
  "strange Poké Ball and rescue my girlfriend.\\c\\n",
  "But it would not open,\\n",
  "no matter how hard I tried.\\c\\n",
  "Oh, Monica, my darling...\\c\\n",
  "What will happen to you?$",
]

[msg.section_0.entries.56]
text = [
  "[VAR TRNAME(1)]: Argh! What is this?\\n",
  "Knock it off!$",
]

[msg.section_0.entries.57]
text = [
  "River: Sorry.\\n",
  "But I have my reasons...\\c\\n",
  "I can't afford to be picky\\n",
  "about my methods.$",
]

[msg.section_0.entries.58]
text = [
  "[VAR TRNAME(1)]: What do you mean?$",
]

[msg.section_0.entries.59]
text = [
  "River: Never mind.\\c\\n",
  "What matters is getting the Poké Ball back.$",
]

[msg.section_0.entries.60]
text = [
  "[VAR TRNAME(1)]: Thief!$",
]

[msg.section_0.entries.61]
text = [
  "River: Me? A thief?!\\c\\n",
  "You're not a very good judge of character!$",
]

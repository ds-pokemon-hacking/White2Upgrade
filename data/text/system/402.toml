  "this attack's damage increases.$",
]

[msg.section_0.entries.515]
text = [
  "The user risks everything to attack its\\n",
  "target. The user faints but does damage\\n",
  "equal to the user's HP.$",
]

[msg.section_0.entries.516]
text = [
  "The user passes its held item to the\\n",
  "target when the target isn't holding\\n",
  "an item.$",
]

[msg.section_0.entries.517]
text = [
  "The user attacks by engulfing the target\\n",

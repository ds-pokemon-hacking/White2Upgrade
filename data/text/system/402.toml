  "The user stimulates its brain by thinking\\n",
  "bad thoughts.\\n",
  "It sharply raises the user's Sp. Atk.$",
]

[msg.section_0.entries.418]
text = [
  "The user strikes the target\\n",
  "with tough punches as fast as bullets.\\n",
  "This move always goes first.$",
]

[msg.section_0.entries.419]
text = [
  "An attack move that inflicts double the\\n",
  "damage if the user has been hurt by the\\n",
  "target in the same turn.$",
]

[msg.section_0.entries.420]
text = [
  "The user flash freezes chunks of\\n",
  "ice and hurls them at the target.\\n",
  "This move always goes first.$",
]

[msg.section_0.entries.421]
text = [
  "The user slashes with a sharp claw made\\n",
  "from shadows.\\n",
  "Critical hits land more easily.$",
]

[msg.section_0.entries.422]
text = [
  "The user bites with electrified fangs.\\n",
  "It may also make the target flinch or\\n",
  "leave it with paralysis.$",
]

[msg.section_0.entries.423]
text = [
  "The user bites with cold-infused fangs.\\n",
  "It may also make the target flinch or\\n",
  "leave it frozen.$",
]

[msg.section_0.entries.424]
text = [
  "The user bites with flame-cloaked fangs.\\n",
  "It may also make the target flinch or leave\\n",
  "it burned.$",
]

[msg.section_0.entries.425]
text = [
  "The user extends its shadow and attacks\\n",
  "the target from behind.\\n",
  "This move always goes first.$",
]

[msg.section_0.entries.426]
text = [
  "The user launches a hard-packed\\n",
  "mud ball to attack.\\n",
  "It may also lower the target's accuracy.$",
]

[msg.section_0.entries.427]
text = [
  "The user tears at the target with blades\\n",
  "formed by psychic power.\\n",
  "Critical hits land more easily.$",
]

[msg.section_0.entries.428]
text = [
  "The user focuses its willpower to its head\\n",
  "and attacks the target.\\n",
  "It may also make the target flinch.$",
]

[msg.section_0.entries.429]
text = [
  "The user looses a flash of energy at\\n",
  "the target from its polished body.\\n",
  "It may also lower the target's accuracy.$",
]

[msg.section_0.entries.430]
text = [
  "The user gathers all its light energy and\\n",
  "releases it at once. It may also lower the\\n",
  "target's Sp. Def stat.$",
]

[msg.section_0.entries.431]
text = [
  "The user attacks the target by smashing\\n",
  "into it with incredible force.\\n",
  "It may also confuse the target.$",
]

[msg.section_0.entries.432]
text = [
  "A strong wind blows away the target's\\n",
  "obstacles such as Reflect or Light Screen.\\n",
  "It also lowers the target's evasiveness.$",
]

[msg.section_0.entries.433]
text = [
  "The user creates a bizarre area in which\\n",
  "slower Pokémon get to move first for\\n",
  "five turns.$",
]

[msg.section_0.entries.434]
text = [
  "Comets are summoned down from the sky\\n",
  "onto the target. The attack's recoil\\n",
  "harshly reduces the user's Sp. Atk stat.$",
]

[msg.section_0.entries.435]
text = [
  "A flare of electricity is loosed to strike\\n",
  "the area around the user.\\n",
  "It may also cause paralysis.$",
]

[msg.section_0.entries.436]
text = [
  "An inferno of scarlet flames torches\\n",
  "everything around the user. It may\\n",
  "leave targets with a burn.$",
]

[msg.section_0.entries.437]
text = [
  "The user whips up a storm of leaves around\\n",
  "the target. The attack's recoil harshly\\n",
  "reduces the user's Sp. Atk stat.$",
]

[msg.section_0.entries.438]
text = [
  "The user violently whirls its vines or\\n",
  "tentacles to harshly lash the target.$",
]

[msg.section_0.entries.439]
text = [
  "The user launches a huge boulder at the\\n",
  "target to attack. It must rest on the\\n",
  "next turn, however.$",
]

[msg.section_0.entries.440]
text = [
  "A slashing attack with a poisonous blade\\n",
  "that may also leave the target poisoned.\\n",
  "Critical hits land more easily.$",
]

[msg.section_0.entries.441]
text = [
  "The user shoots filthy garbage\\n",
  "at the target to attack.\\n",
  "It may also poison the target.$",
]

[msg.section_0.entries.442]
text = [
  "The user slams the target\\n",
  "with its steel-hard head.\\n",
  "It may also make the target flinch.$",
]

[msg.section_0.entries.443]
text = [
  "The user launches steel bombs that\\n",
  "stick to the target.\\n",
  "This attack will not miss.$",
]

[msg.section_0.entries.444]
text = [
  "The user stabs the foe with\\n",
  "sharpened stones from below.\\n",
  "It has a high critical-hit ratio.$",
]

[msg.section_0.entries.445]
text = [
  "If it is the opposite gender of the user,\\n",
  "the target is charmed into harshly\\n",
  "lowering its Sp. Atk stat.$",
]

[msg.section_0.entries.446]
text = [
  "The user lays a trap of levitating stones\\n",
  "around the opponent's team. The trap\\n",
  "hurts opponents that switch into battle.$",
]

[msg.section_0.entries.447]
text = [
  "The user snares the target with grass and\\n",
  "trips it. The heavier the target,\\n",
  "the greater the damage.$",
]

[msg.section_0.entries.448]
text = [
  "The user attacks using a sound wave\\n",
  "based on words it has learned.\\n",
  "It may also confuse the target.$",
]

[msg.section_0.entries.449]
text = [
  "The user releases countless shots of\\n",
  "light at the target. Its type varies with\\n",
  "the kind of Plate the user is holding.$",
]

[msg.section_0.entries.450]
text = [
  "The user bites the target. If the target\\n",
  "is holding a Berry, the user eats it and\\n",
  "gains its effect.$",
]

[msg.section_0.entries.451]
text = [
  "The user attacks with an electric\\n",
  "charge. The user may use any remaining\\n",
  "electricity to raise its Sp. Atk stat.$",
]

[msg.section_0.entries.452]
text = [
  "The user slams its rugged body into the\\n",
  "target to attack. The user also sustains\\n",
  "serious damage.$",
]

[msg.section_0.entries.453]
text = [
  "The user lunges at the target at a speed\\n",
  "that makes it almost invisible. It is sure\\n",
  "to strike first.$",
]

[msg.section_0.entries.454]
text = [
  "The user calls out its underlings to\\n",
  "pummel the target.\\n",
  "Critical hits land more easily.$",
]

[msg.section_0.entries.455]
text = [
  "The user calls out its underlings to\\n",
  "shield its body, raising its Defense\\n",
  "and Sp. Def stats.$",
]

[msg.section_0.entries.456]
text = [
  "The user calls out its underlings to\\n",
  "heal it. The user regains up to half of its\\n",
  "max HP.$",
]

[msg.section_0.entries.457]
text = [
  "The user attacks the target with a\\n",
  "hazardous, full-power headbutt.\\n",
  "The user also takes terrible damage.$",
]

[msg.section_0.entries.458]
text = [
  "The user slams the target with a long tail,\\n",
  "vines, or tentacle.\\n",
  "The target is hit twice in a row.$",
]

[msg.section_0.entries.459]
text = [
  "The user blasts the target with power\\n",
  "that distorts even time.\\n",
  "The user must rest on the next turn.$",
]

[msg.section_0.entries.460]
text = [
  "The user tears the target along with the\\n",
  "space around it.\\n",
  "Critical hits land more easily.$",
]

[msg.section_0.entries.461]
text = [
  "The user faints. In return, the Pokémon\\n",
  "taking its place will have its status and\\n",
  "HP fully restored.$",
]

[msg.section_0.entries.462]
text = [
  "The target is crushed with great force.\\n",
  "The attack is more powerful the more\\n",
  "HP the target has left.$",
]

[msg.section_0.entries.463]
text = [
  "The target becomes trapped\\n",
  "within a maelstrom of fire that rages\\n",
  "for four to five turns.$",
]

[msg.section_0.entries.464]
text = [
  "Opposing Pokémon are dragged into\\n",
  "a world of total darkness that makes\\n",
  "them sleep.$",
]

[msg.section_0.entries.465]
text = [
  "The user emits a shock wave from\\n",
  "its body to attack its target. It may\\n",
  "harshly lower the target's Sp. Def.$",
]

[msg.section_0.entries.466]
text = [
  "The user blasts the target with a gust of\\n",
  "repulsive wind. It may also raise all the\\n",
  "user's stats at once.$",
]

[msg.section_0.entries.467]
text = [
  "The user disappears, then strikes the\\n",
  "target on the second turn.\\n",
  "It hits even if the target protects itself.$",
]

[msg.section_0.entries.468]
text = [
  "The user sharpens its claws to\\n",
  "boost its Attack stat and accuracy.$",
]

[msg.section_0.entries.469]
text = [
  "The user and its allies are protected from\\n",

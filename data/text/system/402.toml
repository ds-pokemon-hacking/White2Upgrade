]

[msg.section_0.entries.482]
text = [
  "It swamps the area around the user with a\\n",
  "giant sludge wave.\\n",
  "It may also poison those hit.$",
]

[msg.section_0.entries.483]
text = [
  "The user lightly performs a beautiful,\\n",
  "mystic dance. It boosts the user's\\n",
  "Sp. Atk, Sp. Def, and Speed stats.$",
]

[msg.section_0.entries.484]
text = [
  "The user slams into the target with its\\n",
  "heavy body. The more the user outweighs\\n",
  "the target, the greater its damage.$",
]

[msg.section_0.entries.485]
text = [
  "Using an odd shock wave, the user\\n",
  "inflicts damage on any Pokémon of the same\\n",
  "type in the area around it.$",
]

[msg.section_0.entries.486]
text = [
  "The user hurls an electric orb\\n",
  "at the target. The faster the user is\\n",
  "than the target, the greater the damage.$",
]

[msg.section_0.entries.487]
text = [
  "The user shoots a torrent of water\\n",
  "at the target and changes\\n",
  "the target's type to Water.$",
]

[msg.section_0.entries.488]
text = [
  "The user cloaks itself with flame and\\n",
  "attacks. Building up more power,\\n",
  "it raises the user's Speed stat.$",
]

[msg.section_0.entries.489]
text = [
  "The user coils up and concentrates.\\n",
  "This raises its Attack and Defense stats\\n",
  "as well as its accuracy.$",
]

[msg.section_0.entries.490]
text = [
  "The user attacks the target's legs\\n",
  "swiftly, reducing the target's\\n",
  "Speed stat.$",
]

[msg.section_0.entries.491]
text = [
  "The user spits fluid that works to melt\\n",
  "the target. This harshly reduces\\n",
  "the target's Sp. Def stat.$",
]

[msg.section_0.entries.492]
text = [
  "The user turns the target's power\\n",
  "against it. The higher the target's\\n",
  "Attack stat, the greater the damage.$",
]

[msg.section_0.entries.493]
text = [
  "The user's mysterious psychic wave\\n",
  "changes the target's Ability to Simple.$",
]

[msg.section_0.entries.494]
text = [
  "The user dances with an odd rhythm that\\n",
  "compels the target to mimic it, making the\\n",
  "target's Ability the same as the user's.$",
]

[msg.section_0.entries.495]
text = [
  "The user helps the target and makes it\\n",
  "use its move right after the user.$",
]

[msg.section_0.entries.496]
text = [
  "The user attacks the target with a song.\\n",
  "Others can join in the Round and make\\n",
  "the attack do greater damage.$",
]

[msg.section_0.entries.497]
text = [
  "The user attacks the target with an\\n",
  "echoing voice. If this move is used\\n",
  "every turn, it does greater damage.$",
]

[msg.section_0.entries.498]
text = [
  "Looking for an opening, the user strikes\\n",
  "continually. The target's stat changes\\n",
  "don't affect this attack's damage.$",
]

[msg.section_0.entries.499]
text = [
  "The user attacks by throwing a clump of\\n",
  "special mud. All status changes are\\n",
  "returned to normal.$",
]

[msg.section_0.entries.500]
text = [
  "The user attacks the target with stored\\n",
  "power. The more the user's stats are\\n",
  "raised, the greater the damage.$",
]

[msg.section_0.entries.501]
text = [
  "The user protects itself and its allies\\n",
  "from priority moves. If used in\\n",
  "succession, its chance of failing rises.$",
]

[msg.section_0.entries.502]
text = [
  "The user teleports using a strange power\\n",
  "and switches its place with one of\\n",
  "its allies.$",
]

[msg.section_0.entries.503]
text = [
  "The user shoots boiling hot water at\\n",
  "its target. It may also leave the target\\n",
  "with a burn.$",
]

[msg.section_0.entries.504]
text = [
  "The user breaks its shell, lowering its\\n",
  "Defense and Sp. Def stats but sharply\\n",
  "raising Attack, Sp. Atk, and Speed stats.$",
]

[msg.section_0.entries.505]
text = [
  "The user emits a healing pulse which\\n",
  "restores the target's HP by up to\\n",
  "half of its max HP.$",
]

[msg.section_0.entries.506]
text = [
  "This relentless attack does massive\\n",
  "damage to a target affected\\n",
  "by status problems.$",
]

[msg.section_0.entries.507]
text = [
  "The user takes the target into the sky,\\n",
  "then drops it during the next turn.\\n",
  "The target cannot attack while in the sky.$",
]

[msg.section_0.entries.508]
text = [
  "The user rotates its gears, raising its\\n",

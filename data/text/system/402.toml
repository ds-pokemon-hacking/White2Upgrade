[msg.section_0.entries.549]
text = [
  "The user attacks by blowing freezing cold\\n",
  "air at opposing Pokémon. This attack\\n",
  "reduces the targets' Speed stat.$",
]

[msg.section_0.entries.550]
text = [
  "The user charges its target, surrounding\\n",
  "itself with a great amount of electricity.\\n",
  "It may leave the target with paralysis.$",
]

[msg.section_0.entries.551]
text = [
  "The user attacks by engulfing the target\\n",
  "in an intense, yet beautiful, blue flame.\\n",
  "It may leave the target with a burn.$",
]

[msg.section_0.entries.552]
text = [
  "Cloaked in flames, the user dances\\n",
  "and flaps its wings. It may also\\n",
  "raise the user's Sp. Atk stat.$",
]

[msg.section_0.entries.553]
text = [
  "On the second turn, the user hits the\\n",
  "target with electrically charged ice.\\n",
  "It may leave the target with paralysis.$",
]

[msg.section_0.entries.554]
text = [
  "On the second turn, an ultracold,\\n",
  "freezing wind surrounds the target.\\n",
  "This may leave the target with a burn.$",
]

[msg.section_0.entries.555]
text = [
  "The user yells as if it is ranting about\\n",
  "something, making the targets' Sp. Atk\\n",
  "stat decrease.$",
]

[msg.section_0.entries.556]
text = [
  "The user attacks by harshly dropping\\n",
  "an icicle onto the target.\\n",
  "It may also make the target flinch.$",
]

[msg.section_0.entries.557]
text = [
  "With a hot flame on its forehead, the user\\n",
  "hurls itself at its target. It lowers the\\n",
  "user's Defense, Sp. Def, and Speed stats.$",
]

[msg.section_0.entries.558]
text = [
  "The user brings down a giant flame.\\n",
  "This attack does greater damage when\\n",
  "influenced by an enormous thunderbolt.$",
]

[msg.section_0.entries.559]
text = [
  "The user throws down a giant thunderbolt.\\n",
  "This attack does greater damage\\n",
  "when influenced by an enormous flame.$",
]


  "with those of its target's.$",
]

[msg.section_0.entries.471]
text = [
  "The user employs its psychic power to\\n",
  "average its Attack and Sp. Atk stats\\n",
  "with those of the target's.$",
]

[msg.section_0.entries.472]
text = [
  "The user creates a bizarre area in which\\n",

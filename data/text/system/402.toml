]

[msg.section_0.entries.478]
text = [
  "The user creates a bizarre area\\n",
  "in which Pokémon's held items\\n",
  "lose their effects for five turns.$",
]

[msg.section_0.entries.479]
text = [
  "The user throws a stone or projectile to\\n",
  "attack an opponent. A flying Pokémon will\\n",

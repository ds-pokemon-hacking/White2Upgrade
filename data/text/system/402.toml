]

[msg.section_0.entries.480]
text = [
  "The user strikes the target with a fierce\\n",
  "blow. This attack always results in a\\n",
  "critical hit.$",
]

[msg.section_0.entries.481]
text = [
  "The user attacks the target with a\\n",
  "bursting flame. The bursting flame damages\\n",

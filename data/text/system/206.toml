[msg]
trailing_data = "2c2c"

[msg.section_0.entries.0]
text = [
  "Comedian$",
]

[msg.section_0.entries.1]
text = [
  "Working Man$",
]

[msg.section_0.entries.2]
text = [
  "Man: Whoooa...\\c\\n",
  "What in the world is this?$",
]

[msg.section_0.entries.3]
text = [
  "???: Deegeegaan!$",
]

[msg.section_0.entries.4]
text = [
  "[VAR TRNAME(1)]: What's this?$",
]

[msg.section_0.entries.5]
text = [
  "Radio: What happened, [VAR TRNAME(1)]?\\n",
  "Did something happen?$",
]

[msg.section_0.entries.6]
text = [
  "[VAR TRNAME(1)]: I was patrolling and heard a\\n",
  "sudden scream, so I came to track down\\l\\n",
  "the source of the disturbance.$",
]

[msg.section_0.entries.7]
text = [
  "Radio: Then?$",
]

[msg.section_0.entries.8]
text = [
  "[VAR TRNAME(1)]: I found an enormous Tyranitar\\n",
  "behaving in an unusually violent manner...\\c\\n",
  "No...\\c\\n",
  "This is not an ordinary Tyranitar...\\c\\n",
  "Its entire body is covered with\\n",
  "a metal I've never seen before!$",
]

[msg.section_0.entries.9]
text = [
  "Radio: Covered in metal, you say?!\\c\\n",
  "OK! From now on, we'll call it\\n",
  "Mecha Tyranitar, or MT for short!\\c\\n",
  "Listen, [VAR TRNAME(1)]!\\n",
  "You're not far from a residential area!\\c\\n",
  "If MT is being violent there, it could be\\n",
  "extremely dangerous to the residents!\\c\\n",
  "You have to keep MT away from the town\\n",
  "at all costs!$",
]

[msg.section_0.entries.10]
text = [
  "[VAR TRNAME(1)]: Roger!$",
]

[msg.section_0.entries.11]
text = [
  "MT: Deegeega! Deegeega!$",
]

[msg.section_0.entries.12]
text = [
  "Man: Oh...\\c\\n",
  "Motheeer!\\n",
  "I'm done for!$",
]

[msg.section_0.entries.13]
text = [
  "[VAR TRNAME(1)]: Argh...\\c\\n",
  "That Worker is in my way, and I can't\\n",
  "let my Pokémon go all out...$",
]

[msg.section_0.entries.14]
text = [
  "Radio: Listen, [VAR TRNAME(1)]!\\n",
  "Fighting against MT while that Worker\\l\\n",
  "is nearby could be very dangerous!\\c\\n",
  "Let him get to safety first!\\n",
  "That's your priority!$",
]

[msg.section_0.entries.15]
text = [
  "[VAR TRNAME(1)]: Roger!\\c\\n",
  "Well...\\n",
  "Somehow, I have to let the man\\l\\n",
  "escape from here...\\c\\n",
  "I'll draw MT's attention to me\\n",
  "and buy him some time...$",
]

[msg.section_0.entries.16]
text = [
  "[VAR TRNAME(1)]: This way! MT!$",
]

[msg.section_0.entries.17]
text = [
  "MT: Deegeegaga...$",
]

[msg.section_0.entries.18]
text = [
  "[VAR TRNAME(1)]: Ugh... It's scary...$",
]

[msg.section_0.entries.19]
text = [
  "MT: Deegeegaaaan!$",
]

[msg.section_0.entries.20]
text = [
  "[VAR TRNAME(1)]: Hey, scrap heap!$",
]

[msg.section_0.entries.21]
text = [
  "MT: Deegeegaaaan!$",
]

[msg.section_0.entries.22]
text = [
  "[VAR TRNAME(1)]: Over here!$",
]

[msg.section_0.entries.23]
text = [
  "MT: Deegeegaaaan!$",
]

[msg.section_0.entries.24]
text = [
  "MT: Deegee... Degeegaga...$",
]

[msg.section_0.entries.25]
text = [
  "[VAR TRNAME(1)]: Look! MT is distracted!\\n",
  "It's the perfect time to make your escape!$",
]

[msg.section_0.entries.26]
text = [
  "Man: OK! Thank you!$",
]

[msg.section_0.entries.27]
text = [
  "MT: Deegeegaaaan!$",
]

[msg.section_0.entries.28]
text = [
  "[VAR TRNAME(1)]: All right! He's gone!\\c\\n",
  "Now I can fight against MT\\n",
  "without worrying about him...$",
]

[msg.section_0.entries.29]
text = [
  "MT: Deegeegaaaan!$",
]

[msg.section_0.entries.30]
text = [
  "[VAR TRNAME(1)]: It seems\\n",
  "MT is serious about our battle, too.$",
]

[msg.section_0.entries.31]
text = [
  "MT: Deegeegaaaan!$",
]

[msg.section_0.entries.32]
text = [
  "[VAR TRNAME(1)]: I'll turn you to scrap!$",
]

[msg.section_0.entries.33]
text = [
  "MT: Deegeegaaaan!$",
]

[msg.section_0.entries.34]
text = [
  "[VAR TRNAME(1)]: I'll be cautious...$",
]

[msg.section_0.entries.35]
text = [
  "MT: Deegeegaga...$",
]

[msg.section_0.entries.36]
text = [
  "[VAR TRNAME(1)]: Bring it on!$",
]

[msg.section_0.entries.37]
text = [
  "MT: Deegeegaaaan!$",
]

[msg.section_0.entries.38]
text = [
  "[VAR TRNAME(1)]: Scary...$",
]

[msg.section_0.entries.39]
text = [
  "MT: Deegeegaga...$",
]

[msg.section_0.entries.40]
text = [
  "[VAR TRNAME(1)]: What a powerful creature!\\n",
  "My [VAR PKNICK(0)]'s attack\\l\\n",
  "didn't work at all...\\c\\n",
  "It's all over for me! I'm finished!$",
]

[msg.section_0.entries.41]
text = [
  "MT: Hey, [VAR TRNAME(1)]!\\c\\n",
  "What are you doing?$",
]

[msg.section_0.entries.42]
text = [
  "[VAR TRNAME(1)]: Huh? What?\\c\\n",
  "Did MT just speak with the captain's voice?$",
]

[msg.section_0.entries.43]
text = [
  "MT: This was all a test of your skills!\\c\\n",
  "This MT is a training robot developed\\n",
  "by the Unova Defense Force!$",
]

[msg.section_0.entries.44]
text = [
  "[VAR TRNAME(1)]: What??$",
]

[msg.section_0.entries.45]
text = [
  "MT: You were facing a crisis that threatened\\n",
  "all of Unova, yet you gave up fighting!\\c\\n",
  "Do you still call yourself a member of\\n",
  "the Unova Defense Force?!\\c\\n",
  "Come back to HQ as soon as possible!\\n",
  "We're starting your training all over again.\\l\\n",
  "I'll train your pitiful guts myself!$",
]

[msg.section_0.entries.46]
text = [
  "[VAR TRNAME(1)]: Oh no...$",
]

[msg.section_0.entries.47]
text = [
  "MT: Listen, [VAR TRNAME(1)]!\\c\\n",
  "I'll train you until you won't be able\\n",
  "to cry or smile for the rest of your life.\\l\\n",
  "Prepare yourself!$",
]

[msg.section_0.entries.48]
text = [
  "[VAR TRNAME(1)]: Ha...hahaha...\\n",
  "I'm in so much trouble...$",
]

[msg.section_0.entries.49]
text = [
  "MT: Deegeegaaaan!$",
]

[msg.section_0.entries.50]
text = [
  "[VAR TRNAME(1)]: Huff...puff...\\c\\n",
  "I can't move...anymore...$",
]

[msg.section_0.entries.51]
text = [
  "MT: Deegeegaaaan!$",
]

[msg.section_0.entries.52]
text = [
  "[VAR TRNAME(1)]: Huff...puff...\\n",
  "I...can't...escape...$",
]

[msg.section_0.entries.53]
text = [
  "Man: Hey!\\n",
  "Are you all right?$",
]

[msg.section_0.entries.54]
text = [
  "[VAR TRNAME(1)]: Huh... You...\\n",
  "Why did...you come back...$",
]

[msg.section_0.entries.55]
text = [
  "Man: I got a bit nervous earlier.\\n",
  "That MT is pretty scary!\\c\\n",
  "But I'm fine now!\\n",
  "This time, I'll help you!$",
]

[msg.section_0.entries.56]
text = [
  "[VAR TRNAME(1)]: No... Run...\\n",
  "A civilian...can't take on MT...\\c\\n",
  "Huff... Puff...\\c\\n",
  "Don't mind me...\\n",
  "Just get away...$",
]

[msg.section_0.entries.57]
text = [
  "Man: I won't be discouraged! If a youngster\\n",
  "like you can put up such a good fight...\\c\\n",
  "I'm an adult. If I try, I can do it!\\n",
  "I'll make my mom proud!$",
]

[msg.section_0.entries.58]
text = [
  "The mechanical monster MT\\n",
  "was approaching [VAR TRNAME(1)]...\\c\\n",
  "As the situation grew desperate, the Worker\\n",
  "who had escaped came back to help...\\c\\n",
  "He got into a truck and drove it straight\\n",
  "into MT, causing a huge explosion and\\l\\n",
  "blowing smoke!\\c\\n",
  "Only the immovable body of MT\\n",
  "was left behind.\\c\\n",
  "On unsteady legs, [VAR TRNAME(1)] searched\\n",
  "the rubble for the heroic Worker,\\l\\n",
  "but couldn't find him...$",
]

[msg.section_0.entries.59]
text = [
  "[VAR TRNAME(1)]: Yay.\\n",
  "I managed to beat MT...$",
]

[msg.section_0.entries.60]
text = [
  "Man: Ahhh! Thank you.\\n",
  "You beat such a big monster!\\c\\n",
  "Wow. You're great!$",
]

[msg.section_0.entries.61]
text = [
  "[VAR TRNAME(1)]: You...\\n",
  "Are you all right?$",
]

[msg.section_0.entries.62]
text = [
  "Man: Hehehe.\\n",
  "Don't underestimate a Worker.\\l\\n",
  "We're the strongest of the strong!$",
]

[msg.section_0.entries.63]
text = [
  "[VAR TRNAME(1)]: Excuse me, but\\n",
  "let me ask you a question...\\c\\n",
  "That MT...\\n",
  "Was it originally your Pokémon?$",
]

[msg.section_0.entries.64]
text = [
  "Man: Hey, hey! No!\\n",
  "That monster isn't mine!\\c\\n",
  "I found an abandoned Poké Ball in the\\n",
  "corner of the harbor.\\c\\n",
  "So I picked it up and threw it.\\n",
  "Then, that monster came out!$",
]

[msg.section_0.entries.65]
text = [
  "[VAR TRNAME(1)]: I see...$",
]

[msg.section_0.entries.66]
text = [
  "Man: But the strange thing is...\\n",
  "The place where I picked it up is restricted.\\l\\n",
  "It's for authorized harbor personnel only.$",
]

[msg.section_0.entries.67]
text = [
  "[VAR TRNAME(1)]: All right.\\n",
  "Thank you.\\c\\n",
  "...\\n",
  "MT...\\c\\n",
  "That is not a Pokémon...\\n",
  "It's a weapon for destruction...\\c\\n",
  "Who could have made such\\n",
  "a dangerous thing?$",
]

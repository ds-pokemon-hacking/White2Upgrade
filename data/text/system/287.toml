  "[CENTER]The amusement park...\\n",
  "\\n",
  "[CENTER]This was a special place...\\n",
  "\\n",
  "[CENTER]For the two of us...$",
]

[msg.section_0.entries.1]
text = [
  "[CENTER]It was where we had our first date...\\n",
  "\\n",
  "[CENTER]The first time we were alone together...$",
]

[msg.section_0.entries.2]
text = [
  "[CENTER]I professed my love on the Ferris wheel.$",
]

[msg.section_0.entries.3]
text = [
  "[CENTER]Even now, when we're apart...\\n",
  "\\n",
  "[CENTER]I find myself in the amusement park.$",
]

[msg.section_0.entries.4]
text = [
  "[CENTER]Then...we saw each other there.$",
]

[msg.section_0.entries.5]
text = [
  "[CENTER]For some reason...\\n",

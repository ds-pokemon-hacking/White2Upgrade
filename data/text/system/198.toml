[msg]
trailing_data = "fafa"

[msg.section_0.entries.0]
text = [
  "Actress$",
]

[msg.section_0.entries.1]
text = [
  "Enigma$",
]

[msg.section_0.entries.2]
text = [
  "E: Well...\\c\\n",
  "The basic functionality\\n",
  "shouldn't be bad, but...$",
]

[msg.section_0.entries.3]
text = [
  "E: If this test shows no problem\\n",
  "with durability...$",
]

[msg.section_0.entries.4]
text = [
  "E: Hmm...$",
]

[msg.section_0.entries.5]
text = [
  "E: OK.\\n",
  "The test is almost complete.\\c\\n",
  "Use the Zap Cannon to stop the UFO!$",
]

[msg.section_0.entries.6]
text = [
  "[VAR TRNAME(1)]: Um, why do you have a UFO?\\c\\n",
  "And what are we going to do with it?$",
]

[msg.section_0.entries.7]
text = [
  "E: Next, I'll test the abilities of\\n",
  "the decoy UFO I developed.\\c\\n",
  "Are you ready, [VAR TRNAME(1)]?$",
]

[msg.section_0.entries.8]
text = [
  "[VAR TRNAME(1)]: What?\\c\\n",
  "Test?\\n",
  "Decoy UFO...?$",
]

[msg.section_0.entries.9]
text = [
  "E: Save your questions for later.\\c\\n",
  "Just follow my instructions.\\c\\n",
  "You have a Pokémon, don't you?$",
]

[msg.section_0.entries.10]
text = [
  "[VAR TRNAME(1)]: Huh?\\n",
  "Fight against the UFO?$",
]

[msg.section_0.entries.11]
text = [
  "E: Exactly.\\n",
  "The UFO is programmed to keep\\l\\n",
  "attacking you.$",
]

[msg.section_0.entries.12]
text = [
  "[VAR TRNAME(1)]: Bwuh?\\n",
  "That's not dangerous?$",
]

[msg.section_0.entries.13]
text = [
  "E: Tsk. Of course it's dangerous.\\n",
  "How else can you test properly?\\c\\n",
  "Oh, and let me caution you...\\c\\n",
  "The coating on the frame of this\\n",
  "UFO has not yet been perfected.\\c\\n",
  "Damage from moves other than Zap Cannon\\n",
  "will ruin it.\\c\\n",
  "So watch what you're doing! Got it?$",
]

[msg.section_0.entries.14]
text = [
  "[VAR TRNAME(1)]: Got it!$",
]

[msg.section_0.entries.15]
text = [
  "E: Commence testing.\\c\\n",
  "When you're ready,\\n",
  "begin attacking the UFO!$",
]

[msg.section_0.entries.16]
text = [
  "[VAR TRNAME(1)]: Hmm.\\c\\n",
  "The closer I look at it,\\n",
  "the more authentic it looks.\\c\\n",
  "It doesn't seem any different from\\n",
  "a real UFO...$",
]

[msg.section_0.entries.17]
text = [
  "E: Pay attention, please!\\c\\n",
  "Next, we'll test the functionality\\n",
  "of the shield system...\\c\\n",
  "Focus energy from your\\n",
  "Pokémon on the UFO!$",
]

[msg.section_0.entries.18]
text = [
  "[VAR TRNAME(1)]: On it!$",
]

[msg.section_0.entries.19]
text = [
  "E: Sounds good!\\n",
  "Give it all you've got!$",
]

[msg.section_0.entries.20]
text = [
  "[VAR TRNAME(1)]: Eh? What?$",
]

[msg.section_0.entries.21]
text = [
  "E: Why are you so slow?\\n",
  "Quickly, now. Do as I say!$",
]

[msg.section_0.entries.22]
text = [
  "[VAR TRNAME(1)]: Urk. Don't flip out...$",
]

[msg.section_0.entries.23]
text = [
  "E: I'm warning you, get focused.\\n",
  "Or I won't be responsible for\\l\\n",
  "whatever happens...$",
]

[msg.section_0.entries.24]
text = [
  "E: OK, enough.\\n",
  "The test was successful.$",
]

[msg.section_0.entries.25]
text = [
  "[VAR TRNAME(1)]: Phew...\\n",
  "What is this test for, exactly?\\c\\n",
  "And what's the story of this decoy\\n",
  "you mentioned earlier? What's a decoy?$",
]

[msg.section_0.entries.26]
text = [
  "E: Certain creatures that live in groups\\n",
  "have a habit of gathering when they\\l\\n",
  "see others of their kind...\\c\\n",
  "Seeing one of them signals to the others\\n",
  "that it's safe to gather.\\c\\n",
  "That one is called a decoy.$",
]

[msg.section_0.entries.27]
text = [
  "[VAR TRNAME(1)]: I think I get it.\\n",
  "But what does that have to do with--$",
]

[msg.section_0.entries.28]
text = [
  "E: OK, listen. My research has clearly shown\\n",
  "that UFOs begin gathering once a place\\l\\n",
  "appears to be safe...$",
]

[msg.section_0.entries.29]
text = [
  "[VAR TRNAME(1)]: You mean, real UFOs will gather\\n",
  "next to a decoy UFO because\\l\\n",
  "they think it's safe?$",
]

[msg.section_0.entries.30]
text = [
  "E: Exactly.\\n",
  "But there's more.\\c\\n",
  "I'm not going to use the decoy UFO\\n",
  "to attract ordinary UFOs.\\c\\n",
  "What I'm looking for is their mothership.$",
]

[msg.section_0.entries.31]
text = [
  "[VAR TRNAME(1)]: Their mothership?$",
]

[msg.section_0.entries.32]
text = [
  "E: Right.\\c\\n",
  "My objective is to lure the mothership--\\n",
  "think of it as the UFO boss.\\c\\n",
  "If we can destroy the mothership,\\n",
  "the remaining UFOs will panic and retreat.$",
]

[msg.section_0.entries.33]
text = [
  "[VAR TRNAME(1)]: Sounds like a plan!$",
]

[msg.section_0.entries.34]
text = [
  "E: Listen up, [VAR TRNAME(1)].\\c\\n",
  "I've done the research and development.\\n",
  "So, your role in this plan...\\c\\n",
  "As a member of the Unova Defense Force,\\n",
  "the destruction of the mothership\\l\\n",
  "is up to you!$",
]

[msg.section_0.entries.35]
text = [
  "[VAR TRNAME(1)]: I'm on board!\\c\\n",
  "But, one thing I'm kind of wondering...\\n",
  "How do you know so much about UFOs?$",
]

[msg.section_0.entries.36]
text = [
  "E: What did I say about staying focused?\\c\\n",
  "Don't ask questions you don't need\\n",
  "the answers to, [VAR TRNAME(1)].\\c\\n",
  "You know your role.\\n",
  "Focus on making my plan a success!$",
]

[msg.section_0.entries.37]
text = [
  "E, the mysterious scientist, has provided\\n",
  "a meticulous analysis of the UFOs.\\c\\n",
  "E and [VAR TRNAME(1)] now undertake a critical\\n",
  "mission to save humanity from the invaders!$",
]

[msg.section_0.entries.38]
text = [
  "[VAR TRNAME(1)]: Pant...pant...$",
]

[msg.section_0.entries.39]
text = [
  "E: What seems to be the\\n",
  "problem, [VAR TRNAME(1)]?\\c\\n",
  "The test is incomplete.\\n",
  "Now, get on your feet!$",
]

[msg.section_0.entries.40]
text = [
  "[VAR TRNAME(1)]: That's all I've got.\\n",
  "I'm exhausted.\\c\\n",
  "We don't know for sure that the planet's\\n",
  "about to be destroyed, do we?\\c\\n",
  "It should be OK if we rest for a moment.\\n",
  "Urghhh. So tired.\\l\\n",
  "So hungry and thirsty.$",
]

[msg.section_0.entries.41]
text = [
  "E: Your weakness surprises me.\\c\\n",
  "I may have made a mistake\\n",
  "thinking I could count on you.$",
]

[msg.section_0.entries.42]
text = [
  "[VAR TRNAME(1)]: Excuse me?!\\n",
  "You've got a mean mouth!$",
]

[msg.section_0.entries.43]
text = [
  "E: Enough!\\c\\n",
  "Humanity's survival may be down to a few\\n",
  "remaining hours.\\c\\n",
  "I need to find someone who can do the job!$",
]

[msg.section_0.entries.44]
text = [
  "[VAR TRNAME(1)]: There she goes... Oh, well.\\c\\n",
  "There's no Trainer stronger than me\\n",
  "anyway. So she'll be back sooner or later.\\c\\n",
  "Oh, urgghhh...\\c\\n",
  "So tired. Gotta take a break...$",
]

[msg.section_0.entries.45]
text = [
  "Not realizing that the scientist E had gone\\n",
  "for good, [VAR TRNAME(1)] fell soundly asleep.\\l\\n",
  "Zzz... Zzz...\\c\\n",
  "Hour upon hour passed.\\c\\n",
  "While [VAR TRNAME(1)] snored and drooled, the\\n",
  "UFOs carried out their attacks unopposed.\\l\\n",
  "And so, humanity perished...$",
]

[msg.section_0.entries.46]
text = [
  "[VAR TRNAME(1)]: Urgh...urgh...$",
]

[msg.section_0.entries.47]
text = [
  "E: What's the matter?\\n",
  "The test hasn't been completed yet.$",
]

[msg.section_0.entries.48]
text = [
  "[VAR TRNAME(1)]: Wait...\\c\\n",
  "I don't have any Pokémon to fight with...$",
]

[msg.section_0.entries.49]
text = [
  "E: There's no other way, then.\\c\\n",
  "[VAR TRNAME(1)]--fight the UFO!$",
]

[msg.section_0.entries.50]
text = [
  "[VAR TRNAME(1)]: What?$",
]

[msg.section_0.entries.51]
text = [
  "E: If you try, you can do it.\\n",
  "Actually, you have to do it!\\c\\n",
  "There's no other choice.\\n",
  "Now...attack the UFO!$",
]

[msg.section_0.entries.52]
text = [
  "[VAR TRNAME(1)]: Are you crazy?$",
]

[msg.section_0.entries.53]
text = [
  "E: I'm starting the test now.\\c\\n",
  "I won't let you leave until\\n",
  "we get the data we need.$",
]

[msg.section_0.entries.54]
text = [
  "With no Pokémon to help, [VAR TRNAME(1)]\\n",
  "tried to complete the test.\\c\\n",
  "But a test with a human being alone could\\n",
  "not produce the data E needed.\\c\\n",
  "As they tried again and again to complete\\n",
  "the test, swarms of UFOs descended.\\l\\n",
  "And so, humanity perished...$",
]

[msg.section_0.entries.55]
text = [
  "[VAR TRNAME(1)]: Oops!\\n",
  "Did I overdo it?$",
]

[msg.section_0.entries.56]
text = [
  "E: [VAR TRNAME(1)]!$",
]

[msg.section_0.entries.57]
text = [
  "[VAR TRNAME(1)]: Yes?$",
]

[msg.section_0.entries.58]
text = [
  "E: What have you done?\\c\\n",
  "You've ruined the UFO!$",
]

[msg.section_0.entries.59]
text = [
  "[VAR TRNAME(1)]: Er, sorry.$",
]

[msg.section_0.entries.60]
text = [
  "E: Were you paying attention\\n",
  "to what I said?$",
]

[msg.section_0.entries.61]
text = [
  "[VAR TRNAME(1)]: ...Sorry.$",
]

[msg.section_0.entries.62]
text = [
  "E: The fate of humanity\\n",
  "depends on this UFO!\\c\\n",
  "There's no use in saying sorry!$",
]

[msg.section_0.entries.63]
text = [
  "[VAR TRNAME(1)]: ...Sorry.$",
]

[msg.section_0.entries.64]
text = [
  "E: I don't want to hear you bleating\\n",
  "“sorry, sorry, sorry.\\\" Useless!$",
]

[msg.section_0.entries.65]
text = [
  "[VAR TRNAME(1)]: S-sorry.$",
]

[msg.section_0.entries.66]
text = [
  "E: I expect you to pay the cost of repairs.$",
]

[msg.section_0.entries.67]
text = [
  "[VAR TRNAME(1)]: Yeah, I guess.$",
]

[msg.section_0.entries.68]
text = [
  "E: Let's see. Repairing this UFO will cost\\n",
  "approximately \\$1,000,000,000.$",
]

[msg.section_0.entries.69]
text = [
  "[VAR TRNAME(1)]: Wha...\\c\\n",
  "Whaaaaat?!$",
]

[msg.section_0.entries.70]
text = [
  "E: I take it that you're unwilling to pay...$",
]

[msg.section_0.entries.71]
text = [
  "[VAR TRNAME(1)]: I can't pay that!$",
]

[msg.section_0.entries.72]
text = [
  "E: Then, until you can pay off your debt,\\n",
  "you'll work as my assistant for free.$",
]

[msg.section_0.entries.73]
text = [
  "Having carelessly ruined the UFO developed\\n",
  "by the mysterious scientist E, [VAR TRNAME(1)] is\\l\\n",
  "saddled with a debt too huge to ever repay.\\c\\n",
  "He will be at E's beck and call\\n",
  "for the rest of his life.$",
]

[msg.section_0.entries.74]
text = [
  "UFO: Vwwwssssh!$",
]

[msg.section_0.entries.75]
text = [
  "[VAR TRNAME(1)]: What's wrong?\\n",
  "Something is wrong with the UFO...$",
]

[msg.section_0.entries.76]
text = [
  "UFO: Vwwwssssh! Vwwwzzzzt!$",
]

[msg.section_0.entries.77]
text = [
  "E: Stop, [VAR TRNAME(1)]!\\n",
  "Don't use that move!$",
]

[msg.section_0.entries.78]
text = [
  "[VAR TRNAME(1)]: Huh?$",
]

[msg.section_0.entries.79]
text = [
  "E: Wait, [VAR TRNAME(1)].\\c\\n",
  "Never, ever use that move on the UFO!$",
]

[msg.section_0.entries.80]
text = [
  "[VAR TRNAME(1)]: Got it, got it...\\n",
  "No need to get so mad.$",
]

[msg.section_0.entries.81]
text = [
  "E: Listen and remember.\\c\\n",
  "This UFO is a highly developed machine.\\n",
  "That move could cause its control system\\l\\n",
  "to malfunction.$",
]

[msg.section_0.entries.82]
text = [
  "[VAR TRNAME(1)]: Got it.\\c\\n",
  "(...Hmmm. Seems like the UFO has a\\n",
  "weak point when it comes to Gravity...)$",
]

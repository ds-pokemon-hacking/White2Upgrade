[msg]
trailing_data = "f0f0"

[msg.section_0.entries.0]
text = [
  "Suit Actor$",
]

[msg.section_0.entries.1]
text = [
  "Future Being$",
]

[msg.section_0.entries.2]
text = [
  "Professor [VAR TRNAME(1)]: I wonder if I'll\\n",
  "ever be able to make it back home...$",
]

[msg.section_0.entries.3]
text = [
  "Ledian: I'll show you that the future\\n",
  "belongs to us Bug-type Pokémon!$",
]

[msg.section_0.entries.4]
text = [
  "Professor [VAR TRNAME(1)]: Gah...\\n",
  "Not enough energy!\\c\\n",
  "I need electric energy that's as powerful\\n",
  "as a thunderbolt!$",
]

[msg.section_0.entries.5]
text = [
  "Professor [VAR TRNAME(1)]: It's not easy to\\n",
  "go back to the past from the future.\\c\\n",
  "It takes a lot more energy than it does\\n",
  "to come from the past into the future...$",
]

[msg.section_0.entries.6]
text = [
  "Ledian: I won't let you!$",
]

[msg.section_0.entries.7]
text = [
  "no data$",
]

[msg.section_0.entries.8]
text = [
  "no data$",
]

[msg.section_0.entries.9]
text = [
  "no data$",
]

[msg.section_0.entries.10]
text = [
  "Professor [VAR TRNAME(1)]: Stop!\\n",
  "If all you wanted was the temporal\\l\\n",
  "transport, then you don't need me anymore!$",
]

[msg.section_0.entries.11]
text = [
  "Ledian: That's right.\\n",
  "I have no more need for you...\\l\\n",
  "That's why I am going to eliminate you...$",
]

[msg.section_0.entries.12]
text = [
  "Black Belt: Temporal transport...\\n",
  "Look likes a Human Ball?\\c\\n",
  "Ledian has it...\\n",
  "Makes me go back to Ball...\\l\\n",
  "Then, temporal transport comes out...$",
]

[msg.section_0.entries.13]
text = [
  "Professor [VAR TRNAME(1)]: Black Belt, thank\\n",
  "you. I feel like I understand.$",
]

[msg.section_0.entries.14]
text = [
  "Ledian: Black Belt... Are you so worthless\\n",
  "a human that you can't follow even the most\\l\\n",
  "basic of orders?\\c\\n",
  "Worthlessness is a crime...\\n",
  "I'll eliminate you all...$",
]

[msg.section_0.entries.15]
text = [
  "Professor [VAR TRNAME(1)]: I'll show you what\\n",
  "humans are really made of...$",
]

[msg.section_0.entries.16]
text = [
  "Ledian: I don't understand.\\c\\n",
  "The existence of you humans is only\\n",
  "validated when you're used by us\\l\\n",
  "Bug-type Pokémon.\\c\\n",
  "You can't do anything on your own.\\n",
  "Such an immature life-form...$",
]

[msg.section_0.entries.17]
text = [
  "Professor [VAR TRNAME(1)]: We may not be\\n",
  "strong on our own, but that's why we\\l\\n",
  "help each other out.\\c\\n",
  "I have my assistant, Strange, as well\\n",
  "as [VAR PKNICK(0)]...\\l\\n",
  "I also have the help of Black Belt!$",
]

[msg.section_0.entries.18]
text = [
  "Ledian: Silence!\\c\\n",
  "You can't even fly into the sky\\n",
  "or spin a string!\\l\\n",
  "You can't shoot powerful beams\\l\\n",
  "or evolve into stronger forms!\\l\\n",
  "And you've only got two arms...$",
]

[msg.section_0.entries.19]
text = [
  "Ledian: Just who do you think you are\\n",
  "anyway? You think it's OK to come into\\l\\n",
  "the future like this and just go back home?\\c\\n",
  "You think it's OK to come into our world,\\n",
  "take whatever you please, and then return\\l\\n",
  "to your own era at your own convenience?\\l\\n",
  "I don't think so!$",
]

[msg.section_0.entries.20]
text = [
  "Professor [VAR TRNAME(1)]: But...$",
]

[msg.section_0.entries.21]
text = [
  "Ledian: Or perhaps you thought that\\n",
  "the future would be an even better place\\l\\n",
  "for you humans?\\c\\n",
  "It's only because of humans in the past like\\n",
  "you, who did whatever they pleased, that\\l\\n",
  "this world turned out like it did...\\c\\n",
  "Idiotic humans... How can you be so naive?$",
]

[msg.section_0.entries.22]
text = [
  "Professor [VAR TRNAME(1)]: No! It's not true...$",
]

[msg.section_0.entries.23]
text = [
  "Ledian: Hmph...\\c\\n",
  "No matter... Us Bug-type Pokémon are\\n",
  "thankful for the mistakes you humans made.\\c\\n",
  "It's all thanks to you that we came to\\n",
  "control the future!$",
]

[msg.section_0.entries.24]
text = [
  "Professor [VAR TRNAME(1)]: All your fault!$",
]

[msg.section_0.entries.25]
text = [
  "Ledian: There you go again...\\n",
  "Always blaming other people for your\\l\\n",
  "own mistakes...\\l\\n",
  "I'm not a person, though...\\c\\n",
  "...\\c\\n",
  "Ouch! That hurts!\\c\\n",
  "What's going on?\\n",
  "What is this powerful energy coming out\\l\\n",
  "of the capsule your time machine is in?$",
]

[msg.section_0.entries.26]
text = [
  "Professor [VAR TRNAME(1)]: You're wrong!$",
]

[msg.section_0.entries.27]
text = [
  "Ledian: You humans are all the same...\\c\\n",
  "Always averting your gaze from reality\\n",
  "when it's not convenient...\\l\\n",
  "Always denying what you know is true...\\c\\n",
  "...\\c\\n",
  "Ouch! It's so cold!\\c\\n",
  "What's going on?\\n",
  "Some strange coolant gas is seeping out\\l\\n",
  "of the capsule your time machine is in...$",
]

[msg.section_0.entries.28]
text = [
  "Professor [VAR TRNAME(1)]: I'll change it!$",
]

[msg.section_0.entries.29]
text = [
  "Ledian: Hah!\\n",
  "As if you could...\\c\\n",
  "Of course you can't...\\c\\n",
  "...Wait a second. You managed to create a\\n",
  "time machine when even us Bug-type Pokémon\\l\\n",
  "couldn't... Could it be possible that you\\l\\n",
  "have the power to change the future?\\c\\n",
  "...\\c\\n",
  "Ouch! That's hot!\\c\\n",
  "What's going on?\\n",
  "This capsule that your time machine is in\\l\\n",
  "is starting to heat up...$",
]

[msg.section_0.entries.30]
text = [
  "Ledian: It's so bright...\\n",
  "It's burning my eyes...$",
]

[msg.section_0.entries.31]
text = [
  "Professor [VAR TRNAME(1)]: Oh no...\\n",
  "If the energy keeps pouring out of my\\l\\n",
  "temporal transport like this,\\l\\n",
  "it might explode!$",
]

[msg.section_0.entries.32]
text = [
  "Ledian: What?!$",
]

[msg.section_0.entries.33]
text = [
  "Professor [VAR TRNAME(1)]: After storing up\\n",
  "so much energy, if my temporal transport\\l\\n",
  "were to explode now, it could quite possibly\\l\\n",
  "bend space and time and create a black hole!$",
]

[msg.section_0.entries.34]
text = [
  "Ledian: A black hole?!\\n",
  "You mean a mass of gravity that swallows\\l\\n",
  "up everything?$",
]

[msg.section_0.entries.35]
text = [
  "Professor [VAR TRNAME(1)]: This is bad...$",
]

[msg.section_0.entries.36]
text = [
  "Ledian: Now I get it...\\c\\n",
  "A dangerous invention like this is only to\\n",
  "be expected of you barbarian humans!\\c\\n",
  "Bug-type Pokémon would never think to\\n",
  "create such a perilous device!\\c\\n",
  "This is a terrible weapon, made to\\n",
  "annihilate us Bug-type Pokémon!\\l\\n",
  "It was your goal all along to eliminate\\l\\n",
  "us all, wasn't it?!$",
]

[msg.section_0.entries.37]
text = [
  "Professor [VAR TRNAME(1)]: Ugh...\\n",
  "This coolant liquid is extremely powerful...$",
]

[msg.section_0.entries.38]
text = [
  "Ledian: Cold... So cold...\\n",
  "I'm not good against ice...$",
]

[msg.section_0.entries.39]
text = [
  "Professor [VAR TRNAME(1)]: There's a good\\n",
  "chance that it will spread until it engulfs\\l\\n",
  "the entire world, ushering in a new ice age!$",
]

[msg.section_0.entries.40]
text = [
  "Ledian: An ice age...\\n",
  "Us Bug-type Pokémon wouldn't survive...$",
]

[msg.section_0.entries.41]
text = [
  "Professor [VAR TRNAME(1)]: This is bad...$",
]

[msg.section_0.entries.42]
text = [
  "Ledian: Now I get it...\\c\\n",
  "A dangerous invention like this is only to\\n",
  "be expected of you barbarian humans!\\c\\n",
  "Bug-type Pokémon would never think to\\n",
  "create such a perilous device!\\c\\n",
  "This is a terrible weapon, made to\\n",
  "annihilate us Bug-type Pokémon!\\l\\n",
  "It was your goal all along to eliminate\\l\\n",
  "us all, wasn't it?!$",
]

[msg.section_0.entries.43]
text = [
  "Professor [VAR TRNAME(1)]: It'll be OK!\\n",
  "My temporal transport is highly resistant\\l\\n",
  "to heat!$",
]

[msg.section_0.entries.44]
text = [
  "Ledian: Just like a Scientist to get all\\n",
  "excited whenever you talk about\\l\\n",
  "something scientific...$",
]

[msg.section_0.entries.45]
text = [
  "Professor [VAR TRNAME(1)]: Hmph...\\n",
  "I'm the brilliant scientist who invented\\l\\n",
  "this temporal transport!\\c\\n",
  "A small complication such as this is well\\n",
  "within expectations!$",
]

[msg.section_0.entries.46]
text = [
  "Ledian: It's as if you entered your own\\n",
  "world... What incredible concentration...\\c\\n",
  "Another common trait of you Scientists...$",
]

[msg.section_0.entries.47]
text = [
  "Professor [VAR TRNAME(1)]: I'll show you\\n",
  "I can change history!$",
]

[msg.section_0.entries.48]
text = [
  "Professor [VAR TRNAME(1)]: OK! It's charged\\n",
  "up enough energy now!\\c\\n",
  "I should be able to go back to the past!$",
]

[msg.section_0.entries.49]
text = [
  "Ledian: So you tricked me into bringing out\\n",
  "the temporal transport so you could charge\\l\\n",
  "it with lightning...\\c\\n",
  "...Impressive, I must say. You may have\\n",
  "only two arms, but you're pretty good...$",
]

[msg.section_0.entries.50]
text = [
  "Professor [VAR TRNAME(1)]: Ledian...\\n",
  "You may have been right. I was selfish to\\l\\n",
  "have come into the future like this...\\c\\n",
  "It was only in the interest of science that\\n",
  "I came to this era. I apologize if I've made\\l\\n",
  "a mess of things here...\\c\\n",
  "Here! I'll give you these items back.$",
]

[msg.section_0.entries.51]
text = [
  "Ledian: What is this?\\n",
  "Some dirt...rocks...plant seeds?\\l\\n",
  "It's a bunch of junk...\\c\\n",
  "...\\c\\n",
  "What's this?!$",
]

[msg.section_0.entries.52]
text = [
  "Professor [VAR TRNAME(1)]: What's wrong?$",
]

[msg.section_0.entries.53]
text = [
  "Ledian: ...Do you know what this is?\\n",
  "You just saved your life, human...\\c\\n",
  "...No, you just saved the lives of all\\n",
  "humans--past, present, and future...\\l\\n",
  "How impressive...\\c\\n",
  "...This is the stone that allowed us\\n",
  "Bug-type Pokémon to revolt against\\l\\n",
  "you humans...\\c\\n",
  "That's right...\\n",
  "This is the Evolution Stone...\\c\\n",
  "If you go back to your era without it,\\n",
  "everything will change...$",
]

[msg.section_0.entries.54]
text = [
  "...And so I was able to safely return\\n",
  "to my own era...\\c\\n",
  "...If I hadn't returned my research\\n",
  "samples to Ledian before coming back,\\l\\n",
  "then I would have brought back the\\l\\n",
  "Evolution Stone, which would have caused\\l\\n",
  "the Bug-type Pokémon of my era to evolve at\\l\\n",
  "a rapid pace, and they would have\\l\\n",
  "eventually revolted against us humans...$",
]

[msg.section_0.entries.55]
text = [
  "...I never would have thought that I would\\n",
  "have been responsible for changing the\\l\\n",
  "fate of the human race...\\c\\n",
  "...It still remains to be seen whether\\n",
  "changing the future like I did was indeed\\l\\n",
  "a good thing, though...$",
]

[msg.section_0.entries.56]
text = [
  "...However, before I changed the future,\\n",
  "Ledian looked down on all other life-forms\\l\\n",
  "and lived all alone...\\c\\n",
  "...I hope that in the future that I brought\\n",
  "about, Ledian will at least feel a little\\l\\n",
  "less lonely.\\c\\n",
  "That's all that I can really do\\n",
  "right now...$",
]

[msg.section_0.entries.57]
text = [
  "Professor [VAR TRNAME(1)]: I'm not sure\\n",
  "exactly why, but it looks like I might be\\l\\n",
  "able to use the temporal transport now...$",
]

[msg.section_0.entries.58]
text = [
  "Ledian: Stop right there! I won't let you\\n",
  "get away! I will eliminate you!$",
]

[msg.section_0.entries.59]
text = [
  "Professor [VAR TRNAME(1)]: Ha ha ha!\\n",
  "Farewell, Ledian!\\c\\n",
  "I've got the research samples that I came\\n",
  "for, so there's no reason for me to stick\\l\\n",
  "around here any longer!\\c\\n",
  "I'm going back home to my own era to\\n",
  "live in peace!$",
]

[msg.section_0.entries.60]
text = [
  "Ledian: Mwa ha ha ha...\\n",
  "You fell right into my trap!$",
]

[msg.section_0.entries.61]
text = [
  "Professor [VAR TRNAME(1)]: What?!$",
]

[msg.section_0.entries.62]
text = [
  "Ledian: I realized that you carry the\\n",
  "Evolution Stone in your bag, so I decided\\l\\n",
  "to let you go...\\c\\n",
  "I'm sure I don't have to tell you what will\\n",
  "happen to the Pokémon of your era if you\\l\\n",
  "bring the Evolution Stone back...\\c\\n",
  "Bon voyage, foolish Human...\\c\\n",
  "I'll be waiting for you here, in the world\\n",
  "after the Pokémon revolt...$",
]

[msg.section_0.entries.63]
text = [
  "Professor [VAR TRNAME(1)]: It can't be so!\\c\\n",
  "Oh no... It's no good...\\n",
  "I can't stop the temporal transport!\\c\\n",
  "No! I don't want to go back like this!\\n",
  "If I go back now, the revolt will occur!$",
]

[msg.section_0.entries.64]
text = [
  "Ledian: You were such a foolish, foolish\\n",
  "human... Not to mention such a fun toy\\l\\n",
  "to play with...\\c\\n",
  "For a pathetic human with only two arms, you\\n",
  "sure provided me with much entertainment!$",
]

[msg.section_0.entries.65]
text = [
  "...And so I was able to return safely\\n",
  "to my own era...\\c\\n",
  "...However, it was because of my safe\\n",
  "return that the world changed forever...\\c\\n",
  "...The effects of the Evolution Stone were\\n",
  "quick. The Bug-type Pokémon soon\\l\\n",
  "transformed into terrible overlords who\\l\\n",
  "reigned over us.\\c\\n",
  "Soon, we normal humans became a different\\n",
  "kind of human--their playthings...$",
]

[msg.section_0.entries.66]
text = [
  "Professor [VAR TRNAME(1)]: What's this?\\n",
  "These energy readings coming from the\\l\\n",
  "temporal transport shouldn't be possible!\\l\\n",
  "They're exceeding the limit!$",
]

[msg.section_0.entries.67]
text = [
  "Ledian: What's going to happen?$",
]

[msg.section_0.entries.68]
text = [
  "Professor [VAR TRNAME(1)]: Hrmm?\\n",
  "Oh... Oh no!$",
]

[msg.section_0.entries.69]
text = [
  "Ledian: What?!$",
]

[msg.section_0.entries.70]
text = [
  "...I surveyed my surroundings after\\n",
  "regaining consciousness, but I couldn't\\l\\n",
  "believe what lay before me...\\c\\n",
  "...For as far as the eye could see was\\n",
  "nothing but machinery...\\c\\n",
  "Entire cities made of machines, inhabited\\n",
  "by humans and their heartless robot\\l\\n",
  "masters, who treated them like common parts\\l\\n",
  "of a great machine, discarding and replacing\\l\\n",
  "them as needed...$",
]

[msg.section_0.entries.71]
text = [
  "...I had come even further into the future,\\n",
  "but it was even worse than the era in which\\l\\n",
  "Bug-type Pokémon reigned supreme...\\c\\n",
  "In this future, robots ruled over all living\\n",
  "beings and used them as simple tools...\\c\\n",
  "I couldn't believe it. I felt my head spin,\\n",
  "and I collapsed right then and there...\\c\\n",
  "...As my consciousness began to fade away,\\n",
  "I could see one of the robots approaching.$",
]

[msg.section_0.entries.72]
text = [
  "Professor [VAR TRNAME(1)]: Hmmm...\\n",
  "I guess it just won't work...\\c\\n",
  "How unfortunate. I heard this move could\\n",
  "transcend time.$",
]

[msg.section_0.entries.73]
text = [
  "Ledian: What are you doing?$",
]

[msg.section_0.entries.74]
text = [
  "Professor [VAR TRNAME(1)]: What's that?\\n",
  "Oh, I just thought it would be nice if I\\l\\n",
  "could bend time using a Pokémon move...$",
]

[msg.section_0.entries.75]
text = [
  "Ledian: Of all the idiotic things...\\n",
  "Did you really invent this time machine?$",
]

[msg.section_0.entries.76]
text = [
  "Professor [VAR TRNAME(1)]: That's different!$",
]

[msg.section_0.entries.77]
text = [
  "Ledian: Ugh... Why am I wasting my time\\n",
  "with this dumb human?$",
]

[msg.section_0.entries.78]
text = [
  "Professor [VAR TRNAME(1)]: What?!\\n",
  "Cut me some slack...\\l\\n",
  "It was worth a try!$",
]

[msg.section_0.entries.79]
text = [
  "Ledian: Whatever... At least you're dense\\n",
  "enough to provide some entertainment.\\c\\n",
  "I guess it's better than being alone...$",
]

[msg.section_0.entries.0]
text = [
  "          $$",
]

[msg.section_0.entries.1]
text = [
  "      $$",
]

[msg.section_0.entries.2]
text = [
  "      $$",
]

[msg.section_0.entries.3]
text = [
  "          $$",
]

[msg.section_0.entries.4]
text = [
  "Wow, Nuvema Town?\\c\\n",
  "You must be going to the\\n",
  "Juniper Pokémon Lab then, right?\\c\\n",
  "Or could you be going to\\n",
  "visit my friend's house?\\c$",
]

[msg.section_0.entries.5]
text = [
  "Accumula Town!\\c\\n",
  "I remember hearing the pretty sound\\n",
  "of someone playing an instrument there.\\c$",
]

[msg.section_0.entries.6]
text = [
  "I recommend the restaurant\\n",
  "in Striaton City!\\c\\n",
  "It's run by former Gym Leaders,\\n",
  "so I'm sure it's amazing!\\c$",
]

[msg.section_0.entries.7]
text = [
  "I really like Nacrene City's warehouses,\\n",
  "especially Café Warehouse!\\c\\n",
  "But, actually, the place you absolutely\\n",
  "must visit is the Nacrene Museum.\\c$",
]

[msg.section_0.entries.8]
text = [
  "Castelia City!\\n",
  "There's just too much to see there!\\c\\n",
  "You might want to participate\\n",
  "in the Castelia Harlequin Hunt!\\c\\n",
  "That's a great way to see the sights.\\c\\n",
  "Other than that...\\n",
  "Try exploring on your own!\\c\\n",
  "Exploring is one of the most fun\\n",
  "things about arriving in a new city!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Nimbasa City is the city of entertainment!\\c\\n",
  "Working at the Pokémon Center\\n",
  "there was sure a lot of fun.\\c\\n",
  "Well, now...\\c\\n",
  "Big Stadium and Small Court are\\n",
  "packed with tough Trainers.\\c\\n",
  "There are so many other things\\n",
  "to see and do! Enjoy yourself!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Driftveil City!\\c\\n",
  "Recently, hotels have been\\n",
  "popping up there like crazy, so I hear.\\c\\n",
  "Boy, other than that, I sure\\n",
  "don't know much about it!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Mistralton City always makes me\\n",
  "think of Skyla!\\c\\n",
  "People who had been hurt by\\n",
  "the device in her Pokémon Gym\\l\\n",
  "would come to the Pokémon Center.\\c$",
]

[msg.section_0.entries.12]
text = [
  "Icirrus City, huh...\\c\\n",
  "The way the seasons change there is nice.\\n",
  "I particularly like how it looks in winter.\\c$",
]

[msg.section_0.entries.13]
text = [
  "Opelucid City!\\n",
  "That's a great city!\\c\\n",
  "I heard that the mayor, Drayden,\\n",
  "can teach an amazing Dragon-type move!\\c$",
]

[msg.section_0.entries.14]
text = [
  "Route 1...\\n",
  "Um, now, what was there?\\c\\n",
  "Oh, that's right! Using Surf will\\n",
  "take you to an unexpected place!\\c$",
]

[msg.section_0.entries.15]
text = [
  "Route 2, eh...\\c\\n",
  "I vaguely remember there being\\n",
  "some ledges on that route!\\c$",
]

[msg.section_0.entries.16]
text = [
  "The Day Care is on Route 3.\\c\\n",
  "There's a preschool there too, right?\\c\\n",
  "And what was that other place called?\\n",
  "Wellspring Cave, was it?\\c\\n",
  "It's on that same route.\\c$",
]

[msg.section_0.entries.17]
text = [
  "Wow! Route 4!\\n",
  "Always a lot going on over there.\\c\\n",
  "Things like construction and\\n",
  "people finding ruins.\\c$",
]

[msg.section_0.entries.18]
text = [
  "I used to slip out of the\\n",
  "Pokémon Center from time to time\\l\\n",
  "and go watch the performers on Route 5.\\c\\n",
  "While I was there, I met many people,\\n",
  "such as a girl who would buy items.\\c$",
]

[msg.section_0.entries.19]
text = [
  "Did you visit the Season Research Lab\\n",
  "on Route 6?\\l\\n",
  "Also, wasn't there a cave around there?\\c\\n",
  "And... Oh, yes. Watch out!\\n",
  "You might get fooled by something!\\c$",
]

[msg.section_0.entries.20]
text = [
  "Route 7 has those raised walkways.\\n",
  "If you stop, you fall right off!\\c\\n",
  "Also, I seem to remember an unexpected\\n",
  "Pokémon popping out of the tall grass.\\c$",
]

[msg.section_0.entries.21]
text = [
  "Route 8's puddles freeze in winter.\\n",
  "I liked how you could slide on them, but it\\l\\n",
  "was a bit hard to make forward progress!\\c$",
]

[msg.section_0.entries.22]
text = [
  "Route 9, huh.\\c\\n",
  "The toughs that hang out there might\\n",
  "challenge you to a Pokémon battle.\\c\\n",
  "But you're a tough Trainer yourself,\\n",
  "so that works out great for you!\\c$",
]

[msg.section_0.entries.23]
text = [
  "Ah, I liked Route 10.\\n",
  "There was something lyrical about it...$",
]

[msg.section_0.entries.24]
text = [
  "Route 11 is just like Route 14.\\n",
  "Waterfall time!\\c$",
]

[msg.section_0.entries.25]
text = [
  "Route 12's gently sloping hills\\n",
  "roll up and down, up and down.\\c\\n",
  "Strolling across them is a nice feeling!\\c$",
]

[msg.section_0.entries.26]
text = [
  "My impression of Route 13\\n",
  "is that it's rather long!\\c\\n",
  "I remember the main route's\\n",
  "being hard to find, but it's nice\\l\\n",
  "because you can go many places!\\c$",
]

[msg.section_0.entries.27]
text = [
  "You're on Route 14?\\n",
  "Then...use Waterfall, right?!\\c$",
]

[msg.section_0.entries.28]
text = [
  "Wow, Route 15...\\c\\n",
  "The highlight is the\\n",
  "Poké Transfer Lab.\\c\\n",
  "And I think there was a lady there\\n",
  "who would trade Pokémon.\\c\\n",
  "Hmm... Could I have misremembered?\\c$",
]

[msg.section_0.entries.29]
text = [
  "Route 16, huh...\\c\\n",
  "You sure don't expect to find\\n",
  "a forest like that so close to\\l\\n",
  "Nimbasa City, do you?\\c\\n",
  "I wonder what the Lostlorn\\n",
  "Forest is like these days.\\c$",
]

[msg.section_0.entries.30]
text = [
  "Route 17, is it?\\c\\n",
  "The current was so fast,\\n",
  "I couldn't go where I wanted...\\c$",
]

[msg.section_0.entries.31]
text = [
  "Route 18!\\c\\n",
  "The most interesting thing about it...\\c\\n",
  "What could it be?\\c$",
]

[msg.section_0.entries.32]
text = [
  "The Dreamyard...\\c\\n",
  "I've heard that rarely seen\\n",
  "Pokémon go there.\\c\\n",
  "A mysterious power remains\\n",
  "that draws them there.\\c$",
]

[msg.section_0.entries.33]
text = [
  "Bug-type Pokémon can\\n",
  "be found all over Pinwheel Forest.\\c\\n",
  "By the way, it never bugs me to\\n",
  "see Bug-type Pokémon!\\c$",
]

[msg.section_0.entries.34]
text = [
  "Watch out for sandstorms\\n",
  "in the Desert Resort!\\c\\n",
  "Some types of Pokémon\\n",
  "will take constant damage in them!\\c$",
]

[msg.section_0.entries.35]
text = [
  "The Relic Castle, you say?\\n",
  "You'll get buried in sand!\\c\\n",
  "You already know this, right?\\c\\n",
  "If you run onto pits in the sand,\\n",
  "you'll fall through them!\\c$",
]

[msg.section_0.entries.36]
text = [
  "The Pokémon World Tournament?\\n",
  "Oh, so you are in Driftveil.\\c\\n",
  "What are you going to do?\\n",
  "Did you enter the tournament?\\c\\n",
  "I'll be cheering for you on TV!\\c$",
]

[msg.section_0.entries.37]
text = [
  "What's this? I'm hearing a buzzing noise.\\c\\n",
  "What? Chargestone Cave?\\c\\n",
  "Wow! The Xtransceiver works in there?\\n",
  "I never knew that!\\c$",
]

[msg.section_0.entries.38]
text = [
  "I'm having a hard time hearing you...\\c\\n",
  "Twist Mountain?\\c\\n",
  "Oh, now I see!\\n",
  "You're in Clay's mountain, then.\\c\\n",
  "I've heard you can find Fossils there!\\c$",
]

[msg.section_0.entries.39]
text = [
  "Dragonspiral Tower!\\n",
  "Wow! You can go inside?\\c\\n",
  "Isn't that the place where they say the\\n",
  "legendary Pokémon is resting?\\c$",
]

[msg.section_0.entries.40]
text = [
  "Victory Road!\\n",
  "The road that puts you to the test!\\c\\n",
  "You'll be fine! You've got\\n",
  "Pokémon by your side!\\c$",
]

[msg.section_0.entries.41]
text = [
  "Lacunosa Town... Oh, my word.\\c\\n",
  "What made an impression on me when\\n",
  "I visited that town was that it was\\l\\n",
  "completely different from day to night.\\c$",
]

[msg.section_0.entries.42]
text = [
  "Undella Town, Undella Town.\\c\\n",
  "A very rich family used to live there,\\n",
  "but it looks like everyone moved.\\c\\n",
  "I hear the Marine Tube\\n",
  "is totally amazing!\\c$",
]

[msg.section_0.entries.43]
text = [
  "Anville Town!\\c\\n",
  "What?\\n",
  "Were you a big fan of trains?\\c\\n",
  "Still, I understand how you feel.\\c$",
]

[msg.section_0.entries.44]
text = [
  "The Pokémon League!\\c\\n",
  "Oh, my goodness!\\c\\n",
  "So, you just have to challenge\\n",
  "the Elite Four, and then...\\c\\n",
  "Believe in your Pokémon\\n",
  "and move forward!\\c$",
]

[msg.section_0.entries.45]
text = [
  "Pardon me? Where?\\c\\n",
  "N's Castle?\\c\\n",
  "I'm sorry...\\n",
  "I've never heard of it.\\c$",
]

[msg.section_0.entries.46]
text = [
  "The Royal Unova?\\c\\n",
  "A cruise ship from Castelia!\\n",
  "You're getting pretty fancy!\\c\\n",
  "So, which is it going to be?\\n",
  "Are you going to have fun battling...\\l\\n",
  "or enjoy the sights?\\c$",
]

[msg.section_0.entries.47]
text = [
  "Gear Station, then?\\c\\n",
  "The trains to Anville Town get overlooked\\n",
  "more often than you'd expect!\\c\\n",
  "If you have time, you should take a ride!\\c$",
]

[msg.section_0.entries.48]
text = [
  "Battle Subway!\\n",
  "You sure like challenges.\\c\\n",
  "Keeping a winning streak\\n",
  "going is really hard.\\c\\n",
  "But the knowledge and experience you\\n",
  "gain from battle will make you stronger!\\c$",
]

[msg.section_0.entries.49]
text = [
  "Musical Theater!\\n",
  "Hee hee hee!\\c\\n",
  "I used to go there often, too!\\n",
  "I only went to watch, though!\\c\\n",
  "The Pokémon look so cute\\n",
  "with their accessories and dancing!\\c$",
]

[msg.section_0.entries.50]
text = [
  "Black City, huh?\\n",
  "I wonder how it has changed.\\c$",
]

[msg.section_0.entries.51]
text = [
  "White Forest, huh?\\n",
  "I wonder how it has changed.\\c$",
]

[msg.section_0.entries.52]
text = [
  "Unity Tower!\\c\\n",
  "If you've traded Pokémon\\n",
  "with people from other countries,\\l\\n",
  "you should definitely visit!\\c$",
]

[msg.section_0.entries.53]
text = [
  "Wellspring Cave...\\c\\n",
  "It's small, but exploring deep within\\n",
  "the cave is surprisingly difficult.\\c$",
]

[msg.section_0.entries.54]
text = [
  "Mistralton Cave, huh?\\c\\n",
  "Many Trainers go there\\n",
  "to catch a Pokémon called Axew!\\c$",
]

[msg.section_0.entries.55]
text = [
  "Rumination Field?\\c\\n",
  "Oh, yes!\\n",
  "Deep in Pinwheel Forest, as I remember.\\c\\n",
  "Now, what are you doing in a\\n",
  "place like that?\\c$",
]

[msg.section_0.entries.56]
text = [
  "The Celestial Tower...\\n",
  "A final resting place for Pokémon.\\c\\n",
  "I'm sure some kind soul will\\n",
  "ring the bell today.\\c$",
]

[msg.section_0.entries.57]
text = [
  "Moor of Icirrus...\\c\\n",
  "Moor of Icirrus...\\c\\n",
  "What is it?\\c\\n",
  "I've heard of it,\\n",
  "but I've never been there...\\c$",
]

[msg.section_0.entries.58]
text = [
  "A Shopping Mall?\\c\\n",
  "Hm. Now, I wonder why the first thing\\n",
  "that came to mind was the storeroom!\\c$",
]

[msg.section_0.entries.59]
text = [
  "         $$",
]

[msg.section_0.entries.60]
text = [
  "The Poké Transfer Lab!\\c\\n",
  "Helping Professor Park\\n",
  "is a lot of fun, isn't it?\\c$",
]

[msg.section_0.entries.61]
text = [
  "The Giant Chasm?\\c\\n",
  "Where is that?\\n",
  "Where the meteor fell?\\c\\n",
  "What? Is that not it?\\c\\n",
  "I think I heard something like that\\n",
  "from Professor Juniper once, though...\\c$",
]

[msg.section_0.entries.62]
text = [
  "Where are you now?\\c\\n",
  "In Liberty Garden?\\c\\n",
  "Two years ago, it became really famous\\n",
  "when a mythical Pokémon was found there!\\c$",
]

[msg.section_0.entries.63]
text = [
  "P2 Laboratory?\\n",
  "I don't know much about that.\\c\\n",
  "Could that be the lab on Route 17?\\c$",
]

[msg.section_0.entries.64]
text = [
  "The Skyarrow Bridge is sure amazing.\\c\\n",
  "When I saw that the first time...\\c\\n",
  "That's right, saw it, not crossed it.\\c\\n",
  "I guess, at the time,\\n",
  "I was just astonished.\\c$",
]

[msg.section_0.entries.65]
text = [
  "The Driftveil Drawbridge, eh?\\c\\n",
  "I've always wanted to see the\\n",
  "bridge opening and closing.\\c$",
]

[msg.section_0.entries.66]
text = [
  "Did you feel the vibrations of the Tubeline\\n",
  "Bridge on the bottom of your feet?\\c\\n",
  "It feels like those vibrations give you\\n",
  "energy. I just love that feeling!\\c$",
]

[msg.section_0.entries.67]
text = [
  "Recently, the Village Bridge\\n",
  "has changed a bit, and there are\\l\\n",
  "things like tennis courts there.\\c\\n",
  "There's no Pokémon Center, though.\\n",
  "I haven't really gotten used to it yet.\\c$",
]

[msg.section_0.entries.68]
text = [
  "The Marvelous Bridge has\\n",
  "a futuristic design.\\c\\n",
  "But I've heard rumors of a ghost there...\\c$",
]

[msg.section_0.entries.69]
text = [
  "Entralink?\\c\\n",
  "I don't know about that...\\c\\n",
  "Is there a place like that\\n",
  "in the Unova region?\\c$",
]

[msg.section_0.entries.70]
text = [
  "Now, hm, the Abundant Shrine?\\c\\n",
  "The shrine honors the weather Pokémon\\n",
  "that is said to watch over harvests...\\c$",
]

[msg.section_0.entries.71]
text = [
  "Undella Bay is a famous place to dive!\\c\\n",
  "And, on the bottom of the sea...\\n",
  "Well, you should see for yourself!\\c$",
]

[msg.section_0.entries.72]
text = [
  "Lostlorn Forest?\\c\\n",
  "I think it may have been the work\\n",
  "of a Pokémon...\\c$",
]

[msg.section_0.entries.73]
text = [
  "The Trial Chamber?\\c\\n",
  "A Trainer might have told\\n",
  "me about it a long time ago.\\c\\n",
  "Was it the little room on\\n",
  "Victory Road?\\c$",
]

[msg.section_0.entries.74]
text = [
  "The Guidance Chamber...\\c\\n",
  "Oh, I remember!\\c\\n",
  "Wasn't it in the deepest\\n",
  "part of Mistralton Cave?\\c\\n",
  "Some people think it's a place\\n",
  "where hard-to-find Pokémon live.\\c$",
]

[msg.section_0.entries.75]
text = [
  "Entree Forest?\\c\\n",
  "I'm not familiar with it, I'm afraid.\\c\\n",
  "You say there's a place like that\\n",
  "in the Unova region?\\c$",
]

[msg.section_0.entries.76]
text = [
  "Nimbasa City is the city of entertainment!\\c\\n",
  "Working at the Pokémon Center\\n",
  "there was sure a lot of fun.\\c\\n",
  "Well, now...\\c\\n",
  "Big Stadium and Small Court are\\n",
  "packed with tough Trainers.\\c\\n",
  "There are so many other things\\n",
  "to see and do! Enjoy yourself!\\c$",
]

[msg.section_0.entries.77]
text = [
  "Driftveil City!\\c\\n",
  "Recently, hotels have been\\n",
  "popping up there like crazy, so I hear.\\c\\n",
  "Boy, other than that, I sure\\n",
  "don't know much about it!\\c$",
]

[msg.section_0.entries.78]
text = [
  "Mistralton City always makes me\\n",
  "think of Skyla!\\c\\n",
  "People who had been hurt by\\n",
  "the device in her Pokémon Gym\\l\\n",
  "would come to the Pokémon Center.\\c$",
]


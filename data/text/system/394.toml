  "Then...use Waterfall, right?!\\c$",
]

[msg.section_0.entries.102]
text = [
  "Route 15, huh... There was a lady there\\n",
  "who'd trade Pokémon.\\c\\n",
  "Hmm... Could I have misremembered?\\c$",
]

[msg.section_0.entries.103]
text = [
  "Route 15, huh... There was a lady there\\n",
  "who'd trade Pokémon.\\c\\n",
  "Hmm... Could I have misremembered?\\c$",
]

[msg.section_0.entries.104]
text = [
  "Lacunosa Town... Oh, my word.\\c\\n",
  "What made an impression on me when\\n",
  "I visited that town was that it was\\l\\n",
  "completely different from day to night.\\c$",
]

[msg.section_0.entries.105]
text = [
  "Undella Town, Undella Town.\\c\\n",
  "A very rich family used to live there,\\n",
  "but it looks like everyone moved.\\c\\n",
  "Now there are fewer manors there.\\n",
  "It's a little sad.\\c$",
]

[msg.section_0.entries.106]
text = [
  "Accumula Gate is, um, well...\\c\\n",
  "Ummm...\\c\\n",
  "Does anything make it different\\n",
  "from any other gate?\\c$",
]

[msg.section_0.entries.107]
text = [
  "Undella Gate is a vertical gate.\\c\\n",
  "The fact that it's not really different\\n",
  "from a horizontal gate is one of\\l\\n",
  "the great things about gates!\\c$",
]

[msg.section_0.entries.108]
text = [
  "Nacrene Gate is a very gate-y gate!\\c\\n",
  "Unless you're super obsessed with gates,\\n",
  "you can't tell the difference, though.\\c$",
]

[msg.section_0.entries.109]
text = [
  "Castelia Gate, huh?\\c\\n",
  "The gap between Castelia City and\\n",
  "Route 4 is pretty fun, isn't it?\\c$",
]

[msg.section_0.entries.110]
text = [
  "The Nimbasa Gates, you say?\\c\\n",
  "For some odd reason,\\n",
  "I like the one on the right!\\c$",
]

[msg.section_0.entries.111]
text = [
  "Opelucid Gate, really? Er...\\c\\n",
  "I seem to remember a man who\\n",
  "was always eating something\\l\\n",
  "by one of those gates.\\c$",
]

[msg.section_0.entries.112]
text = [
  "Black Gate!\\c\\n",
  "Pass on through, pass on through\\n",
  "to the expansive Black City!\\c\\n",
  "So... Yeah...\\n",
  "There isn't a ton to say about gates.\\c$",
]

[msg.section_0.entries.113]
text = [
  "White Gate!\\c\\n",
  "Pass on through, pass on through\\n",
  "to the expansive White Forest!\\c\\n",
  "So... Yeah...\\n",
  "There isn't a ton to say about gates.\\c$",
]

[msg.section_0.entries.114]
text = [
  "A Bridge Gate?\\c\\n",
  "All of the gates connected to\\n",
  "bridges in the Unova Region\\l\\n",
  "are...all...called...Bridge Gates!\\c$",
]

[msg.section_0.entries.115]
text = [
  "Route Gate?\\c\\n",
  "Hee hee. There are two gates\\n",
  "called Route Gates.\\c\\n",
  "The first one is off Route 1, and the\\n",
  "other is close to the Desert Resort!\\c$",
]

[msg.section_0.entries.116]
text = [
  "The Abyssal Ruins!\\c\\n",
  "A mysterious, ancient script!\\c\\n",
  "And if you solve its secret,\\n",
  "please tell me what it is!\\c$",
]

[msg.section_0.entries.117]
text = [
  "What?\\n",
  "You're in Aspertia?!\\c\\n",
  "Then you should come home!\\n",
  "To your own house!\\c$",
]

[msg.section_0.entries.118]
text = [
  "Virbank City!\\c\\n",
  "You went to a music club?\\c\\n",
  "Recently, I've been getting into\\n",
  "Roxie's band!\\c\\n",
  "When I listen to them,\\n",
  "I feel so full of energy!\\c$",
]

[msg.section_0.entries.119]
text = [
  "Oh my! You're in Humilau City?\\c\\n",
  "That's the nicest of all the resort areas\\n",
  "in the Unova region!\\c\\n",
  "I was only at the Pokémon Center\\n",
  "in that town for a short while.\\c$",
]

[msg.section_0.entries.120]
text = [
  "Pokéstar Studios!\\c\\n",
  "What?! You're going to\\n",
  "be in a movie?\\l\\n",
  "Well, I'll have to go see it!\\c\\n",
  "Oh, a little advice--acting\\n",
  "is all about being natural!\\c$",
]

[msg.section_0.entries.121]
text = [
  "You're in Join Avenue?\\c\\n",
  "I think the way the stores\\n",
  "come and go is romantic, somehow.\\c$",
]

[msg.section_0.entries.122]
text = [
  "You're in Floccesy Town for a spell?\\n",
  "Did you visit Alder's house?\\c\\n",
  "A long time ago, Alder taught me about\\n",
  "Pokémon! Boy, that takes me back!\\c$",
]

[msg.section_0.entries.123]
text = [
  "Lentimas Town is close to\\n",
  "Reversal Mountain.\\c\\n",
  "It's small, but it has an air of uniqueness\\n",
  "that makes it surprisingly popular!\\c$",
]

[msg.section_0.entries.124]
text = [
  "Route 19 is right outside of Aspertia.\\c\\n",
  "I guess you could say it's a valley road.\\c$",
]

[msg.section_0.entries.125]
text = [
  "Route 20 is a place where you can\\n",
  "enjoy the changing of the seasons.\\c\\n",
  "My favorite season is fall!\\n",
  "You know, the foliage, the colors... Ah...\\c$",
]

[msg.section_0.entries.126]
text = [
  "I guess you could say that Route 21\\n",
  "is very rocky. It's like a maze.\\c\\n",
  "You might find it surprisingly hard to\\n",
  "make progress!\\c$",
]

[msg.section_0.entries.127]
text = [
  "Route 22 is very lush and green.\\c\\n",
  "So that could well indicate that you'll\\n",
  "find many different Pokémon there.\\c$",
]

[msg.section_0.entries.128]
text = [
  "Route 23, huh...\\c\\n",
  "It's the last great natural\\n",
  "area in the Unova region.\\c\\n",
  "Apparently, the path is so steep\\n",
  "and dangerous that some people\\l\\n",
  "go on and on about it.\\c$",
]

[msg.section_0.entries.129]
text = [
  "Castelia Sewers.\\c\\n",
  "That's just another way to say it's\\n",
  "Castelia City's sewer system.\\c\\n",
  "I'm sorry I can't help more.\\n",
  "I know about it, but I've never been.\\c\\n",
  "But, listen!\\c\\n",
  "I've heard there's a secret place\\n",
  "located at the far end of the sewer!\\c$",
]

[msg.section_0.entries.130]
text = [
  "The ranch!\\c\\n",
  "Apparently, when I was little,\\n",
  "I rode a Pokémon and\\l\\n",
  "everyone got really mad!\\c\\n",
  "But I was just a little kid,\\n",
  "and I don't remember that at all!\\c$",
]

[msg.section_0.entries.131]
text = [
  "Virbank Complex?\\n",
  "What, are you helping someone work?\\c\\n",
  "Still, I sure remember how\\n",
  "pretty it looked at night!\\c$",
]

[msg.section_0.entries.132]
text = [
  "Reversal Mountain!\\c\\n",
  "So many Trainers arrived at the\\n",
  "Pokémon Center completely wiped out!\\c\\n",
  "Please be careful, OK?\\c$",
]

[msg.section_0.entries.133]
text = [
  "The Strange House?!\\c\\n",
  "Wow, I know that place!\\c\\n",
  "It's a mysterious place close to\\n",
  "Reversal Mountain. Know where I mean?\\c\\n",
  "Hmm. Maybe there are ghosts there...\\c$",
]

[msg.section_0.entries.134]
text = [
  "Victory Road!\\n",
  "The road that puts you to the test!\\c\\n",
  "You'll be fine! You've got\\n",
  "Pokémon by your side!\\c$",
]

[msg.section_0.entries.135]
text = [
  "What?\\n",
  "The Plasma Frigate?\\c\\n",
  "Never heard of it.\\c\\n",
  "Should I go have a look\\n",
  "and see what it's like?\\c$",
]

[msg.section_0.entries.136]
text = [
  "Relic Passage...\\c\\n",
  "As the name suggests, it's\\n",
  "an underground passage built long ago.\\c\\n",
  "If you pass through it, maybe you'll\\n",
  "find out who made it and why!\\c$",
]

[msg.section_0.entries.137]
text = [
  "Clay Tunnel, huh?\\c\\n",
  "I heard Clay kept on digging\\n",
  "no matter what.\\c\\n",
  "I wonder what it is about digging that\\n",
  "is so captivating to some folks.\\c\\n",
  "I heard there is someone who loves\\n",
  "digging in the Sinnoh region as well.\\c$",
]

[msg.section_0.entries.138]
text = [
  "          $$",
]

[msg.section_0.entries.139]
text = [
  "The White Treehollow!\\c\\n",
  "The so-called Unova's Challenge!\\n",
  "How far can you get?\\c\\n",
  "With those Pokémon at your side,\\n",
  "I'm sure you won't have any trouble!\\c$",
]

[msg.section_0.entries.140]
text = [
  "The Black Tower!\\c\\n",
  "The so-called Unova's Challenge!\\n",
  "How far can you get?\\c\\n",
  "With those Pokémon at your side,\\n",
  "I'm sure you won't have any trouble!\\c$",
]

[msg.section_0.entries.141]
text = [
  "The Seaside Cave, so, so, so...\\c\\n",
  "At some point, waves, wind, and Pokémon\\n",
  "made that cave in that giant rock.\\c$",
]

[msg.section_0.entries.142]
text = [
  "The Cave of Being. Ah, yes, I recall it.\\n",
  "I wonder what's in there.\\c\\n",
  "Apparently, it's a strange\\n",
  "place with nothing inside.\\c$",
]

[msg.section_0.entries.143]
text = [
  "A Hidden Grotto...?\\c\\n",
  "I have no idea what that is!\\c\\n",
  "Honestly, I'm not hiding anything!\\c$",
]

[msg.section_0.entries.144]
text = [
  "Wow, the Marine Tube!\\c\\n",
  "It was just finished recently, I think!\\n",
  "It's like a walk-through aquarium!\\c\\n",
  "I really want to go see it!\\c$",
]

[msg.section_0.entries.145]
text = [
  "Virbank Gate, and...\\c\\n",
  "Gates are pretty much the same\\n",
  "everywhere, wouldn't you say?\\c$",
]

[msg.section_0.entries.146]
text = [
  "Aspertia Gate is really close!\\c\\n",
  "What? If you want to rest,\\n",
  "you should just come home!\\c$",
]

[msg.section_0.entries.147]
text = [
  "The Nature Preserve...?\\n",
  "I've heard rumors about it, but...\\c\\n",
  "Since it exists to protect\\n",
  "rare Pokémon, only certain\\l\\n",
  "people are allowed to go there.\\c\\n",
  "Really? Have you been granted entry?!\\c$",
]

[msg.section_0.entries.148]
text = [
  "Hee hee hee!\\c\\n",
  "So the allure of gaining Medals\\n",
  "has you hooked too, huh?\\c\\n",
  "You can learn a lot in the Medal Office!\\c$",
]

[msg.section_0.entries.149]
text = [
  "What?\\n",
  "The Underground Ruins?\\c\\n",
  "I've never heard of such a place.\\c\\n",
  "Should I go take a peek and see what's\\n",
  "going on there?\\c$",
]

[msg.section_0.entries.150]
text = [
  "What?\\n",
  "Rock Peak Chamber?\\c\\n",
  "Never heard of it.\\c\\n",
  "Should I go have a look and find out\\n",
  "what's up with it?\\c$",
]

[msg.section_0.entries.151]
text = [
  "What?\\n",
  "Iceberg Chamber?\\c\\n",
  "Not familiar with it.\\c\\n",
  "Should I go have a look and see\\n",
  "what's going on there?\\c$",
]

[msg.section_0.entries.152]
text = [
  "What?\\n",
  "Iron Chamber?\\c\\n",
  "You got me. No idea.\\c\\n",
  "Should I go have a look\\n",
  "and check it out?\\c$",
]

[msg.section_0.entries.153]
text = [
  "Pledge Grove?\\c\\n",
  "Oh. The one in Floccesy Town!\\c\\n",
  "The marks on that rock just\\n",
  "have to have been made by Pokémon!\\c$",
]

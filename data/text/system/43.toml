  "◆ Welcome to the Hall of Fame! [VAR TRNAME(6)] won a victory with [VAR PKNAME(0)], [VAR PKNAME(1)], [VAR PKNAME(2)], [VAR PKNAME(3)], [VAR PKNAME(4)], and [VAR PKNAME(5)]!$",
]

[msg.section_0.entries.211]
text = [
  "◇ A Trainer from Aspertia City challenged and successfully beat Marlon, the Humilau Gym Leader!$",
]

[msg.section_0.entries.212]
text = [
  "◇ The array of beautiful mountain peaks, as seen from the overlook, is a must-see.$",
]

[msg.section_0.entries.213]
text = [
  "◇ The Trainers' School in Aspertia City is a welcoming place.$",
]

[msg.section_0.entries.214]
text = [
  "◇ The flowers blooming all over Aspertia City fill it with a sweet scent.$",
]

[msg.section_0.entries.215]
text = [
  "◇ Beyond Route 19, there is Floccesy Town, which is famous for the clock tower.$",
]

[msg.section_0.entries.216]
text = [
  "◇ Aspertia City, located at the foot of mountains, is cool and comfortable even in summer.$",
]

[msg.section_0.entries.217]
text = [
  "◇ Floccesy Town has a small school, where children can learn how great Pokémon are.$",
]

[msg.section_0.entries.218]
text = [
  "◇ Route 19 is characterized by sharp cliffs.$",
]

[msg.section_0.entries.219]
text = [
  "◇ Beyond Floccesy Town, there is a big ranch with a lot of Pokémon.$",
]

[msg.section_0.entries.220]
text = [
  "◇ Aspertia, in its mountain surroundings, has a peaceful atmosphere even though it is an urban city.$",
]

[msg.section_0.entries.221]
text = [
  "◇ The Virbank Gym is also a famous live-music house known as a gateway to success for young people.$",
]

[msg.section_0.entries.222]
text = [
  "◇ The complex is always recruiting working Pokémon Trainers.$",
]

[msg.section_0.entries.223]
text = [
  "◇ Pokéstar Studios looks for stars to film all kinds of movies.$",
]

[msg.section_0.entries.224]
text = [
  "◇ There is a regular liner from Virbank City to Castelia City.$",
]

[msg.section_0.entries.225]
text = [
  "◇ Ships coming and going across the water are the means of transportation for people living in Virbank City.$",
]

[msg.section_0.entries.226]
text = [
  "◇ Virbank City developed around people working in factories.$",
]

[msg.section_0.entries.227]
text = [
  "◇ People working in the complex have fun with Pokémon battles during their work breaks.$",
]

[msg.section_0.entries.228]
text = [
  "◇ The night view soothes people who find themselves exhausted after work.$",
]

[msg.section_0.entries.229]
text = [
  "◇ The crane at the east side of the city loads and unloads cargo.$",
]


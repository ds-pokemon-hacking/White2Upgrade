[msg.section_0.entries.0]
text = [
  "A-list Actor$",
]

[msg.section_0.entries.1]
text = [
  "Popular Boy$",
]

[msg.section_0.entries.2]
text = [
  "[VAR TRNAME(1)]: No, no way...$",
]

[msg.section_0.entries.3]
text = [
  "Camilo: Hm...\\c\\n",
  "(...Well now, prepare yourself!\\n",
  "You're going to feel even worse...)\\c\\n",
  "(...You'll regret having professed\\n",
  "your love to me...)$",
]

[msg.section_0.entries.4]
text = [
  "Camilo: Gets me off my game...$",
]

[msg.section_0.entries.5]
text = [
  "[VAR TRNAME(1)]: Camilo, your Pokémon\\n",
  "is really aggressive!$",
]

[msg.section_0.entries.6]
text = [
  "Camilo: Oh come now.\\n",
  "Are you afraid of my little Smeargle?\\c\\n",
  "A girl like that could\\n",
  "never be my sweetie!$",
]

[msg.section_0.entries.7]
text = [
  "[VAR TRNAME(1)]: Please come at me\\n",
  "with everything you've got!$",
]

[msg.section_0.entries.8]
text = [
  "Camilo: So you call me to a place like this,\\n",
  "just to ask me to go out with you?$",
]

[msg.section_0.entries.9]
text = [
  "[VAR TRNAME(1)]: Um, I...\\n",
  "From the first time I saw you,\\l\\n",
  "I couldn't think about anything else!\\c\\n",
  "I love you!$",
]

[msg.section_0.entries.10]
text = [
  "Camilo: Me and you?\\n",
  "That joke's not very funny.$",
]

[msg.section_0.entries.11]
text = [
  "[VAR TRNAME(1)]: I'm serious.\\n",
  "I won't leave until I get an answer!$",
]

[msg.section_0.entries.12]
text = [
  "Camilo: Hm...\\c\\n",
  "(...Oh, what a precocious little princess.\\n",
  "Makes me want to be a little mean to her...)$",
]

[msg.section_0.entries.13]
text = [
  "Camilo: How about this, then?\\n",
  "Want to have a Pokémon battle\\l\\n",
  "to test how compatible we are?$",
]

[msg.section_0.entries.14]
text = [
  "[VAR TRNAME(1)]: Y-yes! I'll battle you!$",
]

[msg.section_0.entries.15]
text = [
  "Camilo: Hm... That's good!\\c\\n",
  "(...Heh heh heh... I can't wait...\\n",
  "Seeing a girl fighting to hold\\l\\n",
  "back tears is always moving...)$",
]

[msg.section_0.entries.16]
text = [
  "Smeargle: Argle! Arrrrg!$",
]

[msg.section_0.entries.17]
text = [
  "Camilo: OK! Here I come!\\c\\n",
  "(...Smeargle's raring to go, too!...)\\c\\n",
  "(...The girls who've professed their\\n",
  "love to me so far...\\l\\n",
  "I've made as many cry as there are stars.\\l\\n",
  "And yet I still haven't found her...\\l\\n",
  "My sweetie...)$",
]

[msg.section_0.entries.18]
text = [
  "[VAR TRNAME(1)]: C-Camilo!\\n",
  "Before we start,\\l\\n",
  "I have a request!\\l\\n",
  "If I win...$",
]

[msg.section_0.entries.19]
text = [
  "Camilo: If you win?$",
]

[msg.section_0.entries.20]
text = [
  "[VAR TRNAME(1)]: Marry me!$",
]

[msg.section_0.entries.21]
text = [
  "Camilo: Whaaaat?!\\n",
  "Marriage? When you say marriage,\\l\\n",
  "do you mean THAT marriage?\\c\\n",
  "You need to think more of yourself...\\n",
  "That's no good! That's seriously bad!$",
]

[msg.section_0.entries.22]
text = [
  "[VAR TRNAME(1)]: Let's go on a date!$",
]

[msg.section_0.entries.23]
text = [
  "Camilo: What are you saying\\n",
  "all of a sudden?!\\c\\n",
  "A date with me?\\n",
  "Come back yesterday!$",
]

[msg.section_0.entries.24]
text = [
  "[VAR TRNAME(1)]: C-Camilo...\\n",
  "You're so cool...$",
]

[msg.section_0.entries.25]
text = [
  "Camilo: What?$",
]

[msg.section_0.entries.26]
text = [
  "[VAR TRNAME(1)]: When you don't like what you\\n",
  "hear, you express your opinion directly!\\c\\n",
  "Thinking of me like that...\\n",
  "You are a wonderful person!$",
]

[msg.section_0.entries.27]
text = [
  "Camilo: Ah, I see...\\c\\n",
  "(...You've GOT to be kidding...\\n",
  "She is really tough!\\l\\n",
  "No more Mr. Nice Guy...)$",
]

[msg.section_0.entries.28]
text = [
  "Camilo: Give it a rest!\\c\\n",
  "I don't care about you at all, all right?!$",
]

[msg.section_0.entries.29]
text = [
  "[VAR TRNAME(1)]: So manly...$",
]

[msg.section_0.entries.30]
text = [
  "Camilo: Aaahhh! C'mon!\\n",
  "Do you have wax in your ears?!\\l\\n",
  "If I can't make you understand with words,\\l\\n",
  "I guess I'll have to use force!$",
]

[msg.section_0.entries.31]
text = [
  "[VAR TRNAME(1)]: Please do!$",
]

[msg.section_0.entries.32]
text = [
  "Smeargle: Smearrrrrg!$",
]

[msg.section_0.entries.33]
text = [
  "[VAR TRNAME(1)]: I-I'm scared!$",
]

[msg.section_0.entries.34]
text = [
  "Smeargle: Smearrrg?$",
]

[msg.section_0.entries.35]
text = [
  "[VAR TRNAME(1)]: Noooo!\\n",
  "I lost!\\c\\n",
  "Camilo, you're so strong!\\n",
  "I didn't stand a chance!$",
]

[msg.section_0.entries.36]
text = [
  "Camilo: What?\\n",
  "Are you kissing up to me?\\l\\n",
  "That won't get you\\l\\n",
  "anywhere with me at all!$",
]

[msg.section_0.entries.37]
text = [
  "Camilo: ...\\c\\n",
  "(...That's strange...\\n",
  "Why don't I feel any malice?...)\\c\\n",
  "(...She took all of my Pokémon's attacks...\\n",
  "What a big-hearted girl...)$",
]

[msg.section_0.entries.38]
text = [
  "[VAR TRNAME(1)]: Hee hee!$",
]

[msg.section_0.entries.39]
text = [
  "Camilo: ...\\c\\n",
  "(...Sigh... No matter how terrible a thing\\n",
  "I say, she keeps smiling that smile...)\\c\\n",
  "(...Huh? Did I start to feel something\\n",
  "for her at some point?...)$",
]

[msg.section_0.entries.40]
text = [
  "[VAR TRNAME(1)]: Camilo,\\n",
  "is something wrong?$",
]

[msg.section_0.entries.41]
text = [
  "Camilo: If you want to be friends,\\n",
  "I'll hang out with you!$",
]

[msg.section_0.entries.42]
text = [
  "Camilo: Hm...\\c\\n",
  "(...What is this? It's weird.\\n",
  "A girl who makes me feel good\\l\\n",
  "just by being around me.\\l\\n",
  "My sweetie?!...)$",
]

[msg.section_0.entries.43]
text = [
  "Just as battles aren't won\\n",
  "by power alone,\\c\\n",
  "the strongest person doesn't always\\n",
  "win in relationships either.$",
]

[msg.section_0.entries.44]
text = [
  "Turning the other cheek!\\n",
  "That's another form love takes!$",
]

[msg.section_0.entries.45]
text = [
  "[VAR TRNAME(1)]: Huff, puff...$",
]

[msg.section_0.entries.46]
text = [
  "Camilo: Hm. What do you want?\\n",
  "Are you winded already?\\c\\n",
  "I was thinking maybe\\n",
  "if it was you,\\l\\n",
  "but you're just like the others.\\c\\n",
  "You're not the sweet honey\\n",
  "I'm looking for...$",
]

[msg.section_0.entries.47]
text = [
  "[VAR TRNAME(1)]: Camilo...\\n",
  "No...$",
]

[msg.section_0.entries.48]
text = [
  "Camilo: I'm sorry,\\n",
  "but I'm just not interested\\l\\n",
  "in ordinary girls like you...\\c\\n",
  "I don't think we'll meet again.\\n",
  "Let's go, Smeargle!$",
]

[msg.section_0.entries.49]
text = [
  "Smeargle: Arg! Smearg!$",
]

[msg.section_0.entries.50]
text = [
  "Just as the results of\\n",
  "battle don't follow a set pattern,\\l\\n",
  "relationships between people don't\\l\\n",
  "always go how you would expect.$",
]

[msg.section_0.entries.51]
text = [
  "Sometimes you must endure\\n",
  "a painful parting because you care!\\l\\n",
  "That's another form love takes!$",
]

[msg.section_0.entries.52]
text = [
  "Smeargle: Arg... Argle argle...$",
]

[msg.section_0.entries.53]
text = [
  "Camilo: Tsk. What?\\n",
  "You're terrible!\\l\\n",
  "Beating up my little Smeargle like that!\\c\\n",
  "Seriously! I can't believe you!\\n",
  "I'm sorry. I never want to see you again.\\l\\n",
  "You're...no good...$",
]

[msg.section_0.entries.54]
text = [
  "[VAR TRNAME(1)]: No good...\\n",
  "I'm a terrible girl...\\l\\n",
  "Camilo, you're so tough!\\c\\n",
  "Eh heh heh... Eh heh heh heh...\\c\\n",
  "That's what's great about you!$",
]

[msg.section_0.entries.55]
text = [
  "Just as crazy things happen\\n",
  "in the world of battling,\\c\\n",
  "you never know what is\\n",
  "going to happen in relationships.$",
]

[msg.section_0.entries.56]
text = [
  "Some people take painful and\\n",
  "cruel treatment with joy!\\l\\n",
  "That's another form love takes!$",
]

[msg.section_0.entries.57]
text = [
  "Camilo: What is it about you?\\n",
  "I can't figure you out...$",
]

[msg.section_0.entries.58]
text = [
  "[VAR TRNAME(1)]: Hee hee.$",
]

[msg.section_0.entries.59]
text = [
  "Camilo: Just getting involved won't work.\\n",
  "Trying to interact with you wears me out...\\l\\n",
  "Guess I'll just leave you alone...$",
]

[msg.section_0.entries.60]
text = [
  "[VAR TRNAME(1)]: Hey! No way!\\n",
  "Pay attention to me!$",
]

[msg.section_0.entries.61]
text = [
  "Smeargle: Smearrrrgle!$",
]

[msg.section_0.entries.62]
text = [
  "[VAR TRNAME(1)]: I won't give up!\\n",
  "I'll get you to turn my way!$",
]

[msg.section_0.entries.63]
text = [
  "Just as the results of\\n",
  "battle don't follow a set pattern,\\c\\n",
  "relationships between people don't\\n",
  "always go how you would expect.$",
]

[msg.section_0.entries.64]
text = [
  "Even if they won't look your way,\\n",
  "don't give up on love!\\l\\n",
  "That's another form love takes!$",
]

[msg.section_0.entries.65]
text = [
  "Camilo: What was that now?$",
]

[msg.section_0.entries.66]
text = [
  "[VAR TRNAME(1)]: Um... Er...\\n",
  "It was...Attract...$",
]

[msg.section_0.entries.67]
text = [
  "Camilo: Ha ha...\\c\\n",
  "You thought you could change\\n",
  "my mind with Attract?\\c\\n",
  "That's unexpected...$",
]

[msg.section_0.entries.68]
text = [
  "[VAR TRNAME(1)]: I'm...\\n",
  "I'm sorry...$",
]

[msg.section_0.entries.69]
text = [
  "Camilo: ...$",
]

[msg.section_0.entries.70]
text = [
  "[VAR TRNAME(1)]: Oohhh...$",
]

[msg.section_0.entries.0]
text = [
  "[VAR TRNAME(0)]!\\c\\n",
  "A strange ship was flying toward\\n",
  "Opelucid City, right?!\\c$",
]

[msg.section_0.entries.1]
text = [
  "I saw it, too!\\n",
  "I'm en route!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Cheren! That's Team Plasma's\\n",
  "ship, isn't it?\\c$",
]

[msg.section_0.entries.3]
text = [
  "Yes. No doubt about it...\\c\\n",
  "Anyway, I'll be arriving\\n",
  "in just a moment!\\c$",
]

[msg.section_0.entries.4]
text = [
  "OK, I'll leave things to you!\\c\\n",
  "[VAR TRNAME(0)]!\\n",
  "If you run into any trouble,\\l\\n",
  "call me!\\c$",
]

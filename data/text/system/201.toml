[msg]
trailing_data = "4040"

[msg.section_0.entries.0]
text = [
  "Actress$",
]

[msg.section_0.entries.1]
text = [
  "Invader$",
]

[msg.section_0.entries.2]
text = [
  "E: Ah...\\n",
  "Mothership, I'm waiting...$",
]

[msg.section_0.entries.3]
text = [
  "[VAR TRNAME(1)]: Who are you, E?$",
]

[msg.section_0.entries.4]
text = [
  "E: Foolish human...\\n",
  "Thanks for your help...$",
]

[msg.section_0.entries.5]
text = [
  "[VAR TRNAME(1)]: You look like...uh...$",
]

[msg.section_0.entries.6]
text = [
  "E: As you can finally see... I am an alien.\\n",
  "That's what you humans call us...$",
]

[msg.section_0.entries.7]
text = [
  "[VAR TRNAME(1)]: But why did you disguise\\n",
  "yourself as a human being?$",
]

[msg.section_0.entries.8]
text = [
  "E: Can't you answer your own question?\\n",
  "I needed your help. I used you.$",
]

[msg.section_0.entries.9]
text = [
  "[VAR TRNAME(1)]: What?\\n",
  "Then, the plan was...$",
]

[msg.section_0.entries.10]
text = [
  "E: The plan was intended to bring\\n",
  "the mothership to this planet.\\l\\n",
  "As you can finally see.$",
]

[msg.section_0.entries.11]
text = [
  "[VAR TRNAME(1)]: That means...\\n",
  "The UFO test we had...?$",
]

[msg.section_0.entries.12]
text = [
  "E: To bring the gigantic mothership to\\n",
  "this planet, we needed a lot of energy...\\c\\n",
  "So I devised a phony UFO test. Ha ha!\\n",
  "We absorbed all the energy we needed\\l\\n",
  "from your Pokémon!$",
]

[msg.section_0.entries.13]
text = [
  "[VAR TRNAME(1)]: You...phony...$",
]

[msg.section_0.entries.14]
text = [
  "E: The mothership will soon be landing.$",
]

[msg.section_0.entries.15]
text = [
  "[VAR TRNAME(1)]: You tricked me!$",
]

[msg.section_0.entries.16]
text = [
  "E: So what?\\c\\n",
  "My shockingly naive little human being...$",
]

[msg.section_0.entries.17]
text = [
  "[VAR TRNAME(1)]: Wha...?$",
]

[msg.section_0.entries.18]
text = [
  "E: The mothership is our energy source...\\c\\n",
  "So there's nothing that lower species like\\n",
  "humans and Pokémon can do about it anymore.$",
]

[msg.section_0.entries.19]
text = [
  "[VAR TRNAME(1)]: It's over...$",
]

[msg.section_0.entries.20]
text = [
  "E: That's right.\\n",
  "This planet will be ours!$",
]

[msg.section_0.entries.21]
text = [
  "E: Now... It's landing...\\n",
  "The mothership...$",
]

[msg.section_0.entries.22]
text = [
  "[VAR TRNAME(1)]: Augh...$",
]

[msg.section_0.entries.23]
text = [
  "E: Our journey will at last be at an end!$",
]

[msg.section_0.entries.24]
text = [
  "[VAR TRNAME(1)]: What do you mean?$",
]

[msg.section_0.entries.25]
text = [
  "E: Long ago...\\c\\n",
  "Our home planet was completely destroyed\\n",
  "by a supernova explosion.\\c\\n",
  "Few of us remained.\\n",
  "We wandered the vast sea of space...$",
]

[msg.section_0.entries.26]
text = [
  "[VAR TRNAME(1)]: ...$",
]

[msg.section_0.entries.27]
text = [
  "E: In our long time wandering, we\\n",
  "fortunately came upon this planet.\\c\\n",
  "It meets all the requirements to be\\n",
  "our new home.\\c\\n",
  "Except for a small problem...$",
]

[msg.section_0.entries.28]
text = [
  "[VAR TRNAME(1)]: Problem?$",
]

[msg.section_0.entries.29]
text = [
  "E: Humans and Pokémon!\\n",
  "This planet is at maximum capacity already!\\c\\n",
  "Therefore, in order for us to live here,\\n",
  "what is necessary is to eliminate all\\l\\n",
  "humans and Pokémon. Simple?\\c\\n",
  "Simple.$",
]

[msg.section_0.entries.30]
text = [
  "[VAR TRNAME(1)]: That sounds awfully like\\n",
  "you think you can just invade this planet...$",
]

[msg.section_0.entries.31]
text = [
  "E: ...Invade?\\n",
  "Humans and Pokémon will be eliminated.\\c\\n",
  "We aliens, who are superior life-forms,\\n",
  "will live here.\\l\\n",
  "What's wrong with that?$",
]

[msg.section_0.entries.32]
text = [
  "[VAR TRNAME(1)]: Oh, I get you all right...$",
]

[msg.section_0.entries.33]
text = [
  "E: If you understand, then there's no need\\n",
  "for you to continue living any longer.$",
]

[msg.section_0.entries.34]
text = [
  "[VAR TRNAME(1)]: You're making a mistake!$",
]

[msg.section_0.entries.35]
text = [
  "E: Say whatever you want...\\c\\n",
  "It doesn't matter, because this planet\\n",
  "will be remade into an alien paradise...$",
]

[msg.section_0.entries.36]
text = [
  "[VAR TRNAME(1)]: No! There's another way!$",
]

[msg.section_0.entries.37]
text = [
  "E: It's fine to talk about ideals.\\c\\n",
  "But can foolish lesser beings like you\\n",
  "realize your ideals?$",
]

[msg.section_0.entries.38]
text = [
  "[VAR TRNAME(1)]: We humans are awesome!$",
]

[msg.section_0.entries.39]
text = [
  "E: Uh-huh...\\n",
  "If you're right about that, then show me.\\c\\n",
  "Show me now.\\n",
  "The winner gets to live on this planet...$",
]

[msg.section_0.entries.40]
text = [
  "[VAR TRNAME(1)]: It's over, E.$",
]

[msg.section_0.entries.41]
text = [
  "E: ...$",
]

[msg.section_0.entries.42]
text = [
  "[VAR TRNAME(1)]: What's happening?\\n",
  "The sky is...shaking!$",
]

[msg.section_0.entries.43]
text = [
  "E: The UFO's defeat made the mothership\\n",
  "decide that this planet is dangerous...\\c\\n",
  "We're condemned to more\\n",
  "homeless wandering in space...$",
]

[msg.section_0.entries.44]
text = [
  "[VAR TRNAME(1)]: Hey, E.\\c\\n",
  "As you said, this planet is already inhabited\\n",
  "by a lot of human beings and Pokémon...\\c\\n",
  "But there's the likelihood that new\\n",
  "life-forms will be born in the future, too...$",
]

[msg.section_0.entries.45]
text = [
  "E: So what?$",
]

[msg.section_0.entries.46]
text = [
  "[VAR TRNAME(1)]: So...this.\\c\\n",
  "We don't object to having you aliens, new to\\n",
  "this planet, join us and live here together.\\c\\n",
  "But we do object to your going elsewhere\\n",
  "and eliminating other life-forms and\\l\\n",
  "taking over their planet for yourselves.$",
]

[msg.section_0.entries.47]
text = [
  "E: Well, what are you going to do about it?$",
]

[msg.section_0.entries.48]
text = [
  "[VAR TRNAME(1)]: Humans, Pokémon, and aliens--\\n",
  "Why don't we find a way to all live together?$",
]

[msg.section_0.entries.49]
text = [
  "E: I hear you...\\n",
  "But your proposal is too late.\\c\\n",
  "We have to leave this planet\\n",
  "with the mothership...$",
]

[msg.section_0.entries.50]
text = [
  "[VAR TRNAME(1)]: Seriously?$",
]

[msg.section_0.entries.51]
text = [
  "E: We challenged you to battle and lost.\\n",
  "We have no regrets.\\c\\n",
  "[VAR TRNAME(1)], your proposal is interesting.\\c\\n",
  "It will be something to think about during\\n",
  "our journey, which will soon begin again...$",
]

[msg.section_0.entries.52]
text = [
  "[VAR TRNAME(1)]: E...$",
]

[msg.section_0.entries.53]
text = [
  "The battle for humanity's future was over.\\c\\n",
  "All UFOs and aliens returned to the\\n",
  "mothership and left the planet.\\c\\n",
  "Rejoicing, everyone cheered and held hands.\\c\\n",
  "But one person among them all, [VAR TRNAME(1)],\\n",
  "stood gazing up at the starry sky...$",
]

[msg.section_0.entries.54]
text = [
  "[VAR TRNAME(1)]: Oops...\\c\\n",
  "By any chance, was the Pokémon one\\n",
  "an alien had stolen from a citizen?$",
]

[msg.section_0.entries.55]
text = [
  "E: Yes.\\c\\n",
  "I was controlling it, but you--\\n",
  "you acted with great cruelty.$",
]

[msg.section_0.entries.56]
text = [
  "[VAR TRNAME(1)]: N-no! No!\\n",
  "I didn't mean to!$",
]

[msg.section_0.entries.57]
text = [
  "E: Aha!\\n",
  "Your emotions have taken hold of you!\\c\\n",
  "This is the moment I've been waiting for!\\n",
  "Your weakness is my chance to gain control\\l\\n",
  "of your heart with my psychic energy!$",
]

[msg.section_0.entries.58]
text = [
  "[VAR TRNAME(1)]: ...Argggggl!\\n",
  "Arrrrrgh! Stop it!$",
]

[msg.section_0.entries.59]
text = [
  "E: Too late!\\c\\n",
  "From now on, your consciousness\\n",
  "will be under my control.\\c\\n",
  "You'll still look like a human being,\\n",
  "but you'll work for us... Ha ha!$",
]

[msg.section_0.entries.60]
text = [
  "The battle for humanity's future was over.\\c\\n",
  "Under alien control, [VAR TRNAME(1)] attacked\\n",
  "people one after another, until those who\\l\\n",
  "could challenge the UFOs were vanquished\\l\\n",
  "and human beings and Pokémon were\\l\\n",
  "wiped from the face of the planet.$",
]

[msg.section_0.entries.61]
text = [
  "[VAR TRNAME(1)]: Ugh... Wha...?\\c\\n",
  "Suddenly...my body...\\n",
  "So numb...$",
]

[msg.section_0.entries.62]
text = [
  "E: How are you, [VAR TRNAME(1)]?\\n",
  "Can't you fight anymore?$",
]

[msg.section_0.entries.63]
text = [
  "[VAR TRNAME(1)]: Ugh...\\c\\n",
  "My eyes...\\n",
  "Everything is going blank...$",
]

[msg.section_0.entries.64]
text = [
  "E: ...[VAR TRNAME(1)].\\n",
  "Are you having trouble moving?$",
]

[msg.section_0.entries.65]
text = [
  "[VAR TRNAME(1)]: Aurrrgggl...$",
]

[msg.section_0.entries.66]
text = [
  "E: [VAR TRNAME(1)].\\c\\n",
  "You're quite a superb specimen of a\\n",
  "human being...\\c\\n",
  "It's a shame to eliminate you along with\\n",
  "the other humans and Pokémon...$",
]

[msg.section_0.entries.67]
text = [
  "[VAR TRNAME(1)]: Auuggh...\\n",
  "Wha...?$",
]

[msg.section_0.entries.68]
text = [
  "E: So I'll make you my subordinate...$",
]

[msg.section_0.entries.69]
text = [
  "[VAR TRNAME(1)]: Huh?\\c\\n",
  "Aughh...\\c\\n",
  "I...refuse...\\n",
  "I will not...be...your subordinate...$",
]

[msg.section_0.entries.70]
text = [
  "E: Ha. That's what I thought you'd say.\\c\\n",
  "Luckily, I'm not concerned about how you\\n",
  "feel or what you think.\\c\\n",
  "Your heart is exhausted from battling.\\n",
  "I'll just take it over with my\\l\\n",
  "psychic energy...$",
]

[msg.section_0.entries.71]
text = [
  "[VAR TRNAME(1)]: Augghhh...\\c\\n",
  "Argh!\\n",
  "...\\l\\n",
  "I...can't...$",
]

[msg.section_0.entries.72]
text = [
  "E: Now--sleep.\\c\\n",
  "When you wake, you'll be my subordinate...$",
]

[msg.section_0.entries.73]
text = [
  "[VAR TRNAME(1)]: ...$",
]

[msg.section_0.entries.74]
text = [
  "E: Have you fallen asleep yet?\\c\\n",
  "Awww, [VAR TRNAME(1)].\\n",
  "You'll be the last--and only--human\\l\\n",
  "in the world...$",
]

[msg.section_0.entries.75]
text = [
  "The battle for humanity's future had\\n",
  "reached its ultimate conclusion.\\c\\n",
  "All humans and Pokémon, defeated\\n",
  "by the aliens, were loaded into UFOs\\l\\n",
  "to perish in the cold distance of space...\\c\\n",
  "Leaving only one...\\n",
  "[VAR TRNAME(1)]--E's subordinate...$",
]

[msg.section_0.entries.76]
text = [
  "[VAR TRNAME(1)]: Pant... Pant...\\c\\n",
  "C-can't...move...anymore...$",
]

[msg.section_0.entries.77]
text = [
  "E: You're finished.$",
]

[msg.section_0.entries.78]
text = [
  "[VAR TRNAME(1)]: Urgh...\\c\\n",
  "What are you going to do with\\n",
  "the Pokémon and the human beings?$",
]

[msg.section_0.entries.79]
text = [
  "E: I'll capture them all, load them into\\n",
  "UFOs, and send them into space...\\c\\n",
  "They'll be the ones wandering hopelessly\\n",
  "through space instead of us.$",
]

[msg.section_0.entries.80]
text = [
  "E: Leaving this planet to be remade\\n",
  "into an alien paradise!$",
]

[msg.section_0.entries.81]
text = [
  "[VAR TRNAME(1)]: Aaaugh!$",
]

[msg.section_0.entries.82]
text = [
  "It was the end of the line. The battle for\\n",
  "the future of humanity was complete.\\c\\n",
  "All humans and Pokémon, defeated\\n",
  "by the aliens, were loaded into UFOs\\l\\n",
  "to wander the vastness of space...\\c\\n",
  "And the world once inhabited by humans\\n",
  "and Pokémon became an alien paradise...$",
]

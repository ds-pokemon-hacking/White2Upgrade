[msg.section_0.entries.0]
text = [
  "[CENTER]A sea breeze wafts over the pier\\n",
  "[CENTER]where a giant cruise ship is docked.$",
]

[msg.section_0.entries.1]
text = [
  "[CENTER]Passengers hurry on board\\n",
  "[CENTER]in the shining moonlight.$",
]

[msg.section_0.entries.2]
text = [
  "[CENTER]A threatening shadow hides in the crowd.\\n",
  "\\n",
  "[CENTER]The stage is set for trouble...$",
]

[msg.section_0.entries.3]
text = [
  "[CENTER]However!\\n",
  "\\n",
  "[CENTER]It's darkest just before the dawn!\\n",
  "\\n",
  "[CENTER]A hero has appeared!$",
]

[msg.section_0.entries.4]
text = [
  "[CENTER]And that hero's name is...\\n",
  "\\n",
  "[CENTER]The [VAR PKNICK(0)] Kid!$",
]


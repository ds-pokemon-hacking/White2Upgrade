[msg.section_0.entries.0]
text = [
  "Suit Actor$",
]

[msg.section_0.entries.1]
text = [
  "Battleship$",
]

[msg.section_0.entries.2]
text = [
  "Brycen-Man: Mwahaha!\\c\\n",
  "Behold the power of the Brycen Cannon!$",
]

[msg.section_0.entries.3]
text = [
  "Brycen-Man: Mwahaha!\\c\\n",
  "With my brain and this Brycen Cannon,\\n",
  "the world will be easily...$",
]

[msg.section_0.entries.4]
text = [
  "Brycen-Man: Not yet...\\n",
  "You cannot defeat me\\l\\n",
  "like that.$",
]

[msg.section_0.entries.5]
text = [
  "Brycen-Man: Arrgh...\\n",
  "I had no idea it'd turn out this way...$",
]

[msg.section_0.entries.6]
text = [
  "Brycen-Man: Arg... My body...$",
]

[msg.section_0.entries.7]
text = [
  "Brycen-Man: I can't move my body right...$",
]

[msg.section_0.entries.8]
text = [
  "Brycen-Man: Is this the end of me?$",
]

[msg.section_0.entries.9]
text = [
  "Brycen-Man: Pant pant...$",
]

[msg.section_0.entries.10]
text = [
  "The [VAR PKNICK(0)] Kid: What is this...\\n",
  "A gigantic machine...?\\c\\n",
  "And, Brycen-Man, did you just come out\\n",
  "of a machine that's attached to the\\l\\n",
  "gigantic machine?$",
]

[msg.section_0.entries.11]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "Be amazed! This is a battleship\\l\\n",
  "I developed myself!\\c\\n",
  "I call it the Brycen Jet!\\c\\n",
  "The machine attached to it is called the\\n",
  "Brycen Cannon!\\l\\n",
  "I used the black diamond I stole from\\l\\n",
  "the luxury liner to make the cannon\\l\\n",
  "really powerful!\\l\\n",
  "You may call it the awesome Brycen Cannon!$",
]

[msg.section_0.entries.12]
text = [
  "The [VAR PKNICK(0)] Kid: ...\\n",
  "Brycen Cannon...?\\c\\n",
  "So you actually swam to catch up with\\n",
  "that luxury liner, snuck in, and\\l\\n",
  "stole the black diamond...?\\c\\n",
  "I can't keep up with you...$",
]

[msg.section_0.entries.13]
text = [
  "Brycen-Man: This Brycen Cannon\\n",
  "can infuse anything with powerful energy\\l\\n",
  "and launch it!\\l\\n",
  "It is a super, high-performance machine!\\c\\n",
  "That's not all!\\n",
  "The black diamond multiplies\\l\\n",
  "the ability of the projectile, too!$",
]

[msg.section_0.entries.14]
text = [
  "The [VAR PKNICK(0)] Kid: You had to make\\n",
  "something so insane...$",
]

[msg.section_0.entries.15]
text = [
  "Brycen-Man: Mwahaha!\\c\\n",
  "Prepare to be finished!\\n",
  "[VAR PKNICK(0)] Kid!$",
]

[msg.section_0.entries.16]
text = [
  "The [VAR PKNICK(0)] Kid: I'll win easily!$",
]

[msg.section_0.entries.17]
text = [
  "Brycen-Man: Mwahaha!\\c\\n",
  "How silly of you, [VAR PKNICK(0)] Kid!\\n",
  "My real power shall teach you a lesson!$",
]

[msg.section_0.entries.18]
text = [
  "The [VAR PKNICK(0)] Kid: Am I done for?$",
]

[msg.section_0.entries.19]
text = [
  "Brycen-Man: Mwahaha!\\c\\n",
  "You said it right, [VAR PKNICK(0)] Kid!\\n",
  "Go on and agonize to the point of despair!$",
]

[msg.section_0.entries.20]
text = [
  "The [VAR PKNICK(0)] Kid: I must do this!$",
]

[msg.section_0.entries.21]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "Well said! That's how my enemy should sound!$",
]

[msg.section_0.entries.22]
text = [
  "The [VAR PKNICK(0)] Kid: Better run...?$",
]

[msg.section_0.entries.23]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "Too late to run now! You can't get away!\\c\\n",
  "Today will be the day you disappear forever,\\n",
  "[VAR PKNICK(0)] Kid!$",
]

[msg.section_0.entries.24]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "Wonderful, Brycen Jet!\\l\\n",
  "Impressive, Brycen Cannon!$",
]

[msg.section_0.entries.25]
text = [
  "The [VAR PKNICK(0)] Kid: So powerful...\\c\\n",
  "Is this the result of\\n",
  "the black diamond...?$",
]

[msg.section_0.entries.26]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "I've been patiently longing for this day.\\c\\n",
  "All those days I've spent so that\\n",
  "I can defeat you are finally...\\c\\n",
  "Grrr!$",
]

[msg.section_0.entries.27]
text = [
  "The [VAR PKNICK(0)] Kid: ...?$",
]

[msg.section_0.entries.28]
text = [
  "Brycen-Man: Grr...\\n",
  "Cough cough...$",
]

[msg.section_0.entries.29]
text = [
  "The [VAR PKNICK(0)] Kid: ...?$",
]

[msg.section_0.entries.30]
text = [
  "Brycen-Man: Grr... Could this be?$",
]

[msg.section_0.entries.31]
text = [
  "The [VAR PKNICK(0)] Kid: Are you OK?$",
]

[msg.section_0.entries.32]
text = [
  "Brycen-Man: Tsk... None of your business!\\n",
  "What are you waiting for? Bring it on!$",
]

[msg.section_0.entries.33]
text = [
  "The [VAR PKNICK(0)] Kid: Now's my chance.$",
]

[msg.section_0.entries.34]
text = [
  "Brycen-Man: Fat chance!\\n",
  "I am armed to the teeth!$",
]

[msg.section_0.entries.35]
text = [
  "The [VAR PKNICK(0)] Kid: Take this!$",
]

[msg.section_0.entries.36]
text = [
  "Brycen-Man: Mwahaha!\\c\\n",
  "I'll defeat you and\\n",
  "take the world!$",
]

[msg.section_0.entries.37]
text = [
  "The [VAR PKNICK(0)] Kid: ...$",
]

[msg.section_0.entries.38]
text = [
  "Brycen-Man: Tsk... Why hesitate?\\c\\n",
  "If you aren't in the mood,\\n",
  "I'll just have to make the first move!$",
]

[msg.section_0.entries.39]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "How did you like it, [VAR PKNICK(0)] Kid?\\c\\n",
  "Do you realize now how powerful\\n",
  "I am?$",
]

[msg.section_0.entries.40]
text = [
  "The [VAR PKNICK(0)] Kid: Arg...\\n",
  "I can't move...\\l\\n",
  "Neither can [VAR PKNICK(0)].$",
]

[msg.section_0.entries.41]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "[VAR PKNICK(0)] Kid!\\c\\n",
  "I have a small present for you\\n",
  "to thank you for what you did...$",
]

[msg.section_0.entries.42]
text = [
  "The [VAR PKNICK(0)] Kid: Huh?$",
]

[msg.section_0.entries.43]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "I'll use the Brycen Cannon\\l\\n",
  "to blast you into the air!$",
]

[msg.section_0.entries.44]
text = [
  "The [VAR PKNICK(0)] Kid: What?\\n",
  "Wait, wait, please don't do that!$",
]

[msg.section_0.entries.45]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "Become a star in the night sky\\l\\n",
  "and twinkle for me!\\c\\n",
  "Brycen Cannon, fire!$",
]

[msg.section_0.entries.46]
text = [
  "The [VAR PKNICK(0)] Kid: Yeeeeeek!$",
]

[msg.section_0.entries.47]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "Good-bye, [VAR PKNICK(0)] Kid!$",
]

[msg.section_0.entries.48]
text = [
  "The [VAR PKNICK(0)] Kid was blasted to\\n",
  "the far end of the sky by Brycen-Man's\\l\\n",
  "secret weapon, the Brycen Cannon.\\c\\n",
  "They say now that you can see a big star\\n",
  "in the direction he disappeared...\\c\\n",
  "Good-bye, [VAR PKNICK(0)] Kid!\\c\\n",
  "Thank you, [VAR PKNICK(0)] Kid!\\c$",
]

[msg.section_0.entries.49]
text = [
  "Brycen-Man: Gasp gasp...$",
]

[msg.section_0.entries.50]
text = [
  "The [VAR PKNICK(0)] Kid: Brycen-Man!$",
]

[msg.section_0.entries.51]
text = [
  "Brycen-Man: Arrgh...$",
]

[msg.section_0.entries.52]
text = [
  "The [VAR PKNICK(0)] Kid: We should call it a day,\\n",
  "Brycen-Man...$",
]

[msg.section_0.entries.53]
text = [
  "Brycen-Man: So this is how my ambition\\n",
  "ends... Hahaha!\\c\\n",
  "[VAR PKNICK(0)] Kid,\\n",
  "finish me now...$",
]

[msg.section_0.entries.54]
text = [
  "The [VAR PKNICK(0)] Kid: No...\\n",
  "I cannot do such a horrible thing to you...$",
]

[msg.section_0.entries.55]
text = [
  "Brycen-Man: What did you say?\\c\\n",
  "How dare you...pity me?$",
]

[msg.section_0.entries.56]
text = [
  "The [VAR PKNICK(0)] Kid: That's not it...\\c\\n",
  "I've realized something\\n",
  "through all these battles with you...\\c\\n",
  "You may be a horrible, dark\\n",
  "Masked Man...\\c\\n",
  "But behind that mask,\\n",
  "you are truly a cool Pokémon Trainer!$",
]

[msg.section_0.entries.57]
text = [
  "Brycen-Man: [VAR PKNICK(0)] Kid...$",
]

[msg.section_0.entries.58]
text = [
  "The [VAR PKNICK(0)] Kid: You are too cool,\\n",
  "and I would miss you...\\c\\n",
  "That's why...$",
]

[msg.section_0.entries.59]
text = [
  "Brycen-Man: ...$",
]

[msg.section_0.entries.60]
text = [
  "The [VAR PKNICK(0)] Kid: Please...\\n",
  "Go home for now...\\c\\n",
  "And then...\\c\\n",
  "When you've recovered,\\n",
  "let us meet for another battle...$",
]

[msg.section_0.entries.61]
text = [
  "Brycen-Man: ...\\c\\n",
  "[VAR PKNICK(0)] Kid...\\n",
  "I shall remember what happened today.\\c\\n",
  "You'll be remembered, too.\\c\\n",
  "Someday, I will settle this for good...$",
]

[msg.section_0.entries.62]
text = [
  "The [VAR PKNICK(0)] Kid: Brycen-Man...$",
]

[msg.section_0.entries.63]
text = [
  "Brycen-Man: Just you wait\\n",
  "and see!\\l\\n",
  "Is that clear, [VAR PKNICK(0)] Kid?\\c\\n",
  "Let me call you my archrival!$",
]

[msg.section_0.entries.64]
text = [
  "Brycen-Man and the [VAR PKNICK(0)] Kid...\\c\\n",
  "The endless battle between them is\\n",
  "making them appreciate each other...\\c\\n",
  "The moon was shining upon the two\\n",
  "as they swore a rematch...\\c\\n",
  "Thank you, Brycen-Man!\\c\\n",
  "Thank you, [VAR PKNICK(0)] Kid!$",
]

[msg.section_0.entries.65]
text = [
  "Brycen-Man: Cough cough...$",
]

[msg.section_0.entries.66]
text = [
  "The [VAR PKNICK(0)] Kid: Brycen-Man!$",
]

[msg.section_0.entries.67]
text = [
  "Brycen-Man: Arrgh...\\c\\n",
  "So, my guess was right...\\c\\n",
  "The energy from the Brycen Cannon\\n",
  "is too powerful for a Masked Man to stand...$",
]

[msg.section_0.entries.68]
text = [
  "The [VAR PKNICK(0)] Kid: The battle is decided...\\n",
  "Please give it up, Brycen-Man...$",
]

[msg.section_0.entries.69]
text = [
  "Brycen-Man: Cough cough...\\n",
  "Arrgh... So this is it...$",
]

[msg.section_0.entries.70]
text = [
  "The [VAR PKNICK(0)] Kid: There...\\n",
  "Reach for my hand...$",
]

[msg.section_0.entries.71]
text = [
  "Brycen-Man: Shut your mouth!\\c\\n",
  "A Masked Man will never...arg...\\n",
  "let a hero help him. No way!\\c\\n",
  "Cough cough...$",
]

[msg.section_0.entries.72]
text = [
  "The [VAR PKNICK(0)] Kid: ...$",
]

[msg.section_0.entries.73]
text = [
  "Brycen-Man: Cough cough...\\c\\n",
  "A Masked Man has got to do\\n",
  "what a Masked Man has got to do...\\c\\n",
  "Watch me!$",
]

[msg.section_0.entries.74]
text = [
  "The [VAR PKNICK(0)] Kid: What will you do?$",
]

[msg.section_0.entries.75]
text = [
  "Brycen-Man: Brycen Jet!\\c\\n",
  "Aim the Brycen Cannon at me,\\n",
  "and fire when ready!$",
]

[msg.section_0.entries.76]
text = [
  "The [VAR PKNICK(0)] Kid: Nooo!\\n",
  "Please stop the Brycen Cannon!$",
]

[msg.section_0.entries.77]
text = [
  "Brycen-Man: Mwahaha!\\c\\n",
  "...I am Brycen-Man, the Masked Man\\n",
  "that wanders through reality and phantasm.\\c\\n",
  "Farewell, [VAR PKNICK(0)] Kid!\\n",
  "Mwa! Mwahaha!$",
]

[msg.section_0.entries.78]
text = [
  "The [VAR PKNICK(0)] Kid: Brycen-Man!$",
]

[msg.section_0.entries.79]
text = [
  "Brycen-Man realized his own defeat\\n",
  "and shot himself into the night sky...\\c\\n",
  "The Masked Man is gone...\\c\\n",
  "But the [VAR PKNICK(0)] Kid will never forget\\n",
  "the way he let out big belly laughs...\\c\\n",
  "Farewell, Brycen-Man!$",
]

[msg.section_0.entries.80]
text = [
  "Brycen-Man: Mwahaha!\\c\\n",
  "You use that move...and call yourself\\n",
  "a hero of justice?$",
]

[msg.section_0.entries.81]
text = [
  "The [VAR PKNICK(0)] Kid: Nothing's wrong!\\c\\n",
  "I stop at nothing\\n",
  "in the name of justice!$",
]

[msg.section_0.entries.82]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "Why do you sound so much like myself?\\c\\n",
  "You are too good to be left as a hero\\n",
  "of justice...\\c\\n",
  "Say, why don't you quit being a hero\\n",
  "and work for me?$",
]

[msg.section_0.entries.83]
text = [
  "The [VAR PKNICK(0)] Kid: Never!\\c\\n",
  "Why don't YOU quit being a Masked Man\\n",
  "and follow the path of justice\\l\\n",
  "with me?$",
]

[msg.section_0.entries.84]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "Impossible! That would never happen!\\c\\n",
  "I betrayed my friends and left my family\\n",
  "to walk the path of a Masked Man...\\c\\n",
  "I am a Masked Man for life!\\n",
  "Pursuing the darkest path is what I do!$",
]

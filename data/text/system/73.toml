[msg.section_0.entries.68]
text = [
  "When you are playing, press the X Button\\n",
  "to open the menu and save often.\\n",
  "\\n",
  "Once saved, you can select “CONTINUE\\\"\\n",
  "from the main menu to continue playing\\n",
  "the game from that location even if you've\\n",
  "turned off your Nintendo DS since.$",
]

[msg.section_0.entries.69]
text = [
  "To delete your saved data and\\n",
  "start a new game, go to the\\n",
  "title screen and press the\\n",
  "following buttons at the same time.\\n",
  "\\n",
  "UP + SELECT + B Button$",
]

[msg.section_0.entries.70]
text = [
  "You can receive special gifts at events and\\n",
  "other locations in the following three ways.\\n",
  "\\n",
  "-GET VIA WIRELESS\\n",
  "-GET VIA NINTENDO WFC\\n",
  "-GET VIA INFRARED\\n",
  "\\n",
  "Please note that each event has its own way\\n",
  "of distributing gifts.$",
]

[msg.section_0.entries.71]
text = [
  "When you receive a Wonder Card\\n",
  "for a special Pokémon or an item,\\n",
  "a deliveryman with a blue cap\\n",
  "will appear in the Pokémon Center.\\n",
  "\\n",
  "Please talk to him to receive\\n",
  "the Pokémon or item.$",
]

[msg.section_0.entries.72]
text = [
  "You can keep up to 12 Wonder Cards.\\n",
  "\\n",
  "To receive another Wonder Card\\n",
  "when you already have 12, go to\\n",
  "“CHECK THE CARD ALBUM\\\"\\n",
  "and delete one to make room\\n",
  "for a new Wonder Card.$",
]

[msg.section_0.entries.73]
text = [
  "You can participate in competitions\\n",
  "using Nintendo Wi-Fi Connection\\n",
  "and at events.\\n",
  "\\n",
  "For details on the Battle Competition,\\n",
  "go to “BATTLE COMPETITION\\\"\\n",
  "on the main menu and select\\n",
  "“Info.\\\"$",
]

[msg.section_0.entries.74]
text = [
  "For more details on Battle Competition,\\n",
  "including Battle Competition rules and\\n",
  "how to register as a user,\\n",
  "visit the following official websites.\\n",
  "Pokémon Global Link website\\n",
  "The Official Pokémon website$",
]

[msg.section_0.entries.75]
text = [
  "Pokémon in your Battle Box\\n",
  "can participate in Battle Competitions.\\n",
  "\\n",
  "Once registered, you cannot change\\n",
  "the Pokémon in your Battle Box\\n",
  "during the competition.\\n",
  "\\n",
  "Please carefully select the right Pokémon\\n",
  "before you start the competition.$",
]

[msg.section_0.entries.76]
text = [
  "To get Pokémon out of your Battle Box\\n",
  "after a Battle Competition, you need to\\n",
  "unregister or end the competition.\\n",
  "\\n",
  "For more details, visit the following\\n",
  "official websites.\\n",
  "Pokémon Global Link website\\n",
  "The Official Pokémon website$",
]

[msg.section_0.entries.77]
text = [
  "Once you have completed\\n",
  "the registration for Battle Competition,\\n",
  "you will be able to check your\\n",
  "Digital Player ID.\\n",
  "\\n",
  "For more details, please visit\\n",
  "the Pokémon Global Link.$",
]

[msg.section_0.entries.78]
text = [
  "Before adjusting Game Sync settings,\\n",
  "you must complete your\\n",
  "Nintendo Wi-Fi Connection settings.\\n",
  "\\n",
  "When these settings are done,\\n",
  "adjust the Game Sync settings\\n",
  "to have the Game Sync ID issued.\\n",
  "This is a unique ID assigned to you.$",
]

[msg.section_0.entries.79]
text = [
  "You must have a Game Sync ID\\n",
  "to register at the\\n",
  "Pokémon Global Link using\\n",
  "a computer with Internet access.$",
]

[msg.section_0.entries.80]
text = [
  "When you delete a saved game,\\n",
  "your Game Sync ID will also be lost.\\n",
  "\\n",
  "When you change your Game Sync ID,\\n",
  "you must also renew your registration\\n",
  "at the Pokémon Global Link.$",
]

[msg.section_0.entries.81]
text = [
  "You can set up your Nintendo DS or\\n",
  "Nintendo DS Lite system for\\n",
  "Nintendo Wi-Fi Connection.\\n",
  "\\n",
  "Once your Nintendo Wi-Fi Connection\\n",
  "settings are complete, you can trade\\n",
  "and battle with people all over the world\\n",
  "through the Internet.$",
]

[msg.section_0.entries.82]
text = [
  "You need to set up the Nintendo Wi-Fi\\n",
  "Connection settings to connect your game\\n",
  "with the Pokémon Global Link, which allows\\n",
  "Battle Competition, Game Sync settings,\\n",
  "and so on.$",
]

[msg.section_0.entries.83]
text = [
  "You can check to see\\n",
  "if your DS system's\\n",
  "microphone is functioning.\\n",
  "\\n",
  "The microphone is functioning properly\\n",
  "if Jigglypuff on the top screen\\n",
  "reacts when you talk\\n",
  "or blow into it.$",
]

[msg.section_0.entries.84]
text = [
  "You can restore your tired Pokémon and buy\\n",
  "useful items. You'll find the PC where you\\n",
  "can keep captured Pokémon.\\n",
  "\\n",
  "You can hear\\n",
  "Professor Juniper's evaluation\\n",
  "of your Pokédex.\\n",
  "\\n",
  "Visit 2F for Link Trade and Link Battle.$",
]

[msg.section_0.entries.85]
text = [
  "You can use the PC to store and organize\\n",
  "Pokémon.\\n",
  "\\n",
  "When you have six Pokémon in your party,\\n",
  "any Pokémon you catch will be sent to the PC.$",
]

[msg.section_0.entries.86]
text = [
  "You can move or relocate Pokémon stored\\n",
  "in the PC to a Box you like\\n",
  "using “MOVE POKÉMON.\\\"$",
]

[msg.section_0.entries.87]
text = [
  "First, tap a Pokémon you want to move.\\n",
  "Then tap “MOVE\\\"\\n",
  "to display Boxes on the right.\\n",
  "\\n",
  "Slide the stylus up or down on the gray arrow\\n",
  "and tap the Box where you want to store the\\n",
  "Pokémon to move the Pokémon to that Box.$",
]

[msg.section_0.entries.88]
text = [
  "Tap the blue button to switch to\\n",
  "the Relocate Mode.\\n",
  "\\n",
  "Select a Pokémon by tapping it, and slide it\\n",
  "to the place you want to relocate it to.$",
]

[msg.section_0.entries.89]
text = [
  "Tap the yellow button to switch to\\n",
  "the Group Move Mode.\\n",
  "\\n",
  "Tap on a Box to display a dotted square.\\n",
  "Surround multiple Pokémon with the dotted\\n",
  "square to move them all at once.$",
]

[msg.section_0.entries.90]
text = [
  "You can register up to six Pokémon\\n",
  "you use most often in battles.\\n",
  "\\n",
  "For a Link Battle, you can choose to battle\\n",
  "with either your party Pokémon or with\\n",
  "the Pokémon in the Battle Box.\\n",
  "\\n",
  "If your Battle Box is empty,\\n",
  "you always battle with your party Pokémon.$",
]

[msg.section_0.entries.91]
text = [
  "There are four ways to offer a Link Trade.\\n",
  "\\n",
  "-Through an IR Connection\\n",
  "-Through the Union Room\\n",
  "-Through the Wi-Fi Club\\n",
  "-Through the Global Terminal$",
]

[msg.section_0.entries.92]
text = [
  "-Through an IR Connection\\n",
  "\\n",
  "If your friends are nearby, IR Connection is\\n",
  "a quick way to trade.\\n",
  "\\n",
  "Select IR from your C-Gear and select Trade.$",
]

[msg.section_0.entries.93]
text = [
  "-Through the Union Room\\n",
  "\\n",
  "When you are playing with lots of friends,\\n",
  "you can use the Union Room for trades.\\n",
  "\\n",
  "The Union Room is in Pokémon Center 2F.$",
]

[msg.section_0.entries.94]
text = [
  "-Through the Wi-Fi Club\\n",
  "\\n",
  "When your friends are far away,\\n",
  "you can trade through the Wi-Fi Club.\\n",
  "\\n",
  "You must have exchanged your Friend Codes\\n",
  "ahead of time to use the Wi-Fi Club.$",
]

[msg.section_0.entries.95]
text = [
  "-Through the Global Terminal\\n",
  "\\n",
  "Using the Global Terminal, you can trade\\n",
  "Pokémon with people all over the world.\\n",
  "\\n",
  "When the trade conditions are met,\\n",
  "your Pokémon are traded automatically.$",
]

[msg.section_0.entries.96]
text = [
  "There are four ways to offer a Link Battle.\\n",
  "\\n",
  "-Through an IR Connection\\n",
  "-Through the Union Room\\n",
  "-Through the Wi-Fi Club\\n",
  "-Through the Global Terminal$",
]

[msg.section_0.entries.97]
text = [
  "-Through an IR Connection\\n",
  "If your friends are nearby, an IR Connection\\n",
  "is a quick way to battle.\\n",
  "\\n",
  "Select IR from your C-Gear and select Battle\\n",
  "for a Level 50 Flat Battle with the\\n",
  "Wonder Launcher.$",
]

[msg.section_0.entries.98]
text = [
  "-Through the Union Room\\n",
  "\\n",
  "When you are playing with lots of friends,\\n",
  "you can go to the Union Room for battles.\\n",
  "\\n",
  "The Union Room is located in Pokémon\\n",
  "Center 2F.$",
]

[msg.section_0.entries.99]
text = [
  "-Through the Wi-Fi Club\\n",
  "\\n",
  "When your friends are far away, you can\\n",
  "battle using the Wi-Fi Club.\\n",
  "\\n",
  "You must have exchanged your Friend Codes\\n",
  "ahead of time to use the Wi-Fi Club.$",
]

[msg.section_0.entries.100]
text = [
  "-Through the Global Terminal\\n",
  "Using the Global Terminal, you can battle with\\n",
  "people all over the world using various rules\\n",
  "to hone your skills.\\n",
  "\\n",
  "The Global Terminal is located in Pokémon\\n",
  "Center 2F.$",
]

[msg.section_0.entries.101]
text = [
  "A battle where each Trainer chooses one\\n",
  "Pokémon to fight is called Single Battle.\\n",
  "\\n",
  "Including Single Battle, there are four kinds\\n",
  "of battles.\\n",
  "\\n",
  "You can always press the A Button\\n",
  "while holding down the L Button to\\n",
  "read move information when choosing a move.$",
]

[msg.section_0.entries.102]
text = [
  "Having a battle with two Pokémon from each\\n",
  "Trainer is called Double Battle.$",
]

[msg.section_0.entries.103]
text = [
  "A battle with three Pokémon from each\\n",
  "Trainer is called Triple Battle.\\n",
  "\\n",
  "In a Triple Battle challenge, Pokémon cannot\\n",
  "attack others if they are too far away.\\n",
  "\\n",
  "The one in the middle position can attack\\n",
  "any of the other Trainer's Pokémon.$",
]

[msg.section_0.entries.104]
text = [
  "Some moves can reach Pokémon\\n",
  "even when they are far away.\\n",
  "\\n",
  "You can switch Pokémon locations\\n",
  "during battle.\\n",
  "\\n",
  "You can select “SHIFT\\\" while selecting\\n",
  "a move and the right or left Pokémon will\\n",
  "switch places with the middle Pokémon.$",
]

[msg.section_0.entries.105]
text = [
  "Rotation Battle is a new and evolved\\n",
  "style of Single Battle.\\n",
  "\\n",
  "You'll need three of your Pokémon\\n",
  "for Rotation Battle.\\n",
  "\\n",
  "Only one Pokémon can act every turn,\\n",
  "but you choose which one takes action.$",
]

[msg.section_0.entries.106]
text = [
  "If you want to move a Pokémon to the front,\\n",
  "select the Rotation icon while selecting\\n",
  "a move.\\n",
  "\\n",
  "The Pokémon will rotate to the front and\\n",
  "will use its selected move in the same turn.$",
]

[msg.section_0.entries.107]
text = [
  "When you select Wonder Launcher “ON,\\\"\\n",
  "you and the other Trainer can use items\\n",
  "during a Link Battle.\\n",
  "\\n",
  "Each item has points needed to launch.\\n",
  "You'll gain points in battle.\\n",
  "\\n",
  "You choose whether to use items immediately\\n",
  "or collect points for powerful items.$",
]

[msg.section_0.entries.108]
text = [
  "In the Union Room, you can trade and\\n",
  "battle with people nearby.\\n",
  "\\n",
  "Go to Pokémon Center 2F and enter\\n",
  "the room to your left. Press the A Button\\n",
  "to talk to anyone there.\\n",
  "\\n",
  "For more information, talk to the lady\\n",
  "at the far left in the Union Room.$",
]

[msg.section_0.entries.109]
text = [
  "At the Wi-Fi Club in Pokémon Center 2F,\\n",
  "you can make Link Trades, fight Link Battles,\\n",
  "and use Voice Chat or the Xtransceiver with\\n",
  "people you've registered on your Pal Pad.\\n",
  "\\n",
  "Refer to the “FRIEND CODE\\\" section\\n",
  "of this guide to learn how to register\\n",
  "your friends.$",
]

[msg.section_0.entries.110]
text = [
  "Once in the room, press the A Button\\n",
  "near the friend you want to link to.\\n",
  "\\n",
  "Your friends who have decided what to do\\n",
  "will be jumping up and down while waiting.\\n",
  "\\n",
  "When you've decided what you want to do,\\n",
  "press the A Button near the monitor\\n",
  "at the far end of the room.$",
]

[msg.section_0.entries.111]
text = [
  "You can talk to your friends with Voice Chat.\\n",
  "It works like a telephone.\\n",
  "\\n",
  "Press the X Button in the room to indicate\\n",
  "whether you want to use Voice Chat or not.$",
]

[msg.section_0.entries.112]
text = [
  "At the Global Terminal, you can set up\\n",
  "Link Trades and you can Link Battle with\\n",
  "people all around the world.\\n",
  "\\n",
  "Go to the right counter in Pokémon Center 2F.$",
]

[msg.section_0.entries.113]
text = [
  "This personal number is issued when you\\n",
  "establish a Nintendo Wi-Fi Connection.\\n",
  "\\n",
  "If you exchange Friend Codes, you can battle\\n",
  "and trade with friends far away.\\n",
  "\\n",
  "Please check the Pal Pad in the Key Items\\n",
  "in your Bag for your own Friend Code.$",
]

[msg.section_0.entries.114]
text = [
  "You can register a Friend Code in two\\n",
  "different ways.\\n",
  "\\n",
  "- Use the Pal Pad in the Key Items in your\\n",
  "   Bag to enter your friend's Friend Code\\n",
  "- Use an Infrared Connection from your\\n",
  "   C-Gear$",
]

[msg.section_0.entries.115]
text = [
  "The C-Gear is a multifunctional device\\n",
  "that lets you use the Entralink,\\n",
  "the Xtransceiver, and Game Sync.\\n",
  "\\n",
  "Your C-Gear can also help you Link Trade\\n",
  "and Link Battle with people nearby.\\n",
  "\\n",
  "Tap the power icon in the bottom-right corner\\n",
  "of your C-Gear to turn it on or off.$",
]

[msg.section_0.entries.116]
text = [
  "When your C-Gear is turned on, your\\n",
  "DS system's wireless communications\\n",
  "are always on.\\n",
  "\\n",
  "Turn your C-Gear off in places where\\n",
  "wireless communications are prohibited,\\n",
  "such as airplanes and hospitals.$",
]

[msg.section_0.entries.117]
text = [
  "Tap the wrench icon in the bottom-right\\n",
  "corner of the C-Gear to customize it.\\n",
  "\\n",
  "Tap on a frame to change the color\\n",
  "or slide a blinking button to move it\\n",
  "to a place you like.\\n",
  "\\n",
  "Tap the “?\\\" icon for help with your C-Gear.$",
]

[msg.section_0.entries.118]
text = [
  "The rectangular icon in the center of your\\n",
  "C-Gear is for the Tag Log. Tap it to see\\n",
  "people who are using their C-Gear around you.\\n",
  "\\n",
  "You can see their profiles, tell what they\\n",
  "are doing in the game, and exchange messages.\\n",
  "\\n",
  "Also, when a Funfest Mission starts,\\n",
  "it blinks to let you know.$",
]

[msg.section_0.entries.119]
text = [
  "When you see other players who have their\\n",
  "C-Gear on, you can select them to see their\\n",
  "play time, location in the game,\\n",
  "rank in Passerby Analytics, and more.$",
]

[msg.section_0.entries.120]
text = [
  "Tap the triangle icon at the bottom of\\n",
  "the Tag Log screen to use\\n",
  "a Pass Power received from your Entree.\\n",
  "\\n",
  "To receive a Pass Power, check\\n",
  "the Entree in the Entralink.$",
]

[msg.section_0.entries.121]
text = [
  "Tap the speech-bubble icon to send messages\\n",
  "to another player with his or her C-Gear\\n",
  "turned on.\\n",
  "\\n",
  "Never send offensive messages or messages\\n",
  "that contain personal information such as\\n",
  "names and telephone numbers.$",
]

[msg.section_0.entries.122]
text = [
  "Tap the smile icon and you can send\\n",
  "a thank-you message.\\n",
  "\\n",
  "Tap the icon and then select whom to thank.$",
]

[msg.section_0.entries.123]
text = [
  "Tap the Medal icon to see the number of\\n",
  "Medals that the other Trainer received\\n",
  "and the Favorite Medal he or she registered.$",
]

[msg.section_0.entries.124]
text = [
  "A Passerby Survey can tell you\\n",
  "how many people around you\\n",
  "like certain hobbies, for example.$",
]

[msg.section_0.entries.125]
text = [
  "You can accept Passerby Survey requests\\n",
  "at the Passerby Analytics HQ in Castelia City.$",
]

[msg.section_0.entries.126]
text = [
  "When the leader asks you to take a survey,\\n",
  "tap the pie-chart icon in the bottom-left\\n",
  "corner of your C-Gear to decide which survey\\n",
  "to run.\\n",
  "\\n",
  "The survey you are running will be marked\\n",
  "in your list.$",
]

[msg.section_0.entries.127]
text = [
  "Once you've decided which survey to run,\\n",
  "just turn your C-Gear on.\\n",
  "\\n",
  "The survey will take place automatically\\n",
  "as people pass by you.\\n",
  "\\n",
  "The survey will continue even when your\\n",
  "DS system is closed or when you are playing\\n",
  "the game.$",
]

[msg.section_0.entries.128]
text = [
  "Before you report to the leader in Castelia\\n",
  "City, check the results using “CHECK SURVEY\\n",
  "RESULTS\\\" in your C-Gear.\\n",
  "\\n",
  "Once you know that the survey is complete,\\n",
  "go to Passerby Analytics HQ in Castelia City\\n",
  "to report to your leader.$",
]

[msg.section_0.entries.129]
text = [
  "When you tap the framed “INFRARED\\\" icon\\n",
  "on your C-Gear, you can enjoy Link Trade and\\n",
  "Link Battle with people nearby.\\n",
  "\\n",
  "You can also exchange Friend Codes and check\\n",
  "how close you are to someone else.$",
]

[msg.section_0.entries.130]
text = [
  "Select the same item and let your and your\\n",
  "friend's DS systems face each other to start\\n",
  "the connection.\\n",
  "\\n",
  "Once they are connected, your DS systems\\n",
  "no longer need to face each other.$",
]

[msg.section_0.entries.131]
text = [
  "When you tap the framed\\n",
  "“ONLINE\\\" icon on your C-Gear,\\n",
  "the Game Sync option will appear.\\n",
  "\\n",
  "Game Sync is a system to make a Pokémon in\\n",
  "the PC fall asleep and to send the saved\\n",
  "data of Trainers.$",
]

[msg.section_0.entries.132]
text = [
  "The color of the “ONLINE\\\"\\n",
  "icon's frame on your C-Gear changes\\n",
  "depending on the situation.\\n",
  "\\n",
  "It is green when the\\n",
  "Nintendo Wi-Fi Connection settings\\n",
  "on the DS system are complete.$",
]

[msg.section_0.entries.133]
text = [
  "The frame of the “ONLINE\\\" icon will\\n",
  "be blue when you are somewhere with a\\n",
  "wireless access point that enables Nintendo\\n",
  "Wi-Fi Connection, such as a Nintendo Zone.$",
]

[msg.section_0.entries.134]
text = [
  "When you are near wireless access points\\n",
  "but your Nintendo Wi-Fi Connection settings\\n",
  "are not complete, the frame of the\\n",
  "“ONLINE\\\" icon will be red.$",
]

[msg.section_0.entries.135]
text = [
  "The saved data sent through Game Sync\\n",
  "goes to the Pokémon Dream World.\\n",
  "\\n",
  "The Pokémon Dream World is located\\n",
  "on the official Pokémon Global Link website.$",
]

[msg.section_0.entries.136]
text = [
  "To play in the Pokémon Dream World,\\n",
  "you must set up the following items:\\n",
  "\\n",
  "-Nintendo Wi-Fi Connection settings\\n",
  "-Game Sync settings\\n",
  "-User registration with your own computer\\n",
  "  at the official website for\\n",
  "  the Pokémon Global Link$",
]

[msg.section_0.entries.137]
text = [
  "You can go to the center of the Unova\\n",
  "region, called the Entralink, by tapping the\\n",
  "framed “WIRELESS\\\" icon\\n",
  "on your C-Gear.\\n",
  "\\n",
  "In the center of the Entralink is a tree\\n",
  "called the Entree.$",
]

[msg.section_0.entries.138]
text = [
  "Face the Entree and press the A Button\\n",
  "to accept a Funfest Mission.\\n",
  "\\n",
  "Missions have different objectives.\\n",
  "For example, look for items or have Pokémon\\n",
  "battles within the time limit.$",
]

[msg.section_0.entries.139]
text = [
  "Points can be scored during missions.\\n",
  "Clear the target score to accomplish\\n",
  "the objective stated in each\\n",
  "mission description.\\n",
  "\\n",
  "The higher the score is,\\n",
  "the bigger the reward you receive\\n",
  "when you accomplish the mission.$",
]

[msg.section_0.entries.140]
text = [
  "You can play Funfest Missions\\n",
  "with people near you.\\n",
  "\\n",
  "When someone starts a Funfest Mission,\\n",
  "the Tag Log starts blinking.\\n",
  "Tap it to participate in a Funfest Mission\\n",
  "you would like to join.$",
]

[msg.section_0.entries.141]
text = [
  "A Pass Power is a mysterious power you\\n",
  "receive from the Entree in the Entralink.\\n",
  "\\n",
  "Pass Powers have various effects.\\n",
  "Some can increase Exp. Points, some can\\n",
  "increase the chance to catch Pokémon,\\n",
  "and so on. You can receive up to three\\n",
  "Pass Powers at once.$",
]

[msg.section_0.entries.142]
text = [
  "To use a Pass Power, tap\\n",
  "“Tag Log\\\" (in the center of\\n",
  "your C-Gear) while outside of\\n",
  "the Entralink and another screen will\\n",
  "appear. Tap the triangle icon on the screen.\\n",
  "\\n",
  "To use a Pass Power, you need a certain\\n",
  "number of Pass Orbs.$",
]

[msg.section_0.entries.143]
text = [
  "As the Entree grows and levels up,\\n",
  "you can receive new Pass Powers.\\n",
  "\\n",
  "To level up the Entree,\\n",
  "accept Funfest Missions\\n",
  "and get high scores.$",
]

[msg.section_0.entries.144]
text = [
  "You need to have a certain number\\n",
  "of Pass Orbs to use your Pass Power.\\n",
  "\\n",
  "You can obtain Pass Orbs by going to the\\n",
  "Entree and participating in Funfest Missions.$",
]

[msg.section_0.entries.145]
text = [
  "■ Bag function\\n",
  "Your Bag always sorts items by their types.\\n",
  "\\n",
  "Items in the Key Items Case\\n",
  "have checkboxes next to them.\\n",
  "\\n",
  "Check the box to set up the item\\n",
  "to use it by pressing the Y Button,\\n",
  "without having to open your Bag.$",
]

[msg.section_0.entries.146]
text = [
  "Pressing the green icon on the Touch Screen\\n",
  "or choosing one of the sort options displayed\\n",
  "by pressing START sorts items in the Case.\\n",
  "\\n",
  "Pressing SELECT allows you to change\\n",
  "the order of items in a Case freely.\\n",
  "You can switch between\\n",
  "pages with the L Button or R Button.$",
]

[msg.section_0.entries.147]
text = [
  "Your Bag has a “Free Space.\\\"\\n",
  "\\n",
  "First, choose an item in a Case.\\n",
  "Next, select “Put in Free Space”\\n",
  "to move the item to the Free Space.$",
]

[msg.section_0.entries.148]
text = [
  "■ Item types\\n",
  "-ITEMS\\n",
  "Pokémon can hold some items to raise their\\n",
  "stats or move power. Those items are marked.\\n",
  "\\n",
  "Try letting your Pokémon hold these items\\n",
  "to see what effects they have.$",
]

[msg.section_0.entries.149]
text = [
  "There are some items you can use\\n",
  "only in a battle to raise Pokémon stats or\\n",
  "moves powers.\\n",
  "\\n",
  "Some items may last for a limited time.\\n",
  "Some last until the Pokémon switches out.$",
]

[msg.section_0.entries.150]
text = [
  "The Poké Balls you need to catch Pokémon\\n",
  "are kept in the ITEMS Case, as are items\\n",
  "related to Pokémon evolution.\\n",
  "\\n",
  "You can combine phrases and words\\n",
  "to form Mail. Your Pokémon can hold Mail,\\n",
  "and if you trade the Pokémon with\\n",
  "your friends, they can deliver your Mail.$",
]

[msg.section_0.entries.151]
text = [
  "-MEDICINE\\n",
  "This area holds items that restore\\n",
  "your Pokémon's HP and PP and heal\\n",
  "status conditions.\\n",
  "\\n",
  "-TMs & HMs\\n",
  "This area holds your TMs & HMs.\\n",
  "They can be reused as often as you like.$",
]

[msg.section_0.entries.152]
text = [
  "-BERRIES\\n",
  "This holds Berries that create special\\n",
  "effects when your Pokémon hold them\\n",
  "or use them.\\n",
  "\\n",
  "-KEY ITEMS\\n",
  "This is a place to keep Key Items. You can\\n",
  "assign some of them to the Ready button\\n",
  "for instant use.$",
]

[msg.section_0.entries.153]
text = [
  "Open the menu using the X Button, then\\n",
  "select your name to check your Trainer Card.\\n",
  "\\n",
  "You can tap the icon in the bottom-left\\n",
  "corner of the Touch Screen to check\\n",
  "how many Gym Badges you have.$",
]

[msg.section_0.entries.154]
text = [
  "The Trainer Card displays your total\\n",
  "play time, prize money, and more.\\n",
  "Tap your title and characteristic to change\\n",
  "them, and select a new one you like.\\n",
  "\\n",
  "Tap the greeting column underneath\\n",
  "to edit your message. Fill in the boxes\\n",
  "to complete your message.$",
]

[msg.section_0.entries.155]
text = [
  "You can sign the back of your card\\n",
  "using the stylus.\\n",
  "\\n",
  "Tap the pen and eraser icons to switch\\n",
  "between writing and erasing.\\n",
  "\\n",
  "Tap the plus icon to magnify the screen.\\n",
  "Tap the triangle icon to split the signature\\n",
  "area in two for animation.$",
]

[msg.section_0.entries.156]
text = [
  "As you progress in your adventure,\\n",
  "a Medal icon will be added to your\\n",
  "Trainer Card.\\n",
  "\\n",
  "Tap the Medal icon to see the Favorite Medal\\n",
  "you registered and the number of Medals\\n",
  "you have.$",
]

[msg.section_0.entries.157]
text = [
  "This high-tech Pokédex records Pokémon\\n",
  "automatically.\\n",
  "\\n",
  "You can check a Pokémon's info, area, cry,\\n",
  "height, weight, type, footprint, and more.$",
]

[msg.section_0.entries.158]
text = [
  "Press “START\\\" when the list is displayed\\n",
  "in the Pokédex to activate the Search Mode.\\n",
  "\\n",
  "In the Search Mode,\\n",
  "you can search Pokémon\\n",
  "by number, alphabetical order,\\n",
  "name, color, shape, and more.$",
]

[msg.section_0.entries.159]
text = [
  "As you progress in your adventure,\\n",
  "“Habitat List\\\" will be added to\\n",
  "the Pokédex.\\n",
  "\\n",
  "The Habitat List displays Pokémon you met\\n",
  "by location. When you have seen or caught\\n",
  "all Pokémon living in a particular place,\\n",
  "a stamp mark will be added.$",
]

[msg.section_0.entries.160]
text = [
  "Your chances of capturing a Pokémon\\n",
  "are better if you lower your target's HP\\n",
  "before you throw Poké Balls.\\n",
  "\\n",
  "If you use Pokémon moves to inflict a sleep\\n",
  "or paralysis condition on the target,\\n",
  "capturing it will be even easier.$",
]

[msg.section_0.entries.161]
text = [
  "Pokémon and their moves fall into\\n",
  "17 different types. Each type has\\n",
  "its own advantageous and disadvantageous\\n",
  "matchups against the others.\\n",
  "\\n",
  "For example, Fire-type moves are more\\n",
  "effective against Bug- and Grass-type\\n",
  "Pokémon but are less effective against\\n",
  "Water- or Rock-type Pokémon.$",
]

[msg.section_0.entries.162]
text = [
  "When the move type matches the type of the\\n",
  "Pokémon using it, the power of the move\\n",
  "is greater than usual.\\n",
  "\\n",
  "When a Pokémon has two types, either one\\n",
  "can affect the power.\\n",
  "\\n",
  "Some move types have no effect at all\\n",
  "on Pokémon of certain types.$",
]

[msg.section_0.entries.163]
text = [
  "Moves are classified as Physical, Special, or\\n",
  "Status moves. You can tell which is which\\n",
  "by their icons.\\n",
  "\\n",
  "-Physical Moves\\n",
  "Pokémon's Attack and Defense stats\\n",
  "determine the overall damage of this type\\n",
  "of move.$",
]

[msg.section_0.entries.164]
text = [
  "-Special Moves\\n",
  "Pokémon's Sp. Attack and Sp. Defense stats\\n",
  "determine the overall damage of these types\\n",
  "of moves.\\n",
  "\\n",
  "-Status Moves\\n",
  "This type of move is not a direct attack, but\\n",
  "it can raise the Pokémon's stats and inflict\\n",
  "status conditions that help them in battles.$",
]

[msg.section_0.entries.165]
text = [
  "The Pokémon's HP has reached zero.\\n",
  "You must restore its HP before\\n",
  "it can battle again.\\n",
  "Some of the moves usable outside battle can\\n",
  "still be used when its HP reaches zero.\\n",
  "■ To heal your Pokémon:\\n",
  "-Let Pokémon rest at a Pokémon Center\\n",
  "-Use Revive\\n",
  "-Use Max Revive$",
]

[msg.section_0.entries.166]
text = [
  "The Pokémon has been poisoned.\\n",
  "Its HP will gradually decrease in battle.\\n",
  "This will stop when it returns to its Poké Ball\\n",
  "or when the battle ends, but the poisoned\\n",
  "Pokémon will not cure itself.\\n",
  "\\n",
  "■ To heal a poisoned Pokémon:\\n",
  "-Let Pokémon rest at a Pokémon Center\\n",
  "-Use Antidote, Pecha Berry, etc.$",
]

[msg.section_0.entries.167]
text = [
  "The Pokémon has paralysis.\\n",
  "Its Speed stat drops, and\\n",
  "it sometimes fails to use moves.\\n",
  "A Pokémon with paralysis will not\\n",
  "cure itself.\\n",
  "\\n",
  "■ To heal a Pokémon with paralysis:\\n",
  "-Let Pokémon rest at a Pokémon Center\\n",
  "-Use Parlyz Heal, Cheri Berry, etc.$",
]

[msg.section_0.entries.168]
text = [
  "The Pokémon is asleep. Only certain moves\\n",
  "can be used in this state.\\n",
  "\\n",
  "The Pokémon can wake up during a battle, but\\n",
  "it stays asleep if the battle ends before it\\n",
  "wakes up.\\n",
  "■ To heal a sleeping Pokémon:\\n",
  "-Let the Pokémon rest at a Pokémon Center\\n",
  "-Use Awakening, Chesto Berry, etc.$",
]

[msg.section_0.entries.169]
text = [
  "The Pokémon is frozen and cannot use\\n",
  "most moves. It can be defrosted during\\n",
  "a battle, but it stays frozen if the battle\\n",
  "ends before it is defrosted.\\n",
  "\\n",
  "■ To heal a frozen Pokémon:\\n",
  "-Let the Pokémon rest at a Pokémon Center\\n",
  "-Use Ice Heal, Aspear Berry, etc.$",
]

[msg.section_0.entries.170]
text = [
  "The Pokémon is burned.\\n",
  "Its Attack stat drops, and its HP gradually\\n",
  "decreases. This HP loss stops when it returns\\n",
  "to its Poké Ball or when the battle ends,\\n",
  "but the burned Pokémon will not\\n",
  "cure itself.\\n",
  "■ To heal a burned Pokémon:\\n",
  "-Let the Pokémon rest at a Pokémon Center\\n",
  "-Use Burn Heal, Rawst Berry, etc.$",
]

[msg.section_0.entries.171]
text = [
  "The Pokémon is confused.\\n",
  "It sometimes attacks itself instead of\\n",
  "using the selected move.\\n",
  "It is cured after the battle, and the Pokémon\\n",
  "can sometimes cure itself during a battle.\\n",
  "\\n",
  "■ To heal a confused Pokémon:\\n",
  "-Switch out the affected Pokémon in a battle\\n",
  "-Use Persim Berry, etc.$",
]

[msg.section_0.entries.172]
text = [
  "The Pokémon is infatuated\\n",
  "by a Pokémon of the opposite gender.\\n",
  "It has a crush on the other Pokémon\\n",
  "and sometimes fails to use its moves.\\n",
  "\\n",
  "It will be cured when switched out\\n",
  "or when the other Pokémon is defeated.$",
]

[msg.section_0.entries.173]
text = [
  "Pokémon earn Exp. Points\\n",
  "after a battle. They grow as they\\n",
  "receive Exp. Points and level up.\\n",
  "\\n",
  "The stronger the Pokémon it defeats,\\n",
  "the more Exp. Points it earns.\\n",
  "\\n",
  "The weaker the Pokémon it defeats,\\n",
  "the fewer Exp. Points it earns.$",
]

[msg.section_0.entries.174]
text = [
  "Exp. Points are shared among\\n",
  "the Pokémon in a battle. To help\\n",
  "a weak Pokémon receive Exp. Points,\\n",
  "take it out and switch in a strong Pokémon.\\n",
  "\\n",
  "When you trade and receive a Pokémon\\n",
  "from another Trainer, it'll gain more\\n",
  "Exp. Points than Pokémon that\\n",
  "you've caught yourself.$",
]

[msg.section_0.entries.175]
text = [
  "Pokémon sometimes evolve.\\n",
  "When they do, their appearance changes\\n",
  "and their stats increase.\\n",
  "\\n",
  "There are many ways to evolve.\\n",
  "You can evolve some Pokémon by leveling up,\\n",
  "some by using items that evolve Pokémon,\\n",
  "and some by trading a Pokémon with a friend.\\n",
  "Each Pokémon has its own way to evolve.$",
]

[msg.section_0.entries.176]
text = [
  "If you press the B Button while a Pokémon\\n",
  "is evolving, it will be surprised\\n",
  "and will stop evolving.\\n",
  "\\n",
  "You can also obtain an item that\\n",
  "prevents Pokémon from evolving.$",
]

[msg.section_0.entries.177]
text = [
  "Pokémon can grow differently,\\n",
  "depending on each one's Nature\\n",
  "and Characteristic.\\n",
  "\\n",
  "Sometimes Pokémon stats such as\\n",
  "Attack and Defense may be colored\\n",
  "red or blue. Red means the stat is\\n",
  "more likely to increase, and blue means\\n",
  "the stat is less likely to increase.$",
]

[msg.section_0.entries.178]
text = [
  "Pokérus is a beneficial virus seldom\\n",
  "seen in Pokémon.\\n",
  "\\n",
  "Pokémon that were once infected by Pokérus\\n",
  "seem to grow faster.\\n",
  "\\n",
  "Pokérus may spread to other Pokémon\\n",
  "in your party.$",
]

[msg.section_0.entries.179]
text = [
  "When you leave two Pokémon\\n",
  "at the Pokémon Day Care,\\n",
  "you may find an Egg.\\n",
  "\\n",
  "Take an Egg with you in your party, along with\\n",
  "your other Pokémon, and a Pokémon will hatch\\n",
  "from the Egg.$",
]

[msg.section_0.entries.180]
text = [
  "Once you've received the Running Shoes,\\n",
  "press the B Button to run.$",
]

[msg.section_0.entries.181]
text = [
  "The Dowsing MCHN can indicate where items\\n",
  "are hidden on the Touch Screen.\\n",
  "\\n",
  "Follow the directions to find them. When\\n",
  "you stand on a hidden item, it will blink.\\n",
  "\\n",
  "You cannot pick up items if you are standing\\n",
  "directly on them. Step away, face toward\\n",
  "the hidden item, and press the A Button.$",
]

[msg.section_0.entries.182]
text = [
  "This item lets you talk to your friends\\n",
  "using DS Wireless Communications\\n",
  "or Nintendo Wi-Fi Connection.\\n",
  "\\n",
  "With a Nintendo 3DS, Nintendo DSi, or\\n",
  "Nintendo DSi XL, you can use the camera\\n",
  "to see each other while talking.\\n",
  "You must both register Friend Codes before\\n",
  "talking with friends on the Xtransceiver.$",
]

[msg.section_0.entries.183]
text = [
  "■ Using DS Wireless Communications\\n",
  "Touch the “WIRELESS\\\" button on your C-Gear\\n",
  "to select the Xtransceiver.\\n",
  "The names and ID numbers of Trainers\\n",
  "you've exchanged Friend Codes with\\n",
  "will appear on the Touch Screen.\\n",
  "Select the people you want to talk to\\n",
  "and give them a call. You can call\\n",
  "up to three people at once.$",
]

[msg.section_0.entries.184]
text = [
  "The “WIRELESS\\\" button on your C-Gear will\\n",
  "flash, and the C-Gear will ring.\\n",
  "\\n",
  "The Xtransceiver will show your friend's name.\\n",
  "Tap it to pick up the phone.\\n",
  "\\n",
  "You will not be able to answer if you tap\\n",
  "the Xtransceiver.$",
]

[msg.section_0.entries.185]
text = [
  "■ Using Wi-Fi Club\\n",
  "You can talk to one Trainer in the Wi-Fi Club.$",
]

[msg.section_0.entries.186]
text = [
  "■ How to Use the Xtransceiver\\n",
  "Use the Touch Screen. Touch the button\\n",
  "in the middle while you are talking into it.\\n",
  "\\n",
  "Use the gauge to your left to change\\n",
  "the pitch of your voice.$",
]

[msg.section_0.entries.187]
text = [
  "With the Nintendo 3DS, Nintendo DSi, and\\n",
  "Nintendo DSi XL, you'll see another player's\\n",
  "face. You can cover it with\\n",
  "graffiti using the button in the top-right\\n",
  "corner. You can also freeze the picture\\n",
  "using the button in the bottom-right corner.\\n",
  "\\n",
  "“SOUND ONLY\\\" will be displayed\\n",
  "if the DS system lacks a camera.$",
]

[msg.section_0.entries.188]
text = [
  "Tap one of the balloon icons on the\\n",
  "bottom-right corner, and you can play a\\n",
  "minigame with friend(s) on the Xtransceiver.\\n",
  "\\n",
  "Depending on the button you tap,\\n",
  "you can play different games.$",
]

[msg.section_0.entries.189]
text = [
  "Only the first person who used the\\n",
  "Xtransceiver can start a minigame.\\n",
  "\\n",
  "You cannot play a minigame\\n",
  "with players who have Pokémon Black Version\\n",
  "or Pokémon White Version.$",
]

[msg.section_0.entries.190]
text = [
  "The Unova region has eight Gyms. Each Gym\\n",
  "has its own Gym Leader, and you can win\\n",
  "Gym Badges by defeating those Gym Leaders.\\n",
  "\\n",
  "\\n",
  "You can tap the icon in the bottom-left\\n",
  "corner of the Trainer Card screen to check\\n",
  "how many Gym Badges you have.$",
]

[msg.section_0.entries.191]
text = [
  "As you collect Badges, the Pokémon you've\\n",
  "picked up by trading will start to obey you\\n",
  "without question, even if their level is high.$",
]

[msg.section_0.entries.192]
text = [
  "The Ready button is an easy shortcut\\n",
  "to frequently used functions and items.\\n",
  "\\n",
  "Once you register something with the\\n",
  "Ready button, just press the Y Button\\n",
  "to use that item or function instantly.$",
]

[msg.section_0.entries.193]
text = [
  "You may see boxes on the Touch Screen when\\n",
  "you open the menu by pressing the X Button.\\n",
  "\\n",
  "Tap the box or press the Y Button,\\n",
  "and a check mark will appear in it.\\n",
  "\\n",
  "Functions and items with check marks\\n",
  "next to them are the ones that\\n",
  "are registered to the Ready button.$",
]

[msg.section_0.entries.194]
text = [
  "You will see boxes next to item names\\n",
  "in the Key Items Case, as well.\\n",
  "\\n",
  "Move the cursor and press the Y Button,\\n",
  "or tap to check them, and they will be\\n",
  "registered to work with the Ready button.$",
]

[msg.section_0.entries.195]
text = [
  "You can register up to 34 functions and items\\n",
  "to the Ready button.\\n",
  "To unregister, tap a checked box or\\n",
  "press the Y Button to remove the check mark.\\n",
  "If you have registered two or more functions\\n",
  "and items, you can change the order of them\\n",
  "by pressing SELECT.$",
]

[msg.section_0.entries.196]
text = [
  "The Medal Rally is an event that evaluates\\n",
  "various activities of Trainers and rewards\\n",
  "them with Medals.\\n",
  "\\n",
  "You can check Medals you've earned\\n",
  "by choosing Medal Box in the Key Items Case\\n",
  "in your Bag.$",
]

[msg.section_0.entries.197]
text = [
  "You can get Medals\\n",
  "by speaking to Mr. Medal,\\n",
  "who shows up at Pokémon Centers\\n",
  "if you meet certain conditions.$",
]

[msg.section_0.entries.198]
text = [
  "Insert one of the following games in another\\n",
  "DS system, and turn the power ON.\\n",
  "- Pokémon Diamond Version\\n",
  "- Pokémon Pearl Version\\n",
  "- Pokémon Platinum Version\\n",
  "- Pokémon HeartGold Version\\n",
  "- Pokémon SoulSilver Version\\n",
  "Then tap DS Download Play in the DS Menu\\n",
  "to select Poké Transfer.$",
]

[msg.section_0.entries.199]
text = [
  "When the Pokémon have been received,\\n",
  "select the six Pokémon you'd like\\n",
  "to transfer to Pokémon Black Version 2 or\\n",
  "Pokémon White Version 2 and slide them\\n",
  "into the frame to your right.\\n",
  "\\n",
  "Pokémon sent by Poké Transfer CANNOT\\n",
  "be returned to the games they came from.$",
]

[msg.section_0.entries.200]
text = [
  "Tap the Touch Screen to pull back\\n",
  "the Poké Ball, aim it at the Pokémon,\\n",
  "and release the Poké Ball.\\n",
  "\\n",
  "Some Pokémon may be hiding in the grass\\n",
  "or behind trees.$",
]

[msg.section_0.entries.201]
text = [
  "When hit by a Poké Ball, a Pokémon will\\n",
  "come out from where it's been hiding.\\n",
  "Throw a second Poké Ball to catch it.\\n",
  "\\n",
  "Try to catch all six Pokémon\\n",
  "within the time limit.$",
]

[msg.section_0.entries.202]
text = [
  "You may see pink mist from time to time.\\n",
  "If you hit it with your Poké Ball,\\n",
  "the Pokémon will fall asleep.\\n",
  "\\n",
  "Pokémon cannot move while sleeping,\\n",
  "so this makes it easier to catch them.$",
]

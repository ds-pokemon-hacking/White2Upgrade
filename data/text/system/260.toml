[msg.section_0.entries.0]
text = [
  "Movie Star$",
]

[msg.section_0.entries.1]
text = [
  "Masked Man$",
]

[msg.section_0.entries.2]
text = [
  "Brycen-Man: Mwahaha!\\c\\n",
  "For our final battle, this world\\n",
  "is way too small...\\l\\n",
  "Follow me!$",
]

[msg.section_0.entries.3]
text = [
  "Brycen-Man: Mwahaha!\\c\\n",
  "This is only the beginning! We'll go up\\n",
  "to another height of battle!\\l\\n",
  "Keep up with me!$",
]

[msg.section_0.entries.4]
text = [
  "Brycen-Man: Is there anything wrong?\\n",
  "I am going even higher!\\c\\n",
  "I will reach the far end of space!$",
]

[msg.section_0.entries.5]
text = [
  "Brycen-Man: Mwahaha...\\c\\n",
  "This is as far as my Pokémon party can go...\\c\\n",
  "Let us decide our fate,\\n",
  "[VAR PKNICK(0)] Kid!$",
]

[msg.section_0.entries.6]
text = [
  "Brycen-Man: I can feel it in my body!\\n",
  "Great power is filling me now!\\c\\n",
  "Brycen-Man, the Masked Man, iiiis back!$",
]

[msg.section_0.entries.7]
text = [
  "???: Hold it right there!$",
]

[msg.section_0.entries.8]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "This voice... I've been waiting for you...$",
]

[msg.section_0.entries.9]
text = [
  "???: The Messenger of Truths and Ideals,\\n",
  "the [VAR PKNICK(0)] Kid enters!\\c\\n",
  "Let this be the final battle between us,\\n",
  "Brycen-Man!$",
]

[msg.section_0.entries.10]
text = [
  "Brycen-Man: Mwahaha!\\c\\n",
  "Very well! Between you and me,\\n",
  "let us decide who the truly stronger one is!$",
]

[msg.section_0.entries.11]
text = [
  "The [VAR PKNICK(0)] Kid: I will see it through!$",
]

[msg.section_0.entries.12]
text = [
  "Brycen-Man: Confident, aren't you?\\n",
  "But don't get sassy with me!\\c\\n",
  "Prove yourself by defeating my entire\\n",
  "trusted Pokémon party with one hit each!$",
]

[msg.section_0.entries.13]
text = [
  "Brycen-Man: Mwahaha!\\c\\n",
  "I can say that my condition has\\n",
  "never been this good in my entire life!\\c\\n",
  "I feel so great, I can almost touch the sky\\n",
  "if I reach for it!\\c\\n",
  "Run for your life or else,\\n",
  "[VAR PKNICK(0)] Kid!$",
]

[msg.section_0.entries.14]
text = [
  "The [VAR PKNICK(0)] Kid: Ha!\\n",
  "That's my line.\\l\\n",
  "Heroes of justice always prevail!$",
]

[msg.section_0.entries.15]
text = [
  "Brycen-Man: Mwahaha!\\c\\n",
  "I will defeat you and dye this world\\n",
  "in dark colors!$",
]

[msg.section_0.entries.16]
text = [
  "The [VAR PKNICK(0)] Kid: Bring it on!$",
]

[msg.section_0.entries.17]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "My blood is boiling with excitement...\\l\\n",
  "for the first battle in a long time!$",
]

[msg.section_0.entries.18]
text = [
  "The [VAR PKNICK(0)] Kid: What was that?$",
]

[msg.section_0.entries.19]
text = [
  "Brycen-Man: Arrgh...\\c\\n",
  "Why did you have to ruin it\\n",
  "when I was getting really into the right\\l\\n",
  "mood? You obnoxious little kid...$",
]

[msg.section_0.entries.20]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "You are good, as always. However,\\l\\n",
  "my Pokémon party is in its best\\l\\n",
  "condition today!$",
]

[msg.section_0.entries.21]
text = [
  "The [VAR PKNICK(0)] Kid: As expected!$",
]

[msg.section_0.entries.22]
text = [
  "Brycen-Man: Mwahaha!\\c\\n",
  "Compliments won't get you anything except\\n",
  "my dark counterattacks!\\c\\n",
  "Take this!\\n",
  "The wholehearted attack of a Masked Man!$",
]

[msg.section_0.entries.23]
text = [
  "The [VAR PKNICK(0)] Kid: Whatever!$",
]

[msg.section_0.entries.24]
text = [
  "Brycen-Man: How dare...\\c\\n",
  "What happened to your mouth? It's gotten\\n",
  "quite bad since the last time we met...\\c\\n",
  "[VAR PKNICK(0)] Kid, you must be entering\\n",
  "the rebellious phase.$",
]

[msg.section_0.entries.25]
text = [
  "The [VAR PKNICK(0)] Kid: Pant pant...\\n",
  "It's finally...over...$",
]

[msg.section_0.entries.26]
text = [
  "Brycen-Man: Well...\\n",
  "I lost...\\c\\n",
  "It seems that I can never\\n",
  "defeat you after all...$",
]

[msg.section_0.entries.27]
text = [
  "The [VAR PKNICK(0)] Kid: That's not true!\\n",
  "It was a great match!$",
]

[msg.section_0.entries.28]
text = [
  "Brycen-Man: No matter...\\c\\n",
  "If you are this strong, I just have to\\n",
  "become stronger than you...$",
]

[msg.section_0.entries.29]
text = [
  "The [VAR PKNICK(0)] Kid: ...$",
]

[msg.section_0.entries.30]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "I got it! I have an idea!\\c\\n",
  "There is a way to raise the level\\n",
  "of my dark power even higher!$",
]

[msg.section_0.entries.31]
text = [
  "The [VAR PKNICK(0)] Kid: What?$",
]

[msg.section_0.entries.32]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "What I need is a black hole!\\c\\n",
  "Anything and everything, even light,\\n",
  "gets sucked into this dark void of energy...\\c\\n",
  "Mwahaha!\\n",
  "It'll suit me well...$",
]

[msg.section_0.entries.33]
text = [
  "The [VAR PKNICK(0)] Kid: Brycen-Man!\\n",
  "You are insane...$",
]

[msg.section_0.entries.34]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "Now that I know what to do...\\l\\n",
  "You know what they say: “Never hesitate\\l\\n",
  "to do what you think is right.\\\"\\l\\n",
  "Oops, I mean “what you think is wrong\\\"!\\c\\n",
  "You see that black hole over there?\\n",
  "I'll make that mine!\\c\\n",
  "Bye for now, [VAR PKNICK(0)] Kid!\\n",
  "Look forward to the return of\\l\\n",
  "the Galactic Brycen-Man with his power\\l\\n",
  "improved even further!$",
]

[msg.section_0.entries.35]
text = [
  "The [VAR PKNICK(0)] Kid: Hold on a second!\\n",
  "Wait! Noooo!$",
]

[msg.section_0.entries.36]
text = [
  "Bring ring ring!$",
]

[msg.section_0.entries.37]
text = [
  "[VAR TRNAME(1)]: Yaawn...$",
]

[msg.section_0.entries.38]
text = [
  "Waking up to the clock going off,\\n",
  "a little kid named [VAR TRNAME(1)],\\l\\n",
  "aka the [VAR PKNICK(0)] Kid,\\l\\n",
  "rubbed his sleepy eyes...\\c\\n",
  "The recent peaceful days may be a little\\n",
  "too boring for our hero of justice...$",
]

[msg.section_0.entries.39]
text = [
  "Brycen-Man: Arrgh...\\c\\n",
  "What was that pathetic move,\\n",
  "[VAR PKNICK(0)] Kid?\\c$",
]

[msg.section_0.entries.40]
text = [
  "The [VAR PKNICK(0)] Kid: Oops!\\n",
  "That didn't do it, did it?$",
]

[msg.section_0.entries.41]
text = [
  "Brycen-Man: You...are getting quite rusty,\\n",
  "aren't you?\\c\\n",
  "Don't tell me that\\n",
  "you've been loafing around\\l\\n",
  "while I was away!$",
]

[msg.section_0.entries.42]
text = [
  "The [VAR PKNICK(0)] Kid: Er...$",
]

[msg.section_0.entries.43]
text = [
  "Brycen-Man: Pathetic!\\n",
  "I can't call you a rival at all!$",
]

[msg.section_0.entries.44]
text = [
  "The [VAR PKNICK(0)] Kid: Don't say that...$",
]

[msg.section_0.entries.45]
text = [
  "Brycen-Man: Arrgh...\\c\\n",
  "You being weak lowers my\\n",
  "reputation, too!\\c\\n",
  "You give me no choice...\\c\\n",
  "I shall give you the honor\\n",
  "of being trained by me!\\c\\n",
  "Come, [VAR PKNICK(0)] Kid!\\n",
  "I'll take you to my hideout!\\c\\n",
  "I will train you until you become\\n",
  "the hero of all heroes,\\l\\n",
  "the worthy rival of myself, Brycen-Man!$",
]

[msg.section_0.entries.46]
text = [
  "The [VAR PKNICK(0)] Kid: Nooo!$",
]

[msg.section_0.entries.47]
text = [
  "Poor [VAR PKNICK(0)] Kid!\\n",
  "He couldn't defeat the Masked Man\\l\\n",
  "Brycen-Man's Pokémon party.\\c\\n",
  "He was led by Brycen-Man to his hideout,\\n",
  "where nightmarishly harsh training awaits...\\c\\n",
  "Push yourself, [VAR PKNICK(0)] Kid!\\c\\n",
  "Strive, [VAR PKNICK(0)] Kid!$",
]

[msg.section_0.entries.48]
text = [
  "The [VAR PKNICK(0)] Kid: No!\\n",
  "How did I lose to you...?$",
]

[msg.section_0.entries.49]
text = [
  "Brycen-Man: Arrgh...\\c\\n",
  "Look at yourself,\\n",
  "[VAR PKNICK(0)] Kid...\\c\\n",
  "To regard you as my rival\\n",
  "was a big mistake. How silly of me...$",
]

[msg.section_0.entries.50]
text = [
  "The [VAR PKNICK(0)] Kid: Arg...\\n",
  "I did my best...$",
]

[msg.section_0.entries.51]
text = [
  "Brycen-Man: Sigh... Pathetic!\\c\\n",
  "I'm done with you!\\c\\n",
  "Battling you would just\\n",
  "hurt my reputation!\\c\\n",
  "I'll just go find someone\\n",
  "worthy to be my rival!\\c\\n",
  "Farewell, [VAR PKNICK(0)] Kid!$",
]

[msg.section_0.entries.52]
text = [
  "The [VAR PKNICK(0)] Kid: Don't say that...\\n",
  "Wait up...$",
]

[msg.section_0.entries.53]
text = [
  "The [VAR PKNICK(0)] Kid let down Brycen-Man...\\c\\n",
  "A hero with no evil to fight\\n",
  "is just an ordinary person\\l\\n",
  "with a big imagination.\\c\\n",
  "The story of the [VAR PKNICK(0)] Kid\\n",
  "has, thus, come to an end...\\c\\n",
  "How disappointing, [VAR PKNICK(0)] Kid!\\c\\n",
  "Farewell, [VAR PKNICK(0)] Kid!$",
]

[msg.section_0.entries.54]
text = [
  "The [VAR PKNICK(0)] Kid: Humph!\\n",
  "I've done it! All down now!$",
]

[msg.section_0.entries.55]
text = [
  "Brycen-Man: Mwa!\\n",
  "Mwahaha!\\l\\n",
  "Mwahahahahahaha!$",
]

[msg.section_0.entries.56]
text = [
  "The [VAR PKNICK(0)] Kid: What's going on?$",
]

[msg.section_0.entries.57]
text = [
  "Brycen-Man: Impressive!\\n",
  "That was an utter defeat for me!\\l\\n",
  "You've made it through!\\c\\n",
  "That is what I'd expect from my son...$",
]

[msg.section_0.entries.58]
text = [
  "The [VAR PKNICK(0)] Kid: What did you say?$",
]

[msg.section_0.entries.59]
text = [
  "Brycen-Man: ...!\\c\\n",
  "I must excuse myself now!\\n",
  "Farewell, [VAR PKNICK(0)] Kid!$",
]

[msg.section_0.entries.60]
text = [
  "The [VAR PKNICK(0)] Kid: Please wait!\\c\\n",
  "Brycen-Man!\\n",
  "Are you...\\l\\n",
  "perhaps...my dad?$",
]

[msg.section_0.entries.61]
text = [
  "Brycen-Man: Wha...\\n",
  "What nonsense!\\c\\n",
  "I'd remember it if I had\\n",
  "a son like you!\\c\\n",
  "I am a Masked Man!\\n",
  "The dark bachelor who goes\\l\\n",
  "well with loneliness and melancholy!$",
]

[msg.section_0.entries.62]
text = [
  "The [VAR PKNICK(0)] Kid: Is that so...\\n",
  "I believe you...\\c\\n",
  "My mom always told me...\\n",
  "My dad left us for his own dream\\l\\n",
  "when I was just a baby...$",
]

[msg.section_0.entries.63]
text = [
  "Brycen-Man: ...$",
]

[msg.section_0.entries.64]
text = [
  "The [VAR PKNICK(0)] Kid: My dad couldn't have\\n",
  "become a Masked Man to face me...\\l\\n",
  "That would be too good to be true, right...?\\c\\n",
  "I'm sorry...\\n",
  "Brycen-Man, please leave me now...$",
]

[msg.section_0.entries.65]
text = [
  "Brycen-Man: ...\\c\\n",
  "Just one thing...\\n",
  "I have something to tell you,\\l\\n",
  "[VAR PKNICK(0)] Kid...$",
]

[msg.section_0.entries.66]
text = [
  "The [VAR PKNICK(0)] Kid: And that would be...$",
]

[msg.section_0.entries.67]
text = [
  "Brycen-Man: Little kid...\\n",
  "The power you are using for world peace...\\l\\n",
  "Don't you forget to use it\\l\\n",
  "for your mom, too...$",
]

[msg.section_0.entries.68]
text = [
  "The [VAR PKNICK(0)] Kid: Brycen-Man...\\n",
  "What are you saying?$",
]

[msg.section_0.entries.69]
text = [
  "Brycen-Man: I must leave now.\\n",
  "Farewell, [VAR PKNICK(0)] Kid!\\c\\n",
  "Or should I call you\\n",
  "[VAR TRNAME(1)]?$",
]

[msg.section_0.entries.70]
text = [
  "The [VAR PKNICK(0)] Kid: How?\\n",
  "How do you know my real name?$",
]

[msg.section_0.entries.71]
text = [
  "Bring ring ring!$",
]

[msg.section_0.entries.72]
text = [
  "Waking up to the clock going off,\\n",
  "a little kid named [VAR TRNAME(1)],\\l\\n",
  "aka the [VAR PKNICK(0)] Kid,\\l\\n",
  "rubbed his sleepy eyes...\\c\\n",
  "All those words from Brycen-Man,\\n",

[msg.section_0.entries.0]
text = [
  "$",
]

[msg.section_0.entries.1]
text = [
  "Después de nacer, crece alimentándose\\n",
  "de la semilla de su lomo.$",
]

[msg.section_0.entries.2]
text = [
  "Cuando el capullo de su lomo se hincha,\\n",
  "desprende un dulce aroma para indicar\\n",
  "el florecimiento.$",
]

[msg.section_0.entries.3]
text = [
  "Después de un día de lluvia, la flor de\\n",
  "su lomo tiene un aroma más potente\\n",
  "y atrae a otros Pokémon.$",
]

[msg.section_0.entries.4]
text = [
  "La llama de la punta de su cola indica\\n",
  "su salud. Si Charmander está sano,\\n",
  "arderá con más fuerza.$",
]

[msg.section_0.entries.5]
text = [
  "En las montañas rocosas donde viven\\n",
  "los Charmeleon, sus colas ardientes\\n",
  "brillan como estrellas.$",
]

[msg.section_0.entries.6]
text = [
  "Se dice que el fuego de Charizard\\n",
  "arde con más fuerza si ha vivido\\n",
  "duras batallas.$",
]

[msg.section_0.entries.7]
text = [
  "Se protege con su caparazón y luego\\n",
  "contraataca lanzando agua a presión\\n",
  "cuando tiene oportunidad.$",
]

[msg.section_0.entries.8]
text = [
  "Se dice que vive 10 000 años.\\n",
  "Su peluda cola es un símbolo\\n",
  "de longevidad.$",
]

[msg.section_0.entries.9]
text = [
  "Los chorros de agua que lanza\\n",
  "por los tubos de su caparazón\\n",
  "pueden atravesar el acero.$",
]

[msg.section_0.entries.10]
text = [
  "Su antena roja desprende un gran\\n",
  "hedor para repeler a los enemigos.\\n",
  "Crece mudándose repetidamente.$",
]

[msg.section_0.entries.11]
text = [
  "Su frágil cuerpo está recubierto\\n",
  "de una coraza dura como el acero.\\n",
  "Permanece quieto en su desarrollo.$",
]

[msg.section_0.entries.12]
text = [
  "Adora el néctar de las flores.\\n",
  "Puede localizar hasta las más\\n",
  "pequeñas cantidades de polen.$",
]

[msg.section_0.entries.13]
text = [
  "Come el equivalente a su peso en\\n",
  "hojas todos los días. Se defiende\\n",
  "con el aguijón de su cabeza.$",
]

[msg.section_0.entries.14]
text = [
  "Se esconde de sus atacantes\\n",
  "entre las ramas de los árboles\\n",
  "mientras espera a evolucionar.$",
]

[msg.section_0.entries.15]
text = [
  "Atacan volando alrededor del objetivo\\n",
  "y usando su aguijón venenoso antes\\n",
  "de huir.$",
]

[msg.section_0.entries.16]
text = [
  "Es manso y prefiere evitar\\n",
  "los problemas. Sin embargo,\\n",
  "si le molestan, atacará ferozmente.$",
]

[msg.section_0.entries.17]
text = [
  "Sobrevuela su extenso territorio\\n",
  "en busca de presas y ataca con\\n",
  "sus poderosas garras.$",
]

[msg.section_0.entries.18]
text = [
  "Aleteando con toda su fuerza, Pidgeot\\n",
  "crea corrientes de aire capaces de\\n",
  "doblar grandes árboles.$",
]

[msg.section_0.entries.19]
text = [
  "Su capacidad de adaptación le\\n",
  "permite vivir en cualquier lugar.\\n",
  "Es tremendamente cauteloso.$",
]

[msg.section_0.entries.20]
text = [
  "Lima sus colmillos royendo objetos\\n",
  "duros. Con ellos puede destruir\\n",
  "incluso paredes de hormigón.$",
]

[msg.section_0.entries.21]
text = [
  "Agita continuamente sus alitas\\n",
  "para volar. Busca presas entre\\n",
  "la hierba con su pico.$",
]

[msg.section_0.entries.22]
text = [
  "Tiene energía para volar todo el día\\n",
  "con sus grandes alas. Lucha con su\\n",
  "afilado pico.$",
]

[msg.section_0.entries.23]
text = [
  "Se mueve por la hierba en silencio\\n",
  "y sorprende a sus presas atacando\\n",
  "por detrás.$",
]

[msg.section_0.entries.24]
text = [
  "Arbok intimida a sus presas con el dibujo\\n",
  "de su panza y luego las asfixia con su\\n",
  "cuerpo.$",
]

[msg.section_0.entries.25]
text = [
  "A veces utiliza la electricidad de\\n",
  "sus mejillas para recargar a un\\n",
  "Pikachu amigo que esté débil.$",
]

[msg.section_0.entries.26]
text = [
  "Su cola descarga electricidad al suelo,\\n",
  "y eso le protege de los calambrazos.$",
]

[msg.section_0.entries.27]
text = [
  "Vive en zonas áridas donde casi no\\n",
  "llueve. Se enrosca formando una bola\\n",
  "para defenderse.$",
]

[msg.section_0.entries.28]
text = [
  "Se hace una bola y se lanza rodando\\n",
  "hacia los enemigos para clavarles\\n",
  "sus afiladas púas.$",
]

[msg.section_0.entries.29]
text = [
  "Aunque no le gusta luchar, una sola gota\\n",
  "del veneno de sus púas puede resultar\\n",
  "fatal.$",
]

[msg.section_0.entries.30]
text = [
  "Saca las púas de su cuerpo si siente\\n",
  "peligro. Sus púas crecen más despacio\\n",
  "que las de Nidorino.$",
]

[msg.section_0.entries.31]
text = [
  "Tiene el cuerpo cubierto de duras\\n",
  "escamas. Protege a su cría con\\n",
  "toda su fuerza.$",
]

[msg.section_0.entries.32]
text = [
  "Saca las orejas por encima de la hierba\\n",
  "para explorar el territorio.\\n",
  "Le protege su cuerno venenoso.$",
]

[msg.section_0.entries.33]
text = [
  "Se muestra violento y ataca a\\n",
  "los enemigos con un cuerno\\n",
  "que desprende veneno.$",
]

[msg.section_0.entries.34]
text = [
  "Un golpe de su poderosa cola puede\\n",
  "partir un poste de teléfono como si\\n",
  "fuese una cerilla.$",
]

[msg.section_0.entries.35]
text = [
  "Se dice que la felicidad llegará a quien\\n",
  "vea a un grupo de Clefairy bailando a\\n",
  "la luz de la luna llena.$",
]

[msg.section_0.entries.36]
text = [
  "Es muy prudente y rara vez se deja\\n",
  "ver. Su oído es tan fino que puede\\n",
  "oír caer una aguja a 1 km.$",
]

[msg.section_0.entries.37]
text = [
  "Controla bolas de fuego. A medida que\\n",
  "crece, sus seis colas se multiplican.$",
]

[msg.section_0.entries.38]
text = [
  "Se dice que sus nueve colas están\\n",
  "revestidas de poder místico.\\n",
  "Puede vivir 1000 años.$",
]

[msg.section_0.entries.39]
text = [
  "Cuando mueve sus grandes ojos\\n",
  "redondos, comienza a cantar\\n",
  "una nana que duerme al enemigo.$",
]

[msg.section_0.entries.40]
text = [
  "Tiene un pelaje muy agradable al tacto.\\n",
  "Puede hinchar su cuerpo tragando aire.$",
]

[msg.section_0.entries.41]
text = [
  "Utiliza las ondas ultrasónicas que emite\\n",
  "con la boca para orientarse y evitar\\n",
  "obstáculos.$",
]

[msg.section_0.entries.42]
text = [
  "Sus afilados colmillos atraviesan\\n",
  "las pieles más duras y tienen\\n",
  "orificios para chupar sangre.$",
]

[msg.section_0.entries.43]
text = [
  "Suele plantarse en el suelo durante\\n",
  "el día. Por la noche se desplaza\\n",
  "esparciendo semillas.$",
]

[msg.section_0.entries.44]
text = [
  "La miel que emana de su boca posee\\n",
  "un hedor capaz de derribar enemigos\\n",
  "a 2 km de distancia.$",
]

[msg.section_0.entries.45]
text = [
  "Sus pétalos son los más grandes del\\n",
  "mundo. Cuando anda, desprende\\n",
  "un terrible polen alergénico.$",
]

[msg.section_0.entries.46]
text = [
  "En el lomo de Paras crecen unas setas\\n",
  "parasitarias llamadas “tochukaso\\\".$",
]

[msg.section_0.entries.47]
text = [
  "Parasect está dominado por una seta\\n",
  "parásita mayor que él. Dispersa\\n",
  "esporas venenosas.$",
]

[msg.section_0.entries.48]
text = [
  "Sus grandes ojos son en realidad grupos\\n",
  "de ojos diminutos. Por la noche se\\n",
  "siente atraído por la luz.$",
]

[msg.section_0.entries.49]
text = [
  "Agita las alas para dispersar un polvillo\\n",
  "de escamas que libera toxinas si toca\\n",
  "la piel.$",
]

[msg.section_0.entries.50]
text = [
  "Este Pokémon vive a oscuras bajo tierra,\\n",
  "por lo que la luz solar le espanta.$",
]

[msg.section_0.entries.51]
text = [
  "Sus tres cabezas se mueven por turnos\\n",
  "para excavar la tierra a una profundidad\\n",
  "de unos 100 km.$",
]

[msg.section_0.entries.52]
text = [
  "Es de naturaleza nocturna.\\n",
  "Le atraen los objetos brillantes.$",
]

[msg.section_0.entries.53]
text = [
  "Es un Pokémon muy arrogante.\\n",
  "El tamaño de la joya de su frente\\n",
  "da mucho que hablar.$",
]

[msg.section_0.entries.54]
text = [
  "Sus grandes habilidades le provocan\\n",
  "un constante dolor de cabeza.\\n",
  "A veces usa poderes místicos.$",
]

[msg.section_0.entries.55]
text = [
  "Sus desarrolladas extremidades y aletas\\n",
  "le permiten nadar de forma elegante.$",
]

[msg.section_0.entries.56]
text = [
  "Vive en colonias en los árboles. Si uno\\n",
  "se enfada, el resto de la manada ataca\\n",
  "sin motivo.$",
]

[msg.section_0.entries.57]
text = [
  "Se molesta si le miras a los ojos.\\n",
  "Se enfada si corres.\\n",
  "Se enfurece si le golpeas.$",
]

[msg.section_0.entries.58]
text = [
  "Pokémon de naturaleza leal.\\n",
  "Permanece quieto en espera\\n",
  "de órdenes de su Entrenador.$",
]

[msg.section_0.entries.59]
text = [
  "Su aspecto regio y orgulloso se\\n",
  "ha ganado el corazón de la gente\\n",
  "hace tiempo.$",
]

[msg.section_0.entries.60]
text = [
  "Su piel es tan fina que permite ver\\n",
  "sus órganos. Le cuesta andar\\n",
  "con sus nuevas patas.$",
]

[msg.section_0.entries.61]
text = [
  "El dibujo espiral de su pecho ondea\\n",
  "levemente. Si se mira fijamente,\\n",
  "provoca somnolencia.$",
]

[msg.section_0.entries.62]
text = [
  "Tiene músculos muy desarrollados.\\n",
  "Es capaz de nadar en el océano\\n",
  "sin descanso.$",
]

[msg.section_0.entries.63]
text = [
  "Sus poderes psíquicos causan un\\n",
  "desgaste tan grande para su mente\\n",
  "que precisa dormir 18 horas al día.$",
]

[msg.section_0.entries.64]
text = [
  "Mira su cuchara de plata fijamente\\n",
  "para concentrarse. Mientras lo hace,\\n",
  "emite más ondas alfa.$",
]

[msg.section_0.entries.65]
text = [
  "Se dice que creó las cucharas que\\n",
  "lleva en las manos con sus poderes\\n",
  "psíquicos.$",
]

[msg.section_0.entries.66]
text = [
  "No alcanza mucha altura, pero tiene\\n",
  "fuerza suficiente para levantar y\\n",
  "derribar a varios Geodude a la vez.$",
]

[msg.section_0.entries.67]
text = [
  "Levanta pesos descomunales para\\n",
  "mantenerse en forma y usa su fuerza\\n",
  "para ayudar a las personas.$",
]

[msg.section_0.entries.68]
text = [
  "Tiene cuatro musculosos brazos con\\n",
  "los que golpea y destroza al enemigo\\n",
  "a una velocidad increíble.$",
]

[msg.section_0.entries.69]
text = [
  "Prefiere los lugares cálidos y húmedos.\\n",
  "Captura presas con sus rápidas lianas.$",
]

[msg.section_0.entries.70]
text = [
  "Este Pokémon parece una planta.\\n",
  "Captura a sus presas usando polvo\\n",
  "tóxico cuando están desprevenidas.$",
]

[msg.section_0.entries.71]
text = [
  "Su boca segrega un fluido de olor\\n",
  "parecido a la miel: un potente ácido\\n",
  "que disuelve cualquier cosa.$",
]

[msg.section_0.entries.72]
text = [
  "Como su cuerpo se compone casi en\\n",
  "exclusiva de agua, se reseca si sale\\n",
  "de ella.$",
]

[msg.section_0.entries.73]
text = [
  "Extiende sus 80 tentáculos para\\n",
  "formar una red venenosa de la\\n",
  "que es muy difícil escapar.$",
]

[msg.section_0.entries.74]
text = [
  "En reposo parece una roca normal,\\n",
  "pero responde agitando los puños\\n",
  "con agresividad si se pisa por error.$",
]

[msg.section_0.entries.75]
text = [
  "Se desplaza rodando por caminos de\\n",
  "montaña. Cuando coge velocidad, es\\n",
  "difícil frenar su avance.$",
]

[msg.section_0.entries.76]
text = [
  "Ni siquiera la dinamita puede dañar\\n",
  "su cuerpo rocoso. Muda la piel\\n",
  "una vez al año.$",
]

[msg.section_0.entries.77]
text = [
  "Cuando nace, apenas puede tenerse\\n",
  "en pie. Pero va fortaleciendo las patas\\n",
  "en cuanto empieza a galopar.$",
]

[msg.section_0.entries.78]
text = [
  "Cuando galopa, su ardiente crin\\n",
  "centellea y le da un aspecto\\n",
  "aún más impresionante.$",
]

[msg.section_0.entries.79]
text = [
  "A pesar de su lentitud, tiene una gran\\n",
  "habilidad para pescar con la cola, que\\n",
  "es insensible al dolor.$",
]

[msg.section_0.entries.80]
text = [
  "Normalmente se muestra torpe, aunque\\n",
  "espabila si el Shellder de su cola le\\n",
  "muerde.$",
]

[msg.section_0.entries.81]
text = [
  "Cuanto más rápido rotan las unidades\\n",
  "laterales, mayor fuerza magnética\\n",
  "generan.$",
]

[msg.section_0.entries.82]
text = [
  "Surgen cuando aparecen manchas en el\\n",
  "sol. Los televisores no funcionan bien\\n",
  "en su presencia.$",
]

[msg.section_0.entries.83]
text = [
  "No puede vivir sin el puerro que lleva.\\n",
  "Por eso lo protege de sus atacantes\\n",
  "con todas sus fuerzas.$",
]

[msg.section_0.entries.84]
text = [
  "Parece que los cerebros de sus dos\\n",
  "cabezas se comunican por telepatía.$",
]

[msg.section_0.entries.85]
text = [
  "Cuando un Doduo evoluciona, una\\n",
  "de sus cabezas se divide en dos.\\n",
  "Corre a unos 60 km/h.$",
]

[msg.section_0.entries.86]
text = [
  "Este Pokémon vive en icebergs. Nada en\\n",
  "el mar y usa el cuerno de su cabeza para\\n",
  "romper el hielo.$",
]

[msg.section_0.entries.87]
text = [
  "Está cubierto de un luminoso pelaje\\n",
  "blanco que lo camufla en la nieve.$",
]

[msg.section_0.entries.88]
text = [
  "Emergió del lodo que se formó en agua\\n",
  "contaminada expuesta a los rayos X\\n",
  "lunares. Vive en la basura.$",
]

[msg.section_0.entries.89]
text = [
  "Su cuerpo segrega un fluido tóxico que\\n",
  "elimina la vida vegetal cuando la toca.$",
]

[msg.section_0.entries.90]
text = [
  "Nada hacia atrás abriendo y cerrando\\n",
  "su concha. Su gran lengua siempre\\n",
  "queda colgando.$",
]

[msg.section_0.entries.91]
text = [
  "En la lucha se protege cerrando\\n",
  "su concha y lanzando pinchos\\n",
  "a sus oponentes.$",
]

[msg.section_0.entries.92]
text = [
  "Nació a partir de gases venenosos que\\n",
  "asfixiarían a cualquiera que se viera\\n",
  "envuelto en ellos.$",
]

[msg.section_0.entries.93]
text = [
  "Le gusta acechar en la oscuridad y tocar\\n",
  "el hombro a sus víctimas, que se quedan\\n",
  "temblando para siempre.$",
]

[msg.section_0.entries.94]
text = [
  "Esa mirada fija que flota en la oscuridad\\n",
  "es de algún Gengar que disfruta\\n",
  "maldiciendo a la gente.$",
]

[msg.section_0.entries.95]
text = [
  "Se desplaza excavando en la tierra\\n",
  "a 80 km/h a la vez que se alimenta\\n",
  "de rocas.$",
]

[msg.section_0.entries.96]
text = [
  "Puede oler los sueños de la gente\\n",
  "con su gran nariz. Le encantan\\n",
  "los sueños divertidos.$",
]

[msg.section_0.entries.97]
text = [
  "Mirar su péndulo puede inducir al sueño\\n",
  "en tres segundos, incluso si acabas\\n",
  "de despertarte.$",
]

[msg.section_0.entries.98]
text = [
  "Vive en madrigueras excavadas en playas\\n",
  "arenosas. Sus pinzas vuelven a crecer\\n",
  "si se rompen.$",
]

[msg.section_0.entries.99]
text = [
  "La pinza mayor tiene 10 000 caballos\\n",
  "de potencia, pero es tan grande que\\n",
  "le cuesta usarla.$",
]

[msg.section_0.entries.100]
text = [
  "Parece una Poké Ball. Es muy peligroso,\\n",
  "ya que puede lanzar descargas o\\n",
  "explotar si se toca.$",
]

[msg.section_0.entries.101]
text = [
  "Se lo lleva el viento si se hincha\\n",
  "con la electricidad que almacena.$",
]

[msg.section_0.entries.102]
text = [
  "Estos seis huevos se comunican por\\n",
  "telepatía. Si se separan, se pueden\\n",
  "reunir rápidamente.$",
]

[msg.section_0.entries.103]
text = [
  "Se le llama la Selva Andante. Si una\\n",
  "cabeza crece demasiado, se cae\\n",
  "y forma un Exeggcute.$",
]

[msg.section_0.entries.104]
text = [
  "Llora cuando se acuerda de su madre\\n",
  "fallecida. Cuando lo hace, sus llantos\\n",
  "resuenan en su calavera.$",
]

[msg.section_0.entries.105]
text = [
  "Este Pokémon salvaje maneja huesos\\n",
  "constantemente desde su nacimiento\\n",
  "y los usa como armas.$",
]

[msg.section_0.entries.106]
text = [
  "Sus piernas se extienden hasta doblar\\n",
  "su longitud para sorprender a\\n",
  "enemigos desprevenidos.$",
]

[msg.section_0.entries.107]
text = [
  "Los potentes golpes de sus brazos\\n",
  "pueden pulverizar el hormigón.\\n",
  "Descansa tras luchar tres minutos.$",
]

[msg.section_0.entries.108]
text = [
  "Cuando extiende la lengua, que mide\\n",
  "dos metros, se le agita la cola.\\n",
  "Puede que estén conectadas.$",
]

[msg.section_0.entries.109]
text = [
  "Los gases de su cuerpo le permiten\\n",
  "flotar. Estos gases, además de oler\\n",
  "mal, también son explosivos.$",
]

[msg.section_0.entries.110]
text = [
  "Crece alimentándose de los gases\\n",
  "emanados por la basura. Se han\\n",
  "dado raros casos de trillizos.$",
]

[msg.section_0.entries.111]
text = [
  "Puede destruir cualquier cosa con sus\\n",
  "potentes placajes. Le falta inteligencia\\n",
  "para ser de utilidad.$",
]

[msg.section_0.entries.112]
text = [
  "Al ponerse en pie, liberó dos patas\\n",
  "y eso desarrolló su inteligencia.\\n",
  "Pero se le olvidan las cosas.$",
]

[msg.section_0.entries.113]
text = [
  "Un generoso Pokémon que pone huevos\\n",
  "muy nutritivos y los da a personas o\\n",
  "Pokémon heridos.$",
]

[msg.section_0.entries.114]
text = [
  "Las lianas azules que envuelven\\n",
  "su cuerpo están cubiertas de vello.\\n",
  "Se dice que tiene cosquillas.$",
]

[msg.section_0.entries.115]
text = [
  "Lleva a su cría en la bolsa de su panza.\\n",
  "Solo deja que su cría salga a jugar\\n",
  "cuando no siente peligro.$",
]

[msg.section_0.entries.116]
text = [
  "Hace su nido entre los corales. Si se\\n",
  "siente en peligro, escupe tinta y huye.$",
]

[msg.section_0.entries.117]
text = [
  "Se protege con sus púas. Sus aletas\\n",
  "y huesos son muy valorados por\\n",
  "la medicina tradicional.$",
]

[msg.section_0.entries.118]
text = [
  "Resulta muy elegante cuando nada con\\n",
  "las aletas desplegadas, pero causa\\n",
  "estragos con su cuerno.$",
]

[msg.section_0.entries.119]
text = [
  "En otoño gana algo de peso para atraer\\n",
  "a posibles parejas y se cubre de\\n",
  "llamativos colores.$",
]

[msg.section_0.entries.120]
text = [
  "Puede recuperar las extremidades que\\n",
  "pierde si mantiene intacto su núcleo\\n",
  "rojo, que brilla en la noche.$",
]

[msg.section_0.entries.121]
text = [
  "El centro de su cuerpo alberga\\n",
  "un órgano que emite extrañas\\n",
  "señales de radio en la noche.$",
]

[msg.section_0.entries.122]
text = [
  "Crea paredes invisibles deteniendo\\n",
  "moléculas con las imperceptibles\\n",
  "vibraciones de sus dedos.$",
]

[msg.section_0.entries.123]
text = [
  "Las cortantes guadañas de sus\\n",
  "antebrazos se vuelven más afiladas\\n",
  "cada vez que cortan objetos duros.$",
]

[msg.section_0.entries.124]
text = [
  "Sus gritos se parecen al lenguaje\\n",
  "humano, pero es imposible\\n",
  "entender lo que dice.$",
]

[msg.section_0.entries.125]
text = [
  "Gira los brazos para preparar sus\\n",
  "puñetazos. A veces tarda tanto\\n",
  "que se le escapan los enemigos.$",
]

[msg.section_0.entries.126]
text = [
  "Cuando respira profundamente, se forman\\n",
  "olas de calor alrededor de su cuerpo que\\n",
  "dificultan la visión.$",
]

[msg.section_0.entries.127]
text = [
  "Atrapa presas con sus pinzas hasta que\\n",
  "las parte en dos. Lanza lejos lo que no\\n",
  "puede quebrar.$",
]

[msg.section_0.entries.128]
text = [
  "Cuando elige una presa, ataca sin\\n",
  "pensárselo. Este Pokémon es\\n",
  "famoso por su carácter violento.$",
]

[msg.section_0.entries.129]
text = [
  "Si vive mucho, puede llegar a saltar\\n",
  "montañas con Salpicadura, pero el\\n",
  "movimiento no sirve para nada más.$",
]

[msg.section_0.entries.130]
text = [
  "Cuando empieza a agitarse, puede\\n",
  "quemarlo todo, incluso en medio\\n",
  "de la más violenta tormenta.$",
]

[msg.section_0.entries.131]
text = [
  "Le encanta surcar los mares con gente\\n",
  "y Pokémon en su lomo. Entiende\\n",
  "el lenguaje humano.$",
]

[msg.section_0.entries.132]
text = [
  "Puede alterar por completo su\\n",
  "estructura celular para emular\\n",
  "cualquier objeto que vea.$",
]

[msg.section_0.entries.133]
text = [
  "Su composición genética es algo\\n",
  "irregular, por eso cambia de forma\\n",
  "muy rápido y por diversas causas.$",
]

[msg.section_0.entries.134]
text = [
  "Su composición celular es similar a\\n",
  "la de las moléculas de agua, por eso\\n",
  "se mimetiza tan bien con ella.$",
]

[msg.section_0.entries.135]
text = [
  "Si se agita, usa electricidad para\\n",
  "convertir su pelaje en afiladísimas\\n",
  "púas y dispararlas en racimos.$",
]

[msg.section_0.entries.136]
text = [
  "Calienta el aire que inhala en su saca\\n",
  "de fuego y lo lleva a más de 1700°\\n",
  "de temperatura.$",
]

[msg.section_0.entries.137]
text = [
  "Un Pokémon creado por el hombre\\n",
  "con avanzados medios tecnológicos.\\n",
  "Puede viajar por el ciberespacio.$",
]

[msg.section_0.entries.138]
text = [
  "Fue recuperado a partir de un fósil\\n",
  "gracias a la ciencia moderna.\\n",
  "Solía nadar en antiguos mares.$",
]

[msg.section_0.entries.139]
text = [
  "Se cree que este Pokémon se extinguió\\n",
  "porque su concha espiral creció\\n",
  "demasiado.$",
]

[msg.section_0.entries.140]
text = [
  "Se cree que habitó las playas hace\\n",
  "300 millones de años. Se protege\\n",
  "con una dura concha.$",
]

[msg.section_0.entries.141]
text = [
  "Se cree que este Pokémon cambió de\\n",
  "hábitat y pasó del mar a la tierra\\n",
  "buscando nuevas presas.$",
]

[msg.section_0.entries.142]
text = [
  "Este Pokémon surcó los cielos\\n",
  "en la época de los dinosaurios.\\n",
  "Sus colmillos son muy afilados.$",
]

[msg.section_0.entries.143]
text = [
  "Cuando tiene la tripa llena, no puede\\n",
  "ni mover un dedo. En ese momento\\n",
  "de letargo, puedes saltar en su tripa.$",
]

[msg.section_0.entries.144]
text = [
  "Legendario Pokémon pájaro capaz\\n",
  "de generar ventiscas congelando\\n",
  "la humedad del aire.$",
]

[msg.section_0.entries.145]
text = [
  "Legendario Pokémon pájaro del que\\n",
  "se dice que vive en los nubarrones.\\n",
  "Controla los rayos eléctricos.$",
]

[msg.section_0.entries.146]
text = [
  "Uno de los legendarios Pokémon pájaro.\\n",
  "Dicen que su presencia anuncia\\n",
  "la llegada de la primavera.$",
]

[msg.section_0.entries.147]
text = [
  "Se le llama el Pokémon Espejismo\\n",
  "porque son muy pocos los que lo\\n",
  "han visto. Se encontró su muda.$",
]

[msg.section_0.entries.148]
text = [
  "Si su cuerpo está rodeado de un aura,\\n",
  "el tiempo cambia de repente.\\n",
  "Se dice que vive en mares y lagos.$",
]

[msg.section_0.entries.149]
text = [
  "Se dice que vive en algún lugar del mar.\\n",
  "Guía a las tripulaciones de los barcos\\n",
  "hundidos a la costa.$",
]

[msg.section_0.entries.150]
text = [
  "Pokémon creado por recombinación\\n",
  "genética de Mew. Se dice que es\\n",
  "el más salvaje de los Pokémon.$",
]

[msg.section_0.entries.151]
text = [
  "Varios científicos lo consideran\\n",
  "el antecesor de los Pokémon\\n",
  "porque usa todo tipo de movimientos.$",
]

[msg.section_0.entries.152]
text = [
  "Con la hoja de su cabeza puede medir\\n",
  "la temperatura y la humedad.\\n",
  "Le encanta tomar el sol.$",
]

[msg.section_0.entries.153]
text = [
  "Su cuello desprende un dulce aroma\\n",
  "que anima a quien lo huele.$",
]

[msg.section_0.entries.154]
text = [
  "Su aliento tiene la maravillosa capacidad\\n",
  "de revivir plantas y flores muertas.$",
]

[msg.section_0.entries.155]
text = [
  "Es un Pokémon muy tímido. Si se asusta,\\n",
  "las llamas de su lomo arden con más\\n",
  "fuerza.$",
]

[msg.section_0.entries.156]
text = [
  "Intimida a sus enemigos con el calor de\\n",
  "sus llamas. Arde con mayor fuerza\\n",
  "cuando va a luchar.$",
]

[msg.section_0.entries.157]
text = [
  "Ataca con llamaradas. Con ellas crea\\n",
  "reflejos de calor para ocultarse.$",
]

[msg.section_0.entries.158]
text = [
  "Tiene costumbre de morderlo todo\\n",
  "con sus poderosas fauces, incluso\\n",
  "Entrenadores.$",
]

[msg.section_0.entries.159]
text = [
  "Cuando muerde algo, no lo suelta hasta\\n",
  "que pierde sus colmillos. Estos se\\n",
  "regeneran rápidamente.$",
]

[msg.section_0.entries.160]
text = [
  "Se suele mover lento, pero alcanza\\n",
  "velocidades de vértigo al atacar y\\n",
  "morder a sus enemigos.$",
]

[msg.section_0.entries.161]
text = [
  "Es de naturaleza nerviosa. Se alza sobre\\n",
  "su cola para otear grandes extensiones.$",
]

[msg.section_0.entries.162]
text = [
  "Acurruca a sus crías para que duerman.\\n",
  "Acorrala a los enemigos con su enorme\\n",
  "velocidad.$",
]

[msg.section_0.entries.163]
text = [
  "Da la hora con gran exactitud.\\n",
  "En algunos países se le considera\\n",
  "toda una autoridad por su sabiduría.$",
]

[msg.section_0.entries.164]
text = [
  "Tiene los ojos muy desarrollados y\\n",
  "puede ver con increíble claridad\\n",
  "en la oscuridad más densa.$",
]

[msg.section_0.entries.165]
text = [
  "Es tan temeroso que no se mueve si no\\n",
  "es en grupo. Comunica sus sentimientos\\n",
  "con olores.$",
]

[msg.section_0.entries.166]
text = [
  "Se nutre de la luz de las estrellas.\\n",
  "Cuanto más estrellada es la noche,\\n",
  "más crecen los dibujos de su lomo.$",
]

[msg.section_0.entries.167]
text = [
  "Pone trampas tejiendo una red\\n",
  "de seda fina y resistente y luego\\n",
  "espera inmóvil a su presa.$",
]

[msg.section_0.entries.168]
text = [
  "Pega hilos de seda a sus presas y\\n",
  "las libera para seguirlas más tarde\\n",
  "y localizar también a sus amigos.$",
]

[msg.section_0.entries.169]
text = [
  "La transformación de sus patas traseras\\n",
  "en alas mejoró su vuelo, pero anda\\n",
  "muy mal.$",
]

[msg.section_0.entries.170]
text = [
  "Libera cargas eléctricas positivas y\\n",
  "negativas con sus antenas para\\n",
  "aturdir a sus enemigos.$",
]

[msg.section_0.entries.171]
text = [
  "La luz de Lanturn se puede ver\\n",
  "desde lo más profundo.\\n",
  "Se le llama la Estrella de Alta Mar.$",
]

[msg.section_0.entries.172]
text = [
  "Las bolsas de electricidad de sus\\n",
  "mejillas son muy pequeñas. La mínima\\n",
  "fuga le provoca una descarga.$",
]

[msg.section_0.entries.173]
text = [
  "Se le suele ver cuando el cielo se llena\\n",
  "de estrellas fugaces. Se dice que llega\\n",
  "montado en una de ellas.$",
]

[msg.section_0.entries.174]
text = [
  "Su cuerpo es suave y está hinchado.\\n",
  "Cuando empieza a botar, no puede parar.$",
]

[msg.section_0.entries.175]
text = [
  "Transforma la bondad y la alegría\\n",
  "de los demás en felicidad y\\n",
  "la almacena en su cascarón.$",
]

[msg.section_0.entries.176]
text = [
  "Para compartir su felicidad, vuela\\n",
  "por el mundo en busca de gente\\n",
  "de buen corazón.$",
]

[msg.section_0.entries.177]
text = [
  "Recoge alimento de los cactos evitando\\n",
  "los pinchos. Se mueve dando saltos.$",
]

[msg.section_0.entries.178]
text = [
  "Este extraño Pokémon puede ver\\n",
  "el pasado y el futuro. Se pasa\\n",
  "el día mirando al sol.$",
]

[msg.section_0.entries.179]
text = [
  "Su pelaje lanudo dobla su volumen\\n",
  "al acumular electricidad estática.\\n",
  "Tocarlo puede dar calambre.$",
]

[msg.section_0.entries.180]
text = [
  "Cuando su pelaje se carga de\\n",
  "electricidad, su cola se enciende.\\n",
  "Lanza pelo que explota al impacto.$",
]

[msg.section_0.entries.181]
text = [
  "La punta de su cola brilla. Antiguamente\\n",
  "la gente enviaba señales con ella.$",
]

[msg.section_0.entries.182]
text = [
  "Cuando acaba la estación de las lluvias,\\n",
  "sale al sol e inicia una peculiar danza.$",
]

[msg.section_0.entries.183]
text = [
  "No se ahoga ni en las corrientes más\\n",
  "fuertes porque la punta de su cola\\n",
  "está llena de aceite y flota.$",
]

[msg.section_0.entries.184]
text = [
  "Puede pasarse todo el día en el agua\\n",
  "porque puede tragar y almacenar\\n",
  "un gran volumen de aire.$",
]

[msg.section_0.entries.185]
text = [
  "Para evitar que le ataquen, se limita\\n",
  "a imitar un árbol. Odia el agua y\\n",
  "huye de la lluvia.$",
]

[msg.section_0.entries.186]
text = [
  "Agrupa a otros Pokémon para liderarlos.\\n",
  "Los Poliwag obedecen su voz.$",
]

[msg.section_0.entries.187]
text = [
  "Flotan en el aire. Se dice que, cuando\\n",
  "los Hoppip se reúnen, es que\\n",
  "la primavera está al caer.$",
]

[msg.section_0.entries.188]
text = [
  "Florece en épocas cálidas. Flota en el\\n",
  "aire para absorber toda la luz solar\\n",
  "que puede.$",
]

[msg.section_0.entries.189]
text = [
  "Los vientos estacionales lo llevan\\n",
  "por todo el mundo, donde suelta\\n",
  "sus esporas para reproducirse.$",
]

[msg.section_0.entries.190]
text = [
  "Vive en las copas de los árboles.\\n",
  "Puede usar su cola como si fuera\\n",
  "una mano más.$",
]

[msg.section_0.entries.191]
text = [
  "Cae de repente del cielo por las\\n",
  "mañanas. Los años de veranos\\n",
  "suaves, su número se multiplica.$",
]

[msg.section_0.entries.192]
text = [
  "Obtiene energía de la luz solar.\\n",
  "Este Pokémon es famoso por\\n",
  "su heliotropismo.$",
]

[msg.section_0.entries.193]
text = [
  "Puede mantenerse en un punto fijo\\n",
  "del aire agitando mucho las alas.\\n",
  "Vigila su territorio sobrevolándolo.$",
]

[msg.section_0.entries.194]
text = [
  "Cuando anda por la tierra, cubre su\\n",
  "cuerpo con una capa venenosa para\\n",
  "mantener hidratada su piel.$",
]

[msg.section_0.entries.195]
text = [
  "Es de naturaleza sencilla. Cuando\\n",
  "nada, se choca de cabeza contra\\n",
  "barcos o rocas y no le importa.$",
]

[msg.section_0.entries.196]
text = [
  "Su pelaje es tan sensible que puede\\n",
  "percibir cualquier cambio en el aire\\n",
  "y predecir el tiempo.$",
]

[msg.section_0.entries.197]
text = [
  "Si se expone al aura de la luna,\\n",
  "los anillos de su cuerpo relucen,\\n",
  "y adquiere un poder misterioso.$",
]

[msg.section_0.entries.198]
text = [
  "Si algún incauto logra detectarlo,\\n",
  "se verá abocado a perseguirlo\\n",
  "hasta perderse en las montañas.$",
]

[msg.section_0.entries.199]
text = [
  "Al ser mordido por un Shellder,\\n",
  "desarrolló una inteligencia propia\\n",
  "de un ganador del premio Nobel.$",
]

[msg.section_0.entries.200]
text = [
  "Sorprende a la gente en mitad\\n",
  "de la noche y acumula su miedo\\n",
  "como energía.$",
]

[msg.section_0.entries.201]
text = [
  "Si están en solitario, no pasa nada;\\n",
  "pero si se juntan dos o más, se\\n",
  "dice que surge un extraño poder.$",
]

[msg.section_0.entries.202]
text = [
  "Siempre intenta ocultar su cola,\\n",
  "por lo que muchos creen que\\n",
  "contiene un secreto.$",
]

[msg.section_0.entries.203]
text = [
  "La cabeza de su cola también tiene\\n",
  "un pequeño cerebro, así que puede\\n",
  "combatir por delante o por detrás.$",
]

[msg.section_0.entries.204]
text = [
  "Es como una piña piñonera. Su\\n",
  "coraza lo protege de los pájaros\\n",
  "que lo picotean por error.$",
]

[msg.section_0.entries.205]
text = [
  "Se protege con su concha de acero\\n",
  "de tal manera que solo se pueden\\n",
  "ver sus ojos.$",
]

[msg.section_0.entries.206]
text = [
  "Cava el suelo con su cola para\\n",
  "construir su madriguera. Puede\\n",
  "volar distancias cortas.$",
]

[msg.section_0.entries.207]
text = [
  "Se desliza y sorprende a sus enemigos\\n",
  "lanzándose directamente a la cara para\\n",
  "clavarles su aguijón.$",
]

[msg.section_0.entries.208]
text = [
  "Se cree que su cuerpo se ha ido\\n",
  "transformando desde dentro por el\\n",
  "hierro que acumula comiendo tierra.$",
]

[msg.section_0.entries.209]
text = [
  "Los Pokémon pequeños huyen al\\n",
  "ver su cara agresiva. No obstante,\\n",
  "para muchas féminas es mono.$",
]

[msg.section_0.entries.210]
text = [
  "A pesar de su aspecto, es muy\\n",
  "tímido. Sin embargo, cuando se\\n",
  "enfada, ataca con sus colmillos.$",
]

[msg.section_0.entries.211]
text = [
  "Lanza púas venenosas en todas\\n",
  "direcciones. Debido a su forma\\n",
  "redonda, es muy mal nadador.$",
]

[msg.section_0.entries.212]
text = [
  "Intimida a los enemigos con los\\n",
  "dibujos de ojos de sus pinzas,\\n",
  "que agita amenazadoramente.$",
]

[msg.section_0.entries.213]
text = [
  "Almacena bayas en su caparazón,\\n",
  "que más tarde fermentan para\\n",
  "producir deliciosos zumos.$",
]

[msg.section_0.entries.214]
text = [
  "Le encanta la miel y usa su cuerno\\n",
  "para voltear a cualquiera que se\\n",
  "acerque a ella.$",
]

[msg.section_0.entries.215]
text = [
  "Es muy inteligente. Se empareja\\n",
  "para robar huevos: uno distrae a\\n",
  "los padres, y el otro se los lleva.$",
]

[msg.section_0.entries.216]
text = [
  "Deja que la miel se le pegue a las\\n",
  "garras para lamerla más tarde.\\n",
  "Cada una de ellas sabe diferente.$",
]

[msg.section_0.entries.217]
text = [
  "Marca con arañazos los árboles de\\n",
  "su territorio que dan bayas y frutas.$",
]

[msg.section_0.entries.218]
text = [
  "Su cuerpo se compone de magma.\\n",
  "Si deja de moverse, se enfría y\\n",
  "se endurece.$",
]

[msg.section_0.entries.219]
text = [
  "Su cuerpo está a una temperatura\\n",
  "de 10 000°. De las fisuras de su\\n",
  "cuerpo escapan llamas.$",
]

[msg.section_0.entries.220]
text = [
  "Tiene una nariz muy sensible. Puede\\n",
  "localizar setas, bayas y hasta aguas\\n",
  "termales bajo el hielo.$",
]

[msg.section_0.entries.221]
text = [
  "Su tupido pelaje le protege del\\n",
  "frío. Sus colmillos de hielo se\\n",
  "endurecen cuando nieva.$",
]

[msg.section_0.entries.222]
text = [
  "Muchos viven en los cristalinos\\n",
  "mares del sur. Son incapaces\\n",
  "de vivir en aguas contaminadas.$",
]

[msg.section_0.entries.223]
text = [
  "Escupe potentes chorros de agua\\n",
  "que siempre dan en el blanco,\\n",
  "incluso en la profundidad del mar.$",
]

[msg.section_0.entries.224]
text = [
  "Le gusta acechar desde agujeros\\n",
  "en las rocas. Escupe tinta a sus\\n",
  "presas asomando solo la boca.$",
]

[msg.section_0.entries.225]
text = [
  "Lleva alimentos en su saco. Le\\n",
  "gusta compartir su comida con\\n",
  "los montañistas perdidos.$",
]

[msg.section_0.entries.226]
text = [
  "Nada con gran elegancia e ignora a\\n",
  "los Remoraid que se aferran a sus\\n",
  "aletas buscando restos de comida.$",
]

[msg.section_0.entries.227]
text = [
  "Una armadura de hierro cubre por\\n",
  "completo su cuerpo. Vuela a más\\n",
  "de 300 km/h.$",
]

[msg.section_0.entries.228]
text = [
  "Tiene suficiente inteligencia para\\n",
  "cazar en manada. Se comunica\\n",
  "con los demás a través de gritos.$",
]

[msg.section_0.entries.229]
text = [
  "Las llamas que respira cuando se\\n",
  "enfada contienen toxinas. Si causan\\n",
  "una quemadura, dolerá toda la vida.$",
]

[msg.section_0.entries.230]
text = [
  "Vive en cavernas del fondo marino\\n",
  "y crea grandes remolinos cuando\\n",
  "se mueve.$",
]

[msg.section_0.entries.231]
text = [
  "A pesar de su tamaño reducido,\\n",
  "es tan fuerte que puede llevar a un\\n",
  "humano a su espalda con facilidad.$",
]

[msg.section_0.entries.232]
text = [
  "Se enrolla sobre sí mismo y se\\n",
  "lanza rodando contra el enemigo.\\n",
  "Puede derribar casas de un golpe.$",
]

[msg.section_0.entries.233]
text = [
  "Fue mejorado para posibilitar\\n",
  "la exploración de otros planetas.\\n",
  "Pero no estaba a la altura.$",
]

[msg.section_0.entries.234]
text = [
  "Mirar a su cornamenta provoca\\n",
  "una extraña sensación de\\n",
  "pérdida de equilibrio.$",
]

[msg.section_0.entries.235]
text = [
  "Marca su territorio usando su cola\\n",
  "a modo de pincel. Ha hecho más\\n",
  "de 5000 marcas diferentes.$",
]

[msg.section_0.entries.236]
text = [
  "Famoso por su disposición a la\\n",
  "lucha. Siempre tiene heridas por\\n",
  "luchar con enemigos más grandes.$",
]

[msg.section_0.entries.237]
text = [
  "Gira a gran velocidad al luchar.\\n",
  "La fuerza centrífuga multiplica\\n",
  "su poder de destrucción por diez.$",
]

[msg.section_0.entries.238]
text = [
  "Analiza todo tocándolo con los\\n",
  "labios. Así puede recordar las\\n",
  "cosas que le gustan y disgustan.$",
]

[msg.section_0.entries.239]
text = [
  "Entre sus cuernos pasa una débil\\n",
  "corriente eléctrica. Quien ponga\\n",
  "ahí la mano se dará un calambrazo.$",
]

[msg.section_0.entries.240]
text = [
  "Su sangre es como magma y su\\n",
  "temperatura corporal puede\\n",
  "alcanzar los 600°.$",
]

[msg.section_0.entries.241]
text = [
  "Se dice que, si un niño bebe leche\\n",
  "de Miltank, crecerá y se convertirá\\n",
  "en un adulto sano y campechano.$",
]

[msg.section_0.entries.242]
text = [
  "Los huevos que pone están llenos\\n",
  "de felicidad. Solo con probar un\\n",
  "poquito de uno, cualquiera sonríe.$",
]

[msg.section_0.entries.243]
text = [
  "Dicen que apareció con un relámpago.\\n",
  "Puede lanzar rayos desde las nubes\\n",
  "de su lomo.$",
]

[msg.section_0.entries.244]
text = [
  "Se dice que, cuando ruge, un volcán\\n",
  "entra en erupción en algún punto\\n",
  "del globo.$",
]

[msg.section_0.entries.245]
text = [
  "Recorre el mundo para purificar agua\\n",
  "contaminada. Corre veloz con el viento\\n",
  "del norte.$",
]

[msg.section_0.entries.246]
text = [
  "Este Pokémon come tierra. Cuando se\\n",
  "come una montaña, se echa a dormir\\n",
  "para crecer.$",
]

[msg.section_0.entries.247]
text = [
  "Su cuerpo es duro como la roca.\\n",
  "Se autopropulsa como un cohete\\n",
  "soltando los gases de su interior.$",
]

[msg.section_0.entries.248]
text = [
  "Puede alterar el paisaje derribando\\n",
  "montañas y enterrando ríos. Da\\n",
  "mucho trabajo a los cartógrafos.$",
]

[msg.section_0.entries.249]
text = [
  "Duerme en una dorsal marina.\\n",
  "Si bate sus alas, puede causar\\n",
  "tormentas de 40 días.$",
]

[msg.section_0.entries.250]
text = [
  "Su plumaje tiene siete colores.\\n",
  "Se dice que verlo proporciona\\n",
  "felicidad eterna.$",
]

[msg.section_0.entries.251]
text = [
  "Puede viajar en el tiempo, pero se dice\\n",
  "que solo aparece en tiempos de paz.$",
]

[msg.section_0.entries.252]
text = [
  "Las plantas de sus pies tienen\\n",
  "púas diminutas que le permiten\\n",
  "andar por paredes y techos.$",
]

[msg.section_0.entries.253]
text = [
  "Vive en selvas frondosas. Salta de\\n",
  "rama en rama para acercarse a\\n",
  "sus presas.$",
]

[msg.section_0.entries.254]
text = [
  "Las hojas de sus brazos pueden\\n",
  "cortar gruesos árboles. Invencible\\n",
  "en los combates en la jungla.$",
]

[msg.section_0.entries.255]
text = [
  "En su interior arde una llama que\\n",
  "mantiene su cuerpo caliente.\\n",
  "Tira bolas de fuego a 1000°.$",
]

[msg.section_0.entries.256]
text = [
  "Su habilidad le permite dar diez patadas\\n",
  "por segundo. Lanza potentes gritos\\n",
  "para intimidar.$",
]

[msg.section_0.entries.257]
text = [
  "Sus puños están envueltos en llamas.\\n",
  "Con sus golpes puede quemar a sus\\n",
  "rivales.$",
]

[msg.section_0.entries.258]
text = [
  "La aleta de su cabeza detecta las\\n",
  "corrientes de agua y los peligros.\\n",
  "Tiene fuerza para levantar rocas.$",
]

[msg.section_0.entries.259]
text = [
  "Sus piernas robustas impiden que\\n",
  "pierda el equilibrio y caiga, incluso\\n",
  "en el barro. Duerme bajo la arena.$",
]

[msg.section_0.entries.260]
text = [
  "Puede nadar y arrastrar un barco\\n",
  "grande. Golpea a sus enemigos\\n",
  "con sus gruesos brazos.$",
]

[msg.section_0.entries.261]
text = [
  "Es muy persistente. Si se fija en\\n",
  "una presa, no la dejará hasta que\\n",
  "caiga agotada.$",
]

[msg.section_0.entries.262]
text = [
  "Ataca a sus presas en manada.\\n",
  "Nunca desobedece las órdenes\\n",
  "de un Entrenador avezado.$",
]

[msg.section_0.entries.263]
text = [
  "Se mueve en zigzag. Se le da bien\\n",
  "encontrar objetos ocultos en la hierba\\n",
  "e incluso enterrados.$",
]

[msg.section_0.entries.264]
text = [
  "Carga contra sus enemigos a más\\n",
  "de 100 km/h. Como solo va en línea\\n",
  "recta, falla a menudo.$",
]

[msg.section_0.entries.265]
text = [
  "Es el blanco favorito de muchos\\n",
  "Pokémon pájaro. Se defiende con\\n",
  "el veneno de las púas de su cola.$",
]

[msg.section_0.entries.266]
text = [
  "Se agarra con su seda a las ramas\\n",
  "de un árbol y espera su evolución\\n",
  "bebiendo agua de lluvia.$",
]

[msg.section_0.entries.267]
text = [
  "Aunque no lo parece, es un Pokémon\\n",
  "agresivo. Si se le molesta cuando\\n",
  "recoge polen, atacará.$",
]

[msg.section_0.entries.268]
text = [
  "Jamás olvida a quienes lo atacaron\\n",
  "mientras estaba en su capullo.\\n",
  "Cuando evoluciona, busca venganza.$",
]

[msg.section_0.entries.269]
text = [
  "Bate las alas para esparcir polvo\\n",
  "tóxico. De noche se come las hojas\\n",
  "de los árboles de las avenidas.$",
]

[msg.section_0.entries.270]
text = [
  "Parece una planta acuática. Hace\\n",
  "de ferry para los Pokémon que no\\n",
  "saben nadar.$",
]

[msg.section_0.entries.271]
text = [
  "Tiene carácter travieso. Si ve\\n",
  "un pescador, tira del anzuelo\\n",
  "para confundirlo.$",
]

[msg.section_0.entries.272]
text = [
  "Cuando oye música alegre, sus\\n",
  "músculos se llenan de energía, y\\n",
  "no puede evitar ponerse a bailar.$",
]

[msg.section_0.entries.273]
text = [
  "Cuando cuelga de las ramas,\\n",
  "parece una bellota. Le encanta\\n",
  "asustar a otros Pokémon.$",
]

[msg.section_0.entries.274]
text = [
  "Cuando usa la hoja de su cabeza\\n",
  "como flauta, asusta a la gente. Vive\\n",
  "en lo más profundo de los bosques.$",
]

[msg.section_0.entries.275]
text = [
  "Con sus abanicos puede provocar\\n",
  "vientos de 30 m/s capaces de\\n",
  "levantar casas.$",
]

[msg.section_0.entries.276]
text = [
  "Es un Pokémon valiente que no\\n",
  "teme a los rivales fuertes. Vuela\\n",
  "en busca de climas templados.$",
]

[msg.section_0.entries.277]
text = [
  "Vuela en círculos en busca de presas.\\n",
  "Cuando ve una, se lanza sin dudarlo.$",
]

[msg.section_0.entries.278]
text = [
  "Aprovecha las corrientes ascendentes\\n",
  "para ganar altura. Suele llevar comida\\n",
  "en el pico.$",
]

[msg.section_0.entries.279]
text = [
  "Transporta a pequeños Pokémon y\\n",
  "huevos en su pico hasta lugares\\n",
  "seguros.$",
]

[msg.section_0.entries.280]
text = [
  "Si sus cuernos perciben emociones\\n",
  "positivas de personas o Pokémon,\\n",
  "su cuerpo se calienta un poco.$",
]

[msg.section_0.entries.281]
text = [
  "Si su Entrenador está contento,\\n",
  "se llena de energía y baila de\\n",
  "forma alegre dando giros.$",
]

[msg.section_0.entries.282]
text = [
  "Para proteger a su Entrenador,\\n",
  "emplea todo su poder psíquico en\\n",
  "crear un pequeño agujero negro.$",
]

[msg.section_0.entries.283]
text = [
  "Parece que patina sobre el agua.\\n",
  "Atrae a las presas con el suave\\n",
  "aroma de su cabeza.$",
]

[msg.section_0.entries.284]
text = [
  "Sus antenas tienen dibujos de ojos,\\n",
  "mientras que sus alas le permiten\\n",
  "volar en cualquier dirección.$",
]

[msg.section_0.entries.285]
text = [
  "Lanza esporas venenosas desde\\n",
  "la parte superior de la cabeza.\\n",
  "Inhalarlas es muy doloroso.$",
]

[msg.section_0.entries.286]
text = [
  "Sus cortos brazos se expanden\\n",
  "cuando da puñetazos. Tiene una\\n",
  "técnica pugilística muy depurada.$",
]

[msg.section_0.entries.287]
text = [
  "Pasa la mayor parte del día\\n",
  "repanchingado. Entra sueño\\n",
  "solo de verlo.$",
]

[msg.section_0.entries.288]
text = [
  "Su corazón late a un ritmo diez\\n",
  "veces más rápido de lo normal.\\n",
  "No se está quieto ni un instante.$",
]

[msg.section_0.entries.289]
text = [
  "El Pokémon más perezoso del\\n",
  "mundo. Si está tumbado, es que\\n",
  "reúne fuerzas para contraatacar.$",
]

[msg.section_0.entries.290]
text = [
  "Crece bajo tierra y explora el entorno\\n",
  "con sus antenas porque casi no ve\\n",
  "con sus ojos.$",
]

[msg.section_0.entries.291]
text = [
  "Se mueve tan rápido que a veces\\n",
  "resulta invisible. Le atrae la savia\\n",
  "de los árboles.$",
]

[msg.section_0.entries.292]
text = [
  "Es el caparazón de un bicho que\\n",
  "cobró vida. Si alguien lo mira por\\n",
  "la espalda, le robará el alma.$",
]

[msg.section_0.entries.293]
text = [
  "Suele murmurar a un volumen casi\\n",
  "inaudible, pero cuando se asusta\\n",
  "grita con el volumen de un reactor.$",
]

[msg.section_0.entries.294]
text = [
  "Las ondas de sus gritos pueden\\n",
  "voltear un camión. Patea el suelo\\n",
  "para ganar potencia.$",
]

[msg.section_0.entries.295]
text = [
  "Su aullido se puede oír a 10 km.\\n",
  "Emite todo tipo de sonidos desde\\n",
  "los tubos de su cuerpo.$",
]

[msg.section_0.entries.296]
text = [
  "Endurece su cuerpo golpeando grandes\\n",
  "árboles. Cerca de su hogar suele haber\\n",
  "árboles golpeados.$",
]

[msg.section_0.entries.297]
text = [
  "Le encanta enfrentarse a Pokémon\\n",
  "grandes y probar su fuerza. Sus\\n",
  "brazos pueden derribar un camión.$",
]

[msg.section_0.entries.298]
text = [
  "Su cola rebota como una pelota.\\n",
  "Para luchar contra enemigos más\\n",
  "grandes, la agita en el aire.$",
]

[msg.section_0.entries.299]
text = [
  "Se protege del peligro aumentando\\n",
  "su magnetismo y atrayendo objetos\\n",
  "de hierro hacia sí.$",
]

[msg.section_0.entries.300]
text = [
  "No puede evitar ir tras las cosas\\n",
  "que se mueven. Hasta corre en\\n",
  "círculos persiguiéndose la cola.$",
]

[msg.section_0.entries.301]
text = [
  "Tiene mucho éxito entre las\\n",
  "Entrenadoras por su suave pelaje.\\n",
  "No vive en un sitio fijo.$",
]

[msg.section_0.entries.302]
text = [
  "Se oculta en cavernas oscuras.\\n",
  "De tanto comer gemas, sus ojos\\n",
  "son piedras preciosas.$",
]

[msg.section_0.entries.303]
text = [
  "Las grandes fauces de su cabeza\\n",
  "están formadas por cuernos.\\n",
  "Puede romper el hierro con ellas.$",
]

[msg.section_0.entries.304]
text = [
  "Suele vivir en lugares inaccesibles\\n",
  "de las montañas, pero el hambre\\n",
  "lo empuja a comer raíles y coches.$",
]

[msg.section_0.entries.305]
text = [
  "Extrae hierro para alimentarse\\n",
  "y usa su cuerpo de acero para\\n",
  "luchar y conseguir territorio.$",
]

[msg.section_0.entries.306]
text = [
  "Mientras busca hierro para comer,\\n",
  "excava túneles en la roca con sus\\n",
  "potentes cuernos de acero.$",
]

[msg.section_0.entries.307]
text = [
  "Se entrena en la profundidad de las\\n",
  "montañas. Cuando aumenta su poder\\n",
  "espiritual con meditación, levita.$",
]

[msg.section_0.entries.308]
text = [
  "Cuando ayuna, adquiere la habilidad\\n",
  "de ver el aura de sus adversarios.$",
]

[msg.section_0.entries.309]
text = [
  "Estimula sus músculos y aumenta\\n",
  "sus reflejos con la electricidad\\n",
  "que almacena su pelaje.$",
]

[msg.section_0.entries.310]
text = [
  "Descarga electricidad desde su\\n",
  "melena. Crea nubarrones desde\\n",
  "los que lanza rayos.$",
]

[msg.section_0.entries.311]
text = [
  "Anima a sus compañeros con\\n",
  "pompones de chispas. Roba\\n",
  "energía de los postes telefónicos.$",
]

[msg.section_0.entries.312]
text = [
  "Le gusta animar a sus amigos.\\n",
  "Si pierden, su cuerpo suelta\\n",
  "cada vez más chispas.$",
]

[msg.section_0.entries.313]
text = [
  "Se comunica con otros iluminando\\n",
  "su cola por la noche. Le encanta\\n",
  "el suave aroma de Illumise.$",
]

[msg.section_0.entries.314]
text = [
  "Su suave aroma guía a Volbeat\\n",
  "para que haga señales luminosas\\n",
  "en el cielo nocturno.$",
]

[msg.section_0.entries.315]
text = [
  "Si goza de mejor salud, el aroma\\n",
  "de sus flores será más agradable.\\n",
  "Es un aroma que relaja a la gente.$",
]

[msg.section_0.entries.316]
text = [
  "Casi todo su cuerpo es estómago.\\n",
  "Sus potentes jugos gástricos\\n",
  "disuelven rápido cualquier cosa.$",
]

[msg.section_0.entries.317]
text = [
  "Se traga cualquier cosa de una\\n",
  "pieza. Sus poros segregan fluidos\\n",
  "tóxicos que dañan a sus enemigos.$",
]

[msg.section_0.entries.318]
text = [
  "Rodean a los enemigos que osan\\n",
  "invadir su territorio. Sus afilados\\n",
  "colmillos dañan los barcos.$",
]

[msg.section_0.entries.319]
text = [
  "Con sus colmillos puede atravesar\\n",
  "el acero. Nada a 120 km/h.\\n",
  "Le llaman el Terror de los Mares.$",
]

[msg.section_0.entries.320]
text = [
  "En días soleados se tumba en las playas\\n",
  "para jugar y botar como una pelota.\\n",
  "Lanza agua por la nariz.$",
]

[msg.section_0.entries.321]
text = [
  "Es el más grande de los Pokémon.\\n",
  "Puede nadar a una profundidad de\\n",
  "3000 m aguantando la respiración.$",
]

[msg.section_0.entries.322]
text = [
  "En su joroba almacena magma ardiente\\n",
  "que se enfría cuando llueve\\n",
  "y lo ralentiza.$",
]

[msg.section_0.entries.323]
text = [
  "Tiene volcanes en el lomo. Si el\\n",
  "magma se acumula en su cuerpo,\\n",
  "se sacude y estalla con violencia.$",
]

[msg.section_0.entries.324]
text = [
  "Quema carbón en su caparazón\\n",
  "para obtener energía. Si le atacan,\\n",
  "echa un denso humo negro.$",
]

[msg.section_0.entries.325]
text = [
  "Bota continuamente usando su cola\\n",
  "como muelle. Salta para mantener\\n",
  "el latido de su corazón.$",
]

[msg.section_0.entries.326]
text = [
  "Usa perlas negras para potenciar\\n",
  "sus poderes psíquicos. Con su\\n",
  "raro baile controla a los rivales.$",
]

[msg.section_0.entries.327]
text = [
  "No hay dos Spinda que tengan\\n",
  "idénticos pelajes. Su tambaleo\\n",
  "al bailar confunde a los rivales.$",
]

[msg.section_0.entries.328]
text = [
  "Cava fosas cóncavas en el desierto\\n",
  "y espera en el fondo a que las\\n",
  "presas caigan en ellas.$",
]

[msg.section_0.entries.329]
text = [
  "Agita violentamente sus alas para\\n",
  "crear ondas ultrasónicas que\\n",
  "provocan dolores de cabeza.$",
]

[msg.section_0.entries.330]
text = [
  "Levanta tormentas de arena con\\n",
  "sus alas. Se le conoce como\\n",
  "el Alma del Desierto.$",
]

[msg.section_0.entries.331]
text = [
  "Habita en el desierto. Aguanta 30 días\\n",
  "sin agua gracias a la que almacena\\n",
  "en su cuerpo.$",
]

[msg.section_0.entries.332]
text = [
  "Es un Pokémon nocturno. Busca\\n",
  "presas agotadas por el calor\\n",
  "diurno del desierto.$",
]

[msg.section_0.entries.333]
text = [
  "Si su cuerpo o su entorno no están\\n",
  "limpios, no puede relajarse. Utiliza\\n",
  "sus alas para limpiar la suciedad.$",
]

[msg.section_0.entries.334]
text = [
  "Si establece un vínculo con una persona,\\n",
  "la envuelve con sus alas y le canta\\n",
  "en susurros.$",
]

[msg.section_0.entries.335]
text = [
  "Hace muchos años que se enfrenta\\n",
  "a Seviper. Su arma más eficaz son\\n",
  "sus zarpas afiladas.$",
]

[msg.section_0.entries.336]
text = [
  "Se ha enfrentado durante muchos\\n",
  "años a Zangoose. Usa rocas para\\n",
  "mantener afilada su cola.$",
]

[msg.section_0.entries.337]
text = [
  "Se piensa que está muy influido\\n",
  "por las fases lunares, ya que solo\\n",
  "actúa en noches de luna llena.$",
]

[msg.section_0.entries.338]
text = [
  "Una nueva especie de Pokémon\\n",
  "que se rumorea procede del Sol.\\n",
  "Emite luz al girar.$",
]

[msg.section_0.entries.339]
text = [
  "Su escurridizo cuerpo es difícil de\\n",
  "agarrar. En cierta región se dice\\n",
  "que ha nacido de barro endurecido.$",
]

[msg.section_0.entries.340]
text = [
  "Protege su territorio por encima\\n",
  "de todo. Si se acerca un enemigo,\\n",
  "ataca con violentas sacudidas.$",
]

[msg.section_0.entries.341]
text = [
  "Su organismo le permite adaptarse\\n",
  "a cualquier entorno. Sus pinzas\\n",
  "nunca sueltan a su presa.$",
]

[msg.section_0.entries.342]
text = [
  "Este malandrín usa sus pinzas para\\n",
  "atosigar y expulsar a los otros\\n",
  "Pokémon que viven en su estanque.$",
]

[msg.section_0.entries.343]
text = [
  "Se mueve girando sobre su eje.\\n",
  "Es un extraño Pokémon que fue\\n",
  "encontrado en unas viejas ruinas.$",
]

[msg.section_0.entries.344]
text = [
  "Este Pokémon es una vieja figurilla\\n",
  "de barro que cobró vida mediante la\\n",
  "exposición a extraños rayos de luz.$",
]

[msg.section_0.entries.345]
text = [
  "Vivió en los fondos marinos hace\\n",
  "unos 100 millones de años y fue\\n",
  "recreado científicamente.$",
]

[msg.section_0.entries.346]
text = [
  "Vive en el fondo de los mares de aguas\\n",
  "templadas. Emerge para cazar cuando\\n",
  "baja la marea.$",
]

[msg.section_0.entries.347]
text = [
  "Este Pokémon fue recreado a partir\\n",
  "de restos fósiles. Vivía en el mar y\\n",
  "cazaba con sus pinzas.$",
]

[msg.section_0.entries.348]
text = [
  "Tras evolucionar, este Pokémon fue\\n",
  "a tierra firme. Una dura coraza\\n",
  "protege todo su cuerpo.$",
]

[msg.section_0.entries.349]
text = [
  "Su apariencia deja bastante que\\n",
  "desear, pero es muy resistente y\\n",
  "puede sobrevivir con poca agua.$",
]

[msg.section_0.entries.350]
text = [
  "Sus preciosas escamas tienen todos\\n",
  "los colores del arcoíris y cambian\\n",
  "de color según el ángulo de visión.$",
]

[msg.section_0.entries.351]
text = [
  "La meteorología determina su\\n",
  "aspecto. Hace poco se ha sabido\\n",
  "que sus células son como el agua.$",
]

[msg.section_0.entries.352]
text = [
  "Puede mudar el color de su cuerpo\\n",
  "a voluntad, pero el dibujo en zigzag\\n",
  "de su panza nunca desaparece.$",
]

[msg.section_0.entries.353]
text = [
  "Les atraen los sentimientos de\\n",
  "rencor y celos. Suelen vivir cerca\\n",
  "de las casas de gente vengativa.$",
]

[msg.section_0.entries.354]
text = [
  "Este muñeco se convirtió en un Pokémon\\n",
  "cuando lo tiraron a la basura.\\n",
  "Busca a su antiguo dueño.$",
]

[msg.section_0.entries.355]
text = [
  "Le encanta atravesar paredes\\n",
  "para asustar a los niños malos\\n",
  "y hacerles llorar.$",
]

[msg.section_0.entries.356]
text = [
  "Busca fuegos fatuos y los absorbe\\n",
  "con su cuerpo hueco. Lo que pasa\\n",
  "dentro luego es un misterio.$",
]

[msg.section_0.entries.357]
text = [
  "Como solo comía un tipo de fruta,\\n",
  "al final acabó creciéndole en el\\n",
  "cuello.$",
]

[msg.section_0.entries.358]
text = [
  "Sus gritos resuenan en su cuerpo\\n",
  "hueco y emergen como hermosas\\n",
  "notas que aturden a los enemigos.$",
]

[msg.section_0.entries.359]
text = [
  "Cuando se supo que presentía los\\n",
  "desastres con su cuerno, tuvo que\\n",
  "buscar refugio en las montañas.$",
]

[msg.section_0.entries.360]
text = [
  "Se fortalecen empujándose unos\\n",
  "a otros en grupos. Les encantan\\n",
  "los dulces.$",
]

[msg.section_0.entries.361]
text = [
  "Se dice que se reúnen en grupos\\n",
  "bajo hojas gigantescas y viven\\n",
  "allí en total armonía.$",
]

[msg.section_0.entries.362]
text = [
  "Impide que sus presas se escapen\\n",
  "congelando la humedad del aire en\\n",
  "un instante.$",
]

[msg.section_0.entries.363]
text = [
  "Rueda por los témpanos de hielo\\n",
  "hasta la orilla, ya que su cuerpo\\n",
  "no está bien adaptado para nadar.$",
]

[msg.section_0.entries.364]
text = [
  "Suele hacer girar objetos en su nariz.\\n",
  "De esta forma aprende texturas\\n",
  "y olores.$",
]

[msg.section_0.entries.365]
text = [
  "Rompe el hielo con sus colmillos.\\n",
  "Su gruesa capa de grasa le protege\\n",
  "del frío y de los enemigos.$",
]

[msg.section_0.entries.366]
text = [
  "Durante toda su vida, crea una\\n",
  "sola perla que, según se dice,\\n",
  "aumenta los poderes psíquicos.$",
]

[msg.section_0.entries.367]
text = [
  "Vive en los fondos marinos.\\n",
  "Atrae a sus confiadas presas con\\n",
  "la cola, que tiene forma de pez.$",
]

[msg.section_0.entries.368]
text = [
  "Vive en el fondo del mar. En\\n",
  "primavera, su cuerpo rosado\\n",
  "adquiere colores más vivos.$",
]

[msg.section_0.entries.369]
text = [
  "Un Pokémon raro descubierto en una\\n",
  "exploración marina. No ha cambiado\\n",
  "en más de 100 millones de años.$",
]

[msg.section_0.entries.370]
text = [
  "Vive en mares cálidos. Se dice\\n",
  "que, si una pareja lo encuentra,\\n",
  "será bendecida con amor eterno.$",
]

[msg.section_0.entries.371]
text = [
  "Sueña con volar algún día, por lo que\\n",
  "siempre practica saltando desde\\n",
  "acantilados.$",
]

[msg.section_0.entries.372]
text = [
  "Las células han empezado a cambiar\\n",
  "dentro de su dura concha, que se\\n",
  "separa cuando evoluciona.$",
]

[msg.section_0.entries.373]
text = [
  "Siempre soñó con volar, por lo que\\n",
  "su estructura celular cambió y le\\n",
  "crecieron alas.$",
]

[msg.section_0.entries.374]
text = [
  "Se comunican mediante pulsos\\n",
  "magnéticos. Cuando van en\\n",
  "grupos, se mueven al unísono.$",
]

[msg.section_0.entries.375]
text = [
  "Lo forman dos Beldum unidos. Puede\\n",
  "chocarse con un avión sin que su\\n",
  "cuerpo de acero sufra ni un rasguño.$",
]

[msg.section_0.entries.376]
text = [
  "Está formado por varios Metang.\\n",
  "Con cuatro cerebros, tiene la\\n",
  "inteligencia de un superordenador.$",
]

[msg.section_0.entries.377]
text = [
  "Su cuerpo está hecho de roca.\\n",
  "Si se astilla durante el combate,\\n",
  "emplea piedras para repararlo.$",
]

[msg.section_0.entries.378]
text = [
  "Su cuerpo está hecho con hielo\\n",
  "de la glaciación. Controla aire\\n",
  "gélido a 200° bajo cero.$",
]

[msg.section_0.entries.379]
text = [
  "Su cuerpo ha estado sometido a la\\n",
  "presión subterránea durante miles\\n",
  "de años y no puede arañarse.$",
]

[msg.section_0.entries.380]
text = [
  "Su cuerpo está cubierto de un plumón\\n",
  "que refleja la luz de forma que se\\n",
  "vuelve invisible.$",
]

[msg.section_0.entries.381]
text = [
  "Es un Pokémon muy inteligente. Puede\\n",
  "adelantar a aviones a reacción plegando\\n",
  "las alas.$",
]

[msg.section_0.entries.382]
text = [
  "Se dice que aumentó el nivel del mar\\n",
  "a base de aguaceros. Ha estado\\n",
  "durmiendo en una fosa marina.$",
]

[msg.section_0.entries.383]
text = [
  "Ha estado durmiendo en magma\\n",
  "subterráneo desde que luchó\\n",
  "contra Kyogre en tiempos remotos.$",
]

[msg.section_0.entries.384]
text = [
  "Vive en la capa de ozono sobre las nubes\\n",
  "y no puede ser visto desde el suelo.$",
]

[msg.section_0.entries.385]
text = [
  "Se dice que puede otorgar cualquier\\n",
  "deseo durante una semana cada\\n",
  "1000 años.$",
]

[msg.section_0.entries.386]
text = [
  "Surgió a raíz de la mutación de\\n",
  "ADN de un virus alienígena que\\n",
  "cayó a la Tierra en un meteorito.$",
]

[msg.section_0.entries.387]
text = [
  "La concha de su espalda es de\\n",
  "tierra. Si está sano, la concha de\\n",
  "Turtwig debería estar húmeda.$",
]

[msg.section_0.entries.388]
text = [
  "Sabe dónde encontrar manantiales\\n",
  "de agua pura y lleva a los Pokémon\\n",
  "amigos hasta allí en su lomo.$",
]

[msg.section_0.entries.389]
text = [
  "Algunos Pokémon nacen en la espalda\\n",
  "de un Torterra y pasan allí toda su vida.$",
]

[msg.section_0.entries.390]
text = [
  "Es muy ágil. Antes de dormir apaga\\n",
  "la llama de su cola para no\\n",
  "provocar un incendio.$",
]

[msg.section_0.entries.391]
text = [
  "Controla hábilmente la intensidad\\n",
  "del fuego de su cola para mantener\\n",
  "al enemigo a una distancia ideal.$",
]

[msg.section_0.entries.392]
text = [
  "Utiliza movimientos de combate\\n",
  "únicos con fuego en manos y pies.\\n",
  "Se enfrenta a cualquier enemigo.$",
]

[msg.section_0.entries.393]
text = [
  "No se le da bien lo de andar, se cae\\n",
  "mucho. Pero su orgullo le hace\\n",
  "sacar pecho como si nada.$",
]

[msg.section_0.entries.394]
text = [
  "Como cada uno se considera\\n",
  "el más importante, jamás\\n",
  "podrán formar un grupo.$",
]

[msg.section_0.entries.395]
text = [
  "Si alguien hiere su orgullo, le desgarra\\n",
  "con unas alas que podrían cortar\\n",
  "un témpano de hielo.$",
]

[msg.section_0.entries.396]
text = [
  "Son débiles individualmente, por eso\\n",
  "forman grupos. Pero, si el grupo\\n",
  "crece demasiado, se pelean.$",
]

[msg.section_0.entries.397]
text = [
  "Son conscientes de su debilidad, así\\n",
  "que siempre viven en grupo. Si se\\n",
  "encuentran solos, lloran a gritos.$",
]

[msg.section_0.entries.398]
text = [
  "Jamás deja de atacar, aunque le\\n",
  "hayan herido. Le preocupa mucho\\n",
  "la forma de su cresta.$",
]

[msg.section_0.entries.399]
text = [
  "Un estudio comparativo reveló que\\n",
  "los incisivos de Bidoof crecen a la\\n",
  "misma velocidad que los de Rattata.$",
]

[msg.section_0.entries.400]
text = [
  "Un río en el que un Bibarel cree\\n",
  "una presa jamás se desbordará.\\n",
  "Por esa razón la gente los aprecia.$",
]

[msg.section_0.entries.401]
text = [
  "Tiene las patas cortas. Cada vez\\n",
  "que se tropieza, sus antenas\\n",
  "chocan y suenan como un xilófono.$",
]

[msg.section_0.entries.402]
text = [
  "Hay un pueblo en el que celebran\\n",
  "un concurso basado en la increíble\\n",
  "variedad de sus gritos.$",
]

[msg.section_0.entries.403]
text = [
  "La extensión y contracción de sus\\n",
  "músculos genera electricidad.\\n",
  "Brilla cuando está en peligro.$",
]

[msg.section_0.entries.404]
text = [
  "Por las puntas de sus garras pasa\\n",
  "una fuerte corriente eléctrica.\\n",
  "El mínimo roce debilita al enemigo.$",
]

[msg.section_0.entries.405]
text = [
  "Puede ver claramente a través de las\\n",
  "paredes para buscar a sus presas\\n",
  "o a sus crías.$",
]

[msg.section_0.entries.406]
text = [
  "Es muy sensible a los cambios de\\n",
  "temperatura. Se dice que si le da\\n",
  "el sol, su capullo florece.$",
]

[msg.section_0.entries.407]
text = [
  "Cada una de sus manos contiene\\n",
  "toxinas diferentes, pero ambas\\n",
  "tienen un poder casi mortífero.$",
]

[msg.section_0.entries.408]
text = [
  "Vivía en la jungla hace 100 millones de\\n",
  "años. Apartaba los árboles del camino\\n",
  "a cabezazos.$",
]

[msg.section_0.entries.409]
text = [
  "Su cráneo es de 30 cm de grosor.\\n",
  "Si dos de ellos se dan un cabezazo,\\n",
  "no les ocurrirá nada.$",
]

[msg.section_0.entries.410]
text = [
  "Gracias a su imponente protección\\n",
  "facial, puede comer hierba y bayas\\n",
  "donde quiera sin que le molesten.$",
]

[msg.section_0.entries.411]
text = [
  "Se alineaban y creaban una barrera\\n",
  "que ningún enemigo podía cruzar.\\n",
  "Así protegían a sus crías.$",
]

[msg.section_0.entries.412]
text = [
  "Aunque nazca en un lugar en el que\\n",
  "no haya muchos materiales, siempre\\n",
  "consigue crearse un caparazón.$",
]

[msg.section_0.entries.413]
text = [
  "Cuando evoluciona, incorpora a su\\n",
  "cuerpo los materiales del entorno.\\n",
  "Por eso hay muchas variantes.$",
]

[msg.section_0.entries.414]
text = [
  "Le gusta la miel de flores, pero no\\n",
  "le gusta recogerla. Se dedica a\\n",
  "robársela a Combee.$",
]

[msg.section_0.entries.415]
text = [
  "El trío se forma al nacer y se pasa\\n",
  "la vida recogiendo miel de las flores\\n",
  "para satisfacer a Vespiquen.$",
]

[msg.section_0.entries.416]
text = [
  "Libera feromonas para hacer que\\n",
  "las larvas de su panal hagan lo\\n",
  "que diga cuando combate.$",
]

[msg.section_0.entries.417]
text = [
  "A veces se ve a dos frotándose\\n",
  "las bolsas de las mejillas para\\n",
  "compartir electricidad almacenada.$",
]

[msg.section_0.entries.418]
text = [
  "Para impulsarse por el agua, gira\\n",
  "sus dos colas como una hélice. Así\\n",
  "también corta las algas del camino.$",
]

[msg.section_0.entries.419]
text = [
  "Se le ve en los puertos pesqueros,\\n",
  "ayudando a rescatar a personas o\\n",
  "trasladando presas.$",
]

[msg.section_0.entries.420]
text = [
  "Esta pequeña esfera está llena de\\n",
  "nutrientes y está tan rica que los\\n",
  "Starly siempre intentan comérsela.$",
]

[msg.section_0.entries.421]
text = [
  "Cuando detecta luz solar fuerte,\\n",
  "despliega los pétalos y absorbe\\n",
  "todos los rayos posibles.$",
]

[msg.section_0.entries.422]
text = [
  "No hay que apretarle muy fuerte,\\n",
  "ya que, si lo haces, secreta un\\n",
  "misterioso fluido morado.$",
]

[msg.section_0.entries.423]
text = [
  "Hace mucho tiempo tenía todo el\\n",
  "lomo cubierto con una concha. Aún\\n",
  "hay trazas de ella en sus células.$",
]

[msg.section_0.entries.424]
text = [
  "Tiene dos colas muy útiles y hábiles\\n",
  "para manejar cosas, así que rara\\n",
  "vez utiliza las manos.$",
]

[msg.section_0.entries.425]
text = [
  "Por esa forma que tiene de flotar\\n",
  "sin rumbo, en un cuento se le apodó\\n",
  "Globo Aeroerrático.$",
]

[msg.section_0.entries.426]
text = [
  "Al anochecer se reúnen en grupos\\n",
  "y vuelan a la deriva. Cuando alguien\\n",
  "los ve, desaparecen.$",
]

[msg.section_0.entries.427]
text = [
  "Lleva las orejas enrolladas. Cuando\\n",
  "las extiende, golpea con tal fuerza\\n",
  "que incluso puede romper rocas.$",
]

[msg.section_0.entries.428]
text = [
  "Sus orejas son muy delicadas. Si\\n",
  "alguien las toca con brusquedad,\\n",
  "recibirá una espléndida patada.$",
]

[msg.section_0.entries.429]
text = [
  "Sus gritos parecen cánticos. Se dice\\n",
  "que, en alguna rara ocasión, han\\n",
  "imbuido felicidad a quien los oía.$",
]

[msg.section_0.entries.430]
text = [
  "Si uno lanza un grito profundo, los\\n",
  "demás acuden. Por eso se le llama\\n",
  "también Invocador de la Noche.$",
]

[msg.section_0.entries.431]
text = [
  "Oculta una tendencia rencorosa que\\n",
  "le hace arañar la nariz de su\\n",
  "Entrenador si no le da de comer.$",
]

[msg.section_0.entries.432]
text = [
  "Rodea su cuerpo con las colas para\\n",
  "parecer más grande. Si fija la mirada,\\n",
  "no se perderá un detalle.$",
]

[msg.section_0.entries.433]
text = [
  "Tiene una esfera en la boca.\\n",
  "Cuando salta, la esfera rebota\\n",
  "y emite un zumbido.$",
]

[msg.section_0.entries.434]
text = [
  "Expulsa un fluido maloliente por sus\\n",
  "cuartos traseros. El hedor repele\\n",
  "Pokémon en un radio de 2 km.$",
]

[msg.section_0.entries.435]
text = [
  "Ataca emitiendo un fluido maloliente\\n",
  "por la punta de su cola.\\n",
  "Los ataques aéreos le confunden.$",
]

[msg.section_0.entries.436]
text = [
  "Algunos investigadores creen\\n",
  "que, antiguamente, este Pokémon\\n",
  "reflejaba las cosas como un espejo.$",
]

[msg.section_0.entries.437]
text = [
  "Traía lluvias abriendo portales a\\n",
  "otro mundo. Era adorado como\\n",
  "propiciador de buenas cosechas.$",
]

[msg.section_0.entries.438]
text = [
  "Prefiere entornos áridos. Sus ojos\\n",
  "expulsan agua para ajustar sus\\n",
  "niveles de hidratación corporal.$",
]

[msg.section_0.entries.439]
text = [
  "Cuando tiene a alguien delante, imita\\n",
  "su expresión y movimientos para\\n",
  "entender sus sentimientos.$",
]

[msg.section_0.entries.440]
text = [
  "Se pasea por ahí con una roquita.\\n",
  "A veces se cuela entre los pies de\\n",
  "los demás y hace que tropiecen.$",
]

[msg.section_0.entries.441]
text = [
  "Su lengua es como la de cualquier\\n",
  "persona, así que puede imitar muy\\n",
  "bien el habla humana.$",
]

[msg.section_0.entries.442]
text = [
  "Por sus constantes fechorías se le\\n",
  "acabó uniendo a una Piedra Espíritu\\n",
  "con un misterioso hechizo.$",
]

[msg.section_0.entries.443]
text = [
  "Ataca usando su enorme boca y, con\\n",
  "lo torpe que es, también se suele\\n",
  "dañar con sus potentes ataques.$",
]

[msg.section_0.entries.444]
text = [
  "Le gustan las cosas brillantes.\\n",
  "Busca tesoros en cuevas y se\\n",
  "lleva el botín a su nido.$",
]

[msg.section_0.entries.445]
text = [
  "Se dice que, cuando va a velocidad\\n",
  "máxima, sus alas crean cuchillas de\\n",
  "viento que talan cualquier árbol.$",
]

[msg.section_0.entries.446]
text = [
  "En su desesperación por engullir\\n",
  "comida, se suele olvidar de la que\\n",
  "esconde debajo de su pelaje.$",
]

[msg.section_0.entries.447]
text = [
  "Tiene un poder peculiar: puede ver\\n",
  "emociones como el odio y la alegría\\n",
  "en forma de ondas.$",
]

[msg.section_0.entries.448]
text = [
  "Si se ha entrenado bien, puede\\n",
  "percibir auras e identificar y\\n",
  "asimilar sentimientos a 1 km.$",
]

[msg.section_0.entries.449]
text = [
  "Cierra la nariz y luego atraviesa la\\n",
  "arena con total tranquilidad. Suele\\n",
  "formar colonias de diez individuos.$",
]

[msg.section_0.entries.450]
text = [
  "Mantiene la boca abierta para mostrar\\n",
  "su fuerza. Se enfada con sorprendente\\n",
  "rapidez.$",
]

[msg.section_0.entries.451]
text = [
  "Aferra las presas con las garras\\n",
  "de la cola y les inyecta veneno.\\n",
  "Sobrevive un año sin comida.$",
]

[msg.section_0.entries.452]
text = [
  "Tiene una complexión muy fuerte\\n",
  "de la que se enorgullece. Derriba\\n",
  "a sus enemigos sin usar toxinas.$",
]

[msg.section_0.entries.453]
text = [
  "Rara vez combate limpio, pero es\\n",
  "para asegurar su supervivencia.\\n",
  "Es muy popular como mascota.$",
]

[msg.section_0.entries.454]
text = [
  "Almacena veneno en una bolsa de\\n",
  "la garganta. Cuando croa, este se\\n",
  "agita para lograr mayor potencia.$",
]

[msg.section_0.entries.455]
text = [
  "Se cuelga de los árboles en los\\n",
  "pantanos. Atrae a sus presas con\\n",
  "su dulce olor y las engulle.$",
]

[msg.section_0.entries.456]
text = [
  "La línea que le recorre el costado\\n",
  "puede almacenar luz solar. Brilla\\n",
  "con mucha fuerza por la noche.$",
]

[msg.section_0.entries.457]
text = [
  "Se arrastra por el fondo marino\\n",
  "con sus largas aletas frontales.\\n",
  "Compite con Lanturn por la comida.$",
]

[msg.section_0.entries.458]
text = [
  "La gente organiza excursiones para\\n",
  "ver a este Pokémon retozando por\\n",
  "las olas con Remoraid.$",
]

[msg.section_0.entries.459]
text = [
  "Siente mucha curiosidad por los\\n",
  "humanos. Si uno encuentra huellas\\n",
  "en la nieve, acuden todos a mirar.$",
]

[msg.section_0.entries.460]
text = [
  "Aparece con las flores de nieve y\\n",
  "se retira cuando se les caen los\\n",
  "pétalos. No se sabe adónde va.$",
]

[msg.section_0.entries.461]
text = [
  "Su carácter se volvió aún más vil\\n",
  "con la evolución. Se comunica\\n",
  "marcando rocas con sus garras.$",
]

[msg.section_0.entries.462]
text = [
  "Un grupo de investigadores intentó\\n",
  "provocar su evolución por medios\\n",
  "artificiales, pero fracasó.$",
]

[msg.section_0.entries.463]
text = [
  "Su larga lengua está siempre llena\\n",
  "de babas. El contacto con su saliva\\n",
  "causa entumecimiento.$",
]

[msg.section_0.entries.464]
text = [
  "Si tensa y expande los músculos muy\\n",
  "rápido, puede disparar las rocas\\n",
  "que tenga en la mano como misiles.$",
]

[msg.section_0.entries.465]
text = [
  "Sus brazos están hechos de plantas\\n",
  "que se agarran a las cosas. Si se le\\n",
  "cortan, vuelven a crecer enseguida.$",
]

[msg.section_0.entries.466]
text = [
  "Ignora los ataques del enemigo y se\\n",
  "acerca para clavarle las colas y\\n",
  "darle una descarga de alto voltaje.$",
]

[msg.section_0.entries.467]
text = [
  "Cuando lanza sus bolas de fuego a 2000°,\\n",
  "su cuerpo adquiere un tono blanquecino\\n",
  "por el calor.$",
]

[msg.section_0.entries.468]
text = [
  "Congenia muy bien con las personas\\n",
  "que respetan los derechos de los\\n",
  "demás y evitan riñas innecesarias.$",
]

[msg.section_0.entries.469]
text = [
  "Pasa volando a gran velocidad al\\n",
  "lado de sus enemigos y los destroza\\n",
  "con su potente mandíbula.$",
]

[msg.section_0.entries.470]
text = [
  "Prácticamente no combate. Sus\\n",
  "células parecidas a las vegetales\\n",
  "le permiten hacer la fotosíntesis.$",
]

[msg.section_0.entries.471]
text = [
  "Controla su temperatura corporal\\n",
  "para congelar el ambiente y causar\\n",
  "ráfagas de nieve en polvo.$",
]

[msg.section_0.entries.472]
text = [
  "Si da con una corriente de aire\\n",
  "buena, por mínima que sea, puede\\n",
  "dar la vuelta al globo sin aletear.$",
]

[msg.section_0.entries.473]
text = [
  "Se encontró un ejemplar congelado\\n",
  "hace 10 000 años en una excavación.\\n",
  "¡Y se despertó!$",
]

[msg.section_0.entries.474]
text = [
  "Se modificó su programación para que\\n",
  "pudiera trabajar en dimensiones\\n",
  "alienígenas. Pero no funcionó.$",
]

[msg.section_0.entries.475]
text = [
  "Cuando quiere proteger a alguien,\\n",
  "extiende los codos como si fueran\\n",
  "espadas y lucha con fiereza.$",
]

[msg.section_0.entries.476]
text = [
  "Con el magnetismo que emana,\\n",
  "controla tres pequeñas unidades\\n",
  "llamadas Mini-Narices.$",
]

[msg.section_0.entries.477]
text = [
  "Se dice que recoge en su cuerpo\\n",
  "flexible a los espíritus extraviados\\n",
  "y los guía hasta casa.$",
]

[msg.section_0.entries.478]
text = [
  "Congela a sus presas con su aliento\\n",
  "gélido de 50° bajo cero. Se dice que\\n",
  "luego las expone.$",
]

[msg.section_0.entries.479]
text = [
  "Con su cuerpo eléctrico puede\\n",
  "infiltrarse en algunas máquinas\\n",
  "para controlarlas y causar daños.$",
]

[msg.section_0.entries.480]
text = [
  "Voló, y las personas adquirieron la\\n",
  "capacidad para resolver problemas.\\n",
  "Así nació la sabiduría.$",
]

[msg.section_0.entries.481]
text = [
  "Voló, y los humanos aprendieron\\n",
  "sobre la felicidad y la tristeza de\\n",
  "vivir. Así nacieron las emociones.$",
]

[msg.section_0.entries.482]
text = [
  "Voló, y los humanos lograron la\\n",
  "determinación para hacer cosas.\\n",
  "Así nació la voluntad.$",
]

[msg.section_0.entries.483]
text = [
  "Un Pokémon legendario de Sinnoh.\\n",
  "Se dice que el tiempo avanza con\\n",
  "cada latido de su corazón.$",
]

[msg.section_0.entries.484]
text = [
  "Un Pokémon legendario de Sinnoh.\\n",
  "Se dice que el espacio se vuelve más\\n",
  "estable con cada respiración suya.$",
]

[msg.section_0.entries.485]
text = [
  "Su cuerpo es de rugoso acero, pero\\n",
  "su propio calor corporal lo ha\\n",
  "derretido en algunos puntos.$",
]

[msg.section_0.entries.486]
text = [
  "Se dice que usó rocas, magma y un hielo\\n",
  "especial de montaña para crear Pokémon\\n",
  "con su aspecto.$",
]

[msg.section_0.entries.487]
text = [
  "Fue desterrado por su violencia.\\n",
  "Observa el mundo en silencio desde\\n",
  "el Mundo Distorsión.$",
]

[msg.section_0.entries.488]
text = [
  "En las noches de media luna, la\\n",
  "aurora de su cola se extiende y\\n",
  "ondea más hermosa que nunca.$",
]

[msg.section_0.entries.489]
text = [
  "Va a la deriva por mares cálidos.\\n",
  "Siempre vuelve a donde nació, por\\n",
  "mucho que se haya alejado.$",
]

[msg.section_0.entries.490]
text = [
  "Nace con un maravilloso poder que\\n",
  "le permite establecer vínculos con\\n",
  "cualquier tipo de Pokémon.$",
]

[msg.section_0.entries.491]
text = [
  "Para protegerse, causa pesadillas a\\n",
  "los que le rodean. Pero no lo hace\\n",
  "con intención de hacer daño.$",
]

[msg.section_0.entries.492]
text = [
  "Todas las flores de su cuerpo florecen\\n",
  "si se le abraza con amor y percibe\\n",
  "gratitud.$",
]

[msg.section_0.entries.493]
text = [
  "Se dice que surgió de un huevo en\\n",
  "un lugar en el que no había nada.\\n",
  "Y luego dio forma al mundo.$",
]

[msg.section_0.entries.0]
text = [
  "Fine Actor$",
]

[msg.section_0.entries.1]
text = [
  "Mystery Man$",
]

[msg.section_0.entries.2]
text = [
  "Surprised Citizen: Whoooooooooa!$",
]

[msg.section_0.entries.3]
text = [
  "River: I never imagined this...$",
]

[msg.section_0.entries.4]
text = [
  "Frightened Citizen: Eeeeeeek!\\n",
  "A gigantic female monster!$",
]

[msg.section_0.entries.5]
text = [
  "Panicked Citizen: Hey! Hurry up!\\n",
  "Otherwise, she'll stomp on you!$",
]

[msg.section_0.entries.6]
text = [
  "River: Oh...my...$",
]

[msg.section_0.entries.7]
text = [
  "[VAR TRNAME(1)]: Hey!\\n",
  "What's going on?!$",
]

[msg.section_0.entries.8]
text = [
  "River: I'm the one to ask YOU that question!\\c\\n",
  "Did you put a human being\\n",
  "in this Poké Ball?!\\c\\n",
  "This Poké Ball is cursed!\\c\\n",
  "It's an extremely dangerous Poké Ball!\\n",
  "This spells disaster\\l\\n",
  "for humans and Pokémon!$",
]

[msg.section_0.entries.9]
text = [
  "[VAR TRNAME(1)]: That Poké Ball opened\\n",
  "on its own!\\l\\n",
  "I didn't do anything!\\c\\n",
  "Now hurry and put Monica\\n",
  "back in the Poké Ball!$",
]

[msg.section_0.entries.10]
text = [
  "River: I'm trying!\\n",
  "But I can't control the Poké Ball!$",
]

[msg.section_0.entries.11]
text = [
  "[VAR TRNAME(1)]: What?!$",
]

[msg.section_0.entries.12]
text = [
  "River: She's panicking!\\n",
  "We have to stop her first.\\l\\n",
  "Otherwise, it's too dangerous.\\c\\n",
  "You're her sister, right?\\n",
  "Can you stop her somehow?$",
]

[msg.section_0.entries.13]
text = [
  "[VAR TRNAME(1)]: But... How?$",
]

[msg.section_0.entries.14]
text = [
  "River: It doesn't matter how!\\n",
  "Do what you need to do!\\l\\n",
  "Talk to her and make her feel safe!$",
]

[msg.section_0.entries.15]
text = [
  "[VAR TRNAME(1)]: That's impossible!$",
]

[msg.section_0.entries.16]
text = [
  "River: Well, do something!\\n",
  "She matters to you, doesn't she?$",
]

[msg.section_0.entries.17]
text = [
  "Monica: Yeeeeek!\\c\\n",
  "What's happening?!$",
]

[msg.section_0.entries.18]
text = [
  "[VAR TRNAME(1)]: (...Monica...)\\n",
  "(...Somehow, I have to calm her down...)$",
]

[msg.section_0.entries.19]
text = [
  "Monica: Where am I?\\n",
  "Why is this happening?$",
]

[msg.section_0.entries.20]
text = [
  "[VAR TRNAME(1)]: Calm down!$",
]

[msg.section_0.entries.21]
text = [
  "Monica: Yeeeeek!\\n",
  "Somebody, help me!$",
]

[msg.section_0.entries.22]
text = [
  "[VAR TRNAME(1)]: She's huge...$",
]

[msg.section_0.entries.23]
text = [
  "Monica: Hey! Who said that?\\n",
  "Don't be rude!$",
]

[msg.section_0.entries.24]
text = [
  "Monica: Why are all the buildings small?\\n",
  "Why are all the people so tiny?$",
]

[msg.section_0.entries.25]
text = [
  "[VAR TRNAME(1)]: (...I'm in trouble...)\\n",
  "(...First, I have to get her attention...)$",
]

[msg.section_0.entries.26]
text = [
  "Monica: What? Why?\\n",
  "What happened to me?$",
]

[msg.section_0.entries.27]
text = [
  "[VAR TRNAME(1)]: It's me, [VAR TRNAME(1)]!$",
]

[msg.section_0.entries.28]
text = [
  "Monica: Is that [VAR TRNAME(1)]'s voice?\\n",
  "Where are you? [VAR TRNAME(1)]!$",
]

[msg.section_0.entries.29]
text = [
  "[VAR TRNAME(1)]: Nice weather up there?$",
]

[msg.section_0.entries.30]
text = [
  "Monica: Grrr!\\n",
  "Where are you hiding, [VAR TRNAME(1)]?\\c\\n",
  "Don't you dare make fun of me!$",
]

[msg.section_0.entries.31]
text = [
  "[VAR TRNAME(1)]: Monica!$",
]

[msg.section_0.entries.32]
text = [
  "Monica: [VAR TRNAME(1)]...$",
]

[msg.section_0.entries.33]
text = [
  "[VAR TRNAME(1)]: (...Monica...)\\n",
  "(...Finally, she noticed me...)$",
]

[msg.section_0.entries.34]
text = [
  "Monica: [VAR TRNAME(1)]...\\n",
  "Tee...hee hee...\\l\\n",
  "When I saw your face, [VAR TRNAME(1)]...\\l\\n",
  "What a relief...\\l\\n",
  "I'm so...tired...$",
]

[msg.section_0.entries.35]
text = [
  "[VAR TRNAME(1)]: Monica...$",
]

[msg.section_0.entries.36]
text = [
  "River: Well, well...\\n",
  "She went back to the Poké Ball.\\l\\n",
  "She's calmed down for now.$",
]

[msg.section_0.entries.37]
text = [
  "[VAR TRNAME(1)]: Wait!\\n",
  "Is Monica OK?!$",
]

[msg.section_0.entries.38]
text = [
  "River: Probably...\\n",
  "I never dreamed this could happen...$",
]

[msg.section_0.entries.39]
text = [
  "[VAR TRNAME(1)]: Mr. River!\\n",
  "What should I do?$",
]

[msg.section_0.entries.40]
text = [
  "River: Well...\\n",
  "It's definitely too dangerous to stay here.\\c\\n",
  "For now, let's go somewhere deserted.$",
]

[msg.section_0.entries.41]
text = [
  "[VAR TRNAME(1)]: Wait a minute, Mr. River!$",
]

[msg.section_0.entries.42]
text = [
  "When Monica appeared out of\\n",
  "the cursed Poké Ball...\\c\\n",
  "For some reason, she'd grown to\\n",
  "the size of a building!\\c\\n",
  "She was panicking and running amok,\\n",
  "but I managed to stop her.\\c\\n",
  "But with her giant-sized body...\\c\\n",
  "What am I gonna do?!$",
]

[msg.section_0.entries.43]
text = [
  "Monica: Sob...$",
]

[msg.section_0.entries.44]
text = [
  "[VAR TRNAME(1)]: Hey...\\n",
  "Are you feeling better? ...Calmer?$",
]

[msg.section_0.entries.45]
text = [
  "Monica: I've had enough!$",
]

[msg.section_0.entries.46]
text = [
  "[VAR TRNAME(1)]: Monica?$",
]

[msg.section_0.entries.47]
text = [
  "Monica: This is it!\\c\\n",
  "Everybody!\\n",
  "Enough is enough!$",
]

[msg.section_0.entries.48]
text = [
  "River: Ack!\\n",
  "Is she going to get up again?\\c\\n",
  "Uh-oh! Look out!\\n",
  "Run! Quick!$",
]

[msg.section_0.entries.49]
text = [
  "[VAR TRNAME(1)]: (...Monica...)\\n",
  "(...How did we get in this awful fix?...)$",
]

[msg.section_0.entries.50]
text = [
  "Monica roared like thunder and\\n",
  "destroyed the entire area.\\c\\n",
  "My sister's rage never ended.\\n",
  "She rampaged across the world,\\l\\n",
  "from one end to the other.\\c\\n",
  "Every region of the world was alerted\\n",
  "to this critical situation.\\c\\n",
  "They did their best to stop her,\\n",
  "but, one after another, they failed...\\c\\n",
  "Civilization...smashed to rubble...by\\n",
  "the ferocious anger of a giant woman.$",
]

[msg.section_0.entries.51]
text = [
  "[VAR TRNAME(1)]: Pant... Pant...\\n",
  "Monica, stop! I beg you.$",
]

[msg.section_0.entries.52]
text = [
  "Monica: Ah... [VAR TRNAME(1)].\\n",
  "What have I done?\\c\\n",
  "So...sorry...\\n",
  "Sob...$",
]

[msg.section_0.entries.53]
text = [
  "[VAR TRNAME(1)]: Monica...$",
]

[msg.section_0.entries.54]
text = [
  "Monica: [VAR TRNAME(1)]!$",
]

[msg.section_0.entries.55]
text = [
  "[VAR TRNAME(1)]: Oh, Monica...\\c\\n",
  "Sob...\\n",
  "I'm helpless.\\c\\n",
  "...\\c\\n",
  "If only I could help you somehow...$",
]

[msg.section_0.entries.56]
text = [
  "River: Hey! Are you all right?\\n",
  "Steady on... Hang in there!$",
]

[msg.section_0.entries.57]
text = [
  "[VAR TRNAME(1)]: ...$",
]

[msg.section_0.entries.58]
text = [
  "I couldn't stand against my sister's power.\\c\\n",
  "I fell to the ground. Seeing me,\\n",
  "Monica burst into hysterical tears.\\c\\n",
  "Her tears poured over me\\n",
  "almost like rain...\\c\\n",
  "It was a gentle, comfortable feeling,\\n",
  "and slowly my eyes began to close...$",
]

[msg.section_0.entries.59]
text = [
  "Monica: Yeeek! Hot! Hot!\\n",
  "Is someone playing a trick on me?\\c\\n",
  "These are brand-new stockings,\\n",
  "so quit it! They'll burn!$",
]

[msg.section_0.entries.60]
text = [
  "[VAR TRNAME(1)]: Uh...\\n",
  "That was my Pokémon's\\l\\n",
  "most powerful attack...$",
]

[msg.section_0.entries.61]
text = [
  "River: This is unbelievable!\\n",
  "It seemed like she'd taken some damage,\\l\\n",
  "but she's not even hurt...\\c\\n",
  "She was attacked by a move so strong\\n",
  "that some people call it legendary,\\l\\n",
  "but all it did was singe her stockings!\\c\\n",
  "She is incredibly dangerous...$",
]

[msg.section_0.entries.62]
text = [
  "Monica: Yeek! That tickles!\\n",
  "Is someone playing a trick on me?\\c\\n",
  "Stop messing around!\\n",
  "These are brand-new stockings, and\\l\\n",
  "I don't want to get a run in them already!$",
]

[msg.section_0.entries.63]
text = [
  "[VAR TRNAME(1)]: Uh...\\n",
  "That was my Pokémon's\\l\\n",
  "most powerful attack...$",
]

[msg.section_0.entries.64]
text = [
  "River: This is unbelievable!\\n",
  "It seemed like she'd taken some damage,\\l\\n",
  "but she's not even hurt...\\c\\n",
  "She was attacked by a move so strong\\n",
  "that some people call it legendary,\\l\\n",
  "but all it did was put a run in her stocking!\\c\\n",
  "She is incredibly dangerous...$",
]

[msg.section_0.entries.65]
text = [
  "Monica: Yeek! Cold! Cold!\\n",
  "Is someone playing a trick on me?\\c\\n",
  "Stop messing around,\\n",
  "'cause these stockings are thin!\\l\\n",
  "I'll get frostbite!$",
]

[msg.section_0.entries.66]
text = [
  "[VAR TRNAME(1)]: Uh...\\n",
  "That was my Pokémon's\\l\\n",
  "most powerful attack...$",
]

[msg.section_0.entries.67]
text = [
  "River: This is unbelievable!\\n",
  "It seemed like she'd taken some damage,\\l\\n",
  "but she's not even hurt...\\c\\n",
  "She was attacked by a move so strong that\\n",
  "some people call it legendary, but all it did\\l\\n",
  "was make her whine about thin stockings!\\c\\n",
  "She is incredibly dangerous...$",
]

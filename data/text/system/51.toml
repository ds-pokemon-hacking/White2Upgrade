[msg.section_0.entries.0]
text = [
  "Hey! Come on!\\n",
  "Let's have some fun!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Hyuk hyuk hyuk hyuk!\\n",
  "Ha ha ha ha!\\c\\n",
  "I never stop smiling!\\n",
  "Laugh with me and battle!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Your luck ran out when you got\\n",
  "spotted by me! En garde!\\c$",
]

[msg.section_0.entries.3]
text = [
  "One-two! Three-four!\\n",
  "Huff puff!\\c\\n",
  "...What am I doing, you ask?\\n",
  "Exercising, of course! A Pokémon battle\\l\\n",
  "will help me shed these pounds!\\c$",
]

[msg.section_0.entries.4]
text = [
  "I raised my beloved Pokémon as if they\\n",
  "were my own children. Here we go!\\c$",
]

[msg.section_0.entries.5]
text = [
  "You'll have to defeat me if you want\\n",
  "to advance any further!\\c$",
]

[msg.section_0.entries.6]
text = [
  "The boss yelled at me,\\n",
  "so I ran away from the bakery.\\c\\n",
  "I still have a lot to learn,\\n",
  "but will you battle with me?\\c$",
]

[msg.section_0.entries.7]
text = [
  "Curry buns and cream buns!\\n",
  "Let's make this a gourmet-style battle!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Oh no, are you lost?\\n",
  "Come play with me!\\c$",
]

[msg.section_0.entries.9]
text = [
  "I'm checking out the course for our\\n",
  "preschool's next field trip.\\c\\n",
  "I'd better check out how strong the\\n",
  "Trainers are in here. Here I come!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Whoa! You look like a strong one!\\n",
  "Time for battle! Hi-yah!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Hmph! I don't need words!\\n",
  "I let my fists do the talking!\\c$",
]

[msg.section_0.entries.12]
text = [
  "Ouch, ouch, ouch...\\c\\n",
  "Three squat repetitions, and\\n",
  "my muscles are killing me!\\c\\n",
  "Can you take on a frail Black Belt\\n",
  "like me?\\c$",
]

[msg.section_0.entries.13]
text = [
  "I don't like weaklings!\\n",
  "You'd better not run away!\\c$",
]

[msg.section_0.entries.14]
text = [
  "Me? I'm training!\\n",
  "Let's battle! I want to get stronger!\\c$",
]

[msg.section_0.entries.15]
text = [
  "I'm generally a pacifist, but Pokémon\\n",
  "battles are a law unto themselves, right?\\c$",
]

[msg.section_0.entries.16]
text = [
  "Huh? What do you think you're looking at?\\n",
  "Bring out your Pokémon. It's battle time!\\c$",
]

[msg.section_0.entries.17]
text = [
  "Shiny heads brighten the world!\\n",
  "Let's make this battle shine, too!\\c$",
]

[msg.section_0.entries.18]
text = [
  "Ugh, I've got nothing to do.\\n",
  "Hey, you! Pretend to be a criminal for me!\\c\\n",
  "...You won't get away from me,\\n",
  "you crook! Stop right there!\\c$",
]

[msg.section_0.entries.19]
text = [
  "The deeper down you go,\\n",
  "the stronger the Trainers become!\\c\\n",
  "This area? You've barely scratched\\n",
  "the surface!\\c$",
]

[msg.section_0.entries.20]
text = [
  "When there's a mountain, I climb.\\n",
  "When there are Pokémon, I battle!\\c$",
]

[msg.section_0.entries.21]
text = [
  "So this is the renowned White Treehollow\\n",
  "that I've heard so much about!\\c\\n",
  "It was worth the journey to get here.\\c\\n",
  "I'm going to work my way to the bottom\\n",
  "and defeat each of the Trainers here!\\c$",
]

[msg.section_0.entries.22]
text = [
  "Aim high and battle!\\n",
  "Charge up to the peak!\\c$",
]

[msg.section_0.entries.23]
text = [
  "My daughter does nothing but\\n",
  "ignore me lately...\\c\\n",
  "Argh! I'll take it out on you!\\n",
  "Daddy still loves you!\\c$",
]

[msg.section_0.entries.24]
text = [
  "Welcome to White Treehollow!\\n",
  "As a form of greeting, let's battle!\\c$",
]

[msg.section_0.entries.25]
text = [
  "I'll be the first to beat this area!\\c$",
]

[msg.section_0.entries.26]
text = [
  "I've been cleaning for 50 years!\\n",
  "I won't lose to a young'un like you!\\c$",
]

[msg.section_0.entries.27]
text = [
  "Gimme back mah teef!\\c$",
]

[msg.section_0.entries.28]
text = [
  "Yo! Let's have ourselves an\\n",
  "awesome battle!\\c$",
]

[msg.section_0.entries.29]
text = [
  "The word is that some of the strongest\\n",
  "Trainers in Unova gather here.\\c\\n",
  "I'm a weakling compared to the likes\\n",
  "of them, but I'll keep on battling!\\c$",
]

[msg.section_0.entries.30]
text = [
  "I'm the chosen one who will\\n",
  "make it to the top!\\c$",
]

[msg.section_0.entries.31]
text = [
  "My heart is pounding.\\n",
  "You must be really strong.\\c$",
]

[msg.section_0.entries.32]
text = [
  "The future is mine to behold!\\n",
  "Prepare for battle!\\c$",
]

[msg.section_0.entries.33]
text = [
  "Let me feel your strength--your spirit!\\c$",
]

[msg.section_0.entries.34]
text = [
  "Rival detected!\\n",
  "Let's see who can reach the top first.\\c\\n",
  "We'll make a race of it!\\n",
  "But first, let's battle!\\c$",
]

[msg.section_0.entries.35]
text = [
  "Wait... My Pokémon are telling me\\n",
  "to battle you...\\c$",
]

[msg.section_0.entries.36]
text = [
  "Heh heh! Bring out your Pokémon!\\n",
  "I need to gather data.\\c$",
]

[msg.section_0.entries.37]
text = [
  "According to my calculations, my chances\\n",
  "for victory are 120 percent!\\c$",
]

[msg.section_0.entries.38]
text = [
  "I'm usually quite a serious person,\\n",
  "but I like to let loose every so often.\\c\\n",
  "Prepare yourself! Here I come!\\c$",
]

[msg.section_0.entries.39]
text = [
  "You think you're good enough to keep\\n",
  "going up? I'll be the judge of that!\\c$",
]

[msg.section_0.entries.40]
text = [
  "The best thing to do when you're sick of\\n",
  "schoolwork is to have a Pokémon battle!\\c$",
]

[msg.section_0.entries.41]
text = [
  "Urgh! I'm lost!\\n",
  "Where am I supposed to go?\\c\\n",
  "Hey! Where are you going?\\n",
  "Don't leave me behind!\\c$",
]

[msg.section_0.entries.42]
text = [
  "Math is my worst subject! My best\\n",
  "subject happens to be Pokémon battling.\\c$",
]

[msg.section_0.entries.43]
text = [
  "Oi! I'm a proper lady, I am!\\n",
  "Don't treat me like a little girl!\\c$",
]

[msg.section_0.entries.44]
text = [
  "When the eyes of two Trainers meet,\\n",
  "the time for battle has come!\\c$",
]

[msg.section_0.entries.45]
text = [
  "At home, my mom keeps going on and on\\n",
  "about how I need to study. I'm sick of it!\\c\\n",
  "That's why I'm here. I needed a break.\\n",
  "Come on! Let's have some fun!\\c$",
]

[msg.section_0.entries.46]
text = [
  "Welcome!\\n",
  "Please follow me for our battle!\\c$",
]

[msg.section_0.entries.47]
text = [
  "And today's main dish will be...\\n",
  "a battle with you!\\c$",
]

[msg.section_0.entries.48]
text = [
  "May I take your order?\\n",
  "What kind of battle would you like?\\c$",
]

[msg.section_0.entries.49]
text = [
  "Excuse me!\\n",
  "Please have a battle with me!\\c$",
]

[msg.section_0.entries.50]
text = [
  "Hey, hey! We run this area, and\\n",
  "you're gonna have to battle\\l\\n",
  "if you want to pass.\\c$",
]

[msg.section_0.entries.51]
text = [
  "Someday I'll become a powerful Trainer--\\n",
  "one who is respected by all!\\c\\n",
  "Let's have a look at your Pokémon!\\n",
  "Chase your dreams! Let's battle!\\c$",
]

[msg.section_0.entries.52]
text = [
  "Once I beat this area, I'm gonna go\\n",
  "back and tell everyone how strong I am!\\c\\n",
  "I'll be the coolest guy in school!\\c$",
]

[msg.section_0.entries.53]
text = [
  "Hmph! My Pokémon are so very, very\\n",
  "much cuter than yours!\\c$",
]

[msg.section_0.entries.54]
text = [
  "Bright smiles and sunshine... ♪\\n",
  "La la la, sunflowers are so fine... ♪\\c\\n",
  "Tell me, do you like my song? I'm training\\n",
  "to become an Idol! Let's battle!\\c$",
]

[msg.section_0.entries.55]
text = [
  "Ah! You're a Trainer, too, right?\\n",
  "Let's battle!\\c\\n",
  "Hee hee! I've got three wins in a row,\\n",
  "and I'm not stopping now!\\c$",
]

[msg.section_0.entries.56]
text = [
  "You've gotta climb the Black Tower\\n",
  "at least once if you come to Black City.\\c\\n",
  "That's what I read in the guidebook.\\n",
  "Anyway, let's battle!\\c$",
]

[msg.section_0.entries.57]
text = [
  "All sorts of Trainers from across the\\n",
  "world gather here!\\c\\n",
  "Count me as one of them.\\n",
  "I heard the rumors about Black Tower\\l\\n",
  "and came here to test my strength!\\c$",
]

[msg.section_0.entries.58]
text = [
  "Hah... I'm so lost. Everything\\n",
  "looks the same here!\\c\\n",
  "I need some motivation to keep going.\\n",
  "I know... Let's have a Pokémon battle!\\c$",
]

[msg.section_0.entries.59]
text = [
  "I've run into so many types\\n",
  "of Trainers in here.\\c\\n",
  "Those who are tough on themselves...\\n",
  "Those who are gentle with their Pokémon.\\c\\n",
  "Hee hee! I wonder which type you are.\\n",
  "Let's battle and find out!\\c$",
]

[msg.section_0.entries.60]
text = [
  "Now it's time for you to taste the\\n",
  "power of the Pokémon Fan Club!\\c$",
]

[msg.section_0.entries.61]
text = [
  "Heart is more important than talent!\\n",
  "As long as I've got love, I can't lose!\\c$",
]

[msg.section_0.entries.62]
text = [
  "You've done well to make it this far.\\n",
  "But you shall not pass!\\c\\n",
  "How did that sound? Did I sound imposing?\\n",
  "One way or another, here I come!\\c$",
]

[msg.section_0.entries.63]
text = [
  "I'm proud of my cooking and my Pokémon.\\n",
  "Here's a taste of their power!\\c$",
]

[msg.section_0.entries.64]
text = [
  "I hear there are tons of much\\n",
  "stronger Trainers on the lower levels!\\c\\n",
  "I'd better train while I still can!\\n",
  "Here I come!\\c$",
]

[msg.section_0.entries.65]
text = [
  "Eek! Don't surprise me like that!\\n",
  "You need to be disciplined!\\c$",
]

[msg.section_0.entries.66]
text = [
  "My boss back at the bakery told me to\\n",
  "come here and train.\\c\\n",
  "But what does this place have to do\\n",
  "with working at a bakery?\\c\\n",
  "Oh, well. No point in kneading my brain\\n",
  "about it. Let's battle!\\c$",
]

[msg.section_0.entries.67]
text = [
  "Nom nom nom nom...\\c\\n",
  "A warm bun makes a delicious lunch!\\n",
  "I can't battle on an empty stomach!\\c$",
]

[msg.section_0.entries.68]
text = [
  "I did my best in raising these Pokémon.\\n",
  "Time to show them off!\\c$",
]

[msg.section_0.entries.69]
text = [
  "I was here exploring with my\\n",
  "Preschoolers, but I got left behind...\\c\\n",
  "I'm all alone now...\\n",
  "Won't you battle with me?\\c$",
]

[msg.section_0.entries.70]
text = [
  "I'm pumped up! Woooo!\\n",
  "All right! Let's do this!\\c$",
]

[msg.section_0.entries.71]
text = [
  "I heard that there's a legendary\\n",
  "Black Belt down deep in this place.\\c\\n",
  "His fists can crush stone,\\n",
  "and he can dash like the wind!\\c\\n",
  "I want to be like that someday!\\n",
  "All right! Let's battle!\\c$",
]

[msg.section_0.entries.72]
text = [
  "Hi-yah!\\n",
  "Eeee-yah!\\c\\n",
  "My shouts are second to none,\\n",
  "but I still can't split even one brick!\\c\\n",
  "I may be weak, but my Pokémon still\\n",
  "love me. Together, we battle!\\c$",
]

[msg.section_0.entries.73]
text = [
  "I've learned many moves in my\\n",
  "warrior training here.\\c\\n",
  "Time to put them to the test!\\n",
  "Hi-yah!\\c$",
]

[msg.section_0.entries.74]
text = [
  "The girl that was born under the star\\n",
  "of battle... It is I!\\c$",
]

[msg.section_0.entries.75]
text = [
  "Everyone's always talking about battle\\n",
  "this, battle that. So tired of hearing it.\\c\\n",
  "...I'll still fight, though!\\n",
  "That's why I'm here, after all.\\c$",
]

[msg.section_0.entries.76]
text = [
  "Hey! I'm walkin' here!\\n",
  "Outta my way!\\c$",
]

[msg.section_0.entries.77]
text = [
  "I hear there's some real bad dudes\\n",
  "down near the bottom of this place!\\c\\n",
  "You lookin' at me? I may look bad, but I'm\\n",
  "actually a pretty nice guy! Let's battle!\\c$",
]

[msg.section_0.entries.78]
text = [
  "Hey! You have a suspicious look!\\n",
  "You're under arrest!\\c$",
]

[msg.section_0.entries.79]
text = [
  "I heard there are some Trainers around\\n",
  "these parts who are up to no good...\\c\\n",
  "Could you be one of them, I wonder...\\n",
  "Hey! Come here for a second!\\c$",
]

[msg.section_0.entries.80]
text = [
  "Are you ready for a battle?\\c\\n",
  "This is White Treehollow!\\n",
  "You always need to be ready!\\c$",
]

[msg.section_0.entries.81]
text = [
  "I've got my tent, my sleeping bag,\\n",
  "my lantern, and my hammer--all I need!\\c\\n",
  "You're going exploring with that gear?\\n",
  "You've gotta be kidding me!\\c$",
]

[msg.section_0.entries.82]
text = [
  "I'm setting up camp right here!\\n",
  "Out of the way, please!\\c$",
]

[msg.section_0.entries.83]
text = [
  "I poured my tears and sweat into training\\n",
  "these Pokémon! Here we go!\\c$",
]

[msg.section_0.entries.84]
text = [
  "Hey, you!\\n",
  "You're not trapped, are you?\\c\\n",
  "Sometimes people get lost in here and\\n",
  "can't find their way out.\\c\\n",
  "I'm always on the lookout, but since\\n",
  "we're both here, want to have a battle?\\c$",
]

[msg.section_0.entries.85]
text = [
  "So dark... So quiet...\\n",
  "All alone... So tranquil...\\c\\n",
  "You there...\\n",
  "Don't disturb...my peace!\\c$",
]

[msg.section_0.entries.86]
text = [
  "Check out my squeaky-clean Pokémon!\\n",
  "Here we go!\\c$",
]

[msg.section_0.entries.87]
text = [
  "This Janitor costume is simply my\\n",
  "disguise to get around by day!\\c\\n",
  "If you want to know my true identity,\\n",
  "you'll have to battle me!\\c$",
]

[msg.section_0.entries.88]
text = [
  "I'm here to make sure there aren't\\n",
  "any gas leaks.\\c\\n",
  "My days are spent supporting Trainers,\\n",
  "but I also like to battle sometimes.\\c$",
]

[msg.section_0.entries.89]
text = [
  "I used all of my vacation time to come\\n",
  "here and challenge this place.\\c\\n",
  "I hope I can advance even more before\\n",
  "I have to go back to work.\\c\\n",
  "You know, since we ran into each other\\n",
  "like this, how about a battle?\\c$",
]

[msg.section_0.entries.90]
text = [
  "I'm detecting a strange buildup of\\n",
  "energy in this building.\\c\\n",
  "It's making me crave a battle!\\c$",
]

[msg.section_0.entries.91]
text = [
  "I can use my psychic powers\\n",
  "to cure shoulder stiffness!\\c\\n",
  "It's got nothing to do with\\n",
  "battles, though.\\c$",
]

[msg.section_0.entries.92]
text = [
  "Everyone here is so weak!\\n",
  "Come on, let's get this over with.\\c$",
]

[msg.section_0.entries.93]
text = [
  "I had a dream last night...\\c\\n",
  "You and I were battling...\\n",
  "And then...\\c$",
]

[msg.section_0.entries.94]
text = [
  "Mmmm... Go!\\n",
  "Fly to the top!\\c\\n",
  "No matter how many times I try it,\\n",
  "I just can't seem to teleport.\\c\\n",
  "I guess that's life telling me not to\\n",
  "take shortcuts! Well, here we go!\\c$",
]

[msg.section_0.entries.95]
text = [
  "You're my next opponent, eh?\\n",
  "I won't hold back!\\c$",
]

[msg.section_0.entries.96]
text = [
  "I don't get paid nearly enough for\\n",
  "working at that research lab!\\c\\n",
  "If I want to live a life of luxury, I'd\\n",
  "better make as much money here as I can.\\c$",
]

[msg.section_0.entries.97]
text = [
  "The power of science is absolute!\\n",
  "I shall prove it to you here and now!\\c$",
]

[msg.section_0.entries.98]
text = [
  "My experiments were going nowhere,\\n",
  "so I ran away from the lab.\\c\\n",
  "I need even more of an escape from\\n",
  "reality, so please battle me!\\c$",
]

[msg.section_0.entries.99]
text = [
  "I've got almost all the data I need.\\n",
  "You can be my last test subject!\\c$",
]

[msg.section_0.entries.100]
text = [
  "This is Black Tower!\\n",
  "Pokémon battles can happen anywhere,\\l\\n",
  "anytime, and between anyone!\\c$",
]

[msg.section_0.entries.101]
text = [
  "I'm strong, you know! I'm a warrior!\\n",
  "I shall be the victor of the exam war!\\c$",
]

[msg.section_0.entries.102]
text = [
  "My beloved...\\c\\n",
  "I thought I saw you enter this building...\\n",
  "Where have you gone?\\c\\n",
  "We are destined to be together!\\c\\n",
  "Wait, what? Don't you believe in destiny?\\c$",
]

[msg.section_0.entries.103]
text = [
  "I'd better get home soon!\\n",
  "But first, let's battle!\\c$",
]

[msg.section_0.entries.104]
text = [
  "My test scores are always perfect!\\n",
  "As is my smile!\\c\\n",
  "They call me super-genius girl for\\n",
  "good reason! Let's battle!\\c$",
]

[msg.section_0.entries.105]
text = [
  "I hear there are some really cute\\n",
  "guys higher up.\\c\\n",
  "Tee hee hee. I need to hurry up and\\n",
  "get stronger! Let's battle!\\c$",
]

[msg.section_0.entries.106]
text = [
  "Today's menu is slightly different\\n",
  "from usual.\\c$",
]

[msg.section_0.entries.107]
text = [
  "Excuse me! Please wait!\\n",
  "You've forgotten something!\\l\\n",
  "You've forgotten to battle me!\\c$",
]

[msg.section_0.entries.108]
text = [
  "This way, please! I'll bring out our\\n",
  "very best Pokémon!\\c$",
]

[msg.section_0.entries.109]
text = [
  "I'm a wicked Waitress. ♪\\n",
  "No orders will be taken today!\\c$",
]

[msg.section_0.entries.110]
text = [
  "Hey, any idea where the restroom is at?\\c\\n",
  "Uh, I'm not sure how long I can hold it...\\n",
  "There's still time for a battle, though!\\c$",
]

[msg.section_0.entries.111]
text = [
  "My Pokémon have gotten a lot stronger\\n",
  "on the way here!\\c\\n",
  "You look pretty tough, though.\\n",
  "Time to test our strength!\\c$",
]

[msg.section_0.entries.112]
text = [
  "Boom! Check out my crazy pitching!\\n",
  "Eat this tornado Poké Ball!\\c$",
]

[msg.section_0.entries.113]
text = [
  "Some weird-looking dude is chasing\\n",
  "after me!\\c\\n",
  "What did I do to deserve this?\\c$",
]

[msg.section_0.entries.114]
text = [
  "Oh no! I've already been here!\\n",
  "Uhh...where am I supposed to go?\\c$",
]

[msg.section_0.entries.115]
text = [
  "Hey, wait! Please play with my Pokémon!\\c$",
]

[msg.section_0.entries.116]
text = [
  "Um, maybe this way...?\\n",
  "Oh, are you lost, too?\\c\\n",
  "We're a couple of wandering wanderers.\\n",
  "May as well have a battle!\\c$",
]

[msg.section_0.entries.117]
text = [
  "I came on this journey to discover\\n",
  "myself. But who am I, anyway?\\c\\n",
  "The me who is thinking about who I am\\n",
  "is also me, isn't it?\\c\\n",
  "It's too much for me!\\n",
  "Let's just have a battle!\\c$",
]

[msg.section_0.entries.118]
text = [
  "My compass has been going crazy ever\\n",
  "since I entered this building.\\c\\n",
  "Looks like I can only rely on my senses.\\n",
  "I'd better hone them in battle!\\c$",
]

[msg.section_0.entries.119]
text = [
  "Let's battle! I need to make enough\\n",
  "money so I can go traveling!\\c$",
]

[msg.section_0.entries.120]
text = [
  "Even in a deep dungeon like this, I don't\\n",
  "feel lonely when I'm with my Pokémon!\\c\\n",
  "C'mon, y'all, let's do this!\\c$",
]

[msg.section_0.entries.121]
text = [
  "I've got a knot in my back, and\\n",
  "a stiff shoulder, and I'm out of\\l\\n",
  "breath after a few steps.\\c\\n",
  "But I'm still standing! I conquered\\n",
  "every challenge on the way here!\\c\\n",
  "You're the kind of kid who doesn't\\n",
  "know anything about pain!\\c\\n",
  "You think you can beat me?\\c$",
]

[msg.section_0.entries.122]
text = [
  "OK! Here we go!\\n",
  "Let's give this battle our all!\\c$",
]

[msg.section_0.entries.123]
text = [
  "How's your Pokémon training going?\\n",
  "I'll lend you a hand!\\c$",
]

[msg.section_0.entries.124]
text = [
  "Get your Pokémon ready!\\n",
  "Come on, show me what you got!\\c$",
]

[msg.section_0.entries.125]
text = [
  "I've already lost over 10 pounds since\\n",
  "I started coming here!\\c\\n",
  "Are you here to lose weight, too?\\n",
  "Come on, we can work out together!\\c$",
]

[msg.section_0.entries.126]
text = [
  "Hey! You'd better be careful,\\n",
  "or I'll burn you to a crisp!\\c$",
]

[msg.section_0.entries.127]
text = [
  "I'm saving up to open my own bakery\\n",
  "someday.\\c\\n",
  "I've got to battle a whole lot more\\n",
  "if I want to save enough money!\\c$",
]

[msg.section_0.entries.128]
text = [
  "I came here with my class, but\\n",
  "they all ran on ahead of me!\\c\\n",
  "I've got to get stronger if I want to\\n",
  "catch up with them!\\c$",
]

[msg.section_0.entries.129]
text = [
  "A Teacher I may be, but I've no shortage\\n",
  "of passion! Let's have a battle!\\c$",
]

[msg.section_0.entries.130]
text = [
  "I need to get stronger if I want to\\n",
  "protect my friends in White Forest!\\c$",
]

[msg.section_0.entries.131]
text = [
  "The strongest of the strong gather at\\n",
  "the bottom...\\c\\n",
  "I wonder what kind of Trainers they are.\\n",
  "I can't even imagine it.\\c\\n",
  "I've got it! I'll make it to the bottom\\n",
  "and see them for myself! Let's battle!\\c$",
]

[msg.section_0.entries.132]
text = [
  "Back at the Dojo, I said that the\\n",
  "only thing a Pokémon needs is power.\\c\\n",
  "The Dojo master got angry and told me\\n",
  "to come here to reevaluate my thinking.\\c\\n",
  "Argh! Now I'm stuck in here.\\n",
  "Come on, let's battle!\\c$",
]

[msg.section_0.entries.133]
text = [
  "Look!\\n",
  "There's some money on the ground!\\c\\n",
  "Ha ha! Made you look!\\n",
  "And with your guard down, here I come!\\c$",
]

[msg.section_0.entries.134]
text = [
  "You get to be my lucky 100th opponent!\\c$",
]

[msg.section_0.entries.135]
text = [
  "I'll make the flowers of victory bloom\\n",
  "under this white tree! Here we go!\\c$",
]

[msg.section_0.entries.136]
text = [
  "I heard there was a bunch of strong\\n",
  "Trainers here, so I got all pumped up.\\c\\n",
  "Everyone is too strong, though. I can't\\n",
  "win! Hopefully, I can at least beat you.\\c$",
]

[msg.section_0.entries.137]
text = [
  "My Pokémon are a rough bunch! They\\n",
  "don't take nuthin' from no one!\\c$",
]

[msg.section_0.entries.138]
text = [
  "Peace and quiet used to be the order of\\n",
  "the day around here.\\c\\n",
  "Ever since you Trainers began showing\\n",
  "up, I haven't had a moment's rest!\\c\\n",
  "Stop giving me more work to do!\\c$",
]

[msg.section_0.entries.139]
text = [
  "Stop right there! This is a Pokémon\\n",
  "inspection. Bring them out!\\c$",
]

[msg.section_0.entries.140]
text = [
  "I want to get to Area 5, at least...\\c\\n",
  "You say you're aiming for the bottom?\\n",
  "You don't have a chance!\\c\\n",
  "Looks like I'm going to have to teach\\n",
  "you a lesson about the real world!\\c$",
]

[msg.section_0.entries.141]
text = [
  "My splendor is like that of a gleaming\\n",
  "mountain! Think you can beat me?\\c$",
]

[msg.section_0.entries.142]
text = [
  "I'm part of an expedition sent here to\\n",
  "solve the mysteries of White Treehollow.\\c\\n",
  "The problem is, I got separated from the\\n",
  "rest of the team!\\c\\n",
  "While we're both here, let's battle!\\c$",
]

[msg.section_0.entries.143]
text = [
  "It's said that this cave appeared after\\n",
  "a big earthquake...\\c\\n",
  "I feel that there is a strong will\\n",
  "at work here.\\c\\n",
  "I'll be the one to solve this mystery!\\n",
  "Here we go!\\c$",
]

[msg.section_0.entries.144]
text = [
  "I'm on the expedition that got\\n",
  "dispatched to White Treehollow!\\c\\n",
  "Unlike the other Trainers around here,\\n",
  "I'm well versed in Pokémon battles!\\c$",
]

[msg.section_0.entries.145]
text = [
  "There are some extremely rare,\\n",
  "ancient plants growing in here!\\c\\n",
  "Hey! Watch where you're going.\\n",
  "You just stepped on that rare grass!\\c$",
]

[msg.section_0.entries.146]
text = [
  "In my old age, the only thing I have\\n",
  "left to enjoy is saving money!\\c\\n",
  "Time to battle, youngster!\\n",
  "The prize money is mine!\\c$",
]

[msg.section_0.entries.147]
text = [
  "You just tried to litter, didn't you?\\n",
  "You won't get past me!\\c$",
]

[msg.section_0.entries.148]
text = [
  "This area still isn't dangerous\\n",
  "in the slightest!\\c\\n",
  "Let's have a battle!\\n",
  "But remember, safety first!\\c$",
]

[msg.section_0.entries.149]
text = [
  "A ton of money is being spent on\\n",
  "managing this place.\\c\\n",
  "I'm too low on the ladder to know\\n",
  "the reason.\\c\\n",
  "I just do what I'm told and battle!\\c$",
]

[msg.section_0.entries.150]
text = [
  "Hmph! This area isn't challenging\\n",
  "at all!\\c\\n",
  "I'll finish you off quickly and work\\n",
  "my way up higher!\\c$",
]

[msg.section_0.entries.151]
text = [
  "...! ...!\\n",
  "... ...! ... ...!\\c\\n",
  "My telepathy isn't working?\\n",
  "Argh...\\l\\n",
  "In that case, let's battle!\\c$",
]

[msg.section_0.entries.152]
text = [
  "I came to this place to battle you!\\c$",
]

[msg.section_0.entries.153]
text = [
  "I hear the upper areas are full of\\n",
  "super-strong Trainers!\\c\\n",
  "None of that really matters to me,\\n",
  "though. I'm sticking to this area.\\c\\n",
  "Come on, let's battle!\\c$",
]

[msg.section_0.entries.154]
text = [
  "Using smiles to communicate with Pokémon\\n",
  "is kind of a psychic power,\\l\\n",
  "don't you think?\\c\\n",
  "OK! Show me how well you raised your\\n",
  "Pokémon with your psychic communication!\\c$",
]

[msg.section_0.entries.155]
text = [
  "I might be able to bend a spoon,\\n",
  "but I won't bend my beliefs!\\c\\n",
  "I'm aiming for the top and I won't stop!\\n",
  "Here comes the noble Psychic!\\c$",
]

[msg.section_0.entries.156]
text = [
  "It's always been my dream to work as\\n",
  "a researcher in Black Tower!\\c\\n",
  "What kind of research am I doing?\\n",
  "It's highly confidential, of course!\\l\\n",
  "Let's battle!\\c$",
]

[msg.section_0.entries.157]
text = [
  "Behold! This is the result of my long\\n",
  "years of devoted research!\\c$",
]

[msg.section_0.entries.158]
text = [
  "I smell a conspiracy brewing in\\n",
  "this building.\\c\\n",
  "Eh? You want to know what a conspiracy\\n",
  "smells like?\\c\\n",
  "Umm... Err...\\n",
  "Forget it! Let's battle!\\c$",
]

[msg.section_0.entries.159]
text = [
  "Wow, this building is so tall!\\n",
  "How does it not fall over?\\c\\n",
  "You don't care?\\n",
  "Well, let's battle, then!\\c$",
]

[msg.section_0.entries.160]
text = [
  "My test scores are always average!\\n",
  "Taste the power of the ordinary!\\c$",
]

[msg.section_0.entries.161]
text = [
  "If I make it to the top floor, I'll\\n",
  "be able to pass my entrance exams!\\c\\n",
  "That's what I heard, at least.\\n",
  "I'm not going to let you get in my way!\\c$",
]

[msg.section_0.entries.162]
text = [
  "As someone who was born in Black City,\\n",
  "I want to climb Black Tower at least\\l\\n",
  "once. Let's see how far I can get!\\c$",
]

[msg.section_0.entries.163]
text = [
  "My sister is a really popular Waitress!\\c\\n",
  "I'm here working hard to become as\\n",
  "nice a person as she is!\\c$",
]

[msg.section_0.entries.164]
text = [
  "It's so refreshing to put my face against\\n",
  "the cool floor! It feels great!\\c\\n",
  "You want to cool off, too?\\n",
  "No way! This is my floor!\\c$",
]

[msg.section_0.entries.165]
text = [
  "I skipped all the way here. ♪\\n",
  "Tra la la! ♪ Battle time!\\c$",
]

[msg.section_0.entries.166]
text = [
  "We always keep an assortment of the most\\n",
  "exquisite Pokémon in order to provide our\\l\\n",
  "Trainers with the best possible battles!\\c$",
]

[msg.section_0.entries.167]
text = [
  "I'm both a Trainer and a Waiter.\\c\\n",
  "Put it together, and that makes me a...\\n",
  "...Traitor? What?! Take that back!\\c$",
]

[msg.section_0.entries.168]
text = [
  "My little sister hasn't returned since\\n",
  "she first entered this place...\\c\\n",
  "Oh no! Could she have been kidnapped?\\c\\n",
  "Was it you? Did you kidnap her?\\n",
  "Where is she? Give my sister back!\\c$",
]

[msg.section_0.entries.169]
text = [
  "I was throwing a serving tray. You know,\\n",
  "like a discus. No reason to get yelled at.\\c\\n",
  "So I'm here till things calm down at work!\\n",
  "Let's play!\\c$",
]

[msg.section_0.entries.170]
text = [
  "They say this tower goes all the way up\\n",
  "into outer space!\\c\\n",
  "Pretty cool, huh? Heh heh. I'm going to\\n",
  "be the first to make it to space!\\c$",
]

[msg.section_0.entries.171]
text = [
  "You're a Trainer, too, right?\\n",
  "Let's have some fun! Battle me!\\c$",
]

[msg.section_0.entries.172]
text = [
  "I trained a ton with my Pokémon, so\\n",
  "we came here to test our strength!\\c\\n",
  "I wonder if I can make it to the top!\\c$",
]

[msg.section_0.entries.173]
text = [
  "I'm going to defeat you so I can get\\n",
  "shopping money!\\c$",
]

[msg.section_0.entries.174]
text = [
  "Right, try this... Let's rattle!\\n",
  "Err...no, no, trying again... Let's brawl!\\c\\n",
  "No, hm, rattle, brat, brawl...hmmm...\\c\\n",
  "Trying... Not clicking...\\n",
  "How about... Let's battle!\\c$",
]

[msg.section_0.entries.175]
text = [
  "Check me out! I'm going to make it to\\n",
  "the top with these Pokémon!\\c$",
]

[msg.section_0.entries.176]
text = [
  "So, whenever I win, I get prize money.\\n",
  "But where does it come from?\\c\\n",
  "Is everyone getting paid? That must\\n",
  "add up to a crazy amount of money!\\c\\n",
  "As long as I get mine, I don't care,\\n",
  "I suppose...\\c$",
]

[msg.section_0.entries.177]
text = [
  "Hey, man, wanna have a battle? Let's\\n",
  "just take it slow and easy.\\c$",
]

[msg.section_0.entries.178]
text = [
  "My goal for this month is to make it\\n",
  "to the next area!\\c\\n",
  "Planning makes perfect, so they say.\\n",
  "You've got to have goals!\\c$",
]

[msg.section_0.entries.179]
text = [
  "Yo! Check out the Pokémon friends\\n",
  "I've made on this journey!\\c$",
]

[msg.section_0.entries.180]
text = [
  "I teamed up with my daughter to\\n",
  "make it this far!\\c\\n",
  "We make a strong team, and we don't plan\\n",
  "on losing to any Trainers in here!\\c$",
]

[msg.section_0.entries.181]
text = [
  "First-class Trainers only carry\\n",
  "first-class items!\\c\\n",
  "Check out the exquisite craftsmanship\\n",
  "of these Poké Balls!\\c$",
]

[msg.section_0.entries.182]
text = [
  "Have you gotten used to\\n",
  "White Treehollow?\\c\\n",
  "You can't let your guard down, though!\\n",
  "You never know what you'll run into!\\c$",
]

[msg.section_0.entries.183]
text = [
  "I'm not all smiles, you know!\\n",
  "Here's a taste of my rage!\\c$",
]

[msg.section_0.entries.184]
text = [
  "This place is perfect for training!\\n",
  "My Pokémon keep getting stronger!\\c\\n",
  "Check out their progress!\\c$",
]

[msg.section_0.entries.185]
text = [
  "Battle time! With this prize money, I'll\\n",
  "take my Pokémon to the hot springs!\\c$",
]

[msg.section_0.entries.186]
text = [
  "Whenever I think of the bakery I'm going\\n",
  "to start in the future, I feel like I can\\l\\n",
  "overcome any obstacle!\\c\\n",
  "I tell you, it sure is great to have\\n",
  "a dream!\\c$",
]

[msg.section_0.entries.187]
text = [
  "I really love rice! It's the only thing\\n",
  "I can eat in the morning!\\c\\n",
  "So why am I working at a bakery, you\\n",
  "ask? Well, where else should I work?!\\c\\n",
  "Agh! I can't decide what to do!\\n",
  "Guess I'll take my doubts out on you!\\c$",
]

[msg.section_0.entries.188]
text = [
  "I'm here with my class on a field\\n",
  "trip, but they went on ahead of me...\\c\\n",
  "I've been trying my best to track them\\n",
  "down, but all I've found is some graffiti.\\c\\n",
  "This one says, “Slowpoke Teacher!\\\"\\n",
  "Grrr... They won't get away with this!\\c$",
]

[msg.section_0.entries.189]
text = [
  "I know lots of secret techniques to\\n",
  "get my Preschoolers to stop\\l\\n",
  "crying and go to sleep.\\c\\n",
  "Do you think you can get the better\\n",
  "of my secrets? Let's find out!\\c$",
]

[msg.section_0.entries.190]
text = [
  "I'm going to give this battle my all\\n",
  "in order to be myself!\\c$",
]

[msg.section_0.entries.191]
text = [
  "I'm not going back outside until I become\\n",
  "the most awesome guy in the universe!\\c$",
]

[msg.section_0.entries.192]
text = [
  "Hmph... Here comes another one.\\n",
  "Can none of you give me a challenge?\\c\\n",
  "I'll give you weakling Trainers a\\n",
  "taste of reality!\\c$",
]

[msg.section_0.entries.193]
text = [
  "When you've got a rival with which to\\n",
  "compete, it's easy to get motivated!\\c\\n",
  "All right! I officially recognize you\\n",
  "as my new rival!\\c$",
]

[msg.section_0.entries.194]
text = [
  "My legion of Pokémon are all\\n",
  "third-tier black belts!\\c$",
]

[msg.section_0.entries.195]
text = [
  "Long ago, I used to stay cooped up\\n",
  "in a dark room...\\c\\n",
  "But then I came here and grew stronger.\\n",
  "I became a true Battle Girl!\\c\\n",
  "I owe it all to my Pokémon, who convinced\\n",
  "me to leave that room and go outside.\\c$",
]

[msg.section_0.entries.196]
text = [
  "I came here to cut loose with my bros.\\c\\n",
  "We're gonna teach these punk Trainers\\n",
  "a thing or three about battles!\\c$",
]

[msg.section_0.entries.197]
text = [
  "You the one that's been messin'\\n",
  "with my bros around here?\\c\\n",
  "It's time to put an end to that!\\n",
  "Bring it!\\c$",
]

[msg.section_0.entries.198]
text = [
  "We've got rules around these parts,\\n",
  "and I'll see that they're obeyed.\\c\\n",
  "Who makes the rules, you ask?\\n",
  "That's not for you to know!\\c$",
]

[msg.section_0.entries.199]
text = [
  "Have you lost your way?\\c\\n",
  "Heh heh. If you can beat me, I might\\n",
  "be able to spare a hint or two.\\c\\n",
  "That's part of a Policeman's job,\\n",
  "after all.\\c$",
]

[msg.section_0.entries.200]
text = [
  "Such delicious looking leaves... Munch!\\n",
  "Yum! A bit of this and a bit of that!\\c\\n",
  "...So good! Nom nom nom...\\n",
  "No, I won't share with you!\\c$",
]

[msg.section_0.entries.201]
text = [
  "Sometimes traces are found that seem to\\n",
  "indicate that people used to live here...\\c\\n",
  "Could this have been the home of some\\n",
  "unknown ancient people?\\c\\n",
  "It's wild thinking about it...\\n",
  "Anyway, let's have a battle!\\c$",
]

[msg.section_0.entries.202]
text = [
  "I've been in here so long, I can't\\n",
  "remember the last time I saw a mountain.\\c\\n",
  "I may be a Hiker without a mountain, but\\n",
  "I still know my way around a battle!\\c$",
]

[msg.section_0.entries.203]
text = [
  "There's a theory that says an\\n",
  "underground people lived here long ago...\\c\\n",
  "Do you think there's any truth to that?\\c\\n",
  "I believe it. That's why I'm here doing\\n",
  "this research! Let's battle!\\c$",
]

[msg.section_0.entries.204]
text = [
  "Oh! A person! Great timing!\\n",
  "Say, what day is it?\\c\\n",
  "Uh...already? If that's the case, then\\n",
  "I've been in here for a week!\\c\\n",
  "Guess I'll battle you and then head home!\\c$",
]

[msg.section_0.entries.205]
text = [
  "I'm just an ordinary investigator,\\n",
  "but I feel like a Boss Trainer!\\c\\n",
  "Mwa ha ha!\\n",
  "If you want to go to the next area,\\l\\n",
  "you'll need to defeat me first!\\c$",
]

[msg.section_0.entries.206]
text = [
  "See those roots?\\n",
  "They're all part of the giant white tree!\\l\\n",
  "Quite a sight, aren't they?\\c\\n",
  "These roots go right down to the depths!\\n",
  "Think about it--here we are, fighting\\l\\n",
  "inside the heart of White Treehollow!\\c$",
]

[msg.section_0.entries.207]
text = [
  "No future! No matter how old I get,\\n",
  "I've got no future!\\c\\n",
  "My Pokémon and I will show you what\\n",
  "punk is all about!\\c$",
]

[msg.section_0.entries.208]
text = [
  "I still need my Pokémon to get stronger!\\c\\n",
  "Bring out your Poké Balls. Let's battle!\\c$",
]

[msg.section_0.entries.209]
text = [
  "I'm on orders from the boss!\\n",
  "I need to test your strength!\\c$",
]

[msg.section_0.entries.210]
text = [
  "Power's all about how you use it!\\n",
  "I'll show you the right way!\\c$",
]

[msg.section_0.entries.211]
text = [
  "I'll obliterate any Trainer that\\n",
  "crosses my path!\\c\\n",
  "I intend to be the only one to survive\\n",
  "Black Tower!\\c$",
]

[msg.section_0.entries.212]
text = [
  "As someone who was born in Black City,\\n",
  "dark impulses swirl within me...\\c\\n",
  "In order to fulfill these impulses,\\n",
  "I must continue to battle in here!\\c$",
]

[msg.section_0.entries.213]
text = [
  "I've seen it! The result of this battle\\n",
  "is already known to me!\\c$",
]

[msg.section_0.entries.214]
text = [
  "Hee hee! I'll go easy on you!\\n",
  "It will still be a breeze for me, I'm sure.\\c$",
]

[msg.section_0.entries.215]
text = [
  "I'm gonna make my way to the top and\\n",
  "defeat the boss of this place!\\c\\n",
  "Then I'll remodel this building and\\n",
  "make it into something much cuter!\\c\\n",
  "A rainbow-colored skyscraper sounds\\n",
  "pretty nice, right? Let's get started!\\c$",
]

[msg.section_0.entries.216]
text = [
  "And your rating is... Let's see...\\n",
  "Here we go! Your rating is BK1192296!\\c\\n",
  "B-class Pokémon, huh?\\n",
  "I shouldn't have any difficulty with you!\\c$",
]

[msg.section_0.entries.217]
text = [
  "Under this lab coat is my aloha shirt!\\n",
  "As soon as I finish my work here,\\l\\n",
  "I'm going straight to Undella Town!\\c\\n",
  "Come on! Let me get this data from you\\n",
  "quickly so I can get out of here!\\c$",
]

[msg.section_0.entries.218]
text = [
  "For a researcher of Pokémon battles,\\n",
  "Black Tower is the perfect testing site!\\c$",
]

[msg.section_0.entries.219]
text = [
  "Cough cough...\\n",
  "So...weak...\\c\\n",
  "Need...medicine...\\n",
  "...G-g-gulp!\\c\\n",
  "OK! Full recovery! Prepare yourself,\\n",
  "because here I come! Hyah!\\c$",
]

[msg.section_0.entries.220]
text = [
  "I don't feel like doing my homework!\\n",
  "Hey, how about you do it for me?\\c\\n",
  "No? You want me to do my own homework?\\n",
  "No way!\\c$",
]

[msg.section_0.entries.221]
text = [
  "Let's shake hands before battle!\\n",
  "It's always best to be pleasant!\\c$",
]

[msg.section_0.entries.222]
text = [
  "People call me a money-grubber.\\n",
  "Why? Because I live to make money!\\c\\n",
  "When you've got money,\\n",
  "you can buy your hopes and dreams!\\c\\n",
  "I'm going to defeat you and get even\\n",
  "more prize money!\\c$",
]

[msg.section_0.entries.223]
text = [
  "Welcome home, honey! Would you like\\n",
  "to eat now or after your bath?\\c\\n",
  "Neither? OK!\\n",
  "A Pokémon battle it is, then!\\c$",
]

[msg.section_0.entries.224]
text = [
  "Tee hee hee! I've saved up a lot after\\n",
  "winning so many times in a row!\\c\\n",
  "If I can defeat you, I should have\\n",
  "enough to buy that Munna pillow I've\\l\\n",
  "always wanted!\\c$",
]

[msg.section_0.entries.225]
text = [
  "Don't you ever get tired of this\\n",
  "nonstop battling?\\l\\n",
  "That's why I decided to quit battling!\\c\\n",
  "...Kidding!\\n",
  "Take this!\\c$",
]

[msg.section_0.entries.226]
text = [
  "Hey, hey! They call me the rude Waiter!\\c\\n",
  "Nothing and no one can make me be polite!\\n",
  "Move it! Let's get this battle on!\\c$",
]

[msg.section_0.entries.227]
text = [
  "I'm on orders to let only strong\\n",
  "Trainers get past this point.\\l\\n",
  "Let's have your best shot!\\c$",
]

[msg.section_0.entries.228]
text = [
  "I looked up my horoscope for today,\\n",
  "and it said I'd have an awful day!\\c\\n",
  "It's OK, though. I'll show destiny\\n",
  "who's boss!\\c$",
]

[msg.section_0.entries.229]
text = [
  "Whoa, whoa, whoa!\\n",
  "Watch out!\\c$",
]

[msg.section_0.entries.230]
text = [
  "My mentor taught me some amazing\\n",
  "strategies! There's no way I can lose!\\c$",
]

[msg.section_0.entries.231]
text = [
  "No matter how many times I fall down,\\n",
  "I get back up! I've got the guts to\\l\\n",
  "make it to the top!\\c\\n",
  "Wooo! Here I go!\\c$",
]

[msg.section_0.entries.232]
text = [
  "Mwa ha ha ha!\\n",
  "My dream is to take over the world!\\c\\n",
  "I'll start by conquering this place!\\c$",
]

[msg.section_0.entries.233]
text = [
  "They say this building reaches into\\n",
  "the stars. How romantic!\\l\\n",
  "I want to take a swim in the Milky Way.\\c\\n",
  "Hee hee! Here we go! I'll show you the\\n",
  "power of my dreams!\\c$",
]

[msg.section_0.entries.234]
text = [
  "My dad is out of work, so I've got to\\n",
  "provide for our family instead!\\c\\n",
  "This prize money is mine!\\c$",
]

[msg.section_0.entries.235]
text = [
  "MY POKÉ-MON...STRONG...\\n",
  "THERE-FORE...VIC-TOR-Y...\\c\\n",
  "Hee hee. How was my robot impression?\\c$",
]

[msg.section_0.entries.236]
text = [
  "The other day some kid came up to me and\\n",
  "started calling me his mentor.\\c\\n",
  "I let it go to my head and taught him a\\n",
  "couple of strategies.\\c\\n",
  "It was all a bunch of random stuff I made\\n",
  "up, though.\\l\\n",
  "Don't look at me like that!\\c$",
]

[msg.section_0.entries.237]
text = [
  "I'm still on my first year here, but\\n",
  "I wonder how long it will take to get to\\l\\n",
  "the top. I won't let you get there first!\\c$",
]

[msg.section_0.entries.238]
text = [
  "How about a battle?\\c\\n",
  "When you don't think you can win,\\n",
  "it might be a good idea to go train in\\l\\n",
  "the lower areas.\\c$",
]

[msg.section_0.entries.239]
text = [
  "If you're having trouble around here,\\n",
  "don't even think about going further!\\c$",
]

[msg.section_0.entries.240]
text = [
  "All of us Pokéfans have come together to\\n",
  "explore and defeat this dungeon!\\c\\n",
  "We'll be the first to reach the bottom!\\c$",
]

[msg.section_0.entries.241]
text = [
  "Trying to become the best in here just\\n",
  "isn't realistic for me.\\c\\n",
  "What's that? You're aiming to become\\n",
  "the strongest?\\c\\n",
  "You'd better be able to beat me without\\n",
  "breaking a sweat then!\\c$",
]

[msg.section_0.entries.242]
text = [
  "You may have breezed your way through\\n",
  "this place, but that stops here!\\c\\n",
  "If you want to go further, you need to\\n",
  "be determined!\\c\\n",
  "Me, I lack determination--that's why\\n",
  "I keep hanging around here and battling.\\c$",
]

[msg.section_0.entries.243]
text = [
  "You're about halfway through this cave.\\c\\n",
  "Seems like a good time for a quick test of\\n",
  "your bonds with your Pokémon!\\c$",
]

[msg.section_0.entries.244]
text = [
  "My husband and I came to challenge this\\n",
  "place together, but he gave up in the\\l\\n",
  "upper areas!\\c\\n",
  "How pathetic!\\n",
  "Well, I'm going to keep going!\\c$",
]

[msg.section_0.entries.245]
text = [
  "I'd better let my Pokémon out of their\\n",
  "Poké Balls pretty soon.\\c\\n",
  "Here we go! Time for some exercise!\\c$",
]

[msg.section_0.entries.246]
text = [
  "Hrmm...\\n",
  "I'm going to need a lot more money\\l\\n",
  "if I want to open my own bakery.\\c\\n",
  "I need to win more prize money!\\n",
  "Let's battle!\\c$",
]

[msg.section_0.entries.247]
text = [
  "You're out of breath already?\\n",
  "Think you can beat me in that state?\\c$",
]

[msg.section_0.entries.248]
text = [
  "Oh! Take a look at this!\\n",
  "It's more graffiti from my kids...\\c\\n",
  "It says, “We're going back now.\\\"\\c\\n",
  "Now I know they're safe, at least.\\n",
  "Now I can focus on battling you!\\c$",
]

[msg.section_0.entries.249]
text = [
  "Hi! I'm not a very serious person, so\\n",
  "let's have a carefree battle!\\c$",
]

[msg.section_0.entries.250]
text = [
  "I checked out the lower areas,\\n",
  "but I didn't stand a chance against any\\l\\n",
  "of the Trainers down there!\\c\\n",
  "This area is closer to my skill level, so\\n",
  "I'll train here for a while. Let's battle!\\c$",
]

[msg.section_0.entries.251]
text = [
  "My heart is one with that of my Pokémon!\\c\\n",
  "We want to become stronger! That's all!\\n",
  "Let's go!\\c$",
]

[msg.section_0.entries.252]
text = [
  "Oi! The Boss Trainer wiped the floor with\\n",
  "us! We'll take revenge on you instead!\\c$",
]

[msg.section_0.entries.253]
text = [
  "Check out the speed of my Pokémon!\\n",
  "Is this a result of our training?\\c\\n",
  "They're so fast! Can you even catch\\n",
  "their movement?\\c$",
]

[msg.section_0.entries.254]
text = [
  "You'd better train harder if you want\\n",
  "to reach the lower areas!\\c$",
]

[msg.section_0.entries.255]
text = [
  "I'm not sure, but I may have finally\\n",
  "achieved enlightenment after all\\l\\n",
  "this hard training!\\c\\n",
  "Possibly finally enlightened battle time!\\c$",
]

[msg.section_0.entries.256]
text = [
  "Heh! I don't take it easy on anyone--\\n",
  "no matter how weak they are! Come on!\\c$",
]

[msg.section_0.entries.257]
text = [
  "Guys like me came here from around Unova\\n",
  "to get a taste of that prize money!\\c$",
]

[msg.section_0.entries.258]
text = [
  "I cannot guarantee your safety past\\n",
  "this point!\\c\\n",
  "The areas below have no laws!\\n",
  "You'd best not venture any further!\\c$",
]

[msg.section_0.entries.259]
text = [
  "Play by the rules for fun battles in\\n",
  "White Treehollow.\\c\\n",
  "That's this month's slogan!\\n",
  "Let's have ourselves a fun battle!\\c$",
]

[msg.section_0.entries.260]
text = [
  "...So you made it all the way here, huh?\\n",
  "I'll see how strong you really are!\\c$",
]

[msg.section_0.entries.261]
text = [
  "Hello there!\\n",
  "Greeting everyone you pass is one of\\l\\n",
  "the traditions of mountain climbing!\\c\\n",
  "In here, though, instead of greetings,\\n",
  "we have Pokémon battles!\\c$",
]

[msg.section_0.entries.262]
text = [
  "What clean air! This is one of the\\n",
  "blessings of White Treehollow.\\c\\n",
  "Let's give our Pokémon a chance\\n",
  "to smell this delicious air!\\c$",
]

[msg.section_0.entries.263]
text = [
  "Hey! Didn't I run into you in one of\\n",
  "the upper areas?\\c\\n",
  "Well, let's see if you've gotten any\\n",
  "stronger since then!\\c$",
]

[msg.section_0.entries.264]
text = [
  "So many Trainers just trample their\\n",
  "way through this beautiful cave...\\c\\n",
  "As a defender of nature, I must take\\n",
  "a stand!\\c$",
]

[msg.section_0.entries.265]
text = [
  "I'm sick of long prologues!\\n",
  "Let's get this battle on!\\c$",
]

[msg.section_0.entries.266]
text = [
  "It's up to us cleanup volunteers to\\n",
  "keep this cave free of litter!\\c\\n",
  "I still like to enjoy a Pokémon battle\\n",
  "during my breaks, though!\\c$",
]

[msg.section_0.entries.267]
text = [
  "We're doing our best to preserve this\\n",
  "cave so that Trainers can enjoy battling\\l\\n",
  "here even a hundred years from now.\\c\\n",
  "This is a pretty lofty goal, agreed?\\n",
  "Have a Pokémon battle with me!\\c$",
]

[msg.section_0.entries.268]
text = [
  "Just...one...more battle, and I'll have\\n",
  "completed my quota for the day.\\c\\n",
  "OK, calling on the last of my energy now!\\n",
  "Jumping in!\\c$",
]

[msg.section_0.entries.269]
text = [
  "Enjoy your battles here while you\\n",
  "still can.\\c\\n",
  "Go any further than this, and your\\n",
  "battles will be anything but fun.\\l\\n",
  "With that said, bring out your Pokémon!\\c$",
]

[msg.section_0.entries.270]
text = [
  "Everyone keeps saying that the areas\\n",
  "past this one are terribly difficult.\\c\\n",
  "You won't last five minutes unless you're\\n",
  "one of the strongest of the strong.\\c\\n",
  "Sounds like a challenge!\\n",
  "I'll beat them all with these Pokémon!\\c$",
]

[msg.section_0.entries.271]
text = [
  "After the first move, I knew\\n",
  "I had lost the battle...\\l\\n",
  "I'd never met a Trainer like that before.\\c\\n",
  "Hmm... You don't look like much. This\\n",
  "shouldn't be a tough battle... Let's go!\\c$",
]

[msg.section_0.entries.272]
text = [
  "The time has come for me to unleash\\n",
  "my true power!\\c\\n",
  "Woooo!\\n",
  "My Pokémon! Awaken!\\c$",
]

[msg.section_0.entries.273]
text = [
  "Phew... Take a deep breath...\\n",
  "Become one with my Pokémon...\\c\\n",
  "Our hearts become one...\\n",
  "Here we go!\\c$",
]

[msg.section_0.entries.274]
text = [
  "I'm going to win a bunch of prize money\\n",
  "so I can jump in a bathtub full of money!\\c\\n",
  "It's every kid's dream!\\c$",
]

[msg.section_0.entries.275]
text = [
  "I can see it! That muddy, ocherous aura\\n",
  "rising from you!\\c\\n",
  "You do look rather strong!\\n",
  "But I won't lose to you!\\c$",
]

[msg.section_0.entries.276]
text = [
  "Heh heh. Just need to finish installing\\n",
  "this surveillance camera...and done!\\c\\n",
  "Eep! You there! You saw me, didn't you?\\n",
  "I'm going to have to silence you!\\c$",
]

[msg.section_0.entries.277]
text = [
  "That Trainer...\\n",
  "As a subject of research, that Trainer\\l\\n",
  "is of extreme interest to me.\\c\\n",
  "It's Trainers like that who keep me\\n",
  "entranced by the research I do here.\\l\\n",
  "Hmm... What kind of Trainer are you?\\c$",
]

[msg.section_0.entries.278]
text = [
  "Whenever I'm in an elevator or a lift, I\\n",
  "get the urge to jump to feel the gravity.\\c\\n",
  "You could say this jump-liftevator\\n",
  "wants a battle with you!\\c$",
]

[msg.section_0.entries.279]
text = [
  "Every research lab desires data from\\n",
  "high-level Trainers.\\c\\n",
  "We're all interested in seeing just how\\n",
  "much strength Trainers can foster in\\l\\n",
  "their Pokémon.\\c\\n",
  "Now, it's time to get some more data!\\c$",
]

[msg.section_0.entries.280]
text = [
  "I need to climb higher so I can look\\n",
  "down on ignorant fools like you!\\c\\n",
  "Here I come, peasant!\\n",
  "Bow and scrape before me!\\c$",
]

[msg.section_0.entries.281]
text = [
  "You see, I'm gathering data on\\n",
  "every Trainer I can.\\c\\n",
  "I'm not a weak Trainer like you.\\n",
  "We're on a completely different level!\\c\\n",
  "Ha ha! If it bothers you so much, then\\n",
  "let's settle the question with a battle!\\c$",
]

[msg.section_0.entries.282]
text = [
  "There was a special column in the\\n",
  "school newspaper about my friend who\\l\\n",
  "made it to the top area!\\c\\n",
  "Man, I'm jealous...\\c\\n",
  "I've gotta keep trying harder if I want\\n",
  "to be like him someday!\\c$",
]

[msg.section_0.entries.283]
text = [
  "My dad works in this building. His job is\\n",
  "to seek out really strong Trainers!\\c\\n",
  "I keep training so that one day my\\n",
  "dad might pick me!\\c$",
]

[msg.section_0.entries.284]
text = [
  "Black City is nothing but buildings with\\n",
  "nowhere to play!\\c\\n",
  "This place might be kind of dangerous,\\n",
  "but it's way more fun to play here!\\c\\n",
  "You can be as loud as you want, and\\n",
  "no one yells at you! TAAAAAKE that!\\c$",
]

[msg.section_0.entries.285]
text = [
  "To battle or not to battle... Hrmm...\\n",
  "Battle...no battle...battle...\\l\\n",
  "No battle...\\l\\n",
  "This is the last petal...\\l\\n",
  "Battle!\\c$",
]

[msg.section_0.entries.286]
text = [
  "Take my advice!\\n",
  "The areas above here are not safe!\\c$",
]

[msg.section_0.entries.287]
text = [
  "Thank you for coming.\\n",
  "We always appreciate your patronage.\\c\\n",
  "Today we'll be serving a special menu.\\c$",
]

[msg.section_0.entries.288]
text = [
  "Out of curiosity, I checked out the upper\\n",
  "areas, but I got chased around by some\\l\\n",
  "bloodthirsty Trainers! Barbarians!\\c\\n",
  "This area is much more soothing.\\n",
  "Let's have a comfortable battle!\\c$",
]

[msg.section_0.entries.289]
text = [
  "Welcome! One charming and magnificent\\n",
  "battle coming right up!\\c$",
]

[msg.section_0.entries.290]
text = [
  "Argh! That goody-two-shoes geek made\\n",
  "it all the way to the top!\\c\\n",
  "Now he's the talk of the school!\\c\\n",
  "Grrr... I'm green with envy.\\n",
  "I want to be popular, too!\\c$",
]

[msg.section_0.entries.291]
text = [
  "We Young Detectives are going to crack\\n",
  "the mystery of this strange building!\\c\\n",
  "I got it!\\n",
  "You--you're the one behind everything!\\c$",
]

[msg.section_0.entries.292]
text = [
  "I traded for these Pokémon with my\\n",
  "friend, so we have bonds of friendship!\\c$",
]

[msg.section_0.entries.293]
text = [
  "We Young Detectives are on our way!\\c\\n",
  "It's our opportunity to show off our\\n",
  "great reasoning skills!\\c$",
]

[msg.section_0.entries.294]
text = [
  "The adults keep telling us that the upper\\n",
  "areas are too dangerous for us!\\c\\n",
  "I say they're wrong! I'll be just fine\\n",
  "as long as I've got my Pokémon.\\c$",
]

[msg.section_0.entries.295]
text = [
  "There's so many things I want to buy\\n",
  "that I just can't keep track!\\l\\n",
  "Hurry! I need more prize money!\\c$",
]

[msg.section_0.entries.296]
text = [
  "Are you going to keep going up?\\n",
  "Me, I think I'll stick to this area.\\c\\n",
  "The battles are getting tougher and\\n",
  "tougher, and I smell danger up there...\\c\\n",
  "Maybe I'll just pack it up here.\\n",
  "Let's have one final battle!\\c$",
]

[msg.section_0.entries.297]
text = [
  "I can't get discouraged here!\\n",
  "I'm going to make it to the top\\l\\n",
  "before anyone else!\\c$",
]

[msg.section_0.entries.298]
text = [
  "A letter from my mom just arrived.\\n",
  "She demands that I return home...\\c\\n",
  "She has nothing on her mind but setting\\n",
  "me up to get married...\\c\\n",
  "Never mind that.\\n",
  "I'm not giving up in here! Let's battle!\\c$",
]

[msg.section_0.entries.299]
text = [
  "You get this far, and it feels like you're\\n",
  "even higher up than the tallest building\\l\\n",
  "in Black City!\\c\\n",
  "So let's do it right!\\n",
  "Let's call this our Battle in the Sky!\\c$",
]

[msg.section_0.entries.300]
text = [
  "Whoaaa! What is up with this area?\\n",
  "Everyone is crazy strong in here!\\l\\n",
  "What about you? Are you strong, too?!\\c$",
]

[msg.section_0.entries.301]
text = [
  "Roaarrr!\\n",
  "First hit for the win!\\c$",
]

[msg.section_0.entries.302]
text = [
  "Over ten thousand battles, and I'm\\n",
  "still just not good enough!\\c\\n",
  "I need to push beyond my limits if I want\\n",
  "to go any further!\\c$",
]

[msg.section_0.entries.303]
text = [
  "I hear that the other Pokéfans are\\n",
  "having lots of trouble in this area!\\c\\n",
  "We were doing really great up until now!\\c\\n",
  "We just need to get stronger!\\n",
  "Get set! Let's battle!\\c$",
]

[msg.section_0.entries.304]
text = [
  "We Pokéfans need to work together at\\n",
  "times like this, so that we can overcome\\l\\n",
  "these obstacles together!\\c\\n",
  "OK! I've been entrusted with the Pokémon\\n",
  "of other Pokéfans! Let's battle!\\c$",
]

[msg.section_0.entries.305]
text = [
  "I've fallen off the deep end, so look out!\\n",
  "Here I come with my crazy Pokémon!\\c$",
]

[msg.section_0.entries.306]
text = [
  "The prize-money amounts get pretty\\n",
  "huge this far in!\\c\\n",
  "The more battles I win, the closer I get\\n",
  "to opening up my very own bakery!\\c\\n",
  "Hee hee! I can't wait!\\n",
  "Let's get cookin'!\\c$",
]

[msg.section_0.entries.307]
text = [
  "Here's a taste of what my finely\\n",
  "developed Pokémon can dish out!\\c$",
]

[msg.section_0.entries.308]
text = [
  "Ha ha ha! This is just the beginning!\\n",
  "It gets much tougher up ahead!\\c\\n",
  "The fast and furious battles in your\\n",
  "future will surely burn you to a crisp!\\c$",
]

[msg.section_0.entries.309]
text = [
  "Hey, my babies!\\n",
  "Come get this Trainer!\\c$",
]

[msg.section_0.entries.310]
text = [
  "Get this far in, and everyone's eyes\\n",
  "are glinting with ambition...\\c\\n",
  "You look pretty strong, too.\\n",
  "Let's battle! Hi-yah!\\c$",
]

[msg.section_0.entries.311]
text = [
  "I'm working my way to the bottom in\\n",
  "search of the legendary Black Belt!\\c\\n",
  "I won't let anyone stop me!\\n",
  "Get out of my way!\\c$",
]

[msg.section_0.entries.312]
text = [
  "This place is sacred ground for the\\n",
  "strong! The weak may not enter!\\c$",
]

[msg.section_0.entries.313]
text = [
  "They call the area below this one\\n",
  "the abyss!\\c\\n",
  "Weak Trainers like you have no place\\n",
  "there! Better run home to mama!\\c$",
]

[msg.section_0.entries.314]
text = [
  "The strongest one in my group happens\\n",
  "to be in charge of this area.\\c\\n",
  "If you can't beat me, then you don't\\n",
  "have a chance against the boss!\\c$",
]

[msg.section_0.entries.315]
text = [
  "No way, no way, no way!\\n",
  "I don't want to lose!\\c$",
]

[msg.section_0.entries.316]
text = [
  "You better watch out! I'm not like the\\n",
  "other Roughnecks in here!\\c$",
]

[msg.section_0.entries.317]
text = [
  "Hey! You wanna join up with me?\\c\\n",
  "If we group up, we can take down\\n",
  "anyone in here!\\c\\n",
  "Wha--? You're refusing my offer?\\n",
  "Who do you think you are?\\c$",
]

[msg.section_0.entries.318]
text = [
  "The Trainers around here are all too\\n",
  "strong for us to control!\\c\\n",
  "The strong make the rules down here,\\n",
  "and the rest of us just follow along.\\c\\n",
  "So, are you a rule maker or a follower?\\c$",
]

[msg.section_0.entries.319]
text = [
  "My orders are simple!\\n",
  "I just need to defeat you all!\\c$",
]

[msg.section_0.entries.320]
text = [
  "Whoa! I can hear the voices of the\\n",
  "spirits of White Treehollow!\\c\\n",
  "Yes! Yes, I hear and understand!\\n",
  "You would have me defeat this Trainer?\\c$",
]

[msg.section_0.entries.321]
text = [
  "As long as you just go one step at\\n",
  "a time, you'll overcome any obstacle!\\c$",
]

[msg.section_0.entries.322]
text = [
  "Phew! Time for a break!\\c\\n",
  "Oh wait...another Trainer?\\c\\n",
  "Humph... Will I ever have time to relax?\\c$",
]

[msg.section_0.entries.323]
text = [
  "Thanks to the help of researchers and\\n",
  "Trainers like you, the expedition into\\l\\n",
  "these caves is progressing nicely!\\c\\n",
  "As an expression of my thanks,\\n",
  "what say we have a Pokémon battle?\\c$",
]

[msg.section_0.entries.324]
text = [
  "There's some group in here called\\n",
  "the Pokémon Fan Club.\\c\\n",
  "Sometimes there are scuffles between\\n",
  "them and members of the expedition.\\c\\n",
  "Wait a second... Are you one of them?!\\c$",
]

[msg.section_0.entries.325]
text = [
  "I'll tell it to you straight.\\c\\n",
  "I don't think I have the slightest\\n",
  "chance of beating you.\\c$",
]

[msg.section_0.entries.326]
text = [
  "Want to see what a veteran's moves are\\n",
  "all about? I guess I'll give you a demo!\\c$",
]

[msg.section_0.entries.327]
text = [
  "This may be a lawless area, but we've\\n",
  "still got to keep it clean!\\l\\n",
  "Same goes for Pokémon battles!\\c$",
]

[msg.section_0.entries.328]
text = [
  "Yeah, that's right! I came here for the\\n",
  "money at first!\\c\\n",
  "But now I'm here because I want\\n",
  "to meet strong Trainers!\\c$",
]

[msg.section_0.entries.329]
text = [
  "Do you have talent as a Trainer?\\c$",
]

[msg.section_0.entries.330]
text = [
  "Don't you get it? Open your eyes!\\n",
  "We're being watched!\\c\\n",
  "That's right! Our battles are being\\n",
  "monitored by...them!\\c$",
]

[msg.section_0.entries.331]
text = [
  "Can you feel this incredible power?\\n",
  "The Trainers around here all have some\\l\\n",
  "extremely powerful Pokémon!\\c\\n",
  "Especially yours...\\n",
  "Nothing else in the area comes close!\\c$",
]

[msg.section_0.entries.332]
text = [
  "I'll be the Boss Trainer in this area real\\n",
  "soon! You'll see!\\c\\n",
  "First things first--I'll set an example\\n",
  "by defeating you!\\c$",
]

[msg.section_0.entries.333]
text = [
  "I came all the way here, and every battle\\n",
  "has been a snoozefest!\\c\\n",
  "Can't anyone in here give me a challenge?\\c$",
]

[msg.section_0.entries.334]
text = [
  "A world without love...\\n",
  "If they say power is all that matters,\\l\\n",
  "then I'll use my power to change\\l\\n",
  "the rules!\\c$",
]

[msg.section_0.entries.335]
text = [
  "Where do you think you're going?!\\n",
  "You came all this way! I'm not going\\l\\n",
  "to let you just run off somewhere!\\c$",
]

[msg.section_0.entries.336]
text = [
  "Even a relatively strong Trainer isn't\\n",
  "likely to be able to make it any further.\\c\\n",
  "How many Trainers do you think actually\\n",
  "make it to the end of this place?\\c\\n",
  "Maybe one in every ten thousand.\\n",
  "Only the truly gifted can make it!\\c$",
]

[msg.section_0.entries.337]
text = [
  "Battle more! Battle harder!\\n",
  "Show me the explosive chemical reactions\\l\\n",
  "of a furious battle between Trainers!\\c$",
]

[msg.section_0.entries.338]
text = [
  "Come this far, and you can forget\\n",
  "laws and rules!\\c\\n",
  "In here, only the strongest are in\\n",
  "total control...\\c\\n",
  "If you can't beat puny little me,\\n",
  "then you're better off going home!\\c$",
]

[msg.section_0.entries.339]
text = [
  "The strength of my Pokémon is the\\n",
  "result of a life dedicated to research!\\c\\n",
  "With these Pokémon, I'm going to take\\n",
  "over all of Black Tower!\\c$",
]

[msg.section_0.entries.340]
text = [
  "Ah! I found a weak one!\\n",
  "Pounce!\\c$",
]

[msg.section_0.entries.341]
text = [
  "Every time I win a battle, I use the prize\\n",
  "money to plant a tree...\\c\\n",
  "I'm going green and ecoclean!\\n",
  "What are you going to try against me?\\c$",
]

[msg.section_0.entries.342]
text = [
  "Oh no! This is the end!\\n",
  "What am I talking about?\\c\\n",
  "I'll tell you what! Your clean streak of\\n",
  "victories just reached a screeching halt!\\c$",
]

[msg.section_0.entries.343]
text = [
  "If a battle ends too quickly, it's no fun!\\n",
  "Let's take it slow and easy!\\c$",
]

[msg.section_0.entries.344]
text = [
  "Heh heh! I've won so much prize money,\\n",
  "I don't even see people's faces anymore.\\l\\n",
  "I just see the money that I can win!\\c$",
]

[msg.section_0.entries.345]
text = [
  "I used to try battling at school, but no\\n",
  "one could stand up to me.\\c\\n",
  "But the Trainers here are a blast to\\n",
  "battle against! I don't have to hold\\l\\n",
  "back at all!\\c$",
]

[msg.section_0.entries.346]
text = [
  "The owner of the café where I work told\\n",
  "me to test if your strength is for real.\\c\\n",
  "Let's see what we find out!\\c$",
]

[msg.section_0.entries.347]
text = [
  "I see that you've finally arrived...\\c\\n",
  "You'll need to give it your all if you\\n",
  "want to proceed any further!\\c$",
]

[msg.section_0.entries.348]
text = [
  "Welcome to the danger zone,\\n",
  "where power is everything!\\c$",
]

[msg.section_0.entries.349]
text = [
  "Oww oww oww!\\n",
  "What is with the Trainers around here?\\c\\n",
  "Why are they all so bloodthirsty?\\c\\n",
  "Eek! You, too? OK, I give up!\\n",
  "I'll battle you!\\c$",
]

[msg.section_0.entries.350]
text = [
  "That last opponent was such a weakling,\\n",
  "my Pokémon are demanding another battle!\\c\\n",
  "How about you?\\n",
  "Come on! No holds barred!\\c$",
]

[msg.section_0.entries.351]
text = [
  "I've made it this far! There's no denying\\n",
  "my fame now!\\c\\n",
  "Heh heh! If I can keep this up, I'll get\\n",
  "to the top and become the most famous\\l\\n",
  "Trainer in all of Black City!\\c$",
]

[msg.section_0.entries.352]
text = [
  "Nice job getting this far!\\n",
  "Time to taste the power of the\\l\\n",
  "Pokémon of the Elite Four!\\c$",
]

[msg.section_0.entries.353]
text = [
  "Do you feel someone's gaze?\\n",
  "Take a look at the ceiling!\\c\\n",
  "Someone's watching our battles through\\n",
  "that camera!\\c$",
]

[msg.section_0.entries.354]
text = [
  "You want to go up higher?\\n",
  "How about you first worry about how\\l\\n",
  "you're going to survive down here?\\c$",
]

[msg.section_0.entries.355]
text = [
  "It's so calming to see the look of anger\\n",
  "and despair on my opponents' faces\\l\\n",
  "whenever I annihilate them in battle!\\c\\n",
  "Hee hee hee! I'm going to wallop you\\n",
  "until there's nothing left!\\c$",
]

[msg.section_0.entries.356]
text = [
  "I've overcome countless battles on\\n",
  "my way to this area.\\c\\n",
  "I wonder what kind of Trainers\\n",
  "are in the upper areas.\\c\\n",
  "I can't even imagine how strong they are.\\c\\n",
  "Might as well get started. Let's battle!\\c$",
]

[msg.section_0.entries.357]
text = [
  "Step on the weak and obey the strong!\\n",
  "That's the only justice you'll find here!\\c$",
]

[msg.section_0.entries.358]
text = [
  "I'm usually good at sensing these things.\\n",
  "You're not an ordinary Trainer, are you?\\c\\n",
  "Well...neither am I!\\c$",
]

[msg.section_0.entries.359]
text = [
  "After all these battles and all this\\n",
  "walking... I'm still only halfway!\\c\\n",
  "The road to the top sure is long!\\c\\n",
  "Let's take a minute to renew our\\n",
  "motivation with an invigorating battle!\\c$",
]

[msg.section_0.entries.360]
text = [
  "If I want to beat the dangerous\\n",
  "Trainers in here, I need to\\l\\n",
  "become dangerous myself!\\c\\n",
  "Kyaa ha ha! Kyee hee hee!\\n",
  "Here I come--one, two, threeee!\\c$",
]

[msg.section_0.entries.361]
text = [
  "Hee hee! My Pokémon were in the top 100\\n",
  "in a Pokéfan contest where we voted for\\l\\n",
  "the strongest Pokémon!\\l\\n",
  "Pretty incredible, huh?\\c$",
]

[msg.section_0.entries.362]
text = [
  "I already came here once, but I gave up\\n",
  "and went back to the surface.\\c\\n",
  "Everyone up there is so weak, though,\\n",
  "so I came back for a challenge!\\c\\n",
  "I guess I just can't enjoy battles\\n",
  "unless I have to scrape through...\\c$",
]

[msg.section_0.entries.363]
text = [
  "After overcoming countless obstacles\\n",
  "together, our hearts have become one!\\c\\n",
  "My Pokémon are me, and I am my Pokémon!\\n",
  "Battle on!\\c$",
]

[msg.section_0.entries.364]
text = [
  "Looks like it's finally time for me to bring\\n",
  "out this Pokémon--my secret weapon!\\c$",
]

[msg.section_0.entries.365]
text = [
  "We Pokéfans came here as a group, and\\n",
  "we've really gotten to know each other\\l\\n",
  "during our adventures here!\\c\\n",
  "No opponent can stand in our way now!\\c$",
]

[msg.section_0.entries.366]
text = [
  "One day, when I open my own bakery,\\n",
  "I'm going to make all kinds of buns in the\\l\\n",
  "shape of Pokémon!\\c\\n",
  "I can't wait!\\n",
  "I just need to save up more prize money!\\c$",
]

[msg.section_0.entries.367]
text = [
  "I eat five meals per day! Eating so much\\n",
  "gives me the energy to battle!\\c$",
]

[msg.section_0.entries.368]
text = [
  "I don't have to explain to you\\n",
  "what's about to happen here, do I?\\c$",
]

[msg.section_0.entries.369]
text = [
  "Aha! Something just clicked!\\c\\n",
  "I haven't felt this kind of excitement in\\n",
  "a long time! Off we go!\\c$",
]

[msg.section_0.entries.370]
text = [
  "Around here, if you let down your guard\\n",
  "for even a second, you'll lose!\\c$",
]

[msg.section_0.entries.371]
text = [
  "I worked like mad with Pokémon to train\\n",
  "and get stronger...\\l\\n",
  "But what is true strength?\\c\\n",
  "Is it defeating someone who is strong?\\n",
  "Or is it simply about gaining recognition?\\c$",
]

[msg.section_0.entries.372]
text = [
  "Even the most ferocious Pokémon cower\\n",
  "in fear before the legendary Black Belt!\\l\\n",
  "Away they scurry like Patrat in a hurry!\\c\\n",
  "My Pokémon are a courageous bunch, so\\n",
  "I've got nothing to worry about!\\c$",
]

[msg.section_0.entries.373]
text = [
  "The guy I've been training with suddenly\\n",
  "started going on about what true\\l\\n",
  "strength is when we got to this area...\\c\\n",
  "What an idiot. True strength is about\\n",
  "beating strong Trainers like you!\\c$",
]

[msg.section_0.entries.374]
text = [
  "I don't let physical things affect my\\n",
  "perception. I look with my heart!\\c$",
]

[msg.section_0.entries.375]
text = [
  "I'm going to become an even stronger\\n",
  "Battle Girl and defeat the boss in here!\\c$",
]

[msg.section_0.entries.376]
text = [
  "Someday I'll take over this area and turn\\n",
  "it into a hive of scum and villainy!\\c$",
]

[msg.section_0.entries.377]
text = [
  "Mwa ha ha ha!\\n",
  "The fools just keep falling into my trap!\\c\\n",
  "Drop your money and be gone with you!\\n",
  "This is a villain's paradise!\\c$",
]

[msg.section_0.entries.378]
text = [
  "Sigh... I have to make the rounds all\\n",
  "alone down here. It's sure lonesome.\\c\\n",
  "I know... I'll bring out my Pokémon,\\n",
  "so I'm not alone anymore! Hey!\\c$",
]

[msg.section_0.entries.379]
text = [
  "The boss is in charge here.\\n",
  "We're just following orders.\\c\\n",
  "Sorry, newcomer, but I've got to\\n",
  "test your strength!\\c$",
]

[msg.section_0.entries.380]
text = [
  "People who live in White Forest tend\\n",
  "to like to take it easy. Most of them\\l\\n",
  "won't even set foot in here.\\c\\n",
  "I'm one of the few locals in this place,\\n",
  "and I'm proud of it! Let's battle!\\c$",
]

[msg.section_0.entries.381]
text = [
  "I've run out of food...\\n",
  "Food... Beautiful food... Give me food!\\c$",
]

[msg.section_0.entries.382]
text = [
  "Haven't I seen you somewhere before?\\c\\n",
  "You're a regular here now, are you?\\c\\n",
  "Yeah? That's good!\\n",
  "OK, then one...more...time!\\c$",
]

[msg.section_0.entries.383]
text = [
  "Once upon a time, a bunch of Drilbur got\\n",
  "together and competed to see who could\\l\\n",
  "dig the deepest!\\c\\n",
  "That's how this place was made!\\n",
  "Pardon me? You don't like my story?\\l\\n",
  "Then there's no alternative. We battle!\\c$",
]

[msg.section_0.entries.384]
text = [
  "It's been a long time since I joined this\\n",
  "expedition... But I still talk with my\\l\\n",
  "family every day over the Xtransceiver.\\c\\n",
  "Still, I miss them a lot! Let's battle.\\n",
  "My daughter gave me these Pokémon!\\c$",
]

[msg.section_0.entries.385]
text = [
  "Whoa! You're the Trainer that\\n",
  "everyone's been talking about!\\c\\n",
  "I've heard a lot about you!\\n",
  "Would you have a battle with me?\\c$",
]

[msg.section_0.entries.386]
text = [
  "Heh heh heh! After I retired, I took up\\n",
  "training as a hobby.\\c\\n",
  "Turns out I'm pretty good,\\n",
  "and now look where I am!\\c\\n",
  "You look pretty strong yourself.\\n",
  "Let's see who's stronger!\\c$",
]

[msg.section_0.entries.387]
text = [
  "Here we go!\\n",
  "Full power from the get-go!\\c$",
]

[msg.section_0.entries.388]
text = [
  "I won't say it again. You should go back!\\c\\n",
  "This is your last warning!\\c$",
]

[msg.section_0.entries.389]
text = [
  "If you gather all the strong Trainers\\n",
  "in one spot and force them to battle,\\l\\n",
  "they will only get stronger!\\c\\n",
  "It's all according to plan! Ha ha!\\n",
  "Battle and get stronger!\\c$",
]

[msg.section_0.entries.390]
text = [
  "I'm going to make it to the top and\\n",
  "go back to town as a hero!\\l\\n",
  "All the girls will want to be with me!\\c$",
]

[msg.section_0.entries.391]
text = [
  "Stop! You and I...\\n",
  "We must battle!\\c$",
]

[msg.section_0.entries.392]
text = [
  "I've made it this whole way without\\n",
  "losing even once!\\c\\n",
  "I wonder what it's like to lose a battle.\\c$",
]

[msg.section_0.entries.393]
text = [
  "The higher I climb, the more I feel\\n",
  "the gathering of a dark energy...\\c\\n",
  "I need to get stronger to be able to\\n",
  "fight this gathering darkness!\\c$",
]

[msg.section_0.entries.394]
text = [
  "I can see the great open sky\\n",
  "just beyond that wall there.\\c\\n",
  "The wind is blowing...\\n",
  "The clouds are rolling...\\l\\n",
  "Now that I'm calm, let's battle!\\c$",
]

[msg.section_0.entries.395]
text = [
  "I just saw a family of Trainers pass\\n",
  "through here, all relaxed and carefree!\\c\\n",
  "To think, even veterans like me have a\\n",
  "tough time battling in here...\\c\\n",
  "Everyone in here is so intense!\\n",
  "What about you?\\c$",
]

[msg.section_0.entries.396]
text = [
  "Hey! Honey, is that you?\\c\\n",
  "...Oops. You're not my wife.\\n",
  "Where did my wife and kids go off to?\\c\\n",
  "Hmmm...\\n",
  "Looks like Daddy is going to have to\\l\\n",
  "battle this stranger all alone!\\c$",
]

[msg.section_0.entries.397]
text = [
  "I saw some data regarding rapid\\n",
  "growth around here!\\c\\n",
  "I came to check it out for myself!\\c$",
]

[msg.section_0.entries.398]
text = [
  "Why of all places did we have to come\\n",
  "to Black Tower for our family vacation?\\c\\n",
  "I'll just have to take it out on any\\n",
  "Trainer that crosses my path!\\c$",
]

[msg.section_0.entries.399]
text = [
  "I used to work here doing research on\\n",
  "Trainers and Pokémon.\\c\\n",
  "After seeing the amazing battles between\\n",
  "Trainers in here, I had to give it a try\\l\\n",
  "for myself! That's why I quit and decided\\l\\n",
  "to become a Trainer!\\c$",
]

[msg.section_0.entries.400]
text = [
  "I've only chosen opponents that I know\\n",
  "I can beat!\\c\\n",
  "I'm great at judging a Trainer's\\n",
  "strength! I can tell you're weak!\\c$",
]

[msg.section_0.entries.401]
text = [
  "Dad brought us here for our family\\n",
  "vacation. I don't mind, but I know that\\l\\n",
  "my mom and sister don't want to be here.\\c\\n",
  "My dad sometimes lacks consideration...\\n",
  "Oh well, let's battle!\\c$",
]

[msg.section_0.entries.402]
text = [
  "Oho! How unlucky for you to run into me!\\n",
  "You haven't got a chance, I'm afraid.\\c$",
]

[msg.section_0.entries.403]
text = [
  "Everyone's talking about how a super-\\n",
  "strong Trainer showed up recently.\\c\\n",
  "Wait! Could it be you?!\\n",
  "Hey, have a battle with me!\\c$",
]

[msg.section_0.entries.404]
text = [
  "Hey! Come on!\\n",
  "There's no time for rest in here!\\c$",
]

[msg.section_0.entries.405]
text = [
  "Pokémon battles are the best way\\n",
  "to forget your worries!\\c\\n",
  "Really, as long as I have Pokémon\\n",
  "battles, I don't need anything else!\\c$",
]

[msg.section_0.entries.406]
text = [
  "I'll give it my all!\\n",
  "Excelsior!\\c$",
]

[msg.section_0.entries.407]
text = [
  "Our mission is to serve up battles just\\n",
  "as our customers like them!\\c$",
]

[msg.section_0.entries.408]
text = [
  "I only battled the Boss Trainer once,\\n",
  "but I'll never forget our match!\\c\\n",
  "I'm training to get stronger so that\\n",
  "one day I can have a rematch!\\c$",
]

[msg.section_0.entries.409]
text = [
  "We provide the premier battle service\\n",
  "in Black Tower!\\c$",
]

[msg.section_0.entries.410]
text = [
  "Brr... Brr...\\n",
  "It's getting c-c-cold in here...\\c\\n",
  "Hey, you!\\n",
  "Lend me your jacket!\\c$",
]

[msg.section_0.entries.411]
text = [
  "How long has it been since I started\\n",
  "battling in here?\\c\\n",
  "I started out as a total newbie, but\\n",
  "now I'm a true veteran Trainer!\\c\\n",
  "All right!\\n",
  "Let's get some practice in!\\c$",
]

[msg.section_0.entries.412]
text = [
  "The other day, there was a feature in\\n",
  "the newspaper about my adventures in\\l\\n",
  "Black Tower. It had my picture, too!\\c\\n",
  "I'm going to keep doing my best so I\\n",
  "can make the front page some day!\\c$",
]

[msg.section_0.entries.413]
text = [
  "I'm so angry at my dad!\\n",
  "Why did he have to pick such a scary\\l\\n",
  "place for our family vacation?\\c\\n",
  "How about the beach or a theme park?\\c\\n",
  "Grrr! Someone has to pay for this!\\n",
  "And that someone is you!\\c$",
]

[msg.section_0.entries.414]
text = [
  "I have no liking for complicated things!\\n",
  "Power is what counts in here...\\c\\n",
  "I love the simplicity of that!\\c$",
]

[msg.section_0.entries.415]
text = [
  "My friends get all dressed up and go out\\n",
  "clubbing, but it doesn't appeal to me.\\c\\n",
  "What I need is the fury of battles!\\n",
  "That's what I've dedicated my life to!\\c$",
]

[msg.section_0.entries.416]
text = [
  "I found this place in my travels and\\n",
  "decided to pop in.\\l\\n",
  "What an amazing place this is!\\c\\n",
  "Are you another powerful Trainer, the\\n",
  "likes of which I've never before seen?\\c$",
]

[msg.section_0.entries.417]
text = [
  "The areas up here are bigger than the\\n",
  "ones before. It's easy to get lost!\\c\\n",
  "At least there are lots of strong\\n",
  "Trainers to battle.\\l\\n",
  "No worries about finding opponents!\\c$",
]

[msg.section_0.entries.418]
text = [
  "This building is so tall, it goes straight\\n",
  "through the atmosphere into space.\\c\\n",
  "I thought that was just a myth, but I'm\\n",
  "starting to believe it may be true!\\c\\n",
  "Just how high do I have to climb to\\n",
  "reach the top of this place?\\c$",
]

[msg.section_0.entries.419]
text = [
  "My Pokémon have gotten a lot stronger on\\n",
  "this long journey! Check them out!\\c$",
]

[msg.section_0.entries.420]
text = [
  "Now that you've reached this area, you'll\\n",
  "start running into tons of Trainers who\\l\\n",
  "regularly place high in the PWT.\\c\\n",
  "Maybe you think you're pretty hot stuff,\\n",
  "but you'd better stay on your toes!\\c$",
]

[msg.section_0.entries.421]
text = [
  "OK, OK. Time for me to show off a side of\\n",
  "me that most people don't know about!\\c\\n",
  "This is my bad side! My wild-thing side!\\n",
  "Mwa ha ha! I'm going to destroy you!\\c$",
]

[msg.section_0.entries.422]
text = [
  "We've trained and trained to get here!\\c\\n",
  "My Pokémon have endured so much! I've\\n",
  "cried for them while offering my support!\\l\\n",
  "And it all went to bringing this victory!\\c$",
]

[msg.section_0.entries.423]
text = [
  "You fit the description... You're the\\n",
  "Trainer everyone's been talking about!\\c\\n",
  "They say you can't be beat, but I'll\\n",
  "prove them wrong here and now!\\c$",
]

[msg.section_0.entries.424]
text = [
  "Oooh! Our hearts have bonded.\\n",
  "I can hear them! What's that? OK, got it!\\c\\n",
  "My Pokémon are communicating with me from\\n",
  "inside their Poké Balls.\\l\\n",
  "They want me to defeat you!\\c$",
]

[msg.section_0.entries.425]
text = [
  "There's no limit to the love my Pokémon\\n",
  "and I have for one another! Here we go!\\c$",
]

[msg.section_0.entries.426]
text = [
  "No matter how tough things get, as long\\n",
  "as you keep following your dreams,\\l\\n",
  "you can always get back on your feet!\\c\\n",
  "My goal of opening my very own bakery\\n",
  "is my treasured dream!\\l\\n",
  "Do you think you can defeat my dream?\\c$",
]

[msg.section_0.entries.427]
text = [
  "Pound and twist the dough. Then into the\\n",
  "oven it goes! Hee hee! It's baking time!\\c$",
]

[msg.section_0.entries.428]
text = [
  "Only one guy has ever defeated me.\\n",
  "I'll never, ever forgive him...\\l\\n",
  "Someday, I'll show him. But first...\\c\\n",
  "A little battle will take care of you!\\c$",
]

[msg.section_0.entries.429]
text = [
  "The kids at preschool call me Beauty\\n",
  "Belt, 'cause I'm both pretty and strong!\\c\\n",
  "What? Humph! No, I don't force them\\n",
  "to call me that!\\c$",
]

[msg.section_0.entries.430]
text = [
  "I saw the legendary Black Belt going\\n",
  "down into the lower areas.\\c\\n",
  "He's got a real dangerous aura about\\n",
  "him. I got spooked just being nearby!\\c\\n",
  "Oh, you think I'm pathetic? Well, I'll\\n",
  "show you! I'm actually totally strong!\\c$",
]

[msg.section_0.entries.431]
text = [
  "I've got a PWT victory under my belt!\\c\\n",
  "Defeating amateurs like you is like taking\\n",
  "candy from a baby!\\c$",
]

[msg.section_0.entries.432]
text = [
  "I'm ready for a battle! How about you?\\n",
  "Yeah... You look ready to rock!\\c$",
]

[msg.section_0.entries.433]
text = [
  "Seems there's some kid in here who\\n",
  "just tears through the Boss Trainers.\\c\\n",
  "Could that be you? Guess I'll make short\\n",
  "work of you...and make a name for myself!\\c$",
]

[msg.section_0.entries.434]
text = [
  "I've only come this far thanks to my\\n",
  "White Treehollow rivals.\\l\\n",
  "We compete and cheer each other on!\\c$",
]

[msg.section_0.entries.435]
text = [
  "My Pokémon are a rowdy bunch!\\n",
  "Our battles are really intense!\\c$",
]

[msg.section_0.entries.436]
text = [
  "Yo, yo! You there, Trainer!\\n",
  "You're pretty full of yourself!\\c\\n",
  "I'll prove you're not as strong as they\\n",
  "say you are!\\c$",
]

[msg.section_0.entries.437]
text = [
  "I'm gonna take everyone down, become\\n",
  "the boss, and make this place my own.\\c\\n",
  "At least, that's what I used to say.\\n",
  "But everyone here is just too strong.\\c\\n",
  "I bet you're going to wipe the floor\\n",
  "with me, too!\\c$",
]

[msg.section_0.entries.438]
text = [
  "Stop right there! This is the police!\\n",
  "Hands up! OK, now, feet up, too!\\l\\n",
  "Stay still! Now is my chance to attack!\\c$",
]

[msg.section_0.entries.439]
text = [
  "I found you!\\n",
  "You're the one they're all talking about!\\c\\n",
  "I'll stop you right here!\\n",
  "Get ready, because here I come!\\c$",
]

[msg.section_0.entries.440]
text = [
  "In a quiet place like this, do you ever\\n",
  "have the sudden desire to shout?\\c\\n",
  "I sure do!\\n",
  "AAAAAAAAH!\\c\\n",
  "Phew...\\n",
  "I feel a lot better now. Let's battle!\\c$",
]

[msg.section_0.entries.441]
text = [
  "You must be one of the ancient\\n",
  "underground people that lives here!\\c\\n",
  "Yes! There's no mistaking it! Show me\\n",
  "the ancient power of your people!\\c$",
]

[msg.section_0.entries.442]
text = [
  "I want to go down to the lower areas\\n",
  "and explore.\\c\\n",
  "But the Trainers down there\\n",
  "are way too strong for me...\\c\\n",
  "Compared to their Pokémon, mine are\\n",
  "meek, modest, and mild!\\c$",
]

[msg.section_0.entries.443]
text = [
  "Hey! You're getting to be quite\\n",
  "famous around these parts!\\c\\n",
  "They say your battling style is\\n",
  "really impressive.\\l\\n",
  "Would you mind giving me a demo?\\c$",
]

[msg.section_0.entries.444]
text = [
  "So you're my next target, huh?\\n",
  "I hope you can put up a fight!\\c$",
]

[msg.section_0.entries.445]
text = [
  "Recently, I've even been having\\n",
  "dreams about exploring this place.\\c\\n",
  "Man, what's wrong with me?\\n",
  "Ahh... Must battle more...\\c$",
]

[msg.section_0.entries.446]
text = [
  "Ha ha! It's my duty and my joy to teach\\n",
  "youngsters like you a lesson in life!\\c$",
]

[msg.section_0.entries.447]
text = [
  "That's right! We're all Trainers from\\n",
  "birth! Never wavering, only battling!\\c$",
]

[msg.section_0.entries.448]
text = [
  "So you're the one!\\c\\n",
  "How lucky for me to run into you here!\\n",
  "Let's have a battle!\\c$",
]

[msg.section_0.entries.449]
text = [
  "I don't have a particular reason,\\n",
  "but let me test your strength!\\c$",
]

[msg.section_0.entries.450]
text = [
  "Whoosh!\\n",
  "What is that powerful energy I feel?\\c\\n",
  "If we don't do something, we'll get\\n",
  "swallowed up by it! Let's battle!\\c$",
]

[msg.section_0.entries.451]
text = [
  "Are you ready?\\n",
  "Bam!\\c$",
]

[msg.section_0.entries.452]
text = [
  "Not many Trainers can make it this far.\\n",
  "You must be one of the chosen few.\\c\\n",
  "So we'll battle, and it'll be a close\\n",
  "match--closer than any you'll find below!\\c$",
]

[msg.section_0.entries.453]
text = [
  "I feel a great pressure pushing down\\n",
  "on us from the upper areas!\\c\\n",
  "Ooh... I'm so frightened...\\n",
  "Eeeeeek!\\c$",
]

[msg.section_0.entries.454]
text = [
  "My Pokémon are overflowing with power!\\n",
  "You can't stop us!\\c$",
]

[msg.section_0.entries.455]
text = [
  "Apparently, we're being monitored\\n",
  "in here.\\c\\n",
  "Harrumph!\\n",
  "Whoever they are, I'll give them a\\l\\n",
  "battle worth watching!\\c$",
]

[msg.section_0.entries.456]
text = [
  "I've heard of you! They say you've got\\n",
  "some really strong Pokémon!\\c\\n",
  "Whatever. No way are your Pokémon\\n",
  "gonna be a match for mine!\\c$",
]

[msg.section_0.entries.457]
text = [
  "Argh! Everyone in here is running\\n",
  "about and making a ruckus!\\c\\n",
  "Why can't they just calm down a bit\\n",
  "and help us with our research?\\c$",
]

[msg.section_0.entries.458]
text = [
  "Oh! It's you! I finally found you!\\n",
  "I've been looking for you!\\c\\n",
  "Now show me just how powerful\\n",
  "you really are!\\c$",
]

[msg.section_0.entries.459]
text = [
  "Wah ha ha! I win again!\\c\\n",
  "Forget about research!\\n",
  "I just want to have fun!\\c$",
]

[msg.section_0.entries.460]
text = [
  "So you're the new big star that\\n",
  "everyone's been talking about, huh?\\c\\n",
  "I'd better knock you down now before\\n",
  "you get too big for your own good!\\c$",
]

[msg.section_0.entries.461]
text = [
  "Some dude was in here talking about\\n",
  "how he won the PWT, but we battled\\l\\n",
  "and I beat him easily!\\c\\n",
  "Down here, I guess it doesn't matter how\\n",
  "good a person was back on the surface!\\c$",
]

[msg.section_0.entries.462]
text = [
  "Why are you looking all absentminded?\\n",
  "In a battle of minds, I can't be beat!\\c$",
]

[msg.section_0.entries.463]
text = [
  "All of my classmates gave up back\\n",
  "down in the lower areas.\\c\\n",
  "For the honor of Class Tepig,\\n",
  "I will defeat you!\\c$",
]

[msg.section_0.entries.464]
text = [
  "Everyone in my family is a really\\n",
  "strong Trainer!\\c\\n",
  "I'll show you some of the techniques\\n",
  "that I've been taught since I was a kid!\\c$",
]

[msg.section_0.entries.465]
text = [
  "Kneel down before me!\\n",
  "I shall be the queen of this area!\\c$",
]

[msg.section_0.entries.466]
text = [
  "Are you the Trainer everyone has been\\n",
  "talking about?\\c\\n",
  "True? Well, then, you shall receive\\n",
  "true VIP service!\\c$",
]

[msg.section_0.entries.467]
text = [
  "We are professional Waiters.\\c\\n",
  "No matter how strong you Trainers\\n",
  "become, we will follow and serve you!\\c$",
]

[msg.section_0.entries.468]
text = [
  "I won't ever stop battling until I'm\\n",
  "the strongest Waitress in the world!\\c$",
]

[msg.section_0.entries.469]
text = [
  "In order to provide the absolute\\n",
  "best possible battles,\\c\\n",
  "I always keep the strongest possible\\n",
  "Pokémon with me!\\c$",
]

[msg.section_0.entries.470]
text = [
  "I'm going to take off into outer space\\n",
  "from the roof of Black Tower!\\c\\n",
  "Of course I'll be going with my Pokémon!\\c$",
]

[msg.section_0.entries.471]
text = [
  "Tap tap tap... Just three taps on\\n",
  "my Poké Balls is all it takes...\\c\\n",
  "OK! As long as I do that, there's\\n",
  "no way I'll lose a battle.\\c$",
]

[msg.section_0.entries.472]
text = [
  "Phew! I started all over from the bottom\\n",
  "and climbed my way back up here!\\c\\n",
  "I'm going to sweep this area this time!\\c$",
]

[msg.section_0.entries.473]
text = [
  "OK! It's quiz time!\\c\\n",
  "In a few moments, a Trainer will be crying\\n",
  "after he or she is defeated by these\\l\\n",
  "incredible Pokémon! Now, just which\\l\\n",
  "Trainer will it be?\\c\\n",
  "The correct answer is... You!\\c$",
]

[msg.section_0.entries.474]
text = [
  "Someday, I'll be a princess!\\n",
  "I'm going to save up lots of prize money\\l\\n",
  "and build a great white castle!\\c$",
]

[msg.section_0.entries.475]
text = [
  "Ah! It's you!\\c\\n",
  "I hear that if I can beat you, I'll get\\n",
  "a ton of prize money!\\l\\n",
  "You won't get away from me!\\c$",
]

[msg.section_0.entries.476]
text = [
  "Get your Pokémon out here!\\n",
  "I'll send you all packing!\\c$",
]

[msg.section_0.entries.477]
text = [
  "There may not be anything there,\\n",
  "but I still want to reach the top!\\l\\n",
  "I want to show that I'm the strongest!\\c\\n",
  "...What fools we all are!\\n",
  "Let us have a foolish battle!\\c$",
]

[msg.section_0.entries.478]
text = [
  "I'm so close to the top, but it seems\\n",
  "like I've hit a wall!\\l\\n",
  "Is this the limit for me?\\c\\n",
  "No way! I won't accept that!\\c$",
]

[msg.section_0.entries.479]
text = [
  "I ran as fast as I could to get here!\\n",
  "Run with me! One...two...three...go!\\c$",
]

[msg.section_0.entries.480]
text = [
  "I'm always thinking about my Pokémon,\\n",
  "even when I'm eating or taking a bath!\\c\\n",
  "Maybe that's only natural for a pro\\n",
  "Trainer like me! What about you?\\c$",
]

[msg.section_0.entries.481]
text = [
  "Out of all the people in the world,\\n",
  "Pokémon love me the most!\\c\\n",
  "Just this morning I got electrocuted,\\n",
  "bitten, and burned by Pokémon!\\c\\n",
  "Pokémon just love to play with me!\\n",
  "Heh heh... I bet you're super jealous!\\c$",
]

[msg.section_0.entries.482]
text = [
  "We may be near the bottom, but we\\n",
  "Pokéfans are still determined!\\c$",
]

[msg.section_0.entries.483]
text = [
  "You may have done well up until now,\\n",
  "but this is the end for you!\\c$",
]

[msg.section_0.entries.484]
text = [
  "Here in White Treehollow, I learned a bit\\n",
  "about the harshness of the real world.\\l\\n",
  "You can't keep winning forever!\\c$",
]

[msg.section_0.entries.485]
text = [
  "I'm really sorry, but I'm going to have\\n",
  "to defeat your Pokémon...\\c$",
]

[msg.section_0.entries.486]
text = [
  "I've almost got enough saved up to\\n",
  "open my bakery!\\c\\n",
  "I hate to be like this, but this victory\\n",
  "must and shall be mine!\\c$",
]

[msg.section_0.entries.487]
text = [
  "I've run into all sorts of different\\n",
  "Trainers from all walks of life--\\l\\n",
  "including some real weirdos!\\c\\n",
  "Ha ha! Battling down here makes it way\\n",
  "easier to relate to other people!\\c$",
]

[msg.section_0.entries.488]
text = [
  "Things sure are going well for you!\\c\\n",
  "I think it's about time you tasted the\\n",
  "bitter fruit of defeat!\\c$",
]

[msg.section_0.entries.489]
text = [
  "Even adults must respect and obey\\n",
  "their Teachers!\\c$",
]

[msg.section_0.entries.490]
text = [
  "The result of our long training...\\n",
  "Taste my Pokémon's secret technique!\\c$",
]

[msg.section_0.entries.491]
text = [
  "Training is tough and painful!\\n",
  "But it's through such pain that we\\l\\n",
  "achieve true strength!\\c$",
]

[msg.section_0.entries.492]
text = [
  "Alder's grandson, Benga...\\c\\n",
  "I don't know where he is, but the\\n",
  "rumor is that he is incredibly strong!\\c\\n",
  "My strength is pretty incredible, too!\\n",
  "Can you withstand my attacks?!\\c$",
]

[msg.section_0.entries.493]
text = [
  "Enough talk! Everything I need to\\n",
  "know can be learned through battle!\\c$",
]

[msg.section_0.entries.494]
text = [
  "Make it this far, and you'll find nothing\\n",
  "but immensely strong Trainers!\\c\\n",
  "You must be among the strongest!\\n",
  "Let's have a battle!\\c$",
]

[msg.section_0.entries.495]
text = [
  "As long as I counter your counter of\\n",
  "my counterattack, I can win!\\c$",
]

[msg.section_0.entries.496]
text = [
  "The boss left us behind and went to\\n",
  "the bottom, saying he was going\\l\\n",
  "to go out with a bang. Bam!\\c\\n",
  "He is so cool!\\n",
  "I want to go out with a bang, too!\\c$",
]

[msg.section_0.entries.497]
text = [
  "After today, I'm done being a Roughneck!\\n",
  "I'm going to start my new life as a\\l\\n",
  "proper Trainer!\\c\\n",
  "In honor of my fresh start, let's battle!\\n",
  "Ah! The exhilaration of the new!\\c$",
]

[msg.section_0.entries.498]
text = [
  "No stuffy, pointless rules in here!\\n",
  "You're as free as your strength allows!\\c\\n",
  "This place is a paradise for a rogue\\n",
  "Policeman like me.\\c\\n",
  "I never want to go back to the surface!\\n",
  "I just want to battle in here forever!\\c$",
]

[msg.section_0.entries.499]
text = [
  "This place cannot be mastered!\\c\\n",
  "You Trainers don't seem to be aware\\n",
  "of that, though. You never give up!\\c$",
]

[msg.section_0.entries.500]
text = [
  "A mystery is only a mystery if you\\n",
  "ponder it. Stop thinking about it,\\l\\n",
  "and it's no longer a mystery.\\c\\n",
  "That's it! I solved the mystery!\\n",
  "Looks like my work here is done!\\l\\n",
  "That's my story and I'm sticking to it.\\c$",
]

[msg.section_0.entries.501]
text = [
  "With these Pokémon, I've conquered\\n",
  "mountains around the world!\\c$",
]

[msg.section_0.entries.502]
text = [
  "I never said call me,\\n",
  "'cause you ain't got my number.\\c\\n",
  "Goin' all the way to the bottom,\\n",
  "stealin' all your thunder.\\c\\n",
  "You know I will defeat you,\\n",
  "and I ain't even tryin'.\\c\\n",
  "You got no say, lost the play,\\n",
  "and you'll soon be cryin'.\\c\\n",
  "Better believe--don't gotta be this way.\\n",
  "Get your rhyme on time and win the day!\\c$",
]

[msg.section_0.entries.503]
text = [
  "The word is that you made it down here\\n",
  "at an unbelievable pace.\\c\\n",
  "Everyone's talking about you, you know?\\n",
  "Show me what you're made of!\\c$",
]

[msg.section_0.entries.504]
text = [
  "Unbeatable Trainers and unsolvable\\n",
  "mysteries...\\c\\n",
  "We expedition members are getting tired--\\n",
  "getting to where we don't care anymore!\\c\\n",
  "But not me! I'm going to keep searching\\n",
  "for the truth until the bitter end!\\c$",
]

[msg.section_0.entries.505]
text = [
  "The mysteries of this cave? Who cares\\n",
  "about that anymore? Some things are\\l\\n",
  "better left alone, don't you think?\\c\\n",
  "I'm done with this expedition. Time for\\n",
  "me to enjoy some Pokémon battles!\\c$",
]

[msg.section_0.entries.506]
text = [
  "Everyone down here is so great.\\n",
  "No one litters at all!\\c\\n",
  "It makes sense that high-level Trainers\\n",
  "would have high-level manners!\\c\\n",
  "With no work for me to do, I've got\\n",
  "plenty of time to enjoy Pokémon battles!\\c$",
]

[msg.section_0.entries.507]
text = [
  "My power has founded a generation!\\n",
  "Think you can beat me? You're dreaming!\\c$",
]

[msg.section_0.entries.508]
text = [
  "I used to be the boss of one of the\\n",
  "upper areas, but I got bored and quit.\\c\\n",
  "It sure is a lot more exciting to take on\\n",
  "a strong Trainer as a challenger!\\c$",
]

[msg.section_0.entries.509]
text = [
  "The battles between Trainers at the\\n",
  "bottom are intense and destructive.\\c\\n",
  "I'm worried that their battles are going\\n",
  "to bring this whole place down...\\c$",
]

[msg.section_0.entries.510]
text = [
  "I used to always think that no one could\\n",
  "be a match for me...\\c\\n",
  "But then he appeared...\\n",
  "And everything changed...\\c\\n",
  "Argh! Could it be?\\n",
  "Could I actually be weak?!\\c$",
]

[msg.section_0.entries.511]
text = [
  "I can hear the pulsing rhythm of space...\\n",
  "Yes... It's very close now!\\c$",
]

[msg.section_0.entries.512]
text = [
  "I keep hearing rumors about how our\\n",
  "battles are being monitored...\\l\\n",
  "It's natural, I suppose.\\c\\n",
  "It's inevitable that people want to\\n",
  "see a Trainer like me battle!\\l\\n",
  "Mwahaha! I'll give them a show, all right!\\c$",
]

[msg.section_0.entries.513]
text = [
  "Yawn... I'm getting sleepy.\\n",
  "Everyone around here's just so weak.\\c\\n",
  "It only makes sense, I suppose. I mean,\\n",
  "I was the strongest before coming here.\\c\\n",
  "And then I trained here on top of that!\\n",
  "No one has a chance!\\c$",
]

[msg.section_0.entries.514]
text = [
  "I was poor when I was a kid, but I've\\n",
  "done well for myself as a Trainer!\\c\\n",
  "With all this prize money, I can eat\\n",
  "anything I want whenever I want!\\c$",
]

[msg.section_0.entries.515]
text = [
  "You must be well prepared\\n",
  "if you've made it this far.\\c\\n",
  "No rules! Anything goes!\\n",
  "It's all on the line, so let's battle!\\c$",
]

[msg.section_0.entries.516]
text = [
  "The more data we gather,\\n",
  "the stronger we become!\\c\\n",
  "The power of our analyses will one day\\n",
  "surpass the strength of you Trainers!\\c$",
]

[msg.section_0.entries.517]
text = [
  "The power of science continues to\\n",
  "advance...right out of the atmosphere!\\c$",
]

[msg.section_0.entries.518]
text = [
  "The strongest Trainers in the world--no,\\n",
  "in all the galaxy--are waiting at the top!\\c\\n",
  "Do you have what it takes to get there?\\c$",
]

[msg.section_0.entries.519]
text = [
  "Hmm...\\c\\n",
  "In what manner must I train my Pokémon\\n",
  "to match the vast strength of yours?\\c\\n",
  "Won't you tell me? Please?\\n",
  "A company secret, you say? How selfish!\\c$",
]

[msg.section_0.entries.520]
text = [
  "I understand!\\n",
  "You're obsessed with me, aren't you?\\c\\n",
  "It's OK! I am pretty amazing, going\\n",
  "head-to-head with the top Trainers!\\c\\n",
  "Sure, I'll let you battle me!\\n",
  "Just this once, though!\\c$",
]

[msg.section_0.entries.521]
text = [
  "After I make it to the top, I'm going to\\n",
  "write a strategy guide for Black Tower!\\c\\n",
  "Once it's published, I'll be rich!\\c$",
]

[msg.section_0.entries.522]
text = [
  "I'll end this battle in 30 seconds!\\n",
  "You can't beat me!\\c$",
]

[msg.section_0.entries.523]
text = [
  "I teach Pokémon battles at a famous\\n",
  "Trainers' School!\\c\\n",
  "If you come at me thinking I'm just some\\n",
  "girl, you'll walk away hurting!\\c$",
]

[msg.section_0.entries.524]
text = [
  "I'll get revenge for my friend's sake!\\n",
  "Take this!\\c$",
]

[msg.section_0.entries.525]
text = [
  "I won't laugh until I've conquered\\n",
  "Black Tower!\\c$",
]

[msg.section_0.entries.526]
text = [
  "May I please take your order?\\n",
  "OK! The full course it is!\\c\\n",
  "I gathered these Pokémon from across\\n",
  "the world! Here you are!\\c$",
]

[msg.section_0.entries.527]
text = [
  "You're finally nearing the end of\\n",
  "Black Tower.\\c\\n",
  "Are you fully prepared?\\c$",
]

[msg.section_0.entries.528]
text = [
  "Agh... Gah...\\n",
  "Guh!\\c\\n",
  "Is it just me, or is there not enough\\n",
  "oxygen in here? I'm getting dizzy...\\c\\n",
  "Gasp... Huff puff... No matter...\\n",
  "We shall battle!\\c$",
]

[msg.section_0.entries.529]
text = [
  "What makes a battle perfect is how we\\n",
  "show our feelings toward our Pokémon...\\l\\n",
  "Our kindness...enthusiasm...rigor...\\l\\n",
  "All part of a great battle!\\c$",
]

[msg.section_0.entries.530]
text = [
  "We're pretty high up now, aren't we?\\n",
  "I wonder if we're in space yet?\\c\\n",
  "Don't you get an outer-space vibe\\n",
  "from this area?\\c\\n",
  "Time for a space battle! Engage!\\c$",
]

[msg.section_0.entries.531]
text = [
  "I was on TV the other day, but the host\\n",
  "wouldn't stop babbling about this other\\l\\n",
  "Trainer--who wasn't even there!\\l\\n",
  "It was you they were talking about!\\c\\n",
  "I won't stand for it!\\c$",
]

[msg.section_0.entries.532]
text = [
  "It doesn't matter how strong you are!\\c\\n",
  "Why? Because I believe in my partners,\\n",
  "who have been with me through it all!\\c$",
]

[msg.section_0.entries.533]
text = [
  "I wonder what the town looks like\\n",
  "from all the way up top?\\c\\n",
  "Hee hee hee! I can't wait to see!\\n",
  "I'll beat you to the top!\\c$",
]

[msg.section_0.entries.534]
text = [
  "A popular Lass Trainer like me\\n",
  "can't afford to lose!\\c\\n",
  "In order to keep the spotlight on me,\\n",
  "I've got to keep winning! Shine on!\\c$",
]

[msg.section_0.entries.535]
text = [
  "This is the first time you've appeared\\n",
  "before me!\\c\\n",
  "That means that you are born anew\\n",
  "this day! Happy birthday to you!\\c$",
]

[msg.section_0.entries.536]
text = [
  "Even when I lost, I never used to think\\n",
  "that I couldn't overcome an opponent...\\c\\n",
  "But this place is just too much for me.\\n",
  "I'm at my limit, and it's frustrating!\\c$",
]

[msg.section_0.entries.537]
text = [
  "No matter how much I try, I can't get\\n",
  "past this area...\\c\\n",
  "Everyone in here is just too strong.\\n",
  "Could this be the final challenge?\\c\\n",
  "Hah. You look really strong, too.\\n",
  "Please, take it easy on me!\\c$",
]

[msg.section_0.entries.538]
text = [
  "Wha--? We're still not at the top yet?\\c\\n",
  "I wonder if this place really does reach\\n",
  "into outer space.\\c\\n",
  "I don't know how far I can get,\\n",
  "but I may as well keep battling!\\c$",
]

[msg.section_0.entries.539]
text = [
  "I can hear all sorts of explosions and\\n",
  "roars coming from up above.\\c\\n",
  "It sounds super dangerous.\\n",
  "I wonder if I'll be OK up there...\\c\\n",
  "...No! I'm not scared!\\n",
  "I made it all the way here, didn't I?\\c$",
]

[msg.section_0.entries.540]
text = [
  "My heart is racing!\\n",
  "I'm finally almost to the bottom!\\c\\n",
  "It's taken so long to come this far...\\c\\n",
  "But now, I've finally almost reached the\\n",
  "end! Ha ha ha! Here I come!\\c$",
]

[msg.section_0.entries.541]
text = [
  "Stop right there! I am the one who shall\\n",
  "claim the title as the strongest of all!\\c$",
]

[msg.section_0.entries.542]
text = [
  "I'm using the strongest Pokémon around!\\n",
  "How could I lose?!\\c\\n",
  "Why?! Why?! Why?!\\n",
  "Come on! Tell me why!\\c$",
]

[msg.section_0.entries.543]
text = [
  "I've met and said farewell to\\n",
  "countless Pokémon...\\c\\n",
  "These are the Pokémon that remain!\\c$",
]

[msg.section_0.entries.544]
text = [
  "Only we Pokéfans who are full of love\\n",
  "can conquer White Treehollow!\\c\\n",
  "The Pokéfans will paint the world anew\\n",
  "with the power of love!\\c$",
]

[msg.section_0.entries.545]
text = [
  "New prey has fallen into my trap!\\n",
  "Weakness is a crime around here!\\c$",
]

[msg.section_0.entries.546]
text = [
  "I've finally opened up my own bakery with\\n",
  "all the prize money I won in here!\\c\\n",
  "I've come back to deliver warm and tasty\\n",
  "buns and battles to all the Trainers\\l\\n",
  "I met during my adventures here!\\c$",
]

[msg.section_0.entries.547]
text = [
  "The bottom of the cave...\\n",
  "It's just about time for a rest!\\c\\n",
  "But I'll bake buns like the best!\\n",
  "Come on! Let's mix it up!\\c$",
]

[msg.section_0.entries.548]
text = [
  "You're the new person that everyone\\n",
  "says is so powerful?\\l\\n",
  "Impressive to have made it this far!\\c\\n",
  "Hee hee! This is going to be fun!\\c$",
]

[msg.section_0.entries.549]
text = [
  "Think you can beat a lady like me?\\n",
  "We'll see about that... Here I come!\\c$",
]

[msg.section_0.entries.550]
text = [
  "You want to battle me?\\n",
  "How sad...\\c\\n",
  "Nothing worthwhile is born from battle.\\n",
  "I've come to realize that.\\c\\n",
  "If you still want to battle me, then\\n",
  "I'll just have to put you to rest...\\c$",
]

[msg.section_0.entries.551]
text = [
  "I've survived a good long time at the\\n",
  "bottom of this abyss!\\c\\n",
  "I won't lose to a newcomer like you!\\c$",
]

[msg.section_0.entries.552]
text = [
  "So many Trainers have come to challenge\\n",
  "me, only to be soundly defeated.\\c\\n",
  "They call me the legendary Black Belt!\\n",
  "Battling is my life!\\c$",
]

[msg.section_0.entries.553]
text = [
  "It's impressive that you've made it to\\n",
  "the bottom of White Treehollow!\\c\\n",
  "Now we must determine which of us is\\n",
  "more experienced. Are you experienced?\\c$",
]

[msg.section_0.entries.554]
text = [
  "I can sense an aura of power\\n",
  "shining from your Poké Balls...\\c\\n",
  "You're not just anyone! Don't hold back!\\n",
  "Battle with all your might!\\c$",
]

[msg.section_0.entries.555]
text = [
  "Rrooarrr!\\n",
  "I'll break this and I'll break that!\\c\\n",
  "I've got an urge to destroy anything\\n",
  "and everything! I'll crush the world!\\c$",
]

[msg.section_0.entries.556]
text = [
  "Life isn't about how you live it!\\n",
  "It's about how you go out in the end!\\l\\n",
  "You've got to make a striking exit!\\c\\n",
  "Hey! It's just about that time for me.\\n",
  "I'll show you how to make a real exit!\\c$",
]

[msg.section_0.entries.557]
text = [
  "No matter what bad things I've done,\\n",
  "my Pokémon have always stuck with me...\\c\\n",
  "I'll never let my Pokémon down!\\c$",
]

[msg.section_0.entries.558]
text = [
  "Once you come this far, stuff like evil or\\n",
  "justice don't matter so much anymore!\\c\\n",
  "Beyond being a Policeman, I'm a Trainer!\\c$",
]

[msg.section_0.entries.559]
text = [
  "Even if it's just to test your skill,\\n",
  "I can't believe they finally called me in.\\c\\n",
  "This won't be a lukewarm battle like\\n",
  "those you've had up until now!\\c$",
]

[msg.section_0.entries.560]
text = [
  "There's another personality inside me...\\n",
  "It glows when I close my eyes...\\c\\n",
  "Oh no... From the depths of my heart...\\n",
  "The radiant shadow inside approaches...\\c\\n",
  "Aha! Here I am, the dark bright Trainer!\\n",
  "I'll knock you out with my glory! ♪\\c$",
]

[msg.section_0.entries.561]
text = [
  "Where's the treasure at?!\\n",
  "Could the rumors have been false?!\\c\\n",
  "Did you hide it from me?!\\n",
  "Argh! I won't let you get the best of me!\\c$",
]

[msg.section_0.entries.562]
text = [
  "Oh! It's you!\\n",
  "How have you been?\\c\\n",
  "Stay here long enough, and you start\\n",
  "to recognize everyone you run into.\\c\\n",
  "Let's have some fun while you're here!\\n",
  "Battle away as usual!\\c$",
]

[msg.section_0.entries.563]
text = [
  "There are all sorts of legends about an\\n",
  "underground people who once lived here.\\c\\n",
  "But we still have no idea what this place\\n",
  "actually is.\\c\\n",
  "Just where exactly are we having\\n",
  "all of these Pokémon battles?\\c$",
]

[msg.section_0.entries.564]
text = [
  "I deny anything and everything!\\n",
  "I say no to every little thing I see!\\c$",
]

[msg.section_0.entries.565]
text = [
  "I've been observing you from\\n",
  "the shadows!\\c\\n",
  "I never expected that you'd come this\\n",
  "far and grow this strong...\\c\\n",
  "Ha ha! Just a bit more, and you'll\\n",
  "be at the top!\\c$",
]

[msg.section_0.entries.566]
text = [
  "A hundred years ago, I was already an\\n",
  "old man. I've had an extremely long life.\\c\\n",
  "The hermit of White Treehollow is what\\n",
  "they call me! Get ready for a scrimmage!\\c$",
]

[msg.section_0.entries.567]
text = [
  "I won't go back outside until my\\n",
  "daughter apologizes to me!\\l\\n",
  "Did she send you here?\\c\\n",
  "I can't believe she ate my last\\n",
  "RageCandyBar! Taste my anger!\\c$",
]

[msg.section_0.entries.568]
text = [
  "There's treasure at the bottom that\\n",
  "will make your dearest wish come true...\\c\\n",
  "I told that story to everyone, and it\\n",
  "brought all you Trainers flocking here.\\c\\n",
  "If I hadn't spread that tale, I wouldn't\\n",
  "have been able to meet Trainers like you!\\c$",
]

[msg.section_0.entries.569]
text = [
  "I've been letting off Sweet Scent\\n",
  "all the way here!\\c$",
]

[msg.section_0.entries.570]
text = [
  "This place is far above the clouds...\\n",
  "Power pours down from space!\\c\\n",
  "Can you feel it? It's having some kind of\\n",
  "effect on us! Let's find out what it does!\\c$",
]

[msg.section_0.entries.571]
text = [
  "Everywhere I go, I stand above the rest!\\c\\n",
  "It's equally true in this place.\\n",
  "I will make it to the top!\\c$",
]

[msg.section_0.entries.572]
text = [
  "Hey, did you know?\\n",
  "We used to be Clowns!\\c\\n",
  "Ha ha ha! Clowns should be like Clowns\\n",
  "and have happy battles!\\c$",
]

[msg.section_0.entries.573]
text = [
  "Ahhhhhh!\\n",
  "It's no good! I can't stop it!\\c\\n",
  "This power is out of control!\\n",
  "Help me, my Pokémon!\\c$",
]

[msg.section_0.entries.574]
text = [
  "I wonder if it's OK not holding back\\n",
  "against you...\\c\\n",
  "I'm sick of restraining myself from\\n",
  "crushing all the weaklings in here!\\c$",
]

[msg.section_0.entries.575]
text = [
  "Overcoming countless Trainers,\\n",
  "you and I have made it this far!\\c\\n",
  "For the sake of the fallen, let's have\\n",
  "a battle we won't be ashamed of!\\c$",
]

[msg.section_0.entries.576]
text = [
  "Hee hee! You look like you're lost!\\n",
  "I'm so happy right now!\\c\\n",
  "Are you wondering why? Because I'm\\n",
  "the one who designed this building!\\c$",
]

[msg.section_0.entries.577]
text = [
  "Behold! The culmination of all the data\\n",
  "I've painstakingly gathered!\\c$",
]

[msg.section_0.entries.578]
text = [
  "Black Tower is a building that contains\\n",
  "the entire wisdom of humanity!\\c\\n",
  "We will go beyond that--into outer space!\\n",
  "We shall surpass humanity!\\c$",
]

[msg.section_0.entries.579]
text = [
  "Hee hee hee... You've arrived...\\n",
  "My new test subject... ♪\\c$",
]

[msg.section_0.entries.580]
text = [
  "I'll show you the results of the\\n",
  "training I've done against all the\\l\\n",
  "powerful Trainers who opposed me!\\c$",
]

[msg.section_0.entries.581]
text = [
  "Eek! Help me!\\c\\n",
  "Ay ay ay! There's one here, too!\\c\\n",
  "Where do all you strong Trainers keep\\n",
  "popping up from? This place is a deluge!\\c\\n",
  "Forget it! I don't care anymore!\\n",
  "Let's just battle and get it over with!\\c$",
]

[msg.section_0.entries.582]
text = [
  "I was born able to do multiplication!\\n",
  "Can you beat a super genius like me?\\c$",
]

[msg.section_0.entries.583]
text = [
  "I'm number one at everything--grades,\\n",
  "footraces, training--everything!\\l\\n",
  "My Pokémon are number one, too!\\c$",
]

[msg.section_0.entries.584]
text = [
  "I've never seen you before!\\c\\n",
  "The Trainers that make it up here\\n",
  "are usually the same over and over.\\l\\n",
  "It's easy to spot a newcomer like you!\\c\\n",
  "Tee hee hee! You ready to battle? ♪\\c$",
]

[msg.section_0.entries.585]
text = [
  "I want someone against whom I can test\\n",
  "my mighty intellect!\\c$",
]

[msg.section_0.entries.586]
text = [
  "Excuse me...\\n",
  "As of now, you are not a guest to me!\\c\\n",
  "You are just a wall I need to overcome.\\n",
  "...Simply another of my rivals!\\c$",
]

[msg.section_0.entries.587]
text = [
  "Welcome! This is the third avenue\\n",
  "of the abyss.\\c\\n",
  "Only those Trainers who have come\\n",
  "prepared can hope to survive this area!\\c$",
]

[msg.section_0.entries.588]
text = [
  "I will become the best Waitress in the\\n",
  "world! That's why I'm training here!\\c$",
]

[msg.section_0.entries.589]
text = [
  "I'm the Waitress that they say is as\\n",
  "fast as lightning!\\c\\n",
  "In fact, my customers say my expert\\n",
  "timing is a little bit frightening!\\c$",
]

[msg.section_0.entries.590]
text = [
  "Neglect your training even slightly, and\\n",
  "you don't stand a chance around here!\\c$",
]

[msg.section_0.entries.591]
text = [
  "Ohh! I found you!\\n",
  "I lost to you once before.\\c\\n",
  "But I've gotten a lot stronger and\\n",
  "made it all the way up here!\\c\\n",
  "What? You don't remember me?\\n",
  "I'll make sure you never forget!\\c$",
]

[msg.section_0.entries.592]
text = [
  "To have run into me here...\\n",
  "I truly feel sorry for you!\\c\\n",
  "It's the end for you...\\n",
  "I'll see to it!\\c$",
]

[msg.section_0.entries.593]
text = [
  "Ah ha ha ha! Quit it!\\n",
  "You're making me laugh!\\c\\n",
  "It's just so hilarious!\\n",
  "You think you can beat me?! Ha ha ha!\\c$",
]

[msg.section_0.entries.594]
text = [
  "I grew up with my Pokémon.\\n",
  "They're family to me.\\c\\n",
  "We came all this way together.\\n",
  "I'm not alone here. I won't lose!\\c$",
]

[msg.section_0.entries.595]
text = [
  "When I grow up, I'm going to stay at home\\n",
  "and live quietly with my Pokémon!\\c\\n",
  "I won't work or anything! But to live\\n",
  "like that, I need to win here and now!\\c$",
]

[msg.section_0.entries.596]
text = [
  "The road here was pretty tough, right?\\c\\n",
  "What kind of Pokémon did you use to win\\n",
  "your way here? I want to see them!\\c$",
]

[msg.section_0.entries.597]
text = [
  "I'm almost at the top!\\n",
  "Get out of my waaaay!\\c$",
]

[msg.section_0.entries.598]
text = [
  "People who want money...\\n",
  "People who want to fulfill their dreams...\\c\\n",
  "People come to challenge this place for\\n",
  "a variety of reasons.\\c\\n",
  "Why did you come here?\\n",
  "Tell me while we battle!\\c$",
]

[msg.section_0.entries.599]
text = [
  "I do it all to become the top star\\n",
  "of Black City.\\c\\n",
  "Any Trainer who gets in my face will go\\n",
  "down in defeat, and that's a guarantee!\\c$",
]

[msg.section_0.entries.600]
text = [
  "You've made it this far already!\\n",
  "I'll be your training partner!\\c$",
]

[msg.section_0.entries.601]
text = [
  "You want to become strong?\\n",
  "OK! Then come at me full force!\\c$",
]

[msg.section_0.entries.602]
text = [
  "You want power?\\n",
  "Then try to defeat me!\\c$",
]

[msg.section_0.entries.603]
text = [
  "The more battles under your belt,\\n",
  "the stronger your Pokémon will be!\\l\\n",
  "Now let's kick this thing off!\\c$",
]

[msg.section_0.entries.604]
text = [
  "Beyond this point, things really start to\\n",
  "get hostile. If you go on and you're not\\l\\n",
  "strong enough, you'll end up getting\\l\\n",
  "your Pokémon hurt!\\c\\n",
  "You'd better get some training in first!\\c$",
]

[msg.section_0.entries.605]
text = [
  "Pokémon mirror their Trainer's strength!\\c\\n",
  "If you're aiming for the top, you need\\n",
  "integrity as well as grit!\\c$",
]

[msg.section_0.entries.606]
text = [
  "When you pour everything you've got into\\n",
  "training your Pokémon, each and every\\l\\n",
  "battle is the proof of your dedication!\\c$",
]

[msg.section_0.entries.607]
text = [
  "The Pokémon we train depend on us\\n",
  "for their entire lives!\\c\\n",
  "Are you strong enough to look after them\\n",
  "in bad times as well as good?\\c$",
]

[msg.section_0.entries.608]
text = [
  "Together with my Pokémon, I've overcome\\n",
  "sadness and pain to come this far.\\c\\n",
  "I don't care how strong you might be.\\n",
  "We will defeat you!\\c$",
]

[msg.section_0.entries.609]
text = [
  "My Pokémon are so strong,\\n",
  "I had to keep them sealed away.\\c\\n",
  "That is, until now! The time has come\\n",
  "for them to take center stage!\\c\\n",
  "These are my last Pokémon!\\n",
  "There are none stronger!\\c$",
]

[msg.section_0.entries.610]
text = [
  "Get your Pokémon and get over here!\\n",
  "I'll lend you a hand with your training!\\c$",
]

[msg.section_0.entries.611]
text = [
  "Are your Pokémon feeling OK? They look\\n",
  "like they could use some exercise.\\l\\n",
  "I'll play with them for a while!\\c$",
]

[msg.section_0.entries.612]
text = [
  "How's your training going?\\n",
  "Let me evaluate you!\\c$",
]

[msg.section_0.entries.613]
text = [
  "OK! It's training time!\\n",
  "Hurry up and get your Pokémon out here!\\c$",
]

[msg.section_0.entries.614]
text = [
  "The Trainers you'll meet up ahead are\\n",
  "much stronger than the ones here!\\l\\n",
  "Hee hee! I'll help you prepare for them!\\c$",
]

[msg.section_0.entries.615]
text = [
  "Here I go! I won't hold back!\\n",
  "Hee hee! Think you can keep up?\\c$",
]

[msg.section_0.entries.616]
text = [
  "I'll give you a taste of what being a pro\\n",
  "Pokémon Breeder is all about!\\c$",
]

[msg.section_0.entries.617]
text = [
  "My Pokémon and I are going back\\n",
  "to the basics with our training!\\c\\n",
  "I'm going to keep battling in order\\n",
  "to become a better Pokémon Breeder!\\c$",
]

[msg.section_0.entries.618]
text = [
  "My Pokémon are almost to the\\n",
  "point of perfection!\\c\\n",
  "This battle may just be the last\\n",
  "piece of the puzzle!\\c$",
]

[msg.section_0.entries.619]
text = [
  "I've been a Breeder forever, but these\\n",
  "are the strongest Pokémon I've seen!\\c\\n",
  "I can say it with full confidence--these\\n",
  "Pokémon are the strongest around!\\c$",
]

[msg.section_0.entries.620]
text = [
  "I've got more money than I can spend...\\n",
  "But my life still lacks excitement. Sigh...\\c$",
]

[msg.section_0.entries.621]
text = [
  "Viens! I invite you to an elegant battle!\\c$",
]

[msg.section_0.entries.622]
text = [
  "My daddy gave me these intense Pokémon!\\n",
  "Check 'em out!\\c$",
]

[msg.section_0.entries.623]
text = [
  "Social circles--so stifling... I ran away!\\n",
  "That's how I came to be here!\\c\\n",
  "Now, I fight for freedom!\\c$",
]

[msg.section_0.entries.624]
text = [
  "It cost a ton of money to raise\\n",
  "all of these Pokémon!\\c\\n",
  "I'll show you that my Pokémon are better\\n",
  "than those of a common peasant!\\c$",
]

[msg.section_0.entries.625]
text = [
  "I find it rather entertaining to consider\\n",
  "poor people squabbling over money. ♪\\c\\n",
  "Ho ho! Perhaps I'll consider gracing you\\n",
  "with an opportunity to battle me!\\c$",
]

[msg.section_0.entries.626]
text = [
  "Granddad put his sweat and tears into\\n",
  "getting these Pokémon! Can you win?\\c$",
]

[msg.section_0.entries.627]
text = [
  "Do you also hear the rhythm of\\n",
  "the waltz? Shall we dance?\\c$",
]

[msg.section_0.entries.628]
text = [
  "Pwf! There are so many barbarians here!\\n",
  "Pokémon battles were originally the\\l\\n",
  "pastime of proper ladies and gentlemen!\\c\\n",
  "You there! Tidy yourself! Straighten up!\\n",
  "We shall have a proper battle!\\c$",
]

[msg.section_0.entries.629]
text = [
  "I found these winsome Pokémon in my\\n",
  "family's garden!\\c\\n",
  "With my adorable Pokémon, I'll show you\\n",
  "peasants how to go about your business.\\c$",
]

[msg.section_0.entries.630]
text = [
  "Bumpkin! I challenge you to a duel!\\c\\n",
  "Haha hem! I used to challenge people\\n",
  "that way all the time in my younger days!\\c\\n",
  "I am walking down nostalgia's lane...\\n",
  "Let us commence a Pokémon battle!\\c$",
]

[msg.section_0.entries.631]
text = [
  "My company is expanding, so I'm here\\n",
  "to screen for hot new talent.\\c\\n",
  "We need more Trainers!\\n",
  "Say, would you like an interview?\\c$",
]

[msg.section_0.entries.632]
text = [
  "Corporate management is no different\\n",
  "from Pokémon training!\\c\\n",
  "That's been my philosophy,\\n",
  "and I've been quite successful!\\c\\n",
  "Invest in training, and your net gain is\\n",
  "victory over your opponents!\\c$",
]

[msg.section_0.entries.633]
text = [
  "All those in here are just--Trainers.\\n",
  "Even wealthy folk like myself!\\c\\n",
  "Egalitarian! Carefree! Low pressure!\\n",
  "This is a great place to battle!\\c$",
]

[msg.section_0.entries.634]
text = [
  "I did some bad things when I was younger.\\n",
  "Whatever it took to climb to the top!\\c\\n",
  "You won't find me a weakling like\\n",
  "other Gentlemen!\\c$",
]

[msg.section_0.entries.635]
text = [
  "I've enjoyed many delights and luxuries\\n",
  "in my time!\\c\\n",
  "In the end, though, Pokémon battles\\n",
  "are what I enjoy most! Let's battle!\\c$",
]

[msg.section_0.entries.636]
text = [
  "It's nothing special, but do take a peek\\n",
  "at my little ring here.\\c\\n",
  "A hundred-carat diamond--a dazzling cut!\\c\\n",
  "...You don't seem to be paying attention.\\n",
  "I guess I'll have to punish you!\\c$",
]

[msg.section_0.entries.637]
text = [
  "These Pokémon have been passed down\\n",
  "for generations in my family! Battle time!\\c$",
]

[msg.section_0.entries.638]
text = [
  "I need more! More!\\n",
  "I must have it all!\\c\\n",
  "So many things in the world that have\\n",
  "yet to come into my possession!\\c\\n",
  "Quickly! Give me everything you have!\\c$",
]

[msg.section_0.entries.639]
text = [
  "Let the happy times begin!\\n",
  "Here we go!\\c$",
]

[msg.section_0.entries.640]
text = [
  "You want me to help your Pokémon heal?\\n",
  "You're going to have to beat me first!\\c\\n",
  "You may think I'm being hard hearted.\\n",
  "I understand, but those are the rules!\\c$",
]

[msg.section_0.entries.641]
text = [
  "If you manage to beat me, I'll get your\\n",
  "Pokémon all fixed up! So let's go there!\\c$",
]

[msg.section_0.entries.642]
text = [
  "I may not look it, but I used to be the\\n",
  "strongest Trainer in my village!\\c\\n",
  "Come, let's battle! If you beat me,\\n",
  "I'll help your Pokémon recover!\\c$",
]

[msg.section_0.entries.643]
text = [
  "If you want me to heal up your Pokémon,\\n",
  "you'd better show me a glimmer of life!\\c$",
]

[msg.section_0.entries.644]
text = [
  "You need to know all about Pokémon\\n",
  "in order for them to recover properly!\\c\\n",
  "That's my methodology.\\n",
  "I make my diagnoses during battle!\\c$",
]

[msg.section_0.entries.645]
text = [
  "Trainers engaged in fierce competition...\\n",
  "Being dispatched here was a bright day!\\c\\n",
  "As a Doctor, it pleases me to work in a\\n",
  "place of such passion! Prepare to battle!\\c$",
]

[msg.section_0.entries.646]
text = [
  "You have made it all the way here, which\\n",
  "means you're not just any old Trainer!\\c\\n",
  "Show me your power! If you can beat me,\\n",
  "I'll restore your Pokémon's health!\\c$",
]

[msg.section_0.entries.647]
text = [
  "I'm a first-class Doctor!\\n",
  "I receive adequate compensation...\\c\\n",
  "Some might say more than adequate!\\c\\n",
  "For today, I'm offering a special service.\\n",
  "Beat me, and I'll look at your Pokémon!\\c$",
]

[msg.section_0.entries.648]
text = [
  "I know all there is to know about the\\n",
  "bodies of Pokémon! Think you can beat me?\\c$",
]

[msg.section_0.entries.649]
text = [
  "No matter how rough the area is, as long\\n",
  "as there are Pokémon in pain, we Doctors\\l\\n",
  "will be on the scene!\\c\\n",
  "However, before I can treat your\\n",
  "Pokémon, it's time for the ritual battle!\\c$",
]

[msg.section_0.entries.650]
text = [
  "I have a soft spot for the strong! If you\\n",
  "can beat me, I'll treat your Pokémon!\\c$",
]

[msg.section_0.entries.651]
text = [
  "If you can defeat us Nurses, we'll\\n",
  "heal your Pokémon once each!\\c$",
]

[msg.section_0.entries.652]
text = [
  "If you want me to treat your Pokémon,\\n",
  "you'll need to defeat me first!\\c$",
]

[msg.section_0.entries.653]
text = [
  "I bet your Pokémon are tired!\\n",
  "If you can beat me, I'll fix 'em right up!\\c$",
]

[msg.section_0.entries.654]
text = [
  "Hello! Sorry to keep you waiting!\\n",
  "Here I am--your favorite Nurse!\\c\\n",
  "Simply defeat me in battle, and I'll heal\\n",
  "up your Pokémon! Ready, dear?\\c$",
]

[msg.section_0.entries.655]
text = [
  "Drop your guard, and you'll be defeated\\n",
  "before I can help your Pokémon recover!\\c$",
]

[msg.section_0.entries.656]
text = [
  "Hee hee! Relieved to have run into me?\\c\\n",
  "Sure, I'll help your Pokémon recover!\\n",
  "But only if you can beat me first!\\c$",
]

[msg.section_0.entries.657]
text = [
  "I'm super-duper busy here, with Trainers\\n",
  "showing up nonstop with their tired and\\l\\n",
  "sore Pokémon!\\c\\n",
  "I'm tired, too! Who will help me recover?!\\c$",
]

[msg.section_0.entries.658]
text = [
  "Humph! I don't particularly feel like\\n",
  "lifting a finger for your Pokémon!\\c\\n",
  "I'm not joking!\\n",
  "I'll beat you right here and now!\\c$",
]

[msg.section_0.entries.659]
text = [
  "I'll refresh your Pokémon so they have\\n",
  "the strength to make it to the goal!\\c$",
]

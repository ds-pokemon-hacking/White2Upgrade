[msg.section_0.entries.0]
text = [
  "Have we met or not? I don't remember.\\n",
  "Well, nice to meet you!$",
]

[msg.section_0.entries.1]
text = [
  "Yahoo! Ya-hoooooo!\\n",
  "I won again!$",
]

[msg.section_0.entries.2]
text = [
  "No way! Nooo way...\\n",
  "I lost again...$",
]

[msg.section_0.entries.3]
text = [
  "All right!\\n",
  "I will show you my power!$",
]

[msg.section_0.entries.4]
text = [
  "Amazed? Surprised?\\n",
  "By the power of my Pokémon?!$",
]

[msg.section_0.entries.5]
text = [
  "You are incredible!\\n",
  "I am astonished and surprised!$",
]

[msg.section_0.entries.6]
text = [
  "May... May I help you?!$",
]

[msg.section_0.entries.7]
text = [
  "Oh! Oh!\\n",
  "Yes, we can?!$",
]

[msg.section_0.entries.8]
text = [
  "Un-un-unbelievable!$",
]

[msg.section_0.entries.9]
text = [
  "Don't let your guard down,\\n",
  "or you may cry when a kid beats you...$",
]

[msg.section_0.entries.10]
text = [
  "I may be young, but I don't think\\n",
  "I will lose, even against grown-ups.$",
]

[msg.section_0.entries.11]
text = [
  "Fweh! I am just a kid!\\n",
  "You are fighting for keeps!$",
]

[msg.section_0.entries.12]
text = [
  "Let's have an awesome\\n",
  "Pokémon battle!$",
]

[msg.section_0.entries.13]
text = [
  "Mmmph! Mmmmmph!\\n",
  "You see, it's fun to win!$",
]

[msg.section_0.entries.14]
text = [
  "You are pretty amazing!\\n",
  "And you have totally exhausted me...$",
]

[msg.section_0.entries.15]
text = [
  "Very serious from the very beginning.\\n",
  "Are you ever really prepared for this?$",
]

[msg.section_0.entries.16]
text = [
  "Seriously, winning a serious battle is\\n",
  "seriously great!$",
]

[msg.section_0.entries.17]
text = [
  "Seriously, I lost. I am seriously depressed.\\n",
  "But you are seriously cool.$",
]

[msg.section_0.entries.18]
text = [
  "Go easy on me!\\n",
  "This is my first battle...$",
]

[msg.section_0.entries.19]
text = [
  "I can't believe I won my first battle!\\n",
  "Say, did you go easy on me?$",
]

[msg.section_0.entries.20]
text = [
  "Ouch! That hurts!!\\n",
  "But... You are great...$",
]

[msg.section_0.entries.21]
text = [
  "You... You know,\\n",
  "these Pokémon are my friends.$",
]

[msg.section_0.entries.22]
text = [
  "I... I... I am sorry...\\n",
  "I just wanted to introduce them to you.$",
]

[msg.section_0.entries.23]
text = [
  "Just being with these Pokémon\\n",
  "makes me happy...$",
]

[msg.section_0.entries.24]
text = [
  "...Heehee. I'm confident in calculation\\n",
  "and analysis.$",
]

[msg.section_0.entries.25]
text = [
  "Heheh. Exactly as I planned...\\n",
  "I don't feel like losing.$",
]

[msg.section_0.entries.26]
text = [
  "Ohhhh... Calculation and analysis\\n",
  "are no match for coincidence...$",
]

[msg.section_0.entries.27]
text = [
  "We're about to have a Pokémon battle.\\n",
  "At the very least, we say hello!$",
]

[msg.section_0.entries.28]
text = [
  "That could have gone better,\\n",
  "but thank you very much.$",
]

[msg.section_0.entries.29]
text = [
  "I feel like crying in frustration,\\n",
  "but thank you very much.$",
]

[msg.section_0.entries.30]
text = [
  "I am studying every single day...\\n",
  "So I am taking a break for a change.$",
]

[msg.section_0.entries.31]
text = [
  "You see, playing with Pokémon is fun.\\n",
  "I want to study Pokémon.$",
]

[msg.section_0.entries.32]
text = [
  "Ah, my Pokémon lost...\\n",
  "I may be better at studying.$",
]

[msg.section_0.entries.33]
text = [
  "I want to be a Pokémon research\\n",
  "scientist when I grow up.$",
]

[msg.section_0.entries.34]
text = [
  "I'm wondering if Pokémon research\\n",
  "projects require test subjects...$",
]

[msg.section_0.entries.35]
text = [
  "I must do my best to learn\\n",
  "more about Pokémon.$",
]

[msg.section_0.entries.36]
text = [
  "Ah... You look strong...\\n",
  "I hope I will be all right...$",
]

[msg.section_0.entries.37]
text = [
  "Oops, you were not as strong\\n",
  "as I expected... Looks can be deceiving.$",
]

[msg.section_0.entries.38]
text = [
  "I could tell you are a strong Trainer!\\n",
  "What you see is what you get.$",
]

[msg.section_0.entries.39]
text = [
  "I always get the best grades!\\n",
  "I will try to be No. 1 for everything!$",
]

[msg.section_0.entries.40]
text = [
  "I will keep winning, winning, winning...\\n",
  "I will be No. 1!$",
]

[msg.section_0.entries.41]
text = [
  "If I lose at such an early stage,\\n",
  "I cannot be No. 1.$",
]

[msg.section_0.entries.42]
text = [
  "Wha--? You wanna fight with me?\\n",
  "I suppoooose...$",
]

[msg.section_0.entries.43]
text = [
  "Ah, I shoulda known.\\n",
  "Don't blame me.$",
]

[msg.section_0.entries.44]
text = [
  "Oh, wow. I am no match for you.\\n",
  "Your Pokémon are great.$",
]

[msg.section_0.entries.45]
text = [
  "Mrrrrr... Mmrr grrr...\\n",
  "Grrrrr... Mrrrrr...$",
]

[msg.section_0.entries.46]
text = [
  "Grrrrr... Mmrrrr...\\n",
  "...Oh? Did I win?$",
]

[msg.section_0.entries.47]
text = [
  "Grrrrmmm... Mrrr...\\n",
  "Oh? Is that it?$",
]

[msg.section_0.entries.48]
text = [
  "Here I am, a master of the universe and\\n",
  "the mover and shaker of the future!$",
]

[msg.section_0.entries.49]
text = [
  "The class differences always tell.\\n",
  "I am worried about your future prospects.$",
]

[msg.section_0.entries.50]
text = [
  "I got carried away.\\n",
  "I am worried about my future prospects.$",
]

[msg.section_0.entries.51]
text = [
  "Are you my opponent?\\n",
  "You look kind of hungry.$",
]

[msg.section_0.entries.52]
text = [
  "Have you eaten well?\\n",
  "You cannot do well on an empty stomach.$",
]

[msg.section_0.entries.53]
text = [
  "Are you really an ordinary person?\\n",
  "What do you eat?$",
]

[msg.section_0.entries.54]
text = [
  "I am a nouveau riche celebrity,\\n",
  "so I am stingy with my money!$",
]

[msg.section_0.entries.55]
text = [
  "Unfortunately, you lost.\\n",
  "Now, give me your lunch money!$",
]

[msg.section_0.entries.56]
text = [
  "I lost, but I won't give you\\n",
  "my lunch money!$",
]

[msg.section_0.entries.57]
text = [
  "My mom chose my Pokémon.\\n",
  "I don't think I will lose.$",
]

[msg.section_0.entries.58]
text = [
  "You see! I am fine as long as\\n",
  "I listen to my mom.$",
]

[msg.section_0.entries.59]
text = [
  "Mommy! Mommy! Where are you?\\n",
  "Please come and hug me!$",
]

[msg.section_0.entries.60]
text = [
  "A Trainer who looks gorgeous!\\n",
  "I hope your battle is just as beautiful.$",
]

[msg.section_0.entries.61]
text = [
  "Such a looker lost against me?!\\n",
  "I am a little disappointed.$",
]

[msg.section_0.entries.62]
text = [
  "Oh my, the battle was also gorgeous.\\n",
  "I find myself drawn to you.$",
]

[msg.section_0.entries.63]
text = [
  "What kind of Pokémon do you like?\\n",
  "Hey, hey. Let me see!$",
]

[msg.section_0.entries.64]
text = [
  "Your taste in Pokémon is excellent,\\n",
  "but you are a disappointment as a Trainer.$",
]

[msg.section_0.entries.65]
text = [
  "Your taste in Pokémon is truly awful,\\n",
  "but you are a first-class Trainer!$",
]

[msg.section_0.entries.66]
text = [
  "I am sorry--I lied.\\n",
  "I am not a rich girl.$",
]

[msg.section_0.entries.67]
text = [
  "Everybody paid more attention to me\\n",
  "when I pretended to be rich.$",
]

[msg.section_0.entries.68]
text = [
  "The truth is I am just the daughter\\n",
  "of a Clerk ⑭.$",
]

[msg.section_0.entries.69]
text = [
  "Ahaha...$",
]

[msg.section_0.entries.70]
text = [
  "Ahahaha...$",
]

[msg.section_0.entries.71]
text = [
  "Argh...$",
]

[msg.section_0.entries.72]
text = [
  "Preschooler gonna battle you!\\n",
  "Nice to meet you.$",
]

[msg.section_0.entries.73]
text = [
  "Little baby is a winna!\\n",
  "Tank you! Tank you!$",
]

[msg.section_0.entries.74]
text = [
  "Da Preschooler lost!\\n",
  "Tank you anyways!$",
]

[msg.section_0.entries.75]
text = [
  "I am a genius Preschooler!\\n",
  "I am already prepping for college.$",
]

[msg.section_0.entries.76]
text = [
  "You lost against a Preschooler...\\n",
  "How old are you again?$",
]

[msg.section_0.entries.77]
text = [
  "I am confident in studying, but\\n",
  "I am just a beginner in Pokémon battles.$",
]

[msg.section_0.entries.78]
text = [
  "I am a hero!\\n",
  "I refuse to lose!$",
]

[msg.section_0.entries.79]
text = [
  "I AM a hero!\\n",
  "I beat the bad person!$",
]

[msg.section_0.entries.80]
text = [
  "A hero never loses.\\n",
  "A hero never dies.$",
]

[msg.section_0.entries.81]
text = [
  "I am very strong.\\n",
  "I will never lose.$",
]

[msg.section_0.entries.82]
text = [
  "Daddy gave me these Pokémon!\\n",
  "They've got to be strong!$",
]

[msg.section_0.entries.83]
text = [
  "AAAAAAAAAH!$",
]

[msg.section_0.entries.84]
text = [
  "I thinks it are strange\\n",
  "it complaining when they lose.$",
]

[msg.section_0.entries.85]
text = [
  "When I win, I are glad!\\n",
  "Hip, hip, hurray!$",
]

[msg.section_0.entries.86]
text = [
  "Boo!! I did lost... I are frustrated,\\n",
  "but I guess things my own fault.$",
]

[msg.section_0.entries.87]
text = [
  "Are you going to bully me?$",
]

[msg.section_0.entries.88]
text = [
  "You didn't bully me. I like you!$",
]

[msg.section_0.entries.89]
text = [
  "You bullied me, but I like you\\n",
  "'cause you are strong!$",
]

[msg.section_0.entries.90]
text = [
  "Gmmmmm! Pokémon!\\n",
  "Give it all you've got!$",
]

[msg.section_0.entries.91]
text = [
  "Mmmmph! Yahoo! Yahoo!\\n",
  "Thank you very much, Pokémon!$",
]

[msg.section_0.entries.92]
text = [
  "Boooooo! Come on, Pokémon.\\n",
  "Try harder!$",
]

[msg.section_0.entries.93]
text = [
  "I am four years old! I will do my best!\\n",
  "Trainer, do your best, too!$",
]

[msg.section_0.entries.94]
text = [
  "I am four years old! I did my best!\\n",
  "Trainer, you are weak.$",
]

[msg.section_0.entries.95]
text = [
  "I am four years old! I did my best!\\n",
  "Trainer, you did your best, too!$",
]

[msg.section_0.entries.96]
text = [
  "Lalalala... Lalalala...\\n",
  "I am a loner...$",
]

[msg.section_0.entries.97]
text = [
  "Lalalala... Lalalala...\\n",
  "Drifting like clouds...$",
]

[msg.section_0.entries.98]
text = [
  "Lalalala... Lalalala...\\n",
  "Until I see you again...$",
]

[msg.section_0.entries.99]
text = [
  "I am not an ordinary Backpacker,\\n",
  "'cause I am a newlywed.$",
]

[msg.section_0.entries.100]
text = [
  "'Cause my wife and I have no money,\\n",
  "we're hitchhiking on our honeymoon.$",
]

[msg.section_0.entries.101]
text = [
  "This trip is our honeymoon!\\n",
  "But I wandered off from my wife...$",
]

[msg.section_0.entries.102]
text = [
  "I am in the middle of my penniless travel.\\n",
  "It has its own charm.$",
]

[msg.section_0.entries.103]
text = [
  "Travel is best when you are poor\\n",
  "and when you are young.$",
]

[msg.section_0.entries.104]
text = [
  "Aww... I am hungry...\\n",
  "Please spare something...$",
]

[msg.section_0.entries.105]
text = [
  "Argh! My backpack is heavy!\\n",
  "Why is it so heavy?$",
]

[msg.section_0.entries.106]
text = [
  "Why is this backpack so heavy?\\n",
  "Did you put something in it?$",
]

[msg.section_0.entries.107]
text = [
  "Arrrgh! Why didn't you wait\\n",
  "until I put down my bag?!$",
]

[msg.section_0.entries.108]
text = [
  "I wanted a short trip to heal my broken\\n",
  "heart, but it's been a few months now...$",
]

[msg.section_0.entries.109]
text = [
  "A trip cannot heal my heartbreak...$",
]

[msg.section_0.entries.110]
text = [
  "I have no home to return to,\\n",
  "so maybe I will live as a drifter...$",
]

[msg.section_0.entries.111]
text = [
  "Hm. I wonder who you are.\\n",
  "I wonder if you'll have a battle with me.$",
]

[msg.section_0.entries.112]
text = [
  "You... You are weak.\\n",
  "Or am I just strong?$",
]

[msg.section_0.entries.113]
text = [
  "You are strong.\\n",
  "I wanna run away.$",
]

[msg.section_0.entries.114]
text = [
  "Sometimes I need a little time to rest.\\n",
  "I will relax here!$",
]

[msg.section_0.entries.115]
text = [
  "That was a nice, refreshing time.\\n",
  "I will work hard tomorrow!$",
]

[msg.section_0.entries.116]
text = [
  "That was supposed to be refreshing.\\n",
  "Now I am more stressed out.$",
]

[msg.section_0.entries.117]
text = [
  "I hope to work hard, save money,\\n",
  "and have a quiet life.$",
]

[msg.section_0.entries.118]
text = [
  "Everybody has a different dream.\\n",
  "I just want to have a normal life.$",
]

[msg.section_0.entries.119]
text = [
  "I want to have security and happiness\\n",
  "rather than chasing a big dream.$",
]

[msg.section_0.entries.120]
text = [
  "Hey! Welcome!\\n",
  "We have very fresh ingredients!$",
]

[msg.section_0.entries.121]
text = [
  "What do you think of my Pokémon?\\n",
  "They are fresh!$",
]

[msg.section_0.entries.122]
text = [
  "Thank you very much!\\n",
  "How were mine?$",
]

[msg.section_0.entries.123]
text = [
  "Didn't you come here for\\n",
  "a Pokémon battle?$",
]

[msg.section_0.entries.124]
text = [
  "Don't be scared, or\\n",
  "you will never win.$",
]

[msg.section_0.entries.125]
text = [
  "You are a strong Trainer.\\n",
  "Please forgive me.$",
]

[msg.section_0.entries.126]
text = [
  "Hiya, honey! Welcome!\\n",
  "Have you decided what you'll have?$",
]

[msg.section_0.entries.127]
text = [
  "Order up! One humiliation\\n",
  "in a Pokémon battle, over easy.$",
]

[msg.section_0.entries.128]
text = [
  "Order up! One glorious victory\\n",
  "in a Pokémon battle, sunny-side up.$",
]

[msg.section_0.entries.129]
text = [
  "Meow, meow, it's a battle, meow.\\n",
  "(That sounds stupid, doesn't it?)$",
]

[msg.section_0.entries.130]
text = [
  "Yeah! Meow! I won, meow!\\n",
  "(I seriously want to quit this job.)$",
]

[msg.section_0.entries.131]
text = [
  "Meowww... I lost, meowww.\\n",
  "(Seriously, I am sooo embarrassed.)$",
]

[msg.section_0.entries.132]
text = [
  "My love for Pokémon is stronger than\\n",
  "anybody else's. Love can do anything.$",
]

[msg.section_0.entries.133]
text = [
  "This victory proves\\n",
  "my true love for Pokémon.$",
]

[msg.section_0.entries.134]
text = [
  "Love should conquer all. Love should\\n",
  "help me win, shouldn't it?$",
]

[msg.section_0.entries.135]
text = [
  "Oh, do you want to see the Pokémon\\n",
  "that I am proudest of?$",
]

[msg.section_0.entries.136]
text = [
  "What do you think about my\\n",
  "dear Pokémon? Aren't they great?$",
]

[msg.section_0.entries.137]
text = [
  "Oh, my goodness!\\n",
  "My poor Pokémon...$",
]

[msg.section_0.entries.138]
text = [
  "For the honor of the branch office!\\n",
  "Here I go!$",
]

[msg.section_0.entries.139]
text = [
  "I am the branch manager of\\n",
  "the Pokémon Fan Club. I won!$",
]

[msg.section_0.entries.140]
text = [
  "Pfft. Good-bye for now, child!\\n",
  "I'll remember this!$",
]

[msg.section_0.entries.141]
text = [
  "I lost a lot of things because\\n",
  "I love Pokémon too much...$",
]

[msg.section_0.entries.142]
text = [
  "I've devoted my life to Pokémon.\\n",
  "I see things differently than you do.$",
]

[msg.section_0.entries.143]
text = [
  "I cannot win even with my devotion.\\n",
  "What shall I do?!$",
]

[msg.section_0.entries.144]
text = [
  "Listen. I love love love Pokémon.$",
]

[msg.section_0.entries.145]
text = [
  "I will be a Pokémon in my next life.$",
]

[msg.section_0.entries.146]
text = [
  "I love your Pokémon, too!\\n",
  "Please let me pet them!$",
]

[msg.section_0.entries.147]
text = [
  "I am not good at battling, but\\n",
  "this is one of the duties of a Pokéfan.$",
]

[msg.section_0.entries.148]
text = [
  "I kept the honor of the Pokéfan.\\n",
  "Hahaha.$",
]

[msg.section_0.entries.149]
text = [
  "Cheers, all you Pokéfans!!\\n",
  "May the Pokéfan last forever!$",
]

[msg.section_0.entries.150]
text = [
  "I wanted to go hiking,\\n",
  "but I took the wrong train.$",
]

[msg.section_0.entries.151]
text = [
  "Well, this place is also interesting.$",
]

[msg.section_0.entries.152]
text = [
  "Ah, mountains... The mountains are\\n",
  "calling me.$",
]

[msg.section_0.entries.153]
text = [
  "I am no mere Hiker.\\n",
  "Call me an alpinist.$",
]

[msg.section_0.entries.154]
text = [
  "A mountain maniac like me\\n",
  "is properly called an alpinist.$",
]

[msg.section_0.entries.155]
text = [
  "A specialist in mountainous matters.\\n",
  "That is an alpinist.$",
]

[msg.section_0.entries.156]
text = [
  "I'm a Fisherman, so I have my rod here,\\n",
  "but this is cumbersome.$",
]

[msg.section_0.entries.157]
text = [
  "I won the battle, but\\n",
  "I did not need this rod at all.$",
]

[msg.section_0.entries.158]
text = [
  "Ah... This rod is so cumbersome!\\n",
  "I will quit fishing!$",
]

[msg.section_0.entries.159]
text = [
  "Oh, I kin tell yer rilly sumpthin'.$",
]

[msg.section_0.entries.160]
text = [
  "I knew it. You rilly ARE sumpthin'.$",
]

[msg.section_0.entries.161]
text = [
  "Like always, the big one done got away.$",
]

[msg.section_0.entries.162]
text = [
  "I won't be a Parasol Lady without\\n",
  "a parasol, so I must use it.$",
]

[msg.section_0.entries.163]
text = [
  "I think it is strange to use\\n",
  "a parasol indoors, though.$",
]

[msg.section_0.entries.164]
text = [
  "My parasol... My parasol is broken!\\n",
  "I will be just a Lady.$",
]

[msg.section_0.entries.165]
text = [
  "My boyfriend left me on a rainy day.\\n",
  "So I will take it out on you.$",
]

[msg.section_0.entries.166]
text = [
  "The rain is piercing my broken heart\\n",
  "and washing it clean.$",
]

[msg.section_0.entries.167]
text = [
  "They say rainy days never stay,\\n",
  "but will the rain in my heart ever stop?$",
]

[msg.section_0.entries.168]
text = [
  "I've been waiting for someone like you\\n",
  "for a long, long time.$",
]

[msg.section_0.entries.169]
text = [
  "I know you are the best.\\n",
  "I will never let you go.$",
]

[msg.section_0.entries.170]
text = [
  "I like you.\\n",
  "Please be my friend.$",
]

[msg.section_0.entries.171]
text = [
  "I won't go easy on you just because\\n",
  "you're a kid. Bring it on!$",
]

[msg.section_0.entries.172]
text = [
  "Heh. You cannot have a battle\\n",
  "if you are afraid of losing.$",
]

[msg.section_0.entries.173]
text = [
  "Humph. I am still weak.\\n",
  "I feel sorry for my Pokémon...$",
]

[msg.section_0.entries.174]
text = [
  "I am bad and stupid, but\\n",
  "I am very serious about Pokémon.$",
]

[msg.section_0.entries.175]
text = [
  "I feel peaceful only when I am with Pokémon.$",
]

[msg.section_0.entries.176]
text = [
  "I hope you will find something\\n",
  "you can be serious about.$",
]

[msg.section_0.entries.177]
text = [
  "My shiny bald head is my secret.$",
]

[msg.section_0.entries.178]
text = [
  "The more I shave my head,\\n",
  "the stronger I can be.$",
]

[msg.section_0.entries.179]
text = [
  "You should have\\n",
  "a shiny bald head to be stronger.$",
]

[msg.section_0.entries.180]
text = [
  "You must be laughing at me 'cause\\n",
  "I rode this far on my motorbike.$",
]

[msg.section_0.entries.181]
text = [
  "I've decided to live my life on my bike.$",
]

[msg.section_0.entries.182]
text = [
  "I am a coward who cannot even go out\\n",
  "without my bike.$",
]

[msg.section_0.entries.183]
text = [
  "I am roaring around on my bike\\n",
  "and chasing my own dream.$",
]

[msg.section_0.entries.184]
text = [
  "I feel I am getting one step closer\\n",
  "to my dream.$",
]

[msg.section_0.entries.185]
text = [
  "You have to follow your own dream!$",
]

[msg.section_0.entries.186]
text = [
  "I am a Biker.\\n",
  "But I've never ridden a Bicycle.$",
]

[msg.section_0.entries.187]
text = [
  "I am a Biker.\\n",
  "I don't have any friends yet.$",
]

[msg.section_0.entries.188]
text = [
  "I am a Biker.\\n",
  "I've never won yet.$",
]

[msg.section_0.entries.189]
text = [
  "My Pokémon are on the rise! I raised\\n",
  "them with special yeast bread!$",
]

[msg.section_0.entries.190]
text = [
  "You'll get well again if you\\n",
  "eat my special bread.$",
]

[msg.section_0.entries.191]
text = [
  "You are strong.\\n",
  "Are you eating my special bread?$",
]

[msg.section_0.entries.192]
text = [
  "One loaf, two loaves... No matter how\\n",
  "many times I count, one loaf is missing.$",
]

[msg.section_0.entries.193]
text = [
  "One loaf of bread is missing...\\n",
  "The master will be angry...$",
]

[msg.section_0.entries.194]
text = [
  "Oh, I'm so resentful...\\n",
  "Where is the missing loaf of bread?$",
]

[msg.section_0.entries.195]
text = [
  "Hey, you!\\n",
  "Do you eat a good breakfast every day?$",
]

[msg.section_0.entries.196]
text = [
  "I never miss breakfast,\\n",
  "so I am healthy and plump!$",
]

[msg.section_0.entries.197]
text = [
  "The first step for healthy living is\\n",
  "to eat a good breakfast.$",
]

[msg.section_0.entries.198]
text = [
  "I am not loafing on the job!\\n",
  "I am on patrol!$",
]

[msg.section_0.entries.199]
text = [
  "This place is dangerous!\\n",
  "This is too much fun!$",
]

[msg.section_0.entries.200]
text = [
  "I know about trouble like you!\\n",
  "I am keeping my eye on you!$",
]

[msg.section_0.entries.201]
text = [
  "I am a Policeman!\\n",
  "In other words, I am justice!$",
]

[msg.section_0.entries.202]
text = [
  "Justice always prevails!\\n",
  "That is why I won!$",
]

[msg.section_0.entries.203]
text = [
  "I... I am a Policeman!\\n",
  "Why did justice fail?$",
]

[msg.section_0.entries.204]
text = [
  "I got scolded by my boss, and I lost\\n",
  "my motivation. I'll take it out on you!$",
]

[msg.section_0.entries.205]
text = [
  "Hehehe. You see!\\n",
  "I am brilliant here.$",
]

[msg.section_0.entries.206]
text = [
  "Oh, man!\\n",
  "Am I useless here, too?$",
]

[msg.section_0.entries.207]
text = [
  "I am young and fresh!\\n",
  "I am nothing if not young!$",
]

[msg.section_0.entries.208]
text = [
  "What do you think? What do you think?\\n",
  "I am very strong, aren't I?$",
]

[msg.section_0.entries.209]
text = [
  "I am fine even when I lose a battle.\\n",
  "I am lively, lively!$",
]

[msg.section_0.entries.210]
text = [
  "I worked my way up to the top of the\\n",
  "comedians, and now I am a big shot.$",
]

[msg.section_0.entries.211]
text = [
  "You have a good sense of humor.\\n",
  "Do you want to be my assistant?$",
]

[msg.section_0.entries.212]
text = [
  "Looking at you reminds me of friends\\n",
  "from when I was working my way up.$",
]

[msg.section_0.entries.213]
text = [
  "I cannot do impressive stunts,\\n",
  "so I will perform normally.$",
]

[msg.section_0.entries.214]
text = [
  "I am sorry. I shouldn't have won.\\n",
  "I am just a Harlequin.$",
]

[msg.section_0.entries.215]
text = [
  "I am a Harlequin, but I'm sorry I cannot\\n",
  "play the fool after I lose.$",
]

[msg.section_0.entries.216]
text = [
  "I am smiling, though I am sad at heart.\\n",
  "This is the play of a lifetime!$",
]

[msg.section_0.entries.217]
text = [
  "You! That's not in the script!\\n",
  "You ruined the play!$",
]

[msg.section_0.entries.218]
text = [
  "Ha ha ha! It is the destiny of a Harlequin\\n",
  "to smile when he loses.$",
]

[msg.section_0.entries.219]
text = [
  "Oh, no! I came to play\\n",
  "without taking off my uniform.$",
]

[msg.section_0.entries.220]
text = [
  "Wow! Seriously? I won!\\n",
  "I cannot go home when I win.$",
]

[msg.section_0.entries.221]
text = [
  "Ahhhhh! And I lost!\\n",
  "This is not my day.$",
]

[msg.section_0.entries.222]
text = [
  "You know, I am very popular,\\n",
  "thanks to this costume.$",
]

[msg.section_0.entries.223]
text = [
  "Being popular is simple...\\n",
  "I like it that way.$",
]

[msg.section_0.entries.224]
text = [
  "I feel good 'cause I am popular, but\\n",
  "sometimes I feel empty.$",
]

[msg.section_0.entries.225]
text = [
  "Welcome back.\\n",
  "You must be tired from your work.$",
]

[msg.section_0.entries.226]
text = [
  "You must be tired.\\n",
  "Please do rest awhile.$",
]

[msg.section_0.entries.227]
text = [
  "That was superb!\\n",
  "You are very strong indeed.$",
]

[msg.section_0.entries.228]
text = [
  "I used to be so popular, but\\n",
  "now I am all washed up.$",
]

[msg.section_0.entries.229]
text = [
  "I was overwhelmed by success, I took it\\n",
  "for granted, and I did not work hard.$",
]

[msg.section_0.entries.230]
text = [
  "As times change, values change.\\n",
  "I realized it too late.$",
]

[msg.section_0.entries.231]
text = [
  "Well, well, you strike impressive poses.\\n",
  "If you lose, I hope you'll model for me.$",
]

[msg.section_0.entries.232]
text = [
  "I will do a sketch of you,\\n",
  "frustrated by failure. Please hold still.$",
]

[msg.section_0.entries.233]
text = [
  "Please wait. I can create a masterpiece\\n",
  "if you are my model.$",
]

[msg.section_0.entries.234]
text = [
  "Sensitivity is important for battles, too.\\n",
  "You! Feel it!$",
]

[msg.section_0.entries.235]
text = [
  "You need to feel it more! More!\\n",
  "Otherwise you cannot win!$",
]

[msg.section_0.entries.236]
text = [
  "Ahh! I sense it!\\n",
  "I sense your hypersensitive sensitivity!$",
]

[msg.section_0.entries.237]
text = [
  "Everybody grows bit by bit\\n",
  "if somebody cherishes them.$",
]

[msg.section_0.entries.238]
text = [
  "I have cherished these Pokémon\\n",
  "since they were small.$",
]

[msg.section_0.entries.239]
text = [
  "You are also here\\n",
  "because someone cherished you.$",
]

[msg.section_0.entries.240]
text = [
  "These days, when children fight,\\n",
  "their parents fight on their behalf.$",
]

[msg.section_0.entries.241]
text = [
  "Children of childish parents.\\n",
  "What kind of adults will they become?$",
]

[msg.section_0.entries.242]
text = [
  "Childish fights among adults are\\n",
  "worse than fights among kids.$",
]

[msg.section_0.entries.243]
text = [
  "Iaaaa! You are cute!\\n",
  "I want to take you home as my own!$",
]

[msg.section_0.entries.244]
text = [
  "Your face is cute even when you've lost!\\n",
  "I want to comfort you, little one!$",
]

[msg.section_0.entries.245]
text = [
  "Ooooh! You are really cute!\\n",
  "I want to raise you as my own!$",
]

[msg.section_0.entries.246]
text = [
  "I'll show you we can break you.\\n",
  "We've trained in the field!$",
]

[msg.section_0.entries.247]
text = [
  "How were my Pokémon?\\n",
  "They're very powerful, aren't they?$",
]

[msg.section_0.entries.248]
text = [
  "That's strange! I wonder why...\\n",
  "I shouldn't be outmuscled.$",
]

[msg.section_0.entries.249]
text = [
  "Oh, you look very active!\\n",
  "What say we battle?$",
]

[msg.section_0.entries.250]
text = [
  "OK! It's done!\\n",
  "How are my partners?$",
]

[msg.section_0.entries.251]
text = [
  "Goood, you are young!\\n",
  "My partners were totally crushed!$",
]

[msg.section_0.entries.252]
text = [
  "Pokémon battles after work\\n",
  "are the one thing I truly enjoy.$",
]

[msg.section_0.entries.253]
text = [
  "Ahhhhhhhhh!\\n",
  "That's why I cannot quit training Pokémon.$",
]

[msg.section_0.entries.254]
text = [
  "Urrrrrrrgh. It hurts.\\n",
  "It hurts for a single man like me.$",
]

[msg.section_0.entries.255]
text = [
  "Pokémon are popular at work, too.\\n",
  "Old guys can enjoy these battles!$",
]

[msg.section_0.entries.256]
text = [
  "Am I good for a guy who just\\n",
  "battles during his lunch breaks?$",
]

[msg.section_0.entries.257]
text = [
  "Old guys and kids can both enjoy\\n",
  "battling with Pokémon.$",
]

[msg.section_0.entries.258]
text = [
  "Keep pedaling even when your legs\\n",
  "crumble. This is the secret of Cyclists.$",
]

[msg.section_0.entries.259]
text = [
  "A Pokémon trained by cycling\\n",
  "could never lose against a person like you.$",
]

[msg.section_0.entries.260]
text = [
  "My cycling has no limits.\\n",
  "I will challenge you again someday.$",
]

[msg.section_0.entries.261]
text = [
  "My steel-wheeled friend brought me here.\\n",
  "Isn't it the greatest ever?$",
]

[msg.section_0.entries.262]
text = [
  "This is my best friend forever!\\n",
  "Always reliable and true as steel!$",
]

[msg.section_0.entries.263]
text = [
  "I blundered, stumbled, and lost...\\n",
  "Well, I still have my one and only.$",
]

[msg.section_0.entries.264]
text = [
  "Fun time is over.\\n",
  "Time to wake up!$",
]

[msg.section_0.entries.265]
text = [
  "The end always comes as a shock.$",
]

[msg.section_0.entries.266]
text = [
  "You are greatly mistaken if you\\n",
  "think you can dream forever.$",
]

[msg.section_0.entries.267]
text = [
  "I'm done! It's just not good enough.\\n",
  "A Bicycle is not enough of a challenge.$",
]

[msg.section_0.entries.268]
text = [
  "A Bicycle cannot satisfy me.\\n",
  "I will join the Bikers!$",
]

[msg.section_0.entries.269]
text = [
  "Faster!! I want a speed that nobody\\n",
  "can beat!$",
]

[msg.section_0.entries.270]
text = [
  "I won't surrender to you.\\n",
  "You are nothing but a young fellow!$",
]

[msg.section_0.entries.271]
text = [
  "I won't lose against whippersnappers!\\n",
  "I shall struggle on until the day I die!$",
]

[msg.section_0.entries.272]
text = [
  "Impressive! You are skillful for a\\n",
  "green stripling, young fellow!$",
]

[msg.section_0.entries.273]
text = [
  "Like a powerful foaming cleanser,\\n",
  "I will remove you!$",
]

[msg.section_0.entries.274]
text = [
  "Like a well-polished tile,\\n",
  "this is a sparkling victory!$",
]

[msg.section_0.entries.275]
text = [
  "Like a worn-out dust rag...$",
]

[msg.section_0.entries.276]
text = [
  "I am doing this job because\\n",
  "I love love love trains.$",
]

[msg.section_0.entries.277]
text = [
  "You are happy if you choose something\\n",
  "you like as a job.$",
]

[msg.section_0.entries.278]
text = [
  "I love trains too much.\\n",
  "It's a sickness, really...$",
]

[msg.section_0.entries.279]
text = [
  "Your journey will end here.\\n",
  "I am your terminal.$",
]

[msg.section_0.entries.280]
text = [
  "I praise you for coming up here.\\n",
  "But now, go home!$",
]

[msg.section_0.entries.281]
text = [
  "Ah... I didn't see it coming.\\n",
  "I will rest over here...$",
]

[msg.section_0.entries.282]
text = [
  "I need to prove I'm worthy.\\n",
  "I cannot lose against a child.$",
]

[msg.section_0.entries.283]
text = [
  "Am I childish? Adults do\\n",
  "whatever it takes to win.$",
]

[msg.section_0.entries.284]
text = [
  "My honor, my pride... I cannot show myself\\n",
  "to my coworkers in such a miserable state.$",
]

[msg.section_0.entries.285]
text = [
  "Hey, I've learned a few things in my time.\\n",
  "Let me demonstrate!$",
]

[msg.section_0.entries.286]
text = [
  "Not everyone likes me, but\\n",
  "I am quite the Trainer, aren't I?$",
]

[msg.section_0.entries.287]
text = [
  "Your technique shows wisdom...\\n",
  "Are you also an old man?$",
]

[msg.section_0.entries.288]
text = [
  "They say a company with lively workers\\n",
  "is a good company!$",
]

[msg.section_0.entries.289]
text = [
  "I work hard all the time!\\n",
  "I can battle 24/7!$",
]

[msg.section_0.entries.290]
text = [
  "Oh, look at the time!\\n",
  "I have to get back to work!$",
]

[msg.section_0.entries.291]
text = [
  "My boss is seriously annoying!\\n",
  "I believe I'll take it out on you!$",
]

[msg.section_0.entries.292]
text = [
  "Thank you for having a battle with me.\\n",
  "I feel much better.$",
]

[msg.section_0.entries.293]
text = [
  "You should choose your company carefully,\\n",
  "because you cannot choose your boss.$",
]

[msg.section_0.entries.294]
text = [
  "Are you my next patient?\\n",
  "Get over here!$",
]

[msg.section_0.entries.295]
text = [
  "Good, good. I am glad\\n",
  "that you and your Pokémon are obedient.$",
]

[msg.section_0.entries.296]
text = [
  "Wait! You, wait!\\n",
  "The surgery has not started yet!$",
]

[msg.section_0.entries.297]
text = [
  "When there is a patient, I will be there.\\n",
  "That is my job.$",
]

[msg.section_0.entries.298]
text = [
  "Please put yourself at ease!\\n",
  "Your Doctor is here.$",
]

[msg.section_0.entries.299]
text = [
  "If you are hurt, please call me.\\n",
  "I'll be there for you.$",
]

[msg.section_0.entries.300]
text = [
  "Please go easy on me.\\n",
  "I just finished my night shift.$",
]

[msg.section_0.entries.301]
text = [
  "After all that work, let's relax\\n",
  "with some Pokémon battles!$",
]

[msg.section_0.entries.302]
text = [
  "Yawn... I'm sleepy...\\n",
  "I can't stay awake any longer...$",
]

[msg.section_0.entries.303]
text = [
  "How are you and your Pokémon?$",
]

[msg.section_0.entries.304]
text = [
  "I will inject you with my energy!$",
]

[msg.section_0.entries.305]
text = [
  "People can do so much\\n",
  "as long as they have energy!$",
]

[msg.section_0.entries.306]
text = [
  "A Gentleman should have\\n",
  "a liking for battles.$",
]

[msg.section_0.entries.307]
text = [
  "A Gentleman should bask\\n",
  "in the elegant glow of his victory.$",
]

[msg.section_0.entries.308]
text = [
  "A Gentleman should accept the result of\\n",
  "a battle with a stoic mind.$",
]

[msg.section_0.entries.309]
text = [
  "I will evaluate your ability.$",
]

[msg.section_0.entries.310]
text = [
  "Hm... As a Trainer, you are\\n",
  "at the level of a Preschooler.$",
]

[msg.section_0.entries.311]
text = [
  "Hmm... As a Trainer, you are\\n",
  "at the level of Pokéfans.$",
]

[msg.section_0.entries.312]
text = [
  "You can learn a lot from mature women,\\n",
  "such as wisdom and good manners.$",
]

[msg.section_0.entries.313]
text = [
  "Woohoo! Were you knocked out by\\n",
  "the Socialite's charm?$",
]

[msg.section_0.entries.314]
text = [
  "Did you enjoy the battle with me?$",
]

[msg.section_0.entries.315]
text = [
  "Oh-ho! Let's have a unique\\n",
  "and elegant battle.$",
]

[msg.section_0.entries.316]
text = [
  "Ah-ha! I was not confident,\\n",
  "but this is a delightful surprise.$",
]

[msg.section_0.entries.317]
text = [
  "Eeeeee! I'll remember this!$",
]

[msg.section_0.entries.318]
text = [
  "Obedient Pokémon, selfish Pokémon...\\n",
  "Pokémon have unique characteristics.$",
]

[msg.section_0.entries.319]
text = [
  "You should not get angry at your Pokémon,\\n",
  "even when you lose.$",
]

[msg.section_0.entries.320]
text = [
  "It is important to nurture and train\\n",
  "each Pokémon's characteristics.$",
]

[msg.section_0.entries.321]
text = [
  "Do you discipline your Pokémon?\\n",
  "Pampering them too much is no good.$",
]

[msg.section_0.entries.322]
text = [
  "You need to discipline Pokémon you\\n",
  "love when they are misbehaving.$",
]

[msg.section_0.entries.323]
text = [
  "Too much praise can spoil\\n",
  "both Pokémon and people.$",
]

[msg.section_0.entries.324]
text = [
  "Pokémon never betray you.\\n",
  "They will return the love you give them.$",
]

[msg.section_0.entries.325]
text = [
  "This proves my love has been received\\n",
  "by my Pokémon.$",
]

[msg.section_0.entries.326]
text = [
  "It's about time for me to give someone\\n",
  "my affection, though.$",
]

[msg.section_0.entries.327]
text = [
  "Shall I give you a tip for\\n",
  "training good Pokémon?$",
]

[msg.section_0.entries.328]
text = [
  "The tip for training good Pokémon is\\n",
  "to catch good Pokémon.$",
]

[msg.section_0.entries.329]
text = [
  "You don't seem to need any tips\\n",
  "for training good Pokémon.$",
]

[msg.section_0.entries.330]
text = [
  "Glad you made it! It won't be\\n",
  "an easy job from here.$",
]

[msg.section_0.entries.331]
text = [
  "Haha! You see!?\\n",
  "You are not ready yet.$",
]

[msg.section_0.entries.332]
text = [
  "Earlier I got a little carried away,\\n",
  "but what job was I talking about?$",
]

[msg.section_0.entries.333]
text = [
  "Both my mom and dad are Ace Trainers.\\n",
  "So I am an Ace, too!$",
]

[msg.section_0.entries.334]
text = [
  "I want to be an Ace Trainer like\\n",
  "my mom and dad.$",
]

[msg.section_0.entries.335]
text = [
  "Waaaa! I should have superior genes and\\n",
  "be able to ride on my parents' coattails...$",
]

[msg.section_0.entries.336]
text = [
  "I don't mind your lack of focus, but you\\n",
  "will get no sympathy from me if you lose.$",
]

[msg.section_0.entries.337]
text = [
  "Ah, you see! You did not focus\\n",
  "on the battle. That's why you lost.$",
]

[msg.section_0.entries.338]
text = [
  "That is quite enough. It's over.\\n",
  "Don't stare at me!$",
]

[msg.section_0.entries.339]
text = [
  "Dad... Mom...\\n",
  "I'll have a battle. Look...$",
]

[msg.section_0.entries.340]
text = [
  "Dad... Mom...\\n",
  "Did you see me? I won... I won!$",
]

[msg.section_0.entries.341]
text = [
  "Dad... Mom...\\n",
  "What shall I do?$",
]

[msg.section_0.entries.342]
text = [
  "I came here to goof off.\\n",
  "I don't want to cram for the big test...$",
]

[msg.section_0.entries.343]
text = [
  "I cannot lose...\\n",
  "I don't want to study anymore.$",
]

[msg.section_0.entries.344]
text = [
  "No! I don't want to go home!\\n",
  "I don't want to study!$",
]

[msg.section_0.entries.345]
text = [
  "I just want to be successful\\n",
  "and grow rich someday.$",
]

[msg.section_0.entries.346]
text = [
  "My dream is simply to be rich.$",
]

[msg.section_0.entries.347]
text = [
  "I will be rich someday and\\n",
  "put you to shame.$",
]

[msg.section_0.entries.348]
text = [
  "I don't care who you are\\n",
  "or where you come from.$",
]

[msg.section_0.entries.349]
text = [
  "How should we act?\\n",
  "That is all that matters, isn't it?$",
]

[msg.section_0.entries.350]
text = [
  "A label is not important, is it?\\n",
  "After all, you are you, aren't you?$",
]

[msg.section_0.entries.351]
text = [
  "Pokémon battles and study sessions\\n",
  "are much the same. Let's be efficient!$",
]

[msg.section_0.entries.352]
text = [
  "You are too inefficient.\\n",
  "You need to be more quick and responsive.$",
]

[msg.section_0.entries.353]
text = [
  "How did I lose against such a slacker?\\n",
  "I cannot believe it!$",
]

[msg.section_0.entries.354]
text = [
  "I have money to burn,\\n",
  "so I don't want anything.$",
]

[msg.section_0.entries.355]
text = [
  "The only thing I enjoy\\n",
  "is a Pokémon battle...$",
]

[msg.section_0.entries.356]
text = [
  "Just because I am rich\\n",
  "does not mean I am especially happy.$",
]

[msg.section_0.entries.357]
text = [
  "Yes! I am a Rich Boy!$",
]

[msg.section_0.entries.358]
text = [
  "Well, good-bye!\\n",
  "You have been beaten by a Rich Boy!$",
]

[msg.section_0.entries.359]
text = [
  "Thank you! Merci!\\n",
  "You defeated a Rich Boy!$",
]

[msg.section_0.entries.360]
text = [
  "I just battle for fun,\\n",
  "but I'll do my best.$",
]

[msg.section_0.entries.361]
text = [
  "Well, I only won by chance.\\n",
  "Please pay it no mind.$",
]

[msg.section_0.entries.362]
text = [
  "It's good when you battle for fun.\\n",
  "If it's too serious, you won't enjoy it...$",
]

[msg.section_0.entries.363]
text = [
  "Yesterday was a party. Today is a\\n",
  "battle. I am rich. I always have fun!$",
]

[msg.section_0.entries.364]
text = [
  "I do not have to work,\\n",
  "because I am loaded with cash.$",
]

[msg.section_0.entries.365]
text = [
  "All play makes me a dull girl.\\n",
  "Do you think I don't know that?$",
]

[msg.section_0.entries.366]
text = [
  "I'm proud of these Pokémon!\\n",
  "Go on, rush the enemy position!$",
]

[msg.section_0.entries.367]
text = [
  "My Pokémon are mighty!\\n",
  "I will carve my name in history!$",
]

[msg.section_0.entries.368]
text = [
  "I won't cry... I won't.\\n",
  "Someday, I will be able to win.$",
]

[msg.section_0.entries.369]
text = [
  "I came here for my big brother\\n",
  "who always hides in his room.$",
]

[msg.section_0.entries.370]
text = [
  "My big brother the hermit,\\n",
  "I won for you! Come out and play!$",
]

[msg.section_0.entries.371]
text = [
  "I wish my brother would\\n",
  "come out of his room and play with me...$",
]

[msg.section_0.entries.372]
text = [
  "Hello me old china,\\n",
  "time for the rhyma!$",
]

[msg.section_0.entries.373]
text = [
  "Bit of a Pokémon read and write,\\n",
  "Trainer, many clinks!$",
]

[msg.section_0.entries.374]
text = [
  "Even if you dipper, you'll be fine.\\n",
  "Best of friar, Trainer!$",
]

[msg.section_0.entries.375]
text = [
  "All Dad and Mom do is mumble\\n",
  "at their computers! That's no fun!$",
]

[msg.section_0.entries.376]
text = [
  "I don't like Dad, or Mom, or computers!\\n",
  "All I need are my Pokémon!$",
]

[msg.section_0.entries.377]
text = [
  "Instead of mumbling to computers,\\n",
  "I wish they would talk to me...$",
]

[msg.section_0.entries.378]
text = [
  "A globe-trotting young adventurer.\\n",
  "That's me!$",
]

[msg.section_0.entries.379]
text = [
  "Seeing Pokémon all over the world is\\n",
  "the purpose of my journey.$",
]

[msg.section_0.entries.380]
text = [
  "Adventure is calling me.\\n",
  "Farewell! See you again!$",
]

[msg.section_0.entries.381]
text = [
  "Let's take it easy\\n",
  "with Pokémon and with life.$",
]

[msg.section_0.entries.382]
text = [
  "It's OK to bust your tail. But you need\\n",
  "to have some breathing room.$",
]

[msg.section_0.entries.383]
text = [
  "No problem. No problem.\\n",
  "I will have another chance.$",
]

[msg.section_0.entries.384]
text = [
  "I've traveled 3,000 miles searching\\n",
  "for a husband! A journey to nowhere.$",
]

[msg.section_0.entries.385]
text = [
  "Please let me know if there is a rich,\\n",
  "wealthy, or affluent gentleman!$",
]

[msg.section_0.entries.386]
text = [
  "My goal is a wedding band...\\n",
  "But is that really a utopia?$",
]

[msg.section_0.entries.387]
text = [
  "A game is life,\\n",
  "but life is not a game.$",
]

[msg.section_0.entries.388]
text = [
  "I am always serious. You cannot win\\n",
  "if you think this is just a game.$",
]

[msg.section_0.entries.389]
text = [
  "I'll give up games forever and set out\\n",
  "on a journey... Just kidding!$",
]

[msg.section_0.entries.390]
text = [
  "I'll always work part-time, because\\n",
  "it lets me focus on what I really love.$",
]

[msg.section_0.entries.391]
text = [
  "You have only one life to live.\\n",
  "Are you doing what you want to do?$",
]

[msg.section_0.entries.392]
text = [
  "I want to play here forever\\n",
  "without being tied down.$",
]

[msg.section_0.entries.393]
text = [
  "I took this job 'cause I wanted to see\\n",
  "smiles on people's faces.$",
]

[msg.section_0.entries.394]
text = [
  "Don't look at me like that.\\n",
  "Smile! Smile!$",
]

[msg.section_0.entries.395]
text = [
  "It's very frustrating,\\n",
  "but I am glad I saw you smile.$",
]

[msg.section_0.entries.396]
text = [
  "Let's start a battle already!\\n",
  "We are wasting time.$",
]

[msg.section_0.entries.397]
text = [
  "What? Is it already over?\\n",
  "We still have lots of time.$",
]

[msg.section_0.entries.398]
text = [
  "We ran out of time.\\n",
  "We cannot go into overtime!$",
]

[msg.section_0.entries.399]
text = [
  "I am battling here to promote\\n",
  "the café where I work.$",
]

[msg.section_0.entries.400]
text = [
  "You are not that strong,\\n",
  "so you are not really right for my café.$",
]

[msg.section_0.entries.401]
text = [
  "Yowza! What a strong Trainer!\\n",
  "See you at my café next time, OK?$",
]

[msg.section_0.entries.402]
text = [
  "Join the Pokéfans.\\n",
  "Your life will be happy!$",
]

[msg.section_0.entries.403]
text = [
  "If you join the Pokéfans,\\n",
  "you'll be strong like me!$",
]

[msg.section_0.entries.404]
text = [
  "If you join the Pokéfans,\\n",
  "your life will be saved!$",
]

[msg.section_0.entries.405]
text = [
  "I am not a regular Pokéfan.\\n",
  "I am a major mega-Pokéfan!$",
]

[msg.section_0.entries.406]
text = [
  "I love Pokémon.\\n",
  "I love love Pokémon!$",
]

[msg.section_0.entries.407]
text = [
  "You'll remember this!\\n",
  "I am a big Pokéfan!$",
]

[msg.section_0.entries.408]
text = [
  "I think I am a Pokéfan,\\n",
  "therefore I am a Pokéfan.$",
]

[msg.section_0.entries.409]
text = [
  "The Pokéfan is power.$",
]

[msg.section_0.entries.410]
text = [
  "You should remember this.\\n",
  "I am a Pokéfan.$",
]

[msg.section_0.entries.411]
text = [
  "There are young and beautiful people,\\n",
  "but youth is different from beauty.$",
]

[msg.section_0.entries.412]
text = [
  "If I had known that when I was young,\\n",
  "I would not have a hard time now...$",
]

[msg.section_0.entries.413]
text = [
  "Youth is just youth.\\n",
  "I wish I had realized it back then.$",
]

[msg.section_0.entries.414]
text = [
  "Ho there! You are a mountain standing\\n",
  "in my way, aren't ya?$",
]

[msg.section_0.entries.415]
text = [
  "Yahoooooo!! Yahoooooooo!\\n",
  "Hear my cry of triumph!$",
]

[msg.section_0.entries.416]
text = [
  "Grrr... My victory has disappeared\\n",
  "in a crevasse...$",
]

[msg.section_0.entries.417]
text = [
  "Hi! Sorry to keep you waiting!\\n",
  "I am a Hiker. I have a cult following!$",
]

[msg.section_0.entries.418]
text = [
  "Oh no? It's over already?\\n",
  "Hiker is bored!!$",
]

[msg.section_0.entries.419]
text = [
  "This is important, so remember this!\\n",
  "Don't judge a book by its cover!$",
]

[msg.section_0.entries.420]
text = [
  "Despite my appearance, I am the head\\n",
  "of a certain outfit. Don't tell anyone.$",
]

[msg.section_0.entries.421]
text = [
  "Don't tell anyone that I am playing here.$",
]

[msg.section_0.entries.422]
text = [
  "The boss does not have freedom.\\n",
  "I feel like a captured Pokémon.$",
]

[msg.section_0.entries.423]
text = [
  "The truth is, I want to have a quiet life\\n",
  "fishing all day, every day.$",
]

[msg.section_0.entries.424]
text = [
  "Ah... I don't want to do anything but fish.\\n",
  "I am tired of winning and losing.$",
]

[msg.section_0.entries.425]
text = [
  "At my time of life, it doesn't matter\\n",
  "if I win or lose.$",
]

[msg.section_0.entries.426]
text = [
  "Hello? Me? What, now?\\n",
  "I am about to have a battle.$",
]

[msg.section_0.entries.427]
text = [
  "Hello? Can you hear me?\\n",
  "I just won the battle.$",
]

[msg.section_0.entries.428]
text = [
  "Ah... Hello? Can you hear me?\\n",
  "Argh! I lost...$",
]

[msg.section_0.entries.429]
text = [
  "He told me that I was like a squall,\\n",
  "but what is a squall?$",
]

[msg.section_0.entries.430]
text = [
  "W-wah! Wahhh!\\n",
  "I am so happy that I am crying.$",
]

[msg.section_0.entries.431]
text = [
  "W-w-wahhhhh! Wahhhhh!\\n",
  "Wahhhhh! Wahhhhh!$",
]

[msg.section_0.entries.432]
text = [
  "No need to chat with someone\\n",
  "I'm about to battle.$",
]

[msg.section_0.entries.433]
text = [
  "Life is over if you lose.\\n",
  "That's why I hold out.$",
]

[msg.section_0.entries.434]
text = [
  "Don't look at miserable me!\\n",
  "Go away!$",
]

[msg.section_0.entries.435]
text = [
  "You have your way.\\n",
  "I have my way.$",
]

[msg.section_0.entries.436]
text = [
  "I will go my way 'cause\\n",
  "I don't have any other way.$",
]

[msg.section_0.entries.437]
text = [
  "Your way must be rocky.\\n",
  "Good luck. I am behind you all the way.$",
]

[msg.section_0.entries.438]
text = [
  "Hey, you! Don't mess with me,\\n",
  "or I will destroy your Pokémon!$",
]

[msg.section_0.entries.439]
text = [
  "Thought you might make trouble for me,\\n",
  "but what a wimpy attack!$",
]

[msg.section_0.entries.440]
text = [
  "How could I lose to such a wimpy move?\\n",
  "Gah, that bugs the snot out of me!$",
]

[msg.section_0.entries.441]
text = [
  "My dad and mom are both Veterans,\\n",
  "but I am a loser...$",
]

[msg.section_0.entries.442]
text = [
  "I wonder if my mom and dad will be sad\\n",
  "if they see that I've become a Roughneck.$",
]

[msg.section_0.entries.443]
text = [
  "I cannot be like my mom and dad.\\n",
  "So I will live as a Roughneck.$",
]

[msg.section_0.entries.444]
text = [
  "My partner has turned to dust,\\n",
  "but his Pokémon is my Pokémon now.$",
]

[msg.section_0.entries.445]
text = [
  "Are you watching me, my long-lost partner?\\n",
  "That Pokémon of yours, we get along...$",
]

[msg.section_0.entries.446]
text = [
  "He was trash, but now he is eternal,\\n",
  "like the stars in the sky... Ah, my partner!$",
]

[msg.section_0.entries.447]
text = [
  "I am no good at speaking...\\n",
  "So my bike speaks...$",
]

[msg.section_0.entries.448]
text = [
  "Zooooom! Zoom whoosh!\\n",
  "Zooooom! Zoom zam!$",
]

[msg.section_0.entries.449]
text = [
  "Vroom! Vroom! Vroom!\\n",
  "Vrooooooooom! Vroom!$",
]

[msg.section_0.entries.450]
text = [
  "All right! Are you ready?\\n",
  "Don't mess with a Biker!$",
]

[msg.section_0.entries.451]
text = [
  "I'm a Biker, so I'm more obsessed\\n",
  "with speed than anyone else!!$",
]

[msg.section_0.entries.452]
text = [
  "The truth is we are good guys.\\n",
  "We cannot do bad things at all!$",
]

[msg.section_0.entries.453]
text = [
  "Like uncooked dough,\\n",
  "my Pokémon are sticky!$",
]

[msg.section_0.entries.454]
text = [
  "Now you're stuck, aren't ya?$",
]

[msg.section_0.entries.455]
text = [
  "Well, your Pokémon are quite springy, too.$",
]

[msg.section_0.entries.456]
text = [
  "As I bake bread, I will bake your\\n",
  "Pokémon, too.$",
]

[msg.section_0.entries.457]
text = [
  "Oh my... Your Pokémon are like\\n",
  "burned bread.$",
]

[msg.section_0.entries.458]
text = [
  "Ah, how frustrating and disappointing!\\n",
  "You burned me with that last move...$",
]

[msg.section_0.entries.459]
text = [
  "Just as I knead the dough,\\n",
  "I'll knead you into shape.$",
]

[msg.section_0.entries.460]
text = [
  "Wanna be kneaded a little more?\\n",
  "Or shall I sandwich you with bread?$",
]

[msg.section_0.entries.461]
text = [
  "Ooooo! I'll remember this!\\n",
  "I'll turn you into a sandwich someday!$",
]

[msg.section_0.entries.462]
text = [
  "Laughing makes people feel better.\\n",
  "There seems to be scientific proof!$",
]

[msg.section_0.entries.463]
text = [
  "Haaa ha ha! Ha?\\n",
  "What's wrong? Let's laugh!$",
]

[msg.section_0.entries.464]
text = [
  "Laugh at miserable me--I lost against\\n",
  "amazing you. Laugh and you'll feel better.$",
]

[msg.section_0.entries.465]
text = [
  "You think you can win against me?\\n",
  "It might not go as smoothly as you think.$",
]

[msg.section_0.entries.466]
text = [
  "Don't underestimate me just because\\n",
  "I am a Harlequin.$",
]

[msg.section_0.entries.467]
text = [
  "No. This can't be happening.\\n",
  "You're not an ordinary person.$",
]

[msg.section_0.entries.468]
text = [
  "Observe my beautiful Pokémon magic!\\n",
  "Please watch closely!$",
]

[msg.section_0.entries.469]
text = [
  "I know a few gimmicks and tricks,\\n",
  "'cause this is magic.$",
]

[msg.section_0.entries.470]
text = [
  "Tricks and magic are my bread and butter.\\n",
  "Any Harlequin knows their worth!$",
]

[msg.section_0.entries.471]
text = [
  "Tedious talk is unnecessary...\\n",
  "I will just break you...$",
]

[msg.section_0.entries.472]
text = [
  "What? Are you broken already?$",
]

[msg.section_0.entries.473]
text = [
  "Ugh, I'm broken...$",
]

[msg.section_0.entries.474]
text = [
  "I have low self-esteem,\\n",
  "so I like someone to give me orders.$",
]

[msg.section_0.entries.475]
text = [
  "You are not my boss, so\\n",
  "it doesn't matter even if you are weak.$",
]

[msg.section_0.entries.476]
text = [
  "Can I call you my boss?$",
]

[msg.section_0.entries.477]
text = [
  "This outfit is not a uniform--\\n",
  "it's what I like to wear. I made it myself.$",
]

[msg.section_0.entries.478]
text = [
  "This is a uniform from an anime.\\n",
  "Doesn't it look good on me?$",
]

[msg.section_0.entries.479]
text = [
  "I want to live in a world of games,\\n",
  "anime, and comics forever.$",
]

[msg.section_0.entries.480]
text = [
  "I'm not cut out for a regular job,\\n",
  "so I live on art.$",
]

[msg.section_0.entries.481]
text = [
  "I envy Pokémon, 'cause they are\\n",
  "carefree. I want to be a Pokémon.$",
]

[msg.section_0.entries.482]
text = [
  "Bah, if I can do a regular job,\\n",
  "I will quit doing this stinking art.$",
]

[msg.section_0.entries.483]
text = [
  "Every time a Pokémon uses a move,\\n",
  "my heart will tremble!$",
]

[msg.section_0.entries.484]
text = [
  "Nothing stirs the soul\\n",
  "more than Pokémon moves.$",
]

[msg.section_0.entries.485]
text = [
  "Aha! Pokémon moves are so beautiful!\\n",
  "I could almost faint!$",
]

[msg.section_0.entries.486]
text = [
  "I will make you cry,\\n",
  "'cause you just don't know when to quit.$",
]

[msg.section_0.entries.487]
text = [
  "A state of deep sorrow and confusion\\n",
  "can also be art.$",
]

[msg.section_0.entries.488]
text = [
  "Someday, you will appreciate the value\\n",
  "of defeat and sorrow.$",
]

[msg.section_0.entries.489]
text = [
  "Our job is hard,\\n",
  "'cause it's such physical work.$",
]

[msg.section_0.entries.490]
text = [
  "My work gave me these great muscles.$",
]

[msg.section_0.entries.491]
text = [
  "Don't underestimate the power of kids.\\n",
  "Like I did with you!$",
]

[msg.section_0.entries.492]
text = [
  "Raising Pokémon and raising kids.\\n",
  "Both are very hard.$",
]

[msg.section_0.entries.493]
text = [
  "When my Pokémon do well like this,\\n",
  "I forget my everyday troubles.$",
]

[msg.section_0.entries.494]
text = [
  "Even I raise them with tender care,\\n",
  "because I am their Trainer...$",
]

[msg.section_0.entries.495]
text = [
  "Hey, you!\\n",
  "I promise I will take it easy on you!$",
]

[msg.section_0.entries.496]
text = [
  "Heheh... I will take it easy on you. Heh.$",
]

[msg.section_0.entries.497]
text = [
  "Sometimes even grown-ups want\\n",
  "someone to take care of them.$",
]

[msg.section_0.entries.498]
text = [
  "The job site is quite dangerous, but\\n",
  "I'll have to keep working with Pokémon.$",
]

[msg.section_0.entries.499]
text = [
  "I have trained my Pokémon well,\\n",
  "and it's ready to go to the job site.$",
]

[msg.section_0.entries.500]
text = [
  "Ugh. I cannot make money tomorrow\\n",
  "'cause I am injured.$",
]

[msg.section_0.entries.501]
text = [
  "Welcome!$",
]

[msg.section_0.entries.502]
text = [
  "Only the winner!\\n",
  "Only the winner can celebrate.$",
]

[msg.section_0.entries.503]
text = [
  "Enough... That's enough...$",
]

[msg.section_0.entries.504]
text = [
  "I do menial work every single day.\\n",
  "Am I just a cog in the machine?$",
]

[msg.section_0.entries.505]
text = [
  "I am well broken in. No snags slow down\\n",
  "the smooth running of this machine!$",
]

[msg.section_0.entries.506]
text = [
  "I may be happier than a person who\\n",
  "cannot even be a cog in the machine.$",
]

[msg.section_0.entries.507]
text = [
  "Yo, kid! Are you new? I'm the Worker\\n",
  "that everybody is talking about.$",
]

[msg.section_0.entries.508]
text = [
  "If you don't know me, you're bogus!\\n",
  "Good-bye! The Worker is heading out.$",
]

[msg.section_0.entries.509]
text = [
  "Kid! Remember me! I am the Worker\\n",
  "everybody's talking about.$",
]

[msg.section_0.entries.510]
text = [
  "Well, let me introduce myself.\\n",
  "These are my little darlings.$",
]

[msg.section_0.entries.511]
text = [
  "How was it? My little darlings are tough and\\n",
  "cute, aren't they?$",
]

[msg.section_0.entries.512]
text = [
  "Phew! Your little darlings are awesome, too!$",
]

[msg.section_0.entries.513]
text = [
  "Whir, whir, whir, whoooosh!$",
]

[msg.section_0.entries.514]
text = [
  "Ring-ring! Ding-ding!$",
]

[msg.section_0.entries.515]
text = [
  "Bam!$",
]

[msg.section_0.entries.516]
text = [
  "This is the very latest model,\\n",
  "a limited-edition, carbon-fiber Bicycle.$",
]

[msg.section_0.entries.517]
text = [
  "When you have good tools,\\n",
  "you feel better about yourself.$",
]

[msg.section_0.entries.518]
text = [
  "Don't! Please don't touch my Bicycle.\\n",
  "You'll cover it with your filthy fingerprints.$",
]

[msg.section_0.entries.519]
text = [
  "Speed is the key in a battle!\\n",
  "Dash! Dash! Dash!$",
]

[msg.section_0.entries.520]
text = [
  "If I compare how I'm feeling right now to a\\n",
  "race, it is just like crossing the finish line!$",
]

[msg.section_0.entries.521]
text = [
  "I cannot take your nonsense anymore!\\n",
  "I am moving back to my mother's place.$",
]

[msg.section_0.entries.522]
text = [
  "Hey, you! Take out all the Pokémon\\n",
  "you have here!$",
]

[msg.section_0.entries.523]
text = [
  "Huh? That's all you have?\\n",
  "Aren't you hiding a few more Pokémon?$",
]

[msg.section_0.entries.524]
text = [
  "I see. There seems to be nothing\\n",
  "suspicious about you or your Pokémon.$",
]

[msg.section_0.entries.525]
text = [
  "I'll protect my peace by myself.$",
]

[msg.section_0.entries.526]
text = [
  "My peace remains protected.$",
]

[msg.section_0.entries.527]
text = [
  "Please don't disturb my peace and quiet.$",
]

[msg.section_0.entries.528]
text = [
  "I was born to work.\\n",
  "That is my destiny.$",
]

[msg.section_0.entries.529]
text = [
  "I will work, work, and work some more.\\n",
  "I am happy only when I am working.$",
]

[msg.section_0.entries.530]
text = [
  "As a matter of fact, having battles\\n",
  "is my job, too.$",
]

[msg.section_0.entries.531]
text = [
  "I'm-a lowest rank now, but\\n",
  "I'm-a gonna be at the top someday!$",
]

[msg.section_0.entries.532]
text = [
  "I'm-a gonna be the brightest star\\n",
  "in the business! Top of the world, ma!$",
]

[msg.section_0.entries.533]
text = [
  "You work it like a shining star!\\n",
  "I'm not gonna lose, I'm not gonna lose!$",
]

[msg.section_0.entries.534]
text = [
  "I have an ambition!\\n",
  "I will take over the company!$",
]

[msg.section_0.entries.535]
text = [
  "All this serves my ambition!\\n",
  "It brings my sweet victory one step closer!$",
]

[msg.section_0.entries.536]
text = [
  "I was obsessed with the golden prize,\\n",
  "with my glittering ambition!$",
]

[msg.section_0.entries.537]
text = [
  "I am treated as an idol at the office.\\n",
  "Everybody pampers me.$",
]

[msg.section_0.entries.538]
text = [
  "Everybody works for me,\\n",
  "so I have nothing to do.$",
]

[msg.section_0.entries.539]
text = [
  "The truth is I don't like brushing my teeth\\n",
  "or taking a bath, but don't tell anyone.$",
]

[msg.section_0.entries.540]
text = [
  "You look dusty.\\n",
  "I'll give you a good scrub!$",
]

[msg.section_0.entries.541]
text = [
  "OK, you look a little bit cleaner now!$",
]

[msg.section_0.entries.542]
text = [
  "Hey! Don't run away!\\n",
  "You need to be scrubbed more!$",
]

[msg.section_0.entries.543]
text = [
  "These fruits of stubbornness were raised\\n",
  "stubbornly by a stubborn old man.$",
]

[msg.section_0.entries.544]
text = [
  "This stubborn old man raised them.\\n",
  "My persistence is different from yours!$",
]

[msg.section_0.entries.545]
text = [
  "There's a fine line between persistence\\n",
  "and stubbornness. I may retire soon.$",
]

[msg.section_0.entries.546]
text = [
  "I'm good at driving, but\\n",
  "I'm not good at dealing with Pokémon.$",
]

[msg.section_0.entries.547]
text = [
  "Oh, it went unexpectedly well.\\n",
  "By any chance, am I a technician?$",
]

[msg.section_0.entries.548]
text = [
  "My train does what I need. It's harder to\\n",
  "convince living Pokémon to do things my way.$",
]

[msg.section_0.entries.549]
text = [
  "I've never left this place even once\\n",
  "since I was born.$",
]

[msg.section_0.entries.550]
text = [
  "I wonder if I will live here\\n",
  "for the rest of my life...$",
]

[msg.section_0.entries.551]
text = [
  "I wonder how long I will stay here...\\n",
  "What is there outside this world?$",
]

[msg.section_0.entries.552]
text = [
  "I say this as a Doctor.\\n",
  "First of all, you must save money.$",
]

[msg.section_0.entries.553]
text = [
  "Money cannot buy health.\\n",
  "But you cannot stay healthy if you're poor.$",
]

[msg.section_0.entries.554]
text = [
  "Because without money, you can neither\\n",
  "eat healthy food nor go to see a Doctor.$",
]

[msg.section_0.entries.555]
text = [
  "As you can see, I am a Doctor,\\n",
  "but I've never examined a patient.$",
]

[msg.section_0.entries.556]
text = [
  "I've studied to become a Doctor,\\n",
  "but I faint when I see blood.$",
]

[msg.section_0.entries.557]
text = [
  "I am a Sunday Doctor,\\n",
  "rather like a Sunday driver.$",
]

[msg.section_0.entries.558]
text = [
  "Can you understand\\n",
  "what medical personnel need?$",
]

[msg.section_0.entries.559]
text = [
  "What a Doctor needs is love--\\n",
  "the rush of unconditional love.$",
]

[msg.section_0.entries.560]
text = [
  "Medical service is love.\\n",
  "Can you be a Doctor?$",
]

[msg.section_0.entries.561]
text = [
  "I took this job because I wanted\\n",
  "to be needed by someone.$",
]

[msg.section_0.entries.562]
text = [
  "My job is hard,\\n",
  "but I am happy to help people.$",
]

[msg.section_0.entries.563]
text = [
  "When a patient leaves the hospital,\\n",
  "I feel happy but a bit sad.$",
]

[msg.section_0.entries.564]
text = [
  "Grown-ups have a lot of hobbies.\\n",
  "Actually, I am a uniform collector.$",
]

[msg.section_0.entries.565]
text = [
  "I am not a Nurse.\\n",
  "I wear this uniform just for fun.$",
]

[msg.section_0.entries.566]
text = [
  "You realized that I am a fake Nurse!\\n",
  "Yes, I am just a uniform collector.$",
]

[msg.section_0.entries.567]
text = [
  "Even if you are injured, I will treat you.\\n",
  "So let's fight hard.$",
]

[msg.section_0.entries.568]
text = [
  "Sorry! I went too far. Do you require\\n",
  "immediate hospitalization?$",
]

[msg.section_0.entries.569]
text = [
  "You went too far! I will bill you\\n",
  "the cost of my medical expenses!$",
]

[msg.section_0.entries.570]
text = [
  "I raised these very special Pokémon\\n",
  "using a special method.$",
]

[msg.section_0.entries.571]
text = [
  "Pokémon will be strong or weak\\n",
  "depending on how you raise them.$",
]

[msg.section_0.entries.572]
text = [
  "Ugh... It wasn't supposed to be like this.\\n",
  "Did I blend the essence wrong?$",
]

[msg.section_0.entries.573]
text = [
  "Shall I share an exclusive tip\\n",
  "for training great Pokémon?$",
]

[msg.section_0.entries.574]
text = [
  "You'll be perfect if you buy my book\\n",
  "of Pokémon-training tips.$",
]

[msg.section_0.entries.575]
text = [
  "You'll be fine if you buy my DVD\\n",
  "of Pokémon-training tips.$",
]

[msg.section_0.entries.576]
text = [
  "Pokémon are my family!\\n",
  "See the solidarity of my family!$",
]

[msg.section_0.entries.577]
text = [
  "Well done, brothers and sisters!\\n",
  "Our family solidarity is invincible!$",
]

[msg.section_0.entries.578]
text = [
  "NO! My family!\\n",
  "What have you done?!$",
]

[msg.section_0.entries.579]
text = [
  "What you like and what you're good at\\n",
  "are different, or at least separate.$",
]

[msg.section_0.entries.580]
text = [
  "I am good at battling,\\n",
  "but I don't enjoy it very much.$",
]

[msg.section_0.entries.581]
text = [
  "If you like what you do as a job,\\n",
  "you have a sense of fulfillment, don't you?$",
]

[msg.section_0.entries.582]
text = [
  "In summary, you cannot win against me.$",
]

[msg.section_0.entries.583]
text = [
  "You see, you cannot win, because\\n",
  "you are very weak.$",
]

[msg.section_0.entries.584]
text = [
  "Hummmm... You are good.\\n",
  "You are really pretty good.$",
]

[msg.section_0.entries.585]
text = [
  "Don't underestimate me because I'm old.\\n",
  "I'll show you my rejuvenating attack!$",
]

[msg.section_0.entries.586]
text = [
  "I'm old but still going strong!\\n",
  "I can take care of myself!$",
]

[msg.section_0.entries.587]
text = [
  "What a cruel way to treat a helpless\\n",
  "old man! Shame on you!$",
]

[msg.section_0.entries.588]
text = [
  "I would like to retire soon. But I have\\n",
  "no one to carry on the family tradition...$",
]

[msg.section_0.entries.589]
text = [
  "If I had a child like you,\\n",
  "my golden years would be carefree...$",
]

[msg.section_0.entries.590]
text = [
  "I wish my son were\\n",
  "as mature as you are.$",
]

[msg.section_0.entries.591]
text = [
  "I feel sad when I see a young and\\n",
  "bright child like you.$",
]

[msg.section_0.entries.592]
text = [
  "The first flush of youth...\\n",
  "You are too bright for me...$",
]

[msg.section_0.entries.593]
text = [
  "Sparkling eyes, firm skin...\\n",
  "I won't get them back.$",
]

[msg.section_0.entries.594]
text = [
  "Hey! It's me. It's me!\\n",
  "I am the best Pilot in the world!$",
]

[msg.section_0.entries.595]
text = [
  "How's that? Pwned!!$",
]

[msg.section_0.entries.596]
text = [
  "You! Who are you?!\\n",
  "Do you know who I am?$",
]

[msg.section_0.entries.597]
text = [
  "I'm at the top of the heap! I'm a man\\n",
  "who always wants to come in first.$",
]

[msg.section_0.entries.598]
text = [
  "Remember this! My favorite words\\n",
  "are \\\"top of the heap.\\\"$",
]

[msg.section_0.entries.599]
text = [
  "You. Well done!\\n",
  "See you! I'll remember this!$",
]

[msg.section_0.entries.600]
text = [
  "I won't back down, lose, or fail!\\n",
  "No defeat for a Clerk ⑭.$",
]

[msg.section_0.entries.601]
text = [
  "Uh-huh!$",
]

[msg.section_0.entries.602]
text = [
  "Uuugh... Well done...\\n",
  "You made me fall to my knees...$",
]

[msg.section_0.entries.603]
text = [
  "I can do it! I can do anything!\\n",
  "I will do it! I will do it!$",
]

[msg.section_0.entries.604]
text = [
  "Yes! I did it! I can do it!\\n",
  "I can do it! I can doooooooo it!$",
]

[msg.section_0.entries.605]
text = [
  "But I listened to my Teacher's advice.\\n",
  "I can't lose! I can't!$",
]

[msg.section_0.entries.606]
text = [
  "My research will lead this world\\n",
  "to peace and happiness.$",
]

[msg.section_0.entries.607]
text = [
  "I am a genius. I will control\\n",
  "the future of the world!$",
]

[msg.section_0.entries.608]
text = [
  "I am a genius... I am not supposed\\n",
  "to lose against someone like you...$",
]

[msg.section_0.entries.609]
text = [
  "Only research is left in my life.\\n",
  "I abandoned my family and friends.$",
]

[msg.section_0.entries.610]
text = [
  "It's not bad to devote my whole life\\n",
  "to research, is it?$",
]

[msg.section_0.entries.611]
text = [
  "Dedicating yourself to something\\n",
  "can cause loneliness.$",
]

[msg.section_0.entries.612]
text = [
  "Hyuck-yuck-yuck... Please lend me\\n",
  "a hand for my experiment.$",
]

[msg.section_0.entries.613]
text = [
  "Hyuck-yuck-yuck... I did it.\\n",
  "The experiment was a huge success.$",
]

[msg.section_0.entries.614]
text = [
  "Ho-hum. This is not good...\\n",
  "This experiment was a failure...$",
]

[msg.section_0.entries.615]
text = [
  "You must face off against\\n",
  "my extremely powered-up Pokémon!$",
]

[msg.section_0.entries.616]
text = [
  "Well, this is a natural outcome.\\n",
  "The power of science is awesome.$",
]

[msg.section_0.entries.617]
text = [
  "Your Pokémon have even more awesome\\n",
  "strength than the power of science.$",
]

[msg.section_0.entries.618]
text = [
  "If you lose, I'll have you help me\\n",
  "in my latest experiment!$",
]

[msg.section_0.entries.619]
text = [
  "Ho hi ho. You lost! You will help science\\n",
  "as my new assistant.$",
]

[msg.section_0.entries.620]
text = [
  "Pah. I was sooo close to signing you up\\n",
  "as my new assistant.$",
]

[msg.section_0.entries.621]
text = [
  "Why do people compete and fight?\\n",
  "This is the subject of my research.$",
]

[msg.section_0.entries.622]
text = [
  "Even if you win, you will hurt your\\n",
  "opponent's feelings.$",
]

[msg.section_0.entries.623]
text = [
  "If you lose, you may resent your opponent.$",
]

[msg.section_0.entries.624]
text = [
  "Hi! Focus!$",
]

[msg.section_0.entries.625]
text = [
  "Foooooooooooo!$",
]

[msg.section_0.entries.626]
text = [
  "Eeek!$",
]

[msg.section_0.entries.627]
text = [
  "Speech can be utter nonsense.\\n",
  "Pretty words only taint battles...$",
]

[msg.section_0.entries.628]
text = [
  "Trainers who treat battles as a sport\\n",
  "are the height of vileness...$",
]

[msg.section_0.entries.629]
text = [
  "Defeat is worth nothing.\\n",
  "Losers don't need words...$",
]

[msg.section_0.entries.630]
text = [
  "He-he-he. If you lose,\\n",
  "I will turn you into a Pokémon.$",
]

[msg.section_0.entries.631]
text = [
  "He-he-he. Well, from today on,\\n",
  "you are already a Pokémon.$",
]

[msg.section_0.entries.632]
text = [
  "Next time I see you, I will turn you\\n",
  "into a Pokémon with my power.$",
]

[msg.section_0.entries.633]
text = [
  "Argh... I have a headache...\\n",
  "I have such a headache...$",
]

[msg.section_0.entries.634]
text = [
  "I don't need psychic powers.\\n",
  "Please stop this headache...$",
]

[msg.section_0.entries.635]
text = [
  "If I don't keep using my power for battles,\\n",
  "my headache won't go away...$",
]

[msg.section_0.entries.636]
text = [
  "I claim that I am a Psychic,\\n",
  "but I cannot use psychic powers.$",
]

[msg.section_0.entries.637]
text = [
  "I am camouflaging it\\n",
  "with my Psychic-ish costume.$",
]

[msg.section_0.entries.638]
text = [
  "I go to magic classes\\n",
  "to look like a Psychic.$",
]

[msg.section_0.entries.639]
text = [
  "...Grrr... Yeeek!!\\n",
  "An evil spirit! Go away!!$",
]

[msg.section_0.entries.640]
text = [
  "OK! The evil spirit\\n",
  "that possessed you has disappeared.$",
]

[msg.section_0.entries.641]
text = [
  "Evil spirit!\\n",
  "Leave the Trainer at once!$",
]

[msg.section_0.entries.642]
text = [
  "I praise your courage for challenging me!\\n",
  "I am the one with the strongest kick.$",
]

[msg.section_0.entries.643]
text = [
  "Haha... I probably did not have to use\\n",
  "my strongest kick on you.$",
]

[msg.section_0.entries.644]
text = [
  "Oh... The Pokémon did the fighting.\\n",
  "My strong kick didn't help a bit.$",
]

[msg.section_0.entries.645]
text = [
  "'Suuup! I'll give it all I've got!\\n",
  "Let's do our best!!$",
]

[msg.section_0.entries.646]
text = [
  "'Sup! That's enough!\\n",
  "Please value your life!$",
]

[msg.section_0.entries.647]
text = [
  "'Suuuuup! Good work. I tried everything\\n",
  "I could, but I'm disappointed.$",
]

[msg.section_0.entries.648]
text = [
  "Yo!$",
]

[msg.section_0.entries.649]
text = [
  "Yo! Yo! Yo!$",
]

[msg.section_0.entries.650]
text = [
  "Yo!$",
]

[msg.section_0.entries.651]
text = [
  "You don't have to impress me.\\n",
  "You can lose against me.$",
]

[msg.section_0.entries.652]
text = [
  "Come. Sleep quietly in my arms...$",
]

[msg.section_0.entries.653]
text = [
  "It's sad to say good-bye,\\n",
  "but we're running out of time.$",
]

[msg.section_0.entries.654]
text = [
  "Are you ready?\\n",
  "I'll take the gloves off.$",
]

[msg.section_0.entries.655]
text = [
  "Well, well... You're not even in my league.\\n",
  "This is like bullying.$",
]

[msg.section_0.entries.656]
text = [
  "Aww... I cannot believe I lost!\\n",
  "Who are you?!$",
]

[msg.section_0.entries.657]
text = [
  "I would like to do the fighting\\n",
  "instead of my Pokémon if I could.$",
]

[msg.section_0.entries.658]
text = [
  "Pokémon battles are not enough of a\\n",
  "challenge. I want to make this personal.$",
]

[msg.section_0.entries.659]
text = [
  "Ah, I tingle with excitement.\\n",
  "I would like to fight...$",
]

[msg.section_0.entries.660]
text = [
  "Halt at once! You over there!\\n",
  "Let us cross lances!$",
]

[msg.section_0.entries.661]
text = [
  "Trainer, you are at my mercy!$",
]

[msg.section_0.entries.662]
text = [
  "Trainer, I yield!\\n",
  "Please spare me. Please!$",
]

[msg.section_0.entries.663]
text = [
  "When I am surrounded by nature,\\n",
  "most other things cease to matter.$",
]

[msg.section_0.entries.664]
text = [
  "I won. But victory is nothing\\n",
  "compared to the vastness of nature...$",
]

[msg.section_0.entries.665]
text = [
  "It doesn't matter to the vastness\\n",
  "of nature whether I win or lose...$",
]

[msg.section_0.entries.666]
text = [
  "Despite my appearance, I am a city boy.\\n",
  "So I yearn for country life.$",
]

[msg.section_0.entries.667]
text = [
  "Do you have a hometown?\\n",
  "If so, you should go back and visit there.$",
]

[msg.section_0.entries.668]
text = [
  "I don't have a hometown to go back to,\\n",
  "'cause I was born and raised in the city.$",
]

[msg.section_0.entries.669]
text = [
  "It's my mission to protect nature\\n",
  "and all Pokémon living there!$",
]

[msg.section_0.entries.670]
text = [
  "If villains disturb the natural order,\\n",
  "I will put them all in jail!$",
]

[msg.section_0.entries.671]
text = [
  "Protect Mother Nature!\\n",
  "Otherwise, I will put you in jail!$",
]

[msg.section_0.entries.672]
text = [
  "We need a lot of money to protect\\n",
  "Mother Nature and her Pokémon.$",
]

[msg.section_0.entries.673]
text = [
  "Please donate money for a rich natural\\n",
  "environment and for the Pokémon.$",
]

[msg.section_0.entries.674]
text = [
  "We protect forests and Pokémon by\\n",
  "saving money and planting trees.$",
]

[msg.section_0.entries.675]
text = [
  "Let me stop your winning streak here.$",
]

[msg.section_0.entries.676]
text = [
  "Ah. You still have much to learn.\\n",
  "Let me give you a crash course!$",
]

[msg.section_0.entries.677]
text = [
  "You didn't win alone. You couldn't have won\\n",
  "without your Pokémon.$",
]

[msg.section_0.entries.678]
text = [
  "You seem to be quite confident.\\n",
  "I'll sink you straightaway.$",
]

[msg.section_0.entries.679]
text = [
  "I am devoting my body and soul\\n",
  "to Pokémon battles!$",
]

[msg.section_0.entries.680]
text = [
  "AAAAAAAAH! I am sooooo scared!\\n",
  "I will never do it again... Sorrrry!$",
]

[msg.section_0.entries.681]
text = [
  "I'm working very hard, but\\n",
  "that doesn't mean I am strong.$",
]

[msg.section_0.entries.682]
text = [
  "You're a strong Trainer,\\n",
  "so I think I was just lucky this time.$",
]

[msg.section_0.entries.683]
text = [
  "Even I can lose?!\\n",
  "But I'm a battling genius!$",
]

[msg.section_0.entries.684]
text = [
  "I started battling just to be cool, but\\n",
  "I became an Ace before I knew it.$",
]

[msg.section_0.entries.685]
text = [
  "People can become strong if they have\\n",
  "clear goals. That's the way it goes.$",
]

[msg.section_0.entries.686]
text = [
  "I'm still not popular even though\\n",
  "I've been recognized as an Ace.$",
]

[msg.section_0.entries.687]
text = [
  "The lead character of this story...\\n",
  "I'll tell you who it is!$",
]

[msg.section_0.entries.688]
text = [
  "The lead character of the story is me!\\n",
  "You are just an extra!$",
]

[msg.section_0.entries.689]
text = [
  "Of course, you are the lead character!$",
]

[msg.section_0.entries.690]
text = [
  "We would like to hold a Pokémon battle\\n",
  "against the strongest foe.$",
]

[msg.section_0.entries.691]
text = [
  "We cannot believe we spent time\\n",
  "on such a childish battle! Leave at once!$",
]

[msg.section_0.entries.692]
text = [
  "Ho-ho-ho! That is to our liking!\\n",
  "We find ourselves quite satisfied!$",
]

[msg.section_0.entries.693]
text = [
  "A person who wants to fight, fight, and\\n",
  "fight forever. That's the way of the Ace.$",
]

[msg.section_0.entries.694]
text = [
  "However hard they battle, they won't be\\n",
  "satisfied. That is a real Trainer, isn't it?$",
]

[msg.section_0.entries.695]
text = [
  "Your fighting style suits you very well.\\n",
  "You can be an Ace Trainer.$",
]

[msg.section_0.entries.696]
text = [
  "I can see despair in your eyes.\\n",
  "Bring it on!$",
]

[msg.section_0.entries.697]
text = [
  "It was a waste of time, much as I suspected.\\n",
  "You should start training all over again.$",
]

[msg.section_0.entries.698]
text = [
  "Did I underestimate you as just a little kid?\\n",
  "Or was this your true ability?$",
]

[msg.section_0.entries.699]
text = [
  "Hey, you, young Trainer.\\n",
  "I am utterly stylish, aren't I?$",
]

[msg.section_0.entries.700]
text = [
  "I am so stylish,\\n",
  "I hypnotize myself! Step back!$",
]

[msg.section_0.entries.701]
text = [
  "I'm a wreck. I'm adrift. It just kills me.\\n",
  "It is hard to be too stylish.$",
]

[msg.section_0.entries.702]
text = [
  "I won't lose against a kid like you\\n",
  "who doesn't know anything about battles.$",
]

[msg.section_0.entries.703]
text = [
  "After all, you are an amateur. No sweat.\\n",
  "(Whew... That was a little too close!)$",
]

[msg.section_0.entries.704]
text = [
  "What? This kid is a fast learner?\\n",
  "Ha ha ha... I had no idea!$",
]

[msg.section_0.entries.705]
text = [
  "Argh. Cough, cough. I don't feel well.\\n",
  "Please show a little kindness.$",
]

[msg.section_0.entries.706]
text = [
  "I lied when I said I didn't feel well!\\n",
  "Veterans do anything to win!$",
]

[msg.section_0.entries.707]
text = [
  "You're very sharp!\\n",
  "You did not fall for my illness act.$",
]

[msg.section_0.entries.708]
text = [
  "I will give you a taste\\n",
  "of a Veteran's well-trained Pokémon.$",
]

[msg.section_0.entries.709]
text = [
  "How were the Veteran's Pokémon?\\n",
  "Defeat is bitter, isn't it?$",
]

[msg.section_0.entries.710]
text = [
  "You have served me a spicy defeat.\\n",
  "And yet defeat is also part of life.$",
]

[msg.section_0.entries.711]
text = [
  "Oh, you are so cute!\\n",
  "Come, I promise to be nice in this battle.$",
]

[msg.section_0.entries.712]
text = [
  "You are so cute, really...\\n",
  "I want to see you again. I'll be waiting.$",
]

[msg.section_0.entries.713]
text = [
  "Your battle is a little too cute.\\n",
  "Let's play again sometime.$",
]

[msg.section_0.entries.714]
text = [
  "Oh, you are still a child.\\n",
  "Who said you could come here?$",
]

[msg.section_0.entries.715]
text = [
  "You're not bad, but you're immature.\\n",
  "Come back when you've learned something.$",
]

[msg.section_0.entries.716]
text = [
  "I thought you were a child.\\n",
  "Hee hee... You are tough...$",
]

[msg.section_0.entries.717]
text = [
  "Don't call me a Veteran!\\n",
  "A woman's mind is always blooming.$",
]

[msg.section_0.entries.718]
text = [
  "I'm not finished with love or Pokémon.\\n",
  "I'll stay fit and ready all my life.$",
]

[msg.section_0.entries.719]
text = [
  "I have pains in my eyes, my shoulder, and\\n",
  "my back, but my heart is forever young.$",
]

[msg.section_0.entries.720]
text = [
  "I am the strongest Backpacker.\\n",
  "I have a lot of Pokémon in my Bag.$",
]

[msg.section_0.entries.721]
text = [
  "Hahaha! I am as big as my backpack,\\n",
  "aren't I? Aren't I?$",
]

[msg.section_0.entries.722]
text = [
  "I have more Pokémon in my Bag!\\n",
  "Wait, my Bag has a hole...$",
]

[msg.section_0.entries.723]
text = [
  "I am not traveling for freedom.$",
]

[msg.section_0.entries.724]
text = [
  "You're carrying bulky luggage,\\n",
  "but do you really need it?$",
]

[msg.section_0.entries.725]
text = [
  "My Bag is as wide as the sky.\\n",
  "In other words, my Bag is empty.$",
]

[msg.section_0.entries.726]
text = [
  "I haven't eaten anything for days.\\n",
  "Spots are floating before my eyes...$",
]

[msg.section_0.entries.727]
text = [
  "Those aren't spots floating before my eyes.\\n",
  "Those are glorious glimmers of victory!$",
]

[msg.section_0.entries.728]
text = [
  "Ah, I'm sinking fast. All I can think about\\n",
  "is where my next meal is coming from...$",
]

[msg.section_0.entries.729]
text = [
  "Neither my husband nor I have money,\\n",
  "so we are hitchhiking on our honeymoon.$",
]

[msg.section_0.entries.730]
text = [
  "Newly married, and such a big trip...\\n",
  "I'm worried about our future.$",
]

[msg.section_0.entries.731]
text = [
  "On top of that, I have lost track of him...\\n",
  "Where can he be wandering?$",
]

[msg.section_0.entries.732]
text = [
  "Hey! Hey!\\n",
  "Please check out my cute Pokémon!$",
]

[msg.section_0.entries.733]
text = [
  "How about that?\\n",
  "I'm proud of these Pokémon.$",
]

[msg.section_0.entries.734]
text = [
  "Oh no, don't bother them like that!\\n",
  "Please leave my Pokémon alone.$",
]

[msg.section_0.entries.735]
text = [
  "Being a Waiter is my disguise,\\n",
  "and it helps me live quietly.$",
]

[msg.section_0.entries.736]
text = [
  "On my days off, the real me is ready.\\n",
  "I'm an Ace Trainer!$",
]

[msg.section_0.entries.737]
text = [
  "I'm struggling to make a living,\\n",
  "so I've been in disguise a long time.$",
]

[msg.section_0.entries.738]
text = [
  "My Pokémon are the strongest.\\n",
  "I don't think I will lose.$",
]

[msg.section_0.entries.739]
text = [
  "Do you think you can win against me\\n",
  "with such wimpy Pokémon?$",
]

[msg.section_0.entries.740]
text = [
  "Ah... It's hard.\\n",
  "It sure is frustrating to lose.$",
]

[msg.section_0.entries.741]
text = [
  "Don't you think a restaurant\\n",
  "for Pokémon is a fun idea?$",
]

[msg.section_0.entries.742]
text = [
  "I wonder if people will like\\n",
  "a full-course meal for Pokémon.$",
]

[msg.section_0.entries.743]
text = [
  "It's a restaurant for Pokémon,\\n",
  "not a restaurant of Pokémon!$",
]

[msg.section_0.entries.744]
text = [
  "Harrumph! Haroooo!$",
]

[msg.section_0.entries.745]
text = [
  "Harooo!$",
]

[msg.section_0.entries.746]
text = [
  "Harrumph!!$",
]

[msg.section_0.entries.747]
text = [
  "I am the mountain range of your life!\\n",
  "Cross me if you can!$",
]

[msg.section_0.entries.748]
text = [
  "Haha! I am the summit, and the road\\n",
  "to reach me is still very steep!$",
]

[msg.section_0.entries.749]
text = [
  "Finally, someone has climbed the mountain!\\n",
  "This is my summit!$",
]

[msg.section_0.entries.750]
text = [
  "If I lose, I'll spill the secret of fishing.\\n",
  "If I win, I'll tell you the essence.$",
]

[msg.section_0.entries.751]
text = [
  "The essence of fishing is to pull\\n",
  "and reel in the fish--nothing else.$",
]

[msg.section_0.entries.752]
text = [
  "The secret of fishing is to wait without\\n",
  "thinking, as if you were dozing off.$",
]

[msg.section_0.entries.753]
text = [
  "I always aim for a big fish!\\n",
  "Stay out of this if you are a small fish!$",
]

[msg.section_0.entries.754]
text = [
  "Reeling you in was hard work.\\n",
  "You put up a good fight!$",
]

[msg.section_0.entries.755]
text = [
  "Oh! What a great hit!\\n",
  "Both my arms and heart are electrified!$",
]

[msg.section_0.entries.756]
text = [
  "You look kind of mature.\\n",
  "I like people like you.$",
]

[msg.section_0.entries.757]
text = [
  "Still, you look mature for your age.\\n",
  "Are you already an adult, or are you a kid?$",
]

[msg.section_0.entries.758]
text = [
  "A man with the heart of a boy\\n",
  "is just a wheedling child.$",
]

[msg.section_0.entries.759]
text = [
  "How much did this parasol cost?\\n",
  "Why, it is a cheap disposable.$",
]

[msg.section_0.entries.760]
text = [
  "I am a Parasol Lady, but I cannot\\n",
  "spend money for a parasol.$",
]

[msg.section_0.entries.761]
text = [
  "A parasol is just a tool. It's fine\\n",
  "as long as it protects me from the rain.$",
]

[msg.section_0.entries.762]
text = [
  "I can really cut loose in Pokémon\\n",
  "battles without being scolded.$",
]

[msg.section_0.entries.763]
text = [
  "Nobody scolds me. That's why\\n",
  "Pokémon battles are the best!$",
]

[msg.section_0.entries.764]
text = [
  "You like a big fight, don't ya?\\n",
  "You are my pal.$",
]

[msg.section_0.entries.765]
text = [
  "My computer friends said I wouldn't be\\n",
  "taken lightly with this look.$",
]

[msg.section_0.entries.766]
text = [
  "I won, but I was so scared...\\n",
  "Maybe I am not cut out for this.$",
]

[msg.section_0.entries.767]
text = [
  "Eeek... I should have played\\n",
  "with my computer in my room.$",
]

[msg.section_0.entries.768]
text = [
  "My ride and I\\n",
  "are always together.$",
]

[msg.section_0.entries.769]
text = [
  "My ride helps me show off who I am.$",
]

[msg.section_0.entries.770]
text = [
  "My motorbike makes me feel better\\n",
  "when I lose.$",
]

[msg.section_0.entries.771]
text = [
  "I don't have money to buy gas,\\n",
  "so I have to push it with my feet.$",
]

[msg.section_0.entries.772]
text = [
  "I'm one of the Bikers,\\n",
  "so my bike is crucial.$",
]

[msg.section_0.entries.773]
text = [
  "Ah... Dad, Mom.\\n",
  "It's hard to be a Biker...$",
]

[msg.section_0.entries.774]
text = [
  "Aah, I am so hungry that I am\\n",
  "completely wiped out. What shall I do?$",
]

[msg.section_0.entries.775]
text = [
  "I'm working at a bakery, 'cause I want to\\n",
  "eat bread anytime I want.$",
]

[msg.section_0.entries.776]
text = [
  "Aah! I crashed from my sugar high!\\n",
  "Someone give me a pastry!$",
]

[msg.section_0.entries.777]
text = [
  "OK, I will do it!\\n",
  "I am excited about this!$",
]

[msg.section_0.entries.778]
text = [
  "Bam!$",
]

[msg.section_0.entries.779]
text = [
  "I'll remember this!$",
]

[msg.section_0.entries.780]
text = [
  "I'll confuse you with my smooth moves.\\n",
  "A-one, a-two, cha cha cha!$",
]

[msg.section_0.entries.781]
text = [
  "You could not focus on the battle,\\n",
  "'cause you were watching my smooth steps!$",
]

[msg.section_0.entries.782]
text = [
  "And one, and two, and twirl, and...\\n",
  "Ah, that didn't work at all!$",
]

[msg.section_0.entries.783]
text = [
  "Sorry to keep you waiting.\\n",
  "Your idol, Harlequin, Harlequin.$",
]

[msg.section_0.entries.784]
text = [
  "Thank you very much.\\n",
  "It was Harlequin, Harlequin.$",
]

[msg.section_0.entries.785]
text = [
  "It was Harlequin, Harlequin.\\n",
  "Thank you for your support.$",
]

[msg.section_0.entries.786]
text = [
  "If you lose, you can be my servant.$",
]

[msg.section_0.entries.787]
text = [
  "From now on, I am your employer.$",
]

[msg.section_0.entries.788]
text = [
  "I'll make you my servant someday.$",
]

[msg.section_0.entries.789]
text = [
  "Ahhhh... So strange.\\n",
  "I feel very, very tired.$",
]

[msg.section_0.entries.790]
text = [
  "I still feel kind of blah.\\n",
  "I'm all achy...$",
]

[msg.section_0.entries.791]
text = [
  "I really feel blah.\\n",
  "Well, I will go home now.$",
]

[msg.section_0.entries.792]
text = [
  "A child like you cannot understand\\n",
  "the beauty that I am pursuing.$",
]

[msg.section_0.entries.793]
text = [
  "I am a servant of beauty.\\n",
  "Ugly defeat does not suit me.$",
]

[msg.section_0.entries.794]
text = [
  "Perhaps the beauty I've been looking for...\\n",
  "is you?$",
]

[msg.section_0.entries.795]
text = [
  "I paint pictures and live with Pokémon.\\n",
  "I am enjoying my life!$",
]

[msg.section_0.entries.796]
text = [
  "The sting of defeat will be a good\\n",
  "memory as you grow older.$",
]

[msg.section_0.entries.797]
text = [
  "Experience hardships when you are young,\\n",
  "'cause old bodies cannot take them.$",
]

[msg.section_0.entries.798]
text = [
  "My schoolkids are sleeping.\\n",
  "I'm shooting for the top during nap time!$",
]

[msg.section_0.entries.799]
text = [
  "Oh, no!\\n",
  "Look at the time!$",
]

[msg.section_0.entries.800]
text = [
  "After nap time comes snack time.\\n",
  "I have to go back to preschool soon.$",
]

[msg.section_0.entries.801]
text = [
  "Life is full of so many farewells,\\n",
  "so I will enjoy the present.$",
]

[msg.section_0.entries.802]
text = [
  "I cannot see you again,\\n",
  "so I will do my best.$",
]

[msg.section_0.entries.803]
text = [
  "This is a woman's life.\\n",
  "Can a baby like you understand it?$",
]

[msg.section_0.entries.804]
text = [
  "If you work diligently,\\n",
  "you will get results.$",
]

[msg.section_0.entries.805]
text = [
  "You, keep trying.\\n",
  "Master the basics.$",
]

[msg.section_0.entries.806]
text = [
  "Well, even if you work diligently,\\n",
  "things don't always go well.$",
]

[msg.section_0.entries.807]
text = [
  "I've arrived from a distant island.\\n",
  "May I please trouble you for a battle?$",
]

[msg.section_0.entries.808]
text = [
  "I have won.$",
]

[msg.section_0.entries.809]
text = [
  "I was utterly inexperienced. I'd be\\n",
  "grateful if I could be your pupil.$",
]

[msg.section_0.entries.810]
text = [
  "I am so obsessed with Pokémon\\n",
  "that my wife is as mad as a hornet.$",
]

[msg.section_0.entries.811]
text = [
  "Pokémon battles are so much fun.\\n",
  "No way I can quit.$",
]

[msg.section_0.entries.812]
text = [
  "I don't want to go home, 'cause my wife\\n",
  "is as scary as a legendary Pokémon.$",
]

[msg.section_0.entries.813]
text = [
  "Our lives have plenty of ordinary days.\\n",
  "I gotta have Pokémon!$",
]

[msg.section_0.entries.814]
text = [
  "Only Pokémon rescue me\\n",
  "from boring and monotonous days.$",
]

[msg.section_0.entries.815]
text = [
  "When I look at a special person like you,\\n",
  "I just melt.$",
]

[msg.section_0.entries.816]
text = [
  "I used to be like you.\\n",
  "I was full of hopes and dreams.$",
]

[msg.section_0.entries.817]
text = [
  "Dreams are important.\\n",
  "But if all you have is your dreamworld...$",
]

[msg.section_0.entries.818]
text = [
  "Just having hopes and dreams is not enough.\\n",
  "What is important is... Never mind.$",
]

[msg.section_0.entries.819]
text = [
  "I want to have an exhilarating battle.\\n",
  "Got it?$",
]

[msg.section_0.entries.820]
text = [
  "Thank you!\\n",
  "A battle is extremely exhilarating!$",
]

[msg.section_0.entries.821]
text = [
  "OK, OK, I got it...\\n",
  "Let's call it a day.$",
]

[msg.section_0.entries.822]
text = [
  "It's OK if I have training wheels.\\n",
  "It’s OK if my Bike doesn't accelerate.$",
]

[msg.section_0.entries.823]
text = [
  "It's OK if you go your own way.\\n",
  "You'll reach your goal someday.$",
]

[msg.section_0.entries.824]
text = [
  "It's OK if you lose.\\n",
  "It's OK, as long as you have a Bicycle.$",
]

[msg.section_0.entries.825]
text = [
  "You ain't never even gonna see\\n",
  "my Pokémon's moves.$",
]

[msg.section_0.entries.826]
text = [
  "You're slow, ain't ya?$",
]

[msg.section_0.entries.827]
text = [
  "You're right quick!\\n",
  "Who are ya, anyways?$",
]

[msg.section_0.entries.828]
text = [
  "I just got married, and we'll be\\n",
  "expanding our family soon.$",
]

[msg.section_0.entries.829]
text = [
  "You know what I need.\\n",
  "Can you spare a few dollars?$",
]

[msg.section_0.entries.830]
text = [
  "Oh, I should really get home,\\n",
  "but Pokémon battles are so much fun...$",
]

[msg.section_0.entries.831]
text = [
  "Take a good look\\n",
  "at this Clerk ⑭'s sheer strength!$",
]

[msg.section_0.entries.832]
text = [
  "Keep training with the best,\\n",
  "and you'll surpass the rest!$",
]

[msg.section_0.entries.833]
text = [
  "I put on a smile when I'm crying inside.\\n",
  "That's a Clerk ⑭'s sad smile.$",
]

[msg.section_0.entries.834]
text = [
  "I will show you the harsh side\\n",
  "of Pokémon battles.$",
]

[msg.section_0.entries.835]
text = [
  "That's not good.\\n",
  "I was too generous today.$",
]

[msg.section_0.entries.836]
text = [
  "Did you burn the image of my Pokémon\\n",
  "into your mind?$",
]

[msg.section_0.entries.837]
text = [
  "Who do you think I am?\\n",
  "I am a mighty Policeman!$",
]

[msg.section_0.entries.838]
text = [
  "That's for disobeying me!\\n",
  "I am a big guy!$",
]

[msg.section_0.entries.839]
text = [
  "You won a battle against a Policeman...\\n",
  "I will arrest you someday.$",
]

[msg.section_0.entries.840]
text = [
  "It's embarrassing, but I wasn't\\n",
  "well behaved when I was young.$",
]

[msg.section_0.entries.841]
text = [
  "You lack energy despite your youth.\\n",
  "Shall I train you?$",
]

[msg.section_0.entries.842]
text = [
  "Good, good. Misbehave while you're still\\n",
  "young and you can get away with it.$",
]

[msg.section_0.entries.843]
text = [
  "Squeak! Squeak, squeak, squeak...\\n",
  "Hm? What? Wanna fight?$",
]

[msg.section_0.entries.844]
text = [
  "You're so impatient.\\n",
  "I'm still in the middle of my work.$",
]

[msg.section_0.entries.845]
text = [
  "Ohh dear... You tracked dirt\\n",
  "on the floor I just finished cleaning...$",
]

[msg.section_0.entries.846]
text = [
  "There are only two roads in life.\\n",
  "The one you like, and the one you hate.$",
]

[msg.section_0.entries.847]
text = [
  "I'll choose the road I like,\\n",
  "even though it is not the quickest route.$",
]

[msg.section_0.entries.848]
text = [
  "Actually, the road you hate\\n",
  "may be the shortcut to your goal.$",
]

[msg.section_0.entries.849]
text = [
  "I am a train.\\n",
  "I will just run on the tracks.$",
]

[msg.section_0.entries.850]
text = [
  "You are a station where I don't stop.\\n",
  "I will just pass you by.$",
]

[msg.section_0.entries.851]
text = [
  "I think the train is great, because it runs\\n",
  "the same route over and over.$",
]

[msg.section_0.entries.852]
text = [
  "You're good at your job\\n",
  "and very strong.$",
]

[msg.section_0.entries.853]
text = [
  "I expected too much from you.\\n",
  "You are lucky that this is not business.$",
]

[msg.section_0.entries.854]
text = [
  "A person who can juggle\\n",
  "work and play is pretty cool.$",
]

[msg.section_0.entries.855]
text = [
  "I've been with these Pokémon\\n",
  "since I was a child.$",
]

[msg.section_0.entries.856]
text = [
  "Pokémon are like family to me.$",
]

[msg.section_0.entries.857]
text = [
  "I don't think I want to have children.\\n",
  "I'd rather focus on my Pokémon family.$",
]

[msg.section_0.entries.858]
text = [
  "Hi, I am a physician!\\n",
  "Hey! Let me give you a shot!$",
]

[msg.section_0.entries.859]
text = [
  "Come now, let me give you a shot!\\n",
  "Don’t worry. It won't hurt!$",
]

[msg.section_0.entries.860]
text = [
  "You have strong arms!\\n",
  "So let me give you a shot now!$",
]

[msg.section_0.entries.861]
text = [
  "Cough! Cough, cough! How many\\n",
  "more people will I be able to save?$",
]

[msg.section_0.entries.862]
text = [
  "Cough! I wanted to save more people.\\n",
  "Cough, cough!$",
]

[msg.section_0.entries.863]
text = [
  "Few physicians live well...\\n",
  "Cough! I can't go on any longer...$",
]

[msg.section_0.entries.864]
text = [
  "Do you want a shot?\\n",
  "Or an IV drip?$",
]

[msg.section_0.entries.865]
text = [
  "You want both a shot and an IV.\\n",
  "You are greedy!$",
]

[msg.section_0.entries.866]
text = [
  "Argh. It's sickening!\\n",
  "You're such a drip.$",
]

[msg.section_0.entries.867]
text = [
  "In this job,\\n",
  "I've seen a lot of strange things.$",
]

[msg.section_0.entries.868]
text = [
  "I don't know why, but Ghost-type\\n",
  "Pokémon seem attracted to me.$",
]

[msg.section_0.entries.869]
text = [
  "Ahhh, I lost... By the way,\\n",
  "who is that standing behind you?$",
]

[msg.section_0.entries.870]
text = [
  "I have raised them too long.\\n",
  "They are beyond my control...$",
]

[msg.section_0.entries.871]
text = [
  "It's over...\\n",
  "Nobody can stop them...$",
]

[msg.section_0.entries.872]
text = [
  "Finally, they calmed down...\\n",
  "You saved me. Thank you!$",
]

[msg.section_0.entries.873]
text = [
  "I will test the Pokémon\\n",
  "you have been training.$",
]

[msg.section_0.entries.874]
text = [
  "Bah! Is that the best you can do?\\n",
  "I expected more from you...$",
]

[msg.section_0.entries.875]
text = [
  "Wow! You are awesome!\\n",
  "What great Pokémon you've trained!$",
]

[msg.section_0.entries.876]
text = [
  "Take a look at these Pokémon--I raised\\n",
  "'em myself. They make me right proud.$",
]

[msg.section_0.entries.877]
text = [
  "I am right proud of these Pokémon.\\n",
  "They're my friends and my treasures.$",
]

[msg.section_0.entries.878]
text = [
  "You are a strong one, sure enuff.\\n",
  "But I don't intend to lose next time!$",
]

[msg.section_0.entries.879]
text = [
  "I am the top Breeder.\\n",
  "I can tame any kind of Pokémon.$",
]

[msg.section_0.entries.880]
text = [
  "You see? My Pokémon are very loyal,\\n",
  "aren't they?$",
]

[msg.section_0.entries.881]
text = [
  "They are too attached to me.\\n",
  "They are not fit for battling.$",
]

[msg.section_0.entries.882]
text = [
  "Arghhhh! Who is gentle?!\\n",
  "I will bring you down!$",
]

[msg.section_0.entries.883]
text = [
  "Arghh! Arghh!\\n",
  "I am NOT a Gentleman!$",
]

[msg.section_0.entries.884]
text = [
  "Arghh! You! You'll regret this!\\n",
  "I will bring you down someday!$",
]

[msg.section_0.entries.885]
text = [
  "My brother told me once...\\n",
  "Eyes! Aim for the eyes!$",
]

[msg.section_0.entries.886]
text = [
  "What my brother told me was right...\\n",
  "Thanks... Bro...$",
]

[msg.section_0.entries.887]
text = [
  "I lost against a kid. Bro...\\n",
  "I should have listened to you...$",
]

[msg.section_0.entries.888]
text = [
  "I can't drop my luxurious lifestyle just\\n",
  "because I'm older. Nothing can stop it.$",
]

[msg.section_0.entries.889]
text = [
  "It may be a hard truth for a child,\\n",
  "but money makes the world go round.$",
]

[msg.section_0.entries.890]
text = [
  "I cannot drop the habits\\n",
  "I learned when I was young.$",
]

[msg.section_0.entries.891]
text = [
  "I am a late bloomer and a crazy bloomer.\\n",
  "I'll bloom and dazzle you!$",
]

[msg.section_0.entries.892]
text = [
  "Dance, bloom, and blossom!\\n",
  "A woman who flowers and triumphs!$",
]

[msg.section_0.entries.893]
text = [
  "I want to blossom and fall\\n",
  "rather than dying on the vine.$",
]

[msg.section_0.entries.894]
text = [
  "Hey, it's me. It's me!\\n",
  "I am the best Pilot in the world!$",
]

[msg.section_0.entries.895]
text = [
  "No! That's no good!\\n",
  "You cannot reach the top that way.$",
]

[msg.section_0.entries.896]
text = [
  "Good. You're daring!\\n",
  "I'll let you come fly on my plane.$",
]

[msg.section_0.entries.897]
text = [
  "Hey! Yo! It's me.\\n",
  "I am the best Pilot in the world.$",
]

[msg.section_0.entries.898]
text = [
  "Listen! A Trainer should be No. 1.\\n",
  "That's it!$",
]

[msg.section_0.entries.899]
text = [
  "You're quite a Trainer!\\n",
  "Be my apprentice!$",
]


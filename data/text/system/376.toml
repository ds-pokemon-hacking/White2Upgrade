[msg.section_0.entries.918]
text = [
  "Thank you for riding\\n",
  "the Battle Subway today.\\l\\n",
  "I am the Subway Boss Ingo.\\c\\n",
  "I will choose the next destination\\n",
  "based on your talent.\\c\\n",
  "Do you understand Pokémon well?\\n",
  "Can you hold on to your principle?\\l\\n",
  "Will you go on to victory or defeat?\\c\\n",
  "All aboard!$",
]

[msg.section_0.entries.919]
text = [
  "Ah. Your battle was not bad at all.\\c\\n",
  "However, we seem to have done slightly\\n",
  "better than you.\\c\\n",
  "We would really like to battle with you again!\\c\\n",
  "Please ride the Battle Subway again!$",
]

[msg.section_0.entries.920]
text = [
  "Bravo!!\\c\\n",
  "Your talent has brought you\\n",
  "to the destination called Victory!\\c\\n",
  "However, your journey has just started.\\c\\n",
  "When you choose your next destination,\\n",
  "go full speed ahead!$",
]

[msg.section_0.entries.921]
text = [
  "Welcome! I've been waiting for you!\\c\\n",
  "Let me introduce myself...\\n",
  "I am the Subway Boss Ingo.\\c\\n",
  "What can I see after winning,\\n",
  "winning, and winning?\\c\\n",
  "Where is my destination?\\c\\n",
  "I've kept thinking, and\\n",
  "I've learned one thing.\\c\\n",
  "That is, you cannot know what happens\\n",
  "after winning without winning.\\c\\n",
  "Therefore, I will exert every possible\\n",
  "effort to battle with you.\\c\\n",
  "All aboard!$",
]

[msg.section_0.entries.922]
text = [
  "I have won this time, but\\n",
  "your talent is very strong!\\c\\n",
  "Your tactics...reading...\\n",
  "You have great skills.\\c\\n",
  "That's right! I would like to\\n",
  "battle you again and again!\\c\\n",
  "Please ride the Battle Subway again soon!$",
]

[msg.section_0.entries.923]
text = [
  "Bravo!\\n",
  "Excellent!!\\c\\n",
  "I am glad that I fought so hard\\n",
  "against a wonderful Trainer like you.\\c\\n",
  "That's right!\\n",
  "You grow stronger by matching yourself\\l\\n",
  "against a strong opponent.\\c\\n",
  "Please do your best and run\\n",
  "toward the destination--\\l\\n",
  "an even higher state.$",
]

[msg.section_0.entries.924]
text = [
  "I am Emmet.\\c\\n",
  "I am a Subway Boss.\\c\\n",
  "I like Double Battles.\\c\\n",
  "I like combinations of\\n",
  "two Pokémon.\\c\\n",
  "And I like winning\\n",
  "more than anything else.\\c\\n",
  "So let's start a great battle\\n",
  "in which every Pokémon uses\\l\\n",
  "various moves.$",
]

[msg.section_0.entries.925]
text = [
  "I am Emmet.\\c\\n",
  "I won against you.\\c\\n",
  "But I think I just got lucky.\\c\\n",
  "In a Double Battle, if you misread one thing,\\n",
  "the rest will be totally different.\\c\\n",
  "You know.\\n",
  "Please win 20 battles in a row, and\\l\\n",
  "fight with me!$",
]

[msg.section_0.entries.926]
text = [
  "I am Emmet.\\c\\n",
  "I lost against you.\\c\\n",
  "Because you are the strongest Trainer\\n",
  "I've fought lately.\\l\\n",
  "You're a verrrrry strong Trainer!\\c\\n",
  "Yup! It was fun!\\n",
  "Ride the trains some more!$",
]

[msg.section_0.entries.927]
text = [
  "Hi, do you remember me?\\n",
  "I am Emmet.\\c\\n",
  "I am a Subway Boss.\\c\\n",
  "I like Double Battles.\\c\\n",
  "I like combinations of\\n",
  "two Pokémon.\\c\\n",
  "And I like winning\\n",
  "more than anything else.\\c\\n",
  "This time, I am really serious.\\n",
  "Really serious.\\c\\n",
  "Because if a battle is not serious,\\n",
  "it is not fun.$",
]

[msg.section_0.entries.928]
text = [
  "I am Emmet.\\c\\n",
  "I won against you.\\n",
  "But this is not the end.\\c\\n",
  "I am sure you will show up\\n",
  "here again.\\c\\n",
  "I will wait for it and\\n",
  "win against you again.\\c\\n",
  "Because I am a\\n",
  "Subway Boss. I am Emmet.$",
]

[msg.section_0.entries.929]
text = [
  "I am Emmet.\\c\\n",
  "I am a Subway Boss,\\n",
  "but I lost against you again.\\c\\n",
  "But I feel good.\\n",
  "Because it was very fun!\\c\\n",
  "You want to win, and\\n",
  "I don't want to lose.\\l\\n",
  "That's real.\\c\\n",
  "When we clash in battles,\\n",
  "I feel very excited!$",
]

[msg.section_0.entries.930]
text = [
  "I am a Subway Boss, Ingo.\\c\\n",
  "The fellow over to the side is\\n",
  "also a Subway Boss, Emmet.\\c\\n",
  "Will a Multi Battle help us cover\\n",
  "each other's weakness?\\c\\n",
  "Or will you show your\\n",
  "overwhelming power?\\c\\n",
  "I look forward to seeing\\n",
  "how well you fight.\\c\\n",
  "However, it is difficult to win\\n",
  "unless you and your partner\\l\\n",
  "are in total sync.$",
]

[msg.section_0.entries.931]
text = [
  "We make a good two-car train,\\n",
  "Ingo and Emmet.\\c\\n",
  "This time, we worked together toward\\n",
  "a victory.\\c\\n",
  "However, your abilities are\\n",
  "very impressive.$",
]

[msg.section_0.entries.932]
text = [
  "Bravo!!\\c\\n",
  "What you showed us is\\n",
  "a spark as Trainers.\\c\\n",
  "However, let me say just one thing.\\c\\n",
  "Winning against us is a milestone\\n",
  "in your life.\\c\\n",
  "You can rack up more and more.\\c\\n",
  "Please move on toward an even\\n",
  "greater goal!$",
]

[msg.section_0.entries.933]
text = [
  "Follow the rules.\\n",
  "Safe driving!\\c\\n",
  "Follow the schedule.\\n",
  "Everybody smile!\\c\\n",
  "Check safety.\\n",
  "Everything's ready!\\c\\n",
  "Aim for victory!\\n",
  "All aboard!$",
]

[msg.section_0.entries.934]
text = [
  "I am Emmet.\\c\\n",
  "I won together with Ingo.\\c\\n",
  "But if we fight again,\\n",
  "we won't know what to expect.\\c\\n",
  "That's why we are waiting\\n",
  "for you to come back!$",
]

[msg.section_0.entries.935]
text = [
  "I am Emmet.\\c\\n",
  "I lost together with Ingo.\\c\\n",
  "Your combination is\\n",
  "the best--perfect!\\l\\n",
  "You're verrrrry strong Trainers.\\c\\n",
  "Yup! It was so much fun!$",
]

[msg.section_0.entries.936]
text = [
  "Let me introduce myself again.\\n",
  "I am a Subway Boss, Ingo!\\c\\n",
  "Well, there is nothing else to say\\n",
  "for the person who comes\\l\\n",
  "all the way here.\\c\\n",
  "Let's have the greatest battle,\\n",
  "better than ever before.$",
]

[msg.section_0.entries.937]
text = [
  "We, Ingo and Emmet, are a\\n",
  "two-car train.\\c\\n",
  "This time, we were able to work toward\\n",
  "a victory.\\c\\n",
  "Well, will you stop here?\\n",
  "Or will you challenge us again?\\c\\n",
  "It's up to you.\\n",
  "But let me say one thing.\\c\\n",
  "There is no terminal called End\\n",
  "in your life!$",
]

[msg.section_0.entries.938]
text = [
  "Bravo!!\\n",
  "Really excellent!\\c\\n",
  "The best combination of\\n",
  "you and your Pokémon.\\l\\n",
  "It is incredible!\\c\\n",
  "When you and someone else combine,\\n",
  "your engine powers something special!\\c\\n",
  "If you like, please challenge us\\n",
  "with a different combination.$",
]

[msg.section_0.entries.939]
text = [
  "What I do. What I say.\\n",
  "Always the same.\\c\\n",
  "Follow the rules.\\n",
  "Safe driving!\\c\\n",
  "Follow the schedules.\\n",
  "Everyone smile!\\c\\n",
  "Check safety.\\n",
  "Everything's ready!\\c\\n",
  "Aim for victory!\\n",
  "All aboard!$",
]

[msg.section_0.entries.940]
text = [
  "I am Emmet.\\c\\n",
  "We won, but\\n",
  "I am not really satisfied.\\c\\n",
  "I can tell that you won't give up.\\n",
  "Because you will be much, much stronger.\\c\\n",
  "That's why we are waiting\\n",
  "for you to come back!$",
]

[msg.section_0.entries.941]
text = [
  "I am Emmet.\\c\\n",
  "We lost against you again.\\c\\n",
  "But I am satisfied.\\n",
  "You are too strong!\\c\\n",
  "The strength you have,\\n",
  "your trust in your Pokémon,\\l\\n",
  "their never-ending support!\\c\\n",
  "Yep! It was the most fun battle ever!\\n",
  "Please come back soon!$",
]

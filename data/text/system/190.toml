[msg]
trailing_data = "e2e2"

[msg.section_0.entries.0]
text = [
  "Movie Star$",
]

[msg.section_0.entries.1]
text = [
  "World Police$",
]

[msg.section_0.entries.2]
text = [
  "The [VAR PKNICK(0)] Ninja: Hmph!\\n",
  "Try it!$",
]

[msg.section_0.entries.3]
text = [
  "Mecha Cop: Uh... What...?\\n",
  "I can't move...$",
]

[msg.section_0.entries.4]
text = [
  "Mecha Cop: My body is creaking...\\n",
  "This is not good... I have to do something...$",
]

[msg.section_0.entries.5]
text = [
  "Mecha Cop: The serial robber,\\n",
  "the [VAR PKNICK(0)] Ninja.\\l\\n",
  "Surrender!$",
]

[msg.section_0.entries.6]
text = [
  "The [VAR PKNICK(0)] Ninja: Mecha Cop!\\n",
  "You've completely fallen for my trap!$",
]

[msg.section_0.entries.7]
text = [
  "Mecha Cop: What do you mean?!\\n",
  "[VAR PKNICK(0)] Ninja!$",
]

[msg.section_0.entries.8]
text = [
  "The [VAR PKNICK(0)] Ninja: I'm not interested in\\n",
  "the Rainbow Pearl at all!\\c\\n",
  "The tip that I gave you, the one where\\n",
  "I said that I would steal the pearl,\\l\\n",
  "was a trap to lure you to come here!$",
]

[msg.section_0.entries.9]
text = [
  "Mecha Cop: You...\\n",
  "You tricked me!\\c\\n",
  "Du mieser Verbrecher!$",
]

[msg.section_0.entries.10]
text = [
  "The [VAR PKNICK(0)] Ninja: Tee hee hee...\\n",
  "The sand of this beach\\l\\n",
  "is magnetized and\\l\\n",
  "makes mechanics malfunction!\\c\\n",
  "On top of that, a salty breeze is blowing!\\n",
  "I look forward to your cyborg body\\l\\n",
  "getting rusty!$",
]

[msg.section_0.entries.11]
text = [
  "Mecha Cop: In that case...\\n",
  "I just have to arrest you again\\l\\n",
  "before this body gets rusty!$",
]

[msg.section_0.entries.12]
text = [
  "Mecha Cop: Wh-what?\\n",
  "Why does Sawk have a Toxic Orb?\\l\\n",
  "You! I won't forgive you!\\c\\n",
  "Alloy Net!\\n",
  "Apunten, ¡fuego!$",
]

[msg.section_0.entries.13]
text = [
  "The [VAR PKNICK(0)] Ninja: Tee hee hee!\\n",
  "I swapped items while you were\\l\\n",
  "not watching.\\l\\n",
  "Whoa!\\c\\n",
  "You...used a weapon again...$",
]

[msg.section_0.entries.14]
text = [
  "Mecha Cop: Argh...\\n",
  "I'm disappointed in myself.\\c\\n",
  "I got upset, and without thinking,\\n",
  "I used...$",
]

[msg.section_0.entries.15]
text = [
  "The [VAR PKNICK(0)] Ninja: Huff... Puff...\\c\\n",
  "Tee hee hee. You're panicking!\\n",
  "Are you having a hard time? Mecha Cop!\\l\\n",
  "Give up before it's too late.\\c\\n",
  "Surrender!\\n",
  "...Right? Tee hee hee...$",
]

[msg.section_0.entries.16]
text = [
  "Mecha Cop: My justice is unshakable,\\n",
  "no matter what the circumstances.\\c\\n",
  "Prépare-toi!$",
]

[msg.section_0.entries.17]
text = [
  "The [VAR PKNICK(0)] Ninja: Stop bluffing!$",
]

[msg.section_0.entries.18]
text = [
  "Mecha Cop: It's a model answer\\n",
  "for villains.\\c\\n",
  "It's worth defeating you!$",
]

[msg.section_0.entries.19]
text = [
  "The [VAR PKNICK(0)] Ninja: Cool!$",
]

[msg.section_0.entries.20]
text = [
  "Mecha Cop: If you have an impulse\\n",
  "to admire justice,\\l\\n",
  "surrender without resistance!$",
]

[msg.section_0.entries.21]
text = [
  "The [VAR PKNICK(0)] Ninja: Eeeek!\\n",
  "I thought the strategy this time\\l\\n",
  "was perfect...\\c\\n",
  "Arghh!\\n",
  "This...scrap!$",
]

[msg.section_0.entries.22]
text = [
  "Mecha Cop: [VAR PKNICK(0)] Ninja,\\n",
  "you're underestimating justice!$",
]

[msg.section_0.entries.23]
text = [
  "The [VAR PKNICK(0)] Ninja: Tsk!$",
]

[msg.section_0.entries.24]
text = [
  "Mecha Cop: To protect law and justice,\\n",
  "I could be infinitely cruel!\\l\\n",
  "That's the real World Police!\\c\\n",
  "Mission accomplie.$",
]

[msg.section_0.entries.25]
text = [
  "The vengeful one, the [VAR PKNICK(0)] Ninja,\\n",
  "was put in jail once again\\l\\n",
  "at the hands of Mecha Cop.\\c\\n",
  "As long as there is justice in this world,\\n",
  "evil will never prosper!\\c\\n",
  "Investigate special cases, Mecha Cop!\\n",
  "The absolutely invincible World Police!$",
]

[msg.section_0.entries.26]
text = [
  "Mecha Cop: Ugh...\\n",
  "I'm disappointed in myself...$",
]

[msg.section_0.entries.27]
text = [
  "The [VAR PKNICK(0)] Ninja: At last,\\n",
  "I beat Mecha Cop!\\c\\n",
  "Now I can steal as many treasures\\n",
  "as I want!$",
]

[msg.section_0.entries.28]
text = [
  "Mecha Cop: Wait!\\n",
  "[VAR PKNICK(0)] Ninja!\\c\\n",
  "Next time... Next time\\n",
  "I'll put you in jail for sure!$",
]

[msg.section_0.entries.29]
text = [
  "The [VAR PKNICK(0)] Ninja: Hmph!\\n",
  "Catch me if you can!\\c\\n",
  "Come! Come here!$",
]

[msg.section_0.entries.30]
text = [
  "Mecha Cop: You little!\\n",
  "Waaait!$",
]

[msg.section_0.entries.31]
text = [
  "Mecha Cop couldn't catch\\n",
  "the [VAR PKNICK(0)] Ninja this time.\\c\\n",
  "He's been acting strange ever since he met\\n",
  "the [VAR PKNICK(0)] Ninja...\\c\\n",
  "Mecha Cop, what's wrong?\\n",
  "Does he look like he's enjoying it a bit?$",
]

[msg.section_0.entries.32]
text = [
  "Mecha Cop: Wh-what is this...?$",
]

[msg.section_0.entries.33]
text = [
  "The [VAR PKNICK(0)] Ninja: Tee hee!\\n",
  "How do you feel, Mecha Cop?!\\c\\n",
  "Your body's gotten rusty, and\\n",
  "you don't seem to be able to move.$",
]

[msg.section_0.entries.34]
text = [
  "Mecha Cop: Uh...\\n",
  "In this case...\\l\\n",
  "Final Police Solution 2.0...\\c\\n",
  "Fire!\\n",
  "Justice explosion!$",
]

[msg.section_0.entries.35]
text = [
  "The [VAR PKNICK(0)] Ninja: What?\\n",
  "Are you trying to beat me even if\\l\\n",
  "it means sacrificing yourself...?!$",
]

[msg.section_0.entries.36]
text = [
  "Mecha Cop: I...won't...tolerate...evil...$",
]

[msg.section_0.entries.37]
text = [
  "The [VAR PKNICK(0)] Ninja: Gulp...\\n",
  "He's unconscious but still standing...\\c\\n",
  "What tenacity!$",
]

[msg.section_0.entries.38]
text = [
  "Until the last second before\\n",
  "his functions shut down,\\l\\n",
  "the secret detective, Mecha Cop,\\l\\n",
  "hated evil as much as he loved justice.\\c\\n",
  "Know this!\\n",
  "As long as there is evil in this world,\\l\\n",
  "justice will rise again!\\c\\n",
  "Come back, Mecha Cop!\\n",
  "The cyborg body is unbreakable!$",
]

[msg.section_0.entries.39]
text = [
  "Mecha Cop: Uh...\\n",
  "My justice\\l\\n",
  "is not enough...?!$",
]

[msg.section_0.entries.40]
text = [
  "The [VAR PKNICK(0)] Ninja: Hmph!\\n",
  "You can't even catch one thief like me,\\l\\n",
  "and you're claiming that\\l\\n",
  "you're a champion of justice?\\c\\n",
  "I was a fool to have believed you--\\n",
  "even a little bit.$",
]

[msg.section_0.entries.41]
text = [
  "Mecha Cop: I...\\n",
  "Was I abandoned by justice?\\c\\n",
  "I don't know what to believe anymore!$",
]

[msg.section_0.entries.42]
text = [
  "The secret detective, Mecha Cop,\\n",
  "lost his belief in justice after\\l\\n",
  "failing in the mission.\\l\\n",
  "He left the World Police...and...\\l\\n",
  "Several months later...\\c\\n",
  "The biggest enemy of the World Police\\n",
  "was the very same Mecha Cop--\\l\\n",
  "lost to the side of evil!\\c\\n",
  "Get it together, Mecha Cop!\\n",
  "Everybody makes mistakes!$",
]

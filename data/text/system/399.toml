[msg.section_0.entries.176]
text = [
  "Spin Trades are so much fun!$",
]

[msg.section_0.entries.177]
text = [
  "We're doing Spin Trades!$",
]

[msg.section_0.entries.178]
text = [
  "There!\\n",
  "Stop there!$",
]

[msg.section_0.entries.179]
text = [
  "Wah!\\n",
  "It moved again!$",
]

[msg.section_0.entries.180]
text = [
  "My Egg's awesome!$",
]

[msg.section_0.entries.181]
text = [
  "There goes the Egg I wanted...$",
]

[msg.section_0.entries.182]
text = [
  "Yes!\\n",
  "I got the Egg I wanted!$",
]

[msg.section_0.entries.183]
text = [
  "If it stopped there,\\n",
  "I would've gotten a Berry.$",
]

[msg.section_0.entries.184]
text = [
  "Welcome to the Union Room.\\c\\n",
  "If there is anything you need help with,\\n",
  "please let me know!\\c$",
]

[msg.section_0.entries.185]
text = [
  "                     $$",
]

[msg.section_0.entries.186]
text = [
  "Which topic would you\\n",
  "like me to explain?$",
]

[msg.section_0.entries.187]
text = [
  "There are five Battle Formats.\\c\\n",
  "Single Battle is for two Trainers\\n",
  "with one or more Pokémon each.\\c\\n",
  "Each Trainer can have one Pokémon\\n",
  "in battle at a time.\\c\\n",
  "Double Battle is for two Trainers\\n",
  "with two or more Pokémon each.\\c\\n",
  "Each Trainer will send out two\\n",
  "Pokémon to battle at a time.\\c\\n",
  "Triple Battle is for two Trainers\\n",
  "with three or more Pokémon each.\\c\\n",
  "Each Trainer puts three Pokémon\\n",
  "into battle at one time.\\c\\n",
  "Rotation Battle is for two Trainers.\\n",
  "Each Trainer sends three Pokémon\\l\\n",
  "into battle, with one Pokémon in front\\l\\n",
  "and the other two in back.\\c\\n",
  "Multi Battle is for four Trainers\\n",
  "with one or more Pokémon each.\\c\\n",
  "Each Trainer can have one Pokémon\\n",
  "in battle at a time.\\c$",
]

[msg.section_0.entries.188]
text = [
  "You may trade your Pokémon with\\n",
  "other players.\\c\\n",
  "Meeting new people could be a\\n",
  "shortcut to meeting rare Pokémon!\\c$",
]

[msg.section_0.entries.189]
text = [
  "                                                                                                                                                   $$",
]

[msg.section_0.entries.190]
text = [
  "In a Spin Trade, each participant brings\\n",
  "an Egg to trade with others.\\c\\n",
  "Which Egg will you end up with?\\n",
  "What kind of Pokémon is in that Egg?\\l\\n",
  "It's quite exciting and fun!\\c\\n",
  "Up to five players can take part,\\n",
  "so try it with your friends!\\c$",
]

[msg.section_0.entries.191]
text = [
  "You may get together with others\\n",
  "and draw.\\c\\n",
  "You all work on one sheet\\n",
  "of paper at the same time.\\c\\n",
  "I'm sure a drawing made by friends\\n",
  "will be a memorable masterpiece!\\c\\n",
  "Up to five players can take part,\\n",
  "so try it with your friends!\\c$",
]

[msg.section_0.entries.192]
text = [
  "You can chat with other people\\n",
  "by selecting “CHAT\\\" in the menu.\\c\\n",
  "Go out and meet other players in\\n",
  "the Union Room!\\c\\n",
  "Let people know what you're like\\n",
  "and what you'd like to do.\\c\\n",
  "Mingle, chat, and add to your\\n",
  "circle of friends!\\c$",
]


[msg]
trailing_data = "e2e2"

[msg.section_0.entries.0]
text = [
  "I feel that if it's with you, this battle\\n",
  "won't be a simple competition\\l\\n",
  "but a battle where I can ponder\\l\\n",
  "the relationship between\\l\\n",
  "Pokémon and their Trainers.\\c$",
]

[msg.section_0.entries.1]
text = [
  "Do you want to show how strong you\\n",
  "are by winning, or do you want to\\l\\n",
  "learn what battling really means?\\c\\n",
  "Pokémon battles have no meaning if\\n",
  "you don't think about why you battle.\\c\\n",
  "Or better said, it makes battling\\n",
  "together with Pokémon meaningless.\\c$",
]

[msg.section_0.entries.2]
text = [
  "Even if hurt, my Pokémon will fight\\n",
  "for me with just one command.\\c\\n",
  "I think you'll value and trust\\n",
  "your Pokémon more if you keep\\l\\n",
  "that fact close to your heart.\\c\\n",
  "What can I do for these Pokémon?\\n",
  "What should I do?\\c\\n",
  "That's right! I battle with everything\\n",
  "I have to find the ideal relationship\\l\\n",
  "between Pokémon and people!\\c$",
]

[msg.section_0.entries.3]
text = [
  "Thank you!\\c\\n",
  "I feel like I saw a little of\\n",
  "the way toward my ideals.\\c$",
]

[msg.section_0.entries.4]
text = [
  "Even when you lose, your Pokémon\\n",
  "are still brimming with fighting spirit.\\c$",
]

[msg.section_0.entries.5]
text = [
  "Cheren: I'll keep battling many Trainers\\n",
  "and Pokémon like this, and if I can\\l\\n",
  "learn what kind of person I am, it will\\l\\n",
  "open up my path.\\c\\n",
  "I'm sure this path will lead me to become\\n",
  "the person I'm meant to be.\\c\\n",
  "Pokémon will always be with you and me as\\n",
  "we go down our own paths.\\c\\n",
  "Our important friends, Pokémon...\\c$",
]

[msg.section_0.entries.6]
text = [
  "Cheren: Pokémon are by all of our sides--\\n",
  "mine, yours, and each and\\l\\n",
  "every Trainer's!\\c\\n",
  "That's why we move forward!\\n",
  "The Pokémon walking alongside us\\l\\n",
  "give us the strength to do so!\\c$",
]

[msg.section_0.entries.7]
text = [
  "In this corner, the young Pokémon\\n",
  "Trainer battling for his ideals, Cheren!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Get ready! I'm gonna knock\\n",
  "some sense outta ya!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Fight with this Pokémon this way...\\n",
  "Use this item that way...\\l\\n",
  "Are you letting others decide that\\l\\n",
  "for you?\\c\\n",
  "Well, whatever, but what's important\\n",
  "is figuring out what you want to do!\\c\\n",
  "Get ready! 'Cause I'm going to knock\\n",
  "the common sense outta you and drag\\l\\n",
  "you into a brand new world!\\c$",
]

[msg.section_0.entries.10]
text = [
  "You don't do anything!\\n",
  "What do you know?!\\c\\n",
  "You don't do anything!\\n",
  "How're you gonna change?!\\c\\n",
  "But, I've got you covered!\\n",
  "I'm gonna give your reason a\\l\\n",
  "toxic shock and open up your mind!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Wild!\\c\\n",
  "Your reason's already\\n",
  "more toxic than mine!$",
]

[msg.section_0.entries.12]
text = [
  "Hey, c'mon! Get serious!\\n",
  "You gotta put more out there!\\c$",
]

[msg.section_0.entries.13]
text = [
  "Roxie: You didn't win... I lost!\\c\\n",
  "I was weak and made my Pokémon\\n",
  "feel how much losing stinks!\\c\\n",
  "Watch out! Next time we meet,\\n",
  "I'm going to give you a toxic shock!\\c$",
]

[msg.section_0.entries.14]
text = [
  "Roxie: Ya can't win 'em all.\\n",
  "It's impossible, seriously!\\c\\n",
  "Trying to look cool every\\n",
  "time you mess up or fail\\l\\n",
  "is totally exhausting!\\c\\n",
  "So you just have to\\n",
  "let it all hang out!\\c$",
]

[msg.section_0.entries.15]
text = [
  "Toxic music and toxic words!\\n",
  "Show 'em what you've got, Roxie!\\c$",
]

[msg.section_0.entries.16]
text = [
  "Thanks again for your help.\\c\\n",
  "My Bug-type Pokémon are scurrying with\\n",
  "excitement about getting to battle you.\\l\\n",
  "Let's get straight to it!\\c$",
]

[msg.section_0.entries.17]
text = [
  "If the battle brings out the beauty in\\n",
  "Bug-type Pokémon, it will be a scene that\\l\\n",
  "makes my heart flutter, win or lose.\\c\\n",
  "My bug Pokémon are abuzz\\n",
  "with anticipation.\\c\\n",
  "Let's get straight to it!\\c$",
]

[msg.section_0.entries.18]
text = [
  "M'hm...\\c\\n",
  "If I win this battle,\\n",
  "I feel like I can draw a\\l\\n",
  "picture unlike any before it.\\c\\n",
  "OK! I can hear my battle\\n",
  "muse loud and clear.\\c\\n",
  "Let's get straight to it!\\c$",
]

[msg.section_0.entries.19]
text = [
  "Is it over?\\n",
  "Has my muse abandoned me?\\c$",
]

[msg.section_0.entries.20]
text = [
  "Wow...\\n",
  "It's beautiful somehow, isn't it...\\c$",
]

[msg.section_0.entries.21]
text = [
  "Burgh: Aww...\\n",
  "I lost.\\c\\n",
  "Whatever! Losing to you doesn't bug me,\\n",
  "because you are a-MAZ-ingly strong!\\c$",
]

[msg.section_0.entries.22]
text = [
  "Burgh: Sometimes I hear people\\n",
  "say something was an ugly win,\\l\\n",
  "but I think if you're trying your best,\\l\\n",
  "any win is beautiful.\\c$",
]

[msg.section_0.entries.23]
text = [
  "The premier insect artist!\\n",
  "Burgh, your canvas is here!\\c$",
]

[msg.section_0.entries.24]
text = [
  "My beloved Pokémon are going\\n",
  "to make your head spin!\\c$",
]

[msg.section_0.entries.25]
text = [
  "I am me, and Pokémon are Pokémon!\\c\\n",
  "I feel that strongly when I\\n",
  "battle with Pokémon moves,\\l\\n",
  "and that's why I do it.\\c\\n",
  "Now, my beloved Pokémon are\\n",
  "going to make your head spin!\\c$",
]

[msg.section_0.entries.26]
text = [
  "C'est fini!\\c\\n",
  "When I'm certain of that, I feel an\\n",
  "electric jolt run through my body!\\c\\n",
  "I want to feel that sensation, so\\n",
  "now my beloved Pokémon are\\l\\n",
  "going to make your head spin!\\c$",
]

[msg.section_0.entries.27]
text = [
  "I meant to make your head spin,\\n",
  "but you shocked me instead.$",
]

[msg.section_0.entries.28]
text = [
  "That was unsatisfying somehow...\\n",
  "Will you give it your all next time?\\c$",
]

[msg.section_0.entries.29]
text = [
  "Elesa: My, oh my...\\n",
  "You have a sweet fighting style.\\c$",
]

[msg.section_0.entries.30]
text = [
  "Elesa: You're a shining\\n",
  "star of a Trainer, but\\l\\n",
  "my Pokémon shone brighter!\\c$",
]

[msg.section_0.entries.31]
text = [
  "The shining beauty, the sparkling\\n",
  "bolt of electricity, Elesa!\\c$",
]

[msg.section_0.entries.32]
text = [
  "Yer tougher than ya were when\\n",
  "I gave ya that Gym Badge, right?\\c\\n",
  "Well, how 'bout we have ourselves\\n",
  "a look and see what ya can do now.\\c$",
]

[msg.section_0.entries.33]
text = [
  "How much stronger ya get comes\\n",
  "from how much you want to win!\\c\\n",
  "Always be loyal to that desire,\\n",
  "ya hear?\\c$",
]

[msg.section_0.entries.34]
text = [
  "If ya want ta win,\\n",
  "don't make excuses! Got it?\\c\\n",
  "If yer gonna bellyache,\\n",
  "just forget 'bout fightin'!\\c\\n",
  "Well, I might be fussin' 'bout\\n",
  "nothing when it comes to you.\\c$",
]

[msg.section_0.entries.35]
text = [
  "Well, I've had enough... And just so you\\n",
  "know, I didn't go easy on you.$",
]

[msg.section_0.entries.36]
text = [
  "It's simple, hear!\\n",
  "I wanted to win more than ya did!\\c$",
]

[msg.section_0.entries.37]
text = [
  "Clay: Fer such a young 'un,\\n",
  "ya have an imposin' battle style.\\c\\n",
  "I wonder what kind a journey ya\\n",
  "had that made ya so strong.\\c\\n",
  "But, I still don't like losin'!\\c$",
]

[msg.section_0.entries.38]
text = [
  "Clay: What's important is\\n",
  "how ya react to losin'.\\c\\n",
  "That's why folks who use losin'\\n",
  "as fuel to get better are tough.\\c$",
]

[msg.section_0.entries.39]
text = [
  "The underground boss, Clay!\\n",
  "Rising from the depths of the soil!\\c$",
]

[msg.section_0.entries.40]
text = [
  "Why don't you and I have some fun?\\c$",
]

[msg.section_0.entries.41]
text = [
  "What I like is having fun!\\c\\n",
  "I love doing things like flying\\n",
  "in the sky with Pokémon\\l\\n",
  "and bringing out their best!\\c\\n",
  "So, how about you and I\\n",
  "have some fun?\\c$",
]

[msg.section_0.entries.42]
text = [
  "It's finally time for a showdown!\\c\\n",
  "That means the Pokémon battle\\n",
  "that decides who's at the top, right?\\c\\n",
  "I love being on the summit!\\n",
  "'Cause you can see forever\\l\\n",
  "and ever from high places!\\c\\n",
  "So, how about you and I\\n",
  "have some fun?\\c$",
]

[msg.section_0.entries.43]
text = [
  "Being your opponent in battle is a new\\n",
  "source of strength to me. Thank you!$",
]

[msg.section_0.entries.44]
text = [
  "Win or lose, you always gain\\n",
  "something from a battle, right?\\c$",
]

[msg.section_0.entries.45]
text = [
  "Skyla: You're a pretty amazing\\n",
  "Pokémon Trainer, aren't you?\\c\\n",
  "My Pokémon and I are happy,\\n",
  "because for the first time in a while,\\l\\n",
  "we could fight with our full strength.\\c$",
]

[msg.section_0.entries.46]
text = [
  "Skyla: I'm sure I'd have a great\\n",
  "time if I could battle Winona,\\l\\n",
  "the Hoenn Gym Leader, up in the air!\\c$",
]

[msg.section_0.entries.47]
text = [
  "The high-flying girl, Skyla!\\n",
  "Send 'em flying with your fabulous moves!\\c$",
]

[msg.section_0.entries.48]
text = [
  "What I want to find is a young Trainer\\n",
  "who can show me a bright future.\\c$",
]

[msg.section_0.entries.49]
text = [
  "Thinking about aging is thinking\\n",
  "about the time you have left.\\c\\n",
  "Now, since there are\\n",
  "fewer things I can do,\\c\\n",
  "what I want to find is a young Trainer\\n",
  "who can show me a bright future.\\c$",
]

[msg.section_0.entries.50]
text = [
  "What I want to find is a young Trainer\\n",
  "who can show me a bright future.\\c\\n",
  "Let's battle with everything we have:\\n",
  "your skill, my experience, and the love\\l\\n",
  "we've raised our Pokémon with!\\c$",
]

[msg.section_0.entries.51]
text = [
  "This intense feeling that floods\\n",
  "me after a defeat...\\l\\n",
  "I don't know how to describe it.$",
]

[msg.section_0.entries.52]
text = [
  "Harrumph! I know your ability is greater\\n",
  "than that!\\c$",
]

[msg.section_0.entries.53]
text = [
  "Drayden: Wonderful.\\c\\n",
  "I'm grateful we had a chance to meet\\n",
  "and battle.\\c\\n",
  "Make a bright future--not just for\\n",
  "yourself, but for others as well.\\c$",
]

[msg.section_0.entries.54]
text = [
  "Drayden: How unsatisfying!\\c\\n",
  "Promise me that we'll see\\n",
  "each other here once again!\\c$",
]

[msg.section_0.entries.55]
text = [
  "The Spartan mayor, Drayden!\\n",
  "Stalwart and strong!\\c$",
]

[msg.section_0.entries.56]
text = [
  "You look strong!\\n",
  "Shoots! Let's start!\\c$",
]

[msg.section_0.entries.57]
text = [
  "I'm strong like the ocean's wide.\\n",
  "You're gonna get swept away, fo' sho'.\\c\\n",
  "Eh, that's enough talk! I'll prove it!\\n",
  "Let's get started, 'K?\\c$",
]

[msg.section_0.entries.58]
text = [
  "Oh ho, so I'm facing you!\\n",
  "That's off the wall.\\c\\n",
  "How 'bout you and I make some waves\\n",
  "and sweep the audience away?\\l\\n",
  "Let's leave 'em with even bigger smiles!\\c$",
]

[msg.section_0.entries.59]
text = [
  "You're strong as a gnarly wave\\n",
  "and as nice as a glassy sea.\\c$",
]

[msg.section_0.entries.60]
text = [
  "You're tough, but it's not\\n",
  "enough to sway the sea, 'K!\\c$",
]

[msg.section_0.entries.61]
text = [
  "Marlon: You don't just look\\n",
  "strong--you're strong fo' reals!\\c\\n",
  "Eh, I was swept away, too!\\c$",
]

[msg.section_0.entries.62]
text = [
  "Marlon: The tide comes in an' out,\\n",
  "and in life you win and lose!\\l\\n",
  "What's important is that it keeps goin'.\\c$",
]

[msg.section_0.entries.63]
text = [
  "Sun shines on this man of the sea!\\n",
  "Marlon, take everything that comes!\\c$",
]

[msg.section_0.entries.64]
text = [
  "A Pokémon battle with you!\\n",
  "I feel really excited!\\c$",
]

[msg.section_0.entries.65]
text = [
  "When I delivered the Pokémon\\n",
  "to you in Aspertia City,\\l\\n",
  "I never would've imagined then\\l\\n",
  "I'd be battling with you here!\\c\\n",
  "That's right! Pokémon bring us\\n",
  "together like this, don't they?!\\l\\n",
  "Isn't it a-MAZ-ing?\\c$",
]

[msg.section_0.entries.66]
text = [
  "Know what?\\c\\n",
  "When I traveled the Unova region,\\n",
  "so many things happened to me, but\\l\\n",
  "I'm so glad I went on that journey!\\c\\n",
  "I met a lot of Pokémon and\\n",
  "found what I really wanted to do...\\c\\n",
  "It's hard to put into words, but\\n",
  "I want to express this feeling\\l\\n",
  "through my Pokémon.\\c$",
]

[msg.section_0.entries.67]
text = [
  "Phew!\\c\\n",
  "You're really a strong Trainer,\\n",
  "that's for sure!\\c$",
]

[msg.section_0.entries.68]
text = [
  "The Pokémon on both sides\\n",
  "tried sooo hard, didn't they?\\c$",
]

[msg.section_0.entries.69]
text = [
  "Bianca: Thank you for being my\\n",
  "opponent! Yep! I learned a lot!\\c\\n",
  "Know what? Recently, I've been\\n",
  "thinking Pokémon stay by our sides\\l\\n",
  "to bring people together...\\c\\n",
  "I'm thinking of researching that!\\c$",
]

[msg.section_0.entries.70]
text = [
  "Bianca: I love your style\\n",
  "of Pokémon battling!\\c\\n",
  "Somehow, your Pokémon look like\\n",
  "they're having so much fun!\\c$",
]

[msg.section_0.entries.71]
text = [
  "It's the young researcher who always\\n",
  "pursues the truth, Biaaaanca!\\c$",
]

[msg.section_0.entries.72]
text = [
  "The Fire-type scorcher, Chili.\\n",
  "That's me. I will be your opponent!\\c$",
]

[msg.section_0.entries.73]
text = [
  "Yeeeeooow!\\c\\n",
  "Time to play with FIRE!!\\n",
  "I'm the strongest of the brothers!\\c$",
]

[msg.section_0.entries.74]
text = [
  "The final round of the tournament...\\n",
  "Gets you fired up, doesn't it?\\c\\n",
  "Get ready for the Fire-type\\n",
  "scorcher, Chili.\\l\\n",
  "That's me. I will be your opponent!\\c$",
]

[msg.section_0.entries.75]
text = [
  "You got me.\\c\\n",
  "I am...burned...out...\\c$",
]

[msg.section_0.entries.76]
text = [
  "I'm on fire!\\n",
  "Play with me, and you'll get burned!\\c$",
]

[msg.section_0.entries.77]
text = [
  "Chili: Whoa ho! You're on fire!\\c\\n",
  "But you have to hand it to me\\n",
  "for putting up a good fight, right?\\c$",
]

[msg.section_0.entries.78]
text = [
  "Chili: Don't worry about it!\\n",
  "When you play with fire, you get burned!\\c\\n",
  "I mean, c'mon, your opponent was me!\\n",
  "You didn't have a chance!\\c$",
]

[msg.section_0.entries.79]
text = [
  "He's part of the triple-trouble team!\\n",
  "The Fire-type master, Chili!\\c$",
]

[msg.section_0.entries.80]
text = [
  "That is correct!\\c\\n",
  "It is I, Cress, Water-type enthusiast,\\n",
  "whom you must face in battle!\\c$",
]

[msg.section_0.entries.81]
text = [
  "What incredible luck for you--you get to\\n",
  "battle the best among the three of us.\\c$",
]

[msg.section_0.entries.82]
text = [
  "Just as water flowing from high\\n",
  "places to low places is natural,\\l\\n",
  "so is my victory.\\c$",
]

[msg.section_0.entries.83]
text = [
  "Lose? Me?\\n",
  "I don't believe this.\\c$",
]

[msg.section_0.entries.84]
text = [
  "This is the appropriate\\n",
  "result when I'm your opponent.\\c$",
]

[msg.section_0.entries.85]
text = [
  "Cress: How amazing!\\c\\n",
  "Even if there were a lot of reasons,\\n",
  "you managed to defeat someone as\\l\\n",
  "impressive as me!\\c$",
]

[msg.section_0.entries.86]
text = [
  "Cress: How amazing!\\c\\n",
  "Even if there were a lot of reasons,\\n",
  "you managed to take on someone as\\l\\n",
  "impressive as me!\\c$",
]

[msg.section_0.entries.87]
text = [
  "He's part of the triple-trouble team!\\n",
  "The Water-type master, Cress!\\c$",
]

[msg.section_0.entries.88]
text = [
  "Nothing personal... No hard feelings...\\n",
  "Me and my Grass-type Pokémon, um...\\l\\n",
  "We're gonna battle, come what may.\\c$",
]

[msg.section_0.entries.89]
text = [
  "So, um, if you're OK with me, I'll, um,\\n",
  "put everything I've got into being, er,\\l\\n",
  "you know, your opponent.\\c$",
]

[msg.section_0.entries.90]
text = [
  "Nothing personal... No hard feelings...\\n",
  "Me and my Grass-type Pokémon, um...\\l\\n",
  "We're gonna battle, come what may.\\c\\n",
  "I'm looking forward to battling with you.\\c$",
]

[msg.section_0.entries.91]
text = [
  "Huh?\\n",
  "Is it over?\\c$",
]

[msg.section_0.entries.92]
text = [
  "Huh?\\n",
  "Did I win?\\c$",
]

[msg.section_0.entries.93]
text = [
  "Cilan: What a surprise...\\n",
  "You are very strong, aren't you?\\c\\n",
  "I guess my brothers wouldn't have\\n",
  "been able to defeat you either...\\c$",
]

[msg.section_0.entries.94]
text = [
  "Cilan: I guess...I suppose I won,\\n",
  "because I've been competing with\\l\\n",
  "my brothers Chili and Cress, and\\l\\n",
  "we all were able to get tougher.\\c$",
]

[msg.section_0.entries.95]
text = [
  "He's part of the triple-trouble team!\\n",
  "The Grass-type master, Cilan!\\c$",
]

[msg.section_0.entries.96]
text = [
  "Well then, Trainer, I'm going to\\n",
  "research how you battle!\\c$",
]

[msg.section_0.entries.97]
text = [
  "Well then, Trainer, I'm going to research\\n",
  "how you battle with the Pokémon\\l\\n",
  "you've so lovingly raised!\\c$",
]

[msg.section_0.entries.98]
text = [
  "Welcome!\\c\\n",
  "I'm the director of the Nacrene Museum\\n",
  "and former Leader of the Nacrene Gym,\\l\\n",
  "Lenora!\\c\\n",
  "Well then, challenger, I'm going to\\n",
  "research how you battle with the\\l\\n",
  "Pokémon you've so lovingly raised!\\c$",
]

[msg.section_0.entries.99]
text = [
  "You're impressive!\\n",
  "And quite charming, aren't you?!\\c$",
]

[msg.section_0.entries.100]
text = [
  "What's wrong? Could it be you misread\\n",
  "what moves I was going to use?\\c$",
]

[msg.section_0.entries.101]
text = [
  "Your fighting style is so enchanting.\\n",
  "It is charming.\\l\\n",
  "I'm glad I met you!\\c$",
]

[msg.section_0.entries.102]
text = [
  "Lenora: Ah ha ha! If you lose,\\n",
  "make sure to analyze why, and\\l\\n",
  "use that knowledge in your next battle!\\c$",
]

[msg.section_0.entries.103]
text = [
  "The battling museum director,\\n",
  "the archeologist with backbone, Lenora!\\c$",
]

[msg.section_0.entries.104]
text = [
  "You appear ready to face a battle.\\c$",
]

[msg.section_0.entries.105]
text = [
  "You appear ready to face a battle.\\c\\n",
  "Bring it!\\c$",
]

[msg.section_0.entries.106]
text = [
  "There is also strength in being with other\\n",
  "people and Pokémon.\\c\\n",
  "Receiving their support makes\\n",
  "you stronger.\\c\\n",
  "I'll show you this power!\\c$",
]

[msg.section_0.entries.107]
text = [
  "The wonderful combination\\n",
  "of you and your Pokémon!\\l\\n",
  "What a beautiful friendship!\\c$",
]

[msg.section_0.entries.108]
text = [
  "Extreme conditions really test you\\n",
  "and train you!\\c$",
]

[msg.section_0.entries.109]
text = [
  "Brycen: You are strong! No, both you\\n",
  "and your Pokémon are strong!\\c$",
]

[msg.section_0.entries.110]
text = [
  "Brycen: The path of an actor\\n",
  "was something I gave up once...\\c\\n",
  "Because of that, I poured all\\n",
  "of the things I was able to see\\l\\n",
  "and do into competition.\\c$",
]

[msg.section_0.entries.111]
text = [
  "The quiet ice mask, Brycen!\\n",
  "Lights, camera, action!\\c$",
]

[msg.section_0.entries.112]
text = [
  "Right now, I'm really in\\n",
  "the mood for a battle!\\c$",
]

[msg.section_0.entries.113]
text = [
  "But, I'm a Trainer.\\c\\n",
  "If I see a strong opponent, it makes me\\n",
  "want to battle.\\c$",
]

[msg.section_0.entries.114]
text = [
  "I'll know if you are good or not by\\n",
  "battling you right now.\\c$",
]

[msg.section_0.entries.115]
text = [
  "How the heck did I lose to you?\\c$",
]

[msg.section_0.entries.116]
text = [
  "This is what I, Kanto's top-level\\n",
  "Trainer, can really do!\\c$",
]

[msg.section_0.entries.117]
text = [
  "Blue: You're the real deal.\\n",
  "You are a good Trainer.\\c\\n",
  "But I'm going to beat you someday.\\n",
  "Don't you forget it!\\c$",
]

[msg.section_0.entries.118]
text = [
  "Blue: You're tough, I'll give you that.\\c\\n",
  "But there's always someone better.\\n",
  "You have to be more dedicated!\\c\\n",
  "Smell ya later!\\c$",
]

[msg.section_0.entries.119]
text = [
  "The strongest genes in Kanto!\\n",
  "Professor Oak's grandson, Bluuue!\\c$",
]

[msg.section_0.entries.120]
text = [
  "I, Lance the Dragon-type master,\\n",
  "accept your challenge!\\c$",
]

[msg.section_0.entries.121]
text = [
  "You are brimming with love\\n",
  "and trust toward Pokémon.\\c\\n",
  "I think we will be able to\\n",
  "have a fantastic battle!\\c$",
]

[msg.section_0.entries.122]
text = [
  "There's no need for words now.\\c\\n",
  "We will battle to determine who is\\n",
  "the stronger of the two of us.\\c\\n",
  "I, Lance the Dragon-type master,\\n",
  "accept your challenge!\\c$",
]

[msg.section_0.entries.123]
text = [
  "...It's over.\\c$",
]

[msg.section_0.entries.124]
text = [
  "I never give up, no matter what.\\n",
  "You must be the same?\\c$",
]

[msg.section_0.entries.125]
text = [
  "Lance: But it's an odd feeling.\\n",
  "I'm not angry that I lost.\\l\\n",
  "In fact, I feel happy.\\c\\n",
  "Happy that I witnessed the rise\\n",
  "of a great new Champion!\\c$",
]

[msg.section_0.entries.126]
text = [
  "Lance: Your Pokémon have responded to\\n",
  "your strong and upstanding nature.\\c\\n",
  "As a Trainer, you will continue to\\n",
  "grow strong with your Pokémon.\\c$",
]

[msg.section_0.entries.127]
text = [
  "The fury of a long line of Dragon Tamers\\n",
  "is about to be unleashed. Behold Lance!\\c$",
]

[msg.section_0.entries.128]
text = [
  "Hello!\\n",
  "I'm Steven.\\c\\n",
  "Your Pokémon are looking pretty good.\\c$",
]

[msg.section_0.entries.129]
text = [
  "My name is Steven.\\c\\n",
  "I'm interested in rare Stones, so\\n",
  "I travel here and there.\\c$",
]

[msg.section_0.entries.130]
text = [
  "What has awoken in you\\n",
  "because of your journey?\\c\\n",
  "I want you to hit me with it all!\\n",
  "Now, bring it!\\c$",
]

[msg.section_0.entries.131]
text = [
  "You are a truly noble Pokémon Trainer!\\c$",
]

[msg.section_0.entries.132]
text = [
  "When it comes down to it,\\n",
  "I'm still the strongest!\\c$",
]

[msg.section_0.entries.133]
text = [
  "Steven: Congratulations!\\c\\n",
  "The feelings you have for\\n",
  "your Pokémon...\\c\\n",
  "And the Pokémon that responded to\\n",
  "those feelings with all their might...\\c\\n",
  "They came together as one and created\\n",
  "an even greater power.\\c\\n",
  "And thus, you were able to\\n",
  "grasp victory!\\c$",
]

[msg.section_0.entries.134]
text = [
  "Steven: I must go.\\n",
  "May our journeys cross again.\\c$",
]

[msg.section_0.entries.135]
text = [
  "Heir to the Devon Corporation and\\n",
  "wandering Stone collector, Steven!\\c$",
]

[msg.section_0.entries.136]
text = [
  "At times your Pokémon should dance\\n",
  "like a spring breeze, and at times\\l\\n",
  "they should strike like lightning.\\c\\n",
  "I want to feel bedazzled by your\\n",
  "masterful performance!\\c$",
]

[msg.section_0.entries.137]
text = [
  "You have overcome challenges and\\n",
  "made it this far because you\\l\\n",
  "worked as one with your Pokémon.\\l\\n",
  "Show me that strength here and now!\\c$",
]

[msg.section_0.entries.138]
text = [
  "Who can most elegantly dance with\\n",
  "their Pokémon?\\l\\n",
  "Show me right here and now!\\c$",
]

[msg.section_0.entries.139]
text = [
  "That was wonderful work.\\c\\n",
  "You were elegant--infuriatingly so!\\c\\n",
  "And you know, it was utterly glorious!\\c$",
]

[msg.section_0.entries.140]
text = [
  "I've shown you plenty of the\\n",
  "water illusions performed\\l\\n",
  "by me and my Pokémon!\\c$",
]

[msg.section_0.entries.141]
text = [
  "Wallace: Bravo!\\c\\n",
  "I realize now your authenticity and\\n",
  "magnificence as a Pokémon Trainer.\\c\\n",
  "I find much joy in having met you and\\n",
  "your Pokémon.\\c$",
]

[msg.section_0.entries.142]
text = [
  "Wallace: When you think there's\\n",
  "a difference in your demeanor,\\l\\n",
  "let's meet again!\\c$",
]

[msg.section_0.entries.143]
text = [
  "Wallace, the water illusionist,\\n",
  "has appeared on the main stage!\\c$",
]

[msg.section_0.entries.144]
text = [
  "I think I could get to like\\n",
  "this atmosphere.\\c\\n",
  "It gives me an idea about the kind of\\n",
  "person that battles here.\\c$",
]

[msg.section_0.entries.145]
text = [
  "One look at you tells\\n",
  "me many things about you.\\c\\n",
  "Together, you and your Pokémon\\n",
  "overcame all the challenges you\\l\\n",
  "faced, however difficult.\\c\\n",
  "I, Cynthia, accept your challenge!\\c\\n",
  "There won't be any letup from me!\\c$",
]

[msg.section_0.entries.146]
text = [
  "When you are facing a Trainer\\n",
  "in a battle, you can learn everything\\l\\n",
  "about them.\\c\\n",
  "What Pokémon they have.\\n",
  "What moves they've taught.\\l\\n",
  "What items they make Pokémon hold.\\c\\n",
  "There's no need for words then.\\c$",
]

[msg.section_0.entries.147]
text = [
  "Aww!\\c\\n",
  "No matter how fun the battle is,\\n",
  "it will always end sometime...\\c$",
]

[msg.section_0.entries.148]
text = [
  "What's necessary to become\\n",
  "stronger?\\c\\n",
  "I think it's important to never lose\\n",
  "your love of Pokémon.\\c$",
]

[msg.section_0.entries.149]
text = [
  "Cynthia: That was excellent.\\n",
  "Truly, an outstanding battle.\\c\\n",
  "You gave the support your Pokémon\\n",
  "needed to maximize their power.\\c\\n",
  "And you guided them with certainty\\n",
  "to secure victory.\\c$",
]

[msg.section_0.entries.150]
text = [
  "Cynthia: Just a few minutes ago, you were\\n",
  "the most powerful challenger.\\c\\n",
  "The road before you is still very long,\\n",
  "but never give up!\\c\\n",
  "You'll always have Pokémon at your side.\\c$",
]

[msg.section_0.entries.151]
text = [
  "It's Sinnoh's archeologist, Cynthia!\\n",
  "Create a new history!\\c$",
]

[msg.section_0.entries.152]
text = [
  "I show everyone how wonderful it is to\\n",
  "move forward together with Pokémon.\\c\\n",
  "Competing like this is probably the best\\n",
  "way to show everyone!\\c$",
]

[msg.section_0.entries.153]
text = [
  "I've really been looking forward\\n",
  "to deciding who's the strongest\\l\\n",
  "Pokémon Trainer in this tournament!\\c\\n",
  "Kiai!\\c$",
]

[msg.section_0.entries.154]
text = [
  "I feel fired up when I see another\\n",
  "Trainer, and I imagine which one of\\l\\n",
  "us is stronger.\\c\\n",
  "When I actually face that Trainer,\\n",
  "the excitement builds to fever pitch!\\c$",
]

[msg.section_0.entries.155]
text = [
  "Well done!\\n",
  "You certainly are an unmatched talent!\\c$",
]

[msg.section_0.entries.156]
text = [
  "That was an extraordinary effort\\n",
  "from both you and your Pokémon!\\c$",
]

[msg.section_0.entries.157]
text = [
  "Alder: Well done!\\c\\n",
  "The ones who change the world are always\\n",
  "the ones who pursued their dreams.\\c\\n",
  "That's right! They're just like you.\\c$",
]

[msg.section_0.entries.158]
text = [
  "Alder: When things don't go as you\\n",
  "thought, silently continue to train.\\c\\n",
  "If you do, someday both you and\\n",
  "your Pokémon will be able to battle\\l\\n",
  "in the way you envisioned.\\c$",
]

[msg.section_0.entries.159]
text = [
  "Teacher of strength and kindness, Alder!\\n",
  "Keep your memories with Volcarona close!\\c$",
]

[msg.section_0.entries.160]
text = [
  "I'm Brock!\\n",
  "I'm an expert on Rock-type Pokémon.\\c$",
]

[msg.section_0.entries.161]
text = [
  "I'm Brock!\\n",
  "I'm an expert on Rock-type Pokémon.\\c\\n",
  "My defense is rock hard!\\c$",
]

[msg.section_0.entries.162]
text = [
  "I'm Brock!\\n",
  "I'm an expert on Rock-type Pokémon.\\c\\n",
  "My Pokémon are impervious to most\\n",
  "physical attacks.\\c\\n",
  "You'll have a hard time inflicting\\n",
  "any damage.\\c$",
]

[msg.section_0.entries.163]
text = [
  "Your Pokémon's powerful\\n",
  "attacks overcame my\\l\\n",
  "rock-hard resistance...\\c\\n",
  "You're stronger than\\n",
  "I expected...\\c$",
]

[msg.section_0.entries.164]
text = [
  "The best offense is a good defense!\\n",
  "That's my way of doing things!\\c$",
]

[msg.section_0.entries.165]
text = [
  "Brock: I really enjoyed the battle\\n",
  "with you.\\c\\n",
  "Still, the world is huge!\\n",
  "I can't believe you got past\\l\\n",
  "my rock-hard defense.\\c$",
]

[msg.section_0.entries.166]
text = [
  "Brock: I really enjoyed the battle\\n",
  "with you.\\c\\n",
  "I guess my rock-hard defense works\\n",
  "in top-level competition as well!\\c$",
]

[msg.section_0.entries.167]
text = [
  "The rock-solid Pokémon Trainer, Brock,\\n",
  "is ready to rock!\\c$",
]

[msg.section_0.entries.168]
text = [
  "I'm Misty!\\n",
  "I'm a user of Water-type Pokémon!\\c$",
]

[msg.section_0.entries.169]
text = [
  "I'm Misty!\\n",
  "I'm a user of Water-type Pokémon!\\l\\n",
  "Are you good enough to beat me?\\c$",
]

[msg.section_0.entries.170]
text = [
  "I'm Misty!\\n",
  "I'm a user of Water-type Pokémon, and\\l\\n",
  "my Water-type Pokémon are tough!\\c$",
]

[msg.section_0.entries.171]
text = [
  "You really are good...\\c\\n",
  "I'll admit that you are skilled...\\c$",
]

[msg.section_0.entries.172]
text = [
  "See! This is the Water-type\\n",
  "toughness I was talking about!\\c$",
]

[msg.section_0.entries.173]
text = [
  "Misty: Know what? My dream was\\n",
  "to go on a journey and battle\\l\\n",
  "powerful Trainers...\\c\\n",
  "I made my dream come true, and now...\\n",
  "my next dream is to defeat you!\\c$",
]

[msg.section_0.entries.174]
text = [
  "Misty: Know what? My dream was\\n",
  "to go on a journey and battle\\l\\n",
  "powerful Trainers...\\c\\n",
  "Now, that dream has come true!\\c$",
]

[msg.section_0.entries.175]
text = [
  "The tomboyish mermaid, Misty,\\n",

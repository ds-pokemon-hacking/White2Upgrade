]

[msg.section_0.entries.215]
text = [
  "The self-proclaimed strongest Trainer,\\n",
  "Giovanni, enters the ring!\\c$",
]

[msg.section_0.entries.216]
text = [
  "I'll show you the real power of the\\n",
  "magnificent bird Pokémon!\\c$",
]

[msg.section_0.entries.217]
text = [
  "I'll show you the real power of the\\n",
  "magnificent bird Pokémon!\\l\\n",

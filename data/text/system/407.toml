]

[msg.section_0.entries.218]
text = [
  "I'll show you the real power of the\\n",
  "magnificent bird Pokémon!\\c\\n",
  "Dad! I hope you're watching\\n",
  "me battle from above!\\c$",
]

[msg.section_0.entries.219]
text = [
  "I understand...\\n",
  "I'll bow out gracefully.\\c$",
]

[msg.section_0.entries.220]
text = [
  "Now you know the real power\\n",
  "of bird Pokémon!\\c$",
]

[msg.section_0.entries.221]
text = [
  "Falkner: A defeat is a defeat.\\n",

text = [
  "I was toughened up by stormy\\n",
  "white waters, and this is how I fight!\\c\\n",
  "I'll take everything you can throw\\n",
  "at me and then pull you under!\\c\\n",
  "Victory will be mine!\\n",
  "Come on, let's get it done!\\c$",
]

[msg.section_0.entries.970]
text = [
  "I'm Crasher Wake!\\c\\n",
  "I was toughened up by stormy\\n",
  "white waters, and this is how I fight!\\c\\n",
  "I'll take everything you can throw\\n",
  "at me and then pull you under!\\c\\n",
  "Victory will be mine!\\n",
  "Come on, let's get it done!\\c$",
]

[msg.section_0.entries.971]
text = [
  "Hunwah!\\n",
  "It's gone and ended!\\c\\n",
  "How will I say this... I want more!\\n",
  "I wanted to battle a lot more!$",
]

[msg.section_0.entries.972]
text = [
  "I won, but I want more!\\n",
  "I wanted to battle a lot more!\\c$",
]

[msg.section_0.entries.973]
text = [
  "Crasher Wake: The styles of battling and\\n",
  "winning are as widely varied\\l\\n",
  "as Trainers are.\\c\\n",
  "Do you want to know how I battle?\\n",
  "I battle so I can say I had fun at\\l\\n",
  "the end, whether I win or lose!\\c$",
]

[msg.section_0.entries.974]
text = [
  "Crasher Wake: Even if you hold down your\\n",
  "foe, what you get is a small satisfaction.\\c\\n",
  "It's better to bring out your foe's\\n",
  "power and win!\\c\\n",
  "Then, both can get closer to glory!\\c$",
]

[msg.section_0.entries.975]
text = [
  "Bring out the best in Pokémon!\\n",
  "You can do it, Crasher Wake!\\c$",
]

[msg.section_0.entries.976]
text = [
  "I, Byron, will take your challenge!\\c$",
]

[msg.section_0.entries.977]
text = [
  "Young Trainer!\\n",
  "I'm Byron.\\c\\n",
  "As a wall for young people,\\n",
  "I'll take your challenge!\\c$",
]

[msg.section_0.entries.978]
text = [
  "Trainer!\\n",
  "You're young, just like my son, Roark.\\c\\n",
  "With more young Trainers taking charge,\\n",
  "the future of Pokémon is bright!\\c\\n",
  "So, as a wall for young people,\\n",
  "I'll take your challenge!\\c$",
]

[msg.section_0.entries.979]
text = [
  "Hmm!\\n",
  "My rental Pokémon--defeated!\\c$",
]

[msg.section_0.entries.980]
text = [
  "Gwahahaha!\\n",
  "How'd you like the way I battle?!\\c$",
]

[msg.section_0.entries.981]
text = [
  "Byron: Gwahahaha!\\c\\n",
  "You were strong enough to take me down.\\c\\n",
  "I recognize your power.\\n",
  "Please show your power to other\\l\\n",
  "Trainers, too!\\c$",
]

[msg.section_0.entries.982]
text = [
  "Byron: Gwahahaha!\\c\\n",
  "I happened to win this time, but we\\n",
  "were under so much pressure, right?\\c\\n",
  "You've lost. Of course,\\n",
  "you'll challenge me again, right?\\l\\n",
  "I look forward to it!\\c$",
]

[msg.section_0.entries.983]
text = [
  "Byron aims for victory, even with\\n",
  "different teammates!\\c$",
]

[msg.section_0.entries.984]
text = [
  "You're the opponent of Candice?\\c\\n",
  "Sure thing!\\n",
  "I was waiting for someone tough!\\c$",
]

[msg.section_0.entries.985]
text = [
  "You're the opponent of Candice?\\c\\n",
  "Sure thing!\\n",
  "I was waiting for someone tough!\\c\\n",
  "But I should tell you, I'm tough,\\n",
  "because I know how to focus.\\c$",
]

[msg.section_0.entries.986]
text = [
  "You're the opponent of Candice?\\c\\n",
  "Sure thing!\\n",
  "I was waiting for someone tough!\\c\\n",
  "But I should tell you, I'm tough,\\n",
  "because I know how to focus.\\c\\n",
  "Pokémon, fashion, romance...\\n",
  "It's all about focus!\\c\\n",
  "I'll show you just what I mean.\\n",
  "Get ready to lose!\\c$",
]

[msg.section_0.entries.987]
text = [
  "You're mighty!\\n",
  "You're worthy of lots of respect.\\c$",
]

[msg.section_0.entries.988]
text = [
  "I sensed your will to win,\\n",
  "but I don't lose!\\c$",
]

[msg.section_0.entries.989]
text = [
  "Candice: Wow! You're great!\\n",
  "You've earned my respect!\\c\\n",
  "I think your focus and will bowled\\n",
  "us over totally.\\c\\n",
  "But next time I'll focus even more\\n",
  "and won't lose!\\c$",
]

[msg.section_0.entries.990]
text = [
  "Candice: See? Candice's focus!\\n",
  "My Pokémon's focus is great, too!\\c$",
]

[msg.section_0.entries.991]
text = [
  "How will she battle with rental Pokémon?\\n",
  "Let's find out! Candice, take the stage!\\c$",
]

[msg.section_0.entries.992]
text = [
  "I hope you're the Trainer who'll make\\n",
  "me remember how fun it is to battle!\\c$",
]

[msg.section_0.entries.993]
text = [
  "The next opponent is you...\\c\\n",
  "I hope you're the Trainer who'll make\\n",
  "me remember how fun it is to battle!\\c$",
]

[msg.section_0.entries.994]
text = [
  "Since you've come this far,\\n",
  "you must be quite strong...\\c\\n",
  "I hope you're the Trainer who'll make\\n",
  "me remember how fun it is to battle!\\c$",
]

[msg.section_0.entries.995]
text = [
  "You've got me beat...\\c\\n",
  "Your desire and the noble way\\n",
  "your Pokémon battled for you...\\c\\n",
  "I even felt thrilled during\\n",
  "our match.\\c\\n",
  "That was a very good battle.\\c$",
]

[msg.section_0.entries.996]
text = [
  "It was not shocking at all...\\n",
  "That is not what I wanted!\\c$",
]

[msg.section_0.entries.997]
text = [
  "Volkner: ...Hehehe.\\c\\n",
  "Hahahah!\\c\\n",
  "...That was the most fun I've had\\n",
  "in a battle since...I don't know when!\\c\\n",
  "It's also made me excited to know\\n",
  "you and your team will keep battling\\l\\n",
  "to greater heights!\\c$",
]

[msg.section_0.entries.998]
text = [
  "Volkner: The best part of a battle\\n",
  "is not just winning.\\c\\n",
  "Pokémon who are fighting feel their limit\\n",
  "at the edge of winning or losing...\\c\\n",
  "Such a shocking battle is\\n",
  "what I want!\\c$",
]

[msg.section_0.entries.999]
text = [
  "When you have real power, different\\n",
  "rules won't slow you down! Go, Volkner!\\c$",
]

[msg.section_0.entries.1000]
text = [
  "...\\c$",
]

[msg.section_0.entries.1001]
text = [
  "...\\c$",
]

[msg.section_0.entries.1002]
text = [
  "...\\c$",
]

[msg.section_0.entries.1003]
text = [
  "...!\\c$",
]

[msg.section_0.entries.1004]
text = [
  "...?\\c$",
]

[msg.section_0.entries.1005]
text = [
  "Red: ...!!\\c$",
]

[msg.section_0.entries.1006]
text = [
  "Red: ...?!\\c$",
]

[msg.section_0.entries.1007]
text = [
  "It's the living legend, Red!\\n",
  "Is that strength for real?!\\c$",
]

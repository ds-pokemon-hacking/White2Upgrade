  "Me, lose?!\\c$",
]

[msg.section_0.entries.212]
text = [
  "Ha!\\n",
  "That was a truly intense fight!\\c$",
]

[msg.section_0.entries.213]
text = [
  "Giovanni: Haarg!\\n",

  "Let's win while showing the\\n",
  "elegance of Pokémon's moves.\\c\\n",
  "Please, you shall bear witness to\\n",
  "our artistry.\\c\\n",
  "A grand illusion of water sculpted\\n",
  "by Pokémon and myself!\\c$",
]

[msg.section_0.entries.355]
text = [
  "Ahahaha, excellent!\\n",
  "Very well, you are the winner.\\c$",
]

[msg.section_0.entries.356]
text = [
  "Ahahaha, I'm the winner!\\n",
  "Which is to say, you lost.\\c$",
]

[msg.section_0.entries.357]
text = [
  "Juan: From you, I sense the brilliant\\n",
  "shine of skill that will overcome all!\\c\\n",
  "However, you are somewhat\\n",
  "lacking in elegance.\\c\\n",
  "Perhaps I should make you a loan\\n",
  "of my outfit?\\c\\n",
  "...\\c\\n",
  "Hahaha, I merely jest!\\c$",
]

[msg.section_0.entries.358]
text = [
  "Juan: I'm not concerned with dynamism.\\n",
  "I care about winning beautifully!\\c$",
]

[msg.section_0.entries.359]
text = [
  "Dynamism with the beauty of pure water!\\n",
  "Juan, win with style!\\c$",
]

[msg.section_0.entries.360]
text = [
  "I need to see your potential\\n",
  "as a Trainer.\\c\\n",
  "And, I'll need to see the toughness\\n",
  "of the Pokémon that battle with you!\\c$",
]

[msg.section_0.entries.361]
text = [
  "Every day, I toughened up my Pokémon\\n",
  "by digging up Fossils nonstop.\\c\\n",
  "Could I show you how tough I made them\\n",
  "in a battle?\\c$",
]

[msg.section_0.entries.362]
text = [
  "Here goes! These are my rocking\\n",
  "Pokémon, my pride and joy!\\c$",
]

[msg.section_0.entries.363]
text = [
  "Wh-what? That can't be!\\n",
  "My buffed-up Pokémon!\\c$",
]

[msg.section_0.entries.364]
text = [
  "See? These are my rocking\\n",
  "Pokémon, my pride and joy!\\c$",
]

[msg.section_0.entries.365]
text = [
  "Roark: ...We lost control there.\\c\\n",
  "Next time, I'd like to challenge you to\\n",
  "a Fossil-digging race underground\\l\\n",
  "in the Sinnoh region.\\c$",
]

[msg.section_0.entries.366]
text = [
  "Roark: Thanks!\\c\\n",
  "The battle gave me confidence\\n",
  "that I may be able to beat my dad!\\c$",
]

[msg.section_0.entries.367]
text = [
  "Roark the Rock!\\n",
  "Advance with Rock-type Pokémon!\\c$",
]

[msg.section_0.entries.368]
text = [
  "Let's cut to the good stuff!\\n",
  "Let's get down to battle!\\c$",
]

[msg.section_0.entries.369]
text = [
  "My Grass-type Pokémon are\\n",
  "growing good and strong.\\c\\n",
  "Come on, let's battle!\\n",
  "A real quick one, OK?\\c$",
]

[msg.section_0.entries.370]
text = [
  "I'm Gardenia.\\n",
  "I love Grass-type Pokémon!\\c\\n",
  "I can't deny that Grass-type\\n",
  "Pokémon have many weak points.\\c\\n",
  "But I'll show you that's not the only\\n",
  "factor in deciding who wins!\\c$",
]

[msg.section_0.entries.371]
text = [
  "Aww, really?\\c\\n",
  "My Grass-type Pokémon are growing good\\n",
  "and strong, too...\\c$",
]

[msg.section_0.entries.372]
text = [
  "Yes! My Pokémon and I are\\n",
  "perfectly good!\\c$",
]

[msg.section_0.entries.373]
text = [
  "Gardenia: Wherever I go, I still try to\\n",
  "be as tough as I can.\\c\\n",
  "It's not fair to my Pokémon if we were\\n",
  "to lose because of me.\\c$",
]

[msg.section_0.entries.374]
text = [
  "Gardenia: We won this time...\\c\\n",
  "But you and your Pokémon are pretty\\n",
  "good, too!\\c\\n",
  "So, I'd like you to battle me here again!\\c$",
]

[msg.section_0.entries.375]
text = [
  "Master of thriving plant Pokémon!\\n",
  "Gardenia, the Trainer with a green thumb!\\c$",
]

[msg.section_0.entries.376]
text = [
  "You shall challenge me, yes?\\n",
  "But I shall win.\\c\\n",
  "That is what the Gym Leader of\\n",
  "Hearthome does, non?\\c$",
]

[msg.section_0.entries.377]
text = [
  "I also study Pokémon very much.\\n",
  "I have come to be Gym Leader.\\c\\n",
  "And, uh, so it shall be that you\\n",
  "challenge me.\\l\\n",
  "But I shall win.\\c\\n",
  "That is what the Gym Leader of\\n",
  "Hearthome does, non?\\c$",
]

[msg.section_0.entries.378]
text = [
  "I learned a lot of things\\n",
  "in the Sinnoh region.\\c\\n",
  "Also, I study Pokémon very much.\\n",
  "I have come to be Gym Leader.\\c\\n",
  "And, uh, so it shall be that you\\n",
  "challenge me.\\l\\n",
  "But I shall win.\\c\\n",
  "That is what the Gym Leader of\\n",
  "Hearthome does, non?\\c$",
]

[msg.section_0.entries.379]
text = [
  "You are so fantastically strong.\\n",
  "I know why I have lost.\\c$",
]

[msg.section_0.entries.380]
text = [
  "You are strong.\\n",
  "But it's me who won.\\c$",
]

[msg.section_0.entries.381]
text = [
  "Fantina: I am dumbfounded!\\c\\n",
  "So very, very strong!\\n",
  "You, your Pokémon, so strong!\\c\\n",
  "Your power is admirable!\\c$",
]

[msg.section_0.entries.382]
text = [
  "Fantina: Never give up, never surrender!\\n",
  "There are many other Trainers.\\c\\n",
  "Strong Trainers, too.\\n",
  "There are many more in this world.\\c\\n",
  "Have patience! You must become\\n",
  "stronger, one at a time.\\c$",
]

[msg.section_0.entries.383]
text = [
  "The Alluring, Soulful Dancer!\\n",
  "Fantina! The strength is ever changing!\\c$",
]

[msg.section_0.entries.384]
text = [
  "I'm pleased to meet you.\\n",
  "Whenever you're ready!\\c$",
]

[msg.section_0.entries.385]
text = [
  "Nice to see you again.\\c\\n",
  "I will do the best I can as\\n",
  "a Trainer.\\c\\n",
  "I take battling very seriously.\\n",
  "Whenever you're ready!\\c$",
]

[msg.section_0.entries.386]
text = [
  "Nice to see you again.\\c\\n",
  "I don't really know what it means to\\n",
  "be strong.\\c\\n",
  "But I will do the best I can as\\n",
  "a Trainer.\\c\\n",
  "I take battling very seriously.\\n",
  "Whenever you're ready!\\c$",
]

[msg.section_0.entries.387]
text = [
  "I shall admit defeat...\\n",
  "You are much too strong.\\c$",
]

[msg.section_0.entries.388]
text = [
  "Thank you very much.\\n",
  "I learned a lot from it.\\c$",
]

[msg.section_0.entries.389]
text = [
  "Maylene: I can't explain what\\n",
  "it means to be strong.\\c\\n",
  "I don't know how much effort goes\\n",
  "into being strong...\\c\\n",
  "But being with Pokémon lets us\\n",
  "keep making the effort, doesn't it?\\c$",
]

[msg.section_0.entries.390]
text = [
  "Maylene: Learn from your foe by winning,\\n",
  "and learn from your foe by losing, too...\\c\\n",
  "Everything is an experience... Yes.\\n",
  "Pokémon made me realize that...\\l\\n",
  "That is how I feel.\\c$",
]

[msg.section_0.entries.391]
text = [
  "The barefoot, fighting genius!\\n",
  "Maylene! Unveil the moves!\\c$",
]

[msg.section_0.entries.392]
text = [
  "My Pokémon will take everything you can\\n",
  "throw at them and then pull you under!\\c\\n",
  "Victory will be ours!\\n",
  "Come on, let's get it done!\\c$",
]

[msg.section_0.entries.393]
text = [
  "My Pokémon were toughened up by\\n",
  "stormy white waters!\\c\\n",
  "They'll take everything you can throw\\n",
  "at them and then pull you under!\\c\\n",
  "Victory will be ours!\\n",
  "Come on, let's get it done!\\c$",
]

[msg.section_0.entries.394]
text = [
  "I'm Crasher Wake!\\c\\n",
  "My Pokémon were toughened up by\\n",
  "stormy white waters!\\c\\n",
  "They'll take everything you can throw\\n",
  "at them and then pull you under!\\c\\n",
  "Victory will be ours!\\n",
  "Come on, let's get it done!\\c$",
]

[msg.section_0.entries.395]
text = [
  "Hunwah!\\n",
  "It's gone and ended!\\c\\n",
  "How will I say this... I want more!\\n",
  "I wanted to battle a lot more!$",
]

[msg.section_0.entries.396]
text = [
  "I won, but I want more!\\n",
  "I wanted to battle a lot more!\\c$",
]

[msg.section_0.entries.397]
text = [
  "Crasher Wake: The styles of battling and\\n",
  "winning are as widely varied\\l\\n",
  "as Trainers are.\\c\\n",
  "Do you want to know how I battle?\\n",
  "I battle so I can say I had fun at\\l\\n",
  "the end, whether I win or lose!\\c$",
]

[msg.section_0.entries.398]
text = [
  "Crasher Wake: Even if you hold down your\\n",
  "foe, what you get is a small satisfaction.\\c\\n",
  "It's better to bring out your foe's\\n",
  "power and win!\\c\\n",
  "Then, both can get closer to glory!\\c$",
]

[msg.section_0.entries.399]
text = [
  "The torrential masked master!\\n",
  "Crasher Wake! Crasher!\\c$",
]

[msg.section_0.entries.400]
text = [
  "I, Byron, will take your challenge!\\c$",
]

[msg.section_0.entries.401]
text = [
  "Young Trainer!\\n",
  "I'm Byron.\\c\\n",
  "As a wall for young people,\\n",
  "I'll take your challenge!\\c$",
]

[msg.section_0.entries.402]
text = [
  "Trainer!\\n",
  "You're young, just like my son, Roark.\\c\\n",
  "With more young Trainers taking charge,\\n",
  "the future of Pokémon is bright!\\c\\n",
  "So, as a wall for young people,\\n",
  "I'll take your challenge!\\c$",
]

[msg.section_0.entries.403]
text = [
  "Hmm!\\n",
  "My sturdy Pokémon--defeated!\\c$",
]

[msg.section_0.entries.404]
text = [
  "Gwahahaha!\\n",
  "How were my sturdy Pokémon?!\\c$",
]

[msg.section_0.entries.405]
text = [
  "Byron: Gwahahaha!\\c\\n",
  "You were strong enough to take down\\n",
  "my prized team of Pokémon.\\c\\n",
  "I recognize your power.\\n",
  "Please show your power to other\\l\\n",
  "Trainers, too!\\c$",
]

[msg.section_0.entries.406]
text = [
  "Byron: Gwahahaha!\\c\\n",
  "I happened to win this time, but we\\n",
  "were under so much pressure, right?\\c\\n",
  "You've lost. Of course,\\n",
  "you'll challenge me again, right?\\l\\n",
  "I look forward to it!\\c$",
]

[msg.section_0.entries.407]
text = [
  "The man with the steel body, Byron!\\n",
  "In other words, the iron-body man!\\c$",
]

[msg.section_0.entries.408]
text = [
  "You're the opponent of Candice?\\c\\n",
  "Sure thing!\\n",
  "I was waiting for someone tough!\\c$",
]

[msg.section_0.entries.409]
text = [
  "You're the opponent of Candice?\\c\\n",
  "Sure thing!\\n",
  "I was waiting for someone tough!\\c\\n",
  "But I should tell you, I'm tough,\\n",
  "because I know how to focus.\\c$",
]

[msg.section_0.entries.410]
text = [
  "You're the opponent of Candice?\\c\\n",
  "Sure thing!\\n",
  "I was waiting for someone tough!\\c\\n",
  "But I should tell you, I'm tough,\\n",
  "because I know how to focus.\\c\\n",
  "Pokémon, fashion, romance...\\n",
  "It's all about focus!\\c\\n",
  "I'll show you just what I mean.\\n",
  "Get ready to lose!\\c$",
]

[msg.section_0.entries.411]
text = [
  "You're mighty!\\n",
  "You're worthy of lots of respect.\\c$",
]

[msg.section_0.entries.412]
text = [
  "I sensed your will to win,\\n",
  "but I don't lose!\\c$",
]

[msg.section_0.entries.413]
text = [
  "Candice: Wow! You're great!\\n",
  "You've earned my respect!\\c\\n",
  "I think your focus and will bowled\\n",
  "us over totally.\\c\\n",
  "But next time I'll focus even more\\n",
  "and won't lose!\\c$",
]

[msg.section_0.entries.414]
text = [
  "Candice: See? Candice's focus!\\n",
  "My Pokémon's focus is great, too!\\c$",
]

[msg.section_0.entries.415]
text = [
  "The diamond-dust girl, Candice!\\n",
  "Will she use her icy ice moves?\\c$",
]

[msg.section_0.entries.416]
text = [
  "I hope you're the Trainer who'll make\\n",
  "me remember how fun it is to battle!\\c$",
]

[msg.section_0.entries.417]
text = [
  "The next opponent is you...\\c\\n",
  "I hope you're the Trainer who'll make\\n",
  "me remember how fun it is to battle!\\c$",
]

[msg.section_0.entries.418]
text = [
  "Since you've come this far,\\n",
  "you must be quite strong...\\c\\n",
  "I hope you're the Trainer who'll make\\n",
  "me remember how fun it is to battle!\\c$",
]

[msg.section_0.entries.419]
text = [
  "You've got me beat...\\c\\n",
  "Your desire and the noble way\\n",
  "your Pokémon battled for you...\\c\\n",
  "I even felt thrilled during\\n",
  "our match.\\c\\n",
  "That was a very good battle.\\c$",
]

[msg.section_0.entries.420]
text = [
  "It was not shocking at all...\\n",
  "That is not what I wanted!\\c$",
]

[msg.section_0.entries.421]
text = [
  "Volkner: ...Hehehe.\\c\\n",
  "Hahahah!\\c\\n",
  "...That was the most fun I've had\\n",
  "in a battle since...I don't know when!\\c\\n",
  "It's also made me excited to know\\n",
  "you and your team will keep battling\\l\\n",
  "to greater heights!\\c$",
]

[msg.section_0.entries.422]
text = [
  "Volkner: The best part of a battle\\n",
  "is not just winning.\\c\\n",
  "Pokémon who are fighting feel their limit\\n",
  "at the edge of winning or losing...\\c\\n",
  "Such a shocking battle is\\n",
  "what I want!\\c$",
]

[msg.section_0.entries.423]
text = [
  "The shining, shocking star!\\n",
  "Volkner! Go all out!\\c$",
]

[msg.section_0.entries.424]
text = [
  "Everything can be understood through\\n",
  "Pokémon battles! Let's get started!\\c$",
]

[msg.section_0.entries.425]
text = [
  "Words are the source of\\n",
  "all misunderstanding!\\c\\n",
  "Everything can be understood through\\n",
  "Pokémon battles! Let's get started!\\c$",
]

[msg.section_0.entries.426]
text = [
  "You communicate with Pokémon using\\n",
  "feelings, not words!\\c\\n",
  "Everything can be understood through\\n",
  "Pokémon battles! Let's get started!\\c$",
]

[msg.section_0.entries.427]
text = [
  "Thank you!\\c$",
]

[msg.section_0.entries.428]
text = [
  "I just lucked my way into winning.\\n",
  "Isn't that how it felt?\\c$",
]

[msg.section_0.entries.429]
text = [
  "Hilbert: Make your dreams come true!\\n",
  "Someone once encouraged me to do that.\\c\\n",
  "Even now, I'm continuing my journey to\\n",
  "realize those dreams.\\c$",
]

[msg.section_0.entries.430]
text = [
  "Hilbert: I'll leave you with words\\n",
  "someone told me once.\\c\\n",
  "Dream your dream!\\c$",
]

[msg.section_0.entries.431]
text = [
  "Meet Hilbert, the Trainer some\\n",
  "claim to be the strongest of all!\\c$",
]

[msg.section_0.entries.432]
text = [
  "Everything can be understood through\\n",
  "Pokémon battles! Let's go!\\c$",
]

[msg.section_0.entries.433]
text = [
  "Words are the source\\n",
  "of all misunderstanding!\\c\\n",
  "Everything can be understood through\\n",
  "Pokémon battles! Let's go!\\c$",
]

[msg.section_0.entries.434]
text = [
  "You communicate with Pokémon using\\n",
  "feelings, not words!\\c\\n",
  "Everything can be understood through\\n",
  "Pokémon battles! Let's go!\\c$",
]

[msg.section_0.entries.435]
text = [
  "Thank you!\\c$",
]

[msg.section_0.entries.436]
text = [
  "I just lucked into winning...\\n",
  "Isn't that how it felt?\\c$",
]

[msg.section_0.entries.437]
text = [
  "Hilda: Make your dreams come true!\\n",
  "Someone once encouraged me to do that.\\c\\n",
  "Even now, I'm continuing my journey to\\n",
  "realize those dreams.\\c$",
]

[msg.section_0.entries.438]
text = [
  "Hilda: I'll leave you with words\\n",
  "someone told me once.\\c\\n",
  "Dream your dream!\\c$",
]

[msg.section_0.entries.439]
text = [
  "Meet Hilda, the Trainer some\\n",
  "claim to be the strongest of all!\\c$",
]

[msg.section_0.entries.440]
text = [
  "Clay sure likes things\\n",
  "loud and flashy, doesn't he?\\c\\n",
  "Well, whatever...\\n",
  "It's time to go all out!\\c$",
]

[msg.section_0.entries.441]
text = [
  "UNUSED\\c$",
]

[msg.section_0.entries.442]
text = [
  "UNUSED\\c$",
]

[msg.section_0.entries.443]
text = [
  "Man! I lost...\\c\\n",
  "You've become way too tough!\\n",
  "But, I'm gonna get stronger, too!\\c$",
]

[msg.section_0.entries.444]
text = [
  "What's wrong?\\n",
  "That's not like you, man...\\c$",
]

[msg.section_0.entries.445]
text = [
  "[VAR TRNAME(1)]: Still...\\c\\n",
  "Your Pokémon sure look like they're\\n",
  "having a lot of fun when they battle.\\c$",
]

[msg.section_0.entries.446]
text = [
  "[VAR TRNAME(1)]: C'mon, man!\\c\\n",
  "You're going to help me\\n",
  "when I take on Team Plasma,\\l\\n",
  "so you'd better get it together!\\c$",
]

[msg.section_0.entries.447]
text = [
  "[VAR TRNAME(1)]'s pushing his limits\\n",
  "in order to find his important Pokémon!\\c$",
]

[msg.section_0.entries.448]
text = [
  "UNUSED\\c$",
]

[msg.section_0.entries.449]
text = [
  "I'm as thrilled as I can be to battle\\n",
  "here against you, the first challenger\\l\\n",
  "I battled as a Gym Leader.\\c\\n",
  "I'm sure you've learned something\\n",
  "about Pokémon during your journey.\\c\\n",
  "Now, I'm going to see if your bond with\\n",
  "your Pokémon has grown stronger!\\c$",
]

[msg.section_0.entries.450]
text = [
  "UNUSED\\c$",
]

[msg.section_0.entries.451]
text = [
  "Fantastic!\\c\\n",
  "You and your Pokémon\\n",
  "have grown much stronger!\\c$",
]

[msg.section_0.entries.452]
text = [
  "Even when you lose, your Pokémon\\n",
  "are still brimming with fighting spirit.\\c$",
]

[msg.section_0.entries.453]
text = [
  "Cheren: I made it where I am\\n",
  "because Pokémon were by my side.\\c\\n",
  "Perhaps we need to think about\\n",
  "why Pokémon help us not in terms of\\l\\n",
  "Pokémon and Trainers but as a\\l\\n",
  "relationship between living beings.\\c$",
]

[msg.section_0.entries.454]
text = [
  "Cheren: I made it where I am\\n",
  "because Pokémon were by my side.\\c\\n",
  "Perhaps we need to think about\\n",
  "why Pokémon help us not in terms of\\l\\n",
  "Pokémon and Trainers but as a\\l\\n",
  "relationship between living beings.\\c$",
]

[msg.section_0.entries.455]
text = [
  "In this corner, the young Pokémon\\n",
  "Trainer battling for his ideals, Cheren!\\c$",
]

[msg.section_0.entries.456]
text = [
  "UNUSED\\c$",
]

[msg.section_0.entries.457]
text = [
  "UNUSED\\c$",
]

[msg.section_0.entries.458]
text = [
  "As a researcher, it is the truth and\\n",
  "the ideal way things should be that\\l\\n",
  "I seek.\\c\\n",
  "The latent power of Pokémon...\\n",
  "What is the best way to bring it out?\\c\\n",
  "If possible, I want it to be the trust\\n",
  "between Trainers and their Pokémon,\\l\\n",
  "just as it has always been.\\c\\n",
  "I look forward to you teaching me\\n",
  "that this is indeed true!\\c$",
]

[msg.section_0.entries.459]
text = [
  "Well done!\\n",
  "I learned much from this battle!\\c$",
]

[msg.section_0.entries.460]
text = [
  "Remember our battle on Route 4?\\c\\n",
  "Please bring out more of your\\n",
  "Pokémon's strength, like you did then!\\c$",
]

[msg.section_0.entries.461]
text = [
  "Colress: Just as I expected!\\c\\n",
  "Your Pokémon must be happy to\\n",
  "be by your side!\\l\\n",
  "You bring out the best in their power!\\c$",
]

[msg.section_0.entries.462]
text = [
  "Colress: What is this?!\\c\\n",
  "Why don't you bring out more\\n",
  "power from your Pokémon?!\\c$",
]

[msg.section_0.entries.463]
text = [
  "It's Colress! His wish is to bring\\n",
  "out the power of Pokémon!\\c$",
]

[msg.section_0.entries.464]
text = [
  "I'm a Poison-type specialist...\\n",
  "I'll go...slowly...\\c$",
]

[msg.section_0.entries.465]
text = [
  "Nobody can escape from\\n",
  "my Pokémon's poison...\\l\\n",
  "He he... Let's start an experiment.\\c$",
]

[msg.section_0.entries.466]
text = [
  "I like the way that the poisoned prey\\n",
  "gets weaker...\\c\\n",
  "He he. I won't let it be over soon...\\n",
  "Let me enjoy it...slowly!\\c$",
]

[msg.section_0.entries.467]
text = [
  "You withstood my poison?!\\n",
  "How amazingly tough!\\c$",
]

[msg.section_0.entries.468]
text = [
  "Your Pokémon seemed to not be happy...\\n",
  "He he... I enjoyed that...\\c$",
]

[msg.section_0.entries.469]
text = [
  "Castor: Fight fire with fire.\\n",
  "Fight poison with poison.\\l\\n",
  "I lost...\\c$",
]

[msg.section_0.entries.470]
text = [
  "Castor: You need to be more poisonous\\n",
  "to defeat me...\\c$",
]

[msg.section_0.entries.471]
text = [
  "Castor's smile is eerie!\\n",
  "One man's meal is another man's poison?\\c$",
]

[msg.section_0.entries.472]
text = [
  "Ground-type Pokémon are great,\\n",
  "because they are down to earth!\\c$",
]

[msg.section_0.entries.473]
text = [
  "We all want to live on this bountiful land,\\n",
  "just like Ground-type Pokémon, right?\\c$",
]

[msg.section_0.entries.474]
text = [
  "I like them. I love them all!\\n",
  "If I win this tournament,\\l\\n",
  "I'll become a Ground-type Pokémon.\\c\\n",
  "I will! I'm serious!\\c$",
]

[msg.section_0.entries.475]
text = [
  "I never imagined that somebody would love\\n",
  "Ground-type Pokémon more than I do...\\c$",
]

[msg.section_0.entries.476]
text = [
  "Wa ha ha! Your love isn't enough!\\n",
  "You should love them mightily!\\c$",
]

[msg.section_0.entries.477]
text = [
  "Homer: I'll seclude myself in the\\n",
  "mountains for training, and then I'll\\l\\n",
  "come back!\\l\\n",
  "See you!\\c$",
]

[msg.section_0.entries.478]
text = [
  "Homer: You need to get more heavily\\n",
  "involved with Ground-type Pokémon!\\c$",
]

[msg.section_0.entries.479]
text = [
  "He loves Ground-type Pokémon!\\n",
  "Homer will love them always!\\c$",
]

[msg.section_0.entries.480]
text = [
  "Did you know psychic power\\n",
  "tastes like ice cream?\\c$",
]

[msg.section_0.entries.481]
text = [
  "What are we going to do now?\\n",
  "I should warn you. I can't fly\\l\\n",
  "in the sky with my psychic power...\\c$",
]

[msg.section_0.entries.482]
text = [
  "Whoa! I feel something amazing\\n",
  "with my psychic power!\\c\\n",
  "It has seven arms\\n",
  "and sings loud!\\c$",
]

[msg.section_0.entries.483]
text = [
  "Yawn...\\n",
  "I'm getting sleepy...\\c$",
]

[msg.section_0.entries.484]
text = [
  "Thank you very much!\\n",
  "It was sweet and very yummy.\\c$",
]

[msg.section_0.entries.485]
text = [
  "Delphine: Yawn...\\n",
  "Good...night...\\c$",
]

[msg.section_0.entries.486]
text = [
  "Delphine: Tee hee!\\n",
  "How was my psychic power?\\c\\n",
  "See you again.\\c$",
]

[msg.section_0.entries.487]
text = [
  "A mysterious girl with mysterious power!\\n",
  "Delphine, come on out!\\c$",
]

[msg.section_0.entries.488]
text = [
  "Secrets of Bug-type Pokémon!\\n",
  "I will teach them to you!\\c$",
]

[msg.section_0.entries.489]
text = [
  "You seem to be doing OK, but\\n",
  "when it comes to using Bug-type\\l\\n",
  "Pokémon, I'm second to none!\\c$",
]

[msg.section_0.entries.490]
text = [
  "You seem to be quite a good Trainer!\\c\\n",
  "But I cannot lose in the tournament\\n",
  "for Bug-type Pokémon!\\c$",
]

[msg.section_0.entries.491]
text = [
  "What...?\\n",
  "I can't believe I lost...\\c$",
]

[msg.section_0.entries.492]
text = [
  "The way you use Bug-type Pokémon!\\n",
  "You're still an amateur!\\c$",
]

[msg.section_0.entries.493]
text = [
  "Walter: I can't believe there is\\n",
  "someone who uses Bug-type Pokémon\\l\\n",
  "better than I do...\\c$",
]

[msg.section_0.entries.494]
text = [
  "Walter: Start with a clean slate!\\n",
  "I'll be your opponent anytime!\\c$",
]

[msg.section_0.entries.495]
text = [
  "The person who mastered the secrets!\\n",
  "User of Bug-type Pokémon, Walter!\\c$",
]

[msg.section_0.entries.496]
text = [
  "Booo! ...Kidding!\\n",
  "I'll show you how scary ghosts are!\\c$",
]

[msg.section_0.entries.497]
text = [
  "Oh! There's a ghost behind you!\\c\\n",
  "...Kidding!\\n",
  "The scary part is yet to come!\\c$",
]

[msg.section_0.entries.498]
text = [
  "Ghosts in a haunted house are\\n",
  "cheering for me!\\c\\n",
  "To live up to their grudge,\\n",
  "I won't lose!\\c$",
]

[msg.section_0.entries.499]
text = [
  "Wow! You surprised me!\\n",
  "What a move you used! It was so sudden!\\c$",
]

[msg.section_0.entries.500]
text = [
  "This is the real terror!\\n",
  "Did you sweat with fear?\\c$",
]

[msg.section_0.entries.501]
text = [
  "Ferly: You must be something\\n",
  "to be able to surprise me!\\c$",
]

[msg.section_0.entries.502]
text = [
  "Ferly: Your scream is bread and\\n",
  "butter for me and my ghosts!\\l\\n",
  "I'll surprise you again!\\c$",
]

[msg.section_0.entries.503]
text = [
  "He makes surprises in a haunted\\n",
  "house. The surprise creator, Ferly!\\c$",
]

[msg.section_0.entries.504]
text = [
  "Let's have a battle that won't wound\\n",
  "the dragons' noble pride!\\c$",
]

[msg.section_0.entries.505]
text = [
  "I'll test you to see if you're worthy\\n",
  "of having dragons!\\c$",
]

[msg.section_0.entries.506]
text = [
  "Your noble spirit was accepted\\n",
  "by dragons...\\c\\n",
  "Evidently, you are a worthy opponent\\n",
  "for the final!\\c$",
]

[msg.section_0.entries.507]
text = [
  "This is the end for me... Thank you!\\n",
  "It was a wonderful battle!\\c$",
]

[msg.section_0.entries.508]
text = [
  "You haven't trained enough...\\n",
  "Train your mind.\\c$",
]

[msg.section_0.entries.509]
text = [
  "Drakon: I'm very honored\\n",
  "to be able to fight against\\l\\n",
  "a proud Trainer like you!\\c$",
]

[msg.section_0.entries.510]
text = [
  "Drakon: I won...\\n",
  "I express my respect and appreciation\\l\\n",
  "to our proud dragon!\\c$",
]

[msg.section_0.entries.511]
text = [
  "He was chosen by fierce dragons!\\n",
  "Drakon! He takes off now!\\c$",
]

[msg.section_0.entries.512]
text = [
  "I just came here to battle...\\n",
  "There's nothing to talk about, right?\\c$",
]

[msg.section_0.entries.513]
text = [
  "The next opponent is you...\\n",
  "I'll win anyway.\\l\\n",
  "Let's get it over with, shall we?\\c$",
]

[msg.section_0.entries.514]
text = [
  "Is that all...?\\n",
  "It was disappointingly short.\\c\\n",
  "I looked forward to a little bit more\\n",
  "of a challenging battle...\\c$",
]

[msg.section_0.entries.515]
text = [
  "It can't be... I...\\n",
  "I...\\c$",
]

[msg.section_0.entries.516]
text = [
  "...It's over. Do you understand?\\n",
  "You lost.\\c$",
]

[msg.section_0.entries.517]
text = [
  "Margaret: I... I...\\n",
  "I lost... Ugh...\\c\\n",
  "Ugh... Wa... Waaaaaah!\\c$",
]

[msg.section_0.entries.518]
text = [
  "Margaret: I knew this would happen...\\n",
  "No need to make a big deal out of it.\\c$",
]

[msg.section_0.entries.519]
text = [
  "Margaret! Bounce back all attacks\\n",
  "with your iron heart!\\c$",
]

[msg.section_0.entries.520]
text = [
  "If you choose a dark path,\\n",
  "prepare yourself!\\c$",
]

[msg.section_0.entries.521]
text = [
  "Never do things by halves!\\n",
  "If you go to your dark side,\\l\\n",
  "go all the way!\\c$",
]

[msg.section_0.entries.522]
text = [
  "Don't do the crime\\n",
  "if you can't do the time...\\c\\n",
  "Better to be a good person\\n",
  "than make excuses!\\c$",
]

[msg.section_0.entries.523]
text = [
  "Darkness always loses out... Fine.\\n",
  "That is the way I chose.\\c$",
]

[msg.section_0.entries.524]
text = [
  "Being a good person suits you well.\\n",
  "Don't come close to this side...\\c$",
]

[msg.section_0.entries.525]
text = [
  "Vito: Go!\\n",
  "Go as your heart desires!\\l\\n",
  "Just go!\\c$",
]

[msg.section_0.entries.526]
text = [
  "Vito: The weight of my guilt...\\n",
  "I found \\$1 on the road...\\l\\n",
  "and pocketed it... Ahh!\\c$",
]

[msg.section_0.entries.527]
text = [
  "He sticks to the art of darkness!\\n",
  "Vito! That's his way of life!\\c$",
]

[msg.section_0.entries.528]
text = [
  "Tee hee! I'll torment your\\n",
  "Pokémon now!\\c$",
]

[msg.section_0.entries.529]
text = [
  "I'll torment your Pokémon now!\\n",
  "He he! Entertain me!\\c$",
]

[msg.section_0.entries.530]
text = [
  "Oh, my. Are you trying to beat me?\\n",
  "What an arrogant child!\\c\\n",
  "Fine! I'll make you kneel down\\n",
  "in front of me!\\c$",
]

[msg.section_0.entries.531]
text = [
  "Wh...what?\\n",
  "Could it be... I lost?\\c$",
]

[msg.section_0.entries.532]
text = [
  "There's nothing impressive about you.\\n",
  "Tee hee! Kneel down there!\\c$",
]

[msg.section_0.entries.533]
text = [
  "Impera: Remember me!\\n",
  "Next time when we battle,\\l\\n",
  "I'll be worse on you!\\c$",
]

[msg.section_0.entries.534]
text = [
  "Impera: Did you hear this cheer?\\c\\n",
  "Teee he he he he!\\n",
  "I'm the queen of darkness!\\c$",
]

[msg.section_0.entries.535]
text = [
  "She twists any enemies around\\n",
  "her finger!\\l\\n",
  "The queen of darkness, Impera!\\c$",
]

[msg.section_0.entries.536]
text = [
  "Play fair in a Pokémon battle?\\n",
  "Huh! All I care about is winning!\\c$",
]

[msg.section_0.entries.537]
text = [
  "No matter what Pokémon you use,\\n",
  "I'll exploit your weaknesses\\l\\n",
  "and hold you down!\\c$",
]

[msg.section_0.entries.538]
text = [
  "I've prepared a lot of traps!\\n",
  "I'll do anything to win!\\c\\n",
  "The one who will get the cup\\n",
  "is me!\\c$",
]

[msg.section_0.entries.539]
text = [
  "...Our attacks didn't work?!\\n",
  "You... You're not fair!\\c$",
]

[msg.section_0.entries.540]
text = [
  "Well, well. I still had way more\\n",
  "dirty tricks!\\c$",
]

[msg.section_0.entries.541]
text = [
  "Bonnie: Argh...\\n",
  "That leaves me one choice...\\l\\n",
  "Run!\\c$",
]

[msg.section_0.entries.542]
text = [
  "Bonnie: This is a game.\\n",
  "So, no hard feelings.\\l\\n",
  "See you!\\c$",
]

[msg.section_0.entries.543]
text = [
  "Yeah! What's wrong with being unfair?\\n",
  "This is Bonnie's way!\\c$",
]

[msg.section_0.entries.544]
text = [
  "How unlucky that you have to\\n",
  "battle me in the first round!\\c$",
]

[msg.section_0.entries.545]
text = [
  "You seem to be pretty good,\\n",
  "but your luck ran out when you met me!\\l\\n",
  "I'll win this battle!\\c$",
]

[msg.section_0.entries.546]
text = [
  "I don't think anybody can come this far\\n",
  "by just luck!\\c\\n",
  "Let me see your skill!\\n",
  "I'll go all out, too!\\c$",
]

[msg.section_0.entries.547]
text = [
  "Ugh... This is the end!\\n",
  "You totally overpowered me!\\c$",
]

[msg.section_0.entries.548]
text = [
  "How about that?!\\n",
  "Those are my skills!\\c$",
]

[msg.section_0.entries.549]
text = [
  "X: Tsk!\\n",
  "I was unlucky that I had to battle\\l\\n",
  "against such a strong Trainer like you...\\c$",
]

[msg.section_0.entries.550]
text = [
  "X: Yes, that's right!\\n",
  "I'm the one who'll win\\l\\n",
  "this tournament!\\c$",
]

[msg.section_0.entries.551]
text = [
  "His remarkable skill and knowledge!\\n",
  "Please welcome X!\\c$",
]

[msg.section_0.entries.552]
text = [
  "I'll beat you easily just for a warm-up!\\c$",
]

[msg.section_0.entries.553]
text = [
  "My Pokémon's bodies must've warmed up\\n",
  "by now!\\l\\n",
  "I'll break you off a piece!\\c$",
]

[msg.section_0.entries.554]
text = [
  "I came here just to win the tournament!\\n",
  "I won't lose to someone like you!\\c$",
]

[msg.section_0.entries.555]
text = [
  "It can't be?!\\n",
  "Did my Pokémon lose?\\c$",
]

[msg.section_0.entries.556]
text = [
  "Phew... It was not as easy as I'd thought.\\n",
  "You're pretty good!\\c$",
]

[msg.section_0.entries.557]
text = [
  "Makina: I was being careless...\\n",
  "It won't be like this next time...\\c$",
]

[msg.section_0.entries.558]
text = [
  "Makina: No matter how strong you are,\\n",
  "I can't lose so easily!\\c$",
]

[msg.section_0.entries.559]
text = [
  "Nobody can stop her winning streaks!\\n",
  "Let's go! Makina!\\c$",
]

[msg.section_0.entries.560]
text = [
  "...Are you nervous?\\n",
  "Take a deep breath, and fight.\\c$",
]

[msg.section_0.entries.561]
text = [
  "Your shoulders are tense.\\n",
  "Take a natural attitude,\\l\\n",
  "or you can't show your true ability!\\c$",
]

[msg.section_0.entries.562]
text = [
  "What a great cheer!\\n",
  "Don't be overwhelmed by this atmosphere.\\l\\n",
  "All you have to do is fight as usual!\\c\\n",
  "...Now, bring it on!\\c$",
]

[msg.section_0.entries.563]
text = [
  "I wasn't expecting that...\\n",
  "Well, you outsmarted me.\\c$",
]

[msg.section_0.entries.564]
text = [
  "...What's wrong?\\n",
  "Is that all you've got?\\c$",
]

[msg.section_0.entries.565]
text = [
  "Fidel: You're a quite interesting\\n",
  "Trainer!\\l\\n",
  "I learned a lot from you.\\c$",
]

[msg.section_0.entries.566]
text = [
  "Fidel: You still have a long way to go!\\n",
  "You won't be able to be a Champion\\l\\n",
  "unless you make a much greater effort!\\c$",
]

[msg.section_0.entries.567]
text = [
  "Veteran Fidel!\\n",
  "His experience is his biggest weapon!\\c$",
]

[msg.section_0.entries.568]
text = [
  "Are you ready?\\n",
  "Then, here I come!\\c$",
]

[msg.section_0.entries.569]
text = [
  "I feel this battle will be totally\\n",
  "unpredictable.\\c\\n",
  "...Let's start.\\c$",
]

[msg.section_0.entries.570]
text = [
  "After this match, either you or I\\n",
  "will be the Champion...\\c\\n",
  "No matter who wins, let's have a battle\\n",
  "that we both won't regret!\\c$",
]

[msg.section_0.entries.571]
text = [
  "...That's the way it goes.\\n",
  "I did what I could do.\\c$",
]

[msg.section_0.entries.572]
text = [
  "I'm relieved.\\n",
  "I did it...\\c$",
]

[msg.section_0.entries.573]
text = [
  "Theodora: I have no regrets...\\n",
  "I'm satisfied with the battle.\\c$",
]

[msg.section_0.entries.574]
text = [
  "Theodora: Keep pushing yourself.\\n",
  "I'm sure you'll be a much\\l\\n",
  "greater Trainer.\\c$",
]

[msg.section_0.entries.575]
text = [
  "Her calm judgment is her strength!\\n",
  "Theodora, please show up on the stage!\\c$",
]

[msg.section_0.entries.576]
text = [
  "Oh! You look strong!\\n",
  "Let's start a match now!\\c$",
]

[msg.section_0.entries.577]
text = [
  "I came here to see strong Trainers!\\n",
  "Are you strong?\\c\\n",
  "...Well, it will be clear very soon!\\c$",
]

[msg.section_0.entries.578]
text = [
  "You must be incredibly strong!\\c\\n",
  "Woooow! I'm getting excited!\\n",
  "I feel my energy bursting!\\c$",
]

[msg.section_0.entries.579]
text = [
  "What power!\\n",
  "I didn't expect you'd be this strong...\\c$",
]

[msg.section_0.entries.580]
text = [
  "Is it over already?\\n",
  "Hmmm... That's not enough of a challenge!\\c$",
]

[msg.section_0.entries.581]
text = [
  "Allan: Ah! It was fun!\\n",
  "Please have a battle with me again!\\c$",
]

[msg.section_0.entries.582]
text = [
  "Allan: Get much stronger!\\n",
  "I'll battle you anytime!\\c$",
]

[msg.section_0.entries.583]
text = [
  "It's the martial-arts expert, Allan!\\n",
  "He's seeking strong opponents!\\c$",
]

[msg.section_0.entries.584]
text = [
  "I've trained and trained and trained!\\n",
  "I'll show you my power!\\c$",
]

[msg.section_0.entries.585]
text = [
  "As you'd expect from the\\n",
  "Pokémon World Tournament,\\l\\n",
  "all participants are full of character!\\c$",
]

[msg.section_0.entries.586]
text = [
  "I'll prove that the hard training\\n",
  "I've done so far was not a mistake!\\c$",
]

[msg.section_0.entries.587]
text = [
  "I can't win even after the hard training?\\n",
  "There's always somebody above me!\\c$",
]

[msg.section_0.entries.588]
text = [
  "I won! Yes!\\n",
  "I'm strong, just as I thought!\\c$",
]

[msg.section_0.entries.589]
text = [
  "Jocelyn: You're incredible!\\n",
  "I'll train even more, and someday\\l\\n",
  "I'll be better than you!\\c$",
]

[msg.section_0.entries.590]
text = [
  "Jocelyn: Tee hee!\\n",
  "Your training is not enough yet!\\l\\n",
  "Start afresh!\\c$",
]

[msg.section_0.entries.591]
text = [
  "She'll show us the fruits of her training!\\n",
  "Jocelyn! Unleash your Pokémon!\\c$",
]

[msg.section_0.entries.592]
text = [
  "I will show the public that my research\\n",
  "is right by my victory!\\c$",
]

[msg.section_0.entries.593]
text = [
  "I'll win at any cost to prove that\\n",
  "my Pokémon research is right!\\c$",
]

[msg.section_0.entries.594]
text = [
  "When this match is over,\\n",
  "everyone will know\\l\\n",
  "that my research is right!\\c\\n",
  "Here I come! I won't lose!\\c$",
]

[msg.section_0.entries.595]
text = [
  "...My research of many years...\\n",
  "Was it a waste...?\\c$",
]

[msg.section_0.entries.596]
text = [
  "Wa ha ha! How about that?\\n",
  "This is the result of my research!\\c$",
]

[msg.section_0.entries.597]
text = [
  "Dmitri: No...\\n",
  "My research was not wrong.\\l\\n",
  "You're just superior to me...\\c$",
]

[msg.section_0.entries.598]
text = [
  "Dmitri: Wa ha ha!\\n",
  "My Pokémon's power is not just like this!\\c$",
]

[msg.section_0.entries.599]
text = [
  "Pokémon Professor! Dmitri!\\n",
  "He shows up with his ambition!\\c$",
]

[msg.section_0.entries.600]
text = [
  "Finally, it's time to show off my Pokémon.\\n",
  "I won't lose!\\c$",
]

[msg.section_0.entries.601]
text = [
  "I'll win this battle as well,\\n",
  "and I'll show my Pokémon to everyone!\\c$",
]

[msg.section_0.entries.602]
text = [
  "Wow! This is on TV, right?\\c\\n",
  "This is my Pokémon's TV debut!\\c$",
]

[msg.section_0.entries.603]
text = [
  "Aww... I wanted to let them shine\\n",
  "more in the battle...\\c$",
]

[msg.section_0.entries.604]
text = [
  "This is the Pokémon that I'm proud of!\\n",
  "Please remember it!\\c$",
]

[msg.section_0.entries.605]
text = [
  "Levina: Even though we lost,\\n",
  "it's OK.\\l\\n",
  "I love these Pokémon the best...\\c$",
]

[msg.section_0.entries.606]
text = [
  "Levina: What a cheer!\\n",
  "I wonder if now everybody loves\\l\\n",
  "my Pokémon.\\c$",
]

[msg.section_0.entries.607]
text = [
  "Levina loves her Pokémon!\\n",
  "Her love for Pokémon is second to none!\\c$",
]

[msg.section_0.entries.608]
text = [
  "From now on, it's my time.\\n",
  "Let me battle at my pace!\\c$",
]

[msg.section_0.entries.609]
text = [
  "I won't let your strategy confuse me.\\n",
  "I'll stick to my way\\l\\n",
  "and win this battle!\\c$",
]

[msg.section_0.entries.610]
text = [
  "At last, the final...\\n",
  "I've captured your essence.\\c\\n",
  "If I focus and battle,\\n",
  "I won't lose!\\c$",
]

[msg.section_0.entries.611]
text = [
  "Before I knew it, my pace was set\\n",
  "by you...\\c$",
]

[msg.section_0.entries.612]
text = [
  "The place where you were struggling\\n",
  "just now. That is my world!\\c$",
]

[msg.section_0.entries.613]
text = [
  "Rylan: I lost when I lost\\n",
  "sight of my battle...\\l\\n",
  "What was I doing...?\\c$",
]

[msg.section_0.entries.614]
text = [
  "Rylan: Only people who stick\\n",
  "to their own way will win...\\c$",
]

[msg.section_0.entries.615]
text = [
  "He's doing it his own way!\\n",
  "My way, Rylan! Come on in!\\c$",
]

[msg.section_0.entries.616]
text = [
  "Attention! Show respect!\\n",
  "Let's have a good battle!\\c$",
]

[msg.section_0.entries.617]
text = [
  "Attention! Show respect!\\n",
  "Let's fight fairly and go all out!\\c$",
]

[msg.section_0.entries.618]
text = [
  "Attention! Show respect!\\n",
  "Let's have a good battle.\\c\\n",
  "I'm very happy to be able to\\n",
  "fight against someone like you!\\c$",
]

[msg.section_0.entries.619]
text = [
  "That was a great Pokémon battle.\\n",
  "But...I'm disappointed by myself.\\c$",
]

[msg.section_0.entries.620]
text = [
  "It was a great battle!\\n",
  "Are your Pokémon OK and not hurt?\\c$",
]

[msg.section_0.entries.621]
text = [
  "Destiny: I'm frustrated, but...\\n",
  "It's polite to praise the winner!\\c\\n",
  "...Thank you very much!\\c$",
]

[msg.section_0.entries.622]
text = [
  "Destiny: Thank you very much!\\n",
  "Let's have a battle again!\\c$",
]

[msg.section_0.entries.623]
text = [
  "She begins and ends a battle with\\n",
  "respect. A very polite fighter, Destiny!\\c$",
]

[msg.section_0.entries.624]
text = [
  "I feel that if it's with you, this battle\\n",
  "won't be a simple competition\\l\\n",
  "but a battle where I can ponder\\l\\n",
  "the relationship between\\l\\n",
  "Pokémon and their Trainers.\\c$",
]

[msg.section_0.entries.625]
text = [
  "Do you want to show how strong you\\n",
  "are by winning, or do you want to\\l\\n",
  "learn what battling really means?\\c\\n",
  "Pokémon battles have no meaning if\\n",
  "you don't think about why you battle.\\c\\n",
  "Or better said, it makes battling\\n",
  "together with Pokémon meaningless.\\c$",
]

[msg.section_0.entries.626]
text = [
  "Even if hurt, my Pokémon will fight\\n",
  "for me with just one command.\\c\\n",
  "I think you'll value and trust\\n",
  "your Pokémon more if you keep\\l\\n",
  "that fact close to your heart.\\c\\n",
  "What can I do for these Pokémon?\\n",
  "What should I do?\\c\\n",
  "That's right! I battle with everything\\n",
  "I have to find the ideal relationship\\l\\n",
  "between Pokémon and people!\\c$",
]

[msg.section_0.entries.627]
text = [
  "Thank you!\\c\\n",
  "I feel like I saw a little of\\n",
  "the way toward my ideals.\\c$",
]

[msg.section_0.entries.628]
text = [
  "Even when you lose, your Pokémon\\n",
  "are still brimming with fighting spirit.\\c$",
]

[msg.section_0.entries.629]
text = [
  "Cheren: I'll keep battling many Trainers\\n",
  "and Pokémon like this, and if I can\\l\\n",
  "learn what kind of person I am, it will\\l\\n",
  "open up my path.\\c\\n",
  "I'm sure this path will lead me to become\\n",
  "the person I'm meant to be.\\c\\n",
  "Pokémon will always be with you and me as\\n",
  "we go down our own paths.\\c\\n",
  "Our important friends, Pokémon...\\c$",
]

[msg.section_0.entries.630]
text = [
  "Cheren: Pokémon are by all of our sides--\\n",
  "mine, yours, and each and\\l\\n",
  "every Trainer's!\\c\\n",
  "That's why we move forward!\\n",
  "The Pokémon walking alongside us\\l\\n",
  "give us the strength to do so!\\c$",
]

[msg.section_0.entries.631]
text = [
  "How will he battle with rental Pokémon!\\n",
  "Cheren, what will you do?!\\c$",
]

[msg.section_0.entries.632]
text = [
  "Get ready! I'm gonna knock\\n",
  "some sense outta ya!\\c$",
]

[msg.section_0.entries.633]
text = [
  "Fight with this Pokémon this way...\\n",
  "Use this item that way...\\l\\n",
  "Are you letting others decide that\\l\\n",
  "for you?\\c\\n",
  "Well, whatever, but what's important\\n",
  "is figuring out what you want to do!\\c\\n",
  "Get ready! 'Cause I'm going to knock\\n",
  "the common sense outta you and drag\\l\\n",
  "you into a brand new world!\\c$",
]

[msg.section_0.entries.634]
text = [
  "You don't do anything!\\n",
  "What do you know?!\\c\\n",
  "You don't do anything!\\n",
  "How're you gonna change?!\\c\\n",
  "But, I've got you covered!\\n",
  "I'm gonna give your reason a\\l\\n",
  "toxic shock and open up your mind!\\c$",
]

[msg.section_0.entries.635]
text = [
  "Wild!\\c\\n",
  "Your reason's already\\n",
  "more toxic than mine!$",
]

[msg.section_0.entries.636]
text = [
  "Hey, c'mon! Get serious!\\n",
  "You gotta put more out there!\\c$",
]

[msg.section_0.entries.637]
text = [
  "Roxie: You didn't win... I lost!\\c\\n",
  "I was weak and made my Pokémon\\n",
  "feel how much losing stinks!\\c\\n",
  "Watch out! Next time we meet,\\n",
  "I'm going to give you a toxic shock!\\c$",
]

[msg.section_0.entries.638]
text = [
  "Roxie: Ya can't win 'em all.\\n",
  "It's impossible, seriously!\\c\\n",
  "Trying to look cool every\\n",
  "time you mess up or fail\\l\\n",
  "is totally exhausting!\\c\\n",
  "So you just have to\\n",
  "let it all hang out!\\c$",
]

[msg.section_0.entries.639]
text = [
  "When you have real power, different\\n",
  "rules won't slow you down! Go, Roxie!\\c$",
]

[msg.section_0.entries.640]
text = [
  "Thanks again for your help.\\c\\n",
  "My rental Pokémon are scurrying with\\n",
  "excitement about getting to battle you.\\l\\n",
  "Let's get straight to it!\\c$",
]

[msg.section_0.entries.641]
text = [
  "If the battle brings out the\\n",
  "beauty in Pokémon,\\c\\n",
  "it will be a scene that makes\\n",
  "my heart flutter, win or lose.\\c\\n",
  "Let's get straight to it!\\c$",
]

[msg.section_0.entries.642]
text = [
  "M'hm...\\c\\n",
  "If I win this battle,\\n",
  "I feel like I can draw a\\l\\n",
  "picture unlike any before it.\\c\\n",
  "OK! I can hear my battle\\n",
  "muse loud and clear.\\c\\n",
  "Let's get straight to it!\\c$",
]

[msg.section_0.entries.643]
text = [
  "Is it over?\\n",
  "Has my muse abandoned me?\\c$",
]

[msg.section_0.entries.644]
text = [
  "Wow...\\n",
  "It's beautiful somehow, isn't it...\\c$",
]

[msg.section_0.entries.645]
text = [
  "Burgh: Aww...\\n",
  "I lost.\\c\\n",
  "Whatever! Losing to you doesn't bug me,\\n",
  "because you are a-MAZ-ingly strong!\\c$",
]

[msg.section_0.entries.646]
text = [
  "Burgh: Sometimes I hear people\\n",
  "say something was an ugly win,\\l\\n",
  "but I think if you're trying your best,\\l\\n",
  "any win is beautiful.\\c$",
]

[msg.section_0.entries.647]
text = [
  "This tournament puts your strength\\n",
  "to the test! Burgh, how will you battle?\\c$",
]

[msg.section_0.entries.648]
text = [
  "My rental Pokémon are going\\n",
  "to make your head spin!\\c$",
]

[msg.section_0.entries.649]
text = [
  "I'm me, and Pokémon are Pokémon!\\c\\n",
  "I feel that strongly when I\\n",
  "battle with Pokémon moves,\\l\\n",
  "and that's why I do it.\\c$",
]

[msg.section_0.entries.650]
text = [
  "C'est fini!\\c\\n",
  "When I'm certain of that, I feel an\\n",
  "electric jolt run through my body!\\c\\n",
  "I want to feel that sensation, so, now,\\n",
  "I'm going to make your head spin!\\c$",
]

[msg.section_0.entries.651]
text = [
  "I meant to make your head spin,\\n",
  "but you shocked me instead.$",
]

[msg.section_0.entries.652]
text = [
  "That was unsatisfying somehow...\\n",
  "Will you give it your all next time?\\c$",
]

[msg.section_0.entries.653]
text = [
  "Elesa: My, oh my...\\n",
  "You have a sweet fighting style.\\c$",
]

[msg.section_0.entries.654]
text = [
  "Elesa: You're a shining\\n",
  "star of a Trainer, but\\l\\n",
  "my Pokémon shone brighter!\\c$",
]

[msg.section_0.entries.655]
text = [
  "Bring out the best in Pokémon!\\n",
  "You can do it, Elesa!\\c$",
]

[msg.section_0.entries.656]
text = [
  "Yer tougher than ya were when\\n",
  "I gave ya that Gym Badge, right?\\c\\n",
  "Well, how 'bout we have ourselves\\n",
  "a look and see what ya can do now.\\c$",
]

[msg.section_0.entries.657]
text = [
  "How much stronger ya get comes\\n",
  "from how much you want to win!\\c\\n",
  "Always be loyal to that desire,\\n",
  "ya hear?\\c$",
]

[msg.section_0.entries.658]
text = [
  "If ya want ta win,\\n",
  "don't make excuses! Got it?\\c\\n",
  "If yer gonna bellyache,\\n",
  "just forget 'bout fightin'!\\c\\n",
  "Well, I might be fussin' 'bout\\n",
  "nothing when it comes to you.\\c$",
]

[msg.section_0.entries.659]
text = [
  "Well, I've had enough... And just so you\\n",
  "know, I didn't go easy on you.$",
]

[msg.section_0.entries.660]
text = [
  "It's simple, hear!\\n",
  "I wanted to win more than ya did!\\c$",
]

[msg.section_0.entries.661]
text = [
  "Clay: Fer such a young 'un,\\n",
  "ya have an imposin' battle style.\\c\\n",
  "I wonder what kind a journey ya\\n",
  "had that made ya so strong.\\c\\n",
  "But, I still don't like losin'!\\c$",
]

[msg.section_0.entries.662]
text = [
  "Clay: What's important is\\n",
  "how ya react to losin'.\\c\\n",
  "That's why folks who use losin'\\n",
  "as fuel to get better are tough.\\c$",
]

[msg.section_0.entries.663]
text = [
  "How will he battle with rental Pokémon?\\n",
  "Clay enters the ring!\\c$",
]

[msg.section_0.entries.664]
text = [
  "Why don't you and I have some fun?\\c$",
]

[msg.section_0.entries.665]
text = [
  "What I like is having fun!\\c\\n",
  "I love doing things like flying\\n",
  "in the sky with Pokémon\\l\\n",
  "and bringing out their best!\\c\\n",
  "So, how about you and I\\n",
  "have some fun?\\c$",
]

[msg.section_0.entries.666]
text = [
  "It's finally time for a showdown!\\c\\n",
  "That means the Pokémon battle\\n",
  "that decides who's at the top, right?\\c\\n",
  "I love being on the summit!\\n",
  "'Cause you can see forever\\l\\n",
  "and ever from high places!\\c\\n",
  "So, how about you and I\\n",
  "have some fun?\\c$",
]

[msg.section_0.entries.667]
text = [
  "Being your opponent in battle is a new\\n",
  "source of strength to me. Thank you!$",
]

[msg.section_0.entries.668]
text = [
  "Win or lose, you always gain\\n",
  "something from a battle, right?\\c$",
]

[msg.section_0.entries.669]
text = [
  "Skyla: You're a pretty amazing\\n",
  "Pokémon Trainer, aren't you?\\c\\n",
  "My Pokémon and I are happy,\\n",
  "because for the first time in a while,\\l\\n",
  "we could fight with our full strength.\\c$",
]

[msg.section_0.entries.670]
text = [
  "Skyla: I'm sure I'd have a great\\n",
  "time if I could battle Winona,\\l\\n",
  "the Hoenn Gym Leader, up in the air!\\c$",
]

[msg.section_0.entries.671]
text = [
  "Skyla aims for victory, even with\\n",
  "different teammates!\\c$",
]

[msg.section_0.entries.672]
text = [
  "What I want to find is a young Trainer\\n",
  "who can show me a bright future.\\c$",
]

[msg.section_0.entries.673]
text = [
  "Thinking about aging is thinking\\n",
  "about the time you have left.\\c\\n",
  "Now, since there are\\n",
  "fewer things I can do,\\c\\n",
  "what I want to find is a young Trainer\\n",
  "who can show me a bright future.\\c$",
]

[msg.section_0.entries.674]
text = [
  "What I want to find is a young Trainer\\n",
  "who can show me a bright future.\\c\\n",
  "Let's battle with everything we have:\\n",
  "your skill, my experience, and the love\\l\\n",
  "we've raised our Pokémon with!\\c$",
]

[msg.section_0.entries.675]
text = [
  "This intense feeling that floods\\n",
  "me after a defeat...\\l\\n",
  "I don't know how to describe it.$",
]

[msg.section_0.entries.676]
text = [
  "Harrumph! I know your ability is greater\\n",
  "than that!\\c$",
]

[msg.section_0.entries.677]
text = [
  "Drayden: Wonderful.\\c\\n",
  "I'm grateful we had a chance to meet\\n",
  "and battle.\\c\\n",
  "Make a bright future--not just for\\n",
  "yourself, but for others as well.\\c$",
]

[msg.section_0.entries.678]
text = [
  "Drayden: How unsatisfying!\\c\\n",
  "Promise me that we'll see\\n",
  "each other here once again!\\c$",
]

[msg.section_0.entries.679]
text = [
  "When you have real power, different\\n",
  "rules won't slow you down! Go, Drayden!\\c$",
]

[msg.section_0.entries.680]
text = [
  "You look strong!\\n",
  "Shoots! Let's start!\\c$",
]

[msg.section_0.entries.681]
text = [
  "I'm strong like the ocean's wide.\\n",
  "You're gonna get swept away, fo' sho'.\\c\\n",
  "Eh, that's enough talk! I'll prove it!\\n",
  "Let's get started, 'K?\\c$",
]

[msg.section_0.entries.682]
text = [
  "Oh ho, so I'm facing you!\\n",
  "That's off the wall.\\c\\n",
  "How 'bout you and I make some waves\\n",
  "and sweep the audience away?\\l\\n",
  "Let's leave 'em with even bigger smiles!\\c$",
]

[msg.section_0.entries.683]
text = [
  "You're strong as a gnarly wave\\n",
  "and as nice as a glassy sea.\\c$",
]

[msg.section_0.entries.684]
text = [
  "You're tough, but it's not\\n",
  "enough to sway the sea, 'K!\\c$",
]

[msg.section_0.entries.685]
text = [
  "Marlon: You don't just look\\n",
  "strong--you're strong fo' reals!\\c\\n",
  "Eh, I was swept away, too!\\c$",
]

[msg.section_0.entries.686]
text = [
  "Marlon: The tide comes in an' out,\\n",
  "and in life you win and lose!\\l\\n",
  "What's important is that it keeps goin'.\\c$",
]

[msg.section_0.entries.687]
text = [
  "This tournament puts your strength\\n",
  "to the test! Marlon, how will you battle?\\c$",
]

[msg.section_0.entries.688]
text = [
  "A Pokémon battle with you!\\n",
  "I feel really excited!\\c$",
]

[msg.section_0.entries.689]
text = [
  "When I delivered the Pokémon\\n",
  "to you in Aspertia City,\\l\\n",
  "I never would've imagined then\\l\\n",
  "I'd be battling with you here!\\c\\n",
  "That's right! Pokémon bring us\\n",
  "together like this, don't they?!\\l\\n",
  "Isn't it a-MAZ-ing?\\c$",
]

[msg.section_0.entries.690]
text = [
  "Know what?\\c\\n",
  "When I traveled the Unova region,\\n",
  "so many things happened to me, but\\l\\n",
  "I'm so glad I went on that journey!\\c\\n",
  "I met a lot of Pokémon and\\n",
  "found what I really wanted to do...\\c\\n",
  "It's hard to put into words, but\\n",
  "I want to express this feeling\\l\\n",
  "through my Pokémon.\\c$",
]

[msg.section_0.entries.691]
text = [
  "Phew!\\c\\n",
  "You're really a strong Trainer,\\n",
  "that's for sure!\\c$",
]

[msg.section_0.entries.692]
text = [
  "The Pokémon on both sides\\n",
  "tried sooo hard, didn't they?\\c$",
]

[msg.section_0.entries.693]
text = [
  "Bianca: Thank you for being my\\n",
  "opponent! Yep! I learned a lot!\\c\\n",
  "Know what? Recently, I've been\\n",
  "thinking Pokémon stay by our sides\\l\\n",
  "to bring people together...\\c\\n",
  "I'm thinking of researching that!\\c$",
]

[msg.section_0.entries.694]
text = [
  "Bianca: I love your style\\n",
  "of Pokémon battling!\\c\\n",
  "Somehow, your Pokémon look like\\n",
  "they're having so much fun!\\c$",
]

[msg.section_0.entries.695]
text = [
  "It's the young researcher who always\\n",
  "pursues the truth, Biaaaanca!\\c$",
]

[msg.section_0.entries.696]
text = [
  "The Fire-type scorcher, Chili.\\n",
  "That's me. I will be your opponent!\\c$",
]

[msg.section_0.entries.697]
text = [
  "Yeeeeooow!\\c\\n",
  "Time to play with FIRE!!\\n",
  "I'm the strongest of the brothers!\\c$",
]

[msg.section_0.entries.698]
text = [
  "The final round of the tournament...\\n",
  "Gets you fired up, doesn't it?\\c\\n",
  "Get ready for the Fire-type\\n",
  "scorcher, Chili.\\l\\n",
  "That's me. I will be your opponent!\\c$",
]

[msg.section_0.entries.699]
text = [
  "You got me.\\c\\n",
  "I am...burned...out...\\c$",
]

[msg.section_0.entries.700]
text = [
  "I'm on fire!\\n",
  "Play with me, and you'll get burned!\\c$",
]

[msg.section_0.entries.701]
text = [
  "Chili: Whoa ho! You're on fire!\\c\\n",
  "But you have to hand it to me\\n",
  "for putting up a good fight, right?\\c$",
]

[msg.section_0.entries.702]
text = [
  "Chili: Don't worry about it!\\n",
  "When you play with fire, you get burned!\\c\\n",
  "I mean, c'mon, your opponent was me!\\n",
  "You didn't have a chance!\\c$",
]

[msg.section_0.entries.703]
text = [
  "Chili aims for victory, even with\\n",
  "different teammates!\\c$",
]

[msg.section_0.entries.704]
text = [
  "That is correct!\\c\\n",
  "It shall be my esteemed rental Pokémon\\n",
  "and I that you must face in battle!\\c$",
]

[msg.section_0.entries.705]
text = [
  "What incredible luck for you--you get to\\n",
  "battle the best among the three of us.\\c$",
]

[msg.section_0.entries.706]
text = [
  "Just as water flowing from high\\n",
  "places to low places is natural,\\l\\n",
  "so is my victory.\\c$",
]

[msg.section_0.entries.707]
text = [
  "Lose? Me?\\n",
  "I don't believe this.\\c$",
]

[msg.section_0.entries.708]
text = [
  "This is the appropriate\\n",
  "result when I'm your opponent.\\c$",
]

[msg.section_0.entries.709]
text = [
  "Cress: How amazing!\\c\\n",
  "Even if there were a lot of reasons,\\n",
  "you managed to defeat someone as\\l\\n",
  "impressive as me!\\c$",
]

[msg.section_0.entries.710]
text = [
  "Cress: How amazing!\\c\\n",
  "Even if there were a lot of reasons,\\n",
  "you managed to take on someone as\\l\\n",
  "impressive as me!\\c$",
]

[msg.section_0.entries.711]
text = [
  "How will he battle with rental Pokémon?\\n",
  "Let's find out! Cress, take the stage!\\c$",
]

[msg.section_0.entries.712]
text = [
  "Nothing personal... No hard feelings...\\n",
  "I'm an enthusiast of Grass-type Pokémon,\\l\\n",
  "and I shall be your opponent.\\c$",
]

[msg.section_0.entries.713]
text = [
  "So, um, if you're OK with me, I'll, um,\\n",
  "put everything I've got into being, er,\\l\\n",
  "you know, your opponent.\\c$",
]

[msg.section_0.entries.714]
text = [
  "Nothing personal... No hard feelings...\\n",
  "I'm an enthusiast of Grass-type Pokémon,\\l\\n",
  "and I shall be your opponent.\\c\\n",
  "I'm looking forward to battling with you.\\c$",
]

[msg.section_0.entries.715]
text = [
  "Huh?\\n",
  "Is it over?\\c$",
]

[msg.section_0.entries.716]
text = [
  "Huh?\\n",
  "Did I win?\\c$",
]

[msg.section_0.entries.717]
text = [
  "Cilan: What a surprise...\\n",
  "You are very strong, aren't you?\\c\\n",
  "I guess my brothers wouldn't have\\n",
  "been able to defeat you either...\\c$",
]

[msg.section_0.entries.718]
text = [
  "Cilan: I guess...I suppose I won,\\n",
  "because I've been competing with\\l\\n",
  "my brothers Chili and Cress, and\\l\\n",
  "we all were able to get tougher.\\c$",
]

[msg.section_0.entries.719]
text = [
  "When you have real power, different\\n",
  "rules won't slow you down! Go, Cilan!\\c$",
]

[msg.section_0.entries.720]
text = [

  "heat from this victorious battle!\\c$",
]

[msg.section_0.entries.207]
text = [
  "The hotheaded quiz master, Blaine!\\n",
  "He's all fired up!!\\c$",
]

[msg.section_0.entries.208]
text = [
  "For your insolence, you will feel a\\n",
  "world of pain!\\c$",
]

[msg.section_0.entries.209]
text = [
  "For your insolence, you will feel a\\n",
  "world of pain!\\c$",
]

[msg.section_0.entries.210]
text = [
  "For your insolence, you will feel a\\n",
  "world of pain!\\c$",
]

[msg.section_0.entries.211]
text = [

[msg.section_0.entries.185]
text = [
  "My name is Erika,\\n",
  "and I love Grass-type Pokémon.\\c\\n",
  "So, you're the one who wishes to\\n",
  "challenge me.\\c$",
]

[msg.section_0.entries.186]
text = [
  "My name is Erika,\\n",
  "and I love Grass-type Pokémon.\\c\\n",
  "I have been training myself on\\n",
  "not only flower arrangement\\l\\n",
  "but also Pokémon battle.\\c\\n",
  "I shall not lose.\\c$",
]

[msg.section_0.entries.187]
text = [
  "Oh my!\\n",
  "Looks like I underestimated you...\\c$",
]

[msg.section_0.entries.188]
text = [
  "I was afraid I would doze off...\\c$",
]

[msg.section_0.entries.189]
text = [
  "Erika: I concede defeat...\\c\\n",
  "You are remarkably strong...\\n",
  "That was a delightful match.\\l\\n",
  "I felt inspired.\\c$",
]

[msg.section_0.entries.190]
text = [
  "Erika: I feel inspired by my win.\\n",
  "Fighting alongside your beloved\\l\\n",
  "Pokémon and winning. This is\\l\\n",
  "the joy of being a Pokémon Trainer.\\c$",
]

[msg.section_0.entries.191]
text = [
  "The nature-loving princess, Erika,\\n",
  "has entered the ring!\\c$",
]

[msg.section_0.entries.192]
text = [
  "Three years ago I had a vision of\\n",
  "battling you.\\c$",
]

[msg.section_0.entries.193]
text = [
  "Three years ago I had a vision of\\n",
  "battling you.\\c\\n",
  "I am a psychic after all...\\n",
  "You still want to battle?\\c$",
]

[msg.section_0.entries.194]
text = [
  "Three years ago I had a vision of\\n",
  "battling you.\\c\\n",
  "Since you wish it, I will show you my\\n",
  "psychic powers!\\c$",
]

[msg.section_0.entries.195]
text = [
  "Was the future I saw...wrong?\\c$",
]

[msg.section_0.entries.196]
text = [
  "Just as I foresaw...\\c$",
]

[msg.section_0.entries.197]
text = [
  "Sabrina: Your power...\\n",
  "It far exceeds what I foresaw...\\c\\n",
  "Maybe it isn't possible to fully\\n",
  "predict what the future holds...\\c\\n",
  "Or, perhaps your power is\\n",
  "beyond my psychic ability.\\c$",
]

[msg.section_0.entries.198]
text = [
  "Sabrina: This victory...\\c\\n",
  "It's exactly as I foresaw\\n",
  "three years ago!\\c$",
]

[msg.section_0.entries.199]
text = [
  "The mistress of Psychic-type Pokémon,\\n",
  "Sabrina, elegantly enters the scene!\\c$",
]

[msg.section_0.entries.200]
text = [
  "My fiery Pokémon will\\n",
  "incinerate all challengers!\\c$",
]

[msg.section_0.entries.201]
text = [
  "Whoa hey!\\c\\n",
  "My fiery Pokémon will\\n",
  "incinerate all challengers!\\c$",
]

[msg.section_0.entries.202]
text = [
  "Whoa hey!\\c\\n",
  "My fiery Pokémon will\\n",
  "incinerate all challengers!\\c\\n",
  "Are you ready? Here we go!\\n",
  "Whoa hey!\\c$",
]

[msg.section_0.entries.203]
text = [
  "How could this be?!\\n",
  "My spirit has not been defeated!\\c$",
]

[msg.section_0.entries.204]
text = [
  "Whoa hey!\\n",
  "I'm a raging inferno!\\c$",
]

[msg.section_0.entries.205]
text = [
  "Blaine: Awesome.\\n",
  "I have burned out...\\c\\n",
  "But the fire inside me is\\n",
  "only going to get stronger!\\l\\n",
  "Let's battle again sometime!\\c$",
]

[msg.section_0.entries.206]
text = [
  "Blaine: Whoa hey!\\n",

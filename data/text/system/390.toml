[msg]
trailing_data = "9292"

[msg.section_0.entries.0]
text = [
  "Hi there, [VAR TRNAME(0)]!\\n",
  "I'm Professor Juniper!\\c\\n",
  "Bianca told me you accepted\\n",
  "the Pokédex!\\l\\n",
  "Thank you so much!\\c\\n",
  "Thanks to you, we will all know more about\\n",
  "Pokémon and be able to get along with\\l\\n",
  "them even better!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Hi, Professor Juniper!\\n",
  "It's really interesting over here!\\c\\n",
  "There are sooo many Pokémon we\\n",
  "couldn't prove were here two years ago!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Thank you for going\\n",
  "so far for this errand, Bianca.\\c\\n",
  "And, Cheren, how are you enjoying\\n",
  "being a Gym Leader?\\c$",
]

[msg.section_0.entries.3]
text = [
  "Professor Juniper, it's been a long time.\\n",
  "I'm glad you're doing so well.\\c\\n",
  "The Gym Leader position\\n",
  "is very tough...\\c\\n",
  "If I had my usual partners...\\c$",
]

[msg.section_0.entries.4]
text = [
  "Oh, Cheren...\\c\\n",
  "Having battles that come down to the wire\\n",
  "will make you a Gym Leader who deepens\\l\\n",
  "the bonds between your challengers\\l\\n",
  "and their Pokémon, right?\\c$",
]

[msg.section_0.entries.5]
text = [
  "It'll be fine!\\c\\n",
  "Cheren's a new Gym Leader,\\n",
  "I'm an Assistant Pokémon Professor,\\l\\n",
  "and [VAR TRNAME(0)] is a new Trainer,\\l\\n",
  "but we always have Pokémon by our sides!\\c$",
]

[msg.section_0.entries.6]
text = [
  "That's right, Bianca!\\c\\n",
  "Our world is a world where\\n",
  "we live with Pokémon.\\c\\n",
  "Everyone!\\n",
  "Keep that in mind as you pursue\\l\\n",
  "your dreams with your Pokémon!\\c\\n",
  "Particularly you, [VAR TRNAME(0)]!\\n",
  "The Pokédex may be important, but...\\c\\n",
  "First, enjoy your journey with your\\n",
  "Pokémon to your heart's content!\\c$",
]

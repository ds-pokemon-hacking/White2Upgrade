[msg.section_0.entries.0]
text = [
  "Actress$",
]

[msg.section_0.entries.1]
text = [
  "Girlfriend$",
]

[msg.section_0.entries.2]
text = [
  "[VAR TRNAME(1)]: If it's come to this,\\n",
  "the only thing left to do is try!$",
]

[msg.section_0.entries.3]
text = [
  "[VAR TRNAME(1)]: Maria!$",
]

[msg.section_0.entries.4]
text = [
  "Maria: ...?$",
]

[msg.section_0.entries.5]
text = [
  "[VAR TRNAME(1)]: Maria!\\n",
  "Remember! Please!$",
]

[msg.section_0.entries.6]
text = [
  "Maria: ...\\n",
  "[VAR TRNAME(1)]?$",
]

[msg.section_0.entries.7]
text = [
  "[VAR TRNAME(1)]: Maria...\\n",
  "Are you Maria?!$",
]

[msg.section_0.entries.8]
text = [
  "Maria: ...$",
]

[msg.section_0.entries.9]
text = [
  "[VAR TRNAME(1)]: Wait!\\n",
  "You're Maria, right? Mariaaa!$",
]

[msg.section_0.entries.10]
text = [
  "Smeargle: I'm sorry to bother you while\\n",
  "you're agitated, but do you have a moment?$",
]

[msg.section_0.entries.11]
text = [
  "[VAR TRNAME(1)]: Whoa!\\n",
  "Smeargle talked!$",
]

[msg.section_0.entries.12]
text = [
  "Smeargle: Oh please...\\n",
  "That's a ghost standing in front of you.\\l\\n",
  "Don't you think that compared to that,\\l\\n",
  "a talking Pokémon is pretty tame?$",
]

[msg.section_0.entries.13]
text = [
  "[VAR TRNAME(1)]: A ghost?!\\n",
  "...\\l\\n",
  "That's right... A year ago...\\l\\n",
  "Maria...$",
]

[msg.section_0.entries.14]
text = [
  "Smeargle: She died!\\c\\n",
  "But Maria became a ghost\\n",
  "and came here to meet you!\\c\\n",
  "There was a little accident,\\n",
  "and she lost her memory...$",
]

[msg.section_0.entries.15]
text = [
  "[VAR TRNAME(1)]: Huh?\\n",
  "Ghosts can lose their memories?$",
]

[msg.section_0.entries.16]
text = [
  "Smeargle: Come now...\\n",
  "A Pokémon is talking to you!\\c\\n",
  "Compared to that, a ghost losing\\n",
  "its memory isn't that surprising, right?\\c\\n",
  "More importantly, there isn't much\\n",
  "time, so to get to the point,\\l\\n",
  "please battle with me and Maria!\\c\\n",
  "I'm sure that seeing you in action\\n",
  "will bring back Maria's memory!$",
]

[msg.section_0.entries.17]
text = [
  "[VAR TRNAME(1)]: That's crazy...$",
]

[msg.section_0.entries.18]
text = [
  "Smeargle: Oh! And don't forget to\\n",
  "profess your love during the battle!\\c\\n",
  "If you stir her heart with sweet words,\\n",
  "I'm sure Maria's memory will come\\l\\n",
  "back that much more quickly!\\l\\n",
  "Come now! Let's start the battle!$",
]

[msg.section_0.entries.19]
text = [
  "[VAR TRNAME(1)]: Maria...\\c\\n",
  "(...OK! Well if it's come to this,\\n",
  "I should just say what I feel!...)$",
]

[msg.section_0.entries.20]
text = [
  "[VAR TRNAME(1)]: I need you!$",
]

[msg.section_0.entries.21]
text = [
  "Maria: ...$",
]

[msg.section_0.entries.22]
text = [
  "[VAR TRNAME(1)]: I love you!$",
]

[msg.section_0.entries.23]
text = [
  "Maria: ...Hmm.$",
]

[msg.section_0.entries.24]
text = [
  "[VAR TRNAME(1)]: (...Don't need words...)$",
]

[msg.section_0.entries.25]
text = [
  "Maria: ...?$",
]

[msg.section_0.entries.26]
text = [
  "[VAR TRNAME(1)]: You're my one and only!$",
]

[msg.section_0.entries.27]
text = [
  "Maria: ...$",
]

[msg.section_0.entries.28]
text = [
  "[VAR TRNAME(1)]: Maria!\\n",
  "Hey, do you remember?\\l\\n",
  "It's something you loved!$",
]

[msg.section_0.entries.29]
text = [
  "[VAR TRNAME(1)]: Look, it's [VAR PKNICK(0)].$",
]

[msg.section_0.entries.30]
text = [
  "[VAR TRNAME(1)]: Do you remember [VAR PKNICK(0)]?\\n",
  "You loved it so much!\\c\\n",
  "Maria: ...Mmmmm.$",
]

[msg.section_0.entries.31]
text = [
  "[VAR TRNAME(1)]: It's [VAR TRNAME(1)]!$",
]

[msg.section_0.entries.32]
text = [
  "[VAR TRNAME(1)]: [VAR TRNAME(1)]! The one\\n",
  "you were always so sweet to!\\l\\n",
  "Don't you remember?\\c\\n",
  "Maria: ...?$",
]

[msg.section_0.entries.33]
text = [
  "[VAR TRNAME(1)]: Oh! That's right!\\n",
  "Since we're here,\\l\\n",
  "let's go there!\\c\\n",
  "That's right... That's the only place!\\n",
  "An important place for us!$",
]

[msg.section_0.entries.34]
text = [
  "[VAR TRNAME(1)]: The roller coaster!$",
]

[msg.section_0.entries.35]
text = [
  "Maria: ...I hate it!$",
]

[msg.section_0.entries.36]
text = [
  "[VAR TRNAME(1)]: The teacups!$",
]

[msg.section_0.entries.37]
text = [
  "Maria: Mmmm... Nnnnnggh.$",
]

[msg.section_0.entries.38]
text = [
  "[VAR TRNAME(1)]: The haunted house!$",
]

[msg.section_0.entries.39]
text = [
  "Maria: ...I hate it!$",
]

[msg.section_0.entries.40]
text = [
  "[VAR TRNAME(1)]: The Ferris wheel!$",
]

[msg.section_0.entries.41]
text = [
  "Maria: Mm... Nnnnggggh.$",
]

[msg.section_0.entries.42]
text = [
  "[VAR TRNAME(1)]: Look! It's Attract!\\c\\n",
  "[VAR TRNAME(1)], the guy who fell for you,\\n",
  "is standing right in front of you!\\c\\n",
  "Look, [VAR PKNICK(0)]'s here, too!\\n",
  "Maria, you loved it, right?$",
]

[msg.section_0.entries.43]
text = [
  "Maria: ...?$",
]

[msg.section_0.entries.44]
text = [
  "[VAR TRNAME(1)]: Come on now! Look carefully!\\n",
  "You know [VAR PKNICK(0)], right?$",
]

[msg.section_0.entries.45]
text = [
  "Maria: ...?$",
]

[msg.section_0.entries.46]
text = [
  "[VAR TRNAME(1)]: Come on! What's wrong!\\n",
  "It's me! It's [VAR TRNAME(1)]!$",
]

[msg.section_0.entries.47]
text = [
  "Maria: ...?$",
]

[msg.section_0.entries.48]
text = [
  "[VAR TRNAME(1)]: What's wrong?\\n",
  "Why won't you talk!\\c\\n",
  "If you won't say anything,\\n",
  "I'll grow to hate you!$",
]

[msg.section_0.entries.49]
text = [
  "Maria: ...?$",
]

[msg.section_0.entries.50]
text = [
  "[VAR TRNAME(1)]: I lied...\\c\\n",
  "There is no way I could\\n",
  "ever hate you!\\c\\n",
  "I just couldn't!\\n",
  "I love you!$",
]

[msg.section_0.entries.51]
text = [
  "Maria: Hmm... Mmmmmrhhhgh!$",
]

[msg.section_0.entries.52]
text = [
  "[VAR TRNAME(1)]: OK...\\c\\n",
  "(...I'll decide everything with this!\\n",
  "I'll throw my whole heart at her!...)$",
]

[msg.section_0.entries.53]
text = [
  "[VAR TRNAME(1)]: Come to my world!$",
]

[msg.section_0.entries.54]
text = [
  "Maria: ...$",
]

[msg.section_0.entries.55]
text = [
  "[VAR TRNAME(1)]: I love you!$",
]

[msg.section_0.entries.56]
text = [
  "Maria: Mmm... Mmmmrrgh!$",
]

[msg.section_0.entries.57]
text = [
  "[VAR TRNAME(1)]: I'll give you my life!$",
]

[msg.section_0.entries.58]
text = [
  "Maria: ...?$",
]

[msg.section_0.entries.59]
text = [
  "[VAR TRNAME(1)]: Let's start over!$",
]

[msg.section_0.entries.60]
text = [
  "Maria: Mmm... Mmmmrrrgh!$",
]

[msg.section_0.entries.61]
text = [
  "Maria: ...$",
]

[msg.section_0.entries.62]
text = [
  "Smeargle: OK! Too bad!\\n",
  "This won't work at all, will it?\\c\\n",
  "Simply stated, you're too weak.\\c\\n",
  "At this rate, Maria's memory\\n",
  "will never come back!$",
]

[msg.section_0.entries.63]
text = [
  "[VAR TRNAME(1)]: Please!\\n",
  "Give me another chance!$",
]

[msg.section_0.entries.64]
text = [
  "Smeargle: Well, that's not possible!\\c\\n",
  "If Maria stays in this world too long,\\n",
  "her body will melt and disappear like snow\\l\\n",
  "in the hot sun!\\c\\n",
  "We've already stayed too long,\\n",
  "so we're done for today!\\c\\n",
  "Well, we'll come back tomorrow,\\n",
  "so try your best then!$",
]

[msg.section_0.entries.65]
text = [
  "[VAR TRNAME(1)]: Wait!\\n",
  "Maria! Smeargle!\\c\\n",
  "...$",
]

[msg.section_0.entries.66]
text = [
  "Next thing I knew, I was sitting on\\n",
  "a bench in the amusement park alone...\\c\\n",
  "Was it a dream?\\n",
  "Was it real?\\c\\n",
  "Regardless, I will be coming back to\\n",
  "the amusement park again tomorrow.$",
]

[msg.section_0.entries.67]
text = [
  "Smeargle: My, my, how unfortunate!\\n",
  "We didn't reach a conclusion!\\c\\n",
  "This isn't enough to bring\\n",
  "Maria's memory back!$",
]

[msg.section_0.entries.68]
text = [
  "[VAR TRNAME(1)]: Please!\\n",
  "Battle with me again!$",
]

[msg.section_0.entries.69]
text = [
  "Smeargle: Well, that's not possible!\\c\\n",
  "If Maria stays in this world too long,\\n",
  "her body will melt and disappear like snow\\l\\n",
  "in the hot sun!\\c\\n",
  "We've already stayed too long,\\n",
  "so we're done for today!\\c\\n",
  "Well, we'll come back tomorrow,\\n",
  "so try your best then!$",
]

[msg.section_0.entries.70]
text = [
  "[VAR TRNAME(1)]: Wait!\\n",
  "Maria! Smeargle!\\c\\n",
  "...$",
]

[msg.section_0.entries.71]
text = [
  "Next thing I knew, I was sitting on\\n",
  "a bench in the amusement park alone...\\c\\n",
  "Was it a dream?\\n",
  "Was it real?\\c\\n",
  "Regardless, I will be coming back to\\n",
  "the amusement park again tomorrow.$",
]

[msg.section_0.entries.72]
text = [
  "Smeargle: Oh, so close!\\n",
  "We didn't wrap it up!\\c\\n",
  "Well, we'll continue in\\n",
  "your dream again tomorrow.$",
]

[msg.section_0.entries.73]
text = [
  "[VAR TRNAME(1)]: My dream?$",
]

[msg.section_0.entries.74]
text = [
  "Smeargle: That's right!\\n",
  "You're dreaming!\\l\\n",
  "This is all happening in a dream!\\c\\n",
  "For starters, you and Maria\\n",
  "live together happily in real life!\\c\\n",
  "Oh! You look like you're about to\\n",
  "oversleep, so Maria's coming to wake you!\\c\\n",
  "...$",
]

[msg.section_0.entries.75]
text = [
  "Voice: [VAR TRNAME(1)]! It's morning!\\c\\n",
  "Voice: Come on! Time to get up!\\n",
  "Hurry up, or you'll be late!\\c\\n",
  "...$",
]

[msg.section_0.entries.76]
text = [
  "[VAR TRNAME(1)]: Huh? What?$",
]

[msg.section_0.entries.77]
text = [
  "When I opened my eyes,\\n",
  "I was greeted by Maria's smiling face...\\c\\n",
  "But when I fall asleep, I always\\n",
  "return to that amusement park.\\c\\n",
  "A silent Maria is there with Smeargle,\\n",
  "and a Pokémon battle starts.\\c\\n",
  "Then when I wake up,\\n",
  "a healthy Maria is there...\\c\\n",
  "The same things keep\\n",
  "happening over and over...$",
]

[msg.section_0.entries.78]
text = [
  "Which is real?\\c\\n",
  "Are they both dreams?\\n",
  "Are they both real?\\l\\n",
  "Well, I guess it doesn't matter...\\c\\n",
  "For me, if Maria is by my side...\\c\\n",
  "I'm happy if only that is true...$",
]

[msg.section_0.entries.79]
text = [
  "[VAR TRNAME(1)]: Maria!$",
]

[msg.section_0.entries.80]
text = [
  "Maria: ...\\n",
  "...\\l\\n",
  "[VAR TRNAME(1)]...\\l\\n",
  "[VAR TRNAME(1)]! [VAR TRNAME(1)]!\\l\\n",
  "It's [VAR TRNAME(1)]!$",
]

[msg.section_0.entries.81]
text = [
  "[VAR TRNAME(1)]: You remembered!\\n",
  "Oh, Maria, I'm so happy!\\l\\n",
  "I'm so happy to see you again!\\c\\n",
  "So what happened?\\n",
  "How could you forget me?$",
]

[msg.section_0.entries.82]
text = [
  "Maria: I came back to this world\\n",
  "in order to meet you.\\c\\n",
  "But I was shocked by\\n",
  "how much you've changed...\\c\\n",
  "I don't remember anything\\n",
  "after that...\\c\\n",
  "I never would've imagined\\n",
  "you would turn out like that...$",
]

[msg.section_0.entries.83]
text = [
  "[VAR TRNAME(1)]: I was sad that\\n",
  "you weren't here anymore...\\c\\n",
  "Did I look that bad?$",
]

[msg.section_0.entries.84]
text = [
  "Smeargle: ...\\n",
  "[VAR TRNAME(1)]!\\c\\n",
  "Could it be your memory has\\n",
  "gone blank recently, too?\\c\\n",
  "Is all you have left vague memories\\n",
  "of enjoying this amusement park\\l\\n",
  "with Maria?$",
]

[msg.section_0.entries.85]
text = [
  "[VAR TRNAME(1)]: Um...\\c\\n",
  "...\\c\\n",
  "Actually, I don't remember.\\c\\n",
  "What was I doing?\\n",
  "And yesterday, the day before that...\\l\\n",
  "Why? I can't...\\l\\n",
  "I can't remember anything...$",
]

[msg.section_0.entries.86]
text = [
  "Smeargle: I knew it!\\c\\n",
  "You don't understand\\n",
  "the state you're in...\\c\\n",
  "[VAR TRNAME(1)]... When Maria died,\\n",
  "you took your last breath as well.\\l\\n",
  "It was like you were following her...$",
]

[msg.section_0.entries.87]
text = [
  "[VAR TRNAME(1)]: What?\\n",
  "I'm already dead?$",
]

[msg.section_0.entries.88]
text = [
  "Smeargle: That's right!\\c\\n",
  "You died a long time ago,\\n",
  "but you remained in this world.\\c\\n",
  "You stayed here in the amusement\\n",
  "park, which is full of happy memories,\\l\\n",
  "and wandered around without\\l\\n",
  "remembering what happened.\\c\\n",
  "But dead people can't\\n",
  "stay in this world forever.\\c\\n",
  "If you lose your body and your\\n",
  "memory, you won't be yourself anymore!$",
]

[msg.section_0.entries.89]
text = [
  "[VAR TRNAME(1)]: How can this be?\\n",
  "How do you know all of this?\\l\\n",
  "Smeargle...\\l\\n",
  "What ARE you?$",
]

[msg.section_0.entries.90]
text = [
  "Smeargle: I came here at\\n",
  "Maria's request to rescue\\l\\n",
  "you from wandering.\\c\\n",
  "When Maria came with me and\\n",
  "saw how much you'd changed,\\l\\n",
  "she lost her memory in shock.\\c\\n",
  "And you, who'd lost your memory,\\n",
  "got it back from the shock of\\l\\n",
  "seeing Maria again!\\c\\n",
  "Well six one way, half a dozen the other.\\n",
  "Or we're back where we started!\\l\\n",
  "You two are a perfect match!$",
]

[msg.section_0.entries.91]
text = [
  "[VAR TRNAME(1)]: ...\\n",
  "I see... So that's what happened...$",
]

[msg.section_0.entries.92]
text = [
  "Maria: [VAR TRNAME(1)]...\\n",
  "Let's go...\\c\\n",
  "This world isn't where we\\n",
  "should be anymore...$",
]

[msg.section_0.entries.93]
text = [
  "[VAR TRNAME(1)]: Of course...\\n",
  "I'll go with you, Maria...\\c\\n",
  "I don't know what kind of world it will be.\\n",
  "It seems that it will have strange\\l\\n",
  "things, like Pokémon that talk.\\c\\n",
  "But if I'm already dead,\\n",
  "there's nothing to fear now.$",
]

[msg.section_0.entries.94]
text = [
  "Smeargle: It's not scary at all!\\c\\n",
  "You'll love it!\\n",
  "There's even an amusement park!$",
]

[msg.section_0.entries.95]
text = [
  "[VAR TRNAME(1)]: Ha ha! I see!\\c\\n",
  "But you know what, if I'm with Maria,\\n",
  "any place is fine.$",
]

[msg.section_0.entries.96]
text = [
  "Smeargle: What a hot pair!\\n",
  "OK! You lovely couple!\\c\\n",
  "Let's get going to the world\\n",
  "that isn't here!$",
]

[msg.section_0.entries.97]
text = [
  "And that was how\\n",
  "Maria and I met again...\\c\\n",
  "It looks like we both died,\\n",
  "but my beloved Maria\\l\\n",
  "is smiling sweetly next to me...\\l\\n",
  "I have no regrets...$",
]

[msg.section_0.entries.118]
text = [
  "How're things going over there?\\c\\n",
  "...\\c\\n",
  "Really...\\n",
  "Give me a hand, then!\\c\\n",
  "Go check out Seaside Cave!\\n",
  "That's right! The one on Route 21!\\c\\n",
  "OK! Counting on you!\\c$",
]

[msg.section_0.entries.119]
text = [
  "We're heading down into the Giant Chasm!\\n",
  "I'm not letting Team Plasma get away!\\c$",
]

[msg.section_0.entries.120]
text = [
  "You know the next Pokémon Gym\\n",
  "after Nimbasa City is Driftveil City, right?\\c$",
]

[msg.section_0.entries.121]
text = [
  "Leave it to me! I won't let Team Plasma\\n",
  "escape from Nimbasa City!\\c$",
]

[msg.section_0.entries.122]
text = [
  "You were a big help back there!\\n",
  "Guess Driftveil City's next!\\c$",
]

[msg.section_0.entries.123]
text = [
  "There was one more Team Plasma member.\\n",
  "Hey, go listen to what he has to say!\\c$",
]

[msg.section_0.entries.124]
text = [
  "Brilliant!\\n",
  "Nice work getting the Gym Badge!\\c$",
]

[msg.section_0.entries.125]
text = [
  "It's just a rumor, but I heard\\n",
  "Team Plasma was in Lacunosa Town...\\c$",
]

[msg.section_0.entries.126]
text = [
  "Huh! You even beat Drayden!\\n",
  "You're really something!\\c$",
]

[msg.section_0.entries.127]
text = [
  "Have you beat Marlon yet?\\n",
  "Don't keep me waiting too long!\\c$",
]

[msg.section_0.entries.128]
text = [
  "They were headed for the\\n",
  "Giant Chasm, weren't they?\\c$",
]

[msg.section_0.entries.129]
text = [
  "Come to the sewers!\\n",
  "Let's look for Team Plasma!\\c$",
]

[msg.section_0.entries.130]
text = [
  "OK! Got it!\\n",
  "Waiting in the sewer isn't fun!\\c$",
]

[msg.section_0.entries.131]
text = [
  "You know Celestial Tower?\\c\\n",
  "It's on Route 7!\\n",
  "Go train there if you want!\\c$",
]

[msg.section_0.entries.132]
text = [
  "It's OK! I won't let Team Plasma\\n",
  "escape from Lacunosa Town!\\c\\n",
  "So do whatever you need to prepare!\\c$",
]

[msg.section_0.entries.133]
text = [
  "I don't mean to brag...\\c\\n",
  "But I'm not such a\\n",
  "bad Trainer myself!\\c\\n",
  "And you're even better!\\c\\n",
  "All right! Go and knock around\\n",
  "those chumps at the Pokémon League!\\c$",
]

[msg.section_0.entries.134]
text = [
  "Oh yeah! I'll come meet you. There's\\n",
  "something I want to talk to you about.\\c$",
]

[msg.section_0.entries.135]
text = [
  "Did you like amusement parks?\\n",
  "I forget...\\c$",
]

[msg.section_0.entries.136]
text = [
  "What's up?\\c$",
]

[msg.section_0.entries.137]
text = [
  "Listen...\\c\\n",
  "Make sure you never run out\\n",
  "of Poké Balls!\\c\\n",
  "You never know where you'll\\n",
  "run into what Pokémon!\\c\\n",
  "You have to be ready and believe\\n",
  "an opportunity will come your way!\\c$",
]

[msg.section_0.entries.138]
text = [
  "The only real defeat in\\n",
  "Pokémon battling is giving up.\\c\\n",
  "If you think about why you lost\\n",
  "and compensate for it,\\l\\n",
  "the next time you face a challenge,\\l\\n",
  "you'll improve yourself.\\c\\n",
  "But if you don't do anything,\\n",
  "there's no way you'll win.\\c$",
]

[msg.section_0.entries.139]
text = [
  "Hmm...\\c\\n",
  "It's important to teach people\\n",
  "many things about Pokémon,\\l\\n",
  "but what I really want people to know\\l\\n",
  "is that being with Pokémon is fun!\\c$",
]

[msg.section_0.entries.140]
text = [
  "Truths...\\n",
  "Ideals...\\c\\n",
  "There are as many of these as there\\n",
  "are people...\\c\\n",
  "I'm sure there are even as many\\n",
  "as there are people and\\l\\n",
  "Pokémon together.\\c\\n",
  "That's why you can always say\\n",
  "there must be right answers somewhere.\\c$",
]

[msg.section_0.entries.141]
text = [
  "I stopped wearing glasses,\\n",
  "and Bianca is wearing glasses now...\\c\\n",
  "I hadn't seen her in a long time,\\n",
  "and I was sure surprised when I saw that.\\c$",
]

[msg.section_0.entries.142]
text = [
  "When I was a kid,\\n",
  "I did an experiment where I\\l\\n",
  "wore a blindfold all of the time.\\c\\n",
  "I thought by doing that...\\n",
  "I could train my senses.\\c$",
]

[msg.section_0.entries.143]
text = [
  "Don't you think it's strange that a guy\\n",
  "like me is a Gym Leader!\\c\\n",
  "Oh!\\n",
  "I'm sorry.\\c\\n",
  "Didn't mean to put you\\n",
  "in an awkward position there.\\c$",
]

[msg.section_0.entries.144]
text = [
  "When you don't have self-confidence,\\n",

[msg.section_0.entries.59]
text = [
  "Hi there!\\c$",
]

[msg.section_0.entries.60]
text = [
  "How are things going with the Pokédex?\\c\\n",
  "Sorry, I can't help but ask.\\n",
  "Be sure to enjoy your journey, though!\\c$",
]

[msg.section_0.entries.61]
text = [
  "You get more detailed information\\n",
  "in the Pokédex by catching Pokémon!\\c$",
]

[msg.section_0.entries.62]
text = [
  "Filling up pages in the Pokédex\\n",
  "is very important, but don't forget...\\c\\n",
  "Interacting with Pokémon is a hundred--\\n",
  "even a thousand--times more important!\\c$",
]

[msg.section_0.entries.63]
text = [
  "I'm working with Pokémon Professors\\n",
  "from other regions and trying to solve\\l\\n",
  "the mysteries of Pokémon.\\c\\n",
  "Even with their help,\\n",
  "we can't find every answer.\\c\\n",
  "But, if we learn things little by little,\\n",
  "it may leave clues for the researchers\\l\\n",
  "who follow us.\\c$",
]

[msg.section_0.entries.64]
text = [
  "What can I do to improve the\\n",
  "Pokédex that will make everyone happy?\\c$",
]

[msg.section_0.entries.65]
text = [
  "Looking at you reminds me of when\\n",
  "I was a Backpacker, and it really\\l\\n",
  "motivates me!\\c\\n",
  "That's right! I also traveled the\\n",
  "Unova region with a Pokédex!\\c$",
]

[msg.section_0.entries.66]
text = [
  "I met your mother\\n",
  "when I was a Backpacker!\\c\\n",
  "We got to talking at the\\n",
  "counter in the Pokémon Center,\\l\\n",
  "and a huge line formed behind me!\\c$",
]

[msg.section_0.entries.67]
text = [
  "I'm sure there are still Pokémon\\n",
  "that no one in the world has seen!\\c\\n",
  "Doesn't just imagining them make\\n",
  "you excited?\\c$",
]

[msg.section_0.entries.68]
text = [
  "Dream big!\\c\\n",
  "I want to see every\\n",
  "Pokémon in the world!\\c$",
]

[msg.section_0.entries.69]
text = [
  "In order to get along with others,\\n",
  "you must be understanding and accepting.\\c\\n",
  "I mean, Pokémon and people live\\n",
  "by different rules!\\c\\n",
  "If we just push our expectations on them,\\n",
  "there's no way it will go well.\\c$",
]

[msg.section_0.entries.70]
text = [
  "OK, then! Take care.\\n",
  "Bye-bye!\\c$",
]

[msg.section_0.entries.71]
text = [
  "Yeah?\\c$",
]

[msg.section_0.entries.72]
text = [
  "You have to protect what's important\\n",
  "to you on your own!\\c$",
]

[msg.section_0.entries.73]
text = [
  "People who are strong in Pokémon\\n",
  "battles aren't automatically right.\\c\\n",
  "But losers don't even have a leg\\n",
  "to stand on, know what I mean?\\c$",
]

[msg.section_0.entries.74]
text = [
  "When it's night\\n",
  "and everything's quiet...\\c\\n",
  "If you listen carefully,\\n",
  "you can hear the footsteps of Pokémon.\\c\\n",
  "I really like that.\\c$",
]

[msg.section_0.entries.75]
text = [
  "If you believe in yourself\\n",
  "and have Pokémon by your side,\\l\\n",
  "even being lost is fun!\\c$",
]

[msg.section_0.entries.76]
text = [
  "I'm thinking about what Pokémon\\n",
  "I should have to make up for\\l\\n",
  "my other Pokémon's weaknesses.\\c$",
]

[msg.section_0.entries.77]
text = [
  "I don't care what the reason is.\\n",
  "If you take other people's stuff,\\l\\n",
  "you're nothing more than a dirty thief!\\c$",
]

[msg.section_0.entries.78]
text = [
  "I like spending time thinking\\n",
  "about how to raise my Pokémon\\l\\n",
  "and make them stronger.\\c$",
]

[msg.section_0.entries.79]
text = [
  "I guess if I had to pick a trait I prefer,\\n",
  "I like Pokémon that are fast...\\c$",
]

[msg.section_0.entries.80]
text = [
  "Hey, sorry!\\n",
  "There's something I want to do right now!\\c$",
]

[msg.section_0.entries.81]
text = [
  "Um...\\n",
  "I don't have much to say right now.\\c$",
]

[msg.section_0.entries.82]
text = [
  "See ya!\\c$",
]

[msg.section_0.entries.83]
text = [
  "Where am I now?\\c\\n",
  "I'm searching every corner of\\n",
  "Castelia City for Team Plasma!\\c\\n",
  "You haven't found them either, right?\\n",
  "We HAVE to find them!\\c\\n",
  "Got it?!\\c$",
]

[msg.section_0.entries.84]
text = [
  "The sewers, huh...\\c\\n",
  "If Team Plasma's hiding there,\\n",
  "we have to find them.\\c\\n",
  "Otherwise, I'm sure they'll cause trouble\\n",
  "for the Pokémon living there.\\c$",
]

[msg.section_0.entries.85]
text = [
  "Thanks for helping back there!\\c\\n",
  "I'm going to keep looking for\\n",
  "Team Plasma in Castelia City.\\c\\n",
  "Why don't you head to the Pokémon Gym?\\c$",
]

[msg.section_0.entries.86]
text = [
  "You won the Insect Badge from\\n",
  "the Castelia City Pokémon Gym?\\c\\n",
  "Well then, you should go to\\n",
  "Nimbasa City and take on\\l\\n",
  "the Gym Leader there!\\c$",
]

[msg.section_0.entries.87]
text = [
  "What do you want?\\c\\n",
  "Have you challenged the\\n",
  "Driftveil City Pokémon Gym yet?\\c\\n",
  "If you haven't yet, just go already!\\c\\n",
  "Hey, apparently the Gym Leader\\n",
  "uses Ground-type Pokémon!\\c$",
]

[msg.section_0.entries.88]
text = [
  "Clay just told you to participate\\n",
  "in the Driftveil Tournament, right?\\c\\n",
  "I hear the tournament takes place\\n",
  "to the south of Driftveil City!\\c$",
]

[msg.section_0.entries.89]
text = [
  "The Pokémon World Tournament!\\c\\n",
  "A Trainer who wins on the first try\\n",
  "must be really good!\\c$",
]

[msg.section_0.entries.90]
text = [
  "No matter what kind of tournament\\n",
  "it is, winning's impressive!\\c$",
]

[msg.section_0.entries.91]
text = [
  "It's Team Plasma!\\c\\n",
  "There's a suspicious-looking ship\\n",
  "docked in the area south of the\\l\\n",
  "Pokémon World Tournament arena!\\c\\n",
  "Meet me there!\\c$",
]

[msg.section_0.entries.92]
text = [
  "Hey, how nice!\\n",
  "We're having a nice friendly chat!\\l\\n",
  "At a time like this...\\c\\n",
  "Get off the Xtransceiver already!\\c$",
]

[msg.section_0.entries.93]
text = [
  "Actually...\\c\\n",
  "You're strong enough that\\n",
  "you can probably even beat\\l\\n",
  "Mistralton City's Gym Leader.\\c\\n",
  "Well, I've already won my\\n",
  "Jet Badge, though!\\c$",
]

[msg.section_0.entries.94]
text = [
  "I've got one word for you...\\c\\n",
  "Reversal Mountain.\\c\\n",
  "Oh, wait, that's two words...\\c$",
]

[msg.section_0.entries.95]
text = [
  "Are you somewhere near Undella Town now?\\c\\n",
  "Maybe I'll go there and battle with you.\\c\\n",
  "It's been a while!\\c$",
]

[msg.section_0.entries.96]
text = [
  "Opelucid City's Gym Leader\\n",
  "was really tough!\\c$",
]

[msg.section_0.entries.97]
text = [
  "Good! You're OK!\\c\\n",
  "I'm in Humilau City,\\n",
  "so I can't get there right away,\\l\\n",
  "but I'm sure you can handle it!\\c$",
]

[msg.section_0.entries.98]
text = [
  "I'm looking for Team Plasma,\\n",
  "but I can't find a trace of them!\\c\\n",
  "Go to Humilau City.\\n",
  "The Gym Leader's named Marlon.\\l\\n",
  "Hurry up and go beat him!\\c$",
]

[msg.section_0.entries.99]
text = [
  "Didn't I just tell you?!\\c\\n",
  "Let's split up and look\\n",
  "for the Plasma Frigate!\\l\\n",
  "You check Route 22!\\c$",
]

[msg.section_0.entries.100]
text = [
  "...\\c\\n",
  "Why would you think this would be a good\\n",
  "time to chat on the Xtransceiver?!\\c$",
]

[msg.section_0.entries.101]
text = [
  "The Pokémon League is\\n",
  "just past Victory Road.\\c\\n",
  "Victory Road itself is\\n",
  "just beyond Route 23!\\c$",
]

[msg.section_0.entries.102]
text = [
  "Hm... So you're on\\n",
  "Victory Road.\\c\\n",
  "Then you're almost to the\\n",
  "Pokémon League!\\c$",
]

[msg.section_0.entries.103]
text = [
  "Don't worry about me!\\c\\n",
  "You're at the Pokémon League, right?\\n",
  "The only thing you need to think about\\l\\n",
  "is winning!\\c$",
]

[msg.section_0.entries.104]
text = [
  "I'm in Undella Town.\\n",
  "If you're bored, come hang out.\\c$",
]

[msg.section_0.entries.105]
text = [
  "I'm in Driftveil City.\\c\\n",
  "If you have time, head over.\\n",
  "I'll spar with you.\\c$",
]

[msg.section_0.entries.106]
text = [
  "I'm still in Driftveil City.\\c\\n",
  "You can just do what you want\\n",
  "to do, you know?\\c$",
]


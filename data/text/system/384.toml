[msg.section_0.entries.31]
text = [
  "You and [VAR PKNICK(1)]...\\n",
  "You aren't getting along, are you?\\c\\n",
  "It doesn't look like it's having\\n",
  "fun even when you're together.\\c$",
]

[msg.section_0.entries.32]
text = [
  "You and [VAR PKNICK(1)]...\\n",
  "You aren't getting along, are you?\\c\\n",
  "It's glaring at you with\\n",
  "a look that's kinda scary.\\c$",
]

[msg.section_0.entries.33]
text = [
  "You and [VAR PKNICK(1)]...\\n",
  "You still have room for improvement.\\c\\n",
  "How nice! I mean, you can\\n",
  "become even better friends!\\c$",
]

[msg.section_0.entries.34]
text = [
  "You and [VAR PKNICK(1)]...\\n",
  "You're starting to get to be friends.\\c\\n",
  "Just maybe, walking along the same path\\n",
  "has made you understand one another.\\c$",
]

[msg.section_0.entries.35]
text = [
  "You and [VAR PKNICK(1)]...\\n",
  "You seem really close!\\c\\n",
  "You look so, so happy!\\n",
  "It's enough to make me happy, too!\\c$",
]

[msg.section_0.entries.36]
text = [
  "You and [VAR PKNICK(1)]...\\n",
  "You two sure get along great!\\c\\n",
  "It looks like you are having fun being\\n",
  "together! You seem bright and cheerful!\\c$",
]

[msg.section_0.entries.37]
text = [
  "You and [VAR PKNICK(1)]...\\n",
  "What great friends you are!\\c\\n",
  "It's so nice how you trust each other!\\n",
  "It makes me kinda jealous!\\c$",
]


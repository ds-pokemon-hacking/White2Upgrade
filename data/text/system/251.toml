[msg.section_0.entries.0]
text = [
  "Veteran Star$",
]

[msg.section_0.entries.1]
text = [
  "Haunted Man$",
]

[msg.section_0.entries.2]
text = [
  "[VAR PKNICK(0)]: First, I have to deal with the\\n",
  "Pokémon that the man is setting on me...$",
]

[msg.section_0.entries.3]
text = [
  "[VAR PKNICK(0)]: The air is so heavy...\\n",
  "If I don't end this quickly,\\l\\n",
  "I'll be in danger of being possessed!$",
]

[msg.section_0.entries.4]
text = [
  "[VAR PKNICK(0)]: Augh...\\n",
  "M-my arms! My legs...$",
]

[msg.section_0.entries.5]
text = [
  "[VAR PKNICK(0)]: I can feel a heavy presence...\\n",
  "It's more than I can fathom...$",
]

[msg.section_0.entries.6]
text = [
  "Kadath: PHNNNGLLLUUI...$",
]

[msg.section_0.entries.7]
text = [
  "[VAR PKNICK(0)]: It looks like...\\n",
  "Is he...totally possessed?$",
]

[msg.section_0.entries.8]
text = [
  "Kadath: WHO ARE YOU?$",
]

[msg.section_0.entries.9]
text = [
  "[VAR PKNICK(0)]: ...\\c\\n",
  "(...Who's speaking?...)\\n",
  "(...Th-the one possessing him?...)$",
]

[msg.section_0.entries.10]
text = [
  "[VAR PKNICK(0)]: I'm gonna take you down!$",
]

[msg.section_0.entries.11]
text = [
  "Kadath: CURSES ON YOU, ENEMY!$",
]

[msg.section_0.entries.12]
text = [
  "[VAR PKNICK(0)]: I'll mourn your passing.$",
]

[msg.section_0.entries.13]
text = [
  "Kadath: MGGGLWNAAAFH...$",
]

[msg.section_0.entries.14]
text = [
  "[VAR PKNICK(0)]: Aieeeeeek! S-scary!$",
]

[msg.section_0.entries.15]
text = [
  "Kadath: WGAH...\\n",
  "YOU LOOK WEAK... PITIFUL...\\l\\n",
  "YOUR END IS NIGH...$",
]

[msg.section_0.entries.16]
text = [
  "Kadath: IA, IA...\\n",
  "DO YOU KNOW WHAT DISTURBS USSS...?\\l\\n",
  "DO YOU KNOW WHY WE ARE HERE...?$",
]

[msg.section_0.entries.17]
text = [
  "[VAR PKNICK(0)]: ...\\c\\n",
  "(...What disturbs them? Why here?...)\\n",
  "(...Maybe I know. Maybe it's...)$",
]

[msg.section_0.entries.18]
text = [
  "[VAR PKNICK(0)]: You afraid of something?$",
]

[msg.section_0.entries.19]
text = [
  "Kadath: FHTAGN...\\n",
  "DO NOT UNDERESTIMATE USSSS...$",
]

[msg.section_0.entries.20]
text = [
  "[VAR PKNICK(0)]: So, are you...angry?$",
]

[msg.section_0.entries.21]
text = [
  "Kadath: WGAHHHH!\\n",
  "I SHALL POUR MY WRATH UPON YOU!$",
]

[msg.section_0.entries.22]
text = [
  "[VAR PKNICK(0)]: Worried about something?$",
]

[msg.section_0.entries.23]
text = [
  "Kadath: NAGLLL...\\n",
  "NAGL... NAAAAAGL!$",
]

[msg.section_0.entries.24]
text = [
  "Kadath: WGAHHH...\\n",
  "GLUI... WAGLUIUIUI...\\l\\n",
  "WE ARE WORRIED ABOUT A GIRRRRL...\\l\\n",
  "I HAVE A...FAVOR TO ASK...\\l\\n",
  "Ahhhhhh...\\l\\n",
  "H-h-help...$",
]

[msg.section_0.entries.25]
text = [
  "[VAR PKNICK(0)]: What's going on?$",
]

[msg.section_0.entries.26]
text = [
  "Kadath: H-help...\\n",
  "Help me!$",
]

[msg.section_0.entries.27]
text = [
  "[VAR PKNICK(0)]: ...\\c\\n",
  "(...Did the possessed person\\n",
  "regain consciousness?...)$",
]

[msg.section_0.entries.28]
text = [
  "Kadath: P-please...\\n",
  "Drive...these ghosts away!\\c\\n",
  "My beloved daughter has been\\n",
  "possessed by these ghosts...$",
]

[msg.section_0.entries.29]
text = [
  "[VAR PKNICK(0)]: Hm...\\n",
  "(...Two conflicting stories...)\\c\\n",
  "(...Which one should I believe?...)\\n",
  "(...What should I do?...)$",
]

[msg.section_0.entries.30]
text = [
  "[VAR PKNICK(0)]: I am--a Ghost Eraser!$",
]

[msg.section_0.entries.31]
text = [
  "Kadath: P-p-please...\\n",
  "WAHH GLLEUHHH...\\l\\n",
  "YOUR END IS NIGH!$",
]

[msg.section_0.entries.32]
text = [
  "[VAR PKNICK(0)]: I'll mourn your passing.$",
]

[msg.section_0.entries.33]
text = [
  "Kadath: P-p-please...\\n",
  "RRRRLYEHHH...\\l\\n",
  "PHNNGLLUI... YOUR END IS NIGH.$",
]

[msg.section_0.entries.34]
text = [
  "[VAR PKNICK(0)]: I'll ask the ghosts!$",
]

[msg.section_0.entries.35]
text = [
  "Kadath: Wh-what...are you saying?\\n",
  "Ahhhh...\\c\\n",
  "...\\n",
  "RYGLEUHHH... WILL YOU LISTEN TO USSS?$",
]

[msg.section_0.entries.36]
text = [
  "[VAR PKNICK(0)]: You're both liars!$",
]

[msg.section_0.entries.37]
text = [
  "Kadath: Ahhhhh...\\n",
  "It's not a lie. Aiiiee...\\l\\n",
  "FHTAAAGN...\\l\\n",
  "RLYEH... YOU DON'T BELIEVE...$",
]

[msg.section_0.entries.38]
text = [
  "Kadath: YOUR MIND IS STRONG...$",
]

[msg.section_0.entries.39]
text = [
  "[VAR PKNICK(0)]: Tell me what's happening!$",
]

[msg.section_0.entries.40]
text = [
  "Kadath: THIS MAN'S DAUGHTER...\\n",
  "SHE HAS A MYSTERIOUS POWER.\\l\\n",
  "SHE CAN UNDERSTAND USSS...\\c\\n",
  "THERE IS KINDNESS IN HER HEART.\\n",
  "SHE SPEAKS GENTLY TO USSSSS.\\c\\n",
  "...AND SHE KEEPS OUR RESTING PLACE TIDY.$",
]

[msg.section_0.entries.41]
text = [
  "[VAR PKNICK(0)]: Is there someone...\\n",
  "Someone possessed by a ghost?\\l\\n",
  "Do you want to help this person?$",
]

[msg.section_0.entries.42]
text = [
  "Kadath: SOMETHING NOTICED HER POWER...\\c\\n",
  "SHE HAS BEEN POSSESSED BY SOMETHING.\\n",
  "WE DO NOT KNOW WHAT IT IS...\\c\\n",
  "IT...IS SCARY.\\c\\n",
  "WE ARE NO MATCH FOR THIS SOMETHING.\\n",
  "THAT IS THE REASON FOR OUR DISTURBANCE.\\c\\n",
  "WE WERE TRYING TO BRING IN SOMEONE STRONG\\n",
  "TO HELP USSSS...$",
]

[msg.section_0.entries.43]
text = [
  "Addendum to\\n",
  "“Ghost Eraser Case Files: File No. 001\\\":\\c\\n",
  "Things look...tidy at the village graveyard.\\n",
  "But I have encountered information on a\\l\\n",
  "separate case...of great concern.\\l\\n",
  "I continue to investigate.\\c\\n",
  "--Code name: [VAR PKNICK(0)]$",
]

[msg.section_0.entries.44]
text = [
  "[VAR PKNICK(0)]: Oh no!\\n",
  "I think I've been possessed by something!\\c\\n",
  "Eeegh!\\n",
  "I can't move!$",
]

[msg.section_0.entries.45]
text = [
  "Kadath: YOUR BODY IS MOST SUITABLE.\\c\\n",
  "I SHALL TAKE OVER YOUR BODY...\\n",
  "I DON'T NEED YOUR SPIRIT.\\c\\n",
  "...$",
]

[msg.section_0.entries.46]
text = [
  "[VAR PKNICK(0)]: Eeeeegh!\\n",
  "...$",
]

[msg.section_0.entries.47]
text = [
  "[VAR PKNICK(0)]'s voice: HELP ME...\\n",
  "CAN'T ANYONE HEAR ME?\\c\\n",
  "HELP ME... HELP ME...\\n",
  "HELP...ME...\\c\\n",
  "...\\c\\n",
  "...MY HEAD IS GETTING FOGGY.\\n",
  "WHY DID THIS H-HAPPEN TO ME?\\c\\n",
  "UHHH... WHO AM I-I-I-I-I-I...?$",
]

[msg.section_0.entries.48]
text = [
  "Addendum to\\n",
  "“Ghost Eraser Case Files: File No. 001\\\":\\c\\n",
  "After the case report was filed, we lost\\n",
  "contact with code name [VAR PKNICK(0)].\\c\\n",
  "She's still missing...$",
]

[msg.section_0.entries.49]
text = [
  "[VAR PKNICK(0)]: Oh no!\\n",
  "I think I've been possessed by something!\\c\\n",
  "Eeegh!\\n",
  "I can't move!$",
]

[msg.section_0.entries.50]
text = [
  "Kadath: YOUR BODY IS MOST SUITABLE.\\c\\n",
  "I SHALL TAKE OVER YOUR BODY...\\n",
  "I SHALL KEEP YOUR SPIRIT AS WELL.\\c\\n",
  "...$",
]

[msg.section_0.entries.51]
text = [
  "[VAR PKNICK(0)]: Eeeeegh!\\n",
  "...$",
]

[msg.section_0.entries.52]
text = [
  "[VAR PKNICK(0)]: UGHAGHA... THE DISTURBANCE IN\\n",
  "THE VILLAGE IS NOT REAL. I MUST REPORT...\\c\\n",
  "THE VILLAGE IS...COMFORTABLE...AND SAFE...\\n",
  "THE SCENERY IS GREAT AND THE AIR IS FRESH.\\c\\n",
  "WE DO NOT NEED ANY NUISANCE PEOPLE\\n",
  "COMING TO INVESTIGATE THE VILLAGE...$",
]

[msg.section_0.entries.53]
text = [
  "Addendum to\\n",
  "“Ghost Eraser Case Files: File No. 001\\\":\\c\\n",
  "The so-called ghostly disturbance was\\n",
  "all nonsense. Lately, there have been a\\l\\n",
  "number of false reports. Please be aware.\\c\\n",
  "...Confirming the village is safe and\\n",
  "comfortable. The scenery is also great...$",
]

[msg.section_0.entries.54]
text = [
  "[VAR PKNICK(0)]: ...$",
]

[msg.section_0.entries.55]
text = [
  "Kadath: ...\\n",
  "FTHAGGHH... WHAT TROUBLES YOU?\\l\\n",
  "YOUR FACE IS ALL SQUINCHED UP...$",
]

[msg.section_0.entries.56]
text = [
  "[VAR PKNICK(0)]: You!\\n",
  "It's so obvious that you're lying!\\l\\n",
  "Quit making a fool of yourself.\\c\\n",
  "You're not possessed at all, are you?$",
]

[msg.section_0.entries.57]
text = [
  "Kadath: ...\\c\\n",
  "Oopsie... You figured it out?\\n",
  "Aiiieee! Sooo-rrrry!$",
]

[msg.section_0.entries.58]
text = [
  "[VAR PKNICK(0)]: Oh, come on.\\n",
  "It was obvious from the beginning.$",
]

[msg.section_0.entries.59]
text = [
  "Kadath: Oh, really?\\n",
  "I thought I totally had you tricked!$",
]

[msg.section_0.entries.60]
text = [
  "[VAR PKNICK(0)]: Sigh...\\c\\n",
  "What made you cause so much trouble?$",
]

[msg.section_0.entries.61]
text = [
  "Kadath: Well...\\n",
  "I have a serious reason for my actions.\\c\\n",
  "The truth is my wife works for\\n",
  "the tourist office in the village.\\c\\n",
  "She said we needed to get this place on the\\n",
  "map! It's a dull village--not attracting any\\l\\n",
  "tourists at all.\\l\\n",
  "She even cried about it.$",
]

[msg.section_0.entries.62]
text = [
  "She nearly had a breakdown, but then she\\n",
  "had a wonderful idea! She said we could use\\l\\n",
  "ghost stories to get tourists interested.\\c\\n",
  "She got so excited about her idea that\\n",
  "nobody was able to talk sense into her.\\c\\n",
  "Me... I couldn't say no to her.\\c\\n",
  "I'm so sorry!\\n",
  "Please forgive my foolishness!$",
]

[msg.section_0.entries.63]
text = [
  "[VAR PKNICK(0)]: You--\\n",
  "You deliberately deceived a Ghost Eraser.\\c\\n",
  "Don't bother asking for forgiveness.\\n",
  "You and your wife will report to our\\l\\n",
  "office immediately!\\c\\n",
  "I doubt you'll get away with\\n",
  "just a warning.$",
]

[msg.section_0.entries.64]
text = [
  "Kadath: Waaaaah!\\n",
  "But--it was my wife's fault! Not meeee!$",
]

[msg.section_0.entries.65]
text = [
  "...\\c\\n",
  "Addendum to\\n",
  "“Ghost Eraser Case Files: File No. 001\\\":\\c\\n",
  "The ghost story was faked.\\n",
  "Lately, there have been a number of\\l\\n",
  "false reports. Please be aware.\\c\\n",
  "--Code name: [VAR PKNICK(0)]$",
]

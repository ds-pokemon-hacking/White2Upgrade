[msg.section_0.entries.0]
text = [
  "New Actress$",
]

[msg.section_0.entries.1]
text = [
  "Weird Light$",
]

[msg.section_0.entries.2]
text = [
  "???: Grrrroooo...$",
]

[msg.section_0.entries.3]
text = [
  "???: Grrrroooo...\\n",
  "You're quite good...$",
]

[msg.section_0.entries.4]
text = [
  "???: Grrrroooo...\\n",
  "Are you stubborn or patient...?$",
]

[msg.section_0.entries.5]
text = [
  "???: Grrrroooo...\\n",
  "Are you proud of just physical strength?$",
]

[msg.section_0.entries.6]
text = [
  "???: Grrrroooo...\\n",
  "It's about time...$",
]

[msg.section_0.entries.7]
text = [
  "[VAR TRNAME(1)]: Oh!\\n",
  "That light...$",
]

[msg.section_0.entries.8]
text = [
  "???: ...$",
]

[msg.section_0.entries.9]
text = [
  "Radio: Hey! Can you hear me?\\n",
  "Respond, [VAR TRNAME(1)]!\\c\\n",
  "Quickly now!\\n",
  "Report the current situation!$",
]

[msg.section_0.entries.10]
text = [
  "[VAR TRNAME(1)]: R-roger!\\c\\n",
  "I confirmed the existence of\\n",
  "a gigantic Tyranitar ahead!\\c\\n",
  "It seems to be the Titanic Tyranitar\\n",
  "that appeared before...\\c\\n",
  "There's also a mysterious light\\n",
  "in front of me...$",
]

[msg.section_0.entries.11]
text = [
  "Radio: A mysterious light?\\c\\n",
  "I can't see anything\\n",
  "from the monitor here!\\c\\n",
  "Have you gotten enough sleep?\\n",
  "Maybe your eyes are just tired...$",
]

[msg.section_0.entries.12]
text = [
  "[VAR TRNAME(1)]: Whoa!$",
]

[msg.section_0.entries.13]
text = [
  "???: Grrrroooo... You've come...\\n",
  "[VAR TRNAME(1)]...$",
]

[msg.section_0.entries.14]
text = [
  "Radio: What happened, [VAR TRNAME(1)]?$",
]

[msg.section_0.entries.15]
text = [
  "[VAR TRNAME(1)]: In... In front of my eyes!\\c\\n",
  "There's a human shape!\\n",
  "In the mysterious light!\\l\\n",
  "It's floating! It's glowing!$",
]

[msg.section_0.entries.16]
text = [
  "Radio: Zz... What?!\\c\\n",
  "[VAR TRNAME(1)]! Zz... I can't hear you!\\c\\n",
  "...Respond!\\c\\n",
  "Zzzzz... Zzzzz...$",
]

[msg.section_0.entries.17]
text = [
  "???: Grrrroooo...\\c\\n",
  "For now... I only need you...$",
]

[msg.section_0.entries.18]
text = [
  "[VAR TRNAME(1)]: What...what is this\\n",
  "all about...?$",
]

[msg.section_0.entries.19]
text = [
  "???: Grrrroooo...\\c\\n",
  "The time left is limited...\\n",
  "Show me your power...$",
]

[msg.section_0.entries.20]
text = [
  "???: Grrrroooo...\\c\\n",
  "Now, [VAR TRNAME(1)]...\\n",
  "Show me your power...$",
]

[msg.section_0.entries.21]
text = [
  "[VAR TRNAME(1)]: Wait a minute!\\n",
  "Why do we have to fight?\\c\\n",
  "Who are you, anyway?!$",
]

[msg.section_0.entries.22]
text = [
  "???: Grrrroooo...\\n",
  "If you want to know,\\l\\n",
  "try to withstand my Tyranitar's attack.$",
]

[msg.section_0.entries.23]
text = [
  "[VAR TRNAME(1)]: Huh? What? What?$",
]

[msg.section_0.entries.24]
text = [
  "???: Grrrroooo...\\n",
  "You don't understand my language...\\c\\n",
  "Then, I'll wake your head up\\n",
  "with this jolt...$",
]

[msg.section_0.entries.25]
text = [
  "[VAR TRNAME(1)]: OK...$",
]

[msg.section_0.entries.26]
text = [
  "???: Grrrooo... Good...\\c\\n",
  "Receive my light and\\n",
  "prepare yourself even more...$",
]

[msg.section_0.entries.27]
text = [
  "[VAR TRNAME(1)]: Stop messing around!$",
]

[msg.section_0.entries.28]
text = [
  "???: Grrrroooo...\\n",
  "You're quite assertive...\\c\\n",
  "But you should know that\\n",
  "assertiveness can provoke wrath...$",
]

[msg.section_0.entries.29]
text = [
  "[VAR TRNAME(1)]: Can we talk about this?$",
]

[msg.section_0.entries.30]
text = [
  "???: Grrrroooo...\\c\\n",
  "Panicking gets you nowhere...\\n",
  "First, knock my fangs away...$",
]

[msg.section_0.entries.31]
text = [
  "[VAR TRNAME(1)]: Yes! I did it!$",
]

[msg.section_0.entries.32]
text = [
  "???: Grrrroooo...\\n",
  "Well done... Well done...$",
]

[msg.section_0.entries.33]
text = [
  "[VAR TRNAME(1)]: Now!\\c\\n",
  "As you promised,\\n",
  "please tell me your identity!$",
]

[msg.section_0.entries.34]
text = [
  "???: As you wish.\\c\\n",
  "I am the king of the Titanic Tyranitar,\\n",
  "which you are fighting right now.\\c\\n",
  "My body no longer exists, so I reluctantly\\n",
  "borrowed this woman's body to speak to you.$",
]

[msg.section_0.entries.35]
text = [
  "[VAR TRNAME(1)]: What?!\\c\\n",
  "Such a strange story...\\n",
  "I can't believe it just like that!$",
]

[msg.section_0.entries.36]
text = [
  "???: Grrrroooo...\\c\\n",
  "It's your choice whether you\\n",
  "believe it or not...\\c\\n",
  "However, I don't have anything else\\n",
  "to say...$",
]

[msg.section_0.entries.37]
text = [
  "[VAR TRNAME(1)]: ...\\c\\n",
  "All right.\\n",
  "I'll believe you for now...\\c\\n",
  "But what is your purpose?\\n",
  "What do you hope to accomplish\\l\\n",
  "by testing my power?$",
]

[msg.section_0.entries.38]
text = [
  "???: Grrrroooo...\\c\\n",
  "If you want to know that, you must\\n",
  "defeat us...$",
]

[msg.section_0.entries.39]
text = [
  "[VAR TRNAME(1)]: I see...\\n",
  "If you insist on fighting...\\l\\n",
  "I'll go all out, too!$",
]

[msg.section_0.entries.40]
text = [
  "???: That's reassuring...\\c\\n",
  "Well, my eye for talent may be right...$",
]

[msg.section_0.entries.41]
text = [
  "???: Grrrroooo...\\n",
  "Great... [VAR TRNAME(1)]...$",
]

[msg.section_0.entries.42]
text = [
  "[VAR TRNAME(1)]: How about that,\\n",
  "Titanic Tyranitar King?\\l\\n",
  "Are you satisfied now?$",
]

[msg.section_0.entries.43]
text = [
  "???: Fine...\\n",
  "I'll tell you my purpose...\\l\\n",
  "It's you, [VAR TRNAME(1)]...$",
]

[msg.section_0.entries.44]
text = [
  "[VAR TRNAME(1)]: Me...?$",
]

[msg.section_0.entries.45]
text = [
  "???: ...\\n",
  "The mechanical Tyranitar...\\l\\n",
  "You know about that, don't you...?$",
]

[msg.section_0.entries.46]
text = [
  "[VAR TRNAME(1)]: Mechanical...\\n",
  "Tyranitar...?\\c\\n",
  "Are you talking about MT?$",
]

[msg.section_0.entries.47]
text = [
  "???: That's correct...\\c\\n",
  "It is extremely dangerous and\\n",
  "shouldn't exist in this world...\\c\\n",
  "However, there is a villain\\n",
  "who's planning bad things\\l\\n",
  "using the machine...$",
]

[msg.section_0.entries.48]
text = [
  "[VAR TRNAME(1)]: What...?$",
]

[msg.section_0.entries.49]
text = [
  "???: I've been looking for a strong person\\n",
  "who can stop his plan...\\c\\n",
  "And I found the person...\\c\\n",
  "[VAR TRNAME(1)]... It is you...$",
]

[msg.section_0.entries.50]
text = [
  "[VAR TRNAME(1)]: Me... But why?$",
]

[msg.section_0.entries.51]
text = [
  "???: Grrrroooo...\\n",
  "Our battle just now proved\\l\\n",
  "the power you possess.\\c\\n",
  "If we don't stop the mechanical Tyranitar\\n",
  "and the villain who seeks to control it...\\l\\n",
  "a disaster will happen in this world...\\c\\n",
  "[VAR TRNAME(1)]...\\c\\n",
  "In the place of this useless old king...\\n",
  "will you stop the villain with your power?$",
]

[msg.section_0.entries.52]
text = [
  "[VAR TRNAME(1)]: ...But where in the world is\\n",
  "this man you speak of?$",
]

[msg.section_0.entries.53]
text = [
  "???: Grrrroooo...\\n",
  "On the night of the next full moon...\\l\\n",
  "He will appear where he appeared before...\\c\\n",
  "I beg you, [VAR TRNAME(1)]...\\n",
  "Please protect...this world...$",
]

[msg.section_0.entries.54]
text = [
  "After telling me that, the woman who claimed\\n",
  "to be the Titanic Tyranitar King\\l\\n",
  "disappeared into the sky...\\c\\n",
  "And now it's four days until\\n",
  "the next full moon...\\c\\n",
  "Will the villain really appear...?$",
]

[msg.section_0.entries.55]
text = [
  "[VAR TRNAME(1)]: Sigh...\\n",
  "I'm no match...$",
]

[msg.section_0.entries.56]
text = [
  "???: Grrrroooo...\\c\\n",
  "Oh... How disappointing!\\n",
  "I suppose my eye for talent was wrong...$",
]

[msg.section_0.entries.57]
text = [
  "[VAR TRNAME(1)]: I'm disappointed in myself...$",
]

[msg.section_0.entries.58]
text = [
  "???: With your weak power,\\n",
  "stopping that man is just a dream...$",
]

[msg.section_0.entries.59]
text = [
  "[VAR TRNAME(1)]: Wait...\\c\\n",
  "That man?\\n",
  "...What are you talking about?$",
]

[msg.section_0.entries.60]
text = [
  "???: Grrrroooo...\\c\\n",
  "You are weak...\\n",
  "Go back...\\c\\n",
  "And tell your friends...\\n",
  "Leave this world...$",
]

[msg.section_0.entries.61]
text = [
  "[VAR TRNAME(1)]: Wow! What?!\\n",
  "My body is floating!$",
]

[msg.section_0.entries.62]
text = [
  "???: Grrrroooo...$",
]

[msg.section_0.entries.63]
text = [
  "[VAR TRNAME(1)]: Waaaahhhh!$",
]

[msg.section_0.entries.64]
text = [
  "...\\c\\n",
  "When I woke up, I was in a bed in the\\n",
  "hospital at Unova Defense Force HQ...\\c\\n",
  "I heard I was found by chance\\n",
  "when I was lying on the beach.\\c\\n",
  "I reported my experience to the captain,\\n",
  "but he didn't listen to me...\\c\\n",
  "Titanic Tyranitar...the glowing woman...\\n",
  "Was everything a dream?$",
]

[msg.section_0.entries.65]
text = [
  "[VAR TRNAME(1)]: Huff...puff...\\n",
  "Can't...move...$",
]

[msg.section_0.entries.66]
text = [
  "???: Grrrroooo...\\n",
  "Grrrroo... Now...$",
]

[msg.section_0.entries.67]
text = [
  "[VAR TRNAME(1)]: Huff...puff...$",
]

[msg.section_0.entries.68]
text = [
  "???: Grrrroooo...\\n",
  "You said you wanted to know\\l\\n",
  "my purpose...\\c\\n",
  "I shall tell you what you seek...\\c\\n",
  "This vessel no longer suits me.\\n",
  "I want to leave this woman behind\\l\\n",
  "and claim a new body...$",
]

[msg.section_0.entries.69]
text = [
  "[VAR TRNAME(1)]: Wha... What?$",
]

[msg.section_0.entries.70]
text = [
  "???: Grrrroooo...\\n",
  "This weak woman's body is not\\l\\n",
  "appropriate for me,\\l\\n",
  "the Titanic Tyranitar King...\\c\\n",
  "[VAR TRNAME(1)]...\\c\\n",
  "Your body is young and strong...\\n",
  "It's perfect... I'll take it!\\c\\n",
  "Grroo... Grrrroooo...!$",
]

[msg.section_0.entries.71]
text = [
  "[VAR TRNAME(1)]: C-craaack!\\c\\n",
  "Eeek! Oh, my head!\\c\\n",
  "I have a splitting headache!$",
]

[msg.section_0.entries.72]
text = [
  "???: Grrrroooooooooo!$",
]

[msg.section_0.entries.73]
text = [
  "[VAR TRNAME(1)]: Ccccccraaaaakkk!$",
]

[msg.section_0.entries.74]
text = [
  "???: ...$",
]

[msg.section_0.entries.75]
text = [
  "[VAR TRNAME(1)] (?): Grrroooo...\\c\\n",
  "[VAR TRNAME(1)]...\\n",
  "Your body is mine now...\\c\\n",
  "In this young body,\\n",
  "I'll be able to keep living for a long time...$",
]

[msg.section_0.entries.76]
text = [
  "???: Grrroooo...\\n",
  "These are your fangs...\\c\\n",
  "Sharp...and efficient...\\n",
  "Strong and good Pokémon...\\l\\n",
  "Besides, you have a strong bond...$",
]

[msg.section_0.entries.77]
text = [
  "[VAR TRNAME(1)]: Of course!\\c\\n",
  "All my Pokémon are my partners.\\n",
  "We've been put through the intense training\\l\\n",
  "of the Unova Defense Force...\\c\\n",
  "Not only do we have a strong bond,\\n",
  "but we're a family who got through\\l\\n",
  "tough times together!$",
]

[msg.section_0.entries.78]
text = [
  "???: I see...\\n",
  "Pokémon who have been sharpened\\l\\n",
  "by living humans...\\c\\n",
  "Grrroooo...\\n",
  "I once had such times, too.$",
]

]

[msg.section_0.entries.616]
text = [
  "You can tell how much your opponent\\n",
  "wants to fight by looking into his or her\\l\\n",
  "eyes, don't you think?\\c$",
]

[msg.section_0.entries.617]
text = [
  "Wow! I could really tell\\n",
  "that you wanted to win!$",
]

[msg.section_0.entries.618]
text = [
  "I'm gonna keep battling to make\\n",
  "my Pokémon stronger!$",
]

[msg.section_0.entries.619]
text = [
  "Hey, you! Have you seen my cute\\n",
  "Pokémon? Take a look!\\c$",
]

[msg.section_0.entries.620]
text = [
  "My Purrloin is cute even if it loses!$",
]

[msg.section_0.entries.621]
text = [
  "Maybe I'll try a wild Pokémon next time\\n",
  "so that I can win...$",
]

[msg.section_0.entries.622]
text = [
  "Come on, partner! Shrug it off!\\n",
  "You're stronger than that!$",
]

[msg.section_0.entries.623]
text = [
  "We're still OK!\\n",
  "We can keep going!$",
]

[msg.section_0.entries.624]
text = [
  "It can't be!\\c\\n",
  "How could I have lost?\\n",
  "I need to apologize to my partner...$",
]


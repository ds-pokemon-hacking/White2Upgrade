  "We can keep going!$",
]

[msg.section_0.entries.630]
text = [
  "It can't be!\\c\\n",
  "How could I have lost?\\n",
  "I need to apologize to my partner...$",
]

[msg.section_0.entries.631]
text = [
  "You sure are unlucky to have\\n",
  "run into someone as strong as me!\\c$",
]

[msg.section_0.entries.632]
text = [
  "I guess it was I who was unlucky\\n",
  "to have run into you!$",
]

[msg.section_0.entries.633]
text = [
  "Turning bad luck into good luck...\\n",
  "I wish I knew how to do that.$",
]

[msg.section_0.entries.634]
text = [
  "Let's see who has the\\n",
  "most admirable Pokémon!\\c$",
]

[msg.section_0.entries.635]
text = [
  "Even though we lost, my Pokémon\\n",
  "are still pretty admirable...$",
]

[msg.section_0.entries.636]
text = [
  "If we can't win with these numbers,\\n",
  "maybe I should find my Pokémon\\l\\n",
  "some more friends!$",
]

[msg.section_0.entries.637]
text = [
  "Oh! I haven't seen you before!\\n",
  "Would you mind sparring with me?\\c$",
]

[msg.section_0.entries.638]
text = [
  "Wow! Astounding! For one so young,\\n",
  "you're quite impressive, indeed!$",
]

[msg.section_0.entries.639]
text = [
  "Look carefully around the ranch and on\\n",
  "the roads, and you might find items on\\l\\n",
  "the ground!$",
]

[msg.section_0.entries.640]
text = [
  "I need to get Alder to teach me\\n",
  "some more things...$",
]

[msg.section_0.entries.641]
text = [
  "I need to get Alder to teach me\\n",
  "some more things...$",
]

[msg.section_0.entries.642]
text = [
  "I need to get Alder to teach me\\n",
  "some more things...$",
]

[msg.section_0.entries.643]
text = [
  "What?! How could I have lost in a\\n",
  "type matchup like this?$",
]

[msg.section_0.entries.644]
text = [
  "What?! How could I have lost in a\\n",
  "type matchup like this?$",
]

[msg.section_0.entries.645]
text = [
  "What?! How could I have lost in a\\n",
  "type matchup like this?$",
]

[msg.section_0.entries.646]
text = [
  "You're strong! Or should I say\\n",
  "your Pokémon are strong?$",
]

[msg.section_0.entries.647]
text = [
  "For knowledge to truly become your own,\\n",
  "you've got to test it out for yourself!$",
]

[msg.section_0.entries.648]
text = [
  "I'm the strongest Trainer in\\n",
  "Virbank City's preschool!\\c$",
]

[msg.section_0.entries.649]
text = [
  "I guess I'm not the strongest in the world!$",
]

[msg.section_0.entries.650]
text = [
  "I know! I'll go home and take a nap!\\n",
  "Mom always says that I need to get lots\\l\\n",
  "of sleep if I want to be a big kid!$",
]

[msg.section_0.entries.651]
text = [
  "Hi there! Look at my awesome Pokémon.\\c$",
]

[msg.section_0.entries.652]
text = [
  "I...I'm not mad!$",
]

[msg.section_0.entries.653]
text = [
  "My Pokémon will always be with me,\\n",
  "even if we lose!$",
]

[msg.section_0.entries.654]
text = [
  "Two Pokémon!\\c\\n",
  "Strong and strong come together\\n",
  "to become...very strong!\\c$",
]

[msg.section_0.entries.655]
text = [
  "Lia: Wahh! My Pokémon can't fight\\n",
  "any longer?\\c\\n",
  "Lily: Uh oh... My Pokémon isn't\\n",
  "looking so well...$",
]

[msg.section_0.entries.656]
text = [
  "I don't know when I'm supposed\\n",
  "to use Potions and stuff...$",
]

[msg.section_0.entries.657]
text = [
  "One Pokémon all alone?\\n",
  "But it'll be sad...$",
]

[msg.section_0.entries.658]
text = [
  "Ummm...\\n",
  "One plus one...isn't three!\\c$",
]

[msg.section_0.entries.659]
text = [
  "I heard something really cool!\\c\\n",
  "There are moves where two\\n",
  "Pokémon can attack at once!$",
]

[msg.section_0.entries.660]
text = [
  "One Pokémon all alone?\\n",
  "But it'll be sad...$",
]

[msg.section_0.entries.661]
text = [
  "I always give it my best when I'm\\n",
  "around kids and Pokémon!\\c$",
]

[msg.section_0.entries.662]
text = [
  "Oh no! I'm not being a very good\\n",
  "example to the kids, am I?$",
]

[msg.section_0.entries.663]
text = [
  "Every day is full of amazing, new\\n",
  "discoveries when I'm with children\\l\\n",
  "and Pokémon!$",
]

[msg.section_0.entries.664]
text = [
  "Ahh!\\n",
  "How merciless...$",
]

[msg.section_0.entries.665]
text = [
  "Get in my way, and I'll knock you out!\\n",
  "Stay out of my way...and I'll knock\\l\\n",
  "you out, too!\\c$",
]

[msg.section_0.entries.666]
text = [
  "I'm the one who got knocked out!\\n",
  "That was exhilarating!$",
]

[msg.section_0.entries.667]
text = [
  "Hahaha! You're great!\\n",
  "Knock 'em all out for me, OK?$",
]

[msg.section_0.entries.668]
text = [
  "I can always be straight and honest\\n",
  "with myself whenever I'm playing the\\l\\n",
  "guitar or having a Pokémon battle!\\c$",
]

[msg.section_0.entries.669]
text = [
  "Argh! The happy times always end\\n",
  "so quickly!$",
]

[msg.section_0.entries.670]
text = [
  "It's because I'm with my Pokémon that\\n",
  "I can happily play my guitar.\\c\\n",
  "And it's because I play my guitar that\\n",
  "my Pokémon become strong. Get it?$",
]

[msg.section_0.entries.671]
text = [
  "Is this what it means to face reality?$",
]

[msg.section_0.entries.672]
text = [
  "I don't mind losing, but I\\n",
  "feel sorry for my Pokémon...$",
]

[msg.section_0.entries.673]
text = [
  "Speaking of which, it's been quite some time\\n",
  "since I last had a Pokémon battle.$",
]

[msg.section_0.entries.674]
text = [
  "Sure, I'll be your opponent!\\n",
  "Right alongside my trusty Woobat!\\c$",
]

[msg.section_0.entries.675]
text = [
  "Wow!\\n",
  "How powerful!$",
]

[msg.section_0.entries.676]
text = [
  "This is one of my favorite places!$",
]

[msg.section_0.entries.677]
text = [
  "All right! Time for a Pokémon battle!\\n",
  "Let's begin!\\c$",
]

[msg.section_0.entries.678]
text = [
  "Whew!\\n",
  "You're way too strong!$",
]

[msg.section_0.entries.679]
text = [
  "Time for some special Pokémon\\n",
  "training in the dark tall grass!$",
]

[msg.section_0.entries.680]
text = [
  "I'm gonna get a lot stronger\\n",
  "so I can impress Roxie!\\c$",
]

[msg.section_0.entries.681]
text = [
  "Ah haha...\\n",
  "It can't be true...$",
]

[msg.section_0.entries.682]
text = [
  "I want to get a lot stronger\\n",
  "so I can impress Roxie!$",
]

[msg.section_0.entries.683]
text = [
  "Welcome to the Nimbasa City Gym, where\\n",
  "Pokémon and Trainers come together to\\l\\n",
  "put on magnificent Pokémon battles!\\c\\n",
  "Let the fashion show begin!\\c$",
]

[msg.section_0.entries.684]
text = [
  "The show has just begun...\\c\\n",
  "...What? It's over already?$",
]

[msg.section_0.entries.685]
text = [
  "You and your Pokémon were\\n",
  "positively shining!$",
]

[msg.section_0.entries.686]
text = [
  "You can't get by with just beauty!\\n",
  "You need to be a strong Trainer, too!\\c\\n",
  "Don't get captivated by the magnificent\\n",
  "beauty of our battling style!\\c$",
]

[msg.section_0.entries.687]
text = [
  "...Strong and beautiful!\\n",
  "You captivated me!$",
]

[msg.section_0.entries.688]
text = [
  "Beauty isn't just about one's\\n",
  "physical appearance!\\c\\n",
  "Your strength is part of your beauty!\\n",
  "That goes for both you and Elesa!$",
]

[msg.section_0.entries.689]
text = [
  "The show is approaching its grand finale,\\n",
  "but first I need to check if you've got\\l\\n",
  "what it takes to stand on the same\\l\\n",
  "stage as Elesa!\\c$",
]

[msg.section_0.entries.690]
text = [
  "Such strength and beauty!\\c\\n",
  "You've got what it takes to\\n",
  "share the stage with Elesa!$",
]

[msg.section_0.entries.691]
text = [
  "What a fantastically elegant show!\\c\\n",
  "The Pokémon battle between you and\\n",
  "Elesa was absolutely magnificent!\\l\\n",
  "I was utterly captivated!$",
]

[msg.section_0.entries.692]
text = [
  "You've been caught by a powerful hook,\\n",
  "which is me!\\c\\n",
  "I'll have a battle with you using\\n",
  "my freshly caught Pokémon!\\c$",
]

[msg.section_0.entries.693]
text = [
  "I just can't help but flop about!\\n",
  "Flip flop flip flop flip!$",
]

[msg.section_0.entries.694]
text = [
  "I like to think that I'm not catching\\n",
  "Pokémon against their will, but that\\l\\n",
  "they cling to my hook because they\\l\\n",
  "want to battle me!$",
]

[msg.section_0.entries.695]
text = [
  "OK! Good catch! Good catch!\\n",
  "My next catch will be called victory!\\c$",
]

[msg.section_0.entries.696]
text = [
  "The victory that got away\\n",
  "was thiiiiiiiiiis big!$",
]

[msg.section_0.entries.697]
text = [
  "Life is just like fishing.\\c\\n",
  "You can't catch what you don't aim for,\\n",
  "but even if you aim for something, you\\l\\n",
  "still can't catch it!$",
]

[msg.section_0.entries.698]
text = [
  "Having lots of battles is the best\\n",
  "way to train a Pokémon quickly!\\c$",
]

[msg.section_0.entries.699]
text = [
  "Your training method is great!\\n",
  "I'm going to copy it!$",
]

[msg.section_0.entries.700]
text = [
  "I want to battle you each time\\n",
  "you come here! Got it?$",
]

[msg.section_0.entries.701]
text = [
  "Ah, that smell?\\c\\n",
  "My Herdier here seems to say that\\n",
  "you've got a dangerous smell about you!\\c$",
]

[msg.section_0.entries.702]
text = [
  "I see... Your strength is\\n",
  "certainly quite dangerous...$",
]

[msg.section_0.entries.703]
text = [
  "Just because you're strong doesn't mean\\n",
  "you can look down on those who aren't!$",
]

[msg.section_0.entries.704]
text = [
  "Hey there! Trainer!\\n",
  "Let's battle!\\c$",
]

[msg.section_0.entries.705]
text = [
  "Thank you! This will prove to be\\n",
  "a great memory of my journey!$",
]

[msg.section_0.entries.706]
text = [
  "Stick up a thumb to stop a car.\\n",
  "Make eye contact to stop a Trainer.$",
]

[msg.section_0.entries.707]
text = [
  "Hey, you!\\n",
  "Stop right there!\\c$",
]

[msg.section_0.entries.708]
text = [
  "There's no stopping you!\\n",
  "One might call you unstoppable!$",
]

[msg.section_0.entries.709]
text = [
  "Go all out while you're still young!$",
]

[msg.section_0.entries.710]
text = [
  "What's a kid like you doing\\n",
  "wandering around these parts?\\c$",
]

[msg.section_0.entries.711]
text = [
  "To have bested an officer like me...\\n",
  "What kind of kid are you?!$",
]

[msg.section_0.entries.712]
text = [
  "An officer's job is to keep patrolling\\n",
  "even when nothing's going on!$",
]

[msg.section_0.entries.713]
text = [
  "This ain't no place for\\n",
  "kids like you!\\c$",
]

[msg.section_0.entries.714]
text = [
  "Just who are you?\\n",
  "You looked pretty timid...$",
]

[msg.section_0.entries.715]
text = [
  "All I know is that if you're a Trainer,\\n",
  "you're gonna get challenged!$",
]

[msg.section_0.entries.716]
text = [
  "My shiny head is a reflection\\n",
  "of my fighting spirit!\\c$",
]

[msg.section_0.entries.717]
text = [
  "My shine is set to blind!$",
]

[msg.section_0.entries.718]
text = [
  "My dumb little brother decided to follow\\n",
  "in my footsteps and become a bad dude.\\c\\n",
  "I really wanted him to grow up\\n",
  "and live respectably, though...$",
]

[msg.section_0.entries.719]
text = [
  "A motorcycle in the desert!\\n",
  "Doesn't get much more wild than this, eh?\\c$",
]

[msg.section_0.entries.720]
text = [
  "Motorcycles aren't compatible with sand.\\n",
  "I'm not compatible with you!$",
]

[msg.section_0.entries.721]
text = [
  "Both bicycles and motorcycles get\\n",
  "their tires stuck in the sand!$",
]

[msg.section_0.entries.722]
text = [
  "Starting yesterday, I decided\\n",
  "to become a bad dude!\\l\\n",
  "Now people will know I'm strong!\\c$",
]

[msg.section_0.entries.723]
text = [
  "I guess I can't just up and decide to be\\n",
  "a bad dude... It's tougher than I thought!$",
]

[msg.section_0.entries.724]
text = [
  "I want to be like my big bro\\n",
  "and have a shiny head!\\c\\n",
  "You don't have to waste time\\n",
  "drying your hair after a shower!$",
]

[msg.section_0.entries.725]
text = [
  "Hey, hey!\\n",
  "We'll take care of you!\\c$",
]

[msg.section_0.entries.726]
text = [
  "Rob: My...my cute little Pokémon!\\c\\n",
  "Sal: My baby lost!$",
]

[msg.section_0.entries.727]
text = [
  "Some cute Pokémon you've got there!\\c\\n",
  "You aren't too shabby\\n",
  "of a Trainer, either!$",
]

[msg.section_0.entries.728]
text = [
  "Hrmph! I don't want to fight someone\\n",
  "who has only got one Pokémon that's\\l\\n",
  "ready for battle!$",
]

[msg.section_0.entries.729]
text = [
  "Hey, hey, hey! What's wrong?\\n",
  "Are you lost or something?\\c$",
]

[msg.section_0.entries.730]
text = [
  "Us bad dudes are getting together\\n",
  "to boast about our Pokémon!$",
]

[msg.section_0.entries.731]
text = [
  "Come on! You're telling me that you've\\n",
  "only got one Pokémon ready for battle?\\c\\n",
  "I can't call myself a bad dude if I fight\\n",
  "two against one! It's not fair at all!$",
]

[msg.section_0.entries.732]
text = [
  "My gorgeous Pokémon and I have come\\n",
  "to frolic about Relic Castle! Here, take\\l\\n",
  "a look at my Pokémon!\\c$",
]

[msg.section_0.entries.733]
text = [
  "Your strength is quite high class, indeed!$",
]

[msg.section_0.entries.734]
text = [
  "Visiting famous landmarks with\\n",
  "my most favorite Pokémon is a\\l\\n",
  "truly exceptional experience!$",
]

[msg.section_0.entries.735]
text = [
  "You there!\\c\\n",
  "I've become bored, so I shall\\n",
  "let you entertain me!\\c$",
]

[msg.section_0.entries.736]
text = [
  "Well, you certainly know how to entertain.\\n",
  "I thank you for your time.$",
]

[msg.section_0.entries.737]
text = [
  "All I see is sand all around me...\\n",
  "I cannot understand the appeal of\\l\\n",
  "such a place!$",
]

[msg.section_0.entries.738]
text = [
  "A ruin buried under the sand!\\n",
  "To have run into another Trainer here!\\l\\n",
  "Doesn't this give you a grand sense\\l\\n",
  "of adventure?\\c$",
]

[msg.section_0.entries.739]
text = [
  "Bittersweet defeat becomes\\n",
  "a bittersweet memory...$",
]

[msg.section_0.entries.740]
text = [
  "It's a lot of fun to imagine how people in\\n",
  "ancient times lived their everyday lives!$",
]

[msg.section_0.entries.741]
text = [
  "What kind of Pokémon is your\\n",
  "partner on this journey?\\c$",
]

[msg.section_0.entries.742]
text = [
  "Wow! What an amazing and\\n",
  "strong friend you've got!$",
]

[msg.section_0.entries.743]
text = [
  "They say that a good companion makes the\\n",
  "journey pleasant, but it's really true!\\c\\n",
  "When you're with Pokémon, the fun factor\\n",
  "just multiplies, don't you think?$",
]

[msg.section_0.entries.744]
text = [
  "This may be a bit sudden, but please,\\n",
  "check out my Pokémon!\\c$",
]

[msg.section_0.entries.745]
text = [
  "Even if my Pokémon lose,\\n",
  "they are still so cute!$",
]

[msg.section_0.entries.746]
text = [
  "Anytime, anywhere, no matter what,\\n",
  "my Pokémon are always the best for me!$",
]

[msg.section_0.entries.747]
text = [
  "Hee hee! Hey, you! Check out\\n",
  "my Pokémon before you go!\\c$",
]

[msg.section_0.entries.748]
text = [
  "What brilliant Pokémon!\\n",
  "Thank you for the battle!$",
]

[msg.section_0.entries.749]
text = [
  "I feel a bit down when I lose,\\n",
  "but I also feel that each battle with\\l\\n",
  "my Pokémon strengthens our bond!$",
]

[msg.section_0.entries.750]
text = [
  "Aynshunt!\\n",
  "It's aynshunt!\\c$",
]

[msg.section_0.entries.751]
text = [
  "Tara: Wahh! But it's aynshunt!\\c\\n",
  "Val: No, it's a roo-in!$",
]

[msg.section_0.entries.752]
text = [
  "Aynshunt means a long time ago, right?\\n",
  "Does that mean yesterday is aynshunt?$",
]

[msg.section_0.entries.753]
text = [
  "You only have one Pokémon?\\n",
  "You need more! I like lots of Pokémon!$",
]

[msg.section_0.entries.754]
text = [
  "Roo-in!\\n",
  "It's a roo-in!\\c$",
]

[msg.section_0.entries.755]
text = [
  "A roo-in is like someone's house, right?\\n",
  "I wonder who lives here?$",
]

[msg.section_0.entries.756]
text = [
  "You only have one Pokémon?\\n",
  "Isn't it lonely?$",
]

[msg.section_0.entries.757]
text = [
  "After watching a football game, we want\\n",
  "to get rowdy ourselves!\\c$",
]

[msg.section_0.entries.758]
text = [
  "Ava: You defeated us so soundly\\n",
  "that even I feel refreshed!\\c\\n",
  "Aya: I cheered as best I could...$",
]

[msg.section_0.entries.759]
text = [
  "Keeping track of wins and losses is\\n",
  "important, but don't lose sight of\\l\\n",
  "everything else as a result!$",
]

[msg.section_0.entries.760]
text = [
  "We can't have any teamwork if you've\\n",
  "got only one Pokémon ready for battle!$",
]

[msg.section_0.entries.761]
text = [
  "Knowing what a truly heated\\n",
  "battle is all about is the key to\\l\\n",
  "truly passionate cheering!\\c$",
]

[msg.section_0.entries.762]
text = [
  "A fan needs to be 100 percent serious\\n",
  "about both battles and cheering!$",
]

[msg.section_0.entries.763]
text = [
  "You can't show off your teamwork if you\\n",
  "only have one Pokémon ready for battle!$",
]

[msg.section_0.entries.764]
text = [
  "These Pokémon usually help me bake.\\n",
  "Today, they'll help me battle you!\\c$",
]

[msg.section_0.entries.765]
text = [
  "Oh, my! Battling sure is much\\n",
  "more difficult than baking!$",
]

[msg.section_0.entries.766]
text = [
  "I get on well with my Pokémon, and we\\n",
  "bake bread together. It's so much fun!\\l\\n",
  "I don't mind getting up early every day.$",
]

[msg.section_0.entries.767]
text = [
  "Art is explosions! Life forces\\n",
  "colliding together!\\c$",
]

[msg.section_0.entries.768]
text = [
  "Oh, I just got whitewashed!$",
]

[msg.section_0.entries.769]
text = [
  "Boom!\\c\\n",
  "Colors collide to form new colors!$",
]

[msg.section_0.entries.770]
text = [
  "Turn around, and it's my turn. ♪\\n",
  "Turn around, and it's your turn.\\c$",
]

[msg.section_0.entries.771]
text = [
  "Turn around, turn around, turn around...\\n",
  "Then turn around some more!$",
]

[msg.section_0.entries.772]
text = [
  "My Pokémon just love participating\\n",
  "in musicals! They are masters of dance!$",
]

[msg.section_0.entries.773]
text = [
  "Whatever the case, it's best to\\n",
  "try something for yourself!\\c$",
]

[msg.section_0.entries.774]
text = [
  "Hmm... I guess strumming instead of tapping\\n",
  "would have been best...$",
]

[msg.section_0.entries.775]
text = [
  "You're a strong Trainer!\\n",
  "I'm a great Guitarist!\\l\\n",
  "We're both pretty awesome!$",
]

[msg.section_0.entries.776]
text = [
  "I can feel it in the air...\\n",
  "This battle will be electrifying!\\c$",
]

[msg.section_0.entries.777]
text = [
  "What electrifying strength!\\n",
  "You shocked me good!$",
]

[msg.section_0.entries.778]
text = [
  "Give this Berry to your Pokémon!\\c$",
]

[msg.section_0.entries.779]
text = [
  "If a Pokémon holding a Cheri Berry gets\\n",
  "hit with paralysis, it will eat the Berry\\l\\n",
  "and recover!$",
]

[msg.section_0.entries.780]
text = [
  "OK!\\n",
  "Tomorrow will be a home run!\\c$",
]

[msg.section_0.entries.781]
text = [
  "Stu: We lost! Time to walk off...\\c\\n",
  "Art: Farewell! You won...$",
]

[msg.section_0.entries.782]
text = [
  "Your Pokémon certainly have\\n",
  "what it takes!$",
]

[msg.section_0.entries.783]
text = [
  "You only have one Pokémon ready for\\n",
  "battle? It's more fun with more friends!$",
]

[msg.section_0.entries.784]
text = [
  "Baseball and Pokémon battles\\n",
  "are dramas that don't need scripts!\\c$",
]

[msg.section_0.entries.785]
text = [
  "To be a great baseball player, you have\\n",
  "to be able to hit, play defense, and run!$",
]

[msg.section_0.entries.786]
text = [
  "In the spirit of sportsmanship,\\n",
  "I must say you'd be at a disadvantage\\l\\n",
  "in a two-against-one match!$",
]

[msg.section_0.entries.787]
text = [
  "A spot of greenery growing right next\\n",
  "to a big city!\\c\\n",
  "Truly an oasis! I feel so refreshed...\\n",
  "And now I'd like to battle!\\c$",
]

[msg.section_0.entries.788]
text = [
  "Oh... It no longer feels like an\\n",
  "oasis if I lose!$",
]

[msg.section_0.entries.789]
text = [
  "I think the big boulders in this oasis can\\n",
  "be moved using the Strength hidden move!$",
]

[msg.section_0.entries.790]
text = [
  "City Pokémon or\\n",
  "Pokémon that live in the forest...\\l\\n",
  "Which do you prefer?\\c$",
]

[msg.section_0.entries.791]
text = [
  "I love both kinds of Pokémon,\\n",
  "but I don't like losing!$",
]

[msg.section_0.entries.792]
text = [
  "The best place for humans to live isn't\\n",
  "necessarily the best place for Pokémon.\\c\\n",
  "Of course, the best place for me to\\n",
  "live is in my bed!$",
]

[msg.section_0.entries.793]
text = [
  "This is called the battle train!\\n",
  "All aboard!\\c$",
]

[msg.section_0.entries.794]
text = [
  "You're the nonstop express line! I'm the\\n",
  "local line that stops at every station...$",
]

[msg.section_0.entries.795]
text = [
  "Did you try out the Battle Subway?\\n",
  "It's in Nimbasa City.\\c\\n",
  "There are a lot of unique Trainers\\n",
  "you can battle. It's very exciting!$",
]

[msg.section_0.entries.796]
text = [
  "When I'm riding my Bicycle, don't\\n",
  "you think I look stronger?\\c$",
]

[msg.section_0.entries.797]
text = [
  "The cool breeze in my face stopped!\\n",
  "So did my Bicycle!$",
]

[msg.section_0.entries.798]
text = [
  "Cycling is a sport, too!\\n",
  "Follow the rules and ride safely!$",
]

[msg.section_0.entries.799]
text = [
  "Ting-a-ling-ling. ♪\\n",
  "Full-speed attack, coming your way!\\c$",
]

[msg.section_0.entries.800]
text = [
  "Ting-a-ling-ling. ♪\\n",
  "Ting.♪ Ting-a-ling-ling. ♪$",
]

[msg.section_0.entries.801]
text = [
  "When people are running by, you\\n",
  "can't help but stop and look at them.$",
]

[msg.section_0.entries.802]
text = [
  "Testing out one's theory is all\\n",
  "a part of science!\\c$",
]

[msg.section_0.entries.803]
text = [
  "Analyzing the current situation\\n",
  "is also a part of science!$",
]

[msg.section_0.entries.804]
text = [
  "Just because a previous method worked\\n",
  "before, doesn't mean it will again!\\c\\n",
  "The process of trial and error!\\n",
  "Is that what science is all about?$",
]

[msg.section_0.entries.805]
text = [
  "I shall uncover the mechanism behind\\n",
  "Trainer and Pokémon relationships!\\c$",
]

[msg.section_0.entries.806]
text = [
  "Why are Pokémon able to understand\\n",
  "their Trainer's orders?$",
]

[msg.section_0.entries.807]
text = [
  "I wonder if Professor Rowan of the Sinnoh\\n",
  "region has managed to unlock the mystery\\l\\n",
  "of how Pokémon evolve.$",
]

[msg.section_0.entries.808]
text = [
  "To me, the battlefield is a\\n",
  "place for learning!\\c$",
]

[msg.section_0.entries.809]
text = [
  "W-wait!\\n",
  "I've got to analyze this defeat!$",
]

[msg.section_0.entries.810]
text = [
  "By losing, you can discover\\n",
  "what your true strength is! Heh!$",
]

[msg.section_0.entries.811]
text = [
  "I need to research the Exp. Points of\\n",
  "Pokémon for my homework assignment!\\c$",
]

[msg.section_0.entries.812]
text = [
  "It's not fair to use moves\\n",
  "I wasn't expecting!$",
]

[msg.section_0.entries.813]
text = [
  "Hmm! I see! If a high-level Pokémon\\n",
  "defeats a lower-level Pokémon, they\\l\\n",
  "don't receive very many Exp. Points!$",
]

[msg.section_0.entries.814]
text = [
  "Pouring rain... ♪\\n",
  "Fighting Pokémon... ♪\\c$",
]

[msg.section_0.entries.815]
text = [
  "Ah, hear the sad melody\\n",
  "of a total defeat...$",
]

[msg.section_0.entries.816]
text = [
  "Rain, rain! I love rain! ♪\\n",
  "If I'm crying, I can hide my tears with\\l\\n",
  "my parasol!$",
]

[msg.section_0.entries.817]
text = [
  "Water fun with Pokémon!\\n",
  "Do you want to play with us?\\c$",
]

[msg.section_0.entries.818]
text = [
  "My oh my...\\n",
  "I lost!$",
]

[msg.section_0.entries.819]
text = [
  "I'll go home and get my boyfriend to...\\n",
  "No, I'll get my Pokémon to cheer me up!$",
]

[msg.section_0.entries.820]
text = [
  "Nature!\\c$",
]

[msg.section_0.entries.821]
text = [
  "Naaatuuure!$",
]

[msg.section_0.entries.822]
text = [
  "If I use this, will my Pokémon\\n",
  "also become energetic?\\c$",
]

[msg.section_0.entries.823]
text = [
  "When we are surrounded by green,\\n",
  "we feel more energetic. Don't you think?\\l\\n",
  "Thank you, Mother Nature! I love you!$",
]

[msg.section_0.entries.824]
text = [
  "Well, well, well...\\n",
  "If it isn't a lost Pokémon!\\c$",
]

[msg.section_0.entries.825]
text = [
  "Sorry! I mistook you for a Pokémon!$",
]

[msg.section_0.entries.826]
text = [
  "Everyone loves playing hide-and-seek...\\n",
  "I have trouble finding them!$",
]

[msg.section_0.entries.827]
text = [
  "Teacher?\\c\\n",
  "Oh, you're not Teacher!\\n",
  "You're a Trainer!\\c$",
]

[msg.section_0.entries.828]
text = [
  "The tall grass is too...tall!$",
]

[msg.section_0.entries.829]
text = [
  "There's a weird Pokémon hiding in the\\n",
  "rustling grass!$",
]

[msg.section_0.entries.830]
text = [
  "Roar!\\c\\n",
  "I'm a Pokémon!\\c$",
]

[msg.section_0.entries.831]
text = [
  "Quit it!\\c\\n",
  "I'm not really a Pokémon!$",
]

[msg.section_0.entries.832]
text = [
  "I hide in the tall grass and pretend\\n",
  "to be a Pokémon.\\c\\n",
  "I'm what you might call a\\n",
  "method actress!$",
]

[msg.section_0.entries.833]
text = [
  "The two of us make an amazing\\n",
  "combination! Let's battle!\\c$",
]

[msg.section_0.entries.834]
text = [
  "Sola: Our amazing combination\\n",
  "had no impact on you!\\c\\n",
  "Ana: I can't believe it! We should\\n",
  "have been perfect, but we lost!$",
]

[msg.section_0.entries.835]
text = [
  "If my sister is full of energy,\\n",
  "then I'm full of energy, too!\\c\\n",
  "It's kind of like we have the\\n",
  "Pokémon Ability called Synchronize!$",
]

[msg.section_0.entries.836]
text = [
  "Oh, you only have one Pokémon...\\n",
  "It would be more fun if you had more!$",
]

[msg.section_0.entries.837]
text = [
  "The teamwork of Twins...\\n",
  "A true example of perfection!\\c$",
]

[msg.section_0.entries.838]
text = [
  "Even though we look the same,\\n",
  "our parents can always tell us apart!$",
]

[msg.section_0.entries.839]
text = [
  "Only one Pokémon?\\n",
  "I can't believe it... How could you?$",
]

[msg.section_0.entries.840]
text = [
  "A battle on a raised walkway!\\n",
  "That's kind of cool.\\c$",
]

[msg.section_0.entries.841]
text = [
  "Losing is uncool.\\n",
  "No, no, you are cool.$",
]

[msg.section_0.entries.842]
text = [
  "Stand still on a raised walkway, and\\n",
  "you'll lose your balance and fall!$",
]

[msg.section_0.entries.843]
text = [
  "I love raised walkways!\\c\\n",
  "Balancing is fun,\\n",
  "so I often come here to play.\\c$",
]

[msg.section_0.entries.844]
text = [
  "I lost,\\n",
  "but I won't stop!$",
]

[msg.section_0.entries.845]
text = [
  "If you walk on a raised walkway, you can\\n",
  "move without encountering wild Pokémon.$",
]

[msg.section_0.entries.846]
text = [
  "I'll be your opponent, but only\\n",
  "if you have three or more Pokémon\\l\\n",
  "that are ready for battle!$",
]

[msg.section_0.entries.847]
text = [
  "We go three against three in\\n",
  "Triple Battles...\\c\\n",
  "Are you ready?\\n",
  "I am! Let's go!\\c$",
]

[msg.section_0.entries.848]
text = [
  "What?! I never even considered\\n",
  "losing before going into battle!$",
]

[msg.section_0.entries.849]
text = [
  "If you don't have many Pokémon with you,\\n",
  "you can't enjoy Triple Battles\\l\\n",
  "and it's easy to get into trouble!$",
]

[msg.section_0.entries.850]
text = [
  "A Rotation Battle is a new kind of battle\\n",
  "that uses three Pokémon.\\c\\n",
  "Please prepare at least three Pokémon\\n",
  "for battle!$",
]

[msg.section_0.entries.851]
text = [
  "Round and round the rotation goes!\\c\\n",
  "Can you keep up without having your\\n",
  "head spin? Rotation Battle, begin!\\c$",
]

[msg.section_0.entries.852]
text = [
  "Ohhh... My head is spinning!$",
]

[msg.section_0.entries.853]
text = [
  "To have so easily emerged victorious\\n",
  "from a sudden Rotation Battle...\\l\\n",
  "You are cool! Too cool, in fact!$",
]

[msg.section_0.entries.854]
text = [
  "The sounds of gently crashing waves...\\n",
  "The smell of salt in the air...\\l\\n",
  "And a battle with a Trainer\\l\\n",
  "in the prime of youth!\\c$",
]

[msg.section_0.entries.855]
text = [
  "Simply excellent!\\n",
  "That's what being young is all about!$",
]

[msg.section_0.entries.856]
text = [
  "I feel rejuvenated whenever I get the\\n",
  "chance to have a Pokémon battle with\\l\\n",
  "someone younger than myself.\\c\\n",
  "It's like I'm taking in that\\n",
  "person's youthfulness!$",
]

[msg.section_0.entries.857]
text = [
  "Hello there, young Trainer.\\n",
  "Please, battle with me for a spell.\\c$",
]

[msg.section_0.entries.858]
text = [
  "My oh my...\\n",
  "Too bad. Looks like I lost.$",
]

[msg.section_0.entries.859]
text = [
  "When I was young, I traveled all\\n",
  "around, together with my Pokémon.\\c\\n",
  "Oh, I was such a tomboy! Ah ha ha!$",
]

[msg.section_0.entries.860]
text = [
  "Hoo!\\n",
  "Ha!\\c$",
]

[msg.section_0.entries.861]
text = [
  "Gah!$",
]

[msg.section_0.entries.862]
text = [
  "...I lost! I'm sorry,\\n",
  "my precious Pokémon!$",
]

[msg.section_0.entries.863]
text = [
  "Number! Four! Teen!\\c$",
]

[msg.section_0.entries.864]
text = [
  "OK!\\n",
  "Thank you very much!$",
]

[msg.section_0.entries.865]
text = [
  "Whether they win or lose, Pokémon can\\n",
  "become just a little bit stronger after\\l\\n",
  "each and every battle.$",
]

[msg.section_0.entries.866]
text = [
  "Check out my lively Pokémon, which\\n",
  "I've gathered from all around the\\l\\n",
  "Unova region!\\c$",
]

[msg.section_0.entries.867]
text = [
  "Mmm hmm! Looks like you are\\n",
  "even more lively and fresh!$",
]

[msg.section_0.entries.868]
text = [
  "As long as you've got momentum,\\n",
  "you don't need experience or knowledge!$",
]

[msg.section_0.entries.869]
text = [
  "Onward, my friends!\\n",
  "My Bug-type Pokémon swarm!\\c$",
]

[msg.section_0.entries.870]
text = [
  "Pretty cool, huh?\\n",
  "My Bug-type Pokémon are the best!$",
]

[msg.section_0.entries.871]
text = [
  "It's not like I'm collecting them, but\\n",
  "when I'm with lots of Bug-type Pokémon,\\l\\n",
  "my lust for adventure is fulfilled!$",
]

[msg.section_0.entries.872]
text = [
  "Right now, I feel like\\n",
  "mastering Triple Battles!\\c\\n",
  "It sure would be great if you had three\\n",
  "or more Pokémon ready for battle!$",
]

[msg.section_0.entries.873]
text = [
  "Let me test what fighting style\\n",
  "is more effective!\\c$",
]

[msg.section_0.entries.874]
text = [
  "By any chance, are you a\\n",
  "Triple Battle genius?!$",
]

[msg.section_0.entries.875]
text = [
  "If you'd like, please have\\n",
  "Triple Battles with your friends.$",
]

[msg.section_0.entries.876]
text = [
  "I'm trying to get better\\n",
  "at Rotation Battles!\\c\\n",
  "I'll battle you if you have three or\\n",
  "more Pokémon ready for battle!$",
]

[msg.section_0.entries.877]
text = [
  "Let me test what fighting style\\n",
  "is more effective!\\c$",
]

[msg.section_0.entries.878]
text = [
  "What are you, some kind\\n",
  "of Rotation Battle genius?$",
]

[msg.section_0.entries.879]
text = [
  "You should try having Rotation Battles\\n",
  "with your friends, too.$",
]

[msg.section_0.entries.880]
text = [
  "Kids! Please cooperate with this\\n",
  "practice session for my Pokémon!\\c$",
]

[msg.section_0.entries.881]
text = [
  "But my running play was supposed to\\n",
  "be so incredible that even Flying-type\\l\\n",
  "Pokémon couldn't keep up...$",
]

[msg.section_0.entries.882]
text = [
  "Maybe this gift will be more\\n",
  "effective than my running play!\\c$",
]

[msg.section_0.entries.883]
text = [
  "Having a powerful and speedy\\n",
  "running play is key to being a\\l\\n",
  "good football player!$",
]

[msg.section_0.entries.884]
text = [
  "I-I...\\n",
  "I'm not chubby, am I?\\c$",
]

[msg.section_0.entries.885]
text = [
  "Big and strong!$",
]

[msg.section_0.entries.886]
text = [
  "Big and strong, I tell you!\\c$",
]

[msg.section_0.entries.887]
text = [
  "I'm not putting myself down...\\n",
  "Big and strong is what I'm saying!\\l\\n",
  "I'm not chubby! I'm just big and strong!$",
]

[msg.section_0.entries.888]
text = [
  "Kids! Please cooperate with the\\n",
  "training for my Pokémon!\\c$",
]

[msg.section_0.entries.889]
text = [
  "But my passing technique was supposed to\\n",
  "be so incredible that even Psychic-type\\l\\n",
  "Pokémon couldn't predict it...$",
]

[msg.section_0.entries.890]
text = [
  "Maybe this gift will be more\\n",
  "effective than my passing technique!\\c$",
]

[msg.section_0.entries.891]
text = [
  "Football is a thinking person's sport!\\n",
  "You've got to outmaneuver and outwit\\l\\n",
  "your opponent if you want to win!$",
]

[msg.section_0.entries.892]
text = [
  "I-I...\\n",
  "I'm not plump, am I?\\c$",
]

[msg.section_0.entries.893]
text = [
  "Gotta go huge!$",
]

[msg.section_0.entries.894]
text = [
  "I'm gonna go huge, I tell you!\\c$",
]

[msg.section_0.entries.895]
text = [
  "I'm trying to bulk up so I can\\n",
  "shrug off any opponent's tackle!\\l\\n",
  "I'm not getting plump!$",
]

[msg.section_0.entries.896]
text = [
  "I-I...\\n",
  "I'm not all sweaty, am I?\\c$",
]

[msg.section_0.entries.897]
text = [
  "Gotta have passion!$",
]

[msg.section_0.entries.898]
text = [
  "It's all about passion, I tell you!\\c$",
]

[msg.section_0.entries.899]
text = [
  "I'm just really passionate about\\n",
  "battling! I'm not just some sweaty dude!$",
]

[msg.section_0.entries.900]
text = [
  "My undefeated Pokémon and I\\n",
  "have our eyes set on you for\\l\\n",
  "our practice opponent!\\c$",
]

[msg.section_0.entries.901]
text = [
  "I knew I had the right person!$",
]

[msg.section_0.entries.902]
text = [
  "I'm practicing my gift-giving technique\\n",
  "for my fans! Here, take this!\\c$",
]

[msg.section_0.entries.903]
text = [
  "I got some great practice\\n",
  "from our battle!\\c\\n",
  "I'll become even stronger!$",
]

[msg.section_0.entries.904]
text = [
  "Training or not, I don't hold back!\\c$",
]

[msg.section_0.entries.905]
text = [
  "Impressive!\\n",
  "You've got some spectacular skills!$",
]

[msg.section_0.entries.906]
text = [
  "This is a token of my appreciation!\\n",
  "Take it with you!\\c$",
]

[msg.section_0.entries.907]
text = [
  "If I practice against strong Pokémon\\n",
  "then I can get even stronger!$",
]

[msg.section_0.entries.908]
text = [
  "If you're persistent in your efforts,\\n",
  "you'll eventually get stronger!\\l\\n",
  "That's why I love practicing!\\c$",
]

[msg.section_0.entries.909]
text = [
  "I especially love practicing against you!$",
]

[msg.section_0.entries.910]
text = [
  "Take this as my thanks\\n",
  "for practicing with me!\\c$",
]

[msg.section_0.entries.911]
text = [
  "The more you practice, the better\\n",
  "you'll be in an actual match!\\c\\n",
  "I hope you keep practicing, too!$",
]

[msg.section_0.entries.912]
text = [
  "My partner and I have been through a\\n",
  "lot together! Here we go!\\c$",
]

[msg.section_0.entries.913]
text = [
  "I won't let consecutive losses get me down!\\n",
  "That's my policy!$",
]

[msg.section_0.entries.914]
text = [
  "This is a token of my appreciation!\\n",
  "Take it with you!\\c$",
]

[msg.section_0.entries.915]
text = [
  "Don't let losses get you down, either!\\n",
  "Do things your own way!$",
]

[msg.section_0.entries.916]
text = [
  "My right shoulder is itching to throw!\\c\\n",
  "Let's see if you can catch my super\\n",
  "fastball, right down the center!\\c$",
]

[msg.section_0.entries.917]
text = [
  "Not even my super fastball was enough!\\n",
  "Well, at least I can say I gave it my all!$",
]

[msg.section_0.entries.918]
text = [
  "This is a token of my appreciation!\\n",
  "Take it with you!\\c$",
]

[msg.section_0.entries.919]
text = [
  "Thanks to you, I feel like I can\\n",
  "be proud of my fastball!\\c\\n",
  "Thanks so much!$",
]

[msg.section_0.entries.920]
text = [
  "My style is to use powerful Pokémon\\n",
  "to keep up a winning streak!\\l\\n",
  "I'll teach you a lesson!\\c$",
]

[msg.section_0.entries.921]
text = [
  "...You taught me!\\n",
  "You're so powerful!$",
]

[msg.section_0.entries.922]
text = [
  "This is my thanks for teaching me!\\c$",
]

[msg.section_0.entries.923]
text = [
  "I'll research some more battle styles\\n",
  "so I can learn to use this power\\l\\n",
  "more effectively!$",
]

[msg.section_0.entries.924]
text = [
  "When it comes to handling the ball, leave\\n",
  "it to me! Same goes for Poké Balls!\\c$",
]

[msg.section_0.entries.925]
text = [
  "Oh! I guess being a skilled ball handler\\n",
  "doesn't have much to do with battles!$",
]

[msg.section_0.entries.926]
text = [
  "Items are your friend!\\n",
  "Use them with care!\\c$",
]

[msg.section_0.entries.927]
text = [
  "I'm still just a beginner in the\\n",
  "world of Pokémon battling!$",
]

[msg.section_0.entries.928]
text = [
  "I gathered a bunch of cool Pokémon\\n",
  "to make my team. I'll teach you a\\l\\n",
  "thing or two about their strength\\l\\n",
  "in this lecture!\\c$",
]

[msg.section_0.entries.929]
text = [
  "Bam! You lectured me!\\n",
  "You are so cool!$",
]

[msg.section_0.entries.930]
text = [
  "This is my thanks for the lecture!\\c$",
]

[msg.section_0.entries.931]
text = [
  "No matter how cool the Pokémon is, it's\\n",
  "up to the Trainer to lead it to victory!$",
]

[msg.section_0.entries.932]
text = [
  "When it comes to keeping the ball, leave\\n",
  "it to me! My dribbling skills are perfect!\\c$",
]

[msg.section_0.entries.933]
text = [
  "Of course...dribbling a Poké Ball\\n",
  "won't do any good!$",
]

[msg.section_0.entries.934]
text = [
  "You've got to be technical with\\n",
  "how you use items!\\c$",
]

[msg.section_0.entries.935]
text = [
  "Soccer balls and\\n",
  "Poké Balls...$",
]

[msg.section_0.entries.936]
text = [
  "Hey, check this!\\n",
  "Trap and...shoot!\\c$",
]

[msg.section_0.entries.937]
text = [
  "Hmm... My Pokémon don't come out any\\n",
  "stronger even if I give the ball momentum?$",
]

[msg.section_0.entries.938]
text = [
  "Items are important, both in sports\\n",
  "and in Pokémon battles!\\c$",
]

[msg.section_0.entries.939]
text = [
  "I'm going to come up with a separate\\n",
  "training regimen for when I practice\\l\\n",
  "Pokémon battles.$",
]

[msg.section_0.entries.940]
text = [
  "The amount you sweat is a good\\n",
  "indicator of how youthful you are!\\c$",
]

[msg.section_0.entries.941]
text = [
  "I don't care if I lose. I'm still young!\\n",
  "That was a good sweat!$",
]

[msg.section_0.entries.942]
text = [
  "When you start to sweat,\\n",
  "try using this item!\\c$",
]

[msg.section_0.entries.943]
text = [
  "My capacity for exercise is one of\\n",
  "my better points!\\c\\n",
  "It's all so I can get a good sweat!$",
]

[msg.section_0.entries.944]
text = [
  "Hey there!\\c\\n",
  "Think you can overcome\\n",
  "my tricky dribbling style?\\c$",
]

[msg.section_0.entries.945]
text = [
  "Hey! Come on, watch me!\\n",
  "I was dribbling this whole time!$",
]

[msg.section_0.entries.946]
text = [
  "I'm gonna pass this item to you\\n",
  "while dribbling at the same time!\\c$",
]

[msg.section_0.entries.947]
text = [
  "I love Pokémon battles,\\n",
  "and I love basketball!\\c\\n",
  "I'm so lucky to be able to do both!$",
]

[msg.section_0.entries.948]
text = [
  "Young Trainer!\\n",
  "Are you getting enough exercise?\\c$",
]

[msg.section_0.entries.949]
text = [
  "After you're done exercising,\\n",
  "don't forget to rehydrate yourself!$",
]

[msg.section_0.entries.950]
text = [
  "Here, I'll give you this,\\n",
  "so sweat with me!\\c$",
]

[msg.section_0.entries.951]
text = [
  "People lose water from their bodies\\n",
  "simply by breathing!\\c\\n",
  "That means that to sweat is to live!$",
]

[msg.section_0.entries.952]
text = [
  "Hey! Trainer!\\c\\n",
  "Check out my long shot!\\n",
  "I've got serious range!\\c$",
]

[msg.section_0.entries.953]
text = [
  "No one can beat me when it comes to taking\\n",
  "a long shot, but I still have a lot to learn\\l\\n",
  "when it comes to Pokémon battles!$",
]

[msg.section_0.entries.954]
text = [
  "Short pass of an item\\n",
  "coming right at you!\\c$",
]

[msg.section_0.entries.955]
text = [
  "There's always more to learn when it\\n",
  "comes to improving one's technique in\\l\\n",
  "both Pokémon battles and basketball!$",
]

[msg.section_0.entries.956]
text = [
  "Hey there!\\c\\n",
  "What do you think of this ball?\\n",
  "I polished it until it shined!\\c$",
]

[msg.section_0.entries.957]
text = [
  "I may have lost the battle, but no one\\n",
  "can beat me when it comes to shining balls!$",
]

[msg.section_0.entries.958]
text = [
  "I polished this item until\\n",
  "it shined, too!\\c$",
]

[msg.section_0.entries.959]
text = [
  "Taking good care of your ball is\\n",
  "important both in sports and in\\l\\n",
  "Pokémon battles. Don't you think so?$",
]

[msg.section_0.entries.960]
text = [
  "My practice match is coming up!\\c\\n",
  "I will practice smashes\\n",
  "by using you as a wall!\\c$",
]

[msg.section_0.entries.961]
text = [
  "Oh, whew! Must...catch...my breath.\\n",
  "That was some good training...$",
]

[msg.section_0.entries.962]
text = [
  "Huh huh huh...\\n",
  "Lemme...catch...my breath...\\c$",
]

[msg.section_0.entries.963]
text = [
  "You and I have just met!\\n",
  "Let's start this game from the beginning.$",
]

[msg.section_0.entries.964]
text = [
  "Be in awe of my leg strength, which\\n",
  "I developed through relentless rallies!\\c$",
]

[msg.section_0.entries.965]
text = [
  "I suppose leg strength doesn't matter\\n",
  "much in a Pokémon battle...$",
]

[msg.section_0.entries.966]
text = [
  "Take this item as a gift!\\n",
  "Be in awe of it!\\c$",
]

[msg.section_0.entries.967]
text = [
  "Train alongside a speedy Pokémon, and\\n",
  "leg strength will come to you naturally!$",
]

[msg.section_0.entries.968]
text = [
  "The interclub match is coming soon.\\c\\n",
  "I will practice smashes\\n",
  "by using you as a wall!\\c$",
]

[msg.section_0.entries.969]
text = [
  "Oh, whew! Must...catch...my breath.\\n",
  "That was some good training...$",
]

[msg.section_0.entries.970]
text = [
  "Huh huh huh...\\n",
  "Lemme...catch...my breath...\\c$",
]

[msg.section_0.entries.971]
text = [
  "You and I have just met!\\n",
  "Let's start this game from the beginning.$",
]

[msg.section_0.entries.972]
text = [
  "No matter how fast the ball is moving,\\n",
  "it doesn't escape my vision!\\l\\n",
  "Nothing gets past me!\\c$",
]

[msg.section_0.entries.973]
text = [
  "Your strength has been preserved\\n",
  "in my mind's eye!$",
]

[msg.section_0.entries.974]
text = [
  "I hope you'll preserve this gift\\n",
  "in your mind's eye!\\c$",
]

[msg.section_0.entries.975]
text = [
  "Sometimes it's best to let the ball go\\n",
  "by instead of hitting it back.\\c\\n",
  "In tennis, you need to be able to\\n",
  "make quick decisions on the fly!$",
]

[msg.section_0.entries.976]
text = [
  "My pinpoint smash is as accurate as\\n",
  "threading a string through a needle!\\l\\n",
  "Think you can handle it?\\c$",
]

[msg.section_0.entries.977]
text = [
  "You happily handle any kind of attack!\\n",
  "What a big heart you have!$",
]

[msg.section_0.entries.978]
text = [
  "I'll show that I have a big heart, too!\\n",
  "Here, have this item!\\c$",
]

[msg.section_0.entries.979]
text = [
  "You need to put everything you've\\n",
  "got into each and every hit of the ball!\\c\\n",
  "Treat each moment of your life as if\\n",
  "it's a match point!$",
]

[msg.section_0.entries.980]
text = [
  "I need to practice more as a\\n",
  "Pokémon Breeder.\\l\\n",
  "Please, be my opponent!\\c$",
]

[msg.section_0.entries.981]
text = [
  "I've still got a long way to go...\\n",
  "I'll be raising my Pokémon!$",
]

[msg.section_0.entries.982]
text = [
  "Thank you so much!\\c\\n",
  "I learned a lot from our battle.\\n",
  "Be my opponent again sometime!$",
]

[msg.section_0.entries.983]
text = [
  "I'm always patrolling this area!\\c\\n",
  "I'll show you a Pokémon battle that\\n",
  "takes advantage of the terrain!\\c$",
]

[msg.section_0.entries.984]
text = [
  "Argh! I couldn't take advantage of\\n",
  "the terrain... What went wrong?!$",
]

[msg.section_0.entries.985]
text = [
  "A Ranger always has one of these.\\n",
  "I'll give it to you!\\c$",
]

[msg.section_0.entries.986]
text = [
  "The forest and the Pokémon\\n",
  "that live inside are alive...\\c\\n",
  "Something changes every day,\\n",
  "so it's fun to patrol!$",
]

[msg.section_0.entries.987]
text = [
  "We are totally in sync!\\c\\n",
  "Using our amazing connection,\\n",
  "I will teach you all about Rangers!\\c$",
]

[msg.section_0.entries.988]
text = [
  "In fact, we learned\\n",
  "all about you!$",
]

[msg.section_0.entries.989]
text = [
  "Do you know this Berry?\\c$",
]

[msg.section_0.entries.990]
text = [
  "Listen carefully...\\c\\n",
  "You may hear the sound\\n",
  "of breathing Pokémon and plants.$",
]

[msg.section_0.entries.991]
text = [
  "Check out my Alomomola! It took\\n",
  "me 100 Poké Balls to catch it!\\c$",
]

[msg.section_0.entries.992]
text = [
  "I guess the number of Poké Balls I used to\\n",
  "catch my Pokémon doesn't mean much in\\l\\n",
  "a battle...$",
]

[msg.section_0.entries.993]
text = [
  "There are other Alomomola, but I feel\\n",
  "like I was destined to be with this one!$",
]

[msg.section_0.entries.994]
text = [
  "Argh! It got away!\\n",
  "I almost caught it, too!\\l\\n",
  "Times like this call for a Pokémon battle!\\c$",
]

[msg.section_0.entries.995]
text = [
  "Phew! I lost again, but it was nice\\n",
  "to take my mind off fishing for a bit!$",
]

[msg.section_0.entries.996]
text = [
  "You've got to remain optimistic if\\n",
  "you want to be a good Fisherman!\\l\\n",
  "Even if your catch gets away,\\l\\n",
  "there's no use crying about it!$",
]

[msg.section_0.entries.997]
text = [
  "I am a wonderful Fisherman\\n",
  "who loves everything!\\c$",
]

[msg.section_0.entries.998]
text = [
  "I even love a disappointing result!$",
]

[msg.section_0.entries.999]
text = [
  "I want to go deep-sea fishing\\n",
  "using the Royal Unova\\l\\n",
  "that leaves from Castelia City!$",
]

[msg.section_0.entries.1000]
text = [
  "Hey! What kinds of great Pokémon\\n",
  "have you caught?\\c$",
]

[msg.section_0.entries.1001]
text = [
  "Ho ho!\\n",
  "These are some impressive Pokémon!$",
]

[msg.section_0.entries.1002]
text = [
  "My own Pokémon are the best ones\\n",
  "for me! I won't compare them with\\l\\n",
  "anyone else's!$",
]

[msg.section_0.entries.1003]
text = [
  "A woman standing alone with a parasol\\n",
  "in one hand at the beach...\\l\\n",
  "Hi... Please have a battle with me.\\c$",
]

[msg.section_0.entries.1004]
text = [
  "The parasol can block ultraviolet rays,\\n",
  "but it can't block moves...$",
]

[msg.section_0.entries.1005]
text = [
  "I heard a parasol is a must\\n",
  "on the beach...\\l\\n",
  "But I'm the only one who has one?$",
]

[msg.section_0.entries.1006]
text = [
  "If you've got three or more Pokémon\\n",
  "ready for battle, let's have a\\l\\n",
  "Rotation Battle!$",
]

[msg.section_0.entries.1007]
text = [
  "Forming a team of three Pokémon that can\\n",
  "work well together is key in a\\l\\n",
  "Rotation Battle! Let's begin!\\c$",
]

[msg.section_0.entries.1008]
text = [
  "Oh no! The way I positioned my\\n",
  "Pokémon was terrible!$",
]

[msg.section_0.entries.1009]
text = [
  "In honor of your great teamwork,\\n",
  "please accept this Berry!\\c$",
]

[msg.section_0.entries.1010]
text = [
  "You really need to be able to\\n",
  "predict your opponent's moves\\l\\n",
  "in a Rotation Battle! It's a true\\l\\n",
  "test of a Trainer's skill!$",
]

[msg.section_0.entries.1011]
text = [
  "If you've got three or more Pokémon\\n",
  "ready for battle, let's have a\\l\\n",
  "Triple Battle!$",
]

[msg.section_0.entries.1012]
text = [
  "The power of three come together as one!\\n",
  "Let's have a Triple Battle!\\c$",
]

[msg.section_0.entries.1013]
text = [
  "Everyone coming together as one...\\n",
  "What great teamwork that was!$",
]

[msg.section_0.entries.1014]
text = [
  "Your great display of teamwork impressed\\n",
  "me, so I'd like to give you this!\\c$",
]

[msg.section_0.entries.1015]
text = [
  "In a Triple Battle, your Pokémon have\\n",
  "more than triple the power!\\l\\n",
  "It's a true test of a Trainer's skill!$",
]

[msg.section_0.entries.1016]
text = [
  "Behold my impressive physique.\\n",
  "It's fitting of an Ace Trainer!\\c$",
]

[msg.section_0.entries.1017]
text = [
  "My Pokémon couldn't do my\\n",
  "impressive physique justice!$",
]

[msg.section_0.entries.1018]
text = [
  "You can do all sorts of crazy stuff as\\n",
  "long as you've got energy!$",
]

[msg.section_0.entries.1019]
text = [
  "To battle in a high-up place...\\c\\n",
  "This is the perfect situation for\\n",
  "an Ace Trainer such as I!\\c$",
]

[msg.section_0.entries.1020]
text = [
  "To tell the truth...\\n",
  "I'm actually afraid of heights...$",
]

[msg.section_0.entries.1021]
text = [
  "Overcoming one's fears is an important\\n",
  "part of being an Ace Trainer!\\c\\n",
  "But still, I hate being up so high...$",
]

[msg.section_0.entries.1022]
text = [
  "Rio and I are of one mind!\\c\\n",
  "That's why you're going to have to\\n",
  "use two Pokémon against us!\\c$",
]

[msg.section_0.entries.1023]
text = [
  "Cleo: Wow, what a surprise!\\n",
  "Rio: Wow, what a surprise!$",
]

[msg.section_0.entries.1024]
text = [
  "I've got to get stronger so\\n",
  "I can take care of Rio!$",
]

[msg.section_0.entries.1025]
text = [
  "You've only got one Pokémon with you?\\n",
  "You can't battle both of us like that!$",
]

[msg.section_0.entries.1026]
text = [
  "It's so fun to battle alongside Cleo!\\c$",
]

[msg.section_0.entries.1027]
text = [
  "Being able to combine your strength\\n",
  "with a great friend in battle is a truly\\l\\n",
  "amazing thing!$",
]

[msg.section_0.entries.1028]
text = [
  "You only have one Pokémon\\n",
  "that's ready for battle?\\c\\n",
  "Too bad! Two-against-two Pokémon\\n",
  "battles are really fun, you know?$",
]

[msg.section_0.entries.1029]
text = [
  "Travel the uneven road to hone yourself!\\n",
  "You've got to train your guts!\\c$",
]

[msg.section_0.entries.1030]
text = [
  "You can't win just with guts!\\n",
  "That's the truth of it...$",
]

[msg.section_0.entries.1031]
text = [
  "You can't win just with guts, but that\\n",
  "doesn't mean you don't need them!\\l\\n",
  "Isn't that right, Heracross?$",
]

[msg.section_0.entries.1032]
text = [
  "You gotta have stamina!\\c\\n",
  "Burn the flames of life,\\n",
  "and never stop moving forward!\\c$",
]

[msg.section_0.entries.1033]
text = [
  "I'm out of stamina!$",
]

[msg.section_0.entries.1034]
text = [
  "I was just joking about never stopping!\\c\\n",
  "You need to take a break every once\\n",
  "in a while to rest your mind and body!$",
]

[msg.section_0.entries.1035]
text = [
  "I have a request for you!\\n",
  "Please battle me!\\c$",
]

[msg.section_0.entries.1036]
text = [
  "I'm mad that I lost, but I'm happy that\\n",
  "my Pokémon got some good experience!$",
]

[msg.section_0.entries.1037]
text = [
  "Battling with you is a truly\\n",
  "meaningful experience!\\l\\n",
  "Please be my opponent again sometime!$",
]

[msg.section_0.entries.1038]
text = [
  "I'm proud of my Pokémon, which\\n",
  "I raised with love and care!\\c$",
]

[msg.section_0.entries.1039]
text = [
  "Looks like I lost to you in the\\n",
  "love-and-care department... You're amazing!$",
]

[msg.section_0.entries.1040]
text = [
  "If you don't raise your Pokémon with\\n",
  "love and care, they'll grow up to be\\l\\n",
  "sad Pokémon that don't want to battle!$",
]

[msg.section_0.entries.1041]
text = [
  "My Pokémon and I spend so much time\\n",
  "together, we don't need words\\l\\n",
  "to understand one another.\\c\\n",
  "Do you think you can win against us?\\c$",
]

[msg.section_0.entries.1042]
text = [
  "You can understand each other\\n",
  "very well, too!$",
]

[msg.section_0.entries.1043]
text = [
  "When you see this Berry,\\n",
  "please remember us!\\c$",
]

[msg.section_0.entries.1044]
text = [
  "The best part about being a\\n",
  "Pokémon Ranger is that you get\\l\\n",
  "to spend time with Pokémon!$",
]

[msg.section_0.entries.1045]
text = [
  "I trained my body and mind\\n",
  "by standing under a waterfall!\\l\\n",
  "Nothing will faze me now!\\c$",
]

[msg.section_0.entries.1046]
text = [
  "What...\\n",
  "I mean, how?$",
]

[msg.section_0.entries.1047]
text = [
  "I admit your strength\\n",
  "and give you this gift!\\c$",
]

[msg.section_0.entries.1048]
text = [
  "Maybe I should train my body and mind\\n",
  "by standing under a waterfall!\\c\\n",
  "I can get clean while I'm at it!$",
]

[msg.section_0.entries.1049]
text = [
  "I travel the world because\\n",
  "I'm looking for danger!\\l\\n",
  "Are you dangerous, Trainer?\\c$",
]

[msg.section_0.entries.1050]
text = [
  "You're so dangerous that I was in\\n",
  "danger of giving up the match!$",
]

[msg.section_0.entries.1051]
text = [
  "Why do I seek out danger?\\c\\n",
  "Because it's exciting, that's why!\\n",
  "It makes me feel alive!$",
]

[msg.section_0.entries.1052]
text = [
  "I might be lost right now,\\n",
  "but I'll battle you anyway!\\c$",
]

[msg.section_0.entries.1053]
text = [
  "I don't stand a chance if I\\n",
  "fight while I'm lost.$",
]

[msg.section_0.entries.1054]
text = [
  "I still have no idea what this\\n",
  "place is like!\\c\\n",
  "I never carry a map with me!$",
]

[msg.section_0.entries.1055]
text = [
  "Join our team!\\c\\n",
  "Actually, I will force you\\n",
  "to join our team!\\c$",
]

[msg.section_0.entries.1056]
text = [
  "Our team doesn't need a Trainer\\n",
  "who is quite that strong!$",
]

[msg.section_0.entries.1057]
text = [
  "We hang out here every day!\\n",
  "Every day until the end of time!$",
]

[msg.section_0.entries.1058]
text = [
  "If I win, give me your Pokémon!\\c$",
]

[msg.section_0.entries.1059]
text = [
  "That was just a joke.\\n",
  "Everyone's taking it so seriously!$",
]

[msg.section_0.entries.1060]
text = [
  "Hmph! I take weak Pokémon and raise\\n",
  "them with tender care until they're\\l\\n",
  "good and strong! That's my policy!$",
]

[msg.section_0.entries.1061]
text = [
  "Do you want to pass through here?\\c\\n",
  "Then, you must greet me!\\c$",
]

[msg.section_0.entries.1062]
text = [
  "You!!\\n",
  "What great strength you have!$",
]

[msg.section_0.entries.1063]
text = [
  "Chase the sun during the day,\\n",
  "and sleep all night...\\l\\n",
  "That might be a good life for me.$",
]

[msg.section_0.entries.1064]
text = [
  "Heheh!\\n",
  "Nobody can beat my speed and fury!\\c$",
]

[msg.section_0.entries.1065]
text = [
  "I have lost!\\n",
  "I am such a loser!$",
]

[msg.section_0.entries.1066]
text = [
  "Ahh! Maybe I should just pick up\\n",
  "my bike and charge outta here!\\l\\n",
  "No one would doubt how wild I am then!$",
]

[msg.section_0.entries.1067]
text = [
  "Hey, hey, what have we here, boys?\\c\\n",
  "You have good Pokémon.\\n",
  "Let me see!\\c$",
]

[msg.section_0.entries.1068]
text = [
  "Jim: Ah, I get it!\\n",
  "That's what you call friendship, huh?\\c\\n",
  "Cas: Huh? You're saying the friendship\\n",
  "between us bad dudes isn't good enough?$",
]

[msg.section_0.entries.1069]
text = [
  "There are good Pokémon,\\n",
  "but there are no bad Pokémon.\\c\\n",
  "Everything is up to the Trainer.\\n",
  "That's what I think!$",
]

[msg.section_0.entries.1070]
text = [
  "You've got only one Pokémon?\\n",
  "But Single Battles are too boring!$",
]

[msg.section_0.entries.1071]
text = [
  "Hey, hey! A bad one teamed up\\n",
  "with another bad one!\\c\\n",
  "Do you know what it means?\\c\\n",
  "That means we are very bad!\\c$",
]

[msg.section_0.entries.1072]
text = [
  "Even bad men like us\\n",
  "can be friends!\\c\\n",
  "What a great thing!\\n",
  "Friendship between men\\l\\n",
  "and friendship with Pokémon...$",
]

[msg.section_0.entries.1073]
text = [
  "What? You've only got one\\n",
  "Pokémon that can fight?\\c\\n",
  "I cannot take a cheap shot,\\n",
  "fighting two against one!$",
]

[msg.section_0.entries.1074]
text = [
  "Our sweat and tears go into this Gym...$",
]

[msg.section_0.entries.1075]
text = [
  "And to think of all the walls we've broken\\n",
  "down up until now... To hit a wall like this...$",
]

[msg.section_0.entries.1076]
text = [
  "The distance between winning and coming\\n",
  "close to winning is so close, yet so far!$",
]

[msg.section_0.entries.1077]
text = [
  "Everything went dark all of a sudden!$",
]

[msg.section_0.entries.1078]
text = [
  "Looks like the conveyor brought\\n",
  "in a strong Trainer like you!$",
]

[msg.section_0.entries.1079]
text = [
  "I might have lost, but I'm going\\n",
  "to continue to believe in my Pokémon!$",
]

[msg.section_0.entries.1080]
text = [
  "You didn't notice the pitfall at\\n",
  "my feet while we were battling?!$",
]

[msg.section_0.entries.1081]
text = [
  "Hey there, young Trainer!\\c\\n",
  "If you're unsure about something,\\n",
  "I'll happily act as your opponent!\\c$",
]

[msg.section_0.entries.1082]
text = [
  "Excellent!\\n",
  "This was a defeat I can't disagree with!$",
]

[msg.section_0.entries.1083]
text = [
  "I'm ashamed to admit it, but\\n",
  "I'm actually lost right now...\\c\\n",
  "Now, which way did I come from again?$",
]

[msg.section_0.entries.1084]
text = [
  "If you have the move Dive,\\n",
  "you can dive and sink!\\c$",
]

[msg.section_0.entries.1085]
text = [
  "Blub, blub, blub...\\n",
  "...I am sinking.$",
]

[msg.section_0.entries.1086]
text = [
  "Have your Pokémon\\n",
  "learned the move Dive?\\c\\n",
  "Dive is good! Great!\\n",
  "'Cause it's Dive!$",
]

[msg.section_0.entries.1087]
text = [
  "I've been challenging the Pokémon Gyms\\n",
  "all across the world!\\c$",
]

[msg.section_0.entries.1088]
text = [
  "I couldn't defeat them all, but I learned\\n",
  "a lot at the Gyms and became stronger!$",
]

[msg.section_0.entries.1089]
text = [
  "It's fine! I just want to have fun\\n",
  "with Pokémon battles!\\c\\n",
  "People who want nothing but to win should\\n",
  "keep trying until they are satisfied.$",
]

[msg.section_0.entries.1090]
text = [
  "We spend our lives swimming!\\n",
  "Of course we battle while swimming, too!\\c$",
]

[msg.section_0.entries.1091]
text = [
  "I lost. But I'm still cool, because not many\\n",
  "people can say they battled while swimming!$",
]

[msg.section_0.entries.1092]
text = [
  "My Pokémon and I saw it\\n",
  "with our own eyes!\\c\\n",
  "I'm talking about the ancient ruins at\\n",
  "the bottom of the sea near Undella Town!$",
]

[msg.section_0.entries.1093]
text = [
  "Seeing a Pokémon use its best moves\\n",
  "against another Pokémon\\l\\n",
  "is really an adventure!\\c$",
]

[msg.section_0.entries.1094]
text = [
  "The adventure is over already.$",
]

[msg.section_0.entries.1095]
text = [
  "It appears that my vacation\\n",
  "shall never end.\\c\\n",
  "I wonder if that's OK...$",
]

[msg.section_0.entries.1096]
text = [
  "Time for an aquatic battle in\\n",
  "the sea near Undella Town!\\c$",
]

[msg.section_0.entries.1097]
text = [
  "I'm going to just float on by...$",
]

[msg.section_0.entries.1098]
text = [
  "Sometimes Jellyfish Pokémon are\\n",
  "floating in the water around here!$",
]

[msg.section_0.entries.1099]
text = [
  "I'm showing off the sea\\n",
  "to my beloved Pokémon...\\c$",
]

[msg.section_0.entries.1100]
text = [
  "Wow!\\n",
  "How powerful!$",
]

[msg.section_0.entries.1101]
text = [
  "I want to see all kinds of scenery!\\c\\n",
  "You can only truly have hope for\\n",
  "tomorrow when you learn how big\\l\\n",
  "the world is and how small you are!$",
]

[msg.section_0.entries.1102]
text = [
  "You see this enormous puddle?\\n",
  "They call it an ocean!\\c$",
]

[msg.section_0.entries.1103]
text = [
  "Whoa!\\n",
  "You're enormous, too!$",
]

[msg.section_0.entries.1104]
text = [
  "Big things are awesome! Why?\\n",
  "Because they're big!$",
]

[msg.section_0.entries.1105]
text = [
  "I trained with Marlon,\\n",
  "the Gym Leader of Humilau City!\\c$",
]

[msg.section_0.entries.1106]
text = [
  "I still have room to improve!\\n",
  "Thanks for teaching me a lesson!$",
]

[msg.section_0.entries.1107]
text = [
  "They say that Marlon, the Gym Leader\\n",
  "of Humilau City, can stay in the ocean\\l\\n",
  "for seven days and seven nights!$",
]

[msg.section_0.entries.1108]
text = [
  "What?! You're a Trainer?\\n",
  "Awesome! Come on, my Remoraid!\\c$",
]

[msg.section_0.entries.1109]
text = [
  "Oh well... Time for my Remoraid to\\n",
  "return to their Poké Balls...$",
]

[msg.section_0.entries.1110]
text = [
  "Pokémon just wait inside their\\n",
  "Poké Balls until they are needed...\\c\\n",
  "Pokémon sure are convenient\\n",
  "for us humans.$",
]

[msg.section_0.entries.1111]
text = [
  "Catch this! My Pokémon is huge!\\c$",
]

[msg.section_0.entries.1112]
text = [
  "Wow! Impressive Pokémon!\\n",
  "Even more so than I expected!$",
]

[msg.section_0.entries.1113]
text = [
  "Wailord is over 47 feet long,\\n",
  "but it still fits inside a Poké Ball!\\l\\n",
  "The power of science sure is incredible!$",
]

[msg.section_0.entries.1114]
text = [
  "I'll have a battle with you using\\n",
  "my freshly caught Pokémon!\\c$",
]

[msg.section_0.entries.1115]
text = [
  "I had no idea how my Pokémon would fight.\\n",
  "I mean, I caught them just a moment ago!$",
]

[msg.section_0.entries.1116]
text = [
  "I may have just caught them, but\\n",
  "I'll raise them to be strong!\\c\\n",
  "Our time together has just begun!$",
]

[msg.section_0.entries.1117]
text = [
  "Hi-yah! Hi-yah!\\c\\n",
  "I'm practicing my punching technique\\n",
  "in front of the sea! Give it a try!\\c$",
]

[msg.section_0.entries.1118]
text = [
  "Hi-yah! Hi-yah!\\n",
  "I won't stop punching just because I lost!$",
]

[msg.section_0.entries.1119]
text = [
  "I'm training to not be fooled by\\n",
  "the swimming ladies...\\c\\n",
  "I'm not just looking at them!$",
]

[msg.section_0.entries.1120]
text = [
  "It takes a lot of strength to\\n",
  "swim in the ocean.\\l\\n",
  "Are your Pokémon OK?\\c$",
]

[msg.section_0.entries.1121]
text = [
  "I see!\\n",
  "What energetic Pokémon!$",
]

[msg.section_0.entries.1122]
text = [
  "OK! I'll replenish your\\n",
  "Pokémon's energy!\\c$",
]

[msg.section_0.entries.1123]
text = [
  "Everything's OK now!\\n",
  "Come back anytime!$",
]

[msg.section_0.entries.1124]
text = [
  "Welcome! Do you have\\n",
  "a reservation for a battle?\\c$",
]

[msg.section_0.entries.1125]
text = [
  "Oh my!\\n",
  "It appears you reserved a victory, too!$",
]

[msg.section_0.entries.1126]
text = [
  "You are great!\\n",
  "I want to hire you.$",
]

[msg.section_0.entries.1127]
text = [
  "I just keep running around!\\n",
  "I've got the whole field to myself!\\c$",
]

[msg.section_0.entries.1128]
text = [
  "I know... I know...\\n",
  "I shouldn't take it all for myself.$",
]

[msg.section_0.entries.1129]
text = [
  "I ran around a ton and got the\\n",
  "Heavy Walker Medal!$",
]

[msg.section_0.entries.1130]
text = [
  "A high-level battling technique\\n",
  "is art in its own way!\\c$",
]

[msg.section_0.entries.1131]
text = [
  "Your strength cannot be\\n",
  "put into words!$",
]

[msg.section_0.entries.1132]
text = [
  "I'll draw how I want to draw!\\n",
  "I'll live how I want to live!\\l\\n",
  "That's the best way!$",
]

[msg.section_0.entries.1133]
text = [
  "We've just got to do what we can!\\c$",
]

[msg.section_0.entries.1134]
text = [
  "I feel like I understood what I could\\n",
  "do and what I couldn't.$",
]

[msg.section_0.entries.1135]
text = [
  "I'll try to increase the things I can\\n",
  "do and challenge you again!$",
]

[msg.section_0.entries.1136]
text = [
  "Shut up and battle with me!\\c$",
]

[msg.section_0.entries.1137]
text = [
  "...!$",
]

[msg.section_0.entries.1138]
text = [
  "You're strong!$",
]

[msg.section_0.entries.1139]
text = [
  "I'm a heartbreaker...\\n",
  "My name... Charles.$",
]

[msg.section_0.entries.1140]
text = [
  "I'm a heartbreaker...\\n",
  "My name... Charles.$",
]

[msg.section_0.entries.1141]
text = [
  "You can learn all sorts of things from\\n",
  "a long day spent fishing.\\c$",
]

[msg.section_0.entries.1142]
text = [
  "No matter what the outcome of a battle,\\n",
  "your Pokémon will never leave your side.$",
]

[msg.section_0.entries.1143]
text = [
  "Thinking that people and Pokémon will\\n",
  "respect you if you're strong is\\l\\n",
  "just a bunch of baloney, really.\\c\\n",
  "The moment you lose, all those people\\n",
  "who were cheering for you will disappear.$",
]

[msg.section_0.entries.1144]
text = [
  "How do you like riding on leaves?\\c\\n",
  "If you manage to beat me, I'll teach\\n",
  "you something good. You'll see!\\c$",
]

[msg.section_0.entries.1145]
text = [
  "I lost? Now I just want to climb aboard\\n",
  "a leaf and be swept away somewhere...$",
]

[msg.section_0.entries.1146]
text = [
  "When two leaves collide, the leaf that\\n",
  "was moving is stopped and the leaf\\l\\n",
  "that was struck begins moving...$",
]

[msg.section_0.entries.1147]
text = [
  "To be as clear as water...\\n",
  "That is the style that I seek!\\c$",
]

[msg.section_0.entries.1148]
text = [
  "When I lose, I feel as if I\\n",
  "might just disappear...$",
]

[msg.section_0.entries.1149]
text = [
  "I may have been the one to lose, but\\n",
  "I'm still going to go ahead and say it...\\c\\n",
  "You should definitely seek a style,\\n",
  "but everyone has his or her own style!$",
]

[msg.section_0.entries.1150]
text = [
  "Oh! To think that you would deliberately\\n",
  "seek me out for a battle!\\c\\n",
  "I'm so tickled that I won't hold\\n",
  "anything back as a reward!\\c$",
]

[msg.section_0.entries.1151]
text = [
  "What oppressive force...\\n",
  "What a Trainer!$",
]

[msg.section_0.entries.1152]
text = [
  "Losing will only make me stronger.\\c\\n",
  "I will use this frustration as a\\n",
  "stepping-stone to rise again!\\l\\n",
  "For that I thank you.$",
]

[msg.section_0.entries.1153]
text = [
  "It is said that water will not grow\\n",
  "stagnant as long as it keeps flowing...\\l\\n",
  "So as long as I keep moving onward...\\c$",
]

[msg.section_0.entries.1154]
text = [
  "I won't give up, even if I am defeated!\\n",
  "That toughness is the pride of an\\l\\n",
  "Ace Trainer!$",
]

[msg.section_0.entries.1155]
text = [
  "When riding leaves, the direction they\\n",
  "float in will depend on which side you\\l\\n",
  "got on from.\\c\\n",
  "Don't worry! If you keep trying, you'll\\n",
  "find our Leader sooner or later!$",
]

[msg.section_0.entries.1156]
text = [
  "When I win, and even when the impossible\\n",
  "happens and I lose, I analyze every one\\l\\n",
  "of my battles to grow stronger.\\c\\n",
  "Do you really think you can beat\\n",
  "someone like me?\\c$",
]

[msg.section_0.entries.1157]
text = [
  "I want to ride away on my Pokémon\\n",
  "so that I might ponder why I lost...$",
]

[msg.section_0.entries.1158]
text = [
  "Riding on a beloved Pokémon and thinking\\n",
  "about things is so nice that you'll find\\l\\n",
  "you come up with all kinds of good ideas.$",
]

[msg.section_0.entries.1159]
text = [
  "The thing about water is that it's\\n",
  "always changing...\\c\\n",
  "From the piercing strength of a jet,\\n",
  "to the crushing power of a wave...\\l\\n",
  "That's what I'm about to show you!\\c$",
]

[msg.section_0.entries.1160]
text = [
  "What strength...\\c\\n",
  "You're just as strong as Marlon...or\\n",
  "perhaps even stronger...?!$",
]

[msg.section_0.entries.1161]
text = [
  "You know... Each Trainer has different\\n",
  "Pokémon, and Pokémon all have their\\l\\n",
  "own strengths.\\c\\n",
  "I've got to learn more about the\\n",
  "strengths of my own Pokémon!$",
]

[msg.section_0.entries.1162]
text = [
  "Ugh! I'm getting really\\n",
  "sick of losing over here!$",
]

[msg.section_0.entries.1163]
text = [
  "This Pokémon I stole...\\n",
  "It's no help at all!$",
]

[msg.section_0.entries.1164]
text = [
  "Ah... I see...\\n",
  "That was quite well thought out.$",
]

[msg.section_0.entries.1165]
text = [
  "Splendid!\\n",
  "You are quite the Trainer!$",
]

[msg.section_0.entries.1166]
text = [
  "Don't let it go to your head...\\n",
  "But you put up a good fight, kid!$",
]

[msg.section_0.entries.1167]
text = [
  "What's the big idea? This Pokémon\\n",
  "I stole is useless!$",
]

[msg.section_0.entries.1168]
text = [
  "Bravo!!\\c\\n",
  "What you showed us is\\n",
  "the spark of Trainers.\\c\\n",
  "However, let me say just one thing.\\c\\n",
  "Please move on to an even greater goal.\\c$",
]

[msg.section_0.entries.1169]
text = [
  "I am Emmet.\\c\\n",
  "I lost together with Ingo.\\c\\n",
  "Your combination is\\n",
  "the best. Perfect!\\l\\n",
  "You're verrrrry strong Trainers.\\c$",
]

[msg.section_0.entries.1170]
text = [
  "I'm a heartbreaker...\\n",
  "My name... Charles.$",
]

[msg.section_0.entries.1171]
text = [
  "I'm a heartbreaker...\\n",
  "My name... Charles.$",
]

[msg.section_0.entries.1172]
text = [
  "Ho! You fight as if you really understand\\n",
  "your Pokémon!$",
]

[msg.section_0.entries.1173]
text = [
  "You! So you're a Trainer who fights\\n",
  "while believing in your Pokémon, are you?$",
]

[msg.section_0.entries.1174]
text = [
  "Plasmaaaa!\\n",
  "Plasmaaaa!!$",
]

[msg.section_0.entries.1175]
text = [
  "The Gym Leader is tough, but you...\\n",
  "Are you even human?!$",
]

[msg.section_0.entries.1176]
text = [
  "I tried to use the same combination as\\n",
  "you, and yet...$",
]

[msg.section_0.entries.1177]
text = [
  "No! At this rate, I... I won't be\\n",
  "able to protect the Plasma Frigate!$",
]

[msg.section_0.entries.1178]
text = [
  "P-P-P-Plasmaaaa!$",
]

[msg.section_0.entries.1179]
text = [
  "Let's do it, partner!$",
]

[msg.section_0.entries.1180]
text = [
  "I'm counting on you!$",
]

[msg.section_0.entries.1181]
text = [
  "I couldn't even draw out my team's\\n",
  "real strength... How pathetic!$",
]

[msg.section_0.entries.1182]
text = [
  "Let's do it, partner!$",
]

[msg.section_0.entries.1183]
text = [
  "I'm counting on you!$",
]

[msg.section_0.entries.1184]
text = [
  "I couldn't even draw out my team's\\n",
  "real strength... How pathetic!$",
]

[msg.section_0.entries.1185]
text = [
  "Let's do it, partner!$",
]

[msg.section_0.entries.1186]
text = [
  "I'm counting on you!$",
]

[msg.section_0.entries.1187]
text = [
  "I couldn't even draw out my team's\\n",
  "real strength... How pathetic!$",
]

[msg.section_0.entries.1188]
text = [
  "The fierce energy I feel from you...\\n",
  "It is just like that of a soaring dragon!$",
]

[msg.section_0.entries.1189]
text = [
  "Such energy on the offense...\\n",
  "You are truly without equal!$",
]

[msg.section_0.entries.1190]
text = [
  "The three Pokémon you picked...\\n",
  "They gave me a run for my money!$",
]

[msg.section_0.entries.1191]
text = [
  "Such defense...\\n",
  "It is beyond comparison!$",
]

[msg.section_0.entries.1192]
text = [
  "The Pokémon you picked...\\n",
  "They supported each other well.$",
]

[msg.section_0.entries.1193]
text = [
  "Those footsteps I have heard drawing\\n",
  "near... I have been waiting for you!\\c$",
]

[msg.section_0.entries.1194]
text = [
  "I knew as soon as I heard your footfalls\\n",
  "that you were a force to be reckoned with!$",
]

[msg.section_0.entries.1195]
text = [
  "I had actually been meaning to\\n",
  "give you something.\\c$",
]

[msg.section_0.entries.1196]
text = [
  "I was imagining how a Burmy must feel\\n",
  "wrapped in a cloak of fallen leaves!$",
]

[msg.section_0.entries.1197]
text = [
  "Keep going with the momentum!\\n",
  "Ready, set...fight!\\c$",
]

[msg.section_0.entries.1198]
text = [
  "What's with this still calm?\\n",
  "I couldn't win with just momentum?$",
]

[msg.section_0.entries.1199]
text = [
  "I found some Berries among the fallen\\n",
  "leaves, so... Here.\\c$",
]

[msg.section_0.entries.1200]
text = [
  "I wanted to know how Pokémon must feel\\n",
  "when they bury themselves underground,\\l\\n",
  "so I buried myself, too!$",
]

[msg.section_0.entries.1201]
text = [
  "Surprised? That's when I'll make my move!\\c$",
]

[msg.section_0.entries.1202]
text = [
  "Just as I'd expect!\\n",
  "You're ready for anything, aren't you?$",
]

[msg.section_0.entries.1203]
text = [
  "If you are prepared,\\n",
  "you don't have to worry!\\c$",
]

[msg.section_0.entries.1204]
text = [
  "I burrowed under the fallen leaves\\n",
  "to become one with nature!$",
]

[msg.section_0.entries.1205]
text = [
  "I'll show you the Ranger spirit that\\n",
  "burns with a crimson flame!\\c$",
]

[msg.section_0.entries.1206]
text = [
  "Oh! I see your Trainer spirit also burns\\n",
  "with a crimson flame!$",
]

[msg.section_0.entries.1207]
text = [
  "I'll offer you this in recognition of\\n",
  "your spirit.\\c$",
]

[msg.section_0.entries.1208]
text = [
  "My red costume really goes with the\\n",
  "leaves over here!$",
]

[msg.section_0.entries.1209]
text = [
  "What's this? A visitor? Ooh, I'm so happy\\n",
  "to meet someone else here!\\c\\n",
  "Could I ask you to be my opponent in a\\n",
  "long-awaited Pokémon battle?\\c$",
]

[msg.section_0.entries.1210]
text = [
  "It's all well and good fighting wild Pokémon,\\n",
  "but there is a certain thrill to be found in\\l\\n",
  "battling against another Trainer!$",
]

[msg.section_0.entries.1211]
text = [
  "This house... Doesn't it seem like the\\n",
  "furniture just moves itself?\\c\\n",
  "No! It's not me! I'm seriously not\\n",
  "moving it!$",
]

[msg.section_0.entries.1212]
text = [
  "You... Who are you?\\c\\n",
  "There is another person here besides me?\\n",
  "We don't need any Trainers here!\\c$",
]

[msg.section_0.entries.1213]
text = [
  "So you are a normal person...\\n",
  "A normal ⒆⒇ Trainer...$",
]

[msg.section_0.entries.1214]
text = [
  "This house...\\n",
  "It brims with fear, sorrow, defeat...\\c\\n",
  "So many feelings fill these walls, giving\\n",
  "rise to a mysterious energy.$",
]

[msg.section_0.entries.1215]
text = [
  "Feel this boiling spirit!\\n",
  "My Patrat is gonna amaze you!\\c$",
]

[msg.section_0.entries.1216]
text = [
  "Oh, this wilting spirit...\\n",
  "It wasn't supposed to end this way...$",
]

[msg.section_0.entries.1217]
text = [
  "This indomitable spirit!\\n",
  "I won't be brought down by losing!\\l\\n",
  "Moving forward is all that matters!$",
]

[msg.section_0.entries.1218]
text = [
  "A Triple Battle is a special battle you\\n",
  "can hold using three Pokémon!$",
]

[msg.section_0.entries.1219]
text = [
  "Behold the strength I have perfected\\n",
  "through Triple Battle!\\c$",
]

[msg.section_0.entries.1220]
text = [
  "How could this be...\\n",
  "I thought I'd perfected it...$",
]

[msg.section_0.entries.1221]
text = [
  "If you want to be the best, you need to\\n",
  "know the best moves and tricks for\\l\\n",
  "Triple Battles!$",
]

[msg.section_0.entries.1222]
text = [
  "In a Rotation Battle, you will battle\\n",
  "using three Pokémon!$",
]

[msg.section_0.entries.1223]
text = [
  "It's a Rotation Battle!\\n",
  "Will you go right? Will you go left?\\c$",
]

[msg.section_0.entries.1224]
text = [
  "Is it just a lack of experience that makes\\n",
  "me unsure which way to rotate?$",
]

[msg.section_0.entries.1225]
text = [
  "You have to make up for your lack of\\n",
  "experience with intellect and reasoning.\\c\\n",
  "If you don't, you will never be able to\\n",
  "win against more experienced Trainers.$",
]

[msg.section_0.entries.1226]
text = [
  "I feel invincible because I am surrounded\\n",
  "by the smiles of children and Pokémon!\\c$",
]

[msg.section_0.entries.1227]
text = [
  "Wow! Great, great!\\n",
  "You are very strong!$",
]

[msg.section_0.entries.1228]
text = [
  "Speak while making eye contact, and\\n",
  "express your feelings to each other...\\l\\n",
  "It's the same for people and Pokémon.$",
]

[msg.section_0.entries.1229]
text = [
  "Hey! Trainer!\\n",
  "Have a battle with me!\\c$",
]

[msg.section_0.entries.1230]
text = [
  "Oops. I have no healthy Pokémon\\n",
  "left to fight...$",
]

[msg.section_0.entries.1231]
text = [
  "Argh! You went all out against a kid!\\n",
  "...Actually, that's a good thing. Thanks!$",
]

[msg.section_0.entries.1232]
text = [
  "Take this!\\n",
  "Hyper Beam!\\c$",
]

[msg.section_0.entries.1233]
text = [
  "Whoops...$",
]

[msg.section_0.entries.1234]
text = [
  "A Hyper Beam? Hmm...no.\\n",
  "Maybe I want to do a Giga Impact now?$",
]

[msg.section_0.entries.1235]
text = [
  "Trainer!\\n",
  "I wanna play with you.\\c$",
]

[msg.section_0.entries.1236]
text = [
  "Trainer!\\n",
  "You too strong!$",
]

[msg.section_0.entries.1237]
text = [
  "Guess what! Guess what! When I grow up,\\n",
  "I'm gonna ride on Reshiram or Zekrom!$",
]

[msg.section_0.entries.1238]
text = [
  "When it comes to fishing, I'll do anything\\n",
  "and go anywhere to learn more!\\c\\n",
  "That's why I'll be asking you for\\n",
  "this battle!\\c$",
]

[msg.section_0.entries.1239]
text = [
  "You and your Pokémon make a pretty strong\\n",
  "team, huh?$",
]

[msg.section_0.entries.1240]
text = [
  "That's right! I'd check behind every sign\\n",
  "in the city if it was for fishing!$",
]

[msg.section_0.entries.1241]
text = [
  "If I don't live with my Pokémon, a\\n",
  "Fisherman like me won't be able to fish.\\l\\n",
  "I won't be able to battle either!\\c$",
]

[msg.section_0.entries.1242]
text = [
  "Right now I just feel like we're so lucky to\\n",
  "have Pokémon!$",
]

[msg.section_0.entries.1243]
text = [
  "Team Plasma...\\c\\n",
  "They reminded me how important the\\n",
  "time is that I have with my Pokémon.\\l\\n",
  "I'd almost begun to take it for granted.$",
]

[msg.section_0.entries.1244]
text = [
  "A Trainer catches another Trainer's eye.\\n",
  "That is the start of a Pokémon battle!\\c$",
]

[msg.section_0.entries.1245]
text = [
  "What?!\\n",
  "You are too strong!$",
]

[msg.section_0.entries.1246]
text = [
  "And I've done nothing but train my\\n",
  "Pokémon ever since I lost to that\\l\\n",
  "Trainer from Nuvema Town two years ago!$",
]

[msg.section_0.entries.1247]
text = [
  "Now dance gracefully!\\n",
  "Bring forth your beautiful moves!\\l\\n",
  "Let us perform, my lovely Pokémon!\\c$",
]

[msg.section_0.entries.1248]
text = [
  "Even though they lost,\\n",
  "my Pokémon are still cute!$",
]

[msg.section_0.entries.1249]
text = [
  "I'll make my cute Pokémon even stronger\\n",
  "by having battles with lots of Trainers!$",
]

[msg.section_0.entries.1250]
text = [
  "I've asked myself if it really is natural\\n",
  "for Pokémon to live with people.\\c\\n",
  "I still haven't come up with an answer.\\c\\n",
  "But we can still battle together!\\c$",
]

[msg.section_0.entries.1251]
text = [
  "All sorts of feelings are stirred up\\n",
  "by battling.$",
]

[msg.section_0.entries.1252]
text = [
  "Lose...and then accept all of the sorrow\\n",
  "and frustration that comes with the loss.\\c\\n",
  "That's what it means to be a Trainer--\\n",
  "what it means to live with Pokémon.$",
]

[msg.section_0.entries.1253]
text = [
  "Two years ago I parted ways with\\n",
  "my Pokémon...\\c\\n",
  "Yet in my heart, I've never stopped being\\n",
  "a Pokémon Trainer!\\c$",
]

[msg.section_0.entries.1254]
text = [
  "This is the type of defeat that only a\\n",
  "Pokémon Trainer can experience!$",
]

[msg.section_0.entries.1255]
text = [
  "Those lives that come into our world\\n",
  "as Pokémon...\\c\\n",
  "For me, being unsure if they really\\n",
  "wanted to live with humans, I parted\\l\\n",
  "ways with my Pokémon.\\c\\n",
  "But as it turns out, the time we spent\\n",
  "together seems to be the best of all.$",
]

[msg.section_0.entries.1256]
text = [
  "Beedrill! Volbeat!\\n",
  "Go, my beastly Bug-type Pokémon!\\c$",
]

[msg.section_0.entries.1257]
text = [
  "Your Pokémon uses those kinds of moves?!$",
]

[msg.section_0.entries.1258]
text = [
  "Different Trainers use\\n",
  "different kinds of Pokémon!\\l\\n",
  "That's fun to see, isn't it?$",
]

[msg.section_0.entries.1259]
text = [
  "I always lose...\\c\\n",
  "But I just want to see my Pokémon use\\n",
  "their moves and do their best!\\c$",
]

[msg.section_0.entries.1260]
text = [
  "Phew...\\n",
  "Your Pokémon... That was amazing!$",
]

[msg.section_0.entries.1261]
text = [
  "I always lose...\\c\\n",
  "But after battling so many times, I seem\\n",
  "to have become a little stronger!$",
]

[msg.section_0.entries.1262]
text = [
  "Backpackers are exactly what they\\n",
  "sound like.\\c\\n",
  "They set out on the road with only\\n",
  "the packs on their backs and the Pokémon\\l\\n",
  "in their Poké Balls!\\c$",
]

[msg.section_0.entries.1263]
text = [
  "I wish I could pack some wins in my\\n",
  "backpack, too...$",
]

[msg.section_0.entries.1264]
text = [
  "The purpose of the journey is found in\\n",
  "those that I meet!\\c\\n",
  "Isn't it great to encounter all the\\n",
  "different Pokémon there are in the world?$",
]

[msg.section_0.entries.1265]
text = [
  "Hm? You're headed for the Juniper\\n",
  "Pokémon Lab, are you?\\c\\n",
  "Won't you have a bit of fun first?\\c$",
]

[msg.section_0.entries.1266]
text = [
  "You were not an opponent one could\\n",
  "defeat without trying!$",
]

[msg.section_0.entries.1267]
text = [
  "I came all the way here wanting to hear\\n",
  "Professor Juniper talk!\\c\\n",
  "She was also a Backpacker once, so I bet\\n",
  "we'd have a great time swapping tales!$",
]

[msg.section_0.entries.1268]
text = [
  "I am not running now,\\n",
  "but I usually barrel through\\l\\n",
  "as quickly as I can!\\c$",
]

[msg.section_0.entries.1269]
text = [
  "I have not crossed\\n",
  "the finish line of victory!$",
]

[msg.section_0.entries.1270]
text = [
  "I'm going to use this little rest\\n",
  "to give you this present!\\c$",
]

[msg.section_0.entries.1271]
text = [
  "Run and run in cities\\n",
  "and on mountain paths!\\c\\n",
  "Run, and feel the world around you\\n",
  "with your whole being!$",
]

[msg.section_0.entries.1272]
text = [
  "I choose a move, and\\n",
  "my Pokémon will do the move.\\c\\n",
  "In a moment, that move will\\n",
  "reach your Pokémon!\\c$",
]

[msg.section_0.entries.1273]
text = [
  "I lost, but during the battle,\\n",
  "we were connected. Right?$",
]

[msg.section_0.entries.1274]
text = [
  "This Berry may connect\\n",
  "you and your Pokémon.\\c$",
]

[msg.section_0.entries.1275]
text = [
  "From today to tomorrow...\\n",
  "people, Pokémon, and the world...\\c\\n",
  "They're all connected, you know?$",
]

[msg.section_0.entries.1276]
text = [
  "I wanna be like the Trainers on Route 1!\\c$",
]

[msg.section_0.entries.1277]
text = [
  "S-so...this is Route 1!$",
]

[msg.section_0.entries.1278]
text = [
  "Pop quiz! What's so good about Route 1?\\c\\n",
  "Everything! It's number one, after all!\\n",
  "Get it?$",
]

[msg.section_0.entries.1279]
text = [
  "Pokémon and people...\\n",
  "And now you and I...\\c$",
]

[msg.section_0.entries.1280]
text = [
  "Pokémon and people...\\n",
  "That's what this world is made up of.$",
]

[msg.section_0.entries.1281]
text = [
  "A world without Pokémon?\\n",
  "I can't even imagine such a thing!$",
]

[msg.section_0.entries.1282]
text = [
  "Fishermen read the flow of water\\n",
  "or the flow of a battle!\\c$",
]

[msg.section_0.entries.1283]
text = [
  "The flow of the battle...\\n",
  "It's too wild to follow!$",
]

[msg.section_0.entries.1284]
text = [
  "The flow of water here on Route 17\\n",
  "is very wild.\\c\\n",
  "If you don't tap into it well,\\n",
  "you cannot go where you want!$",
]

[msg.section_0.entries.1285]
text = [
  "If I just dangle this fishing line here, it\\n",
  "looks like I'm doing something, right?\\c\\n",
  "Truth is, I'm not doing a single thing!\\c$",
]

[msg.section_0.entries.1286]
text = [
  "I got caught up in it...\\n",
  "Caught by my own bait...$",
]

[msg.section_0.entries.1287]
text = [
  "In fishing, you'll have good days and\\n",
  "you'll have bad days.\\c\\n",
  "But hey, losing is the mother of\\n",
  "all invention!$",
]

[msg.section_0.entries.1288]
text = [
  "I am good at backstroke,\\n",
  "freestyle, butterfly...\\l\\n",
  "And, of course, Pokémon battles!\\c$",
]

[msg.section_0.entries.1289]
text = [
  "Did I just lose a Pokémon battle,\\n",
  "even though I'm so good at them??$",
]

[msg.section_0.entries.1290]
text = [
  "Shall I practice my swimming?\\n",
  "Or shall I train my Pokémon?\\c\\n",
  "Hmmmm, it's hard to decide,\\n",
  "so I will swim with my Pokémon!$",
]

[msg.section_0.entries.1291]
text = [
  "Grrrmmm... All I do lately is grumble...\\c$",
]

[msg.section_0.entries.1292]
text = [
  "Mrrr... Mmmrrr...\\n",
  "Should I try to mumble “I lost\\\"?$",
]

[msg.section_0.entries.1293]
text = [
  "I wonder what is left after all my\\n",
  "grumbling and mumbling?$",
]

[msg.section_0.entries.1294]
text = [
  "I learned all the good points of my\\n",
  "Clamperl and Shellder by swimming\\l\\n",
  "with Pokémon!\\c$",
]

[msg.section_0.entries.1295]
text = [
  "What a fresh Trainer!\\n",
  "Really fresh, fresh!$",
]

[msg.section_0.entries.1296]
text = [
  "I'm a girl with everything...\\c\\n",
  "Well, everything but a place to\\n",
  "put my Poké Balls!$",
]

[msg.section_0.entries.1297]
text = [
  "I was taking a little break, but hey,\\n",
  "I always have time for Pokémon battles!\\l\\n",
  "Let's enjoy it as much as possible!\\c$",
]

[msg.section_0.entries.1298]
text = [
  "Wooosh!\\n",
  "Ssshhhh!!$",
]

[msg.section_0.entries.1299]
text = [
  "I'll tell you why I was taking a break.\\c\\n",
  "I have trouble with my bikini.\\n",
  "It could be washed away...$",
]

[msg.section_0.entries.1300]
text = [
  "When I look down from a high place,\\n",
  "I feel very good!\\c\\n",
  "Pokémon battles are the same!\\n",
  "I will fight looking down from the heights!\\c$",
]

[msg.section_0.entries.1301]
text = [
  "You're great!\\n",
  "I can't help but look up to you!$",
]

[msg.section_0.entries.1302]
text = [
  "We climb mountains because,\\n",
  "no matter how hard it is,\\l\\n",
  "the higher we climb,\\l\\n",
  "the closer we get to the sky!$",
]

[msg.section_0.entries.1303]
text = [
  "Down in a valley...\\n",
  "you and I face each other...\\c$",
]

[msg.section_0.entries.1304]
text = [
  "If you were the challenger, I'm sure even\\n",
  "Team Plasma would fall before you!$",
]

[msg.section_0.entries.1305]
text = [
  "Even if Team Plasma had succeeded in\\n",
  "releasing all of the Pokémon...\\c\\n",
  "I'm sure that people would have just\\n",
  "found other ways to fight.$",
]

[msg.section_0.entries.1306]
text = [
  "I would love it if you would join me in\\n",
  "a Rotation Battle.$",
]

[msg.section_0.entries.1307]
text = [
  "Your Pokémon and your strategy!\\n",
  "I'll be taking notes on both!\\c$",
]

[msg.section_0.entries.1308]
text = [
  "Now that I am a Veteran, I find there is\\n",
  "so much more to learn...$",
]

[msg.section_0.entries.1309]
text = [
  "Stronger Pokémon than anyone else...\\n",
  "An unbeatable strategy...\\c\\n",
  "There are no such certitudes in Pokémon\\n",
  "battle...and that is why it is so deep!$",
]

[msg.section_0.entries.1310]
text = [
  "I come to bear upon you now like a dragon\\n",
  "from above...!\\c$",
]

[msg.section_0.entries.1311]
text = [
  "Salamence... Even in defeat, you are the\\n",
  "most noble of Pokémon.$",
]

[msg.section_0.entries.1312]
text = [
  "A lone island in a distant sea...\\n",
  "A steep and treacherous ravine...\\c\\n",
  "Yes, this is what the noble and powerful\\n",
  "Dragon-type Pokémon is like.$",
]

[msg.section_0.entries.1313]
text = [
  "What's this? You don't seem to have\\n",
  "three healthy Pokémon.$",
]

[msg.section_0.entries.1314]
text = [
  "I may have been a Trainer for a very long\\n",
  "time, but I haven't gotten rusty!\\c$",
]

[msg.section_0.entries.1315]
text = [
  "I couldn't battle the way I pictured it in\\n",
  "my head...$",
]

[msg.section_0.entries.1316]
text = [
  "My skills may not be rusty, but it seems\\n",
  "my spirit might not be up to snuff...\\l\\n",
  "Getting too used to things is frightening.$",
]

[msg.section_0.entries.1317]
text = [
  "Oh no, I won't let a precious training\\n",
  "partner get away that easily!\\c$",
]

[msg.section_0.entries.1318]
text = [
  "A battle against a Trainer really is the\\n",
  "best training!$",
]

[msg.section_0.entries.1319]
text = [
  "Looking for training partners over here!\\c\\n",
  "I wouldn't say no to a girlfriend, either!$",
]

[msg.section_0.entries.1320]
text = [
  "Fights have their own rhythms!\\c\\n",
  "I wonder whose Pokémon\\n",
  "can fight rhythmically.\\c$",
]

[msg.section_0.entries.1321]
text = [
  "Your Pokémon!\\n",
  "Their movements are right on the beat!$",
]

[msg.section_0.entries.1322]
text = [
  "If my rhythm and the Pokémon's rhythm\\n",
  "are in sync, then I'm plenty happy!$",
]

[msg.section_0.entries.1323]
text = [
  "Ahhh! I've got my precious Litwick, so how\\n",
  "could I possibly lose?$",
]

[msg.section_0.entries.1324]
text = [
  "Target acquired!\\n",
  "Termination will now begin!\\c$",
]

[msg.section_0.entries.1325]
text = [
  "I was terminated...?\\n",
  "What a Trainer!$",
]

[msg.section_0.entries.1326]
text = [
  "We in Team Plasma are trying to keep all\\n",
  "the world's Pokémon for ourselves!\\c\\n",
  "If we succeed in doing that, then world\\n",
  "domination wouldn't be a stretch!$",
]

[msg.section_0.entries.1327]
text = [
  "Our king is gone...\\n",
  "But we are still here!\\c$",
]

[msg.section_0.entries.1328]
text = [
  "...Ugh.\\n",
  "Seasickness is the worst...$",
]

[msg.section_0.entries.1329]
text = [
  "We changed our uniforms so if the king\\n",
  "came back, he would know without\\l\\n",
  "a doubt that he didn't belong here!\\l\\n",
  "That traitorous little punk!$",
]

[msg.section_0.entries.1330]
text = [
  "How about we see how well I can use this\\n",
  "Pokémon I got!\\c$",
]

[msg.section_0.entries.1331]
text = [
  "Plasmaaaa!\\n",
  "...Hmph! No good, huh?$",
]

[msg.section_0.entries.1332]
text = [
  "They said that if I joined Team Plasma, I\\n",
  "could get powerful Pokémon and do\\l\\n",
  "whatever I liked!\\c\\n",
  "But this Pokémon I got...\\n",
  "It's useless!$",
]

[msg.section_0.entries.1333]
text = [
  "Aren't you pretty confident, waltzing\\n",
  "right into the enemy's stronghold!\\c$",
]

[msg.section_0.entries.1334]
text = [
  "Argh! No wonder you're so confident with\\n",
  "that kind of strength!$",
]

[msg.section_0.entries.1335]
text = [
  "Those idealistic fools who thought they\\n",
  "were saving Pokémon are all gone.\\c\\n",
  "All of us left here are real thugs\\n",
  "wanting to take over the world!$",
]

[msg.section_0.entries.1336]
text = [
  "Hi there! I'm a Pokémon thief by trade!\\c$",
]

[msg.section_0.entries.1337]
text = [
  "Hmph!\\n",
  "I missed my chance to grab your Pokémon!$",
]

[msg.section_0.entries.1338]
text = [
  "I will continue poaching Pokémon! I've\\n",
  "got to be at least a little stronger!$",
]

[msg.section_0.entries.1339]
text = [
  "...I trained myself endlessly for two\\n",
  "years to get justice for Team Plasma!\\c\\n",
  "I won't lose to anyone anymore!\\c$",
]

[msg.section_0.entries.1340]
text = [
  "...But if I lose, I won't be able to carry\\n",
  "out my justice!$",
]

[msg.section_0.entries.1341]
text = [
  "My plan for justice!\\c\\n",
  "I will carry it out no matter what anyone\\n",
  "says! No matter what!\\c\\n",
  "Not that you'd know anything about that!$",
]

[msg.section_0.entries.1342]
text = [
  "The fighting furies:\\n",
  "we are Team Plasma!\\c$",
]

[msg.section_0.entries.1343]
text = [
  "What's a strong Trainer, huh?\\n",
  "Just someone who uses their Pokémon?!$",
]

[msg.section_0.entries.1344]
text = [
  "Strong Trainers don't care anything\\n",
  "about their Pokémon!\\c\\n",
  "They're just bullies who force them to\\n",
  "get stronger no matter how hard it is!$",
]

[msg.section_0.entries.1345]
text = [
  "I will use Team Plasma's science to bring\\n",
  "out my Pokémon's greatest power!\\c$",
]

[msg.section_0.entries.1346]
text = [
  "Why are you strong? You're just a normal\\n",
  "person...not even that! You're just a kid!$",
]

[msg.section_0.entries.1347]
text = [
  "We in Team Plasma force our Pokémon to\\n",
  "use their powers to the max!\\c\\n",
  "Release Pokémon? Why would we do\\n",
  "something so bothersome as that?$",
]

[msg.section_0.entries.1348]
text = [
  "Pokémon Trainers are nothing more than\\n",
  "restraints on the legs of their Pokémon!\\c$",
]

[msg.section_0.entries.1349]
text = [
  "What?! You can actually draw out the power\\n",
  "of your Pokémon?!$",
]

[msg.section_0.entries.1350]
text = [
  "...If Pokémon stay with Trainers, they'll\\n",
  "be soft and won't ever be able to draw\\l\\n",
  "on their true power.\\c\\n",
  "...Do you think that is true?$",
]

[msg.section_0.entries.1351]
text = [
  "Everyone who isn't in Team Plasma is\\n",
  "an enemy!\\c$",
]

[msg.section_0.entries.1352]
text = [
  "...I hate you!$",
]

[msg.section_0.entries.1353]
text = [
  "I hate the world! I don't need a world\\n",
  "that doesn't recognize me!\\c\\n",
  "That's why I'll mess with you all as a\\n",
  "member of Team Plasma!$",
]

[msg.section_0.entries.1354]
text = [
  "Intruder sighted!\\c\\n",
  "I'll have you know that the Pokémon I'm\\n",
  "about to use was stolen from a child!\\c$",
]

[msg.section_0.entries.1355]
text = [
  "...What a weak Pokémon.\\n",
  "I'll just have to go steal some better ones!$",
]

[msg.section_0.entries.1356]
text = [
  "If we steal Pokémon, the number of\\n",
  "Trainers in the world will go down.\\l\\n",
  "Then we won't have any more enemies!$",
]

[msg.section_0.entries.1357]
text = [
  "In my own way, I'm a strong part of this\\n",
  "Team Plasma group!\\l\\n",
  "People call me the Bisharp woman!\\c$",
]

[msg.section_0.entries.1358]
text = [
  "Great plans are\\n",
  "always interrupted.$",
]

[msg.section_0.entries.1359]
text = [
  "You getting in our way means that you\\n",
  "find us worth the time, doesn't it?\\c\\n",
  "...Being ignored would make us feel\\n",
  "awfully lonely.\\c\\n",
  "Er, no, I mean even if you get in the\\n",
  "way, we'll take over the world this time!$",
]

[msg.section_0.entries.1360]
text = [
  "Even if we don't have our hero anymore,\\n",
  "we still won't lose!\\c$",
]

[msg.section_0.entries.1361]
text = [
  "Plasmaaaa!\\n",
  "Glory to Team Plasma!$",
]

[msg.section_0.entries.1362]
text = [
  "Maybe if Team Plasma can take over the\\n",
  "Unova region, our king will come back...$",
]

[msg.section_0.entries.1363]
text = [
  "I won't tolerate people\\n",
  "who have different ideas!\\c$",
]

[msg.section_0.entries.1364]
text = [
  "Argh...\\n",
  "I won't forgive you!$",
]

[msg.section_0.entries.1365]
text = [
  "I repeat! We won't tolerate people\\n",
  "who have different ideas!\\c\\n",
  "If Team Plasma takes over the world,\\n",
  "then everyone will think the same way!$",
]

[msg.section_0.entries.1366]
text = [
  "It's not just our outfits that have\\n",
  "changed around here!\\c\\n",
  "We're not living for the Pokémon anymore,\\n",
  "but for ourselves!\\c$",
]

[msg.section_0.entries.1367]
text = [
  "Whyyyy...?$",
]

[msg.section_0.entries.1368]
text = [
  "Our king abandoned us...\\c\\n",
  "We couldn't survive unless we changed\\n",
  "the way we thought...$",
]

[msg.section_0.entries.1369]
text = [
  "Target acquired!\\n",
  "Termination will now begin!\\c$",
]

[msg.section_0.entries.1370]
text = [
  "I was terminated...?\\n",
  "What a Trainer!$",
]

[msg.section_0.entries.1371]
text = [
  "We in Team Plasma are trying to keep all\\n",
  "the world's Pokémon for ourselves!\\c\\n",
  "If we succeed in doing that, then world\\n",
  "domination wouldn't be a stretch!$",
]

[msg.section_0.entries.1372]
text = [
  "Our king is gone...\\n",
  "But we are still here!\\c$",
]

[msg.section_0.entries.1373]
text = [
  "...Ugh.\\n",
  "Seasickness is the worst...$",
]

[msg.section_0.entries.1374]
text = [
  "We changed our uniforms so if the king\\n",
  "came back, he would know without\\l\\n",
  "a doubt that he didn't belong here!\\l\\n",
  "That traitorous little punk!$",
]

[msg.section_0.entries.1375]
text = [
  "How about we see how well I can use this\\n",
  "Pokémon I got!\\c$",
]

[msg.section_0.entries.1376]
text = [
  "Plasmaaaa!\\n",
  "...Hmph! No good, huh?$",
]

[msg.section_0.entries.1377]
text = [
  "They said that if I joined Team Plasma, I\\n",
  "could get powerful Pokémon and do\\l\\n",
  "whatever I liked!\\c\\n",
  "But this Pokémon I got...\\n",
  "It's useless!$",
]

[msg.section_0.entries.1378]
text = [
  "Aren't you pretty confident, waltzing\\n",
  "right into the enemy's stronghold!\\c$",
]

[msg.section_0.entries.1379]
text = [
  "Argh! No wonder you're so confident with\\n",
  "that kind of strength!$",
]

[msg.section_0.entries.1380]
text = [
  "Those idealistic fools who thought they\\n",
  "were saving Pokémon are all gone.\\c\\n",
  "All of us left here are real thugs\\n",
  "wanting to take over the world!$",
]

[msg.section_0.entries.1381]
text = [
  "Hi there! I'm a Pokémon thief by trade!\\c$",
]

[msg.section_0.entries.1382]
text = [
  "Hmph!\\n",
  "I missed my chance to grab your Pokémon!$",
]

[msg.section_0.entries.1383]
text = [
  "I will continue poaching Pokémon! I've\\n",
  "got to be at least a little stronger!$",
]

[msg.section_0.entries.1384]
text = [
  "...I trained myself endlessly for two\\n",
  "years to get justice for Team Plasma!\\c\\n",
  "I won't lose to anyone anymore!\\c$",
]

[msg.section_0.entries.1385]
text = [
  "...But if I lose, I won't be able to carry\\n",
  "out my justice!$",
]

[msg.section_0.entries.1386]
text = [
  "My plan for justice!\\c\\n",
  "I will carry it out no matter what anyone\\n",
  "says! No matter what!\\c\\n",
  "Not that you'd know anything about that!$",
]


  "I will work out today, too!!\\c$",
]

[msg.section_0.entries.457]
text = [
  "I...got worked over!$",
]

[msg.section_0.entries.458]
text = [
  "Thanks for always coming to Big Stadium!\\c$",
]

[msg.section_0.entries.459]
text = [
  "Your strength is\\n",
  "home-run class!$",
]

[msg.section_0.entries.460]
text = [
  "POWER!!!!\\c\\n",
  "I will win! My superior power\\n",
  "can blaze any trail!\\c$",
]

[msg.section_0.entries.461]
text = [
  "Is it possible that just having power\\n",
  "is not enough...?$",
]

[msg.section_0.entries.462]
text = [
  "I may not have enough power...\\n",
  "But I'm not lacking in kindness!\\c$",
]

[msg.section_0.entries.463]
text = [
  "Football games and Pokémon battles\\n",
  "both require power and technique.$",
]

[msg.section_0.entries.464]
text = [
  "Pokémon and Poké Balls\\n",
  "are my real friends!\\c\\n",
  "Join the training of\\n",
  "our Pokémon Eleven!\\c$",
]

[msg.section_0.entries.465]
text = [
  "Aghhhhh! I am such a rookie!\\n",
  "I've got more guts, though!$",
]

[msg.section_0.entries.466]
text = [
  "I've got enough of the strongest kind\\n",
  "of guts. I'll share them with you again!\\c$",
]

[msg.section_0.entries.467]
text = [
  "My Pokémon and I still\\n",
  "haven't practiced enough...\\l\\n",
  "To put it in levels, we're maybe a 50...$",
]

[msg.section_0.entries.468]
text = [
  "I've practiced and practiced\\n",
  "and become a great player!\\l\\n",
  "Now, let's play ball!\\c$",
]

[msg.section_0.entries.469]
text = [
  "Game over!$",
]

[msg.section_0.entries.470]
text = [
  "Here's a gift to show my thanks to\\n",
  "you for coming!\\c$",
]

[msg.section_0.entries.471]
text = [
  "Now, practice, practice, practice!\\c\\n",
  "Practicing over and over is the best way\\n",
  "to be good at anything!\\c\\n",
  "My hard work will make me a great player!$",
]

[msg.section_0.entries.472]
text = [
  "Kids! Please cooperate with the\\n",
  "special training for my Pokémon!\\c$",
]

[msg.section_0.entries.473]
text = [
  "My block was supposed to guard\\n",
  "against even Steel-type Pokémon...$",
]

[msg.section_0.entries.474]
text = [
  "This gift might be more effective\\n",
  "than my block!\\c$",
]

[msg.section_0.entries.475]
text = [
  "Physical therapy is over,\\n",
  "so we're doing some special training.$",
]

[msg.section_0.entries.476]
text = [
  "Let me tell you about the strength\\n",
  "of the team you create when\\l\\n",
  "you put a strong Pokémon at the core.\\c$",
]

[msg.section_0.entries.477]
text = [
  "...You taught me!\\n",
  "You are great!$",
]

[msg.section_0.entries.478]
text = [
  "I can give a pretty\\n",
  "great lecture, too!\\c$",
]

[msg.section_0.entries.479]
text = [
  "It looks like a team built around\\n",
  "a strong Pokémon--that is, an ace--\\l\\n",
  "has advantages and disadvantages.$",
]

[msg.section_0.entries.480]
text = [
  "Together, my Pokémon and I\\n",
  "are the world's strongest!!\\c$",
]

[msg.section_0.entries.481]
text = [
  "Wow! I didn't think anyone could\\n",
  "catch my blazing fastball!$",
]

[msg.section_0.entries.482]
text = [
  "Try to catch this!\\c$",
]

[msg.section_0.entries.483]
text = [
  "My fastballs are so fast,\\n",
  "nobody can hit them.\\c\\n",
  "Very few can catch my fastballs\\n",
  "except Pokémon.$",
]

[msg.section_0.entries.484]
text = [
  "I, I...\\n",
  "I'm not fat, am I?\\c$",
]

[msg.section_0.entries.485]
text = [
  "Ripped!$",
]

[msg.section_0.entries.486]
text = [
  "Ripped, I tell you!\\c$",
]

[msg.section_0.entries.487]
text = [
  "I am ripped!\\n",
  "I am not fat.$",
]

[msg.section_0.entries.488]
text = [
  "I have great footwork with the ball.\\n",
  "Poké Balls, too. See?\\c$",
]

[msg.section_0.entries.489]
text = [
  "After I let Pokémon out of\\n",
  "Poké Balls... Well, I am still practicing...$",
]

[msg.section_0.entries.490]
text = [
  "Handling items is a piece of cake!\\c$",
]

[msg.section_0.entries.491]
text = [
  "I should practice more\\n",
  "on Pokémon handling, too.$",
]

[msg.section_0.entries.492]
text = [
  "I play occasionally,\\n",
  "but I want to become a better player!\\c\\n",
  "So I will fight\\n",
  "a lot of Pokémon battles, too!\\c$",
]

[msg.section_0.entries.493]
text = [
  "UGHH!\\n",
  "I couldn't even pass the ball!$",
]

[msg.section_0.entries.494]
text = [
  "Hey, you might be a fan of mine.\\n",
  "I'll give you this!\\c$",
]

[msg.section_0.entries.495]
text = [
  "I will do anything to play better!\\n",
  "It's over if you get complacent!$",
]

[msg.section_0.entries.496]
text = [
  "An elegant Smasher\\n",
  "has an elegant battle!\\c$",
]

[msg.section_0.entries.497]
text = [
  "E-e-e-even though I lost,\\n",
  "I will not panic.$",
]

[msg.section_0.entries.498]
text = [
  "I panicked!\\n",
  "So, here, have this!\\c$",
]

[msg.section_0.entries.499]
text = [
  "Because I am a lady, I won't be,\\n",
  "well, you know,\\l\\n",
  "ch-ch-chagrined at losing.\\l\\n",
  "Well, maybe a teensy little bit.$",
]

[msg.section_0.entries.500]
text = [
  "I am in the starting lineup now,\\n",
  "but I will be even better soon!\\c\\n",
  "I will practice with a lot\\n",
  "of Pokémon battles!\\c$",
]

[msg.section_0.entries.501]
text = [
  "UGHH!\\n",
  "My field positioning was terrible!$",
]

[msg.section_0.entries.502]
text = [
  "But my passing technique is great!\\c$",
]

[msg.section_0.entries.503]
text = [
  "If I think about why I made a mistake\\n",
  "and correct it, I'll make fewer mistakes.\\c\\n",
  "And if I work to improve my strength,\\n",
  "I'll get even stronger!$",
]

[msg.section_0.entries.504]
text = [
  "As a proper lady, I am elegant\\n",
  "all the way down to my toes!\\c$",
]

[msg.section_0.entries.505]
text = [
  "Wahhhhh! What is this??$",
]

[msg.section_0.entries.506]
text = [
  "I even give gifts in an elegant fashion!\\c$",
]

[msg.section_0.entries.507]
text = [
  "Oh! I am a lady,\\n",
  "yet I have lost my nerve...$",
]

[msg.section_0.entries.508]
text = [
  "I've always played games,\\n",
  "but now I want to be the best player!\\c\\n",
  "I will practice with a lot of\\n",
  "Pokémon battles!\\c$",
]

[msg.section_0.entries.509]
text = [
  "UGHH! I missed the basket!\\n",
  "I was blocked!!$",
]

[msg.section_0.entries.510]
text = [
  "I'm gonna throw this item,\\n",
  "so you'd better block it!\\c$",
]

[msg.section_0.entries.511]
text = [
  "I won't give up games!\\n",
  "I won't accept limits!\\c\\n",
  "Nobody can stop me\\n",
  "as long as I want to improve!$",
]

[msg.section_0.entries.512]
text = [
  "I am a lady. I will challenge others\\n",
  "to battle elegantly!\\c$",
]

[msg.section_0.entries.513]
text = [
  "You should...\\n",
  "Go easy on me!$",
]

[msg.section_0.entries.514]
text = [
  "I even give gifts in an elegant fashion!\\c$",
]

[msg.section_0.entries.515]
text = [
  "B-b-b-because I am a lady...\\n",
  "waaaah...\\l\\n",
  "I will admit my defeat gracefully...$",
]

[msg.section_0.entries.516]
text = [
  "No matter how much I sweat,\\n",
  "I won't smell sweaty!\\c$",
]

[msg.section_0.entries.517]
text = [
  "A healthy sweat...\\n",
  "Boy, I am glad that I am an athlete!$",
]

[msg.section_0.entries.518]
text = [
  "Here's what us athletes\\n",
  "do as a greeting!\\c$",
]

[msg.section_0.entries.519]
text = [
  "After a battle, take a bath!\\n",
  "After eating, brush your teeth!$",
]

[msg.section_0.entries.520]
text = [
  "The world championships are coming soon!\\n",
  "I will practice volleys\\l\\n",
  "by using you as a wall!\\c$",
]

[msg.section_0.entries.521]
text = [
  "Oh, whew! Must...catch...my breath.\\n",
  "That was some good training...$",
]

[msg.section_0.entries.522]
text = [
  "Huh huh huh...\\n",
  "Lemme...catch...my breath...\\c$",
]

[msg.section_0.entries.523]
text = [
  "You and I have just met.\\n",
  "Let's start the game from the beginning!$",
]

[msg.section_0.entries.524]
text = [
  "Hey! Trainer!\\c\\n",
  "I will strike you from above.\\n",
  "My attack has a height!\\c$",
]

[msg.section_0.entries.525]
text = [
  "That's right.\\n",
  "The Pokémon do the fighting, not me...$",
]

[msg.section_0.entries.526]
text = [
  "How about this one?\\n",
  "It's got quite a flavor!\\c$",
]

[msg.section_0.entries.527]
text = [
  "We always play basketball\\n",
  "with Pokémon here!$",
]

[msg.section_0.entries.528]
text = [
  "I will show you a powerful serve!\\n",
  "Watch this burn in at 120 miles per hour!\\c$",
]

[msg.section_0.entries.529]
text = [
  "Your attack just now...\\n",
  "More powerful!$",
]

[msg.section_0.entries.530]
text = [
  "How about a powerful present?\\c$",
]

[msg.section_0.entries.531]
text = [
  "Pokémon are sending over\\n",
  "some powerful serves so I can practice.$",
]

[msg.section_0.entries.532]
text = [
  "Oh!\\n",
  "My groundbreaking research...$",
]

[msg.section_0.entries.533]
text = [
  "You're not bad!$",
]

[msg.section_0.entries.534]
text = [
  "Nice!\\n",
  "You're really good!$",
]

[msg.section_0.entries.535]
text = [
  "Oh ooohhh...$",
]

[msg.section_0.entries.536]
text = [
  "Wow!$",
]

[msg.section_0.entries.537]
text = [
  "After all, I am the strongest and greatest.\\n",
  "Just kidding!$",
]

[msg.section_0.entries.538]
text = [
  "Ahhh, that was fun!\\n",
  "But now I've got to get back to cleaning!$",
]

[msg.section_0.entries.539]
text = [
  "It's important to make a good first\\n",
  "impression on your opponent!$",
]

[msg.section_0.entries.540]
text = [
  "It's the final chapter!\\n",
  "Here's my last Pokémon!$",
]

[msg.section_0.entries.541]
text = [
  "I really want a happy ending this time!\\n",
  "I hate endings that leave a bitter taste.$",
]

[msg.section_0.entries.542]
text = [
  "Wow. I'm stunned.\\c\\n",
  "For all the words I know, I can't figure out\\n",
  "how to say this... Putting my feelings\\l\\n",
  "into words would just be a trap.\\c\\n",
  "All I will say is I feel you're even greater\\n",
  "than I thought!$",
]

[msg.section_0.entries.543]
text = [
  "I never thought you would use that move...\\n",
  "Not a bad choice at all.$",
]

[msg.section_0.entries.544]
text = [
  "Those who give up on themselves\\n",
  "can never claim victory!$",
]

[msg.section_0.entries.545]
text = [
  "There's got to be a way to win...\\n",
  "Even in the most extreme of conditions!$",
]

[msg.section_0.entries.546]
text = [
  "Which Pokémon should I raise?\\c\\n",
  "Which moves should I teach my Pokémon?\\c\\n",
  "What items should I give my Pokémon?\\c\\n",
  "You need to think everything through very\\n",
  "thoroughly if you want to win!\\c\\n",
  "In that sense, you're a very\\n",
  "impressive battler!$",
]

[msg.section_0.entries.547]
text = [
  "Oh! Strong as usual.\\n",
  "That makes my heart dance!$",
]

[msg.section_0.entries.548]
text = [
  "I may have only one Pokémon remaining,\\n",
  "but its strength knows no limits!$",
]

[msg.section_0.entries.549]
text = [
  "I'll put everything I have into\\n",
  "this next move!$",
]

[msg.section_0.entries.550]
text = [
  "There is no single strongest Pokémon\\n",
  "or sole best combination...\\c\\n",
  "That's why it is difficult\\n",
  "to keep winning.\\c\\n",
  "However, I think a heart that desires\\n",
  "strength and strives to grow\\l\\n",
  "stronger is a precious ideal.\\c\\n",
  "That is why I respect you--\\n",
  "because you have these things.$",
]

[msg.section_0.entries.551]
text = [
  "I will show you how harmonious\\n",
  "my Pokémon and I are!$",
]

[msg.section_0.entries.552]
text = [
  "Battling in extreme conditions\\n",
  "like this makes me stronger!$",
]

[msg.section_0.entries.553]
text = [
  "I will control my emotions and use them\\n",
  "as energy to help me obtain victory!$",
]

[msg.section_0.entries.554]
text = [
  "As impressive as always...\\c\\n",
  "No. You and your Pokémon were even\\n",
  "more elegant and excellent than before!\\c\\n",
  "To have been able to battle against\\n",
  "such a splendid team...\\c\\n",
  "My Pokémon and I learned so much!\\n",
  "I offer you my thanks.\\l\\n",
  "Please battle me again sometime.$",
]

[msg.section_0.entries.555]
text = [
  "When was the last time\\n",
  "I was driven into a corner like this?$",
]

[msg.section_0.entries.556]
text = [
  "You haven't won yet! I won't let\\n",
  "such a fun battle end so easily!$",
]

[msg.section_0.entries.557]
text = [
  "My heart is pounding so hard because I had\\n",
  "such a heated battle with you.\\c\\n",
  "You are a really great Trainer!!$",
]

[msg.section_0.entries.558]
text = [
  "What do you think? This Pokémon Gym...\\n",
  "How should I say? Isn't it full of...\\l\\n",
  "outrageous and mysterious charms?\\c$",
]

[msg.section_0.entries.559]
text = [
  "You've got quite a bit of charm\\n",
  "yourself, don't you?$",
]

[msg.section_0.entries.560]
text = [
  "Look carefully at the direction in which\\n",
  "the string extends from the cocoon.\\c\\n",
  "Find the end of the string, and\\n",
  "proceed in that direction!$",
]

[msg.section_0.entries.561]
text = [
  "...That's right.\\n",
  "I was taking a nap inside the cocoon!$",
]

[msg.section_0.entries.562]
text = [
  "You thought you could get\\n",
  "through here? Think again!\\c\\n",
  "Or so you thought!\\n",
  "I'm just blocking your way!\\c$",
]

[msg.section_0.entries.563]
text = [
  "My, my...\\n",
  "Aren't you a bit too strong?$",
]

[msg.section_0.entries.564]
text = [
  "Keep this a secret between you and me...\\c\\n",
  "Depending on which side you enter\\n",
  "the cocoon, you will come out somewhere\\l\\n",
  "different on the other end.$",
]

[msg.section_0.entries.565]
text = [
  "You're just one step away from\\n",
  "being able to challenge Burgh!\\c\\n",
  "But, before that, I have to\\n",
  "try to stop you!\\c$",
]

[msg.section_0.entries.566]
text = [
  "Your battling style is almost\\n",
  "as artistic as Burgh!$",
]

[msg.section_0.entries.567]
text = [
  "Burgh remodeled this Gym in order to\\n",
  "better understand the feelings Pokémon\\l\\n",
  "that wrap themselves in cocoons have.\\c\\n",
  "...Unfortunately, we can never seem to\\n",
  "find our way around as a result.$",
]

[msg.section_0.entries.568]
text = [
  "Strong winds, right?\\c\\n",
  "It represents the strength of us\\n",
  "and our Gym Leader!\\c\\n",
  "This is a Pokémon Gym! Let's have\\n",
  "us a Pokémon battle!\\c$",
]

[msg.section_0.entries.569]
text = [
  "I felt some intense pressure coming\\n",
  "from you and your Pokémon!$",
]

[msg.section_0.entries.570]
text = [
  "I'll give you some advice.\\c\\n",
  "If the floor is colored differently and\\n",
  "you're surrounded by walls, you probably\\l\\n",
  "won't get blown away by the wind.$",
]

[msg.section_0.entries.571]
text = [
  "My Pokémon is stronger than the wind.\\n",
  "It's my pride and joy!\\c$",
]

[msg.section_0.entries.572]
text = [
  "It may be stronger than the wind, but my\\n",
  "Pokémon isn't as strong as yours.$",
]

[msg.section_0.entries.573]
text = [
  "I became a Pilot so I could soar through\\n",
  "the skies alongside my flying Pokémon!$",
]

[msg.section_0.entries.574]
text = [
  "Sometimes you need to be bold,\\n",
  "while other times you need to be careful.\\c\\n",
  "You'll have to react accordingly if you\\n",
  "don't want to be blocked by the traps\\l\\n",
  "in this Gym!\\c$",
]

[msg.section_0.entries.575]
text = [
  "I couldn't block your path...\\n",
  "You're an impressive Trainer!$",
]

[msg.section_0.entries.576]
text = [
  "If you see the devices around you\\n",
  "start to spin quickly, you should hurry\\l\\n",
  "and find a place to hide from the wind!$",
]

[msg.section_0.entries.577]
text = [
  "If you can beat me, you'll be able\\n",
  "to face the Gym Leader...\\c\\n",
  "You're too careless if you think that!\\n",
  "Don't let your guard down yet!\\c$",
]

[msg.section_0.entries.578]
text = [
  "How could this be?!\\n",
  "I wasn't being careless at all!$",
]

[msg.section_0.entries.579]
text = [
  "Landing is the hardest part about\\n",
  "piloting a plane. You'd better stay\\l\\n",
  "alert until the very end!$",
]

[msg.section_0.entries.580]
text = [
  "Right side clear! Left side clear!\\c\\n",
  "Battle flight is ready for takeout!\\c\\n",
  "Err... I mean takeoff!\\c$",
]

[msg.section_0.entries.581]
text = [
  "Unfortunately...we are forced to land.$",
]

[msg.section_0.entries.582]
text = [
  "How far can you fly in the\\n",
  "face of strong winds?\\c\\n",
  "High performance is important for planes,\\n",
  "but perhaps feelings are what's\\l\\n",
  "important for people and Pokémon.$",
]

[msg.section_0.entries.583]
text = [
  "To have chosen that move...\\n",
  "I see! You'll be a powerful opponent!$",
]

[msg.section_0.entries.584]
text = [
  "As a Gym Leader, I aim to be a wall for\\n",
  "you to overcome!$",
]

[msg.section_0.entries.585]
text = [
  "This! This is what a real\\n",
  "Pokémon battle is!$",
]

[msg.section_0.entries.586]
text = [
  "I can feel your desire to win\\n",
  "pouring out of you!$",
]

[msg.section_0.entries.587]
text = [
  "It's not over yet! Time to turn\\n",
  "this show around for a victory!$",
]

[msg.section_0.entries.588]
text = [
  "Wait!\\n",
  "I was right in the middle of the chorus!$",
]

[msg.section_0.entries.589]
text = [
  "Lights, please! Time to show you\\n",
  "what Bug-type Pokémon are made of!$",
]

[msg.section_0.entries.590]
text = [
  "Mmm... I've got a bad feeling about this!\\n",
  "Could I be in trouble?$",
]

[msg.section_0.entries.591]
text = [
  "Hmm... It's over!\\n",
  "You're incredible!$",
]

[msg.section_0.entries.592]
text = [
  "You and your Pokémon's moves\\n",
  "are simply dazzling!$",
]

[msg.section_0.entries.593]
text = [
  "I've got to overcome this situation!\\n",
  "I can't let my fans down!$",
]

[msg.section_0.entries.594]
text = [
  "You shocked me through and through!\\n",
  "You melted my heart!$",
]

[msg.section_0.entries.595]
text = [
  "Impressive!\\n",
  "That's some strength you've got!$",
]

[msg.section_0.entries.596]
text = [
  "No hard feelings, but\\n",
  "I'm extremely stubborn!$",
]

[msg.section_0.entries.597]
text = [
  "Man oh man... It feels good to go all\\n",
  "out and still be defeated!$",
]

[msg.section_0.entries.598]
text = [
  "When I think about how you might\\n",
  "attack, it's like I'm walking on air!$",
]

[msg.section_0.entries.599]
text = [
  "Never give up! To do so is an insult to the\\n",
  "Pokémon who fight for you!$",
]

[msg.section_0.entries.600]
text = [
  "I won't forget this battle!\\n",
  "I'm glad that I could fight against you!$",
]

[msg.section_0.entries.601]
text = [
  "Whatever move you chose, it fills me with the\\n",
  "heat of battle!$",
]

[msg.section_0.entries.602]
text = [
  "My blood burns with even more fire at this\\n",
  "age! I've still got some fight in me!$",
]

[msg.section_0.entries.603]
text = [
  "This bitterness that floods me after\\n",
  "a defeat...\\c\\n",
  "The heart that does not succumb to such a\\n",
  "feeling is filled with energy and life!$",
]

[msg.section_0.entries.604]
text = [
  "Dude...\\n",
  "You're really into this, huh!$",
]

[msg.section_0.entries.605]
text = [
  "Awww, dude... I know I'm about done,\\n",
  "but I'm still just so pumped up!$",
]

[msg.section_0.entries.606]
text = [
  "You totally rocked that!\\n",
  "You're raising some wicked Pokémon.\\l\\n",
  "You got this Trainer thing down!$",
]

[msg.section_0.entries.607]
text = [

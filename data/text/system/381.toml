text = [
  "That pressure I felt from you just now...\\n",
  "What was that?!$",
]

[msg.section_0.entries.2066]
text = [
  "What a blunder to have made\\n",
  "in front of Zinzolin...$",
]

[msg.section_0.entries.2067]
text = [
  "My goal is to outperform Gym Leaders!\\c$",
]

[msg.section_0.entries.2068]
text = [
  "My Pokémon fought well, didn't they?$",
]

[msg.section_0.entries.2069]
text = [
  "When those triplets at Striaton\\n",
  "Restaurant go back to being Gym Leaders,\\l\\n",
  "I'll be the first in line to challenge 'em!$",
]

[msg.section_0.entries.2070]
text = [
  "Real battle is the best way to learn!\\c$",
]

[msg.section_0.entries.2071]
text = [
  "I'll learn from losing, as well!$",
]

[msg.section_0.entries.2072]
text = [
  "If you're working toward a goal, then\\n",
  "anything can be a chance to learn!\\c\\n",
  "...That's what Cheren said before he\\n",
  "became the Gym Leader.$",
]

[msg.section_0.entries.2073]
text = [
  "I'm going to review everything I learned\\n",
  "in the Trainers' School!\\c$",
]

[msg.section_0.entries.2074]
text = [
  "I'll have to work on that move some more...$",
]

[msg.section_0.entries.2075]
text = [
  "What kind of person is that Cheren guy\\n",
  "at Aspertia City's Trainers' School?$",
]

[msg.section_0.entries.2076]
text = [
  "This is a power spot!\\n",
  "It awakens your dormant power!\\c$",
]

[msg.section_0.entries.2077]
text = [
  "Did you spot my weakness?$",
]

[msg.section_0.entries.2078]
text = [
  "Long ago there was this Pokémon called\\n",
  "Musharna here that could eat dreams...\\l\\n",
  "and even make dreams real, or so\\l\\n",
  "people say.$",
]

[msg.section_0.entries.2079]
text = [
  "Eeek! Why? I foresaw your move,\\n",
  "and I was running away from you.\\c$",
]

[msg.section_0.entries.2080]
text = [
  "Eeek! I foresaw your thoughts,\\n",
  "but I lost!$",
]

[msg.section_0.entries.2081]
text = [
  "You can't help but to chase after what\\n",
  "runs and to want what you can't have!$",
]

[msg.section_0.entries.2082]
text = [
  "Let us conduct some Pokémon research.\\n",
  "Yes, let us show each other our Pokémon.\\c$",
]

[msg.section_0.entries.2083]
text = [
  "Mm, mm! A new discovery and an\\n",
  "ever-deepening mystery...$",
]

[msg.section_0.entries.2084]
text = [
  "The more you research, the more you\\n",
  "can discover.\\c\\n",
  "But with Pokémon, you can become friends\\n",
  "even without understanding everything.$",
]

[msg.section_0.entries.2085]
text = [
  "The mysterious psychic power! You cannot\\n",
  "see it, yet it is definitely there!\\c$",
]

[msg.section_0.entries.2086]
text = [
  "Argh! It's always like this!\\n",
  "I cannot see what really matters!$",
]

[msg.section_0.entries.2087]
text = [
  "The hole in a donut... There is nothing\\n",
  "there, and yet it exists. I love that!$",
]

[msg.section_0.entries.2088]
text = [
  "Going through trials is the best for\\n",
  "growing stronger!\\c$",
]

[msg.section_0.entries.2089]
text = [
  "You were the perfect trial!\\n",
  "I mean, come on, you're so strong!$",
]

[msg.section_0.entries.2090]
text = [
  "We raise our Pokémon by having\\n",
  "them battle!\\c\\n",
  "That's why I'll be asking you for a\\n",
  "Pokémon battle every time you come here!$",
]

[msg.section_0.entries.2091]
text = [
  "My serve is 120 miles per hour!\\c\\n",
  "That's the kind of killer attack I'm\\n",
  "about to show you!\\c$",
]

[msg.section_0.entries.2092]
text = [
  "Ohhh, I wanted to continue the rally just a\\n",
  "little bit longer!$",
]

[msg.section_0.entries.2093]
text = [
  "A rally that goes on for ages--it's\\n",
  "tough but still so fulfilling!$",
]

[msg.section_0.entries.2094]
text = [
  "Watch my furious tennis footwork!\\n",
  "You get it now? We're really tough!\\c$",
]

[msg.section_0.entries.2095]
text = [
  "But...but I'm tough enough to go all day\\n",
  "and all night...$",
]

[msg.section_0.entries.2096]
text = [
  "Someday I want to play a doubles match\\n",
  "with pairs of people and Pokémon.$",
]

[msg.section_0.entries.2097]
text = [
  "If only you had three Pokémon that were\\n",
  "ready for battle!$",
]

[msg.section_0.entries.2098]
text = [
  "Oh! You look pretty good!\\n",
  "Let's play some pickup!\\c$",
]

[msg.section_0.entries.2099]
text = [
  "That's game!\\n",
  "You totally crushed me.$",
]

[msg.section_0.entries.2100]
text = [
  "I wanna play at Small Court in\\n",
  "Nimbasa City someday...$",
]

[msg.section_0.entries.2101]
text = [
  "You don't even have three healthy\\n",
  "Pokémon? That's just odd!$",
]

[msg.section_0.entries.2102]
text = [
  "Fooling you fair and square!\\n",
  "That's what we call a trick play!\\c$",
]

[msg.section_0.entries.2103]
text = [
  "What the hoops?\\n",
  "I was the one who was tricked!$",
]

[msg.section_0.entries.2104]
text = [
  "How are you gonna get past an opponent?\\n",
  "That's vital for battles and basketball.$",
]

[msg.section_0.entries.2105]
text = [
  "See my extraordinarily pretty Pokémon!\\c$",
]

[msg.section_0.entries.2106]
text = [
  "Ahh! Its fire has been weakened?!$",
]

[msg.section_0.entries.2107]
text = [
  "When you feel a Pokémon breathing, you\\n",
  "can really feel how alive they are!$",
]

[msg.section_0.entries.2108]
text = [
  "L-E-T-S-G-O! Let's go! Let's go!\\c\\n",
  "We cheer on any Trainer who tries\\n",
  "his or her best!\\c$",
]

[msg.section_0.entries.2109]
text = [
  "May: Go, go, Pokémon!\\n",
  "Mal: Fight, fight, Trainer!$",
]

[msg.section_0.entries.2110]
text = [
  "The Trainer's commands call out!\\n",
  "The Pokémon's moves are decided!$",
]

[msg.section_0.entries.2111]
text = [
  "There're two of us, right?\\n",
  "So we wanna fight with two Pokémon!$",
]

[msg.section_0.entries.2112]
text = [
  "Let's go! Let's go! L-E-T-S-G-O!\\c\\n",
  "We cheer on every Pokémon that fights!\\c$",
]

[msg.section_0.entries.2113]
text = [
  "If the Pokémon and the Trainer don't\\n",
  "both do their best, they won't win!$",
]

[msg.section_0.entries.2114]
text = [
  "We love Double Battles! Understand?$",
]

[msg.section_0.entries.2115]
text = [
  "I fight for my love of Pokémon!\\c$",
]

[msg.section_0.entries.2116]
text = [
  "Your love of Pokémon really came through...$",
]

[msg.section_0.entries.2117]
text = [
  "That's your love of Pokémon!\\n",
  "Here's my love of Pokémon!\\c$",
]

[msg.section_0.entries.2118]
text = [
  "My love of Pokémon will always make them\\n",
  "feel better.$",
]

[msg.section_0.entries.2119]
text = [
  "Are people from the outside all so strong?$",
]

[msg.section_0.entries.2120]
text = [
  "Have we just been ignorant of the world?$",
]

[msg.section_0.entries.2121]
text = [
  "There's nothing left for me to say after a\\n",
  "beating like that!$",
]

[msg.section_0.entries.2122]
text = [
  "More!\\n",
  "Let me hear the voice of your Pokémon!$",
]

[msg.section_0.entries.2123]
text = [
  "For the sake of my friend who saved me, I\\n",
  "will never give up!$",
]

[msg.section_0.entries.2124]
text = [
  "You've got to value this time that you\\n",
  "have to get to know each other!$",
]

[msg.section_0.entries.2125]
text = [
  "Your Pokémon are happy...\\n",
  "They are happy to be with you.$",
]

[msg.section_0.entries.2126]
text = [
  "More!\\n",
  "Let me hear the voice of your Pokémon!$",
]

[msg.section_0.entries.2127]
text = [
  "For the sake of my friend who saved me, I\\n",
  "will never give up!$",
]

[msg.section_0.entries.2128]
text = [
  "You've got to value this time that you\\n",
  "have to get to know each other!$",
]

[msg.section_0.entries.2129]
text = [
  "Your Pokémon are happy...\\n",
  "They are happy to be with you.$",
]

[msg.section_0.entries.2130]
text = [
  "More!\\n",
  "Let me hear the voice of your Pokémon!$",
]

[msg.section_0.entries.2131]
text = [
  "For the sake of my friend who saved me, I\\n",
  "will never give up!$",
]

[msg.section_0.entries.2132]
text = [
  "You've got to value this time that you\\n",
  "have to get to know each other!$",
]

[msg.section_0.entries.2133]
text = [
  "Your Pokémon are happy...\\n",
  "They are happy to be with you.$",
]

[msg.section_0.entries.2134]
text = [
  "More!\\n",
  "Let me hear the voice of your Pokémon!$",
]

[msg.section_0.entries.2135]
text = [
  "For the sake of my friend who saved me, I\\n",
  "will never give up!$",
]

[msg.section_0.entries.2136]
text = [
  "You've got to value this time that you\\n",
  "have to get to know each other!$",
]

[msg.section_0.entries.2137]
text = [
  "Your Pokémon are happy...\\n",
  "They are happy to be with you.$",
]

[msg.section_0.entries.2138]
text = [
  "To have chosen that move...\\n",
  "I see! You'll be a powerful opponent!$",
]

[msg.section_0.entries.2139]
text = [
  "As a Gym Leader, I aim to be a wall for\\n",
  "you to overcome!$",
]

[msg.section_0.entries.2140]
text = [
  "This! This is what a real\\n",
  "Pokémon battle is!$",
]

[msg.section_0.entries.2141]
text = [
  "I can feel your desire to win\\n",
  "pouring out of you!$",
]

[msg.section_0.entries.2142]
text = [
  "It's not over yet! Time to turn\\n",
  "this show around for a victory!$",
]

[msg.section_0.entries.2143]
text = [
  "Wait!\\n",
  "I was right in the middle of the chorus!$",
]

[msg.section_0.entries.2144]
text = [
  "Lights, please! Time to show you\\n",
  "what Bug-type Pokémon are made of!$",
]

[msg.section_0.entries.2145]
text = [
  "Mmm... I've got a bad feeling about this!\\n",
  "Could I be in trouble?$",
]

[msg.section_0.entries.2146]
text = [
  "Hmm... It's over!\\n",
  "You're incredible!$",
]

[msg.section_0.entries.2147]
text = [
  "You and your Pokémon's moves\\n",
  "are simply dazzling!$",
]

[msg.section_0.entries.2148]
text = [
  "I've got to overcome this situation!\\n",
  "I can't let my fans down!$",
]

[msg.section_0.entries.2149]
text = [
  "You shocked me through and through!\\n",
  "You melted my heart!$",
]

[msg.section_0.entries.2150]
text = [
  "Impressive!\\n",
  "That's some strength you've got!$",
]

[msg.section_0.entries.2151]
text = [
  "No hard feelings, but\\n",
  "I'm extremely stubborn!$",
]

[msg.section_0.entries.2152]
text = [
  "Man oh man... It feels good to go all\\n",
  "out and still be defeated!$",
]

[msg.section_0.entries.2153]
text = [
  "When I think about how you might\\n",
  "attack, it's like I'm walking on air!$",
]

[msg.section_0.entries.2154]
text = [
  "Never give up! To do so is an insult to the\\n",
  "Pokémon who fight for you!$",
]

[msg.section_0.entries.2155]
text = [
  "I won't forget this battle!\\n",
  "I'm glad that I could fight against you!$",
]

[msg.section_0.entries.2156]
text = [
  "Whatever move you chose, it fills me with the\\n",
  "heat of battle!$",
]

[msg.section_0.entries.2157]
text = [
  "My blood burns with even more fire at\\n",
  "this age! I've still got some fight in me!$",
]

[msg.section_0.entries.2158]
text = [
  "This bitterness that floods me after\\n",
  "a defeat...\\c\\n",
  "The heart that does not succumb to such a\\n",
  "feeling is filled with energy and life!$",
]

[msg.section_0.entries.2159]
text = [
  "Dude...\\n",
  "You're really into this, huh!$",
]

[msg.section_0.entries.2160]
text = [
  "Awww, dude... I know I'm about done,\\n",
  "but I'm still just so pumped up!$",
]

[msg.section_0.entries.2161]
text = [
  "You totally rocked that!\\n",
  "You're raising some wicked Pokémon.\\l\\n",
  "You got this Trainer thing down!$",
]

[msg.section_0.entries.2162]
text = [
  "First impressions are everything!$",
]

[msg.section_0.entries.2163]
text = [
  "It's not over yet!\\n",
  "I'll finish it my way!$",
]

[msg.section_0.entries.2164]
text = [
  "I hope for a good ending! I hate endings\\n",
  "that leave a bitter taste in one's mouth!$",
]

[msg.section_0.entries.2165]
text = [
  "Do you ever feel at a loss for words when\\n",
  "something greatly moves you?\\l\\n",
  "To tell the truth...\\c\\n",
  "I'm a writer, but right now I'm having\\n",
  "trouble putting my feelings into words.\\c\\n",
  "You were just that impressive!$",
]

[msg.section_0.entries.2166]
text = [
  "Now why would you use that move? If I can\\n",
  "figure that out, I may be able to win!$",
]

[msg.section_0.entries.2167]
text = [
  "A beautiful loss is still a loss,\\n",
  "and an ugly win is still a win!$",
]

[msg.section_0.entries.2168]
text = [
  "Even in a tough situation like this,\\n",
  "there must be a way to triumph!$",
]

[msg.section_0.entries.2169]
text = [
  "Where there's a winner,\\n",
  "there's also a loser.\\c\\n",
  "It's pathetic to make a big deal out\\n",
  "of losing if you weren't prepared.\\c\\n",
  "If you're a true Pokémon battler,\\n",
  "you'll reflect upon your loss and\\l\\n",
  "think about how to win next time!$",
]

[msg.section_0.entries.2170]
text = [
  "I can feel it!\\n",
  "You and your Pokémon are strong!$",
]

[msg.section_0.entries.2171]
text = [
  "This is my final Pokémon!\\n",
  "It all comes down to this!$",
]

[msg.section_0.entries.2172]
text = [
  "Everything comes down to this next move!\\n",
  "I'll use the last bit of my strength!$",
]

[msg.section_0.entries.2173]
text = [
  "There is no single strongest Pokémon\\n",
  "or sole best combination...\\c\\n",
  "That's why it is difficult\\n",
  "to keep winning.\\c\\n",
  "However, I think a heart that desires\\n",
  "strength and strives to grow\\l\\n",
  "stronger is a precious ideal.\\c\\n",
  "That is why I respect you--\\n",
  "because you have these things.$",
]

[msg.section_0.entries.2174]
text = [
  "I have a feeling this battle will give my\\n",
  "Pokémon a chance to go all out!$",
]

[msg.section_0.entries.2175]
text = [
  "I can't believe it's come to this!\\n",
  "I must have gotten complacent.$",
]

[msg.section_0.entries.2176]
text = [
  "Ohhh, that's it! I'll go all out if it'll get\\n",
  "me a win!$",
]

[msg.section_0.entries.2177]
text = [
  "You and your Pokémon are\\n",
  "both excellent and elegant.\\c\\n",
  "To have been able to battle against\\n",
  "such a splendid team...\\c\\n",
  "My Pokémon and I learned a lot!\\n",
  "I offer you my thanks.$",
]

[msg.section_0.entries.2178]
text = [
  "It's important to make a good first\\n",
  "impression on your opponent!$",
]

[msg.section_0.entries.2179]
text = [
  "It's the final chapter!\\n",
  "Here's my last Pokémon!$",
]

[msg.section_0.entries.2180]
text = [
  "I really want a happy ending this time!\\n",
  "I hate endings that leave a bitter taste.$",
]

[msg.section_0.entries.2181]
text = [
  "Wow. I'm stunned.\\c\\n",
  "For all the words I know, I can't figure out\\n",
  "how to say this... Putting my feelings\\l\\n",
  "into words would just be a trap.\\c\\n",
  "All I will say is I feel you're even greater\\n",
  "than I thought!$",
]

[msg.section_0.entries.2182]
text = [
  "I never thought you would use that move...\\n",
  "Not a bad choice at all.$",
]

[msg.section_0.entries.2183]
text = [
  "Those who give up on themselves\\n",
  "can never claim victory!$",
]

[msg.section_0.entries.2184]
text = [
  "There's got to be a way to win...\\n",
  "Even in the most extreme of conditions!$",
]

[msg.section_0.entries.2185]
text = [
  "Which Pokémon should I raise?\\c\\n",
  "Which moves should I teach my Pokémon?\\c\\n",
  "What items should I give my Pokémon?\\c\\n",
  "You need to think everything through very\\n",
  "thoroughly if you want to win!\\c\\n",
  "In that sense, you're a very\\n",
  "impressive battler!$",
]

[msg.section_0.entries.2186]
text = [
  "Oh! Strong as usual.\\n",
  "That makes my heart dance!$",
]

[msg.section_0.entries.2187]
text = [
  "I may have only one Pokémon remaining,\\n",
  "but its strength knows no limits!$",
]

[msg.section_0.entries.2188]
text = [
  "I'll put everything I have into\\n",
  "this next move!$",
]

[msg.section_0.entries.2189]
text = [
  "There is no single strongest Pokémon\\n",
  "or sole best combination...\\c\\n",
  "That's why it is difficult\\n",
  "to keep winning.\\c\\n",
  "However, I think a heart that desires\\n",
  "strength and strives to grow\\l\\n",
  "stronger is a precious ideal.\\c\\n",
  "That is why I respect you--\\n",
  "because you have these things.$",
]

[msg.section_0.entries.2190]
text = [
  "I will show you how harmonious\\n",
  "my Pokémon and I are!$",
]

[msg.section_0.entries.2191]
text = [
  "Battling in extreme conditions\\n",
  "like this makes me stronger!$",
]

[msg.section_0.entries.2192]
text = [
  "I will control my emotions and use them\\n",
  "as energy to help me obtain victory!$",
]

[msg.section_0.entries.2193]
text = [
  "As impressive as always...\\c\\n",
  "No. You and your Pokémon were even\\n",
  "more elegant and excellent than before!\\c\\n",
  "To have been able to battle against\\n",
  "such a splendid team...\\c\\n",
  "My Pokémon and I learned so much!\\n",
  "I offer you my thanks.\\l\\n",
  "Please battle me again sometime.$",
]

[msg.section_0.entries.2194]
text = [
  "This is my path!\\c$",
]

[msg.section_0.entries.2195]
text = [
  "This is everyone's path!$",
]

[msg.section_0.entries.2196]
text = [
  "Go forth on your path!$",
]

[msg.section_0.entries.2197]
text = [
  "Ai! Ai! Ai!\\n",
  "Hi-yaaah!\\c$",
]

[msg.section_0.entries.2198]
text = [
  "Aww...\\n",
  "It was my turn next...$",
]

[msg.section_0.entries.2199]
text = [
  "If you like sparring with Pokémon, you've\\n",
  "got to see Drayden in Opelucid City!\\l\\n",
  "He's my idol!$",
]

[msg.section_0.entries.2200]
text = [
  "Hi-ho!\\c$",
]

[msg.section_0.entries.2201]
text = [
  "Hi-ho...$",
]

[msg.section_0.entries.2202]
text = [
  "Once you've reached the top of a peak,\\n",
  "there's no place to go but down.\\c\\n",
  "Life is full of ups and downs.$",
]

[msg.section_0.entries.2203]
text = [
  "Hey there, future Champion!\\c$",
]

[msg.section_0.entries.2204]
text = [
  "Gwahaha! When someone wins, their opponent\\n",
  "has to lose. Isn't that right?$",
]

[msg.section_0.entries.2205]
text = [
  "If there were no Pokémon, we wouldn't\\n",
  "worry about who's strong or who's weak.\\c\\n",
  "But we also wouldn't have had the chance\\n",
  "to meet and battle like this, I suppose.$",
]

[msg.section_0.entries.2206]
text = [
  "Let's fight!\\c$",
]

[msg.section_0.entries.2207]
text = [
  "You took a win from me!\\n",
  "Arrrgh! It's so frustrating!$",
]

[msg.section_0.entries.2208]
text = [
  "I'll use the bitterness of this defeat\\n",
  "to reach even greater heights!\\c\\n",
  "That's right! There'd be no progress\\n",
  "in the world without loss!$",
]

[msg.section_0.entries.2209]
text = [
  "Your Pokémon must be really something if\\n",
  "you're here on Route 23!\\c$",
]

[msg.section_0.entries.2210]
text = [
  "Hahaha! Pokémon are so much fun!$",
]

[msg.section_0.entries.2211]
text = [
  "It's lots of fun here, 'cause there're\\n",
  "only awesome Pokémon. I'm so pumped!$",
]

[msg.section_0.entries.2212]
text = [
  "I keep a tally of all of the times that I\\n",
  "have won or lost up until today.\\c\\n",
  "If I battle against you, I wonder which\\n",
  "number will be increased.\\c$",
]

[msg.section_0.entries.2213]
text = [
  "So my number of losses went up...$",
]

[msg.section_0.entries.2214]
text = [
  "I'm not interested in anything\\n",
  "but Pokémon!\\c\\n",
  "It may not be balanced, but I'm satisfied\\n",
  "living like this!$",
]

[msg.section_0.entries.2215]
text = [
  "This is the concerto I perform with my\\n",
  "most beloved Pokémon!\\c$",
]

[msg.section_0.entries.2216]
text = [
  "Your side is much more in harmony!$",
]

[msg.section_0.entries.2217]
text = [
  "I have been together with Pokémon since\\n",
  "I was born, and I've battled my\\l\\n",
  "whole life.\\c\\n",
  "I hope we're together even at the end\\n",
  "of all things.$",
]

[msg.section_0.entries.2218]
text = [
  "I may be a Backpacker, but I'm also\\n",
  "a Treasure Hunter!\\c$",
]

[msg.section_0.entries.2219]
text = [
  "I missed my chance for that elusive\\n",
  "treasure called “victory\\\"!$",
]

[msg.section_0.entries.2220]
text = [
  "Have you heard of the Magma Stone?\\c\\n",
  "They say it lies in a volcano somewhere\\n",
  "and has something to do with Pokémon.\\c\\n",
  "You put it somewhere...or remove it from\\n",
  "somewhere...and it'll summon\\l\\n",
  "some Pokémon.\\l\\n",
  "No one's that clear on the details.$",
]

[msg.section_0.entries.2221]
text = [
  "Let's train!\\n",
  "We'll get stronger with our Pokémon!\\c\\n",
  "Then we can challenge the Gyms in places\\n",
  "like Opelucid City and Humilau City!\\c$",
]

[msg.section_0.entries.2222]
text = [
  "Not yet! I still haven't shared my true\\n",
  "strength with you!$",
]

[msg.section_0.entries.2223]
text = [
  "My Pokémon are really, really important\\n",
  "to me.\\c\\n",
  "They've always been by my side to see my\\n",
  "smiles of joy and tears of frustration!$",
]

[msg.section_0.entries.2224]
text = [
  "I'm the Treasure Hunter pretending to be\\n",
  "a Backpacker!\\c$",
]

[msg.section_0.entries.2225]
text = [
  "I missed my chance for that elusive\\n",
  "treasure called “victory\\\"!$",
]

[msg.section_0.entries.2226]
text = [
  "Have you heard of the Magma Stone?\\c\\n",
  "They say it lies in a volcano somewhere\\n",
  "and has something to do with Pokémon.\\c\\n",
  "You put it somewhere...or remove it from\\n",
  "somewhere...and it'll summon\\l\\n",
  "some Pokémon.\\l\\n",
  "No one's that clear on the details.$",
]

[msg.section_0.entries.2227]
text = [
  "Let's train!\\n",
  "We'll get stronger with our Pokémon!\\c\\n",
  "Then we can challenge the Gyms in places\\n",
  "like Opelucid City and Humilau City!\\c$",
]

[msg.section_0.entries.2228]
text = [
  "Not yet! I still haven't shared my true\\n",
  "strength with you!$",
]

[msg.section_0.entries.2229]
text = [
  "My Pokémon are like my really important\\n",
  "brothers and sisters.\\c\\n",
  "Ever since I was born, they've been with\\n",
  "me, sharing my smiles and tears!$",
]

[msg.section_0.entries.2230]
text = [
  "Hear the cry of my heart!\\c\\n",
  "“Everyone, SIT DOWN and SHUT UP!\\\"\\c$",
]

[msg.section_0.entries.2231]
text = [
  "Hah... Hah... Hah... I feel a bit better now\\n",
  "that I've let that out.$",
]

[msg.section_0.entries.2232]
text = [
  "I like kids and Pokémon both, but I'm\\n",
  "just not that nice!$",
]

[msg.section_0.entries.2233]
text = [
  "Hey, you!\\n",
  "You're gonna lose and cry!\\c$",
]

[msg.section_0.entries.2234]
text = [
  "...Grrr!$",
]

[msg.section_0.entries.2235]
text = [
  "That's it! I'm gonna become Champion, and\\n",
  "then I'll blow you outta the water!$",
]

[msg.section_0.entries.2236]
text = [
  "...You look tough.\\c\\n",
  "All right! My Pokémon are burning for\\n",
  "a fight against a tough opponent!\\c$",
]

[msg.section_0.entries.2237]
text = [
  "Arg!\\n",
  "I wasn't able to give good orders.$",
]

[msg.section_0.entries.2238]
text = [
  "What do you think would happen if we had\\n",
  "our Pokémon fight without any orders?$",
]

[msg.section_0.entries.2239]
text = [
  "Ta-da!\\n",
  "Here's my cute Pokémon!\\c$",
]

[msg.section_0.entries.2240]
text = [
  "Oh maaan!$",
]

[msg.section_0.entries.2241]
text = [
  "...It's OK. My precious Pokémon will\\n",
  "make me feel better when we get home.$",
]

[msg.section_0.entries.2242]
text = [
  "Come on! More!\\n",
  "Bring out your Pokémon's power!$",
]

[msg.section_0.entries.2243]
text = [
  "I'm more psyched than I've ever been!\\n",
  "I can still go on!$",
]

[msg.section_0.entries.2244]
text = [
  "So this is what it means to draw forth the\\n",
  "power hidden in your Pokémon!$",
]

[msg.section_0.entries.2245]
text = [
  "I just won a battle back there, so I'm\\n",
  "feeling good!\\c$",
]

[msg.section_0.entries.2246]
text = [
  "Oh, whatever!\\n",
  "I'm in a terrible mood now!$",
]

[msg.section_0.entries.2247]
text = [
  "I think I'm gonna go to bed...\\c\\n",
  "I'm not enough of a man to be able\\n",
  "to get right back up and try again.$",
]

[msg.section_0.entries.2248]
text = [
  "And I was so excited, too...$",
]

[msg.section_0.entries.2249]
text = [
  "The pain of my Pokémon...\\n",
  "I feel it, too!$",
]

[msg.section_0.entries.2250]
text = [
  "I'll hone my mind and become one with\\n",
  "my Pokémon!$",
]

[msg.section_0.entries.2251]
text = [
  "No! Not yet!\\n",
  "No! We can fight on!!$",
]

[msg.section_0.entries.2252]
text = [
  "Phew...\\n",
  "I gave it everything I had, but still...\\l\\n",
  "I just couldn't win...\\c\\n",
  "Thanks, though!\\n",
  "We're going to keep aiming higher!$",
]

[msg.section_0.entries.2253]
text = [
  "Come! Satisfy my urge to battle!$",
]

[msg.section_0.entries.2254]
text = [
  "Marvelous! I shall believe in my Pokémon!$",
]

[msg.section_0.entries.2255]
text = [
  "If-if I'd believed more, could I have\\n",
  "drawn out my Pokémon's power?$",
]

[msg.section_0.entries.2256]
text = [
  "The bonds between us... Does the fact that\\n",
  "we can't see them make them more real?$",
]

[msg.section_0.entries.2257]
text = [
  "If that is the move you chose\\n",
  "after serious consideration, that's fine!$",
]

[msg.section_0.entries.2258]
text = [
  "Woooo! Your inexhaustible fighting spirit!\\n",
  "Impressive!$",
]

[msg.section_0.entries.2259]
text = [
  "Good! That strength is good!\\n",
  "But I'm going to send it back at you!$",
]

[msg.section_0.entries.2260]
text = [
  "After the battle, a fresh wind\\n",
  "blew through my heart...$",
]

[msg.section_0.entries.2261]
text = [
  "Ah... I see...\\n",
  "That was quite well thought out.$",
]

[msg.section_0.entries.2262]
text = [
  "After all, I am the strongest and greatest.\\n",
  "Just kidding!$",
]

[msg.section_0.entries.2263]
text = [
  "Ugh!\\n",
  "I can't take much more of this...$",
]

[msg.section_0.entries.2264]
text = [
  "Phew! I'll at least let my Pokémon take\\n",
  "it easy on their days off!$",
]

[msg.section_0.entries.2265]
text = [
  "To have a chance to battle with such\\n",
  "strong Pokémon...it was worth the wait!$",
]

[msg.section_0.entries.2266]
text = [
  "The world is wide, and the road to glory\\n",
  "is full of challenges!$",
]

[msg.section_0.entries.2267]
text = [
  "Amazing! So that's what a Pokémon\\n",
  "from the city is like!$",
]

[msg.section_0.entries.2268]
text = [
  "Thanks for playing with me\\n",
  "while my parents are busy!$",
]

[msg.section_0.entries.2269]
text = [
  "Amazing...\\n",
  "Please, take me away with you!$",
]

[msg.section_0.entries.2270]
text = [
  "What great Pokémon you have!\\n",
  "Thanks so much! I had a great time!$",
]

[msg.section_0.entries.2271]
text = [
  "Impressive display!\\n",
  "...Shall we break for tea?$",
]

[msg.section_0.entries.2272]
text = [
  "Ahhh, that was fun!\\n",
  "But now I've got to get back to cleaning!$",
]

[msg.section_0.entries.2273]
text = [
  "Huhhh?!\\n",
  "What happened, Excadrill?$",
]

[msg.section_0.entries.2274]
text = [
  "Huhhh?!\\n",
  "What happened, Hippowdon?$",
]

[msg.section_0.entries.2275]
text = [
  "Oh! Plasmaaaa!\\n",
  "Glory to Team Plasma!$",
]

[msg.section_0.entries.2276]
text = [
  "Plasmaaaa!\\n",
  "What a pesky little kid!$",
]

[msg.section_0.entries.2277]
text = [
  "The pain of my Pokémon...\\n",
  "I feel it, too!$",
]

[msg.section_0.entries.2278]
text = [
  "I'll hone my mind and become one with\\n",
  "my Pokémon!$",
]

[msg.section_0.entries.2279]
text = [
  "No! Not yet!\\n",
  "No! We can fight on!!$",
]

[msg.section_0.entries.2280]
text = [
  "Aghhhh...\\n",
  "I did my best, but we lost...$",
]

[msg.section_0.entries.2281]
text = [
  "The pain of my Pokémon...\\n",
  "I feel it, too!$",
]

[msg.section_0.entries.2282]
text = [
  "I'll hone my mind and become one with\\n",
  "my Pokémon!$",
]

[msg.section_0.entries.2283]
text = [
  "No! Not yet!\\n",
  "No! We can fight on!!$",
]

[msg.section_0.entries.2284]
text = [
  "Phew...\\n",
  "I gave it everything I had, but still...\\l\\n",
  "I just couldn't win...\\c\\n",
  "Thanks, though!\\n",
  "We're going to keep aiming higher!$",
]

[msg.section_0.entries.2285]
text = [
  "Knave!\\n",
  "I do ambush thee!\\c$",
]

[msg.section_0.entries.2286]
text = [
  "W-woe is me...$",
]

[msg.section_0.entries.2287]
text = [
  "If that be the case then... Farewell!\\n",
  "Forgive me!$",
]

[msg.section_0.entries.2288]
text = [
  "Oh-ho-ho!\\n",
  "You've been ambushed!\\c$",
]

[msg.section_0.entries.2289]
text = [
  "I lost!\\n",
  "No! Plasmaaaa!$",
]

[msg.section_0.entries.2290]
text = [
  "Lose! J-just go and lose already!\\n",
  "A kid like you should definitely lose!$",
]

[msg.section_0.entries.2291]
text = [
  "Stupid intruders!\\n",
  "I'm gonna blast you into space!\\c$",
]

[msg.section_0.entries.2292]
text = [
  "But...aren't I one of Team Plasma's stars?$",
]

[msg.section_0.entries.2293]
text = [
  "First Team Galactic fell apart...\\c\\n",
  "Then I come all the way to Unova to join\\n",
  "Team Plasma, and now you!$",
]

[msg.section_0.entries.2294]
text = [
  "What's this? You think you can beat me,\\n",
  "the one they call queen of Team Plasma?\\c$",
]

[msg.section_0.entries.2295]
text = [
  "Your face...it really drives me mad!$",
]

[msg.section_0.entries.2296]
text = [
  "See, I'm going to take over the world and\\n",
  "then make that idiot N pay!\\c\\n",
  "That traitor...\\n",
  "Just his face makes me so mad!$",
]

[msg.section_0.entries.2297]
text = [
  "If Team Plasma takes over the world,\\n",
  "there should be fewer Pokémon injured.\\c$",
]

[msg.section_0.entries.2298]
text = [
  "Grr... Tell me! Please!\\n",
  "Just what is a Pokémon battle?!$",
]

[msg.section_0.entries.2299]
text = [
  "Injured Pokémon have both enemies\\n",
  "and friends!\\c$",
]

[msg.section_0.entries.2300]
text = [
  "Don't you think there will be less war if\\n",
  "Team Plasma takes over the world?$",
]

[msg.section_0.entries.2301]
text = [
  "Hey there!\\n",
  "Have you seen any intruders?\\c\\n",
  "Wait, you're not...?!\\c$",
]

[msg.section_0.entries.2302]
text = [
  "What an audacious Trainer you are, to waltz\\n",
  "right into our Plasma Frigate!$",
]

[msg.section_0.entries.2303]
text = [
  "Tremble in the face of the skill that\\n",
  "made this Plasma Frigate! Then leave!$",
]

[msg.section_0.entries.2304]
text = [
  "You people! Don't get cocky just because\\n",
  "you've got Pokémon!\\c\\n",
  "We've got Pokémon, too!\\n",
  "Pokémon that we've stolen from all over!\\c$",
]

[msg.section_0.entries.2305]
text = [
  "What makes your Pokémon so different\\n",
  "from mine?$",
]

[msg.section_0.entries.2306]
text = [
  "What is this! Who would come after us with\\n",
  "only two people?!$",
]

[msg.section_0.entries.2307]
text = [
  "You're getting annoyed by the Plasma\\n",
  "Frigate's gimmicks, aren't you?\\c$",
]

[msg.section_0.entries.2308]
text = [
  "Arghhhh!\\n",
  "I'm so super annoyed!$",
]

[msg.section_0.entries.2309]
text = [
  "We spent so much money on all the Plasma\\n",
  "Frigate's gimmicks that we've none left!\\l\\n",
  "All we get to eat every day is bread!$",
]

[msg.section_0.entries.2310]
text = [
  "I'm the fighting sweeper!\\n",
  "I'll clean up garbage like you!\\c$",
]

[msg.section_0.entries.2311]
text = [
  "Oops...$",
]

[msg.section_0.entries.2312]
text = [
  "The fact that I let you sneak in here\\n",
  "means I'll probably lose my Pokémon, huh?\\c\\n",
  "The Pokémon we stole with that plan two\\n",
  "years ago are running out, after all.$",
]

[msg.section_0.entries.2313]
text = [
  "I am the one they call the Liepard of\\n",
  "Team Plasma!\\c\\n",
  "I will defeat you without getting a single\\n",
  "scratch on me!\\c$",
]

[msg.section_0.entries.2314]
text = [
  "You are 100 percent perfect intruders!$",
]

[msg.section_0.entries.2315]
text = [
  "See, I'm going to take over the world and\\n",
  "then make that idiot N pay!\\c\\n",
  "That traitor...\\n",
  "Just his face makes me so mad!$",
]

[msg.section_0.entries.2316]
text = [
  "I'm going to go ahead and say it:\\n",
  "Plasmaaaa!!\\c$",
]

[msg.section_0.entries.2317]
text = [
  "Do-over!\\n",
  "Come on, let me have a do-over!$",
]

[msg.section_0.entries.2318]
text = [
  "Pokémon are like our puppets!\\c\\n",
  "They are bound by their Poké Balls and\\n",
  "controlled by our orders!$",
]

[msg.section_0.entries.2319]
text = [
  "This is our place! We aren't going to\\n",
  "let anyone mess with it!\\c$",
]

[msg.section_0.entries.2320]
text = [
  "Ahhhh! The floor is covered in mud after all\\n",
  "that fighting!$",
]

[msg.section_0.entries.2321]
text = [
  "There are people who can't live anywhere\\n",
  "but here! You got a problem with that?!$",
]

[msg.section_0.entries.2322]
text = [
  "Come! Satisfy my urge to battle!$",
]

[msg.section_0.entries.2323]
text = [
  "Marvelous! I shall believe in my Pokémon!$",
]

[msg.section_0.entries.2324]
text = [
  "If-if I'd believed more, could I have drawn\\n",
  "out my Pokémon's power?$",
]

[msg.section_0.entries.2325]
text = [
  "The bonds between us... Does the fact that\\n",
  "we can't see them make them more real?$",
]

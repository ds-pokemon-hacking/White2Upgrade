[msg]
trailing_data = "dada"

[msg.section_0.entries.0]
text = [
  "I'm still a rookie, but someday\\n",
  "I will be a great player!\\c\\n",
  "I'll improve by having a lot\\n",
  "of Pokémon battles!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Ugh!\\n",
  "I missed the rebound!$",
]

[msg.section_0.entries.2]
text = [
  "Hey, you might be a fan of mine.\\n",
  "I'll give you this!\\c$",
]

[msg.section_0.entries.3]
text = [
  "I won't make excuses for losing!\\c\\n",
  "Why waste time dreaming up excuses?\\n",
  "I'll spend that time getting stronger!$",
]

[msg.section_0.entries.4]
text = [
  "A young Trainer! It's important for the\\n",
  "young to get lots of exercise, isn't it?\\c$",
]

[msg.section_0.entries.5]
text = [
  "A healthy sweat...\\n",
  "Boy, I am glad that I am an athlete!$",
]

[msg.section_0.entries.6]
text = [
  "Athletes like me are generous!\\n",
  "Here, have this!\\c$",
]

[msg.section_0.entries.7]
text = [
  "I want a Poké Ball that's\\n",
  "as big as a basketball!\\c\\n",
  "I think it would be more comfortable\\n",
  "for the Pokémon inside it.$",
]

[msg.section_0.entries.8]
text = [
  "POWER!\\c\\n",
  "Power is essential for both\\n",
  "Pokémon and football!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Didn't I have enough power...?$",
]

[msg.section_0.entries.10]
text = [
  "I may not have enough power...\\n",
  "But I'm not lacking in kindness!\\c$",
]

[msg.section_0.entries.11]
text = [
  "I am training to be the very best\\n",
  "with my Pokémon!$",
]

[msg.section_0.entries.12]
text = [
  "An elegant Smasher\\n",
  "has an elegant battle!\\c$",
]

[msg.section_0.entries.13]
text = [
  "E-e-even though I lost,\\n",
  "I won't panic.$",
]

[msg.section_0.entries.14]
text = [
  "I panicked!\\n",
  "Here, I'll give you this!\\c$",
]

[msg.section_0.entries.15]
text = [
  "Because I am a lady, I won't\\n",
  "be chagrined at losing the battle!$",
]

[msg.section_0.entries.16]
text = [
  "The qualifying round is coming soon.\\c\\n",
  "I will practice smashes\\n",
  "by using you as a wall!\\c$",
]

[msg.section_0.entries.17]
text = [
  "Oh, whew! Must...catch...my breath.\\n",
  "That was some good training...$",
]

[msg.section_0.entries.18]
text = [
  "Huh huh huh...\\n",
  "Lemme...catch...my breath...\\c$",
]

[msg.section_0.entries.19]
text = [
  "You and I have just met!\\n",
  "Let's start this game from the beginning.$",
]

[msg.section_0.entries.20]
text = [
  "I'm a little bit strong.\\n",
  "I will work out!\\c$",
]

[msg.section_0.entries.21]
text = [
  "I got worked over...$",
]

[msg.section_0.entries.22]
text = [
  "Thanks for coming to Big Stadium!\\c$",
]

[msg.section_0.entries.23]
text = [
  "You're quite strong.\\n",
  "You have left the Little League!$",
]

[msg.section_0.entries.24]
text = [
  "Hey!\\n",
  "Hey, let's practice together!\\c\\n",
  "I have to warn you--I will go all out\\n",
  "even if we are just practicing!\\c$",
]

[msg.section_0.entries.25]
text = [
  "I was no match for you...\\n",
  "There is always someone better.$",
]

[msg.section_0.entries.26]
text = [
  "This is my thanks for training with me!\\c$",
]

[msg.section_0.entries.27]
text = [
  "I promise you!\\c\\n",
  "I will learn from this experience\\n",
  "and become an even better player!$",
]

[msg.section_0.entries.28]
text = [
  "Phew! I'll at least let my Pokémon take\\n",
  "it easy on their days off!$",
]

[msg.section_0.entries.29]
text = [
  "Watching a practice makes you feel\\n",
  "that you are stronger, too,\\l\\n",
  "doesn't it?\\l\\n",
  "So let's have a battle!\\c$",
]

[msg.section_0.entries.30]
text = [
  "Hawk: ...I could not\\n",
  "do it well at all.\\c\\n",
  "Dar: ...I could not\\n",
  "do it right at all.$",
]

[msg.section_0.entries.31]
text = [
  "They can do even the hardest things\\n",
  "as if they were so simple...\\c\\n",
  "That's the great thing\\n",
  "about professionals.$",
]

[msg.section_0.entries.32]
text = [
  "We cannot have\\n",
  "a one-on-two battle.$",
]

[msg.section_0.entries.33]
text = [
  "We were watching various team sports,\\n",
  "and we wanted to fight as a duo, too!\\c$",
]

[msg.section_0.entries.34]
text = [
  "Playing as a team is difficult.\\c\\n",
  "We could do more great things\\n",
  "if we could understand what\\l\\n",
  "other people were thinking!$",
]

[msg.section_0.entries.35]
text = [
  "We would like to have\\n",
  "a Pokémon battle as a duo.$",
]

[msg.section_0.entries.36]
text = [
  "I get excited just by\\n",
  "coming to Small Court!!\\c$",
]

[msg.section_0.entries.37]
text = [
  "Joe: I got super excited!\\c\\n",
  "Ross: What a thrill!\\n",
  "It's taking my breath away!$",
]

[msg.section_0.entries.38]
text = [
  "Just by being here! Just by watching it!\\n",
  "I get really excited!\\c\\n",
  "If I played a game here,\\n",
  "I would be extremely excited!$",
]

[msg.section_0.entries.39]
text = [
  "We don't want to have\\n",
  "a one-on-two battle.$",
]

[msg.section_0.entries.40]
text = [
  "If we fight in this stadium,\\n",
  "don't you think we will understand\\l\\n",
  "how our star players feel?\\c$",
]

[msg.section_0.entries.41]
text = [
  "We had a battle with Pokémon\\n",
  "in the stadium...\\c\\n",
  "I am happy 'cause I experienced\\n",
  "what star players feel!$",
]

[msg.section_0.entries.42]
text = [
  "One-on-two?\\n",
  "We cannot fight like that.$",
]

[msg.section_0.entries.43]
text = [
  "Watching people practicing\\n",
  "makes me want to get moving, too!\\c\\n",
  "Soooooo, let's practice\\n",
  "Pokémon battles.\\c$",
]

[msg.section_0.entries.44]
text = [
  "Masa: I laugh even though\\n",
  "we lost because it was fun!\\c\\n",
  "Yas: Ah! I didn't cheer enough\\n",
  "for our Pokémon.$",
]

[msg.section_0.entries.45]
text = [
  "It's way more fun to have a battle\\n",
  "ourselves than watching\\l\\n",
  "other people practicing!$",
]

[msg.section_0.entries.46]
text = [
  "We cannot have\\n",
  "a one-on-two battle.$",
]

[msg.section_0.entries.47]
text = [
  "We usually cheer for other people,\\n",
  "but today we would like\\l\\n",
  "to gather our courage\\l\\n",
  "and have our own Pokémon battle.\\c$",
]

[msg.section_0.entries.48]
text = [
  "I am not good at sports,\\n",
  "but I enjoy sports in my own way--\\l\\n",
  "by cheering my heart out for people!$",
]

[msg.section_0.entries.49]
text = [
  "You have only one Pokémon\\n",
  "that can fight. It's out of the question.$",
]

[msg.section_0.entries.50]
text = [
  "Watching athletes practice with Pokémon\\n",
  "made me want to have a Pokémon battle.\\c$",
]

[msg.section_0.entries.51]
text = [
  "Kay: Great!\\n",
  "You are like a professional!\\c\\n",
  "Ali: How did you know?$",
]

[msg.section_0.entries.52]
text = [
  "Ohhh... I knew it was difficult\\n",
  "to fight with Pokémon as well as\\l\\n",
  "the professionals do.$",
]

[msg.section_0.entries.53]
text = [
  "We are two!\\n",
  "We use two Pokémon, too!$",
]

[msg.section_0.entries.54]
text = [
  "Pokémon do\\n",
  "what I cannot do.\\c\\n",
  "You know how wonderful this is,\\n",
  "don't you?\\c$",
]

[msg.section_0.entries.55]
text = [
  "Even existing sports shine\\n",
  "with new appeal\\l\\n",
  "when they team up with Pokémon!$",
]

[msg.section_0.entries.56]
text = [
  "Aren't you in trouble if you don't have\\n",
  "more Pokémon that can fight?$",
]

[msg.section_0.entries.57]
text = [
  "Which do you like better,\\n",
  "baseball or football?\\c$",
]

[msg.section_0.entries.58]
text = [
  "Ami: The game ended\\n",
  "before I knew what was going on.\\c\\n",
  "Eira: The combination play of you\\n",
  "and your Pokémon is great!$",
]

[msg.section_0.entries.59]
text = [
  "I love all kinds of sports!\\c\\n",
  "I can't choose just one of them, just\\n",
  "like I can't choose my favorite Pokémon.$",
]

[msg.section_0.entries.60]
text = [
  "What? You have only one\\n",
  "Pokémon that can fight?$",
]

[msg.section_0.entries.61]
text = [
  "We are always together!\\n",
  "Our combination play must be great!\\c$",
]

[msg.section_0.entries.62]
text = [
  "Be in sync with your partner,\\n",
  "and with your Pokémon, too.\\l\\n",
  "Tag Battles are tough!\\c\\n",
  "But if you are in sync,\\n",
  "it will be very exciting!$",
]

[msg.section_0.entries.63]
text = [
  "You have only one\\n",
  "healthy Pokémon...?$",
]

[msg.section_0.entries.64]
text = [
  "Kids! Please cooperate with the\\n",
  "physical therapy for me and my Pokémon!\\c$",
]

[msg.section_0.entries.65]
text = [
  "My tackle was supposed to crush\\n",
  "even Rock-type Pokémon...$",
]

[msg.section_0.entries.66]
text = [
  "This present might be more\\n",
  "effective than a tackle!\\c$",
]

[msg.section_0.entries.67]
text = [
  "I was injured in a rough game, so\\n",
  "I am undergoing some physical therapy.$",
]

[msg.section_0.entries.68]
text = [
  "Pokémon and Poké Balls\\n",
  "are my real friends!\\c\\n",
  "Join the training of\\n",
  "our Pokémon Eleven!\\c$",
]

[msg.section_0.entries.69]
text = [
  "Aghhhhh! I must still be green!\\n",
  "I have plenty of guts, though!$",
]

[msg.section_0.entries.70]
text = [
  "So much guts!\\n",
  "Here, I'll share with you!\\c$",
]

[msg.section_0.entries.71]
text = [
  "Both my Pokémon and I\\n",
  "still haven't gotten enough practice...\\l\\n",
  "In terms of levels, that would be five...$",
]

[msg.section_0.entries.72]
text = [
  "I am about to give a lecture\\n",
  "on the strength created by gathering\\l\\n",
  "a proper balance of different Pokémon!\\c$",
]

[msg.section_0.entries.73]
text = [
  "Bam! You lectured me!\\n",
  "What a great Trainer!$",
]

[msg.section_0.entries.74]
text = [
  "Here's a lecture, right back at ya!\\c$",
]

[msg.section_0.entries.75]
text = [
  "Team play with Pokémon\\n",
  "brought new fun to our sport.$",
]

[msg.section_0.entries.76]
text = [
  "Ugh!\\n",
  "I can't take much more of this...$",
]

[msg.section_0.entries.77]
text = [
  "I am a Waiter who is good\\n",
  "at Pokémon battles.\\c$",
]

[msg.section_0.entries.78]
text = [
  "Wonderful battle! A learning experience.\\n",
  "...Thanks for the tip!$",
]

[msg.section_0.entries.79]
text = [
  "Our specialty is the best\\n",
  "Pokémon battles.$",
]

[msg.section_0.entries.80]
text = [
  "Welcome!\\c\\n",
  "Would you like a cold drink\\n",
  "with your Pokémon battle?\\c$",
]

[msg.section_0.entries.81]
text = [
  "That was a wonderful battle.\\n",
  "Bravo!$",
]

[msg.section_0.entries.82]
text = [
  "Invigorating Soda Pop for exhausted\\n",
  "Pokémon after a battle!\\l\\n",
  "Available in any vending machine!$",
]

[msg.section_0.entries.83]
text = [
  "The world is wide, and the road to glory\\n",
  "is full of challenges!$",
]

[msg.section_0.entries.84]
text = [
  "To have a chance to battle with such\\n",
  "strong Pokémon...it was worth the wait!$",
]

[msg.section_0.entries.85]
text = [
  "Impressive display!\\n",
  "...Shall we break for tea?$",
]

[msg.section_0.entries.86]
text = [
  "What great Pokémon you have!\\n",
  "Thanks so much! I had a great time!$",
]

[msg.section_0.entries.87]
text = [
  "Amazing! So that's what a Pokémon\\n",
  "from the city is like!$",
]

[msg.section_0.entries.88]
text = [
  "Thanks for playing with me\\n",
  "while my parents are busy!$",
]

[msg.section_0.entries.89]
text = [
  "Amazing...\\n",
  "Please, take me away with you!$",
]

[msg.section_0.entries.90]
text = [
  "First impressions are everything!$",
]

[msg.section_0.entries.91]
text = [
  "It's not over yet!\\n",
  "I'll finish it my way!$",
]

[msg.section_0.entries.92]
text = [
  "I hope for a good ending! I hate endings\\n",
  "that leave a bitter taste in one's mouth!$",
]

[msg.section_0.entries.93]
text = [
  "Do you ever feel at a loss for words when\\n",
  "something greatly moves you?\\l\\n",
  "To tell the truth...\\c\\n",
  "I'm a writer, but right now I'm having\\n",
  "trouble putting my feelings into words.\\c\\n",
  "You were just that impressive!$",
]

[msg.section_0.entries.94]
text = [
  "Now why would you use that move? If I can\\n",
  "figure that out, I may be able to win!$",
]

[msg.section_0.entries.95]
text = [
  "A beautiful loss is still a loss,\\n",
  "and an ugly win is still a win!$",
]

[msg.section_0.entries.96]
text = [
  "Even in a tough situation like this,\\n",
  "there must be a way to triumph!$",
]

[msg.section_0.entries.97]
text = [
  "Where there's a winner,\\n",
  "there's also a loser.\\c\\n",
  "It's pathetic to make a big deal out\\n",
  "of losing if you weren't prepared.\\c\\n",
  "If you're a true Pokémon battler,\\n",
  "you'll reflect upon your loss and\\l\\n",
  "think about how to win next time!$",
]

[msg.section_0.entries.98]
text = [
  "I can feel it!\\n",
  "You and your Pokémon are strong!$",
]

[msg.section_0.entries.99]
text = [
  "This is my final Pokémon!\\n",
  "It all comes down to this!$",
]

[msg.section_0.entries.100]
text = [
  "Everything comes down to this next move!\\n",
  "I'll use the last bit of my strength!$",
]

[msg.section_0.entries.101]
text = [
  "There is no single strongest Pokémon\\n",
  "or sole best combination...\\c\\n",
  "That's why it is difficult\\n",
  "to keep winning.\\c\\n",
  "However, I think a heart that desires\\n",
  "strength and strives to grow\\l\\n",
  "stronger is a precious ideal.\\c\\n",
  "That is why I respect you--\\n",
  "because you have these things.$",
]

[msg.section_0.entries.102]
text = [
  "I have a feeling this battle will give my\\n",
  "Pokémon a chance to go all out!$",
]

[msg.section_0.entries.103]
text = [
  "I can't believe it's come to this!\\n",
  "I must have gotten complacent.$",
]

[msg.section_0.entries.104]
text = [
  "Ohhh, that's it! I'll go all out if it'll get\\n",
  "me a win!$",
]

[msg.section_0.entries.105]
text = [
  "You and your Pokémon are\\n",
  "both excellent and elegant.\\c\\n",
  "To have been able to battle against\\n",
  "such a splendid team...\\c\\n",
  "My Pokémon and I learned a lot!\\n",
  "I offer you my thanks.$",
]

[msg.section_0.entries.106]
text = [
  "I was expecting exactly that kind of move!$",
]

[msg.section_0.entries.107]
text = [
  "What's this?!\\n",
  "This is nothing like I expected!$",
]

[msg.section_0.entries.108]
text = [
  "Could it be?!\\c\\n",
  "My plans for complete and total world\\n",
  "domination foiled yet again?\\c\\n",
  "No!\\c\\n",
  "It mustn't be!\\c\\n",
  "I couldn't have been defeated by some\\n",
  "random Trainer from who knows where!$",
]

[msg.section_0.entries.109]
text = [
  "Our battle will surely be worth a\\n",
  "page in the book of your journey!\\c$",
]

[msg.section_0.entries.110]
text = [
  "If only I could have won, I would have\\n",
  "been able to make an impression on you!$",
]

[msg.section_0.entries.111]
text = [
  "To be remembered by someone...\\n",
  "That may be what it means to be alive.$",
]

[msg.section_0.entries.112]
text = [
  "I can see the plea in my Pokémon's eyes.\\n",
  "To fight! And to win!\\c$",
]

[msg.section_0.entries.113]
text = [
  "The eyes of your Pokémon\\n",
  "are glimmering with strength!$",
]

[msg.section_0.entries.114]
text = [
  "I can see the plea in my Pokémon's eyes.\\n",
  "They're saying, “Get back up! I'm OK!\\\"\\c\\n",
  "Yep! I can understand my Pokémon's\\n",
  "feelings by looking into their eyes.$",
]

[msg.section_0.entries.115]
text = [
  "Wow!\\n",
  "Amazing!$",
]

[msg.section_0.entries.116]
text = [
  "Tcha! That all you got?\\n",
  "Guess it's enough...$",
]

[msg.section_0.entries.117]
text = [
  "Oh well...\\n",
  "Looks like I lost!$",
]

[msg.section_0.entries.118]
text = [
  "Not bad...\\n",
  "Not bad at all!$",
]

[msg.section_0.entries.119]
text = [
  "The ideal movement of living things,\\n",
  "such pure beauty!\\c\\n",
  "Ah, let me behold them!\\c$",
]

[msg.section_0.entries.120]
text = [
  "I saw their beauty up close!$",
]

[msg.section_0.entries.121]
text = [
  "This is art!\\n",
  "Here--a present for you!\\c$",
]

[msg.section_0.entries.122]
text = [
  "You know, creatures that exert\\n",
  "all their strength are always beautiful.$",
]

[msg.section_0.entries.123]
text = [
  "If you win against me,\\n",
  "I will give you something good\\l\\n",
  "from this backpack!\\c$",
]

[msg.section_0.entries.124]
text = [
  "You are great!\\n",
  "And strong!$",
]

[msg.section_0.entries.125]
text = [
  "Here you are.\\n",
  "I will give you this as I promised!\\c$",
]

[msg.section_0.entries.126]
text = [
  "It feels great to run as fast as you can\\n",
  "over mountains and through forests.\\l\\n",
  "Right?$",
]

[msg.section_0.entries.127]
text = [
  "I came here on my journey,\\n",
  "but it's kind of lively here, isn't it?\\c$",
]

[msg.section_0.entries.128]
text = [
  "Is there a festival or something\\n",
  "going on here?$",
]

[msg.section_0.entries.129]
text = [
  "This is what I found during my trip.\\n",
  "I don't need it, so I will give it to you.\\c$",
]

[msg.section_0.entries.130]
text = [
  "Everybody is dressed the same way.\\n",
  "Is this some kind of ceremony?$",
]

[msg.section_0.entries.131]
text = [
  "I bet athletes are not satisfied\\n",
  "with their games.\\c\\n",
  "That's how I feel\\n",
  "when I watch them.\\c\\n",
  "The reason? If you win against me,\\n",
  "I will tell you why!\\c$",
]

[msg.section_0.entries.132]
text = [
  "Are you pleased with your victory?\\n",
  "Or are you unsatisfied?$",
]

[msg.section_0.entries.133]
text = [
  "This Moomoo Milk is tasty\\n",
  "and so very satisfying!\\c$",
]

[msg.section_0.entries.134]
text = [
  "No matter how great their play is,\\n",
  "there is always a greater play.\\c\\n",
  "I am never satisfied with my bread,\\n",
  "even though I bake it very well.\\c\\n",
  "I always want to make the next\\n",
  "loaf even more delicious!$",
]

[msg.section_0.entries.135]
text = [
  "A place where you can warm up!\\n",
  "That's what I heard and why I came here!\\l\\n",
  "Let's turn up the heat on this thing!\\c$",
]

[msg.section_0.entries.136]
text = [
  "The heat here is too much.\\n",
  "I'm just burning up!$",
]

[msg.section_0.entries.137]
text = [
  "Accept this symbol of my excitement!\\c$",
]

[msg.section_0.entries.138]
text = [
  "My warrior's heart is burning!\\n",
  "Thank you for the hot battle!\\c\\n",
  "Next, I will stay on this hot streak\\n",
  "and watch the game!$",
]

[msg.section_0.entries.139]
text = [
  "To raise healthy Pokémon, you need\\n",
  "to keep their minds and bodies active,\\l\\n",
  "watching games and having battles!\\c$",
]

[msg.section_0.entries.140]
text = [
  "It's so frustrating to lose!\\n",
  "But it's also important to learn from it.$",
]

[msg.section_0.entries.141]
text = [
  "I just remembered something important.\\n",
  "Come on now. No holding back!\\c$",
]

[msg.section_0.entries.142]
text = [
  "You learn more when you lose\\n",
  "than when you win!\\l\\n",
  "I think it's the same for sports, too.$",
]

[msg.section_0.entries.143]
text = [
  "The Pokémon I raised are\\n",
  "as good as professionals!\\c$",
]

[msg.section_0.entries.144]
text = [
  "The Pokémon you raised\\n",
  "are great, too!$",
]

[msg.section_0.entries.145]
text = [
  "You showed me your awesome Pokémon.\\n",
  "Here, have this as my thanks.\\c$",
]

[msg.section_0.entries.146]
text = [
  "There are so many ways\\n",
  "to raise Pokémon.$",
]

[msg.section_0.entries.147]
text = [
  "I am not skipping work!\\c$",
]

[msg.section_0.entries.148]
text = [
  "If I had known this would happen,\\n",
  "I would have worked diligently.$",
]

[msg.section_0.entries.149]
text = [
  "OK!\\n",
  "Time to get serious!\\c$",
]

[msg.section_0.entries.150]
text = [
  "Taking a productive break\\n",
  "is also part of any job!$",
]

[msg.section_0.entries.151]
text = [
  "Someone sent me a ticket, so I came.\\n",
  "But there's no game going on!\\c$",
]

[msg.section_0.entries.152]
text = [
  "I have a lot of work to do.\\n",
  "What am I doing here?$",
]

[msg.section_0.entries.153]
text = [
  "I'll give you this. That way,\\n",
  "at least I'll have done something.\\c$",
]

[msg.section_0.entries.154]
text = [
  "Athletes on off days are no better\\n",
  "than guys on days off.$",
]

[msg.section_0.entries.155]
text = [
  "I wonder if there are great children\\n",
  "who will become stars someday\\l\\n",
  "who are now just kids at my preschool.\\c$",
]

[msg.section_0.entries.156]
text = [
  "You are also quite brilliant, but\\n",
  "real stars are cool.$",
]

[msg.section_0.entries.157]
text = [
  "You seem to have potential as a star.\\n",
  "So, will you please be my friend?\\c$",
]

[msg.section_0.entries.158]
text = [
  "Should I get autographs now\\n",
  "from children who are likely to be stars?$",
]

[msg.section_0.entries.159]
text = [
  "I love sports and Pokémon most of all.\\c\\n",
  "How about a battle?\\n",
  "They used to call me the Cleaner!\\c$",
]

[msg.section_0.entries.160]
text = [
  "I could not stop all\\n",
  "of your Pokémon's attacks...$",
]

[msg.section_0.entries.161]
text = [
  "Can you take this?\\c$",
]

[msg.section_0.entries.162]
text = [
  "I used to be a Striker.\\n",
  "I was responsible for scoring goals.\\c\\n",
  "Now I am a sweeper.\\n",
  "I am responsible for sweeping floors.$",
]

[msg.section_0.entries.163]
text = [
  "The athletes' Pokémon are great!\\c\\n",
  "But my Pokémon are also great!\\c$",
]

[msg.section_0.entries.164]
text = [
  "Your Pokémon are also great!$",
]

[msg.section_0.entries.165]
text = [
  "In honor of our Pokémon,\\n",
  "please accept this!\\c$",
]

[msg.section_0.entries.166]
text = [
  "I will strive to raise my Pokémon\\n",
  "to that level!$",
]

[msg.section_0.entries.167]
text = [
  "Did you see today's game?\\c\\n",
  "There was some great ballhandling by\\n",
  "players and Pokémon!\\c\\n",
  "The excitement gets me pumped\\n",
  "for a battle!\\c$",
]

[msg.section_0.entries.168]
text = [
  "I lost, but I am still excited!$",
]

[msg.section_0.entries.169]
text = [
  "I'm really excited. Here,\\n",
  "please accept this gift!\\c$",
]

[msg.section_0.entries.170]
text = [
  "The only place you can watch Pokémon\\n",
  "enjoying sports is Nimbasa City!$",
]

[msg.section_0.entries.171]
text = [
  "When I come here, I get hyper!\\n",
  "So, let's have a battle right away!\\c$",
]

[msg.section_0.entries.172]
text = [
  "I lost against you too quickly!$",
]

[msg.section_0.entries.173]
text = [
  "Here, have this!\\c$",
]

[msg.section_0.entries.174]
text = [
  "When I am watching a game, I get hyper!\\n",
  "I just can't sit still!$",
]

[msg.section_0.entries.175]
text = [
  "Doctor! Is there a Doctor\\n",
  "in the audience?\\c\\n",
  "Yes, I am a Doctor.\\n",
  "Let's get into a battle.\\c$",
]

[msg.section_0.entries.176]
text = [
  "Oh! My Pokémon is all worn out!$",
]

[msg.section_0.entries.177]
text = [
  "When Pokémon lose energy, Max Revive!\\c$",
]

[msg.section_0.entries.178]
text = [
  "When I am watching a game,\\n",
  "I just keep worrying about\\l\\n",
  "whether an athlete will be injured.$",
]

[msg.section_0.entries.179]
text = [
  "You chose to speak to me from\\n",
  "among so many people!\\l\\n",
  "You have a good eye!\\c$",
]

[msg.section_0.entries.180]
text = [
  "You are a worthy opponent!$",
]

[msg.section_0.entries.181]
text = [
  "The way you use moves...\\n",
  "Quite honestly, I like it!\\c\\n",
  "Here, this is for you!\\c$",
]

[msg.section_0.entries.182]
text = [
  "Heehee.\\c\\n",
  "Even when I am in the crowd,\\n",
  "people can tell I am strong.$",
]

[msg.section_0.entries.183]
text = [
  "I usually act like an Ace Trainer,\\n",
  "but I want to be an ordinary girl,\\l\\n",
  "at least when I am here.\\c$",
]

[msg.section_0.entries.184]
text = [
  "I don't want to think about Pokémon\\n",
  "very much right now!$",
]

[msg.section_0.entries.185]
text = [
  "If I give you this,\\n",
  "will you leave me alone?\\c$",
]

[msg.section_0.entries.186]
text = [
  "Even as an Ace Trainer, sometimes\\n",
  "I just want to be an ordinary girl!\\c\\n",
  "I want to scream for the cool athletes,\\n",
  "and enjoy my time.$",
]

[msg.section_0.entries.187]
text = [
  "Which team will score next?!\\n",
  "If you can win, I will tell you!\\c$",
]

[msg.section_0.entries.188]
text = [
  "Aha!\\n",
  "That team will score next!$",
]

[msg.section_0.entries.189]
text = [
  "Aha! I've got it!\\n",
  "I'll give you this!\\c$",
]

[msg.section_0.entries.190]
text = [
  "My psychic power only works\\n",
  "right before a player scores a point.$",
]

[msg.section_0.entries.191]
text = [
  "Heheh...\\c\\n",
  "The team I want to win\\n",
  "always wins!\\c$",
]

[msg.section_0.entries.192]
text = [
  "What...? Was everything up till now\\n",
  "just a coincidence...?$",
]

[msg.section_0.entries.193]
text = [
  "I give this to everyone who\\n",
  "manages to beat me!\\c$",
]

[msg.section_0.entries.194]
text = [
  "Feelings matter when you cheer!\\n",
  "If I believe, I feel my team will win!$",
]

[msg.section_0.entries.195]
text = [
  "Fishing is a perfectly respectable sport!\\n",
  "Why isn't there a fishing stadium?!\\c$",
]

[msg.section_0.entries.196]
text = [
  "...Of course, fishing is fun\\n",
  "when you enjoy it in nature.\\c$",
]

[msg.section_0.entries.197]
text = [
  "Thanks for the fun time!\\n",
  "Here's a symbol of my appreciation!\\c$",
]

[msg.section_0.entries.198]
text = [
  "I like quiet nature,\\n",
  "but I like lively places like this, too.$",
]

[msg.section_0.entries.199]
text = [
  "A lot of sports started\\n",
  "as Gentlemen's games!\\c$",
]

[msg.section_0.entries.200]
text = [
  "Ladies and Gentlemen!\\n",
  "The game is over!$",
]

[msg.section_0.entries.201]
text = [
  "Because I am a Gentleman,\\n",
  "I will present you with this gift.\\c$",
]

[msg.section_0.entries.202]
text = [
  "Pokémon battles were born spontaneously\\n",
  "when people and Pokémon\\l\\n",
  "first became friendly.$",
]

[msg.section_0.entries.203]
text = [
  "Hey, hey, did you see that? Awesome!\\n",
  "A lot of famous people from TV are here!\\c$",
]

[msg.section_0.entries.204]
text = [
  "Athletes are all coooool.\\n",
  "I want to be like them.$",
]

[msg.section_0.entries.205]
text = [
  "You're so cool! I hope to be like you\\n",
  "someday. Here, have this!\\c$",
]

[msg.section_0.entries.206]
text = [
  "Aghhhhh. Why didn't I bring a camera,\\n",
  "or a notebook for an autograph?$",
]

[msg.section_0.entries.207]
text = [
  "Sports and juggling are the same.\\n",
  "You must entertain the audience!\\l\\n",
  "I will show you the fruits of my practice.\\c$",
]

[msg.section_0.entries.208]
text = [
  "While I am having a Pokémon battle,\\n",
  "I catch 10 balls!$",
]

[msg.section_0.entries.209]
text = [
  "Here, catch this!\\c$",
]

[msg.section_0.entries.210]
text = [
  "I have mastered the technique,\\n",
  "but I cannot use it!\\l\\n",
  "I just have to have real battles!$",
]

[msg.section_0.entries.211]
text = [
  "That incredibly flashy dorm,\\n",
  "and squealing cheerleaders all around...\\c\\n",
  "Grrr...\\n",
  "I am envious!\\c$",
]

[msg.section_0.entries.212]
text = [
  "What is so great about popular athletes?\\n",
  "What is bad about martial artists?$",
]

[msg.section_0.entries.213]
text = [
  "My feelings as a martial artist are\\n",
  "contained within this. Please have it.\\c$",
]

[msg.section_0.entries.214]
text = [
  "A run-down dojo, and a lot of shouts like\\n",
  "hai-ya and kee-up...\\c\\n",
  "If I had known this before, I would have\\n",
  "been a different kind of athlete.$",
]

[msg.section_0.entries.215]
text = [
  "When I grow up,\\n",
  "I will be a pro athlete!\\c$",
]

[msg.section_0.entries.216]
text = [
  "Waaaaah!\\n",
  "I will never give you my autograph!$",
]

[msg.section_0.entries.217]
text = [
  "It's not my autograph,\\n",
  "but I'll give you this!\\c$",
]

[msg.section_0.entries.218]
text = [
  "I will practice my autograph\\n",
  "for when I go pro!$",
]

[msg.section_0.entries.219]
text = [
  "My daddy is\\n",
  "an athlete here!\\c$",
]

[msg.section_0.entries.220]
text = [
  "Waaaaaah. Dadddddddy.$",
]

[msg.section_0.entries.221]
text = [
  "My daddy gave this to me...\\n",
  "But you can have it!\\c$",
]

[msg.section_0.entries.222]
text = [
  "...I won't cry.\\n",
  "'Cause I promised my daddy.$",
]

[msg.section_0.entries.223]
text = [
  "Even Socialites enjoy sports,\\n",
  "in a very elegant way!\\c\\n",
  "A Pokémon battle is\\n",
  "a sport in a way!\\l\\n",
  "Let's fight elegantly!\\c$",
]

[msg.section_0.entries.224]
text = [
  "O-ho-ho!\\n",
  "I lost so elegantly.$",
]

[msg.section_0.entries.225]
text = [
  "Oh dear, I mistook this for a ball\\n",
  "and ordered it. Now it's yours.\\c$",
]

[msg.section_0.entries.226]
text = [
  "First of all, we should enjoy\\n",
  "sports and Pokémon battles!\\c\\n",
  "If you get hung up on winning and losing,\\n",
  "you lose sight of what is most valuable.$",
]

[msg.section_0.entries.227]
text = [
  "I will be strong in Pokémon battles,\\n",
  "and I will marry a professional athlete!\\c$",
]

[msg.section_0.entries.228]
text = [
  "Ah.\\n",
  "I still have a long way to go!$",
]

[msg.section_0.entries.229]
text = [
  "Your Pokémon are strong. I will give\\n",
  "something good to a strong person!\\c$",
]

[msg.section_0.entries.230]
text = [
  "Strong people are always totally\\n",
  "attractive. Don't you think?$",
]

[msg.section_0.entries.231]
text = [
  "A Hiker, an athlete,\\n",
  "and a Pokémon Trainer.\\l\\n",
  "Do you know what is important?\\c$",
]

[msg.section_0.entries.232]
text = [
  "Grrrrrrr!\\n",
  "Clearly you know it!$",
]

[msg.section_0.entries.233]
text = [
  "Since you know, I'll give you\\n",
  "something nice!\\c$",
]

[msg.section_0.entries.234]
text = [
  "Prepare thoroughly.\\n",
  "If you don't, you can't do anything!$",
]

[msg.section_0.entries.235]
text = [
  "I can't believe nobody has noticed me...\\n",
  "I am a star!\\c$",
]

[msg.section_0.entries.236]
text = [
  "Don't look at me. I lost!$",
]

[msg.section_0.entries.237]
text = [
  "Please! I'll give you this!\\n",
  "Just please, don't look at me!\\c$",
]

[msg.section_0.entries.238]
text = [
  "Whose autograph do you want?\\n",
  "Don't you want one of mine?$",
]

[msg.section_0.entries.239]
text = [
  "You are energetic!\\n",
  "I will punish lazy children!\\c$",
]

[msg.section_0.entries.240]
text = [
  "You just don't quit!\\n",
  "You are so energetic!$",
]

[msg.section_0.entries.241]
text = [
  "OK! An energetic Trainer!\\n",
  "Take this!\\c$",
]

[msg.section_0.entries.242]
text = [
  "Nurses need plenty of stamina,\\n",
  "both day and night!$",
]

[msg.section_0.entries.243]
text = [
  "My darling is working here.\\n",
  "How about that? Are you envious?\\c$",
]

[msg.section_0.entries.244]
text = [
  "My darling is seriously the best.\\n",
  "He puts athletes to shame.$",
]

[msg.section_0.entries.245]
text = [
  "Here, I'll show the greatness\\n",
  "of my darling to you!\\c$",
]

[msg.section_0.entries.246]
text = [
  "My darling is a Janitor!\\n",
  "He cleans this entire big place\\l\\n",
  "by himself every day. Cool, huh?\\l\\n",
  "Nobody else can do what he does.$",
]

[msg.section_0.entries.247]
text = [
  "Games in the rain look extra tough,\\n",
  "don't they?\\c\\n",
  "I wonder what Pokémon battles\\n",
  "in rain are like.\\c$",
]

[msg.section_0.entries.248]
text = [
  "Well, this place is indoors,\\n",
  "so they don't get rained out.$",
]

[msg.section_0.entries.249]
text = [
  "We may not get rainfall in here, but\\n",
  "nice things can still pour down!\\c$",
]

[msg.section_0.entries.250]
text = [
  "If a stadium has a roof,\\n",
  "they can play a game anytime!$",
]

[msg.section_0.entries.251]
text = [
  "Hey! It's me! It's me!\\n",
  "I am the best Pilot in Unova!\\c$",
]

[msg.section_0.entries.252]
text = [
  "You! You are daring!\\n",
  "Be my apprentice!$",
]

[msg.section_0.entries.253]
text = [
  "Here! I'll give you this, so\\n",
  "become my apprentice!\\c$",
]

[msg.section_0.entries.254]
text = [
  "A once-in-a-lifetime flight!\\n",
  "Fly, fly, and fly away!$",
]

[msg.section_0.entries.255]
text = [
  "If you want to know what the VIP seats\\n",
  "are like, you'd better beat me!\\c$",
]

[msg.section_0.entries.256]
text = [
  "VIP seats are very far away\\n",
  "from the athletes!$",
]

[msg.section_0.entries.257]
text = [
  "VIP! VIP!\\n",
  "V...I...P!\\c$",
]

[msg.section_0.entries.258]
text = [
  "I could see the game fine, but\\n",
  "the athletes looked like grains of rice.$",
]

[msg.section_0.entries.259]
text = [
  "You!\\n",
  "You are a fan of that person.\\c\\n",
  "I can tell!\\n",
  "But that person is mine!\\c$",
]

[msg.section_0.entries.260]
text = [
  "Oh no, oh why?\\n",
  "I am sorry...$",
]

[msg.section_0.entries.261]
text = [
  "I can't let you have that person,\\n",
  "but take this instead...\\c$",
]

[msg.section_0.entries.262]
text = [
  "Come to think of it,\\n",
  "the more supporters there are,\\l\\n",
  "the better.\\c\\n",
  "You! Cheer until you lose your voice,\\n",
  "and clap until your hands fall off!$",
]

[msg.section_0.entries.263]
text = [
  "When I am watching a game,\\n",
  "I feel like I should be moving, too!\\c$",
]

[msg.section_0.entries.264]
text = [
  "That was a good workout!$",
]

[msg.section_0.entries.265]
text = [
  "Oohh! I can't stop moving!\\c$",
]

[msg.section_0.entries.266]
text = [
  "The stadium is nice, but I'd sure\\n",
  "love to play sports outdoors!$",
]

[msg.section_0.entries.267]
text = [
  "I want to drag people here\\n",
  "and have them enlist as Pokémon Rangers.\\c$",
]

[msg.section_0.entries.268]
text = [
  "Wow! Electrifying!\\n",
  "You are so goooood!$",
]

[msg.section_0.entries.269]
text = [
  "To the incredible “Y...O...U.\\\"\\c$",
]

[msg.section_0.entries.270]
text = [
  "You! Be a Pokémon Ranger!\\n",
  "I will give you a good workout!$",
]

[msg.section_0.entries.271]
text = [
  "Watch a game\\n",
  "during a study break!\\c\\n",
  "Have a battle\\n",
  "during a game break!\\c$",
]

[msg.section_0.entries.272]
text = [
  "Gah!\\n",
  "This is so not relaxing!$",
]

[msg.section_0.entries.273]
text = [
  "I'll try doing this to see if\\n",
  "I can't switch gears!\\c$",
]

[msg.section_0.entries.274]
text = [
  "When I come here for fun,\\n",
  "I can study more efficiently!$",
]

[msg.section_0.entries.275]
text = [
  "OK, I decided!\\n",
  "If I win against you,\\l\\n",
  "I will be a Gym Leader!\\c$",
]

[msg.section_0.entries.276]
text = [
  "Ummmm...\\n",
  "Maybe I'm not ready to be a Gym Leader?$",
]

[msg.section_0.entries.277]
text = [
  "You taught me a lot, so please\\n",
  "accept this as a symbol of my thanks!\\c$",
]

[msg.section_0.entries.278]
text = [
  "I have to consider what I will be\\n",
  "by trying a lot of things!$",
]

[msg.section_0.entries.279]
text = [
  "I wonder if being good at sports\\n",
  "and being good at battles are related?\\c$",
]

[msg.section_0.entries.280]
text = [
  "It was very helpful...$",
]

[msg.section_0.entries.281]
text = [
  "Ummmm. You are\\n",
  "quite interesting.\\c\\n",
  "Please have this!\\c$",
]

[msg.section_0.entries.282]
text = [
  "Both sports and Pokémon are\\n",
  "like a science for me!$",
]

[msg.section_0.entries.283]
text = [
  "I am stuck inside the lab,\\n",
  "with a medicinal smell every day,\\l\\n",
  "and then I get stressed out.\\c$",
]

[msg.section_0.entries.284]
text = [
  "Waaaaaahhh! Frustrating!$",
]

[msg.section_0.entries.285]
text = [
  "Breaking out made me feel better!\\n",
  "Here's a token of my appreciation.\\c$",
]

[msg.section_0.entries.286]
text = [
  "Let's have another Pokémon battle\\n",
  "sometime, so we won't be stressed out!$",
]

[msg.section_0.entries.287]
text = [
  "These are not shorts!\\n",
  "These are half pants!\\c$",
]

[msg.section_0.entries.288]
text = [
  "You were so strong that\\n",
  "my half pants almost fell down!$",
]

[msg.section_0.entries.289]
text = [
  "You are awesome!\\n",
  "Here's an awesome gift for you!\\c$",
]

[msg.section_0.entries.290]
text = [
  "I envy basketball players.\\n",
  "'Cause they wear shorts, not half pants.\\c\\n",
  "But baseball and football\\n",
  "uniforms are also cool!$",
]

[msg.section_0.entries.291]
text = [
  "Mmm!\\n",
  "You smell like an athlete!\\c$",
]

[msg.section_0.entries.292]
text = [
  "I see. That is the smell\\n",
  "that strong people give off...$",
]

[msg.section_0.entries.293]
text = [
  "You seem to be getting even stronger...\\n",
  "OK. Please take this.\\c$",
]

[msg.section_0.entries.294]
text = [
  "I hope you will get even stronger\\n",
  "by using it.$",
]

[msg.section_0.entries.295]
text = [
  "Wow, you have a lot of Badges.\\n",
  "Let me see your skills!\\c$",
]

[msg.section_0.entries.296]
text = [
  "That fighting style reminds me\\n",
  "of the old days!$",
]

[msg.section_0.entries.297]
text = [
  "A person like you should use\\n",
  "top-shelf items--like this!\\c$",
]

[msg.section_0.entries.298]
text = [
  "No matter how old we get,\\n",
  "let's stay Trainers!$",
]

[msg.section_0.entries.299]
text = [
  "Cheering makes us\\n",
  "thirsty. Right?\\c\\n",
  "If you can win against me,\\n",
  "I'll give you a drink!\\c$",
]

[msg.section_0.entries.300]
text = [
  "The battle made me\\n",
  "even thirstier!$",
]

[msg.section_0.entries.301]
text = [
  "Here you are.\\n",
  "I will give you something good!\\c$",
]

[msg.section_0.entries.302]
text = [
  "At a place like this,\\n",
  "it's good to drink a lot of water!$",
]

[msg.section_0.entries.303]
text = [
  "Cheering makes us\\n",
  "thirsty. Right?\\c\\n",

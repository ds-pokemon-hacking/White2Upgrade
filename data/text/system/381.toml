[msg.section_0.entries.1405]
text = [
  "Even if we don't have our hero anymore,\\n",
  "we still won't lose!\\c$",
]

[msg.section_0.entries.1406]
text = [
  "Plasmaaaa!\\n",
  "Glory to Team Plasma!$",
]

[msg.section_0.entries.1407]
text = [
  "Maybe if Team Plasma can take over the\\n",
  "Unova region, our king will come back...$",
]

[msg.section_0.entries.1408]
text = [
  "We won't tolerate people\\n",
  "who have different ideas!\\c$",
]

[msg.section_0.entries.1409]
text = [
  "Argh...\\n",
  "I won't forgive you!$",
]

[msg.section_0.entries.1410]
text = [
  "I repeat! We won't tolerate people\\n",
  "who have different ideas!\\c\\n",
  "If Team Plasma takes over the world,\\n",
  "then everyone will think the same way!$",
]

[msg.section_0.entries.1411]
text = [
  "It's not just our outfits that have\\n",
  "changed around here!\\c\\n",
  "We're not living for the Pokémon anymore,\\n",
  "but for ourselves!\\c$",
]

[msg.section_0.entries.1412]
text = [
  "Whyyyy...?$",
]

[msg.section_0.entries.1413]
text = [
  "Our king abandoned us...\\c\\n",
  "We couldn't survive unless we changed\\n",
  "the way we thought...$",
]

[msg.section_0.entries.1414]
text = [
  "Where do you think unfulfilled dreams go...?$",
]

[msg.section_0.entries.1415]
text = [
  "That's right... We can't force Pokémon to\\n",
  "battle out of hatred...$",
]

[msg.section_0.entries.1416]
text = [
  "What... Can it be that love is even stronger\\n",
  "than hatred?$",
]

[msg.section_0.entries.1417]
text = [
  "Why? How could this be?\\n",
  "How could you try hard for someone else?!$",
]

[msg.section_0.entries.1418]
text = [
  "Cleaning actually takes a lot\\n",
  "of strength...\\c\\n",
  "In other words, I've been training real\\n",
  "hard by doing all this cleaning!\\c$",
]

[msg.section_0.entries.1419]
text = [
  "Oops! Who cares about winning or losing!\\n",
  "That spot over there is what's on my mind!$",
]

[msg.section_0.entries.1420]
text = [
  "When you clean, do you ever feel like\\n",
  "it's never going to end?\\c\\n",
  "Works for me! That means I can clean\\n",
  "forever, and I sure love cleaning.$",
]

[msg.section_0.entries.1421]
text = [
  "Hey! Trainer!\\n",
  "I'm cleaning here, so out of the way!\\c$",
]

[msg.section_0.entries.1422]
text = [
  "Why, I'll be!$",
]

[msg.section_0.entries.1423]
text = [
  "As long as folks live, they make messes.\\n",
  "As soon as they do, I clean 'em up!$",
]

[msg.section_0.entries.1424]
text = [
  "Sine, cosine, tangent!\\c$",
]

[msg.section_0.entries.1425]
text = [
  "Hmm. A tautology.$",
]

[msg.section_0.entries.1426]
text = [
  "What a catastrophic theorem!$",
]

[msg.section_0.entries.1427]
text = [
  "I'm a researcher studying about the\\n",
  "smell here!\\c$",
]

[msg.section_0.entries.1428]
text = [
  "If I were to express this disappointment in\\n",
  "scent, I'd put it on par with a Gloom.$",
]

[msg.section_0.entries.1429]
text = [
  "Even odors that might seem awful to\\n",
  "humans might be perfume to a Pokémon.$",
]

[msg.section_0.entries.1430]
text = [
  "Whooooa!!\\c$",
]

[msg.section_0.entries.1431]
text = [
  "I loooost!!$",
]

[msg.section_0.entries.1432]
text = [
  "Isn't it fun how shouting out in a sewer\\n",
  "or a tunnel makes your voice echo?$",
]

[msg.section_0.entries.1433]
text = [
  "Humans need sewers, but what\\n",
  "about Pokémon?\\c\\n",
  "Take that question, and take this battle\\n",
  "challenge with it!\\c$",
]

[msg.section_0.entries.1434]
text = [
  "There appears to be no barrier between you\\n",
  "and your Pokémon!$",
]

[msg.section_0.entries.1435]
text = [
  "Since we built this sewer, all kinds of\\n",
  "Pokémon have gathered here.\\c\\n",
  "It's like there's no boundary between\\n",
  "Pokémon and people, right?$",
]

[msg.section_0.entries.1436]
text = [
  "Yahoooo!\\n",
  "If you call, I'll come right away!\\c$",
]

[msg.section_0.entries.1437]
text = [
  "I'm on fire, baby! On fire!$",
]

[msg.section_0.entries.1438]
text = [
  "Riding a Bicycle is fine, but I want\\n",
  "to ride away on a Pokémon!$",
]

[msg.section_0.entries.1439]
text = [
  "Shift gears and Bob's your uncle!\\n",
  "You'll be going full speed in no time!\\c$",
]

[msg.section_0.entries.1440]
text = [
  "No matter how I shift gears, it looks like\\n",
  "I'll never be able to match your speed!$",
]

[msg.section_0.entries.1441]
text = [
  "Whee! Mountain biking is tough--but\\n",
  "that's why it's so fun!$",
]

[msg.section_0.entries.1442]
text = [
  "The path of karate is the path of\\n",
  "humanity...and the path of Pokémon!\\c$",
]

[msg.section_0.entries.1443]
text = [
  "Oof! It is not by chance that you have won!$",
]

[msg.section_0.entries.1444]
text = [
  "Winners win because they deserve to win!$",
]

[msg.section_0.entries.1445]
text = [
  "I, Black Belt Rich, will never turn my\\n",
  "back and run!\\c$",
]

[msg.section_0.entries.1446]
text = [
  "...Ugh!\\n",
  "Sometimes you must retreat to win!$",
]

[msg.section_0.entries.1447]
text = [
  "I will reexamine my own weaknesses.\\c\\n",
  "At times I may hate myself for doing so,\\n",
  "but I cannot run from myself!$",
]

[msg.section_0.entries.1448]
text = [
  "Greetings!\\n",
  "So...shall we do this?\\c$",
]

[msg.section_0.entries.1449]
text = [
  "What an upset!$",
]

[msg.section_0.entries.1450]
text = [
  "Hmm... I just can't act naturally when I\\n",
  "focus on winning!$",
]

[msg.section_0.entries.1451]
text = [
  "My training will never betray me. After\\n",
  "training this much, I am certain to win!\\c$",
]

[msg.section_0.entries.1452]
text = [
  "...How can that be?\\n",
  "Even after I trained so much!$",
]

[msg.section_0.entries.1453]
text = [
  "Defeat leads to enlightenment.\\n",
  "I realize now my own deficiency...\\c\\n",
  "But I will not make excuses! I will use\\n",
  "this knowledge as fuel for tomorrow!$",
]

[msg.section_0.entries.1454]
text = [
  "Hey, hey, hey!\\n",
  "It's all because of havin' love for\\l\\n",
  "Pokémon, right?\\c\\n",
  "Yeah, you know what I mean.\\n",
  "Come on! I'm gonna have you battle!\\c$",
]

[msg.section_0.entries.1455]
text = [
  "Man, your love for your Pokémon hit me\\n",
  "like a ton of bricks!$",
]

[msg.section_0.entries.1456]
text = [
  "Wouldn't it be nice to give your Pokémon\\n",
  "a little something?\\c$",
]

[msg.section_0.entries.1457]
text = [
  "Pokémon are always standing by their\\n",
  "Trainers, right?\\l\\n",
  "You have no idea how lucky we are!$",
]

[msg.section_0.entries.1458]
text = [
  "I hold no grudge, whether I win or lose.\\c\\n",
  "The point of battle is to train\\n",
  "my Pokémon, after all.\\c$",
]

[msg.section_0.entries.1459]
text = [
  "...Awww!\\n",
  "But I really wanted to win!$",
]

[msg.section_0.entries.1460]
text = [
  "Gimme a Berry, gimme a Berry!\\n",
  "Gimme a Persim Berry!\\c$",
]

[msg.section_0.entries.1461]
text = [
  "My Pokémon really go into a funk when\\n",
  "we don't win, though.$",
]

[msg.section_0.entries.1462]
text = [
  "Oh! A person!\\n",
  "I haven't met another person in so long!\\c\\n",
  "You're a Trainer, aren't you?!\\n",
  "Then let's battle!\\c$",
]

[msg.section_0.entries.1463]
text = [
  "Huh? Maybe my instincts have grown dull\\n",
  "after so long...?$",
]

[msg.section_0.entries.1464]
text = [
  "The roads around here are really very\\n",
  "complicated, so hardly anyone ever comes\\l\\n",
  "this way.$",
]

[msg.section_0.entries.1465]
text = [
  "I've been waiting for this!\\n",
  "Waiting for this very moment!\\c$",
]

[msg.section_0.entries.1466]
text = [
  "I had been waiting for such a strong Trainer\\n",
  "as yourself!$",
]

[msg.section_0.entries.1467]
text = [
  "I've been waiting for this!\\n",
  "Waiting to give a gift to someone!\\c$",
]

[msg.section_0.entries.1468]
text = [
  "I've been lying in wait for ages beside a\\n",
  "hidden item.\\c\\n",
  "An Amoonguss couldn't have pulled off a\\n",
  "better ambush...right?$",
]

[msg.section_0.entries.1469]
text = [
  "O Trainer, embarking on the path to\\n",
  "Victory Road!\\c\\n",
  "Won't you show me your true power?!\\c$",
]

[msg.section_0.entries.1470]
text = [
  "You didn't have to show me quite that\\n",
  "much power...$",
]

[msg.section_0.entries.1471]
text = [
  "If you have that much power, though, I'm\\n",
  "sure that you can use one of these!\\c$",
]

[msg.section_0.entries.1472]
text = [
  "If you climb the stairs, you'll reach the\\n",
  "Badge Check Gates...\\l\\n",
  "Victory Road lies right before you.$",
]

[msg.section_0.entries.1473]
text = [
  "An Ace Trainer like me has pride,\\n",
  "so I won't lose!\\c$",
]

[msg.section_0.entries.1474]
text = [
  "I could not protect my pride.\\n",
  "I'm mortified!$",
]

[msg.section_0.entries.1475]
text = [
  "Pride does not mean acting arrogantly!\\c\\n",
  "I'm really proud of what\\n",
  "I have achieved in my life!$",
]

[msg.section_0.entries.1476]
text = [
  "Challenging the Pokémon League, huh?\\c\\n",
  "It's no wonder you might feel a bit\\n",
  "nervous, but you've just got to believe\\l\\n",
  "in your Pokémon and do it!\\c$",
]

[msg.section_0.entries.1477]
text = [
  "Am I really going to be all right with only\\n",
  "this trifling power...?$",
]

[msg.section_0.entries.1478]
text = [
  "When you feel uneasy or afraid, just hug\\n",
  "your Pokémon real tight!\\c\\n",
  "If you do that, you'll be fine.\\n",
  "It'll just melt away all of your worries!$",
]

[msg.section_0.entries.1479]
text = [
  "Cute Pokémon or tough Pokémon...\\c\\n",
  "Which kind do you go for?\\c$",
]

[msg.section_0.entries.1480]
text = [
  "See, I like the cutely tough ones!$",
]

[msg.section_0.entries.1481]
text = [
  "Most people think that Rock- and Steel-\\n",
  "type Pokémon are all tough looking.\\c\\n",
  "But there are some cute little round\\n",
  "ones as well, you see!$",
]

[msg.section_0.entries.1482]
text = [
  "The tunnel to Twist Mountain is complete!\\n",
  "I heard that and came running!\\c$",
]

[msg.section_0.entries.1483]
text = [
  "I never heard that there were Trainers\\n",
  "this strong, though...$",
]

[msg.section_0.entries.1484]
text = [
  "Apparently the soil here in this tunnel is\\n",
  "quite like that in the ruins in Hoenn...$",
]

[msg.section_0.entries.1485]
text = [
  "Ex! Ca! Vate!\\c$",
]

[msg.section_0.entries.1486]
text = [
  "Jack! Ham! Merrrr!$",
]

[msg.section_0.entries.1487]
text = [
  "Excavate! Jackhammer!\\n",
  "They're manly sounding words, right!$",
]

[msg.section_0.entries.1488]
text = [
  "We dig and we dig until we break through!\\n",
  "What could be waiting on the other side?\\c$",
]

[msg.section_0.entries.1489]
text = [
  "You broke through!$",
]

[msg.section_0.entries.1490]
text = [
  "Sweat dripping, chips flying,\\n",
  "crushing through rock and stone!\\l\\n",
  "This is when I really feel alive!$",
]

[msg.section_0.entries.1491]
text = [
  "Even after we finish constructing this\\n",
  "tunnel, my Drill Pokémon won't ever stop!\\l\\n",
  "They can't be stopped!\\c$",
]

[msg.section_0.entries.1492]
text = [
  "You stopped my Drill Pokémon?!$",
]

[msg.section_0.entries.1493]
text = [
  "Watch our Pokémon's dynamic forms as\\n",
  "they crush through the bedrock!\\c\\n",
  "I can't imagine ever building another\\n",
  "tunnel without the help of Pokémon!$",
]

[msg.section_0.entries.1494]
text = [
  "Chili: Augh! You got me!\\n",
  "You and your Pokémon are on fire!$",
]

[msg.section_0.entries.1495]
text = [
  "Cress: Lose? Me?\\n",
  "I don't believe this!$",
]

[msg.section_0.entries.1496]
text = [
  "Cilan: ...Huh.\\n",
  "Looks like my timing was, um, off?$",
]

[msg.section_0.entries.1497]
text = [
  "I get it! Ohhh, I really get it!\\n",
  "But then... So that's how it is!$",
]

[msg.section_0.entries.1498]
text = [
  "I get it! So a Pokémon's strength really has\\n",
  "a lot to do with its Trainer, doesn't it?$",
]

[msg.section_0.entries.1499]
text = [
  "The research that I spent my whole life on\\n",
  "was all for naught?!$",
]

[msg.section_0.entries.1500]
text = [
  "Wh-wh-wh-wh-wh-wh-what is this?!\\n",
  "P-P-P-P-P-P-Plasmaaaa!$",
]

[msg.section_0.entries.1501]
text = [
  "The longer you live, the more opportunities\\n",
  "for failure.$",
]

[msg.section_0.entries.1502]
text = [
  "It is the same for anyone...\\n",
  "As long as you are dreaming, the dream\\l\\n",
  "will never reveal itself to you.$",
]

[msg.section_0.entries.1503]
text = [
  "It doesn't bother us a bit if\\n",
  "the stolen Pokémon cry or beg.$",
]

[msg.section_0.entries.1504]
text = [
  "It doesn't bother us a bit if Pokémon\\n",
  "win or lose.$",
]

[msg.section_0.entries.1505]
text = [
  "It doesn't bother us a bit if we have to\\n",
  "use another Pokémon after one is defeated.$",
]

[msg.section_0.entries.1506]
text = [
  "You may not find treasure by digging, but\\n",
  "you've still made a new road in the end.\\c\\n",
  "Augh, you caught me saying something\\n",
  "mushy! Battle will hide my shame!\\c$",
]

[msg.section_0.entries.1507]
text = [
  "Phew...\\n",
  "That was enough for me to overlook it.$",
]

[msg.section_0.entries.1508]
text = [
  "I've been thinking... If we dig too much,\\n",
  "will the whole Unova region collapse?$",
]

[msg.section_0.entries.1509]
text = [
  "Keep on digging! We'll keep digging until\\n",
  "we reach the underworld!\\c\\n",
  "Hey, you! If I beat you in battle, you've\\n",
  "got to help with the digging!\\c$",
]

[msg.section_0.entries.1510]
text = [
  "Urk!\\n",
  "You don't pull your punches!$",
]

[msg.section_0.entries.1511]
text = [
  "If we keep expanding down here, Clay\\n",
  "will literally be an underground boss!$",
]

[msg.section_0.entries.1512]
text = [
  "We step now into a new world...\\n",
  "What kind of dangers await?\\c\\n",
  "Will you be able to make it through?\\c$",
]

[msg.section_0.entries.1513]
text = [
  "Well, shoot!\\n",
  "Keep going then!$",
]

[msg.section_0.entries.1514]
text = [
  "You, who have the strength to move on...\\n",
  "Take these with you.\\c$",
]

[msg.section_0.entries.1515]
text = [
  "I wonder if order is being preserved\\n",
  "between Pokémon and humans.$",
]

[msg.section_0.entries.1516]
text = [
  "You will keep moving forward to wherever\\n",
  "your curiosity leads, won't you?\\c$",
]

[msg.section_0.entries.1517]
text = [
  "You've got an inexhaustible supply of\\n",
  "curiosity, haven't you!$",
]

[msg.section_0.entries.1518]
text = [
  "To curiosity without end!\\n",
  "Here's your reward. Wonderful.\\c$",
]

[msg.section_0.entries.1519]
text = [
  "Surprise! Excitement! Awe!\\c\\n",
  "Can you even imagine what must be waiting\\n",
  "for you up ahead?$",
]

[msg.section_0.entries.1520]
text = [
  "Just being here fills me\\n",
  "with magical power...\\c$",
]

[msg.section_0.entries.1521]
text = [
  "You seem to be\\n",
  "full of magical power, too...$",
]

[msg.section_0.entries.1522]
text = [
  "In ancient places, magical\\n",
  "energy remains...\\c\\n",
  "I can understand it.\\n",
  "So much sorrow and joy...$",
]

[msg.section_0.entries.1523]
text = [
  "My Psychic-type Pokémon\\n",
  "just started making noises.\\c\\n",
  "Is that because we're in the ruins...\\n",
  "or is it because of you?\\c$",
]

[msg.section_0.entries.1524]
text = [
  "So...strong!\\n",
  "Who are you?!$",
]

[msg.section_0.entries.1525]
text = [
  "Relic Castle...\\c\\n",
  "Apparently people and Pokémon came\\n",
  "together here to create Unova.$",
]

[msg.section_0.entries.1526]
text = [
  "...When I am here, I feel like I might\\n",
  "be crushed by sorrow.\\c\\n",
  "You there...\\n",
  "Let us have a bout!\\c$",
]

[msg.section_0.entries.1527]
text = [
  "This bout...\\n",
  "I will not forget it...$",
]

[msg.section_0.entries.1528]
text = [
  "This castle will be buried by the sands\\n",
  "and forgotten in time...\\c\\n",
  "Whenever that sad fact strikes me, tears\\n",
  "naturally course down my face...$",
]

[msg.section_0.entries.1529]
text = [
  "I'll knock you down with mountain power!\\c$",
]

[msg.section_0.entries.1530]
text = [
  "Your power is off the charts!$",
]

[msg.section_0.entries.1531]
text = [
  "As great as a mountain... That's right!\\n",
  "I'll become a mountain man!\\c\\n",
  "Oh, wait, I suppose I already am!$",
]

[msg.section_0.entries.1532]
text = [
  "Whooo!\\n",
  "Moun-TAAAIIIN!\\c$",
]

[msg.section_0.entries.1533]
text = [
  "Let the scales fall from your eyes!$",
]

[msg.section_0.entries.1534]
text = [
  "Mountains are sacred places.\\n",
  "I am here to purify my heart and mind.$",
]

[msg.section_0.entries.1535]
text = [
  "If you had three Pokémon, then we could\\n",
  "do a Rotation Battle!$",
]

[msg.section_0.entries.1536]
text = [
  "I will read your mind and predict your\\n",
  "every move!\\c$",
]

[msg.section_0.entries.1537]
text = [
  "Your moves...\\n",
  "They are entirely unpredictable!$",
]

[msg.section_0.entries.1538]
text = [
  "I am a Trainer who fights as freely as the\\n",
  "clouds drift in the sky!\\l\\n",
  "Do not stiffen up on me!$",
]

[msg.section_0.entries.1539]
text = [
  "A Triple Battle is a three-against-three\\n",
  "Pokémon battle!$",
]

[msg.section_0.entries.1540]
text = [
  "Heh heh! I wonder what would happen if I\\n",
  "had all three Pokémon attack at once?\\c$",
]

[msg.section_0.entries.1541]
text = [
  "I couldn't pick a target to focus on...\\n",
  "Or, rather, you never let me pick one!$",
]

[msg.section_0.entries.1542]
text = [
  "A flood of attacks from three Pokémon...\\c\\n",
  "I know! “Jetstream\\\" attack!\\n",
  "Let's call it that.$",
]

[msg.section_0.entries.1543]
text = [
  "Hold on. You there...\\n",
  "Are you looking for the Magma Stone?\\c$",
]

[msg.section_0.entries.1544]
text = [
  "How about I tell you everything I know\\n",
  "about the Magma Stone?$",
]

[msg.section_0.entries.1545]
text = [
  "Well, there's this Magma Stone in\\n",
  "Stark Mountain, yeah?\\c\\n",
  "You move that, yeah? Then if you put\\n",
  "it back where it belongs, they say the\\l\\n",
  "legendary Pokémon Heatran will appear.$",
]

[msg.section_0.entries.1546]
text = [
  "You see those pointy stones you find\\n",
  "here and there? Are you aware of them?\\c$",
]

[msg.section_0.entries.1547]
text = [
  "That marvelous power of yours...\\n",
  "I was not aware of it!$",
]

[msg.section_0.entries.1548]
text = [
  "Droplets of water containing lime keep\\n",
  "dripping down for hundreds of years...\\l\\n",
  "Then they harden into stone cones.\\l\\n",
  "Those are what we call stalagmites!$",
]

[msg.section_0.entries.1549]
text = [
  "I can feel the energy that overflows\\n",
  "from the earth!\\c$",
]

[msg.section_0.entries.1550]
text = [
  "I felt the energy that overflowed\\n",
  "from your Pokémon!$",
]

[msg.section_0.entries.1551]
text = [
  "Take this!\\n",
  "Earth's energyyyy!\\c$",
]

[msg.section_0.entries.1552]
text = [
  "Geothermal heat and abundant minerals...\\n",
  "Yes, volcanoes hold the planet's energy!$",
]

[msg.section_0.entries.1553]
text = [
  "Battle in a volcano!\\c$",
]

[msg.section_0.entries.1554]
text = [
  "You're super strong!$",
]

[msg.section_0.entries.1555]
text = [
  "Here! For you!\\c$",
]

[msg.section_0.entries.1556]
text = [
  "Volcanoes are called “kazan\\\"\\n",
  "in my language!$",
]

[msg.section_0.entries.1557]
text = [
  "Hold on. You there...\\n",
  "Are you looking for the Magma Stone?\\c$",
]

[msg.section_0.entries.1558]
text = [
  "How about I tell you everything I know\\n",
  "about the Magma Stone?$",
]

[msg.section_0.entries.1559]
text = [
  "Well, there's this Magma Stone in\\n",
  "Stark Mountain, yeah?\\c\\n",
  "You move that, yeah? Then if you put\\n",
  "it back where it belongs, they say the\\l\\n",
  "legendary Pokémon Heatran will appear.$",
]

[msg.section_0.entries.1560]
text = [
  "I can feel the energy that overflows\\n",
  "from the earth!\\c$",
]

[msg.section_0.entries.1561]
text = [
  "I really felt the energy that overflowed\\n",
  "from your Pokémon!$",
]

[msg.section_0.entries.1562]
text = [
  "Take this!\\n",
  "Earth's energyyyy!\\c$",
]

[msg.section_0.entries.1563]
text = [
  "Geothermal heat and abundant minerals...\\n",
  "Yes, volcanoes hold the planet's energy!$",
]

[msg.section_0.entries.1564]
text = [
  "Battle in a volcano!\\c$",
]

[msg.section_0.entries.1565]
text = [
  "You're super strong!$",
]

[msg.section_0.entries.1566]
text = [
  "Here! For you!\\c$",
]

[msg.section_0.entries.1567]
text = [
  "Volcanoes are called “kazan\\\"\\n",
  "in my language!$",
]

[msg.section_0.entries.1568]
text = [
  "How is magma created?\\n",
  "Can you answer that?!\\c$",
]

[msg.section_0.entries.1569]
text = [
  "That power! That pressure!\\n",
  "That is the answer!$",
]

[msg.section_0.entries.1570]
text = [
  "So strong pressure deep underground\\n",
  "liquefies stone and turns it into magma...$",
]

[msg.section_0.entries.1571]
text = [
  "When I am surrounded by rocks,\\n",
  "my spirit goes up!!\\c$",
]

[msg.section_0.entries.1572]
text = [
  "When I lose,\\n",
  "my spirits sink...$",
]

[msg.section_0.entries.1573]
text = [
  "My spirits rise and fall.\\n",
  "I'm just charmingly unpredictable!$",
]

[msg.section_0.entries.1574]
text = [
  "Why do I dig?\\n",
  "Why do you fight?\\c$",
]

[msg.section_0.entries.1575]
text = [
  "Your past experience...\\n",
  "Is that the source of your strength?$",
]

[msg.section_0.entries.1576]
text = [
  "The more you fight,\\n",
  "the stronger you'll be.\\c\\n",
  "The more you dig,\\n",
  "the bigger the hole will be...\\c\\n",
  "If you have a purpose,\\n",
  "there's no wasted effort!$",
]

[msg.section_0.entries.1577]
text = [
  "I've found a strong-looking Trainer\\n",
  "during my patrol!\\l\\n",
  "Go, Sigilyph!\\c$",
]

[msg.section_0.entries.1578]
text = [
  "It is just as I had thought!\\n",
  "A monstrously strong Trainer!$",
]

[msg.section_0.entries.1579]
text = [
  "You see my Sigilyph?\\c\\n",
  "It always seems to want to take the\\n",
  "same exact route, but why is that?$",
]

[msg.section_0.entries.1580]
text = [
  "Let's see you take a powerful attack\\n",
  "from veteran Workers like us!\\c$",
]

[msg.section_0.entries.1581]
text = [
  "We've trained by doing physical work.\\n",
  "So even when we lose, we're powerful!$",
]

[msg.section_0.entries.1582]
text = [
  "This Worker is happy to have a job that\\n",
  "lets him be with his favorite Pokémon!$",
]

[msg.section_0.entries.1583]
text = [
  "Twist Mountain changes in every season,\\n",
  "and this old man changes in every battle!\\c$",
]

[msg.section_0.entries.1584]
text = [
  "Go easy on...\\n",
  "a grown-up?!$",
]

[msg.section_0.entries.1585]
text = [
  "This old man likes winter.\\c\\n",
  "Snow on Twist Mountain...\\n",
  "has an indescribable beauty.$",
]

[msg.section_0.entries.1586]
text = [
  "See the combination of my cool Ice-type\\n",
  "Pokémon and my hot fighting spirit!\\c$",
]

[msg.section_0.entries.1587]
text = [
  "It looks like you can also make an\\n",
  "ice-and-heat combination!$",
]

[msg.section_0.entries.1588]
text = [
  "Twist Mountain is cold all year round!\\c\\n",
  "It's a great place for Ice-type Pokémon\\n",
  "that are happy in the depths of winter!$",
]

[msg.section_0.entries.1589]
text = [
  "Hold up, youngster!\\n",
  "A battle will help you warm up!\\c$",
]

[msg.section_0.entries.1590]
text = [
  "Hah! Battling gets me so warm that I'm\\n",
  "even sweating!$",
]

[msg.section_0.entries.1591]
text = [
  "You can feel my face if you don't\\n",
  "believe me. See? Dripping with sweat!$",
]

[msg.section_0.entries.1592]
text = [
  "Heavy labor is a breeze when you let a\\n",
  "Psychic-type Pokémon take care of it!\\c\\n",
  "Now I can slack off and take it easy!\\c$",
]

[msg.section_0.entries.1593]
text = [
  "Oh, I see... If a Trainer starts slacking,\\n",
  "it'll be his or her Pokémon that suffer.$",
]

[msg.section_0.entries.1594]
text = [
  "A real Worker works together with their\\n",
  "Pokémon!\\c\\n",
  "You cannot just make Pokémon do all the\\n",
  "work while you slack off!$",
]

[msg.section_0.entries.1595]
text = [
  "It has been two years since I secluded\\n",
  "myself here on Twist Mountain...\\c\\n",
  "Now I will take this chance to test the\\n",
  "results of my training!\\c$",
]

[msg.section_0.entries.1596]
text = [
  "Even the most intense training does not\\n",
  "necessarily guarantee victory...$",
]

[msg.section_0.entries.1597]
text = [
  "If there are those like myself who\\n",
  "dedicate their lives only to training...\\c\\n",
  "Then there are those like you who\\n",
  "grow through your journey?$",
]

[msg.section_0.entries.1598]
text = [
  "Triple Battle is a new kind of battle\\n",
  "with three Pokémon!$",
]

[msg.section_0.entries.1599]
text = [
  "OK! I will show you the results\\n",
  "of my daily workouts!\\c$",
]

[msg.section_0.entries.1600]
text = [
  "The result of my daily workout...\\n",
  "didn't really show up.\\c$",
]

[msg.section_0.entries.1601]
text = [
  "I'm going to train my Pokémon properly\\n",
  "and make sure they grow balanced.\\c\\n",
  "Bwahaha! It's the challenges that make\\n",
  "life worth living, whatever your age!$",
]

[msg.section_0.entries.1602]
text = [
  "Twist Mountain's number one tactician!\\n",
  "That's me!\\c$",
]

[msg.section_0.entries.1603]
text = [
  "Maybe I shouldn't have been satisfied with\\n",
  "just being number one in Twist Mountain...?$",
]

[msg.section_0.entries.1604]
text = [
  "Thank you...\\n",
  "With our battle, my eyes have\\l\\n",
  "been opened.\\c\\n",
  "Being number one of Twist Mountain\\n",
  "is only a stepping-stone on my journey!$",
]

[msg.section_0.entries.1605]
text = [
  "A Rotation Battle is a battle using\\n",
  "three Pokémon!$",
]

[msg.section_0.entries.1606]
text = [
  "In Rotation Battles, it's also important\\n",
  "to know when NOT to rotate.\\c$",
]

[msg.section_0.entries.1607]
text = [
  "I've been training for Rotation Battles for\\n",
  "two years now, but it's still not enough...$",
]

[msg.section_0.entries.1608]
text = [
  "I'm sure that Grimsley would've\\n",
  "known when to rotate...$",
]

[msg.section_0.entries.1609]
text = [
  "A lake that spreads beneath the earth...\\n",
  "And the Hiker who waits beside it!\\c$",
]

[msg.section_0.entries.1610]
text = [
  "You have seized victory with ease,\\n",
  "young Trainer...$",
]

[msg.section_0.entries.1611]
text = [
  "This lake was formed by the water from\\n",
  "underground rivers...\\c\\n",
  "Such a clear, flawless blue...$",
]

[msg.section_0.entries.1612]
text = [
  "Hold up! Did you know this path was\\n",
  "supposedly made ages and ages ago?\\c$",
]

[msg.section_0.entries.1613]
text = [
  "S-sorry...\\n",
  "I just got so excited...$",
]

[msg.section_0.entries.1614]
text = [
  "Did people really make a tunnel this long\\n",
  "all those ages ago?\\c\\n",
  "No, they must have had many Pokémon\\n",
  "helping them with the work.\\c\\n",
  "Or they might have been forcing the\\n",
  "Pokémon to help...$",
]

[msg.section_0.entries.1615]
text = [
  "It's “The Waving Weaving Walk\\\"--\\n",
  "Wawalk for short!\\c\\n",
  "I wonder what kind of Pokémon\\n",
  "we'll meet today?\\c$",
]

[msg.section_0.entries.1616]
text = [
  "Your Pokémon have good Abilities,\\n",
  "don't they?$",
]

[msg.section_0.entries.1617]
text = [
  "I totally loved the Wawalk TV show, but\\n",
  "they took it off the air.$",
]

[msg.section_0.entries.1618]
text = [
  "First, one big last gulp...\\c\\n",
  "Hold your breath!\\c$",
]

[msg.section_0.entries.1619]
text = [
  "Puaaahhh!\\n",
  "...Holding your breath is really tough!$",
]

[msg.section_0.entries.1620]
text = [
  "The air that I just breathed in...\\c\\n",
  "It could actually be really ancient air\\n",
  "that hasn't changed for ages, you know?$",
]

[msg.section_0.entries.1621]
text = [
  "Hello, lo, lo!\\c$",
]

[msg.section_0.entries.1622]
text = [
  "I, I, I...\\n",
  "Lost, lost, lost!$",
]

[msg.section_0.entries.1623]
text = [
  "Echo, oh, oh!\\c\\n",
  "...\\c\\n",
  "Your voice really echoes in a path like\\n",
  "this one, huh?$",
]

[msg.section_0.entries.1624]
text = [
  "My path and yours...\\n",
  "They cross here and now...\\c$",
]

[msg.section_0.entries.1625]
text = [
  "Now that I think about it, I've come\\n",
  "quite far...$",
]

[msg.section_0.entries.1626]
text = [
  "I am going wherever I can have glorious\\n",
  "battles against new people...\\c\\n",
  "It sounds quite daring, doesn't it?$",
]

[msg.section_0.entries.1627]
text = [
  "The fact that you are here means...\\n",
  "that you are also part of the sewer?!\\l\\n",
  "All right! Then I will survey you, too!\\c$",
]

[msg.section_0.entries.1628]
text = [
  "Huh...? Where am I?\\n",
  "Who are you?$",
]

[msg.section_0.entries.1629]
text = [
  "What?! You mean that I got so\\n",
  "caught up in my survey of the sewer\\l\\n",
  "that I ended up in the Relic Passage?!$",
]

[msg.section_0.entries.1630]
text = [
  "The sewer and this Relic Passage...\\c\\n",
  "Is it really simple coincidence that they\\n",
  "exist so close to each other?\\c$",
]

[msg.section_0.entries.1631]
text = [
  "No, there must be a reason why...\\n",
  "Oh! When did I lose?$",
]

[msg.section_0.entries.1632]
text = [
  "Modern men make sewers,\\n",
  "ancient man made these paths...\\c\\n",
  "Have there always been people who just\\n",
  "couldn't get enough of digging holes?$",
]

[msg.section_0.entries.1633]
text = [
  "I'll borrow this ruin's power to...power\\n",
  "up my own psychic...powers!\\c$",
]

[msg.section_0.entries.1634]
text = [
  "So I couldn't just expect that to make my\\n",
  "Pokémon more powerful, too...$",
]

[msg.section_0.entries.1635]
text = [
  "The one thing you CAN borrow to get\\n",
  "stronger is a Rental Pokémon!\\c\\n",
  "Oops. Did I just say something I\\n",
  "shouldn't have?$",
]

[msg.section_0.entries.1636]
text = [
  "It's coming... It's coming!\\n",
  "The ancient spiritual power!\\c$",
]

[msg.section_0.entries.1637]
text = [
  "The ancient power!\\n",
  "The sacred power!$",
]

[msg.section_0.entries.1638]
text = [
  "I feel an extraordinary power emanating\\n",
  "from up ahead!\\c\\n",
  "Yes! It is a power that burns as warm and\\n",
  "bright as the sun!$",
]

[msg.section_0.entries.1639]
text = [
  "All right, let me introduce you\\n",
  "to the other super-cool and cute\\l\\n",
  "member of my band!\\c$",
]

[msg.section_0.entries.1640]
text = [
  "If we don't recruit more members,\\n",
  "the sound won't have enough depth.$",
]

[msg.section_0.entries.1641]
text = [
  "You're a strange kid!\\c\\n",
  "Even though we lost, I think my Pokémon\\n",
  "had fun. Look, it's even smiling!$",
]

[msg.section_0.entries.1642]
text = [
  "Here I go!\\c$",
]

[msg.section_0.entries.1643]
text = [
  "Your style is electrifying!$",
]

[msg.section_0.entries.1644]
text = [
  "You know what? At first I would practice\\n",
  "real quiet so I wouldn't be a bother to\\l\\n",
  "the Pokémon living here...\\c\\n",
  "But then guess what happened! Lately\\n",
  "the Pokémon come and listen to me play!$",
]

[msg.section_0.entries.1645]
text = [
  "This Hiker wandering the expanses of\\n",
  "the world will teach a child like you the\\l\\n",
  "harshness of life and the difficulty of\\l\\n",
  "Pokémon battles!\\c$",
]

[msg.section_0.entries.1646]
text = [
  "The teacher was schooled...\\n",
  "You're very strict, aren't you?$",
]

[msg.section_0.entries.1647]
text = [
  "Sometimes Pokémon are inside dust clouds!$",
]

[msg.section_0.entries.1648]
text = [
  "It is the way of greeting high in the\\n",
  "mountains and down in the caves.\\c\\n",
  "That's right! We each get out our\\n",
  "Pokémon, and then we begin!\\c$",
]

[msg.section_0.entries.1649]
text = [
  "Farewell...\\n",
  "Farewell, my victory...$",
]

[msg.section_0.entries.1650]
text = [
  "Long ago, Pokémon and people\\n",
  "lived separately.\\c\\n",
  "And now we live all together like this...\\c\\n",
  "I don't know if it is a good thing or not,\\n",
  "but it will surely lead to many changes.$",
]

[msg.section_0.entries.1651]
text = [
  "This cave is full of rocks\\n",
  "generating electricity!\\l\\n",
  "The electricity is charging me up!\\c$",
]

[msg.section_0.entries.1652]
text = [
  "Yowch, a lightning spark!$",
]

[msg.section_0.entries.1653]
text = [
  "The sources of my energy are\\n",
  "my precious Pokémon!\\l\\n",
  "This has been scientifically proven!!$",
]

[msg.section_0.entries.1654]
text = [
  "I love this place! The electricity\\n",
  "charges up my inspiration!\\c$",
]

[msg.section_0.entries.1655]
text = [
  "Aha!\\n",
  "That made a lightbulb go on in my head!$",
]

[msg.section_0.entries.1656]
text = [
  "When a person moves,\\n",
  "electric signals travel in the body!\\c\\n",
  "Also, when a person has an inspiration,\\n",
  "electric signals travel to the brain!$",
]

[msg.section_0.entries.1657]
text = [
  "I am a Pokémon Ranger, here to gather\\n",
  "up some electric power!\\c$",
]

[msg.section_0.entries.1658]
text = [
  "Whoa! Can I still not draw forth my\\n",
  "electrifying powers?!$",
]

[msg.section_0.entries.1659]
text = [
  "Take this.\\c$",
]

[msg.section_0.entries.1660]
text = [
  "I don't know if it's unfair or just plain\\n",
  "cool when Pokémon use electricity!$",
]

[msg.section_0.entries.1661]
text = [
  "There was a whisper on the wind that told\\n",
  "me of your coming!\\c$",
]

[msg.section_0.entries.1662]
text = [
  "I will become the wind and blow...$",
]

[msg.section_0.entries.1663]
text = [
  "Oh! I almost forgot!\\n",
  "I found some Chesto Berries, so...\\c$",
]

[msg.section_0.entries.1664]
text = [
  "Wind blows into caves when you're\\n",
  "close to an entrance or exit.$",
]

[msg.section_0.entries.1665]
text = [
  "The magic number is three! You need\\n",
  "three healthy Pokémon who can fight!$",
]

[msg.section_0.entries.1666]
text = [
  "Behold the destructive force created\\n",
  "by my three prized Pokémon!\\c$",
]

[msg.section_0.entries.1667]
text = [
  "Your combined force as a team is greater\\n",
  "than ours!$",
]

[msg.section_0.entries.1668]
text = [
  "Perhaps I need to meet my Pokémon head-\\n",
  "on... Then we could be a stronger team!$",
]

[msg.section_0.entries.1669]
text = [
  "I researched on the PC the best way\\n",
  "to battle, and now I'm sure to win!\\c$",
]

[msg.section_0.entries.1670]
text = [
  "Seriously?$",
]

[msg.section_0.entries.1671]
text = [
  "What I found on the PC was just someone\\n",
  "else's idea and not an answer that I had\\l\\n",
  "come up with myself...$",
]

[msg.section_0.entries.1672]
text = [
  "For a Rotation Battle, you've got to\\n",
  "have three Pokémon, you know!$",
]

[msg.section_0.entries.1673]
text = [
  "My three beloved Pokémon will make their\\n",
  "debut in a perfect, weaving triangle.\\c$",
]

[msg.section_0.entries.1674]
text = [
  "You were the one who had the stronger\\n",
  "combined power as a team?!$",
]

[msg.section_0.entries.1675]
text = [
  "With Rotation Battles, do you think that\\n",
  "maybe you need some Pokémon that can\\l\\n",
  "take attacks, not just deal them out?$",
]

[msg.section_0.entries.1676]
text = [
  "Hey! My Pokémon are great.\\n",
  "Look, look!\\c$",
]

[msg.section_0.entries.1677]
text = [
  "Argh!!$",
]

[msg.section_0.entries.1678]
text = [
  "I am called an Ace Trainer, but\\n",
  "that doesn't sit well with me.\\c\\n",
  "'Cause I just love Pokémon,\\n",
  "and I just want to be strong!$",
]

[msg.section_0.entries.1679]
text = [
  "When Pokémon Trainers meet,\\n",
  "what we do is, of course,\\l\\n",
  "engage in a Pokémon battle, don't we?\\c$",
]

[msg.section_0.entries.1680]
text = [
  "Oh no...\\n",
  "I'm pathetic...$",
]

[msg.section_0.entries.1681]
text = [
  "Perhaps I meet people here because of\\n",
  "guidance from my Pokémon.$",
]

[msg.section_0.entries.1682]
text = [
  "Oh?\\n",
  "You want to have a battle with me?\\c\\n",
  "All right!\\n",
  "I have a strong Pokémon.\\c$",
]

[msg.section_0.entries.1683]
text = [
  "That's right.\\n",
  "The Pokémon is no longer with me.$",
]

[msg.section_0.entries.1684]
text = [
  "...That's not true.\\n",
  "As long as I remember,\\l\\n",
  "it will be with me forever.$",
]

[msg.section_0.entries.1685]
text = [
  "Let us have our Pokémon battle with\\n",
  "gentlemanly reserve!\\c$",
]

[msg.section_0.entries.1686]
text = [
  "Ho, ho, ho! Quite the affront!$",
]

[msg.section_0.entries.1687]
text = [
  "I have enjoyed every day I spend with\\n",
  "my Pokémon.\\c\\n",
  "If only my Pokémon feel the same way,\\n",
  "then I can die happy!$",
]

[msg.section_0.entries.1688]
text = [
  "Oh my, what a young Trainer.\\n",
  "If it's all right, why don't we battle?\\c$",
]

[msg.section_0.entries.1689]
text = [
  "There at the end, I nearly called out my\\n",
  "late Pokémon's name...$",
]

[msg.section_0.entries.1690]
text = [
  "Is it a good thing to forget your Pokémon\\n",
  "after they are gone?\\l\\n",
  "Or is it better when you cannot forget?$",
]

[msg.section_0.entries.1691]
text = [
  "Let's show the resting spirits\\n",
  "the dazzling splendor of life!\\c$",
]

[msg.section_0.entries.1692]
text = [
  "Hm...?\\n",
  "Was that a spirit just now?$",
]

[msg.section_0.entries.1693]
text = [
  "When I come to Celestial Tower,\\n",
  "strangely, I feel the urge to fight.\\c\\n",
  "Does it broadcast some sort of signal\\n",
  "that makes me want to fight?$",
]

[msg.section_0.entries.1694]
text = [
  "I'm here to understand the end\\n",
  "of the world, but I don't quite get it.\\c\\n",
  "If I have a battle,\\n",
  "will I be enlightened...?\\c$",
]

[msg.section_0.entries.1695]
text = [
  "The end...\\n",
  "Is that it?$",
]

[msg.section_0.entries.1696]
text = [
  "People, Pokémon...\\n",
  "Even if the world is gone,\\l\\n",
  "that is not the end.$",
]

[msg.section_0.entries.1697]
text = [
  "Indescribable energy\\n",
  "is flowing to me!\\c$",
]

[msg.section_0.entries.1698]
text = [
  "The energy is escaping...\\n",
  "Aww...$",
]

[msg.section_0.entries.1699]
text = [
  "The thoughts and wishes of the Pokémon\\n",
  "that rest here also provide energy!$",
]

[msg.section_0.entries.1700]
text = [
  "...I still want to fight!\\c\\n",
  "The wandering spirits are\\n",
  "still commanding me!\\c$",
]

[msg.section_0.entries.1701]
text = [
  "Hah... Hah...\\n",
  "The spirit just left me.$",
]

[msg.section_0.entries.1702]
text = [
  "So many voices fill this tower,\\n",
  "eternally silenced...\\l\\n",
  "If only someone would just listen...$",
]

[msg.section_0.entries.1703]
text = [
  "I love Bug-type Pokémon, and I love\\n",
  "bug catching!\\c\\n",
  "Of course I looove Pokémon battles, too!\\c$",
]

[msg.section_0.entries.1704]
text = [
  "I won't lose to anyone when it comes to bug\\n",
  "catching, yet I...$",
]

[msg.section_0.entries.1705]
text = [
  "If I catch all of the Bug-type Pokémon in\\n",
  "the Unova region, I can get a Bug-type\\l\\n",
  "Catcher Medal!\\c\\n",
  "That's what I'm aiming for!$",
]

[msg.section_0.entries.1706]
text = [
  "My Pokémon's poison really stings!\\c$",
]

[msg.section_0.entries.1707]
text = [
  "What a defeat!\\n",
  "I guess I got a taste of my own poison!$",
]

[msg.section_0.entries.1708]
text = [
  "A little sting, and then the slow\\n",
  "drain begins...\\c\\n",
  "The super-technical way that Poison-type\\n",
  "Pokémon attack is so cool!$",
]

[msg.section_0.entries.1709]
text = [
  "I was taught by Master Cheren himself\\n",
  "how to battle with Pokémon!\\c$",
]

[msg.section_0.entries.1710]
text = [
  "Nooo way!\\n",
  "You're stronger than Master Cheren?!$",
]

[msg.section_0.entries.1711]
text = [
  "The more that you study Pokémon, the\\n",
  "more you'll understand them.\\l\\n",
  "It's, like, way too much fun!$",
]

[msg.section_0.entries.1712]
text = [
  "We'll put together our power to fight!\\n",
  "Two is better than one!\\c$",
]

[msg.section_0.entries.1713]
text = [
  "Rae: You're even more in sync than we are!\\c\\n",
  "Ula: Boo-hoo-hooo! We lost!$",
]

[msg.section_0.entries.1714]
text = [
  "I have to watch out for my sister's\\n",
  "Pokémon when we battle.\\l\\n",
  "I'm the big sister, after all!$",
]

[msg.section_0.entries.1715]
text = [
  "We're still pretty small, so we can only\\n",
  "stand up to others by working together.\\c\\n",
  "That's why we battle with two Pokémon\\n",
  "at the same time!$",
]

[msg.section_0.entries.1716]
text = [
  "Two! Two! Two is better!\\n",
  "...But what's “better\\\" mean?\\c$",
]

[msg.section_0.entries.1717]
text = [
  "I still don't get a lot of things...\\c\\n",
  "But Pokémon are cute, and battling sure\\n",
  "is fun!$",
]

[msg.section_0.entries.1718]
text = [
  "Mommy and Daddy told me that I have\\n",
  "to play fair.\\c\\n",
  "So you've got to have two Pokémon to do\\n",
  "a Double Battle!$",
]

[msg.section_0.entries.1719]
text = [
  "My Pokémon are gonna steam you out!\\c$",
]

[msg.section_0.entries.1720]
text = [
  "We haven't lost in terms of dampness...\\n",
  "I'm gonna keep believing that!$",
]

[msg.section_0.entries.1721]
text = [
  "It sure is great to be all sodden.\\c\\n",
  "Who was the one who got to decide that\\n",
  "bright, airy places are best?$",
]

[msg.section_0.entries.1722]
text = [
  "Is that a Pokédex?!\\c\\n",
  "I'd love it if you would show me\\n",
  "lots of different kinds of Pokémon!\\c$",
]

[msg.section_0.entries.1723]
text = [
  "...!\\n",
  "I've never seen a Pokémon like that.$",
]

[msg.section_0.entries.1724]
text = [
  "Hmm... I wonder if I would meet some new\\n",
  "Pokémon if I went to the swamp?$",
]

[msg.section_0.entries.1725]
text = [
  "Rotation Battles are battles\\n",
  "with three Pokémon!$$$$$",
]

[msg.section_0.entries.1726]
text = [
  "The splish-splosh sounds! Those were\\n",
  "your footsteps, weren't they?\\l\\n",
  "So cute!\\c$",
]

[msg.section_0.entries.1727]
text = [
  "You are so strong--too strong to be cute!$",
]

[msg.section_0.entries.1728]
text = [
  "According to footstep fortune-telling...\\c\\n",
  "Those whose footsteps make a splish and\\n",
  "a splosh are Trainers that Pokémon like.$",
]

[msg.section_0.entries.1729]
text = [
  "Triple Battles use three Pokémon!$",
]

[msg.section_0.entries.1730]
text = [
  "If you turn a parasol around,\\n",
  "it's like a flower blossoming in the rain!\\c$",
]

[msg.section_0.entries.1731]
text = [
  "Whee! I'll spin around my parasol and send\\n",
  "some water droplets flying your way!$",
]

[msg.section_0.entries.1732]
text = [
  "On rainy days, use a parasol,\\n",
  "wear a coat, or get wet.\\l\\n",
  "Do as you like!$",
]

[msg.section_0.entries.1733]
text = [
  "Real Fishermen are impatient!\\n",
  "So we must battle immediately!\\c$",
]

[msg.section_0.entries.1734]
text = [
  "I lost!\\n",
  "It's the end!!$",
]

[msg.section_0.entries.1735]
text = [
  "How do I know that real Fishermen\\n",
  "are so impatient?\\c\\n",
  "Because we change places frantically\\n",
  "if we cannot catch Pokémon!$",
]

[msg.section_0.entries.1736]
text = [
  "Knowing oneself, knowing the other,\\n",
  "and knowing the surroundings...\\l\\n",
  "That's a Ranger!\\c$",
]

[msg.section_0.entries.1737]
text = [
  "Knowing your opponent is a difficult feat!$",
]

[msg.section_0.entries.1738]
text = [
  "Do you know about this?\\c$",
]

[msg.section_0.entries.1739]
text = [
  "If you know what kind of wild Pokémon\\n",
  "inhabit an area, you can bring along\\l\\n",
  "Pokémon who are strong against them and\\l\\n",
  "will have no problem moving ahead.$",
]

[msg.section_0.entries.1740]
text = [
  "Pokémon Trainers nurture friendship\\n",
  "with their battles!\\c$",
]

[msg.section_0.entries.1741]
text = [
  "This feeling of defeat...\\n",
  "is like a bottomless swamp...$",
]

[msg.section_0.entries.1742]
text = [
  "Lum Berries make a great token\\n",
  "of friendship!\\c$",
]

[msg.section_0.entries.1743]
text = [
  "Stay still and listen carefully!\\n",
  "Hear the sounds of nearby Pokémon...\\l\\n",
  "the breath of trees and swamps.$",
]

[msg.section_0.entries.1744]
text = [
  "If there are Trainers,\\n",
  "I just have battles with them.\\c$",
]

[msg.section_0.entries.1745]
text = [
  "I've never seen\\n",
  "such a strong Trainer!$",
]

[msg.section_0.entries.1746]
text = [
  "I'll battle with anyone.\\c\\n",
  "Because they may show me Water-type\\n",
  "Pokémon I've never seen.$",
]

[msg.section_0.entries.1747]
text = [
  "Just a little bit more...\\n",
  "I just need that spark!\\c$",
]

[msg.section_0.entries.1748]
text = [
  "...I've done it!\\n",
  "This haiku will be my magnum opus!$",
]

[msg.section_0.entries.1749]
text = [
  "I see myself there,\\n",
  "reflected in the still lake.\\l\\n",
  "A silent defeat...$",
]

[msg.section_0.entries.1750]
text = [
  "Strength that goes beyond mere Abilities...\\n",
  "You there! You're a real tough one, huh!$",
]

[msg.section_0.entries.1751]
text = [
  "More!\\n",
  "Let me hear the voice of your Pokémon!$",
]

[msg.section_0.entries.1752]
text = [
  "I still have my last friend...\\n",
  "We won't ever give up!$",
]

[msg.section_0.entries.1753]
text = [
  "I will accept my friend's pain as my own and\\n",
  "do this!$",
]

[msg.section_0.entries.1754]
text = [
  "The love for your Pokémon permeates\\n",
  "every cell of your body. I felt it!$",
]

[msg.section_0.entries.1755]
text = [
  "More!\\n",
  "Let me hear the voice of your Pokémon!$",
]

[msg.section_0.entries.1756]
text = [
  "I still have my last friend...\\n",
  "We won't ever give up!$",
]

[msg.section_0.entries.1757]
text = [
  "I will accept my friend's pain as my own,\\n",
  "and the move I will choose is this!$",
]

[msg.section_0.entries.1758]
text = [
  "The love for your Pokémon that permeates\\n",
  "every cell of your body. I accept it!$",
]

[msg.section_0.entries.1759]
text = [
  "Why don't you prove to me how much you\\n",
  "and your Pokémon are capable of!\\c$",
]

[msg.section_0.entries.1760]
text = [
  "You are capable of far more than we are!\\n",
  "That has certainly been proven!$",
]

[msg.section_0.entries.1761]
text = [
  "There actually wasn't any need to prove\\n",
  "how strong we are.\\c\\n",
  "I already know how capable my Pokémon\\n",
  "and I are!$",
]

[msg.section_0.entries.1762]
text = [
  "I'll use my psychic powers to release my\\n",
  "Pokémon from its Poké Ball!\\c$",
]

[msg.section_0.entries.1763]
text = [
  "Well, that didn't go the way I wanted it to!$",
]

[msg.section_0.entries.1764]
text = [
  "I hear that Caitlin of the Elite Four is\\n",
  "an amazing Psychic.\\l\\n",
  "I'd sure love to face her head-on...$",
]

[msg.section_0.entries.1765]
text = [
  "You... Who's brought you this far?\\c$",
]

[msg.section_0.entries.1766]
text = [
  "It's your reliable Pokémon who brought you\\n",
  "this far, isn't it?$",
]

[msg.section_0.entries.1767]
text = [
  "You know what I think? All people know\\n",
  "what they can do alone, but...\\c\\n",
  "There are a lot of things you can only do\\n",
  "with Pokémon, too!$",
]

[msg.section_0.entries.1768]
text = [
  "You are no ordinary opponent...\\c\\n",
  "That is what my Ghost-type Pokémon is\\n",
  "whispering to me.\\c$",
]

[msg.section_0.entries.1769]
text = [
  "My premonition was spot on!\\n",
  "I knew you were no ordinary opponent!$",
]

[msg.section_0.entries.1770]
text = [
  "Could it be that you and your Pokémon\\n",
  "are the ones emitting that strong aura?!$",
]

[msg.section_0.entries.1771]
text = [
  "It's not enough for me just to be\\n",
  "together with Pokémon!\\c\\n",
  "I want to win!\\c$",
]

[msg.section_0.entries.1772]
text = [
  "Ugh! How... How...\\n",
  "How could you defeat me this utterly?!$",
]

[msg.section_0.entries.1773]
text = [
  "It's not enough for me just to be\\n",
  "together with Pokémon! I want to win!\\c\\n",
  "But I do know that some people feel at\\n",
  "ease just by being with their Pokémon...$",
]

[msg.section_0.entries.1774]
text = [
  "Our unity won't be bested by anyone!\\c$",
]

[msg.section_0.entries.1775]
text = [
  "We couldn't win...\\n",
  "But that's all right.$",
]

[msg.section_0.entries.1776]
text = [
  "My Pokémon was once stolen by\\n",
  "Team Plasma.\\c\\n",
  "I'm just so grateful that we can be\\n",
  "together like this now.$",
]

[msg.section_0.entries.1777]
text = [
  "Wait!\\n",
  "You, young Trainer over there!\\c\\n",
  "Look at my Pokémon.\\c$",
]

[msg.section_0.entries.1778]
text = [
  "Not bad!\\n",
  "I like your strength.$",
]

[msg.section_0.entries.1779]
text = [
  "I'd love to brag about my Pokémon, but it\\n",
  "would take too long, so I'll resist!$",
]

[msg.section_0.entries.1780]
text = [
  "I am a Doctor!\\c\\n",
  "If you have Pokémon in bad shape...\\n",
  "Let me see your Pokémon in battle!\\c$",
]

[msg.section_0.entries.1781]
text = [
  "Your strength is fathomless!\\n",
  "I am deeply impressed.$",
]

[msg.section_0.entries.1782]
text = [
  "Whether your Pokémon are healthy\\n",
  "or not, I'll restore them to full health!\\c$",
]

[msg.section_0.entries.1783]
text = [
  "I aim to be the best Doctor in the world!\\c\\n",
  "But my first step will be to become the\\n",
  "best Doctor in Unova.$",
]

[msg.section_0.entries.1784]
text = [
  "Behold the blinding brilliance of my many\\n",
  "Gym Badges!\\c$",
]

[msg.section_0.entries.1785]
text = [
  "Your skill is too brilliant to behold!\\n",
  "It's so bright that I can't see anything!$",
]

[msg.section_0.entries.1786]
text = [
  "That Badge you have there...\\c\\n",
  "No, it is your skill and the Pokémon with\\n",
  "you that are so brilliantly shining!$",
]

[msg.section_0.entries.1787]
text = [
  "Something about you reminds me of that\\n",
  "Trainer from two years ago...\\c$",
]

[msg.section_0.entries.1788]
text = [
  "Yes, that mix of kindness and power is just\\n",
  "like that Trainer!$",
]

[msg.section_0.entries.1789]
text = [
  "I wonder where that Trainer is now...$",
]

[msg.section_0.entries.1790]
text = [
  "The people who pass by here\\n",
  "have such different moods!\\c\\n",
  "It's fun to watch, and even more fun\\n",
  "to fight against them!\\c$",
]

[msg.section_0.entries.1791]
text = [
  "Mwa haha!\\n",
  "It's fun!$",
]

[msg.section_0.entries.1792]
text = [
  "Your Pokémon was in a really good mood\\n",
  "the moment that you won!$",
]

[msg.section_0.entries.1793]
text = [
  "Are you sure? I'm strong, you know.\\n",
  "You still want to take me on?\\c$",
]

[msg.section_0.entries.1794]
text = [
  "Yes, I'm sure... I'm weak, you know.\\n",
  "Why did you want to take me on?$",
]

[msg.section_0.entries.1795]
text = [
  "Not wanting to admit my own limits,\\n",
  "I am continuing to battle on...\\l\\n",
  "That's right! At least I'm persistent!$",
]

[msg.section_0.entries.1796]
text = [
  "Are you sure you want to seriously take\\n",
  "on someone like me, who seriously fights\\l\\n",
  "with her Pokémon?\\c$",
]

[msg.section_0.entries.1797]
text = [
  "This is the pain that comes from seriously\\n",
  "facing someone head-on...$",
]

[msg.section_0.entries.1798]
text = [
  "I battle seriously, because I am after\\n",
  "serious strength.\\c\\n",
  "There's nothing worse than a\\n",
  "halfhearted opponent.$",
]

[msg.section_0.entries.1799]
text = [
  "All right! You look like an opponent who\\n",
  "will really highlight my weaknesses!\\c$",
]

[msg.section_0.entries.1800]
text = [
  "Now I see my faults clearly! If I can work\\n",
  "on them, I'll be even stronger!$",
]

[msg.section_0.entries.1801]
text = [
  "Accept your own weaknesses. That\\n",
  "is the first step to getting stronger.$",
]

[msg.section_0.entries.1802]
text = [
  "All I want are powerful Pokémon!\\c$",
]

[msg.section_0.entries.1803]
text = [
  "I can't comprehend this!\\n",
  "How could my partner lose?!$",
]

[msg.section_0.entries.1804]
text = [
  "All I want are powerful Pokémon!\\c\\n",
  "Only a Pokémon that understands that\\n",
  "can become one of my partners!$",
]

[msg.section_0.entries.1805]
text = [
  "Life is all about overcoming hurdles!\\n",
  "Could you be a hurdle for me?\\c$",
]

[msg.section_0.entries.1806]
text = [
  "I couldn't overcome the hurdle you\\n",
  "presented to me...$",
]

[msg.section_0.entries.1807]
text = [
  "If you can't overcome a hurdle, you can\\n",
  "always just go around it.\\c\\n",
  "Head up here, and you'll find the\\n",
  "greatest hurdle for Trainers:\\l\\n",
  "the Pokémon League.$",
]

[msg.section_0.entries.1808]
text = [
  "One, you are a Pokémon Trainer.\\n",
  "Two, I am an Ace Trainer.\\c\\n",
  "Put them together, and it's obvious that\\n",
  "we are going to battle!\\c$",
]

[msg.section_0.entries.1809]
text = [
  "One, you won!\\n",
  "Two, I lost...$",
]

[msg.section_0.entries.1810]
text = [
  "One, I'm strong.\\n",
  "Two, you're stronger.\\c\\n",
  "Put them together, and you are clearly\\n",
  "a stronger Pokémon Trainer than I am!$",
]

[msg.section_0.entries.1811]
text = [
  "I want to show how much I love Pokémon\\n",
  "by winning!\\c$",
]

[msg.section_0.entries.1812]
text = [
  "I can't show my love for Pokémon if I go\\n",
  "and lose!$",
]

[msg.section_0.entries.1813]
text = [
  "I-I can't express my gratitude toward\\n",
  "my Pokémon except by winning.\\c\\n",
  "What should I do?$",
]

[msg.section_0.entries.1814]
text = [
  "The endless cycle of wins and losses...\\n",
  "Will it always continue?\\c$",
]

[msg.section_0.entries.1815]
text = [
  "Every win and loss is a precious memory.$",
]

[msg.section_0.entries.1816]
text = [
  "Fighting together with a young kid like\\n",
  "you makes me feel young again myself.$",
]

[msg.section_0.entries.1817]
text = [
  "I'm gonna numb you and your Pokémon!\\c$",
]

[msg.section_0.entries.1818]
text = [
  "Unbelievable!\\n",
  "I was the one struck numb...?$",
]

[msg.section_0.entries.1819]
text = [
  "This is the best thing for when you're\\n",
  "really numb.\\c$",
]

[msg.section_0.entries.1820]
text = [
  "A fighting style overflowing with power or\\n",
  "a strategy that excels technically...\\l\\n",
  "It depends on the Pokémon, see!$",
]

[msg.section_0.entries.1821]
text = [
  "A heated battle is good, but get too hot\\n",
  "and you might end up getting burned!\\c$",
]

[msg.section_0.entries.1822]
text = [
  "Amazing...\\n",
  "I think I got a bit singed.$",
]

[msg.section_0.entries.1823]
text = [
  "If you get burned, be sure to use this!\\c$",
]

[msg.section_0.entries.1824]
text = [
  "Burning competitiveness and cool logic...\\c\\n",
  "You'll need both if you're going to go\\n",
  "up against the Pokémon League.$",
]

[msg.section_0.entries.1825]
text = [
  "I just felt a great wind...\\n",
  "Are you the one who kicked it up?\\c$",
]

[msg.section_0.entries.1826]
text = [
  "This defeat will also be blown far away...$",
]

[msg.section_0.entries.1827]
text = [
  "You are the wind.\\c\\n",
  "A supple and comforting wind blowing\\n",
  "through Victory Road!$",
]

[msg.section_0.entries.1828]
text = [
  "I am...\\c\\n",
  "Ex-Team Plasma!\\c$",
]

[msg.section_0.entries.1829]
text = [
  "Eek! You are like that Trainer from two\\n",
  "years ago!$",
]

[msg.section_0.entries.1830]
text = [
  "There are some people who don't love\\n",
  "Pokémon even if they're strong.\\c\\n",
  "And there are some people who love even\\n",
  "the weakest Pokémon.$",
]

[msg.section_0.entries.1831]
text = [
  "You bothered to come all the way here?\\c\\n",
  "Good! I will reward your hard work by\\n",
  "battling with all of my strength!\\c$",
]

[msg.section_0.entries.1832]
text = [
  "A battle with a good Trainer fills my heart\\n",
  "with warmth.$",
]

[msg.section_0.entries.1833]
text = [
  "The fact that you made it out here...\\c\\n",
  "That's it! It must have been thanks to a\\n",
  "Pokémon carrying you with a hidden move!$",
]

[msg.section_0.entries.1834]
text = [
  "Hey, since you worked so hard to get\\n",
  "here, how about I be your opponent?\\c$",
]

[msg.section_0.entries.1835]
text = [
  "Thanks a bunch.\\n",
  "It was a lot of fun!$",
]

[msg.section_0.entries.1836]
text = [
  "My Pokémon lets me ride on its back as\\n",
  "it uses Surf or Waterfall.\\l\\n",
  "I really feel its love at those times!$",
]

[msg.section_0.entries.1837]
text = [
  "This Pokémon battle... It will forever\\n",
  "commemorate my visit to Castelia City!$",
]

[msg.section_0.entries.1838]
text = [
  "This Pokémon battle... It will forever\\n",
  "commemorate my visit to Castelia City!$",
]

[msg.section_0.entries.1839]
text = [
  "This Pokémon battle... It will forever\\n",
  "commemorate my visit to Castelia City!$",
]

[msg.section_0.entries.1840]
text = [
  "This Pokémon battle... It will forever\\n",
  "commemorate my visit to Castelia City!$",
]

[msg.section_0.entries.1841]
text = [
  "This Pokémon battle... It will forever\\n",
  "commemorate my visit to Castelia City!$",
]

[msg.section_0.entries.1842]
text = [
  "I hate to admit it, but...\\n",
  "You're a good Trainer.$",
]

[msg.section_0.entries.1843]
text = [
  "Have you gotten even stronger than you\\n",
  "were in Lacunosa Town?\\l\\n",
  "How, in such a brief amount of time...$",
]

[msg.section_0.entries.1844]
text = [
  "You little...\\n",
  "You knocked out my stupid pawns!$",
]

[msg.section_0.entries.1845]
text = [
  "Even if I lose, I will not give up on justice\\n",
  "for Team Plasma! That's all!$",
]

[msg.section_0.entries.1846]
text = [
  "Argh! Lame! Stupid! Fool! Plasmaaaa!$",
]

[msg.section_0.entries.1847]
text = [
  "The pain of my Pokémon...\\n",
  "I feel it, too!$",
]

[msg.section_0.entries.1848]
text = [
  "I'll hone my mind and become one with\\n",
  "my Pokémon!$",
]

[msg.section_0.entries.1849]
text = [
  "No! Not yet!\\n",
  "No! We can fight on!!$",
]

[msg.section_0.entries.1850]
text = [
  "Aghhhh...\\n",
  "I did my best, but we lost...$",
]

[msg.section_0.entries.1851]
text = [
  "Why was I so conceited as to think I could\\n",
  "show you anything?$",
]

[msg.section_0.entries.1852]
text = [
  "Roll, roll, roll, roll, roll, roll, roll on!\\n",
  "Roller coaster!$",
]

[msg.section_0.entries.1853]
text = [
  "What!\\n",
  "My victory was taken away from me!$",
]

[msg.section_0.entries.1854]
text = [
  "As a Doctor, I will be examining your\\n",
  "Pokémon's strength!\\c$",
]

[msg.section_0.entries.1855]
text = [
  "Oh! What's this?\\n",
  "It is the very picture of health!$",
]

[msg.section_0.entries.1856]
text = [
  "Before you go, let me give your Pokémon\\n",
  "a little booster shot!\\c$",
]

[msg.section_0.entries.1857]
text = [
  "Feel free to drop by anytime your\\n",
  "Pokémon need a little TLC!$",
]

[msg.section_0.entries.1858]
text = [
  "I'll battle Pokémon even if I can't find\\n",
  "a pulse!\\c$",
]

[msg.section_0.entries.1859]
text = [
  "It wasn't just a pulse I couldn't find...\\n",
  "I couldn't get the prize either...$",
]

[msg.section_0.entries.1860]
text = [
  "I may have lost the prize, but I'll still\\n",
  "make your Pokémon healthy and hearty!\\c$",
]

[msg.section_0.entries.1861]
text = [
  "To make people healthy,\\n",
  "Doctors go where they are needed.$",
]

[msg.section_0.entries.1862]
text = [
  "You need a Nurse's help?\\c\\n",
  "Sure, if you can win against me,\\n",
  "I'll make your Pokémon healthy!\\c$",
]

[msg.section_0.entries.1863]
text = [
  "Come on!\\n",
  "Your team is really healthy!$",
]

[msg.section_0.entries.1864]
text = [
  "OK! Then...\\n",
  "Time to give your Pokémon some energy!\\c$",
]

[msg.section_0.entries.1865]
text = [
  "Making Pokémon feel better--that's what\\n",
  "I am here for!$",
]

[msg.section_0.entries.1866]
text = [
  "People with a strong life force look so\\n",
  "vibrant and alive!\\c$",
]

[msg.section_0.entries.1867]
text = [
  "Your life force is positively blinding!\\n",
  "Ugh! What is this?!$",
]

[msg.section_0.entries.1868]
text = [
  "All right, here I go!\\n",
  "Life force to the max!\\c$",
]

[msg.section_0.entries.1869]
text = [
  "You guys push your life force to the max!\\n",
  "Just keep on pushing boundaries!$",
]

[msg.section_0.entries.1870]
text = [
  "I'm wandering the world trying to find a\\n",
  "place where I belong...\\l\\n",
  "How about you?\\c$",
]

[msg.section_0.entries.1871]
text = [
  "I lost...\\n",
  "So this isn't where I belong either...$",
]

[msg.section_0.entries.1872]
text = [
  "You don't just find your place in\\n",
  "the world. You've got to make it!$",
]

[msg.section_0.entries.1873]
text = [
  "If you want to know what I've got in my\\n",
  "backpack, why don't you try to beat me!\\c$",
]

[msg.section_0.entries.1874]
text = [
  "Whoaaa!\\n",
  "I'm going to be buried!$",
]

[msg.section_0.entries.1875]
text = [
  "My backpack is full of sand from\\n",
  "the desert.\\c\\n",
  "It's my job to dig out Relic Castle before\\n",
  "it gets completely buried!$",
]

[msg.section_0.entries.1876]
text = [
  "A desert is like one giant sandbox, right?\\n",
  "So come on, let's let our Pokémon play!\\c$",
]

[msg.section_0.entries.1877]
text = [
  "Since this is for play, whoever has the most\\n",
  "fun is the winner!$",
]

[msg.section_0.entries.1878]
text = [
  "How about I just make a huge sandcastle\\n",
  "in the place of that old Relic Castle\\l\\n",
  "that's getting buried?$",
]

[msg.section_0.entries.1879]
text = [
  "No matter how desperately I try to scoop\\n",
  "up the sand, it flows through my fingers.\\l\\n",
  "It's kind of sad somehow...\\c$",
]

[msg.section_0.entries.1880]
text = [
  "Victory slips away...\\n",
  "Yes, just like the sand...$",
]

[msg.section_0.entries.1881]
text = [
  "These words are meant for you...\\c\\n",
  "Be careful, but never be afraid of\\n",
  "the journey.$",
]

[msg.section_0.entries.1882]
text = [
  "I will show you the harshness\\n",
  "of the desert through a battle!\\c$",
]

[msg.section_0.entries.1883]
text = [
  "Desert...hot... Mouth...dry... Grfrrrfl...$",
]

[msg.section_0.entries.1884]
text = [
  "Be careful of burns!\\c$",
]

[msg.section_0.entries.1885]
text = [
  "If a Pokémon gets a burn,\\n",
  "it also weakens physical attacks.\\l\\n",
  "This works quite well!$",
]

[msg.section_0.entries.1886]
text = [
  "Scorching desert!\\n",
  "A passion for adventure!\\l\\n",
  "And a heated battle!\\c$",
]

[msg.section_0.entries.1887]
text = [
  "Hot! Hot! Hot! Hot!!$",
]

[msg.section_0.entries.1888]
text = [
  "Speed is crucial\\n",
  "to treat a burn!\\c$",
]

[msg.section_0.entries.1889]
text = [
  "Whether it is hot or cold,\\n",
  "there is no problem if you have passion!$",
]

[msg.section_0.entries.1890]
text = [
  "I will use my supernatural powers to\\n",
  "help my Pokémon!\\c$",
]

[msg.section_0.entries.1891]
text = [
  "Wow! That's amazing!$",
]

[msg.section_0.entries.1892]
text = [
  "Drawing out your Pokémon's power\\n",
  "like that...\\c\\n",
  "I think that is a real\\n",
  "supernatural power.$",
]

[msg.section_0.entries.1893]
text = [
  "Hrmm... You're strong, aren't you?\\c\\n",
  "It's kind of tough when you know that\\n",
  "before you even start to fight.\\c$",
]

[msg.section_0.entries.1894]
text = [
  "Urk! It's almost as if I didn't have ESP...\\n",
  "I can't do anything against you.$",
]

[msg.section_0.entries.1895]
text = [
  "I like to play tag with my Pokémon\\n",
  "when they use Teleport.$",
]

[msg.section_0.entries.1896]
text = [
  "I am a Trainer before I'm a Nurse!\\c\\n",
  "I am itching for a Pokémon battle!\\c$",
]

[msg.section_0.entries.1897]
text = [
  "I was so itchy that I couldn't\\n",
  "fight properly!$",
]

[msg.section_0.entries.1898]
text = [
  "OK, let's get you all fixed up!\\n",
  "Just leave it up to me!\\c$",
]

[msg.section_0.entries.1899]
text = [
  "Be careful of sandstorms as you explore\\n",
  "the Desert Resort!$",
]

[msg.section_0.entries.1900]
text = [
  "My great loves in life are...\\n",
  "Mountains! Food! Pokémon!\\l\\n",
  "But food deserves to go in there twice!\\c$",
]

[msg.section_0.entries.1901]
text = [
  "Oh, ho ho!\\n",
  "You got me!$",
]

[msg.section_0.entries.1902]
text = [
  "When you pick the simplest-looking path,\\n",
  "it often turns out to be a dead end.$",
]

[msg.section_0.entries.1903]
text = [
  "I'm chasing my dream,\\n",
  "and I'm fighting for a victory!\\c$",
]

[msg.section_0.entries.1904]
text = [
  "I can't catch that dream!$",
]

[msg.section_0.entries.1905]
text = [
  "There was once a legendary Pokémon\\n",
  "hidden away in this cave.\\c\\n",
  "What do you think it felt?\\n",
  "What do you think it was hoping for?$",
]

[msg.section_0.entries.1906]
text = [
  "If there is a steep cave in the east,\\n",
  "I go there and train my Pokémon, and\\l\\n",
  "if there is a strong Trainer in the west,\\l\\n",
  "I go there and challenge that Trainer!\\c$",
]

[msg.section_0.entries.1907]
text = [
  "My Pokémon clearly lack\\n",
  "proper training!!$",
]

[msg.section_0.entries.1908]
text = [
  "Pokémon training Pokémon...\\c\\n",
  "If they live in rugged wilderness,\\n",
  "that can happen naturally.$",
]

[msg.section_0.entries.1909]
text = [
  "Wait a sec!\\c\\n",
  "Let me grip my Poké Ball a little\\n",
  "bit tighter.\\c\\n",
  "...Yeah, like that! Now I'm good!\\c$",
]

[msg.section_0.entries.1910]
text = [
  "Squeeze!$",
]

[msg.section_0.entries.1911]
text = [
  "If you hold your Poké Ball tight when\\n",
  "you're feeling unsure, your Pokémon will\\l\\n",
  "cheer you on!\\l\\n",
  "That's why I'm OK!$",
]

[msg.section_0.entries.1912]
text = [
  "I will unveil my Pokémon to you!\\n",
  "They are the best in the world!\\c$",
]

[msg.section_0.entries.1913]
text = [
  "Your Pokémon are also cute,\\n",
  "but my Pokémon are charming!$",
]

[msg.section_0.entries.1914]
text = [
  "Listen. My love for my Pokémon\\n",
  "is the best in the world.\\l\\n",
  "Nobody can beat it.$",
]

[msg.section_0.entries.1915]
text = [
  "I'm planning on transferring a Pokémon\\n",
  "using Poké Transfer.\\l\\n",
  "But before I do...\\c$",
]

[msg.section_0.entries.1916]
text = [
  "Phew... I should have just transferred\\n",
  "my Pokémon after all, huh?$",
]

[msg.section_0.entries.1917]
text = [
  "To meet your Pokémon beyond the\\n",
  "constraints of time and distance...\\c\\n",
  "The desire to meet like that has sure led\\n",
  "to some amazing inventions, huh?$",
]

[msg.section_0.entries.1918]
text = [
  "Huh? Your Pokémon...\\n",
  "They escaped from Poké Transfer?!\\c$",
]

[msg.section_0.entries.1919]
text = [
  "Sooorry!\\n",
  "I took you for someone else!$",
]

[msg.section_0.entries.1920]
text = [
  "The Poké Transfer is an amazing device\\n",
  "that allows you to transport Pokémon.$",
]

[msg.section_0.entries.1921]
text = [
  "When you embark on a journey, you\\n",
  "discover many joys...\\l\\n",
  "What will I discover fighting you?\\c$",
]

[msg.section_0.entries.1922]
text = [
  "The joy of victory and sorrow of defeat--\\n",
  "both gone in an instant...$",
]

[msg.section_0.entries.1923]
text = [
  "I learned this lesson when I got to the\\n",
  "end of my journey.\\c\\n",
  "Joy can be fleeting.\\n",
  "But true happiness never ends...\\l\\n",
  "Just as your Pokémon will never leave.$",
]

[msg.section_0.entries.1924]
text = [
  "I've got lots of items in my backpack!\\n",
  "I'll use them well to secure victory!\\c$",
]

[msg.section_0.entries.1925]
text = [
  "When you have too many moves and items, you\\n",
  "can actually end up a bit overwhelmed...$",
]

[msg.section_0.entries.1926]
text = [
  "If you're overwhelmed, throw 'em away!\\n",
  "You don't want to be weighed down when\\l\\n",
  "you're traveling.\\l\\n",
  "All you really need is your Pokémon.$",
]

[msg.section_0.entries.1927]
text = [
  "Hi, hi! Trainer!\\c\\n",
  "I will let you see\\n",
  "what kind of Pokémon I have!\\c$",
]

[msg.section_0.entries.1928]
text = [
  "Oooh, quit bugging me!$",
]

[msg.section_0.entries.1929]
text = [
  "I'll bring out all the great sides of Bug-\\n",
  "type Pokémon for everyone to see...\\l\\n",
  "I'm gonna be just like Burgh someday!$",
]

[msg.section_0.entries.1930]
text = [
  "Hi, hi! Trainer!\\c\\n",
  "Please show me what kinds of Pokémon\\n",
  "you are training!\\c$",
]

[msg.section_0.entries.1931]
text = [
  "Great, great! I didn't know\\n",
  "that way to raise Pokémon!$",
]

[msg.section_0.entries.1932]
text = [
  "When you let a Pokémon evolve, it will be\\n",
  "stronger, but if you don't let it evolve,\\l\\n",
  "it will learn moves quicker.$",
]

[msg.section_0.entries.1933]
text = [
  "Hey, Trainer! Let's have a refreshing\\n",
  "battle and blow away all my troubles!\\c$",
]

[msg.section_0.entries.1934]
text = [
  "You guys...\\n",
  "You feel like an unbeatable combination.$",
]

[msg.section_0.entries.1935]
text = [
  "I've been thinking lately.\\c\\n",
  "Even if I were somehow separated from my\\n",
  "Pokémon, would they choose me as their\\l\\n",
  "Trainer again...?$",
]

[msg.section_0.entries.1936]
text = [
  "Oh my! My Pokémon really seem raring\\n",
  "to go today!\\c\\n",
  "So I guess that means I'll be asking you\\n",
  "for a battle!\\c$",
]

[msg.section_0.entries.1937]
text = [
  "It seems my Pokémon weren't\\n",
  "as ready as I thought!$",
]

[msg.section_0.entries.1938]
text = [
  "Pokémon are alive, just like you or me, so\\n",
  "it's no wonder that they might feel down.\\l\\n",
  "When that happens, just let them take\\l\\n",
  "it easy.$",
]

[msg.section_0.entries.1939]
text = [
  "I trained and trained like a madman,\\n",
  "and my Pokémon trained even more!\\c$",
]

[msg.section_0.entries.1940]
text = [
  "Yeah! Yeah!\\n",
  "Even though I lost, I'm energetic!$",
]

[msg.section_0.entries.1941]
text = [
  "My Fighting-type Pokémon!\\n",
  "I train it to smash the challenge rock!$",
]

[msg.section_0.entries.1942]
text = [
  "I test the challenge rock\\n",
  "with my fist every day!\\c\\n",
  "It is important to make steady progress,\\n",
  "little by little.\\c$",
]

[msg.section_0.entries.1943]
text = [
  "I still have not\\n",
  "tried hard enough!$",
]

[msg.section_0.entries.1944]
text = [
  "I test the challenge rock every day\\n",
  "with my Pokémon!\\c\\n",
  "Why don't you check out\\n",
  "the challenge rock\\l\\n",
  "with a Fighting-type Pokémon?$",
]

[msg.section_0.entries.1945]
text = [
  "I'm the one who patrols Pinwheel Forest\\n",
  "from one end to the other!\\l\\n",
  "A battle here is a piece of cake!\\c$",
]

[msg.section_0.entries.1946]
text = [
  "What a huge mistake to lose\\n",
  "a battle in Pinwheel Forest!$",
]

[msg.section_0.entries.1947]
text = [
  "A Ranger always has one of these.\\n",
  "I'll give it to you!\\c$",
]

[msg.section_0.entries.1948]
text = [
  "The forest is alive...\\c\\n",
  "Something changes every day,\\n",
  "so it's fun to patrol!$",
]

[msg.section_0.entries.1949]
text = [
  "Melding into the wild landscape...\\n",
  "That's what a Pokémon Ranger does!\\c$",
]

[msg.section_0.entries.1950]
text = [
  "I am such a weakling!\\n",
  "I will disappear back into the wilderness!$",
]

[msg.section_0.entries.1951]
text = [
  "I'm sure you can fully\\n",
  "utilize this.\\c$",
]

[msg.section_0.entries.1952]
text = [
  "If you blend into the wilderness too well,\\n",
  "you won't be noticed by Pokémon,\\l\\n",
  "let alone by people.$",
]

[msg.section_0.entries.1953]
text = [
  "Haaah... Whoooosh...\\n",
  "Haaah... Whoooosh...\\c\\n",
  "OK! After deep-breathing exercises\\n",
  "comes the time for a Pokémon battle!\\c$",
]

[msg.section_0.entries.1954]
text = [
  "All that I can do now is sigh in sorrow...$",
]

[msg.section_0.entries.1955]
text = [
  "But I can also do this!\\c$",
]

[msg.section_0.entries.1956]
text = [
  "Different Pokémon can be found\\n",
  "in different places.\\c\\n",
  "Does that mean there is\\n",
  "a perfect place for everyone?$",
]

[msg.section_0.entries.1957]
text = [
  "Get great powers drawn from nature\\n",
  "without opposing it.\\l\\n",
  "That is the strength of Rangers!\\c$",
]

[msg.section_0.entries.1958]
text = [
  "What great power!\\n",
  "Your Pokémon are marvelous!$",
]

[msg.section_0.entries.1959]
text = [
  "This is one of the powers\\n",
  "I got from nature.\\c$",
]

[msg.section_0.entries.1960]
text = [
  "Pokémon are just too amazing, so we\\n",
  "end up depending on them for everything.\\l\\n",
  "Great power can be dangerous.$",
]

[msg.section_0.entries.1961]
text = [
  "I came here because this place feels\\n",
  "quite nostalgic to me...\\c\\n",
  "But now I'd rather battle with you than\\n",
  "stroll down memory lane!\\c$",
]

[msg.section_0.entries.1962]
text = [
  "I see... So that's it.\\n",
  "I used to also be that focused long ago.$",
]

[msg.section_0.entries.1963]
text = [
  "I am reminded of my childhood and chasing\\n",
  "innocently after Bug-type Pokémon...\\c\\n",
  "It was that day, in this very place, that\\n",
  "I started on the path to “Trainerhood.\\\"$",
]

[msg.section_0.entries.1964]
text = [
  "Let me show you the Pokémon that I\\n",
  "met by fate!\\c$",
]

[msg.section_0.entries.1965]
text = [
  "The Pokémon that you've met are quite\\n",
  "formidable, aren't they?$",
]

[msg.section_0.entries.1966]
text = [
  "Young kids sure have it good.\\n",
  "They get to meet all kinds of Pokémon!$",
]

[msg.section_0.entries.1967]
text = [
  "Shorts and Pokémon!\\n",
  "This is the ultimate combination!\\c$",
]

[msg.section_0.entries.1968]
text = [
  "It's not my Pokémon's fault!\\n",
  "It's not my shorts' fault either!$",
]

[msg.section_0.entries.1969]
text = [
  "I'm wearing shorts to help toughen up\\n",
  "my kneecaps! Do you want to feel them?$",
]

[msg.section_0.entries.1970]
text = [
  "My Pokémon's strong points!\\n",
  "You'll see them if you fight!\\c$",
]

[msg.section_0.entries.1971]
text = [
  "Hey! Did you see\\n",
  "my Pokémon's strong points?!$",
]

[msg.section_0.entries.1972]
text = [
  "My Pokémon's strong points?\\c\\n",
  "Hmmm...\\c\\n",
  "I don't know, 'cause there are too many!$",
]

[msg.section_0.entries.1973]
text = [
  "You...are a rather adult-looking kid...\\n",
  "A kiddish adult... Oh, jeez!\\l\\n",
  "I'll just find out when we battle!\\c$",
]

[msg.section_0.entries.1974]
text = [
  "You are a childish and adult and altogether\\n",
  "mysterious Trainer!$",
]

[msg.section_0.entries.1975]
text = [
  "A precocious child or a childish adult...\\c\\n",
  "Both can be hard to deal with, but both\\n",
  "are also cute in their way!$",
]

[msg.section_0.entries.1976]
text = [
  "The forest is full of little hollows and\\n",
  "hillocks, and walking in it is so fun!\\c\\n",
  "And you know, having Pokémon battles is\\n",
  "even more fun!\\c$",
]

[msg.section_0.entries.1977]
text = [
  "Your Pokémon are soooo cool!$",
]

[msg.section_0.entries.1978]
text = [
  "I want to ride through the forest on a\\n",
  "Pokémon!$",
]

[msg.section_0.entries.1979]
text = [
  "Oh! And I just heard a Pokémon, too!\\n",
  "Oh, boo...\\c$",
]

[msg.section_0.entries.1980]
text = [
  "Your Pokémon seemed kinda happy, Trainer!$",
]

[msg.section_0.entries.1981]
text = [
  "There are Pokémon hiding beyond\\n",
  "those bushes!$",
]

[msg.section_0.entries.1982]
text = [
  "Instead of a Dragon-type Pokémon, I've\\n",
  "found myself a spectacular Trainer!\\c$",
]

[msg.section_0.entries.1983]
text = [
  "You were spectacular and, more than that,\\n",
  "so strong!$",
]

[msg.section_0.entries.1984]
text = [
  "I'm going to like Dragon-type Pokémon\\n",
  "because I want to talk to Drayden!$",
]

[msg.section_0.entries.1985]
text = [
  "We're best friends!\\n",
  "Our Pokémon are best friends, too!\\c$",
]

[msg.section_0.entries.1986]
text = [
  "Ally: Even if we lose...\\c\\n",
  "Amy: ...We'll still be best friends!$",
]

[msg.section_0.entries.1987]
text = [
  "We're gonna be best friends forever and\\n",
  "ever, right?$",
]

[msg.section_0.entries.1988]
text = [
  "Bring two Pokémon here, OK?\\n",
  "Pretty, pretty please!$",
]

[msg.section_0.entries.1989]
text = [
  "Our Pokémon are best friends, too!\\c$",
]

[msg.section_0.entries.1990]
text = [
  "We play with two Pokémon!\\n",
  "It just won't work with one!$",
]

[msg.section_0.entries.1991]
text = [
  "After all, the two of us are like\\n",
  "one person!$",
]

[msg.section_0.entries.1992]
text = [
  "We feel filled with power when we're\\n",
  "surrounded by our beloved stone!\\c$",
]

[msg.section_0.entries.1993]
text = [
  "Oh stones!\\n",
  "This can't be stooone!$",
]

[msg.section_0.entries.1994]
text = [
  "I'm not the only one who gets excited by\\n",
  "all this stone--my Pokémon do, too!$",
]

[msg.section_0.entries.1995]
text = [
  "Oh! Trainer!\\n",
  "Do you want to learn a bitter lesson?\\c$",
]

[msg.section_0.entries.1996]
text = [
  "Training complete!\\n",
  "I think I may've improved a bit.$",
]

[msg.section_0.entries.1997]
text = [
  "No need to rush!\\c\\n",
  "I'm just a normal person, so there's no\\n",
  "way I can become the best all at once!$",
]

[msg.section_0.entries.1998]
text = [
  "...Are you sure you want someone like me?\\n",
  "One moping around in a place like this?\\c$",
]

[msg.section_0.entries.1999]
text = [
  "If only he was also as strong as you are...$",
]

[msg.section_0.entries.2000]
text = [
  "When you like someone, you try to show\\n",
  "them your good points, don't you?\\c\\n",
  "Well, I went and thoroughly beat the guy\\n",
  "that I liked in a Pokémon battle...$",
]

[msg.section_0.entries.2001]
text = [
  "I've overcome my fear of Pokémon!\\c$",
]

[msg.section_0.entries.2002]
text = [
  "Mm-hmm! You really love Pokémon, don't you?$",
]

[msg.section_0.entries.2003]
text = [
  "There are people who are afraid of\\n",
  "Pokémon, too.\\l\\n",
  "Though everyone seems to forget that.$",
]

[msg.section_0.entries.2004]
text = [
  "Just three more people!\\c\\n",
  "I won't leave this spot till I win against\\n",
  "three more people!\\c$",
]

[msg.section_0.entries.2005]
text = [
  "Whoa!\\n",
  "Your Pokémon were amazing!!$",
]

[msg.section_0.entries.2006]
text = [
  "Heh! If beating an opponent is also a kind\\n",
  "of strength then...\\c\\n",
  "I guess sticking to something you've\\n",
  "decided to do is also a kind of strength!$",
]

[msg.section_0.entries.2007]
text = [
  "These Pokémon were born\\n",
  "on the same day and raised together!\\c$",
]

[msg.section_0.entries.2008]
text = [
  "Oh!\\n",
  "You're pretty good!$",
]

[msg.section_0.entries.2009]
text = [
  "Our days with Pokémon\\n",
  "are full of happiness, and\\l\\n",
  "our joys will grow as we live together!$",
]

[msg.section_0.entries.2010]
text = [
  "...So what.$",
]

[msg.section_0.entries.2011]
text = [
  "I'm just a shadow, after all...$",
]

[msg.section_0.entries.2012]
text = [
  "How disappointing...$",
]

[msg.section_0.entries.2013]
text = [
  "Plasmaaaa!\\n",
  "I lost! This is awful!$",
]

[msg.section_0.entries.2014]
text = [
  "I may look like a regular Clerk ⑮, but\\n",
  "in fact I am a glamorous female spy!\\l\\n",
  "Can you feel it? How strong I am?\\c$",
]

[msg.section_0.entries.2015]
text = [
  "Oh! This spy has failed her mission!$",
]

[msg.section_0.entries.2016]
text = [
  "I am investigating the new CEO as part of\\n",
  "my work as a female spy.\\l\\n",
  "I'll find out what he's hiding!\\c\\n",
  "But he couldn't really be a child,\\n",
  "could he? That's just ridiculous!$",
]

[msg.section_0.entries.2017]
text = [
  "I've got to reach my quota.\\n",
  "That's why I'm challenging you.\\c$",
]

[msg.section_0.entries.2018]
text = [
  "Ohhh... I lost, but I've also come up with\\n",
  "a brilliant proposal!$",
]

[msg.section_0.entries.2019]
text = [
  "As part of the Battle Company, we office\\n",
  "workers have to complete many Pokémon\\l\\n",
  "battles and fulfill our quotas!$",
]

[msg.section_0.entries.2020]
text = [
  "I saw that move coming from miles away!$",
]

[msg.section_0.entries.2021]
text = [
  "We will put everything on the line for this\\n",
  "move! Right, partner?!$",
]

[msg.section_0.entries.2022]
text = [

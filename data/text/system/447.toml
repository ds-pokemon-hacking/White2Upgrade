[msg]
trailing_data = "b0b0"

[msg.section_0.entries.0]
text = [
  "$",
]

[msg.section_0.entries.1]
text = [
  "Dopo la nascita, cresce traendo\\n",
  "nutrimento dal seme piantato\\n",
  "sul suo dorso.$",
]

[msg.section_0.entries.2]
text = [
  "Quando il bocciolo che ha sul dorso\\n",
  "si gonfia, emana un dolce profumo.\\n",
  "È indice dell'imminente fioritura.$",
]

[msg.section_0.entries.3]
text = [
  "Dopo la pioggia, il fiore sul suo dorso\\n",
  "emana un profumo più intenso e attira\\n",
  "gli altri Pokémon.$",
]

[msg.section_0.entries.4]
text = [
  "La fiamma sulla punta della coda indica\\n",
  "la sua vitalità. Se sta bene, la fiamma\\n",
  "è più ardente.$",
]

[msg.section_0.entries.5]
text = [
  "Sui monti rocciosi, sua dimora, la coda\\n",
  "di Charmeleon brilla come una stella\\n",
  "nella notte.$",
]

[msg.section_0.entries.6]
text = [
  "Pare che la temperatura della fiamma\\n",
  "di Charizard aumenti dopo che ha\\n",
  "affrontato dure lotte.$",
]

[msg.section_0.entries.7]
text = [
  "Si ritira nel suo guscio e, alla prima\\n",
  "occasione, contrattacca colpendo\\n",
  "il nemico con spruzzi d'acqua.$",
]

[msg.section_0.entries.8]
text = [
  "Pare che viva 10.000 anni. Ha la coda\\n",
  "ricoperta da una folta pelliccia, indice\\n",
  "di longevità.$",
]

[msg.section_0.entries.9]
text = [
  "I getti d'acqua lanciati dai cannoni sul\\n",
  "suo guscio riescono a perforare\\n",
  "persino l'acciaio.$",
]

[msg.section_0.entries.10]
text = [
  "Dalle antenne rosse emana un puzzo che\\n",
  "respinge il nemico. Cresce cambiando\\n",
  "più volte la pelle.$",
]

[msg.section_0.entries.11]
text = [
  "Ha una corazza dura come l'acciaio che\\n",
  "protegge il suo fragile corpo. Attende\\n",
  "immobile di evolversi.$",
]

[msg.section_0.entries.12]
text = [
  "Adora il nettare dei fiori e riesce a\\n",
  "localizzare i campi in cui si trova\\n",
  "anche una minima quantità di polline.$",
]

[msg.section_0.entries.13]
text = [
  "Divora ogni giorno una quantità di foglie\\n",
  "pari al suo peso. Respinge i nemici con\\n",
  "l'aculeo sulla testa.$",
]

[msg.section_0.entries.14]
text = [
  "Si nasconde dai predatori dietro le foglie\\n",
  "e fra i rami, in attesa dell'evoluzione.$",
]

[msg.section_0.entries.15]
text = [
  "Vola intorno al nemico ad alta velocità,\\n",
  "attacca con i pungiglioni avvelenati e\\n",
  "si allontana rapido.$",
]

[msg.section_0.entries.16]
text = [
  "È docile e preferisce evitare i conflitti.\\n",
  "Ma se viene disturbato, contrattacca\\n",
  "ferocemente.$",
]

[msg.section_0.entries.17]
text = [
  "Sorvola il suo ampio territorio a caccia\\n",
  "di prede, afferrandole con i suoi artigli\\n",
  "affilati.$",
]

[msg.section_0.entries.18]
text = [
  "Sbattendo le ali a più non posso, Pidgeot\\n",
  "crea un vento tanto forte da piegare\\n",
  "alberi possenti.$",
]

[msg.section_0.entries.19]
text = [
  "Un'incredibile vitalità gli permette di\\n",
  "adattarsi a qualsiasi tipo di habitat.\\n",
  "È estremamente cauto.$",
]

[msg.section_0.entries.20]
text = [
  "Si affila le zanne in perenne crescita\\n",
  "rosicchiando cose dure. Riesce a\\n",
  "frantumare persino i muri.$",
]

[msg.section_0.entries.21]
text = [
  "Sbatte con foga le sue alette per\\n",
  "sollevarsi in volo. Cerca le prede\\n",
  "beccando nell'erba.$",
]

[msg.section_0.entries.22]
text = [
  "Le sue ampie ali robuste gli permettono\\n",
  "di volare tutto il giorno. Combatte\\n",
  "usando il becco aguzzo.$",
]

[msg.section_0.entries.23]
text = [
  "Striscia nell'erba senza fare il minimo\\n",
  "rumore e colpisce alle spalle le prede\\n",
  "ignare del pericolo.$",
]

[msg.section_0.entries.24]
text = [
  "Prima paralizza i nemici con il\\n",
  "terrificante disegno che ha sul\\n",
  "ventre, poi gli si avvinghia intorno.$",
]

[msg.section_0.entries.25]
text = [
  "Di tanto in tanto ricarica gli altri\\n",
  "Pikachu indeboliti usando una\\n",
  "scarica elettrica.$",
]

[msg.section_0.entries.26]
text = [
  "La sua coda scarica elettricità a terra,\\n",
  "proteggendolo dalle scosse elettriche.$",
]

[msg.section_0.entries.27]
text = [
  "Vive in zone aride con precipitazioni\\n",
  "minime. Si arrotola come se fosse\\n",
  "una palla per difendersi dai nemici.$",
]

[msg.section_0.entries.28]
text = [
  "Si arrotola come una palla e rotola sul\\n",
  "dorso verso i nemici. Gli aculei aguzzi\\n",
  "provocano gravi danni.$",
]

[msg.section_0.entries.29]
text = [
  "Non ama combattere, ma anche una\\n",
  "sola goccia del veleno che secerne\\n",
  "dagli aculei può essere fatale.$",
]

[msg.section_0.entries.30]
text = [
  "Quando avverte il pericolo, rizza\\n",
  "gli aculei, che fuoriescono più\\n",
  "lentamente di quelli di Nidorino.$",
]

[msg.section_0.entries.31]
text = [
  "Una robusta armatura ricopre l'intero\\n",
  "corpo. Protegge i propri cuccioli a\\n",
  "costo della vita.$",
]

[msg.section_0.entries.32]
text = [
  "Esamina l'ambiente circostante tendendo\\n",
  "le orecchie fuori dall'erba. Si protegge\\n",
  "con il corno velenoso.$",
]

[msg.section_0.entries.33]
text = [
  "Ha un temperamento violento e infilza\\n",
  "i nemici con il corno, che, all'impatto,\\n",
  "rilascia veleno.$",
]

[msg.section_0.entries.34]
text = [
  "Con un solo colpo della potente coda\\n",
  "può abbattere un palo del telefono\\n",
  "come se fosse un fiammifero.$",
]

[msg.section_0.entries.35]
text = [
  "Si dice che vedere un gruppo di Clefairy\\n",
  "ballare con la luna piena sia di ottimo\\n",
  "auspicio.$",
]

[msg.section_0.entries.36]
text = [
  "È molto timido e non ama mostrarsi.\\n",
  "È dotato di un udito acutissimo.$",
]

[msg.section_0.entries.37]
text = [
  "Controlla palle infuocate. Via via che\\n",
  "cresce, dalle sue sei code se ne\\n",
  "generano delle altre.$",
]

[msg.section_0.entries.38]
text = [
  "Si dice che le sue nove code posseggano\\n",
  "un potere magico. Vive anche 1000 anni.$",
]

[msg.section_0.entries.39]
text = [
  "Muove le pupille e comincia a cantare\\n",
  "una ninnananna che fa addormentare\\n",
  "chiunque l'ascolti.$",
]

[msg.section_0.entries.40]
text = [
  "Il suo pelo è morbidissimo. Riesce a\\n",
  "gonfiarsi e a ingrandirsi semplicemente\\n",
  "inalando aria.$",
]

[msg.section_0.entries.41]
text = [
  "Rileva la sua posizione e sonda l'area\\n",
  "circostante con le onde ultrasoniche\\n",
  "che emette dalla bocca.$",
]

[msg.section_0.entries.42]
text = [
  "I suoi denti affilati penetrano anche\\n",
  "le pelli più dure e hanno dei fori\\n",
  "per succhiare il sangue.$",
]

[msg.section_0.entries.43]
text = [
  "Durante il giorno, pianta i piedi per\\n",
  "terra come se fossero radici. Di notte\\n",
  "cammina seminando.$",
]

[msg.section_0.entries.44]
text = [
  "Il fluido che fuoriesce dalla sua bocca\\n",
  "è così puzzolente che si sente anche\\n",
  "a 2 km di distanza.$",
]

[msg.section_0.entries.45]
text = [
  "I suoi petali sono i più grandi al mondo.\\n",
  "Mentre cammina diffonde un polline che\\n",
  "causa allergie.$",
]

[msg.section_0.entries.46]
text = [
  "Ha sul dorso dei funghi chiamati\\n",
  "tochukaso, che crescono insieme\\n",
  "al Paras su cui si trovano.$",
]

[msg.section_0.entries.47]
text = [
  "Parasect è controllato da un fungo\\n",
  "ancora più grosso del suo corpo.\\n",
  "Diffonde spore velenose.$",
]

[msg.section_0.entries.48]
text = [
  "I suoi grandi occhi sono in realtà\\n",
  "un insieme di tanti piccoli occhi.\\n",
  "Di notte, è attirato dalla luce.$",
]

[msg.section_0.entries.49]
text = [
  "Sbattendo le ali sparge una polvere\\n",
  "velenosa a contatto con la pelle.$",
]

[msg.section_0.entries.50]
text = [
  "Un Pokémon che vive sottoterra.\\n",
  "Poiché è abituato a vivere al buio,\\n",
  "non sopporta la luce solare.$",
]

[msg.section_0.entries.51]
text = [
  "Le sue tre teste si muovono a turno\\n",
  "per scavare nel duro suolo fino ad\\n",
  "una profondità di 100 km.$",
]

[msg.section_0.entries.52]
text = [
  "È un Pokémon attivo di notte. Se nota\\n",
  "qualcosa di luccicante, i suoi occhi\\n",
  "cominciano a brillare.$",
]

[msg.section_0.entries.53]
text = [
  "Un Pokémon molto altezzoso. I fan\\n",
  "parlano spesso delle dimensioni del\\n",
  "gioiello che ha sulla testa.$",
]

[msg.section_0.entries.54]
text = [
  "Turbato dalle sue abilità enigmatiche,\\n",
  "soffre di una costante emicrania.\\n",
  "A volte usa poteri misteriosi.$",
]

[msg.section_0.entries.55]
text = [
  "Grazie alle sue poderose zampe palmate,\\n",
  "nuota velocemente e con eleganza.$",
]

[msg.section_0.entries.56]
text = [
  "Vive in colonie sugli alberi. Se uno\\n",
  "si adira, l'intera colonia comincia a\\n",
  "agire violentemente senza motivo.$",
]

[msg.section_0.entries.57]
text = [
  "Se lo guardi fisso negli occhi, si adira.\\n",
  "Se corri, s'infuria. Se poi lo sconfiggi,\\n",
  "s'arrabbia ancor di più.$",
]

[msg.section_0.entries.58]
text = [
  "Un Pokémon fedele per natura. Rimane\\n",
  "immobile finché non riceve ordini dal\\n",
  "suo Allenatore.$",
]

[msg.section_0.entries.59]
text = [
  "Con il suo aspetto fiero ed elegante, è\\n",
  "riuscito da tempo a conquistare il cuore\\n",
  "della gente.$",
]

[msg.section_0.entries.60]
text = [
  "La sua pelle è così sottile che si\\n",
  "intravedono gli organi. Cammina a\\n",
  "fatica sulle zampe poco sviluppate.$",
]

[msg.section_0.entries.61]
text = [
  "Il disegno spiraliforme sulla pancia\\n",
  "ondeggia leggermente. Chi lo fissa,\\n",
  "piano piano si assopisce.$",
]

[msg.section_0.entries.62]
text = [
  "Ha dei muscoli tanto sviluppati da\\n",
  "riuscire ad attraversare a nuoto\\n",
  "l'Oceano Pacifico senza fermarsi.$",
]

[msg.section_0.entries.63]
text = [
  "L'utilizzo dei suoi poteri psichici è così\\n",
  "stancante da costringerlo a dormire\\n",
  "18 ore al giorno.$",
]

[msg.section_0.entries.64]
text = [
  "Fissa il suo cucchiaio d'argento per\\n",
  "concentrarsi. Così facendo, emette\\n",
  "più onde alfa.$",
]

[msg.section_0.entries.65]
text = [
  "Si dice che abbia creato i cucchiai\\n",
  "che tiene in mano grazie ai suoi\\n",
  "poteri psichici.$",
]

[msg.section_0.entries.66]
text = [
  "Nonostante sia piccolo, riesce a\\n",
  "sollevare e lanciare più Geodude\\n",
  "contemporaneamente.$",
]

[msg.section_0.entries.67]
text = [
  "Sposta di buon grado carichi pesanti\\n",
  "per rinforzarsi e gli piace dare\\n",
  "una mano alle persone.$",
]

[msg.section_0.entries.68]
text = [
  "Grazie alle sue quattro muscolose\\n",
  "braccia tira pugni e colpi a una\\n",
  "velocità impressionante.$",
]

[msg.section_0.entries.69]
text = [
  "Preferisce gli habitat caldi e umidi.\\n",
  "Cattura velocemente le prede\\n",
  "con i suoi rampicanti.$",
]

[msg.section_0.entries.70]
text = [
  "Questo Pokémon sembra una pianta.\\n",
  "Cattura le prede con una polvere\\n",
  "tossica.$",
]

[msg.section_0.entries.71]
text = [
  "Tiene in bocca un liquido dall'aroma\\n",
  "simile al miele, che in realtà è un\\n",
  "acido altamente corrosivo.$",
]

[msg.section_0.entries.72]
text = [
  "Dato che il suo corpo è quasi\\n",
  "interamente composto d'acqua,\\n",
  "se si arena si avvizzisce subito.$",
]

[msg.section_0.entries.73]
text = [
  "Estende i suoi 80 tentacoli per creare\\n",
  "una rete velenosa da cui è difficilissimo\\n",
  "liberarsi.$",
]

[msg.section_0.entries.74]
text = [
  "Quando riposa sembra un sasso. Se viene\\n",
  "calpestato, si infuria e agita i pugni.$",
]

[msg.section_0.entries.75]
text = [
  "Si sposta rotolando per i sentieri di\\n",
  "montagna. Quando prende velocità,\\n",
  "è quasi impossibile fermarlo.$",
]

[msg.section_0.entries.76]
text = [
  "Muta il guscio solo una volta all'anno.\\n",
  "Neanche la dinamite può scalfire il suo\\n",
  "corpo durissimo.$",
]

[msg.section_0.entries.77]
text = [
  "Alla nascita non riesce quasi a reggersi\\n",
  "in piedi. Galoppando si rinforza e diventa\\n",
  "più veloce.$",
]

[msg.section_0.entries.78]
text = [
  "Quando galoppa, la sua criniera ardente\\n",
  "brilla, rendendo il suo aspetto ancora\\n",
  "più straordinario.$",
]

[msg.section_0.entries.79]
text = [
  "Anche se è lento, è abile a pescare con\\n",
  "la coda. Non avverte alcun dolore se\\n",
  "gliela mordono.$",
]

[msg.section_0.entries.80]
text = [
  "Non è molto perspicace, ma sembra\\n",
  "aguzzare l'ingegno se lo Shellder\\n",
  "che ha sulla coda lo morde.$",
]

[msg.section_0.entries.81]
text = [
  "Gli elementi laterali, ruotando,\\n",
  "generano forza magnetica, che\\n",
  "cresce all'aumentare della velocità.$",
]

[msg.section_0.entries.82]
text = [
  "Ne compaiono molti quando ci sono più\\n",
  "macchie solari. Creano interferenze con\\n",
  "i televisori.$",
]

[msg.section_0.entries.83]
text = [
  "Non può vivere senza lo stelo che tiene\\n",
  "con un'ala. Lo difende dagli attacchi a\\n",
  "costo della vita.$",
]

[msg.section_0.entries.84]
text = [
  "I suoi due cervelli si comunicano\\n",
  "le emozioni grazie ai poteri telepatici.$",
]

[msg.section_0.entries.85]
text = [
  "Quando Doduo si evolve in questo strano\\n",
  "essere, una delle due teste si divide a\\n",
  "metà. Corre a 60 km/h.$",
]

[msg.section_0.entries.86]
text = [
  "Pokémon che vive sugli iceberg.\\n",
  "Nuota spaccando il ghiaccio con\\n",
  "la punta che ha sulla testa.$",
]

[msg.section_0.entries.87]
text = [
  "Ha il corpo ricoperto da una pelliccia\\n",
  "bianca che, sulla neve, lo rende meno\\n",
  "visibile ai predatori.$",
]

[msg.section_0.entries.88]
text = [
  "Nacque quando il fango di un fiume sudicio\\n",
  "fu esposto ai raggi X della luna. Vive\\n",
  "nella sporcizia.$",
]

[msg.section_0.entries.89]
text = [
  "Dal suo corpo filtra un fluido tossico\\n",
  "che uccide all'istante piante e alberi\\n",
  "con cui viene a contatto.$",
]

[msg.section_0.entries.90]
text = [
  "Nuota all'indietro aprendo e chiudendo\\n",
  "le due valve. La lingua è sempre fuori\\n",
  "a penzoloni.$",
]

[msg.section_0.entries.91]
text = [
  "Quando lotta si protegge tenendo\\n",
  "la conchiglia chiusa e spara punte\\n",
  "per respingere i nemici.$",
]

[msg.section_0.entries.92]
text = [
  "Generato da sostanze gassose, fa\\n",
  "perdere i sensi a chiunque respiri\\n",
  "i gas tossici di cui è costituito.$",
]

[msg.section_0.entries.93]
text = [
  "Adora tendere agguati in luoghi bui.\\n",
  "Il suo tocco causa brividi incontenibili.$",
]

[msg.section_0.entries.94]
text = [
  "Si aggira nel buio con lo sguardo perfido\\n",
  "e si diverte a lanciare maledizioni.$",
]

[msg.section_0.entries.95]
text = [
  "Si muove sottoterra a una velocità di\\n",
  "80 km/h nutrendosi di grossi massi.$",
]

[msg.section_0.entries.96]
text = [
  "Riesce ad indovinare cosa sognano\\n",
  "le persone annusandole con il suo\\n",
  "grande naso. Ama i sogni divertenti.$",
]

[msg.section_0.entries.97]
text = [
  "Con il suo pendolo fa addormentare\\n",
  "chiunque nel giro di tre secondi,\\n",
  "anche chi si è appena svegliato.$",
]

[msg.section_0.entries.98]
text = [
  "Vive in buche scavate sulle spiagge\\n",
  "sabbiose. Le sue chele ricrescono\\n",
  "se si spezzano nella lotta.$",
]

[msg.section_0.entries.99]
text = [
  "La chela più grande ha una potenza\\n",
  "di 10.000 cavalli, ma è così pesante\\n",
  "che non permette di mirare bene.$",
]

[msg.section_0.entries.100]
text = [
  "Sembra una Poké Ball. Toccandolo si\\n",
  "rischia di prendere la scossa e di\\n",
  "farlo esplodere.$",
]

[msg.section_0.entries.101]
text = [
  "Quando ha accumulato elettricità fino\\n",
  "quasi a scoppiare, si fa trasportare\\n",
  "dal vento.$",
]

[msg.section_0.entries.102]
text = [
  "Queste sei uova comunicano per\\n",
  "telepatia. Si riuniscono subito\\n",
  "anche se vengono divise.$",
]

[msg.section_0.entries.103]
text = [
  "Noto come “Giungla in moto\\\". Se\\n",
  "una testa diventa troppo grande,\\n",
  "cade e si trasforma in Exeggcute.$",
]

[msg.section_0.entries.104]
text = [
  "Piange pensando alla madre defunta e\\n",
  "dal teschio che ha in testa proviene\\n",
  "un rumore sordo e continuo.$",
]

[msg.section_0.entries.105]
text = [
  "Pokémon selvatico che tiene in mano\\n",
  "un osso sin dalla nascita. Lo usa\\n",
  "abilmente come arma.$",
]

[msg.section_0.entries.106]
text = [
  "I suoi arti inferiori si allungano del\\n",
  "doppio, il che sbalordisce i nemici\\n",
  "che lo vedono per la prima volta.$",
]

[msg.section_0.entries.107]
text = [
  "Sferra pugni così potenti da\\n",
  "polverizzare persino il cemento.\\n",
  "Si riposa dopo tre minuti di lotta.$",
]

[msg.section_0.entries.108]
text = [
  "Quando estende la sua lingua, lunga\\n",
  "quasi due metri, gli trema la coda.\\n",
  "È possibile che siano collegate.$",
]

[msg.section_0.entries.109]
text = [
  "Fluttua a mezz'aria grazie ai gas che ha\\n",
  "in corpo. Questi sono maleodoranti e\\n",
  "altamente esplosivi.$",
]

[msg.section_0.entries.110]
text = [
  "Cresce nutrendosi dei gas emanati\\n",
  "dai rifiuti. Anche se rarissimi, ne\\n",
  "hanno trovati in gruppi di tre.$",
]

[msg.section_0.entries.111]
text = [
  "Con i suoi potenti attacchi distrugge\\n",
  "qualsiasi cosa. Non è abbastanza\\n",
  "sagace da aiutare le persone.$",
]

[msg.section_0.entries.112]
text = [
  "Alzandosi sulle zampe posteriori, è\\n",
  "diventato più sagace. Tuttavia, è\\n",
  "molto smemorato.$",
]

[msg.section_0.entries.113]
text = [
  "Un Pokémon altruista che depone uova\\n",
  "molto nutrienti. Le condivide con\\n",
  "persone o Pokémon feriti.$",
]

[msg.section_0.entries.114]
text = [
  "Le liane blu che nascondono il suo\\n",
  "corpo sono rivestite di peli sottili.\\n",
  "Si dice che soffra il solletico.$",
]

[msg.section_0.entries.115]
text = [
  "Tiene il cucciolo nel marsupio che ha\\n",
  "sulla pancia e lo lascia uscire solo\\n",
  "quando non ci sono pericoli.$",
]

[msg.section_0.entries.116]
text = [
  "Crea la sua tana all'ombra dei coralli.\\n",
  "Se avverte un pericolo, spruzza\\n",
  "inchiostro nero e fugge.$",
]

[msg.section_0.entries.117]
text = [
  "Si difende con gli aculei. Pinne\\n",
  "e ossa sono comunemente usati\\n",
  "nella medicina tradizionale.$",
]

[msg.section_0.entries.118]
text = [
  "Anche se è molto elegante quando nuota\\n",
  "a pinne spiegate, può infliggere colpi\\n",
  "potenti con il suo corno.$",
]

[msg.section_0.entries.119]
text = [
  "In autunno, il suo corpo si ingrossa\\n",
  "in previsione della stagione degli\\n",
  "amori e assume colori sgargianti.$",
]

[msg.section_0.entries.120]
text = [
  "Se il corpo è lacerato, si rigenera\\n",
  "se il nucleo rosso è ancora intatto.\\n",
  "Il nucleo brilla a mezzanotte.$",
]

[msg.section_0.entries.121]
text = [
  "Al centro del corpo ha un nucleo\\n",
  "rosso che diffonde misteriosi\\n",
  "segnali radio nel cielo notturno.$",
]

[msg.section_0.entries.122]
text = [
  "Crea un muro invisibile a mezz'aria\\n",
  "facendo vibrare la punta delle dita\\n",
  "per bloccare le molecole.$",
]

[msg.section_0.entries.123]
text = [
  "Le falci sulle sue zampe anteriori\\n",
  "diventano sempre più affilate man\\n",
  "mano che tranciano oggetti duri.$",
]

[msg.section_0.entries.124]
text = [
  "Le sue grida ricordano il linguaggio\\n",
  "umano, ma è impossibile capire\\n",
  "il significato delle sue parole.$",
]

[msg.section_0.entries.125]
text = [
  "Fa roteare le braccia per potenziare\\n",
  "un po' i suoi pugni. A volte i nemici\\n",
  "ne approfittano per fuggire.$",
]

[msg.section_0.entries.126]
text = [
  "Le ondate di calore che emette\\n",
  "quando respira profondamente\\n",
  "offuscano la visuale.$",
]

[msg.section_0.entries.127]
text = [
  "Afferra la preda con le pinze e non\\n",
  "la molla finché non l'ha tranciata.\\n",
  "Se non ci riesce, la scaglia via.$",
]

[msg.section_0.entries.128]
text = [
  "Dopo aver puntato il nemico, lo\\n",
  "carica a testa bassa.\\n",
  "È noto per la sua indole violenta.$",
]

[msg.section_0.entries.129]
text = [
  "Un Magikarp di una certa età può\\n",
  "saltare una montagna con Splash,\\n",
  "che però è una mossa inutile.$",
]

[msg.section_0.entries.130]
text = [
  "Quando va su tutte le furie,\\n",
  "Gyarados brucia ogni cosa, anche\\n",
  "nel mezzo di un violento temporale.$",
]

[msg.section_0.entries.131]
text = [
  "Ama attraversare il mare con persone\\n",
  "e Pokémon sul suo dorso.\\n",
  "Capisce il linguaggio umano.$",
]

[msg.section_0.entries.132]
text = [
  "Ha la capacità di modificare la sua\\n",
  "struttura cellulare per trasformarsi\\n",
  "in qualsiasi cosa veda.$",
]

[msg.section_0.entries.133]
text = [
  "È dotato di un corredo genetico\\n",
  "instabile e, per cause diverse, può\\n",
  "assumere altre forme rapidamente.$",
]

[msg.section_0.entries.134]
text = [
  "La sua composizione cellulare è simile\\n",
  "a quella delle molecole d'acqua e si può\\n",
  "sciogliere in essa.$",
]

[msg.section_0.entries.135]
text = [
  "Quando si agita, usa l'elettricità\\n",
  "per rizzare i peli e scagliarli in\\n",
  "piccoli nugoli.$",
]

[msg.section_0.entries.136]
text = [
  "La sacca ardente dentro il suo\\n",
  "corpo infiamma l'aria che respira,\\n",
  "che supera i 1650°C.$",
]

[msg.section_0.entries.137]
text = [
  "Un Pokémon creato dall'uomo con\\n",
  "metodi scientifici avanzatissimi. Si\\n",
  "muove liberamente nel ciberspazio.$",
]

[msg.section_0.entries.138]
text = [
  "Pokémon rigenerato da un fossile\\n",
  "grazie alla scienza moderna.\\n",
  "Nuotava nei mari ancestrali.$",
]

[msg.section_0.entries.139]
text = [
  "Si pensa che questo Pokémon si\\n",
  "sia estinto perché la sua conchiglia\\n",
  "a spirale è cresciuta troppo.$",
]

[msg.section_0.entries.140]
text = [
  "Si ritiene che vivesse sulle spiagge\\n",
  "300 milioni di anni fa. È protetto da\\n",
  "una conchiglia robusta.$",
]

[msg.section_0.entries.141]
text = [
  "Pokémon probabilmente giunto sulla\\n",
  "terraferma perché le sue prede si\\n",
  "erano adattate a vivere lì.$",
]

[msg.section_0.entries.142]
text = [
  "Un Pokémon che vagava nei cieli\\n",
  "nell'era dei dinosauri. Le sue zanne\\n",
  "sono affilate come lame.$",
]

[msg.section_0.entries.143]
text = [
  "Quando ha la pancia piena diventa\\n",
  "troppo pigro per muoversi e si può\\n",
  "saltargli sopra senza pericolo.$",
]

[msg.section_0.entries.144]
text = [
  "Un Pokémon uccello leggendario.\\n",
  "Riesce a creare bufere di neve\\n",
  "congelando l'umidità dell'aria.$",
]

[msg.section_0.entries.145]
text = [
  "Un Pokémon uccello leggendario.\\n",
  "Si dice che viva tra le nubi\\n",
  "temporalesche. Controlla i fulmini.$",
]

[msg.section_0.entries.146]
text = [
  "Un Pokémon uccello leggendario.\\n",
  "Si dice che la sua apparizione preannunci\\n",
  "l'arrivo della primavera.$",
]

[msg.section_0.entries.147]
text = [
  "Detto “Pokémon miraggio\\\" perché\\n",
  "è stato avvistato da pochi. È facile\\n",
  "trovare la sua pelle della muta.$",
]

[msg.section_0.entries.148]
text = [
  "Se il suo corpo emana un'aura, il tempo\\n",
  "cambia all'istante. Si dice che viva nei\\n",
  "mari e nei laghi.$",
]

[msg.section_0.entries.149]
text = [
  "Si dice che faccia la sua tana da qualche\\n",
  "parte nel mare. Porta a riva le vittime di\\n",
  "naufragi.$",
]

[msg.section_0.entries.150]
text = [
  "Un Pokémon creato usando i geni di Mew.\\n",
  "Si dice che fra i Pokémon sia quello con\\n",
  "l'animo più crudele.$",
]

[msg.section_0.entries.151]
text = [
  "Poiché sa usare qualsiasi mossa, molti\\n",
  "scienziati ritengono che Mew sia\\n",
  "l'antenato di tutti i Pokémon.$",
]

[msg.section_0.entries.152]
text = [
  "Usa la foglia sulla sua testa per\\n",
  "misurare la temperatura e l'umidità.\\n",
  "Ama crogiolarsi al sole.$",
]

[msg.section_0.entries.153]
text = [
  "Le foglie attorno al suo collo emanano\\n",
  "un aroma speziato dall'effetto\\n",
  "energizzante.$",
]

[msg.section_0.entries.154]
text = [
  "Il suo respiro ha lo straordinario\\n",
  "potere di far tornare rigogliosi piante\\n",
  "secche e fiori avvizziti.$",
]

[msg.section_0.entries.155]
text = [
  "È riservato per natura. Se viene\\n",
  "spaventato, le fiamme sul suo dorso\\n",
  "bruciano ardentemente.$",
]

[msg.section_0.entries.156]
text = [
  "Intimorisce i nemici con il calore delle\\n",
  "sue fiamme. Se è pronto a lottare,\\n",
  "le vampate sono più ardenti.$",
]

[msg.section_0.entries.157]
text = [
  "Attacca usando fiamme esplosive. Si cela\\n",
  "in una scintillante nube di calore creata\\n",
  "dalle fiamme roventi.$",
]

[msg.section_0.entries.158]
text = [
  "Ha l'abitudine di mordere ogni cosa con\\n",
  "le potenti mandibole. Neppure il suo\\n",
  "Allenatore è al sicuro!$",
]

[msg.section_0.entries.159]
text = [
  "Quando azzanna il nemico, non molla\\n",
  "la presa finché non gli cadono le zanne,\\n",
  "che però ricrescono subito.$",
]

[msg.section_0.entries.160]
text = [
  "Di solito si muove lentamente, ma quando\\n",
  "attacca e morde la preda si muove ad una\\n",
  "velocità incredibile.$",
]

[msg.section_0.entries.161]
text = [
  "Ha un'indole alquanto nervosa. Sta ritto\\n",
  "sulla punta della coda per riuscire a\\n",
  "sorvegliare ampie aree.$",
]

[msg.section_0.entries.162]
text = [
  "Si addormenta avvolto nell'esile corpo\\n",
  "della madre. Mette all'angolo i nemici\\n",
  "con movimenti rapidi.$",
]

[msg.section_0.entries.163]
text = [
  "Segna il tempo con precisione. In alcuni\\n",
  "paesi è considerato un amico saggio ed\\n",
  "esperto del mondo.$",
]

[msg.section_0.entries.164]
text = [
  "Ha una vista acutissima, che gli permette\\n",
  "di vedere anche nel buio più profondo e\\n",
  "con la luce più fioca.$",
]

[msg.section_0.entries.165]
text = [
  "È tanto timido da non muoversi se non è\\n",
  "in gruppo. Trasmette le sue emozioni\\n",
  "emanando una fragranza.$",
]

[msg.section_0.entries.166]
text = [
  "La luce delle stelle è la sua fonte\\n",
  "d'energia. Un cielo più stellato fa\\n",
  "ingrandire i disegni sul suo dorso.$",
]

[msg.section_0.entries.167]
text = [
  "Tesse una trappola con un filo di seta,\\n",
  "sottile ma robusto. Attende la preda\\n",
  "senza muoversi.$",
]

[msg.section_0.entries.168]
text = [
  "Aggancia la preda con un filo di seta\\n",
  "e la lascia andare. Poi segue il filo e\\n",
  "la trova quando è in gruppo.$",
]

[msg.section_0.entries.169]
text = [
  "La trasformazione delle sue zampe in ali\\n",
  "lo ha reso più leggiadro in volo ma più\\n",
  "goffo a terra.$",
]

[msg.section_0.entries.170]
text = [
  "Dalle antenne emette scariche elettriche\\n",
  "positive e negative con le quali colpisce\\n",
  "i nemici.$",
]

[msg.section_0.entries.171]
text = [
  "La sua luce è visibile anche quando si\\n",
  "trova in profondità. È soprannominato\\n",
  "“Stella degli abissi\\\".$",
]

[msg.section_0.entries.172]
text = [
  "Le sacche elettriche sulle sue guance\\n",
  "sono piccole. Se fuoriesce elettricità,\\n",
  "resta fulminato.$",
]

[msg.section_0.entries.173]
text = [
  "È facile avvistarlo nelle notti con tante\\n",
  "stelle cadenti. Si dice che arrivi\\n",
  "cavalcandone una.$",
]

[msg.section_0.entries.174]
text = [
  "Ha un corpo morbido ed elastico. Quando\\n",
  "comincia a saltellare è praticamente\\n",
  "impossibile fermarlo.$",
]

[msg.section_0.entries.175]
text = [
  "Trasforma la gentilezza e la gioia degli\\n",
  "altri in felicità, che immagazzina nel\\n",
  "suo guscio.$",
]

[msg.section_0.entries.176]
text = [
  "Vola intorno al mondo in cerca di persone\\n",
  "buone e premurose con le quali\\n",
  "condividere la sua felicità.$",
]

[msg.section_0.entries.177]
text = [
  "Raccoglie cibo dai cactus, evitando\\n",
  "agilmente germogli e spine. Si muove\\n",
  "saltellando.$",
]

[msg.section_0.entries.178]
text = [
  "Pokémon enigmatico che vede il passato\\n",
  "e prevede il futuro osservando il sole\\n",
  "tutto il giorno.$",
]

[msg.section_0.entries.179]
text = [
  "Se il manto è carico d'elettricità, le sue\\n",
  "dimensioni raddoppiano e può dare\\n",
  "la scossa.$",
]

[msg.section_0.entries.180]
text = [
  "Se il suo manto è del tutto carico\\n",
  "d'elettricità, la coda s'illumina.\\n",
  "Lancia peli che danno la scossa.$",
]

[msg.section_0.entries.181]
text = [
  "La punta della sua coda brilla. In\\n",
  "passato, le persone si inviavano\\n",
  "segnali usando la luce della coda.$",
]

[msg.section_0.entries.182]
text = [
  "Quando finisce la stagione delle piogge,\\n",
  "lo si vede danzare sotto i caldi raggi del\\n",
  "sole.$",
]

[msg.section_0.entries.183]
text = [
  "La punta oleosa della coda galleggia\\n",
  "e fa sì che Marill non affondi anche\\n",
  "in mezzo a correnti insidiose.$",
]

[msg.section_0.entries.184]
text = [
  "Può rimanere a lungo in acqua poiché è\\n",
  "in grado di inalare e immagazzinare molta\\n",
  "aria.$",
]

[msg.section_0.entries.185]
text = [
  "Evita gli attacchi nemici rimanendo\\n",
  "immobile e camuffandosi da albero.\\n",
  "Odia l'acqua e rifugge la pioggia.$",
]

[msg.section_0.entries.186]
text = [
  "Ama radunare gruppi e atteggiarsi\\n",
  "a capogruppo.\\n",
  "I suoi versi richiamano Poliwag.$",
]

[msg.section_0.entries.187]
text = [
  "Giunge sospinto dai venti. Si dice che\\n",
  "quando Hoppip appare su campi e monti,\\n",
  "la primavera sia in arrivo.$",
]

[msg.section_0.entries.188]
text = [
  "Il suo fiore sboccia appena l'aria\\n",
  "si riscalda. Fluttua nel cielo per\\n",
  "assorbire l'energia solare.$",
]

[msg.section_0.entries.189]
text = [
  "Sospinto dai venti stagionali, gira\\n",
  "intorno al globo sparpagliando i\\n",
  "suoi semi simili al cotone.$",
]

[msg.section_0.entries.190]
text = [
  "Vive sulla cima degli alberi. Con la coda\\n",
  "può fare di tutto, come se fosse una\\n",
  "mano.$",
]

[msg.section_0.entries.191]
text = [
  "Cade improvvisamente giù dal cielo\\n",
  "al mattino. Dopo un'estate fredda,\\n",
  "la popolazione di Sunkern esplode.$",
]

[msg.section_0.entries.192]
text = [
  "Trae energia dalla luce del sole e\\n",
  "si muove di continuo per cercare\\n",
  "di assorbirne sempre di più.$",
]

[msg.section_0.entries.193]
text = [
  "Può fermarsi a mezz'aria sbattendo\\n",
  "velocemente le ali. Vola di qua e di\\n",
  "là per difendere il suo territorio.$",
]

[msg.section_0.entries.194]
text = [
  "Quando si avventura sulla terraferma,\\n",
  "ricopre il suo corpo di una sostanza\\n",
  "velenosa che lo idrata.$",
]

[msg.section_0.entries.195]
text = [
  "È molto tranquillo per natura. Non\\n",
  "si scompone se nuotando sbatte\\n",
  "la testa contro barche e scogli.$",
]

[msg.section_0.entries.196]
text = [
  "Con il pelo sensibile riesce ad analizzare\\n",
  "le correnti d'aria e a prevedere\\n",
  "le condizioni atmosferiche.$",
]

[msg.section_0.entries.197]
text = [
  "Quando è esposto alla luce lunare\\n",
  "i cerchi sul suo corpo brillano e\\n",
  "acquisisce uno strano potere.$",
]

[msg.section_0.entries.198]
text = [
  "Se individuato, cerca di farsi\\n",
  "inseguire, per poi far perdere le\\n",
  "sue tracce su sentieri di montagna.$",
]

[msg.section_0.entries.199]
text = [
  "Il morso di Shellder gli ha infuso\\n",
  "un'intelligenza pari a quella di\\n",
  "rinomati scienziati.$",
]

[msg.section_0.entries.200]
text = [
  "Un Pokémon che terrorizza la gente nel\\n",
  "cuore della notte. Assorbe la paura per\\n",
  "usarla come energia.$",
]

[msg.section_0.entries.201]
text = [
  "Un solo esemplare non produce alcun\\n",
  "effetto, ma se ce ne sono due o più,\\n",
  "emerge uno strano potere.$",
]

[msg.section_0.entries.202]
text = [
  "Cerca di tenere nascosta la sua coda\\n",
  "nera ad ogni costo. Pare che essa celi\\n",
  "un segreto.$",
]

[msg.section_0.entries.203]
text = [
  "Sulla coda ha una testa con un piccolo\\n",
  "cervello. Riesce a lottare anche se\\n",
  "il nemico è alle sue spalle.$",
]

[msg.section_0.entries.204]
text = [
  "Ha l'aspetto di una pigna. Il suo guscio\\n",
  "lo protegge dai Pokémon uccello che lo\\n",
  "beccano per errore.$",
]

[msg.section_0.entries.205]
text = [
  "È incassato in una conchiglia d'acciaio.\\n",
  "A parte gli occhi scrutatori, nessuno\\n",
  "sa cosa ci sia all'interno.$",
]

[msg.section_0.entries.206]
text = [
  "Scava nel terreno con la coda creando\\n",
  "una tana simile a un labirinto.\\n",
  "Sa spiccare brevissimi voli.$",
]

[msg.section_0.entries.207]
text = [
  "Vola planando nell'aria. Sorprende\\n",
  "i nemici aggrappandosi al loro volto,\\n",
  "poi inietta il suo veleno.$",
]

[msg.section_0.entries.208]
text = [
  "Si dice che si sia trasformato a causa del\\n",
  "ferro contenuto nella terra che mangia.$",
]

[msg.section_0.entries.209]
text = [
  "I Pokémon più piccoli fuggono alla\\n",
  "vista della sua faccia terrificante.\\n",
  "Ma le donne lo trovano carino.$",
]

[msg.section_0.entries.210]
text = [
  "Malgrado il suo aspetto, è molto timido.\\n",
  "Se si arrabbia, tuttavia, colpisce con\\n",
  "le sue enormi zanne.$",
]

[msg.section_0.entries.211]
text = [
  "Spara i suoi aculei velenosi in tutte\\n",
  "le direzioni. Essendo un po' tondetto,\\n",
  "non è un gran nuotatore.$",
]

[msg.section_0.entries.212]
text = [
  "Solleva le chele su cui sono disegnati\\n",
  "degli occhi. Poi le abbassa brandendole\\n",
  "pericolosamente.$",
]

[msg.section_0.entries.213]
text = [
  "Conserva nel guscio delle bacche che,\\n",
  "quando fermentano, si trasformano\\n",
  "in un succo delizioso.$",
]

[msg.section_0.entries.214]
text = [
  "È ghiotto di miele e per non farselo\\n",
  "rubare usa il suo possente corno\\n",
  "per scagliare lontano i nemici.$",
]

[msg.section_0.entries.215]
text = [
  "Un Pokémon furbo e subdolo. Attira altri\\n",
  "Pokémon lontano dal nido, mentre\\n",
  "un altro ruba le uova.$",
]

[msg.section_0.entries.216]
text = [
  "Si impregna le zampe di miele per poterle\\n",
  "leccare in continuazione. Ogni assaggio\\n",
  "ha un sapore unico.$",
]

[msg.section_0.entries.217]
text = [
  "Nel suo territorio, lascia graffi sugli\\n",
  "alberi che hanno bacche o frutti\\n",
  "deliziosi.$",
]

[msg.section_0.entries.218]
text = [
  "Nel suo corpo scorre magma. Se non si\\n",
  "muove continuamente, il suo corpo si\\n",
  "raffredda e s'indurisce.$",
]

[msg.section_0.entries.219]
text = [
  "Ha una temperatura corporea di circa\\n",
  "10.000°C. Dai fori del guscio fuoriescono\\n",
  "intense fiammate.$",
]

[msg.section_0.entries.220]
text = [
  "Grazie al suo olfatto sviluppato trova\\n",
  "funghi, bacche e persino sorgenti termali\\n",
  "sotto al ghiaccio.$",
]

[msg.section_0.entries.221]
text = [
  "Il suo fitto pelo lo protegge dal freddo.\\n",
  "Ha zanne di ghiaccio che si ispessiscono\\n",
  "quando nevica.$",
]

[msg.section_0.entries.222]
text = [
  "Vivono numerosi nei limpidi mari del sud.\\n",
  "Pare che non riescano a sopravvivere\\n",
  "nelle acque inquinate.$",
]

[msg.section_0.entries.223]
text = [
  "Emette potenti getti d'acqua che non\\n",
  "mancano mai il bersaglio, anche quando\\n",
  "Remoraid è sott'acqua.$",
]

[msg.section_0.entries.224]
text = [
  "Adora nascondersi nelle spaccature\\n",
  "delle rocce. A volte allunga la bocca\\n",
  "e sputa inchiostro sulle prede.$",
]

[msg.section_0.entries.225]
text = [
  "Trascina il cibo avvolgendolo nella coda\\n",
  "e ha l'abitudine di condividerlo con chi\\n",
  "si perde fra le montagne.$",
]

[msg.section_0.entries.226]
text = [
  "Nuota in mare con eleganza e ignora\\n",
  "i Remoraid che gli si attaccano alle\\n",
  "pinne in cerca di avanzi di cibo.$",
]

[msg.section_0.entries.227]
text = [
  "È interamente rivestito da un'armatura\\n",
  "dura come l'acciaio. Vola alla velocità\\n",
  "di 300 km/h.$",
]

[msg.section_0.entries.228]
text = [
  "Va a caccia in branchi e comunica con\\n",
  "gli altri emettendo una varietà di versi.$",
]

[msg.section_0.entries.229]
text = [
  "Se s'infuria, sputa fiamme contenenti\\n",
  "una tossina. Se ci si brucia, il dolore\\n",
  "permane a lungo.$",
]

[msg.section_0.entries.230]
text = [
  "Vive in caverne sui fondali marini e crea\\n",
  "vortici giganteschi ogni volta che si\\n",
  "muove.$",
]

[msg.section_0.entries.231]
text = [
  "Non è molto grande, ma è forte. Può\\n",
  "sollevare un adulto e trasportarlo\\n",
  "sul dorso senza fatica.$",
]

[msg.section_0.entries.232]
text = [
  "Si arrotola a palla e attacca il nemico.\\n",
  "Riesce ad abbattere una casa con\\n",
  "un solo colpo.$",
]

[msg.section_0.entries.233]
text = [
  "È stato potenziato per consentire\\n",
  "l'esplorazione di altri pianeti.\\n",
  "Tuttavia, non ha avuto successo.$",
]

[msg.section_0.entries.234]
text = [
  "Chi fissa le sue corna riceve una strana\\n",
  "sensazione, quasi come se venisse\\n",
  "risucchiato.$",
]

[msg.section_0.entries.235]
text = [
  "Delimita il suo territorio usando la coda\\n",
  "come se fosse un pennello. Ha lasciato\\n",
  "oltre 5000 segni diversi.$",
]

[msg.section_0.entries.236]
text = [
  "È famoso per la sua brama di lotta.\\n",
  "Subisce sempre ferite dai nemici\\n",
  "più forti di lui che sfida.$",
]

[msg.section_0.entries.237]
text = [
  "Combatte mentre gira come una trottola.\\n",
  "La forza centrifuga decuplica il suo\\n",
  "potere distruttivo.$",
]

[msg.section_0.entries.238]
text = [
  "Analizza tutto con le labbra e con esse\\n",
  "riesce a memorizzare ciò che gli piace e\\n",
  "ciò che non gli piace.$",
]

[msg.section_0.entries.239]
text = [
  "Una debole corrente elettrica scorre\\n",
  "tra le sue corna. Chi vi passa una mano\\n",
  "rimane fulminato.$",
]

[msg.section_0.entries.240]
text = [
  "Il suo sangue assomiglia al magma.\\n",
  "La sua temperatura corporea raggiunge\\n",
  "i 600°C.$",
]

[msg.section_0.entries.241]
text = [
  "Si dice che se un bambino beve il latte\\n",
  "di Miltank crescerà bene e da adulto\\n",
  "sarà sano e buono.$",
]

[msg.section_0.entries.242]
text = [
  "Le uova che depone sono piene di\\n",
  "felicità. Un assaggio rende chiunque\\n",
  "allegro.$",
]

[msg.section_0.entries.243]
text = [
  "Pare che sia caduto con un fulmine.\\n",
  "Può scagliare saette dalle nuvole\\n",
  "di pioggia che ha sul dorso.$",
]

[msg.section_0.entries.244]
text = [
  "Si dice che quando emette il suo verso,\\n",
  "da qualche parte nel mondo un vulcano\\n",
  "stia eruttando.$",
]

[msg.section_0.entries.245]
text = [
  "Corre per tutto il mondo per purificare\\n",
  "l'acqua contaminata.\\n",
  "Si allontana con i venti del nord.$",
]

[msg.section_0.entries.246]
text = [
  "Pokémon che mangia la terra. Dopo aver\\n",
  "mangiato un'intera montagna, va a\\n",
  "dormire per poter crescere.$",
]

[msg.section_0.entries.247]
text = [
  "Il suo corpo è duro come la roccia.\\n",
  "Riesce a muoversi come un razzo\\n",
  "espellendo gas con tutta forza.$",
]

[msg.section_0.entries.248]
text = [
  "Se s'infuria, abbatte le montagne e\\n",
  "seppellisce i fiumi. In seguito, le\\n",
  "mappe devono essere riscritte.$",
]

[msg.section_0.entries.249]
text = [
  "Dorme in una fossa negli abissi marini.\\n",
  "Con un battito d'ali provoca una\\n",
  "tempesta di 40 giorni.$",
]

[msg.section_0.entries.250]
text = [
  "Le sue piume sono di sette colori.\\n",
  "Si dice che chiunque lo veda sarà\\n",
  "per sempre felice.$",
]

[msg.section_0.entries.251]
text = [
  "Ha il potere di viaggiare attraverso\\n",
  "il tempo, ma si dice che appaia solo\\n",
  "in periodi di pace.$",
]

[msg.section_0.entries.252]
text = [
  "Le piante dei suoi piedi sono piene di\\n",
  "uncini che gli permettono di camminare\\n",
  "su muri e soffitti.$",
]

[msg.section_0.entries.253]
text = [
  "Vive in giungle fitte. Si avvicina alle\\n",
  "prede saltando di ramo in ramo.$",
]

[msg.section_0.entries.254]
text = [
  "Le foglie che crescono sulle sue braccia\\n",
  "tagliano anche grandi alberi.\\n",
  "Nel suo habitat, è imbattibile.$",
]

[msg.section_0.entries.255]
text = [
  "Nel suo corpo brucia una fiamma e\\n",
  "abbracciandolo si avverte calore.\\n",
  "Lancia palle di fuoco a 1000°C.$",
]

[msg.section_0.entries.256]
text = [
  "Possiede l'abilità di sferrare anche\\n",
  "10 calci al secondo. Emette urla\\n",
  "strazianti per intimorire i nemici.$",
]

[msg.section_0.entries.257]
text = [
  "Le fiamme che fuoriescono dai suoi polsi\\n",
  "gli avvolgono i pugni. Quando colpisce\\n",
  "il nemico, lo scotta.$",
]

[msg.section_0.entries.258]
text = [
  "Con la pinna sulla testa percepisce\\n",
  "i movimenti dell'acqua e sta in guardia.\\n",
  "Riesce a sollevare rocce.$",
]

[msg.section_0.entries.259]
text = [
  "Grazie alle zampe vigorose, si muove\\n",
  "con disinvoltura anche nel fango.\\n",
  "Dorme immerso nella melma.$",
]

[msg.section_0.entries.260]
text = [
  "Nuotando riesce a trainare una grande\\n",
  "nave. Con le braccia vigorose abbatte\\n",
  "i nemici in un sol colpo.$",
]

[msg.section_0.entries.261]
text = [
  "Pokémon di natura ostinata. Insegue\\n",
  "la preda prescelta finché questa non\\n",
  "è esausta.$",
]

[msg.section_0.entries.262]
text = [
  "Caccia le prede in branco. Non\\n",
  "disobbedisce mai agli ordini di\\n",
  "un Allenatore abile.$",
]

[msg.section_0.entries.263]
text = [
  "Avanza a zigzag. È bravo a trovare\\n",
  "strumenti nell'erba e sul terreno.$",
]

[msg.section_0.entries.264]
text = [
  "Carica la preda ad una velocità di\\n",
  "100 km/h. Ma dal momento che va\\n",
  "solo dritto, sbaglia spesso.$",
]

[msg.section_0.entries.265]
text = [
  "Viene spesso attaccato dai Pokémon\\n",
  "uccello. Si difende emettendo veleno\\n",
  "dagli aculei che ha sulla coda.$",
]

[msg.section_0.entries.266]
text = [
  "Si appende ai rami con fili di seta.\\n",
  "Aspetta l'evoluzione bevendo l'acqua\\n",
  "piovana che si posa sulla seta.$",
]

[msg.section_0.entries.267]
text = [
  "Malgrado l'aspetto, è feroce. Se\\n",
  "disturbato in cerca di polline, attacca\\n",
  "con la bocca lunga e sottile.$",
]

[msg.section_0.entries.268]
text = [
  "Non dimentica mai gli attacchi subiti\\n",
  "dentro il bozzolo. Dopo l'evoluzione\\n",
  "cerca di vendicarsi.$",
]

[msg.section_0.entries.269]
text = [
  "Rilascia una polvere tossica dalle ali.\\n",
  "Di notte divora le foglie degli alberi\\n",
  "lungo i viali.$",
]

[msg.section_0.entries.270]
text = [
  "Sembra una pianta acquatica e viene\\n",
  "usato come traghetto dai Pokémon\\n",
  "che non sanno nuotare.$",
]

[msg.section_0.entries.271]
text = [
  "È un po' dispettoso. Se vede un\\n",
  "pescatore, gli tira la lenza solo\\n",
  "per dargli fastidio.$",
]

[msg.section_0.entries.272]
text = [
  "Se ascolta musica allegra, tutto il suo\\n",
  "corpo si rivitalizza e non riesce ad\\n",
  "evitare di ballare.$",
]

[msg.section_0.entries.273]
text = [
  "Quando si attacca a un ramo, sembra\\n",
  "una vera ghianda. Si diverte a\\n",
  "spaventare gli altri Pokémon.$",
]

[msg.section_0.entries.274]
text = [
  "Il fischio del suo flauto di foglia mette\\n",
  "a disagio chi lo sente.\\n",
  "Vive nelle foreste più fitte.$",
]

[msg.section_0.entries.275]
text = [
  "Con le sue foglie provoca raffiche di\\n",
  "vento della velocità di 30 m/s che\\n",
  "spazzano via interi edifici.$",
]

[msg.section_0.entries.276]
text = [
  "È molto coraggioso e affronta spavaldo i\\n",
  "nemici più forti. Migra verso i paesi caldi.$",
]

[msg.section_0.entries.277]
text = [
  "Vola in tondo alla ricerca di prede.\\n",
  "Quando ne avvista una, si lancia\\n",
  "in picchiata per catturarla.$",
]

[msg.section_0.entries.278]
text = [
  "Si fa trasportare ad alta quota dalle\\n",
  "correnti ascensionali.\\n",
  "Trasporta il cibo nel becco.$",
]

[msg.section_0.entries.279]
text = [
  "È un corriere dei cieli e porta uova e\\n",
  "piccoli Pokémon nel suo enorme becco.$",
]

[msg.section_0.entries.280]
text = [
  "Se con le corna avverte emozioni positive\\n",
  "di persone o Pokémon, il suo corpo\\n",
  "si scalda leggermente.$",
]

[msg.section_0.entries.281]
text = [
  "Quando il suo Allenatore si sente felice,\\n",
  "trabocca di energia e inizia a ballare\\n",
  "girando su se stesso.$",
]

[msg.section_0.entries.282]
text = [
  "Quando il suo Allenatore è in pericolo\\n",
  "usa tutto il suo potere psichico per\\n",
  "creare un piccolo buco nero.$",
]

[msg.section_0.entries.283]
text = [
  "Cammina a pelo d'acqua. Dall'aculeo sulla\\n",
  "testa emana un dolce aroma con cui\\n",
  "attira le prede.$",
]

[msg.section_0.entries.284]
text = [
  "Le sue antenne presentano un motivo ad\\n",
  "occhi. Con le quattro ali riesce a volar\\n",
  "in ogni direzione.$",
]

[msg.section_0.entries.285]
text = [
  "Sparge spore tossiche dalla sommità\\n",
  "del capo. Se inalate, queste spore\\n",
  "provocano dolore in tutto il corpo.$",
]

[msg.section_0.entries.286]
text = [
  "Tirando pugni, i suoi cortissimi arti\\n",
  "si allungano. Usa una tecnica simile\\n",
  "a quella dei pugili professionisti.$",
]

[msg.section_0.entries.287]
text = [
  "Passa quasi tutto il tempo sdraiato.\\n",
  "Soltanto a guardarlo si prova\\n",
  "sonnolenza.$",
]

[msg.section_0.entries.288]
text = [
  "Il suo cuore batte 10 volte più\\n",
  "velocemente del normale. Non sta\\n",
  "fermo neanche un momento.$",
]

[msg.section_0.entries.289]
text = [
  "Il Pokémon più pigro in assoluto.\\n",
  "Stando disteso, in realtà cerca di\\n",
  "risparmiare forze per attaccare.$",
]

[msg.section_0.entries.290]
text = [
  "Cresce sottoterra e, poiché è quasi\\n",
  "cieco, usa le antenne per sondare\\n",
  "ciò che lo circonda.$",
]

[msg.section_0.entries.291]
text = [
  "Si muove così in fretta da risultare quasi\\n",
  "invisibile. Lo si vede in gruppo attorno\\n",
  "agli alberi ricchi di linfa.$",
]

[msg.section_0.entries.292]
text = [
  "È nato dal guscio vuoto di un insetto.\\n",
  "Pare che chi spia nella fessura sul suo\\n",
  "dorso perda l'anima.$",
]

[msg.section_0.entries.293]
text = [
  "Di solito ha una voce molto tenue, ma se\\n",
  "si spaventa, emette un suono assordante\\n",
  "quanto un jet.$",
]

[msg.section_0.entries.294]
text = [
  "Le onde d'urto dei suoi versi ribaltano\\n",
  "anche i camion. Pesta i piedi per\\n",
  "accumulare energia.$",
]

[msg.section_0.entries.295]
text = [
  "Le sue urla si sentono a 10 km di\\n",
  "distanza. Emette diversi suoni dalle\\n",
  "numerose aperture del suo corpo.$",
]

[msg.section_0.entries.296]
text = [
  "Si rinforza sbattendo contro enormi\\n",
  "alberi. Vicino alla sua tana si trovano\\n",
  "parecchi alberi abbattuti.$",
]

[msg.section_0.entries.297]
text = [
  "Ama confrontarsi con Pokémon grossi.\\n",
  "Con uno dei suo schiaffi, può far\\n",
  "prendere il volo a un camion.$",
]

[msg.section_0.entries.298]
text = [
  "La sua coda rimbalza come un pallone.\\n",
  "Lotta contro avversari più grandi di lui\\n",
  "agitando la coda.$",
]

[msg.section_0.entries.299]
text = [
  "Quando è in pericolo si protegge con\\n",
  "la sua forza magnetica, attirando\\n",
  "oggetti di ferro su di sé.$",
]

[msg.section_0.entries.300]
text = [
  "Non riesce ad evitare di inseguire tutto\\n",
  "ciò che si muove e corre in tondo a\\n",
  "caccia della propria coda.$",
]

[msg.section_0.entries.301]
text = [
  "Ha successo fra gli Allenatori di sesso\\n",
  "femminile per la sua bellissima pelliccia.\\n",
  "Non ha una tana fissa.$",
]

[msg.section_0.entries.302]
text = [
  "Si cela nell'oscurità delle caverne.\\n",
  "Si nutre di gemme e per questo i suoi\\n",
  "occhi sono pietre preziose.$",
]

[msg.section_0.entries.303]
text = [
  "Le sue due enormi mandibole sono corna\\n",
  "trasformate. Con esse può masticare\\n",
  "persino travi di ferro.$",
]

[msg.section_0.entries.304]
text = [
  "Vive generalmente sui monti ma, spinto\\n",
  "dalla fame, scende per cibarsi di\\n",
  "binari ferroviari e automobili.$",
]

[msg.section_0.entries.305]
text = [
  "Scava per cercare ferro, di cui si nutre.\\n",
  "Si schianta contro gli altri nella lotta\\n",
  "per il territorio.$",
]

[msg.section_0.entries.306]
text = [
  "Cerca ferro da mangiare scavando tunnel\\n",
  "nella roccia con le sue corna d'acciaio.$",
]

[msg.section_0.entries.307]
text = [
  "Si allena in montagna per elevare il suo\\n",
  "potere spirituale. Con la meditazione\\n",
  "riesce a levitare.$",
]

[msg.section_0.entries.308]
text = [
  "Riesce a percepire l'aura dei nemici\\n",
  "allenando la sua mente tramite il digiuno.$",
]

[msg.section_0.entries.309]
text = [
  "L'elettricità immagazzinata nella\\n",
  "pelliccia gli stimola i muscoli e aumenta\\n",
  "la sua velocità di reazione.$",
]

[msg.section_0.entries.310]
text = [
  "Scarica elettricità dalla criniera. Crea\\n",
  "nubi temporalesche in cielo che fanno\\n",
  "cadere saette.$",
]

[msg.section_0.entries.311]
text = [
  "Incoraggia gli amici con un vivace\\n",
  "scoppiettio di scintille. Assorbe\\n",
  "elettricità dai pali telefonici.$",
]

[msg.section_0.entries.312]
text = [
  "Incoraggia gli amici e, se questi perdono,\\n",
  "il suo corpo emette una maggiore\\n",
  "quantità di scintille.$",
]

[msg.section_0.entries.313]
text = [
  "Di notte comunica con gli altri illuminando\\n",
  "la sua coda. Ama il dolce aroma di\\n",
  "Illumise.$",
]

[msg.section_0.entries.314]
text = [
  "Con il suo dolce aroma dirige il volo\\n",
  "di Volbeat, che disegna figure luminose\\n",
  "nel cielo stellato.$",
]

[msg.section_0.entries.315]
text = [
  "Più in forma è, più piacevole è il profumo\\n",
  "dei suoi fiori. Questa fragranza rilassa\\n",
  "le persone.$",
]

[msg.section_0.entries.316]
text = [
  "La maggior parte del suo corpo è\\n",
  "stomaco. I suoi succhi gastrici\\n",
  "dissolvono subito ciò che ingerisce.$",
]

[msg.section_0.entries.317]
text = [
  "Inghiotte intera qualsiasi cosa. Dai pori\\n",
  "traspira un liquido tossico con cui bagna\\n",
  "i nemici.$",
]

[msg.section_0.entries.318]
text = [
  "Attacca in branco chi invade il suo\\n",
  "territorio. Le zanne aguzze lacerano\\n",
  "anche gli scafi delle navi.$",
]

[msg.section_0.entries.319]
text = [
  "Con le sue zanne può spezzare il ferro.\\n",
  "Nuota a 120 km/h. È noto come\\n",
  "il “Tiranno del mare\\\".$",
]

[msg.section_0.entries.320]
text = [
  "In giornate soleggiate, gioca\\n",
  "rimbalzando sulla spiaggia.\\n",
  "Spruzza acqua dalle narici.$",
]

[msg.section_0.entries.321]
text = [
  "Il Pokémon più grande che esista.\\n",
  "Dopo aver inalato aria, si immerge a\\n",
  "una profondità di 3000 metri.$",
]

[msg.section_0.entries.322]
text = [
  "Nella gobba accumula magma. Quando\\n",
  "piove, il magma si indurisce e il Pokémon\\n",
  "diventa più lento.$",
]

[msg.section_0.entries.323]
text = [
  "Ha dei vulcani sul dorso. Se il magma nel\\n",
  "suo corpo aumenta, trema e poi erutta\\n",
  "violentemente.$",
]

[msg.section_0.entries.324]
text = [
  "Genera energia bruciando carbone\\n",
  "all'interno della corazza. Se è in\\n",
  "pericolo, emette fuliggine scura.$",
]

[msg.section_0.entries.325]
text = [
  "Rimbalza costantemente usando la coda\\n",
  "come una molla. Il movimento sollecita\\n",
  "il cuore e lo fa battere.$",
]

[msg.section_0.entries.326]
text = [
  "Usa perle nere per amplificare i suoi\\n",
  "poteri psichici. Con una danza acquisisce\\n",
  "controllo sul nemico.$",
]

[msg.section_0.entries.327]
text = [
  "Non ci sono due Spinda con lo stesso\\n",
  "motivo maculato. Il suo passo\\n",
  "barcollante confonde i nemici.$",
]

[msg.section_0.entries.328]
text = [
  "Scava fosse coniche nella sabbia del\\n",
  "deserto e attende che le prede cadano\\n",
  "in trappola.$",
]

[msg.section_0.entries.329]
text = [
  "Fa vibrare violentemente le ali\\n",
  "generando onde ultrasoniche che\\n",
  "provocano il mal di testa.$",
]

[msg.section_0.entries.330]
text = [
  "Genera tempeste di sabbia con il battito\\n",
  "delle ali. È detto anche “Spirito\\n",
  "primordiale del deserto\\\".$",
]

[msg.section_0.entries.331]
text = [
  "Immagazzina acqua nel corpo e riesce\\n",
  "a sopravvivere nel deserto senz'acqua\\n",
  "anche per 30 giorni.$",
]

[msg.section_0.entries.332]
text = [
  "Diventa attivo di notte, quando va a\\n",
  "caccia di prede stremate dalla calura\\n",
  "del deserto.$",
]

[msg.section_0.entries.333]
text = [
  "Non sta tranquillo se attorno a sé c'è\\n",
  "della sporcizia e la rimuove con le ali.$",
]

[msg.section_0.entries.334]
text = [
  "Se lega con una persona, la avvolge\\n",
  "nelle sue soffici ali e poi inizia a\\n",
  "canticchiare.$",
]

[msg.section_0.entries.335]
text = [
  "Da generazioni, è acerrimo nemico di\\n",
  "Seviper. Gli artigli aguzzi sono le sue\\n",
  "armi più potenti.$",
]

[msg.section_0.entries.336]
text = [
  "È acerrimo nemico di Zangoose.\\n",
  "Prima della lotta, affila sulle rocce\\n",
  "la sua coda simile ad una spada.$",
]

[msg.section_0.entries.337]
text = [
  "Diventa attivo nelle notti di luna piena,\\n",
  "pertanto si dice che abbia qualche\\n",
  "legame con le fasi lunari.$",
]

[msg.section_0.entries.338]
text = [
  "Nuova specie di Pokémon che si dice\\n",
  "provenga dal sole. Emana luce roteando\\n",
  "vorticosamente.$",
]

[msg.section_0.entries.339]
text = [
  "Il suo viscido corpo è difficile da\\n",
  "afferrare. In una regione si dice\\n",
  "che sia nato da fango indurito.$",
]

[msg.section_0.entries.340]
text = [
  "Ha un senso del territorio molto\\n",
  "sviluppato. Se un nemico si avvicina,\\n",
  "scatena forti terremoti.$",
]

[msg.section_0.entries.341]
text = [
  "La sua grande vitalità gli permette di\\n",
  "adattarsi ad ogni habitat. Le sue chele\\n",
  "non rilasciano mai la preda.$",
]

[msg.section_0.entries.342]
text = [
  "Pokémon violento che afferra il nemico\\n",
  "con le chele e lo scaraventa fuori dal\\n",
  "suo stagno.$",
]

[msg.section_0.entries.343]
text = [
  "Pokémon raro che si muove roteando su\\n",
  "se stesso. È stato scoperto nei pressi\\n",
  "di antiche rovine.$",
]

[msg.section_0.entries.344]
text = [
  "Pokémon nato da un'antica statuetta\\n",
  "d'argilla portata in vita da misteriose\\n",
  "radiazioni.$",
]

[msg.section_0.entries.345]
text = [
  "Viveva sul fondo marino 100 milioni di anni\\n",
  "fa ed è stato rigenerato in laboratorio.$",
]

[msg.section_0.entries.346]
text = [
  "Vive in acque poco profonde nei mari\\n",
  "caldi. Con la bassa marea, scava sulla\\n",
  "riva in cerca di prede.$",
]

[msg.section_0.entries.347]
text = [
  "Un antico Pokémon rigenerato da\\n",
  "un fossile. Viveva nel mare e catturava\\n",
  "le prede con gli artigli.$",
]

[msg.section_0.entries.348]
text = [
  "Dopo essersi evoluto, è andato a vivere\\n",
  "a riva. Tutto il suo corpo è rivestito da\\n",
  "un'armatura robusta.$",
]

[msg.section_0.entries.349]
text = [
  "È un Pokémon brutto e sciatto. Tuttavia,\\n",
  "è molto resistente e sopravvive in\\n",
  "pochissima acqua.$",
]

[msg.section_0.entries.350]
text = [
  "Le sue bellissime scaglie hanno i colori\\n",
  "dell'arcobaleno, che cambiano a seconda\\n",
  "dell'angolazione.$",
]

[msg.section_0.entries.351]
text = [
  "Il suo aspetto varia con il clima.\\n",
  "Recentemente si è scoperto che\\n",
  "le sue molecole sono di acqua.$",
]

[msg.section_0.entries.352]
text = [
  "Può mutare il colore del corpo a\\n",
  "piacimento. Tuttavia, il motivo a zigzag\\n",
  "sul suo ventre non cambia.$",
]

[msg.section_0.entries.353]
text = [
  "Si annida sotto le grondaie di case dove\\n",
  "vive gente che cova sentimenti di\\n",
  "vendetta, che lui adora.$",
]

[msg.section_0.entries.354]
text = [
  "Un peluche divenuto Pokémon per la\\n",
  "rabbia di essere stato buttato via da un\\n",
  "bimbo, di cui è alla ricerca.$",
]

[msg.section_0.entries.355]
text = [
  "Adora il pianto dei bambini. Spaventa\\n",
  "i bimbi cattivi passando attraverso\\n",
  "le pareti.$",
]

[msg.section_0.entries.356]
text = [
  "Va in cerca di fuochi fatui e li risucchia\\n",
  "nel suo corpo vuoto. Cosa succeda\\n",
  "all'interno è un mistero.$",
]

[msg.section_0.entries.357]
text = [
  "Poiché era solito mangiare frutti\\n",
  "deliziosi, questi hanno cominciato\\n",
  "a crescergli attorno al collo.$",
]

[msg.section_0.entries.358]
text = [
  "I suoi versi riecheggiano dentro il corpo\\n",
  "vuoto e fuoriescono per sorprendere e\\n",
  "respingere i nemici.$",
]

[msg.section_0.entries.359]
text = [
  "Si dice che sia in grado di prevedere\\n",
  "i disastri con il suo corno. Si è rifugiato\\n",
  "sulle montagne.$",
]

[msg.section_0.entries.360]
text = [
  "Questi Pokémon si allenano in gruppo\\n",
  "caricandosi l'un l'altro per rafforzarsi.\\n",
  "Amano i frutti dolci.$",
]

[msg.section_0.entries.361]
text = [
  "Si dice che gli Snorunt vivano in armonia\\n",
  "riuniti sotto gigantesche foglie.$",
]

[msg.section_0.entries.362]
text = [
  "Impedisce alla preda di scappare\\n",
  "congelando all'istante l'umidità\\n",
  "nell'aria.$",
]

[msg.section_0.entries.363]
text = [
  "Poiché il suo corpo non è adatto al\\n",
  "nuoto, rotola su lastre di ghiaccio\\n",
  "per raggiungere la riva.$",
]

[msg.section_0.entries.364]
text = [
  "Fa roteare oggetti sul naso per\\n",
  "controllarne l'odore e la consistenza.$",
]

[msg.section_0.entries.365]
text = [
  "Frantuma il ghiaccio con le zanne.\\n",
  "Lo spesso strato adiposo respinge\\n",
  "il freddo e gli attacchi nemici.$",
]

[msg.section_0.entries.366]
text = [
  "Crea una sola perla in tutta la sua vita.\\n",
  "Si dice che questa perla amplifichi\\n",
  "i poteri psichici.$",
]

[msg.section_0.entries.367]
text = [
  "Vive nei mari profondi. Con la coda\\n",
  "a forma di pesciolino attrae prede\\n",
  "ignare del pericolo.$",
]

[msg.section_0.entries.368]
text = [
  "Vive sui fondali marini. In primavera\\n",
  "il suo corpo rosato diventa più vivido\\n",
  "per chissà quale motivo.$",
]

[msg.section_0.entries.369]
text = [
  "Un Pokémon raro scoperto durante\\n",
  "un'esplorazione del mare profondo.\\n",
  "È immutato da 100 milioni di anni.$",
]

[msg.section_0.entries.370]
text = [
  "Vive nei mari caldi. Si dice che le coppie\\n",
  "che trovano questo Pokémon riceveranno\\n",
  "in dono l'eterno amore.$",
]

[msg.section_0.entries.371]
text = [
  "Sogna di poter volare un giorno e,\\n",
  "pertanto, si allena regolarmente\\n",
  "gettandosi da alture.$",
]

[msg.section_0.entries.372]
text = [
  "Nella sua dura corazza le cellule hanno\\n",
  "cominciato a cambiare.\\n",
  "Quando si evolve, la corazza cade.$",
]

[msg.section_0.entries.373]
text = [
  "Il suo forte desiderio di volare ha\\n",
  "provocato una mutazione cellulare\\n",
  "e gli sono spuntate le ali.$",
]

[msg.section_0.entries.374]
text = [
  "Comunica con i suoi simili mediante onde\\n",
  "magnetiche. I gruppi di Beldum si muovono\\n",
  "in perfetta sintonia.$",
]

[msg.section_0.entries.375]
text = [
  "È sorto dalla fusione di due Beldum.\\n",
  "Il suo corpo d'acciaio non viene scalfito\\n",
  "neanche se urta un jet.$",
]

[msg.section_0.entries.376]
text = [
  "È formato dalla fusione di due Metang.\\n",
  "Ha quattro cervelli e l'intelligenza di\\n",
  "un supercomputer.$",
]

[msg.section_0.entries.377]
text = [
  "È formato interamente da rocce.\\n",
  "Se si staccano nella lotta, ne cerca\\n",
  "altre per sostituirle.$",
]

[msg.section_0.entries.378]
text = [
  "Il suo corpo è costituito da ghiaccio\\n",
  "dell'era glaciale. Mantiene l'aria\\n",
  "a una temperatura di -200°C.$",
]

[msg.section_0.entries.379]
text = [
  "La pressione subita sottoterra per\\n",
  "decine di migliaia di anni ha reso il suo\\n",
  "corpo resistentissimo.$",
]

[msg.section_0.entries.380]
text = [
  "Questo Pokémon ha il corpo ricoperto di\\n",
  "piume che riflettono la luce e lo rendono\\n",
  "invisibile.$",
]

[msg.section_0.entries.381]
text = [
  "Pokémon molto intelligente. Ripiegando\\n",
  "indietro le ali, riesce a volare più veloce\\n",
  "di un jet.$",
]

[msg.section_0.entries.382]
text = [
  "Si dice che abbia ampliato i mari\\n",
  "provocando piogge torrenziali. Si è\\n",
  "assopito in una fossa marina.$",
]

[msg.section_0.entries.383]
text = [
  "Dopo una lotta colossale contro Kyogre,\\n",
  "si è addormentato sotto terra in mezzo\\n",
  "al magma.$",
]

[msg.section_0.entries.384]
text = [
  "Vive nello strato di ozono oltre le\\n",
  "nuvole e non può essere avvistato\\n",
  "da terra.$",
]

[msg.section_0.entries.385]
text = [
  "Ha l'abilità di realizzare ogni desiderio,\\n",
  "ma soltanto per una settimana ogni 1000\\n",
  "anni.$",
]

[msg.section_0.entries.386]
text = [
  "È il risultato della mutazione genetica\\n",
  "di un virus alieno, giunto sulla terra\\n",
  "con un meteorite.$",
]

[msg.section_0.entries.387]
text = [
  "Il guscio sulla sua schiena è fatto di\\n",
  "terra. Se un Turtwig è in forma, il suo\\n",
  "guscio è umido.$",
]

[msg.section_0.entries.388]
text = [
  "Sa come trovare sorgenti incontaminate,\\n",
  "dove porta i Pokémon amici tenendoli\\n",
  "sulla schiena.$",
]

[msg.section_0.entries.389]
text = [
  "Sul dorso di Torterra nascono Pokémon\\n",
  "che vi trascorrono tutta la vita.$",
]

[msg.section_0.entries.390]
text = [
  "È molto agile. Prima di addormentarsi\\n",
  "spegne la fiamma sulla coda per\\n",
  "scongiurare il rischio di incendi.$",
]

[msg.section_0.entries.391]
text = [
  "Controlla abilmente l'intensità delle\\n",
  "fiamme sulla sua coda per tenere\\n",
  "i nemici alla distanza ideale.$",
]

[msg.section_0.entries.392]
text = [
  "Con mani e piedi infuocati, usa mosse di\\n",
  "lotta speciali. Affronta qualsiasi nemico.$",
]

[msg.section_0.entries.393]
text = [
  "Quando cammina risulta goffo e cade\\n",
  "spesso. Poiché è molto orgoglioso,\\n",
  "continua come se nulla fosse.$",
]

[msg.section_0.entries.394]
text = [
  "Poiché ogni esemplare si considera il più\\n",
  "importante, i Prinplup non riescono mai\\n",
  "a creare un gruppo.$",
]

[msg.section_0.entries.395]
text = [
  "Chi osa ferirlo nell'orgoglio, viene\\n",
  "colpito dalle sue ali tanto possenti\\n",
  "da fendere un banco di ghiaccio.$",
]

[msg.section_0.entries.396]
text = [
  "Da soli sono deboli, quindi si muovono\\n",
  "in gruppo. Tuttavia, se sono troppi\\n",
  "finiscono per litigare.$",
]

[msg.section_0.entries.397]
text = [
  "Conscio della propria debolezza, vive\\n",
  "in gruppo. Quando è da solo, Staravia\\n",
  "emette forti versi.$",
]

[msg.section_0.entries.398]
text = [
  "Non smette di attaccare neanche quando\\n",
  "è ferito. Si preoccupa che la sua cresta\\n",
  "sia sempre in ordine.$",
]

[msg.section_0.entries.399]
text = [
  "Uno studio ha rivelato che gli incisivi di\\n",
  "Bidoof crescono allo stesso ritmo di\\n",
  "quelli di Rattata.$",
]

[msg.section_0.entries.400]
text = [
  "Un fiume in cui Bibarel ha costruito\\n",
  "una diga non straripa mai, cosa molto\\n",
  "apprezzata da chi ci vive vicino.$",
]

[msg.section_0.entries.401]
text = [
  "Ha le zampe corte. Quando inciampa\\n",
  "le sue antenne si urtano, producendo\\n",
  "un suono simile allo xilofono.$",
]

[msg.section_0.entries.402]
text = [
  "C'è un villaggio che organizza una gara\\n",
  "basata sulle melodie incredibilmente\\n",
  "varie di questo Pokémon.$",
]

[msg.section_0.entries.403]
text = [
  "Produce elettricità contraendo e\\n",
  "rilassando i muscoli. Quando si sente\\n",
  "minacciato si illumina.$",
]

[msg.section_0.entries.404]
text = [
  "I suoi artigli rilasciano una forte\\n",
  "corrente elettrica e con un solo graffio\\n",
  "manda KO i nemici.$",
]

[msg.section_0.entries.405]
text = [
  "Vede attraverso le pareti per\\n",
  "individuare le prede e i suoi cuccioli\\n",
  "smarriti.$",
]

[msg.section_0.entries.406]
text = [
  "La sua gemma, sensibile agli sbalzi di\\n",
  "temperatura, si schiude quando avverte\\n",
  "i caldi raggi del sole.$",
]

[msg.section_0.entries.407]
text = [
  "Le due diverse tossine sulle mani di\\n",
  "Roserade hanno un effetto quasi letale\\n",
  "quando il Pokémon colpisce.$",
]

[msg.section_0.entries.408]
text = [
  "Abitava nella giungla già 100 milioni\\n",
  "di anni fa. Abbatte gli alberi che lo\\n",
  "ostacolano con delle testate.$",
]

[msg.section_0.entries.409]
text = [
  "Anche se si prendono a testate, due\\n",
  "Rampardos non vanno KO perché il loro\\n",
  "cranio è molto spesso.$",
]

[msg.section_0.entries.410]
text = [
  "Ha una corazza molto spessa. Di\\n",
  "conseguenza può procurarsi erba\\n",
  "e bacche senza dover combattere.$",
]

[msg.section_0.entries.411]
text = [
  "Se si mettono uno di fianco all'altro\\n",
  "nessun nemico riesce a passare.\\n",
  "Proteggono così i loro cuccioli.$",
]

[msg.section_0.entries.412]
text = [
  "Anche se dove nasce non ci sono\\n",
  "materiali per fare bozzoli, si ritrova\\n",
  "sempre coperto da un manto.$",
]

[msg.section_0.entries.413]
text = [
  "Quando si evolve assorbe i materiali che\\n",
  "ha intorno. Per questo motivo ne\\n",
  "esistono molte varianti.$",
]

[msg.section_0.entries.414]
text = [
  "Anche se ama il nettare dei fiori, non lo\\n",
  "raccoglie. Preferisce rubarlo ai Combee.$",
]

[msg.section_0.entries.415]
text = [
  "Il trio è insieme dalla nascita. È sempre\\n",
  "impegnato a portare il nettare dei fiori\\n",
  "a Vespiquen.$",
]

[msg.section_0.entries.416]
text = [
  "Rilascia vari feromoni per farsi obbedire\\n",
  "dalle larve che trasporta mentre\\n",
  "combatte.$",
]

[msg.section_0.entries.417]
text = [
  "Talvolta due esemplari si sfregano\\n",
  "le guance per condividere l'elettricità\\n",
  "immagazzinata.$",
]

[msg.section_0.entries.418]
text = [
  "Usa le sue due code come eliche per\\n",
  "spostarsi nell'acqua e con esse taglia\\n",
  "anche le alghe che s'impigliano.$",
]

[msg.section_0.entries.419]
text = [
  "Si vede spesso vicino ai porti dove\\n",
  "si pesca. Porta in salvo le persone\\n",
  "e trascina via le prede.$",
]

[msg.section_0.entries.420]
text = [
  "La pallina, oltre a contenere sostanze\\n",
  "nutritive, è molto gustosa. Starly\\n",
  "cerca spesso di beccarla.$",
]

[msg.section_0.entries.421]
text = [
  "Quando splende il sole, ama aprire\\n",
  "i suoi petali per assorbire i raggi\\n",
  "solari con tutto il corpo.$",
]

[msg.section_0.entries.422]
text = [
  "Se si esercita una forte pressione\\n",
  "sul suo corpo, ne fuoriesce un\\n",
  "misterioso liquido viola.$",
]

[msg.section_0.entries.423]
text = [
  "In passato portava sulla schiena\\n",
  "un robusto carapace. Ne rimangono\\n",
  "tracce nelle sue cellule.$",
]

[msg.section_0.entries.424]
text = [
  "È talmente abile nel maneggiare gli\\n",
  "oggetti con le sue due code che\\n",
  "solo raramente usa le mani.$",
]

[msg.section_0.entries.425]
text = [
  "Fluttua qua e là senza motivo e per\\n",
  "questo una leggenda lo definisce\\n",
  "“Guida degli spiriti vaganti\\\".$",
]

[msg.section_0.entries.426]
text = [
  "Al tramonto, gruppi di Drifblim si fanno\\n",
  "trascinare dal vento. Se avvistati,\\n",
  "scompaiono all'improvviso.$",
]

[msg.section_0.entries.427]
text = [
  "Le sue orecchie sono sempre arrotolate.\\n",
  "Può estenderle con forza per\\n",
  "distruggere qualsiasi cosa.$",
]

[msg.section_0.entries.428]
text = [
  "Ha delle orecchie molto delicate. Se le si\\n",
  "tocca con forza, scalcia con le sue\\n",
  "graziose gambe.$",
]

[msg.section_0.entries.429]
text = [
  "I suoi versi sembrano incantesimi. Pare\\n",
  "che a volte contengano un potere che\\n",
  "porta felicità.$",
]

[msg.section_0.entries.430]
text = [
  "Se emette un verso profondo, molti\\n",
  "Murkrow accorrono all'istante.\\n",
  "È detto “Evocatore della notte\\\".$",
]

[msg.section_0.entries.431]
text = [
  "Se l'Allenatore non gli dà da mangiare,\\n",
  "gli graffia il naso. È un'abitudine che\\n",
  "cerca di nascondere.$",
]

[msg.section_0.entries.432]
text = [
  "Si fascia la vita con le code per apparire\\n",
  "più grande. Fissa con insistenza chi\\n",
  "incrocia il suo sguardo.$",
]

[msg.section_0.entries.433]
text = [
  "Ha una sfera nella gola. Quando saltella,\\n",
  "la sfera si muove emettendo dei trilli.$",
]

[msg.section_0.entries.434]
text = [
  "Emette un fluido puzzolente dal\\n",
  "posteriore. Il tanfo si sparge per 2 km\\n",
  "e tiene lontani i Pokémon.$",
]

[msg.section_0.entries.435]
text = [
  "Attacca spruzzando un fluido puzzolente\\n",
  "dalla punta della coda. Gli attacchi\\n",
  "dall'alto lo confondono.$",
]

[msg.section_0.entries.436]
text = [
  "Secondo alcuni ricercatori, in passato\\n",
  "questo Pokémon rifletteva come\\n",
  "uno specchio.$",
]

[msg.section_0.entries.437]
text = [
  "Può portare pioggia aprendo portali\\n",
  "verso un altro mondo. Si pensava\\n",
  "che propiziasse i raccolti.$",
]

[msg.section_0.entries.438]
text = [
  "Ama i luoghi aridi. Quando regola\\n",
  "l'umidità del corpo sembra che pianga.$",
]

[msg.section_0.entries.439]
text = [
  "Imita i movimenti e le espressioni\\n",
  "di coloro che vede per capire\\n",
  "i sentimenti degli altri.$",
]

[msg.section_0.entries.440]
text = [
  "Gli piace trasportare una piccola roccia.\\n",
  "A volte cammina tra i piedi degli altri,\\n",
  "facendoli inciampare.$",
]

[msg.section_0.entries.441]
text = [
  "La sua lingua è uguale a quella degli\\n",
  "uomini. Gli riesce quindi facile imitare\\n",
  "la voce umana.$",
]

[msg.section_0.entries.442]
text = [
  "A causa del suo comportamento molesto\\n",
  "è stato imprigionato in una Roccianima\\n",
  "con un incantesimo.$",
]

[msg.section_0.entries.443]
text = [
  "Attacca con la sua enorme bocca. È\\n",
  "forte, ma molto maldestro e spesso\\n",
  "si danneggia da solo.$",
]

[msg.section_0.entries.444]
text = [
  "Adora gli oggetti luccicanti. Va a caccia\\n",
  "di tesori nelle grotte e li trasporta\\n",
  "nel suo nido.$",
]

[msg.section_0.entries.445]
text = [
  "Si dice che quando vola, le sue ali creino\\n",
  "raffiche di vento in grado di abbattere\\n",
  "gli alberi vicini.$",
]

[msg.section_0.entries.446]
text = [
  "Il suo insaziabile appetito gli fa spesso\\n",
  "dimenticare di avere del cibo nascosto\\n",
  "sotto il pelo.$",
]

[msg.section_0.entries.447]
text = [
  "È in grado di vedere emozioni come rabbia\\n",
  "e gioia sotto forma di onde. Si tratta di\\n",
  "un potere unico.$",
]

[msg.section_0.entries.448]
text = [
  "Se ben addestrato, Lucario riesce a\\n",
  "identificare e a percepire le emozioni\\n",
  "di creature lontane 1 km.$",
]

[msg.section_0.entries.449]
text = [
  "Chiude le narici e poi si sposta\\n",
  "attraverso la sabbia. Vive in gruppi\\n",
  "di 10.$",
]

[msg.section_0.entries.450]
text = [
  "Si infuria molto facilmente. Per mostrare\\n",
  "la sua forza tiene la bocca spalancata.$",
]

[msg.section_0.entries.451]
text = [
  "Rilascia veleno dagli artigli sulla coda.\\n",
  "Può resistere senza cibo per un anno.$",
]

[msg.section_0.entries.452]
text = [
  "Dotato di una costituzione robusta, va\\n",
  "orgoglioso della sua forza e abbatte\\n",
  "i nemici senza usare tossine.$",
]

[msg.section_0.entries.453]
text = [
  "Combatte spesso slealmente, ma lo fa per\\n",
  "sopravvivere. È molto apprezzato come\\n",
  "mascotte.$",
]

[msg.section_0.entries.454]
text = [
  "Ha una sacca di veleno sulla gola. Quando\\n",
  "gracida il veleno si rimescola, diventando\\n",
  "più efficace.$",
]

[msg.section_0.entries.455]
text = [
  "Si attacca agli alberi nelle paludi.\\n",
  "Attrae le prede con il dolce aroma della\\n",
  "saliva e poi le ingoia.$",
]

[msg.section_0.entries.456]
text = [
  "La linea che contorna il suo corpo\\n",
  "immagazzina la luce solare. Di notte\\n",
  "si illumina di una luce splendente.$",
]

[msg.section_0.entries.457]
text = [
  "Si sposta sui fondali con le lunghe pinne\\n",
  "anteriori. Lanturn è suo rivale nella\\n",
  "ricerca del cibo.$",
]

[msg.section_0.entries.458]
text = [
  "Vengono organizzate escursioni per\\n",
  "vedere questo Pokémon giocare in\\n",
  "mezzo alle onde con Remoraid.$",
]

[msg.section_0.entries.459]
text = [
  "Gli uomini lo incuriosiscono molto. Si\\n",
  "raduna in gruppi attorno alle impronte\\n",
  "sulle montagne innevate.$",
]

[msg.section_0.entries.460]
text = [
  "Appare quando sbocciano i fiori invernali.\\n",
  "Quando i petali cadono si ritira in luoghi\\n",
  "sconosciuti.$",
]

[msg.section_0.entries.461]
text = [
  "L'evoluzione lo ha reso ancora più\\n",
  "subdolo. Comunica incidendo segni\\n",
  "nei massi.$",
]

[msg.section_0.entries.462]
text = [
  "Alcuni hanno provato a farlo evolvere\\n",
  "artificialmente, ma l'esperimento non\\n",
  "è andato a buon fine.$",
]

[msg.section_0.entries.463]
text = [
  "La sua lunga lingua è sempre umida.\\n",
  "La saliva contiene un solvente che\\n",
  "causa intorpidimento.$",
]

[msg.section_0.entries.464]
text = [
  "Può gettare una roccia che tiene in\\n",
  "mano come un missile contraendo ed\\n",
  "estendendo velocemente i muscoli.$",
]

[msg.section_0.entries.465]
text = [
  "I suoi arti sono composti da liane che\\n",
  "si avvinghiano agli oggetti. Se tagliati\\n",
  "ricrescono subito.$",
]

[msg.section_0.entries.466]
text = [
  "Incurante degli attacchi nemici, si\\n",
  "avvicina, tocca il nemico con le code e\\n",
  "rilascia una scarica elettrica.$",
]

[msg.section_0.entries.467]
text = [
  "Spara palle di fuoco di oltre 2000°C e\\n",
  "il corpo assume una tinta bianca a causa\\n",
  "del calore intenso.$",
]

[msg.section_0.entries.468]
text = [
  "La sua natura lo rende affine alle\\n",
  "persone che rispettano i diritti altrui\\n",
  "ed evitano conflitti inutili.$",
]

[msg.section_0.entries.469]
text = [
  "La forza della sua mascella è incredibile.\\n",
  "Trancia i nemici mentre vola\\n",
  "a grande velocità.$",
]

[msg.section_0.entries.470]
text = [
  "Rifugge le lotte. Ha una struttura\\n",
  "cellulare simile a quella delle piante,\\n",
  "perciò usa la fotosintesi.$",
]

[msg.section_0.entries.471]
text = [
  "Modificando la temperatura del corpo,\\n",
  "congela l'aria e crea folate di cristalli\\n",
  "di ghiaccio.$",
]

[msg.section_0.entries.472]
text = [
  "Se incontra una corrente d'aria, anche\\n",
  "debole, riesce a sorvolare il globo senza\\n",
  "mai sbattere le ali.$",
]

[msg.section_0.entries.473]
text = [
  "Un esemplare congelato risalente a\\n",
  "10.000 anni fa si è risvegliato tra\\n",
  "lo stupore generale.$",
]

[msg.section_0.entries.474]
text = [
  "È stato riprogrammato per il lavoro in\\n",
  "dimensioni sconosciute, ma pare non\\n",
  "funzionare correttamente.$",
]

[msg.section_0.entries.475]
text = [
  "Quando protegge qualcuno estende\\n",
  "i gomiti come se fossero spade e\\n",
  "combatte furiosamente.$",
]

[msg.section_0.entries.476]
text = [
  "Controlla tre piccole unità, dette\\n",
  "Mininasi, usando la forza magnetica.$",
]

[msg.section_0.entries.477]
text = [
  "Si dice che accolga gli spiriti smarriti\\n",
  "nel suo corpo flessibile per riportarli\\n",
  "a casa.$",
]

[msg.section_0.entries.478]
text = [
  "Congela le prede con un alito glaciale\\n",
  "a -50°C. Si dice che poi le metta\\n",
  "segretamente in mostra.$",
]

[msg.section_0.entries.479]
text = [
  "Il suo corpo elettrico può introdursi\\n",
  "in alcuni apparecchi, prendendone\\n",
  "il controllo e creando caos.$",
]

[msg.section_0.entries.480]
text = [
  "Al volo di Uxie, gli uomini impararono\\n",
  "a risolvere i problemi. In tal modo\\n",
  "nacque la conoscenza.$",
]

[msg.section_0.entries.481]
text = [
  "Al volo di Mesprit, gli uomini conobbero\\n",
  "le gioie e i dolori della vita. In tal modo\\n",
  "nacquero le emozioni.$",
]

[msg.section_0.entries.482]
text = [
  "Al volo di Azelf, gli uomini impararono\\n",
  "la determinazione nelle azioni. In tal\\n",
  "modo nacque la volontà.$",
]

[msg.section_0.entries.483]
text = [
  "Pokémon leggendario della regione di\\n",
  "Sinnoh. Si dice che il tempo scorra al\\n",
  "battere del suo cuore.$",
]

[msg.section_0.entries.484]
text = [
  "Pokémon leggendario della regione di\\n",
  "Sinnoh. Si dice che lo spazio diventi\\n",
  "più stabile al suo respiro.$",
]

[msg.section_0.entries.485]
text = [
  "Il suo corpo è fatto d'acciaio. Tuttavia,\\n",
  "in alcune parti è sciolto a causa del suo\\n",
  "stesso calore.$",
]

[msg.section_0.entries.486]
text = [
  "Si dice che abbia creato dei Pokémon\\n",
  "simili a sé usando una montagna\\n",
  "ghiacciata, rocce e magma.$",
]

[msg.section_0.entries.487]
text = [
  "È stato bandito per la sua violenza.\\n",
  "Osserva il vecchio mondo in silenzio\\n",
  "dal Mondo Distorto.$",
]

[msg.section_0.entries.488]
text = [
  "Nelle notti di quarto di luna, l'aurora\\n",
  "della sua coda si spande e ondeggia\\n",
  "in modo splendido.$",
]

[msg.section_0.entries.489]
text = [
  "Si sposta nei mari caldi. Torna sempre\\n",
  "dove è nato, anche se si trova molto\\n",
  "lontano.$",
]

[msg.section_0.entries.490]
text = [
  "Dispone di un potere innato che lo fa\\n",
  "legare con qualsiasi specie di Pokémon.$",
]

[msg.section_0.entries.491]
text = [
  "Per proteggersi, riempie di incubi\\n",
  "la mente di chi gli sta intorno.\\n",
  "Tuttavia, non è di indole malvagia.$",
]

[msg.section_0.entries.492]
text = [
  "I fiori che lo ricoprono sbocciano se\\n",
  "viene abbracciato con affetto e\\n",
  "si sente apprezzato.$",
]

[msg.section_0.entries.493]
text = [
  "Si dice che sia nato da un uovo in mezzo\\n",
  "al nulla e che poi abbia dato origine\\n",
  "al mondo.$",
]

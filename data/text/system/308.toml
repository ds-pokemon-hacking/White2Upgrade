[msg.section_0.entries.0]
text = [
  "Director: OK! Ees not bad!$",
]

[msg.section_0.entries.1]
text = [
  "Director: Not bad...\\n",
  "But, zat was not so cool, hein?$",
]

[msg.section_0.entries.2]
text = [
  "Director: Concentrate on your acting!\\n",
  "Zees ees a film for everyone, not you!$",
]

[msg.section_0.entries.3]
text = [
  "Director: Relax! You must relax!$",
]

[msg.section_0.entries.4]
text = [
  "Director: Be confident!\\n",
  "Smile! I want ze big smile!$",
]

[msg.section_0.entries.5]
text = [
  "Director: Make ze eyes more intense!\\n",
  "Like you're shooting ze beams from zem!$",
]

[msg.section_0.entries.6]
text = [
  "Director: Tre bien!\\n",
  "Ze line, she was so nice!$",
]

[msg.section_0.entries.7]
text = [
  "Director: OK...\\n",
  "Ze line, she was nothing special...$",
]

[msg.section_0.entries.8]
text = [
  "Director: Non! Non!\\n",
  "Now, what was zat line supposed to be?$",
]

[msg.section_0.entries.9]
text = [
  "Director: Hurry and finish!\\n",
  "Ze camera, she ees crying!$",
]

[msg.section_0.entries.10]
text = [
  "Director: Fantastique!\\n",
  "Your work was so excellent!$",
]

[msg.section_0.entries.11]
text = [
  "Director: Enough!\\n",
  "Fini!$",
]

[msg.section_0.entries.12]
text = [
  "Director: Oh, why?\\n",
  "What kind of movie will zees be?$",
]

[msg.section_0.entries.13]
text = [
  "Director: Checking ze script\\n",
  "ees one of ze basics of acting.$",
]

[msg.section_0.entries.14]
text = [
  "Director: Check ze script!\\n",
  "She's full of hints!$",
]

[msg.section_0.entries.15]
text = [
  "Director: Ze performance\\n",
  "was fantastique! Encore!$",
]

[msg.section_0.entries.16]
text = [
  "Director: Ees so nice!$",
]

[msg.section_0.entries.17]
text = [
  "Director: Ees not bad!\\n",
  "Your smile ees very cute!$",
]

[msg.section_0.entries.18]
text = [
  "Director: Your face ees charming, no?\\n",
  "Ze people will fall head over heels for you!$",
]

[msg.section_0.entries.19]
text = [
  "Director: Zat was so nice!\\n",
  "Cool! So cool!$",
]

[msg.section_0.entries.20]
text = [
  "Director: Hmm... I see...\\n",
  "Zat's your style, hein?$",
]

[msg.section_0.entries.21]
text = [
  "Director: Excellent!\\n",
  "Zat line, she was excellent!$",
]

[msg.section_0.entries.22]
text = [
  "Director: Nice!\\n",
  "Zat was a nice line!$",
]

[msg.section_0.entries.23]
text = [
  "Director: Non...\\n",
  "Zat line was terrible!$",
]

[msg.section_0.entries.24]
text = [
  "Director: You must finish\\n",
  "ze acting now!$",
]

[msg.section_0.entries.25]
text = [
  "Director: Magnifique!\\n",
  "Impressive! Tres bien!$",
]

[msg.section_0.entries.26]
text = [
  "Director: Non! Zees ees no good!\\n",
  "Ees not like you, hein?$",
]

[msg.section_0.entries.27]
text = [
  "Director: Oh why, oh why?\\n",
  "What kind of film will zees be?$",
]

[msg.section_0.entries.28]
text = [
  "Director: Are you finished\\n",
  "checking ze script?$",
]

[msg.section_0.entries.29]
text = [
  "Director: Even if you already know it,\\n",
  "checking ze script ees professional, no?$",
]

[msg.section_0.entries.30]
text = [
  "Director: Brilliant!\\n",
  "You are ze shining star, no?$",
]

[msg.section_0.entries.31]
text = [
  "Director: Magnifique!\\n",
  "You are magnifique!$",
]

[msg.section_0.entries.32]
text = [
  "Director: You are truly one of a kind, no?$",
]

[msg.section_0.entries.33]
text = [
  "Director: Amazing work!\\n",
  "You, you are ze brightest star ever!$",
]

[msg.section_0.entries.34]
text = [
  "Director: Elegant!\\n",
  "I am--how you say--moved!$",
]

[msg.section_0.entries.35]
text = [
  "Director: Ees OK!\\n",
  "Be confident!$",
]

[msg.section_0.entries.36]
text = [
  "Director: Cool!\\n",
  "Zat line, she ees so cool!$",
]

[msg.section_0.entries.37]
text = [
  "Director: Zat line?\\n",
  "Ees zat line, OK?$",
]

[msg.section_0.entries.38]
text = [
  "Director: Could zees be a mistake?\\n",
  "Ze lines, zey are important, no?$",
]

[msg.section_0.entries.39]
text = [
  "Director: You must get ze end\\n",
  "of ze film perfect!$",
]

[msg.section_0.entries.40]
text = [
  "Director: Perfect!\\n",
  "Now, you are truly a star!$",
]

[msg.section_0.entries.41]
text = [
  "Director: It ees missing something, no?\\n",
  "How will ze fans respond?$",
]

[msg.section_0.entries.42]
text = [
  "Director: Incroyable...\\n",
  "Ze film, she ees so strange!$",
]

[msg.section_0.entries.43]
text = [
  "Director: Did you look at ze scenario?\\n",
  "It ees written for your sake, hein?$",
]

[msg.section_0.entries.44]
text = [
  "Director: Do you like ze script?$",
]

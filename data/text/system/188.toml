[msg]
trailing_data = "e0e0"

[msg.section_0.entries.0]
text = [
  "Movie Star$",
]

[msg.section_0.entries.1]
text = [
  "World Police$",
]

[msg.section_0.entries.2]
text = [
  "Mecha Cop: Code name, Mecha Cop!\\n",
  "Séquence d'activation... Action!$",
]

[msg.section_0.entries.3]
text = [
  "The [VAR PKNICK(0)] Ninja: Mecha Cop...\\n",
  "He has been modified into a cyborg...\\l\\n",
  "Is he a secret agent for the World Police?!$",
]

[msg.section_0.entries.4]
text = [
  "Mecha Cop: I won't allow a villain like you\\n",
  "to have the dynamatronic engine!$",
]

[msg.section_0.entries.5]
text = [
  "The [VAR PKNICK(0)] Ninja: Ughh!\\n",
  "Without thinking about the surroundings...\\l\\n",
  "What an attack!$",
]

[msg.section_0.entries.6]
text = [
  "Mecha Cop: Found an intruder.\\n",
  "Verifying its biometrics...$",
]

[msg.section_0.entries.7]
text = [
  "The [VAR PKNICK(0)] Ninja: Is that...\\n",
  "a security robot?$",
]

[msg.section_0.entries.8]
text = [
  "Mecha Cop: Verification complete.\\c\\n",
  "The serial robber,\\n",
  "the [VAR PKNICK(0)] Ninja.\\l\\n",
  "Surrender!$",
]

[msg.section_0.entries.9]
text = [
  "The [VAR PKNICK(0)] Ninja: ...!\\n",
  "It's a human cop!\\c\\n",
  "Is his entire body reinforced by\\n",
  "mechanics?$",
]

[msg.section_0.entries.10]
text = [
  "Mecha Cop: You showed resistance...\\n",
  "I'll regard it as hostile behavior!\\c\\n",
  "The handcuff launcher!\\n",
  "Apunten, ¡fuego!$",
]

[msg.section_0.entries.11]
text = [
  "The [VAR PKNICK(0)] Ninja: Whoa!\\n",
  "All of a sudden, what did you do?$",
]

[msg.section_0.entries.12]
text = [
  "Mecha Cop: I don't tolerate crimes.\\n",
  "I'll bring you under control by force!$",
]

[msg.section_0.entries.13]
text = [
  "The [VAR PKNICK(0)] Ninja: What?!\\n",
  "I only use Pokémon for stealing,\\l\\n",
  "but you use weapons like that!\\l\\n",
  "It's not fair!$",
]

[msg.section_0.entries.14]
text = [
  "Mecha Cop: Hmm... I see.\\n",
  "My justice will be tainted\\l\\n",
  "if a villain criticizes me.\\c\\n",
  "In this situation, I should use Pokémon\\n",
  "and arrest him.$",
]

[msg.section_0.entries.15]
text = [
  "The [VAR PKNICK(0)] Ninja: Such a...\\n",
  "violent cop...$",
]

[msg.section_0.entries.16]
text = [
  "The [VAR PKNICK(0)] Ninja: I won't lose!$",
]

[msg.section_0.entries.17]
text = [
  "Mecha Cop: There's no room for negotiation\\n",
  "with the [VAR PKNICK(0)] Ninja.\\c\\n",
  "Frontalangriff!$",
]

[msg.section_0.entries.18]
text = [
  "The [VAR PKNICK(0)] Ninja: I'll surrender.$",
]

[msg.section_0.entries.19]
text = [
  "Mecha Cop: Whaat?!\\n",
  "It's an unexpected response...\\c\\n",
  "Uh... A system error?!$",
]

[msg.section_0.entries.20]
text = [
  "The [VAR PKNICK(0)] Ninja: Is your Pokémon\\n",
  "a match for my Pokémon?$",
]

[msg.section_0.entries.21]
text = [
  "Mecha Cop: Stai zitto!\\n",
  "Justice prevails--good over evil!$",
]

[msg.section_0.entries.22]
text = [
  "The [VAR PKNICK(0)] Ninja: (...Hmph!\\n",
  "I'm not such a fool to go head-to-head\\l\\n",
  "with you...)\\c\\n",
  "(...I'll wait for an opportunity\\n",
  "and escape...)$",
]

[msg.section_0.entries.23]
text = [
  "Mecha Cop: The [VAR PKNICK(0)] Ninja!\\c\\n",
  "I'll make sure to put you in jail\\n",
  "and make you pay for your crimes!$",
]

[msg.section_0.entries.24]
text = [
  "The [VAR PKNICK(0)] Ninja: Try it!$",
]

[msg.section_0.entries.25]
text = [
  "The [VAR PKNICK(0)] Ninja: Wait!\\n",
  "I'll quit being a thief.\\l\\n",
  "So, give me some slack!$",
]

[msg.section_0.entries.26]
text = [
  "Mecha Cop: Mmmm...$",
]

[msg.section_0.entries.27]
text = [
  "The [VAR PKNICK(0)] Ninja: (...Hmph!\\n",
  "Champion of justice.\\l\\n",
  "You're letting your guard down...)\\c\\n",
  "(...I'll wait for an opportunity\\n",
  "and make you into scrap!...)$",
]

[msg.section_0.entries.28]
text = [
  "Mecha Cop: Lo siento mucho.\\n",
  "The data of your breathing and heart rate\\l\\n",
  "shows that what you said just now\\l\\n",
  "was a lie.\\c\\n",
  "Your punishment will be severe!$",
]

[msg.section_0.entries.29]
text = [
  "The [VAR PKNICK(0)] Ninja: !!$",
]

[msg.section_0.entries.30]
text = [
  "The [VAR PKNICK(0)] Ninja: Ughh!\\c\\n",
  "Arggghhhhh!$",
]

[msg.section_0.entries.31]
text = [
  "Mecha Cop: Mission accomplie.\\c\\n",
  "[VAR PKNICK(0)] Ninja,\\n",
  "you didn't lose to me.\\c\\n",
  "You were defeated by law and justice!$",
]

[msg.section_0.entries.32]
text = [
  "The [VAR PKNICK(0)] Ninja: Argh!\\n",
  "I lost to such a scrap cop...$",
]

[msg.section_0.entries.33]
text = [
  "The self-proclaimed great thief,\\n",
  "the [VAR PKNICK(0)] Ninja,\\l\\n",
  "was sent to jail by Mecha Cop.\\c\\n",
  "As long as there is justice in this world,\\n",
  "evil won't prosper!\\c\\n",
  "Take control, Mecha Cop!\\n",
  "No mercy, World Police!$",
]

[msg.section_0.entries.34]
text = [
  "Mecha Cop: Ugh.\\n",
  "I'm disappointed in myself...$",
]

[msg.section_0.entries.35]
text = [
  "The [VAR PKNICK(0)] Ninja: Hmph!\\n",
  "I don't know if you're a secret agent\\l\\n",
  "or whatever.\\l\\n",
  "You're nothing.\\c\\n",
  "This dynamatronic engine is mine!\\n",
  "See ya!$",
]

[msg.section_0.entries.36]
text = [
  "Mecha Cop: Halt! Warte!\\n",
  "[VAR PKNICK(0)] Ninja!\\c\\n",
  "Ugh! Smoke that makes\\n",
  "radar malfunction?$",
]

[msg.section_0.entries.37]
text = [
  "The [VAR PKNICK(0)] Ninja: Mecha Cop!\\n",
  "You'll regret that you couldn't catch me\\l\\n",
  "for the rest of your life!$",
]

[msg.section_0.entries.38]
text = [
  "Mecha Cop: The [VAR PKNICK(0)] Ninja!$",
]

[msg.section_0.entries.39]
text = [
  "The self-proclaimed thief of the century,\\n",
  "the [VAR PKNICK(0)] Ninja,\\l\\n",
  "disappeared in the veil of darkness\\l\\n",
  "with a daring parting remark.$",
]

[msg.section_0.entries.40]
text = [
  "Then, a few years later...\\c\\n",
  "The [VAR PKNICK(0)] Ninja abused the\\n",
  "dynamatronic engine and made a fortune.\\c\\n",
  "He became a big shot and is now untouchable,\\n",
  "even by the World Police...\\c\\n",
  "You must be frustrated, Mecha Cop!\\n",
  "The power of money is frightening!$",
]

[msg.section_0.entries.41]
text = [
  "The [VAR PKNICK(0)] Ninja: What?!\\n",
  "What is this sound? Is this a siren?$",
]

[msg.section_0.entries.42]
text = [
  "Mecha Cop: Oh no. This is not good!$",
]

[msg.section_0.entries.43]
text = [
  "The [VAR PKNICK(0)] Ninja: Mecha Cop!\\n",
  "What's this? Answer me!$",
]

[msg.section_0.entries.44]
text = [
  "Mecha Cop: In this lab,\\n",
  "when an intruder is found\\l\\n",
  "and a certain amount of time passes,\\l\\n",
  "the Destroyer Security System\\l\\n",
  "is activated.\\l\\n",
  "It attacks every moving thing\\l\\n",
  "without discrimination!$",
]

[msg.section_0.entries.45]
text = [
  "The [VAR PKNICK(0)] Ninja: What?!\\n",
  "Destro... What?$",
]

[msg.section_0.entries.46]
text = [
  "Mecha Cop: Non! Non!\\n",
  "Destroyer Security System!$",
]

[msg.section_0.entries.47]
text = [
  "The [VAR PKNICK(0)] Ninja: Is that...?\\n",
  "Whoa! What is this?!\\l\\n",
  "Laser? H-hot!\\c\\n",
  "Stop! Help!\\n",
  "Police!$",
]

[msg.section_0.entries.48]
text = [
  "Mecha Cop: Whoa! Stop!\\n",
  "Destroyer Security System!\\l\\n",
  "I'm a member of the World Police...$",
]

[msg.section_0.entries.49]
text = [
  "Thus...\\c\\n",
  "Thanks to the Destroyer Security System,\\n",
  "the dynamatronic engine was freed\\l\\n",
  "from the evil hands of the self-proclaimed\\l\\n",
  "thief of the century, the [VAR PKNICK(0)] Ninja.\\c\\n",
  "Cheers!\\n",
  "Keep up the good work,\\l\\n",
  "Destroyer Security System!$",
]

[msg.section_0.entries.50]
text = [
  "Mecha Cop: Aww.\\n",
  "I lost...\\l\\n",
  "to such a sneaky thief...$",
]

[msg.section_0.entries.51]
text = [
  "The [VAR PKNICK(0)] Ninja: Hmph!\\n",
  "Law? Justice?\\l\\n",
  "I don't care!\\c\\n",
  "I'll do whatever\\n",
  "to win and escape!\\c\\n",
  "That's my justice!\\c\\n",
  "If you have a problem with that,\\n",
  "try to catch me!$",
]

[msg.section_0.entries.52]
text = [
  "Mecha Cop: Halt! Stehen geblieben!\\n",
  "[VAR PKNICK(0)] Ninja!\\c\\n",
  "Oh! This is...a bomb?!$",
]

[msg.section_0.entries.53]
text = [
  "The [VAR PKNICK(0)] Ninja: Heh he he.\\c\\n",
  "Blow up with the dynamatronic engine,\\n",
  "Mecha Cop!$",
]

[msg.section_0.entries.54]
text = [
  "Mecha Cop: You!\\n",
  "I won't forgive you, [VAR PKNICK(0)] Ninja...$",
]

[msg.section_0.entries.55]
text = [
  "The self-proclaimed thief of the century,\\n",
  "the [VAR PKNICK(0)] Ninja,\\l\\n",
  "disappeared with the explosion.\\c\\n",
  "Thanks to his alloy coat,\\n",
  "Mecha Cop was safe,\\l\\n",
  "but he was so ashamed of\\l\\n",
  "letting the thief get away\\l\\n",
  "that he looked up at the night sky\\l\\n",
  "and wiped his tears...\\c\\n",
  "Don't give up, Mecha Cop!\\n",
  "Such is life!$",
]

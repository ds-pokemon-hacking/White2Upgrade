[msg.section_0.entries.0]
text = [
  "A-list Actor$",
]

[msg.section_0.entries.1]
text = [
  "Cute Trainer$",
]

[msg.section_0.entries.2]
text = [
  "[VAR TRNAME(1)]: Phew...\\n",
  "This is why you're an Ace Trainer, isn't it.\\l\\n",
  "I'm out of breath...$",
]

[msg.section_0.entries.3]
text = [
  "Miguel: Y-you OK?\\n",
  "(...If I don't hurry up and end this...)$",
]

[msg.section_0.entries.4]
text = [
  "Smeargle: Argle! Arg arg!\\c\\n",
  "(...Hmph. What's going on with\\n",
  "this oaf-boy and oaf-ette here?...)\\c\\n",
  "C'mon! Miguel!\\n",
  "Let's work together.\\l\\n",
  "Grab her prize money,\\l\\n",
  "and get out of here!$",
]

[msg.section_0.entries.5]
text = [
  "[VAR TRNAME(1)]: H-hello...\\n",
  "Our eyes met, didn't they...$",
]

[msg.section_0.entries.6]
text = [
  "Miguel: N-nice to meet you.\\c\\n",
  "I guess so...\\n",
  "Our eyes did meet...\\c\\n",
  "(...Wow... She's too much...\\n",
  "Holy cow! She's cute!...)$",
]

[msg.section_0.entries.7]
text = [
  "[VAR TRNAME(1)]'s [VAR PKNICK(0)]: ...$",
]

[msg.section_0.entries.8]
text = [
  "Smeargle: Arg!\\c\\n",
  "(...All right, then! Prepare yourself!...)$",
]

[msg.section_0.entries.9]
text = [
  "[VAR TRNAME(1)]: Wow...\\n",
  "It sure looks like your Smeargle\\l\\n",
  "is raring to go!$",
]

[msg.section_0.entries.10]
text = [
  "Miguel: Ha ha... I guess it is...\\c\\n",
  "(...Hey! Smeargle!! Don't butt in!...)$",
]

[msg.section_0.entries.11]
text = [
  "[VAR TRNAME(1)]: Shall we?$",
]

[msg.section_0.entries.12]
text = [
  "[VAR TRNAME(1)]: Take it easy on me...$",
]

[msg.section_0.entries.13]
text = [
  "Miguel: I should ask you to\\n",
  "take it easy on me as well!\\c\\n",
  "(...She has to be younger,\\n",
  "but she's such an elegant lady!...)\\c\\n",
  "(...Oh... Wow... This is too much.\\n",
  "That makes her even more my type!...)$",
]

[msg.section_0.entries.14]
text = [
  "[VAR TRNAME(1)]: Prepare yourself!$",
]

[msg.section_0.entries.15]
text = [
  "Miguel: Ha ha ha...\\n",
  "You're quite confident in your abilities.\\c\\n",
  "(...Saying something like that\\n",
  "to me, an Ace Trainer...)\\c\\n",
  "(...That's kinda arrogant, but\\n",
  "that aggressiveness is cute, too...)$",
]

[msg.section_0.entries.16]
text = [
  "[VAR TRNAME(1)]: I'm gonna win!$",
]

[msg.section_0.entries.17]
text = [
  "Miguel: Hmph... If you can!\\c\\n",
  "(...Listen up, Smeargle!\\n",
  "No funny business!...)\\c\\n",
  "(...For now, we're just going\\n",
  "to watch how she battles!...)$",
]

[msg.section_0.entries.18]
text = [
  "Smeargle: Arg! Argle!\\c\\n",
  "(...What? Miguel!!...)\\c\\n",
  "(...Why do I have to use that move?\\n",
  "Let me split 'em in half with\\l\\n",
  "my amazing Guillotine move!...)$",
]

[msg.section_0.entries.19]
text = [
  "[VAR TRNAME(1)]: That Smeargle...\\n",
  "It's so lively and wonderful...\\c\\n",
  "And it looks pretty strong, too.\\n",
  "You must have raised it with a lot\\l\\n",
  "of love...$",
]

[msg.section_0.entries.20]
text = [
  "Miguel: Ha ha... Thanks, but that's normal\\n",
  "for Ace Trainers.\\c\\n",
  "Your [VAR PKNICK(0)]\\n",
  "is also quite lovely!\\c\\n",
  "(...Heh heh heh. Wonderful, huh?\\n",
  "Say that about me! C'mon!...)$",
]

[msg.section_0.entries.21]
text = [
  "[VAR TRNAME(1)]: Th-thank you...\\c\\n",
  "I know you're talking about [VAR PKNICK(0)],\\n",
  "but it almost feels like it's about me...$",
]

[msg.section_0.entries.22]
text = [
  "Miguel: It's absolutely wonderful...\\n",
  "[VAR PKNICK(0)]...and so are you...\\c\\n",
  "(...Whoops! I actually said that! But, her\\n",
  "face is so cute when she's being shy!...)$",
]

[msg.section_0.entries.23]
text = [
  "[VAR TRNAME(1)]: What?$",
]

[msg.section_0.entries.24]
text = [
  "Miguel: Ex-excuse me!\\c\\n",
  "(...Oh no... Now I've done it...\\n",
  "That would drive someone off...)$",
]

[msg.section_0.entries.25]
text = [
  "[VAR TRNAME(1)]: That's sweet...$",
]

[msg.section_0.entries.26]
text = [
  "Miguel: Ah... OK! OK!\\n",
  "Now we're having a Pokémon battle!\\l\\n",
  "Let's focus!\\c\\n",
  "(...OK! I've decided!\\n",
  "I'm going to throw this match!...)\\c\\n",
  "(...I'll make her look good and immediately\\n",
  "praise her strength!...)\\c\\n",
  "(...I'll shower her with a deluge\\n",
  "of compliments! This should work!...)$",
]

[msg.section_0.entries.27]
text = [
  "[VAR TRNAME(1)]: ...$",
]

[msg.section_0.entries.28]
text = [
  "Miguel: Um! OK!\\c\\n",
  "Never mind! Let's just forget about that\\n",
  "and get back to battling!\\c\\n",
  "(...Aahhh...\\n",
  "She's completely freaked out...)$",
]

[msg.section_0.entries.29]
text = [
  "Smeargle: Argle argle!\\c\\n",
  "(...Oh for pete's sake!...)\\c\\n",
  "(...Miguel's fallen in love with a Trainer\\n",
  "at first sight again...)\\c\\n",
  "(...And what's more, it looks like he plans\\n",
  "to throw the match...\\l\\n",
  "Hmph... I won't have it!...)$",
]

[msg.section_0.entries.30]
text = [
  "[VAR TRNAME(1)]: Impressive...\\c\\n",
  "Your Smeargle is really strong, Miguel...$",
]

[msg.section_0.entries.31]
text = [
  "Smeargle: Meargle! Smeargle!\\c\\n",
  "(...Yeah! Of course I am!\\n",
  "Now, let me finish this!...)$",
]

[msg.section_0.entries.32]
text = [
  "[VAR TRNAME(1)]: Sigh...\\n",
  "My [VAR PKNICK(0)] just isn't enough...$",
]

[msg.section_0.entries.33]
text = [
  "Miguel: That's not true at all!\\n",
  "Your [VAR PKNICK(0)] is a\\l\\n",
  "truly intense opponent, [VAR TRNAME(1)]!\\l\\n",
  "This is where the battle really begins!\\c\\n",
  "(...Hey! Smeargle!\\n",
  "Settle down!...)$",
]

[msg.section_0.entries.34]
text = [
  "[VAR TRNAME(1)]: I'll do my best!$",
]

[msg.section_0.entries.35]
text = [
  "Miguel: OK! Here we go!\\c\\n",
  "(...Hey! You know what's going on, right?\\n",
  "Lose, but don't let her know\\l\\n",
  "it's on purpose! Got it, Smeargle?!...)$",
]

[msg.section_0.entries.36]
text = [
  "[VAR TRNAME(1)]: Doesn't look good...$",
]

[msg.section_0.entries.37]
text = [
  "Miguel: You can do it!\\n",
  "If anyone can, it's you, [VAR TRNAME(1)]!\\l\\n",
  "I know you can!\\l\\n",
  "If you give up, you'll never win!\\c\\n",
  "(...What gives?! Smeargle!!\\n",
  "Don't just use any old move you want to!...)$",
]

[msg.section_0.entries.38]
text = [
  "[VAR TRNAME(1)]: Phew...\\n",
  "I did it... I won...$",
]

[msg.section_0.entries.39]
text = [
  "Smeargle: Arg! Argle!\\c\\n",
  "(...Whaa! Why?\\n",
  "Why do I have to lose to\\l\\n",
  "an opponent like this?\\l\\n",
  "Miguel! What's this supposed to mean?...)$",
]

[msg.section_0.entries.40]
text = [
  "Miguel: Tch... I blew it...\\c\\n",
  "(...All right! I lost for real!\\n",
  "OK! Now is the beginning\\l\\n",
  "of my real battle!...)$",
]

[msg.section_0.entries.41]
text = [
  "[VAR TRNAME(1)]: Um...\\n",
  "Are you OK?\\c\\n",
  "[VAR PKNICK(0)]'s move didn't hit\\n",
  "you, did it?$",
]

[msg.section_0.entries.42]
text = [
  "Miguel: What? Oh, I'm fine...\\c\\n",
  "Still, [VAR TRNAME(1)]...\\n",
  "You're really good!\\c\\n",
  "(...All right! Here we go!...)$",
]

[msg.section_0.entries.43]
text = [
  "[VAR TRNAME(1)]: Thank you very much.\\c\\n",
  "But, I'm so ashamed that I\\n",
  "hurt you, Miguel!$",
]

[msg.section_0.entries.44]
text = [
  "Miguel: Don't worry about it!\\c\\n",
  "(...Yes! It's finally come!\\n",
  "A chance for love!\\l\\n",
  "Go, Miguel!!...)$",
]

[msg.section_0.entries.45]
text = [
  "[VAR TRNAME(1)]: Oh...\\n",
  "How can I make this up to you...$",
]

[msg.section_0.entries.46]
text = [
  "Miguel: Don't worry about it!\\c\\n",
  "More importantly, I lost. That means I have\\n",
  "to give you your prize money, [VAR TRNAME(1)]...\\c\\n",
  "(...OK! Come on!...)$",
]

[msg.section_0.entries.47]
text = [
  "[VAR TRNAME(1)]: I can't...\\n",
  "I feel too bad, Miguel.\\l\\n",
  "I can't accept prize money from you...$",
]

[msg.section_0.entries.48]
text = [
  "Miguel: That's no good.\\c\\n",
  "Well, if that's the case, instead of\\n",
  "me giving you prize money,\\l\\n",
  "how about we train together?\\c\\n",
  "I may have lost this time,\\n",
  "but I'm an Ace Trainer...\\c\\n",
  "I'm sure I can help\\n",
  "you out somehow, [VAR TRNAME(1)].\\c\\n",
  "(...OK! Everything is going smoothly!\\n",
  "It's perfect! Absolutely perfect!...)$",
]

[msg.section_0.entries.49]
text = [
  "[VAR TRNAME(1)]: You don't mind?\\c\\n",
  "I'd be honored to train\\n",
  "with an Ace Trainer...$",
]

[msg.section_0.entries.50]
text = [
  "Miguel: No! Of course not!\\n",
  "(...Yeeeeeeeeeeeeees!...)$",
]

[msg.section_0.entries.51]
text = [
  "[VAR TRNAME(1)]: OK, then.\\n",
  "I look forward to training with you!$",
]

[msg.section_0.entries.52]
text = [
  "Miguel: Me, too!\\n",
  "I'll make a fun training program!\\c\\n",
  "(...I did it! Woo-hoo!\\n",
  "I won! I'm the winner!...)$",
]

[msg.section_0.entries.53]
text = [
  "Smeargle: Arg... Arg...\\c\\n",
  "(...Miguel...that's just pathetic...)\\c\\n",
  "(...Well, I suppose...)\\c\\n",
  "(...Humans are just at this level...)$",
]

[msg.section_0.entries.54]
text = [
  "...If eyes meet, a Pokémon\\n",
  "battle bursts into bloom.\\c\\n",
  "If eyes meet, sometimes\\n",
  "love will blossom as well.\\c\\n",
  "For young Trainers,\\n",
  "Pokémon battles are not\\l\\n",
  "simple competitions.\\c\\n",
  "They are also a way to meet others...\\c\\n",
  "This is how love blossoms and\\n",
  "fades between Trainers each day...$",
]

[msg.section_0.entries.55]
text = [
  "[VAR TRNAME(1)]: I lost...\\n",
  "That is why you're an Ace Trainer...$",
]

[msg.section_0.entries.56]
text = [
  "Miguel: Oh! No...\\c\\n",
  "(...Hey! Smeargle!\\n",
  "What have you done!...)$",
]

[msg.section_0.entries.57]
text = [
  "Smeargle: Mear! Meargle meargle!\\c\\n",
  "(...This is what I can really do!\\n",
  "I'm not going to lose to\\l\\n",
  "some mediocre Trainer like her!...)$",
]

[msg.section_0.entries.58]
text = [
  "[VAR TRNAME(1)]: Thank you...\\c\\n",
  "Sigh...\\n",
  "Guess I still have a ways to go...$",
]

[msg.section_0.entries.59]
text = [
  "Miguel: That's not true!\\n",
  "That was a good battle, [VAR TRNAME(1)]!$",
]

[msg.section_0.entries.60]
text = [
  "[VAR TRNAME(1)]: Hee hee...\\c\\n",
  "You don't have to cheer me up.\\n",
  "I'm OK.\\c\\n",
  "I'm going to go home\\n",
  "and train a little bit.$",
]

[msg.section_0.entries.61]
text = [
  "Miguel: What?\\c\\n",
  "If that's the case,\\n",
  "why don't you train with me?$",
]

[msg.section_0.entries.62]
text = [
  "[VAR TRNAME(1)]: Oh no...\\c\\n",
  "I couldn't ask an Ace Trainer\\n",
  "like you something like that.\\c\\n",
  "If you'll excuse me...$",
]

[msg.section_0.entries.63]
text = [
  "Miguel: Oh... No...\\n",
  "My excitement...\\l\\n",
  "My romance is gone...\\c\\n",
  "Hey! Smeargle!\\n",
  "What did you do that for?\\c\\n",
  "You and I are through!\\n",
  "I'm going to trade you away!$",
]

[msg.section_0.entries.64]
text = [
  "...If eyes meet, a Pokémon\\n",
  "battle bursts into bloom.\\c\\n",
  "If eyes meet, sometimes\\n",
  "love will blossom as well.\\c\\n",
  "For young Trainers,\\n",
  "Pokémon battles are not\\l\\n",
  "simple competitions.\\c\\n",
  "They are also a way to meet others...\\c\\n",
  "This is how love blossoms and\\n",
  "fades between Trainers each day...$",
]

[msg.section_0.entries.65]
text = [
  "[VAR TRNAME(1)]: Puff, puff...\\c\\n",
  "Miguel, your Smeargle\\n",
  "is so tough...$",
]

[msg.section_0.entries.66]
text = [
  "Smeargle: Arg! Argle!\\c\\n",
  "(...Erg... You're a stubborn one!\\n",
  "Just give up already!...)$",
]

[msg.section_0.entries.67]
text = [
  "[VAR TRNAME(1)]: It still\\n",
  "seems completely full of energy...\\l\\n",
  "You're amazing, Smeargle...\\c\\n",
  "So cool...$",
]

[msg.section_0.entries.68]
text = [
  "Smeargle: Arrrgle!\\c\\n",
  "(...What's with this Trainer?\\n",
  "Why is she looking at me like that...\\l\\n",
  "She's really creepy...)$",
]

[msg.section_0.entries.69]
text = [
  "[VAR TRNAME(1)]: Miguel...$",
]

[msg.section_0.entries.70]
text = [
  "Miguel: What? What's up?$",
]

[msg.section_0.entries.71]
text = [
  "[VAR TRNAME(1)]: That Smeargle...\\n",
  "I think it's really wonderful...$",
]

[msg.section_0.entries.72]
text = [
  "Miguel: Th-thanks...$",
]

[msg.section_0.entries.73]
text = [
  "[VAR TRNAME(1)]: Um...\\n",
  "This is hard for me to say, but...$",
]

[msg.section_0.entries.74]
text = [
  "Miguel: Hm? What's wrong?$",
]

[msg.section_0.entries.75]
text = [
  "[VAR TRNAME(1)]: That Smeargle...\\c\\n",
  "Will you trade it to me for\\n",
  "my [VAR PKNICK(0)]?$",
]

[msg.section_0.entries.76]
text = [
  "Miguel: Huh?$",
]

[msg.section_0.entries.77]
text = [
  "[VAR TRNAME(1)]: I...\\c\\n",
  "I love your Smeargle.\\n",
  "It was love at first sight...\\c\\n",
  "So please...\\c\\n",
  "I beg you!\\n",
  "Please trade with me!$",
]

[msg.section_0.entries.78]
text = [
  "Miguel: Whaat?\\c\\n",
  "(...Well... What should I do...)$",
]

[msg.section_0.entries.79]
text = [
  "[VAR TRNAME(1)]: Please!\\c\\n",
  "Trade me your Smeargle!\\c\\n",
  "We'll always get along,\\n",
  "and I'll take great care of it forever!$",
]

[msg.section_0.entries.80]
text = [
  "Miguel: When you put it that way...\\c\\n",
  "(...Oh, her eyes are like clear pools...)\\c\\n",
  "(...Oh...why does it have to be Smeargle...\\n",
  "I'm the one who likes you...\\l\\n",
  "I wanted you to say those\\l\\n",
  "words to me, not Smeargle...)\\c\\n",
  "(...Well, for now, I guess I'll\\n",
  "just hide my feelings...)\\c\\n",
  "(...If I trade Smeargle to her,\\n",
  "maybe we can get to know each other...)$",
]

[msg.section_0.entries.81]
text = [
  "Smeargle: Arg! Argle!\\c\\n",
  "(...For pete's sake, Miguel...)\\c\\n",
  "(...Trading me so easily after all\\n",
  "we've been through, just because\\l\\n",
  "you're blinded by love.\\l\\n",
  "Well, what can you do?...)\\c\\n",
  "(...It's the destiny of us Pokémon\\n",
  "to be traded and to pass from\\l\\n",
  "person to person...)\\c\\n",
  "(...I guess I'll just do my best\\n",
  "so my new Trainer doesn't\\l\\n",
  "get tired of me...)$",
]

[msg.section_0.entries.82]
text = [
  "...If eyes meet, a Pokémon\\n",
  "battle bursts into bloom.\\c\\n",
  "If eyes meet, sometimes\\n",
  "love will blossom as well.\\c\\n",
  "But these once-in-a-lifetime feelings\\n",
  "don't just occur between humans.\\c\\n",
  "This is how love blossoms and\\n",
  "fades between Trainers each day...$",
]

[msg.section_0.entries.83]
text = [
  "[VAR TRNAME(1)]: So strong... I expected\\n",
  "as much from an Ace Trainer's Smeargle...$",
]

[msg.section_0.entries.84]
text = [
  "Smeargle: Meargle! Smeargle!\\c\\n",
  "(...Miguel! Enough already!\\n",
  "How much time are we going to\\l\\n",
  "waste on this scrub of a Trainer!...)$",
]

[msg.section_0.entries.85]
text = [
  "[VAR TRNAME(1)]: So wonderful...$",
]

[msg.section_0.entries.86]
text = [
  "Smeargle: Arg-argle!\\c\\n",
  "(...Why is she staring at me...\\n",
  "Creepy girl...\\l\\n",
  "I need to end this battle soon, or...)$",
]

[msg.section_0.entries.87]
text = [
  "[VAR TRNAME(1)]: I wonder if I can win...$",
]

[msg.section_0.entries.88]
text = [
  "Smeargle: Arrrg! Argle!\\c\\n",
  "(...Ha ha ha! She's showing weakness!\\n",
  "OK... Now's my chance!...)$",
]

[msg.section_0.entries.89]
text = [
  "Smeargle: Arg! Argle eargle!\\c\\n",
  "(...Tch! This Trainer...\\n",
  "She picks fairly clever moves...)$",
]

[msg.section_0.entries.90]
text = [
  "Miguel: Using that move now?\\c\\n",
  "(...Huh? Seriously? Does she not\\n",
  "realize what item my Smeargle is holding?...)$",
]

[msg.section_0.entries.91]
text = [
  "[VAR TRNAME(1)]: What do you think?\\n",
  "Do you like the tactic I thought up?$",
]

[msg.section_0.entries.92]
text = [
  "Miguel: N-not bad!\\n",
  "Guess I can't afford any mistakes!\\c\\n",
  "(...Hmm... That move attracts someone,\\n",
  "right? That isn't much of a tactic...)\\c\\n",
  "(...Oh... Hey... Wait!\\n",
  "Could it be?...)\\c\\n",
  "(...The move wasn't meant for Smeargle,\\n",
  "but it was a hidden message?...)\\c\\n",
  "(...That would mean that she and I are...\\n",
  "Gee hee! Mee hee! Gwa ha ha ha!...)$",
]

[msg.section_0.entries.93]
text = [
  "[VAR TRNAME(1)]: Um...\\c\\n",
  "Miguel, are you all right?\\c\\n",
  "Your face looks a little red.$",
]

[msg.section_0.entries.94]
text = [
  "Miguel: Gwa ha ha ha...$",
]

[msg.section_0.entries.95]
text = [
  "[VAR TRNAME(1)]: Hey, Miguel!\\n",
  "Are you listening to me? Are you OK?$",
]

[msg.section_0.entries.96]
text = [
  "Miguel: Uh, yeah!$",
]

[msg.section_0.entries.97]
text = [
  "[VAR TRNAME(1)]: Miguel?$",
]

[msg.section_0.entries.98]
text = [
  "Miguel: Oh, sorry!\\c\\n",
  "OK, OK, let's continue the battle!\\c\\n",
  "(...Phew! That was way too close!\\n",
  "I was imagining things\\l\\n",
  "I could never say to her...)$",
]

  "an exotic-smelling incense that boosts\\n",
  "the power of Rock-type moves.$",
]

[msg.section_0.entries.316]
text = [
  "An item to be held by a Pokémon. It is\\n",
  "an exotic-smelling incense that makes\\n",
  "the holder bloated and slow moving.$",
]

[msg.section_0.entries.317]
text = [
  "An item to be held by a Pokémon. It is\\n",
  "incense with a curious aroma that\\n",
  "boosts the power of Water-type moves.$",
]

[msg.section_0.entries.318]
text = [
  "An item to be held by a Pokémon. It is\\n",
  "an exotic-smelling incense that boosts\\n",
  "the power of Grass-type moves.$",
]

[msg.section_0.entries.319]
text = [
  "An item to be held by a Pokémon.\\n",
  "It doubles a battle's prize money if\\n",
  "the holding Pokémon joins in.$",
]

[msg.section_0.entries.320]
text = [
  "An item to be held by a Pokémon.\\n",
  "It helps keep wild Pokémon away if the\\n",
  "holder is the first one in the party.$",
]

[msg.section_0.entries.321]
text = [
  "A protective item of some sort.\\n",
  "It is extremely stiff and heavy.\\n",
  "It is loved by a certain Pokémon.$",
]

[msg.section_0.entries.322]
text = [
  "A box packed with a tremendous\\n",
  "amount of electric energy.\\n",
  "It is loved by a certain Pokémon.$",
]

[msg.section_0.entries.323]
text = [
  "A box packed with a tremendous\\n",
  "amount of magma energy.\\n",
  "It is loved by a certain Pokémon.$",
]

[msg.section_0.entries.324]
text = [
  "A transparent device overflowing with\\n",
  "dubious data.\\n",
  "Its producer is unknown.$",
]

[msg.section_0.entries.325]
text = [
  "A cloth imbued with horrifyingly strong\\n",
  "spiritual energy.\\n",
  "It is loved by a certain Pokémon.$",
]

[msg.section_0.entries.326]
text = [
  "An item to be held by a Pokémon.\\n",
  "It is a sharply hooked claw that ups\\n",
  "the holder's critical-hit ratio.$",
]

[msg.section_0.entries.327]
text = [
  "An item to be held by a Pokémon.\\n",
  "It may make foes and allies flinch\\n",
  "when the holder inflicts damage.$",
]

[msg.section_0.entries.328]
text = [
  "The user sharpens its claws to\\n",
  "boost its Attack stat and accuracy.$",
]

[msg.section_0.entries.329]
text = [
  "The user slashes the target with huge,\\n",
  "sharp claws.$",
]

[msg.section_0.entries.330]
text = [
  "The user materializes an odd\\n",
  "psychic wave to attack the target.\\n",
  "This attack does physical damage.$",
]

[msg.section_0.entries.331]
text = [
  "The user quietly focuses its mind and\\n",
  "calms its spirit to raise its Sp. Atk\\n",
  "and Sp. Def stats.$",
]

[msg.section_0.entries.332]
text = [
  "The target is scared off and replaced\\n",
  "by another Pokémon in its party.\\n",
  "In the wild, the battle ends.$",
]

[msg.section_0.entries.333]
text = [
  "A move that leaves the target badly\\n",
  "poisoned. Its poison damage\\n",
  "worsens every turn.$",
]

[msg.section_0.entries.334]
text = [
  "Summons a hailstorm that lasts for\\n",
  "five turns. The hailstorm damages\\n",
  "all types except Ice.$",
]

[msg.section_0.entries.335]
text = [
  "The user tenses its muscles to bulk up\\n",
  "its body, boosting both its Attack and\\n",
  "Defense stats.$",
]

[msg.section_0.entries.336]
text = [
  "The user drenches the target in a\\n",
  "special poisonous liquid. Its power\\n",
  "is doubled if the target is poisoned.$",
]

[msg.section_0.entries.337]
text = [
  "A unique attack that varies in type and\\n",
  "intensity depending on the Pokémon\\n",
  "using it.$",
]

[msg.section_0.entries.338]
text = [
  "The user intensifies the sun for\\n",
  "five turns, powering up Fire-type\\n",
  "moves.$",
]

[msg.section_0.entries.339]
text = [
  "The target is taunted into a rage that\\n",
  "allows it to use only attack moves\\n",
  "for three turns.$",
]

[msg.section_0.entries.340]
text = [
  "The target is struck with an icy-cold\\n",
  "beam of energy.\\n",
  "It may also freeze the target solid.$",
]

[msg.section_0.entries.341]
text = [
  "A howling blizzard is summoned to strike\\n",
  "the opposing team. It may also freeze\\n",
  "them solid.$",
]

[msg.section_0.entries.342]
text = [
  "The target is attacked with a powerful\\n",
  "beam. The user must rest on the next\\n",
  "turn to regain its energy.$",
]

[msg.section_0.entries.343]
text = [
  "A wondrous wall of light is put up to\\n",
  "suppress damage from special attacks\\n",
  "for five turns.$",
]

[msg.section_0.entries.344]
text = [
  "It enables the user to evade all\\n",
  "attacks. Its chance of failing rises\\n",
  "if it is used in succession.$",
]

[msg.section_0.entries.345]
text = [
  "The user summons a heavy rain that\\n",
  "falls for five turns, powering up\\n",
  "Water-type moves.$",
]

[msg.section_0.entries.346]
text = [
  "The user makes the target float with\\n",
  "its psychic power. The target is easier\\n",
  "to hit for three turns.$",
]

[msg.section_0.entries.347]
text = [
  "The user creates a protective field\\n",
  "that prevents status problems\\n",
  "for five turns.$",
]

[msg.section_0.entries.348]
text = [
  "A full-power attack that grows more\\n",
  "powerful the less the user likes its\\n",
  "Trainer.$",
]

[msg.section_0.entries.349]
text = [
  "A two-turn attack. The user gathers\\n",
  "light, then blasts a bundled beam on\\n",
  "the second turn.$",
]

[msg.section_0.entries.350]
text = [
  "The user throws a stone or projectile\\n",
  "to attack an opponent. A flying Pokémon\\n",
  "will fall to the ground when it's hit.$",
]

[msg.section_0.entries.351]
text = [
  "A strong electric blast is loosed at the\\n",
  "target. It may also leave the target\\n",
  "with paralysis.$",
]

[msg.section_0.entries.352]
text = [
  "A wicked thunderbolt is dropped\\n",
  "on the target to inflict damage. It may\\n",
  "also leave the target with paralysis.$",
]

[msg.section_0.entries.353]
text = [
  "The user sets off an earthquake that\\n",
  "strikes every Pokémon around it.$",
]

[msg.section_0.entries.354]
text = [
  "A full-power attack that grows more\\n",
  "powerful the more the user likes its\\n",
  "Trainer.$",
]

[msg.section_0.entries.355]
text = [
  "The user burrows, then attacks on the\\n",
  "second turn. It can also be used to\\n",
  "exit dungeons.$",
]

[msg.section_0.entries.356]
text = [
  "The target is hit by a strong\\n",
  "telekinetic force. It may also reduce\\n",
  "the target's Sp. Def stat.$",
]

[msg.section_0.entries.357]
text = [
  "The user hurls a shadowy blob at the\\n",
  "target. It may also lower the target's\\n",
  "Sp. Def stat.$",
]

[msg.section_0.entries.358]
text = [
  "The user attacks with tough fists,\\n",
  "etc. It can also break any barrier\\n",
  "such as Light Screen and Reflect.$",
]

[msg.section_0.entries.359]
text = [
  "By moving rapidly, the user makes\\n",
  "illusory copies of itself to raise\\n",
  "its evasiveness.$",
]

[msg.section_0.entries.360]
text = [
  "A wondrous wall of light is put up to\\n",
  "suppress damage from physical attacks\\n",
  "for five turns.$",
]

[msg.section_0.entries.361]
text = [
  "It swamps the area around the user\\n",
  "with a giant sludge wave.\\n",
  "It may also poison those hit.$",
]

[msg.section_0.entries.362]
text = [
  "The target is scorched with an intense\\n",
  "blast of fire. It may also leave the\\n",
  "target with a burn.$",
]

[msg.section_0.entries.363]
text = [
  "Unsanitary sludge is hurled at the\\n",
  "target. It may also poison the target.$",
]

[msg.section_0.entries.364]
text = [
  "A five-turn sandstorm is summoned\\n",
  "to hurt all combatants except the\\n",
  "Rock, Ground, and Steel types.$",
]

[msg.section_0.entries.365]
text = [
  "The target is attacked with an intense\\n",
  "blast of all-consuming fire. It may\\n",
  "also leave the target with a burn.$",
]

[msg.section_0.entries.366]
text = [
  "Boulders are hurled at the target. It\\n",
  "also lowers the target's Speed by\\n",
  "preventing its movement.$",
]

[msg.section_0.entries.367]
text = [
  "The user confounds the target\\n",
  "with speed, then slashes.\\n",
  "The attack lands without fail.$",
]

[msg.section_0.entries.368]
text = [
  "The user torments and enrages the\\n",
  "target, making it incapable of using the\\n",
  "same move twice in a row.$",
]

[msg.section_0.entries.369]
text = [
  "An attack move that doubles its power\\n",
  "if the user is poisoned, paralyzed, or\\n",
  "has a burn.$",
]

[msg.section_0.entries.370]
text = [
  "The user cloaks itself with flame and\\n",
  "attacks. Building up more power,\\n",
  "it raises the user's Speed stat.$",
]

[msg.section_0.entries.371]
text = [
  "The user goes to sleep for two\\n",
  "turns. It fully restores the user's HP\\n",
  "and heals any status problem.$",
]

[msg.section_0.entries.372]
text = [
  "If it is the opposite gender of the\\n",
  "user, the target becomes infatuated\\n",
  "and less likely to attack.$",
]

[msg.section_0.entries.373]
text = [
  "The user attacks and steals the\\n",
  "target's held item simultaneously. It\\n",
  "can't steal if the user holds an item.$",
]

[msg.section_0.entries.374]
text = [
  "The user attacks the target's legs\\n",
  "swiftly, reducing the target's\\n",
  "Speed stat.$",
]

[msg.section_0.entries.375]
text = [
  "The user attacks the target with a\\n",
  "song. Others can join in the Round and\\n",
  "make the attack do greater damage.$",
]

[msg.section_0.entries.376]
text = [
  "The user attacks the target with an\\n",
  "echoing voice. If this move is used\\n",
  "every turn, it does greater damage.$",
]

[msg.section_0.entries.377]
text = [
  "The user attacks the target at full\\n",
  "power. The attack's recoil harshly\\n",
  "reduces the user's Sp. Atk stat.$",
]

[msg.section_0.entries.378]
text = [
  "The user teleports using a strange\\n",
  "power and switches its place with one of\\n",
  "its allies.$",
]

[msg.section_0.entries.379]
text = [
  "The user heightens its mental focus and\\n",
  "unleashes its power.\\n",
  "It may also lower the target's Sp. Def.$",
]

[msg.section_0.entries.380]
text = [
  "The user draws power from nature and\\n",
  "fires it at the target. It may also\\n",
  "lower the target's Sp. Def.$",
]

[msg.section_0.entries.381]
text = [
  "A restrained attack that prevents the\\n",
  "target from fainting. The target is left\\n",
  "with at least 1 HP.$",
]

[msg.section_0.entries.382]
text = [
  "The user shoots boiling hot water at\\n",
  "its target. It may also leave the\\n",
  "target with a burn.$",
]

[msg.section_0.entries.383]
text = [
  "The user flings its held item at the\\n",
  "target as an attack. Its power and\\n",
  "effects depend on the item.$",
]

[msg.section_0.entries.384]
text = [
  "The user attacks with an electric\\n",
  "charge. The user may use any remaining\\n",
  "electricity to raise its Sp. Atk stat.$",
]

[msg.section_0.entries.385]
text = [
  "The user hurls the target into the air,\\n",
  "then drops it on the second turn. The\\n",
  "target cannot attack while in the air.$",
]

[msg.section_0.entries.386]
text = [
  "The user attacks the target with fire.\\n",
  "If the target is holding a Berry, the\\n",
  "Berry becomes burnt up and unusable.$",
]

[msg.section_0.entries.387]
text = [
  "The user suppresses the target and\\n",
  "makes its move go last.$",
]

[msg.section_0.entries.388]
text = [
  "The user shoots a sinister, bluish-white\\n",
  "flame at the target to inflict a burn.$",
]

[msg.section_0.entries.389]
text = [
  "The user nimbly strikes the target.\\n",
  "If the user is not holding an item,\\n",
  "this attack inflicts massive damage.$",
]

[msg.section_0.entries.390]
text = [
  "It prevents the target from using its\\n",
  "held item. Its Trainer is also prevented\\n",
  "from using items on it.$",
]

[msg.section_0.entries.391]
text = [
  "The user explodes to inflict damage on\\n",
  "those around it.\\n",
  "The user faints upon using this move.$",
]

[msg.section_0.entries.392]
text = [
  "The user slashes with a sharp claw\\n",
  "made from shadows. It has a high\\n",
  "critical-hit ratio.$",
]

[msg.section_0.entries.393]
text = [
  "The user stores power, then attacks.\\n",
  "If the user can use this attack after\\n",
  "the target, its power is doubled.$",
]

[msg.section_0.entries.394]
text = [
  "The user gets revenge for a fainted\\n",
  "ally. If an ally fainted in the previous\\n",
  "turn, this attack's damage increases.$",
]

[msg.section_0.entries.395]
text = [
  "The user charges at the target using\\n",
  "every bit of its power.\\n",
  "The user must rest on the next turn.$",
]

[msg.section_0.entries.396]
text = [
  "The user polishes its body to reduce\\n",
  "drag. It sharply raises the Speed\\n",
  "stat.$",
]

[msg.section_0.entries.397]
text = [
  "The user flashes a bright light that\\n",
  "cuts the target's accuracy.\\n",
  "It can also be used to illuminate caves.$",
]

[msg.section_0.entries.398]
text = [
  "The user stabs the foe with\\n",
  "sharpened stones from below.\\n",
  "It has a high critical-hit ratio.$",
]

[msg.section_0.entries.399]
text = [
  "After making its attack, the user\\n",
  "rushes back to switch places with\\n",
  "a party Pokémon in waiting.$",
]

[msg.section_0.entries.400]
text = [
  "A weak electric charge is launched\\n",
  "at the target. It causes paralysis\\n",
  "if it hits.$",
]

[msg.section_0.entries.401]
text = [
  "The user tackles the target with a\\n",
  "high-speed spin. The slower the\\n",
  "user, the greater the damage.$",
]

[msg.section_0.entries.402]
text = [
  "A frenetic dance to uplift the fighting\\n",
  "spirit. It sharply raises the user's\\n",
  "Attack stat.$",
]

[msg.section_0.entries.403]
text = [
  "Resisting, the user attacks the\\n",
  "opposing Pokémon. The targets' Sp. Atk\\n",
  "stat is reduced.$",
]

[msg.section_0.entries.404]
text = [
  "The user hypnotizes itself into\\n",
  "copying any stat change made\\n",
  "by the target.$",
]

[msg.section_0.entries.405]
text = [
  "The user stomps down on the ground\\n",
  "and attacks everything in the area.\\n",
  "The targets' Speed stat is reduced.$",
]

[msg.section_0.entries.406]
text = [
  "The user blows a cold breath on the\\n",
  "target. This attack always results in\\n",
  "a critical hit.$",
]

[msg.section_0.entries.407]
text = [
  "Large boulders are hurled at the\\n",
  "opposing team to inflict damage. They\\n",
  "may also make the targets flinch.$",
]

[msg.section_0.entries.408]
text = [
  "The user slashes at the target by\\n",
  "crossing its scythes or claws as if\\n",
  "they were a pair of scissors.$",
]

[msg.section_0.entries.409]
text = [
  "The user knocks away the target and\\n",
  "drags out another Pokémon in its party.\\n",
  "In the wild, the battle ends.$",
]

[msg.section_0.entries.410]
text = [
  "The user is roused, and its Attack\\n",
  "and Sp. Atk stats increase.$",
]

[msg.section_0.entries.411]
text = [
  "The target is stabbed with a tentacle\\n",
  "or arm steeped in poison. It may also\\n",
  "poison the target.$",
]

[msg.section_0.entries.412]
text = [
  "The user eats the dreams of a sleeping\\n",
  "target. It absorbs half the damage\\n",
  "caused to heal the user's HP.$",
]

[msg.section_0.entries.413]
text = [
  "The user snares the target with grass\\n",

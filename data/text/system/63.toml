  "This scarf boosts Speed, but allows\\n",
  "the use of only one of its moves.$",
]

[msg.section_0.entries.288]
text = [
  "A held item that damages the holder on\\n",
  "every turn. It may latch on to foes and\\n",
  "allies that touch the holder.$",
]


[msg]
trailing_data = "4040"

[msg.section_0.entries.0]
text = [
  "$",
]

[msg.section_0.entries.1]
text = [
  "Au matin de sa vie, la graine sur\\n",
  "son dos lui fournit les éléments\\n",
  "dont il a besoin pour grandir.$",
]

[msg.section_0.entries.2]
text = [
  "Lorsque le bourgeon sur son dos\\n",
  "éclot, il répand un doux parfum\\n",
  "pour célébrer sa floraison.$",
]

[msg.section_0.entries.3]
text = [
  "Le parfum de sa fleur se fait plus\\n",
  "pénétrant les lendemains de pluie.\\n",
  "Cela appâte les autres Pokémon.$",
]

[msg.section_0.entries.4]
text = [
  "La flamme de sa queue symbolise sa\\n",
  "vitalité. Elle est intense quand il\\n",
  "est en bonne santé.$",
]

[msg.section_0.entries.5]
text = [
  "La nuit, la queue ardente du Reptincel\\n",
  "brille comme une étoile dans son\\n",
  "repaire montagneux.$",
]

[msg.section_0.entries.6]
text = [
  "On raconte que la flamme du\\n",
  "Dracaufeu s'intensifie après\\n",
  "un combat difficile.$",
]

[msg.section_0.entries.7]
text = [
  "Il se réfugie dans sa carapace\\n",
  "et réplique en éclaboussant\\n",
  "l'ennemi à la première occasion.$",
]

[msg.section_0.entries.8]
text = [
  "On prétend qu'il vit 10 000 ans.\\n",
  "Sa queue duveteuse est un\\n",
  "symbole de longévité populaire.$",
]

[msg.section_0.entries.9]
text = [
  "Les trombes d'eau projetées par\\n",
  "les canons de sa carapace peuvent\\n",
  "percer le métal le plus résistant.$",
]

[msg.section_0.entries.10]
text = [
  "Ses antennes rouges libèrent une\\n",
  "puanteur qui repousse l'ennemi.\\n",
  "Il grandit par mues régulières.$",
]

[msg.section_0.entries.11]
text = [
  "Son corps frêle est protégé par sa\\n",
  "carapace d'acier. Il encaisse les\\n",
  "coups durs en attendant d'évoluer.$",
]

[msg.section_0.entries.12]
text = [
  "Il raffole du nectar des fleurs. Il\\n",
  "est capable de repérer la plus\\n",
  "petite quantité de pollen.$",
]

[msg.section_0.entries.13]
text = [
  "Il mange chaque jour son poids en\\n",
  "feuilles. Il utilise l'aiguillon sur sa\\n",
  "tête pour repousser l'ennemi.$",
]

[msg.section_0.entries.14]
text = [
  "Il se cache sous les feuilles et les\\n",
  "branches pour fuir les prédateurs\\n",
  "en attendant d'évoluer.$",
]

[msg.section_0.entries.15]
text = [
  "Il virevolte rapidement autour de\\n",
  "l'ennemi et frappe de son dard\\n",
  "empoisonné avant de décamper.$",
]

[msg.section_0.entries.16]
text = [
  "Ce Pokémon docile préfère éviter\\n",
  "le combat. Toutefois, il se montre\\n",
  "très féroce quand on l'agresse.$",
]

[msg.section_0.entries.17]
text = [
  "Il survole son vaste territoire en\\n",
  "quête d'une proie avant de fondre\\n",
  "sur elle toutes griffes en avant.$",
]

[msg.section_0.entries.18]
text = [
  "En battant des ailes de toutes ses\\n",
  "forces, Roucarnage génère une\\n",
  "rafale à en déraciner les arbres.$",
]

[msg.section_0.entries.19]
text = [
  "D'une prudence extrême, sa nature\\n",
  "robuste lui permet de s'adapter à\\n",
  "tous les terrains.$",
]

[msg.section_0.entries.20]
text = [
  "Il grignote sans cesse pour apaiser\\n",
  "la poussée de ses crocs. Il peut\\n",
  "transpercer un mur de parpaings.$",
]

[msg.section_0.entries.21]
text = [
  "Il fait battre vigoureusement ses\\n",
  "petites ailes pour voler et cherche\\n",
  "à manger dans l'herbe avec le bec.$",
]

[msg.section_0.entries.22]
text = [
  "Il a assez d'énergie pour voler\\n",
  "toute la journée avec ses grandes\\n",
  "ailes. Il frappe de son bec acéré.$",
]

[msg.section_0.entries.23]
text = [
  "Il se faufile dans l'herbe sans un\\n",
  "bruit et frappe dans le dos quand\\n",
  "sa proie s'y attend le moins.$",
]

[msg.section_0.entries.24]
text = [
  "Il utilise la marque sur son ventre\\n",
  "pour intimider l'ennemi. Il étouffe\\n",
  "l'ennemi pétrifié par la peur.$",
]

[msg.section_0.entries.25]
text = [
  "Il lui arrive de remettre d'aplomb\\n",
  "un Pikachu allié en lui envoyant\\n",
  "une décharge électrique.$",
]

[msg.section_0.entries.26]
text = [
  "Il se protège des décharges grâce\\n",
  "à sa queue qui dissipe l'électricité\\n",
  "dans le sol.$",
]

[msg.section_0.entries.27]
text = [
  "Il vit sur des terres arides épargnées\\n",
  "par la pluie. Il se roule en boule pour\\n",
  "se protéger.$",
]

[msg.section_0.entries.28]
text = [
  "Il se met en boule pour percuter\\n",
  "l'ennemi. Ses épines aiguisées\\n",
  "font beaucoup de dégâts.$",
]

[msg.section_0.entries.29]
text = [
  "Bien qu'il rechigne à se battre, une\\n",
  "goutte du poison sécrété par ses\\n",
  "piquants peut s'avérer fatale.$",
]

[msg.section_0.entries.30]
text = [
  "Ce Pokémon dresse ses piquants\\n",
  "en cas de danger. Ils poussent\\n",
  "moins vite que ceux de Nidorino.$",
]

[msg.section_0.entries.31]
text = [
  "Son corps est recouvert d'écailles\\n",
  "solides. Il donnera sa vie pour\\n",
  "secourir les petits de son terrier.$",
]

[msg.section_0.entries.32]
text = [
  "Il jauge le terrain en laissant\\n",
  "ses oreilles dépasser de l'herbe.\\n",
  "Il se défend avec sa corne toxique.$",
]

[msg.section_0.entries.33]
text = [
  "D'un tempérament violent, il\\n",
  "empale l'ennemi sur sa corne\\n",
  "qui distille un poison puissant.$",
]

[msg.section_0.entries.34]
text = [
  "Un coup de sa puissante queue\\n",
  "peut briser un poteau téléphonique\\n",
  "comme une allumette.$",
]

[msg.section_0.entries.35]
text = [
  "On dit que ceux qui voient danser\\n",
  "un groupe de Mélofée sous la pleine\\n",
  "lune connaîtront un grand bonheur.$",
]

[msg.section_0.entries.36]
text = [
  "Il est très farouche et se laisse\\n",
  "rarement approcher. De plus, il\\n",
  "détecte les sons à plus d'1 km.$",
]

[msg.section_0.entries.37]
text = [
  "Il envoie des boules de feu. Avec\\n",
  "l'âge, ses six queues en forment de\\n",
  "nouvelles.$",
]

[msg.section_0.entries.38]
text = [
  "On raconte que ses neuf queues\\n",
  "détiennent un pouvoir mystique.\\n",
  "Il peut vivre pendant mille ans.$",
]

[msg.section_0.entries.39]
text = [
  "Lorsqu'il roule ses grands yeux\\n",
  "ronds, il entonne une berceuse\\n",
  "qui endort son auditoire.$",
]

[msg.section_0.entries.40]
text = [
  "Sa fourrure est d'une douceur\\n",
  "incomparable au toucher. Il\\n",
  "peut gonfler en aspirant de l'air.$",
]

[msg.section_0.entries.41]
text = [
  "Il se repère dans l'espace grâce\\n",
  "aux ultrasons émis par sa gueule.$",
]

[msg.section_0.entries.42]
text = [
  "Ses crocs acérés et creux peuvent\\n",
  "pénétrer la plus épaisse des peaux\\n",
  "et sucer le sang de la victime.$",
]

[msg.section_0.entries.43]
text = [
  "En journée, il plante ses pieds-racines\\n",
  "dans le sol. La nuit, il se promène en\\n",
  "semant des graines.$",
]

[msg.section_0.entries.44]
text = [
  "L'odeur du nectar de sa bouche est\\n",
  "si répugnante qu'elle agresse les\\n",
  "narines à deux kilomètres.$",
]

[msg.section_0.entries.45]
text = [
  "Ses pétales sont les plus grands\\n",
  "du monde. Il marche en répandant\\n",
  "un pollen extrêmement allergène.$",
]

[msg.section_0.entries.46]
text = [
  "Des champignons appelés “tochukaso\\\"\\n",
  "poussent sur son dos. Ils évoluent\\n",
  "avec le Paras hôte.$",
]

[msg.section_0.entries.47]
text = [
  "Un champignon parasite plus gros\\n",
  "que Parasect contrôle son corps.\\n",
  "Il répand des spores empoisonnées.$",
]

[msg.section_0.entries.48]
text = [
  "Ses grands yeux sont en fait des\\n",
  "amas d'yeux minuscules. La nuit,\\n",
  "il est attiré par la lumière.$",
]

[msg.section_0.entries.49]
text = [
  "Il répand ses écailles poudreuses\\n",
  "en battant des ailes. Elles sont\\n",
  "toxiques au toucher.$",
]

[msg.section_0.entries.50]
text = [
  "Un Pokémon qui vit sous terre.\\n",
  "Habitué aux souterrains, il fuit la\\n",
  "lumière du jour.$",
]

[msg.section_0.entries.51]
text = [
  "Ses trois têtes creusent le sol à\\n",
  "tour de rôle. Il peut atteindre des\\n",
  "profondeurs de 100 kilomètres.$",
]

[msg.section_0.entries.52]
text = [
  "Son regard s'anime à la vue\\n",
  "d'un objet brillant. C'est un\\n",
  "Pokémon nocturne.$",
]

[msg.section_0.entries.53]
text = [
  "Un Pokémon très snob. La taille du\\n",
  "joyau qui orne son front alimente\\n",
  "bien des débats parmi ses fans.$",
]

[msg.section_0.entries.54]
text = [
  "Ses pouvoirs déconcertants\\n",
  "et mystérieux lui font subir\\n",
  "de constantes migraines.$",
]

[msg.section_0.entries.55]
text = [
  "Ses membres palmés et son corps\\n",
  "parfaitement adapté font de lui\\n",
  "un nageur exceptionnel.$",
]

[msg.section_0.entries.56]
text = [
  "Ils vivent en colonies sylvestres.\\n",
  "Quand un Férosinge s'énerve, toute\\n",
  "la colonie suit son exemple.$",
]

[msg.section_0.entries.57]
text = [
  "Il grogne quand on le toise, rugit\\n",
  "quand on s'enfuit et devient fou\\n",
  "de rage quand on le frappe.$",
]

[msg.section_0.entries.58]
text = [
  "Un Pokémon très loyal. Il restera\\n",
  "immobile jusqu'à ce que son\\n",
  "Dresseur lui donne un ordre.$",
]

[msg.section_0.entries.59]
text = [
  "Son port altier et son attitude\\n",
  "fière ont depuis longtemps\\n",
  "conquis le cœur des hommes.$",
]

[msg.section_0.entries.60]
text = [
  "Sa peau est si mince qu'on voit\\n",
  "ses organes internes. Il tient\\n",
  "à peine sur ses nouveaux pieds.$",
]

[msg.section_0.entries.61]
text = [
  "La spirale qui orne son ventre ondule\\n",
  "doucement. Celui qui la fixe est saisi\\n",
  "d'une étrange torpeur.$",
]

[msg.section_0.entries.62]
text = [
  "Il possède de sacrés biscoteaux.\\n",
  "Il peut parcourir sans relâche\\n",
  "l'Océan Pacifique.$",
]

[msg.section_0.entries.63]
text = [
  "L'utilisation de ses pouvoirs\\n",
  "mentaux le fatigue tellement\\n",
  "qu'il dort 18 heures par jour.$",
]

[msg.section_0.entries.64]
text = [
  "Il fixe sa cuillère d'argent afin de\\n",
  "concentrer son esprit et d'émettre\\n",
  "un maximum d'ondes alpha.$",
]

[msg.section_0.entries.65]
text = [
  "On dit que les cuillères qu'il tient\\n",
  "en permanence ont été créées\\n",
  "par la puissance de son esprit.$",
]

[msg.section_0.entries.66]
text = [
  "Malgré sa petite taille, sa force\\n",
  "lui permet de soulever plusieurs\\n",
  "Racaillou à la fois.$",
]

[msg.section_0.entries.67]
text = [
  "Il soulève les plus lourdes charges\\n",
  "avec plaisir et facilité. Il donne un\\n",
  "coup de main tout en s'entraînant!$",
]

[msg.section_0.entries.68]
text = [
  "La puissance et la rapidité de ses\\n",
  "quatre bras puissants font des\\n",
  "ravages sur ses adversaires.$",
]

[msg.section_0.entries.69]
text = [
  "Il préfère les climats chauds et\\n",
  "humides. Ses lianes peuvent\\n",
  "capturer une proie en un clin d'œil.$",
]

[msg.section_0.entries.70]
text = [
  "Un Pokémon végétal. Il capture les\\n",
  "proies étourdies en les endormant\\n",
  "à l'aide d'une poudre toxique.$",
]

[msg.section_0.entries.71]
text = [
  "Sa bouche sécrète un fluide à\\n",
  "l'odeur de miel, qui s'avère être\\n",
  "un acide extrêmement corrosif.$",
]

[msg.section_0.entries.72]
text = [
  "Presque entièrement composé d'eau,\\n",
  "son corps a tendance à se dessécher\\n",
  "sur la terre ferme.$",
]

[msg.section_0.entries.73]
text = [
  "Ses 80 tentacules lui permettent\\n",
  "d'emprisonner ses adversaires\\n",
  "dans un redoutable filet venimeux.$",
]

[msg.section_0.entries.74]
text = [
  "Au repos, rien ne le distingue d'un\\n",
  "vulgaire caillou. Malheur à ceux qui\\n",
  "lui marchent dessus par mégarde!$",
]

[msg.section_0.entries.75]
text = [
  "Il dévale les montagnes pour se\\n",
  "déplacer. Une fois qu'il a pris tout\\n",
  "son élan, dur dur de l'arrêter!$",
]

[msg.section_0.entries.76]
text = [
  "Aucun explosif ne pourrait entamer\\n",
  "sa carapace de pierre. Il mue une\\n",
  "fois par an.$",
]

[msg.section_0.entries.77]
text = [
  "Chancelantes à la naissance, ses\\n",
  "pattes deviennent très vite sûres\\n",
  "et solides à force de galoper.$",
]

[msg.section_0.entries.78]
text = [
  "Au grand galop, sa crinière de feu\\n",
  "disperse au vent une myriade\\n",
  "d'étincelles ardentes.$",
]

[msg.section_0.entries.79]
text = [
  "Bien que lent, c'est un pêcheur\\n",
  "adroit qui utilise sa queue. Elle\\n",
  "est insensible aux morsures.$",
]

[msg.section_0.entries.80]
text = [
  "Ce grand benêt connaît des éclairs\\n",
  "de lucidité lorsque le Kokiyas de sa\\n",
  "queue se met à mordre.$",
]

[msg.section_0.entries.81]
text = [
  "Plus la rotation de ses extrémités\\n",
  "est rapide, plus la force du champ\\n",
  "magnétique qu'il génère est grande.$",
]

[msg.section_0.entries.82]
text = [
  "Des groupes apparaissent si des\\n",
  "taches solaires couvrent le soleil.\\n",
  "Ils brouillent les télévisions.$",
]

[msg.section_0.entries.83]
text = [
  "Il ne peut pas vivre sans son\\n",
  "légume, c'est pourquoi il le\\n",
  "protégera au péril de sa vie.$",
]

[msg.section_0.entries.84]
text = [
  "Ses deux cerveaux semblent\\n",
  "communiquer leurs émotions\\n",
  "grâce à un lien télépathique.$",
]

[msg.section_0.entries.85]
text = [
  "Quand Doduo connaît cette étrange\\n",
  "évolution, l'une de ses têtes se\\n",
  "dédouble. Il atteint les 60 km/h.$",
]

[msg.section_0.entries.86]
text = [
  "Un habitant des icebergs.\\n",
  "En mer, il utilise la corne sur\\n",
  "sa tête pour briser la banquise.$",
]

[msg.section_0.entries.87]
text = [
  "Son corps est couvert d'un grand\\n",
  "manteau blanc qui, dans la neige, le\\n",
  "dissimule aux yeux des prédateurs.$",
]

[msg.section_0.entries.88]
text = [
  "Il est né d'un torrent de boue\\n",
  "exposé aux rayons X de la lune.\\n",
  "Il vit dans les ordures.$",
]

[msg.section_0.entries.89]
text = [
  "Son corps exsude un fluide toxique\\n",
  "qui tue instantanément les plantes\\n",
  "et les arbres au contact.$",
]

[msg.section_0.entries.90]
text = [
  "Il nage à reculons en ouvrant et en\\n",
  "refermant ses deux coquilles. Il\\n",
  "laisse traîner sa large langue.$",
]

[msg.section_0.entries.91]
text = [
  "Il se défend en fermant sa coquille\\n",
  "et projette des piquants qui\\n",
  "repoussent ses agresseurs.$",
]

[msg.section_0.entries.92]
text = [
  "Son corps composé de gaz toxique\\n",
  "pourrait asphyxier n'importe qui\\n",
  "en quelques secondes.$",
]

[msg.section_0.entries.93]
text = [
  "Il adore se tapir dans l'ombre et\\n",
  "faire frissonner ses proies en leur\\n",
  "touchant l'épaule.$",
]

[msg.section_0.entries.94]
text = [
  "Si vous croisez un regard\\n",
  "inquiétant qui perce la nuit,\\n",
  "c'est sûrement un Ectoplasma.$",
]

[msg.section_0.entries.95]
text = [
  "Il se nourrit des pierres qu'il\\n",
  "rencontre en creusant le sol.\\n",
  "Il peut creuser à 80 km/h!$",
]

[msg.section_0.entries.96]
text = [
  "Son grand nez lui permet de lire\\n",
  "les rêves d'autrui. Il adore les\\n",
  "songes amusants.$",
]

[msg.section_0.entries.97]
text = [
  "La vue de son pendule oscillant\\n",
  "endort en trois secondes, même\\n",
  "quand on vient de se réveiller.$",
]

[msg.section_0.entries.98]
text = [
  "Il creuse son terrier sur des plages\\n",
  "sablonneuses. Ses pinces repoussent\\n",
  "si on les brise.$",
]

[msg.section_0.entries.99]
text = [
  "Sa grande pince possède une puissance\\n",
  "de 10 000 chevaux. Son poids la rend\\n",
  "difficile à manier.$",
]

[msg.section_0.entries.100]
text = [
  "Il ressemble à une Poké Ball. Ce\\n",
  "Pokémon dangereux peut exploser\\n",
  "ou s'électrifier au toucher.$",
]

[msg.section_0.entries.101]
text = [
  "Il se laisse porter par les vents\\n",
  "lorsque son corps est gonflé\\n",
  "d'électricité à en éclater.$",
]

[msg.section_0.entries.102]
text = [
  "Ces six œufs communiquent par\\n",
  "télépathie. Ils peuvent se réunir\\n",
  "rapidement si on les sépare.$",
]

[msg.section_0.entries.103]
text = [
  "On l'appelle “jungle sur pattes\\\".\\n",
  "Si une tête devient trop grosse,\\n",
  "elle tombe et produit un Noeunoeuf.$",
]

[msg.section_0.entries.104]
text = [
  "Il pleure en pensant à sa mère\\n",
  "disparue, et ses larmes résonnent\\n",
  "dans son crâne creux.$",
]

[msg.section_0.entries.105]
text = [
  "Ce Pokémon sauvage possède des os\\n",
  "depuis sa naissance. Il s'en sert\\n",
  "pour combattre avec dextérité.$",
]

[msg.section_0.entries.106]
text = [
  "Ses pattes élastiques s'allongent, ce\\n",
  "qui ne manque jamais de surprendre\\n",
  "au premier combat.$",
]

[msg.section_0.entries.107]
text = [
  "Même le béton cède sous ses\\n",
  "poings dévastateurs. Au combat, il\\n",
  "s'essouffle au bout de 3 minutes.$",
]

[msg.section_0.entries.108]
text = [
  "Quand il déploie sa langue de près\\n",
  "de deux mètres, sa queue s'agite.\\n",
  "Elles seraient reliées entre elles.$",
]

[msg.section_0.entries.109]
text = [
  "Il flotte en retenant des gaz plus\\n",
  "légers que l'air. Ceux-ci sont\\n",
  "explosifs, en plus d'être fétides.$",
]

[msg.section_0.entries.110]
text = [
  "Il grandit en absorbant les gaz des\\n",
  "détritus. Des triplés existent, bien\\n",
  "qu'ils soient fort rares.$",
]

[msg.section_0.entries.111]
text = [
  "Ses puissantes charges pourraient\\n",
  "démolir n'importe quel bâtiment.\\n",
  "Dommage qu'il soit stupide.$",
]

[msg.section_0.entries.112]
text = [
  "La station debout a libéré ses\\n",
  "pattes avant et l'a rendu plus\\n",
  "intelligent, mais il est distrait.$",
]

[msg.section_0.entries.113]
text = [
  "Ce Pokémon très serviable distribue\\n",
  "ses œufs hautement nutritifs aux\\n",
  "humains et Pokémon blessés.$",
]

[msg.section_0.entries.114]
text = [
  "Il se cache derrière des lianes\\n",
  "bleues recouvertes d'un fin duvet.\\n",
  "Il est chatouilleux.$",
]

[msg.section_0.entries.115]
text = [
  "Il élève ses petits dans sa poche\\n",
  "ventrale. Il attend d'être en lieu\\n",
  "sûr pour les laisser jouer dehors.$",
]

[msg.section_0.entries.116]
text = [
  "Il niche à l'ombre du corail. Quand\\n",
  "il se sent menacé, il disparaît\\n",
  "dans un nuage d'encre opaque.$",
]

[msg.section_0.entries.117]
text = [
  "Son épine dorsale le protège.\\n",
  "Ses os et ses nageoires sont très\\n",
  "prisés en médecine traditionnelle.$",
]

[msg.section_0.entries.118]
text = [
  "Malgré son élégance quand il\\n",
  "nage, ses coups de corne sont\\n",
  "redoutables.$",
]

[msg.section_0.entries.119]
text = [
  "En automne, à la saison des amours,\\n",
  "il fait des réserves de graisse et\\n",
  "arbore des couleurs chatoyantes.$",
]

[msg.section_0.entries.120]
text = [
  "Même amoché, son corps se régénère\\n",
  "tant que le noyau rouge est intact.\\n",
  "Le noyau s'illumine à minuit.$",
]

[msg.section_0.entries.121]
text = [
  "Un noyau rouge trône en son centre.\\n",
  "Il envoie des signaux radio mystérieux\\n",
  "vers le ciel nocturne.$",
]

[msg.section_0.entries.122]
text = [
  "En modifiant les molécules de l'air\\n",
  "du bout de ses doigts, il parvient\\n",
  "à créer un mur invisible devant lui.$",
]

[msg.section_0.entries.123]
text = [
  "À force de trancher des objets\\n",
  "solides, les faux de ses bras\\n",
  "sont très aiguisées.$",
]

[msg.section_0.entries.124]
text = [
  "Son cri ressemble à des paroles\\n",
  "humaines. Mais nul n'est jamais\\n",
  "parvenu à les comprendre.$",
]

[msg.section_0.entries.125]
text = [
  "Il fait tournoyer ses bras pour\\n",
  "donner de la force à ses coups.\\n",
  "Profitez-en pour filer!$",
]

[msg.section_0.entries.126]
text = [
  "Quand il respire profondément, des\\n",
  "vagues de chaleur émanent de son\\n",
  "corps et le rendent difficile à voir.$",
]

[msg.section_0.entries.127]
text = [
  "Il serre les proies dans ses pinces\\n",
  "pour les trancher en deux. S'il n'y\\n",
  "arrive pas, il les jette au loin.$",
]

[msg.section_0.entries.128]
text = [
  "Après avoir choisi sa cible, il fonce\\n",
  "dessus tête baissée. Il est réputé\\n",
  "pour sa nature violente.$",
]

[msg.section_0.entries.129]
text = [
  "Un vénérable Magicarpe peut\\n",
  "franchir une montagne en utilisant\\n",
  "Trempette. Mais c'est tout...$",
]

[msg.section_0.entries.130]
text = [
  "Quand il se laisse emporter par la\\n",
  "rage, il ne se calme qu'après avoir\\n",
  "détruit tout ce qui l'entoure.$",
]

[msg.section_0.entries.131]
text = [
  "Il aime naviguer en portant des\\n",
  "humains et des Pokémon sur son\\n",
  "dos. Il comprend le langage humain.$",
]

[msg.section_0.entries.132]
text = [
  "Il a la capacité de modifier sa\\n",
  "structure cellulaire pour prendre\\n",
  "l'apparence de ce qu'il voit.$",
]

[msg.section_0.entries.133]
text = [
  "Son ADN particulier lui permet de\\n",
  "s'adapter très rapidement à son\\n",
  "environnement.$",
]

[msg.section_0.entries.134]
text = [
  "Sa composition moléculaire est\\n",
  "proche de celle de l'eau, ce qui\\n",
  "lui permet de se liquéfier.$",
]

[msg.section_0.entries.135]
text = [
  "Face au danger, il fait appel à\\n",
  "l'électricité pour dresser ses\\n",
  "poils et lancer des décharges.$",
]

[msg.section_0.entries.136]
text = [
  "L'air qu'il inspire est chauffé par\\n",
  "la glande enflammée de son corps,\\n",
  "atteignant les 1 700 °C.$",
]

[msg.section_0.entries.137]
text = [
  "Ce Pokémon créé par des\\n",
  "scientifiques peut arpenter\\n",
  "librement le cyberespace.$",
]

[msg.section_0.entries.138]
text = [
  "Un Pokémon ramené à la vie par\\n",
  "la science à partir d'un fossile. Il\\n",
  "peuplait autrefois les mers.$",
]

[msg.section_0.entries.139]
text = [
  "On pense que ce Pokémon a disparu\\n",
  "parce que sa coquille en spirale\\n",
  "était devenue trop grosse.$",
]

[msg.section_0.entries.140]
text = [
  "On pense qu'il peuplait les plages\\n",
  "il y a 300 millions d'années. Il est\\n",
  "protégé par une coquille robuste.$",
]

[msg.section_0.entries.141]
text = [
  "On pense que ce Pokémon est\\n",
  "venu sur la terre ferme pour\\n",
  "suivre l'évolution de ses proies.$",
]

[msg.section_0.entries.142]
text = [
  "Un Pokémon qui arpentait le ciel\\n",
  "au temps des dinosaures. Ses\\n",
  "crocs sont pareils à des scies.$",
]

[msg.section_0.entries.143]
text = [
  "Une fois le ventre plein, il est trop\\n",
  "amorphe pour lever le petit doigt.\\n",
  "Sautez sur son ventre!$",
]

[msg.section_0.entries.144]
text = [
  "Un Pokémon Oiseau légendaire.\\n",
  "Il peut provoquer des blizzards\\n",
  "en gelant l'humidité de l'air.$",
]

[msg.section_0.entries.145]
text = [
  "Un Pokémon Oiseau légendaire dont\\n",
  "on dit qu'il vit dans les nuages\\n",
  "d'orage. Il contrôle la foudre.$",
]

[msg.section_0.entries.146]
text = [
  "L'un des Pokémon Oiseaux légendaires.\\n",
  "On dit que sa venue annonce l'arrivée\\n",
  "du printemps.$",
]

[msg.section_0.entries.147]
text = [
  "On l'appelle “Pokémon mirage\\\"\\n",
  "en raison de sa rareté. On a\\n",
  "découvert sa mue.$",
]

[msg.section_0.entries.148]
text = [
  "La météo change brusquement quand\\n",
  "il est entouré d'une aura. On dit\\n",
  "qu'il peuple les mers et les lacs.$",
]

[msg.section_0.entries.149]
text = [
  "On raconte qu'il vit quelque part\\n",
  "en mer. Il guide les équipages\\n",
  "naufragés jusqu'à la terre ferme.$",
]

[msg.section_0.entries.150]
text = [
  "Un Pokémon conçu en réorganisant\\n",
  "les gènes de Mew. On raconte qu'il\\n",
  "s'agit du Pokémon le plus féroce.$",
]

[msg.section_0.entries.151]
text = [
  "Nombre de scientifiques voient en\\n",
  "lui l'ancêtre des Pokémon car il\\n",
  "maîtrise toutes leurs capacités.$",
]

[msg.section_0.entries.152]
text = [
  "Il jauge la température et l'humidité\\n",
  "grâce à la feuille sur sa tête. Il\\n",
  "raffole des bains de soleil.$",
]

[msg.section_0.entries.153]
text = [
  "Le collier de bourgeons à son cou\\n",
  "répand un arôme épicé qui vous\\n",
  "donne du tonus.$",
]

[msg.section_0.entries.154]
text = [
  "Son souffle a l'incroyable capacité\\n",
  "de ranimer les plantes et les fleurs\\n",
  "flétries.$",
]

[msg.section_0.entries.155]
text = [
  "Ce Pokémon est un grand timide.\\n",
  "Les flammes sur son dos s'intensifient\\n",
  "lorsqu'il prend peur.$",
]

[msg.section_0.entries.156]
text = [
  "La chaleur de ses flammes intimide\\n",
  "l'ennemi. Elles s'intensifient\\n",
  "lorsqu'il se prépare à combattre.$",
]

[msg.section_0.entries.157]
text = [
  "Il attaque en projetant des flammes.\\n",
  "Il se dissimule derrière les vagues\\n",
  "de chaleur qu'il produit.$",
]

[msg.section_0.entries.158]
text = [
  "Il broie tout ce qu'il trouve avec\\n",
  "ses mâchoires puissantes. Même\\n",
  "son Dresseur doit s'en méfier.$",
]

[msg.section_0.entries.159]
text = [
  "Quand il mord, il ne lâche pas prise\\n",
  "avant que ses crocs se brisent.\\n",
  "Ils repoussent par la suite.$",
]

[msg.section_0.entries.160]
text = [
  "Ce Pokémon à l'air pataud est\\n",
  "capable d'attaquer à la vitesse\\n",
  "de l'éclair pour mordre sa proie.$",
]

[msg.section_0.entries.161]
text = [
  "Ce Pokémon très nerveux\\n",
  "prend appui sur sa queue pour\\n",
  "observer ses alentours.$",
]

[msg.section_0.entries.162]
text = [
  "La femelle s'enroule autour des\\n",
  "petits pour les bercer. Il accule\\n",
  "l'ennemi grâce à sa vitesse.$",
]

[msg.section_0.entries.163]
text = [
  "Il hulule chaque jour à la même\\n",
  "heure. Dans certaines cultures,\\n",
  "il incarne la sagesse.$",
]

[msg.section_0.entries.164]
text = [
  "Ses yeux sont capables de voir\\n",
  "distinctement même quand il fait\\n",
  "très sombre.$",
]

[msg.section_0.entries.165]
text = [
  "Il est si timide qu'il ne se déplace\\n",
  "qu'au milieu d'un essaim. Il exprime\\n",
  "ses émotions par l'odeur.$",
]

[msg.section_0.entries.166]
text = [
  "Il tire sa force de la lumière des\\n",
  "étoiles. Plus il y en a et plus ses\\n",
  "motifs dorsaux sont grands.$",
]

[msg.section_0.entries.167]
text = [
  "Il tisse une toile fine mais solide\\n",
  "pour poser des pièges et se poste\\n",
  "dans l'attente d'une proie.$",
]

[msg.section_0.entries.168]
text = [
  "Il attache un fil à sa proie avant\\n",
  "de la libérer. Il s'en servira pour\\n",
  "la retrouver, elle et ses amis.$",
]

[msg.section_0.entries.169]
text = [
  "La transformation de ses pattes en\\n",
  "ailes a certes amélioré sa capacité\\n",
  "à voler, mais pas à marcher.$",
]

[msg.section_0.entries.170]
text = [
  "Il envoie des décharges électriques\\n",
  "positives et négatives du bout des\\n",
  "antennes pour paralyser sa proie.$",
]

[msg.section_0.entries.171]
text = [
  "La lumière de Lanturn surgit des\\n",
  "profondeurs. On le surnomme\\n",
  "“étoile des profondeurs\\\".$",
]

[msg.section_0.entries.172]
text = [
  "Les poches électriques de ses\\n",
  "joues sont encore petites, mais\\n",
  "risquent de l'électrocuter.$",
]

[msg.section_0.entries.173]
text = [
  "On dit qu'il se déplace à dos\\n",
  "d'étoile filante. Il se montre\\n",
  "souvent quand on en voit.$",
]

[msg.section_0.entries.174]
text = [
  "Son corps est doux et élastique.\\n",
  "Quand il commence à rebondir,\\n",
  "on ne peut plus l'arrêter.$",
]

[msg.section_0.entries.175]
text = [
  "Il transforme les émotions\\n",
  "positives des autres en bonheur\\n",
  "qu'il stocke dans sa coquille.$",
]

[msg.section_0.entries.176]
text = [
  "Il parcourt le monde pour\\n",
  "distribuer de la joie aux\\n",
  "êtres bons.$",
]

[msg.section_0.entries.177]
text = [
  "Il mange des cactus en prenant\\n",
  "soin d'éviter les bourgeons et les\\n",
  "épines. Il ne tient pas en place.$",
]

[msg.section_0.entries.178]
text = [
  "Cet étrange Pokémon peut voir\\n",
  "l'avenir et le passé. Il guette\\n",
  "sans cesse la course du soleil.$",
]

[msg.section_0.entries.179]
text = [
  "Sa laine fournie enfle lorsqu'il\\n",
  "accumule de l'électricité statique.\\n",
  "Son contact peut choquer.$",
]

[msg.section_0.entries.180]
text = [
  "Sa queue s'allume lorsque sa\\n",
  "laine se charge d'électricité.\\n",
  "Il projette des poils électrifiés.$",
]

[msg.section_0.entries.181]
text = [
  "Le bout de sa queue brille avec\\n",
  "intensité. Jadis, on s'en servait\\n",
  "pour envoyer des signaux.$",
]

[msg.section_0.entries.182]
text = [
  "À la fin de la saison des pluies,\\n",
  "il sort danser en plein air,\\n",
  "attiré par la chaleur du soleil.$",
]

[msg.section_0.entries.183]
text = [
  "Sa queue à l'extrémité remplie\\n",
  "d'huile fait office de flotteur et\\n",
  "lui permet de ne pas couler.$",
]

[msg.section_0.entries.184]
text = [
  "Ses poumons peuvent contenir\\n",
  "assez d'air pour lui permettre de\\n",
  "passer une journée sous l'eau.$",
]

[msg.section_0.entries.185]
text = [
  "Il prend l'apparence d'un arbre\\n",
  "pour éviter les attaques, mais il\\n",
  "déteste l'eau et fuit la pluie.$",
]

[msg.section_0.entries.186]
text = [
  "Il rassemble ses pairs pour les\\n",
  "commander. Il utilise son cri\\n",
  "pour diriger Ptitard.$",
]

[msg.section_0.entries.187]
text = [
  "Il dérive avec le vent. Sa présence\\n",
  "en nombre dans les champs et les\\n",
  "montagnes annonce le printemps.$",
]

[msg.section_0.entries.188]
text = [
  "Il fleurit lorsque les températures\\n",
  "remontent. Il flotte dans le ciel\\n",
  "pour absorber les rayons du soleil.$",
]

[msg.section_0.entries.189]
text = [
  "Poussé par les vents saisonniers,\\n",
  "il fait le tour du globe en semant\\n",
  "des spores de coton.$",
]

[msg.section_0.entries.190]
text = [
  "Sa queue est aussi agile que ses\\n",
  "mains. Il vit en haut des grands\\n",
  "arbres.$",
]

[msg.section_0.entries.191]
text = [
  "Il tombe du ciel sans crier gare en\\n",
  "matinée. On en croise énormément\\n",
  "l'année suivant un été froid.$",
]

[msg.section_0.entries.192]
text = [
  "Les rayons du soleil lui donnent de\\n",
  "l'énergie. Il est connu pour migrer\\n",
  "vers les régions ensoleillées.$",
]

[msg.section_0.entries.193]
text = [
  "La vitesse de ses ailes lui permet\\n",
  "un vol stationnaire. Il surveille\\n",
  "ainsi tout son territoire.$",
]

[msg.section_0.entries.194]
text = [
  "Sur la terre ferme, il couvre son\\n",
  "corps d'un fluide toxique qui le\\n",
  "protège de la déshydratation.$",
]

[msg.section_0.entries.195]
text = [
  "De nature placide, il a tendance à\\n",
  "se cogner la tête contre les récifs\\n",
  "et autres bateaux de passage.$",
]

[msg.section_0.entries.196]
text = [
  "Sa fourrure est si sensible qu'il\\n",
  "peut détecter les vibrations de\\n",
  "l'air et prédire le temps qu'il fera.$",
]

[msg.section_0.entries.197]
text = [
  "Quand il s'expose à la lumière de la\\n",
  "lune, ses anneaux brillent et il\\n",
  "obtient un mystérieux pouvoir.$",
]

[msg.section_0.entries.198]
text = [
  "Quand il est en danger, il tente de\\n",
  "semer ses poursuivants dans les\\n",
  "chemins montagneux.$",
]

[msg.section_0.entries.199]
text = [
  "La morsure de Kokiyas a fait de lui\\n",
  "un génie dont l'intelligence rivalise\\n",
  "avec celle d'un prix Nobel.$",
]

[msg.section_0.entries.200]
text = [
  "Il fait peur aux aventuriers en\\n",
  "pleine nuit et se nourrit de leur\\n",
  "frayeur.$",
]

[msg.section_0.entries.201]
text = [
  "Quand il est seul, il ne se passe\\n",
  "rien... Mais en groupe, il semble\\n",
  "habité par un mystérieux pouvoir.$",
]

[msg.section_0.entries.202]
text = [
  "Il cherche désespérément à cacher\\n",
  "sa queue noire. Certains pensent\\n",
  "qu'elle renferme un secret.$",
]

[msg.section_0.entries.203]
text = [
  "La tête qu'il a sur la queue dispose\\n",
  "de son propre cerveau et lui\\n",
  "permet de couvrir ses arrières.$",
]

[msg.section_0.entries.204]
text = [
  "Il ressemble à une pomme de pin.\\n",
  "Sa carapace le protège des Pokémon\\n",
  "Oiseaux qui le picorent par erreur.$",
]

[msg.section_0.entries.205]
text = [
  "Il est prisonnier d'une coquille\\n",
  "d'acier. Ses yeux vigilants sont la\\n",
  "seule partie visible de son corps.$",
]

[msg.section_0.entries.206]
text = [
  "Son nid est un véritable labyrinthe\\n",
  "qu'il creuse à l'aide de sa queue.\\n",
  "Il sait à peine voler.$",
]

[msg.section_0.entries.207]
text = [
  "Il fend l'air et fond sur sa proie\\n",
  "pour s'agripper à son visage et\\n",
  "la frapper avec son dard.$",
]

[msg.section_0.entries.208]
text = [
  "On pense que son corps s'est\\n",
  "transformé à cause du fer contenu\\n",
  "dans la terre dont il se nourrit.$",
]

[msg.section_0.entries.209]
text = [
  "Son visage horrible fait fuir les\\n",
  "petits Pokémon. Par contre, les\\n",
  "femmes le trouvent mignon.$",
]

[msg.section_0.entries.210]
text = [
  "En dépit des apparences, c'est un\\n",
  "grand timide. Quand il s'énerve, il\\n",
  "mord de ses énormes crocs.$",
]

[msg.section_0.entries.211]
text = [
  "Il envoie ses piquants empoisonnés\\n",
  "à la ronde. Sa forme sphérique en\\n",
  "fait un piètre nageur.$",
]

[msg.section_0.entries.212]
text = [
  "Les yeux sur ses pinces servent à\\n",
  "intimider l'ennemi avant de passer\\n",
  "à l'attaque.$",
]

[msg.section_0.entries.213]
text = [
  "Il stocke des Baies sous sa\\n",
  "carapace. Elles fermentent et\\n",
  "produisent des jus délicieux.$",
]

[msg.section_0.entries.214]
text = [
  "Il défend vaillamment sa réserve de\\n",
  "miel personnelle à grand renfort\\n",
  "de coups de corne.$",
]

[msg.section_0.entries.215]
text = [
  "Ce Pokémon rusé agit parfois en\\n",
  "équipe pour voler des œufs, l'un\\n",
  "d'entre eux faisant diversion.$",
]

[msg.section_0.entries.216]
text = [
  "Il baigne ses griffes dans le miel\\n",
  "pour les lécher. Chaque paire\\n",
  "de pattes a un goût unique.$",
]

[msg.section_0.entries.217]
text = [
  "Il marque de ses griffes les arbres\\n",
  "de son territoire qui portent des\\n",
  "Baies ou des fruits.$",
]

[msg.section_0.entries.218]
text = [
  "Son corps est fait de magma.\\n",
  "S'il cesse de bouger, il refroidit\\n",
  "et durcit.$",
]

[msg.section_0.entries.219]
text = [
  "Sa température corporelle avoisine\\n",
  "les 10 000 °C. Des flammes fusent\\n",
  "des fissures de sa coquille.$",
]

[msg.section_0.entries.220]
text = [
  "Son nez très sensible détecte\\n",
  "champignons, Baies et sources\\n",
  "chaudes enfouis sous la glace.$",
]

[msg.section_0.entries.221]
text = [
  "Il est protégé du froid mordant par\\n",
  "son épais manteau de fourrure. Ses\\n",
  "cornes sont formées de glace.$",
]

[msg.section_0.entries.222]
text = [
  "On en trouve beaucoup dans les mers\\n",
  "claires du sud. On dirait qu'il ne peut\\n",
  "pas vivre en eau polluée.$",
]

[msg.section_0.entries.223]
text = [
  "Son puissant jet d'eau ne manque\\n",
  "jamais sa cible, même quand il est\\n",
  "au fond de l'eau.$",
]

[msg.section_0.entries.224]
text = [
  "Il adore se cacher dans les\\n",
  "fissures de la roche. Il crache\\n",
  "parfois de l'encre sur ses proies.$",
]

[msg.section_0.entries.225]
text = [
  "Il dépose sa nourriture dans sa\\n",
  "queue enroulée. Il l'offre souvent\\n",
  "aux gens égarés en montagne.$",
]

[msg.section_0.entries.226]
text = [
  "Il ignore royalement les Rémoraid\\n",
  "qui s'accrochent à ses nageoires\\n",
  "pour manger les restes qu'il sème.$",
]

[msg.section_0.entries.227]
text = [
  "Son corps est prisonnier d'une armure\\n",
  "dure comme l'acier, mais il vole à plus\\n",
  "de 300 km/h.$",
]

[msg.section_0.entries.228]
text = [
  "Il est assez évolué pour chasser\\n",
  "en meute et communiquer par\\n",
  "des séries de cris modulés.$",
]

[msg.section_0.entries.229]
text = [
  "En colère, il crache des flammes\\n",
  "contenant une toxine qui peut\\n",
  "causer des dégâts irréversibles.$",
]

[msg.section_0.entries.230]
text = [
  "Chacun de ses déplacements provoque\\n",
  "des tourbillons. Il vit dans les grottes\\n",
  "sous-marines.$",
]

[msg.section_0.entries.231]
text = [
  "Il est fort malgré son aspect ramassé.\\n",
  "Il n'a aucun mal à porter un humain\\n",
  "adulte sur son dos.$",
]

[msg.section_0.entries.232]
text = [
  "Il attaque en se roulant en boule\\n",
  "pour percuter l'ennemi. Il peut\\n",
  "abattre une maison d'un seul coup.$",
]

[msg.section_0.entries.233]
text = [
  "Il a subi une mise à jour censée lui\\n",
  "permettre d'explorer d'autres\\n",
  "planètes... C'est un échec.$",
]

[msg.section_0.entries.234]
text = [
  "Quiconque observe ses antennes\\n",
  "ressent une sensation étrange,\\n",
  "comme si leur centre l'attirait.$",
]

[msg.section_0.entries.235]
text = [
  "Il marque son territoire en maniant\\n",
  "sa queue comme un pinceau. On\\n",
  "dénombre plus de 5 000 marques.$",
]

[msg.section_0.entries.236]
text = [
  "Il est réputé pour sa combativité.\\n",
  "Il se blesse toujours en défiant\\n",
  "des ennemis plus grands.$",
]

[msg.section_0.entries.237]
text = [
  "Il combat en tournoyant comme une\\n",
  "toupie. La force centrifuge décuple\\n",
  "sa puissance destructrice.$",
]

[msg.section_0.entries.238]
text = [
  "Il goûte à tout du bout des lèvres.\\n",
  "Elles gardent en mémoire ses\\n",
  "goûts et ses dégoûts.$",
]

[msg.section_0.entries.239]
text = [
  "Un faible courant électrique circule\\n",
  "entre ses cornes. Attention à ne\\n",
  "pas y mettre la main!$",
]

[msg.section_0.entries.240]
text = [
  "Son sang est chaud comme du magma\\n",
  "et la température de son corps\\n",
  "peut atteindre 600 °C.$",
]

[msg.section_0.entries.241]
text = [
  "On raconte que les enfants élevés\\n",
  "au lait d'Écrémeuh deviennent des\\n",
  "adultes braves et robustes.$",
]

[msg.section_0.entries.242]
text = [
  "Les œufs que pond Leuphorie sont\\n",
  "un concentré de bonheur dont une\\n",
  "bouchée suffit à apporter la joie.$",
]

[msg.section_0.entries.243]
text = [
  "On prétend qu'il est tombé avec la\\n",
  "foudre. Il peut lancer des éclairs\\n",
  "grâce aux nuages sur son dos.$",
]

[msg.section_0.entries.244]
text = [
  "On raconte qu'à chaque fois qu'il\\n",
  "rugit, un volcan entre en éruption\\n",
  "quelque part.$",
]

[msg.section_0.entries.245]
text = [
  "Il parcourt le vaste monde pour\\n",
  "purifier les eaux polluées. Il\\n",
  "accompagne le vent du nord.$",
]

[msg.section_0.entries.246]
text = [
  "Un Pokémon qui se nourrit de terre.\\n",
  "Après avoir dévoré une montagne,\\n",
  "il s'endort pour grandir.$",
]

[msg.section_0.entries.247]
text = [
  "Son corps est dur comme la pierre\\n",
  "souterraine. Il file comme une\\n",
  "fusée en expulsant des gaz.$",
]

[msg.section_0.entries.248]
text = [
  "Lorsqu'il est en colère, il abat des\\n",
  "montagnes et enterre des fleuves.\\n",
  "On doit alors modifier les cartes.$",
]

[msg.section_0.entries.249]
text = [
  "Il dort dans une faille des grands\\n",
  "fonds. Ses battements d'ailes\\n",
  "génèrent une tempête de 40 jours.$",
]

[msg.section_0.entries.250]
text = [
  "Ses plumes possèdent sept couleurs.\\n",
  "On prétend que sa vue apporte la\\n",
  "joie éternelle.$",
]

[msg.section_0.entries.251]
text = [
  "Il a le pouvoir de voyager dans le\\n",
  "temps. Cependant, on dit qu'il\\n",
  "n'apparaît qu'en temps de paix.$",
]

[msg.section_0.entries.252]
text = [
  "Ses plantes de pieds sont couvertes\\n",
  "d'épines lui permettant de marcher\\n",
  "au mur et au plafond.$",
]

[msg.section_0.entries.253]
text = [
  "Il vit dans les jungles denses.\\n",
  "Il saute de branche en branche\\n",
  "pour approcher de sa proie.$",
]

[msg.section_0.entries.254]
text = [
  "Les feuilles sur ses bras peuvent\\n",
  "trancher des troncs épais. C'est\\n",
  "le meilleur combattant des jungles.$",
]

[msg.section_0.entries.255]
text = [
  "Ses câlins réchauffent car il renferme\\n",
  "une fournaise. Il envoie des boules de\\n",
  "feu à 1 000 °C.$",
]

[msg.section_0.entries.256]
text = [
  "Ce maître du coup de pied peut donner\\n",
  "10 coups par seconde. Ses cris aigus\\n",
  "intimident l'ennemi.$",
]

[msg.section_0.entries.257]
text = [
  "Des flammes fusent de ses\\n",
  "poignets et ses coups brûlent\\n",
  "l'ennemi.$",
]

[msg.section_0.entries.258]
text = [
  "Il analyse le courant grâce à la\\n",
  "nageoire sur sa tête. Il est assez\\n",
  "fort pour soulever des rochers.$",
]

[msg.section_0.entries.259]
text = [
  "Ses jambes robustes lui donnent\\n",
  "un bon appui, même dans la boue.\\n",
  "Il dort enfoui dans la saleté.$",
]

[msg.section_0.entries.260]
text = [
  "Il peut traîner un grand bateau en\\n",
  "nageant. Il assomme l'ennemi d'un\\n",
  "grand coup de ses bras épais.$",
]

[msg.section_0.entries.261]
text = [
  "Un Pokémon très obstiné qui\\n",
  "poursuit sa proie jusqu'à ce\\n",
  "qu'elle soit épuisée.$",
]

[msg.section_0.entries.262]
text = [
  "Il traque ses proies en groupe.\\n",
  "Il ne désobéira jamais aux\\n",
  "ordres d'un bon Dresseur.$",
]

[msg.section_0.entries.263]
text = [
  "Il marche en zigzaguant et n'a\\n",
  "pas son pareil pour trouver des\\n",
  "objets dans l'herbe ou sous terre.$",
]

[msg.section_0.entries.264]
text = [
  "Il fonce sur sa proie à plus de 100 km/h.\\n",
  "Mais il ne peut pas dévier sa course\\n",
  "et loupe souvent sa cible.$",
]

[msg.section_0.entries.265]
text = [
  "Cible favorite des Pokémon Oiseaux,\\n",
  "il tente de se protéger avec ses\\n",
  "épines venimeuses.$",
]

[msg.section_0.entries.266]
text = [
  "Il attend d'évoluer dans son cocon\\n",
  "de soie accroché aux branches et\\n",
  "se nourrit d'eau de pluie.$",
]

[msg.section_0.entries.267]
text = [
  "Malgré les apparences, il est très\\n",
  "agressif et attaque avec sa trompe\\n",
  "quand on le dérange.$",
]

[msg.section_0.entries.268]
text = [
  "Rancunier, il n'oublie aucune des\\n",
  "attaques subies dans le cocon et\\n",
  "se venge une fois qu'il a évolué.$",
]

[msg.section_0.entries.269]
text = [
  "Il disperse un nuage de poudre\\n",
  "toxique à chaque coup d'aile. Il\\n",
  "aime les feuilles d'arbres urbains.$",
]

[msg.section_0.entries.270]
text = [
  "Il ressemble à une plante aquatique\\n",
  "et fait la navette pour les Pokémon\\n",
  "qui ne savent pas nager.$",
]

[msg.section_0.entries.271]
text = [
  "C'est un mauvais plaisantin. Quand\\n",
  "il repère un pêcheur, il tire sur sa\\n",
  "ligne pour le déranger.$",
]

[msg.section_0.entries.272]
text = [
  "Ses muscles se tonifient au son\\n",
  "d'une musique entraînante. Il ne\\n",
  "peut pas s'empêcher de danser.$",
]

[msg.section_0.entries.273]
text = [
  "Il ressemble à un gland pendu à\\n",
  "une branche. Il adore effrayer\\n",
  "les autres Pokémon.$",
]

[msg.section_0.entries.274]
text = [
  "Le son de sa flûte d'herbe\\n",
  "déstabilise l'auditeur. Il vit au\\n",
  "plus profond des forêts.$",
]

[msg.section_0.entries.275]
text = [
  "D'un coup de sa feuille éventail, il\\n",
  "génère des bourrasques de 30 m/s\\n",
  "capables de souffler une maison.$",
]

[msg.section_0.entries.276]
text = [
  "Ce Pokémon téméraire n'a pas peur\\n",
  "d'affronter des ennemis puissants.\\n",
  "Il vole en quête de climats chauds.$",
]

[msg.section_0.entries.277]
text = [
  "Il vole en cercle en quête d'une\\n",
  "proie. Dès qu'il l'a repérée, il fond\\n",
  "sur elle en un éclair.$",
]

[msg.section_0.entries.278]
text = [
  "Il utilise les courants ascendants\\n",
  "pour planer en altitude. Son bec lui\\n",
  "sert à transporter la nourriture.$",
]

[msg.section_0.entries.279]
text = [
  "Ce messager du ciel transporte\\n",
  "petits Pokémon et œufs dans son\\n",
  "bec en toute sécurité.$",
]

[msg.section_0.entries.280]
text = [
  "Quand ses cornes captent les ondes\\n",
  "positives d'un Pokémon ou d'un\\n",
  "humain, son corps se réchauffe.$",
]

[msg.section_0.entries.281]
text = [
  "Quand il sent la joie de son\\n",
  "Dresseur, il se met à danser,\\n",
  "débordant d'énergie.$",
]

[msg.section_0.entries.282]
text = [
  "Prêt à tout pour protéger son\\n",
  "Dresseur, il peut créer un mini trou\\n",
  "noir par sa seule force mentale.$",
]

[msg.section_0.entries.283]
text = [
  "Il semble patiner sur l'eau. Le parfum\\n",
  "diffusé par le sommet de sa tête sert\\n",
  "à attirer ses proies.$",
]

[msg.section_0.entries.284]
text = [
  "Des motifs en forme d'yeux ornent\\n",
  "ses antennes. Ses 4 ailes l'aident\\n",
  "à voler dans toutes les directions.$",
]

[msg.section_0.entries.285]
text = [
  "Le sommet de sa tête libère des\\n",
  "spores empoisonnées. Il est\\n",
  "dangereux de les inhaler.$",
]

[msg.section_0.entries.286]
text = [
  "Ses petits bras s'étendent quand il\\n",
  "donne un coup de poing. Son talent\\n",
  "égale celui d'un boxeur pro.$",
]

[msg.section_0.entries.287]
text = [
  "Il passe le plus clair de son temps\\n",
  "affalé. Rien qu'à le voir, on a\\n",
  "envie de bâiller.$",
]

[msg.section_0.entries.288]
text = [
  "Son cœur bat dix fois plus vite que\\n",
  "la normale, c'est pourquoi il ne\\n",
  "tient pas en place.$",
]

[msg.section_0.entries.289]
text = [
  "Le Pokémon le plus fainéant du\\n",
  "monde. Il s'allonge pour économiser\\n",
  "ses forces et contre-attaquer.$",
]

[msg.section_0.entries.290]
text = [
  "Il grandit sous terre et se repère\\n",
  "grâce à ses antennes car ses\\n",
  "yeux sont quasiment aveugles.$",
]

[msg.section_0.entries.291]
text = [
  "Il bouge si vite que l'œil a parfois du\\n",
  "mal à le suivre. Ils se regroupent près\\n",
  "de la sève des arbres.$",
]

[msg.section_0.entries.292]
text = [
  "Une carapace d'insecte laissée à\\n",
  "l'abandon. On dit qu'il vole l'âme\\n",
  "de celui qui regarde à l'intérieur.$",
]

[msg.section_0.entries.293]
text = [
  "En temps normal, son cri est pareil\\n",
  "à un murmure. Effrayé, il atteint le\\n",
  "volume d'un avion à réaction.$",
]

[msg.section_0.entries.294]
text = [
  "L'onde de choc provoquée par son\\n",
  "cri peut renverser un camion. Il\\n",
  "trépigne pour augmenter sa force.$",
]

[msg.section_0.entries.295]
text = [
  "Son hurlement s'entend à 10 km à la\\n",
  "ronde. Ses orifices émettent toutes\\n",
  "sortes de bruits.$",
]

[msg.section_0.entries.296]
text = [
  "Il fortifie son corps en fonçant\\n",
  "sur des arbres épais. Son nid est\\n",
  "entouré d'arbres abattus.$",
]

[msg.section_0.entries.297]
text = [
  "Il aime mesurer sa force à celle des\\n",
  "plus grands Pokémon. Ses coups de\\n",
  "paume peuvent projeter un camion.$",
]

[msg.section_0.entries.298]
text = [
  "Sa queue est plus rebondissante\\n",
  "qu'une balle du même nom. C'est\\n",
  "aussi une massue très puissante.$",
]

[msg.section_0.entries.299]
text = [
  "Face au danger, il se protège en\\n",
  "augmentant son magnétisme et en\\n",
  "attirant tout objet métallique.$",
]

[msg.section_0.entries.300]
text = [
  "Il poursuit tout ce qui bouge. On\\n",
  "le voit parfois courir en cercle,\\n",
  "chassant sa propre queue.$",
]

[msg.section_0.entries.301]
text = [
  "Les femmes Dresseurs raffolent\\n",
  "de sa sublime fourrure. Il ne\\n",
  "possède pas de nid.$",
]

[msg.section_0.entries.302]
text = [
  "À force de manger des gemmes, les\\n",
  "yeux de ce Pokémon des grottes\\n",
  "obscures sont devenus des joyaux.$",
]

[msg.section_0.entries.303]
text = [
  "Ses cornes forment une grande\\n",
  "mâchoire attachée à sa tête. Elle\\n",
  "peut broyer des barres de fer.$",
]

[msg.section_0.entries.304]
text = [
  "Il vit habituellement au cœur des\\n",
  "montagnes. Affamé, il dévore\\n",
  "parfois des rails et des voitures.$",
]

[msg.section_0.entries.305]
text = [
  "Il se nourrit du minerai de fer qu'il\\n",
  "fore. Il défend son territoire en\\n",
  "chargeant avec son corps d'acier.$",
]

[msg.section_0.entries.306]
text = [
  "Il creuse des galeries à travers la\\n",
  "pierre avec ses cornes d'acier pour\\n",
  "trouver le fer qu'il apprécie.$",
]

[msg.section_0.entries.307]
text = [
  "Son entraînement d'ermite lui\\n",
  "permet de léviter par le seul\\n",
  "pouvoir de la méditation.$",
]

[msg.section_0.entries.308]
text = [
  "Le jeûne lui permet de concentrer\\n",
  "son esprit au point de déceler\\n",
  "l'aura de ses adversaires.$",
]

[msg.section_0.entries.309]
text = [
  "Il améliore ses réflexes en\\n",
  "stimulant ses muscles grâce à\\n",
  "l'électricité dans sa fourrure.$",
]

[msg.section_0.entries.310]
text = [
  "Il libère l'électricité par sa crinière.\\n",
  "Il crée un nuage d'orage pour appeler\\n",
  "la foudre.$",
]

[msg.section_0.entries.311]
text = [
  "Il absorbe l'énergie des poteaux\\n",
  "électriques et encourage ses amis\\n",
  "avec des pompons d'étincelles.$",
]

[msg.section_0.entries.312]
text = [
  "Il encourage ses amis. Son corps\\n",
  "produit plus d'étincelles quand il\\n",
  "est en mauvaise posture.$",
]

[msg.section_0.entries.313]
text = [
  "Il communique avec ses pairs en\\n",
  "allumant son postérieur la nuit. Il\\n",
  "adore le doux parfum de Lumivole.$",
]

[msg.section_0.entries.314]
text = [
  "Il utilise son doux parfum pour aider\\n",
  "Muciole à décrire des arabesques\\n",
  "dans le ciel nocturne.$",
]

[msg.section_0.entries.315]
text = [
  "Plus le Rosélia est en bonne santé\\n",
  "et plus son parfum est agréable et\\n",
  "relaxant pour son entourage.$",
]

[msg.section_0.entries.316]
text = [
  "Il est principalement composé d'un\\n",
  "estomac dont les sucs digestifs\\n",
  "dissolvent tout ce qu'il avale.$",
]

[msg.section_0.entries.317]
text = [
  "Il avale tout en une bouchée. Ses\\n",
  "follicules sécrètent des fluides\\n",
  "toxiques qui endorment l'ennemi.$",
]

[msg.section_0.entries.318]
text = [
  "Il attaque en banc quand on menace\\n",
  "son territoire. Ses dents aiguisées\\n",
  "peuvent couler un navire.$",
]

[msg.section_0.entries.319]
text = [
  "Ses crocs lacèrent des feuilles\\n",
  "d'acier. Il nage à 120 km/h. On\\n",
  "l'appelle “tyran des mers\\\".$",
]

[msg.section_0.entries.320]
text = [
  "Par beau temps, il se pose sur les\\n",
  "plages pour jouer et rebondir. Il\\n",
  "expulse de l'eau par son évent.$",
]

[msg.section_0.entries.321]
text = [
  "Le plus grand des Pokémon. Il peut\\n",
  "plonger à une profondeur de\\n",
  "3 000 m en retenant son souffle.$",
]

[msg.section_0.entries.322]
text = [
  "Son dos bossu renferme une lave\\n",
  "bouillonnante. Elle refroidit par\\n",
  "temps de pluie, ce qui le ralentit.$",
]

[msg.section_0.entries.323]
text = [
  "Il porte des volcans sur son dos.\\n",
  "Quand le magma remonte, il\\n",
  "frissonne et entre en éruption.$",
]

[msg.section_0.entries.324]
text = [
  "Il tire son énergie du charbon qu'il\\n",
  "brûle dans sa carapace et crache\\n",
  "de la suie noire en cas de danger.$",
]

[msg.section_0.entries.325]
text = [
  "Il utilise sa queue comme un ressort\\n",
  "et bondit partout. Chaque nouveau\\n",
  "choc fait battre son cœur.$",
]

[msg.section_0.entries.326]
text = [
  "Les perles noires amplifient ses\\n",
  "pouvoirs psy. Sa danse étrange lui\\n",
  "permet de contrôler ses ennemis.$",
]

[msg.section_0.entries.327]
text = [
  "Les motifs sur leur fourrure sont\\n",
  "propres à chaque Spinda. Son pas\\n",
  "chancelant le rend difficile à viser.$",
]

[msg.section_0.entries.328]
text = [
  "Il creuse un trou conique dans le\\n",
  "sable du désert et se terre en\\n",
  "attendant qu'une proie trébuche.$",
]

[msg.section_0.entries.329]
text = [
  "Ses violents battements d'ailes\\n",
  "génèrent des vagues d'ultrasons\\n",
  "qui donnent mal au crâne.$",
]

[msg.section_0.entries.330]
text = [
  "Son puissant battement d'ailes\\n",
  "provoque des tempêtes de sable.\\n",
  "On l'appelle “esprit du désert\\\".$",
]

[msg.section_0.entries.331]
text = [
  "En stockant l'eau dans son corps,\\n",
  "cet habitant du désert peut\\n",
  "survivre 30 jours sans boire.$",
]

[msg.section_0.entries.332]
text = [
  "Il sort la nuit pour chasser. Il\\n",
  "traque les proies épuisées après\\n",
  "une journée dans le désert.$",
]

[msg.section_0.entries.333]
text = [
  "Il ne se sent à l'aise que dans un\\n",
  "milieu propre et repousse la\\n",
  "poussière avec ses ailes.$",
]

[msg.section_0.entries.334]
text = [
  "Il aime enlacer ses amis dans ses\\n",
  "ailes cotonneuses et ronronner.$",
]

[msg.section_0.entries.335]
text = [
  "C'est le rival de Séviper depuis\\n",
  "des générations. Ses griffes\\n",
  "aiguisées sont son meilleur atout.$",
]

[msg.section_0.entries.336]
text = [
  "Le rival historique de Mangriff.\\n",
  "Il affûte la lame de sa queue\\n",
  "sur les rochers avant le combat.$",
]

[msg.section_0.entries.337]
text = [
  "On suppose qu'il est lié au cycle\\n",
  "lunaire, car il ne sort que les\\n",
  "soirs de pleine lune.$",
]

[msg.section_0.entries.338]
text = [
  "Le bruit court que cette nouvelle\\n",
  "espèce vient du soleil. Il produit\\n",
  "de la lumière en tournoyant.$",
]

[msg.section_0.entries.339]
text = [
  "Son corps glissant est difficile à\\n",
  "attraper. On dit qu'il a été créé\\n",
  "dans de la boue solidifiée.$",
]

[msg.section_0.entries.340]
text = [
  "Il défend férocement son territoire\\n",
  "en déclenchant des secousses\\n",
  "terribles.$",
]

[msg.section_0.entries.341]
text = [
  "Sa nature robuste lui permet de\\n",
  "vivre sur n'importe quel terrain.\\n",
  "Ses pinces ne lâchent jamais prise.$",
]

[msg.section_0.entries.342]
text = [
  "C'est un voyou qui utilise ses\\n",
  "pinces pour chasser les autres\\n",
  "Pokémon hors de sa mare.$",
]

[msg.section_0.entries.343]
text = [
  "Il se déplace en tournoyant sur\\n",
  "son pied. Ce Pokémon rare fut\\n",
  "découvert dans de vieilles ruines.$",
]

[msg.section_0.entries.344]
text = [
  "Une ancienne figurine d'argile qui\\n",
  "s'est animée suite à son exposition\\n",
  "à un rayon de lumière étrange.$",
]

[msg.section_0.entries.345]
text = [
  "Il vivait au fond de la mer il y a\\n",
  "100 millions d'années. La science\\n",
  "a permis de le ressusciter.$",
]

[msg.section_0.entries.346]
text = [
  "Vit dans les hauts-fonds des mers\\n",
  "chaudes. Il déterre sa proie du\\n",
  "sable quand la marée se retire.$",
]

[msg.section_0.entries.347]
text = [
  "Un ancêtre Pokémon réanimé à partir\\n",
  "d'un fossile. Il vivait en mer et\\n",
  "chassait avec ses pinces.$",
]

[msg.section_0.entries.348]
text = [
  "Il a gagné la côte après son\\n",
  "évolution. Une armure robuste\\n",
  "recouvre son corps.$",
]

[msg.section_0.entries.349]
text = [
  "Ce Pokémon a peut-être un physique\\n",
  "disgracieux, mais il est robuste et\\n",
  "peut survivre dans très peu d'eau.$",
]

[msg.section_0.entries.350]
text = [
  "Ses splendides écailles aux couleurs\\n",
  "de l'arc-en-ciel changent de teinte\\n",
  "selon l'angle de vue.$",
]

[msg.section_0.entries.351]
text = [
  "Son aspect change avec la météo.\\n",
  "On a récemment découvert que ses\\n",
  "molécules étaient pareilles à l'eau.$",
]

[msg.section_0.entries.352]
text = [
  "Il change de couleur à volonté,\\n",
  "mais le motif en zigzag qui orne\\n",
  "son ventre reste le même.$",
]

[msg.section_0.entries.353]
text = [
  "Il aime le goût de la vengeance.\\n",
  "Ils vivent en rangs sous les\\n",
  "gouttières des gens vindicatifs.$",
]

[msg.section_0.entries.354]
text = [
  "Une poupée mue par la tristesse qui\\n",
  "la ronge depuis qu'on l'a délaissée.\\n",
  "Elle recherche son propriétaire.$",
]

[msg.section_0.entries.355]
text = [
  "Les cris des enfants l'amusent.\\n",
  "Il effraie les moins sages d'entre\\n",
  "eux en traversant les murs.$",
]

[msg.section_0.entries.356]
text = [
  "Il cherche des feux follets pour\\n",
  "les avaler. Ce qui se passe alors\\n",
  "dans son corps est un mystère.$",
]

[msg.section_0.entries.357]
text = [
  "À force de toujours manger le même\\n",
  "fruit succulent, il en pousse à la\\n",
  "base de son cou.$",
]

[msg.section_0.entries.358]
text = [
  "Ses cris se répercutent dans son\\n",
  "corps creux avant d'exploser en\\n",
  "notes mélodieuses et saisissantes.$",
]

[msg.section_0.entries.359]
text = [
  "La capacité de sa corne à sentir\\n",
  "les catastrophes ayant trop attiré\\n",
  "l'attention sur lui, il vit reclus.$",
]

[msg.section_0.entries.360]
text = [
  "Il se muscle en bousculant ses\\n",
  "semblables lors de mêlées. Il\\n",
  "raffole des fruits sucrés.$",
]

[msg.section_0.entries.361]
text = [
  "On dit que des groupes entiers de\\n",
  "Stalgamin vivent en harmonie\\n",
  "sous des feuilles gigantesques.$",
]

[msg.section_0.entries.362]
text = [
  "Il empêche ses proies de prendre\\n",
  "la fuite en gelant instantanément\\n",
  "l'humidité de l'air.$",
]

[msg.section_0.entries.363]
text = [
  "Il gagne la côte en roulant sur les\\n",
  "blocs de glace car sa morphologie\\n",
  "n'est pas adaptée à la nage.$",
]

[msg.section_0.entries.364]
text = [
  "Il fait souvent tourner des objets\\n",
  "sur son museau pour connaître\\n",
  "leur odeur et leur texture.$",
]

[msg.section_0.entries.365]
text = [
  "Il brise la glace avec ses grosses\\n",
  "défenses. Sa graisse le protège du\\n",
  "froid, mais aussi des attaques.$",
]

[msg.section_0.entries.366]
text = [
  "Il ne produit qu'une perle durant\\n",
  "son existence. On raconte qu'elle\\n",
  "amplifie les pouvoirs psychiques.$",
]

[msg.section_0.entries.367]
text = [
  "Il vit loin sous la mer. Il appâte\\n",
  "les proies crédules avec sa queue\\n",
  "qui rappelle un petit poisson.$",
]

[msg.section_0.entries.368]
text = [
  "Au printemps, son corps rose se\\n",
  "fait plus vif sans que l'on sache\\n",
  "pourquoi. Il vit au fond de la mer.$",
]

[msg.section_0.entries.369]
text = [
  "Un Pokémon rare aperçu lors d'une\\n",
  "exploration sous-marine. Il n'a pas\\n",
  "évolué depuis 100 millions d'années.$",
]

[msg.section_0.entries.370]
text = [
  "Un habitant des mers chaudes. On\\n",
  "dit que le couple qui tombe sur ce\\n",
  "Pokémon connaîtra l'amour éternel.$",
]

[msg.section_0.entries.371]
text = [
  "Il rêve de pouvoir voler un jour.\\n",
  "Pour l'heure, il s'entraîne en\\n",
  "sautant du haut des falaises.$",
]

[msg.section_0.entries.372]
text = [
  "Ses cellules ont commencé à changer\\n",
  "dans sa robuste coquille. Il la perd\\n",
  "en évoluant.$",
]

[msg.section_0.entries.373]
text = [
  "À force de rêver de pouvoir voler,\\n",
  "sa structure cellulaire a évolué\\n",
  "et il s'est vu pousser des ailes.$",
]

[msg.section_0.entries.374]
text = [
  "Il dialogue avec les siens par\\n",
  "impulsions magnétiques. En bande,\\n",
  "ils se déplacent à l'unisson.$",
]

[msg.section_0.entries.375]
text = [
  "Il est formé de deux Terhal\\n",
  "soudés. Son corps de fer résiste à\\n",
  "un choc avec un avion à réaction.$",
]

[msg.section_0.entries.376]
text = [
  "Il est né de la fusion de plusieurs\\n",
  "Métang. Ses quatre cerveaux en\\n",
  "font l'égal d'un superordinateur.$",
]

[msg.section_0.entries.377]
text = [
  "Tout son corps est fait de roche.\\n",
  "S'il s'ébrèche au combat, il utilise\\n",
  "des pierres pour le réparer.$",
]

[msg.section_0.entries.378]
text = [
  "Son corps est fait de glace datant\\n",
  "de l'ère glaciaire. Il contrôle un\\n",
  "air gelé de -200 °C.$",
]

[msg.section_0.entries.379]
text = [
  "Son corps invulnérable fut forgé\\n",
  "par la pression souterraine durant\\n",
  "des dizaines de milliers d'années.$",
]

[msg.section_0.entries.380]
text = [
  "Son corps est recouvert d'un\\n",
  "duvet qui reflète la lumière\\n",
  "et le rend invisible.$",
]

[msg.section_0.entries.381]
text = [
  "Un Pokémon très intelligent. Il\\n",
  "peut voler plus vite qu'un avion à\\n",
  "réaction en repliant ses ailes.$",
]

[msg.section_0.entries.382]
text = [
  "On dit qu'il a fait monter les eaux\\n",
  "en causant des pluies diluviennes.\\n",
  "Il somnolait dans une fosse marine.$",
]

[msg.section_0.entries.383]
text = [
  "Il dormait dans le magma souterrain\\n",
  "depuis sa lutte féroce contre\\n",
  "Kyogre, il y a longtemps de cela.$",
]

[msg.section_0.entries.384]
text = [
  "Il vit dans la couche d'ozone, au\\n",
  "dessus des nuages. Il est invisible\\n",
  "depuis le sol.$",
]

[msg.section_0.entries.385]
text = [
  "On raconte qu'une fois tous les\\n",
  "mille ans, il a la capacité d'exaucer\\n",
  "tous les vœux durant une semaine.$",
]

[msg.section_0.entries.386]
text = [
  "Il vient d'un virus extraterrestre\\n",
  "arrivé avec une météorite et ayant\\n",
  "subi une mutation génétique.$",
]

[msg.section_0.entries.387]
text = [
  "La coquille sur son dos est faite de\\n",
  "terre. Plus il est en bonne santé,\\n",
  "plus elle est humide.$",
]

[msg.section_0.entries.388]
text = [
  "Il sait d'instinct où trouver une\\n",
  "source d'eau pure. Il y transporte\\n",
  "d'autres Pokémon sur son dos.$",
]

[msg.section_0.entries.389]
text = [
  "Certains petits Pokémon peuvent\\n",
  "naître sur son dos et y passer\\n",
  "toute leur vie.$",
]

[msg.section_0.entries.390]
text = [
  "Il est très agile. Il fait toujours\\n",
  "attention d'éteindre la flamme de\\n",
  "sa queue avant de se coucher.$",
]

[msg.section_0.entries.391]
text = [
  "Il contrôle habilement l'intensité\\n",
  "de la flamme de sa queue pour tenir\\n",
  "ses adversaires à distance.$",
]

[msg.section_0.entries.392]
text = [
  "Ses techniques de combat inédites\\n",
  "à base de pieds et poings enflammés\\n",
  "sont redoutables.$",
]

[msg.section_0.entries.393]
text = [
  "Malgré sa démarche maladroite et\\n",
  "ses pertes d'équilibre, il bombe\\n",
  "toujours fièrement le torse.$",
]

[msg.section_0.entries.394]
text = [
  "La fierté du Prinplouf est si\\n",
  "grande qu'il lui est impossible\\n",
  "de vivre en groupe.$",
]

[msg.section_0.entries.395]
text = [
  "S'il voit son honneur bafoué, il\\n",
  "est capable de faire des ravages\\n",
  "avec ses ailes tranchantes.$",
]

[msg.section_0.entries.396]
text = [
  "La faiblesse des Étourmi les force\\n",
  "à vivre en groupe, mais ils se\\n",
  "chamaillent souvent.$",
]

[msg.section_0.entries.397]
text = [
  "Conscient de sa propre faiblesse,\\n",
  "il vit toujours en groupe, piaillant\\n",
  "bruyamment quand il est seul.$",
]

[msg.section_0.entries.398]
text = [
  "Il combattra sans relâche, même\\n",
  "blessé. Il prend grand soin de sa\\n",
  "mèche.$",
]

[msg.section_0.entries.399]
text = [
  "Une étude a montré que les dents\\n",
  "du Keunotor poussaient aussi\\n",
  "vite que celles du Rattata.$",
]

[msg.section_0.entries.400]
text = [
  "Les digues insubmersibles qu'il\\n",
  "construit font le bonheur des\\n",
  "habitants proches.$",
]

[msg.section_0.entries.401]
text = [
  "Quand il tombe du haut de ses\\n",
  "petites pattes, ses antennes\\n",
  "font un bruit de xylophone.$",
]

[msg.section_0.entries.402]
text = [
  "Ses cris sont tellement variés qu'il\\n",
  "existe un village où on organise\\n",
  "des concours en leur honneur.$",
]

[msg.section_0.entries.403]
text = [
  "Ses muscles génèrent un courant\\n",
  "électrique lorsqu'ils travaillent.\\n",
  "Il s'illumine en cas de danger.$",
]

[msg.section_0.entries.404]
text = [
  "Le courant qui circule à la pointe\\n",
  "de ses griffes est capable de faire\\n",
  "perdre connaissance à ses proies.$",
]

[msg.section_0.entries.405]
text = [
  "Il est capable de voir à travers\\n",
  "les murs pour chasser des proies\\n",
  "ou retrouver ses petits égarés.$",
]

[msg.section_0.entries.406]
text = [
  "Il est sensible aux variations de\\n",
  "température et on dit qu'il fleurit\\n",
  "quand il sent la chaleur du soleil.$",
]

[msg.section_0.entries.407]
text = [
  "Ses mains contenant chacune des\\n",
  "toxines différentes sont capables\\n",
  "d'asséner de puissants coups.$",
]

[msg.section_0.entries.408]
text = [
  "Il vivait dans la jungle il y a\\n",
  "100 millions d'années. Il abat\\n",
  "un arbre d'un coup de tête.$",
]

[msg.section_0.entries.409]
text = [
  "Quand deux Charkos se rentrent\\n",
  "dedans, leur crâne extrêmement\\n",
  "épais les empêche de s'assommer.$",
]

[msg.section_0.entries.410]
text = [
  "Il est si bien protégé qu'il peut\\n",
  "déguster Baies et herbe fraîche\\n",
  "sans craindre de prédateurs.$",
]

[msg.section_0.entries.411]
text = [
  "En groupe, ils protègent leurs\\n",
  "petits en formant autour d'eux\\n",
  "une impénétrable muraille.$",
]

[msg.section_0.entries.412]
text = [
  "Nul ne sait comment il y parvient,\\n",
  "mais il arrive toujours à se former\\n",
  "une cape, où qu'il soit.$",
]

[msg.section_0.entries.413]
text = [
  "À l'évolution, son corps absorbe\\n",
  "les matériaux à proximité et peut\\n",
  "ainsi présenter divers aspects.$",
]

[msg.section_0.entries.414]
text = [
  "Il adore le nectar des fleurs mais\\n",
  "n'en récolte pas lui-même.\\n",
  "Il préfère en voler à un Apitrini.$",
]

[msg.section_0.entries.415]
text = [
  "Ce trio inséparable depuis la\\n",
  "naissance récolte du miel\\n",
  "pour satisfaire Apireine.$",
]

[msg.section_0.entries.416]
text = [
  "Ce Pokémon utilise des phéromones\\n",
  "pour donner des ordres de combat\\n",
  "aux larves dans son abdomen.$",
]

[msg.section_0.entries.417]
text = [
  "Il arrive que deux Pachirisu se\\n",
  "frottent les joues pour partager\\n",
  "l'électricité qu'ils ont accumulée.$",
]

[msg.section_0.entries.418]
text = [
  "Il utilise ses deux queues comme\\n",
  "une hélice pour se propulser sous\\n",
  "l'eau et trancher les algues.$",
]

[msg.section_0.entries.419]
text = [
  "Il chasse souvent près des ports\\n",
  "de pêche où il sauve parfois les\\n",
  "gens tombés à la mer.$",
]

[msg.section_0.entries.420]
text = [
  "Sa petite boule rose est nutritive\\n",
  "et délicieuse. Les Étourmi en\\n",
  "raffolent.$",
]

[msg.section_0.entries.421]
text = [
  "Sous un grand soleil, il ouvre\\n",
  "ses pétales pour en absorber\\n",
  "les rayons.$",
]

[msg.section_0.entries.422]
text = [
  "Un étrange liquide mauve s'échappe\\n",
  "de son corps, ne lui appuyez pas\\n",
  "dessus.$",
]

[msg.section_0.entries.423]
text = [
  "Ses gènes ont démontré qu'il avait\\n",
  "jadis une carapace couvrant la\\n",
  "totalité de son dos.$",
]

[msg.section_0.entries.424]
text = [
  "Ses queues jumelles sont si agiles\\n",
  "et efficaces qu'il ne se sert que\\n",
  "très rarement de ses bras.$",
]

[msg.section_0.entries.425]
text = [
  "Sa façon de flotter sans but au\\n",
  "gré du vent lui a valu le surnom\\n",
  "de “bouée des esprits égarés\\\".$",
]

[msg.section_0.entries.426]
text = [
  "Des nuées de Grodrive dérivent\\n",
  "dans le ciel au crépuscule. Ils\\n",
  "disparaissent dès qu'on les voit.$",
]

[msg.section_0.entries.427]
text = [
  "Ses oreilles repliées se déroulent\\n",
  "avec une force capable de briser\\n",
  "un gros rocher.$",
]

[msg.section_0.entries.428]
text = [
  "Il est capable de décocher de\\n",
  "puissants coups de pied si on\\n",
  "touche à ses délicates oreilles.$",
]

[msg.section_0.entries.429]
text = [
  "Pareil à une incantation magique,\\n",
  "son cri n'est que très rarement\\n",
  "source de joie.$",
]

[msg.section_0.entries.430]
text = [
  "Son cri profond peut invoquer une\\n",
  "meute de Cornèbre. On l'appelle\\n",
  "“le crieur de mauvais augure\\\".$",
]

[msg.section_0.entries.431]
text = [
  "Il a tendance à planter ses griffes\\n",
  "dans le nez de son Dresseur s'il\\n",
  "n'a pas été nourri à temps.$",
]

[msg.section_0.entries.432]
text = [
  "Il plaque ses queues contre son\\n",
  "dos pour paraître plus grand.\\n",
  "Il soutient un regard des heures.$",
]

[msg.section_0.entries.433]
text = [
  "Quand il sautille, l'orbe qu'il a\\n",
  "dans la bouche s'agite et tinte\\n",
  "comme une cloche.$",
]

[msg.section_0.entries.434]
text = [
  "Son derrière propulse un fluide\\n",
  "nauséabond qui peut faire fuir les\\n",
  "Pokémon dans un rayon de 2 km.$",
]

[msg.section_0.entries.435]
text = [
  "Il attaque en projetant un liquide\\n",
  "fétide du bout de sa queue. Mieux\\n",
  "vaut l'attaquer par les airs.$",
]

[msg.section_0.entries.436]
text = [
  "Certains scientifiques soutiennent\\n",
  "que ce Pokémon était jadis aussi\\n",
  "réfléchissant qu'un miroir.$",
]

[msg.section_0.entries.437]
text = [
  "Il apportait la pluie en créant un\\n",
  "portail vers une autre dimension.\\n",
  "Il était synonyme de bonne récolte.$",
]

[msg.section_0.entries.438]
text = [
  "Adepte des climats secs, il régule\\n",
  "son humidité en laissant couler ce\\n",
  "qui ressemble à des larmes.$",
]

[msg.section_0.entries.439]
text = [
  "Il imite les mouvements et les\\n",
  "expressions des autres pour\\n",
  "comprendre leurs sentiments.$",
]

[msg.section_0.entries.440]
text = [
  "Ce Pokémon ne se sépare jamais de\\n",
  "son petit caillou et a tendance à\\n",
  "traîner dans les pieds des gens.$",
]

[msg.section_0.entries.441]
text = [
  "Sa langue comparable à celle\\n",
  "de l'homme lui permet d'imiter\\n",
  "habilement le langage humain.$",
]

[msg.section_0.entries.442]
text = [
  "Son mauvais comportement lui a valu\\n",
  "d'être enchaîné à une Clé de Voûte\\n",
  "par un mystérieux sortilège.$",
]

[msg.section_0.entries.443]
text = [
  "Malgré sa maladresse, son énorme\\n",
  "gueule lui permet de lancer des\\n",
  "attaques puissantes.$",
]

[msg.section_0.entries.444]
text = [
  "Toujours à la recherche d'objets\\n",
  "brillants, il arpente les grottes\\n",
  "pour constituer son butin.$",
]

[msg.section_0.entries.445]
text = [
  "On dit que lancé à pleine vitesse,\\n",
  "il crée des lames de vent avec ses\\n",
  "ailes pouvant trancher un arbre.$",
]

[msg.section_0.entries.446]
text = [
  "Obnubilé par sa quête incessante\\n",
  "de nourriture, il oublie parfois\\n",
  "qu'il en a caché dans sa fourrure.$",
]

[msg.section_0.entries.447]
text = [
  "Il a la faculté unique de visualiser\\n",
  "les émotions telles que la joie ou\\n",
  "la colère sous forme d'ondes.$",
]

[msg.section_0.entries.448]
text = [
  "Un spécimen bien entraîné peut\\n",
  "sentir et identifier les émotions de\\n",
  "quelqu'un à plus d'un kilomètre.$",
]

[msg.section_0.entries.449]
text = [
  "Il peut obturer ses narines et\\n",
  "traverser le sable comme un ver.\\n",
  "Il vit en colonies de 10 individus.$",
]

[msg.section_0.entries.450]
text = [
  "Facilement irritable, il ouvre ses\\n",
  "mâchoires au maximum pour intimider\\n",
  "ses adversaires.$",
]

[msg.section_0.entries.451]
text = [
  "Il saisit sa proie avec les pinces de\\n",
  "sa queue et lui injecte un poison.\\n",
  "Il peut survivre un an sans manger.$",
]

[msg.section_0.entries.452]
text = [
  "Fier et robuste, il met un point\\n",
  "d'honneur à battre ses adversaires\\n",
  "sans utiliser de poison.$",
]

[msg.section_0.entries.453]
text = [
  "Son instinct de survie le pousse à\\n",
  "ne pas se battre dans les règles.\\n",
  "C'est une mascotte populaire.$",
]

[msg.section_0.entries.454]
text = [
  "Quand il coasse, le poison stocké\\n",
  "sous sa gorge est secoué, le\\n",
  "rendant ainsi plus efficace.$",
]

[msg.section_0.entries.455]
text = [
  "Il s'accroche aux arbres des\\n",
  "marais et attire ses proies avec\\n",
  "sa salive à l'odeur enivrante.$",
]

[msg.section_0.entries.456]
text = [
  "La ligne qui fait le tour de son\\n",
  "corps stocke l'énergie solaire\\n",
  "et brille dans la nuit.$",
]

[msg.section_0.entries.457]
text = [
  "Il rampe au fond de l'océan grâce\\n",
  "aux nageoires de son torse.\\n",
  "Le Lanturn est son rival.$",
]

[msg.section_0.entries.458]
text = [
  "On organise des excursions pour le\\n",
  "voir surfer sur les vagues au côté\\n",
  "des Rémoraid.$",
]

[msg.section_0.entries.459]
text = [
  "Curieux de rencontrer des gens, ils\\n",
  "se rassemblent autour des traces\\n",
  "de pas trouvées dans la montagne.$",
]

[msg.section_0.entries.460]
text = [
  "Il apparaît quand les fleurs des\\n",
  "terres enneigées fleurissent et\\n",
  "se retire quand elles se fanent.$",
]

[msg.section_0.entries.461]
text = [
  "L'évolution l'a rendu encore plus\\n",
  "retors. Il communique en griffant\\n",
  "des signes dans les pierres.$",
]

[msg.section_0.entries.462]
text = [
  "Des scientifiques ont essayé de\\n",
  "faire évoluer un Magnézone en\\n",
  "laboratoire, mais ce fut un échec.$",
]

[msg.section_0.entries.463]
text = [
  "Sa longue langue est couverte en\\n",
  "permanence d'une épaisse couche\\n",
  "de bave anesthésiante.$",
]

[msg.section_0.entries.464]
text = [
  "Il peut lancer des pierres à une\\n",
  "vitesse saisissante en bandant et\\n",
  "relâchant ses muscles en un éclair.$",
]

[msg.section_0.entries.465]
text = [
  "Ses bras sont en fait des plantes\\n",
  "qui s'attachent à tout ce qu'elles\\n",
  "touchent et peuvent repousser.$",
]

[msg.section_0.entries.466]
text = [
  "Encaissant les attaques, il vient\\n",
  "toucher l'ennemi de ses queues\\n",
  "et lui inflige une forte décharge.$",
]

[msg.section_0.entries.467]
text = [
  "Quand il lance des boules de feu\\n",
  "à plus de 2 000 °C, son corps\\n",
  "est comme chauffé à blanc.$",
]

[msg.section_0.entries.468]
text = [
  "Il apprécie particulièrement les\\n",
  "gens qui respectent les autres\\n",
  "et évitent les conflits inutiles.$",
]

[msg.section_0.entries.469]
text = [
  "Doté de mandibules à la force\\n",
  "colossale, il excelle pour mordre\\n",
  "ses ennemis en plein vol.$",
]

[msg.section_0.entries.470]
text = [
  "Il utilise la photosynthèse comme\\n",
  "une plante et a aussi tendance à\\n",
  "éviter le combat à tout prix.$",
]

[msg.section_0.entries.471]
text = [
  "Il ajuste la température de son\\n",
  "corps pour créer un vent de glace\\n",
  "en gelant l'air qui l'entoure.$",
]

[msg.section_0.entries.472]
text = [
  "Le plus petit courant d'air peut lui\\n",
  "donner assez d'élan pour faire le\\n",
  "tour du monde sans un coup d'aile.$",
]

[msg.section_0.entries.473]
text = [
  "On a libéré un spécimen de sa prison\\n",
  "glacée au bout de 10 000 ans.\\n",
  "Il n'en revenait pas.$",
]

[msg.section_0.entries.474]
text = [
  "Il a été modifié pour être capable\\n",
  "de travailler dans des dimensions\\n",
  "parallèles, mais c'est un échec.$",
]

[msg.section_0.entries.475]
text = [
  "Toujours prêt à protéger son prochain,\\n",
  "il se bat férocement avec ses coudes\\n",
  "en forme d'épées.$",
]

[msg.section_0.entries.476]
text = [
  "Il utilise sa force magnétique pour\\n",
  "diriger trois petites unités\\n",
  "appelées Mini-nez.$",
]

[msg.section_0.entries.477]
text = [
  "Son corps se replie sur lui-même\\n",
  "pour emprisonner les esprits\\n",
  "perdus et les ramener chez eux.$",
]

[msg.section_0.entries.478]
text = [
  "On dit que Momartik gèle ses proies\\n",
  "grâce à son souffle à -50 °C avant\\n",
  "de les exposer dans sa tanière.$",
]

[msg.section_0.entries.479]
text = [
  "Son corps parcouru d'électricité\\n",
  "lui permet de prendre le contrôle\\n",
  "de certains appareils ménagers.$",
]

[msg.section_0.entries.480]
text = [
  "Quand il prit son envol, les hommes\\n",
  "apprirent à résoudre les problèmes.\\n",
  "Le savoir était né.$",
]

[msg.section_0.entries.481]
text = [
  "Quand il prit son envol, les hommes\\n",
  "apprirent à ressentir la joie et la\\n",
  "peine. L'émotion était née.$",
]

[msg.section_0.entries.482]
text = [
  "Quand il prit son envol, les hommes\\n",
  "acquirent la détermination.\\n",
  "La volonté était née.$",
]

[msg.section_0.entries.483]
text = [
  "On dit que le temps s'écoule au\\n",
  "rythme des battements de cœur de\\n",
  "ce Pokémon légendaire de Sinnoh.$",
]

[msg.section_0.entries.484]
text = [
  "On dit que la stabilité de l'espace\\n",
  "est maintenue par le souffle de ce\\n",
  "Pokémon légendaire de Sinnoh.$",
]

[msg.section_0.entries.485]
text = [
  "Son corps est composé d'acier brut\\n",
  "dont certaines parties ont fondu\\n",
  "à cause de sa propre chaleur.$",
]

[msg.section_0.entries.486]
text = [
  "On dit qu'il a créé des Pokémon\\n",
  "à son image à partir de glace,\\n",
  "de roche et de magma.$",
]

[msg.section_0.entries.487]
text = [
  "Sa grande violence lui a valu d'être\\n",
  "banni. Il observe les hommes en\\n",
  "silence depuis le Monde Distorsion.$",
]

[msg.section_0.entries.488]
text = [
  "Les nuits où le premier croissant\\n",
  "de lune est visible, l'arc de sa\\n",
  "queue se déploie de façon superbe.$",
]

[msg.section_0.entries.489]
text = [
  "Ce Pokémon des mers chaudes\\n",
  "revient toujours à son lieu de\\n",
  "naissance, peu importe la distance.$",
]

[msg.section_0.entries.490]
text = [
  "Il est né avec le pouvoir incroyable\\n",
  "de créer des liens avec n'importe\\n",
  "quel Pokémon.$",
]

[msg.section_0.entries.491]
text = [
  "Menacé, ce Pokémon se protège\\n",
  "en créant des cauchemars dans\\n",
  "l'esprit de ses ennemis.$",
]

[msg.section_0.entries.492]
text = [
  "Les fleurs qui couvrent son corps\\n",
  "s'ouvrent quand il est câliné avec\\n",
  "amour et perçoit de la gratitude.$",
]

[msg.section_0.entries.493]
text = [
  "On dit que son œuf a éclos dans\\n",
  "le néant et qu'il est à l'origine\\n",
  "de la création du monde.$",
]

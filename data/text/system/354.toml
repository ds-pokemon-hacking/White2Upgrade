[msg.section_0.entries.0]
text = [
  "A hero battles the Masked Man, who is\\n",
  "targeting the amusement park.$",
]

[msg.section_0.entries.1]
text = [
  "The evil Masked Man appears at the\\n",
  "port where a cruise ship is docked.$",
]

[msg.section_0.entries.2]
text = [
  "Everything is on the line\\n",
  "in this battle of good vs. evil.$",
]

[msg.section_0.entries.3]
text = [
  "A secret detective and a thief\\n",
  "collide over an amazing energy source.$",
]

[msg.section_0.entries.4]
text = [
  "A challenge from a thief\\n",
  "is an ingenious trap.$",
]

[msg.section_0.entries.5]
text = [
  "The thief's next target:\\n",
  "the detective's sister!$",
]

[msg.section_0.entries.6]
text = [
  "The dramatic chase between\\n",
  "detective and thief comes to a close.$",
]

[msg.section_0.entries.7]
text = [
  "A UFO appears in a major metropolis!\\n",
  "The UDF rushes to the scene!$",
]

[msg.section_0.entries.8]
text = [
  "The mysterious woman's experiment!\\n",
  "The decoy plan is made clear.$",
]

[msg.section_0.entries.9]
text = [
  "The UFO returns!\\n",
  "The decoy plan is put in motion!$",
]

[msg.section_0.entries.10]
text = [
  "The truth behind the mysterious woman!\\n",
  "Humanity's final battle begins!$",
]

[msg.section_0.entries.11]
text = [
  "A giant organism appears,\\n",
  "and the UDF goes into action!$",
]

[msg.section_0.entries.12]
text = [
  "The UDF rushes into action when\\n",
  "an odd scream is heard during patrol!$",
]

[msg.section_0.entries.13]
text = [
  "The Titanic Tyranitar reappears!\\n",
  "The mysterious light's true identity!$",
]

[msg.section_0.entries.14]
text = [
  "MT reappears. It's time for the final\\n",
  "battle with the UDF!$",
]

[msg.section_0.entries.15]
text = [
  "It's the first experiment of its kind!\\n",
  "Awaken the unseen future world!$",
]

[msg.section_0.entries.16]
text = [
  "A shocking future awaits!\\n",
  "Pokémon control people!$",
]

[msg.section_0.entries.17]
text = [
  "Change the future!\\n",
  "The last hope is a door to the past!$",
]

[msg.section_0.entries.18]
text = [
  "A love story between Trainers.\\n",
  "Romance is afoot at the street corner.$",
]

[msg.section_0.entries.19]
text = [
  "A story about unrequited love\\n",
  "between Trainers.$",
]

[msg.section_0.entries.20]
text = [
  "A love story about two Trainers\\n",
  "reunited at the amusement park.$",
]

[msg.section_0.entries.21]
text = [
  "A magical queen sets a trap.\\n",
  "Through the suspicious door!$",
]

[msg.section_0.entries.22]
text = [
  "A gatekeeper waits in\\n",
  "a magic cage.$",
]

[msg.section_0.entries.23]
text = [
  "Fate rests on a choice between doors.\\n",
  "Which one leads back?$",
]

[msg.section_0.entries.24]
text = [
  "A big argument leads to a tragedy\\n",
  "with an odd Poké Ball.$",
]

[msg.section_0.entries.25]
text = [
  "A suspicious visitor steals the\\n",
  "Ball with the woman inside it!$",
]

[msg.section_0.entries.26]
text = [
  "A giant woman appears,\\n",
  "and the city descends into panic!$",
]

[msg.section_0.entries.27]
text = [
  "The key to the giant woman's fate\\n",
  "is love!$",
]

[msg.section_0.entries.28]
text = [
  "Who are you? Where did you come from?\\n",
  "What for? A creepy human-type monster.$",
]

[msg.section_0.entries.29]
text = [
  "Screams and hopelessness fill\\n",
  "the amusement park at night!$",
]

[msg.section_0.entries.30]
text = [
  "Unknown and impossible to understand,\\n",
  "it came from a different dimension.$",
]

[msg.section_0.entries.31]
text = [
  "A genius inventor's experiment\\n",
  "creates a robot with a heart!$",
]

[msg.section_0.entries.32]
text = [
  "The inventor and the robot\\n",
  "have a fleeting connection.$",
]

[msg.section_0.entries.33]
text = [
  "What happens to the betrayed inventor\\n",
  "and the out-of-control robot?$",
]

[msg.section_0.entries.34]
text = [

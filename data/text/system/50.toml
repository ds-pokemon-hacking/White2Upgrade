[msg.section_0.entries.0]
text = [
  "Oh, it looks like I lost...\\n",
  "Sure was fun, though! Thanks!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Ah ha ha! I keep on smiling, even if I lose.\\n",
  "That's my policy!\\c$",
]

[msg.section_0.entries.2]
text = [
  "Alas, it is I whose luck ran out...\\c$",
]

[msg.section_0.entries.3]
text = [
  "Well, what do you think?\\n",
  "Do I look a little bit slimmer now?\\c$",
]

[msg.section_0.entries.4]
text = [
  "Oh, my poor little ones!\\n",
  "Are you OK? I'll keep you safe!\\c$",
]

[msg.section_0.entries.5]
text = [
  "Wow, you're strong...\\n",
  "You're free to go on ahead now.\\c$",
]

[msg.section_0.entries.6]
text = [
  "Aww...\\n",
  "You beat me...\\c\\n",
  "But I'm not going to give up!\\n",
  "I'm going back to the bakery.\\c$",
]

[msg.section_0.entries.7]
text = [
  "I shouldn't have gobbled pastries before\\n",
  "a battle. Fruit would be a better choice...\\c$",
]

[msg.section_0.entries.8]
text = [
  "Well, you sure are a kid who\\n",
  "isn't to be underestimated!\\c$",
]

[msg.section_0.entries.9]
text = [
  "Hmm...this place might be\\n",
  "too dangerous for the kids.\\c$",
]

[msg.section_0.entries.10]
text = [
  "Not bad!\\n",
  "But you won't get the best of me next time!\\c$",
]

[msg.section_0.entries.11]
text = [
  "An impressive display of fighting spirit!\\c$",
]

[msg.section_0.entries.12]
text = [
  "Yeow! I think I pulled a muscle\\n",
  "when I threw that Poké Ball!\\c$",
]

[msg.section_0.entries.13]
text = [
  "I lost... Heh-heh.\\n",
  "You were wonderful!\\c$",
]

[msg.section_0.entries.14]
text = [
  "You're strong! Thanks for the battle.\\n",
  "It was great training!\\c$",
]

[msg.section_0.entries.15]
text = [
  "That was a peaceful battle!\\n",
  "Heh-heh. Let's shake hands!\\c$",
]

[msg.section_0.entries.16]
text = [
  "I apologize for my rudeness.\\n",
  "Please, continue on your way.\\c$",
]

[msg.section_0.entries.17]
text = [
  "Ha ha ha! Looks like I lost!\\n",
  "I'll be back after I polish my bald spot!\\c$",
]

[msg.section_0.entries.18]
text = [
  "For a sec, I thought you were a bit shady,\\n",
  "but you beat me fair and square!\\c$",
]

[msg.section_0.entries.19]
text = [
  "This is just the beginning of your journey!\\n",
  "Aim for the bottom level, and get stronger!\\c$",
]

[msg.section_0.entries.20]
text = [
  "Argh! Looks like I need\\n",
  "to start over from base camp!\\c$",
]

[msg.section_0.entries.21]
text = [
  "You're good!\\n",
  "Good luck on your journey in here!\\c$",
]

[msg.section_0.entries.22]
text = [
  "Nice! Use that momentum\\n",
  "to climb even higher!\\c$",
]

[msg.section_0.entries.23]
text = [
  "Nooo! How will I impress my daughter now?\\c$",
]

[msg.section_0.entries.24]
text = [
  "Take that strength and use it\\n",
  "to defeat your rivals!\\c$",
]

[msg.section_0.entries.25]
text = [
  "Argh... You're not bad.\\n",
  "You'd better make it to the bottom!\\c$",
]

[msg.section_0.entries.26]
text = [
  "You're a scrappy one! You'd make\\n",
  "a good Janitor, you know?\\c$",
]

[msg.section_0.entries.27]
text = [
  "You won because I was distracted by\\n",
  "dental difficulties.\\c$",
]

[msg.section_0.entries.28]
text = [
  "Awesome and furious! There's\\n",
  "no way I could have beaten you!\\c$",
]

[msg.section_0.entries.29]
text = [
  "One little loss isn't enough to make\\n",
  "me give up! I'm just getting started!\\c$",
]

[msg.section_0.entries.30]
text = [
  "I'm not the chosen one?\\n",
  "How can this be?\\c$",
]

[msg.section_0.entries.31]
text = [
  "Incredible.\\n",
  "You were stronger than I imagined.\\c$",
]

[msg.section_0.entries.32]
text = [
  "I knew I would lose! It was foreseen!\\n",
  "But still it is my destiny to battle!\\c$",
]

[msg.section_0.entries.33]
text = [
  "Ahh! Such strength, such spirit...\\n",
  "It lifts my heart!\\c$",
]

[msg.section_0.entries.34]
text = [
  "You won't beat me next time!\\n",
  "I'm going to reach the top first!\\c$",
]

[msg.section_0.entries.35]
text = [
  "We lost, but my Pokémon are telling me\\n",
  "they enjoyed battling you.\\c$",
]

[msg.section_0.entries.36]
text = [
  "I'll use this data to become even stronger!\\c$",
]

[msg.section_0.entries.37]
text = [
  "I can't believe it... What went wrong\\n",
  "with my calculations?\\c$",
]

[msg.section_0.entries.38]
text = [
  "Ho-ho...looks like I'd better\\n",
  "stick to what I know best!\\c$",
]

[msg.section_0.entries.39]
text = [
  "Nice battle! You passed the test!\\n",
  "You're free to go up.\\c$",
]

[msg.section_0.entries.40]
text = [
  "That was a nice break! Thanks!\\n",
  "I'd better go do my homework now.\\c$",
]

[msg.section_0.entries.41]
text = [
  "I'm terrible with directions...\\n",
  "This labyrinth may be too much for me!\\c$",
]

[msg.section_0.entries.42]
text = [
  "I came up with that battle strategy\\n",
  "in class. I can't believe it didn't work!\\c$",
]

[msg.section_0.entries.43]
text = [
  "Oi! You'll see!\\n",
  "I'll show them all that I'm a proper lady!\\c$",
]

[msg.section_0.entries.44]
text = [
  "I lost...\\n",
  "I just need to try harder next time.\\c$",
]

[msg.section_0.entries.45]
text = [
  "Whoa! You're so strong!\\n",
  "Thanks for the fun! I feel refreshed!\\c$",
]

[msg.section_0.entries.46]
text = [
  "Thank you! I look forward\\n",
  "to our next battle.\\c$",
]

[msg.section_0.entries.47]
text = [
  "Oh no...\\n",
  "It looks like I'm the one who got served!\\c$",
]

[msg.section_0.entries.48]
text = [
  "Did our battle suit your tastes?\\c$",
]

[msg.section_0.entries.49]
text = [
  "Wow! You were great!\\n",
  "Such an impressive battle!\\c$",
]

[msg.section_0.entries.50]
text = [
  "Whoa-ho! You're no joke!\\n",
  "You can run things around here now.\\c$",
]

[msg.section_0.entries.51]
text = [
  "I'm going to keep on battling\\n",
  "and chasing my own dream!\\c$",
]

[msg.section_0.entries.52]
text = [
  "Well, that wasn't cool...\\n",
  "Please don't tell the others, OK?\\c$",
]

[msg.section_0.entries.53]
text = [
  "You're good! Your Pokémon are\\n",
  "pretty cute, too!\\c$",
]

[msg.section_0.entries.54]
text = [
  "The road to becoming an Idol Trainer\\n",
  "is long and full of trials!\\c$",
]

[msg.section_0.entries.55]
text = [
  "You're the strongest Trainer\\n",
  "I've encountered here yet!\\c$",
]

[msg.section_0.entries.56]
text = [
  "It's just like I read in the guidebook!\\n",
  "This is a tough place.\\c$",
]

[msg.section_0.entries.57]
text = [
  "Are there more strong Trainers like you?\\n",
  "This is going to be fun!\\c$",
]

[msg.section_0.entries.58]
text = [
  "That was a good change of pace!\\n",
  "I'd better get back to exploring!\\c$",
]

[msg.section_0.entries.59]
text = [
  "Incredible! This may be the first time\\n",
  "I've run into someone like you!\\c$",
]

[msg.section_0.entries.60]
text = [
  "Your attacks are too powerful!\\n",
  "I'm sorry! Please forgive me!\\c$",
]

[msg.section_0.entries.61]
text = [
  "Hmph. I guess talent is pretty\\n",
  "important, too...\\c$",
]

[msg.section_0.entries.62]
text = [
  "Wow! I lost!\\n",
  "Go on ahead!\\c$",
]

[msg.section_0.entries.63]
text = [
  "My loss! You're good! I'd better get some\\n",
  "grocery shopping done before I go home.\\c$",
]

[msg.section_0.entries.64]
text = [
  "Hmm... Looks like I'm still not good enough.\\n",
  "I need to train harder!\\c$",
]

[msg.section_0.entries.65]
text = [
  "Oh...\\n",
  "No more sneaking up on people!\\c$",
]

[msg.section_0.entries.66]
text = [
  "I'm better at kneading dough and\\n",
  "baking bread than I am at battling...\\c$",
]

[msg.section_0.entries.67]
text = [
  "I guess my power lunch wasn't enough\\n",
  "to help me beat you. But it was delicious!\\c$",
]

[msg.section_0.entries.68]
text = [
  "Aww... I lost!\\n",
  "I worked so hard to raise them, too!\\c$",
]

[msg.section_0.entries.69]
text = [
  "Oh...\\n",
  "Where did everybody go?\\c$",
]

[msg.section_0.entries.70]
text = [
  "Whoa... What happened?\\n",
  "I'm spent...\\c$",
]

[msg.section_0.entries.71]
text = [
  "Argh! At this rate I'll never be like\\n",
  "the Black Belt of legend!\\c$",
]

[msg.section_0.entries.72]
text = [
  "Aaaarghhh!\\n",
  "I'm better at shouting than at winning!\\c$",
]

[msg.section_0.entries.73]
text = [
  "My moves were no good!\\n",
  "Argh! I guess I need to practice more.\\c$",
]

[msg.section_0.entries.74]
text = [
  "Oh no! I lost!\\n",
  "I was born under the star of defeat!\\c$",
]

[msg.section_0.entries.75]
text = [
  "So tired...\\n",
  "I'm gonna go take a little break!\\c$",
]

[msg.section_0.entries.76]
text = [
  "I... I'm sorry!\\n",
  "I'll be careful where I walk from now on!\\c$",
]

[msg.section_0.entries.77]
text = [
  "I lost! Hah!\\n",
  "Well, there's my good deed for the day.\\c$",
]

[msg.section_0.entries.78]
text = [
  "Resisting arrest! Obstruction of justice!\\n",
  "You're not allowed to beat me, civilian!\\c$",
]

[msg.section_0.entries.79]
text = [
  "That was a fair and clean battle! You must\\n",
  "not be one of the bad guys I'm looking for.\\c$",
]

[msg.section_0.entries.80]
text = [
  "Be prepared, and you don't have to worry!\\n",
  "The same goes for mountain climbing!\\c$",
]

[msg.section_0.entries.81]
text = [
  "Argh... Maybe you've got the right idea,\\n",
  "packing light. I can barely move!\\c$",
]

[msg.section_0.entries.82]
text = [
  "I'm done exploring for the day.\\n",
  "I think I'll retire to my tent for now!\\c$",
]

[msg.section_0.entries.83]
text = [
  "Ugh! My sweat and tears weren't\\n",
  "nearly enough!\\c$",
]

[msg.section_0.entries.84]
text = [
  "You won that one. You probably don't need\\n",
  "to worry about staying where it's safe!\\c$",
]

[msg.section_0.entries.85]
text = [
  "I lost...\\c$",
]

[msg.section_0.entries.86]
text = [
  "You got them all scuffed up!\\n",
  "What do you think you're doing?\\c$",
]

[msg.section_0.entries.87]
text = [
  "What you see is not my true identity.\\n",
  "...An old man who can't find a steady job.\\c$",
]

[msg.section_0.entries.88]
text = [
  "Nice job!\\n",
  "Safe travels and good luck!\\c$",
]

[msg.section_0.entries.89]
text = [
  "I lost! I hope I can make my Pokémon\\n",
  "stronger before my vacation is over!\\c$",
]

[msg.section_0.entries.90]
text = [
  "Why am I getting so excited?\\n",
  "What is this place?\\c$",
]

[msg.section_0.entries.91]
text = [
  "Psychic powers, go! Ahhh...\\n",
  "What a relief. Now I won't be sore!\\c$",
]

[msg.section_0.entries.92]
text = [
  "I lost... Can it be?\\n",
  "I guess not everyone in here is a weakling.\\c$",
]

[msg.section_0.entries.93]
text = [
  "I had a dream that we would battle.\\n",
  "But I forgot who'd win. Guess now I know!\\c$",
]

[msg.section_0.entries.94]
text = [
  "Phew...\\n",
  "Looks like I need to take things slower.\\c$",
]

[msg.section_0.entries.95]
text = [
  "Oh, wow!\\n",
  "That wasn't even a challenge for you.\\c$",
]

[msg.section_0.entries.96]
text = [
  "No prize money for me... Maybe someday\\n",
  "I can stop worrying about paying the bills.\\c$",
]

[msg.section_0.entries.97]
text = [
  "No! This can't be! This must be a mistake!\\n",
  "This result is not scientific!\\c$",
]

[msg.section_0.entries.98]
text = [
  "Ah! This battle inspired me! I think\\n",
  "I may have a breakthrough on my hands!\\c$",
]

[msg.section_0.entries.99]
text = [
  "Hmm...these numbers are unexpected.\\n",
  "I may still need more data.\\c$",
]

[msg.section_0.entries.100]
text = [
  "I lost? Looks like I didn't study enough!\\c$",
]

[msg.section_0.entries.101]
text = [
  "Oww! I'd better stop messing around here\\n",
  "and get back to my studies...\\c$",
]

[msg.section_0.entries.102]
text = [
  "I believe I have lost my beloved dignity.\\c$",
]

[msg.section_0.entries.103]
text = [
  "Ugh! It's not fair! I wish I could have won\\n",
  "my last battle of the day...\\c$",
]

[msg.section_0.entries.104]
text = [
  "Ack... To have beaten me like that,\\n",
  "you're quite the genius yourself!\\c$",
]

[msg.section_0.entries.105]
text = [
  "I want to go up higher...\\n",
  "I'm sick of this area!\\c$",
]

[msg.section_0.entries.106]
text = [
  "Was our battle to your liking?\\c$",
]

[msg.section_0.entries.107]
text = [
  "I'm glad I caught you in time!\\n",
  "Please don't forget our battle.\\c$",
]

[msg.section_0.entries.108]
text = [
  "You've still got a long way to go! Please,\\n",
  "take a break and drink some water first.\\c$",
]

[msg.section_0.entries.109]
text = [
  "Eek! I'm sorry! I'll be serious about my\\n",
  "job from now on!\\c$",
]

[msg.section_0.entries.110]
text = [
  "Urgh! I've gotta go!\\c$",
]

[msg.section_0.entries.111]
text = [
  "I lost!\\n",
  "Looks like we still need to get stronger!\\c$",
]

[msg.section_0.entries.112]
text = [
  "It doesn't matter what I do.\\n",
  "I don't have your crazy power level.\\c$",
]

[msg.section_0.entries.113]
text = [
  "We have to deal with things--sometimes even\\n",
  "things we don't deserve. Like this defeat!\\c$",
]

[msg.section_0.entries.114]
text = [
  "Round and round I go in this maze.\\n",
  "I'm starting to get dizzy!\\c$",
]

[msg.section_0.entries.115]
text = [
  "We had a great time!\\n",
  "Play with us again soon!\\c$",
]

[msg.section_0.entries.116]
text = [
  "There's no indecision in your battle style!\\n",
  "You must know exactly where you're going!\\c$",
]

[msg.section_0.entries.117]
text = [
  "Hmm...was that really my true battle style?\\c$",
]

[msg.section_0.entries.118]
text = [
  "I have highly honed senses, especially smell!\\n",
  "Can you smell defeat?\\c$",
]

[msg.section_0.entries.119]
text = [
  "Ohh! I lost! I'll never save up enough\\n",
  "to travel the world like this.\\c$",
]

[msg.section_0.entries.120]
text = [
  "Even if I lose, I'm still happy that I can\\n",
  "be with my Pokémon!\\c$",
]

[msg.section_0.entries.121]
text = [
  "The power of youth...\\n",
  "I just can't win!\\c$",
]

[msg.section_0.entries.122]
text = [
  "Great! Take that momentum and go\\n",
  "straight to the end!\\c$",
]

[msg.section_0.entries.123]
text = [
  "You must have a good training technique!\\n",
  "Keep it up and you'll go far!\\c$",
]

[msg.section_0.entries.124]
text = [
  "Oh, what lovely Pokémon you have!\\n",
  "Let me pet their heads!\\c$",
]

[msg.section_0.entries.125]
text = [
  "With strenuous battles like that,\\n",
  "the pounds just melt away!\\c$",
]

[msg.section_0.entries.126]
text = [
  "Do you smell something burning?\\n",
  "Maybe it's just my pride...\\c$",
]

[msg.section_0.entries.127]
text = [
  "Come visit my bakery once it's open!\\c$",
]

[msg.section_0.entries.128]
text = [
  "I need to get a little bit stronger\\n",
  "if I want to keep up with everybody!\\c$",
]

[msg.section_0.entries.129]
text = [
  "Ugh, that was too much...\\n",
  "I'm all burned out now.\\c$",
]

[msg.section_0.entries.130]
text = [
  "In order to protect the ones who matter\\n",
  "to me, I need to get stronger!\\c$",
]

[msg.section_0.entries.131]
text = [
  "Hah... Someday I hope I can make it\\n",
  "all the way to the bottom.\\c$",
]

[msg.section_0.entries.132]
text = [
  "I lost! Maybe power isn't everything...\\n",
  "What else is there? Maybe speed?\\c$",
]

[msg.section_0.entries.133]
text = [
  "I can't believe you beat me!\\n",
  "That trick always works...\\c$",
]

[msg.section_0.entries.134]
text = [
  "I lost! So much for winning 100\\n",
  "battles in a row!\\c$",
]

[msg.section_0.entries.135]
text = [
  "Please, don't feel sorry for someone\\n",
  "who lost so miserably!\\c$",
]

[msg.section_0.entries.136]
text = [
  "Man... I'm thinking this whole Roughneck\\n",
  "thing might not be for me...\\c$",
]

[msg.section_0.entries.137]
text = [
  "Oh, man. You sure showed us! Maybe it's\\n",
  "time to give up this bad-guy routine!\\c$",
]

[msg.section_0.entries.138]
text = [
  "If you're going to keep battling in here,\\n",
  "at least be civil out in the forest!\\c$",
]

[msg.section_0.entries.139]
text = [
  "Hmm... Everything checks out.\\n",
  "You're free to go.\\c$",
]

[msg.section_0.entries.140]
text = [
  "Heh! There's still no way you'll make it\\n",
  "all the way to the bottom!\\c$",
]

[msg.section_0.entries.141]
text = [
  "It is you whose splendor is like that\\n",
  "of a mountain!\\c$",
]

[msg.section_0.entries.142]
text = [
  "Oh well, my loss!\\n",
  "I'd better go find the rest of my team...\\c$",
]

[msg.section_0.entries.143]
text = [
  "Gah! The strong will at work here\\n",
  "appears to have chosen you!\\c$",
]

[msg.section_0.entries.144]
text = [
  "You must be a pro Trainer!\\n",
  "Sorry for underestimating you!\\c$",
]

[msg.section_0.entries.145]
text = [
  "These are just regular plants around here.\\n",
  "Not worth getting heated up about.\\c$",
]

[msg.section_0.entries.146]
text = [
  "That was supposed to be my prize money!\\n",
  "Don't spend it all in one place!\\c$",
]

[msg.section_0.entries.147]
text = [
  "I'm not as down from this loss as I am from\\n",
  "all the Trainers littering here lately.\\c$",
]

[msg.section_0.entries.148]
text = [
  "You followed a good, safe strategy.\\n",
  "That's the best way! Be careful as you go!\\c$",
]

[msg.section_0.entries.149]
text = [
  "What are the managers thinking,\\n",
  "making us battle like this?\\c$",
]

[msg.section_0.entries.150]
text = [
  "There are Trainers like you in here, too?\\n",
  "Looks like I still need to get stronger.\\c$",
]

[msg.section_0.entries.151]
text = [
  "I was using my telepathy to convince you\\n",
  "that I'd win... What a letdown.\\c$",
]

[msg.section_0.entries.152]
text = [
  "It's just as I foresaw!\\n",
  "You are a strong Trainer!\\c$",
]

[msg.section_0.entries.153]
text = [
  "I can't even beat you! There's no way\\n",
  "I'd make it in the upper areas.\\c$",
]

[msg.section_0.entries.154]
text = [
  "Smiles are most definitely a kind of\\n",
  "psychic power! Don't forget it!\\c$",
]

[msg.section_0.entries.155]
text = [
  "Now you've got me all bent out of shape!\\n",
  "I'd better go home and calm down.\\c$",
]

[msg.section_0.entries.156]
text = [
  "OK! I'd better get started on preparing\\n",
  "a report of our battle!\\c$",
]

[msg.section_0.entries.157]
text = [
  "Defeated... Now my research will never\\n",
  "receive the recognition it deserves!\\c$",
]

[msg.section_0.entries.158]
text = [
  "Defeat smells as sour as a conspiracy!\\c$",
]

[msg.section_0.entries.159]
text = [
  "Now I'm more interested in how you\\n",
  "got so strong!\\c$",
]

[msg.section_0.entries.160]
text = [
  "I'm not aiming for the top!\\n",
  "My way of life is OK, too.\\c$",
]

[msg.section_0.entries.161]
text = [
  "Maybe I'd be better off just studying\\n",
  "for my entrance exams...\\c$",
]

[msg.section_0.entries.162]
text = [
  "I guess this is the end for me!\\n",
  "Not bad, if I do say so myself.\\c$",
]

[msg.section_0.entries.163]
text = [
  "Ohh... I've still got a long way to go\\n",
  "if I want to be like my sister...\\c$",
]

[msg.section_0.entries.164]
text = [
  "Aww... OK, you win...\\n",
  "You can use my floor.\\c$",
]

[msg.section_0.entries.165]
text = [
  "My legs are strong from skipping. I never\\n",
  "skip training! But you still schooled me.\\c$",
]

[msg.section_0.entries.166]
text = [
  "Excellent!\\n",
  "Please, continue on your way!\\c$",
]

[msg.section_0.entries.167]
text = [
  "I want to be a Trainer who excels in battles\\n",
  "and a Waiter who excels in service!\\c$",
]

[msg.section_0.entries.168]
text = [
  "I've been looking for my little sister for a\\n",
  "long time. I'll look for as long as it takes!\\c$",
]

[msg.section_0.entries.169]
text = [
  "It's important to remember to have fun!\\n",
  "Let's play catch!\\c$",
]

[msg.section_0.entries.170]
text = [
  "I want to explore the wonders of space. I\\n",
  "wonder who'll be first to see those wonders!\\c$",
]

[msg.section_0.entries.171]
text = [
  "Yahoo! What a blast! I love\\n",
  "battling in here!\\c$",
]

[msg.section_0.entries.172]
text = [
  "It's still not enough!\\n",
  "I need to bring even stronger Pokémon!\\c$",
]

[msg.section_0.entries.173]
text = [
  "I just want some new clothes\\n",
  "so I can look nice!\\c$",
]

[msg.section_0.entries.174]
text = [
  "I lost! But I know how to say\\n",
  "what I need to say!\\c$",
]

[msg.section_0.entries.175]
text = [
  "I won't let this little loss get me down!\\n",
  "I'm going to rise to the heights like a kite!\\c$",
]

[msg.section_0.entries.176]
text = [
  "Hey, you got some prize money!\\n",
  "Really, though, where does it come from?\\c$",
]

[msg.section_0.entries.177]
text = [
  "I lost, but I don't mind.\\n",
  "It's the carefree life for me!\\c$",
]

[msg.section_0.entries.178]
text = [
  "I lost this time, but I'm not worried.\\n",
  "I've just got to take my time!$",
]

[msg.section_0.entries.179]
text = [
  "Wow, you've got some cool Pokémon!\\n",
  "I didn't stand a chance!\\c$",
]

[msg.section_0.entries.180]
text = [
  "Argh! I'm sorry.\\n",
  "Can I ever be forgiven for this?\\c$",
]

[msg.section_0.entries.181]
text = [
  "How could I have lost? Maybe items aren't\\n",
  "the only important thing in a battle...\\c$",
]

[msg.section_0.entries.182]
text = [
  "Good! Keep that guard up and\\n",
  "you'll do fine!\\c$",
]

[msg.section_0.entries.183]
text = [
  "Argh! My rage was too tasty!\\c$",
]

[msg.section_0.entries.184]
text = [
  "The more they battle, the stronger\\n",
  "they get!\\c$",
]

[msg.section_0.entries.185]
text = [
  "I hope I can take them to the hot springs\\n",
  "soon. They desperately need some R&R!\\c$",
]

[msg.section_0.entries.186]
text = [
  "Oh no! I lost! I hope you put that prize\\n",
  "money toward realizing your dreams!\\c$",
]

[msg.section_0.entries.187]
text = [
  "Bread or rice?\\n",
  "That is the question...\\c$",
]

[msg.section_0.entries.188]
text = [
  "Aww...\\n",
  "I've been called a Slowpoke, but I'm not!\\c$",
]

[msg.section_0.entries.189]
text = [
  "How? My techniques were good enough\\n",
  "to quiet even the worst tantrum!\\c$",
]

[msg.section_0.entries.190]
text = [
  "Yes! I can only truly be myself\\n",
  "when I'm battling!\\c$",
]

[msg.section_0.entries.191]
text = [
  "Looks like I'll be in here for a while...\\n",
  "I sure do miss the sun!\\c$",
]

[msg.section_0.entries.192]
text = [
  "You...you're stronger than me!\\n",
  "Is this reality?\\c$",
]

[msg.section_0.entries.193]
text = [
  "Woo! Incredible!\\n",
  "Thanks for the battle, new rival!\\c$",
]

[msg.section_0.entries.194]
text = [
  "You're good! You must be\\n",
  "assistant-instructor tier!\\c$",
]

[msg.section_0.entries.195]
text = [
  "I used to cry whenever I lost.\\n",
  "But not anymore! I've changed!\\c$",
]

[msg.section_0.entries.196]
text = [
  "My bros won't let you get away\\n",
  "with this!\\c$",
]

[msg.section_0.entries.197]
text = [
  "Urgh! Bros! Where are you?\\n",
  "Help me out here!\\c$",
]

[msg.section_0.entries.198]
text = [
  "I don't have to tell you\\n",
  "who really makes the rules...\\c$",
]

[msg.section_0.entries.199]
text = [
  "You won! OK, I'll give you my best hint!\\c$",
]

[msg.section_0.entries.200]
text = [
  "Mmm...mmm! I love my leafy greens!\\n",
  "I wish I were a Grass-type Pokémon!\\c$",
]

[msg.section_0.entries.201]
text = [
  "The more I investigate, the deeper\\n",
  "the mystery seems to get.\\c$",
]

[msg.section_0.entries.202]
text = [
  "Heh-heh... Maybe I should quit being a\\n",
  "Hiker and become a spelunker!\\c$",
]

[msg.section_0.entries.203]
text = [
  "I wonder if the ancient underground people\\n",
  "had Pokémon battles like this?\\c$",
]

[msg.section_0.entries.204]
text = [
  "I just lose track of time whenever\\n",
  "I'm down here...$",
]

[msg.section_0.entries.205]
text = [
  "Remember, I just feel like a Boss Trainer!\\n",
  "You still have to beat the real one!\\c$",
]

[msg.section_0.entries.206]
text = [
  "I get a strange sense of safety inside this\\n",
  "giant white tree...even if I lose the battle!\\c$",
]

[msg.section_0.entries.207]
text = [
  "Knock me down and I get back up!\\n",
  "Punk is all about having spirit!\\c$",
]

[msg.section_0.entries.208]
text = [
  "Still not strong enough...\\n",
  "They won't be satisfied...\\c$",
]

[msg.section_0.entries.209]
text = [
  "You're good!\\n",
  "The boss is gonna have fun with you!\\c$",
]

[msg.section_0.entries.210]
text = [
  "Argh! That was so uncool...\\c$",
]

[msg.section_0.entries.211]
text = [
  "Gah! OK, I lost.\\n",
  "You're the one who survived!\\c$",
]

[msg.section_0.entries.212]
text = [
  "I can feel a darkness from your\\n",
  "battle style, too!\\c$",
]

[msg.section_0.entries.213]
text = [
  "What happened? Was it just my imagination?\\n",
  "I thought I saw something...\\c$",
]

[msg.section_0.entries.214]
text = [
  "Tsk! You'd better be thankful that\\n",
  "I went easy on you!\\c$",
]

[msg.section_0.entries.215]
text = [
  "I've got to get stronger so I can create\\n",
  "my rainbow building!\\c$",
]

[msg.section_0.entries.216]
text = [
  "Incredible! You seem to have a knack\\n",
  "for increasing your power rating.\\c$",
]

[msg.section_0.entries.217]
text = [
  "All right! Thanks for the help!\\n",
  "It's off to the beach with me!\\c$",
]

[msg.section_0.entries.218]
text = [
  "Your attack patterns...\\n",
  "You're giving me some great examples!\\c$",
]

[msg.section_0.entries.219]
text = [
  "Ahh...\\n",
  "This is it for me...\\c$",
]

[msg.section_0.entries.220]
text = [
  "I guess I can't make you do my homework\\n",
  "after all. But I just don't waaaaanna...\\c$",
]

[msg.section_0.entries.221]
text = [
  "It's important to shake hands after a loss\\n",
  "to demonstrate how nice you are!\\c$",
]

[msg.section_0.entries.222]
text = [
  "Oh no... My prize money...\\n",
  "Need...more...\\c$",
]

[msg.section_0.entries.223]
text = [
  "I guess it was like playing house! ♪\\n",
  "Thanks for playing with me!\\c$",
]

[msg.section_0.entries.224]
text = [
  "Oh! I'm doing a good job of saving up to buy\\n",
  "a Munna pillow. Nearly there!\\c$",
]

[msg.section_0.entries.225]
text = [
  "Of course I'm going to battle!\\n",
  "This is the Black Tower, after all!\\c$",
]

[msg.section_0.entries.226]
text = [
  "Tsk! Th-thanks so much for the battle...\\c$",
]

[msg.section_0.entries.227]
text = [
  "Wow, you're strong!\\n",
  "Please, continue on your way!\\c$",
]

[msg.section_0.entries.228]
text = [
  "I lost!\\n",
  "Grrr... Stupid horoscope!\\c$",
]

[msg.section_0.entries.229]
text = [
  "I tripped and fell down, and my Poké Balls\\n",
  "went everywhere! Heh heh! ♪\\c$",
]

[msg.section_0.entries.230]
text = [
  "Why... My mentor told me I'd never lose\\n",
  "with these strategies...\\c$",
]

[msg.section_0.entries.231]
text = [
  "Ugh... I can't go on...\\n",
  "Where did my determination go?\\c$",
]

[msg.section_0.entries.232]
text = [
  "You're good!\\n",
  "Want to help me take over the world?\\c$",
]

[msg.section_0.entries.233]
text = [
  "Ohh... I want to visit the stars soon!\\c$",
]

[msg.section_0.entries.234]
text = [
  "I won't let this loss get me down!\\n",
  "I've got to keep battling for my family!\\c$",
]

[msg.section_0.entries.235]
text = [
  "I LOSE...SAD-NESS...\\n",
  "Am I taking my robot impression too far?\\c$",
]

[msg.section_0.entries.236]
text = [
  "I shouldn't have let mentor talk\\n",
  "go to my head... I feel bad now...\\c$",
]

[msg.section_0.entries.237]
text = [
  "I've been in this area for more than half a\\n",
  "year now! Maybe I'm just no good...\\c$",
]

[msg.section_0.entries.238]
text = [
  "Yup! I think I'll go train in the lower\\n",
  "areas some more.$",
]

[msg.section_0.entries.239]
text = [
  "Don't think that just because you beat me\\n",
  "you can take on the Trainers up ahead!\\c$",
]

[msg.section_0.entries.240]
text = [
  "You may have beaten me, but you still have\\n",
  "to face even stronger Pokéfans up ahead!\\c$",
]

[msg.section_0.entries.241]
text = [
  "Wow, you beat me soundly!\\c\\n",
  "But you've still got a long way to go\\n",
  "before you can call yourself the strongest!\\c$",
]

[msg.section_0.entries.242]
text = [
  "Determination... Looks like you've got it!\\n",
  "Good luck!\\c$",
]

[msg.section_0.entries.243]
text = [
  "Looks like you have strong bonds with your\\n",
  "Pokémon! Keep it up and you'll go far!\\c$",
]

[msg.section_0.entries.244]
text = [
  "Maybe I should go home to my husband.\\c$",
]

[msg.section_0.entries.245]
text = [
  "That was some good exercise! My\\n",
  "rambunctious Pokémon are pleased!\\c$",
]

[msg.section_0.entries.246]
text = [
  "No time to feel bad about losing!\\n",
  "I'll beat the next opponent for sure!\\c$",
]

[msg.section_0.entries.247]
text = [
  "Yeah, you'll be OK!\\n",
  "Charge on ahead!\\c$",
]

[msg.section_0.entries.248]
text = [
  "OK! That's enough for me!\\n",
  "I'd better get back to the preschool!\\c$",
]

[msg.section_0.entries.249]
text = [
  "Oh, wow...\\n",
  "You're a really serious person!\\c$",
]

[msg.section_0.entries.250]
text = [
  "This place is still too tough! Guess I need\\n",
  "to find somewhere even easier...\\c$",
]

[msg.section_0.entries.251]
text = [
  "As long as we keep focusing on becoming\\n",
  "stronger, we'll beat you someday!\\c$",
]

[msg.section_0.entries.252]
text = [
  "Argh!\\n",
  "Talk about kicking a guy when he's down...\\c$",
]

[msg.section_0.entries.253]
text = [
  "Wow! You saw through their every move!\\n",
  "There's always someone better, they say!\\c$",
]

[msg.section_0.entries.254]
text = [
  "You won't make it down below if you don't\\n",
  "get stronger!\\c$",
]

[msg.section_0.entries.255]
text = [
  "I guess it was just my imagination. I really\\n",
  "thought I'd achieved enlightenment, too...\\c$",
]

[msg.section_0.entries.256]
text = [
  "I'm so sorry...\\n",
  "Please, continue on your way...\\c$",
]

[msg.section_0.entries.257]
text = [
  "Hmph! I guess you need to have stronger\\n",
  "Pokémon to get prize money around here!\\c$",
]

[msg.section_0.entries.258]
text = [
  "Maybe you'll be OK if you've got Pokémon\\n",
  "like those to depend on!\\c$",
]

[msg.section_0.entries.259]
text = [
  "That was fun! Follow the slogan for\\n",
  "fun battles!\\c$",
]

[msg.section_0.entries.260]
text = [
  "You've still got a long road ahead of you!\\n",
  "Don't give up!\\c$",
]

[msg.section_0.entries.261]
text = [
  "An excellent greeting!\\n",
  "Good luck up ahead!\\c$",
]

[msg.section_0.entries.262]
text = [
  "Isn't it great? Come on, you Pokémon!\\n",
  "Breathe with me!\\c$",
]

[msg.section_0.entries.263]
text = [
  "You beat me!\\n",
  "Amazing progress!\\c$",
]

[msg.section_0.entries.264]
text = [
  "Argh! I just can't get away from\\n",
  "the trampling Trainers!\\c$",
]

[msg.section_0.entries.265]
text = [
  "I lost! Maybe I should have spent\\n",
  "more time on the prologue to this...\\c$",
]

[msg.section_0.entries.266]
text = [
  "Meeting new people is one of the best\\n",
  "parts of volunteering!\\c$",
]

[msg.section_0.entries.267]
text = [
  "I hope that Trainers can enjoy battles\\n",
  "in here even a hundred years from now!\\c$",
]

[msg.section_0.entries.268]
text = [
  "I'm a mercenary Trainer. As long as I have\\n",
  "enough battles in a day, I get paid.\\c$",
]

[msg.section_0.entries.269]
text = [
  "Someone with your strength should be able\\n",
  "to have fun battling just about anywhere!\\c$",
]

[msg.section_0.entries.270]
text = [
  "Losing is nothing to be afraid of!\\n",
  "Just keep battling and never run away!\\c$",
]

[msg.section_0.entries.271]
text = [
  "You may be strong, but you still wouldn't\\n",
  "be a match for that Trainer who beat me...\\c$",
]

[msg.section_0.entries.272]
text = [
  "I'm spent...\\n",
  "You win.\\c$",
]

[msg.section_0.entries.273]
text = [
  "Ack! With moves like those, there's no way\\n",
  "I can maintain my focus!\\c$",
]

[msg.section_0.entries.274]
text = [
  "How dare you get in the way of the dreams\\n",
  "of a pure-hearted girl like me?\\c$",
]

[msg.section_0.entries.275]
text = [
  "Argh! It was just as I thought.\\n",
  "You are a bit strong!\\c$",
]

[msg.section_0.entries.276]
text = [
  "I lost! Why would I want to install a\\n",
  "surveillance camera here?\\c\\n",
  "I'm not even sure myself...\\c$",
]

[msg.section_0.entries.277]
text = [
  "Ah... You're quite an interesting\\n",
  "specimen, too!\\c$",
]

[msg.section_0.entries.278]
text = [
  "I plan to jump up and down in the elevator\\n",
  "on my way out of here!\\c$",
]

[msg.section_0.entries.279]
text = [
  "Oh! I got some good data!\\n",
  "This place is a researcher's paradise!\\c$",
]

[msg.section_0.entries.280]
text = [
  "My dad taught me to try to intimidate people\\n",
  "like this, but it didn't work on you!\\c$",
]

[msg.section_0.entries.281]
text = [
  "A weak Trainer like me won't\\n",
  "stand a chance up ahead!\\c$",
]

[msg.section_0.entries.282]
text = [
  "Wow, you're a really skilled Trainer, too!\\c$",
]

[msg.section_0.entries.283]
text = [
  "Maybe you're the kind of Trainer\\n",
  "my dad is searching for!\\c$",
]

[msg.section_0.entries.284]
text = [
  "I lost!\\n",
  "Oh well! Our battle was fun!\\c$",
]

[msg.section_0.entries.285]
text = [
  "You blew us away like so many flower\\n",
  "petals on the wind...\\c$",
]

[msg.section_0.entries.286]
text = [
  "I apologize! Someone like you will be\\n",
  "just fine!\\c$",
]

[msg.section_0.entries.287]
text = [
  "How was the special menu?\\n",
  "We await your next visit!\\c$",
]

[msg.section_0.entries.288]
text = [
  "You won't take it easy on me, either?\\n",
  "You're all such barbarians!\\c$",
]

[msg.section_0.entries.289]
text = [
  "Nice! Your Pokémon are very\\n",
  "charming, too!\\c$",
]

[msg.section_0.entries.290]
text = [
  "Ohh...\\n",
  "The road to popularity sure is steep...\\c$",
]

[msg.section_0.entries.291]
text = [
  "Sorry! I'm just at the age where everyone\\n",
  "looks like a bad guy!\\c$",
]

[msg.section_0.entries.292]
text = [
  "Tsk! I'd better find my friend and have him\\n",
  "trade me some stronger Pokémon!\\c$",
]

[msg.section_0.entries.293]
text = [
  "See! It only stands to reason!\\n",
  "I knew I'd lose to you.$",
]

[msg.section_0.entries.294]
text = [
  "I wonder if the Pokémon in the upper areas\\n",
  "are as dangerous as yours?\\c$",
]

[msg.section_0.entries.295]
text = [
  "Grrr! So many new things I want to buy, but\\n",
  "I don't have any money!\\c$",
]

[msg.section_0.entries.296]
text = [
  "That was good! I have no regrets now!\\n",
  "Be careful up there!\\c$",
]

[msg.section_0.entries.297]
text = [
  "I'll just stand back up if I get knocked\\n",
  "down! I'll never give up!\\c$",
]

[msg.section_0.entries.298]
text = [
  "Marriage is so boring compared to a life of\\n",
  "adventuring and Pokémon battles!\\c$",
]

[msg.section_0.entries.299]
text = [
  "Just how high up does this building go?\\c$",
]

[msg.section_0.entries.300]
text = [
  "Yikes! What is with this place?!\\n",
  "It's like I stepped into another dimension!\\c$",
]

[msg.section_0.entries.301]
text = [
  "Ugh... I guess that didn't work...\\c$",
]

[msg.section_0.entries.302]
text = [
  "So this is my limit...\\n",
  "I'll push beyond it someday!\\c$",
]

[msg.section_0.entries.303]
text = [
  "Maybe this is it for me... I don't think\\n",
  "I can go any further.\\c$",
]

[msg.section_0.entries.304]
text = [
  "You beat everyone's Pokémon... How could\\n",
  "that have happened? Who are you?\\c$",
]

[msg.section_0.entries.305]
text = [
  "Wow, your Pokémon are\\n",
  "even crazier than mine!\\c$",
]

[msg.section_0.entries.306]
text = [
  "Ohh... I guess the bigger the prize,\\n",
  "the harder the battles are, too.\\c$",
]

[msg.section_0.entries.307]
text = [
  "Your battle style has such a savory aroma!\\c$",
]

[msg.section_0.entries.308]
text = [
  "Nice! Don't give up even if you're\\n",
  "burned and blackened!\\c$",
]

[msg.section_0.entries.309]
text = [
  "We may have lost today, but\\n",
  "we'll get you next time for sure!\\c$",
]

[msg.section_0.entries.310]
text = [
  "What powerful attacks!\\n",
  "Oh, man! This is exciting!\\c$",
]

[msg.section_0.entries.311]
text = [
  "No! I'm still too weak to challenge\\n",
  "the Black Belt of legend!\\c$",
]

[msg.section_0.entries.312]
text = [
  "Allow me to welcome you, strong one.\\n",
  "You are meant to be here!\\c$",
]

[msg.section_0.entries.313]
text = [
  "I never should have underestimated an\\n",
  "opponent. Looks like I was the weak one!\\c$",
]

[msg.section_0.entries.314]
text = [
  "Hmph! Looks like you're good enough\\n",
  "to challenge the boss!\\c$",
]

[msg.section_0.entries.315]
text = [
  "I need to figure out how to stop losing...\\n",
  "No one must beat me...\\c$",
]

[msg.section_0.entries.316]
text = [
  "As you can see, I'm different from the\\n",
  "others... I'm nowhere near as strong!\\c$",
]

[msg.section_0.entries.317]
text = [
  "Yeah, I know, I know.\\n",
  "I'm no good all alone.\\c$",
]

[msg.section_0.entries.318]
text = [
  "Ahh, I see. It's Trainers like you that\\n",
  "make the rules around here.\\c$",
]

[msg.section_0.entries.319]
text = [
  "Maybe beating you wasn't so simple\\n",
  "after all...\\c$",
]

[msg.section_0.entries.320]
text = [
  "I lost and now the voices of tree spirits\\n",
  "I heard are gone!\\c\\n",
  "Could it have been my imagination?!\\c$",
]

[msg.section_0.entries.321]
text = [
  "Sometimes you may trip and fall, but just\\n",
  "get back on the path!\\c$",
]

[msg.section_0.entries.322]
text = [
  "Phew! I lost this battle, and now I'm going\\n",
  "to take a breather.\\c$",
]

[msg.section_0.entries.323]
text = [
  "Good luck as you keep going lower!\\c$",
]

[msg.section_0.entries.324]
text = [
  "Who do they think they are? All of us on the\\n",
  "expedition are fans of Pokémon!\\c$",
]

[msg.section_0.entries.325]
text = [
  "See?\\n",
  "I knew I wouldn't win!\\c$",
]

[msg.section_0.entries.326]
text = [
  "I may be experienced, but I just can't\\n",
  "compete with the power of youth!\\c$",
]

[msg.section_0.entries.327]
text = [
  "Cleaning complete!\\n",
  "Check out the shine on your Pokémon!\\c$",
]

[msg.section_0.entries.328]
text = [
  "What a great battle!\\n",
  "Who needs money?\\c$",
]

[msg.section_0.entries.329]
text = [
  "You do have talent! But you also have room\\n",
  "for improvement! How exciting!\\c$",
]

[msg.section_0.entries.330]
text = [
  "Argh... I just know they're watching this\\n",
  "battle and laughing at me!\\c$",
]

[msg.section_0.entries.331]
text = [
  "Whoosh! This place is terrifying!\\c$",
]

[msg.section_0.entries.332]
text = [
  "What? How could I slip up here?!\\c$",
]

[msg.section_0.entries.333]
text = [
  "Now that's what I'm talking about! I came\\n",
  "here to battle strong Trainers like you!\\c$",
]

[msg.section_0.entries.334]
text = [
  "Maybe it's not all about power! I could see\\n",
  "your love for your Pokémon!\\c$",
]

[msg.section_0.entries.335]
text = [
  "What a courageous Trainer! I can sense\\n",
  "your strong determination!\\c$",
]

[msg.section_0.entries.336]
text = [
  "I see... It's gifted ones like you\\n",
  "that make it to the end.\\c$",
]

[msg.section_0.entries.337]
text = [
  "More! We've got to battle harder!\\n",
  "We can create a powerful explosion!\\c$",
]

[msg.section_0.entries.338]
text = [
  "Don't let your guard down!\\n",
  "There are some scary Trainers up ahead!\\c$",
]

[msg.section_0.entries.339]
text = [
  "Time to research this battle data and find\\n",
  "out why I lost! Then I'll become stronger!\\c$",
]

[msg.section_0.entries.340]
text = [
  "Hey! If you're strong, then could you try\\n",
  "to at least look the part?\\c$",
]

[msg.section_0.entries.341]
text = [
  "I can't draw enough ecopower from\\n",
  "Black City... There are too many buildings!\\c$",
]

[msg.section_0.entries.342]
text = [
  "Hmm... Maybe your streak will go on\\n",
  "for a bit longer...\\c$",
]

[msg.section_0.entries.343]
text = [
  "What? I lost?!\\n",
  "And so easily at that...\\c$",
]

[msg.section_0.entries.344]
text = [
  "How could this be?!\\n",
  "Argh! My prize money!\\c$",
]

[msg.section_0.entries.345]
text = [
  "I've always dreamed of having ferocious\\n",
  "battles like this! So much fun!\\c$",
]

[msg.section_0.entries.346]
text = [
  "No wonder the boss is a fan...\\n",
  "I hope you make it far!\\c$",
]

[msg.section_0.entries.347]
text = [
  "There are many more powerful opponents\\n",
  "ahead. Please, keep your guard up!\\c$",
]

[msg.section_0.entries.348]
text = [
  "I hope you can survive up ahead!\\c$",
]

[msg.section_0.entries.349]
text = [
  "Ohh... I just want to take things easy and\\n",
  "enjoy my battles...\\c$",
]

[msg.section_0.entries.350]
text = [
  "We lost!\\n",
  "You've got some strong Pokémon!\\c$",
]

[msg.section_0.entries.351]
text = [
  "You've got the aura of a star around you...\\c$",
]

[msg.section_0.entries.352]
text = [
  "I'm not one of the Elite Four...\\c\\n",
  "I just think of myself as one to be\\n",
  "more confident.\\c$",
]

[msg.section_0.entries.353]
text = [
  "I just know someone's watching our battles!\\n",
  "Grrr! Who could it be?\\c$",
]

[msg.section_0.entries.354]
text = [
  "Incredible! You'll go far with strength\\n",
  "like that!\\c$",
]

[msg.section_0.entries.355]
text = [
  "You're being so nice!\\n",
  "Come on! You can laugh at me!\\c$",
]

[msg.section_0.entries.356]
text = [
  "Wow. With strength like that, you should\\n",
  "be able to go up even higher...\\c$",
]

[msg.section_0.entries.357]
text = [
  "No! Your strength is the true justice here!\\n",
  "Keep going and don't look back!\\c$",
]

[msg.section_0.entries.358]
text = [
  "Ahh! I lost!\\n",
  "You're as strong as I sensed you were!\\c$",
]

[msg.section_0.entries.359]
text = [
  "We've still got a long way to go! But now\\n",
  "I'm motivated! Let's give it our all!\\c$",
]

[msg.section_0.entries.360]
text = [
  "It wasn't enough! I need to become\\n",
  "even more dangerous! Crazy dangerous!\\c$",
]

[msg.section_0.entries.361]
text = [
  "Your Pokémon are something else! They could\\n",
  "even place in the top 10!\\c$",
]

[msg.section_0.entries.362]
text = [
  "Phew... Battling against a strong opponent\\n",
  "really gets the heart beating!\\c$",
]

[msg.section_0.entries.363]
text = [
  "I am one with my Pokémon!\\n",
  "We will share the frustration of this loss.\\c$",
]

[msg.section_0.entries.364]
text = [
  "You defeated my secret weapon!\\n",
  "I don't have a chance against you!\\c$",
]

[msg.section_0.entries.365]
text = [
  "I may have lost, but my fellow Pokéfans\\n",
  "will avenge me!\\c$",
]

[msg.section_0.entries.366]
text = [
  "I'll never give up until I have enough\\n",
  "to open my own bakery!\\c$",
]

[msg.section_0.entries.367]
text = [
  "It doesn't matter if I lose! I just need a\\n",
  "quick snack, and I'll be better in no time!\\c$",
]

[msg.section_0.entries.368]
text = [
  "That's right! We're Trainers!\\n",
  "This is all we have to do!\\c$",
]

[msg.section_0.entries.369]
text = [
  "I've got goose bumps now!\\n",
  "Hee hee! Let's battle again sometime!\\c$",
]

[msg.section_0.entries.370]
text = [
  "You don't give your opponents any room\\n",
  "for error! How impressive!\\c$",
]

[msg.section_0.entries.371]
text = [
  "That's some strength you have...\\n",
  "What determination...\\c$",
]

[msg.section_0.entries.372]
text = [
  "What brave Pokémon you have!\\n",
  "They won't cower in fear!\\c$",
]

[msg.section_0.entries.373]
text = [
  "The weak lose and the strong win!\\n",
  "That's all you need to know about strength!\\c$",
]

[msg.section_0.entries.374]
text = [
  "Ahh! I thought I had you!\\n",
  "I just need to focus more...\\c$",
]

[msg.section_0.entries.375]
text = [
  "You...\\n",
  "I'll beat you someday!\\c$",
]

[msg.section_0.entries.376]
text = [
  "Argh! You beat me!\\n",
  "So much for my ambitions...\\c$",
]

[msg.section_0.entries.377]
text = [
  "I'm so sorry!\\n",
  "Please forgive me...\\c$",
]

[msg.section_0.entries.378]
text = [
  "Thanks! I feel a lot better now!\\n",
  "I'd better get back to my rounds.\\c$",
]

[msg.section_0.entries.379]
text = [
  "Go on! The boss is looking for strong\\n",
  "Trainers like you!\\c$",
]

[msg.section_0.entries.380]
text = [
  "Ugh... I lost!\\n",
  "Maybe I'll go back up to the surface and\\l\\n",
  "take a quick nap!\\c$",
]

[msg.section_0.entries.381]
text = [
  "Ahh... That's a strange-looking mushroom\\n",
  "over there...\\c\\n",
  "No, I'm not hungry enough to risk it!\\c$",
]

[msg.section_0.entries.382]
text = [
  "You've still got a long way to go,\\n",
  "but good luck!\\c$",
]

[msg.section_0.entries.383]
text = [
  "This expedition isn't going anywhere, so I\\n",
  "just made up a story in my head.\\c$",
]

[msg.section_0.entries.384]
text = [
  "Maybe I should go back home for a while...\\n",
  "I want to give my daughter a hug.\\c$",
]

[msg.section_0.entries.385]
text = [
  "Amazing! You're as good as everyone says!\\c$",
]

[msg.section_0.entries.386]
text = [
  "Looks like I'm not as strong as you!\\n",
  "I need to keep training!\\c$",
]

[msg.section_0.entries.387]
text = [
  "Ouch ouch ouch...\\n",
  "I think my back gave out on me...\\c$",
]

[msg.section_0.entries.388]
text = [
  "I won't take responsibility for whatever\\n",
  "happens to you up ahead...\\c$",
]

[msg.section_0.entries.389]
text = [
  "Your strength still isn't enough! The\\n",
  "higher-ups demand an even stronger Trainer!\\c$",
]

[msg.section_0.entries.390]
text = [
  "Gah! My dreams of becoming popular\\n",
  "seem to get farther away by the moment!\\c$",
]

[msg.section_0.entries.391]
text = [
  "We're just flowing in the stream of destiny!\\n",
  "Everything we do is already decided!\\c$",
]

[msg.section_0.entries.392]
text = [
  "So this is what it feels like to lose.\\n",
  "Hmph. I liked it better when I didn't know.\\c$",
]

[msg.section_0.entries.393]
text = [
  "You must not lose yourself in battle...\\n",
  "Good luck!\\c$",
]

[msg.section_0.entries.394]
text = [
  "Even if I lose, I remain calm as long as I'm\\n",
  "surrounded by blue sky.\\c$",
]

[msg.section_0.entries.395]
text = [
  "You seem pretty grounded.\\n",
  "I like that!\\c$",
]

[msg.section_0.entries.396]
text = [
  "My beloved family...\\n",
  "Avenge me!\\c$",
]

[msg.section_0.entries.397]
text = [
  "What an incredible reaction!\\n",
  "How far can it go?\\c$",
]

[msg.section_0.entries.398]
text = [
  "If I'd known we were coming here,\\n",
  "I would have brought stronger Pokémon!\\c$",
]

[msg.section_0.entries.399]
text = [
  "What an exciting battle!\\n",
  "I'm so glad I became a Trainer!\\c$",
]

[msg.section_0.entries.400]
text = [
  "So, you had an ace up your sleeve!\\n",
  "All my efforts...wasted!\\c$",
]

[msg.section_0.entries.401]
text = [
  "You're even stronger than my dad!\\n",
  "Teach him a lesson if you run into him!\\c$",
]

[msg.section_0.entries.402]
text = [
  "What kind of Pokémon have you got?!\\n",
  "They're way too strong! It's no fair!\\c$",
]

[msg.section_0.entries.403]
text = [
  "Wow! It must be you!\\n",
  "You're so strong!\\c$",
]

[msg.section_0.entries.404]
text = [
  "Everyone in here is looking to battle strong\\n",
  "Trainers like you!\\c$",
]

[msg.section_0.entries.405]
text = [
  "Keep going and don't look back!\\n",
  "Happiness can be attained through battling!\\c$",
]

[msg.section_0.entries.406]
text = [
  "I lost...\\n",
  "Gah! Amazing!\\c$",
]

[msg.section_0.entries.407]
text = [
  "Was our battle just the way you like it?\\c$",
]

[msg.section_0.entries.408]
text = [
  "Would you like to join the Boss Trainer\\n",
  "fan club?\\c$",
]

[msg.section_0.entries.409]
text = [
  "We are here to ensure high quality\\n",
  "of service for our Pokémon battles!\\c$",
]

[msg.section_0.entries.410]
text = [
  "Achoo!\\n",
  "Can someone turn down the air conditioning?\\c$",
]

[msg.section_0.entries.411]
text = [
  "Hey! Take it easy!\\n",
  "Show some respect to your elders!\\c$",
]

[msg.section_0.entries.412]
text = [
  "If I don't get better quickly, it's going\\n",
  "to be a while before I make the front page!\\c$",
]

[msg.section_0.entries.413]
text = [
  "You're strong! Hey, do me a favor! If you\\n",
  "see my dad, you should beat him, too!\\c$",
]

[msg.section_0.entries.414]
text = [
  "You're stronger, so you're better!\\n",
  "It's that simple!\\c$",
]

[msg.section_0.entries.415]
text = [
  "I won't say that I don't want to stop\\n",
  "battling and join my friends sometimes...\\c$",
]

[msg.section_0.entries.416]
text = [
  "OK! I think I'll stay in Black City for\\n",
  "a while and get some training in!\\c$",
]

[msg.section_0.entries.417]
text = [
  "When the areas get this big, it becomes\\n",
  "hard to go back and find the elevator!\\c$",
]

[msg.section_0.entries.418]
text = [
  "Outer space... I wonder if I'll\\n",
  "ever make it to the top.\\c$",
]

[msg.section_0.entries.419]
text = [
  "I can't believe it! I've never lost\\n",
  "to anyone on my journey before!\\c$",
]

[msg.section_0.entries.420]
text = [
  "What incredible Pokémon! They could be\\n",
  "on the same level as the Champion's!\\c$",
]

[msg.section_0.entries.421]
text = [
  "Argh! What wild attacks!\\n",
  "You're pretty good, you know?\\c$",
]

[msg.section_0.entries.422]
text = [
  "No way! We tried so hard, but we were\\n",
  "still defeated! How could this happen?\\c$",
]

[msg.section_0.entries.423]
text = [
  "How incredible!\\n",
  "No wonder you're undefeated!\\c$",
]

[msg.section_0.entries.424]
text = [
  "I couldn't defeat you, but my Pokémon\\n",
  "are cheering me up!\\c$",
]

[msg.section_0.entries.425]
text = [
  "The power of love didn't work against you!\\n",
  "Just who are you, anyway?!\\c$",
]

[msg.section_0.entries.426]
text = [
  "You're good! I bet you have really\\n",
  "big dreams of your own!\\c$",
]

[msg.section_0.entries.427]
text = [
  "Oww!\\n",
  "Looks like you baked me!\\c$",
]

[msg.section_0.entries.428]
text = [
  "I won't forgive any Trainer who is\\n",
  "stronger than me!\\c$",
]

[msg.section_0.entries.429]
text = [
  "Tsk! I'm going back to the preschool\\n",
  "so my kids can cheer me up...\\c$",
]

[msg.section_0.entries.430]
text = [
  "You're strong! Someone as good as you may\\n",
  "be able to go head to head with him...\\c$",
]

[msg.section_0.entries.431]
text = [
  "What?\\n",
  "But...but I'm a champion!\\c$",
]

[msg.section_0.entries.432]
text = [
  "Hmm...\\n",
  "So that's how the battle was decided...\\c$",
]

[msg.section_0.entries.433]
text = [
  "Your strength is becoming something of\\n",
  "a legend among the Trainers in here!\\c$",
]

[msg.section_0.entries.434]
text = [
  "You're my newest rival!\\n",
  "Let's get stronger together!\\c$",
]

[msg.section_0.entries.435]
text = [
  "We lost, but you can keep your pity!\\c$",
]

[msg.section_0.entries.436]
text = [
  "Ugh! I guess I have to admit\\n",
  "you're the real deal after all.\\c$",
]

[msg.section_0.entries.437]
text = [
  "See? I can't become the boss like this.\\n",
  "I haven't got a chance!\\c$",
]

[msg.section_0.entries.438]
text = [
  "That's it! I throw my hands up...\\n",
  "Maybe I should go put my feet up instead.\\c$",
]

[msg.section_0.entries.439]
text = [
  "You're even stronger than they say!\\n",
  "We're not even in the same league!\\c$",
]

[msg.section_0.entries.440]
text = [
  "Why don't you try shouting? It feels\\n",
  "good to shout at the top of your lungs!\\c$",
]

[msg.section_0.entries.441]
text = [
  "Oh, you're not an ancient person?\\n",
  "I thought I made a big discovery...\\c$",
]

[msg.section_0.entries.442]
text = [
  "I've got an idea! You clear the way, and I'll\\n",
  "come down after you!\\c$",
]

[msg.section_0.entries.443]
text = [
  "No wonder they can't stop talking\\n",
  "about you! Thanks for the battle!\\c$",
]

[msg.section_0.entries.444]
text = [
  "How could you beat me?\\n",
  "Just who are you?$",
]

[msg.section_0.entries.445]
text = [
  "Even still...\\n",
  "The expedition must go on!\\c$",
]

[msg.section_0.entries.446]
text = [
  "Gah! There's nothing more frustrating\\n",
  "than losing to youngsters like you!\\c$",
]

[msg.section_0.entries.447]
text = [
  "All right! Keep on battling until you\\n",
  "charge past the finish line!\\c$",
]

[msg.section_0.entries.448]
text = [
  "Whoa! If you're that strong, you\\n",
  "might have a chance against him!\\c$",
]

[msg.section_0.entries.449]
text = [
  "Wow! There aren't many like you... If you\\n",
  "get even stronger, you might be able to...\\c$",
]

[msg.section_0.entries.450]
text = [
  "I need to grow strong enough to defeat\\n",
  "this powerful energy...\\c$",
]

[msg.section_0.entries.451]
text = [
  "Ugh! You got me!\\n",
  "What perfect execution!\\c$",
]

[msg.section_0.entries.452]
text = [
  "You appear to be on a higher level\\n",
  "than I am!\\c$",
]

[msg.section_0.entries.453]
text = [
  "Sorry. I've calmed down now...\\n",
  "What could be up there?\\c$",
]

[msg.section_0.entries.454]
text = [
  "What incredible Pokémon!\\n",
  "You beat us soundly!\\c$",
]

[msg.section_0.entries.455]
text = [
  "Hee hee! That battle was a sight\\n",
  "to behold, indeed!\\c$",
]

[msg.section_0.entries.456]
text = [
  "To have defeated my Pokémon so easily...\\n",
  "How incredible!\\c$",
]

[msg.section_0.entries.457]
text = [
  "Argh...\\n",
  "Fine, whatever. Go on with your ruckus.\\c$",
]

[msg.section_0.entries.458]
text = [
  "Wow, you're good! Keep up the\\n",
  "incredible battles, please!\\c$",
]

[msg.section_0.entries.459]
text = [
  "Hmph... You're no fun...\\c$",
]

[msg.section_0.entries.460]
text = [
  "Looks like you've already gotten too\\n",
  "big for me...\\c$",
]

[msg.section_0.entries.461]
text = [
  "Even by the standards of this place,\\n",
  "you're really good!\\c$",
]

[msg.section_0.entries.462]
text = [
  "You looked absentminded, but you were\\n",
  "really thinking about your next strategy!\\c$",
]

[msg.section_0.entries.463]
text = [
  "Everyone's hopes are on me!\\n",
  "I can't give up yet!\\c$",
]

[msg.section_0.entries.464]
text = [
  "I lost...\\n",
  "You might be even stronger than my dad!\\c$",
]

[msg.section_0.entries.465]
text = [
  "I need more power! You will all obey me!\\c$",
]

[msg.section_0.entries.466]
text = [
  "You're just as strong as they say!\\n",
  "It was an honor to battle against you!$",
]

[msg.section_0.entries.467]
text = [
  "Phew... It's no easy task to follow\\n",
  "Trainers at your level!\\c$",
]

[msg.section_0.entries.468]
text = [
  "I can't become the best like this...\\n",
  "Maybe dreams really are just dreams...\\c$",
]

[msg.section_0.entries.469]
text = [
  "As long as you do the best you possibly\\n",
  "can, everything will be OK!\\c$",
]

[msg.section_0.entries.470]
text = [
  "I can't wait to explore the stars\\n",
  "with my Pokémon!\\c$",
]

[msg.section_0.entries.471]
text = [
  "My little trick didn't work this time.\\n",
  "Maybe I miscounted... Maybe you jinxed me!\\c$",
]

[msg.section_0.entries.472]
text = [
  "Argh... Maybe I should start over again...\\n",
  "Third time's the charm, right?\\c$",
]

[msg.section_0.entries.473]
text = [
  "Waaah! I was wrong!\\n",
  "The correct answer is... Me!\\c$",
]

[msg.section_0.entries.474]
text = [
  "If I don't get a move on, I'll be an old\\n",
  "lady before my castle is built!\\c$",
]

[msg.section_0.entries.475]
text = [
  "What? I lost?\\n",
  "Nooo! The prize money is getting away!\\c$",
]

[msg.section_0.entries.476]
text = [
  "Days like this happen!\\n",
  "But I don't stop backpacking!\\c$",
]

[msg.section_0.entries.477]
text = [
  "Ah hah hah hah!\\n",
  "That was great, rival!\\c$",
]

[msg.section_0.entries.478]
text = [
  "This can't be my limit! I'll show everyone\\n",
  "that I can overcome it!\\c$",
]

[msg.section_0.entries.479]
text = [
  "No time for breaks!\\n",
  "Come on, let's run!\\c$",
]

[msg.section_0.entries.480]
text = [
  "Wow! It looks like you think about your\\n",
  "Pokémon even in your sleep!\\c$",
]

[msg.section_0.entries.481]
text = [
  "Ouch ouch... Hey, quit biting me!\\n",
  "Come on, everyone! Let's go home!\\c$",
]

[msg.section_0.entries.482]
text = [
  "Argh! It looks like you are just a little bit\\n",
  "more determined!\\c$",
]

[msg.section_0.entries.483]
text = [
  "Looks like I couldn't stop you...\\n",
  "I wonder how far you'll make it.\\c$",
]

[msg.section_0.entries.484]
text = [
  "It's even harsher than I thought...\\n",
  "But I won't give up! I'll become a winner!\\c$",
]

[msg.section_0.entries.485]
text = [
  "Oh... I didn't have to defeat you after all.\\n",
  "Thank you. That was very nice.\\c$",
]

[msg.section_0.entries.486]
text = [
  "Grrr!\\n",
  "I just need a little bit more!\\c$",
]

[msg.section_0.entries.487]
text = [
  "Now we're friends, too!\\n",
  "I won't forget about you!\\c$",
]

[msg.section_0.entries.488]
text = [
  "You'll hit a wall one of these days.\\n",
  "Think you'll be able to overcome it?\\c$",
]

[msg.section_0.entries.489]
text = [
  "Argh! You must obey me!\\n",
  "I'll never forgive you!\\c$",
]

[msg.section_0.entries.490]
text = [
  "Gah! You defeated our secret technique\\n",
  "so easily!\\c$",
]

[msg.section_0.entries.491]
text = [
  "Muahaha! The pain of losing to you\\n",
  "will fuel my increasing strength!\\c$",
]

[msg.section_0.entries.492]
text = [
  "You'd best prepare for the worst if you\\n",
  "plan to go all the way to the bottom!\\c$",
]

[msg.section_0.entries.493]
text = [
  "Our battle taught me a lot about you!\\c$",
]

[msg.section_0.entries.494]
text = [
  "Hmm... I'm not sure I'm strong enough\\n",
  "to hang out in this area.\\c$",
]

[msg.section_0.entries.495]
text = [
  "Whoa! You countered my counter of your\\n",
  "counter to my counterattack! Amazing!\\c$",
]

[msg.section_0.entries.496]
text = [
  "So this is what going out with a bang is like?\\c$",
]

[msg.section_0.entries.497]
text = [
  "Ahh! What a great battle that was!\\n",
  "Good-bye, Roughneck life!\\c$",
]

[msg.section_0.entries.498]
text = [
  "So many complicated rules on\\n",
  "the surface! I just can't stand it!\\c$",
]

[msg.section_0.entries.499]
text = [
  "You'll never master this place like this!\\n",
  "You need to get even stronger!\\c$",
]

[msg.section_0.entries.500]
text = [
  "A loss is what it is!\\n",
  "A mystery is what it is!\\c$",
]

[msg.section_0.entries.501]
text = [
  "The White Treehollow...\\n",
  "This place is tougher than any mountain...\\c$",
]

[msg.section_0.entries.502]
text = [
  "My loss to the boss... Err, sorry, sorry.\\n",
  "I can't help but rap when I get excited!\\c$",
]

[msg.section_0.entries.503]
text = [
  "How impressive! You'd better make it\\n",
  "all the way to the bottom!\\c$",
]

[msg.section_0.entries.504]
text = [
  "The truth is in here!\\n",
  "I want to believe!\\c$",
]

[msg.section_0.entries.505]
text = [
  "I'm here and enjoying myself with these\\n",
  "battles. Isn't that enough?\\c$",
]

[msg.section_0.entries.506]
text = [
  "With a clean heart and strong Pokémon,\\n",
  "you're an incredible Trainer!\\c$",
]

[msg.section_0.entries.507]
text = [
  "Go onward to the future!\\n",
  "Never look back!\\c$",
]

[msg.section_0.entries.508]
text = [
  "As a challenger, it doesn't matter how many\\n",
  "times I lose! There's always a next time!\\c$",
]

[msg.section_0.entries.509]
text = [
  "If you want to see below, go take a look\\n",
  "for yourself! You should be fine down there!\\c$",
]

[msg.section_0.entries.510]
text = [
  "Gah... What is with everyone in here...\\n",
  "You all have such monstrous strength...\\c$",
]

[msg.section_0.entries.511]
text = [
  "Very soon now... Soon we'll be released\\n",
  "from the bonds of this planet...\\c$",
]

[msg.section_0.entries.512]
text = [
  "What a beautiful defeat!\\n",
  "Mwahaha! We sure gave them a show!\\c$",
]

[msg.section_0.entries.513]
text = [
  "Just who are you?!\\n",
  "I've never been so humiliated...\\c$",
]

[msg.section_0.entries.514]
text = [
  "I'll beat you next time! Then I'll celebrate\\n",
  "with a glorious feast!\\c$",
]

[msg.section_0.entries.515]
text = [
  "How embarrassing...\\n",
  "Please, don't look at me...\\c$",
]

[msg.section_0.entries.516]
text = [
  "Gah... We've still got a way to go!\\n",
  "We need more data!\\c$",
]

[msg.section_0.entries.517]
text = [
  "Go! Keep on going! The vastness of\\n",
  "outer space is right before you!\\c$",
]

[msg.section_0.entries.518]
text = [
  "You might be able to compete on the galactic\\n",
  "stage! Hurry and blast off!\\c$",
]

[msg.section_0.entries.519]
text = [
  "Why do all of you strong Trainers refuse\\n",
  "to share your secrets?\\c$",
]

[msg.section_0.entries.520]
text = [
  "Wow! You're the one who is truly amazing!\\n",
  "Mind if I become your fan?\\c$",
]

[msg.section_0.entries.521]
text = [
  "Chapter 1: Watch out for the Trainer\\n",
  "with the Bag...\\c$",
]

[msg.section_0.entries.522]
text = [
  "Wha--? I lost already?\\n",
  "I didn't even see what you did!\\c$",
]

[msg.section_0.entries.523]
text = [
  "Wow, you're impressive!\\n",
  "You could be a great Teacher!\\c$",
]

[msg.section_0.entries.524]
text = [
  "You beat my friend earlier...\\n",
  "Argh... So frustrating...\\c$",
]

[msg.section_0.entries.525]
text = [
  "I won't cry, either! When I conquer this\\n",
  "place, I'll laugh and cry at the same time!\\c$",
]

[msg.section_0.entries.526]
text = [
  "From the first course to the last,\\n",
  "you defeated them all!\\c$",
]

[msg.section_0.entries.527]
text = [
  "What an amazing spirit...and what amazing\\n",
  "Pokémon! Please, continue onward...\\c$",
]

[msg.section_0.entries.528]
text = [
  "Is it because we're so high up?\\n",
  "Ugh...need more air...\\c$",
]

[msg.section_0.entries.529]
text = [
  "That was a pretty incredible battle.\\c$",
]

[msg.section_0.entries.530]
text = [
  "Wait... There's no air in outer space?\\n",
  "I never knew that!\\c$",
]

[msg.section_0.entries.531]
text = [
  "Grr... I swore on live TV that I'd\\n",
  "defeat you...\\c$",
]

[msg.section_0.entries.532]
text = [
  "Losing once or twice won't shake the\\n",
  "belief I have in my partners!\\c$",
]

[msg.section_0.entries.533]
text = [
  "I bet the lights of the buildings\\n",
  "look beautiful from above!\\c$",
]

[msg.section_0.entries.534]
text = [
  "Even if all my fans forget about me, I hope\\n",
  "I've given you a battle to remember...\\c$",
]

[msg.section_0.entries.535]
text = [
  "Ah ha ha! Don't worry! I'm just making\\n",
  "this all up in my head!\\c$",
]

[msg.section_0.entries.536]
text = [
  "Are you, by chance, always overcoming\\n",
  "your limits?\\c$",
]

[msg.section_0.entries.537]
text = [
  "Ahh! I've come so close, but I just\\n",
  "can't reach the goal!\\c$",
]

[msg.section_0.entries.538]
text = [
  "I lost...\\n",
  "I want to see space someday...\\c$",
]

[msg.section_0.entries.539]
text = [
  "I'll keep training to get stronger and\\n",
  "work my way to the top. Even if it's scary!\\c$",
]

[msg.section_0.entries.540]
text = [
  "This long adventure is finally coming to a\\n",
  "close... A bit sad when I think about it.\\c$",
]

[msg.section_0.entries.541]
text = [
  "How could you have become so strong?\\c$",
]

[msg.section_0.entries.542]
text = [
  "I see... Somewhere along the way, it seems\\n",
  "I've lost track of what's important...\\c$",
]

[msg.section_0.entries.543]
text = [
  "I've never seen Pokémon like that before...\\n",
  "The world sure is a big place.$",
]

[msg.section_0.entries.544]
text = [
  "A world governed by love...\\n",
  "We won't give up on our dream so easily!\\c$",
]

[msg.section_0.entries.545]
text = [
  "Looks like you're one of us!\\c$",
]

[msg.section_0.entries.546]
text = [
  "Just keep it up, and you too can make your\\n",
  "dreams come true!\\c$",
]

[msg.section_0.entries.547]
text = [
  "Buns baked at the bottom are delicious!\\n",
  "Won't you try one?\\c$",
]

[msg.section_0.entries.548]
text = [
  "I'll beat you next time! I won't let\\n",
  "a new person like you show me up!\\c$",
]

[msg.section_0.entries.549]
text = [
  "What? Just what was that?!\\n",
  "Now I've lost all my confidence...\\c$",
]

[msg.section_0.entries.550]
text = [
  "The battle...was fun...\\n",
  "Then why am I crying?\\c$",
]

[msg.section_0.entries.551]
text = [
  "I lost? How?\\n",
  "Just who are you?\\c$",
]

[msg.section_0.entries.552]
text = [
  "You are the new legend.\\n",
  "Someday, we shall battle again.\\c$",
]

[msg.section_0.entries.553]
text = [
  "The more experienced one is you!\\n",
  "I can tell by the way you battle.\\c$",
]

[msg.section_0.entries.554]
text = [
  "Your Pokémon are impressive, but you're\\n",
  "even more impressive!\\c$",
]

[msg.section_0.entries.555]
text = [
  "Thanks for stopping me!\\n",
  "I sometimes forget myself!\\c$",
]

[msg.section_0.entries.556]
text = [
  "Ahh! Watch me! No one has ever made\\n",
  "such a brilliant exit before!\\c$",
]

[msg.section_0.entries.557]
text = [
  "Hmph! Looks like you and your Pokémon\\n",
  "have even stronger trust!\\c$",
]

[msg.section_0.entries.558]
text = [
  "Your strength is true justice!\\n",
  "This area is just that kind of place.\\c$",
]

[msg.section_0.entries.559]
text = [
  "It looks like even I am not up to the task of\\n",
  "defeating you. I wonder if anyone can...\\c$",
]

[msg.section_0.entries.560]
text = [
  "Wha--? What happened?\\n",
  "Why are you looking at me like that?\\c$",
]

[msg.section_0.entries.561]
text = [
  "There's no treasure, is there?\\n",
  "I think I may have been hoodwinked!\\c$",
]

[msg.section_0.entries.562]
text = [
  "Say hello if you run into me again!\\c$",
]

[msg.section_0.entries.563]
text = [
  "What a strange place...\\n",
  "So intriguing...\\c$",
]

[msg.section_0.entries.564]
text = [
  "I didn't lose!\\n",
  "I'm not even me!\\c$",
]

[msg.section_0.entries.565]
text = [
  "A first-class Trainer...\\n",
  "You'll be envied by all!\\c$",
]

[msg.section_0.entries.566]
text = [
  "I've been alive for a very long time, but\\n",
  "I've never encountered a Trainer like you.\\c$",
]

[msg.section_0.entries.567]
text = [
  "You mean my daughter didn't put you up\\n",
  "to this? I've run away from home...\\c$",
]

[msg.section_0.entries.568]
text = [
  "I was looking for someone like you.\\n",
  "You might be able to make it to the end...\\c$",
]

[msg.section_0.entries.569]
text = [
  "How is it? Makes even defeat smell good!\\c$",
]

[msg.section_0.entries.570]
text = [
  "Your power is rooted deep down...\\n",
  "It's stronger than the power of space!\\c$",
]

[msg.section_0.entries.571]
text = [
  "Argh! I won't lose! I'm better than this!\\n",
  "I'm aiming for the top!\\c$",
]

[msg.section_0.entries.572]
text = [
  "Ha ha! Someone is watching us and laughing\\n",
  "right now!\\c$",
]

[msg.section_0.entries.573]
text = [
  "The power...subsided?\\n",
  "Thanks! I owe you big-time!\\c$",
]

[msg.section_0.entries.574]
text = [
  "Mmm-hmm! I gave it my all and lost, but that\\n",
  "sure was fun and refreshing!\\c$",
]

[msg.section_0.entries.575]
text = [
  "Now I join the ranks of the fallen...\\n",
  "It's all up to you now!\\c$",
]

[msg.section_0.entries.576]
text = [
  "I love that you're lost! As the architect of\\n",
  "this place, that makes me very happy!\\c$",
]

[msg.section_0.entries.577]
text = [
  "I need more data... No, that can't be it!\\n",
  "I just can't process this battle!\\c$",
]

[msg.section_0.entries.578]
text = [
  "How could I have lost?\\n",
  "Maybe I can't surpass humanity?\\c$",
]

[msg.section_0.entries.579]
text = [
  "Be my test subject...\\n",
  "Please...?\\c$",
]

[msg.section_0.entries.580]
text = [
  "I'll defeat them all someday!\\c\\n",
  "That's how I'll repay all of their kindness\\n",
  "for training with me!\\c$",
]

[msg.section_0.entries.581]
text = [
  "As expected, I lost! That's it!\\n",
  "I'm going back to the lower areas!\\c$",
]

[msg.section_0.entries.582]
text = [
  "How could I lose? I came into this world\\n",
  "screaming two times two equals four!\\c$",
]

[msg.section_0.entries.583]
text = [
  "I've never met anyone so strong! Things\\n",
  "will be more interesting with a rival like you!\\c$",
]

[msg.section_0.entries.584]
text = [
  "You're fun to battle against!\\n",
  "Let's do it again sometime!\\c$",
]

[msg.section_0.entries.585]
text = [
  "For you to have defeated me, who has an IQ\\n",
  "of over 300...how incredible...\\c$",
]

[msg.section_0.entries.586]
text = [
  "I gave it my all and lost!\\n",
  "I have no regrets.\\c$",
]

[msg.section_0.entries.587]
text = [
  "It appears you have come prepared.\\n",
  "Please, go on your way.\\c$",
]

[msg.section_0.entries.588]
text = [
  "What does it mean to be the best Waitress?\\n",
  "Is it to provide the best service?\\c$",
]

[msg.section_0.entries.589]
text = [
  "I'm so quick, I bring out the drinks in two\\n",
  "seconds flat! How could I lose to you?!\\c$",
]

[msg.section_0.entries.590]
text = [
  "This was great training!\\n",
  "Let's survive together!\\c$",
]

[msg.section_0.entries.591]
text = [
  "I lost again...\\n",
  "How did you get so much stronger?\\c$",
]

[msg.section_0.entries.592]
text = [
  "This battle may be over!\\n",
  "But the adventure continues!\\c$",
]

[msg.section_0.entries.593]
text = [
  "Ah ha ha...\\n",
  "What a hilarious way to lose...\\c$",
]

[msg.section_0.entries.594]
text = [
  "I see now that you're not alone!\\n",
  "You've got some great Pokémon with you!\\c$",
]

[msg.section_0.entries.595]
text = [
  "I need to win more prize money so I can\\n",
  "live the easy life as an adult!\\c$",
]

[msg.section_0.entries.596]
text = [
  "Impressive to have come this far!\\n",
  "You're a competent Trainer!\\c$",
]

[msg.section_0.entries.597]
text = [
  "Gah! Just my luck to run into a powerful\\n",
  "foe like you just before reaching the top!\\c$",
]

[msg.section_0.entries.598]
text = [
  "I can feel the strength of your resolve...\\n",
  "Don't give up! Good luck!\\c$",
]

[msg.section_0.entries.599]
text = [
  "Ugh... I didn't know there were Trainers\\n",
  "as strong as you in here...\\c$",
]

[msg.section_0.entries.600]
text = [
  "This is still just the starting line!\\n",
  "Train more and get stronger!\\c$",
]

[msg.section_0.entries.601]
text = [
  "What impressive attacks!\\n",
  "But don't neglect your training!\\c$",
]

[msg.section_0.entries.602]
text = [
  "Don't forget our battle!\\n",
  "It will become a source of your strength!\\c$",
]

[msg.section_0.entries.603]
text = [
  "Nice! That's how you do it!\\n",
  "Keep on battling like that!\\c$",
]

[msg.section_0.entries.604]
text = [
  "You won't survive in the next area\\n",
  "unless you're strong!\\c$",
]

[msg.section_0.entries.605]
text = [
  "That's right! Refine yourself, and become\\n",
  "an example for your Pokémon!\\c$",
]

[msg.section_0.entries.606]
text = [
  "I gave it my all!\\n",
  "I have no regrets...\\c$",
]

[msg.section_0.entries.607]
text = [
  "It looks like you might be strong enough\\n",
  "to look after your Pokémon, no matter what!\\c$",
]

[msg.section_0.entries.608]
text = [
  "We still have room for improvement!\\n",
  "There is no wall we can't overcome!\\c$",
]

[msg.section_0.entries.609]
text = [
  "I never even imagined that there could be\\n",
  "someone strong enough to beat my Pokémon!\\c$",
]

[msg.section_0.entries.610]
text = [
  "I hope I was a help in training\\n",
  "your Pokémon!\\c$",
]

[msg.section_0.entries.611]
text = [
  "Oh, what rowdy Pokémon you have!\\n",
  "I'm all tired out!\\c$",
]

[msg.section_0.entries.612]
text = [
  "Excellent! Your Pokémon have grown strong!\\n",
  "Keep up the good training!\\c$",
]

[msg.section_0.entries.613]
text = [
  "Training time is over!\\n",
  "That was very productive!\\c$",
]

[msg.section_0.entries.614]
text = [
  "Keep that up, and your Pokémon will be\\n",
  "ready in no time!\\c$",
]

[msg.section_0.entries.615]
text = [
  "You sure kept up well!\\n",
  "What a great battle!$",
]

[msg.section_0.entries.616]
text = [
  "What amazing Pokémon you've trained!\\n",
  "What's your secret?\\c$",
]

[msg.section_0.entries.617]
text = [
  "This is the extent of my power?\\n",
  "I need to get stronger!\\c$",
]

[msg.section_0.entries.618]
text = [
  "Nope... There's still something missing...\\n",
  "What could it be?\\c$",
]

[msg.section_0.entries.619]
text = [
  "Even with such Pokémon, I still lost?\\n",
  "I guess training never ends!\\c$",
]

[msg.section_0.entries.620]
text = [
  "Yes! This is the kind of excitement\\n",
  "I've been looking for!\\c$",
]

[msg.section_0.entries.621]
text = [
  "A true Rich Boy is elegant even in defeat!\\c$",
]

[msg.section_0.entries.622]
text = [
  "I'm going to tell my daddy to give me\\n",
  "even stronger Pokémon!\\c$",
]

[msg.section_0.entries.623]
text = [
  "No one in my social circles could battle\\n",
  "nearly as well as you!\\c$",
]

[msg.section_0.entries.624]
text = [
  "How much did it cost to raise those Pokémon?\\n",
  "You crazy moneymonger!\\c$",
]

[msg.section_0.entries.625]
text = [
  "Gah! Listen! I'll pay you if you just\\n",
  "take it easy on me!\\c$",
]

[msg.section_0.entries.626]
text = [
  "How?! Stupid granddad!\\n",
  "Why didn't you get me stronger Pokémon?\\c$",
]

[msg.section_0.entries.627]
text = [
  "Thank you very much!\\n",
  "You were an excellent dance partner. ♪\\c$",
]

[msg.section_0.entries.628]
text = [
  "You're so strong...\\n",
  "I'm glad I found a proper opponent!\\c$",
]

[msg.section_0.entries.629]
text = [
  "Ahh! Why would you do such a thing\\n",
  "to my adorable Pokémon?!\\c$",
]

[msg.section_0.entries.630]
text = [
  "I used to be pretty good when I was young.\\n",
  "Still, I guess getting older is unavoidable...\\c$",
]

[msg.section_0.entries.631]
text = [
  "You've still got some room for improvement!\\n",
  "Keep up the training!\\c$",
]

[msg.section_0.entries.632]
text = [
  "You should try starting up a company!\\n",
  "There's no doubt you'd be successful!\\c$",
]

[msg.section_0.entries.633]
text = [
  "Serious battles like this can only be\\n",
  "enjoyed in here!\\c$",
]

[msg.section_0.entries.634]
text = [
  "That's right, youngster! Climb over me\\n",
  "on your way to the top!\\c$",
]

[msg.section_0.entries.635]
text = [
  "Thank you for providing me with enjoyment\\n",
  "that even the best luxuries can't give me!\\c$",
]

[msg.section_0.entries.636]
text = [
  "What's the matter with you?!\\n",
  "Sit still and listen to my boasting!\\c$",
]

[msg.section_0.entries.637]
text = [
  "Our battle will be talked about\\n",
  "for generations!\\c$",
]

[msg.section_0.entries.638]
text = [
  "Even defeat cannot extinguish my fervent\\n",
  "desire to have it all! Ahh!\\c$",
]

[msg.section_0.entries.639]
text = [
  "Phew... Our blissful time transcended all!\\c$",
]

[msg.section_0.entries.640]
text = [
  "OK! I'll take care of your Pokémon now!\\c$",
]

[msg.section_0.entries.641]
text = [
  "You win!\\n",
  "Now show me your Pokémon!\\c$",
]

[msg.section_0.entries.642]
text = [
  "I just can't beat dedicated Trainers like\\n",
  "you! Here, I'll fix up your Pokémon!\\c$",
]

[msg.section_0.entries.643]
text = [
  "Such a brilliant sparkle! I shall offer my\\n",
  "recovery services!\\c$",
]

[msg.section_0.entries.644]
text = [
  "Examination complete!\\n",
  "You've got some impressive Pokémon!\\c$",
]

[msg.section_0.entries.645]
text = [
  "OK! Show me your tired Pokémon!\\n",
  "I'll patch them up in no time!\\c$",
]

[msg.section_0.entries.646]
text = [
  "It's an honor to recover such strong\\n",
  "Pokémon as these!\\c$",
]

[msg.section_0.entries.647]
text = [
  "I lost, so I'll take a look at your Pokémon.\\n",
  "I can recover any injury!\\c$",
]

[msg.section_0.entries.648]
text = [
  "I knew all of their weaknesses, but I felt\\n",
  "sorry for your Pokémon and held back...\\c$",
]

[msg.section_0.entries.649]
text = [
  "OK! Now I'll make sure your Pokémon\\n",
  "are fully recovered!\\c$",
]

[msg.section_0.entries.650]
text = [
  "You're really strong!\\n",
  "I think I like you!\\c$",
]

[msg.section_0.entries.651]
text = [
  "How impressive you were!\\n",
  "Now show me those Pokémon!\\c$",
]

[msg.section_0.entries.652]
text = [
  "What brave Pokémon you have!\\n",
  "You beat me!\\c$",
]

[msg.section_0.entries.653]
text = [
  "Just as I promised, I'll recover your\\n",
  "Pokémon! Here, show them to me!\\c$",
]

[msg.section_0.entries.654]
text = [
  "And now, after our battle, it's\\n",
  "recovery time! Hope you enjoy!\\c$",
]

[msg.section_0.entries.655]
text = [
  "It was a perfect battle, so I'll give your\\n",
  "Pokémon a perfect recovery!\\c$",
]

[msg.section_0.entries.656]
text = [
  "OK! I hope you enjoy this brief moment\\n",
  "of rest and recovery!\\c$",
]

[msg.section_0.entries.657]
text = [
  "Phew... No point in complaining, I guess.\\n",
  "Time to get back to work!\\c$",
]

[msg.section_0.entries.658]
text = [
  "You beat me, so I don't have a choice.\\n",
  "Here, I'll recover your Pokémon!\\c$",
]

[msg.section_0.entries.659]
text = [
  "Now that your Pokémon are recovered,\\n",
  "go for the goal and don't give up!\\c$",
]

[msg.section_0.entries.0]
text = [
  "$",
]

[msg.section_0.entries.1]
text = [
  "For some time after its birth, it\\n",
  "grows by gaining nourishment from\\n",
  "the seed on its back.$",
]

[msg.section_0.entries.2]
text = [
  "When the bud on its back starts\\n",
  "swelling, a sweet aroma wafts to\\n",
  "indicate the flower's coming bloom.$",
]

[msg.section_0.entries.3]
text = [
  "After a rainy day, the flower on\\n",
  "its back smells stronger. The\\n",
  "scent attracts other Pokémon.$",
]

[msg.section_0.entries.4]
text = [
  "The fire on the tip of its tail is a\\n",
  "measure of its life. If healthy,\\n",
  "its tail burns intensely.$",
]

[msg.section_0.entries.5]
text = [
  "In the rocky mountains where\\n",
  "Charmeleon live, their fiery\\n",
  "tails shine at night like stars.$",
]

[msg.section_0.entries.6]
text = [
  "It is said that Charizard's fire\\n",
  "burns hotter if it has\\n",
  "experienced harsh battles.$",
]

[msg.section_0.entries.7]
text = [
  "It shelters itself in its shell\\n",
  "then strikes back with spouts of\\n",
  "water at every opportunity.$",
]

[msg.section_0.entries.8]
text = [
  "It is said to live 10,000 years.\\n",
  "Its furry tail is popular as a\\n",
  "symbol of longevity.$",
]

[msg.section_0.entries.9]
text = [
  "The jets of water it spouts from\\n",
  "the rocket cannons on its shell\\n",
  "can punch through thick steel.$",
]

[msg.section_0.entries.10]
text = [
  "It releases a stench from its red\\n",
  "antenna to repel enemies. It\\n",
  "grows by molting repeatedly.$",
]

[msg.section_0.entries.11]
text = [
  "A steel-hard shell protects its\\n",
  "tender body. It quietly endures\\n",
  "hardships while awaiting evolution.$",
]

[msg.section_0.entries.12]
text = [
  "It loves the honey of flowers and\\n",
  "can locate flower patches that\\n",
  "have even tiny amounts of pollen.$",
]

[msg.section_0.entries.13]
text = [
  "It eats its weight in leaves every\\n",
  "day. It fends off attackers with\\n",
  "the needle on its head.$",
]

[msg.section_0.entries.14]
text = [
  "While awaiting evolution, it\\n",
  "hides from predators under\\n",
  "leaves and in nooks of branches.$",
]

[msg.section_0.entries.15]
text = [
  "Its best attack involves flying\\n",
  "around at high speed, striking with\\n",
  "poison needles, then flying off.$",
]

[msg.section_0.entries.16]
text = [
  "It is docile and prefers to avoid\\n",
  "conflict. If disturbed, however,\\n",
  "it can ferociously strike back.$",
]

[msg.section_0.entries.17]
text = [
  "It flies over its wide territory in\\n",
  "search of prey, downing it\\n",
  "with its highly developed claws.$",
]

[msg.section_0.entries.18]
text = [
  "By flapping its wings with all its\\n",
  "might, Pidgeot can make a gust of\\n",
  "wind capable of bending tall trees.$",
]

[msg.section_0.entries.19]
text = [
  "It searches for food all day. It gnaws\\n",
  "on hard objects to wear down its fangs,\\n",
  "which grow constantly during its lifetime.$",
]

[msg.section_0.entries.20]
text = [
  "With its long fangs, this surprisingly\\n",
  "violent Pokémon can gnaw away\\n",
  "even thick concrete with ease.$",
]

[msg.section_0.entries.21]
text = [
  "It flaps its small wings busily to\\n",
  "fly. Using its beak, it searches\\n",
  "in grass for prey.$",
]

[msg.section_0.entries.22]
text = [
  "It has the stamina to fly all\\n",
  "day on its broad wings. It\\n",
  "fights by using its sharp beak.$",
]

[msg.section_0.entries.23]
text = [
  "It sneaks through grass without\\n",
  "making a sound and strikes\\n",
  "unsuspecting prey from behind.$",
]

[msg.section_0.entries.24]
text = [
  "The pattern on its belly is for\\n",
  "intimidation. It constricts foes\\n",
  "while they are frozen in fear.$",
]

[msg.section_0.entries.25]
text = [
  "It occasionally uses an electric\\n",
  "shock to recharge a fellow Pikachu\\n",
  "that is in a weakened state.$",
]

[msg.section_0.entries.26]
text = [
  "Its tail discharges electricity into\\n",
  "the ground, protecting it from\\n",
  "getting shocked.$",
]

[msg.section_0.entries.27]
text = [
  "It digs deep burrows to live in.\\n",
  "When in danger, it rolls up its\\n",
  "body to withstand attacks.$",
]

[msg.section_0.entries.28]
text = [
  "The spikes on its body are made\\n",
  "up of its hardened hide. It rolls up\\n",
  "and attacks foes with its spikes.$",
]

[msg.section_0.entries.29]
text = [
  "While it does not prefer to fight,\\n",
  "even one drop of the poison it\\n",
  "secretes from barbs can be fatal.$",
]

[msg.section_0.entries.30]
text = [
  "When it senses danger, it raises\\n",
  "all the barbs on its body. These\\n",
  "barbs grow slower than Nidorino's.$",
]

[msg.section_0.entries.31]
text = [
  "Its entire body is armored with\\n",
  "hard scales. It will protect the\\n",
  "young in its burrow with its life.$",
]

[msg.section_0.entries.32]
text = [
  "It scans its surroundings by\\n",
  "raising its ears out of the grass.\\n",
  "Its toxic horn is for protection.$",
]

[msg.section_0.entries.33]
text = [
  "It has a violent disposition and\\n",
  "stabs foes with its horn, which\\n",
  "oozes poison upon impact.$",
]

[msg.section_0.entries.34]
text = [
  "One swing of its mighty tail can\\n",
  "snap a telephone pole as if it were\\n",
  "a matchstick.$",
]

[msg.section_0.entries.35]
text = [
  "On nights with a full moon, Clefairy\\n",
  "gather from all over and dance.\\n",
  "Bathing in moonlight makes them float.$",
]

[msg.section_0.entries.36]
text = [
  "Their ears are sensitive enough to hear\\n",
  "a pin drop from over a mile away,\\n",
  "so they're usually found in quiet places.$",
]

[msg.section_0.entries.37]
text = [
  "As each tail grows, its fur becomes\\n",
  "more lustrous. When held, it feels\\n",
  "slightly warm.$",
]

[msg.section_0.entries.38]
text = [
  "Each of its nine tails is imbued\\n",
  "with supernatural power, and it\\n",
  "can live for a thousand years.$",
]

[msg.section_0.entries.39]
text = [
  "Looking into its cute, round eyes makes\\n",
  "it start singing a song so pleasant\\n",
  "listeners can't help but fall asleep.$",
]

[msg.section_0.entries.40]
text = [
  "Its fine fur feels so pleasant,\\n",
  "those who accidentally touch it\\n",
  "cannot take their hands away.$",
]

[msg.section_0.entries.41]
text = [
  "It does not need eyes, because it\\n",
  "emits ultrasonic waves to check\\n",
  "its surroundings while it flies.$",
]

[msg.section_0.entries.42]
text = [
  "Flitting around in the dead of night,\\n",
  "it sinks its fangs into its prey and\\n",
  "drains a nearly fatal amount of blood.$",
]

[msg.section_0.entries.43]
text = [
  "It often plants its root feet in the\\n",
  "ground during the day and sows\\n",
  "seeds as it walks about at night.$",
]

[msg.section_0.entries.44]
text = [
  "The honey it drools from its mouth\\n",
  "smells so atrocious, it can curl\\n",
  "noses more than a mile away.$",
]

[msg.section_0.entries.45]
text = [
  "Its petals are the largest in the\\n",
  "world. As it walks, it scatters\\n",
  "extremely allergenic pollen.$",
]

[msg.section_0.entries.46]
text = [
  "Mushrooms named tochukaso grow\\n",
  "on its back. They grow along\\n",
  "with the host Paras.$",
]

[msg.section_0.entries.47]
text = [
  "A mushroom grown larger than the\\n",
  "host's body controls Parasect.\\n",
  "It scatters poisonous spores.$",
]

[msg.section_0.entries.48]
text = [
  "Its big eyes are actually clusters\\n",
  "of tiny eyes. At night, its kind is\\n",
  "drawn by light.$",
]

[msg.section_0.entries.49]
text = [
  "It flutters its wings to scatter\\n",
  "dustlike scales. The scales leach\\n",
  "toxins if they contact skin.$",
]

[msg.section_0.entries.50]
text = [
  "A Pokémon that lives underground.\\n",
  "Because of its dark habitat, it is\\n",
  "repelled by bright sunlight.$",
]

[msg.section_0.entries.51]
text = [
  "Its three heads move alternately,\\n",
  "driving it through tough soil to\\n",
  "depths of over 60 miles.$",
]

[msg.section_0.entries.52]
text = [
  "It is nocturnal in nature. If it\\n",
  "spots something shiny, its eyes\\n",
  "glitter brightly.$",
]

[msg.section_0.entries.53]
text = [
  "A very haughty Pokémon. Among\\n",
  "fans, the size of the jewel in its\\n",
  "forehead is a topic of much talk.$",
]

[msg.section_0.entries.54]
text = [
  "When headaches stimulate its brain\\n",
  "cells, which are usually inactive,\\n",
  "it can use a mysterious power.$",
]

[msg.section_0.entries.55]
text = [
  "When its forehead shines mysteriously,\\n",
  "Golduck can use the full extent\\n",
  "of its power.$",
]

[msg.section_0.entries.56]
text = [
  "It lives in treetop colonies.\\n",
  "If one becomes enraged, the whole\\n",
  "colony rampages for no reason.$",
]

[msg.section_0.entries.57]
text = [
  "It grows angry if you see its eyes\\n",
  "and gets angrier if you run. If you\\n",
  "beat it, it gets even madder.$",
]

[msg.section_0.entries.58]
text = [
  "Extremely loyal to its Trainer, it will\\n",
  "bark at those who approach the Trainer\\n",
  "unexpectedly and run them out of town.$",
]

[msg.section_0.entries.59]
text = [
  "The sight of it running over 6,200 miles\\n",
  "in a single day and night has captivated\\n",
  "many people.$",
]

[msg.section_0.entries.60]
text = [
  "Its skin is so thin, its internal\\n",
  "organs are visible. It has trouble\\n",
  "walking on its newly grown feet.$",
]

[msg.section_0.entries.61]
text = [
  "The spiral pattern on its belly\\n",
  "subtly undulates. Staring at it\\n",
  "gradually causes drowsiness.$",
]

[msg.section_0.entries.62]
text = [
  "With its extremely tough muscles,\\n",
  "it can keep swimming in the Pacific\\n",
  "Ocean without resting.$",
]

[msg.section_0.entries.63]
text = [
  "Using its psychic power is such a\\n",
  "strain on its brain that it needs\\n",
  "to sleep for 18 hours a day.$",
]

[msg.section_0.entries.64]
text = [
  "It stares at its silver spoon to\\n",
  "focus its mind. It emits more alpha\\n",
  "waves while doing so.$",
]

[msg.section_0.entries.65]
text = [
  "The spoons clutched in its hands\\n",
  "are said to have been created by\\n",
  "its psychic powers.$",
]

[msg.section_0.entries.66]
text = [
  "Though small in stature, it is\\n",
  "powerful enough to easily heft and\\n",
  "throw a number of Geodude at once.$",
]

[msg.section_0.entries.67]
text = [
  "It happily carries heavy cargo to\\n",
  "toughen up. It willingly does hard\\n",
  "work for people.$",
]

[msg.section_0.entries.68]
text = [
  "Its four muscled arms slam foes\\n",
  "with powerful punches and chops\\n",
  "at blinding speed.$",
]

[msg.section_0.entries.69]
text = [
  "It prefers hot and humid\\n",
  "environments. It is quick at\\n",
  "capturing prey with its vines.$",
]

[msg.section_0.entries.70]
text = [
  "A Pokémon that appears to be a\\n",
  "plant. It captures unwary prey by\\n",
  "dousing them with a toxic powder.$",
]

[msg.section_0.entries.71]
text = [
  "It pools in its mouth a fluid with\\n",
  "a honey-like scent, which is really\\n",
  "an acid that dissolves anything.$",
]

[msg.section_0.entries.72]
text = [
  "Because its body is almost entirely\\n",
  "composed of water, it shrivels up if\\n",
  "it is washed ashore.$",
]

[msg.section_0.entries.73]
text = [
  "It extends its 80 tentacles to\\n",
  "form an encircling poisonous net\\n",
  "that is difficult to escape.$",
]

[msg.section_0.entries.74]
text = [
  "At rest, it looks just like a rock.\\n",
  "Carelessly stepping on it will make\\n",
  "it swing its fists angrily.$",
]

[msg.section_0.entries.75]
text = [
  "It rolls on mountain paths to move.\\n",
  "Once it builds momentum, no Pokémon\\n",
  "can stop it without difficulty.$",
]

[msg.section_0.entries.76]
text = [
  "Even dynamite can't harm its hard,\\n",
  "boulder-like body. It sheds its hide\\n",
  "just once a year.$",
]

[msg.section_0.entries.77]
text = [
  "As a newborn, it can barely stand.\\n",
  "However, through galloping, its\\n",
  "legs are made tougher and faster.$",
]

[msg.section_0.entries.78]
text = [
  "When at an all-out gallop, its\\n",
  "blazing mane sparkles, enhancing\\n",
  "its beautiful appearance.$",
]

[msg.section_0.entries.79]
text = [
  "Although slow, it is skilled at\\n",
  "fishing with its tail. It does not\\n",
  "feel pain if its tail is bitten.$",
]

[msg.section_0.entries.80]
text = [
  "Though usually dim witted, it\\n",
  "seems to become inspired if the\\n",
  "Shellder on its tail bites down.$",
]

[msg.section_0.entries.81]
text = [
  "The electromagnetic waves emitted by\\n",
  "the units at the sides of its head expel\\n",
  "antigravity, which allows it to float.$",
]

[msg.section_0.entries.82]
text = [
  "The stronger electromagnetic waves\\n",
  "from the three linked Magnemite are\\n",
  "enough to dry out surrounding moisture.$",
]

[msg.section_0.entries.83]
text = [
  "It can't live without the stalk it\\n",
  "holds. That's why it defends the\\n",
  "stalk from attackers with its life.$",
]

[msg.section_0.entries.84]
text = [
  "The brains in its two heads appear\\n",
  "to communicate emotions to each\\n",
  "other with a telepathic power.$",
]

[msg.section_0.entries.85]
text = [
  "When Doduo evolves into this odd\\n",
  "breed, one of its heads splits into\\n",
  "two. It runs at nearly 40 mph.$",
]

[msg.section_0.entries.86]
text = [
  "The colder it gets, the better it feels.\\n",
  "It joyfully swims around oceans so cold\\n",
  "that they are filled with floating ice.$",
]

[msg.section_0.entries.87]
text = [
  "Its streamlined body has low resistance,\\n",
  "and it swims around cold oceans at\\n",
  "a speed of eight knots.$",
]

[msg.section_0.entries.88]
text = [
  "Born from sludge, these Pokémon now\\n",
  "gather in polluted places and increase\\n",
  "the bacteria in their bodies.$",
]

[msg.section_0.entries.89]
text = [
  "It's so stinky! Muk's body contains\\n",
  "toxic elements, and any plant will\\n",
  "wilt when it passes by.$",
]

[msg.section_0.entries.90]
text = [
  "It swims backward by opening and\\n",
  "closing its two shells. Its large\\n",
  "tongue is always kept hanging out.$",
]

[msg.section_0.entries.91]
text = [
  "It fights by keeping its shell\\n",
  "tightly shut for protection and\\n",
  "by shooting spikes to repel foes.$",
]

[msg.section_0.entries.92]
text = [
  "Born from gases, anyone would\\n",
  "faint if engulfed by its gaseous\\n",
  "body, which contains poison.$",
]

[msg.section_0.entries.93]
text = [
  "It likes to lurk in the dark and tap\\n",
  "shoulders with a gaseous hand. Its\\n",
  "touch causes endless shuddering.$",
]

[msg.section_0.entries.94]
text = [
  "The leer that floats in darkness\\n",
  "belongs to a Gengar delighting in\\n",
  "casting curses on people.$",
]

[msg.section_0.entries.95]
text = [
  "Opening its large mouth, it ingests\\n",
  "massive amounts of soil and creates\\n",
  "long tunnels.$",
]

[msg.section_0.entries.96]
text = [
  "It can tell what people are\\n",
  "dreaming by sniffing with its big\\n",
  "nose. It loves fun dreams.$",
]

[msg.section_0.entries.97]
text = [
  "Seeing its swinging pendulum can\\n",
  "induce sleep in three seconds,\\n",
  "even in someone who just woke up.$",
]

[msg.section_0.entries.98]
text = [
  "It lives in burrows dug on sandy\\n",
  "beaches. Its pincers fully grow\\n",
  "back if they are broken in battle.$",
]

[msg.section_0.entries.99]
text = [
  "The larger pincer has 10,000-\\n",
  "horsepower strength. However, it\\n",
  "is so heavy, it is difficult to aim.$",
]

[msg.section_0.entries.100]
text = [
  "It looks just like a Poké Ball.\\n",
  "It is dangerous because it may\\n",
  "electrocute or explode on contact.$",
]

[msg.section_0.entries.101]
text = [
  "It is known to drift on winds if it\\n",
  "is bloated to bursting with stored\\n",
  "electricity.$",
]

[msg.section_0.entries.102]
text = [
  "Its six eggs converse using\\n",
  "telepathy. They can quickly gather\\n",
  "if they become separated.$",
]

[msg.section_0.entries.103]
text = [
  "It is called “The Walking Jungle.\\\"\\n",
  "If a head grows too big, it falls\\n",
  "off and becomes an Exeggcute.$",
]

[msg.section_0.entries.104]
text = [
  "When it thinks of its dead mother,\\n",
  "it cries. Its crying makes the\\n",
  "skull it wears rattle hollowly.$",
]

[msg.section_0.entries.105]
text = [
  "From its birth, this savage Pokémon\\n",
  "constantly holds bones. It is\\n",
  "skilled in using them as weapons.$",
]

[msg.section_0.entries.106]
text = [
  "Its legs can stretch double.\\n",
  "First-time foes are startled by\\n",
  "its extensible reach.$",
]

[msg.section_0.entries.107]
text = [
  "The arm-twisting punches it throws\\n",
  "pulverize even concrete. It rests\\n",
  "after three minutes of fighting.$",
]

[msg.section_0.entries.108]
text = [
  "Being licked by its long, saliva-covered\\n",
  "tongue leaves a tingling sensation.\\n",
  "Extending its tongue retracts its tail.$",
]

[msg.section_0.entries.109]
text = [
  "Toxic gas is held within its thin,\\n",
  "balloon-shaped body, so it can\\n",
  "cause massive explosions.$",
]

[msg.section_0.entries.110]
text = [
  "Inhaling toxic fumes from trash\\n",
  "and mixing them inside its body\\n",
  "lets it spread an even fouler stench.$",
]

[msg.section_0.entries.111]
text = [
  "Its powerful tackles can destroy\\n",
  "anything. However, it is too\\n",
  "slow witted to help people work.$",
]

[msg.section_0.entries.112]
text = [
  "Standing on its hind legs freed its\\n",
  "forelegs and made it smarter. It is\\n",
  "very forgetful, however.$",
]

[msg.section_0.entries.113]
text = [
  "A kindly Pokémon that lays highly\\n",
  "nutritious eggs and shares them\\n",
  "with injured Pokémon or people.$",
]

[msg.section_0.entries.114]
text = [
  "Many writhing vines cover it,\\n",
  "so its true identity remains unknown.\\n",
  "The blue vines grow its whole life long.$",
]

[msg.section_0.entries.115]
text = [
  "It raises its offspring in its belly\\n",
  "pouch. It lets the baby out to\\n",
  "play only when it feels safe.$",
]

[msg.section_0.entries.116]
text = [
  "It makes its nest in the shade of\\n",
  "corals. If it senses danger, it\\n",
  "spits murky ink and flees.$",
]

[msg.section_0.entries.117]
text = [
  "Its spines provide protection.\\n",
  "Its fins and bones are prized as\\n",
  "traditional-medicine ingredients.$",
]

[msg.section_0.entries.118]
text = [
  "Though it appears very elegant\\n",
  "when swimming with fins unfurled, it\\n",
  "can jab powerfully with its horn.$",
]

[msg.section_0.entries.119]
text = [
  "In autumn, its body becomes more\\n",
  "fatty in preparing to propose to a\\n",
  "mate. It takes on beautiful colors.$",
]

[msg.section_0.entries.120]
text = [
  "As long as its red core remains,\\n",
  "it can regenerate its body instantly,\\n",
  "even if it's torn apart.$",
]

[msg.section_0.entries.121]
text = [
  "Its core shines in many colors\\n",
  "and sends radio signals into space\\n",
  "to communicate with something.$",
]

[msg.section_0.entries.122]
text = [
  "It shapes an invisible wall in midair\\n",
  "by minutely vibrating its fingertips\\n",
  "to stop molecules in the air.$",
]

[msg.section_0.entries.123]
text = [
  "The sharp scythes on its forearms\\n",
  "become increasingly sharp by\\n",
  "cutting through hard objects.$",
]

[msg.section_0.entries.124]
text = [
  "Its cries sound like human speech.\\n",
  "However, it is impossible to tell\\n",
  "what it is trying to say.$",
]

[msg.section_0.entries.125]
text = [
  "Research is progressing on storing\\n",
  "lightning in Electabuzz so this\\n",
  "energy can be used at any time.$",
]

[msg.section_0.entries.126]
text = [
  "The scorching fire exhaled by Magmar\\n",
  "forms heat waves around its body, making\\n",
  "it hard to see the Pokémon clearly.$",
]

[msg.section_0.entries.127]
text = [
  "It grips prey with its powerful\\n",
  "pincers and will not let go\\n",
  "until the prey is torn in half.$",
]

[msg.section_0.entries.128]
text = [
  "Once it takes aim at its foe, it\\n",
  "makes a headlong charge. It is\\n",
  "famous for its violent nature.$",
]

[msg.section_0.entries.129]
text = [
  "A Magikarp living for many years\\n",
  "can leap a mountain using Splash.\\n",
  "The move remains useless, though.$",
]

[msg.section_0.entries.130]
text = [
  "Once it begins to rampage, a\\n",
  "Gyarados will burn everything\\n",
  "down, even in a harsh storm.$",
]

[msg.section_0.entries.131]
text = [
  "Able to understand human speech\\n",
  "and very intelligent, it loves to swim\\n",
  "in the sea with people on its back.$",
]

[msg.section_0.entries.132]
text = [
  "It can reconstitute its entire cellular\\n",
  "structure to change into what it sees,\\n",
  "but it returns to normal when it relaxes.$",
]

[msg.section_0.entries.133]
text = [
  "Thanks to its unstable genetic makeup,\\n",
  "this special Pokémon conceals many\\n",
  "different possible evolutions.$",
]

[msg.section_0.entries.134]
text = [
  "Its cell composition is similar to water\\n",
  "molecules. As a result, it can't be seen\\n",
  "when it melts away into water.$",
]

[msg.section_0.entries.135]
text = [
  "By storing electricity in its body,\\n",
  "it can shoot its bristlelike fur\\n",
  "like a barrage of missiles.$",
]

[msg.section_0.entries.136]
text = [
  "Inhaled air is carried to its flame sac,\\n",
  "heated, and exhaled as fire\\n",
  "that reaches over 3,000 degrees F.$",
]

[msg.section_0.entries.137]
text = [
  "A man-made Pokémon created using\\n",
  "advanced scientific means. It can\\n",
  "move freely in cyberspace.$",
]

[msg.section_0.entries.138]
text = [
  "A Pokémon that was resurrected\\n",
  "from a fossil using modern science.\\n",
  "It swam in ancient seas.$",
]

[msg.section_0.entries.139]
text = [
  "It is thought that this Pokémon\\n",
  "became extinct because its spiral\\n",
  "shell grew too large.$",
]

[msg.section_0.entries.140]
text = [
  "It is thought to have inhabited\\n",
  "beaches 300 million years ago.\\n",
  "It is protected by a stiff shell.$",
]

[msg.section_0.entries.141]
text = [
  "It is thought that this Pokémon\\n",
  "came onto land because its\\n",
  "prey adapted to life on land.$",
]

[msg.section_0.entries.142]
text = [
  "A Pokémon that roamed the skies\\n",
  "in the dinosaur era. Its teeth are\\n",
  "like saw blades.$",
]

[msg.section_0.entries.143]
text = [
  "When its belly is full, it becomes\\n",
  "too lethargic to even lift a finger,\\n",
  "so it is safe to bounce on its belly.$",
]

[msg.section_0.entries.144]
text = [
  "A legendary bird Pokémon.\\n",
  "It can create blizzards by\\n",
  "freezing moisture in the air.$",
]

[msg.section_0.entries.145]
text = [
  "A legendary Pokémon that is said\\n",
  "to live in thunderclouds. It freely\\n",
  "controls lightning bolts.$",
]

[msg.section_0.entries.146]
text = [
  "One of the legendary bird Pokémon.\\n",
  "It is said that its appearance\\n",
  "indicates the coming of spring.$",
]

[msg.section_0.entries.147]
text = [
  "It is called the “Mirage Pokémon\\\"\\n",
  "because so few have seen it.\\n",
  "Its shed skin has been found.$",
]

[msg.section_0.entries.148]
text = [
  "If its body takes on an aura, the\\n",
  "weather changes instantly. It is\\n",
  "said to live in seas and lakes.$",
]

[msg.section_0.entries.149]
text = [
  "It is said to make its home\\n",
  "somewhere in the sea. It guides\\n",
  "crews of shipwrecks to shore.$",
]

[msg.section_0.entries.150]
text = [
  "A Pokémon created by recombining\\n",
  "Mew's genes. It's said to have the\\n",
  "most savage heart among Pokémon.$",
]

[msg.section_0.entries.151]
text = [
  "Because it can use all kinds of\\n",
  "moves, many scientists believe Mew\\n",
  "to be the ancestor of Pokémon.$",
]

[msg.section_0.entries.152]
text = [
  "It uses the leaf on its head to\\n",
  "determine the temperature and\\n",
  "humidity. It loves to sunbathe.$",
]

[msg.section_0.entries.153]
text = [
  "The buds that ring its neck give\\n",
  "off a spicy aroma that perks\\n",
  "people up.$",
]

[msg.section_0.entries.154]
text = [
  "Its breath has the fantastic\\n",
  "ability to revive dead plants and\\n",
  "flowers.$",
]

[msg.section_0.entries.155]
text = [
  "It has a timid nature. If it is\\n",
  "startled, the flames on its back\\n",
  "burn more vigorously.$",
]

[msg.section_0.entries.156]
text = [
  "It intimidates foes with the heat\\n",
  "of its flames. The fire burns more\\n",
  "strongly when it readies to fight.$",
]

[msg.section_0.entries.157]
text = [
  "It attacks using blasts of fire.\\n",
  "It creates heat shimmers with\\n",
  "intense fire to hide itself.$",
]

[msg.section_0.entries.158]
text = [
  "It has the habit of biting anything\\n",
  "with its developed jaws. Even its\\n",
  "Trainer needs to be careful.$",
]

[msg.section_0.entries.159]
text = [
  "Once it bites down, it won't let go\\n",
  "until it loses its fangs. New fangs\\n",
  "quickly grow into place.$",
]

[msg.section_0.entries.160]
text = [
  "It usually moves slowly, but it\\n",
  "goes at blinding speed when it\\n",
  "attacks and bites prey.$",
]

[msg.section_0.entries.161]
text = [
  "It has a very nervous nature.\\n",
  "It stands up high on its tail so it\\n",
  "can scan wide areas.$",
]

[msg.section_0.entries.162]
text = [
  "The mother puts its offspring to\\n",
  "sleep by curling up around them.\\n",
  "It corners foes with speed.$",
]

[msg.section_0.entries.163]
text = [
  "It marks time precisely. Some\\n",
  "countries consider it to be a wise\\n",
  "friend, versed in the world's ways.$",
]

[msg.section_0.entries.164]
text = [
  "Its eyes are specially developed\\n",
  "to enable it to see clearly even in\\n",
  "murky darkness and minimal light.$",
]

[msg.section_0.entries.165]
text = [
  "It is so timid, it can't move if it\\n",
  "isn't with a swarm of others. It\\n",
  "conveys its feelings with scent.$",
]

[msg.section_0.entries.166]
text = [
  "It uses starlight as energy. When\\n",
  "more stars appear at night, the\\n",
  "patterns on its back grow larger.$",
]

[msg.section_0.entries.167]
text = [
  "It sets a trap by spinning a web\\n",
  "with thin but strong silk. It waits\\n",
  "motionlessly for prey to arrive.$",
]

[msg.section_0.entries.168]
text = [
  "It attaches silk to its prey and\\n",
  "sets it free. Later, it tracks the\\n",
  "silk to the prey and its friends.$",
]

[msg.section_0.entries.169]
text = [
  "Having four wings allows it to fly more\\n",
  "quickly and quietly so it can sneak up\\n",
  "on prey without its noticing.$",
]

[msg.section_0.entries.170]
text = [
  "It discharges positive and\\n",
  "negative electricity from its\\n",
  "antenna tips to shock its foes.$",
]

[msg.section_0.entries.171]
text = [
  "Lanturn's light can shine up from\\n",
  "great depths. It is nicknamed\\n",
  "“The Deep-Sea Star.\\\"$",
]

[msg.section_0.entries.172]
text = [
  "The electric sacs in its cheeks are\\n",
  "small. If even a little electricity\\n",
  "leaks, it becomes shocked.$",
]

[msg.section_0.entries.173]
text = [
  "According to local rumors, Cleffa\\n",
  "are often seen in places where\\n",
  "shooting stars have fallen.$",
]

[msg.section_0.entries.174]
text = [
  "Its body has a faintly sweet scent\\n",
  "and is bouncy and soft. If it bounces\\n",
  "even once, it cannot stop.$",
]

[msg.section_0.entries.175]
text = [
  "It transforms the kindness and joy\\n",
  "of others into happiness, which it\\n",
  "stores in its shell.$",
]

[msg.section_0.entries.176]
text = [
  "To share its happiness, it flies\\n",
  "around the world seeking kind-\\n",
  "hearted people.$",
]

[msg.section_0.entries.177]
text = [
  "It picks food from cactus plants,\\n",
  "deftly avoiding buds and spines.\\n",
  "It seems to skip about to move.$",
]

[msg.section_0.entries.178]
text = [
  "This odd Pokémon can see both\\n",
  "the past and the future. It eyes\\n",
  "the sun's movement all day.$",
]

[msg.section_0.entries.179]
text = [
  "When cold weather increases static\\n",
  "electricity, its wool doubles in size\\n",
  "and the tip of its tail glows slightly.$",
]

[msg.section_0.entries.180]
text = [
  "Not even downy wool will grow on\\n",
  "its rubbery, nonconductive patches\\n",
  "of skin that prevent electrical shock.$",
]

[msg.section_0.entries.181]
text = [
  "The tip of its tail shines so brightly it\\n",
  "can be used to send sea-navigation\\n",
  "beacons to distant foreign shores.$",
]

[msg.section_0.entries.182]
text = [
  "When the heavy rainfall season\\n",
  "ends, it is drawn out by warm\\n",
  "sunlight to dance in the open.$",
]

[msg.section_0.entries.183]
text = [
  "The oil-filled tail functions\\n",
  "as a buoy, so it's fine even\\n",
  "in rivers with strong currents.$",
]

[msg.section_0.entries.184]
text = [
  "Its long ears are superb sensors.\\n",
  "It can distinguish the movements of\\n",
  "things in water and tell what they are.$",
]

[msg.section_0.entries.185]
text = [
  "To avoid being attacked, it does\\n",
  "nothing but mimic a tree. It hates\\n",
  "water and flees from rain.$",
]

[msg.section_0.entries.186]
text = [
  "It gathers groups of others as\\n",
  "their leader. Its cries make\\n",
  "Poliwag obey.$",
]

[msg.section_0.entries.187]
text = [
  "It drifts on winds. It is said that\\n",
  "when Hoppip gather in fields and\\n",
  "mountains, spring is on the way.$",
]

[msg.section_0.entries.188]
text = [
  "It blooms when the weather warms.\\n",
  "It floats in the sky to soak up as\\n",
  "much sunlight as possible.$",
]

[msg.section_0.entries.189]
text = [
  "Blown by seasonal winds, it\\n",
  "circles the globe, scattering\\n",
  "cotton spores as it goes.$",
]

[msg.section_0.entries.190]
text = [
  "It lives high among the treetops.\\n",
  "It can use its tail as freely and\\n",
  "cleverly as its hands.$",
]

[msg.section_0.entries.191]
text = [
  "It suddenly falls out of the sky in\\n",
  "the morning. Knowing it's weak, it\\n",
  "simply feeds until it evolves.$",
]

[msg.section_0.entries.192]
text = [
  "Since it converts sunlight\\n",
  "into energy, it is always looking\\n",
  "in the direction of the sun.$",
]

[msg.section_0.entries.193]
text = [
  "By flapping its wings at high speed,\\n",
  "it can fly freely through the air.\\n",
  "Even sudden stops are no problem.$",
]

[msg.section_0.entries.194]
text = [
  "When walking on land, it covers its\\n",
  "body with a poisonous film that\\n",
  "keeps its skin from dehydrating.$",
]

[msg.section_0.entries.195]
text = [
  "It has an easygoing nature. It\\n",
  "doesn't care if it bumps its head on\\n",
  "boats and boulders while swimming.$",
]

[msg.section_0.entries.196]
text = [
  "Its fur is so sensitive, it can feel\\n",
  "minute shifts in the air and predict the\\n",
  "weather...and its foes' thoughts.$",
]

[msg.section_0.entries.197]
text = [
  "When exposed to the moon's aura,\\n",
  "the rings on its body glow faintly\\n",
  "and it's filled with a mysterious power.$",
]

[msg.section_0.entries.198]
text = [
  "If spotted, it will lure an unwary\\n",
  "person into chasing it then lose\\n",
  "the pursuer on mountain trails.$",
]

[msg.section_0.entries.199]
text = [
  "Being bitten by Shellder gave it\\n",
  "intelligence comparable to that of\\n",
  "award-winning scientists.$",
]

[msg.section_0.entries.200]
text = [
  "A Pokémon that startles people in\\n",
  "the middle of the night. It gathers\\n",
  "fear as its energy.$",
]

[msg.section_0.entries.201]
text = [
  "When alone, nothing happens.\\n",
  "However, if there are two or more,\\n",
  "an odd power is said to emerge.$",
]

[msg.section_0.entries.202]
text = [
  "It desperately tries to keep its\\n",
  "black tail hidden. It is said to be\\n",
  "proof the tail hides a secret.$",
]

[msg.section_0.entries.203]
text = [
  "The head on its tail contains a\\n",
  "small brain. It can instinctively\\n",
  "fight even while facing backward.$",
]

[msg.section_0.entries.204]
text = [
  "It looks just like a pinecone.\\n",
  "Its shell protects it from bird\\n",
  "Pokémon that peck it by mistake.$",
]

[msg.section_0.entries.205]
text = [
  "It is encased in a steel shell. Its\\n",
  "peering eyes are all that can be\\n",
  "seen of its mysterious innards.$",
]

[msg.section_0.entries.206]
text = [
  "It creates mazes in dark locations.\\n",
  "When spotted, it flees into the\\n",
  "ground by digging with its tail.$",
]

[msg.section_0.entries.207]
text = [
  "It clamps on to its chosen prey then\\n",
  "jabs the stinger on its tail into the\\n",
  "prey while it's stunned with surprise.$",
]

[msg.section_0.entries.208]
text = [
  "The iron it ingested with the soil it\\n",
  "swallowed transformed its body and\\n",
  "made it harder than diamonds.$",
]

[msg.section_0.entries.209]
text = [
  "Small Pokémon flee from its scary\\n",
  "face. It is, however, considered\\n",
  "by women to be cute.$",
]

[msg.section_0.entries.210]
text = [
  "It is timid in spite of its looks.\\n",
  "If it becomes enraged, however,\\n",
  "it will strike with its huge fangs.$",
]

[msg.section_0.entries.211]
text = [
  "It shoots the poison spines on its\\n",
  "body in all directions. Its round\\n",
  "form makes it a poor swimmer.$",
]

[msg.section_0.entries.212]
text = [
  "It raises its pincers with eyelike\\n",
  "markings for intimidation. It also\\n",
  "swings them down dangerously.$",
]

[msg.section_0.entries.213]
text = [
  "The berries stored in its\\n",
  "vaselike shell eventually\\n",
  "become a thick, pulpy juice.$",
]

[msg.section_0.entries.214]
text = [
  "No matter how heavy its opponents,\\n",
  "it flings them far away\\n",
  "with its prized horn.$",
]

[msg.section_0.entries.215]
text = [
  "A smart and sneaky Pokémon,\\n",
  "it makes its opponents flinch by suddenly\\n",
  "showing the claws hidden in its paws.$",
]

[msg.section_0.entries.216]
text = [
  "It lets honey soak into its paws\\n",
  "so it can lick them all the time.\\n",
  "Every set of paws tastes unique.$",
]

[msg.section_0.entries.217]
text = [
  "In its territory, it leaves\\n",
  "scratches on trees that bear\\n",
  "delicious berries or fruits.$",
]

[msg.section_0.entries.218]
text = [
  "Its body is made of magma.\\n",
  "If it doesn't keep moving, its\\n",
  "body will cool and harden.$",
]

[msg.section_0.entries.219]
text = [
  "Its body temperature is roughly\\n",
  "18,000 degrees F. Flames spout\\n",
  "from gaps in its hardened shell.$",
]

[msg.section_0.entries.220]
text = [
  "Rooting the tip of its snout\\n",
  "into the ground, it searches for food.\\n",
  "Sometimes it even digs up a hot spring.$",
]

[msg.section_0.entries.221]
text = [
  "With its excellent sense of smell,\\n",
  "it's even able to find mushrooms that\\n",
  "are buried under frozen ground.$",
]

[msg.section_0.entries.222]
text = [
  "They prefer unpolluted southern seas.\\n",
  "Their coral branches lose their color\\n",
  "and deteriorate in dirty water.$",
]

[msg.section_0.entries.223]
text = [
  "The water they shoot from their mouths\\n",
  "can hit moving prey from more than\\n",
  "300 feet away.$",
]

[msg.section_0.entries.224]
text = [
  "It has a tendency to want to be in holes.\\n",
  "It prefers rock crags or pots and\\n",
  "sprays ink from them before attacking.$",
]

[msg.section_0.entries.225]
text = [
  "It carries food all day long.\\n",
  "When someone is lost in the\\n",
  "mountains, it shares that food.$",
]

[msg.section_0.entries.226]
text = [
  "If it builds up enough speed swimming, it\\n",
  "can fly over 300 feet out of the water\\n",
  "from the surface of the ocean.$",
]

[msg.section_0.entries.227]
text = [
  "Its heavy-looking iron body is\\n",
  "actually thin and light, so it can\\n",
  "fly at speeds over 180 mph.$",
]

[msg.section_0.entries.228]
text = [
  "It is smart enough to hunt in\\n",
  "packs. It uses a variety of cries\\n",
  "for communicating with others.$",
]

[msg.section_0.entries.229]
text = [
  "The flames it breathes when angry\\n",
  "contain toxins. If they cause a\\n",
  "burn, it will hurt forever.$",
]

[msg.section_0.entries.230]
text = [
  "It lives in caves on the seafloor\\n",
  "and creates giant whirlpools\\n",
  "every time it moves.$",
]

[msg.section_0.entries.231]
text = [
  "It is strong despite its compact\\n",
  "size. It can easily pick up and\\n",
  "carry an adult human on its back.$",
]

[msg.section_0.entries.232]
text = [
  "It attacks by curling up then\\n",
  "rolling into its foe. It can blow\\n",
  "apart a house in one hit.$",
]

[msg.section_0.entries.233]
text = [
  "It was upgraded to enable the\\n",
  "exploration of other planets.\\n",
  "However, it failed to measure up.$",
]

[msg.section_0.entries.234]
text = [
  "Staring at its antlers creates\\n",
  "an odd sensation as if one were\\n",
  "being drawn into their centers.$",
]

[msg.section_0.entries.235]
text = [
  "It marks its territory by using its\\n",
  "tail like a paintbrush. There are\\n",
  "more than 5,000 different marks.$",
]

[msg.section_0.entries.236]
text = [
  "It is famous for its eagerness to\\n",
  "fight and always nurses injuries\\n",
  "from challenging larger foes.$",
]

[msg.section_0.entries.237]
text = [
  "It fights while spinning like a top.\\n",
  "The centrifugal force boosts its\\n",
  "destructive power by 10.$",
]

[msg.section_0.entries.238]
text = [
  "It tests everything by touching\\n",
  "with its lips, which remember\\n",
  "what it likes and dislikes.$",
]

[msg.section_0.entries.239]
text = [
  "Spinning its arms around\\n",
  "to generate electricity makes the area\\n",
  "between its horns shine light blue.$",
]

[msg.section_0.entries.240]
text = [
  "It's small, but its body temperature\\n",
  "is over 1,100 degrees F. Embers escape\\n",
  "its mouth and nose when it breathes.$",
]

[msg.section_0.entries.241]
text = [
  "It is said that kids who drink\\n",
  "Miltank's milk grow up to become\\n",
  "hearty, healthy adults.$",
]

[msg.section_0.entries.242]
text = [
  "The eggs it lays are filled with\\n",
  "happiness. Eating even one bite\\n",
  "will bring a smile to anyone.$",
]

[msg.section_0.entries.243]
text = [
  "It is said to have fallen with\\n",
  "lightning. It can fire thunderbolts\\n",
  "from the rain clouds on its back.$",
]

[msg.section_0.entries.244]
text = [
  "It is said that when it roars, a\\n",
  "volcano erupts somewhere around\\n",
  "the globe.$",
]

[msg.section_0.entries.245]
text = [
  "It races around the world to\\n",
  "purify fouled water. It dashes\\n",
  "away with the north wind.$",
]

[msg.section_0.entries.246]
text = [
  "Born deep underground, it comes\\n",
  "aboveground and becomes a pupa once it\\n",
  "has finished eating the surrounding soil.$",
]

[msg.section_0.entries.247]
text = [
  "This pupa flies around wildly\\n",
  "by venting with great force the\\n",
  "gas pressurized inside its body.$",
]

[msg.section_0.entries.248]
text = [
  "The quakes caused when it walks\\n",
  "make even great mountains crumble\\n",
  "and change the surrounding terrain.$",
]

[msg.section_0.entries.249]
text = [
  "It sleeps in a deep-sea trench.\\n",
  "If it flaps its wings, it is said to\\n",
  "cause a 40-day storm.$",
]

[msg.section_0.entries.250]
text = [
  "Its feathers are in seven colors.\\n",
  "It is said that anyone seeing it is\\n",
  "promised eternal happiness.$",
]

[msg.section_0.entries.251]
text = [
  "It has the power to travel across\\n",
  "time, but it is said to appear only\\n",
  "in peaceful times.$",
]

[msg.section_0.entries.252]
text = [
  "The soles of its feet are covered\\n",
  "by countless tiny spikes, enabling\\n",
  "it to walk on walls and ceilings.$",
]

[msg.section_0.entries.253]
text = [
  "It lives in dense jungles. While\\n",
  "closing in on its prey, it leaps\\n",
  "from branch to branch.$",
]

[msg.section_0.entries.254]
text = [
  "The leaves that grow on its arms\\n",
  "can slice down thick trees. It is\\n",
  "without peer in jungle combat.$",
]

[msg.section_0.entries.255]
text = [
  "A fire burns inside, so it feels\\n",
  "very warm to hug. It launches\\n",
  "fireballs of 1,800 degrees F.$",
]

[msg.section_0.entries.256]
text = [
  "Its kicking mastery lets it loose\\n",
  "10 kicks per second. It emits\\n",
  "sharp cries to intimidate foes.$",
]

[msg.section_0.entries.257]
text = [
  "Flames spout from its wrists,\\n",
  "enveloping its knuckles. Its\\n",
  "punches scorch its foes.$",
]

[msg.section_0.entries.258]
text = [
  "To alert it, the fin on its head\\n",
  "senses the flow of water. It has\\n",
  "the strength to heft boulders.$",
]

[msg.section_0.entries.259]
text = [
  "Its sturdy legs give it sure\\n",
  "footing, even in mud. It\\n",
  "burrows into dirt to sleep.$",
]

[msg.section_0.entries.260]
text = [
  "It can swim while towing a large\\n",
  "ship. It bashes down foes with a\\n",
  "swing of its thick arms.$",
]

[msg.section_0.entries.261]
text = [
  "A Pokémon with a persistent\\n",
  "nature, it chases its chosen prey\\n",
  "until the prey becomes exhausted.$",
]

[msg.section_0.entries.262]
text = [
  "It chases down prey in a pack.\\n",
  "It will never disobey the commands\\n",
  "of a skilled Trainer.$",
]

[msg.section_0.entries.263]
text = [
  "It walks in zigzag fashion. It is\\n",
  "good at finding items in the\\n",
  "grass and even in the ground.$",
]

[msg.section_0.entries.264]
text = [
  "It charges prey at speeds over\\n",
  "60 mph. However, because it can\\n",
  "only run straight, it often fails.$",
]

[msg.section_0.entries.265]
text = [
  "Often targeted by bird Pokémon,\\n",
  "it desperately resists by releasing\\n",
  "poison from its tail spikes.$",
]

[msg.section_0.entries.266]
text = [
  "It wraps silk around the branches\\n",
  "of a tree. It drinks rainwater on\\n",
  "its silk while awaiting evolution.$",
]

[msg.section_0.entries.267]
text = [
  "Despite its looks, it is aggressive.\\n",
  "It jabs with its long, thin mouth if\\n",
  "disturbed while collecting pollen.$",
]

[msg.section_0.entries.268]
text = [
  "It never forgets any attack it\\n",
  "endured while in the cocoon.\\n",
  "After evolution, it seeks payback.$",
]

[msg.section_0.entries.269]
text = [
  "Toxic powder is scattered with each\\n",
  "flap. At night, it is known to strip\\n",
  "leaves off trees lining boulevards.$",
]

[msg.section_0.entries.270]
text = [
  "It looks like an aquatic plant and\\n",
  "serves as a ferry to Pokémon\\n",
  "that can't swim.$",
]

[msg.section_0.entries.271]
text = [
  "It has a mischievous spirit. If it\\n",
  "spots an angler, it will tug on the\\n",
  "fishing line to interfere.$",
]

[msg.section_0.entries.272]
text = [
  "If it hears festive music, all its\\n",
  "muscles fill with energy. It can't\\n",
  "help breaking out into a dance.$",
]

[msg.section_0.entries.273]
text = [
  "When it dangles from a tree\\n",
  "branch, it looks just like an acorn.\\n",
  "It enjoys scaring other Pokémon.$",
]

[msg.section_0.entries.274]
text = [
  "The sound of its grass flute makes\\n",
  "its listeners uneasy. It lives deep\\n",
  "in forests.$",
]

[msg.section_0.entries.275]
text = [
  "By flapping its leafy fan, it can\\n",
  "whip up gusts of 100 ft/second\\n",
  "that can level houses.$",
]

[msg.section_0.entries.276]
text = [
  "It has a gutsy spirit that makes\\n",
  "it bravely take on tough foes. It\\n",
  "flies in search of warm climates.$",
]

[msg.section_0.entries.277]
text = [
  "It circles the sky in search of\\n",
  "prey. When it spots one, it dives\\n",
  "steeply to catch the prey.$",
]

[msg.section_0.entries.278]
text = [
  "It makes its nest on sheer cliffs.\\n",
  "Riding the sea breeze, it glides\\n",
  "up into the expansive skies.$",
]

[msg.section_0.entries.279]
text = [
  "Skimming the water's surface, it dips\\n",
  "its large bill in the sea, scoops up food\\n",
  "and water, and carries it.$",
]

[msg.section_0.entries.280]
text = [
  "If its horns capture the warm\\n",
  "feelings of people or Pokémon,\\n",
  "its body warms up slightly.$",
]

[msg.section_0.entries.281]
text = [
  "If its Trainer becomes happy, it\\n",
  "overflows with energy, dancing\\n",
  "joyously while spinning about.$",
]

[msg.section_0.entries.282]
text = [
  "To protect its Trainer, it will\\n",
  "expend all its psychic power\\n",
  "to create a small black hole.$",
]

[msg.section_0.entries.283]
text = [
  "It appears as if it is skating on\\n",
  "water. It draws prey with a sweet\\n",
  "scent from the tip of its head.$",
]

[msg.section_0.entries.284]
text = [
  "Its antennae have eye patterns\\n",
  "on them. Its four wings enable it\\n",
  "to hover and fly in any direction.$",
]

[msg.section_0.entries.285]
text = [
  "It spouts poison spores from the\\n",
  "top of its head. These spores\\n",
  "cause pain all over if inhaled.$",
]

[msg.section_0.entries.286]
text = [
  "Its short arms stretch when it\\n",
  "throws punches. Its technique is\\n",
  "equal to that of pro boxers.$",
]

[msg.section_0.entries.287]
text = [
  "If it eats just three leaves in a day,\\n",
  "it is satisfied. Other than that,\\n",
  "it sleeps for 20 hours a day.$",
]

[msg.section_0.entries.288]
text = [
  "Its heartbeat is fast and\\n",
  "its blood so agitated that\\n",
  "it can't sit still for one second.$",
]

[msg.section_0.entries.289]
text = [
  "This Pokémon lives lying on its side.\\n",
  "It only rolls over and moves when\\n",
  "there is no more grass to eat.$",
]

[msg.section_0.entries.290]
text = [
  "It grows underground, sensing\\n",
  "its surroundings using antennae\\n",
  "instead of its virtually blind eyes.$",
]

[msg.section_0.entries.291]
text = [
  "Because it moves so quickly, it\\n",
  "sometimes becomes unseeable. It\\n",
  "congregates around tree sap.$",
]

[msg.section_0.entries.292]
text = [
  "A discarded bug shell that came to\\n",
  "life. Peering into the crack on its\\n",
  "back is said to steal one's spirit.$",
]

[msg.section_0.entries.293]
text = [
  "Usually, its cries are like quiet\\n",
  "murmurs. If frightened, it shrieks\\n",
  "at the same volume as a jet plane.$",
]

[msg.section_0.entries.294]
text = [
  "The shock waves from its cries can\\n",
  "tip over trucks. It stamps its\\n",
  "feet to power up.$",
]

[msg.section_0.entries.295]
text = [
  "Its howls can be heard over six\\n",
  "miles away. It emits all sorts of\\n",
  "noises from the ports on its body.$",
]

[msg.section_0.entries.296]
text = [
  "It toughens its body by slamming\\n",
  "into thick trees. Many snapped\\n",
  "trees can be found near its nest.$",
]

[msg.section_0.entries.297]
text = [
  "It loves to match power with\\n",
  "big-bodied Pokémon. It can knock a\\n",
  "truck flying with its arm thrusts.$",
]

[msg.section_0.entries.298]
text = [
  "It swings its large, nutrient-filled\\n",
  "tail around to fight opponents\\n",
  "bigger than itself.$",
]

[msg.section_0.entries.299]
text = [
  "Its magnetic nose always faces north\\n",
  "and draws iron objects to its body\\n",
  "to protect itself better.$",
]

[msg.section_0.entries.300]
text = [
  "It shows its cute side\\n",
  "by chasing its own tail\\n",
  "until it gets dizzy.$",
]

[msg.section_0.entries.301]
text = [
  "The reason it does not have a nest\\n",
  "is that it simply searches for a clean,\\n",
  "comfortable place then sleeps there.$",
]

[msg.section_0.entries.302]
text = [
  "It hides in the darkness of caves.\\n",
  "Its diet of gems has transformed\\n",
  "its eyes into gemstones.$",
]

[msg.section_0.entries.303]
text = [
  "Attached to its head is a huge\\n",
  "set of jaws formed by horns.\\n",
  "It can chew through iron beams.$",
]

[msg.section_0.entries.304]
text = [
  "In order to build up its steel body,\\n",
  "it eats iron ore. This pesky Pokémon\\n",
  "is known to eat railroad tracks.$",
]

[msg.section_0.entries.305]
text = [
  "Lairon fight over territory,\\n",
  "and when their steel bodies\\n",
  "collide, sparks fly.$",
]

[msg.section_0.entries.306]
text = [
  "It claims an entire mountain as its own.\\n",
  "The more wounds it has, the more it has\\n",
  "battled, so don't take it lightly.$",
]

[msg.section_0.entries.307]
text = [
  "It always trains deep in mountains.\\n",
  "It levitates when it heightens its\\n",
  "spiritual power through meditation.$",
]

[msg.section_0.entries.308]
text = [
  "It gains the ability to see the aura\\n",
  "of its opponents by honing its mind\\n",
  "through starvation.$",
]

[msg.section_0.entries.309]
text = [
  "Using electricity stored in its fur,\\n",
  "it stimulates its muscles to\\n",
  "heighten its reaction speed.$",
]

[msg.section_0.entries.310]
text = [
  "It discharges electricity from its\\n",
  "mane. It creates a thundercloud\\n",
  "overhead to drop lightning bolts.$",
]

[msg.section_0.entries.311]
text = [
  "It cheers on friends with pom-poms\\n",
  "made of sparks. It drains power\\n",
  "from telephone poles.$",
]

[msg.section_0.entries.312]
text = [
  "It cheers on friends. If its\\n",
  "friends are losing, its body lets\\n",
  "off more and more sparks.$",
]

[msg.section_0.entries.313]
text = [
  "It communicates with others by\\n",
  "lighting up its rear at night. It\\n",
  "loves Illumise's sweet aroma.$",
]

[msg.section_0.entries.314]
text = [
  "With its sweet aroma, it guides\\n",
  "Volbeat to draw signs with light in\\n",
  "the night sky.$",
]

[msg.section_0.entries.315]
text = [
  "It uses the different poisons in each\\n",
  "hand separately when it attacks. The\\n",
  "stronger its aroma, the healthier it is.$",
]

[msg.section_0.entries.316]
text = [
  "Almost all its body is its stomach.\\n",
  "Its harsh digestive juices quickly\\n",
  "dissolve anything it swallows.$",
]

[msg.section_0.entries.317]
text = [
  "It swallows anything whole.\\n",
  "It sweats toxic fluids from its\\n",
  "follicles to douse foes.$",
]

[msg.section_0.entries.318]
text = [
  "They swarm any foe that invades\\n",
  "their territory. Their sharp fangs\\n",
  "can tear out boat hulls.$",
]

[msg.section_0.entries.319]
text = [
  "Its fangs rip through sheet iron.\\n",
  "It swims at 75 mph and is known as\\n",
  "“The Bully of the Sea.\\\"$",
]

[msg.section_0.entries.320]
text = [
  "It eats one ton of food every day.\\n",
  "It plays by shooting stored seawater\\n",
  "out its blowholes with great force.$",
]

[msg.section_0.entries.321]
text = [
  "It can sometimes knock out opponents\\n",
  "with the shock created by breaching and\\n",
  "crashing its big body onto the water.$",
]

[msg.section_0.entries.322]
text = [
  "The magma in its body reaches\\n",
  "2,200 degrees F. Its hump gets smaller\\n",
  "when it uses Fire-type moves.$",
]

[msg.section_0.entries.323]
text = [
  "The volcanoes on its back have a\\n",
  "major eruption every 10 years--or\\n",
  "whenever it becomes really angry.$",
]

[msg.section_0.entries.324]
text = [
  "It burns coal inside its shell for\\n",
  "energy. It blows out black soot if\\n",
  "it is endangered.$",
]

[msg.section_0.entries.325]
text = [
  "Using its tail like a spring, it keeps\\n",
  "its heart beating by bouncing\\n",
  "constantly. If it stops, it dies.$",
]

[msg.section_0.entries.326]
text = [
  "It uses black pearls to amplify its\\n",
  "psychic power. It does a strange\\n",
  "dance to control foes' minds.$",
]

[msg.section_0.entries.327]
text = [
  "No two Spinda have the same\\n",
  "pattern of spots. Its tottering\\n",
  "step fouls the aim of foes.$",
]

[msg.section_0.entries.328]
text = [
  "It makes an inescapable conical pit\\n",
  "and lies in wait at the bottom\\n",
  "for prey to come tumbling down.$",
]

[msg.section_0.entries.329]
text = [
  "The ultrasonic waves it generates\\n",
  "by rubbing its two wings together\\n",
  "cause severe headaches.$",
]

[msg.section_0.entries.330]
text = [
  "Known as “The Desert Spirit,\\\"\\n",
  "this Pokémon hides in the sandstorms\\n",
  "it causes by beating its wings.$",
]

[msg.section_0.entries.331]
text = [
  "By storing water in its body, this\\n",
  "desert dweller can survive for 30\\n",
  "days without water.$",
]

[msg.section_0.entries.332]
text = [
  "It becomes active at night,\\n",
  "seeking prey that is exhausted\\n",
  "from the day's desert heat.$",
]

[msg.section_0.entries.333]
text = [
  "For some reason, it likes\\n",
  "to land on people's heads\\n",
  "softly and act like it's a hat.$",
]

[msg.section_0.entries.334]
text = [
  "On sunny days, it flies freely through\\n",
  "the sky and blends into the clouds.\\n",
  "It sings in a beautiful soprano.$",
]

[msg.section_0.entries.335]
text = [
  "It's Seviper's archrival. To threaten\\n",
  "those it encounters, it fans out\\n",
  "the claws on its front paws.$",
]

[msg.section_0.entries.336]
text = [
  "Constant polishing makes the edge\\n",
  "of the blade on its tail extremely sharp.\\n",
  "It's Zangoose's archrival.$",
]

[msg.section_0.entries.337]
text = [
  "The phase of the moon apparently\\n",
  "has some effect on its power.\\n",
  "It's active on the night of a full moon.$",
]

[msg.section_0.entries.338]
text = [
  "Solar energy is the source of its power,\\n",
  "so it is strong during the daytime.\\n",
  "When it spins, its body shines.$",
]

[msg.section_0.entries.339]
text = [
  "Its slimy body is hard to grasp. In\\n",
  "one region, it is said to have been\\n",
  "born from hardened mud.$",
]

[msg.section_0.entries.340]
text = [
  "It is extremely protective of its\\n",
  "territory. If any foe approaches,\\n",
  "it attacks using vicious tremors.$",
]

[msg.section_0.entries.341]
text = [
  "No matter how dirty the water\\n",
  "in the river, it will adapt and thrive.\\n",
  "It has a strong will to survive.$",
]

[msg.section_0.entries.342]
text = [
  "Loving to battle, this Pokémon pinches\\n",
  "all Pokémon that enter its territory\\n",
  "with its pincers and throws them out.$",
]

[msg.section_0.entries.343]
text = [
  "Discovered in ancient ruins, it moves\\n",
  "by spinning around and forms a group\\n",
  "when it finds others.$",
]

[msg.section_0.entries.344]
text = [
  "This mysterious Pokémon started life\\n",
  "as an ancient clay figurine made over\\n",
  "20,000 years ago.$",
]

[msg.section_0.entries.345]
text = [
  "It lived on the seafloor 100\\n",
  "million years ago and was\\n",
  "reanimated scientifically.$",
]

[msg.section_0.entries.346]
text = [
  "It lives in the shallows of warm\\n",
  "seas. When the tide goes out, it\\n",
  "digs up prey from beaches.$",
]

[msg.section_0.entries.347]
text = [
  "A Pokémon ancestor that was\\n",
  "reanimated from a fossil. It lived\\n",
  "in the sea and hunted with claws.$",
]

[msg.section_0.entries.348]
text = [
  "It went ashore after evolving.\\n",
  "Its entire body is clad in a sturdy\\n",
  "armor.$",
]

[msg.section_0.entries.349]
text = [
  "It is a shabby and ugly Pokémon.\\n",
  "However, it is very hardy and\\n",
  "can survive on little water.$",
]

[msg.section_0.entries.350]
text = [
  "Its lovely scales are described as\\n",
  "rainbow colored. They change color\\n",
  "depending on the viewing angle.$",
]

[msg.section_0.entries.351]
text = [
  "Temperature and weather affect its\\n",
  "cellular structure, so this Pokémon\\n",
  "changes form according to the weather.$",
]

[msg.section_0.entries.352]
text = [
  "It can freely change its body's\\n",
  "color. The zigzag pattern on its\\n",
  "belly doesn't change, however.$",
]

[msg.section_0.entries.353]
text = [
  "It feeds on the dark emotions of\\n",
  "sadness and hatred, which make it\\n",
  "grow steadily stronger.$",
]

[msg.section_0.entries.354]
text = [
  "A doll that became a Pokémon over\\n",
  "its grudge of being thrown away. It\\n",
  "seeks the child who disowned it.$",
]

[msg.section_0.entries.355]
text = [
  "It loves the crying of children. It\\n",
  "startles bad kids by passing\\n",
  "through walls and making them cry.$",
]

[msg.section_0.entries.356]
text = [
  "It seeks drifting will-o'-the-wisps\\n",
  "and sucks them into its empty body.\\n",
  "What happens inside is a mystery.$",
]

[msg.section_0.entries.357]
text = [
  "It flies by flapping its broad leaves\\n",
  "and gives the sweet, delicious\\n",
  "fruit around its neck to children.$",
]

[msg.section_0.entries.358]
text = [
  "Its cries echo inside its hollow\\n",
  "body to emerge as beautiful notes\\n",
  "for startling and repelling foes.$",
]

[msg.section_0.entries.359]
text = [
  "It appears from deep in the mountains\\n",
  "to warn people about upcoming disasters\\n",
  "it has sensed with its horn.$",
]

[msg.section_0.entries.360]
text = [
  "It grows strong by pushing up\\n",
  "against others en masse.\\n",
  "It loves eating sweet fruit.$",
]

[msg.section_0.entries.361]
text = [
  "It is said that several Snorunt\\n",
  "gather under giant leaves and\\n",
  "live together in harmony.$",
]

[msg.section_0.entries.362]
text = [
  "It prevents prey from escaping by\\n",
  "instantaneously freezing moisture\\n",
  "in the air.$",
]

[msg.section_0.entries.363]
text = [
  "They can't swim well yet,\\n",
  "and they move much faster by rolling.\\n",
  "When they're happy, they clap fins.$",
]

[msg.section_0.entries.364]
text = [
  "Be it Spheal or Poké Ball, it will spin\\n",
  "any round object on its nose\\n",
  "with the greatest of ease.$",
]

[msg.section_0.entries.365]
text = [
  "Not only does its thick blubber keep it\\n",
  "warm, it also protects it from attacks.\\n",
  "It shatters ice with its prized tusks.$",
]

[msg.section_0.entries.366]
text = [
  "It makes a single pearl during\\n",
  "its lifetime. The pearl is said\\n",
  "to amplify psychic power.$",
]

[msg.section_0.entries.367]
text = [
  "It lives deep in the sea. With a\\n",
  "tail shaped like a small fish, it\\n",
  "attracts unsuspecting prey.$",
]

[msg.section_0.entries.368]
text = [
  "It lives at the bottom of the sea.\\n",
  "In the springtime, its pink body\\n",
  "turns more vivid for some reason.$",
]

[msg.section_0.entries.369]
text = [
  "A rare Pokémon discovered during\\n",
  "a deep-sea exploration. It has not\\n",
  "changed in over 100 million years.$",
]

[msg.section_0.entries.370]
text = [
  "It lives in warm seas. It is said\\n",
  "that a couple finding this Pokémon\\n",
  "will be blessed with eternal love.$",
]

[msg.section_0.entries.371]
text = [
  "Dreaming of one day flying, it\\n",
  "practices by leaping off cliffs\\n",
  "every day.$",
]

[msg.section_0.entries.372]
text = [
  "Within its rugged shell, its cells\\n",
  "have begun changing. The shell\\n",
  "peels off the instant it evolves.$",
]

[msg.section_0.entries.373]
text = [
  "As a result of its long-held dream\\n",
  "of flying, its cellular structure\\n",
  "changed, and wings grew out.$",
]

[msg.section_0.entries.374]
text = [
  "Its cells are all magnetic,\\n",
  "and it communicates with others\\n",
  "by using magnetic pulses.$",
]

[msg.section_0.entries.375]
text = [
  "It is formed by two Beldum joining\\n",
  "together. Its two brains are linked,\\n",
  "amplifying its psychic power.$",
]

[msg.section_0.entries.376]
text = [
  "With four linked brains, it's more\\n",
  "intelligent than a supercomputer, and\\n",
  "it uses calculations to analyze foes.$",
]

[msg.section_0.entries.377]
text = [
  "Its entire body is made of rock.\\n",
  "If any part chips off in battle, it\\n",
  "attaches rocks to repair itself.$",
]

[msg.section_0.entries.378]
text = [
  "Its body is made of ice from the\\n",
  "ice age. It controls frigid air of\\n",
  "-328 degrees Fahrenheit.$",
]

[msg.section_0.entries.379]
text = [
  "Tempered by pressure underground\\n",
  "over tens of thousands of years,\\n",
  "its body cannot be scratched.$",
]

[msg.section_0.entries.380]
text = [
  "Its body is covered with a down\\n",
  "that can refract light in such a\\n",
  "way that it becomes invisible.$",
]

[msg.section_0.entries.381]
text = [
  "A highly intelligent Pokémon.\\n",
  "By folding back its wings in flight,\\n",
  "it can overtake jet planes.$",
]

[msg.section_0.entries.382]
text = [
  "It is said to have widened the\\n",
  "seas by causing downpours. It had\\n",
  "been asleep in a marine trench.$",
]

[msg.section_0.entries.383]
text = [
  "It had been asleep in underground\\n",
  "magma ever since it fiercely\\n",
  "fought Kyogre long ago.$",
]

[msg.section_0.entries.384]
text = [
  "It lives in the ozone layer far\\n",
  "above the clouds and cannot be\\n",
  "seen from the ground.$",
]

[msg.section_0.entries.385]
text = [
  "It is said to have the ability to\\n",
  "grant any wish for just one week\\n",
  "every thousand years.$",
]

[msg.section_0.entries.386]
text = [
  "An alien virus that fell to earth\\n",
  "on a meteor underwent a DNA\\n",
  "mutation to become this Pokémon.$",
]

[msg.section_0.entries.387]
text = [
  "The shell on its back is made of\\n",
  "soil. On a very healthy Turtwig,\\n",
  "the shell should feel moist.$",
]

[msg.section_0.entries.388]
text = [
  "It knows where pure water wells\\n",
  "up. It carries fellow Pokémon there\\n",
  "on its back.$",
]

[msg.section_0.entries.389]
text = [
  "Some Pokémon are born on a\\n",
  "Torterra's back and spend their\\n",
  "entire life there.$",
]

[msg.section_0.entries.390]
text = [
  "It is very agile. Before going to\\n",
  "sleep, it extinguishes the flame\\n",
  "on its tail to prevent fires.$",
]

[msg.section_0.entries.391]
text = [
  "It skillfully controls the intensity\\n",
  "of the fire on its tail to keep its\\n",
  "foes at an ideal distance.$",
]

[msg.section_0.entries.392]
text = [
  "It uses unique fighting moves with\\n",
  "fire on its hands and feet. It will\\n",
  "take on any opponent.$",
]

[msg.section_0.entries.393]
text = [
  "A poor walker, it often falls down.\\n",
  "However, its strong pride makes it\\n",
  "puff up its chest without a care.$",
]

[msg.section_0.entries.394]
text = [
  "Because every Prinplup considers\\n",
  "itself to be the most important,\\n",
  "they can never form a group.$",
]

[msg.section_0.entries.395]
text = [
  "If anyone were to hurt its pride,\\n",
  "it would slash them with wings that\\n",
  "can cleave through an ice floe.$",
]

[msg.section_0.entries.396]
text = [
  "Because they are weak individually,\\n",
  "they form groups. However, they\\n",
  "bicker if the group grows too big.$",
]

[msg.section_0.entries.397]
text = [
  "Recognizing their own weakness,\\n",
  "they always live in a group. When\\n",
  "alone, a Staravia cries noisily.$",
]

[msg.section_0.entries.398]
text = [
  "It never stops attacking even\\n",
  "if it is injured. It fusses over the\\n",
  "shape of its comb.$",
]

[msg.section_0.entries.399]
text = [
  "A comparison revealed that\\n",
  "Bidoof's front teeth grow at\\n",
  "the same rate as Rattata's.$",
]

[msg.section_0.entries.400]
text = [
  "A river dammed by Bibarel will\\n",
  "never overflow its banks, which\\n",
  "is appreciated by people nearby.$",
]

[msg.section_0.entries.401]
text = [
  "Its legs are short. Whenever it\\n",
  "stumbles, its stiff antennae clack\\n",
  "with a xylophone-like sound.$",
]

[msg.section_0.entries.402]
text = [
  "There is a village that hosts a\\n",
  "contest based on the amazingly\\n",
  "variable cries of this Pokémon.$",
]

[msg.section_0.entries.403]
text = [
  "The extension and contraction of\\n",
  "its muscles generates electricity.\\n",
  "It glows when in trouble.$",
]

[msg.section_0.entries.404]
text = [
  "Strong electricity courses through\\n",
  "the tips of its sharp claws. A light\\n",
  "scratch causes fainting in foes.$",
]

[msg.section_0.entries.405]
text = [
  "It can see clearly through walls\\n",
  "to track down its prey and seek\\n",
  "its lost young.$",
]

[msg.section_0.entries.406]
text = [
  "Sensitive to changing temperatures,\\n",
  "the bud blooms when it's warm,\\n",
  "releasing toxic pollen.$",
]

[msg.section_0.entries.407]
text = [
  "Luring prey with a sweet scent, it\\n",
  "uses poison whips on its arms\\n",
  "to poison, bind, and finish off the prey.$",
]

[msg.section_0.entries.408]
text = [
  "A lifelong jungle dweller from 100\\n",
  "million years ago, it would snap\\n",
  "obstructing trees with head butts.$",
]

[msg.section_0.entries.409]
text = [
  "If two were to smash their heads\\n",
  "together, their foot-thick skulls\\n",
  "would keep them from fainting.$",
]

[msg.section_0.entries.410]
text = [
  "It is outstandingly armored. As a\\n",
  "result, it can eat grass and\\n",
  "berries without having to fight.$",
]

[msg.section_0.entries.411]
text = [
  "When they lined up side by side, no\\n",
  "foe could break through. They\\n",
  "shielded their young in that way.$",
]

[msg.section_0.entries.412]
text = [
  "Even if it is born where there are\\n",
  "no cocooning materials, it somehow\\n",
  "always ends up with a cloak.$",
]

[msg.section_0.entries.413]
text = [
  "When evolving, its body takes in\\n",
  "surrounding materials. As a result,\\n",
  "there are many body variations.$",
]

[msg.section_0.entries.414]
text = [
  "While it loves floral honey, it won't\\n",
  "gather any itself. Instead, it\\n",
  "plots to steal some from Combee.$",
]

[msg.section_0.entries.415]
text = [
  "This Pokémon is a set of three.\\n",
  "When they sleep, they gather up\\n",
  "and form a giant hive of 100 Combee.$",
]

[msg.section_0.entries.416]
text = [
  "It houses its colony in cells in its body\\n",
  "and releases various pheromones to\\n",
  "make those grubs do its bidding.$",
]

[msg.section_0.entries.417]
text = [
  "A pair may be seen rubbing their\\n",
  "cheek pouches together in an\\n",
  "effort to share stored electricity.$",
]

[msg.section_0.entries.418]
text = [
  "It inflates the flotation sac around\\n",
  "its neck and pokes its head out of\\n",
  "the water to see what is going on.$",
]

[msg.section_0.entries.419]
text = [
  "It is a common sight around\\n",
  "fishing ports. It is known to\\n",
  "rescue people and carry off prey.$",
]

[msg.section_0.entries.420]
text = [
  "The small ball is not only filled with\\n",
  "nutrients, it is also tasty. Starly\\n",
  "try to peck it off.$",
]

[msg.section_0.entries.421]
text = [
  "If it senses strong sunlight, it\\n",
  "opens its folded petals to absorb\\n",
  "the sun's rays with its whole body.$",
]

[msg.section_0.entries.422]
text = [
  "Beware of pushing strongly on\\n",
  "its squishy body, as it makes a\\n",
  "mysterious purple fluid ooze out.$",
]

[msg.section_0.entries.423]
text = [
  "Long ago, its entire back was\\n",
  "shielded with a sturdy shell. There\\n",
  "are traces of it left in its cells.$",
]

[msg.section_0.entries.424]
text = [
  "Split into two, the tails are so\\n",
  "adept at handling and doing things,\\n",
  "Ambipom rarely uses its hands.$",
]

[msg.section_0.entries.425]
text = [
  "These Pokémon are called the\\n",
  "“Signpost for Wandering Spirits.\\\"\\n",
  "Children holding them sometimes vanish.$",
]

[msg.section_0.entries.426]
text = [
  "They carry people and Pokémon,\\n",
  "but the wind can catch them, so\\n",
  "there can't be a fixed destination.$",
]

[msg.section_0.entries.427]
text = [
  "By extending its rolled-up ears\\n",
  "and striking the ground, it can\\n",
  "bound so high it surprises itself.$",
]

[msg.section_0.entries.428]
text = [
  "Extremely cautious,\\n",
  "it quickly bounds off\\n",
  "when it senses danger.$",
]

[msg.section_0.entries.429]
text = [
  "Its cry sounds like an incantation.\\n",
  "It is said the cry may rarely be\\n",
  "imbued with happiness-giving power.$",
]

[msg.section_0.entries.430]
text = [
  "If one utters a deep cry, many\\n",
  "Murkrow gather quickly. For this,\\n",
  "it is called “Summoner of Night.\\\"$",
]

[msg.section_0.entries.431]
text = [
  "It hides its spiteful tendency of\\n",
  "hooking its claws into the nose of\\n",
  "its Trainer if it isn't fed.$",
]

[msg.section_0.entries.432]
text = [
  "It binds its body with its tails to\\n",
  "make itself look bigger. If it locks\\n",
  "eyes, it will glare ceaselessly.$",
]

[msg.section_0.entries.433]
text = [
  "There is an orb inside its mouth.\\n",
  "When it hops, the orb bounces all\\n",
  "over and makes a ringing sound.$",
]

[msg.section_0.entries.434]
text = [
  "It sprays a foul fluid from its\\n",
  "rear. Its stench spreads over a\\n",
  "mile radius, driving Pokémon away.$",
]

[msg.section_0.entries.435]
text = [
  "It attacks by spraying a horribly\\n",
  "smelly fluid from the tip of its tail.\\n",
  "Attacks from above confound it.$",
]

[msg.section_0.entries.436]
text = [
  "They are found in ancient tombs.\\n",
  "The patterns on their backs are\\n",
  "said to be imbued with mysterious power.$",
]

[msg.section_0.entries.437]
text = [
  "In ages past, this Pokémon\\n",
  "was revered as a bringer of rain.\\n",
  "It was found buried in the ground.$",
]

[msg.section_0.entries.438]
text = [
  "It prefers an arid atmosphere. It\\n",
  "leaks water that looks like tears\\n",
  "when adjusting its moisture level.$",
]

[msg.section_0.entries.439]
text = [
  "It mimics the expressions and\\n",
  "motions of those it sees to\\n",
  "understand the feelings of others.$",
]

[msg.section_0.entries.440]
text = [
  "It likes to carry around a small\\n",
  "rock. It may wander around others'\\n",
  "feet and cause them to stumble.$",
]

[msg.section_0.entries.441]
text = [
  "Its tongue is just like a human's.\\n",
  "As a result, it can cleverly mimic\\n",
  "human speech.$",
]

[msg.section_0.entries.442]
text = [
  "Its constant mischief and misdeeds\\n",
  "resulted in it being bound to an Odd\\n",
  "Keystone by a mysterious spell.$",
]

[msg.section_0.entries.443]
text = [
  "It attacks using its huge mouth.\\n",
  "While its attacks are powerful, it\\n",
  "hurts itself out of clumsiness, too.$",
]

[msg.section_0.entries.444]
text = [
  "It loves sparkly things. It seeks\\n",
  "treasures in caves and hoards the\\n",
  "loot in its nest.$",
]

[msg.section_0.entries.445]
text = [
  "It is said that when one runs at\\n",
  "high speed, its wings create blades\\n",
  "of wind that can fell nearby trees.$",
]

[msg.section_0.entries.446]
text = [
  "In its desperation to gulp down\\n",
  "food, it forgets about the food it\\n",
  "has hidden under its fur.$",
]

[msg.section_0.entries.447]
text = [
  "It uses the shapes of auras,\\n",
  "which change according to emotion,\\n",
  "to communicate with others.$",
]

[msg.section_0.entries.448]
text = [
  "By reading the auras of all things,\\n",
  "it can tell how others are feeling\\n",
  "from over half a mile away.$",
]

[msg.section_0.entries.449]
text = [
  "It shuts its nostrils tight then\\n",
  "travels through sand as if walking.\\n",
  "They form colonies of around 10.$",
]

[msg.section_0.entries.450]
text = [
  "It is surprisingly quick to anger.\\n",
  "It holds its mouth agape as a\\n",
  "display of its strength.$",
]

[msg.section_0.entries.451]
text = [
  "It lives in arid regions and\\n",
  "can go without food for a year\\n",
  "while waiting for prey.$",
]

[msg.section_0.entries.452]
text = [
  "It takes pride in its strength.\\n",
  "Even though it can tear foes apart,\\n",
  "it finishes them off with powerful poison.$",
]

[msg.section_0.entries.453]
text = [
  "Inflating its poison sacs, it fills the\\n",
  "area with an odd sound and hits\\n",
  "flinching opponents with a poison jab.$",
]

[msg.section_0.entries.454]
text = [
  "The croaking that Toxicroak produces\\n",
  "before a battle is for churning the\\n",
  "poison it has stored in its poison sac.$",
]

[msg.section_0.entries.455]
text = [
  "Using its tentacles to lash itself to\\n",
  "trees, it lies in wait for prey, luring it\\n",
  "close with sweet-smelling drool.$",
]

[msg.section_0.entries.456]
text = [
  "The line running down its side can\\n",
  "store sunlight. It shines vividly at\\n",
  "night.$",
]

[msg.section_0.entries.457]
text = [
  "It crawls along the seafloor using\\n",
  "its long front fins like legs. It\\n",
  "competes for food with Lanturn.$",
]

[msg.section_0.entries.458]
text = [
  "The pattern on its back\\n",
  "varies by region. It often\\n",
  "swims in a school of Remoraid.$",
]

[msg.section_0.entries.459]
text = [
  "Seemingly curious about people,\\n",
  "they gather around footsteps they\\n",
  "find on snowy mountains.$",
]

[msg.section_0.entries.460]
text = [
  "They appear when the snow flowers\\n",
  "bloom. When the petals fall, they\\n",
  "retreat to places unknown again.$",
]

[msg.section_0.entries.461]
text = [
  "They communicate by clawing\\n",
  "signs in boulders and work\\n",
  "together to surround enemies.$",
]

[msg.section_0.entries.462]
text = [
  "Sometimes the magnetism emitted by\\n",
  "Magnezone is too strong, making them\\n",
  "attract each other so they cannot move.$",
]

[msg.section_0.entries.463]
text = [
  "Their saliva contains lots of components\\n",
  "that can dissolve anything. The numbness\\n",
  "caused by their lick does not dissipate.$",
]

[msg.section_0.entries.464]
text = [
  "It can launch a rock held in its\\n",
  "hand like a missile by tightening\\n",
  "then expanding muscles instantly.$",
]

[msg.section_0.entries.465]
text = [
  "Even if one of its arms is eaten,\\n",
  "it's fine. The Pokémon regenerates\\n",
  "quickly and will go right back to normal.$",
]

[msg.section_0.entries.466]
text = [
  "The instant it presses the tips of its\\n",
  "tails onto an opponent, it sends over\\n",
  "20,000 volts of electricity into the foe.$",
]

[msg.section_0.entries.467]
text = [
  "When shooting 3,600 degree F fireballs\\n",
  "from its arms, its body takes on a\\n",
  "whitish hue from the intense heat.$",
]

[msg.section_0.entries.468]
text = [
  "It shares many blessings with\\n",
  "people who respect one another's\\n",
  "rights and avoid needless strife.$",
]

[msg.section_0.entries.469]
text = [
  "It prefers to battle by biting\\n",
  "apart foes' heads instantly\\n",
  "while flying by at high speed.$",
]

[msg.section_0.entries.470]
text = [
  "With cells similar to those of plants,\\n",
  "it performs photosynthesis inside its\\n",
  "body and creates pure air.$",
]

[msg.section_0.entries.471]
text = [
  "It lowers its body heat to freeze its\\n",
  "fur. The hairs then become like needles\\n",
  "it can fire.$",
]

[msg.section_0.entries.472]
text = [
  "It dances silently through the sky.\\n",
  "When it approaches prey, it can\\n",
  "land a critical hit in an instant.$",
]

[msg.section_0.entries.473]
text = [
  "When the temperature rose at\\n",
  "the end of the ice age, most\\n",
  "Mamoswine disappeared.$",
]

[msg.section_0.entries.474]
text = [
  "Its programming was modified to\\n",
  "enable work in alien dimensions.\\n",
  "It did not work as planned.$",
]

[msg.section_0.entries.475]
text = [
  "When trying to protect someone,\\n",
  "it extends its elbows as if they\\n",
  "were swords and fights savagely.$",
]

[msg.section_0.entries.476]
text = [
  "It freely controls three units\\n",
  "called Mini-Noses using\\n",
  "magnetic force.$",
]

[msg.section_0.entries.477]
text = [
  "It is said to take lost spirits\\n",
  "into its pliant body and guide\\n",
  "them home.$",
]

[msg.section_0.entries.478]
text = [
  "It freezes prey by blowing its -58\\n",
  "degrees F breath. It is said to\\n",
  "then secretly display its prey.$",
]

[msg.section_0.entries.479]
text = [
  "Its electric-like body can enter\\n",
  "some kinds of machines and take\\n",
  "control in order to make mischief.$",
]

[msg.section_0.entries.480]
text = [
  "When Uxie flew, people gained the\\n",
  "ability to solve problems.\\n",
  "It was the birth of knowledge.$",
]

[msg.section_0.entries.481]
text = [
  "When Mesprit flew, people learned\\n",
  "the joy and sadness of living.\\n",
  "It was the birth of emotions.$",
]

[msg.section_0.entries.482]
text = [
  "When Azelf flew, people gained the\\n",
  "determination to do things.\\n",
  "It was the birth of willpower.$",
]

[msg.section_0.entries.483]
text = [
  "A legendary Pokémon of Sinnoh.\\n",
  "It is said that time flows when\\n",
  "Dialga's heart beats.$",
]

[msg.section_0.entries.484]
text = [
  "A legendary Pokémon of Sinnoh.\\n",
  "It is said that space becomes more\\n",
  "stable with Palkia's every breath.$",
]

[msg.section_0.entries.485]
text = [
  "Its body is made of rugged steel.\\n",
  "However, it is partially melted in\\n",
  "spots because of its own heat.$",
]

[msg.section_0.entries.486]
text = [
  "It is said to have made Pokémon\\n",
  "that look like itself from a special\\n",
  "ice mountain, rocks, and magma.$",
]

[msg.section_0.entries.487]
text = [
  "It was banished for its violence.\\n",
  "It silently gazed upon the old\\n",
  "world from the Distortion World.$",
]

[msg.section_0.entries.488]
text = [
  "On nights around the quarter moon,\\n",
  "the aurora from its tail extends\\n",
  "and undulates beautifully.$",
]

[msg.section_0.entries.489]
text = [
  "It drifts in warm seas. It always\\n",
  "returns to where it was born, no\\n",
  "matter how far it may have drifted.$",
]

[msg.section_0.entries.490]
text = [
  "It is born with a wondrous power\\n",
  "that lets it bond with any kind of\\n",
  "Pokémon.$",
]

[msg.section_0.entries.491]
text = [
  "To protect itself, it afflicts those\\n",
  "around it with nightmares. However,\\n",
  "it means no harm.$",
]

[msg.section_0.entries.492]
text = [
  "The flowers all over its body burst\\n",
  "into bloom if it is lovingly hugged\\n",
  "and senses gratitude.$",
]

[msg.section_0.entries.493]
text = [
  "It is said to have emerged from an\\n",
  "egg in a place where there was\\n",
  "nothing then shaped the world.$",
]

[msg.section_0.entries.494]
text = [
  "When it shares the infinite energy\\n",
  "it creates, that being's entire\\n",
  "body will be overflowing with power.$",
]

[msg.section_0.entries.495]
text = [
  "Being exposed to sunlight makes\\n",
  "its movements swifter. It uses\\n",
  "vines more adeptly than its hands.$",
]

[msg.section_0.entries.496]
text = [
  "When it gets dirty, its leaves\\n",
  "can't be used in photosynthesis,\\n",
  "so it always keeps itself clean.$",
]

[msg.section_0.entries.497]
text = [
  "It only gives its all against strong\\n",
  "opponents who are not fazed by the\\n",
  "glare from Serperior's noble eyes.$",
]

[msg.section_0.entries.498]
text = [
  "It loves to eat roasted berries,\\n",
  "but sometimes it gets too excited\\n",
  "and burns them to a crisp.$",
]

[msg.section_0.entries.499]
text = [
  "The more it eats, the more fuel it has\\n",
  "to make the fire in its stomach stronger.\\n",
  "This fills it with even more power.$",
]

[msg.section_0.entries.500]
text = [
  "A flaring beard of fire is proof\\n",
  "that it is fired up. It is adept at\\n",
  "using many different moves.$",
]

[msg.section_0.entries.501]
text = [
  "The scalchop on its stomach isn't\\n",
  "just used for battle--it can be used\\n",
  "to break open hard berries as well.$",
]

[msg.section_0.entries.502]
text = [
  "As a result of strict training,\\n",
  "each Dewott learns different\\n",
  "forms for using the scalchops.$",
]

[msg.section_0.entries.503]
text = [
  "In the time it takes a foe to blink,\\n",
  "it can draw and sheathe the seamitars\\n",
  "attached to its front legs.$",
]

[msg.section_0.entries.504]
text = [
  "Extremely cautious, one of them\\n",
  "will always be on the lookout, but it\\n",
  "won't notice a foe coming from behind.$",
]

[msg.section_0.entries.505]
text = [
  "Using luminescent matter, it\\n",
  "makes its eyes and body glow\\n",
  "and stuns attacking opponents.$",
]

[msg.section_0.entries.506]
text = [
  "Though it is a very brave Pokémon,\\n",
  "it's also smart enough to check its\\n",
  "foe's strength and avoid battle.$",
]

[msg.section_0.entries.507]
text = [
  "This very loyal Pokémon\\n",
  "helps Trainers, and it also\\n",
  "takes care of other Pokémon.$",
]

[msg.section_0.entries.508]
text = [
  "Being wrapped in its long fur is so\\n",
  "comfortable that a person would be fine\\n",
  "even overnight on a wintry mountain.$",
]

[msg.section_0.entries.509]
text = [
  "Their cute act is a ruse. They trick\\n",
  "people and steal their valuables\\n",
  "just to see the looks on their faces.$",
]

[msg.section_0.entries.510]
text = [
  "Their beautiful form comes from\\n",
  "the muscles they have developed.\\n",
  "They run silently in the night.$",
]

[msg.section_0.entries.511]
text = [
  "It's good at finding berries and gathers\\n",
  "them from all over. It's kind enough\\n",
  "to share them with friends.$",
]

[msg.section_0.entries.512]
text = [
  "It strikes its enemies with\\n",
  "a thorn-covered tail.\\n",
  "The leaf on its head is bitter.$",
]

[msg.section_0.entries.513]
text = [
  "Very intelligent, it roasts\\n",
  "berries before eating them.\\n",
  "It likes to help people.$",
]

[msg.section_0.entries.514]
text = [
  "When it gets excited, embers rise\\n",
  "from its head and tail and it gets hot.\\n",
  "For some reason, it loves sweets.$",
]

[msg.section_0.entries.515]
text = [
  "The water stored inside the tuft\\n",
  "on its head is full of nutrients.\\n",
  "It waters plants with it using its tail.$",
]

[msg.section_0.entries.516]
text = [
  "It prefers places with clean water.\\n",
  "When its tuft runs low, it replenishes\\n",
  "it by siphoning up water with its tail.$",
]

[msg.section_0.entries.517]
text = [
  "This Pokémon appears before people\\n",
  "and Pokémon who are having nightmares\\n",
  "and eats those dreams.$",
]

[msg.section_0.entries.518]
text = [
  "The dream mist coming from its forehead\\n",
  "changes into many different colors\\n",
  "depending on the dream that was eaten.$",
]

[msg.section_0.entries.519]
text = [
  "This very forgetful Pokémon will\\n",
  "wait for a new order from its Trainer\\n",
  "even though it already has one.$",
]

[msg.section_0.entries.520]
text = [
  "No matter where in the world it goes,\\n",
  "it knows where its nest is, so it\\n",
  "never gets separated from its Trainer.$",
]

[msg.section_0.entries.521]
text = [
  "Males swing the plumage on\\n",
  "their heads to threaten others,\\n",
  "but females are better at flying.$",
]

[msg.section_0.entries.522]
text = [
  "Its mane shines when it discharges\\n",
  "electricity. They use the frequency and\\n",
  "rhythm of these flashes to communicate.$",
]

[msg.section_0.entries.523]
text = [
  "When this ill-tempered Pokémon\\n",
  "runs wild, it shoots lightning\\n",
  "from its mane in all directions.$",
]

[msg.section_0.entries.524]
text = [
  "The hexagonal-shaped hole is its ear.\\n",
  "It has a tendency to walk in the\\n",
  "direction the sound is coming from.$",
]

[msg.section_0.entries.525]
text = [
  "When it is healthy, its core sticks out.\\n",
  "Always facing the same way, it swiftly\\n",
  "moves front to back and left to right.$",
]

[msg.section_0.entries.526]
text = [
  "The solar rays it absorbs are\\n",
  "processed in its energy core\\n",
  "and fired as a ball of light.$",
]

[msg.section_0.entries.527]
text = [
  "The heart-shaped mark left on a body\\n",
  "after a Woobat has been attached to it\\n",
  "is said to bring good fortune.$",
]

[msg.section_0.entries.528]
text = [
  "It shakes its tail vigorously when it\\n",
  "emits ultrasonic waves strong enough\\n",
  "to reduce concrete to rubble.$",
]

[msg.section_0.entries.529]
text = [
  "By spinning its body, it can dig\\n",
  "straight through the ground\\n",
  "at a speed of 30 mph.$",
]

[msg.section_0.entries.530]
text = [
  "Forming a drill with its steel claws\\n",
  "and head, it can bore through a steel\\n",
  "plate, no matter how thick it is.$",
]

[msg.section_0.entries.531]
text = [
  "Using the feelers on its ears,\\n",
  "it can tell how someone is feeling\\n",
  "or when an egg might hatch.$",
]

[msg.section_0.entries.532]
text = [
  "Always carrying squared logs,\\n",
  "they help out with construction.\\n",
  "As they grow, they carry bigger logs.$",
]

[msg.section_0.entries.533]
text = [
  "With strengthened bodies,\\n",
  "they skillfully wield steel beams\\n",
  "to take down buildings.$",
]

[msg.section_0.entries.534]
text = [
  "Rather than rely on force,\\n",
  "they master moves that utilize the\\n",
  "centrifugal force of spinning concrete.$",
]

[msg.section_0.entries.535]
text = [
  "By vibrating its cheeks, it emits\\n",
  "sound waves imperceptible to humans\\n",
  "and warns others of danger.$",
]

[msg.section_0.entries.536]
text = [
  "It lives in the water and on land.\\n",
  "It uses its long, sticky tongue\\n",
  "to immobilize its opponents.$",
]

[msg.section_0.entries.537]
text = [
  "By putting power into its bumps,\\n",
  "it creates vibrations and increases\\n",
  "the power of its punches.$",
]

[msg.section_0.entries.538]
text = [
  "When it encounters a foe bigger than\\n",
  "itself, it wants to throw it.\\n",
  "It changes belts as it gets stronger.$",
]

[msg.section_0.entries.539]
text = [
  "Desiring the strongest karate chop,\\n",
  "they seclude themselves in\\n",
  "mountains and train without sleeping.$",
]

[msg.section_0.entries.540]
text = [
  "Since this Pokémon makes its own\\n",
  "clothes out of leaves, it is a popular\\n",
  "mascot for fashion designers.$",
]

[msg.section_0.entries.541]
text = [
  "Preferring dark, damp places,\\n",
  "it spends the entire day eating\\n",
  "fallen leaves that lie around it.$",
]

[msg.section_0.entries.542]
text = [
  "Upon finding a small Pokémon, it weaves\\n",
  "clothing for it from leaves by using the\\n",
  "sticky silk secreted from its mouth.$",
]

[msg.section_0.entries.543]
text = [
  "Using the feelers on its head and tail,\\n",
  "it picks up vibrations in the air to\\n",
  "determine its prey's location and state.$",
]

[msg.section_0.entries.544]
text = [
  "Storing energy for evolution, it sits.\\n",
  "But, when predators approach, it\\n",
  "moves to stab them with poison spikes.$",
]

[msg.section_0.entries.545]
text = [
  "It clasps its prey with the claws\\n",
  "on its neck until it stops moving.\\n",
  "Then it finishes it off with deadly poison.$",
]

[msg.section_0.entries.546]
text = [
  "Perhaps because they feel more at ease\\n",
  "in a group, they stick to others they\\n",
  "find. They end up looking like a cloud.$",
]

[msg.section_0.entries.547]
text = [
  "They appear along with whirlwinds. They\\n",
  "pull pranks, such as moving furniture\\n",
  "and leaving balls of cotton in homes.$",
]

[msg.section_0.entries.548]
text = [
  "The leaves on its head grow right back\\n",
  "even if they fall out. These bitter\\n",
  "leaves refresh those who eat them.$",
]

[msg.section_0.entries.549]
text = [
  "The fragrance of the garland on its head\\n",
  "has a relaxing effect, but taking\\n",
  "care of it is very difficult.$",
]

[msg.section_0.entries.550]
text = [
  "Red- and blue-striped Basculin are\\n",
  "very violent and always fighting.\\n",
  "They are also remarkably tasty.$",
]

[msg.section_0.entries.551]
text = [
  "They live hidden under hot desert\\n",
  "sands in order to keep their body\\n",
  "temperature from dropping.$",
]

[msg.section_0.entries.552]
text = [
  "Protected by thin membranes, their eyes\\n",
  "can see even in the dead of night.\\n",
  "They live in groups of a few individuals.$",
]

[msg.section_0.entries.553]
text = [
  "Very violent Pokémon, they try\\n",
  "to clamp down on anything that\\n",
  "moves in front of their eyes.$",
]

[msg.section_0.entries.554]
text = [
  "When it sleeps, it pulls its limbs\\n",
  "into its body and its internal fire\\n",
  "goes down to 1,100° F.$",
]

[msg.section_0.entries.555]
text = [
  "When one is injured in a fierce battle,\\n",
  "it hardens into a stone-like form.\\n",
  "Then it meditates and sharpens its mind.$",
]

[msg.section_0.entries.556]
text = [
  "When it moves rhythmically,\\n",
  "it makes a sound similar to maracas,\\n",
  "making the surprised Pokémon flee.$",
]

[msg.section_0.entries.557]
text = [
  "When it finds a stone of a suitable\\n",
  "size, it secretes a liquid from its\\n",
  "mouth to open up a hole to crawl into.$",
]

[msg.section_0.entries.558]
text = [
  "When its boulder is broken\\n",
  "in battles for territory, it feels\\n",
  "unsure and begins to weaken.$",
]

[msg.section_0.entries.559]
text = [
  "Proud of its sturdy skull,\\n",
  "it suddenly headbutts everything,\\n",
  "but its weight makes it unstable, too.$",
]

[msg.section_0.entries.560]
text = [
  "It pulls up its shed skin to protect\\n",
  "itself while it kicks. The bigger the\\n",
  "crest, the more respected it is.$",
]

[msg.section_0.entries.561]
text = [
  "The guardians of an ancient city, they\\n",
  "always fly the same route while\\n",
  "keeping watch for invaders.$",
]

[msg.section_0.entries.562]
text = [
  "These Pokémon arose from the spirits of\\n",
  "people interred in graves. Each retains\\n",
  "memories of its former life.$",
]

[msg.section_0.entries.563]
text = [
  "Grave robbers who mistake them\\n",
  "for real coffins and get too close\\n",
  "end up trapped inside their bodies.$",
]

[msg.section_0.entries.564]
text = [
  "This Pokémon was restored from a fossil.\\n",
  "It swam skillfully and dove\\n",
  "to depths beyond half a mile.$",
]

[msg.section_0.entries.565]
text = [
  "It could knock out a foe with a slap from\\n",
  "one of its developed front appendages\\n",
  "and chew it up, shell or bones and all.$",
]

[msg.section_0.entries.566]
text = [
  "It was revived from an ancient fossil.\\n",
  "Not able to fly, it lived in treetops and\\n",
  "hopped from one branch to another.$",
]

[msg.section_0.entries.567]
text = [
  "It runs better than it flies.\\n",
  "It takes off into the sky by\\n",
  "running at a speed of 25 mph.$",
]

[msg.section_0.entries.568]
text = [
  "Wanting more garbage, they\\n",
  "follow people who litter.\\n",
  "They always belch poison gas.$",
]

[msg.section_0.entries.569]
text = [
  "Consuming garbage makes\\n",
  "new kinds of poison gases\\n",
  "and liquids inside their bodies.$",
]

[msg.section_0.entries.570]
text = [
  "It changes so it looks just\\n",
  "like its foe, tricks it, and then\\n",
  "uses that opportunity to flee.$",
]

[msg.section_0.entries.571]
text = [
  "Stories say those who tried\\n",
  "to catch Zoroark were trapped\\n",
  "in an illusion and punished.$",
]

[msg.section_0.entries.572]
text = [
  "Minccino greet each other\\n",
  "by grooming one another\\n",
  "thoroughly with their tails.$",
]

[msg.section_0.entries.573]
text = [
  "Cinccino's body is coated\\n",
  "in a special oil that helps it\\n",
  "deflect attacks, such as punches.$",
]

[msg.section_0.entries.574]
text = [
  "It stares intently at everything.\\n",
  "It can become so obsessed with\\n",
  "watching that it doesn't notice attacks.$",
]

[msg.section_0.entries.575]
text = [
  "According to many old tales, it creates\\n",
  "friends for itself by controlling\\n",
  "sleeping children on starry nights.$",
]

[msg.section_0.entries.576]
text = [
  "It can see the future from the movement\\n",
  "of the stars. When it learns its\\n",
  "Trainer's life span, it cries in sadness.$",
]

[msg.section_0.entries.577]
text = [
  "Because their bodies are enveloped\\n",
  "in a special liquid, they are fine in any\\n",
  "environment, no matter how severe.$",
]

[msg.section_0.entries.578]
text = [
  "When their two divided brains\\n",
  "think the same thoughts,\\n",
  "their psychic power is maximized.$",
]

[msg.section_0.entries.579]
text = [
  "They use psychic power to control their\\n",
  "arms, which are made of a special liquid.\\n",
  "They can crush boulders psychically.$",
]

[msg.section_0.entries.580]
text = [
  "They are better at swimming than flying,\\n",
  "and they happily eat their favorite food,\\n",
  "peat moss, as they dive underwater.$",
]

[msg.section_0.entries.581]
text = [
  "Despite their elegant appearance,\\n",
  "they can flap their wings strongly\\n",
  "and fly for thousands of miles.$",
]

[msg.section_0.entries.582]
text = [
  "Theoretically, this Pokémon formed from\\n",
  "icicles bathed in energy from the morning\\n",
  "sun. Their breath is -58° F.$",
]

[msg.section_0.entries.583]
text = [
  "They cool down the surrounding air\\n",
  "and create ice particles, which\\n",
  "they use to freeze their foes.$",
]

[msg.section_0.entries.584]
text = [
  "Swallowing large amounts of water, they\\n",
  "make snow clouds inside their bodies and,\\n",
  "when angry, cause violent blizzards.$",
]

[msg.section_0.entries.585]
text = [
  "Their coloring changes according to the\\n",
  "seasons and can be slightly affected by\\n",
  "the temperature and humidity as well.$",
]

[msg.section_0.entries.586]
text = [
  "They migrate according to the seasons,\\n",
  "so some people call Sawsbuck\\n",
  "the harbingers of spring.$",
]

[msg.section_0.entries.587]
text = [
  "It glides on its outstretched membrane\\n",
  "while shocking foes with the electricity\\n",
  "stored in the pouches on its cheeks.$",
]

[msg.section_0.entries.588]
text = [
  "For some reason they evolve when\\n",
  "they receive electrical energy while\\n",
  "they are attacking Shelmet.$",
]

[msg.section_0.entries.589]
text = [
  "Wearing the shell covering they stole\\n",
  "from Shelmet, they defend themselves\\n",
  "and attack with two lances.$",
]

[msg.section_0.entries.590]
text = [
  "It lures Pokémon with its pattern\\n",
  "that looks just like a Poké Ball\\n",
  "then releases poison spores.$",
]

[msg.section_0.entries.591]
text = [
  "It moves the caps on both arms\\n",
  "and does a dance to lure prey.\\n",
  "It prefers damp places.$",
]

[msg.section_0.entries.592]
text = [
  "If its veil-like arms stun and wrap\\n",
  "a foe, that foe will be dragged miles\\n",
  "below the surface, never to return.$",
]

[msg.section_0.entries.593]
text = [
  "Its body is mostly seawater.\\n",
  "It's said there's a castle of ships\\n",
  "Jellicent have sunk on the seafloor.$",
]

[msg.section_0.entries.594]
text = [
  "It gently holds injured and weak\\n",
  "Pokémon in its fins. Its special\\n",
  "membrane heals their wounds.$",
]

[msg.section_0.entries.595]
text = [
  "Since it can't generate its own\\n",
  "electricity, it sticks onto large-bodied\\n",
  "Pokémon and absorbs static electricity.$",
]

[msg.section_0.entries.596]
text = [
  "It creates barriers from electrified silk\\n",
  "that stun foes. This works as a weapon\\n",
  "as well as a defense.$",
]

[msg.section_0.entries.597]
text = [
  "It absorbs the iron it finds in the\\n",
  "rock while clinging to the ceiling.\\n",
  "It shoots spikes when in danger.$",
]

[msg.section_0.entries.598]
text = [
  "By swinging around its three\\n",
  "spiky feelers and shooting spikes,\\n",
  "it can obliterate an opponent.$",
]

[msg.section_0.entries.599]
text = [
  "Two bodies comprise a fixed pair.\\n",
  "They spin around each other\\n",
  "to generate energy.$",
]

[msg.section_0.entries.600]
text = [
  "A minigear and big gear comprise its\\n",
  "body. If the minigear it launches at\\n",
  "a foe doesn't return, it will die.$",
]

[msg.section_0.entries.601]
text = [
  "The minigear spins at high speed. Then\\n",
  "the energy from the red core charges\\n",
  "the minigear to make it ready to fire.$",
]

[msg.section_0.entries.602]
text = [
  "One alone can emit only a trickle of\\n",
  "electricity, so a group of them gathers\\n",
  "to unleash a powerful electric shock.$",
]

[msg.section_0.entries.603]
text = [
  "It wraps itself around its prey and\\n",
  "paralyzes it with electricity from the\\n",
  "round spots on its sides. Then it chomps.$",
]

[msg.section_0.entries.604]
text = [
  "It latches on to prey with its sucker\\n",
  "mouth, sinking in its fangs and shocking\\n",
  "the prey with powerful electricity.$",
]

[msg.section_0.entries.605]
text = [
  "Rumors of its origin are linked to a UFO\\n",
  "crash site in the desert 50 years ago.$",
]

[msg.section_0.entries.606]
text = [
  "Apparently, it communicates by flashing\\n",
  "its three fingers, but those patterns\\n",
  "haven't been decoded.$",
]

[msg.section_0.entries.607]
text = [
  "Its flame is usually out, but it starts\\n",
  "shining when it absorbs life force\\n",
  "from people or Pokémon.$",
]

[msg.section_0.entries.608]
text = [
  "The spirits it absorbs fuel its baleful\\n",
  "fire. It hangs around hospitals waiting\\n",
  "for people to pass on.$",
]

[msg.section_0.entries.609]
text = [
  "The spirits burned up in its\\n",
  "ominous flame lose their way\\n",
  "and wander this world forever.$",
]

[msg.section_0.entries.610]
text = [
  "Its large tusks have a tendency to\\n",
  "break, but each time they grow back,\\n",
  "they grow in harder and sturdier.$",
]

[msg.section_0.entries.611]
text = [
  "A broken tusk will not grow back, so\\n",
  "it diligently sharpens its tusks on\\n",
  "river rocks after the end of a battle.$",
]

[msg.section_0.entries.612]
text = [
  "Its tusks are incredibly destructive.\\n",
  "They can easily slice through a thick,\\n",
  "sturdy steel column every time.$",
]

[msg.section_0.entries.613]
text = [
  "Their snot is a barometer of health.\\n",
  "When healthy, their snot is sticky and\\n",
  "the power of their ice moves increases.$",
]

[msg.section_0.entries.614]
text = [
  "They love the cold seas of the north.\\n",
  "They create pathways across the ocean\\n",
  "waters by freezing their own breath.$",
]

[msg.section_0.entries.615]
text = [
  "They are composed of ice crystals.\\n",
  "They capture prey with chains of ice,\\n",
  "freezing the prey at -148° F.$",
]

[msg.section_0.entries.616]
text = [
  "When it and Karrablast are together,\\n",
  "and both receive electrical stimulation,\\n",
  "they both evolve.$",
]

[msg.section_0.entries.617]
text = [
  "When its body dries out, it weakens.\\n",
  "So it wraps a membrane around itself\\n",
  "for protection while it spits poison.$",
]

[msg.section_0.entries.618]
text = [
  "When its opponent can't be paralyzed,\\n",
  "it contorts itself with unexpected speed\\n",
  "and flops away.$",
]

[msg.section_0.entries.619]
text = [
  "It takes pride in the speed at which it\\n",
  "can use moves. What it loses in power,\\n",
  "it makes up for in quantity.$",
]

[msg.section_0.entries.620]
text = [
  "Using the long fur on its arms like whips,\\n",
  "it launches into combo attacks that,\\n",
  "once started, no one can stop.$",
]

[msg.section_0.entries.621]
text = [
  "It runs through the narrow tunnels\\n",
  "formed by Excadrill and Onix.\\n",
  "It uses its sharp claws to catch prey.$",
]

[msg.section_0.entries.622]
text = [
  "Ancient science fashioned this\\n",
  "Pokémon from clay. It's been\\n",
  "active for thousands of years.$",
]

[msg.section_0.entries.623]
text = [
  "Golurk were created to protect\\n",
  "people and Pokémon.\\n",
  "They run on a mysterious energy.$",
]

[msg.section_0.entries.624]
text = [
  "Ignoring their injuries, groups attack\\n",
  "by sinking the blades that cover their\\n",
  "bodies into their prey.$",
]

[msg.section_0.entries.625]
text = [
  "This pitiless Pokémon commands a group\\n",
  "of Pawniard to hound prey into immobility.\\n",
  "It then moves in to finish the prey off.$",
]

[msg.section_0.entries.626]
text = [
  "They are known to charge so wildly\\n",
  "that if a train were to enter their\\n",
  "territory, they would send it flying.$",
]

[msg.section_0.entries.627]
text = [
  "It stands up to massive opponents, not\\n",
  "out of courage, but out of recklessness.\\n",
  "But that is how it gets stronger.$",
]

[msg.section_0.entries.628]
text = [
  "For the sake of its friends, this brave\\n",
  "warrior of the sky will not stop battling,\\n",
  "even if injured.$",
]

[msg.section_0.entries.629]
text = [
  "Their wings are too tiny to allow them to\\n",
  "fly. They guard their posteriors with\\n",
  "bones that were gathered by Mandibuzz.$",
]

[msg.section_0.entries.630]
text = [
  "They fly in circles around the sky.\\n",
  "When they spot prey, they attack and\\n",
  "carry it back to their nest with ease.$",
]

[msg.section_0.entries.631]
text = [
  "It draws in air through its tail,\\n",
  "transforms it into fire, and uses it like\\n",
  "a tongue. It melts Durant and eats them.$",
]

[msg.section_0.entries.632]
text = [
  "Individuals each play different roles in\\n",
  "driving Heatmor, their natural predator,\\n",
  "away from their colony.$",
]

[msg.section_0.entries.633]
text = [
  "Lacking sight, it's unaware of its\\n",
  "surroundings, so it bumps into things\\n",
  "and eats anything that moves.$",
]

[msg.section_0.entries.634]
text = [
  "The two heads do not get along.\\n",
  "Whichever head eats more than\\n",
  "the other gets to be the leader.$",
]

[msg.section_0.entries.635]
text = [
  "It responds to movement by attacking.\\n",
  "This scary, three-headed Pokémon\\n",
  "devours everything in its path!$",
]

[msg.section_0.entries.636]
text = [
  "Said to have been born from the sun,\\n",
  "it spews fire from its horns and encases\\n",
  "itself in a cocoon of fire when it evolves.$",
]

[msg.section_0.entries.637]
text = [
  "Thought to be an embodiment of the sun,\\n",
  "it appeared during a bitterly cold winter\\n",
  "and saved Pokémon from freezing.$",
]

[msg.section_0.entries.638]
text = [
  "It has a body and heart of steel.\\n",
  "It worked with its allies to punish\\n",
  "people when they hurt Pokémon.$",
]

[msg.section_0.entries.639]
text = [
  "Spoken of in legend, this Pokémon used\\n",
  "its phenomenal power to destroy a castle\\n",
  "in its effort to protect Pokémon.$",
]

[msg.section_0.entries.640]
text = [
  "Legends say this Pokémon\\n",
  "confounded opponents with\\n",
  "its swift movements.$",
]

[msg.section_0.entries.641]
text = [
  "In every direction it flies,\\n",
  "creating winds so powerful,\\n",
  "they blow everything away.$",
]

[msg.section_0.entries.642]
text = [
  "As it flies around, it shoots lightning all\\n",
  "over the place and causes forest fires.\\n",
  "It is therefore disliked.$",
]

[msg.section_0.entries.643]
text = [
  "This legendary Pokémon can scorch\\n",
  "the world with fire. It helps those\\n",
  "who want to build a world of truth.$",
]

[msg.section_0.entries.644]
text = [
  "This legendary Pokémon can scorch\\n",
  "the world with lightning. It assists\\n",
  "those who want to build an ideal world.$",
]

[msg.section_0.entries.645]
text = [
  "From the forces of lightning and wind,\\n",
  "it creates energy to give nutrients to\\n",
  "the soil and make the land abundant.$",
]

[msg.section_0.entries.646]
text = [
  "This legendary ice Pokémon waits for\\n",
  "a hero to fill in the missing parts\\n",
  "of its body with truth or ideals.$",
]

[msg.section_0.entries.647]
text = [
  "When it is resolute, its body fills\\n",
  "with power and it becomes swifter.\\n",
  "Its jumps are then too fast to follow.$",
]

[msg.section_0.entries.648]
text = [
  "The melodies sung by Meloetta have\\n",
  "the power to make Pokémon that\\n",
  "hear them happy or sad.$",
]

[msg.section_0.entries.649]
text = [
  "This Pokémon existed 300 million years\\n",
  "ago. Team Plasma altered it and\\n",
  "attached a cannon to its back.$",
]

[msg.section_0.entries.650]
text = [
  "$",
]

[msg.section_0.entries.651]
text = [
  "When alone, nothing happens.\\n",
  "However, if there are two or more,\\n",
  "an odd power is said to emerge.$",
]

[msg.section_0.entries.652]
text = [
  "When alone, nothing happens.\\n",
  "However, if there are two or more,\\n",
  "an odd power is said to emerge.$",
]

[msg.section_0.entries.653]
text = [
  "When alone, nothing happens.\\n",
  "However, if there are two or more,\\n",
  "an odd power is said to emerge.$",
]

[msg.section_0.entries.654]
text = [
  "When alone, nothing happens.\\n",
  "However, if there are two or more,\\n",
  "an odd power is said to emerge.$",
]

[msg.section_0.entries.655]
text = [
  "When alone, nothing happens.\\n",
  "However, if there are two or more,\\n",
  "an odd power is said to emerge.$",
]

[msg.section_0.entries.656]
text = [
  "When alone, nothing happens.\\n",
  "However, if there are two or more,\\n",
  "an odd power is said to emerge.$",
]

[msg.section_0.entries.657]
text = [
  "When alone, nothing happens.\\n",

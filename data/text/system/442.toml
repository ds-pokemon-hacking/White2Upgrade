[msg.section_0.entries.727]
text = [
  "When it is resolute, its body fills\\n",
  "with power and it becomes swifter.\\n",
  "Its jumps are then too fast to follow.$",
]

[msg.section_0.entries.728]
text = [
  "The melodies sung by Meloetta have\\n",
  "the power to make Pokémon that\\n",
  "hear them happy or sad.$",
]


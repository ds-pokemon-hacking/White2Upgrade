[msg.section_0.entries.714]
text = [
  "Red- and blue-striped Basculin are\\n",
  "very violent and always fighting.\\n",
  "They are also remarkably tasty.$",
]

[msg.section_0.entries.715]
text = [
  "When one is injured in a fierce battle,\\n",
  "it hardens into a stone-like form.\\n",
  "Then it meditates and sharpens its mind.$",
]

[msg.section_0.entries.716]
text = [
  "Their coloring changes according to the\\n",
  "seasons and can be slightly affected by\\n",
  "the temperature and humidity as well.$",
]


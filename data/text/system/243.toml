[msg.section_0.entries.0]
text = [
  "Actor$",
]

[msg.section_0.entries.1]
text = [
  "Assistant$",
]

[msg.section_0.entries.2]
text = [
  "Assistant: Professor [VAR TRNAME(1)]!\\n",
  "The test is almost complete!\\c\\n",
  "I'm going to turn off the power\\n",
  "to the F-00!$",
]

[msg.section_0.entries.3]
text = [
  "Professor [VAR TRNAME(1)]: So this day has\\n",
  "finally come...$",
]

[msg.section_0.entries.4]
text = [
  "Assistant: Professor [VAR TRNAME(1)]!\\c\\n",
  "Today is the day when all our hard\\n",
  "work finally pays off!\\c\\n",
  "The birth of an all-new robot, programmed\\n",
  "to have a human heart...or as close to it\\l\\n",
  "as possible!$",
]

[msg.section_0.entries.5]
text = [
  "[VAR TRNAME(1)]: ...$",
]

[msg.section_0.entries.6]
text = [
  "Assistant: Professor [VAR TRNAME(1)]!\\c\\n",
  "Let's begin the final test!\\c\\n",
  "This test involves communication with\\n",
  "humans and with Pokémon!$",
]

[msg.section_0.entries.7]
text = [
  "[VAR TRNAME(1)]: Very well.\\n",
  "Let's begin the test.$",
]

[msg.section_0.entries.8]
text = [
  "Assistant: Activating the F-00 now!\\n",
  "Please be careful not to damage it!$",
]

[msg.section_0.entries.9]
text = [
  "[VAR TRNAME(1)]: Quiet, you...\\n",
  "I know what I'm doing!$",
]

[msg.section_0.entries.10]
text = [
  "[VAR TRNAME(1)]: Excellent.\\n",
  "It appears to be moving properly.$",
]

[msg.section_0.entries.11]
text = [
  "Assistant: OK, let's begin the\\n",
  "conversational skill test!\\c\\n",
  "Try talking to the F-00!$",
]

[msg.section_0.entries.12]
text = [
  "[VAR TRNAME(1)]: I know what to do!$",
]

[msg.section_0.entries.13]
text = [
  "F-00: ...$",
]

[msg.section_0.entries.14]
text = [
  "[VAR TRNAME(1)]: Good morning.$",
]

[msg.section_0.entries.15]
text = [
  "F-00: GOOD. MORNING.$",
]

[msg.section_0.entries.16]
text = [
  "[VAR TRNAME(1)]: Come on! Get up!$",
]

[msg.section_0.entries.17]
text = [
  "F-00: WHAT?\\n",
  "TOO LOUD. BE QUIET.$",
]

[msg.section_0.entries.18]
text = [
  "[VAR TRNAME(1)]: OK...\\n",
  "Everything seems to check out!$",
]

[msg.section_0.entries.19]
text = [
  "F-00: WHO?\\c\\n",
  "WHO ARE YOU?$",
]

[msg.section_0.entries.20]
text = [
  "[VAR TRNAME(1)]: My name is [VAR TRNAME(1)].\\n",
  "I'm a friend!$",
]

[msg.section_0.entries.21]
text = [
  "F-00: WHAT IS...FRIEND?$",
]

[msg.section_0.entries.22]
text = [
  "[VAR TRNAME(1)]: Someone you like!$",
]

[msg.section_0.entries.23]
text = [
  "F-00: [VAR TRNAME(1)]! FRIEND!$",
]

[msg.section_0.entries.24]
text = [
  "[VAR TRNAME(1)]: Someone you know.$",
]

[msg.section_0.entries.25]
text = [
  "F-00: SOMEONE I KNOW... SOMEONE I KNOW...$",
]

[msg.section_0.entries.26]
text = [
  "[VAR TRNAME(1)]: I don't really know...$",
]

[msg.section_0.entries.27]
text = [
  "F-00: YOU DO NOT KNOW.\\n",
  "I DO NOT KNOW, EITHER.$",
]

[msg.section_0.entries.28]
text = [
  "[VAR TRNAME(1)]: You figure it out!$",
]

[msg.section_0.entries.29]
text = [
  "F-00: I DO NOT UNDERSTAND...\\n",
  "WHAT IS FRIEND?$",
]

[msg.section_0.entries.30]
text = [
  "Assistant: Professor [VAR TRNAME(1)]!\\n",
  "The F-00 has shut down!\\c\\n",
  "This concludes the test!$",
]

[msg.section_0.entries.31]
text = [
  "[VAR TRNAME(1)]: Indeed...$",
]

[msg.section_0.entries.32]
text = [
  "Assistant: Congratulations!\\n",
  "The test was a complete success!$",
]

[msg.section_0.entries.33]
text = [
  "[VAR TRNAME(1)]: Of course it was.\\n",
  "A genius like myself doesn't fail.$",
]

[msg.section_0.entries.34]
text = [
  "Assistant: Of course you don't!\\c\\n",
  "Regardless, if we can sell the designs for\\n",
  "the F-00, our lab may finally be able to get\\l\\n",
  "out of the red! We can finally put an\\l\\n",
  "end to this long slump we've been having!\\c\\n",
  "We'll be able to start up all kinds of new\\n",
  "and exciting research!$",
]

[msg.section_0.entries.35]
text = [
  "[VAR TRNAME(1)]: Hmmm...\\c\\n",
  "I don't think so...\\n",
  "I'm not giving up the F-00 to anyone.\\c\\n",
  "I've already disposed of the design data.$",
]

[msg.section_0.entries.36]
text = [
  "Assistant: What? How could you?!\\c\\n",
  "Then...that means this F-00 is the only\\n",
  "one that will ever be made!$",
]

[msg.section_0.entries.37]
text = [
  "[VAR TRNAME(1)]: That's exactly what I'm saying.$",
]

[msg.section_0.entries.38]
text = [
  "Assistant: How could you...\\c\\n",
  "All this time I spent aiding you\\n",
  "in your research...for nothing!\\l\\n",
  "What are we supposed to do?!$",
]

[msg.section_0.entries.39]
text = [
  "[VAR TRNAME(1)]: I won't give up the F-00\\n",
  "to anyone.\\c\\n",
  "I invented it. It's my robot!$",
]

[msg.section_0.entries.40]
text = [
  "And so I succeeded in inventing the first\\n",
  "ever robot to have a heart...\\l\\n",
  "I completed the F-00...\\c\\n",
  "The F-00 was the culmination of my years of\\n",
  "research and the crystallization of my\\l\\n",
  "hopes and dreams.$",
]

[msg.section_0.entries.41]
text = [
  "[VAR TRNAME(1)]: Why...\\n",
  "Why won't you move?$",
]

[msg.section_0.entries.42]
text = [
  "Assistant: Professor [VAR TRNAME(1)]!\\n",
  "What are you doing?!\\c\\n",
  "You've destroyed the F-00!$",
]

[msg.section_0.entries.43]
text = [
  "[VAR TRNAME(1)]: No...\\n",
  "I went easy on it...$",
]

[msg.section_0.entries.44]
text = [
  "Assistant: It was just meant to be a test!\\n",
  "I even warned you to be careful\\l\\n",
  "not to damage the F-00!$",
]

[msg.section_0.entries.45]
text = [
  "[VAR TRNAME(1)]: Ugh...$",
]

[msg.section_0.entries.46]
text = [
  "Assistant: It's all your fault! All of our\\n",
  "hard work...for nothing!\\c\\n",
  "What are we going to do now?!$",
]

[msg.section_0.entries.47]
text = [
  "[VAR TRNAME(1)]: ...Sniffle...\\n",
  "Wahhh! Wahhh!$",
]

[msg.section_0.entries.48]
text = [
  "Assistant: Oh, pull yourself together.\\n",
  "Crying won't bring it back.\\c\\n",
  "For someone who is such a genius,\\n",
  "you're still just a kid.$",
]

[msg.section_0.entries.49]
text = [
  "[VAR TRNAME(1)]: Wahh...sniffle...$",
]

[msg.section_0.entries.50]
text = [
  "And so, just before completing\\n",
  "the first-ever robot to have a heart,\\l\\n",
  "I accidentally destroyed it...\\c\\n",
  "I made many more attempts after that\\n",
  "to create another robot, but none were as\\l\\n",
  "marvelous as my F-00...$",
]

[msg.section_0.entries.51]
text = [
  "[VAR TRNAME(1)]: Hey!\\n",
  "What are you doing, F-00?\\c\\n",
  "The test isn't over yet!\\n",
  "Be still!$",
]

[msg.section_0.entries.52]
text = [
  "F-00: I AM BORED.\\n",
  "BORED OF THIS TEST.\\c\\n",
  "THIS IS NOT FUN.\\n",
  "I WANT TO HAVE FUN!\\c\\n",
  "[VAR TRNAME(1)], GOOD-BYE!$",
]

[msg.section_0.entries.53]
text = [
  "[VAR TRNAME(1)]: Just wait a moment!\\n",
  "Where do you think you're going?\\c\\n",
  "Going somewhere to have fun?\\n",
  "Does the F-00's programming really allow it\\l\\n",
  "to behave so much like a human?$",
]

[msg.section_0.entries.54]
text = [
  "Assistant: What are you standing there for?\\n",
  "We've got to hurry and bring back the F-00!\\c\\n",
  "We're still in the testing phases! There's\\n",
  "no telling what the F-00 will do out there!\\c\\n",
  "What are you going to do if it gets involved\\n",
  "in some kind of accident?!$",
]

[msg.section_0.entries.55]
text = [
  "Assistant: Come on, Professor!\\n",
  "We've got to hurry!$",
]

[msg.section_0.entries.56]
text = [
  "[VAR TRNAME(1)]: Hmmm...$",
]

[msg.section_0.entries.57]
text = [
  "And so we desperately ran after\\n",
  "the F-00...\\c\\n",
  "When we finally caught up, we saw it\\n",
  "destroying everything in its path.\\c\\n",
  "The F-00 found its fun in destroying the\\n",
  "town's buildings and cars.\\c\\n",
  "Eventually the police arrived, and the\\n",
  "F-00 was destroyed...\\c\\n",
  "Taking responsibility for the incident, I\\n",
  "turned myself in and was arrested.\\c\\n",
  "That was 20 years ago...\\c\\n",
  "I still regret that I ever created\\n",
  "such a dangerous and violent robot...$",
]

[msg.section_0.entries.58]
text = [
  "F-00: IT HURTS...$",
]

[msg.section_0.entries.59]
text = [
  "Assistant: Professor! What are you doing?!\\c\\n",
  "Go easy on the F-00 or you'll end up\\n",
  "destroying it!$",
]

[msg.section_0.entries.60]
text = [
  "[VAR TRNAME(1)]: I know, I know...\\n",
  "It was just a tiny mistake...$",
]

[msg.section_0.entries.61]
text = [
  "Assistant: Please be a bit more careful!\\n",
  "You know the future of our laboratory\\l\\n",
  "hangs in the balance!$",
]

[msg.section_0.entries.62]
text = [
  "[VAR TRNAME(1)]: Oh, be quiet...$",
]

[msg.section_0.entries.63]
text = [
  "Assistant: Don't tell me to be quiet!\\n",
  "I only said it because I care about\\l\\n",
  "everyone in our lab...$",
]

[msg.section_0.entries.64]
text = [
  "[VAR TRNAME(1)]: Who cares?$",
]

[msg.section_0.entries.65]
text = [
  "Assistant: You should care, Professor!\\n",
  "Give me a break! This is just a prototype!\\l\\n",
  "If you aren't careful with it, there's\\l\\n",
  "no telling what could happen!$",
]

[msg.section_0.entries.66]
text = [
  "[VAR TRNAME(1)]: I suppose you're right.$",
]

[msg.section_0.entries.67]
text = [
  "Assistant: I'm counting on you!\\n",
  "The F-00 is our lab's only hope!$",
]

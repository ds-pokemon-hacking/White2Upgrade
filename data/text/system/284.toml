[msg.section_0.entries.0]
text = [
  "[CENTER]Professor [VAR TRNAME(1)] has\\n",
  "[CENTER]become witness to a world\\n",
  "[CENTER]where Pokémon control people.$",
]

[msg.section_0.entries.1]
text = [
  "[CENTER]He is attacked by a cruel\\n",
  "[CENTER]resident of this world named Ledian.\\n",
  "[CENTER]The capsule of his temporal\\n",
  "[CENTER]transport is taken away.$",
]

[msg.section_0.entries.2]
text = [
  "[CENTER]Ledian plans to exterminate\\n",
  "[CENTER]Professor [VAR TRNAME(1)]\\n",
  "[CENTER]in order to silence him.$",
]

[msg.section_0.entries.3]
text = [
  "[CENTER]Can Professor [VAR TRNAME(1)]\\n",
  "[CENTER]safely return to his own time?$",
]

[msg.section_0.entries.4]
text = [
  "なし$",

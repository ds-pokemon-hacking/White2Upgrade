text = [
  "[CENTER][VAR TRNAME(1)] is famous for being\\n",
  "[CENTER]the selfish prince of a faraway land.$",
]

[msg.section_0.entries.1]
text = [
  "[CENTER]On this day as well, the prince turned\\n",
  "[CENTER]his back on the king's words and was\\n",
  "[CENTER]walking the castle grounds late at night.$",
]

[msg.section_0.entries.2]
text = [
  "[CENTER]Suddenly, he noticed\\n",
  "[CENTER]a suspicious white door deep in the\\n",
  "[CENTER]grounds that he hadn't seen before...$",
]

[msg.section_0.entries.3]
text = [
  "[CENTER]Without thinking, Prince [VAR TRNAME(1)]\\n",
  "[CENTER]opened that white door.$",
]

[msg.section_0.entries.4]
text = [
  "[CENTER]When he did...$",
]

[msg.section_0.entries.5]
text = [
  "[CENTER]A creepy scene he'd never expected\\n",
  "[CENTER]spread out before his eyes...$",
]


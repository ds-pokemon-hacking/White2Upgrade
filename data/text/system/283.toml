[msg.section_0.entries.0]
text = [
  "[CENTER]Professor [VAR TRNAME(1)] rode his own\\n",
  "[CENTER]invention, the temporal transport,\\n",
  "[CENTER]into the future!$",
]

[msg.section_0.entries.1]
text = [
  "[CENTER]As he collected soil and stones\\n",
  "[CENTER]from the future as research samples...$",
]

[msg.section_0.entries.2]
text = [
  "[CENTER]An unimaginable resident\\n",
  "[CENTER]of this future world\\n",
  "[CENTER]stood right behind him...$",
]


[msg.section_0.entries.76]
text = [
  "Air Lock, huh...\\c\\n",
  "When a Pokémon with this Ability is\\n",
  "in battle, it eliminates effects of weather\\l\\n",
  "on Pokémon.\\c\\n",
  "The weather condition still\\n",
  "exists, however.\\c$",
]

[msg.section_0.entries.77]
text = [
  "Tangled Feet, huh...\\c\\n",
  "This Ability raises the Pokémon's\\n",
  "evasiveness when it's confused.\\c$",
]

[msg.section_0.entries.78]
text = [
  "Motor Drive, huh...\\c\\n",
  "This Ability not only nullifies the damage\\n",
  "but also raises the Pokémon's Speed\\l\\n",
  "when it's hit by an Electric-type move.\\c$",
]

[msg.section_0.entries.79]
text = [
  "Rivalry, huh...\\c\\n",
  "This Ability raises the power of\\n",
  "the Pokémon's move when the target is\\l\\n",
  "of the same gender.\\c\\n",
  "However, if the target is the opposite\\n",
  "gender, the move's power goes down.\\c$",
]

[msg.section_0.entries.80]
text = [
  "Steadfast, huh...\\c\\n",
  "This Ability raises the Pokémon's Speed\\n",
  "every time it flinches.\\c$",
]

[msg.section_0.entries.81]
text = [
  "Snow Cloak, huh...\\c\\n",
  "The evasiveness of the Pokémon with this\\n",
  "Ability goes up when it's hailing.\\l\\n",
  "What's more...\\c\\n",
  "If a Pokémon with this Ability is leading\\n",
  "the party in a hailstorm, it lowers the\\l\\n",
  "chance to encounter wild Pokémon.\\c$",
]

[msg.section_0.entries.82]
text = [
  "Gluttony, huh...\\c\\n",
  "A Pokémon with this Ability uses its held\\n",
  "Berry when its HP is half or less.\\c$",
]

[msg.section_0.entries.83]
text = [
  "Anger Point, huh...\\c\\n",
  "This Ability raises the Pokémon's Attack\\n",
  "to the maximum when hit by a critical hit.\\c$",
]

[msg.section_0.entries.84]
text = [
  "Unburden, huh...\\c\\n",
  "This Ability doubles the Pokémon's Speed\\n",
  "if it loses or consumes a held item.\\c\\n",
  "It won't do a thing if the Pokémon has\\n",
  "no held item to begin with, though.\\c$",
]

[msg.section_0.entries.85]
text = [
  "Heatproof, huh...\\c\\n",
  "This Ability halves damage\\n",
  "from Fire-type moves.\\c\\n",
  "You should remember that\\n",
  "it also halves damage from burns.\\c$",
]

[msg.section_0.entries.86]
text = [
  "Simple, huh...\\c\\n",
  "This Ability doubles the effect of\\n",
  "stat changes.\\c\\n",
  "You should remember that\\n",
  "both stat-raising and stat-lowering\\l\\n",
  "effects get doubled.\\c$",
]

[msg.section_0.entries.87]
text = [
  "Dry Skin, huh...\\c\\n",
  "This Ability restores HP when\\n",
  "the Pokémon is hit by a Water-type move\\l\\n",
  "or when it's raining...\\c\\n",
  "However, the Pokémon receives increased\\n",
  "damage from Fire-type moves and takes\\l\\n",
  "damage from sunny weather.\\c$",
]

[msg.section_0.entries.88]
text = [
  "Download, huh...\\c\\n",
  "When the Pokémon enters battle,\\n",
  "this Ability raises its Attack\\l\\n",
  "if the opposing Pokémon's Defense is lower\\l\\n",
  "than its Sp. Def.\\c\\n",
  "It raises Sp. Atk if the opposing\\n",
  "Pokémon's Sp. Def is lower\\l\\n",
  "than its Defense.\\c$",
]

[msg.section_0.entries.89]
text = [
  "Iron Fist, huh...\\c\\n",
  "This Ability increases the power of\\n",
  "moves that punch the target.\\c$",
]

[msg.section_0.entries.90]
text = [
  "Poison Heal, huh...\\c\\n",
  "This Ability restores HP every turn\\n",
  "if the Pokémon is inflicted with the\\l\\n",
  "poison status condition.\\c$",
]

[msg.section_0.entries.91]
text = [
  "Adaptability, huh...\\c\\n",
  "When the Pokémon uses a move that\\n",
  "matches its type, this Ability increases\\l\\n",
  "the power boost.\\c$",
]

[msg.section_0.entries.92]
text = [
  "Skill Link, huh...\\c\\n",
  "With this Ability, moves with multiple hits\\n",
  "will always strike the maximum number\\l\\n",
  "of times.\\c$",
]

[msg.section_0.entries.93]
text = [
  "Hydration, huh...\\c\\n",
  "This Ability cures status conditions\\n",
  "at the end of the turn if it's raining.\\c$",
]

[msg.section_0.entries.94]
text = [
  "Solar Power, huh...\\c\\n",
  "This Ability raises Sp. Atk\\n",
  "in sunny weather, but the Pokémon\\l\\n",
  "also takes damage every turn,\\l\\n",
  "so be careful.\\c$",
]

[msg.section_0.entries.95]
text = [
  "Quick Feet, huh...\\c\\n",
  "This Ability raises Speed when the Pokémon\\n",
  "is affected by status conditions.\\c\\n",
  "It nullifies the Speed-lowering\\n",
  "effect of paralysis as well.\\c\\n",
  "What's more...\\c\\n",
  "It lowers the chance to encounter\\n",
  "wild Pokémon when the leading party\\l\\n",
  "member has it.\\c$",
]

[msg.section_0.entries.96]
text = [
  "Normalize, huh...\\c\\n",
  "This Ability turns all of the Pokémon's\\n",
  "moves to Normal-type moves.\\c$",
]

[msg.section_0.entries.97]
text = [
  "Sniper, huh...\\c\\n",
  "Pokémon with this Ability deal a great\\n",
  "amount of damage when delivering\\l\\n",
  "a critical hit.\\c$",
]

[msg.section_0.entries.98]
text = [
  "Magic Guard, huh...\\c\\n",
  "Pokémon with this Ability do not take\\n",
  "damage from anything other than attacks.\\c$",
]

[msg.section_0.entries.99]
text = [
  "No Guard, huh...\\c\\n",
  "Moves used by or against the Pokémon with\\n",
  "this Ability always strike their targets.\\l\\n",
  "What's more...\\c\\n",
  "It raises the chance to encounter\\n",
  "wild Pokémon when the leading party\\l\\n",
  "member has it.\\c$",
]

[msg.section_0.entries.100]
text = [
  "Stall, huh...\\c\\n",
  "Moves by the Pokémon with this Ability\\n",
  "are used last in the turn\\l\\n",
  "regardless of its Speed.\\c$",
]

[msg.section_0.entries.101]
text = [
  "Technician, huh...\\c\\n",
  "This Ability increases the power of\\n",
  "weaker moves.\\c$",
]

[msg.section_0.entries.102]
text = [
  "Leaf Guard, huh...\\c\\n",
  "This Ability protects the Pokémon from\\n",
  "status conditions in sunny weather.\\c$",
]

[msg.section_0.entries.103]
text = [
  "Klutz, huh...\\c\\n",
  "Items have no effect when held\\n",
  "by the Pokémon with this Ability.\\c$",
]

[msg.section_0.entries.104]
text = [
  "Mold Breaker, huh...\\c\\n",
  "A Pokémon with this Ability uses moves on\\n",
  "targets regardless of their Abilities.\\c$",
]

[msg.section_0.entries.105]
text = [
  "Super Luck, huh...\\c\\n",
  "This Ability heightens the critical-hit\\n",
  "ratio of the Pokémon's moves.\\c$",
]

[msg.section_0.entries.106]
text = [
  "Aftermath, huh...\\c\\n",
  "This Ability deals damage to the attacking\\n",
  "Pokémon when a direct attack causes the\\l\\n",
  "Pokémon to faint.\\c$",
]

[msg.section_0.entries.107]
text = [
  "Anticipation, huh...\\c\\n",
  "A Pokémon with this Ability will shudder\\n",
  "if the opposing Pokémon knows a\\l\\n",
  "supereffective move.\\c\\n",
  "You should remember that it also warns\\n",
  "when the opposing Pokémon knows\\l\\n",
  "a one-hit KO move,\\l\\n",
  "Selfdestruct, or Explosion.\\c$",
]

[msg.section_0.entries.108]
text = [
  "Forewarn, huh...\\c\\n",
  "This Ability reveals a move an opposing\\n",
  "Pokémon knows when the Pokémon\\l\\n",
  "enters battle.\\c\\n",
  "By the way,\\n",
  "you should remember that damaging moves\\l\\n",
  "with high power are prioritized.\\c$",
]

[msg.section_0.entries.109]
text = [
  "Unaware, huh...\\c\\n",
  "This Ability ignores the stat changes of\\n",
  "the opposing Pokémon.\\c\\n",
  "But!\\c\\n",
  "It does not ignore changes to the Speed\\n",
  "stat, so be careful.\\c$",
]

[msg.section_0.entries.110]
text = [
  "Tinted Lens, huh...\\c\\n",
  "This Ability doubles the damage of the\\n",
  "Pokémon's not-very-effective moves.\\c$",
]

[msg.section_0.entries.111]
text = [
  "Filter, huh...\\c\\n",
  "This Ability reduces damage from\\n",
  "supereffective moves.\\c$",
]

[msg.section_0.entries.112]
text = [
  "Slow Start, huh...\\c\\n",
  "This Ability halves Attack and Speed\\n",
  "for five turns when the Pokémon\\l\\n",
  "enters battle.\\c\\n",
  "To win battles with this Ability, the key is\\n",
  "to endure the first five turns!\\c$",
]

[msg.section_0.entries.113]
text = [
  "Scrappy, huh...\\c\\n",
  "This Ability lets the Pokémon hit\\n",
  "Ghost-type Pokémon with Normal- and\\l\\n",
  "Fighting-type moves.\\c$",
]

[msg.section_0.entries.114]
text = [
  "Storm Drain, huh...\\c\\n",
  "Pokémon with this Ability do not\\n",
  "take damage from Water-type moves.\\c\\n",
  "That's not all!\\c\\n",
  "Its Sp. Atk goes up every time it\\n",
  "takes a Water-type move.\\c\\n",
  "There's more!\\c\\n",
  "This Ability draws Water-type moves\\n",
  "to the Pokémon.\\c\\n",
  "It doesn't do any good in Single Battles,\\n",
  "but it should be useful in Double Battles\\l\\n",
  "and Triple Battles.\\c$",
]

[msg.section_0.entries.115]
text = [
  "Ice Body, huh...\\c\\n",
  "Pokémon with this Ability\\n",
  "recover a little bit of HP every turn\\l\\n",
  "during a hailstorm.\\c$",
]

[msg.section_0.entries.116]
text = [
  "Solid Rock, huh...\\c\\n",
  "Pokémon with this Ability\\n",
  "take less damage from\\l\\n",
  "supereffective moves.\\c$",
]

[msg.section_0.entries.117]
text = [
  "Snow Warning, huh...\\c\\n",
  "A Pokémon with this Ability changes the\\n",
  "weather to hail when it enters a battle.\\c$",
]

[msg.section_0.entries.118]
text = [
  "Honey Gather, huh...\\c\\n",
  "A Pokémon with this Ability\\n",
  "will sometimes be left holding\\l\\n",
  "Honey after a battle.\\c\\n",
  "Its chance of finding Honey\\n",
  "increases with its level,\\l\\n",
  "so you should keep that in mind.\\c$",
]

[msg.section_0.entries.119]
text = [
  "Frisk, huh...\\c\\n",
  "A Pokémon with this Ability\\n",
  "will tell you what item\\l\\n",
  "an opponent is holding.\\c$",
]

[msg.section_0.entries.120]
text = [
  "Reckless, huh...\\c\\n",
  "If a Pokémon with this Ability\\n",
  "uses a move that has recoil,\\l\\n",
  "the power of that move will increase.\\c\\n",
  "Don't forget that this Ability's effect\\n",
  "also works on moves that damage\\l\\n",
  "the user when the move misses!\\c$",
]

[msg.section_0.entries.121]
text = [
  "Multitype, huh...\\c\\n",
  "Arceus has this Ability.\\n",
  "When it holds an item called a Plate,\\l\\n",
  "its type shifts according to the Plate!\\c$",
]

[msg.section_0.entries.122]
text = [
  "Flower Gift, huh...\\c\\n",
  "When a Cherrim with this Ability\\n",
  "is in sunny weather, its form changes,\\l\\n",
  "and its Attack and Sp. Def stats go up!\\c\\n",
  "In Double and Triple Battles, it also\\n",
  "makes its allies' stats increase!\\c$",
]

[msg.section_0.entries.123]
text = [
  "Bad Dreams, huh...\\c\\n",
  "Pokémon with this Ability reduce the HP\\n",
  "of sleeping Pokémon every turn!\\c$",
]

[msg.section_0.entries.124]
text = [
  "Pickpocket, huh...\\c\\n",
  "When a Pokémon with this Ability\\n",
  "is hit with a direct attack,\\l\\n",
  "it can steal the attacker's held item.\\c\\n",
  "Well...\\c\\n",
  "It only works if the attacker is holding\\n",
  "an item, though.\\c$",
]

[msg.section_0.entries.125]
text = [
  "Sheer Force, huh...\\c\\n",
  "When a Pokémon with this Ability\\n",
  "uses a move with an additional effect,\\l\\n",
  "the power goes up,\\l\\n",
  "but the additional effect won't work.\\c$",
]

[msg.section_0.entries.126]
text = [
  "Contrary, huh...\\c\\n",
  "Stat changes have the opposite effect\\n",
  "on Pokémon with this Ability!\\c\\n",
  "When stats should go up, they go down,\\n",
  "and when they should go down, they go up!\\c$",
]

[msg.section_0.entries.127]
text = [
  "Unnerve, huh...\\c\\n",
  "When a Pokémon with this Ability\\n",
  "is in battle, the opposing Pokémon\\l\\n",
  "won't be able to eat Berries.\\c$",
]

[msg.section_0.entries.128]
text = [
  "Defiant, huh...\\c\\n",
  "When an opponent lowers the stats\\n",
  "of a Pokémon with this Ability,\\l\\n",
  "its Attack goes way up!\\c\\n",
  "But be careful--if it lowers\\n",
  "its own stats, the Ability won't work!\\c$",
]

[msg.section_0.entries.129]
text = [
  "Defeatist, huh...\\c\\n",
  "When a Pokémon has this Ability\\n",
  "and its HP is reduced to half or less,\\l\\n",
  "its Attack and Sp. Atk go down.\\c\\n",
  "You absolutely can't afford\\n",
  "to let these Pokémon's HP go down.\\c\\n",
  "I guess that's one good thing\\n",
  "about this Ability...\\c$",
]

[msg.section_0.entries.130]
text = [
  "Cursed Body, huh...\\c\\n",
  "When a Pokémon with this Ability\\n",
  "is hit by an attack, sometimes\\l\\n",
  "it will Disable that attack.\\c$",
]

[msg.section_0.entries.131]
text = [
  "Healer, huh...\\c\\n",
  "Pokémon with this Ability sometimes\\n",
  "heal the status conditions\\l\\n",
  "of allies that are battling with it.\\c\\n",
  "They can't heal themselves,\\n",
  "so it doesn't mean much in Single Battles,\\l\\n",
  "but it's a very useful Ability\\l\\n",
  "to have in Double and Triple Battles.\\c$",
]

[msg.section_0.entries.132]
text = [
  "Friend Guard, huh...\\c\\n",
  "Pokémon with this Ability\\n",
  "reduce damage done to\\l\\n",
  "other Pokémon battling with it.\\c\\n",
  "It doesn't reduce damage to itself,\\n",
  "so it doesn't mean much in Single Battles,\\l\\n",
  "but it's a very useful Ability\\l\\n",
  "to have in Double and Triple Battles.\\c$",
]

[msg.section_0.entries.133]
text = [
  "Weak Armor, huh...\\c\\n",
  "When a Pokémon with this Ability\\n",
  "is hit by a physical attack,\\l\\n",
  "Defense goes down,\\l\\n",
  "but Speed goes up!\\c$",
]

[msg.section_0.entries.134]
text = [
  "Heavy Metal, huh...\\c\\n",
  "Pokémon with this Ability\\n",
  "are twice as heavy.\\c$",
]

[msg.section_0.entries.135]
text = [
  "Light Metal, huh...\\c\\n",
  "Pokémon with this Ability\\n",
  "are half as heavy.\\c$",
]

[msg.section_0.entries.136]
text = [
  "Multiscale, huh...\\c\\n",
  "When a Pokémon with this Ability has\\n",
  "full HP, the damage it takes is reduced.\\c\\n",
  "Remember, as long as the Pokémon's\\n",
  "HP is full, the Ability will keep working.\\c$",
]

[msg.section_0.entries.137]
text = [
  "Toxic Boost, huh...\\c\\n",
  "When a Pokémon with this\\n",
  "Ability is poisoned,\\l\\n",
  "it's Attack goes up.\\c$",
]

[msg.section_0.entries.138]
text = [
  "Flare Boost, huh...\\c\\n",
  "When a Pokémon with\\n",
  "this Ability is burned,\\l\\n",
  "its Sp. Atk goes up.\\c$",
]

[msg.section_0.entries.139]
text = [
  "Harvest, huh...\\c\\n",
  "Pokémon with this Ability sometimes\\n",
  "restore the Berry they used.\\c\\n",
  "Remember that if the weather\\n",
  "is sunny, the Berry will always\\l\\n",
  "be restored.\\c$",
]

[msg.section_0.entries.140]
text = [
  "Telepathy, huh...\\c\\n",
  "Pokémon with this Ability\\n",
  "can read their allies' minds\\l\\n",
  "and avoid collateral damage.\\c\\n",
  "It's not useful in Single Battles,\\n",
  "but it's a very important Ability\\l\\n",
  "for Double and Triple Battles.\\c$",
]

[msg.section_0.entries.141]
text = [
  "Moody, huh...\\c\\n",
  "At the end of a turn,\\n",
  "Pokémon with this Ability\\l\\n",
  "raise one stat sharply\\l\\n",
  "and lower another.\\c$",
]

[msg.section_0.entries.142]
text = [
  "Overcoat, huh...\\c\\n",
  "Pokémon with this Ability\\n",
  "aren't damaged by the weather.\\c$",
]

[msg.section_0.entries.143]
text = [
  "Poison Touch, huh...\\c\\n",
  "When Pokémon with this Ability\\n",
  "land a direct attack,\\l\\n",
  "the target is sometimes poisoned.\\c$",
]

[msg.section_0.entries.144]
text = [
  "Regenerator, huh...\\c\\n",
  "When a Pokémon with this Ability\\n",
  "is withdrawn from battle,\\l\\n",
  "it restores a little of its HP.\\c$",
]

[msg.section_0.entries.145]
text = [
  "Big Pecks, huh...\\c\\n",
  "The Defense of Pokémon with this Ability\\n",
  "can't be lowered by an opponent.\\c$",
]

[msg.section_0.entries.146]
text = [
  "Sand Rush, huh...\\c\\n",
  "When a Pokémon with this Ability\\n",
  "is in a sandstorm,\\l\\n",
  "its Speed doubles.\\c\\n",
  "Also, it won't be damaged by a\\n",
  "sandstorm, regardless of its type.\\c$",
]

[msg.section_0.entries.147]
text = [
  "Wonder Skin, huh...\\c\\n",
  "Pokémon with this Ability\\n",
  "are more likely to dodge status moves.\\c\\n",
  "Don't forget, though: if the Pokémon uses\\n",
  "a status move on itself, this Ability\\l\\n",
  "won't work.\\c$",
]

[msg.section_0.entries.148]
text = [
  "Analytic, huh...\\c\\n",
  "When Pokémon with this Ability\\n",
  "attack last, the power\\l\\n",
  "of the move goes up.\\c$",
]

[msg.section_0.entries.149]
text = [
  "Illusion, huh...\\c\\n",
  "A Pokémon with this Ability\\n",
  "will appear in battle disguised\\l\\n",
  "as the last Pokémon in your party.\\c\\n",
  "Be careful. If it's hit by an attack,\\n",
  "the disguise will go away.\\c$",
]

[msg.section_0.entries.150]
text = [
  "Imposter, huh...\\c\\n",
  "When a Pokémon with this Ability\\n",
  "comes into battle,\\l\\n",
  "it will Transform into its opponent.\\c\\n",
  "And it's not just looks...\\n",
  "It knows its opponent's moves,\\l\\n",
  "and some of its stats are the same, too!\\c$",
]

[msg.section_0.entries.151]
text = [
  "Infiltrator, huh...\\c\\n",
  "Pokémon with this Ability can\\n",
  "get past effects protecting the target\\l\\n",
  "and hit it with a move.\\c$",
]

[msg.section_0.entries.152]
text = [
  "Mummy, huh...\\c\\n",
  "When a Pokémon with this Ability\\n",
  "is hit by a direct attack,\\l\\n",
  "the Ability of the attacker\\l\\n",
  "will change to Mummy.\\c$",
]

[msg.section_0.entries.153]
text = [
  "Moxie, huh...\\c\\n",
  "When a Pokémon with this Ability\\n",
  "knocks out an opponent,\\l\\n",
  "its Attack goes up.\\c$",
]

[msg.section_0.entries.154]
text = [
  "Justified, huh...\\c\\n",
  "When a Pokémon with this Ability\\n",
  "is hit by a Dark-type move,\\l\\n",
  "its Attack goes up.\\c$",
]

[msg.section_0.entries.155]
text = [
  "Rattled, huh...\\c\\n",
  "When a Pokémon with this Ability is hit\\n",
  "by a Ghost-, Bug-, or Dark-type move,\\l\\n",
  "its Speed goes up.\\c$",
]

[msg.section_0.entries.156]
text = [
  "Magic Bounce, huh...\\c\\n",
  "Pokémon with this Ability\\n",
  "reflect status moves used on them\\l\\n",
  "right back at the user!\\c\\n",
  "And get this!\\c\\n",
  "The status move does not affect\\n",
  "the target!\\c$",
]

[msg.section_0.entries.157]
text = [
  "Sap Sipper, huh...\\c\\n",
  "When a Pokémon with this Ability\\n",
  "is hit by a Grass-type move,\\l\\n",
  "its Attack goes up.\\c\\n",
  "It also takes no damage or\\n",
  "added effects from those moves.\\c$",
]

[msg.section_0.entries.158]
text = [
  "Prankster, huh...\\c\\n",
  "Pokémon with this Ability can\\n",
  "use status moves earlier\\l\\n",
  "than usual.\\c$",
]

[msg.section_0.entries.159]
text = [
  "Sand Force, huh...\\c\\n",
  "When a Pokémon with this Ability\\n",
  "is in a sandstorm, the power of\\l\\n",
  "its Ground-, Rock-, and Steel-type moves\\l\\n",
  "goes up!\\c$",
]

[msg.section_0.entries.160]
text = [
  "Iron Barbs, huh...\\c\\n",
  "When a Pokémon with this Ability\\n",
  "is hit by a direct attack,\\l\\n",
  "the attacker takes damage as well.\\c$",
]

[msg.section_0.entries.161]
text = [
  "Zen Mode, huh...\\c\\n",
  "A Darmanitan with this Ability\\n",
  "enters Zen Mode when its HP\\l\\n",
  "is reduced to half or less.\\c\\n",
  "When in Zen Mode, it's a Psychic-\\n",
  "and Fire-type Pokémon.\\c\\n",
  "Its Attack and Speed go down, but its\\n",
  "Defense, Sp. Atk, and Sp. Def increase!\\c$",
]

[msg.section_0.entries.162]
text = [
  "Victory Star, huh...\\c\\n",
  "A Pokémon with this Ability\\n",
  "raises the accuracy\\l\\n",
  "of itself and its allies.\\c$",
]


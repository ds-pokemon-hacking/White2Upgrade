[msg.section_0.entries.1]
text = [
  "Stench, huh...\\c\\n",
  "Pokémon with this Ability can\\n",
  "sometimes make the target flinch.\\c\\n",
  "What's more...\\c\\n",
  "It lowers the chance to encounter\\n",
  "wild Pokémon when the leading\\l\\n",
  "party member has it.\\c$",
]

[msg.section_0.entries.2]
text = [

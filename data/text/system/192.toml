[msg]
trailing_data = "2222"

[msg.section_0.entries.0]
text = [
  "Celebrity$",
]

[msg.section_0.entries.1]
text = [
  "Little Sis$",
]

[msg.section_0.entries.2]
text = [
  "The [VAR PKNICK(0)] Ninja: Well, well.\\n",
  "Isn't that a cute Pokémon!$",
]

[msg.section_0.entries.3]
text = [
  "Pollyanna: I won't lose!$",
]

[msg.section_0.entries.4]
text = [
  "Pollyanna: Hang on, Sewaddle!$",
]

[msg.section_0.entries.5]
text = [
  "Pollyanna: Now!$",
]

[msg.section_0.entries.6]
text = [
  "The [VAR PKNICK(0)] Ninja: Tsk...\\n",
  "You're quite good.$",
]

[msg.section_0.entries.7]
text = [
  "Pollyanna: I won't go easy on you!$",
]

[msg.section_0.entries.8]
text = [
  "The [VAR PKNICK(0)] Ninja: Tsk!\\n",
  "This girl also uses Pokémon?!$",
]

[msg.section_0.entries.9]
text = [
  "Pollyanna: Oh, you're the one\\n",
  "my big brother was talking about--\\l\\n",
  "a petty thief, the [VAR PKNICK(0)] Ninja.$",
]

[msg.section_0.entries.10]
text = [
  "The [VAR PKNICK(0)] Ninja: So what?\\c\\n",
  "Now I'll capture you!$",
]

[msg.section_0.entries.11]
text = [
  "Pollyanna: I have to warn you--\\n",
  "I'm pretty strong.\\l\\n",
  "'Cause I've been training\\l\\n",
  "with my big brother.$",
]

[msg.section_0.entries.12]
text = [
  "The [VAR PKNICK(0)] Ninja: Heh!\\n",
  "This is not child's play!$",
]

[msg.section_0.entries.13]
text = [
  "Pollyanna: I'll beat you\\n",
  "and show my big brother\\l\\n",
  "how cool I am!$",
]

[msg.section_0.entries.14]
text = [
  "Pollyanna: I can stop you with one hit\\n",
  "using defense skills I learned\\l\\n",
  "from my big brother.\\c\\n",
  "Police judo! Hyah!$",
]

[msg.section_0.entries.15]
text = [
  "The [VAR PKNICK(0)] Ninja: Eeeek!\\n",
  "You are good... Or...\\l\\n",
  "You're just better than I expected...\\c\\n",
  "Anyway, you--\\n",
  "You should battle with Pokémon!$",
]

[msg.section_0.entries.16]
text = [
  "Pollyanna: Oops...I forgot.\\c\\n",
  "I got upset, and without thinking,\\n",
  "I used...\\c\\n",
  "Humph! I've also learned strategies\\n",
  "for Pokémon battles\\l\\n",
  "from my brother!$",
]

[msg.section_0.entries.17]
text = [
  "The [VAR PKNICK(0)] Ninja: I see...$",
]

[msg.section_0.entries.18]
text = [
  "Pollyanna: Don't underestimate me!\\c\\n",
  "Oh? But...\\n",
  "How do I do that?$",
]

[msg.section_0.entries.19]
text = [
  "The [VAR PKNICK(0)] Ninja: Bring it!$",
]

[msg.section_0.entries.20]
text = [
  "Pollyanna: I'll show you the results\\n",
  "of my special training!$",
]

[msg.section_0.entries.21]
text = [
  "The [VAR PKNICK(0)] Ninja: Oh, really?\\n",
  "Check your ego at the door!$",
]

[msg.section_0.entries.22]
text = [
  "Pollyanna: Check your own ego!\\c\\n",
  "My brother told me\\n",
  "justice always prevails!$",
]

[msg.section_0.entries.23]
text = [
  "The [VAR PKNICK(0)] Ninja: That's incorrect...\\n",
  "The winner is always right, even if it is\\l\\n",
  "the villain.\\l\\n",
  "That's reality!$",
]

[msg.section_0.entries.24]
text = [
  "Pollyanna: That's a lie!$",
]

[msg.section_0.entries.25]
text = [
  "The [VAR PKNICK(0)] Ninja: You'll see.$",
]

[msg.section_0.entries.26]
text = [
  "Pollyanna: My brother is right!\\n",
  "I'll prove it to you!$",
]

[msg.section_0.entries.27]
text = [
  "The [VAR PKNICK(0)] Ninja: Heh heh heh...$",
]

[msg.section_0.entries.28]
text = [
  "Pollyanna: Wh-what?\\n",
  "I don't understand!\\c\\n",
  "Can you be telling the truth? My brother...$",
]

[msg.section_0.entries.29]
text = [
  "The [VAR PKNICK(0)] Ninja: Eeeek!\\n",
  "I lost to such a starry-eyed girl...$",
]

[msg.section_0.entries.30]
text = [
  "Pollyanna: See? Justice prevails!\\n",
  "My brother was right!$",
]

[msg.section_0.entries.31]
text = [
  "The [VAR PKNICK(0)] Ninja failed in his attempt\\n",
  "to capture Pollyanna. On the contrary,\\l\\n",
  "Pollyanna captured him and turned\\l\\n",
  "him over to the World Police.\\c\\n",
  "As long as there is justice in this world,\\n",
  "evil will never prosper!\\c\\n",
  "Congratulations on making a great citizen's\\n",
  "arrest, Pollyanna! Rise and fight, citizen!$",
]

[msg.section_0.entries.32]
text = [
  "Pollyanna: Aaaah! It can't be...\\n",
  "It's not fair that I didn't win\\l\\n",
  "when I'm doing the right thing!$",
]

[msg.section_0.entries.33]
text = [
  "The [VAR PKNICK(0)] Ninja: That's right.\\n",
  "Honesty doesn't pay.\\l\\n",
  "That's the kind of dirty world it is.\\l\\n",
  "No one can keep their hands clean.$",
]

[msg.section_0.entries.34]
text = [
  "Pollyanna: Uh-oh, m-my... He is cool.\\n",
  "I shouldn't feel this way...\\l\\n",
  "But I can't help it...$",
]

[msg.section_0.entries.35]
text = [
  "Pollyanna lost to the [VAR PKNICK(0)] Ninja\\n",
  "and, to her own surprise, felt a surge of\\l\\n",
  "admiration for evil!\\c\\n",
  "You're in trouble, Mecha Cop!\\n",
  "Your little sister is at a very difficult age!$",
]

[msg.section_0.entries.36]
text = [
  "Pollyanna: No, oh no...\\n",
  "With my feelings mixed up like this,\\l\\n",
  "my big brother will hate me...$",
]

[msg.section_0.entries.37]
text = [
  "The [VAR PKNICK(0)] Ninja: Hate you?\\c\\n",
  "You're brother and sister, right?\\n",
  "Why would he hate you for having feelings?$",
]

[msg.section_0.entries.38]
text = [
  "Pollyanna: My brother's justice\\n",
  "is my justice!\\c\\n",
  "If I can't win against you, then\\n",
  "to my brother, that means I'm evil, too!$",
]

[msg.section_0.entries.39]
text = [
  "The [VAR PKNICK(0)] Ninja: Tsk...\\n",
  "I'm sorry for you.\\c\\n",
  "As I always thought,\\n",
  "there is no good in justice, either...$",
]

[msg.section_0.entries.40]
text = [
  "Pollyanna: I'm s-sorry...\\n",
  "Sorry...\\l\\n",
  "Sorry...\\l\\n",
  "...$",
]

[msg.section_0.entries.41]
text = [
  "In pursuit of an ideal of justice,\\n",
  "Pollyanna got caught up in fear--\\l\\n",
  "fear of making mistakes.\\c\\n",
  "Mecha Cop might have missed\\n",
  "a key factor in training his\\l\\n",
  "little sister. Forgotten? Feelings...\\c\\n",
  "Take care of your family, Mecha Cop!\\n",
  "Train hard, but leave room for feelings!$",
]

[msg.section_0.entries.42]
text = [
  "Pollyanna: This can't be happening...\\n",
  "After all my special training with my\\l\\n",
  "brother, I lost... It can't be true...$",
]

[msg.section_0.entries.43]
text = [
  "The [VAR PKNICK(0)] Ninja: Heh heh heh!\\n",
  "With you as bait, I'll lure Mecha Cop\\l\\n",
  "to his utter defeat!\\c\\n",
  "And, at that moment, what you two\\n",
  "call...justice...will crumble!$",
]

[msg.section_0.entries.44]
text = [
  "Pollyanna: Stop! Let me go!\\n",
  "My brother! Help me!$",
]

[msg.section_0.entries.45]
text = [
  "The [VAR PKNICK(0)] Ninja,\\n",
  "after successfully capturing Pollyanna,\\l\\n",
  "cornered Mecha Cop and overpowered him.$",
]

[msg.section_0.entries.46]
text = [
  "But, several years later...\\c\\n",
  "Pollyanna, driven by vengeance\\n",
  "against the [VAR PKNICK(0)] Ninja,\\l\\n",
  "became a secret detective\\l\\n",
  "of the World Police.\\c\\n",
  "Reborn as a reinforced cyborg female cop,\\n",
  "she became Mecha Cop Woman.\\c\\n",
  "Even the score, Mecha Cop Woman!\\n",
  "Make him pay the price for the sake of\\l\\n",
  "justice and the World Police!$",
]

[msg.section_0.entries.47]
text = [
  "Pollyanna: What?\\n",
  "(...This can't be right. False Swipe?...)\\c\\n",
  "(...Is he holding back so that his Pokémon\\n",
  "won't beat Sewaddle?...)\\c\\n",
  "(...)\\c\\n",
  "(...Could he truly be a kindhearted man?...)$",
]

[msg.section_0.entries.48]
text = [
  "The [VAR PKNICK(0)] Ninja: Now, come\\n",
  "along quietly.\\l\\n",
  "There's no point in getting yourself hurt...$",
]

[msg.section_0.entries.49]
text = [
  "Pollyanna: (...Come to think of it...)\\n",
  "(...Back then, my brother was so kind...)\\c\\n",
  "(...He was brutally injured while protecting\\n",
  "me...saved me from being hit by a truck...)\\c\\n",
  "(...Despite it all, to keep working as a cop,\\n",
  "he allowed himself to be surgically\\l\\n",
  "reinforced with cyborg components...)$",
]

[msg.section_0.entries.50]
text = [
  "Pollyanna: Oh... How strange...\\n",
  "Suddenly, he looks like\\l\\n",
  "a sweet guy...\\c\\n",
  "And... And... The [VAR PKNICK(0)] Ninja\\n",
  "is kind of good looking, too...$",
]

[msg.section_0.entries.51]
text = [
  "The [VAR PKNICK(0)] Ninja: Don't worry. Follow\\n",
  "my instructions, and you won't get hurt.$",
]

[msg.section_0.entries.52]
text = [
  "Pollyanna: Captured...my heart...\\c\\n",
  "But, oh, I can't feel this way!\\n",
  "I'm Mecha Cop's little sister!\\l\\n",
  "I have to be strong!\\c\\n",
  "Pol in Pollyanna is the same as\\n",
  "Pol in Police!$",
]

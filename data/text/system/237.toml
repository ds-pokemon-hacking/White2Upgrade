[msg.section_0.entries.45]
text = [
  "[VAR TRNAME(1)] barely fended off the monster\\n",
  "and escaped from the lodge.\\c\\n",
  "In the ominous red fog, the world\\n",
  "around her has turned strange...\\c\\n",
  "The fog is still thick.\\n",
  "The dawn is nowhere near her reach...$",
]

[msg.section_0.entries.46]
text = [
  "[VAR TRNAME(1)]: Argh...\\n",
  "This fog...\\c\\n",
  "My head is spinning...\\c\\n",
  "Is that...\\n",
  "No, it can't be!$",
]

[msg.section_0.entries.47]
text = [
  "???: Brreaburble...\\n",
  "Breeble blurble blorble...$",
]

[msg.section_0.entries.48]
text = [
  "What was that thing [VAR TRNAME(1)] saw\\n",
  "just before she lost consciousness,\\l\\n",
  "defeated by the humanoid monster?\\c\\n",
  "People can do nothing but run from\\n",
  "this mysterious phenomenon.\\c\\n",
  "The world will be engulfed\\n",
  "by the red fog before dawn...$",
]


[msg.section_0.entries.56]
text = [
  "Out of the blue, [VAR TRNAME(1)] started\\n",
  "mumbling meaningless words to herself...\\c\\n",
  "Did she lose her senses, overwhelmed\\n",
  "by terror? Or could it be something else?\\c\\n",
  "The truth is hidden deep\\n",
  "within the red fog...$",

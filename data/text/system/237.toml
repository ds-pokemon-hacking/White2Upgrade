[msg.section_0.entries.17]
text = [
  "[VAR TRNAME(1)]: (...Oh, my...\\c\\n",
  "Is that a person?\\n",
  "No, not quite, though it appears humanoid...\\l\\n",
  "And what is that ominous red fog?\\c\\n",
  "What's happening here?...)$",
]

[msg.section_0.entries.18]
text = [
  "[VAR TRNAME(1)]: (...It's too dangerous\\n",
  "to stay. I have to watch for a chance\\l\\n",
  "to get out of here!...)$",
]

[msg.section_0.entries.19]
text = [
  "Humanoid: Grroah!\\n",

[msg.section_0.entries.0]
text = [
  "Director: C'mon! Put more into it!$",
]

[msg.section_0.entries.1]
text = [
  "Director: Don't look at the camera!\\n",
  "YOU should feel the camera!$",
]

[msg.section_0.entries.2]
text = [
  "Director: What are YOU doing?!\\n",
  "Are YOU taking this seriously?$",
]

[msg.section_0.entries.3]
text = [
  "Director: Mmm...\\n",
  "Those eyes... I'll get those on film...$",
]

[msg.section_0.entries.4]
text = [
  "Director: You won't stir people's hearts\\n",
  "with acting like that...$",
]

[msg.section_0.entries.5]
text = [
  "Director: Don't take your eyes\\n",
  "off the other actor!$",
]

[msg.section_0.entries.6]
text = [
  "Director: Harmph...\\n",
  "Not a bad line...$",
]

[msg.section_0.entries.7]
text = [
  "Director: That line...\\n",
  "It's not good, but it's not bad...$",
]

[msg.section_0.entries.8]
text = [
  "Director: What was that supposed to be?\\n",
  "What are YOU doing to MY movie?!$",
]

[msg.section_0.entries.9]
text = [
  "Director: Hurry up and decide!\\n",
  "The progress will start to stagnate!$",
]

[msg.section_0.entries.10]
text = [
  "Director: Cuuuut!\\n",
  "That's a wrap!$",
]

[msg.section_0.entries.11]
text = [
  "Director: Cut!\\n",
  "Yeesh... I'm going home...$",
]

[msg.section_0.entries.12]
text = [
  "Director: Cut...\\n",
  "Well that might work...$",
]

[msg.section_0.entries.13]
text = [
  "Director: Hey! Newbie!\\n",
  "Make sure to take the script seriously!\\l\\n",
  "Read it thoroughly!$",
]

[msg.section_0.entries.14]
text = [
  "Director: Look at the script!\\n",
  "It's the first thing YOU should learn!$",
]

[msg.section_0.entries.15]
text = [
  "Director: Hmm...\\n",
  "I'll leave this to YOU.$",
]

[msg.section_0.entries.16]
text = [
  "Director: An ad-lib?\\n",
  "Harrumph. It was not bad...$",
]

[msg.section_0.entries.17]
text = [
  "Director: Good acting is always\\n",
  "respectful and bold!$",
]

[msg.section_0.entries.18]
text = [
  "Director: C'mon! More!\\n",
  "Put your heart into it!$",
]

[msg.section_0.entries.19]
text = [
  "Director: Concentrate on your acting!\\n",
  "Don't think about anything else!$",
]

[msg.section_0.entries.20]
text = [
  "Director: Hmm...\\n",
  "Well that was some interesting acting...$",
]

[msg.section_0.entries.21]
text = [
  "Director: Oh oh...\\n",
  "Using that line here is interesting...$",
]

[msg.section_0.entries.22]
text = [
  "Director: Well, I guess\\n",
  "we can use that line...$",
]

[msg.section_0.entries.23]
text = [
  "Director: What?! I compliment YOU once,\\n",
  "and this is what happens!$",
]

[msg.section_0.entries.24]
text = [
  "Director: Wrap everything up neatly!\\n",
  "If anyone can do it, YOU can!$",
]

[msg.section_0.entries.25]
text = [
  "Director: Cuuuut!\\n",
  "That's a wrap!$",
]

[msg.section_0.entries.26]
text = [
  "Director: Cut!\\n",
  "Yeesh... I'm going home...$",
]

[msg.section_0.entries.27]
text = [
  "Director: Cut...\\n",
  "Well that might work...$",
]

[msg.section_0.entries.28]
text = [
  "Director: Hey! Recheck the script!$",
]

[msg.section_0.entries.29]
text = [
  "Director: Have the script up there?\\n",
  "If you think you might forget it, eat it!$",
]

[msg.section_0.entries.30]
text = [
  "Director: All right. OK.\\n",
  "I'm feeling good about this...$",
]

[msg.section_0.entries.31]
text = [
  "Director: Not bad...\\n",
  "No, it's actually pretty good...$",
]

[msg.section_0.entries.32]
text = [
  "Director: Nice acting...\\n",
  "I got caught up in it...$",
]

[msg.section_0.entries.33]
text = [
  "Director: Harmph...\\n",
  "Guess I can learn a few things from you...$",
]

[msg.section_0.entries.34]
text = [
  "Director: Cameras! I want a close-up!$",
]

[msg.section_0.entries.35]
text = [
  "Director: Hey! Cameras!\\n",
  "Cut out everything but the lead right now!$",
]

[msg.section_0.entries.36]
text = [
  "Director: Excellent!\\n",
  "That's truly an excellent line...$",
]

[msg.section_0.entries.37]
text = [
  "Director: That line...\\n",
  "Well, it works when you say it...$",
]

[msg.section_0.entries.38]
text = [
  "Director: What's wrong?\\n",
  "Why did you say that?$",
]

[msg.section_0.entries.39]
text = [
  "Director: OK! End things\\n",
  "the way you always do!$",
]

[msg.section_0.entries.40]
text = [
  "Director: Cut!\\n",
  "That's the best! You're the best!$",
]

[msg.section_0.entries.41]
text = [
  "Director: Cut!\\n",
  "Well... I'll be going...$",
]

[msg.section_0.entries.42]
text = [
  "Director: Cut! Cut!\\n",
  "This is going to be a troublesome film...$",
]

[msg.section_0.entries.43]
text = [
  "Director: A truly professional approach\\n",
  "is to go back to basics\\l\\n",
  "and reread the script!$",
]

[msg.section_0.entries.44]
text = [
  "Director: The script is...\\n",
  "You already know, right?$",
]

[msg.section_0.entries.0]
text = [
  "Um...hello?\\c\\n",
  "...\\c\\n",
  "Yes. That's right.\\c\\n",
  "I'm the owner of\\n",
  "that Xtransceiver.\\c\\n",
  "I'm using an old Xtransceiver\\n",
  "right now, so it's audio only. Sorry.\\c\\n",
  "Thank you for finding it.\\c\\n",
  "Truth is, I want to come\\n",
  "pick it up right away, but...\\c\\n",
  "Right now I'm very busy with work,\\n",
  "and I'm not in a place where\\l\\n",
  "I can stop and come get it.\\c\\n",
  "If you don't mind, could you hang\\n",
  "on to it for a little bit?\\c\\n",
  "...\\c\\n",
  "Really? You don't mind?\\n",
  "Thank you so much.\\c\\n",
  "My name's Na...\\n",
  "Er...sorry...Yancy.\\c\\n",
  "And you are?\\c\\n",
  "[VAR TRNAME(0)]?\\c\\n",
  "OK. When work calms down,\\n",
  "I'll come pick it up,\\l\\n",
  "so please take care of it for me!\\c$",
]

[msg.section_0.entries.1]
text = [
  "Also...\\c\\n",
  "I'm sure you'll want to\\n",
  "keep in touch until\\l\\n",
  "I can pick up my Xtransceiver.\\c\\n",
  "So, I'll call your\\n",
  "Xtransceiver often.\\c\\n",
  "Bye, then. Thanks again.\\c$",
]

[msg]
trailing_data = "a6a6"

[msg.section_0.entries.0]
text = [
  "Suit Actor$",
]

[msg.section_0.entries.1]
text = [
  "Future Being$",
]

[msg.section_0.entries.2]
text = [
  "Professor [VAR TRNAME(1)]: Could this be...\\c\\n",
  "(...Is this the future?...)$",
]

[msg.section_0.entries.3]
text = [
  "Ledian: Hmm... What's this?\\n",
  "You're a strange-looking Human.\\c\\n",
  "You look kind of like a Scientist, but\\n",
  "I've never seen your type before.$",
]

[msg.section_0.entries.4]
text = [
  "Professor [VAR TRNAME(1)]: It's a person...\\n",
  "I'd better try not to do too much damage...$",
]

[msg.section_0.entries.5]
text = [
  "Ledian: That dumb Human is holding back.\\n",
  "It doesn't want to hurt another of its\\l\\n",
  "own kind.\\c\\n",
  "Hmph. Such a common trait among\\n",
  "the weaker species. How foolish.$",
]

[msg.section_0.entries.6]
text = [
  "Professor [VAR TRNAME(1)]: Are you telling\\n",
  "me you don't care?\\c\\n",
  "You wouldn't mind hurting another Pokémon?$",
]

[msg.section_0.entries.7]
text = [
  "Ledian: How could you obey a Human\\n",
  "like that? Such disgraceful Pokémon!\\l\\n",
  "I'll eliminate you all!$",
]

[msg.section_0.entries.8]
text = [
  "Professor [VAR TRNAME(1)]: I don't need\\n",
  "to defeat the people you're controlling\\l\\n",
  "to protect my Pokémon!$",
]

[msg.section_0.entries.9]
text = [
  "Ledian: That's enough talk from you!\\c\\n",
  "Is that the Scientist Ability?\\n",
  "Running your mouth?$",
]

[msg.section_0.entries.10]
text = [
  "Ledian: Stop right there, Human!$",
]

[msg.section_0.entries.11]
text = [
  "Professor [VAR TRNAME(1)]: A Pokémon?!$",
]

[msg.section_0.entries.12]
text = [
  "Ledian: It's not often that we get\\n",
  "wild Humans showing up in town...\\c\\n",
  "They're dangerous and need to be\\n",
  "eliminated quickly!$",
]

[msg.section_0.entries.13]
text = [
  "Professor [VAR TRNAME(1)]: A talking Pokémon?\\n",
  "Did it just release a person from that Ball?!\\c\\n",
  "What's going on here?\\c\\n",
  "It's like everything is backward!$",
]

[msg.section_0.entries.14]
text = [
  "Ledian: Huh?\\n",
  "Humans using Pokémon?\\l\\n",
  "What is this madness?$",
]

[msg.section_0.entries.15]
text = [
  "Professor [VAR TRNAME(1)]: Wait!\\n",
  "Tell me what's going on here!$",
]

[msg.section_0.entries.16]
text = [
  "Ledian: What's going on?\\c\\n",
  "Here's how things work here: you lowly\\n",
  "Humans go into these Human Balls, and then\\l\\n",
  "you do as your Trainer Pokémon commands!\\c\\n",
  "Wild Humans who won't go into the Balls\\n",
  "are to be eliminated! It's simple!$",
]

[msg.section_0.entries.17]
text = [
  "Professor [VAR TRNAME(1)]: What?\\n",
  "In the world of the future, Pokémon\\l\\n",
  "catch people?!$",
]

[msg.section_0.entries.18]
text = [
  "Ledian: The future? Are you trying to tell\\n",
  "me that you come from the past?$",
]

[msg.section_0.entries.19]
text = [
  "Professor [VAR TRNAME(1)]: Well...\\c\\n",
  "(...Should I tell this Pokémon about\\n",
  "how I traveled through time?\\l\\n",
  "It probably won't believe me...)$",
]

[msg.section_0.entries.20]
text = [
  "Ledian: Or are you just a dirty lying Human?\\c\\n",
  "Lying is cowardice! Cowardice is a crime!\\n",
  "You must be eliminated!$",
]

[msg.section_0.entries.21]
text = [
  "Professor [VAR TRNAME(1)]: Help!$",
]

[msg.section_0.entries.22]
text = [
  "Ledian: Begging for your life, are you?\\n",
  "What a pathetic Human! I think I'll take\\l\\n",
  "my time eliminating you!\\c\\n",
  "Come out, Black Belt! Teach this\\n",
  "cowardly Human a lesson!$",
]

[msg.section_0.entries.23]
text = [
  "Professor [VAR TRNAME(1)]: Can we talk?$",
]

[msg.section_0.entries.24]
text = [
  "Ledian: Talk? Why should a Pokémon\\n",
  "talk to a pathetic Human like you?\\l\\n",
  "How ridiculous!$",
]

[msg.section_0.entries.25]
text = [
  "Professor [VAR TRNAME(1)]: I'm not lying!$",
]

[msg.section_0.entries.26]
text = [
  "Ledian: How could that be true?\\n",
  "You must be lying. Lying is a crime.\\l\\n",
  "Criminals must be eliminated.\\l\\n",
  "Black Belt, take care of this liar!$",
]

[msg.section_0.entries.27]
text = [
  "Ledian: What's wrong, Human?\\n",
  "You can't even fight back?$",
]

[msg.section_0.entries.28]
text = [
  "Professor [VAR TRNAME(1)]: I don't want\\n",
  "to fight! Stop this!$",
]

[msg.section_0.entries.29]
text = [
  "Ledian: If you don't want to fight,\\n",
  "you'd better release that [VAR PKNICK(0)]!$",
]

[msg.section_0.entries.30]
text = [
  "Professor [VAR TRNAME(1)]: I can't do that...$",
]

[msg.section_0.entries.31]
text = [
  "Ledian: I didn't think so!\\c\\n",
  "Humans are so weak. You've only got\\n",
  "two arms, and you can't even fly!\\c\\n",
  "Pokémon must make great bodyguards\\n",
  "for you Humans. Or do you treat them\\l\\n",
  "more like tools for your own convenience?$",
]

[msg.section_0.entries.32]
text = [
  "Professor [VAR TRNAME(1)]: That's not true!\\n",
  "Pokémon are my friends!$",
]

[msg.section_0.entries.33]
text = [
  "Ledian: A likely story.\\c\\n",
  "Anyway, Humans like you are simply tools\\n",
  "for us Pokémon.\\c\\n",
  "You're just toys who battle each other for\\n",
  "our enjoyment! It doesn't matter if you\\l\\n",
  "break--there are plenty of replacements!$",
]

[msg.section_0.entries.34]
text = [
  "Professor [VAR TRNAME(1)]: That's terrible...$",
]

[msg.section_0.entries.35]
text = [
  "Black Belt: You...\\n",
  "Human who use Pokémon...\\l\\n",
  "You understand me?$",
]

[msg.section_0.entries.36]
text = [
  "Professor [VAR TRNAME(1)]: You can speak?$",
]

[msg.section_0.entries.37]
text = [
  "Black Belt: Stuck in Ball...\\n",
  "Treated like thing...\\c\\n",
  "Not talk ever. Not talk good.\\n",
  "But must talk you...\\c\\n",
  "You say you from past.\\n",
  "I believe.$",
]

[msg.section_0.entries.38]
text = [
  "Professor [VAR TRNAME(1)]: Thank you...\\n",
  "I appreciate it!$",
]

[msg.section_0.entries.39]
text = [
  "Black Belt: Long ago. Bug Pokémon get\\n",
  "strong. Evolution Stone make strong.\\l\\n",
  "They take over.\\l\\n",
  "E-lim-i-nate many human...$",
]

[msg.section_0.entries.40]
text = [
  "Professor [VAR TRNAME(1)]: What?!\\n",
  "What's an Evolution Stone?$",
]

[msg.section_0.entries.41]
text = [
  "Black Belt: Evolution Stone...\\n",
  "Make Bug Pokémon very smart...\\l\\n",
  "Pokémon strong and smart...\\l\\n",
  "No chance for human...$",
]

[msg.section_0.entries.42]
text = [
  "Professor [VAR TRNAME(1)]: I never\\n",
  "imagined the future could be like this...$",
]

[msg.section_0.entries.43]
text = [
  "Ledian: Black Belt! Silence!\\n",
  "Stop yapping with that other Human!\\c\\n",
  "You're nothing more than a tool!\\n",
  "Do as I say or face the consequences!$",
]

[msg.section_0.entries.44]
text = [
  "Professor [VAR TRNAME(1)]: I'm only telling\\n",
  "the truth! Please, believe me!$",
]

[msg.section_0.entries.45]
text = [
  "Ledian: Even with the superior technology\\n",
  "of the Bug-type Pokémon, we haven't been\\l\\n",
  "able to achieve time travel. There's no way\\l\\n",
  "a mere Human could have done so!$",
]

[msg.section_0.entries.46]
text = [
  "Professor [VAR TRNAME(1)]: But I did! I came\\n",
  "here on a time machine of my own invention!$",
]

[msg.section_0.entries.47]
text = [
  "Ledian: You're just lying to save yourself.\\n",
  "It's rare to see a Human as clever as you.\\l\\n",
  "That makes you dangerous.\\c\\n",
  "I'd better eliminate you for good measure!$",
]

[msg.section_0.entries.48]
text = [
  "Professor [VAR TRNAME(1)]: That's not fair!$",
]

[msg.section_0.entries.49]
text = [
  "Ledian: Come on, Black Belt!\\n",
  "Hurry up and eliminate this scum.\\c\\n",
  "I'm done wasting my time talking to\\n",
  "this dirty Human!$",
]

[msg.section_0.entries.50]
text = [
  "Ledian: How did you do that?!\\n",
  "You protected your Pokémon without\\l\\n",
  "hurting my Black Belt!\\c\\n",
  "Hmm...\\c\\n",
  "Interesting. You are an unusual Human.\\n",
  "OK, I'll spare you from elimination.\\l\\n",
  "I'll also believe your wild story.\\c\\n",
  "But first...\\c\\n",
  "Sit still and let me catch you!$",
]

[msg.section_0.entries.51]
text = [
  "Professor [VAR TRNAME(1)]: No!\\n",
  "What's this? Some kind of string?\\c\\n",
  "Get it off me! Untie this string now!\\n",
  "Let me go!$",
]

[msg.section_0.entries.52]
text = [
  "Professor [VAR TRNAME(1)]: Ack!\\n",
  "The more I try to break free, the more\\l\\n",
  "stuck I get...\\c\\n",
  "The powerful sticky string of a\\n",
  "Bug-type Pokémon...$",
]

[msg.section_0.entries.53]
text = [
  "Professor [VAR TRNAME(1)]: Please!\\n",
  "I don't mean to harm any of you!\\l\\n",
  "You've had your fun!\\l\\n",
  "I just want to get back to my own time!$",
]

[msg.section_0.entries.54]
text = [
  "Ledian: You think so?\\c\\n",
  "Unfortunately for you, I'll be the\\n",
  "judge of when I've had my fun...$",
]

[msg.section_0.entries.55]
text = [
  "Professor [VAR TRNAME(1)]: What more\\n",
  "do you want from me?$",
]

[msg.section_0.entries.56]
text = [
  "Ledian: Hee hee hee...\\c\\n",
  "(...We couldn't make a time machine with\\n",
  "our own technology, but if I could get my\\l\\n",
  "appendages on this Human's time machine,\\l\\n",
  "I'd be a hero...)$",
]

[msg.section_0.entries.57]
text = [
  "Professor [VAR TRNAME(1)]: Come on!\\n",
  "Say something!$",
]

[msg.section_0.entries.58]
text = [
  "Ledian: OK, then...\\c\\n",
  "(...If I can capture Humans from all the\\n",
  "different eras, we Bug-type Pokémon will\\l\\n",
  "prosper even more...)$",
]

[msg.section_0.entries.59]
text = [
  "Professor [VAR TRNAME(1)]: Stop!\\n",
  "Get away from my Bag!$",
]

[msg.section_0.entries.60]
text = [
  "Ledian: What's all this junk?\\n",
  "Dirt and rocks... Plant seeds...\\l\\n",
  "It's just a bunch of garbage!\\c\\n",
  "Hmm... What's this?\\n",
  "Looks like a Human Ball.\\c\\n",
  "Something's different, though...\\c\\n",
  "I've got it! Could this be...$",
]

[msg.section_0.entries.61]
text = [
  "Professor [VAR TRNAME(1)]: Oh no...\\n",
  "Not the temporal transport...$",
]

[msg.section_0.entries.62]
text = [
  "Ledian: Bingo! So, this is your time machine.\\n",
  "Temporal transport, you called it?\\c\\n",
  "Impressive to have fit it into a capsule\\n",
  "this small...$",
]

[msg.section_0.entries.63]
text = [
  "And so Ledian captured me and seized\\n",
  "my temporal transport.\\c\\n",
  "However, I would not give up so easily.\\n",
  "Not while I still needed to deliver these\\l\\n",
  "precious research samples back to my own\\l\\n",
  "time... I had to keep fighting.$",
]

[msg.section_0.entries.64]
text = [
  "Professor [VAR TRNAME(1)]: Argh... Urgh...$",
]

[msg.section_0.entries.65]
text = [
  "Ledian: Stupid, pathetic, helpless Human...\\n",
  "I'm starting to feel sorry for you, so I'll\\l\\n",
  "let you go...\\c\\n",
  "Entertain me by scampering away like the\\n",
  "cowardly fool you are.$",
]

[msg.section_0.entries.66]
text = [
  "Professor [VAR TRNAME(1)]: Eeek!$",
]

[msg.section_0.entries.67]
text = [
  "Ledian: Constantly eliminating Humans\\n",
  "like you gets old after a while...\\c\\n",
  "So I need to mix things up for a change of\\n",
  "pace, or else I'd get bored with my toys!$",
]

[msg.section_0.entries.68]
text = [
  "Somehow, I made it away with my life.\\n",
  "Afterward, I had to lie low by hiding inside\\l\\n",
  "caves and patches of tall grass in order to\\l\\n",
  "avoid the gaze of Pokémon who aimed to\\l\\n",
  "defeat or capture humans like me...$",
]

[msg.section_0.entries.69]
text = [
  "Sometimes I stop to think about the\\n",
  "Pokémon of my own time...how they must\\l\\n",
  "feel if they don't want to be caught...\\c\\n",
  "I'm in a constant state of fear and\\n",
  "unease, with never a moment's rest.\\l\\n",
  "This life is only pain and struggle...$",
]

[msg.section_0.entries.70]
text = [
  "Professor [VAR TRNAME(1)]: Ack! I went too far!$",
]

[msg.section_0.entries.71]
text = [
  "Ledian: What's this?\\n",
  "You've broken my Black Belt!\\c\\n",
  "Oh well, no great loss... I'll just have\\n",
  "to go catch another Human...$",
]

[msg.section_0.entries.72]
text = [
  "Professor [VAR TRNAME(1)]: Oh... Oh no...\\n",
  "It was an accident!\\l\\n",
  "How could I have done such a thing\\l\\n",
  "to a fellow human...$",
]

[msg.section_0.entries.73]
text = [
  "Ledian: You toys break too easily.\\n",
  "Hey, I know! I'll just catch you\\l\\n",
  "to replace that one! Human Ball, go!$",
]

[msg.section_0.entries.74]
text = [
  "I passed out from the shock of defeating\\n",
  "a fellow human. Ledian caught me, and\\l\\n",
  "I became one of her Humans.\\c\\n",
  "And then...$",
]

[msg.section_0.entries.75]
text = [
  "Ledian: [VAR TRNAME(1)], I choose you!\\n",
  "Hurry up and eliminate that Human!$",
]

[msg.section_0.entries.76]
text = [
  "Professor [VAR TRNAME(1)]: Groaarr!$",
]

[msg.section_0.entries.77]
text = [
  "Ledian: Good job, [VAR TRNAME(1)]!\\c\\n",
  "Hee hee hee... You've grown quite\\n",
  "strong, indeed!\\l\\n",
  "I'll treat you to a special grooming today!$",
]

[msg.section_0.entries.78]
text = [
  "Ledian could be very cruel, but she also\\n",
  "could be nice to Humans who pleased her.\\c\\n",
  "Over time, I gradually became more and\\n",
  "more loyal to Ledian...to the point that\\l\\n",
  "I would do anything to assist her...$",
]

[msg.section_0.entries.79]
text = [
  "A world where Humans are used and\\n",
  "controlled by Pokémon...\\c\\n",
  "If this is the reality of the future,\\n",
  "I have no choice but to accept it.\\c\\n",
  "Sometimes I wonder what became of\\n",
  "[VAR PKNICK(0)], who was my Pokémon\\l\\n",
  "in our own time...\\c\\n",
  "Are you out there having grand adventures\\n",
  "as a Trainer Pokémon?$",
]

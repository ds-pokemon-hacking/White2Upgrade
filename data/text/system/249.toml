[msg.section_0.entries.0]
text = [
  "Actress$",
]

[msg.section_0.entries.1]
text = [
  "Assistant$",
]

[msg.section_0.entries.2]
text = [
  "F-00: [VAR TRNAME(1)]...$",
]

[msg.section_0.entries.3]
text = [
  "[VAR TRNAME(1)]: F-00!\\c\\n",
  "I've got to repair you immediately!\\n",
  "You're in a very delicate state!\\l\\n",
  "Hurry and get back in your Ball!$",
]

[msg.section_0.entries.4]
text = [
  "F-00: [VAR TRNAME(1)]!$",
]

[msg.section_0.entries.5]
text = [
  "[VAR TRNAME(1)]: F-00...$",
]

[msg.section_0.entries.6]
text = [
  "F-00: [VAR TRNAME(1)]...\\c\\n",
  "THIS IS... THE END...$",
]

[msg.section_0.entries.7]
text = [
  "[VAR TRNAME(1)]: No, F-00! It'll be OK!\\c\\n",
  "Trust me! I promise I'll fix you right up!$",
]

[msg.section_0.entries.8]
text = [
  "F-00: THE END...\\c\\n",
  "Bleep bloop bop...\\c\\n",
  "THIS IS...THE END...\\n",
  "[VAR TRNAME(1)]...\\c\\n",
  "Bleep bloop bop... IT HURTS...\\c\\n",
  "PLEASE...HURRY...\\n",
  "PLEASE...DESTROY ME...$",
]

[msg.section_0.entries.9]
text = [
  "[VAR TRNAME(1)]: F-00...$",
]

[msg.section_0.entries.10]
text = [
  "F-00: IT HURTS...\\c\\n",
  "DESTROY...ME... Bleep bloop bop...\\n",
  "[VAR TRNAME(1)]...\\l\\n",
  "F-00... TOO DANGEROUS...\\c\\n",
  "DO NOT WANT...TO ATTACK...$",
]

[msg.section_0.entries.11]
text = [
  "Assistant: How could this be?\\c\\n",
  "Somehow, the F-00 is using its own willpower\\n",
  "to suppress its programming, which is\\l\\n",
  "malfunctioning to make it go berserk!\\c\\n",
  "That's impossible...\\c\\n",
  "Professor! You've got to stay back!\\n",
  "It's too dangerous!$",
]

[msg.section_0.entries.12]
text = [
  "[VAR TRNAME(1)]: F-00...$",
]

[msg.section_0.entries.13]
text = [
  "Assistant: Professor [VAR TRNAME(1)]!\\n",
  "Get a hold of yourself!$",
]

[msg.section_0.entries.14]
text = [
  "[VAR TRNAME(1)]: Why?!$",
]

[msg.section_0.entries.15]
text = [
  "Assistant: Look for yourself! The F-00\\n",
  "is in a highly unstable state!$",
]

[msg.section_0.entries.16]
text = [
  "[VAR TRNAME(1)]: Ughh...\\n",
  "F-00... Why?!$",
]

[msg.section_0.entries.17]
text = [
  "F-00: [VAR TRNAME(1)]...\\n",
  "I AM SORRY...\\c\\n",
  "I... I...\\n",
  "I DO NOT UNDERSTAND... WHAT AM I DOING...\\l\\n",
  "DO NOT UNDERSTAND... DO NOT UNDERSTAND...\\l\\n",
  "LOSING...CONTROL...$",
]

[msg.section_0.entries.18]
text = [
  "[VAR TRNAME(1)]: F-00...$",
]

[msg.section_0.entries.19]
text = [
  "F-00: [VAR TRNAME(1)]...\\c\\n",
  "DO NOT WANT...TO ATTACK...\\c\\n",
  "PLEASE... BEFORE TOO LATE...\\n",
  "DESTROY ME...$",
]

[msg.section_0.entries.20]
text = [
  "[VAR TRNAME(1)]: I couldn't...\\n",
  "I could never destroy you, F-00...$",
]

[msg.section_0.entries.21]
text = [
  "Assistant: Professor!\\c\\n",
  "The fact that the F-00 is still in control of\\n",
  "itself in this state is highly irregular!\\c\\n",
  "It could lose control at any moment!\\c\\n",
  "If that happens, there's no telling what\\n",
  "it will do!$",
]

[msg.section_0.entries.22]
text = [
  "[VAR TRNAME(1)]: I can't do it!$",
]

[msg.section_0.entries.23]
text = [
  "F-00: Bleep bloop bop...\\c\\n",
  "[VAR TRNAME(1)]... HURRY...\\c\\n",
  "PLEASE...$",
]

[msg.section_0.entries.24]
text = [
  "[VAR TRNAME(1)]: Wahhhhh!$",
]

[msg.section_0.entries.25]
text = [
  "F-00: [VAR TRNAME(1)]...\\n",
  "DO NOT CRY...\\c\\n",
  "...Bleep bloop bop...\\c\\n",
  "I LOVE... [VAR TRNAME(1)]...\\n",
  "PLEASE... HURRY... DESTROY ME...$",
]

[msg.section_0.entries.26]
text = [
  "[VAR TRNAME(1)]: F-00...$",
]

[msg.section_0.entries.27]
text = [
  "F-00: [VAR TRNAME(1)]...\\c\\n",
  "IT HURTS... HELP ME...\\c\\n",
  "HURRY... DESTROY ME...$",
]

[msg.section_0.entries.28]
text = [
  "[VAR TRNAME(1)]: No! I can't do it!$",
]

[msg.section_0.entries.29]
text = [
  "F-00: [VAR TRNAME(1)]...\\n",
  "THANK YOU...FOR EVERYTHING...$",
]

[msg.section_0.entries.30]
text = [
  "[VAR TRNAME(1)]: Sniffle...\\c\\n",
  "F-00... Are you sure?\\n",
  "Are you sure this is what you want?$",
]

[msg.section_0.entries.31]
text = [
  "F-00: [VAR TRNAME(1)]...\\c\\n",
  "F-00...AND [VAR TRNAME(1)]...\\c\\n",
  "WE ARE FRIENDS...\\c\\n",
  "FOREVER...$",
]

[msg.section_0.entries.32]
text = [
  "[VAR TRNAME(1)]: F-00...$",
]

[msg.section_0.entries.33]
text = [
  "Assistant: F-00...$",
]

[msg.section_0.entries.34]
text = [
  "[VAR TRNAME(1)]: Sniffle... Sniffle...$",
]

[msg.section_0.entries.35]
text = [
  "Assistant: Professor [VAR TRNAME(1)]...\\n",
  "You...\\c\\n",
  "You did the right thing...\\c\\n",
  "You had no choice...$",
]

[msg.section_0.entries.36]
text = [
  "[VAR TRNAME(1)]: Don't you try to cheer me up!\\c\\n",
  "I... The F-00... It's over...\\c\\n",
  "The F-00 was my creation! My own\\n",
  "special robot! The F-00 was my friend!\\l\\n",
  "To have destroyed it with my own hands...\\c\\n",
  "How can that be right?$",
]

[msg.section_0.entries.37]
text = [
  "Assistant: Professor...\\c\\n",
  "The F-00 had its memory erased and its\\n",
  "programming rewritten...\\c\\n",
  "In such a state, it could have gone\\n",
  "berserk and endangered us all at\\l\\n",
  "any moment...\\c\\n",
  "If the F-00's engine had overheated and\\n",
  "exploded, all of the research staff\\l\\n",
  "would have been in terrible danger...$",
]

[msg.section_0.entries.38]
text = [
  "[VAR TRNAME(1)]: I know that!\\c\\n",
  "That's exactly why I wanted to find\\n",
  "a way to repair the F-00!$",
]

[msg.section_0.entries.39]
text = [
  "Assistant: Professor...\\c\\n",
  "Science just doesn't work that way...\\n",
  "It doesn't exist for our convenience.\\c\\n",
  "When something is really broken, even if\\n",
  "it's a robot, it simply can't be repaired...\\c\\n",
  "The same goes for memory that's been\\n",
  "erased. It can't just be recovered...\\c\\n",
  "But still...\\c\\n",
  "Even though the F-00 had its memory erased,\\n",
  "it somehow retained something...\\c\\n",
  "It's as if...\\c\\n",
  "As if the F-00, deep down, was unable\\n",
  "to forget about you...\\c\\n",
  "The F-00 loved you, and that's why it\\n",
  "entrusted its final moments to you...$",
]

[msg.section_0.entries.40]
text = [
  "...\\c\\n",
  "Shortly afterward, I decided to leave\\n",
  "the laboratory...\\c\\n",
  "I went back to being a normal kid. I went\\n",
  "back to school and made lots of friends.$",
]

[msg.section_0.entries.41]
text = [
  "Many years later, after I was grown up, I\\n",
  "decided to take up robotics research again.\\c\\n",
  "I developed many new robots and\\n",
  "sent them out into the world.\\c\\n",
  "However, I was never able to create\\n",
  "another robot with a heart as human\\l\\n",
  "as my F-00's...\\c\\n",
  "My F-00...\\c\\n",
  "The F-00 saved me from myself. I was a dark\\n",
  "and cynical child, but the F-00 changed me.$",
]

[msg.section_0.entries.42]
text = [
  "[VAR TRNAME(1)]: F-00?$",
]

[msg.section_0.entries.43]
text = [
  "F-00: Beep... Bloop...$",
]

[msg.section_0.entries.44]
text = [
  "[VAR TRNAME(1)]: It's not moving...\\n",
  "Could it have run out of energy?$",
]

[msg.section_0.entries.45]
text = [
  "F-00: ...$",
]

[msg.section_0.entries.46]
text = [
  "[VAR TRNAME(1)]: Now's my chance!\\c\\n",
  "I can repair the F-00 now!$",
]

[msg.section_0.entries.47]
text = [
  "Assistant: No, Professor!\\n",
  "Stay away from it! It's too dangerous!$",
]

[msg.section_0.entries.48]
text = [
  "[VAR TRNAME(1)]: Don't worry, F-00...\\n",
  "I'm going to make you as good as new...$",
]

[msg.section_0.entries.49]
text = [
  "F-00: ...\\c\\n",
  "Bleep... Grrrrrr... Bzzzzzz!$",
]

[msg.section_0.entries.50]
text = [
  "[VAR TRNAME(1)]: Uh-oh!\\n",
  "It's still moving!\\c\\n",
  "Oh no! I'm not going to make it!$",
]

[msg.section_0.entries.51]
text = [
  "Assistant: Professor [VAR TRNAME(1)]! No!\\n",
  "Get out of there!$",
]

[msg.section_0.entries.52]
text = [
  "[VAR TRNAME(1)]: ...\\c\\n",
  "What...happened?$",
]

[msg.section_0.entries.53]
text = [
  "Assistant: Prof...Professor...\\c\\n",
  "Are...are you...OK?$",
]

[msg.section_0.entries.54]
text = [
  "[VAR TRNAME(1)]: You...\\n",
  "You...saved me...$",
]

[msg.section_0.entries.55]
text = [
  "Assistant: You...\\n",
  "You and the F-00...\\c\\n",
  "You...looked like...such...good friends...\\n",
  "Like...like siblings...\\c\\n",
  "...Gah!\\c\\n",
  "...But...you know what?\\n",
  "You're...a scientist...\\c\\n",
  "You...made...that robot...\\n",
  "It's...your...responsibility...\\c\\n",
  "You...need to...take responsibility...$",
]

[msg.section_0.entries.56]
text = [
  "[VAR TRNAME(1)]: Sniff...sniffle...\\c\\n",
  "Waahhhhh!$",
]

[msg.section_0.entries.57]
text = [
  "I don't remember much about what\\n",
  "happened next.\\c\\n",
  "When I came to my senses, the F-00 lay\\n",
  "motionless on the ground.\\c\\n",
  "I picked up my assistant and rushed\\n",
  "her to the hospital...\\c\\n",
  "The whole way, I thought about what she\\n",
  "had told me...\\c\\n",
  "About what my responsibility as a scientist\\n",
  "really meant...$",
]

[msg.section_0.entries.58]
text = [
  "[VAR TRNAME(1)]: It's no good...\\c\\n",
  "I just can't do it! I can't bring myself\\n",
  "to destroy the F-00!$",
]

[msg.section_0.entries.59]
text = [
  "F-00: Beep bloop bop bleep beeeep!$",
]

[msg.section_0.entries.60]
text = [
  "[VAR TRNAME(1)]: The F-00 is my friend!\\n",
  "My first and only friend! I can't do it...$",
]

[msg.section_0.entries.61]
text = [
  "Assistant: Professor [VAR TRNAME(1)]!\\n",
  "Get away from the F-00!$",
]

[msg.section_0.entries.62]
text = [
  "F-00: Beep bloop bop bleep beeeep!$",
]

[msg.section_0.entries.63]
text = [
  "[VAR TRNAME(1)]: Wahhhh!$",
]

[msg.section_0.entries.64]
text = [
  "Assistant: Professor!\\n",
  "Professor [VAR TRNAME(1)]!!$",
]

[msg.section_0.entries.65]
text = [
  "The F-00 went berserk and attacked me,\\n",
  "quickly knocking me unconscious...\\c\\n",
  "I learned afterward that the F-00, writhing\\n",
  "in pain, began to use its own strength\\l\\n",
  "to destroy itself, breaking its body\\l\\n",
  "into pieces...\\c\\n",
  "I didn't want to accept that the F-00\\n",
  "couldn't be saved, so I averted my\\l\\n",
  "eyes from the obvious truth that was\\l\\n",
  "in front of me...\\c\\n",
  "I couldn't save the F-00...\\c\\n",
  "I couldn't save my only friend...$",
]

[msg.section_0.entries.66]
text = [
  "F-00: Beep...\\n",
  "Beep bloop bop bleep beeeep!$",
]

[msg.section_0.entries.67]
text = [
  "[VAR TRNAME(1)]: F-00!$",
]

[msg.section_0.entries.68]
text = [
  "F-00: NO GOOD...\\n",
  "[VAR TRNAME(1)]...RUN...\\c\\n",
  "Beep bloop bop bleep beeeep!$",
]

[msg.section_0.entries.69]
text = [
  "[VAR TRNAME(1)]: Be strong, F-00!$",
]

[msg.section_0.entries.70]
text = [
  "F-00: Beep bloop bop bleep...$",
]

[msg.section_0.entries.71]
text = [
  "[VAR TRNAME(1)]: Is this the end?$",
]

[msg.section_0.entries.72]
text = [
  "F-00: Beep bloop bop bleep...$",
]

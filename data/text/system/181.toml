[msg.section_0.entries.26]
text = [
  "The [VAR PKNICK(0)] Girl: No way...$",
]

[msg.section_0.entries.27]
text = [
  "It was too much to witness people cheering\\n",
  "for Brycen-Man, the Masked Man\\l\\n",
  "of Reality and Phantasm.\\c\\n",
  "The [VAR PKNICK(0)] Girl lost all\\n",
  "her strength to fight...\\c\\n",
  "Cruel is the nature of battles...\\c\\n",
  "The split-second decisions determined\\n",
  "her fate as a heroine.\\c\\n",
  "Too bad, [VAR PKNICK(0)] Girl!\\c\\n",
  "Good-bye, [VAR PKNICK(0)] Girl!$",
]

[msg.section_0.entries.28]
text = [
  "Brycen-Man: Arrgh...\\c\\n",
  "For me to lose to a pathetic little girl\\n",
  "like you...\\c\\n",
  "How humiliating...\\n",

  "I have no use for such ideals...$",
]

[msg.section_0.entries.3]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "I will end you now, [VAR PKNICK(0)] Girl!$",
]

[msg.section_0.entries.4]
text = [
  "Brycen-Man: Go, my Pokémon!\\n",
  "Unleash your power!\\c\\n",
  "Destroy everything in this amusement park!$",
]

[msg.section_0.entries.5]
text = [
  "???: Hold it right there!$",
]

[msg.section_0.entries.6]
text = [
  "Brycen-Man: Wh-who are you?$",
]

[msg.section_0.entries.7]
text = [
  "???: The Messenger of Truths and Ideals,\\n",
  "the [VAR PKNICK(0)] Girl enters!\\c\\n",
  "Stop right there, Brycen-Man!\\c\\n",
  "I cannot allow your mischief!$",
]

[msg.section_0.entries.8]
text = [
  "Park Crowds: Hey, what's going on?\\n",
  "Is this one of those hero skits?$",
]

[msg.section_0.entries.9]
text = [
  "Brycen-Man: A single hit to KO\\n",
  "my Pokémon...\\l\\n",
  "You're pretty good, [VAR PKNICK(0)] Girl!\\c\\n",
  "Despite that, however...\\c\\n",
  "You will get down on your knees before me\\n",
  "when I end you with my dark, secret arts!\\c\\n",
  "Prepare to be finished!$",
]

[msg.section_0.entries.10]
text = [
  "The [VAR PKNICK(0)] Girl: Bring it on!$",
]

[msg.section_0.entries.11]
text = [
  "Brycen-Man: Well said!\\c\\n",
  "My dark, secret arts enter!\\n",
  "Take them and be gone!$",
]

[msg.section_0.entries.12]
text = [
  "The [VAR PKNICK(0)] Girl: I'm scared!$",
]

[msg.section_0.entries.13]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "How pitiful, [VAR PKNICK(0)] Girl!\\c\\n",
  "Why would I waste my secret arts\\n",
  "on someone like you?\\c\\n",
  "This should do it!$",
]

[msg.section_0.entries.14]
text = [
  "Brycen-Man: Mwahaha!\\c\\n",
  "That's your Pokémon's best shot?\\n",
  "How disappointing!\\c\\n",
  "I'm done play battling with you,\\n",
  "little girl!\\c\\n",
  "Enough! I must go now!$",
]

[msg.section_0.entries.15]
text = [
  "The [VAR PKNICK(0)] Girl: This isn't how\\n",
  "it's supposed to go...$",
]

[msg.section_0.entries.16]
text = [
  "Masked Man Brycen-Man walked\\n",
  "right through the [VAR PKNICK(0)] Girl...\\c\\n",
  "She played such an insignificant role\\n",
  "in this incident.\\c\\n",
  "No wonder nobody wants to find out\\n",
  "who she is...\\c\\n",
  "Having said that...\\c\\n",
  "Thank you, [VAR PKNICK(0)] Girl!\\c\\n",
  "Good-bye, [VAR PKNICK(0)] Girl!$",
]

[msg.section_0.entries.17]
text = [
  "Brycen-Man: Arrgh...\\c\\n",
  "Braving my secret arts to take out\\n",
  "my Pokémon with one hit...$",
]

[msg.section_0.entries.18]
text = [
  "The [VAR PKNICK(0)] Girl: Don't you get it,\\n",
  "Brycen-Man?!\\c\\n",
  "This is an amusement park filled with the\\n",
  "ideals of people!\\c\\n",
  "Be on your best behavior and go home!$",
]

[msg.section_0.entries.19]
text = [
  "Brycen-Man: Very well.\\n",
  "I shall pull back today.\\c\\n",
  "You may be the Messenger of\\n",
  "Truths and Ideals.\\c\\n",
  "But I am Brycen-Man, the Masked Man of\\n",
  "Reality and Phantasm.\\c\\n",
  "Mark my words, [VAR PKNICK(0)] Girl.$",
]

[msg.section_0.entries.20]
text = [
  "Park Crowds: Wow, she's\\n",
  "so cute!\\l\\n",
  "I love the [VAR PKNICK(0)] Girl!$",
]

[msg.section_0.entries.21]
text = [
  "The [VAR PKNICK(0)] Girl:\\n",
  "Brycen-Man, the Masked Man...\\l\\n",
  "What is he planning to do...?$",
]

[msg.section_0.entries.22]
text = [
  "Teaching Brycen-Man, the Masked Man,\\n",
  "a lesson, the [VAR PKNICK(0)] Girl saved\\l\\n",
  "the amusement park.\\c\\n",
  "Having spoken in a daring tone,\\n",
  "Brycen-Man disappeared into thin air...\\c\\n",
  "To protect the truths and ideals of Unova,\\n",
  "go on, [VAR PKNICK(0)] Girl!\\c\\n",
  "Fight on, [VAR PKNICK(0)] Girl!$",
]

[msg.section_0.entries.23]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "How silly of you, [VAR PKNICK(0)] Girl.\\c\\n",
  "You just missed the only chance\\n",
  "you had to defeat me!\\c\\n",
  "Go ahead and look around!$",
]

[msg.section_0.entries.24]
text = [
  "Park Crowds: Did you see that?\\n",
  "Look at him go! He's so cool!\\l\\n",
  "Brycen-Man, the Masked Man!$",
]

[msg.section_0.entries.25]
text = [
  "Brycen-Man: Mwahaha!\\n",
  "The crowds are so mesmerized by me!\\c\\n",
  "People don't want a pitiful heroine like you.\\n",
  "They need a Masked Man like me!$",

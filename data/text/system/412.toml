[msg.section_0.entries.0]
text = [
  "                                       $$",
]

[msg.section_0.entries.1]
text = [
  "                                     $$",
]

[msg.section_0.entries.2]
text = [
  "                                     $$",
]

[msg.section_0.entries.3]
text = [
  "Wha--? Why are you so quiet?\\n",
  "Hey! Are you scared? Ha ha!$",
]

[msg.section_0.entries.4]
text = [
  "...Clunk!\\n",
  "...CLANG! Rumble-rumble-rumble!$",
]

[msg.section_0.entries.5]
text = [
  "Eeeek! Let me off! It's gonna break!!\\n",
  "Daddy! Mommy! Save meee!$",
]

[msg.section_0.entries.6]
text = [
  "Oh! It's going higher and higher!\\n",
  "Boy...this takes me back...$",
]

[msg.section_0.entries.7]
text = [
  "Oh! Look at that over there!\\n",
  "It's absolutely stunning...$",
]

[msg.section_0.entries.8]
text = [
  "Wow... That's right...\\n",
  "It was like that then, too...$",
]

[msg.section_0.entries.9]
text = [
  "Phew... It's so muggy.\\n",
  "I shouldn't have worn my apron.$",
]

[msg.section_0.entries.10]
text = [
  "Sweat is making my clothes stick to me...\\n",
  "I'll be fine. Check out the scenery.$",
]

[msg.section_0.entries.11]
text = [
  "Yeeesh...\\n",
  "I'm completely drenched in sweat...$",
]

[msg.section_0.entries.12]
text = [
  "...Clunk!\\n",
  "...CLANG! Rumble-rumble-rumble!$",
]

[msg.section_0.entries.13]
text = [
  "Good grief! This ride is worn out...\\n",
  "I just don't get what's fun about this...$",
]

[msg.section_0.entries.14]
text = [
  "So bored... Well, this'll be the last\\n",
  "I'll see of this view for a while...$",
]

[msg.section_0.entries.15]
text = [
  "The look of the town doesn't change...\\n",
  "But I do, I guess...$",
]

[msg.section_0.entries.16]
text = [
  "Hee hee... My baby's kicking.\\n",
  "Maybe it's enjoying the view, too...$",
]

[msg.section_0.entries.17]
text = [
  "Hee hee hee... My little one\\n",
  "is sure moving. Must be having fun...$",
]

[msg.section_0.entries.18]
text = [
  "It was...two years ago...in summer.\\n",
  "I felt... It was...$",
]

[msg.section_0.entries.19]
text = [
  "Sniff... That's right...\\n",
  "I'm sure... But...$",
]

[msg.section_0.entries.20]
text = [
  "Said I like you... It was a lie!\\n",
  "It wasn't... Sniff...$",
]

[msg.section_0.entries.21]
text = [
  "I wonder if other people look at\\n",
  "us and think we're a couple.$",
]

[msg.section_0.entries.22]
text = [
  "Don't move from that spot.\\n",
  "Be still... Just like that...$",
]

[msg.section_0.entries.23]
text = [
  "Looking out the window seems dangerous.\\n",
  "Just look straight at me...$",
]

[msg.section_0.entries.24]
text = [
  "Footprints left on snow-covered ground\\n",
  "are all I have left to remember you by. ♪$",
]

[msg.section_0.entries.25]
text = [
  "Ghost, oh my Ghost-type daaarling...\\n",
  "You can't feel my Normal-type touch! ♪$",
]

[msg.section_0.entries.26]
text = [
  "We're finished. We've reached an impasse.\\n",
  "You're colder than a winter Froslass! ♪$",
]

[msg.section_0.entries.27]
text = [
  "Well, it's good to do something like\\n",
  "this and relax every now and again.$",
]

[msg.section_0.entries.28]
text = [
  "Wow! Awesome!\\n",
  "We're so high up!$",
]

[msg.section_0.entries.29]
text = [
  "Well...\\n",
  "That was kinda fun.$",
]

[msg.section_0.entries.30]
text = [
  "Huuuh? Was that...\\n",
  "Hmm... Maybe I got it wrong...$",
]

[msg.section_0.entries.31]
text = [
  "Wow!\\n",
  "This is sooo neat!!$",
]

[msg.section_0.entries.32]
text = [
  "Maybe...\\n",
  "I got a little overexcited.$",
]

[msg.section_0.entries.33]
text = [
  "[SPEED(1)]You...\\n",
  "remind me of that Trainer.[SPEED(0)]$",
]

[msg.section_0.entries.34]
text = [
  "[SPEED(1)]Now that I think about it,\\n",
  "we both rode this Ferris wheel, too.[SPEED(0)]$",
]

[msg.section_0.entries.35]
text = [
  "[SPEED(1)]Making dreams come true is hard...\\n",
  "I wonder if we will meet again...[SPEED(0)]$",
]

[msg.section_0.entries.36]
text = [
  "I don't really get what's so fun about\\n",
  "riding the Ferris wheel.$",
]

[msg.section_0.entries.37]
text = [
  "That's the Skyarrow Bridge, and\\n",
  "that's Pinwheel Forest over there.$",
]

[msg.section_0.entries.38]
text = [
  "Maybe I enjoyed that a little bit. I\\n",
  "guess I still need to work on having fun.$",
]

[msg.section_0.entries.39]
text = [
  "Ah. Umm...\\n",
  "I'm a little nervous for some reason...$",
]

[msg.section_0.entries.40]
text = [
  "It's strange...\\n",
  "Talking with you makes me feel so happy...$",
]

[msg.section_0.entries.41]
text = [
  "That's why I wanted to meet you\\n",
  "in person...and say thank you.$",
]

[msg.section_0.entries.42]
text = [
  "It's just the two of us.$",
]

[msg.section_0.entries.43]
text = [
  "When I'm with you,\\n",
  "I feel so relaxed somehow.$",
]

[msg.section_0.entries.44]
text = [
  "I can finally thank you!$",
]

[msg.section_0.entries.45]
text = [
  "I never get tired of this view.$",
]

[msg.section_0.entries.46]
text = [
  "Is it because I'm with you?$",
]

[msg.section_0.entries.47]
text = [
  "Aww...\\n",
  "It's over already...$",
]

[msg.section_0.entries.48]
text = [
  "The Unova region sure is pretty,\\n",
  "isn't it?$",
]

[msg.section_0.entries.49]
text = [
  "But it's not the only thing that's\\n",
  "pretty around here.$",
]

[msg.section_0.entries.50]
text = [
  "I wish the whole world could go slower.\\n",
  "This Ferris wheel... Time...$",
]

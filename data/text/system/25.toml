[msg]
trailing_data = "2020"

[msg.section_0.entries.0]
text = [
  "Turn on the C-Gear and\\n",
  "establish communications?$",
]

[msg.section_0.entries.1]
text = [
  "When communications are on, closing the\\n",
  "system will put it into Sleep Mode if the\\n",
  "battery is low. Please watch the battery.$",
]

[msg.section_0.entries.2]
text = [
  "Will you turn C-Gear off to stop\\n",
  "communications?$",
]

[msg.section_0.entries.3]
text = [
  "[COLOR(1)]Warning![COLOR(0)]\\n",
  "Please turn C-Gear off\\n",
  "in places--such as airplanes\\n",
  "and hospitals--where wireless\\n",
  "communications are prohibited.$",
]

[msg.section_0.entries.4]
text = [
  "C-Gear cannot be turned on.\\n",
  "Wireless communications are turned OFF.\\n",
  "Turn wireless communications ON in the\\n",
  "System Settings.\\n",
  "Error code: 50699$",
]

[msg.section_0.entries.5]
text = [
  "YES$",
]

[msg.section_0.entries.6]
text = [
  "NO$",
]

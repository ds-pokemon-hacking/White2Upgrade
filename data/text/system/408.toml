[msg.section_0.entries.0]
text = [
  "Which Pokémon are you going to use?\\n",
  "Let me see them now!\\c$",
]

[msg.section_0.entries.1]
text = [
  "It looks like you have\\n",
  "uncommon Pokémon!\\l\\n",
  "I look forward to this battle!\\c$",
]

[msg.section_0.entries.2]
text = [
  "With which Pokémon have you\\n",
  "made it this far?\\c\\n",
  "Don't tease me.\\n",
  "Just show me your Pokémon already!\\c$",
]

[msg.section_0.entries.3]
text = [
  "Oh, wow! Where did you catch\\n",
  "those Pokémon?\\c$",
]

[msg.section_0.entries.4]
text = [
  "I know those Pokémon.\\n",
  "I wanted to see uncommon Pokémon.\\c$",
]

[msg.section_0.entries.5]
text = [
  "I lost, but I'm satisfied, because I was\\n",
  "able to battle against such\\l\\n",
  "awesome Pokémon!\\c$",
]

[msg.section_0.entries.6]
text = [
  "Next time, please come with even\\n",
  "more uncommon Pokémon!\\c$",
]

[msg.section_0.entries.7]
text = [
  "It's the very exciting Trainer with the\\n",
  "specially picked Pokémon. Come on in!\\c$",
]

[msg.section_0.entries.8]
text = [
  "Whoa! I didn't expect to battle with\\n",
  "such a strong-looking Trainer like you\\l\\n",
  "so soon!\\c$",
]

[msg.section_0.entries.9]
text = [
  "You don't look like an ordinary Trainer!\\n",
  "But, I won't lose easily, either!\\c$",
]

[msg.section_0.entries.10]
text = [
  "Whoa! You look very strong!\\c\\n",
  "This is the final battle...\\n",
  "I... I won't lose!\\c$",
]

[msg.section_0.entries.11]
text = [
  "Argh! I lost!\\n",
  "I couldn't do much at all!\\c$",
]

[msg.section_0.entries.12]
text = [
  "I won...?\\n",
  "I'm quite good, too!\\c$",
]

[msg.section_0.entries.13]
text = [
  "When such a strong Trainer shows up,\\n",
  "I don't stand a chance...\\c$",
]

[msg.section_0.entries.14]
text = [
  "You weren't that strong.\\n",
  "You just looked strong!\\c$",
]

[msg.section_0.entries.15]
text = [
  "His potential has no limits!\\n",
  "Please welcome the up-and-coming star!\\c$",
]

[msg.section_0.entries.16]
text = [
  "Pokémon are my friends!\\n",
  "Take our friendship attack!\\c$",
]

[msg.section_0.entries.17]
text = [
  "I played with my Pokémon and\\n",
  "built a strong friendship with them.\\l\\n",
  "I'll demonstrate it to you!\\c$",
]

[msg.section_0.entries.18]
text = [
  "I've come this far by the friendship\\n",
  "power with my Pokémon.\\c\\n",
  "No enemy can stand in front of\\n",
  "our strong bonds!\\c$",
]

[msg.section_0.entries.19]
text = [
  "You're also very close to your Pokémon.\\n",
  "You and your Pokémon are in total sync!\\c$",
]

[msg.section_0.entries.20]
text = [
  "Did you see that?\\n",
  "That is our friendship power!\\c$",
]

[msg.section_0.entries.21]
text = [
  "My friends did their best,\\n",
  "but we're no match for you!\\c$",
]

[msg.section_0.entries.22]
text = [
  "With such poor cooperation,\\n",
  "you won't be able to beat us!\\c$",
]

[msg.section_0.entries.23]
text = [
  "Pokémon are his best friends!\\n",
  "Join forces and fight!\\c$",
]

[msg.section_0.entries.24]
text = [
  "There are so many spectators!\\n",
  "I'm getting excited! Here I come!\\c$",
]

[msg.section_0.entries.25]
text = [
  "We're really lucky to be able to fight\\n",
  "and get so much applause!\\c$",
]

[msg.section_0.entries.26]
text = [
  "Everyone is looking forward to the battle\\n",
  "between you and me!\\c\\n",
  "We can't have a pathetic battle!\\c$",
]

[msg.section_0.entries.27]
text = [
  "It was a good battle!\\n",
  "The spectators are also very excited!\\c$",
]

[msg.section_0.entries.28]
text = [
  "...I wish we could've had a more\\n",
  "intense battle.\\c$",
]

[msg.section_0.entries.29]
text = [
  "I wanted to have a battle like this.\\n",
  "It was fun. Thank you!\\c$",
]

[msg.section_0.entries.30]
text = [
  "It was a bit disappointing.\\n",
  "Hone your skills and come back again!\\c$",
]

[msg.section_0.entries.31]
text = [
  "With much applause, the familiar\\n",
  "contender is entering the arena!\\c$",
]

[msg.section_0.entries.32]
text = [
  "Yep! I made up my mind!\\n",
  "I'll battle with my usual strategy!\\c$",
]

[msg.section_0.entries.33]
text = [
  "I see.\\n",
  "It looks like you're a tough opponent!\\l\\n",
  "OK. I'll use Plan B!\\c$",
]

[msg.section_0.entries.34]
text = [
  "It just hit me!\\c\\n",
  "I don't think I'll lose\\n",
  "with this strategy!\\c\\n",
  "Let's battle!\\c$",
]

[msg.section_0.entries.35]
text = [
  "I was not prepared for\\n",
  "your unexpected attack!\\c$",
]

[msg.section_0.entries.36]
text = [
  "Just as I planned!\\n",
  "Ha ha! I won!\\c$",
]

[msg.section_0.entries.37]
text = [
  "The way you battle is impressive!\\n",
  "I learned a lot from you!\\c$",
]

[msg.section_0.entries.38]
text = [
  "I think you should think about\\n",
  "the way you battle more carefully.\\c$",
]

[msg.section_0.entries.39]
text = [
  "The much-talked-about, smart Trainer!\\n",
  "What kind of strategy will he use today?\\c$",
]

[msg.section_0.entries.40]
text = [
  "I love battles more than meals.\\n",
  "Let's battle!\\c$",
]

[msg.section_0.entries.41]
text = [
  "You look quite tough, too!\\n",
  "Let's have the most fun battle!\\c$",
]

[msg.section_0.entries.42]
text = [
  "It was such a happy day to be able\\n",
  "to have so many battles.\\c\\n",
  "Let's have the big final battle!\\c$",
]

[msg.section_0.entries.43]
text = [
  "This is a Pokémon battle!\\n",
  "That's how a battle should be!\\c$",
]

[msg.section_0.entries.44]
text = [
  "I won!\\n",
  "Heh heh! Let's battle again!\\c$",
]

[msg.section_0.entries.45]
text = [
  "Heh heh! I want to battle with you\\n",
  "in another tournament, too!\\c$",
]

[msg.section_0.entries.46]
text = [
  "Next time, bring a little bit\\n",
  "stronger Pokémon!\\c$",
]

[msg.section_0.entries.47]
text = [
  "This man! He's looking for battle\\n",
  "opponents from morning until night!\\c$",
]

[msg.section_0.entries.48]
text = [
  "I'll show my overwhelming power\\n",
  "to everyone!\\c$",
]

[msg.section_0.entries.49]
text = [
  "I'll heat up this arena with my battle!\\n",
  "Everyone, get warmed up!\\c$",
]

[msg.section_0.entries.50]
text = [
  "So many people are watching\\n",
  "our battle!\\c\\n",
  "Let's make this arena the best,\\n",
  "hottest, most intense stage!\\c$",
]

[msg.section_0.entries.51]
text = [
  "Your Pokémon are incredible...\\n",
  "I was mesmerized by them!\\c$",
]

[msg.section_0.entries.52]
text = [
  "How about that?!\\n",
  "My Pokémon are great, huh?\\c$",
]

[msg.section_0.entries.53]
text = [
  "You beat me.\\n",
  "I look forward to your great success!\\c$",
]

[msg.section_0.entries.54]
text = [
  "The spectators are also excited!\\n",
  "I was able to have the best battle!\\c$",
]

[msg.section_0.entries.55]
text = [
  "Show us a battle that shakes\\n",
  "our spirits!\\c$",
]

[msg.section_0.entries.56]
text = [
  "You look quite strong, too!\\n",
  "Ha ha! It's getting interesting!\\c$",
]

[msg.section_0.entries.57]
text = [
  "I can meet strong opponents\\n",
  "one after another.\\c\\n",
  "That is the essence of\\n",
  "the tournament!\\c\\n",
  "Let's have the best battle!\\c$",
]

[msg.section_0.entries.58]
text = [
  "Being able to battle with you,\\n",
  "the best Trainer, in the best stage...\\c\\n",
  "Ah! I'm really happy right now!\\c$",
]

[msg.section_0.entries.59]
text = [
  "Oh! This is my first time battling\\n",
  "against such a strong opponent!\\c$",
]

[msg.section_0.entries.60]
text = [
  "Ha ha ha! I won.\\n",
  "It was so close!\\c$",
]

[msg.section_0.entries.61]
text = [
  "Your attack was great!\\n",
  "Let's battle again sometime!\\c$",
]

[msg.section_0.entries.62]
text = [
  "The way you battle was not bad.\\n",
  "Try again!\\c$",
]

[msg.section_0.entries.63]
text = [
  "He wants to battle strong opponents!\\n",
  "That is his only wish!\\c$",
]

[msg.section_0.entries.64]
text = [
  "Ha ha! My Pokémon's smile is priceless!\\n",
  "Battle with them!\\c$",
]

[msg.section_0.entries.65]
text = [
  "You want to see my charming Pokémon,\\n",
  "don't you?\\l\\n",
  "Enjoy them as much as you like.\\c$",
]

[msg.section_0.entries.66]
text = [
  "At last, the final battle!\\c\\n",
  "With my Pokémon's cuteness,\\n",
  "you'll be on your knees.\\c\\n",
  "C'mon! My babies!\\c$",
]

[msg.section_0.entries.67]
text = [
  "Ah! What did you do\\n",
  "to my dear Pokémon?!\\c$",
]

[msg.section_0.entries.68]
text = [
  "My dear Pokémon.\\n",
  "Well done!\\c$",
]

[msg.section_0.entries.69]
text = [
  "Huh? Your Pokémon are also\\n",
  "quite adorable!\\c$",
]

[msg.section_0.entries.70]
text = [
  "He he! The spectators are\\n",
  "enchanted by my dear Pokémon!\\c$",
]

[msg.section_0.entries.71]
text = [
  "This man will keep fighting with\\n",
  "his abundant love for his Pokémon!\\c$",
]

[msg.section_0.entries.72]
text = [
  "Let's go all out, but fight fairly!\\c$",
]

[msg.section_0.entries.73]
text = [
  "You have great eyes!\\n",
  "I feel I can have a fair battle with you!\\c$",
]

[msg.section_0.entries.74]
text = [
  "This is the final battle!\\c\\n",
  "Let's go all out, but openly and\\n",
  "squarely, and settle this!\\c$",
]

[msg.section_0.entries.75]
text = [
  "It was a crystal-clear, fair battle!\\c$",
]

[msg.section_0.entries.76]
text = [
  "It seems we're just a little bit stronger.\\c$",
]

[msg.section_0.entries.77]
text = [
  "Thank you very much for\\n",
  "battling me squarely!\\c$",
]

[msg.section_0.entries.78]
text = [
  "It was a close battle!\\n",
  "I don't know what will happen next time!\\c$",
]

[msg.section_0.entries.79]
text = [
  "This Trainer is known for his fair play!\\n",
  "He hates unfair things!\\c$",
]

[msg.section_0.entries.80]
text = [
  "Wow! There are so many spectators.\\n",
  "I'm a bit embarrassed, but battle me!\\c$",
]

[msg.section_0.entries.81]
text = [
  "It's incredible to be able to battle\\n",
  "in front of so many people!\\l\\n",
  "Let's reveal our Pokémon!\\c$",
]

[msg.section_0.entries.82]
text = [
  "As you'd expect of the final battle,\\n",
  "there are tons of people!\\c\\n",
  "My legs started trembling.\\n",
  "I wonder if I can battle well.\\c$",
]

[msg.section_0.entries.83]
text = [
  "Ahhhh! I couldn't battle well,\\n",
  "because I was too nervous!\\c$",
]

[msg.section_0.entries.84]
text = [
  "Could it be... I won?\\n",
  "All right! Yay!\\c$",
]

[msg.section_0.entries.85]
text = [
  "You're incredible, because you can\\n",
  "battle well even in front of\\l\\n",
  "so many people!\\c$",
]

[msg.section_0.entries.86]
text = [
  "Wow! What great cheers!\\n",
  "Thank you, everyone!\\c$",
]

[msg.section_0.entries.87]
text = [
  "A new girl Trainer!\\n",
  "Have the courage, and come on out!\\c$",
]

[msg.section_0.entries.88]
text = [
  "I brought various Pokémon. ♪\\n",
  "Play with me a lot!\\c$",
]

[msg.section_0.entries.89]
text = [
  "I still want to play more!\\c\\n",
  "What kinds of Pokémon will\\n",
  "you use while we play?\\c$",
]

[msg.section_0.entries.90]
text = [
  "I love Pokémon battles\\n",
  "more than playing house. ♪\\c\\n",
  "I have great Pokémon, don't I?\\n",
  "Hurry up and play!\\c$",
]

[msg.section_0.entries.91]
text = [
  "I lost. But thank you!\\n",
  "It was so much fun!\\c$",
]

[msg.section_0.entries.92]
text = [
  "Ahhhh! Is it over already?!\\n",
  "That's no fun!\\c$",
]

[msg.section_0.entries.93]
text = [
  "Play with me again!\\n",
  "Promise me!\\c$",
]

[msg.section_0.entries.94]
text = [
  "I wanted to play more!\\n",
  "It ended too soon!\\c$",
]

[msg.section_0.entries.95]
text = [
  "She's always with her Pokémon!\\n",
  "Let her play with a Pokémon battle!\\c$",
]

[msg.section_0.entries.96]
text = [
  "My Pokémon are unbeatable!\\n",
  "They won't lose!\\c$",
]

[msg.section_0.entries.97]
text = [
  "My Pokémon are the best!\\c\\n",
  "They won't lose no matter what kind of\\n",
  "Pokémon you have!\\c$",
]

[msg.section_0.entries.98]
text = [
  "I've raised a lot of Pokémon\\n",
  "and made them learn cool moves, too!\\c\\n",
  "I'll win the tournament!\\c$",
]

[msg.section_0.entries.99]
text = [
  "Why?\\n",
  "My unbeatable Pokémon...\\c$",
]

[msg.section_0.entries.100]
text = [
  "Did you see them?\\n",
  "My Pokémon are great, aren't they?\\c$",
]

[msg.section_0.entries.101]
text = [
  "They just didn't feel well!\\n",
  "Usually they are much much stronger!\\c$",
]

[msg.section_0.entries.102]
text = [
  "They're great, aren't they?\\n",
  "I won't lose to anyone!\\c$",
]

[msg.section_0.entries.103]
text = [
  "She's confident about Pokémon battles?!\\n",
  "Come on! Let us see your power!\\c$",
]

[msg.section_0.entries.104]
text = [
  "I'll win the tournament with the Pokémon\\n",
  "that I worked hard to get!\\c$",
]

[msg.section_0.entries.105]
text = [
  "I knew this Pokémon was strong!\\c\\n",
  "I didn't spend days and days to find\\n",
  "and catch it for nothing.\\c$",
]

[msg.section_0.entries.106]
text = [
  "Even on rainy and windy days,\\n",
  "I pursued this Pokémon tirelessly.\\c\\n",
  "I'll be the best with this Pokémon!\\c$",
]

[msg.section_0.entries.107]
text = [
  "What?\\n",
  "Why did this Pokémon lose?\\c$",
]

[msg.section_0.entries.108]
text = [
  "Yes! I knew it.\\n",
  "This Pokémon is the strongest!\\c$",
]

[msg.section_0.entries.109]
text = [
  "I'll come back after raising Pokémon\\n",
  "more seriously.\\c$",
]

[msg.section_0.entries.110]
text = [
  "Tee hee. I feel I found\\n",
  "the Pokémon of my destiny.\\c$",
]

[msg.section_0.entries.111]
text = [
  "She entered this tournament\\n",
  "with new Pokémon!\\c\\n",
  "Which Pokémon will she use?!\\c$",
]

[msg.section_0.entries.112]
text = [
  "If you get scared, it's OK to run.\\n",
  "Don't push yourself. Just surrender!\\c$",
]

[msg.section_0.entries.113]
text = [
  "Tee hee. I'll win with\\n",
  "my overwhelming power.\\c\\n",
  "If you want to run away, now is the time!\\c$",
]

[msg.section_0.entries.114]
text = [
  "My opponents in the first and second\\n",
  "rounds both surrendered!\\c\\n",
  "I'll show my overwhelming power\\n",
  "to you, too!!\\c$",
]

[msg.section_0.entries.115]
text = [
  "Whoa! Please wait!\\n",
  "You... You've got me.\\c$",
]

[msg.section_0.entries.116]
text = [
  "Tee hee! I showed you the difference of\\n",
  "ability between you and me!\\c$",
]

[msg.section_0.entries.117]
text = [
  "[VAR TRNAME(0)]... I didn't know such a\\n",
  "strong Trainer was in this tournament...\\c$",
]

[msg.section_0.entries.118]
text = [
  "You're unlucky that you had to battle\\n",
  "against me!\\c$",
]

[msg.section_0.entries.119]
text = [
  "Finally, her turn has come!\\n",
  "Her skills are not just for show!\\c$",
]

[msg.section_0.entries.120]
text = [
  "Hmm... I wonder what kind of strategy\\n",
  "you're going to use?\\c$",
]

[msg.section_0.entries.121]
text = [
  "Battling with a total stranger is fun,\\n",
  "because you don't know\\l\\n",
  "what will happen. Here I come!\\c$",
]

[msg.section_0.entries.122]
text = [
  "You've also made it this far.\\n",
  "It looks like you have an audacious\\l\\n",
  "plan up your sleeve...\\c\\n",
  "All right.\\n",
  "I'll anticipate your every move!\\c$",
]

[msg.section_0.entries.123]
text = [
  "I just couldn't read your attack\\n",
  "at all...\\c$",
]

[msg.section_0.entries.124]
text = [
  "Right on! Your attack was just\\n",
  "as I predicted!\\c$",
]

[msg.section_0.entries.125]
text = [
  "I didn't see that coming there...\\n",
  "The way you battle is incredible!\\c$",
]

[msg.section_0.entries.126]
text = [
  "Plan your strategy a little bit more.\\c\\n",
  "Otherwise, your opponent will anticipate\\n",
  "your actions.\\c$",
]

[msg.section_0.entries.127]
text = [
  "She's really good at mind games!\\n",
  "You can't hide anything from her!\\c$",
]

[msg.section_0.entries.128]
text = [
  "I'll send your Pokémon flying\\n",
  "with my extraordinary attack!\\c$",
]

[msg.section_0.entries.129]
text = [
  "I want to get a kick out of\\n",
  "sending your Pokémon flying!\\c\\n",
  "Let's have a good fight!\\c$",
]

[msg.section_0.entries.130]
text = [
  "You've made it this far. Well done!\\c\\n",
  "I'll send your Pokémon flying\\n",
  "to the edge of Unova!\\c$",
]

[msg.section_0.entries.131]
text = [
  "Eek! You sent my Pokémon flying!\\c$",
]

[msg.section_0.entries.132]
text = [
  "No one is a match for me!\\n",
  "Ah! I feel great!\\c$",
]

[msg.section_0.entries.133]
text = [
  "You beat me so spectacularly,\\n",
  "which strangely makes me feel great!\\c$",
]

[msg.section_0.entries.134]
text = [
  "Hee hee! You won't beat me\\n",
  "unless you train your Pokémon\\l\\n",
  "even harder!\\c$",
]

[msg.section_0.entries.135]
text = [
  "Come in, powerful Trainer!\\n",
  "Their attack will break even a rock!\\c$",
]

[msg.section_0.entries.136]
text = [
  "My thought-out strategy is\\n",
  "my biggest weapon!\\c$",
]

[msg.section_0.entries.137]
text = [
  "No matter what kind of attack you\\n",
  "choose, you won't beat my strategy!\\c$",
]

[msg.section_0.entries.138]
text = [
  "I've thought about how to make my\\n",
  "Pokémon battle from morning until night.\\c\\n",
  "The way I battle is the result of that!\\c$",
]

[msg.section_0.entries.139]
text = [
  "What? You outsmarted me?!\\n",
  "What a smart Trainer!\\c$",
]

[msg.section_0.entries.140]
text = [
  "You fell for my trick.\\n",
  "This is how I battle!\\c$",
]

[msg.section_0.entries.141]
text = [
  "No, you're not just smart...\\c\\n",
  "Your passion to beat my strategy\\n",
  "was very impressive, too!\\c$",
]

[msg.section_0.entries.142]
text = [
  "Well, I refine my strategy\\n",
  "by winning like this!\\c$",
]

[msg.section_0.entries.143]
text = [
  "Pokémon tactician! What kind of\\n",
  "tactic is she going to use today?\\c$",
]

[msg.section_0.entries.144]
text = [
  "Watch! These are my best\\n",
  "partner Pokémon!\\c$",
]

[msg.section_0.entries.145]
text = [
  "I finally raised Pokémon with which\\n",
  "I can battle with confidence.\\c\\n",
  "You have no chance to win!\\c$",
]

[msg.section_0.entries.146]
text = [
  "You have no idea how hard it was\\n",
  "to raise my Pokémon to this level.\\c\\n",
  "These are my best partners.\\n",
  "Let's have a battle!\\c$",
]

[msg.section_0.entries.147]
text = [
  "Ha ha ha...\\n",
  "There's always someone better...\\c$",
]

[msg.section_0.entries.148]
text = [
  "He he! With these Pokémon,\\n",
  "I'm confident that I won't lose to anybody.\\c$",
]

[msg.section_0.entries.149]
text = [
  "Raising Pokémon is endlessly complex!\\c$",
]

[msg.section_0.entries.150]
text = [
  "Is that all? You'll never be able to beat\\n",
  "my partners like that!\\c$",
]

[msg.section_0.entries.151]
text = [
  "She's come here with her\\n",
  "ideal Pokémon!\\c$",
]

[msg.section_0.entries.152]
text = [
  "I can never stop my excitement\\n",
  "before a Pokémon battle.\\c$",
]

[msg.section_0.entries.153]
text = [
  "So, you're my next opponent!\\c\\n",
  "I'm starting to get excited!\\n",
  "I wonder what kind of battle it will be.\\c$",
]

[msg.section_0.entries.154]
text = [
  "At last, this is the final battle!\\n",
  "I feel my heart beat faster!\\c\\n",
  "Let's battle. I won't forgive you\\n",
  "if you go easy on me!\\c$",
]

[msg.section_0.entries.155]
text = [
  "I can't get enough of such\\n",
  "fun battles!\\c$",
]

[msg.section_0.entries.156]
text = [
  "Phew! Until the last moment,\\n",
  "I couldn't relax a bit.\\c$",
]

[msg.section_0.entries.157]
text = [
  "Thank you very much for making\\n",
  "me so excited!\\c$",
]

[msg.section_0.entries.158]
text = [
  "The tournament is fun because we\\n",
  "can have this kind of battle, right?\\c$",
]

[msg.section_0.entries.159]
text = [
  "The energetic and exciting Trainer!\\n",
  "She'll fight with a smile!\\c$",
]

[msg.section_0.entries.160]
text = [
  "I've made efforts for this day.\\n",
  "I'll show you the fruits of my practice!\\c$",
]

[msg.section_0.entries.161]
text = [
  "I've practiced every day to win\\n",
  "this tournament!\\c\\n",
  "I won't lose at any cost!\\c$",
]

[msg.section_0.entries.162]
text = [
  "We've had intense training\\n",
  "to be the Champion!\\c\\n",
  "No matter what kind of Pokémon you use,\\n",
  "we won't lose!\\c$",
]

[msg.section_0.entries.163]
text = [
  "Did I lose...?\\n",
  "Argh... You're too strong...\\c$",
]

[msg.section_0.entries.164]
text = [
  "Easy breezy!\\n",
  "My practice paid off.\\c$",
]

[msg.section_0.entries.165]
text = [
  "...I'll practice even more,\\n",
  "and someday I'll be better than you!\\c$",
]

[msg.section_0.entries.166]
text = [
  "Hmmm.\\n",
  "You haven't practiced much, have you?\\c$",
]

[msg.section_0.entries.167]
text = [
  "He practices every single day!\\n",
  "Here is a man of efforts!\\c$",
]

[msg.section_0.entries.168]
text = [
  "I'll show you in this tournament that\\n",
  "my Pokémon are the best in the world.\\c$",
]

[msg.section_0.entries.169]
text = [
  "Whichever Pokémon comes,\\n",
  "my Pokémon won't lose!\\c\\n",
  "That's because they are the strongest\\n",
  "in the world!\\c$",
]

[msg.section_0.entries.170]
text = [
  "Only one person can reach the top!\\n",
  "And...it's not you!\\c\\n",
  "It's me, because I have\\n",
  "the world's best Pokémon!\\c$",
]

[msg.section_0.entries.171]
text = [
  "It's not my Pokémon's fault.\\n",
  "It's my fault.\\c$",
]

[msg.section_0.entries.172]
text = [
  "He he!\\n",
  "Did you struggle a bit?\\c$",
]

[msg.section_0.entries.173]
text = [
  "I'll train again with my Pokémon!\\c$",
]

[msg.section_0.entries.174]
text = [
  "Don't be ashamed.\\n",
  "My Pokémon are too strong!\\c$",
]

[msg.section_0.entries.175]
text = [
  "He keeps running to reach the top.\\n",
  "He claims to be the world's best!\\c$",
]

[msg.section_0.entries.176]
text = [
  "The stronger one will win...\\n",
  "It's that simple. Here I come!\\c$",
]

[msg.section_0.entries.177]
text = [
  "I don't need a strategy!\\c\\n",
  "Even if we think a lot,\\n",
  "only the stronger one will win!\\c$",
]

[msg.section_0.entries.178]
text = [
  "Don't think deeply!\\c\\n",
  "The strongest Trainer will be\\n",
  "the Champion!\\c\\n",
  "That's it! Here I come!\\c$",
]

[msg.section_0.entries.179]
text = [
  "You were stronger!\\n",
  "I hate to admit it, but it's a fact!\\c$",
]

[msg.section_0.entries.180]
text = [
  "You tackled me head-on!\\n",
  "It was not a bad battle!\\c$",
]

[msg.section_0.entries.181]
text = [
  "Move forward without thinking!\\n",
  "You can go further and further.\\c$",
]

[msg.section_0.entries.182]
text = [
  "Battle is like this!\\n",
  "Make an effort and get stronger!\\c$",
]

[msg.section_0.entries.183]
text = [
  "He only believes in strength!\\n",
  "How far can he go?!\\c$",
]

[msg.section_0.entries.184]
text = [
  "If I focus and make no mistakes,\\n",
  "I'll win for sure!\\c$",
]

[msg.section_0.entries.185]
text = [
  "The enemy is inside of me...\\n",
  "Sharpen my mind...\\l\\n",
  "Battle perfectly, without any mistakes!\\c$",
]

[msg.section_0.entries.186]
text = [
  "I haven't made any mistakes so far.\\n",
  "I've been able to focus!\\c\\n",
  "I'll have a perfect battle\\n",
  "and win the tournament!\\c$",
]

[msg.section_0.entries.187]
text = [
  "It can't be! Why?!\\n",
  "I don't think I made any mistakes!\\c$",
]

[msg.section_0.entries.188]
text = [
  "It was a perfect victory.\\n",
  "Phew. I'm so glad...\\c$",
]

[msg.section_0.entries.189]
text = [
  "Did I lose because I didn't\\n",
  "observe you well...?\\c$",
]

[msg.section_0.entries.190]
text = [
  "Mistakes are scary...\\n",
  "You miss the chance to win.\\c$",
]

[msg.section_0.entries.191]
text = [
  "He's a perfect Trainer!\\n",
  "He carries out everything as he planned!\\c$",
]

[msg.section_0.entries.192]
text = [
  "I'll show you the difference\\n",
  "in experience!\\c$",
]

[msg.section_0.entries.193]
text = [
  "I'll put everything I've learned\\n",
  "so far as a Trainer into this battle!\\c$",
]

[msg.section_0.entries.194]
text = [
  "This hot match!\\n",
  "What counts in the end\\l\\n",
  "is the built-up experience!\\c\\n",
  "I'll teach you that!\\c$",
]

[msg.section_0.entries.195]
text = [
  "It can't be! I can't believe\\n",
  "that my experience didn't matter!\\c$",
]

[msg.section_0.entries.196]
text = [
  "How about that?!\\n",
  "That is the difference in experience!\\c$",
]

[msg.section_0.entries.197]
text = [
  "You... You must have overcome\\n",
  "a lot of terrible experiences!\\c$",
]

[msg.section_0.entries.198]
text = [
  "Have further training, and\\n",
  "come back again!\\c$",
]

[msg.section_0.entries.199]
text = [
  "He's very experienced!\\n",
  "Finally, the star Trainer's turn!\\c$",
]

[msg.section_0.entries.200]
text = [
  "I want to win for people\\n",
  "who cheer for me!\\c$",
]

[msg.section_0.entries.201]
text = [
  "Support of people in the arena will\\n",
  "give power to my Pokémon and me!\\c\\n",
  "I can't lose!\\c$",
]

[msg.section_0.entries.202]
text = [
  "If I win the tournament,\\n",
  "people who cheer for me\\l\\n",
  "will be pleased!\\c\\n",
  "I must win at all costs!\\c$",
]

[msg.section_0.entries.203]
text = [
  "I lost.\\n",
  "Eek. Sorry, everyone!\\c$",
]

[msg.section_0.entries.204]
text = [
  "Cheers of people in the arena\\n",
  "gave me support during hard times!\\c$",
]

[msg.section_0.entries.205]
text = [
  "First of all, Trainers have to cheer for\\n",
  "their own Pokémon!\\c$",
]

[msg.section_0.entries.206]
text = [
  "Tee hee hee!\\n",
  "Thank you for your support!\\c$",
]

[msg.section_0.entries.207]
text = [
  "Her battle mesmerizes everyone!\\n",
  "Yeah! Our favorite girl, come on in!\\c$",
]

[msg.section_0.entries.208]
text = [
  "I yield to no one when it comes to\\n",
  "my affection for Pokémon.\\c$",
]

[msg.section_0.entries.209]
text = [
  "I came here with my favorite Pokémon.\\n",
  "I can't lose!\\c$",
]

[msg.section_0.entries.210]
text = [
  "There is something I don't want to lose\\n",
  "to anyone.\\c\\n",
  "That's my affection for my Pokémon!\\c\\n",
  "Yes! Let's battle!\\c$",
]

[msg.section_0.entries.211]
text = [
  "I'm frustrated that I lost...\\n",
  "But you also love Pokémon!\\c$",
]

[msg.section_0.entries.212]
text = [
  "Yay! ♪\\n",
  "Ha ha ha! I love all of my Pokémon!\\c$",
]

[msg.section_0.entries.213]
text = [
  "I won't lose next time!\\n",
  "I will do some special training\\l\\n",
  "with the Pokémon I love!\\c$",
]

[msg.section_0.entries.214]
text = [
  "I felt your affection for Pokémon\\n",
  "very much!\\l\\n",
  "Yes, it was really a good battle!\\c$",
]

[msg.section_0.entries.215]
text = [
  "Love. That is a bond with Pokémon!\\n",
  "Show us your love for Pokémon!\\c$",
]

[msg.section_0.entries.216]
text = [
  "I aim at only one thing!\\n",
  "I'll be the Champion!\\c$",
]

[msg.section_0.entries.217]
text = [
  "I'll be the Champion!\\c\\n",
  "I can't afford to stop!\\c$",
]

[msg.section_0.entries.218]
text = [
  "This is the stage for chosen Trainers.\\n",
  "You or me...\\l\\n",
  "Either of us will be the Champion!\\c\\n",
  "Let's have a battle that we\\n",
  "won't regret!\\c$",
]

[msg.section_0.entries.219]
text = [
  "Huh? I... Did I lose?\\n",
  "I can't believe I failed here...\\c$",
]

[msg.section_0.entries.220]
text = [
  "I won! I knew I could win!\\n",
  "I'm the one who should be the Champion!\\c$",
]

[msg.section_0.entries.221]
text = [
  "The road to being the Champion\\n",
  "is not an easy one...\\c$",
]

[msg.section_0.entries.222]
text = [
  "It seems I am the one who deserves to\\n",
  "be the Champion!\\c$",
]

[msg.section_0.entries.223]
text = [
  "She's destined to be the top.\\n",
  "Her true value will be put to the test!\\c$",
]

[msg.section_0.entries.224]
text = [
  "No matter what kind of Trainer you are,\\n",
  "I'll surpass you!\\c$",
]

[msg.section_0.entries.225]
text = [
  "You look very strong!\\c\\n",
  "That's what I want!\\n",
  "I'll surpass you!\\c$",
]

[msg.section_0.entries.226]
text = [
  "The stronger my opponent is,\\n",
  "the stronger I'll become!\\l\\n",
  "That is a serious battle!\\c\\n",
  "Now! Bring it on!\\c$",
]

[msg.section_0.entries.227]
text = [
  "I couldn't reach...\\n",
  "You're really strong!\\c$",
]

[msg.section_0.entries.228]
text = [
  "I won!\\n",
  "You were pretty cool, too!\\c$",
]

[msg.section_0.entries.229]
text = [
  "My new goal is to surpass\\n",
  "you someday.\\l\\n",
  "I'll get much stronger.\\c$",
]

[msg.section_0.entries.230]
text = [
  "The battle with you made me\\n",
  "even stronger.\\c\\n",
  "Thank you very much for the\\n",
  "wonderful battle.\\c$",
]

[msg.section_0.entries.231]
text = [
  "She's getting stronger and stronger!\\n",
  "Hey! Exceed your limit!\\c$",
]

[msg.section_0.entries.232]
text = [
  "My Pokémon learned numerous moves\\n",
  "when we traveled the world! Take them!\\c$",
]

[msg.section_0.entries.233]
text = [
  "The long journey was all to be\\n",
  "victorious today!\\c\\n",
  "We'll exert all our power!\\c$",
]

[msg.section_0.entries.234]
text = [
  "I've traveled all over the world\\n",
  "with my Pokémon to win the tournament.\\c\\n",
  "We'll bring out our best!\\c$",
]

[msg.section_0.entries.235]
text = [
  "We lost...\\n",
  "But we did our best...didn't we?\\c$",
]

[msg.section_0.entries.236]
text = [
  "Every Pokémon...has become stronger!\\n",
  "The journey was worth it.\\c$",
]

[msg.section_0.entries.237]
text = [
  "We'll set out for another journey...\\n",
  "We won't lose next time!\\c$",
]

[msg.section_0.entries.238]
text = [
  "You still have a long way to go.\\n",
  "You need to train a little bit harder!\\c$",
]

[msg.section_0.entries.239]
text = [
  "At the end of her odyssey,\\n",
  "what did she find?!\\c$",
]

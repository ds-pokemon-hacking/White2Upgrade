[msg.section_0.entries.0]
text = [
  "Actor$",
]

[msg.section_0.entries.1]
text = [
  "Assistant$",
]

[msg.section_0.entries.2]
text = [
  "[VAR TRNAME(1)]: Hey!\\n",
  "Just what do you think you're doing?!$",
]

[msg.section_0.entries.3]
text = [
  "Assistant: Professor [VAR TRNAME(1)]...\\c\\n",
  "No. You're just [VAR TRNAME(1)] to me now.\\c\\n",
  "I'm fed up, and I just can't work with\\n",
  "you any longer!$",
]

[msg.section_0.entries.4]
text = [
  "[VAR TRNAME(1)]: What do you mean?!$",
]

[msg.section_0.entries.5]
text = [
  "Assistant: You're just a kid, but you act\\n",
  "all high and mighty around here.\\c\\n",
  "Recently, you've just been playing with that\\n",
  "robot and ignoring our research.\\c\\n",
  "If we keep this up, our lab is going to go\\n",
  "bankrupt, and it's all because of you!\\c\\n",
  "That's why I took the F-00!\\c\\n",
  "Since you disposed of the design data, I\\n",
  "have no choice but to sell the only F-00 we\\l\\n",
  "have and use that money to save the lab!$",
]

[msg.section_0.entries.6]
text = [
  "[VAR TRNAME(1)]: You can't be serious!\\n",
  "The F-00 is mine and mine alone!\\l\\n",
  "I won't let you or anyone else sell it!$",
]

[msg.section_0.entries.7]
text = [
  "Assistant: You're too late.\\c\\n",
  "The F-00 won't listen to your\\n",
  "orders anymore!$",
]

[msg.section_0.entries.8]
text = [
  "[VAR TRNAME(1)]: That's nonsense!$",
]

[msg.section_0.entries.9]
text = [
  "Assistant: You'll see.\\c\\n",
  "This is what you get for always trying\\n",
  "to make a fool of me!\\c\\n",
  "Hey! F-00!\\c\\n",
  "Come over here and teach [VAR TRNAME(1)]\\n",
  "a lesson!$",
]

[msg.section_0.entries.10]
text = [
  "[VAR TRNAME(1)]: It can't be! F-00!\\n",
  "Don't you recognize me?$",
]

[msg.section_0.entries.11]
text = [
  "F-00: ...$",
]

[msg.section_0.entries.12]
text = [
  "[VAR TRNAME(1)]: Something's wrong with F-00!\\n",
  "What did you do to it?!$",
]

[msg.section_0.entries.13]
text = [
  "Assistant: This robot wouldn't listen to my\\n",
  "orders, so I had no choice...\\c\\n",
  "I erased the F-00's memory banks and\\n",
  "reprogrammed it to obey me!$",
]

[msg.section_0.entries.14]
text = [
  "[VAR TRNAME(1)]: How could you?!\\c\\n",
  "The F-00's programming is\\n",
  "extremely complex!\\l\\n",
  "It can't be reprogrammed so easily...\\c\\n",
  "Especially not by someone with your\\n",
  "limited skills!$",
]

[msg.section_0.entries.15]
text = [
  "Assistant: There you go again! Always\\n",
  "trying to make a fool of me!\\c\\n",
  "It's that awful personality of yours\\n",
  "that got you in this position!$",
]

[msg.section_0.entries.16]
text = [
  "[VAR TRNAME(1)]: It's just the truth...$",
]

[msg.section_0.entries.17]
text = [
  "Assistant: That may be so, but such\\n",
  "bluntness can hurt people's feelings!\\c\\n",
  "You may be a genius, but you can't\\n",
  "even understand that simple fact?!$",
]

[msg.section_0.entries.18]
text = [
  "[VAR TRNAME(1)]: You're just jealous...$",
]

[msg.section_0.entries.19]
text = [
  "Assistant: Maybe I am! But I'll teach\\n",
  "you to respect your elders!\\c\\n",
  "F-00! Let's do this!\\n",
  "It's time to punish [VAR TRNAME(1)]!$",
]

[msg.section_0.entries.20]
text = [
  "[VAR TRNAME(1)]: I'm sorry...$",
]

[msg.section_0.entries.21]
text = [
  "Assistant: It's too late for apologies!\\c\\n",
  "Don't think I'll forgive you that easily!$",
]

[msg.section_0.entries.22]
text = [
  "[VAR TRNAME(1)]: It's my fault...$",
]

[msg.section_0.entries.23]
text = [
  "Assistant: That's right! It's all your fault!\\c\\n",
  "I'm a scientist, too, you know?\\n",
  "It's not like I wanted to resort\\l\\n",
  "to dirty tactics like this!$",
]

[msg.section_0.entries.24]
text = [
  "[VAR TRNAME(1)]: Oh no...\\c\\n",
  "If this keeps up, the F-00 will defeat\\n",
  "both [VAR PKNICK(0)] and me...$",
]

[msg.section_0.entries.25]
text = [
  "F-00: ...$",
]

[msg.section_0.entries.26]
text = [
  "[VAR TRNAME(1)]: ...\\c\\n",
  "A robot that has been reprogrammed is like\\n",
  "a totally different person, but...$",
]

[msg.section_0.entries.27]
text = [
  "F-00: ...Beep!\\c\\n",
  "[VAR TRNAME(1)], [VAR TRNAME(1)], [VAR TRNAME(1)],\\n",
  "[VAR TRNAME(1)], [VAR TRNAME(1)], [VAR TRNAME(1)]...$",
]

[msg.section_0.entries.28]
text = [
  "[VAR TRNAME(1)]: What's happening?!$",
]

[msg.section_0.entries.29]
text = [
  "F-00: ...Beep ...Bloop ...Beep!$",
]

[msg.section_0.entries.30]
text = [
  "[VAR TRNAME(1)]: Hey! F-00! What's wrong?$",
]

[msg.section_0.entries.31]
text = [
  "F-00: Beep bloop bop bleep!\\c\\n",
  "...$",
]

[msg.section_0.entries.32]
text = [
  "[VAR TRNAME(1)]: Tell me what's wrong!$",
]

[msg.section_0.entries.33]
text = [
  "F-00: Beep bloop bop bleep beeeep!$",
]

[msg.section_0.entries.34]
text = [
  "[VAR TRNAME(1)]: Are you OK?!$",
]

[msg.section_0.entries.35]
text = [
  "F-00: Beep...\\c\\n",
  "Beep blop boop!$",
]

[msg.section_0.entries.36]
text = [
  "[VAR TRNAME(1)]: Is it broken?!$",
]

[msg.section_0.entries.37]
text = [
  "F-00: Beep bloop bop beeeeeep!$",
]

[msg.section_0.entries.38]
text = [
  "[VAR TRNAME(1)]: It's gone berserk!$",
]

[msg.section_0.entries.39]
text = [
  "F-00: Beep bloop bop beeeeeep!$",
]

[msg.section_0.entries.40]
text = [
  "Assistant: Come on, F-00! Obey my commands!$",
]

[msg.section_0.entries.41]
text = [
  "[VAR TRNAME(1)]: It's no good...\\n",
  "The F-00 has lost control...\\c\\n",
  "It won't listen to anyone in this state!\\c\\n",
  "If the F-00 keeps this up, it's going\\n",
  "to tear itself apart!$",
]

[msg.section_0.entries.42]
text = [
  "Assistant: What?! We can't let that happen!\\n",
  "What should we do?$",
]

[msg.section_0.entries.43]
text = [
  "[VAR TRNAME(1)]: We've got to stop its CPU,\\n",
  "which functions as its heart...\\c\\n",
  "We need to find a way to stop the F-00's\\n",
  "CPU without destroying it.$",
]

[msg.section_0.entries.44]
text = [
  "Assistant: Stop the CPU without destroying\\n",
  "the F-00, huh?\\c\\n",
  "Hmmm...\\c\\n",
  "I've got it!\\c\\n",
  "I know of a way!$",
]

[msg.section_0.entries.45]
text = [
  "[VAR TRNAME(1)]: What is it?$",
]

[msg.section_0.entries.46]
text = [
  "Assistant: We've got to freeze it!\\c\\n",
  "If we can freeze the F-00's CPU,\\n",
  "it should stop!$",
]

[msg.section_0.entries.47]
text = [
  "[VAR TRNAME(1)]: I see...\\n",
  "Not a bad idea...$",
]

[msg.section_0.entries.48]
text = [
  "Assistant: [VAR TRNAME(1)]... That's the first\\n",
  "time you've ever given me a compliment.$",
]

[msg.section_0.entries.49]
text = [
  "[VAR TRNAME(1)]: We've done it!\\n",
  "We've stopped the F-00!$",
]

[msg.section_0.entries.50]
text = [
  "F-00: ...$",
]

[msg.section_0.entries.51]
text = [
  "[VAR TRNAME(1)]: F-00! Are you OK?!$",
]

[msg.section_0.entries.52]
text = [
  "F-00: ...\\c\\n",
  "[VAR TRNAME(1)]...$",
]

[msg.section_0.entries.53]
text = [
  "[VAR TRNAME(1)]: What?\\c\\n",
  "The F-00 just said my name, didn't it?\\n",
  "How could that be possible?$",
]

[msg.section_0.entries.54]
text = [
  "F-00: [VAR TRNAME(1)]...$",
]

[msg.section_0.entries.55]
text = [
  "[VAR TRNAME(1)]: That's right! It's me, F-00!\\n",
  "It's [VAR TRNAME(1)]!$",
]

[msg.section_0.entries.56]
text = [
  "F-00: [VAR TRNAME(1)]...$",
]

[msg.section_0.entries.57]
text = [
  "Assistant: How in the world...\\c\\n",
  "How could something like this occur?!\\n",
  "This is completely unscientific!\\c\\n",
  "I can't take this anymore!$",
]

[msg.section_0.entries.58]
text = [
  "[VAR TRNAME(1)]: F-00...$",
]

[msg.section_0.entries.59]
text = [
  "The F-00's memory banks were erased,\\n",
  "yet it still called my name...\\c\\n",
  "It was a true wonder...\\c\\n",
  "However, such a happy moment would\\n",
  "prove to be fleeting.\\c\\n",
  "The time for the F-00 and I to separate\\n",
  "forever would soon arrive...$",
]

[msg.section_0.entries.60]
text = [
  "Assistant: Listen up, [VAR TRNAME(1)]!\\n",
  "It's all your fault!\\c\\n",
  "We're going to sell off this F-00 to the\\n",
  "highest bidder and use the money to fund\\l\\n",
  "our lab!$",
]

[msg.section_0.entries.61]
text = [
  "[VAR TRNAME(1)]: Wait...\\n",
  "The F-00... The F-00 is mine!$",
]

[msg.section_0.entries.62]
text = [
  "Assistant: Farewell, [VAR TRNAME(1)]!$",
]

[msg.section_0.entries.63]
text = [
  "My assistant had betrayed me.\\n",
  "My F-00 was stolen, and I had to leave\\l\\n",
  "the lab alone...\\c\\n",
  "After that, I quit robotics research and\\n",
  "never attempted to create another one.$",
]

[msg.section_0.entries.64]
text = [
  "F-00: ...$",
]

[msg.section_0.entries.65]
text = [
  "[VAR TRNAME(1)]: F-00...\\c\\n",
  "Argh! It's all your fault, you\\n",
  "worthless assistant!$",
]

[msg.section_0.entries.66]
text = [
  "Assistant: What are you on about?\\c\\n",
  "You're the one who betrayed us all in the\\n",
  "first place and stopped working to play\\l\\n",
  "with your robot! It's all your fault!$",
]

[msg.section_0.entries.67]
text = [
  "F-00: Bleep... Bleep...$",
]

[msg.section_0.entries.68]
text = [
  "[VAR TRNAME(1)]: F-00...$",
]

[msg.section_0.entries.69]
text = [
  "Assistant: Pff!\\n",
  "Your robot's all busted up!\\c\\n",
  "Ignore that worthless hunk of junk and\\n",
  "listen to me!$",
]

[msg.section_0.entries.70]
text = [
  "[VAR TRNAME(1)]: Wait a moment...\\n",
  "This smell...it's coming from the F-00!$",
]

[msg.section_0.entries.71]
text = [
  "F-00: Bleep... Beep boop...$",
]

[msg.section_0.entries.72]
text = [
  "[VAR TRNAME(1)]: I thought I smelled\\n",
  "something burning...\\c\\n",
  "Could energy be leaking from its battery?$",
]

[msg.section_0.entries.73]
text = [
  "Assistant: Who cares?!\\n",
  "It's not like it's going to move again!\\c\\n",
  "Gah! Worthless piece of junk!\\n",
  "I'll shut it up once and for all!$",
]

[msg.section_0.entries.74]
text = [
  "[VAR TRNAME(1)]: No! Stop!$",
]

[msg.section_0.entries.75]
text = [
  "Assistant: Shut up and stand back!\\n",
  "I've got fists of fire, you know?$",
]

[msg.section_0.entries.76]
text = [
  "[VAR TRNAME(1)]: Stop!$",
]

[msg.section_0.entries.77]
text = [
  "After sustaining great damage, the F-00's\\n",
  "battery began to leak energy,\\l\\n",
  "placing it in a very delicate state.\\c\\n",
  "Even the shock from my weak assistant's\\n",
  "punch proved to be too great...\\c\\n",
  "The F-00 exploded, blowing us away\\n",
  "and destroying most of the lab\\l\\n",
  "in the process...\\c\\n",
  "My assistant somehow made it out and\\n",
  "was taken to the hospital.\\c\\n",
  "I, however, remained here, forever\\n",
  "clinging to the F-00's memory.$",
]

[msg.section_0.entries.78]
text = [
  "F-00: Beep bloop bop bleep!$",
]

[msg.section_0.entries.79]
text = [
  "[VAR TRNAME(1)]: This is it...\\n",
  "The F-00 just won't stop...\\c\\n",
  "It's going to overheat, and its engine\\n",
  "will explode!$",
]

[msg.section_0.entries.80]
text = [
  "F-00: Beep bloop bop bleep!$",
]

[msg.section_0.entries.81]
text = [
  "[VAR TRNAME(1)]: F-00...\\n",
  "I'm so sorry... You must be in pain...\\l\\n",
  "I'll stay with you until the end...$",
]

[msg.section_0.entries.82]
text = [
  "F-00: Beep bloop bop bleeeeeeep!$",
]

[msg.section_0.entries.83]
text = [
  "[VAR TRNAME(1)]: F-00! What do you think\\n",
  "you're doing?!$",
]

[msg.section_0.entries.84]
text = [
  "F-00: Beep bloop bop bleeeeeeep!$",
]

[msg.section_0.entries.85]
text = [
  "[VAR TRNAME(1)]: Put me down, F-00!\\n",
  "I told you. I'm going to stay here with you!$",
]

[msg.section_0.entries.86]
text = [
  "F-00: Beep bloop bop bleeeeeeep!\\n",
  "Grrrrrr... Bzzzzzz...$",
]

[msg.section_0.entries.87]
text = [
  "[VAR TRNAME(1)]: Hey! Stop it, F-00!\\n",
  "Put me down!$",
]

[msg.section_0.entries.88]
text = [
  "Assistant: Ha ha ha...\\n",
  "How did things turn out like this?$",
]

[msg.section_0.entries.89]
text = [
  "[VAR TRNAME(1)]: F-00!$",
]

[msg.section_0.entries.90]
text = [
  "The F-00 picked me up and threw me\\n",
  "out of the lab.\\c\\n",
  "Just moments later...\\c\\n",
  "The F-00's body had reached its limit.\\n",
  "It exploded, destroying most of the lab\\l\\n",
  "in the process...\\c\\n",
  "I barely escaped with my life...\\c\\n",
  "To this day, I wonder if F-00 went berserk\\n",
  "and didn't know what it was doing or if it\\l\\n",
  "really intended to save me...$",
]

[msg.section_0.entries.91]
text = [
  "F-00: Beep bloop bop bleep!$",
]

[msg.section_0.entries.92]
text = [
  "[VAR TRNAME(1)]: It's no good...\\c\\n",
  "The energy-absorption system\\n",
  "is malfunctioning!$",
]

[msg.section_0.entries.93]
text = [
  "F-00: Bleep! Bloop!$",
]

[msg.section_0.entries.94]
text = [
  "Assistant: Argh...why?$",
]

[msg.section_0.entries.95]
text = [
  "[VAR TRNAME(1)]: You...\\c\\n",
  "Just what kind of new program did you\\n",
  "put into the F-00?!$",
]

[msg.section_0.entries.96]
text = [
  "Assistant: ...\\c\\n",
  "To be honest, your code was completely\\n",
  "incomprehensible to me...\\c\\n",
  "Especially that one formula that started\\n",
  "with a K. Total nonsense!\\c\\n",
  "There's no way anyone could make sense\\n",
  "of such needlessly complex code...\\c\\n",
  "So, I went in and deleted the complicated\\n",
  "parts of your code and changed it into\\l\\n",
  "something anyone can understand!\\c\\n",
  "I modified your formulas to handle only\\n",
  "simple operations... That's all!$",
]

[msg.section_0.entries.97]
text = [
  "[VAR TRNAME(1)]: So that's what you did!\\c\\n",
  "That formula that started with a K was\\n",
  "the most important one! It was the formula\\l\\n",
  "that gave the F-00 a humanlike heart!\\c\\n",
  "If you went in and messed it all up, then\\n",
  "that explains why the usually calm F-00 is\\l\\n",
  "now going berserk...$",
]

[msg.section_0.entries.98]
text = [
  "Assistant: You can't be serious...\\n",
  "That means it's all my fault!$",
]

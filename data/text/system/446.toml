[msg.section_0.entries.0]
text = [
  "$",
]

[msg.section_0.entries.1]
text = [
  "Nach der Geburt nimmt es für eine\\n",
  "Weile Nährstoffe über den Samen\\n",
  "auf seinem Rücken auf.$",
]

[msg.section_0.entries.2]
text = [
  "Sobald die Knospe auf seinem Rücken\\n",
  "ein süßes Aroma abgibt, steht die\\n",
  "Blüte kurz bevor.$",
]

[msg.section_0.entries.3]
text = [
  "Nach einem Regentag riecht die\\n",
  "Blume auf seinem Rücken intensiver.\\n",
  "Das Aroma zieht andere Pokémon an.$",
]

[msg.section_0.entries.4]
text = [
  "Lodert die Flamme auf seiner\\n",
  "Schweifspitze hell, ist Glumanda gesund.$",
]

[msg.section_0.entries.5]
text = [
  "Glutexo leben in den Bergen.\\n",
  "Die Flammen auf ihren Schweifspitzen\\n",
  "leuchten in der Nacht wie Sterne.$",
]

[msg.section_0.entries.6]
text = [
  "Man sagt, Gluraks Feuer lodert stärker,\\n",
  "wenn es harte Kämpfe überstanden hat.$",
]

[msg.section_0.entries.7]
text = [
  "Es zieht sich in seinen Panzer zurück\\n",
  "und greift dann mit Wasserstrahlen\\n",
  "seine Gegner an.$",
]

[msg.section_0.entries.8]
text = [
  "Man sagt, es werde 10 000 Jahre alt.\\n",
  "Sein buschiger Schweif ist ein Symbol\\n",
  "für langes Leben.$",
]

[msg.section_0.entries.9]
text = [
  "Der Wasserstrahl, der aus den\\n",
  "Wasserdüsen schießt, kann sogar\\n",
  "Stahlwände durchdringen.$",
]

[msg.section_0.entries.10]
text = [
  "Seine roten Antennen sondern einen\\n",
  "Gestank ab, der Feinde verjagt.\\n",
  "Es wächst, indem es sich häutet.$",
]

[msg.section_0.entries.11]
text = [
  "Der stahlharte Panzer schützt\\n",
  "seinen zarten Körper. Es wartet\\n",
  "geduldig auf seine Entwicklung.$",
]

[msg.section_0.entries.12]
text = [
  "Es liebt Blütenhonig. Es findet\\n",
  "selbst Blumen, die sehr wenig\\n",
  "Pollen haben.$",
]

[msg.section_0.entries.13]
text = [
  "Es frisst täglich sein Gewicht in\\n",
  "Blättern. Die Nadel auf seinem Kopf\\n",
  "dient der Verteidigung.$",
]

[msg.section_0.entries.14]
text = [
  "Während es auf seine Entwicklung\\n",
  "wartet, versteckt es sich unter\\n",
  "Blättern und zwischen Ästen.$",
]

[msg.section_0.entries.15]
text = [
  "Sein bester Angriff: Schnell auf den\\n",
  "Gegner zufliegen, mit Giftstacheln\\n",
  "zustechen und davonfliegen.$",
]

[msg.section_0.entries.16]
text = [
  "Reizt man dieses an sich gutmütige\\n",
  "Pokémon, wehrt es sich wütend.$",
]

[msg.section_0.entries.17]
text = [
  "Auf der Suche nach Nahrung, die es\\n",
  "mit scharfen Krallen schlägt, fliegt es\\n",
  "durch riesiges Territorium.$",
]

[msg.section_0.entries.18]
text = [
  "Schlägt Tauboss mit ganzer Kraft\\n",
  "seine Flügel, beugen sich selbst\\n",
  "große Bäume durch den Windstoß.$",
]

[msg.section_0.entries.19]
text = [
  "Es strotzt vor Lebenskraft und\\n",
  "kann in jeder Umgebung leben.\\n",
  "Es ist extrem vorsichtig.$",
]

[msg.section_0.entries.20]
text = [
  "Es wetzt seine ständig wachsenden\\n",
  "Zähne an harten Dingen. Es kann\\n",
  "Wände aus Beton zernagen.$",
]

[msg.section_0.entries.21]
text = [
  "Im Flug schlägt es eifrig mit den\\n",
  "Flügeln. Mit seinem Schnabel\\n",
  "sucht es im Gras nach Beute.$",
]

[msg.section_0.entries.22]
text = [
  "Es hat genügend Ausdauer, den\\n",
  "ganzen Tag zu fliegen. Sein\\n",
  "scharfer Schnabel dient als Waffe.$",
]

[msg.section_0.entries.23]
text = [
  "Es bewegt sich ohne einen Laut\\n",
  "durch das Gras und greift seine\\n",
  "ahnungslose Beute von hinten an.$",
]

[msg.section_0.entries.24]
text = [
  "Das Muster auf seinem Bauch\\n",
  "schüchtert Gegner ein. Sind sie vor\\n",
  "Angst erstarrt, umklammert es sie.$",
]

[msg.section_0.entries.25]
text = [
  "Es verwendet hin und wieder\\n",
  "Elektrizität, um ein anderes,\\n",
  "geschwächtes Pikachu aufzuladen.$",
]

[msg.section_0.entries.26]
text = [
  "Es entlädt Elektrizität in den Boden,\\n",
  "um sich auf diese Weise vor\\n",
  "elektrischen Schlägen zu schützen.$",
]

[msg.section_0.entries.27]
text = [
  "Es lebt in trockenen Regionen mit\\n",
  "wenig Regen. Es rollt sich ein,\\n",
  "um sich vor Gegnern zu schützen.$",
]

[msg.section_0.entries.28]
text = [
  "Es rollt sich zusammen und rollt\\n",
  "dann auf Gegner zu, die durch\\n",
  "seine Stacheln Schaden nehmen.$",
]

[msg.section_0.entries.29]
text = [
  "Es mag keine Kämpfe. Ein einziger\\n",
  "Tropfen des Gifts aus seinen\\n",
  "Widerhaken hat eine fatale Wirkung.$",
]

[msg.section_0.entries.30]
text = [
  "Bei Gefahr fährt es die Widerhaken\\n",
  "am Körper aus. Diese wachsen\\n",
  "langsamer als die von Nidorino.$",
]

[msg.section_0.entries.31]
text = [
  "Sein ganzer Körper ist mit harten\\n",
  "Schuppen bedeckt. Es beschützt\\n",
  "sein Junges mit seinem Leben.$",
]

[msg.section_0.entries.32]
text = [
  "Es untersucht die Umgebung, indem\\n",
  "es die Ohren spitzt und lauscht. Sein\\n",
  "giftiges Horn schützt es.$",
]

[msg.section_0.entries.33]
text = [
  "Es ist aggressiv und greift seine\\n",
  "Gegner mit dem Horn an, welches\\n",
  "bei Berührung Gift absondert.$",
]

[msg.section_0.entries.34]
text = [
  "Ein Schlag mit seinem gewaltigen\\n",
  "Schweif kann einen Telegrafenmasten\\n",
  "knicken wie ein Streichholz.$",
]

[msg.section_0.entries.35]
text = [
  "Eine Ansammlung von Piepi bei\\n",
  "Vollmond tanzen zu sehen,\\n",
  "soll Freude verheißen.$",
]

[msg.section_0.entries.36]
text = [
  "Es ist sehr wachsam und zeigt sich\\n",
  "nur selten. Zudem verfügt es über\\n",
  "ein außergewöhnlich gutes Gehör.$",
]

[msg.section_0.entries.37]
text = [
  "Es beherrscht Feuerbälle.\\n",
  "Während es wächst, teilen sich seine\\n",
  "sechs Schweife, um weitere zu bilden.$",
]

[msg.section_0.entries.38]
text = [
  "Seine neun Schweife sollen\\n",
  "mystische Kräfte besitzen.\\n",
  "Es kann tausend Jahre leben.$",
]

[msg.section_0.entries.39]
text = [
  "Sobald es mit seinen großen, runden\\n",
  "Augen rollt, fängt es an, ein Lied\\n",
  "zu singen und jeder schläft ein.$",
]

[msg.section_0.entries.40]
text = [
  "Sein feines Fell fühlt sich herrlich\\n",
  "an. Es kann sich größer machen,\\n",
  "indem es Luft einatmet.$",
]

[msg.section_0.entries.41]
text = [
  "Es überwacht seine Umgebung durch\\n",
  "die Reflektionen der Ultraschallwellen,\\n",
  "die es aussendet.$",
]

[msg.section_0.entries.42]
text = [
  "Seine scharfen Zähne durchstechen\\n",
  "dickste Haut. Sie sind hohl und\\n",
  "erlauben so das Saugen von Blut.$",
]

[msg.section_0.entries.43]
text = [
  "Tagsüber verankert es sich mit\\n",
  "seinen Wurzelfüßen im Boden.\\n",
  "Nachts wandert es und verteilt Samen.$",
]

[msg.section_0.entries.44]
text = [
  "Der Honig, den es abgibt, riecht so\\n",
  "entsetzlich, dass sich sogar Nasen\\n",
  "in 2 km Entfernung rümpfen.$",
]

[msg.section_0.entries.45]
text = [
  "Es besitzt die größten Blätter der Welt.\\n",
  "Es verteilt beim Gehen Pollen, die\\n",
  "schreckliche Allergien auslösen.$",
]

[msg.section_0.entries.46]
text = [
  "Auf seinem Rücken wachsen Pilze,\\n",
  "die Tochukaso. Sie nehmen an Größe zu,\\n",
  "wenn Paras wächst.$",
]

[msg.section_0.entries.47]
text = [
  "Parasek wird von einem Pilz, der größer\\n",
  "als das Pokémon ist, kontrolliert. Er\\n",
  "gibt Giftsporen ab.$",
]

[msg.section_0.entries.48]
text = [
  "Seine großen Augen bestehen aus\\n",
  "vielen kleinen Augen. Nachts wird\\n",
  "es von Licht angezogen.$",
]

[msg.section_0.entries.49]
text = [
  "Es schlägt mit den Flügeln, um\\n",
  "staubartige Schuppen abzusondern.\\n",
  "Diese geben bei Kontakt Gift ab.$",
]

[msg.section_0.entries.50]
text = [
  "Dieses Pokémon lebt unterirdisch.\\n",
  "Da es an Dunkelheit gewöhnt ist,\\n",
  "schreckt helles Licht es ab.$",
]

[msg.section_0.entries.51]
text = [
  "Die drei Köpfe bewegen sich abwechselnd,\\n",
  "um sich durch harte Erde in Tiefen von\\n",
  "bis zu 100 km zu graben.$",
]

[msg.section_0.entries.52]
text = [
  "Ein nachtaktives Pokémon. Sieht\\n",
  "es etwas Schimmerndes, fangen\\n",
  "seine Augen an zu glänzen.$",
]

[msg.section_0.entries.53]
text = [
  "Ein sehr stolzes Pokémon.\\n",
  "Für Fans ist die Größe des Juwels auf\\n",
  "seiner Stirn Anlass für Diskussionen.$",
]

[msg.section_0.entries.54]
text = [
  "Leidet unter stetigem Kopfschmerz,\\n",
  "ausgelöst durch seltsame Kräfte,\\n",
  "die es aber auch einsetzen kann.$",
]

[msg.section_0.entries.55]
text = [
  "Die gut ausgeprägten Flossen\\n",
  "ermöglichen einen sowohl eleganten\\n",
  "als auch dynamischen Schwimmstil.$",
]

[msg.section_0.entries.56]
text = [
  "Es lebt mit anderen in Baumkronen. Wird\\n",
  "eines von ihnen wütend, werden alle\\n",
  "anderen auch wütend.$",
]

[msg.section_0.entries.57]
text = [
  "Siehst du ihm in die Augen, wird es\\n",
  "wütend. Rennst du weg, wird es\\n",
  "noch wütender. Ärgerst du es...$",
]

[msg.section_0.entries.58]
text = [
  "Ein loyales Pokémon. Es wird erst\\n",
  "dann aktiv, wenn sein Trainer ihm\\n",
  "Anweisungen gegeben hat.$",
]

[msg.section_0.entries.59]
text = [
  "Mit seiner stolzen und königlichen\\n",
  "Erscheinung gewinnt es die Herzen\\n",
  "der Menschen.$",
]

[msg.section_0.entries.60]
text = [
  "Seine Haut ist so dünn, dass man die\\n",
  "inneren Organe sehen kann. Es hat\\n",
  "Schwierigkeiten beim Laufen.$",
]

[msg.section_0.entries.61]
text = [
  "Das Spiralmuster auf seinem Bauch\\n",
  "dreht sich langsam. Starrt man\\n",
  "darauf, wird einem schwindelig.$",
]

[msg.section_0.entries.62]
text = [
  "Es hat extrem starke Muskeln und\\n",
  "kann durch den Ozean schwimmen,\\n",
  "ohne sich ausruhen zu müssen.$",
]

[msg.section_0.entries.63]
text = [
  "Der Einsatz seiner Psycho-Kräfte\\n",
  "kostet so viel Energie, dass es\\n",
  "18 Stunden am Tag schlafen muss.$",
]

[msg.section_0.entries.64]
text = [
  "Es starrt auf seinen Silberlöffel,\\n",
  "um sich zu konzentrieren. So kann\\n",
  "es mehr Alphawellen ausstoßen.$",
]

[msg.section_0.entries.65]
text = [
  "Man sagt, dass es die Löffel in\\n",
  "seinen Händen durch Psycho-Kräfte\\n",
  "selbst erzeugt habe.$",
]

[msg.section_0.entries.66]
text = [
  "Obwohl von kleiner Statur, ist es\\n",
  "kräftig genug, mehrere Kleinstein\\n",
  "zu hieven und dann zu werfen.$",
]

[msg.section_0.entries.67]
text = [
  "Es hievt gern schwere Ladung,\\n",
  "um so zu trainieren. Es hilft auch\\n",
  "gern anderen bei harter Arbeit.$",
]

[msg.section_0.entries.68]
text = [
  "Es erwischt Gegner mit harten\\n",
  "Schlägen seiner kräftigen Arme und\\n",
  "hackt mit enormer Geschwindigkeit.$",
]

[msg.section_0.entries.69]
text = [
  "Es bevorzugt heiße und feuchte\\n",
  "Umgebungen. Seine Beute fängt es\\n",
  "blitzschnell mit seinen Ranken.$",
]

[msg.section_0.entries.70]
text = [
  "Ein Pokémon, das wie eine Pflanze\\n",
  "aussieht. Es fängt Beute, indem es\\n",
  "giftigen Puder darüber verteilt.$",
]

[msg.section_0.entries.71]
text = [
  "In seinem Maul sammelt sich eine\\n",
  "Flüssigkeit, die nach Honig riecht,\\n",
  "in Wahrheit aber ätzend ist.$",
]

[msg.section_0.entries.72]
text = [
  "Wird es an Land geschwemmt,\\n",
  "vertrocknet es schnell, da es\\n",
  "fast völlig aus Wasser besteht.$",
]

[msg.section_0.entries.73]
text = [
  "Durch das Strecken seiner 80 Tentakel\\n",
  "erzeugt es ein giftiges Netz, dem man\\n",
  "kaum entrinnen kann.$",
]

[msg.section_0.entries.74]
text = [
  "Ruhend sieht es fast wie ein Felsen aus.\\n",
  "Tritt man auf Kleinstein, wird es wütend\\n",
  "mit den Fäusten wirbeln.$",
]

[msg.section_0.entries.75]
text = [
  "Rollt auf Bergpfaden, um sich\\n",
  "fortzubewegen. Hat es erst mal Schwung\\n",
  "geholt, kann man es kaum bremsen.$",
]

[msg.section_0.entries.76]
text = [
  "Selbst Sprengstoff kann seinem\\n",
  "harten Körper nichts anhaben.\\n",
  "Häutet sich nur einmal jährlich.$",
]

[msg.section_0.entries.77]
text = [
  "Neugeboren kann es kaum stehen.\\n",
  "Durch das Galoppieren werden seine\\n",
  "Beine aber schneller und kräftiger.$",
]

[msg.section_0.entries.78]
text = [
  "In vollem Galopp funkelt seine\\n",
  "leuchtende Mähne, was wiederum\\n",
  "seine Schönheit unterstreicht.$",
]

[msg.section_0.entries.79]
text = [
  "Es ist langsam, hat aber ein Talent,\\n",
  "mit seinem Schweif zu fischen.\\n",
  "Beißt etwas an, tut es ihm nicht weh.$",
]

[msg.section_0.entries.80]
text = [
  "Ein begriffsstutziges Pokémon.\\n",
  "Beißt das Muschas am Schweif zu,\\n",
  "scheint es Intelligenz zu gewinnen.$",
]

[msg.section_0.entries.81]
text = [
  "Je schneller sich die Vorrichtungen\\n",
  "an seinen Seiten drehen, desto höher\\n",
  "die erzeugte magnetische Kraft.$",
]

[msg.section_0.entries.82]
text = [
  "Erscheinen vermehrt, wenn Flecken\\n",
  "auf der Sonne auftauchen. Zudem\\n",
  "beeinträchtigen sie Fernsehbilder.$",
]

[msg.section_0.entries.83]
text = [
  "Ohne seinen Stock kann es nicht leben.\\n",
  "Daher beschützt es den Stock mit\\n",
  "seinem Leben.$",
]

[msg.section_0.entries.84]
text = [
  "Die Gehirne der beiden Köpfe\\n",
  "kommunizieren ihre Gefühle\\n",
  "über Telepathie.$",
]

[msg.section_0.entries.85]
text = [
  "Entwickelt sich Dodu, teilt sich\\n",
  "einer der Köpfe in zwei. Es kann\\n",
  "sich mit 60 km/h fortbewegen.$",
]

[msg.section_0.entries.86]
text = [
  "Dieses Pokémon lebt auf Eisbergen.\\n",
  "Es schwimmt im Eiswasser und bricht\\n",
  "das Eis mithilfe seines Horns.$",
]

[msg.section_0.entries.87]
text = [
  "Sein Körper ist mit einem weißen Fell\\n",
  "bedeckt, das es im Schnee fast\\n",
  "unsichtbar für Gegner macht.$",
]

[msg.section_0.entries.88]
text = [
  "Es wurde geboren, als Schlamm von\\n",
  "den Strahlen des Mondes getroffen\\n",
  "wurde. Es erscheint, wo Unrat ist.$",
]

[msg.section_0.entries.89]
text = [
  "Sein Körper sondert eine giftige\\n",
  "Substanz ab, die bei Kontakt\\n",
  "Pflanzen und Bäume vernichtet.$",
]

[msg.section_0.entries.90]
text = [
  "Es schwimmt rückwärts, indem es\\n",
  "seine Schale öffnet und schließt.\\n",
  "Es zeigt immer seine breite Zunge.$",
]

[msg.section_0.entries.91]
text = [
  "Im Kampf schließt es seine Schale,\\n",
  "um sich zu schützen. Es schießt mit\\n",
  "Stacheln auf seine Gegner.$",
]

[msg.section_0.entries.92]
text = [
  "Eingehüllt in seinen gasförmigen,\\n",
  "Gift enthaltenden Körper würde\\n",
  "jeder in Ohnmacht fallen.$",
]

[msg.section_0.entries.93]
text = [
  "Lauert in der Dunkelheit. Die\\n",
  "Berührung seiner gasförmigen\\n",
  "Hand erzeugt endloses Schaudern.$",
]

[msg.section_0.entries.94]
text = [
  "Der heimtückische Blick im Dunkel\\n",
  "gehört einem Gengar, das sich freut,\\n",
  "Flüche auszustoßen.$",
]

[msg.section_0.entries.95]
text = [
  "Gräbt sich mit 80 km/h durch\\n",
  "den Boden und ernährt sich\\n",
  "von großen Felsbrocken.$",
]

[msg.section_0.entries.96]
text = [
  "Mit seiner großen Nase kann es die\\n",
  "Träume anderer erkennen.\\n",
  "Es liebt lustige Träume.$",
]

[msg.section_0.entries.97]
text = [
  "Ein Blick auf das Pendel versetzt\\n",
  "einen in 3 Sekunden in Schlaf,\\n",
  "selbst wenn man gar nicht müde ist.$",
]

[msg.section_0.entries.98]
text = [
  "Es lebt in Höhlen am Strand.\\n",
  "Seine Scheren wachsen nach,\\n",
  "wenn es sie im Kampf verliert.$",
]

[msg.section_0.entries.99]
text = [
  "Die großen Scheren haben eine\\n",
  "Stärke von 10 000 PS. Aber sie sind\\n",
  "schwer und kaum zu handhaben.$",
]

[msg.section_0.entries.100]
text = [
  "Sieht aus wie ein Pokéball. Es ist\\n",
  "gefährlich, da es bei Berührung\\n",
  "explodieren kann.$",
]

[msg.section_0.entries.101]
text = [
  "Es lässt sich vom Wind treiben,\\n",
  "wenn es so voller Elektrizität ist,\\n",
  "dass es fast explodiert.$",
]

[msg.section_0.entries.102]
text = [
  "Die sechs Eier kommunizieren\\n",
  "telepathisch. Werden sie getrennt,\\n",
  "finden sie sich schnell wieder.$",
]

[msg.section_0.entries.103]
text = [
  "Man nennt es den „Laufenden Dschungel“.\\n",
  "Wird ein Kopf zu groß, fällt er ab\\n",
  "und wird zu einem Owei.$",
]

[msg.section_0.entries.104]
text = [
  "Denkt es an seine verstorbene Mutter,\\n",
  "weint es, wobei der Schädel\\n",
  "auf seinem Kopf hohl klingt.$",
]

[msg.section_0.entries.105]
text = [
  "Von Geburt an trägt dieses wilde\\n",
  "Pokémon Knochen. Es setzt sie\\n",
  "talentiert als Waffen ein.$",
]

[msg.section_0.entries.106]
text = [
  "Seine Beine können die doppelte\\n",
  "Länge annehmen. Gegner, die das\\n",
  "nicht wissen, erschrecken.$",
]

[msg.section_0.entries.107]
text = [
  "Die Schläge, die es austeilt, können\\n",
  "Beton pulverisieren. Es muss sich im\\n",
  "Kampf alle 3 Minuten ausruhen.$",
]

[msg.section_0.entries.108]
text = [
  "Streckt es seine ca. zwei Meter\\n",
  "lange Zunge, zittert sein Schweif.\\n",
  "Sie scheinen verbunden zu sein.$",
]

[msg.section_0.entries.109]
text = [
  "Gase, die leichter als Luft sind,\\n",
  "lassen es schweben. Diese Gase\\n",
  "stinken und sind explosiv.$",
]

[msg.section_0.entries.110]
text = [
  "Es wächst, indem es Gase aufnimmt,\\n",
  "die aus dem Müll aufsteigen. Selten\\n",
  "kann man Drillinge von ihnen finden.$",
]

[msg.section_0.entries.111]
text = [
  "Seine mächtigen Tackles zerstören alles.\\n",
  "Leider ist es aber nicht das hellste\\n",
  "Licht im Lampengeschäft.$",
]

[msg.section_0.entries.112]
text = [
  "Das Stehen auf den Hinterbeinen\\n",
  "hat es klüger gemacht. Leider ist\\n",
  "es aber auch sehr vergesslich.$",
]

[msg.section_0.entries.113]
text = [
  "Ein freundliches Pokémon, das seine\\n",
  "nahrhaften Eier mit verletzten Pokémon\\n",
  "und Menschen teilt.$",
]

[msg.section_0.entries.114]
text = [
  "Die blauen Ranken an seinem Körper\\n",
  "sind von feinen Haaren bedeckt.\\n",
  "Es gilt zudem als kitzlig.$",
]

[msg.section_0.entries.115]
text = [
  "Sein Nachwuchs wächst in seinem\\n",
  "Beutel heran. Nur wenn es sicher ist,\\n",
  "darf das Junge aus dem Beutel.$",
]

[msg.section_0.entries.116]
text = [
  "Im Schatten von Korallen legt es\\n",
  "sein Nest an. Bei Gefahr versprüht\\n",
  "es Tinte und flieht.$",
]

[msg.section_0.entries.117]
text = [
  "Seine Stacheln schützen es.\\n",
  "Seine Flossen und Knochen werden bei\\n",
  "der Herstellung von Medizin verwendet.$",
]

[msg.section_0.entries.118]
text = [
  "Mit ausgebreiteten Flossen wirkt es\\n",
  "sehr elegant. Kann allerdings auch\\n",
  "heftig mit seinem Horn zustoßen.$",
]

[msg.section_0.entries.119]
text = [
  "Im Herbst legt es an Gewicht zu und\\n",
  "erscheint in prächtigen Farben,\\n",
  "um so einen Partner anzulocken.$",
]

[msg.section_0.entries.120]
text = [
  "Wird sein Körper verletzt,\\n",
  "kann es sich regenerieren,\\n",
  "sofern der rote Kern intakt ist.$",
]

[msg.section_0.entries.121]
text = [
  "In der Körpermitte befindet sich\\n",
  "ein roter Kern, der mysteriöse\\n",
  "Radiowellen in die Nacht sendet.$",
]

[msg.section_0.entries.122]
text = [
  "Formt eine unsichtbare Wand mitten\\n",
  "in der Luft, indem es minutiös\\n",
  "mit den Fingerspitzen vibriert.$",
]

[msg.section_0.entries.123]
text = [
  "Die scharfen Sensen an den Unterarmen\\n",
  "werden durch das Schneiden\\n",
  "harter Objekte noch schärfer.$",
]

[msg.section_0.entries.124]
text = [
  "Sein Ruf klingt wie menschliche Sprache.\\n",
  "Trotzdem ist nicht zu verstehen,\\n",
  "was es sagt.$",
]

[msg.section_0.entries.125]
text = [
  "Verstärkt Schläge durch rasantes\\n",
  "Drehen seiner Arme. Gegner rennen\\n",
  "unterdessen auch schon mal davon.$",
]

[msg.section_0.entries.126]
text = [
  "Atmet es tief ein, bilden sich Hitzewellen\\n",
  "um seinen Körper, was wiederum\\n",
  "die Sicht beeinträchtigt.$",
]

[msg.section_0.entries.127]
text = [
  "Es hält seine Beute mit seiner Zange\\n",
  "fest und teilt sie dann. Was es nicht\\n",
  "teilen kann, wirft es fort.$",
]

[msg.section_0.entries.128]
text = [
  "Sobald es einen Gegner ins Visier\\n",
  "genommen hat, rennt es mit dem\\n",
  "Kopf voran auf ihn zu.$",
]

[msg.section_0.entries.129]
text = [
  "Ein älteres Karpador kann mit\\n",
  "Platscher Berge überspringen. Die\\n",
  "Attacke ist trotzdem eher nutzlos.$",
]

[msg.section_0.entries.130]
text = [
  "Wütet ein Garados, wird es alles\\n",
  "niederbrennen. Dies geschieht\\n",
  "selbst während eines Sturms.$",
]

[msg.section_0.entries.131]
text = [
  "Es liebt es, das Meer mit Pokémon und\\n",
  "Menschen auf dem Rücken zu überqueren.\\n",
  "Es versteht die Menschen.$",
]

[msg.section_0.entries.132]
text = [
  "Es kann seine Zellstruktur so\\n",
  "verändern, dass es sich in alles\\n",
  "verwandeln kann, was es sieht.$",
]

[msg.section_0.entries.133]
text = [
  "Aufgrund einer genetischen Anomalie\\n",
  "kann es sehr schnell seine Form\\n",
  "verändern.$",
]

[msg.section_0.entries.134]
text = [
  "Seine Zellstruktur ist der von\\n",
  "Wassermolekülen ähnlich. Daher\\n",
  "kann es mit Wasser eins werden.$",
]

[msg.section_0.entries.135]
text = [
  "Bringt man es aus der Ruhe, verwendet\\n",
  "es Elektrizität, um kleine Knäuel seines\\n",
  "Fells abzufeuern.$",
]

[msg.section_0.entries.136]
text = [
  "Eingeatmete Luft wird in einem\\n",
  "Flammensack in seinem Körper\\n",
  "auf ca. 1 700 Grad erhitzt.$",
]

[msg.section_0.entries.137]
text = [
  "Ein von Menschen erschaffenes Pokémon,\\n",
  "das sich frei im künstlichen Raum\\n",
  "bewegen kann.$",
]

[msg.section_0.entries.138]
text = [
  "Dieses Pokémon wurde von der modernen\\n",
  "Wissenschaft aus einem Fossil ge-\\n",
  "schaffen. Es lebte im urzeitlichen Meer.$",
]

[msg.section_0.entries.139]
text = [
  "Man geht davon aus, dass das Pokémon\\n",
  "ausgestorben ist, weil seine\\n",
  "spiralförmige Schale zu groß wurde.$",
]

[msg.section_0.entries.140]
text = [
  "Man geht davon aus, dass dieses\\n",
  "Pokémon vor 300 Millionen Jahren\\n",
  "die Strände bevölkerte.$",
]

[msg.section_0.entries.141]
text = [
  "Man geht davon aus, dass dieses\\n",
  "Pokémon an Land kam, weil seine Beute\\n",
  "ebenfalls irgendwann an Land lebte.$",
]

[msg.section_0.entries.142]
text = [
  "Dieses Pokémon flog zu Zeiten der\\n",
  "Dinosaurier am Himmel. Seine Zähne\\n",
  "sind wie Sägeblätter.$",
]

[msg.section_0.entries.143]
text = [
  "Ist sein Magen voll, wird es sehr\\n",
  "lethargisch. Nun kann man problemlos\\n",
  "auf seinem Bauch umherspringen.$",
]

[msg.section_0.entries.144]
text = [
  "Ein Legendäres Vogel-Pokémon.\\n",
  "Es kann Blizzards verursachen,\\n",
  "indem es Feuchtigkeit gefriert.$",
]

[msg.section_0.entries.145]
text = [
  "Ein Legendäres Vogel-Pokémon,\\n",
  "das in Gewitterwolken leben soll.\\n",
  "Es kontrolliert Blitze.$",
]

[msg.section_0.entries.146]
text = [
  "Eines der Legendären Vogel-Pokémon.\\n",
  "Es wird als Bote des Frühlings\\n",
  "angesehen.$",
]

[msg.section_0.entries.147]
text = [
  "Man nennt es „Illusion-Pokémon“,\\n",
  "denn nur wenige haben es gesehen.\\n",
  "Nur seine Haut wurde oft gefunden.$",
]

[msg.section_0.entries.148]
text = [
  "Erscheint um seinen Körper eine Aura,\\n",
  "gibt es einen Wetterwechsel.\\n",
  "Es soll in Seen und Meeren leben.$",
]

[msg.section_0.entries.149]
text = [
  "Man sagt, es lebe in den Meeren.\\n",
  "Es bringt Schiffbrüchige sicher an Land.$",
]

[msg.section_0.entries.150]
text = [
  "Die Gene von Mew wurden neu\\n",
  "angeordnet, wodurch dieses Pokémon\\n",
  "entstand. Es hat ein wildes Herz.$",
]

[msg.section_0.entries.151]
text = [
  "Es beherrscht alle möglichen\\n",
  "Attacken, daher sieht man in ihm\\n",
  "den Vorfahren aller Pokémon.$",
]

[msg.section_0.entries.152]
text = [
  "Mit dem Blatt auf seinem Kopf bestimmt\\n",
  "es die Temperatur und Feuchtigkeit.\\n",
  "Es liebt Sonnenbäder.$",
]

[msg.section_0.entries.153]
text = [
  "Die Knospen an seinem Hals\\n",
  "geben ein würziges Aroma ab,\\n",
  "das andere aufheitert.$",
]

[msg.section_0.entries.154]
text = [
  "Mit seinem Atem kann es tote\\n",
  "Pflanzen und Blumen zu neuem\\n",
  "Leben erwecken.$",
]

[msg.section_0.entries.155]
text = [
  "Erschrickt sich dieses scheue\\n",
  "Pokémon, lodern die Flammen\\n",
  "auf seinem Rücken kräftiger.$",
]

[msg.section_0.entries.156]
text = [
  "Es bedroht seine Gegner mit der\\n",
  "Hitze seiner Flammen. Ist es\\n",
  "kampfbereit, lodern sie stärker.$",
]

[msg.section_0.entries.157]
text = [
  "Es greift seine Gegner mit Feuer an.\\n",
  "Dabei entsteht ein Hitzeflimmern, in\\n",
  "dem es sich versteckt.$",
]

[msg.section_0.entries.158]
text = [
  "Es hat die Angewohnheit, nach allem\\n",
  "zu schnappen, was es sieht. Selbst\\n",
  "seine Trainer müssen aufpassen.$",
]

[msg.section_0.entries.159]
text = [
  "Hat es einmal zugebissen, lässt\\n",
  "es erst los, wenn es seine Zähne\\n",
  "verliert, die schnell nachwachsen.$",
]

[msg.section_0.entries.160]
text = [
  "Eigentlich bewegt es sich\\n",
  "langsam, doch seine Beute\\n",
  "greift es blitzschnell an.$",
]

[msg.section_0.entries.161]
text = [
  "Ein sehr nervöses Pokémon.\\n",
  "Es steht auf seinem Schweif und\\n",
  "betrachtet seine Umgebung ganz genau.$",
]

[msg.section_0.entries.162]
text = [
  "Es rollt sich um seine Jungen,\\n",
  "wenn diese schlafen sollen.\\n",
  "Gegnern begegnet es mit Schnelligkeit.$",
]

[msg.section_0.entries.163]
text = [
  "Es sagt präzise die Uhrzeit an.\\n",
  "In manchen Regionen verehrt man\\n",
  "es zudem als weisen Freund.$",
]

[msg.section_0.entries.164]
text = [
  "Seine Augen sind so gut entwickelt,\\n",
  "dass es selbst in tiefster Dunkelheit\\n",
  "noch klar sehen kann.$",
]

[msg.section_0.entries.165]
text = [
  "Es ist so scheu, dass es sich\\n",
  "nur dann bewegt, wenn es sich\\n",
  "in einem Schwarm befindet.$",
]

[msg.section_0.entries.166]
text = [
  "Es zieht Energie aus dem Licht der\\n",
  "Sterne. Je mehr Sterne zu sehen sind,\\n",
  "desto größer ist sein Muster.$",
]

[msg.section_0.entries.167]
text = [
  "Es baut eine Falle, indem es ein\\n",
  "Netz mit dünner, starker Seide\\n",
  "spinnt. Es wartet still auf Beute.$",
]

[msg.section_0.entries.168]
text = [
  "Es befestigt Seide an der Beute und\\n",
  "lässt sie frei. Es folgt dem Seidenfaden\\n",
  "zur Beute und ihren Freunden.$",
]

[msg.section_0.entries.169]
text = [
  "Die Umwandlung seiner Beine in\\n",
  "Schwingen wirkte sich positiv aufs\\n",
  "Fliegen aus. Das Laufen litt eher.$",
]

[msg.section_0.entries.170]
text = [
  "Über seine Antennen entlädt es\\n",
  "Elektrizität, mit der es seinen\\n",
  "Gegnern einen Schlag versetzt.$",
]

[msg.section_0.entries.171]
text = [
  "Lanturns Licht kann aus großen\\n",
  "Tiefen heraufscheinen. Man nennt\\n",
  "es auch „Tiefseestern“.$",
]

[msg.section_0.entries.172]
text = [
  "Tritt auch nur eine geringe Menge\\n",
  "Elektrizität aus seinen Backen aus,\\n",
  "bekommt es einen Schlag.$",
]

[msg.section_0.entries.173]
text = [
  "Man sieht es oft, wenn der Himmel\\n",
  "voller Sterne hängt. Es soll auf einer\\n",
  "Sternschnuppe reiten.$",
]

[msg.section_0.entries.174]
text = [
  "Es hat einen weichen, elastischen\\n",
  "Körper. Hat es einmal angefangen\\n",
  "zu hüpfen, ist es nicht zu stoppen.$",
]

[msg.section_0.entries.175]
text = [
  "Wandelt die Güte und Freude anderer\\n",
  "in Glücksgefühle um, die es in seinem\\n",
  "Panzer speichert.$",
]

[msg.section_0.entries.176]
text = [
  "Um sein Glück mit anderen zu teilen,\\n",
  "fliegt es um die Welt auf der Suche\\n",
  "nach gutherzigen Menschen.$",
]

[msg.section_0.entries.177]
text = [
  "Es pickt seine Nahrung aus\\n",
  "Kakteen, wobei es Knospen\\n",
  "und Dornen verschont.$",
]

[msg.section_0.entries.178]
text = [
  "Dieses Pokémon kann die Vergangenheit\\n",
  "und die Zukunft sehen. Es beobachtet\\n",
  "ständig die Sonne.$",
]

[msg.section_0.entries.179]
text = [
  "Sein weiches Fell wird doppelt so dick,\\n",
  "wenn sich Elektrizität aufbaut.$",
]

[msg.section_0.entries.180]
text = [
  "Hat es sich mit Elektrizität aufgeladen,\\n",
  "leuchtet sein Schweif und es feuert\\n",
  "Haare ab, die sich entladen.$",
]

[msg.section_0.entries.181]
text = [
  "Seine Schweifspitze leuchtet hell.\\n",
  "In alten Zeiten hat man mit seiner\\n",
  "Hilfe Lichtsignale gegeben.$",
]

[msg.section_0.entries.182]
text = [
  "Sobald die Regenzeit vorbei ist, wird es\\n",
  "von der warmen Sonne nach draußen\\n",
  "gezogen, wo es tanzt.$",
]

[msg.section_0.entries.183]
text = [
  "Das ölgefüllte Ende seines Schweifs\\n",
  "schwimmt auf dem Wasser. Das rettet\\n",
  "Marill vor dem Ertrinken.$",
]

[msg.section_0.entries.184]
text = [
  "Kann den ganzen Tag im Wasser\\n",
  "verbringen, da es jede Menge\\n",
  "Luft einatmen und speichern kann.$",
]

[msg.section_0.entries.185]
text = [
  "Um einen Angriff zu vermeiden, ahmt\\n",
  "es einen Baum nach. Es hasst zudem\\n",
  "Wasser und flieht vor Regen.$",
]

[msg.section_0.entries.186]
text = [
  "Es versammelt andere Pokémon\\n",
  "um sich herum und führt sie an.\\n",
  "Quapsel gehorchen seinem Ruf.$",
]

[msg.section_0.entries.187]
text = [
  "Es reitet auf dem Wind. Man sagt,\\n",
  "wenn sich Hoppspross versammeln,\\n",
  "kommt der Frühling bald.$",
]

[msg.section_0.entries.188]
text = [
  "Sobald es wärmer wird, blüht es auf.\\n",
  "Es schwebt am Himmel und nimmt so\\n",
  "viel Sonnenlicht auf wie möglich.$",
]

[msg.section_0.entries.189]
text = [
  "Es lässt sich von den Winden um den\\n",
  "Globus tragen und verteilt auf\\n",
  "seinem Flug Baumwollsamen.$",
]

[msg.section_0.entries.190]
text = [
  "Lebt in den Baumwipfeln. Kann seinen\\n",
  "Schweif genauso gut wie seine Hände\\n",
  "verwenden.$",
]

[msg.section_0.entries.191]
text = [
  "Morgens fällt es plötzlich aus dem\\n",
  "Himmel. War der Sommer kalt,\\n",
  "explodiert seine Population.$",
]

[msg.section_0.entries.192]
text = [
  "Warmes Sonnenlicht gibt ihm Energie.\\n",
  "Daher wandert es stets dem Sonnenlicht\\n",
  "hinterher.$",
]

[msg.section_0.entries.193]
text = [
  "Schwebt auf der Stelle durch das\\n",
  "schnelle Schlagen seiner Flügel.\\n",
  "Hat ein Auge auf sein Territorium.$",
]

[msg.section_0.entries.194]
text = [
  "An Land bedeckt es die Haut mit\\n",
  "einer giftigen Schicht, die es vor\\n",
  "dem Austrocknen bewahrt.$",
]

[msg.section_0.entries.195]
text = [
  "Es ist sehr unbekümmert und stört\\n",
  "sich nicht daran, wenn es während\\n",
  "des Schwimmens an etwas stößt.$",
]

[msg.section_0.entries.196]
text = [
  "Kann durch sein Fell geringste\\n",
  "Luftveränderungen wahrnehmen\\n",
  "und das Wetter vorhersagen.$",
]

[msg.section_0.entries.197]
text = [
  "Wird es der Aura des Mondes ausgesetzt,\\n",
  "glühen seine Ringe und es erhält eine\\n",
  "mysteriöse Kraft.$",
]

[msg.section_0.entries.198]
text = [
  "Wird es entdeckt, lockt es seinen\\n",
  "Verfolger auf eine Jagd in die\\n",
  "Berge, wo es ihn dann abschüttelt.$",
]

[msg.section_0.entries.199]
text = [
  "Wird es von Muschas gebissen, wird\\n",
  "es so intelligent, dass es sich mit\\n",
  "Nobelpreisträgern messen kann.$",
]

[msg.section_0.entries.200]
text = [
  "Ein Pokémon, das Menschen mitten in\\n",
  "der Nacht erschreckt. Es sammelt die\\n",
  "Angst als seine Energie.$",
]

[msg.section_0.entries.201]
text = [
  "Sind sie zu zweit oder mehr, entsteht\\n",
  "eine eigentümliche Kraft. So sagt man\\n",
  "zumindest.$",
]

[msg.section_0.entries.202]
text = [
  "Verzweifelt versucht es, seinen\\n",
  "schwarzen Schweif zu verstecken.\\n",
  "Er soll ein Geheimnis enthalten.$",
]

[msg.section_0.entries.203]
text = [
  "Es kann sich in beide Richtungen\\n",
  "verteidigen, da der Kopf auf seinem\\n",
  "Schweif ein kleines Gehirn besitzt.$",
]

[msg.section_0.entries.204]
text = [
  "Es sieht aus wie ein Tannenzapfen.\\n",
  "Seine Schale schützt es vor Vogel-\\n",
  "Pokémon, die an ihm picken wollen.$",
]

[msg.section_0.entries.205]
text = [
  "Dieses Pokémon ist von einer Stahlhülle\\n",
  "umgeben. Seine stechenden Augen sind\\n",
  "alles, was man von ihm sieht.$",
]

[msg.section_0.entries.206]
text = [
  "Es gräbt sich mit seinem Schweif in\\n",
  "die Erde und baut ein labyrinthartiges\\n",
  "Nest. Es kann kaum fliegen.$",
]

[msg.section_0.entries.207]
text = [
  "Erschreckt Gegner, indem es sich\\n",
  "an ihre Gesichter klammert und dann\\n",
  "mit einem giftigen Stachel angreift.$",
]

[msg.section_0.entries.208]
text = [
  "Man glaubt, dass sich sein Körper\\n",
  "aufgrund des Schluckens von\\n",
  "eisenhaltiger Erde verwandelt habe.$",
]

[msg.section_0.entries.209]
text = [
  "Kleine Pokémon fliehen beim Anblick\\n",
  "seines Gesichts. Frauen aber finden\\n",
  "es niedlich.$",
]

[msg.section_0.entries.210]
text = [
  "Es ist trotz seines Äußeren schüchtern.\\n",
  "Wird es wütend, schnappt es mit seinen\\n",
  "Fängen zu.$",
]

[msg.section_0.entries.211]
text = [
  "Es verschießt die giftigen Stacheln\\n",
  "seines Körpers in alle Richtungen.\\n",
  "Es ist kein guter Schwimmer.$",
]

[msg.section_0.entries.212]
text = [
  "Setzt seine mit Markierungen\\n",
  "versehenen Scheren ein,\\n",
  "um Gegner einzuschüchtern.$",
]

[msg.section_0.entries.213]
text = [
  "In seiner Schale bewahrt es\\n",
  "Beeren auf. Diese fermentieren\\n",
  "zu einem leckeren Saft.$",
]

[msg.section_0.entries.214]
text = [
  "Es liebt süßen Honig. Um den ganzen\\n",
  "Honig für sich zu haben, schleudert\\n",
  "es Rivalen mit seinem Horn davon.$",
]

[msg.section_0.entries.215]
text = [
  "Ein raffiniertes Pokémon, das in\\n",
  "Zusammenarbeit mit einem anderen\\n",
  "Sniebel gern Eier stiehlt.$",
]

[msg.section_0.entries.216]
text = [
  "Es lässt Honig in seine Pranken\\n",
  "eindringen, so dass es immer\\n",
  "welchen dabeihat.$",
]

[msg.section_0.entries.217]
text = [
  "Es durchstreift sein Revier und\\n",
  "markiert Bäume, die Früchte\\n",
  "oder Beeren tragen, mit Kratzern.$",
]

[msg.section_0.entries.218]
text = [
  "Sein Körper besteht aus Magma. Bleibt\\n",
  "es nicht ständig in Bewegung, kühlt es\\n",
  "aus und verhärtet sich.$",
]

[msg.section_0.entries.219]
text = [
  "Seine Körpertemperatur beträgt\\n",
  "etwa 10 000 Grad. Aus seiner Schale\\n",
  "treten immer wieder Flammen aus.$",
]

[msg.section_0.entries.220]
text = [
  "Verfügt über eine äußerst sensible\\n",
  "Nase, die Pilze, Beeren und selbst\\n",
  "heiße Quellen unter dem Eis findet.$",
]

[msg.section_0.entries.221]
text = [
  "Schützt sich mit seinem dicken Fell\\n",
  "vor der Kälte. Seine Stoßzähne aus\\n",
  "Eis werden dicker, wenn es schneit.$",
]

[msg.section_0.entries.222]
text = [
  "Viele von ihnen leben in den sauberen\\n",
  "Seen im Süden. In verschmutzten\\n",
  "können sie nicht leben.$",
]

[msg.section_0.entries.223]
text = [
  "Sein starker Wasserstrahl verfehlt\\n",
  "seine Gegner auch dann nicht,\\n",
  "wenn das Remoraid unter Wasser ist.$",
]

[msg.section_0.entries.224]
text = [
  "Es lauert gern in den Löchern von\\n",
  "Felsen, um vorbeischwimmende\\n",
  "Beute mit Tinte zu bespritzen.$",
]

[msg.section_0.entries.225]
text = [
  "Im eingerollten Schweif transportiert\\n",
  "es Futter, das es mit denen teilt, die\\n",
  "sich verlaufen haben.$",
]

[msg.section_0.entries.226]
text = [
  "Zieht elegant durch die Meere und\\n",
  "ignoriert dabei Remoraid,\\n",
  "die an seinen Flossen haften.$",
]

[msg.section_0.entries.227]
text = [
  "Es wird komplett von einer eisenharten\\n",
  "Rüstung geschützt. Wenn es fliegt,\\n",
  "erreicht es bis zu 300 km/h.$",
]

[msg.section_0.entries.228]
text = [
  "Es jagt in Rudeln und kommuniziert\\n",
  "über eine ganze Reihe von Rufen mit\\n",
  "anderen Hunduster.$",
]

[msg.section_0.entries.229]
text = [
  "Ist es wütend, spuckt es giftige\\n",
  "Flammen. Die Schmerzen der\\n",
  "Verbrennungen dauern ewig an.$",
]

[msg.section_0.entries.230]
text = [
  "Es lebt in Höhlen auf dem Meeresgrund.\\n",
  "Jedes Mal, wenn es sich bewegt,\\n",
  "entsteht ein Strudel.$",
]

[msg.section_0.entries.231]
text = [
  "Trotz seiner geringen Größe ist es\\n",
  "stark. Es kann einen Erwachsenen\\n",
  "mühelos auf dem Rücken tragen.$",
]

[msg.section_0.entries.232]
text = [
  "Wenn es angreift, rollt es sich\\n",
  "zusammen und auf den Gegner zu.\\n",
  "Es kann Häuser zum Einsturz bringen.$",
]

[msg.section_0.entries.233]
text = [
  "Wurde zur Erforschung anderer\\n",
  "Planeten weiterentwickelt. Diesem\\n",
  "Anspruch wurde es nicht gerecht.$",
]

[msg.section_0.entries.234]
text = [
  "Starrt man auf sein Geweih,\\n",
  "bekommt man das seltsame Gefühl,\\n",
  "in dessen Mitte gezogen zu werden.$",
]

[msg.section_0.entries.235]
text = [
  "Sein Revier markiert es mit seinem\\n",
  "pinselartigen Schweif. Es kennt mehr\\n",
  "als 5 000 Markierungen.$",
]

[msg.section_0.entries.236]
text = [
  "Es ist bekannt für seine\\n",
  "Kampfbegierde. Es erholt sich\\n",
  "ständig von Verletzungen.$",
]

[msg.section_0.entries.237]
text = [
  "Es kämpft, während es sich wie ein\\n",
  "Kreisel dreht. Die Zentrifugalkraft\\n",
  "erhöht die Kampfkraft um 10.$",
]

[msg.section_0.entries.238]
text = [
  "Dieses Pokémon berührt alles mit den\\n",
  "Lippen. Diese merken sich, was es mag\\n",
  "und nicht mag.$",
]

[msg.section_0.entries.239]
text = [
  "Ein schwacher Stromfluss fließt\\n",
  "zwischen seinen Hörnern. Die\\n",
  "Hände sollte man davon fernhalten.$",
]

[msg.section_0.entries.240]
text = [
  "Durch seinen Körper fließt\\n",
  "magmaartiges Blut. Die Körpertemperatur\\n",
  "kann auf ca. 600 Grad steigen.$",
]

[msg.section_0.entries.241]
text = [
  "Man sagt, dass Kinder, die Miltanks\\n",
  "Milch trinken, zu gesunden\\n",
  "Erwachsenen heranwachsen.$",
]

[msg.section_0.entries.242]
text = [
  "Eier, die es legt, stecken voller\\n",
  "Fröhlichkeit. Schon ein Bissen\\n",
  "erzeugt ein breites Lächeln.$",
]

[msg.section_0.entries.243]
text = [
  "Dieses Pokémon ist der personifizierte\\n",
  "Blitz. Es kann aus den Wolken über\\n",
  "seinem Rücken Blitze schleudern.$",
]

[msg.section_0.entries.244]
text = [
  "Man sagt, wenn es brüllt, bricht\\n",
  "irgendwo in der Welt ein Vulkan aus.$",
]

[msg.section_0.entries.245]
text = [
  "Es wandert beständig in der Welt herum,\\n",
  "um verunreinigtes Wasser zu reinigen.\\n",
  "Es zieht mit dem Nordwind.$",
]

[msg.section_0.entries.246]
text = [
  "Dieses Pokémon frisst das Erdreich.\\n",
  "Hat es einen Berg verspeist,\\n",
  "schläft es ein, um zu wachsen.$",
]

[msg.section_0.entries.247]
text = [
  "Sein Körper ist hart wie Fels.\\n",
  "Es lässt mit Hochdruck Gas ab, um wie\\n",
  "eine Rakete nach oben zu schießen.$",
]

[msg.section_0.entries.248]
text = [
  "Bei einem Tobsuchtsanfall\\n",
  "zerstört es ganze Gebirge und\\n",
  "legt Flüsse trocken.$",
]

[msg.section_0.entries.249]
text = [
  "Es schläft in einem Tiefseegraben.\\n",
  "Schwingt es seine Flügel, entsteht\\n",
  "ein Sturm, der 40 Tage dauert.$",
]

[msg.section_0.entries.250]
text = [
  "Seine Federn besitzen 7 Farben.\\n",
  "Man sagt, dass demjenigen, der es\\n",
  "sieht, ewiges Glück beschieden ist.$",
]

[msg.section_0.entries.251]
text = [
  "Es kann durch die Zeit reisen,\\n",
  "aber es erscheint nur zu\\n",
  "friedlichen Zeiten.$",
]

[msg.section_0.entries.252]
text = [
  "Seine Fußsohlen sind mit kleinen\\n",
  "Stacheln bedeckt, so dass es\\n",
  "an Wänden und Decken Halt findet.$",
]

[msg.section_0.entries.253]
text = [
  "Es lebt im dichten Dschungel.\\n",
  "Es springt von Ast zu Ast,\\n",
  "wenn es sich einer Beute nähert.$",
]

[msg.section_0.entries.254]
text = [
  "Die Blätter an seinen Armen können dicke\\n",
  "Bäume fällen. Im Dschungelkampf gibt es\\n",
  "kein stärkeres Pokémon.$",
]

[msg.section_0.entries.255]
text = [
  "In seinem Inneren lodert\\n",
  "ein Feuer. Es schleudert\\n",
  "1 000 Grad heiße Feuerbälle.$",
]

[msg.section_0.entries.256]
text = [
  "Es kann 10 Tritte pro Sekunde austeilen.\\n",
  "Es gibt schrille Schreie von sich,\\n",
  "um Gegner einzuschüchtern.$",
]

[msg.section_0.entries.257]
text = [
  "Aus seinen Handgelenken kommt\\n",
  "Feuer, das seine Knöchel umhüllt.\\n",
  "Schläge verbrennen den Gegner.$",
]

[msg.section_0.entries.258]
text = [
  "Die Flosse auf seinem Kopf prüft\\n",
  "die Strömung des Wassers. Dieses\\n",
  "Pokémon kann Felsen heben.$",
]

[msg.section_0.entries.259]
text = [
  "Seine kräftigen Beine geben ihm\\n",
  "sicheren Halt. Es gräbt sich in\\n",
  "Dreck ein, wenn es schlafen will.$",
]

[msg.section_0.entries.260]
text = [
  "Es kann im Schwimmen ein großes\\n",
  "Schiff ziehen. Seine Gegner schlägt\\n",
  "es mit Schlägen seiner Arme zurück.$",
]

[msg.section_0.entries.261]
text = [
  "Ein beharrliches Pokémon, das seine\\n",
  "Beute jagt, bis diese erschöpft ist.$",
]

[msg.section_0.entries.262]
text = [
  "Es jagt seine Beute im Rudel.\\n",
  "Den Befehlen eines erfahrenen\\n",
  "Trainers wird es stets folgen.$",
]

[msg.section_0.entries.263]
text = [
  "Es läuft im Zickzack. Es hat das\\n",
  "Talent, Items im Gras, aber auch\\n",
  "im Boden, zu finden.$",
]

[msg.section_0.entries.264]
text = [
  "Es stürzt sich mit 100 km/h auf Beute.\\n",
  "Aber es kann nur geradeaus laufen\\n",
  "und die Jagd misslingt oft.$",
]

[msg.section_0.entries.265]
text = [
  "Es wird oft von Vogel-Pokémon\\n",
  "angegriffen, wehrt sich aber mit\\n",
  "Gift aus seinen Schwanzspitzen.$",
]

[msg.section_0.entries.266]
text = [
  "Es bindet sich mit Seide an Äste\\n",
  "und trinkt Regenwasser, während es\\n",
  "starr auf seine Entwicklung wartet.$",
]

[msg.section_0.entries.267]
text = [
  "Stört man es, während es Pollen sucht,\\n",
  "stößt es mit seinem langen, dünnen\\n",
  "Mund zu.$",
]

[msg.section_0.entries.268]
text = [
  "Es vergisst keinen Angriff, den es\\n",
  "im Kokon erdulden musste. Nach\\n",
  "der Entwicklung sinnt es auf Rache.$",
]

[msg.section_0.entries.269]
text = [
  "Es streut mit jedem Flügelschlag\\n",
  "giftiges Pulver. Nachts entfernt es\\n",
  "die Blätter von Bäumen an Alleen.$",
]

[msg.section_0.entries.270]
text = [
  "Es sieht aus wie eine Wasserpflanze.\\n",
  "Es dient den Pokémon, die nicht\\n",
  "schwimmen können, als Fähre.$",
]

[msg.section_0.entries.271]
text = [
  "Es hat ein spitzbübisches Wesen.\\n",
  "Sieht es einen Angler, zieht es an\\n",
  "der Angelschnur, um ihn zu ärgern.$",
]

[msg.section_0.entries.272]
text = [
  "Hört es fröhliche Musik, füllen\\n",
  "sich seine Muskeln mit Energie.\\n",
  "Es muss dann einfach tanzen.$",
]

[msg.section_0.entries.273]
text = [
  "Es sieht aus wie eine Eichel, die am\\n",
  "Baum hängt. Es liebt es, andere\\n",
  "Pokémon zu erschrecken.$",
]

[msg.section_0.entries.274]
text = [
  "Der Ton seiner Grasflöte beunruhigt die,\\n",
  "die ihn hören. Es lebt tief in den\\n",
  "Wäldern.$",
]

[msg.section_0.entries.275]
text = [
  "Seine großen Fächer erzeugen\\n",
  "Böen, die eine Geschwindigkeit\\n",
  "von 30 m/sek erreichen können.$",
]

[msg.section_0.entries.276]
text = [
  "Es ist sehr mutig und stellt sich\\n",
  "auch starken Gegnern. Es sucht\\n",
  "ständig nach warmen Regionen.$",
]

[msg.section_0.entries.277]
text = [
  "Es fliegt auf der Suche nach Beute\\n",
  "ständig umher. Findet es Beute,\\n",
  "stürzt es sich im Sturzflug auf sie.$",
]

[msg.section_0.entries.278]
text = [
  "Es nutzt Aufwinde, um hoch oben in\\n",
  "den Lüften zu schweben. Es trägt\\n",
  "Futter in seinem Schnabel umher.$",
]

[msg.section_0.entries.279]
text = [
  "Ein Bote der Lüfte. Bringt Eier\\n",
  "und kleine Pokémon in seinem\\n",
  "Schnabel in Sicherheit.$",
]

[msg.section_0.entries.280]
text = [
  "Es erfasst warme Gefühle von\\n",
  "Menschen und Pokémon mit seinen\\n",
  "Hörnern und wärmt sich daran auf.$",
]

[msg.section_0.entries.281]
text = [
  "Ist sein Trainer glücklich,\\n",
  "tanzt es in einem Schwall\\n",
  "von Energie fröhlich umher.$",
]

[msg.section_0.entries.282]
text = [
  "Erzeugt ein kleines schwarzes Loch\\n",
  "mithilfe all seiner Psycho-Kräfte,\\n",
  "um seinen Trainer zu schützen.$",
]

[msg.section_0.entries.283]
text = [
  "Scheinbar reitet es auf dem\\n",
  "Wasser. Es lockt seine Beute\\n",
  "mit einem süßen Duft an.$",
]

[msg.section_0.entries.284]
text = [
  "Seine Antenne besitzt ein Augenmuster.\\n",
  "Seine vier Flügel erlauben es,\\n",
  "in alle Richtungen zu fliegen.$",
]

[msg.section_0.entries.285]
text = [
  "Es setzt an seinem Kopf Giftsporen frei.\\n",
  "Werden diese eingeatmet, verursachen\\n",
  "sie Schmerzen.$",
]

[msg.section_0.entries.286]
text = [
  "Seine kurzen Arme dehnen sich aus,\\n",
  "wenn es zuschlägt. Seine Technik\\n",
  "ähnelt der von Profi-Boxern.$",
]

[msg.section_0.entries.287]
text = [
  "Es verbringt fast den ganzen Tag\\n",
  "mit Faulenzen und Schlafen. Selbst\\n",
  "sein Anblick macht bereits müde.$",
]

[msg.section_0.entries.288]
text = [
  "Sein Herz schlägt schneller als das\\n",
  "anderer Lebewesen. Daher kann es\\n",
  "nicht für einen Moment still sitzen.$",
]

[msg.section_0.entries.289]
text = [
  "Das faulste Pokémon der Welt. Wenn es\\n",
  "faulenzt, sammelt es in Wahrheit Energie,\\n",
  "um zuzuschlagen.$",
]

[msg.section_0.entries.290]
text = [
  "Es wächst unterirdisch heran und nimmt\\n",
  "seine Umgebung mit Antennen wahr, da\\n",
  "es nahezu blind ist.$",
]

[msg.section_0.entries.291]
text = [
  "Es bewegt sich so schnell, dass es\\n",
  "manchmal unsichtbar zu sein scheint.\\n",
  "Es liebt Baumsaft.$",
]

[msg.section_0.entries.292]
text = [
  "Ein weggeworfener Käferpanzer,\\n",
  "der zum Leben erwachte. Schaut man\\n",
  "hinein, stiehlt es einem die Seele.$",
]

[msg.section_0.entries.293]
text = [
  "Normalerweise klingen seine Rufe\\n",
  "wie Gemurmel. Hat es aber Angst,\\n",
  "ist es so laut wie ein Flugzeug.$",
]

[msg.section_0.entries.294]
text = [
  "Die Schockwellen, die durch sein\\n",
  "Rufen entstehen, können einen\\n",
  "LKW umkippen.$",
]

[msg.section_0.entries.295]
text = [
  "Sein Heulen hört man in 10 km\\n",
  "Entfernung. Es gibt alle Arten\\n",
  "von Geräuschen von sich.$",
]

[msg.section_0.entries.296]
text = [
  "Es stärkt seinen Körper, indem es\\n",
  "gegen Bäume rennt. In seiner Nähe\\n",
  "finden sich viele umgekippte Bäume.$",
]

[msg.section_0.entries.297]
text = [
  "Es liebt das Kräftemessen mit großen\\n",
  "Pokémon. Mit seinem Armwurf kann\\n",
  "es LKW durch die Luft werfen.$",
]

[msg.section_0.entries.298]
text = [
  "Sein Schweif prallt auf wie ein\\n",
  "Gummiball. Bekämpft größere Gegner\\n",
  "durch Schwingen des Schweifs.$",
]

[msg.section_0.entries.299]
text = [
  "Es schützt sich bei Gefahr durch\\n",
  "Gegenstände aus Eisen, die es mit\\n",
  "erhöhtem Magnetismus an sich zieht.$",
]

[msg.section_0.entries.300]
text = [
  "Es muss Dinge, die sich bewegen,\\n",
  "einfach jagen. Es rennt oft im Kreis\\n",
  "und jagt seinen eigenen Schweif.$",
]

[msg.section_0.entries.301]
text = [
  "Dieses Pokémon ist bei weiblichen\\n",
  "Trainern aufgrund seines Fells beliebt.$",
]

[msg.section_0.entries.302]
text = [
  "Es versteckt sich im Dunkeln von\\n",
  "Höhlen. Seine Augen sind Edelsteine.$",
]

[msg.section_0.entries.303]
text = [
  "Auf seinem Kopf befindet sich ein\\n",
  "riesiger Kiefer, der aus Hörnern\\n",
  "besteht. Er kann Eisen zermalmen.$",
]

[msg.section_0.entries.304]
text = [
  "Normalerweise lebt es in dunklen\\n",
  "Bergen. Ist es hungrig, frisst es\\n",
  "auch Eisenbahnschienen und Autos.$",
]

[msg.section_0.entries.305]
text = [
  "Es ernährt sich von Eisenerz.\\n",
  "Um sein Revier zu sichern, setzt\\n",
  "es seinen harten Körper ein.$",
]

[msg.section_0.entries.306]
text = [
  "Auf der Suche nach Eisen, seiner\\n",
  "Nahrung, gräbt es mit seinen\\n",
  "Stahlhörnern sogar Tunnel durch Felsen.$",
]

[msg.section_0.entries.307]
text = [
  "Trainiert tief in den Bergen. Erhöht\\n",
  "es seine spirituelle Kraft durch\\n",
  "Meditation, kann es schweben.$",
]

[msg.section_0.entries.308]
text = [
  "Es kann die Aura seines Gegners\\n",
  "erkennen, indem es durch Hungern\\n",
  "seinen Geist schärft.$",
]

[msg.section_0.entries.309]
text = [
  "Die Elektrizität, die es im Fell\\n",
  "speichert, nutzt es, um seine\\n",
  "Muskeln zu stimulieren.$",
]

[msg.section_0.entries.310]
text = [
  "Aus seiner Mähne entlädt es Elekt-\\n",
  "rizität. Es generiert eine Gewitter-\\n",
  "wolke, aus der es Blitze entlädt.$",
]

[msg.section_0.entries.311]
text = [
  "Es feuert Freunde mit Pompons an,\\n",
  "die aus Funken bestehen. Es holt\\n",
  "sich Energie aus Telegrafenmasten.$",
]

[msg.section_0.entries.312]
text = [
  "Es feuert Freunde an. Sind diese im\\n",
  "Begriff zu verlieren, gibt sein Körper\\n",
  "immer mehr Funken ab.$",
]

[msg.section_0.entries.313]
text = [
  "Es kommuniziert mit anderen, indem\\n",
  "es sein Hinterteil zum Leuchten bringt.\\n",
  "Es liebt Illumises Duft.$",
]

[msg.section_0.entries.314]
text = [
  "Sein süßer Duft leitet Volbeat an,\\n",
  "Zeichen aus Licht an den\\n",
  "Nachthimmel zu malen.$",
]

[msg.section_0.entries.315]
text = [
  "Je gesünder das Roselia, desto\\n",
  "angenehmer das Aroma seiner Blume,\\n",
  "das Menschen so sehr entspannt.$",
]

[msg.section_0.entries.316]
text = [
  "Sein Körper besteht fast nur aus Magen.\\n",
  "Seine starken Verdauungssäfte\\n",
  "zersetzen alles sehr schnell.$",
]

[msg.section_0.entries.317]
text = [
  "Es verschluckt alles in einem Stück\\n",
  "und sondert giftige Stoffe ab, mit\\n",
  "denen es Gegner besprüht.$",
]

[msg.section_0.entries.318]
text = [
  "Sie begegnen jedem Gegner, der in\\n",
  "ihr Revier eindringt, im Schwarm. Ihre\\n",
  "Zähne durchdringen alles.$",
]

[msg.section_0.entries.319]
text = [
  "Seine Zähne durchdringen sogar Eisen.\\n",
  "Es schwimmt mit 120 km/h und wird\\n",
  "„Tyrann des Meeres“ genannt.$",
]

[msg.section_0.entries.320]
text = [
  "An sonnigen Tagen trifft man diese\\n",
  "Pokémon an Stränden, wo sie wie\\n",
  "Bälle herumhüpfen.$",
]

[msg.section_0.entries.321]
text = [
  "Das größte Pokémon. Es kann mit\\n",
  "nur einem Atemzug in Tiefen bis\\n",
  "3 000 Meter tauchen.$",
]

[msg.section_0.entries.322]
text = [
  "In seinem Rücken speichert es sehr\\n",
  "heißes Magma. Regnet es, kühlt das\\n",
  "Magma ab und es wird langsamer.$",
]

[msg.section_0.entries.323]
text = [
  "Auf seinem Rücken befinden sich Vulkane.\\n",
  "Magma bildet sich in seinem Körper, das\\n",
  "irgendwann ausbricht.$",
]

[msg.section_0.entries.324]
text = [
  "In seinem Panzer verbrennt es\\n",
  "Kohle und gewinnt daraus Energie.\\n",
  "Bei Gefahr sondert es Ruß ab.$",
]

[msg.section_0.entries.325]
text = [
  "Es hüpft beständig umher, wobei es\\n",
  "seinen Schweif als Feder verwendet.\\n",
  "Nur so bleibt sein Herz aktiv.$",
]

[msg.section_0.entries.326]
text = [
  "Mit schwarzen Perlen verstärkt es\\n",
  "seine Psycho-Kräfte. Mit einem\\n",
  "Tanz kontrolliert es seine Gegner.$",
]

[msg.section_0.entries.327]
text = [
  "Das Muster eines Pandir ist wie ein\\n",
  "Fingerabdruck. Sein Taumeln senkt\\n",
  "die gegnerische Zielsicherheit.$",
]

[msg.section_0.entries.328]
text = [
  "Es baut im Wüstensand eine Fallgrube,\\n",
  "setzt sich in ihr auf den Boden und\\n",
  "wartet auf Beute.$",
]

[msg.section_0.entries.329]
text = [
  "Es schlägt wild mit den Flügeln.\\n",
  "So entstehen Ultraschallwellen,\\n",
  "die Kopfschmerzen verursachen.$",
]

[msg.section_0.entries.330]
text = [
  "Mit mächtigem Flügelschlag ver-\\n",
  "ursacht es einen Sandsturm. Es wird\\n",
  "„Geist der Wüste“ genannt.$",
]

[msg.section_0.entries.331]
text = [
  "Dieser Wüstenbewohner speichert\\n",
  "Wasser in seinem Körper. So kann\\n",
  "er 30 Tage ohne Wasser überleben.$",
]

[msg.section_0.entries.332]
text = [
  "Ein nachtaktives Pokémon, das Beute\\n",
  "sucht, die durch die Tageshitze der\\n",
  "Wüste bereits erschöpft ist.$",
]

[msg.section_0.entries.333]
text = [
  "Es kann nicht entspannen, wenn\\n",
  "es oder seine Umgebung dreckig\\n",
  "ist. Säubert alles mit den Flügeln.$",
]

[msg.section_0.entries.334]
text = [
  "Freundet es sich mit jemandem an,\\n",
  "hüllt es den Freund sanft mit den\\n",
  "Flügeln ein und singt dann.$",
]

[msg.section_0.entries.335]
text = [
  "Seit Generationen ist es mit\\n",
  "Vipitis verfeindet. Seine scharfen\\n",
  "Klauen sind seine stärksten Waffen.$",
]

[msg.section_0.entries.336]
text = [
  "Seit Generationen ist es mit Sengo\\n",
  "verfeindet. Es wetzt seinen\\n",
  "scharfen Schweif an Felsen.$",
]

[msg.section_0.entries.337]
text = [
  "Da es in Vollmondnächten aktiv wird,\\n",
  "sagt man ihm nach, mit den Mondphasen\\n",
  "in Verbindung zu stehen.$",
]

[msg.section_0.entries.338]
text = [
  "Eine neue Pokémon-Spezies, von der\\n",
  "man annimmt, sie käme von der Sonne.\\n",
  "Sie strahlt Licht ab.$",
]

[msg.section_0.entries.339]
text = [
  "Sein schlanker Körper ist schwer zu\\n",
  "greifen. Man vermutet, es sei aus\\n",
  "gehärtetem Schlamm entstanden.$",
]

[msg.section_0.entries.340]
text = [
  "Es bewacht sein Territorium.\\n",
  "Nähert sich ein Gegner, greift es\\n",
  "mit heftigen Erschütterungen an.$",
]

[msg.section_0.entries.341]
text = [
  "Ein robustes Pokémon, das sich jeder\\n",
  "Umgebung anpassen kann. Seine\\n",
  "Zangen geben keine Beute frei.$",
]

[msg.section_0.entries.342]
text = [
  "Dieser Grobian ergreift andere Pokémon\\n",
  "mit seinen Scheren und wirft sie aus\\n",
  "seinem Teich.$",
]

[msg.section_0.entries.343]
text = [
  "Es bewegt sich, indem es sich auf seinem\\n",
  "Fuß dreht. Ein seltenes Pokémon, das in\\n",
  "alten Ruinen lebte.$",
]

[msg.section_0.entries.344]
text = [
  "Eine antike Lehmstatue, die durch ein\\n",
  "mysteriöses Licht zum Leben erwacht ist.$",
]

[msg.section_0.entries.345]
text = [
  "Vor 100 Millionen Jahren lebte dieses\\n",
  "Pokémon auf dem Meeresgrund.\\n",
  "Die Wissenschaft belebte es neu.$",
]

[msg.section_0.entries.346]
text = [
  "Es lebt in seichten Stellen warmer Meere.\\n",
  "Bei Ebbe sucht es im Sand nach Beute.$",
]

[msg.section_0.entries.347]
text = [
  "Ein Vorfahre der Pokémon, der aus einem\\n",
  "Fossil neu belebt wurde. Es lebte im Meer\\n",
  "und jagte mit Klauen.$",
]

[msg.section_0.entries.348]
text = [
  "Nach seiner Entwicklung ging es an Land.\\n",
  "Sein Körper ist von einer robusten\\n",
  "Rüstung umgeben.$",
]

[msg.section_0.entries.349]
text = [
  "Ein schäbiges, ja sogar hässliches\\n",
  "Pokémon. Dafür ist es abgehärtet\\n",
  "und überlebt mit wenig Wasser.$",
]

[msg.section_0.entries.350]
text = [
  "Seine Schuppen sind regenbogenfarben.\\n",
  "Die jeweiligen Farben verändern sich\\n",
  "je nach Blickwinkel.$",
]

[msg.section_0.entries.351]
text = [
  "Seine Gestalt ändert sich mit dem\\n",
  "Wetter. Vor kurzem entdeckte man,\\n",
  "dass seine Moleküle wie Wasser sind.$",
]

[msg.section_0.entries.352]
text = [
  "Es kann nach Belieben seine Farbe\\n",
  "ändern. Nur das gezackte Muster\\n",
  "auf seinem Bauch bleibt gleich.$",
]

[msg.section_0.entries.353]
text = [
  "Es liebt Rachegefühle. Diese Pokémon\\n",
  "hängen sich an Dachrinnen von Häusern,\\n",
  "in denen Rachsüchtige leben.$",
]

[msg.section_0.entries.354]
text = [
  "Dieses Pokémon war eine Puppe, die\\n",
  "weggeworfen wurde. Es sucht nun\\n",
  "das Kind, das dies getan hat.$",
]

[msg.section_0.entries.355]
text = [
  "Es mag das Weinen von Kindern.\\n",
  "Erschreckt gemeine Kinder,\\n",
  "indem es durch Wände geht.$",
]

[msg.section_0.entries.356]
text = [
  "Sucht dahintreibende Irrlichter und\\n",
  "saugt sie in seinen leeren Körper.\\n",
  "Alles andere ist ein Rätsel.$",
]

[msg.section_0.entries.357]
text = [
  "Isst immer dieselbe Art köstlicher\\n",
  "Früchte. Mittlerweile wachsen sie\\n",
  "sogar schon aus seinem Hals.$",
]

[msg.section_0.entries.358]
text = [
  "Es ruft ein Echo in seinen Körper,\\n",
  "das in Form wunderschöner Noten\\n",
  "empordringt und Gegner erschreckt.$",
]

[msg.section_0.entries.359]
text = [
  "Man glaubt, es ahne mit seinen\\n",
  "Hörnern Katastrophen voraus.\\n",
  "Aus Angst floh es in die Berge.$",
]

[msg.section_0.entries.360]
text = [
  "Es wird stärker, indem es andere\\n",
  "ständig anrempelt. Es liebt Süßigkeiten.$",
]

[msg.section_0.entries.361]
text = [
  "Gerüchten zufolge sammeln sich\\n",
  "Schneppke unter riesigen Blättern\\n",
  "und leben dort friedlich zusammen.$",
]

[msg.section_0.entries.362]
text = [
  "Es verhindert, dass Beute flieht,\\n",
  "indem es die Feuchtigkeit in der\\n",
  "Luft augenblicklich einfriert.$",
]

[msg.section_0.entries.363]
text = [
  "Es rollt über Eisschollen, um Land\\n",
  "zu erreichen, da sein Körper zum\\n",
  "Schwimmen nicht geeignet ist.$",
]

[msg.section_0.entries.364]
text = [
  "Es balanciert Dinge auf seiner Nase.\\n",
  "Dabei lernt es etwas über die\\n",
  "Beschaffenheit und den Geruch.$",
]

[msg.section_0.entries.365]
text = [
  "Mit seinen Stoßzähnen bricht es\\n",
  "durch Eis. Eine Speckschicht\\n",
  "schützt es vor Kälte und Angriffen.$",
]

[msg.section_0.entries.366]
text = [
  "In seinem Leben erschafft es\\n",
  "eine einzige Perle. Diese soll\\n",
  "Psycho-Kräfte verstärken.$",
]

[msg.section_0.entries.367]
text = [
  "Es lebt tief im Meer. Sein Schweif\\n",
  "ist wie ein kleiner Fisch geformt.\\n",
  "Mit ihm lockt es Beute an.$",
]

[msg.section_0.entries.368]
text = [
  "Es lebt auf dem Grund des Meeres.\\n",
  "Im Frühling wirkt die Farbe seines\\n",
  "Körpers viel kräftiger.$",
]

[msg.section_0.entries.369]
text = [
  "Tiefseeforscher fanden dieses seltene\\n",
  "Pokémon, das sich in 100 Mio. Jahren\\n",
  "nicht verändert hat.$",
]

[msg.section_0.entries.370]
text = [
  "Es lebt in warmen Meeren. Man sagt,\\n",
  "dass Verliebte, die es sehen, mit\\n",
  "ewiger Liebe gesegnet sind.$",
]

[msg.section_0.entries.371]
text = [
  "Es träumt davon, eines Tages\\n",
  "fliegen zu können und springt daher\\n",
  "jeden Tag von hohen Klippen.$",
]

[msg.section_0.entries.372]
text = [
  "Die Zellen seines Panzers fingen an,\\n",
  "sich zu verändern. Er fällt ab,\\n",
  "sobald sich das Pokémon entwickelt.$",
]

[msg.section_0.entries.373]
text = [
  "Seine Zellstruktur änderte sich,\\n",
  "es wuchsen ihm Flügel, da es immer\\n",
  "davon träumte, fliegen zu können.$",
]

[msg.section_0.entries.374]
text = [
  "Es kommuniziert mit anderen durch\\n",
  "magnetische Impulse. Im Schwarm\\n",
  "bilden sie eine perfekte Einheit.$",
]

[msg.section_0.entries.375]
text = [
  "Das Pokémon besteht aus zwei Tanhel.\\n",
  "Es bekommt selbst dann keinen Kratzer,\\n",
  "wenn ein Jet es streift.$",
]

[msg.section_0.entries.376]
text = [
  "Mehrere Metang bilden dieses Pokémon.\\n",
  "Mit seinen vier Gehirnen besitzt es die\\n",
  "Intelligenz eines Supercomputers.$",
]

[msg.section_0.entries.377]
text = [
  "Sein Körper besteht aus Stein. Bricht\\n",
  "im Kampf etwas heraus, wird es durch\\n",
  "Stein wieder ersetzt.$",
]

[msg.section_0.entries.378]
text = [
  "Sein Körper besteht aus Eis aus der\\n",
  "Eiszeit. Es kontrolliert gefrorene Luft,\\n",
  "die minus 200 Grad kalt ist.$",
]

[msg.section_0.entries.379]
text = [
  "Im Laufe der Jahrtausende, die es\\n",
  "unterirdisch lebte, wurde sein\\n",
  "Körper durch Druck und Wärme hart.$",
]

[msg.section_0.entries.380]
text = [
  "Sein Körper ist mit Daunen bedeckt,\\n",
  "die das Licht so brechen, dass das\\n",
  "Pokémon unsichtbar wird.$",
]

[msg.section_0.entries.381]
text = [
  "Ein hochintelligentes Pokémon. Wenn\\n",
  "es im Flug seine Flügel nach hinten\\n",
  "legt, ist es schneller als ein Jet.$",
]

[msg.section_0.entries.382]
text = [
  "Man sagt, es habe die Meere\\n",
  "vergrößert, indem es es regnen ließ.\\n",
  "Es schlief in einem Meeresgraben.$",
]

[msg.section_0.entries.383]
text = [
  "Es hat seit dem Kampf gegen Kyogre\\n",
  "in Magma unter dem Erdboden geschlafen.$",
]

[msg.section_0.entries.384]
text = [
  "Es lebt in der Ozonschicht hoch\\n",
  "über den Wolken und kann vom\\n",
  "Boden aus nicht gesehen werden.$",
]

[msg.section_0.entries.385]
text = [
  "Man sagt, es kann alle tausend Jahre\\n",
  "für eine Woche jeden Wunsch erfüllen.$",
]

[msg.section_0.entries.386]
text = [
  "Ein außerirdischer Virus kam mit einem\\n",
  "Meteor auf die Erde. Seine DNA mutierte.\\n",
  "So entstand Deoxys.$",
]

[msg.section_0.entries.387]
text = [
  "Der Panzer auf seinem Rücken besteht\\n",
  "aus Erdreich. Bei gesunden Chelast ist\\n",
  "der Panzer feucht.$",
]

[msg.section_0.entries.388]
text = [
  "Es weiß, wo es reinstes Quellwasser\\n",
  "finden kann. Trägt andere Pokémon\\n",
  "auf seinem Rücken dorthin.$",
]

[msg.section_0.entries.389]
text = [
  "Manche Pokémon werden auf dem Rücken\\n",
  "eines Chelterrar geboren und\\n",
  "verbringen ihr ganzes Leben dort.$",
]

[msg.section_0.entries.390]
text = [
  "Dieses flinke Pokémon löscht vor dem\\n",
  "Schlafengehen die Flamme auf seinem\\n",
  "Schweif, um Feuer zu verhindern.$",
]

[msg.section_0.entries.391]
text = [
  "Es kontrolliert die Stärke des Feuers\\n",
  "auf seinem Schweif geschickt,\\n",
  "um Gegner auf Distanz zu halten.$",
]

[msg.section_0.entries.392]
text = [
  "Es verwendet einzigartige Attacken\\n",
  "mit dem Feuer an seinen Händen und\\n",
  "Füßen. Stellt sich jedem Gegner.$",
]

[msg.section_0.entries.393]
text = [
  "Es fällt leider oft hin. Allerdings\\n",
  "ist es sehr stolz und so rappelt es\\n",
  "sich immer wieder ohne Sorge auf.$",
]

[msg.section_0.entries.394]
text = [
  "Jedes Pliprin geht davon aus, dass es\\n",
  "das wichtigste ist. Daher können sie\\n",
  "keine Gruppen bilden.$",
]

[msg.section_0.entries.395]
text = [
  "Würde jemand seine Ehre verletzen,\\n",
  "so würde es mit Flügeln angreifen,\\n",
  "die Eis zerschneiden können.$",
]

[msg.section_0.entries.396]
text = [
  "Einzeln sind sie schwach. Daher bilden\\n",
  "sie Gruppen. Werden diese jedoch zu\\n",
  "groß, zanken sie sich.$",
]

[msg.section_0.entries.397]
text = [
  "Staravia verbergen ihre Schwäche\\n",
  "in Gruppen. Sind sie allein, kann man\\n",
  "sie an ihren lauten Rufen erkennen.$",
]

[msg.section_0.entries.398]
text = [
  "Selbst mit einer Verletzung greift\\n",
  "es immer weiter an. Ziert sich etwas\\n",
  "aufgrund der Form seines Kamms.$",
]

[msg.section_0.entries.399]
text = [
  "Ein Vergleich zeigte, dass die\\n",
  "Vorderzähne von Bidiza und\\n",
  "Rattfratz gleich schnell wachsen.$",
]

[msg.section_0.entries.400]
text = [
  "Ein von Bidifas eingedämmter Fluss\\n",
  "tritt niemals über seine Ufer.\\n",
  "Dafür sind die Anrainer dankbar.$",
]

[msg.section_0.entries.401]
text = [
  "Seine Beine sind kurz. Stolpert es,\\n",
  "klappern seine starren Antennen\\n",
  "und klingen wie ein Xylophon.$",
]

[msg.section_0.entries.402]
text = [
  "Es gibt ein Dorf, das basierend auf\\n",
  "den imposanten Rufen dieses Pokémon\\n",
  "einen Wettbewerb veranstaltet.$",
]

[msg.section_0.entries.403]
text = [
  "Es erzeugt Elektrizität durch das\\n",
  "Strecken und Zusammenziehen seiner\\n",
  "Muskeln. Bei Bedrohung glüht es.$",
]

[msg.section_0.entries.404]
text = [
  "Durch die Spitzen seiner scharfen\\n",
  "Krallen strömt Elektrizität. Selbst\\n",
  "kleine Kratzer verursachen Ohnmacht.$",
]

[msg.section_0.entries.405]
text = [
  "Es kann durch Wände sehen und\\n",
  "spürt auf diese Weise Beute und\\n",
  "verlorengegangene Junge auf.$",
]

[msg.section_0.entries.406]
text = [
  "Sensibel gegenüber Wetter-\\n",
  "veränderungen. Spürt es die Wärme\\n",
  "der Sonne, erblüht seine Knospe.$",
]

[msg.section_0.entries.407]
text = [
  "Es kann mit beiden Händen\\n",
  "verheerend angreifen. Seine Hände\\n",
  "enthalten unterschiedliche Gifte.$",
]

[msg.section_0.entries.408]
text = [
  "Es lebt seit Urzeiten im Dschungel.\\n",
  "Kann im Weg befindliche Bäume mit\\n",
  "Kopfstößen aus dem Weg räumen.$",
]

[msg.section_0.entries.409]
text = [
  "Schlagen zwei von ihnen mit den\\n",
  "Köpfen zusammen, verhindern ihre\\n",
  "dicken Schädel eine Ohnmacht.$",
]

[msg.section_0.entries.410]
text = [
  "Es ist sehr gut gepanzert und muss\\n",
  "daher während des Essens von Gras\\n",
  "und Beeren keinen Kampf fürchten.$",
]

[msg.section_0.entries.411]
text = [
  "Stellen sie sich Seite an Seite,\\n",
  "kann kein Gegner hindurchbrechen.\\n",
  "So schützen sie auch ihre Jungen.$",
]

[msg.section_0.entries.412]
text = [
  "Es erschafft sich immer irgendwie\\n",
  "einen schützenden Umhang, selbst\\n",
  "wenn es kaum Materialien findet.$",
]

[msg.section_0.entries.413]
text = [
  "Es nimmt während der Entwicklung\\n",
  "Dinge aus der Umgebung auf, daher\\n",
  "gibt es viele Variationen von ihm.$",
]

[msg.section_0.entries.414]
text = [
  "Es liebt Honig, sammelt ihn aber\\n",
  "nicht, sondern stiehlt den Honig,\\n",
  "der von Wadribie gesammelt wurde.$",
]

[msg.section_0.entries.415]
text = [
  "Dieses Trio ist von Geburt an\\n",
  "zusammen. Fleißig bringt es\\n",
  "Blütenhonig zu Honweisel.$",
]

[msg.section_0.entries.416]
text = [
  "Um anzulocken, verströmt es\\n",
  "unterschiedliche Botenstoffe,\\n",
  "während es Gegner bekämpft.$",
]

[msg.section_0.entries.417]
text = [
  "Um gespeicherte Elektrizität zu\\n",
  "teilen, reiben zwei von ihnen ihre\\n",
  "Backentaschen aneinander.$",
]

[msg.section_0.entries.418]
text = [
  "Dreht seine zwei Schweife wie eine\\n",
  "Schraube, um schnell zu schwimmen,\\n",
  "und zum Zerschneiden von Algen.$",
]

[msg.section_0.entries.419]
text = [
  "Man findet es oft in der Nähe von Häfen.\\n",
  "Rettet dort Menschen, schleppt aber\\n",
  "auch Beute hinfort.$",
]

[msg.section_0.entries.420]
text = [
  "Der kleine Ball ist nicht nur voller\\n",
  "Nährstoffe, sondern auch schmackhaft.\\n",
  "Staralili pickt oft danach.$",
]

[msg.section_0.entries.421]
text = [
  "Spürt es Sonnenlicht, öffnet es\\n",
  "seine Blütenblätter und nimmt die\\n",
  "Energie der Sonnenstrahlen auf.$",
]

[msg.section_0.entries.422]
text = [
  "Nicht seinen Körper zusammendrücken,\\n",
  "sonst sickert eine seltsame lilafarbene\\n",
  "Flüssigkeit aus!$",
]

[msg.section_0.entries.423]
text = [
  "Vor langer Zeit hatte es einen\\n",
  "festen Panzer. Mittlerweile sind\\n",
  "nur noch Spuren davon vorhanden.$",
]

[msg.section_0.entries.424]
text = [
  "Es ist mit seinen beiden Schweifen\\n",
  "so geschickt, dass es seine Hände\\n",
  "nur noch selten gebraucht.$",
]

[msg.section_0.entries.425]
text = [
  "Laut einer alten Volkssage nennt man\\n",
  "es den „Wegweiser für umherstreifende\\n",
  "Geister“.$",
]

[msg.section_0.entries.426]
text = [
  "In der Dämmerung steigen ganze\\n",
  "Schwärme in die Lüfte, verschwinden\\n",
  "aber sofort, wenn man sie bemerkt.$",
]

[msg.section_0.entries.427]
text = [
  "Seine Ohren sind immer aufgerollt.\\n",
  "Mit ihnen kann es selbst große\\n",
  "Felsbrocken zertrümmern.$",
]

[msg.section_0.entries.428]
text = [
  "Es hat sehr empfindliche Ohren.\\n",
  "Fasst man sie zu rau an, wird es mit\\n",
  "seinen grazilen Beinen zutreten.$",
]

[msg.section_0.entries.429]
text = [
  "Sein Ruf ähnelt einer Beschwörung.\\n",
  "Man sagt, dass er manchmal über die\\n",
  "Kraft verfüge, glücklich zu machen.$",
]

[msg.section_0.entries.430]
text = [
  "Sein tiefer Ruf lockt andere\\n",
  "Kramurx herbei. Man nennt es\\n",
  "daher „Beschwörer der Nacht“.$",
]

[msg.section_0.entries.431]
text = [
  "Es verbirgt, dass es bei schlechter\\n",
  "Fütterung gern seine Krallen in\\n",
  "die Nase des Trainers gräbt.$",
]

[msg.section_0.entries.432]
text = [
  "Umschlingt seinen Körper mit seinen\\n",
  "Schweifen, um größer zu wirken. Bei\\n",
  "direktem Augenkontakt blendet es.$",
]

[msg.section_0.entries.433]
text = [
  "In seinem Maul befindet sich\\n",
  "eine Kugel, die beim Hopsen ein\\n",
  "klingelndes Geräusch erzeugt.$",
]

[msg.section_0.entries.434]
text = [
  "Versprüht eine Substanz aus seinem\\n",
  "Hinterleib, die in einem großen\\n",
  "Radius andere Pokémon fernhält.$",
]

[msg.section_0.entries.435]
text = [
  "Greift mit einer Substanz aus der\\n",
  "Spitze seines Schweifs an.\\n",
  "Angriffe von oben verblüffen es.$",
]

[msg.section_0.entries.436]
text = [
  "Manche Forscher glauben, dass\\n",
  "dieses Pokémon in der Vergangenheit\\n",
  "wie ein Spiegel reflektierte.$",
]

[msg.section_0.entries.437]
text = [
  "Ihm wurden reiche Ernten zugeschrieben,\\n",
  "da es durch Portale in andere Welten\\n",
  "Regenfälle brachte.$",
]

[msg.section_0.entries.438]
text = [
  "Mag es trocken. Gleicht es seinen\\n",
  "Wasserhaushalt aus, entweicht ihm\\n",
  "Wasser, das wie Tränen geformt ist.$",
]

[msg.section_0.entries.439]
text = [
  "Ahmt die Bewegungen und\\n",
  "Gesichtsausdrücke anderer nach,\\n",
  "um ihre Gefühle besser zu verstehen.$",
]

[msg.section_0.entries.440]
text = [
  "Hat immer einen kleinen Felsen bei sich.\\n",
  "Wandelt zwischen den Füßen anderer,\\n",
  "was diese stolpern lässt.$",
]

[msg.section_0.entries.441]
text = [
  "Seine Zunge ähnelt der eines Menschen.\\n",
  "Daher kann es die menschliche Sprache\\n",
  "gut nachahmen.$",
]

[msg.section_0.entries.442]
text = [
  "Aufgrund seiner ständigen Untaten\\n",
  "ist es an einen Spiritkern gebunden.$",
]

[msg.section_0.entries.443]
text = [
  "Greift mit seinem riesigen Maul an.\\n",
  "Obwohl seine Angriffe mächtig sind,\\n",
  "verletzt es sich dabei auch selbst.$",
]

[msg.section_0.entries.444]
text = [
  "Es liebt funkelnde Dinge und sucht\\n",
  "nach Schätzen in Höhlen, die es\\n",
  "dann in seinem Nest hortet.$",
]

[msg.section_0.entries.445]
text = [
  "Die schnelle Bewegung seiner Flügel\\n",
  "erzeugt regelrechte Klingen des\\n",
  "Windes, die Bäume fällen können.$",
]

[msg.section_0.entries.446]
text = [
  "Es ist so damit beschäftigt, Futter\\n",
  "hinunterzuschlingen, dass es das\\n",
  "Futter unter seinem Fell vergisst.$",
]

[msg.section_0.entries.447]
text = [
  "Es hat die eigenartige Fähigkeit,\\n",
  "Gefühle wie Freude oder Wut in\\n",
  "Wellenform zu sehen.$",
]

[msg.section_0.entries.448]
text = [
  "Ist es trainiert, spürt es Auren,\\n",
  "um Gefühle entfernter Kreaturen\\n",
  "zu erkennen und aufzunehmen.$",
]

[msg.section_0.entries.449]
text = [
  "Es schließt seine Nasenlöcher und\\n",
  "reist dann durch den Sand. Bildet\\n",
  "Kolonien mit einer Größe von ca. 10.$",
]

[msg.section_0.entries.450]
text = [
  "Es wird überraschend schnell wütend.\\n",
  "Als Zeichen seiner Stärke sperrt es\\n",
  "sein Maul auf.$",
]

[msg.section_0.entries.451]
text = [
  "Es kann ein Jahr ohne Nahrung\\n",
  "überleben. Greift mit dem Gift aus\\n",
  "den Krallen an seinem Schweif an.$",
]

[msg.section_0.entries.452]
text = [
  "Es ist sehr stolz auf seine Stärke\\n",
  "und besiegt Gegner auch ohne die\\n",
  "Verwendung seines Gifts.$",
]

[msg.section_0.entries.453]
text = [
  "Aufgrund seines starken Überlebens-\\n",
  "drangs kämpft es selten fair. Beliebt\\n",
  "als Maskottchen.$",
]

[msg.section_0.entries.454]
text = [
  "Verfügt über einen Giftsack an\\n",
  "seiner Kehle. Quakt es, schäumt\\n",
  "das Gift und wird so noch stärker.$",
]

[msg.section_0.entries.455]
text = [
  "Klammert sich an Bäume in Sümpfen.\\n",
  "Lockt Beute mit seinem süßlichen\\n",
  "Speichel an und schluckt sie dann.$",
]

[msg.section_0.entries.456]
text = [
  "Die Linie an seiner Seite kann\\n",
  "Sonnenlicht speichern. Nachts\\n",
  "leuchtet es sehr intensiv.$",
]

[msg.section_0.entries.457]
text = [
  "Kriecht mit seinen langen\\n",
  "Vorderflossen über den Meeresboden.\\n",
  "Konkurriert mit Lanturn um Futter.$",
]

[msg.section_0.entries.458]
text = [
  "Man organisiert Touren, um diesem\\n",
  "Pokémon zuzusehen, wie es mit\\n",
  "Remoraid über die Wellen gleitet.$",
]

[msg.section_0.entries.459]
text = [
  "Neugierig auf Menschen, versammeln\\n",
  "sie sich bei Fußspuren, die sie auf\\n",
  "verschneiten Bergen finden.$",
]

[msg.section_0.entries.460]
text = [
  "Sie erscheinen beim Blühen der\\n",
  "Schneeblumen und verschwinden\\n",
  "wieder, sobald diese verblüht sind.$",
]

[msg.section_0.entries.461]
text = [
  "Wird durch Entwicklung noch\\n",
  "verschlagener. Kommuniziert\\n",
  "durch in Felsen gekratzte Zeichen.$",
]

[msg.section_0.entries.462]
text = [
  "Versuche, Magnezone auf\\n",
  "wissenschaftliche Weise zur Entwicklung\\n",
  "zu bringen, schlugen fehl.$",
]

[msg.section_0.entries.463]
text = [
  "Die lange Zunge ist immer feucht.\\n",
  "Ihr Speichel enthält eine Substanz,\\n",
  "die Taubheit hervorrufen kann.$",
]

[msg.section_0.entries.464]
text = [
  "Kann durch augenblickliche\\n",
  "Muskelbewegungen einen Felsen in seiner\\n",
  "Hand wie ein Geschoss abfeuern.$",
]

[msg.section_0.entries.465]
text = [
  "Seine Arme bestehen aus Ranken,\\n",
  "die sich an Dinge klammern und nach\\n",
  "dem Abschneiden sofort nachwachsen.$",
]

[msg.section_0.entries.466]
text = [
  "Berührt seinen Gegner mit seinen\\n",
  "beiden Schweifspitzen und entlädt\\n",
  "dann starke Elektrizität.$",
]

[msg.section_0.entries.467]
text = [
  "Wenn es seine fast 2 000 Grad heißen\\n",
  "Feuerbälle abfeuert, nimmt sein Körper\\n",
  "eine weißliche Farbe an.$",
]

[msg.section_0.entries.468]
text = [
  "Menschen, die unnötigen Streit\\n",
  "vermeiden und sich gegenseitig\\n",
  "respektieren, ist es wohlgesonnen.$",
]

[msg.section_0.entries.469]
text = [
  "Die Kraft seines Kiefers ist unglaublich.\\n",
  "Es kann daher aus dem Flug heraus hart\\n",
  "zubeißen.$",
]

[msg.section_0.entries.470]
text = [
  "Mit seiner pflanzenähnlichen Zell-\\n",
  "struktur betreibt es Photosynthese.\\n",
  "Es kämpft eigentlich nie.$",
]

[msg.section_0.entries.471]
text = [
  "Erzeugt ein Diamantstaubgestöber durch\\n",
  "das Einfrieren der Luft um sich herum.$",
]

[msg.section_0.entries.472]
text = [
  "Erwischt es auch nur ein Lüftchen\\n",
  "auf die richtige Weise, kann es ohne\\n",
  "Flügelschlag den Erdball umkreisen.$",
]

[msg.section_0.entries.473]
text = [
  "Ein eingefrorenes Exemplar wurde\\n",
  "aus 10 000 Jahre altem Erdreich\\n",
  "ausgegraben. Es wachte sogar auf!$",
]

[msg.section_0.entries.474]
text = [
  "Es wurde umprogrammiert, um in\\n",
  "außerirdischen Dimensionen arbeiten\\n",
  "zu können. Leider schlug das fehl.$",
]

[msg.section_0.entries.475]
text = [
  "Will es beschützen, streckt es seine\\n",
  "Ellbogen zu etwas Schwertähnlichem\\n",
  "und kämpft auf wilde Art.$",
]

[msg.section_0.entries.476]
text = [
  "Es steuert drei kleine Einheiten\\n",
  "mithilfe von starkem Magnetismus.\\n",
  "Man nennt sie Mininasen.$",
]

[msg.section_0.entries.477]
text = [
  "Man sagt, dass es verlorene\\n",
  "Seelen in seinem biegsamen\\n",
  "Körper nach Hause geleite.$",
]

[msg.section_0.entries.478]
text = [
  "Friert Beute durch seinen -50 Grad\\n",
  "kalten Atem ein. Es soll diese\\n",
  "Beute dann heimlich ausstellen.$",
]

[msg.section_0.entries.479]
text = [
  "Es kann mit seinem Körper in\\n",
  "elektrische Geräte eindringen\\n",
  "und dann für Chaos sorgen.$",
]

[msg.section_0.entries.480]
text = [
  "Als Selfe flog, erlangten Menschen\\n",
  "die Fähigkeit, Probleme zu lösen.\\n",
  "Es war die Geburt des Wissens.$",
]

[msg.section_0.entries.481]
text = [
  "Als Vesprit flog, lernten Menschen\\n",
  "Glück und Trauer des Lebens kennen.\\n",
  "Die Geburt der Gefühle.$",
]

[msg.section_0.entries.482]
text = [
  "Als Tobutz flog, erlangten\\n",
  "Menschen die Entschlossenheit.\\n",
  "Es war die Geburt der Willenskraft.$",
]

[msg.section_0.entries.483]
text = [
  "Ein Legendäres Pokémon aus der\\n",
  "Sinnoh-Region. Schlägt das Herz\\n",
  "von Dialga, läuft die Zeit normal.$",
]

[msg.section_0.entries.484]
text = [
  "Ein Legendäres Pokémon aus der\\n",
  "Sinnoh-Region. Mit dem Atem von\\n",
  "Palkia wird das Universum stabiler.$",
]

[msg.section_0.entries.485]
text = [
  "Sein Körper besteht aus Stahl,\\n",
  "hat aber aufgrund der eigenen\\n",
  "Temperatur geschmolzene Stellen.$",
]

[msg.section_0.entries.486]
text = [
  "Man sagt, es habe Pokémon aus\\n",
  "einem Eisberg, Felsen und Magma\\n",
  "nach seinem Abbild geschaffen.$",
]

[msg.section_0.entries.487]
text = [
  "Es wurde aufgrund seines Verhaltens\\n",
  "verbannt. Aus der Zerrwelt schaut es\\n",
  "auf die alte Welt.$",
]

[msg.section_0.entries.488]
text = [
  "In Nächten mit zunehmendem Mond\\n",
  "streckt sich das Licht von seinem\\n",
  "Schweif und wellt sich wunderschön.$",
]

[msg.section_0.entries.489]
text = [
  "Lässt sich in warmen Meeren\\n",
  "treiben, kehrt aber immer an\\n",
  "den Platz seiner Geburt zurück.$",
]

[msg.section_0.entries.490]
text = [
  "Es wird mit einer wundersamen Kraft\\n",
  "geboren, die eine Bindung zu jedem\\n",
  "anderen Pokémon möglich macht.$",
]

[msg.section_0.entries.491]
text = [
  "Verursacht bei in der Nähe Stehenden\\n",
  "Alpträume. Dies tut es aber nur, um sich\\n",
  "zu schützen.$",
]

[msg.section_0.entries.492]
text = [
  "Wird es umarmt, empfindet es\\n",
  "Dankbarkeit, was wiederum dazu\\n",
  "führt, dass seine Blumen blühen.$",
]

[msg.section_0.entries.493]
text = [
  "Man sagt, es sei im Nichts aus\\n",
  "einem Ei geschlüpft und\\n",
  "habe dann die Welt geformt.$",
]

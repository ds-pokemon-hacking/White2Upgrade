[msg]
trailing_data = "5050"

[msg.section_0.entries.0]
text = [
  "Star Actor$",
]

[msg.section_0.entries.1]
text = [
  "Treasure$",
]

[msg.section_0.entries.2]
text = [
  "Client: Go for it, [VAR PKNICK(0)]!$",
]

[msg.section_0.entries.3]
text = [
  "Client: Go for it, [VAR PKNICK(0)]!\\n",
  "Just a little more!$",
]

[msg.section_0.entries.4]
text = [
  "Client: There! Now!\\n",
  "[VAR PKNICK(0)], end this!$",
]

[msg.section_0.entries.5]
text = [
  "Client: Listen, this statue is a great\\n",
  "discovery that may unlock the\\l\\n",
  "mysteries of an ancient civilization.\\c\\n",
  "We need you to remove whatever it is\\n",
  "that is possessing this statue.\\c\\n",
  "But be careful!\\c\\n",
  "It's a talkative spirit, and if it doesn't\\n",
  "like your answers...\\c\\n",
  "It will do its best to make you suffer.$",
]

[msg.section_0.entries.6]
text = [
  "Young Assistant: I upset it, and it\\n",
  "pummeled me like a punching bag. Ouch!\\l\\n",
  "Please be careful!$",
]

[msg.section_0.entries.7]
text = [
  "Old Assistant: Uh-huh.\\n",
  "I put it on its guard, so then I couldn't\\l\\n",
  "even get close enough to attack.\\c\\n",
  "Do be careful.$",
]

[msg.section_0.entries.8]
text = [
  "[VAR PKNICK(0)]: Got it.\\n",
  "I also got quite a substantial fee,\\l\\n",
  "so let me get to it.$",
]

[msg.section_0.entries.9]
text = [
  "Voice: Who dares to disturb my sleep?\\n",
  "You! Why are you here?$",
]

[msg.section_0.entries.10]
text = [
  "[VAR PKNICK(0)]: ...\\c\\n",
  "(...Uh, um, what should I say?...)$",
]

[msg.section_0.entries.11]
text = [
  "[VAR PKNICK(0)]: Begone from the statue!$",
]

[msg.section_0.entries.12]
text = [
  "Voice: I see what you are now. Enemy...$",
]

[msg.section_0.entries.13]
text = [
  "[VAR PKNICK(0)]: Um, I just want to talk!$",
]

[msg.section_0.entries.14]
text = [
  "Voice: Talk?\\n",
  "We are talking already.$",
]

[msg.section_0.entries.15]
text = [
  "Voice: Who are you?\\n",
  "What do you mean by disturbing me?$",
]

[msg.section_0.entries.16]
text = [
  "[VAR PKNICK(0)]: ...\\c\\n",
  "(...I better be careful here...)$",
]

[msg.section_0.entries.17]
text = [
  "[VAR PKNICK(0)]: I'm a Ghost Eraser!$",
]

[msg.section_0.entries.18]
text = [
  "Voice: You're a Ghost Eraser. To erase me?\\n",
  "Even though I have no body, I have a life...\\c\\n",
  "To erase a life...\\n",
  "Not a thing to say lightly.$",
]

[msg.section_0.entries.19]
text = [
  "[VAR PKNICK(0)]: I'll mourn your passing.$",
]

[msg.section_0.entries.20]
text = [
  "Voice: I see.$",
]

[msg.section_0.entries.21]
text = [
  "[VAR PKNICK(0)]: I'm [VAR PKNICK(0)]!$",
]

[msg.section_0.entries.22]
text = [
  "Voice: I see.$",
]

[msg.section_0.entries.23]
text = [
  "[VAR PKNICK(0)]: Who do I look like?$",
]

[msg.section_0.entries.24]
text = [
  "Voice: Answering a question with\\n",
  "another question is rude.$",
]

[msg.section_0.entries.25]
text = [
  "Voice: Disturbance, answer the question.\\n",
  "What...do...you...want?$",
]

[msg.section_0.entries.26]
text = [
  "[VAR PKNICK(0)]: ...\\c\\n",
  "(...I'll take a risk here...)$",
]

[msg.section_0.entries.27]
text = [
  "[VAR PKNICK(0)]: Money!$",
]

[msg.section_0.entries.28]
text = [
  "Voice: Mwa ha ha ha...\\n",
  "A greedy fool!\\c\\n",
  "I'll pummel you with rage and finesse!$",
]

[msg.section_0.entries.29]
text = [
  "[VAR PKNICK(0)]: Love!$",
]

[msg.section_0.entries.30]
text = [
  "Voice: Mwa ha ha ha...\\n",
  "A needy and pitiful person!\\c\\n",
  "I'll thoughtfully pummel you\\n",
  "for your own good.$",
]

[msg.section_0.entries.31]
text = [
  "[VAR PKNICK(0)]: Power!$",
]

[msg.section_0.entries.32]
text = [
  "Voice: Mwa ha ha ha...\\n",
  "A lowly coward!\\c\\n",
  "I'll pummel you and pity you equally!$",
]

[msg.section_0.entries.33]
text = [
  "[VAR PKNICK(0)]: I don't need anything!$",
]

[msg.section_0.entries.34]
text = [
  "Voice: I see.\\n",
  "Interesting...$",
]

[msg.section_0.entries.35]
text = [
  "Voice: Disturbance, answer my question.\\n",
  "What is important to you?$",
]

[msg.section_0.entries.36]
text = [
  "[VAR PKNICK(0)]: ...\\c\\n",
  "(...I gotta be careful here...)$",
]

[msg.section_0.entries.37]
text = [
  "[VAR PKNICK(0)]: Myself, of course!$",
]

[msg.section_0.entries.38]
text = [
  "Voice: You cherish yourself most... Heughh.\\c\\n",
  "I'll pummel your ego down to size.$",
]

[msg.section_0.entries.39]
text = [
  "[VAR PKNICK(0)]: [VAR PKNICK(0)]!$",
]

[msg.section_0.entries.40]
text = [
  "Voice: I see.\\n",
  "Interesting...$",
]

[msg.section_0.entries.41]
text = [
  "Voice: Well...\\n",
  "Do you finally understand who I am?$",
]

[msg.section_0.entries.42]
text = [
  "[VAR PKNICK(0)]: No, I don't.\\n",
  "Who are you?$",
]

[msg.section_0.entries.43]
text = [
  "Voice: Alas, I don't know the answer myself.\\c\\n",
  "Memory tells me that I am a strong and\\n",
  "powerful being.\\c\\n",
  "One thing more I know. Only during a battle\\n",
  "will my past memories come back.$",
]

[msg.section_0.entries.44]
text = [
  "[VAR PKNICK(0)]: Did your memories come back?$",
]

[msg.section_0.entries.45]
text = [
  "Voice: Completely!\\n",
  "It was a long, long time ago...\\c\\n",
  "Arkham talked me into challenging\\n",
  "this old statue, just as you're doing now.\\c\\n",
  "During the battle, I was drawn\\n",
  "into the statue. This statue absorbs\\l\\n",
  "the strong and powerful.\\c\\n",
  "Since that day, I've become\\n",
  "the protector of this statue...$",
]

[msg.section_0.entries.46]
text = [
  "[VAR PKNICK(0)]: Arkham?\\n",
  "Please tell me about him!$",
]

[msg.section_0.entries.47]
text = [
  "Voice: Do you want to know about him?\\n",
  "Only the strong have the right to answers!\\c\\n",
  "Enough! Let us continue our battle!$",
]

[msg.section_0.entries.48]
text = [
  "Voice: Disturber, answer my question.\\n",
  "You must guess who I am.$",
]

[msg.section_0.entries.49]
text = [
  "[VAR PKNICK(0)]: It's so obvious!$",
]

[msg.section_0.entries.50]
text = [
  "[VAR PKNICK(0)]: Evil spirit!$",
]

[msg.section_0.entries.51]
text = [
  "Voice: Is that what I look like to you?\\n",
  "Hm. Even I don't know who I am.\\c\\n",
  "But the end is near...\\n",
  "One last punch will finish you off!$",
]

[msg.section_0.entries.52]
text = [
  "[VAR PKNICK(0)]: The Majin of Mayhem!$",
]

[msg.section_0.entries.53]
text = [
  "Voice: The Majin... Is that what I look like?\\n",
  "Hm. Even I don't know who I am.\\c\\n",
  "But the end is near...\\n",
  "One last punch will finish you off!$",
]

[msg.section_0.entries.54]
text = [
  "[VAR PKNICK(0)]: I don't know!$",
]

[msg.section_0.entries.55]
text = [
  "Voice: I see.\\n",
  "Exactly...\\c\\n",
  "Even I don't know who I am.\\c\\n",
  "My memories have faded away,\\n",
  "yet here I remain.$",
]

[msg.section_0.entries.56]
text = [
  "[VAR PKNICK(0)]: A human!$",
]

[msg.section_0.entries.57]
text = [
  "Voice: Wh-what are you talking about?\\n",
  "You think I'm a human!\\c\\n",
  "Argh! Enough!\\n",
  "One last punch will finish you off!$",
]

[msg.section_0.entries.58]
text = [
  "[VAR PKNICK(0)]: Ooogh... Aaagh...\\n",
  "(...I'm no match for it...)$",
]

[msg.section_0.entries.59]
text = [
  "Voice: I've used up too much power.\\n",
  "But I can't afford to disappear.\\c\\n",
  "Therefore, weakling, I shall absorb\\n",
  "your life energy.\\c\\n",
  "...$",
]

[msg.section_0.entries.60]
text = [
  "[VAR PKNICK(0)]: Stop it!\\n",
  "I feel weak...\\c\\n",
  "S-stop...\\n",
  "Shhhhhrrrssssssssssshhhh!$",
]

[msg.section_0.entries.61]
text = [
  "Voice: This is your fate...\\n",
  "It's all for the sake of this world...\\c\\n",
  "I'll fall asleep again.\\c\\n",
  "...$",
]

[msg.section_0.entries.62]
text = [
  "[VAR PKNICK(0)]: ...$",
]

[msg.section_0.entries.63]
text = [
  "Addendum to\\n",
  "“Ghost Eraser Case Files: File No. 003\\\":\\c\\n",
  "After this case report was received,\\n",
  "we lost contact with [VAR PKNICK(0)].\\c\\n",
  "Her whereabouts remain unknown.$",
]

[msg.section_0.entries.64]
text = [
  "[VAR PKNICK(0)]: The statue is acting weird...$",
]

[msg.section_0.entries.65]
text = [
  "Voice: Well done.\\c\\n",
  "I've been waiting for a strong person\\n",
  "like you...$",
]

[msg.section_0.entries.66]
text = [
  "[VAR PKNICK(0)]: You've been waiting?$",
]

[msg.section_0.entries.67]
text = [
  "Voice: For many thousands of years after\\n",
  "the creation of this statue, one human\\l\\n",
  "after another challenged the statue to\\l\\n",
  "combat for the sake of the glowing gem.\\c\\n",
  "The weak were defeated, and the statue\\n",
  "devoured their life energy.\\c\\n",
  "They vanished, never to be seen again.\\c\\n",
  "The strong were recognized as worthy\\n",
  "and drawn into the statue to become\\l\\n",
  "its new guardian.$",
]

[msg.section_0.entries.68]
text = [
  "[VAR PKNICK(0)]: Its guardian?$",
]

[msg.section_0.entries.69]
text = [
  "Voice: Yes. You defeated me.\\c\\n",
  "That means the statue affirmed you\\n",
  "as its new guardian.\\c\\n",
  "Accept your destiny.\\n",
  "Come to me! Now!$",
]

[msg.section_0.entries.70]
text = [
  "[VAR PKNICK(0)]: No. I refuse\\n",
  "to be pent up in that confined place.\\c\\n",
  "...Oh no. I'm losing my strength...\\n",
  "I'm being drawn in...\\c\\n",
  "Shhhhhrrrssssssssssshhhh!$",
]

[msg.section_0.entries.71]
text = [
  "Voice: When you next wake,\\n",
  "your memories will have vanished.\\c\\n",
  "You'll have taken my place as the\\n",
  "guardian inside the statue.\\c\\n",
  "When your time as the guardian ends,\\n",
  "your existence will also end...$",
]

[msg.section_0.entries.72]
text = [
  "[VAR PKNICK(0)]: ...$",
]

[msg.section_0.entries.73]
text = [
  "Addendum to\\n",
  "“Ghost Eraser Case Files: File No. 003\\\":\\c\\n",
  "After we received File No. 003,\\n",
  "we lost contact with [VAR PKNICK(0)].\\l\\n",
  "[VAR PKNICK(0)]...is missing.$",
]

[msg.section_0.entries.74]
text = [
  "[VAR PKNICK(0)]: ...$",
]

[msg.section_0.entries.75]
text = [
  "Voice: Disturber, your frown troubles me.\\n",
  "Explain yourself!$",
]

[msg.section_0.entries.76]
text = [
  "[VAR PKNICK(0)]: Oh, give it up.\\n",
  "Your lies are obvious to me.\\l\\n",
  "Get out of there right now.$",
]

[msg.section_0.entries.77]
text = [
  "Voice: ...\\n",
  "What are you saying? Don't be ridiculous.\\l\\n",
  "I'll make you disappear with my power!$",
]

[msg.section_0.entries.78]
text = [
  "[VAR PKNICK(0)]: Oh, knock it off.\\c\\n",
  "Or...don't you know enough to take\\n",
  "the Ghost Erasers seriously?$",
]

[msg.section_0.entries.79]
text = [
  "Voice: ...\\n",
  "I-I must apologize.\\l\\n",
  "Please forgive me!$",
]

[msg.section_0.entries.80]
text = [
  "[VAR PKNICK(0)]: Well, well...\\n",
  "It's past time to stop your silly playacting.$",
]

[msg.section_0.entries.81]
text = [
  "Voice: I do apologize!\\n",
  "As you suspected, I'm just a human.\\c\\n",
  "The whole story about the ancient statue\\n",
  "is completely made up.\\c\\n",
  "And so is the statue's curse.\\c\\n",
  "It was all a sham--a ploy to get money.$",
]

[msg.section_0.entries.82]
text = [
  "[VAR PKNICK(0)]: That was a whole heap of lying.\\n",
  "What made you do it?$",
]

[msg.section_0.entries.83]
text = [
  "Voice: It was your client! Over there! Him!\\c\\n",
  "He promised me a substantial fee...\\n",
  "How could I resist?$",
]

[msg.section_0.entries.84]
text = [
  "Client: You fool!\\c\\n",
  "If we'd tricked a Ghost Eraser, an expert\\n",
  "in getting rid of evil spirits, the value of\\l\\n",
  "the cursed statue would have skyrocketed!\\c\\n",
  "I could've unloaded it on some unsuspecting\\n",
  "collector for a boatload of dough!$",
]

[msg.section_0.entries.85]
text = [
  "[VAR PKNICK(0)]: I see.\\c\\n",
  "Then, let's head over to our office,\\n",
  "where we can go over the details\\l\\n",
  "of your story, slowly--and carefully...$",
]

[msg.section_0.entries.86]
text = [
  "Client: Gulp...$",
]

[msg.section_0.entries.87]
text = [
  "Addendum to\\n",
  "“Ghost Eraser Case Files: File No. 003\\\":\\c\\n",
  "The cursed statue was the work of liars\\n",
  "in search of easy cash.\\c\\n",
  "There have been many false reports of late.\\n",
  "Please be aware.$",
]

[msg.section_0.entries.88]
text = [
  "Voice: Well done!\\n",
  "Congratulations on showing such strength!\\c\\n",
  "You have removed my protection on\\n",
  "the statue's secret power!\\c\\n",
  "This great power is now yours. With it,\\n",
  "you can make your wish come true.$",
]

[msg.section_0.entries.89]
text = [
  "[VAR PKNICK(0)]: I feel enormous power\\n",
  "radiating from the statue's gem.\\c\\n",
  "What's going on?!$",
]

[msg.section_0.entries.90]
text = [
  "Client: Mwa ha ha!\\n",
  "That's an energy crystal!\\c\\n",
  "It's a chunk of energy said to have been\\n",
  "stolen from the Majin of Mayhem long ago.\\c\\n",
  "The guardian protected the statue to\\n",
  "prevent anyone from gaining the power\\l\\n",
  "of the Majin.\\c\\n",
  "What a battle-scarred veteran that\\n",
  "guardian was. So strong!\\c\\n",
  "I was really no match for him.$",
]

[msg.section_0.entries.91]
text = [
  "[VAR PKNICK(0)]: The Majin of Mayhem?\\n",
  "The power was sealed inside the crystal?$",
]

[msg.section_0.entries.92]
text = [
  "Client: Of course!\\c\\n",
  "Once the guardian is defeated and the seal\\n",
  "is broken, the energy returns to the Majin.\\c\\n",
  "The Majin regains that power and reawakens!\\c\\n",
  "Well? Pretty cool, eh?\\n",
  "Gets you pretty excited, eh?\\c\\n",
  "Mwa ha hardy har ha!$",
]

[msg.section_0.entries.93]
text = [
  "[VAR PKNICK(0)]: That voice... You sound like...$",
]

[msg.section_0.entries.94]
text = [
  "Client: Aw, how depressing. Did it really\\n",
  "take you this long to recognize who I am?\\c\\n",
  "You're so forgetful.\\n",
  "I'll tell you one more time!\\c\\n",
  "My name is--Arkham!\\n",
  "I'm the genius magician!\\l\\n",
  "My goal is to revive the Majin of Mayhem!$",
]

[msg.section_0.entries.95]
text = [
  "[VAR PKNICK(0)]: Arkham...$",
]

[msg.section_0.entries.96]
text = [
  "Arkham: A-a-and, thanks to you, voilà!\\n",
  "The seal of the Majin has been shattered!\\c\\n",
  "Now! Look at the gem!$",
]

[msg.section_0.entries.97]
text = [
  "[VAR PKNICK(0)]: Oh no...\\n",
  "The gem is melting...$",
]

[msg.section_0.entries.98]
text = [
  "Arkham: Back it goes!\\n",
  "Back to its original owner!$",
]

[msg.section_0.entries.99]
text = [
  "[VAR PKNICK(0)]: I've made a horrible mistake...$",
]

[msg.section_0.entries.100]
text = [
  "Arkham: Mwa ha hardy har ha!\\c\\n",
  "...$",
]

[msg.section_0.entries.101]
text = [
  "[VAR PKNICK(0)]: Arkham! Wait!$",
]

[msg.section_0.entries.102]
text = [
  "Addendum to\\n",
  "“Ghost Eraser Case Files: File No. 003\\\":\\c\\n",
  "Arkham's plot succeeded in shattering\\n",
  "the seal protecting the energy crystal.\\c\\n",
  "The Majin of Mayhem could now reawaken.\\n",
  "My immediate goal is to locate Arkham.\\c\\n",
  "--Code name: [VAR PKNICK(0)]$",
]

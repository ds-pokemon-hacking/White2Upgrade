[msg.section_0.entries.0]
text = [
  "Veteran Star$",
]

[msg.section_0.entries.1]
text = [
  "Strange Man$",
]

[msg.section_0.entries.2]
text = [
  "???: Bagoogeeegooo!$",
]

[msg.section_0.entries.3]
text = [
  "[VAR TRNAME(1)]: MT...\\n",
  "It really appeared...$",
]

[msg.section_0.entries.4]
text = [
  "Man: Ahem. Who are you?$",
]

[msg.section_0.entries.5]
text = [
  "[VAR TRNAME(1)]: Excuse me?\\n",
  "What are you doing over there?$",
]

[msg.section_0.entries.6]
text = [
  "Man: My name is Serizawa.\\n",
  "I am the owner of this land.\\c\\n",
  "Whatever I do here\\n",
  "is none of your business.\\c\\n",
  "Now, as I asked, who are you?$",
]

[msg.section_0.entries.7]
text = [
  "[VAR TRNAME(1)]: I'm [VAR TRNAME(1)]!\\n",
  "I'm a member of the Unova Defense Force.\\c\\n",
  "Mr. Serizawa, right?\\n",
  "Is the MT yours?$",
]

[msg.section_0.entries.8]
text = [
  "Serizawa: The Unova Defense Force...\\c\\n",
  "I see. So you're the one.\\n",
  "Well, you certainly came in at the right time.\\c\\n",
  "You interrupted my plans.\\n",
  "On top of that, you destroyed my MT.\\l\\n",
  "Now I must return the favor.$",
]

[msg.section_0.entries.9]
text = [
  "[VAR TRNAME(1)]: What?!$",
]

[msg.section_0.entries.10]
text = [
  "Serizawa: Muahaha.\\c\\n",
  "Today's machine has been\\n",
  "specially prepared just for you.\\c\\n",
  "You can call it MT2.\\c\\n",
  "It's been powered up significantly.\\n",
  "Can you stop it?$",
]

[msg.section_0.entries.11]
text = [
  "[VAR TRNAME(1)]: Hey!\\n",
  "Are you looking for a fight?\\c\\n",
  "(...Could this be the villain that the\\n",
  "Titanic Tyranitar King warned me about?...)$",
]

[msg.section_0.entries.12]
text = [
  "MT2: Bagoogeeegooon!$",
]

[msg.section_0.entries.13]
text = [
  "Serizawa: Your interference was\\n",
  "most unfortunate.\\c\\n",
  "If that foolish Worker had used MT properly,\\n",
  "we could have destroyed the town...$",
]

[msg.section_0.entries.14]
text = [
  "[VAR TRNAME(1)]: The MT\\n",
  "that appeared before...\\l\\n",
  "That was also your work?\\c\\n",
  "Destroying the town...\\n",
  "Why? What do you gain from that?$",
]

[msg.section_0.entries.15]
text = [
  "Serizawa: Ha. It's simple, really.\\c\\n",
  "I wanted to test MT's power. And I was very\\n",
  "eager to know the limits of what it could do.\\l\\n",
  "To feel its strength...\\c\\n",
  "When you raise a strong Pokémon,\\n",
  "you want to make it fight, too, right?\\c\\n",
  "What I'm doing is the same thing.$",
]

[msg.section_0.entries.16]
text = [
  "[VAR TRNAME(1)]: Sure, that makes sense.$",
]

[msg.section_0.entries.17]
text = [
  "Serizawa: You understand? Excellent.\\n",
  "Then, I'll test MT2's power on you as well!$",
]

[msg.section_0.entries.18]
text = [
  "[VAR TRNAME(1)]: No! It's different!$",
]

[msg.section_0.entries.19]
text = [
  "Serizawa: What's the difference?\\c\\n",
  "The way I see it, training your Pokémon\\n",
  "in battle is no different from\\l\\n",
  "testing the power of my MT.$",
]

[msg.section_0.entries.20]
text = [
  "[VAR TRNAME(1)]: Uh...$",
]

[msg.section_0.entries.21]
text = [
  "Serizawa: Ha ha ha! What's the matter?\\n",
  "Can't defend your argument?\\c\\n",
  "Does that mean you agree with me?$",
]

[msg.section_0.entries.22]
text = [
  "Radio: Can you hear me, [VAR TRNAME(1)]?$",
]

[msg.section_0.entries.23]
text = [
  "[VAR TRNAME(1)]: Yes!$",
]

[msg.section_0.entries.24]
text = [
  "Radio: The metal that covers MT2's body\\n",
  "is extremely resistant!\\c\\n",
  "We can't expect to cause any damage\\n",
  "with regular attacks!$",
]

[msg.section_0.entries.25]
text = [
  "Serizawa: Ha ha ha!\\n",
  "You'll never defeat me!$",
]

[msg.section_0.entries.26]
text = [
  "Radio: We're analyzing the metal...\\n",
  "Zzt...\\c\\n",
  "[VAR TRNAME(1)], hang in there\\n",
  "until...zzt...zzt...$",
]

[msg.section_0.entries.27]
text = [
  "Serizawa: What did you expect?\\c\\n",
  "I know that you Unova Defense Force\\n",
  "meddlers communicate by radio.$",
]

[msg.section_0.entries.28]
text = [
  "[VAR TRNAME(1)]: The signal's jammed...$",
]

[msg.section_0.entries.29]
text = [
  "Serizawa: Ha. You see?\\n",
  "My MT2 is highly efficient.$",
]

[msg.section_0.entries.30]
text = [
  "[VAR TRNAME(1)]: What do I do now?$",
]

[msg.section_0.entries.31]
text = [
  "Serizawa: Ha! Sorry, but I play to win.\\n",
  "And my MT2 is made for winning.$",
]

[msg.section_0.entries.32]
text = [
  "[VAR TRNAME(1)]: Sneaky!$",
]

[msg.section_0.entries.33]
text = [
  "Serizawa: Ha! I'll take that as a compliment!$",
]

[msg.section_0.entries.34]
text = [
  "[VAR TRNAME(1)]: Aaargh!$",
]

[msg.section_0.entries.35]
text = [
  "Serizawa: Come now! You're giving yourself\\n",
  "a bad name.\\c\\n",
  "A member of the Unova Defense Force\\n",
  "isn't supposed to get emotional, right?$",
]

[msg.section_0.entries.36]
text = [
  "[VAR TRNAME(1)]: (...I can't even\\n",
  "communicate with HQ...)\\c\\n",
  "(...What should I do?...)$",
]

[msg.section_0.entries.37]
text = [
  "Serizawa: Ha ha ha...\\n",
  "What will you do now, missy?$",
]

[msg.section_0.entries.38]
text = [
  "???: [VAR TRNAME(1)]...\\n",
  "Can you hear me, [VAR TRNAME(1)]?$",
]

[msg.section_0.entries.39]
text = [
  "[VAR TRNAME(1)]: What? Who's that?\\n",
  "Your voice sounds familiar...$",
]

[msg.section_0.entries.40]
text = [
  "???: It's me...\\n",
  "The Titanic Tyranitar King...\\c\\n",
  "I'm using the last of my energy\\n",
  "to speak directly into your mind...$",
]

[msg.section_0.entries.41]
text = [
  "[VAR TRNAME(1)]: !!$",
]

[msg.section_0.entries.42]
text = [
  "Tyranitar King: [VAR TRNAME(1)]...\\n",
  "The machine...MT2...\\c\\n",
  "It's protecting its weak point\\n",
  "with its Ability...\\c\\n",
  "You must take away its Ability...$",
]

[msg.section_0.entries.43]
text = [
  "[VAR TRNAME(1)]: Its Ability?$",
]

[msg.section_0.entries.44]
text = [
  "Tyranitar King: I'm counting\\n",
  "on you, [VAR TRNAME(1)]...\\c\\n",
  "Because I cannot...\\n",
  "you must protect this world...\\c\\n",
  "...$",
]

[msg.section_0.entries.45]
text = [
  "[VAR TRNAME(1)]: Titanic Tyranitar King...$",
]

[msg.section_0.entries.46]
text = [
  "Serizawa: Ha! Have you lost your senses?\\n",
  "You've started muttering to yourself!$",
]

[msg.section_0.entries.47]
text = [
  "[VAR TRNAME(1)]: Ugh... Is this the end?$",
]

[msg.section_0.entries.48]
text = [
  "Serizawa: Ha ha ha!\\c\\n",
  "What do you think, [VAR TRNAME(1)]?\\n",
  "My MT2! Isn't it a spectacular machine?$",
]

[msg.section_0.entries.49]
text = [
  "[VAR TRNAME(1)]: When it comes to this...\\n",
  "The Unova Defense Force...\\l\\n",
  "The last resort...$",
]

[msg.section_0.entries.50]
text = [
  "Serizawa: Eh? What?\\n",
  "Are you still planning to do something?$",
]

[msg.section_0.entries.51]
text = [
  "[VAR TRNAME(1)]: Here I go...\\n",
  "Electrode... Weezing...\\c\\n",
  "I choose you...$",
]

[msg.section_0.entries.52]
text = [
  "Serizawa: What?!$",
]

[msg.section_0.entries.53]
text = [
  "[VAR TRNAME(1)]: At all costs...\\n",
  "I have to stop MT2...$",
]

[msg.section_0.entries.54]
text = [
  "Serizawa: Wait!\\c\\n",
  "What are you thinking? Stop!\\n",
  "Stop this at once!$",
]

[msg.section_0.entries.55]
text = [
  "[VAR TRNAME(1)]: Here we go!\\n",
  "Electrode!\\l\\n",
  "Weezing!\\l\\n",
  "Simultaneous Explosion!$",
]

[msg.section_0.entries.56]
text = [
  "Serizawa: Stop! I command you! Nooooo!$",
]

[msg.section_0.entries.57]
text = [
  "[VAR TRNAME(1)]: Huff...puff...$",
]

[msg.section_0.entries.58]
text = [
  "Serizawa: No more battling!\\n",
  "We've had enough!\\c\\n",
  "[VAR TRNAME(1)]...\\n",
  "Could we talk instead?$",
]

[msg.section_0.entries.59]
text = [
  "[VAR TRNAME(1)]: Huff... Puff...\\n",
  "What do you mean, talk?$",
]

[msg.section_0.entries.60]
text = [
  "Serizawa: Allow me to explain.\\c\\n",
  "You have such power. Why limit yourself?\\n",
  "Using that strength just for protection...\\l\\n",
  "Frankly, it's a waste of your talent.\\c\\n",
  "Why don't you come work for me instead?$",
]

[msg.section_0.entries.61]
text = [
  "[VAR TRNAME(1)]: What are you talking about?\\n",
  "I'm a member of the Unova Defense Force!$",
]

[msg.section_0.entries.62]
text = [
  "Serizawa: I'll make it worth your while.\\c\\n",
  "What's your salary? What does the\\n",
  "Unova Defense Force pay you?\\c\\n",
  "I'll double it. No, quadruple it.\\n",
  "No...I'll go even higher.\\l\\n",
  "I'll pay you 50 times what they do!$",
]

[msg.section_0.entries.63]
text = [
  "[VAR TRNAME(1)]: F-fifty times?!\\n",
  "But...but...$",
]

[msg.section_0.entries.64]
text = [
  "Serizawa: That's not enough for you?\\c\\n",
  "Fine! One hundred times your current\\n",
  "salary. That's my final offer!$",
]

[msg.section_0.entries.65]
text = [
  "[VAR TRNAME(1)]: A hundred times what I make\\n",
  "now? A hundred! That's so many zeros...\\c\\n",
  "I just don't know if I can accept...$",
]

[msg.section_0.entries.66]
text = [
  "Serizawa: Still not satisfied with\\n",
  "my generous offer?\\c\\n",
  "Very well, then. I suppose you'd rather\\n",
  "be destroyed by my MT2.\\l\\n",
  "Along with all your Pokémon.$",
]

[msg.section_0.entries.67]
text = [
  "[VAR TRNAME(1)]: N-no, no, I'll take it!\\c\\n",
  "You've got a deal, Mr. Serizawa!\\n",
  "One hundred times my salary, please!$",
]

[msg.section_0.entries.68]
text = [
  "Serizawa: Ha ha ha! Excellent!\\n",
  "Then we have an agreement.\\c\\n",
  "I have high hopes for you, [VAR TRNAME(1)].\\n",
  "You will go far in my organization.$",
]

[msg.section_0.entries.69]
text = [
  "[VAR TRNAME(1)]: Serizawa!\\n",
  "This is it! Give up!$",
]

[msg.section_0.entries.70]
text = [
  "Serizawa: Arrogant fool! You think\\n",
  "you can get the better of me?\\c\\n",
  "I have money to burn!\\n",
  "I can easily buy a far better MT\\l\\n",
  "than this old hunk of junk!$",
]

[msg.section_0.entries.71]
text = [
  "[VAR TRNAME(1)]: What a despicable man...$",
]

[msg.section_0.entries.72]
text = [
  "Serizawa: I'll destroy you\\n",
  "with a new MT!\\c\\n",
  "I'll make you regret defying me!\\n",
  "Listen and remember!$",
]

[msg.section_0.entries.73]
text = [
  "[VAR TRNAME(1)]: Wait! Wait a minute!$",
]

[msg.section_0.entries.74]
text = [
  "Radio: Hey! Respond!\\n",
  "Respond, [VAR TRNAME(1)]!$",
]

[msg.section_0.entries.75]
text = [
  "[VAR TRNAME(1)]: Yes! Chief!$",
]

[msg.section_0.entries.76]
text = [
  "Radio: Finally, I got through!\\c\\n",
  "I've been able to listen to what's going on\\n",
  "over there but couldn't reach you.\\c\\n",
  "But from what I've heard, you seem\\n",
  "to be OK, [VAR TRNAME(1)].$",
]

[msg.section_0.entries.77]
text = [
  "[VAR TRNAME(1)]: Yes!\\n",
  "MT2 is completely shut down.\\c\\n",
  "The mission is complete!\\c\\n",
  "But that villain Serizawa, who was\\n",
  "controlling MT2, got away!$",
]

[msg.section_0.entries.78]
text = [
  "Radio: He won't get far. What we heard over\\n",
  "the radio proved his wrongdoing.\\c\\n",
  "We're tracking him down now. He'll soon be\\n",
  "arrested, and all his assets will be\\l\\n",
  "confiscated. He won't have two coins\\l\\n",
  "to rub together, much less buy a new MT!\\c\\n",
  "Good work, [VAR TRNAME(1)]!\\n",
  "Return to HQ!$",
]

[msg.section_0.entries.79]
text = [
  "[VAR TRNAME(1)]: Roger!$",
]

[msg.section_0.entries.80]
text = [
  "Titanic Tyranitar King...\\n",
  "Thanks to you, Unova was saved.\\c\\n",
  "You've been the guardian\\n",
  "of the Unova region...$",
]

[msg.section_0.entries.81]
text = [
  "MT2: Bagoogeeegooo!$",
]

[msg.section_0.entries.82]
text = [
  "Serizawa: Ha! What is this? Really?\\n",
  "That attack was just weak!\\c\\n",
  "Defeating my MT2 is just a dream\\n",
  "if that's all you can do!$",
]

[msg.section_0.entries.83]
text = [
  "[VAR TRNAME(1)]: Ugh...\\n",
  "MT2 is a lot tougher than MT...\\c\\n",
  "But how did he manage to get\\n",
  "such a dangerous machine?\\c\\n",
  "He didn't develop MT by himself,\\n",
  "did he?$",
]

[msg.section_0.entries.84]
text = [
  "Serizawa: Fwa ha ha ha!\\n",
  "That's not my area of expertise.\\l\\n",
  "But I didn't have to create it.\\c\\n",
  "After all, my MT isn't the only one...$",
]

[msg.section_0.entries.85]
text = [
  "[VAR TRNAME(1)]: What?!$",
]

[msg.section_0.entries.86]
text = [
  "Serizawa: Ah ha ha. Was that not\\n",
  "what you expected?\\c\\n",
  "These MTs are for sale.\\n",
  "There's a whole series of them.\\c\\n",
  "They're quite popular and quite simple\\n",
  "to obtain...for those who have the cash.\\l\\n",
  "And the connections.$",
]

[msg.section_0.entries.87]
text = [
  "[VAR TRNAME(1)]: It can't be...\\n",
  "Who makes them? And why?$",
]

[msg.section_0.entries.88]
text = [
  "Serizawa: Think about it. People can be\\n",
  "maniacs about all sorts of things.\\c\\n",
  "There are destruction maniacs who love\\n",
  "to destroy things. Me, for instance!\\c\\n",
  "And fortunately for me, there are\\n",
  "machine maniacs who love to build\\l\\n",
  "wonderfully destructive devices like MT!$",
]

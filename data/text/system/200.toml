[msg.section_0.entries.0]
text = [
  "Suit Actor$",
]

[msg.section_0.entries.1]
text = [
  "Mysterious$",
]

[msg.section_0.entries.2]
text = [
  "Angry Child: Arrggh! UFO!\\n",
  "Give me back my Pokémon!$",
]

[msg.section_0.entries.3]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.4]
text = [
  "Grieving Woman: Stop!\\n",
  "Don't take my precious Pokémon!$",
]

[msg.section_0.entries.5]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.6]
text = [
  "Annoyed Man: You stinking UFO!\\n",
  "What are you going to do\\l\\n",
  "with my Pokémon?!$",
]

[msg.section_0.entries.7]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.8]
text = [
  "Captured Man: Ouch!\\n",
  "Hey! Let me go!\\l\\n",
  "I'm not a Pokémon!$",
]

[msg.section_0.entries.9]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.10]
text = [
  "Whimpering Man: I beg you! Please!\\n",
  "Not my dearest Pokémon!$",
]

[msg.section_0.entries.11]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.12]
text = [
  "Shouting Woman: Enough is enough!\\n",
  "Can't somebody take care of this UFO!$",
]

[msg.section_0.entries.13]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.14]
text = [
  "Elderly Man: Augh!\\n",
  "That horrible UFO!$",
]

[msg.section_0.entries.15]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.16]
text = [
  "Radio: Attention, attention! All points!\\n",
  "Do you copy, [VAR TRNAME(1)]?\\l\\n",
  "Report on the situation status!$",
]

[msg.section_0.entries.17]
text = [
  "[VAR TRNAME(1)]: Copy that!\\c\\n",
  "The UFO has appeared again!\\n",
  "This time, it's attacking Pokémon\\l\\n",
  "while destroying the town!$",
]

[msg.section_0.entries.18]
text = [
  "Radio: We copy.\\c\\n",
  "First people, and now Pokémon...\\n",
  "What are they up to?$",
]

[msg.section_0.entries.19]
text = [
  "[VAR TRNAME(1)]: Here's the plan of action.\\n",
  "I'm depending on E to lure in the\\l\\n",
  "mothership with her decoy UFO!$",
]

[msg.section_0.entries.20]
text = [
  "Radio: We copy.\\n",
  "One question, [VAR TRNAME(1)]...\\c\\n",
  "The person who identified herself as E...\\n",
  "Can we trust her?$",
]

[msg.section_0.entries.21]
text = [
  "[VAR TRNAME(1)]: I...don't have an answer.\\c\\n",
  "But since our understanding of the UFO is so\\n",
  "limited, we have to go with what we've got.\\c\\n",
  "E is certainly mysterious. I suspect...\\n",
  "But we have to depend on her right now.$",
]

[msg.section_0.entries.22]
text = [
  "Radio: C-copy that, [VAR TRNAME(1)].\\c\\n",
  "For now, we'll just have to trust her and\\n",
  "hope you both succeed!\\c\\n",
  "We are ready to commence the decoy plan.$",
]

[msg.section_0.entries.23]
text = [
  "[VAR TRNAME(1)]: Ready and waiting!$",
]

[msg.section_0.entries.24]
text = [
  "Fleeing Citizen: Quick, run!\\n",
  "You'll be done if the UFO catches you!$",
]

[msg.section_0.entries.25]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.26]
text = [
  "[VAR TRNAME(1)]: Ugh!\\n",
  "Why hasn't E contacted me?$",
]

[msg.section_0.entries.27]
text = [
  "Radio: ...I heard you.\\n",
  "[VAR TRNAME(1)], is everything prepared?$",
]

[msg.section_0.entries.28]
text = [
  "[VAR TRNAME(1)]: Is that you, E?\\n",
  "What's your situation?$",
]

[msg.section_0.entries.29]
text = [
  "Radio: I'll be arriving with the\\n",
  "decoy UFO momentarily. But...\\c\\n",
  "There are more people around\\n",
  "than I bargained for.\\l\\n",
  "Not as many ran away as I expected...\\c\\n",
  "If I meet you there and the mothership\\n",
  "appears, all those people will be in danger.$",
]

[msg.section_0.entries.30]
text = [
  "[VAR TRNAME(1)]: Oh no!\\n",
  "Is there anything we can do?$",
]

[msg.section_0.entries.31]
text = [
  "Radio: I think not.\\c\\n",
  "Focus on the mission, not the people.\\c\\n",
  "The mission's success is what's important.\\n",
  "We have to accept some collateral damage.$",
]

[msg.section_0.entries.32]
text = [
  "[VAR TRNAME(1)]: Is that so...?$",
]

[msg.section_0.entries.33]
text = [
  "Radio: ...\\c\\n",
  "Forget it. I don't expect you to understand\\n",
  "the importance of my mission...\\c\\n",
  "I'm approaching your position. Get ready!$",
]

[msg.section_0.entries.34]
text = [
  "[VAR TRNAME(1)]: Whatever...$",
]

[msg.section_0.entries.35]
text = [
  "Radio: Try to understand this, at least.\\c\\n",
  "You can't snap your fingers and change the\\n",
  "fundamental principles of the universe.\\c\\n",
  "Whatever happens, happens...\\n",
  "according to the principles.$",
]

[msg.section_0.entries.36]
text = [
  "[VAR TRNAME(1)]: NO!!$",
]

[msg.section_0.entries.37]
text = [
  "Radio: So emotional.\\c\\n",
  "...\\c\\n",
  "Tch, tch. Do yell a bit louder!\\n",
  "That will certainly change how the\\l\\n",
  "universe works. Not...$",
]

[msg.section_0.entries.38]
text = [
  "[VAR TRNAME(1)]: You're serious--$",
]

[msg.section_0.entries.39]
text = [
  "Radio: I am completely serious.\\c\\n",
  "I will do whatever I have to do.\\n",
  "No more, no less.$",
]

[msg.section_0.entries.40]
text = [
  "[VAR TRNAME(1)]: Yay!\\n",
  "The UFO is retreating!$",
]

[msg.section_0.entries.41]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.42]
text = [
  "Radio: [VAR TRNAME(1)]...\\n",
  "Can you hear me? It's me.$",
]

[msg.section_0.entries.43]
text = [
  "[VAR TRNAME(1)]: E, it's you!\\n",
  "We succeeded in protecting everyone\\l\\n",
  "from the UFO!\\c\\n",
  "What's your situation?$",
]

[msg.section_0.entries.44]
text = [
  "Radio: Good news, [VAR TRNAME(1)].\\c\\n",
  "Just as I planned, the mothership\\n",
  "will soon be landing.$",
]

[msg.section_0.entries.45]
text = [
  "[VAR TRNAME(1)]: The moment we've been\\n",
  "waiting for...$",
]

[msg.section_0.entries.46]
text = [
  "Radio: Ah ha ha ha...\\c\\n",
  "When the mothership lands, the UFOs'\\n",
  "power will be amplified many times over.\\c\\n",
  "It will be much easier to exterminate\\n",
  "the remaining human beings, too...$",
]

[msg.section_0.entries.47]
text = [
  "[VAR TRNAME(1)]: E.\\n",
  "What...what are you saying?!$",
]

[msg.section_0.entries.48]
text = [
  "Radio: Don't you get it?\\n",
  "Poor, silly human...\\c\\n",
  "You've been deceived.$",
]

[msg.section_0.entries.49]
text = [
  "[VAR TRNAME(1)]: ...Human?\\c\\n",
  "E...\\n",
  "What in the world are you?$",
]

[msg.section_0.entries.50]
text = [
  "With the success of the decoy plan,\\n",
  "the landing of the mothership,\\l\\n",
  "and E's revelation...\\c\\n",
  "The battle between humanity and the UFOs\\n",
  "now reaches the final act...\\l\\n",
  "And the stakes are nothing less than\\l\\n",
  "the future of humanity!$",
]

[msg.section_0.entries.51]
text = [
  "[VAR TRNAME(1)]: Things have gone south.\\n",
  "My Pokémon are exhausted.\\c\\n",
  "If this continues, you can forget about\\n",
  "the mission!$",
]

[msg.section_0.entries.52]
text = [
  "Radio: [VAR TRNAME(1)].\\n",
  "It's me, E.$",
]

[msg.section_0.entries.53]
text = [
  "[VAR TRNAME(1)]: E!$",
]

[msg.section_0.entries.54]
text = [
  "Radio: [VAR TRNAME(1)]...\\n",
  "What's your situation like?$",
]

[msg.section_0.entries.55]
text = [
  "[VAR TRNAME(1)]: It's bad!\\n",
  "If things stay like this,\\l\\n",
  "I'll be finished, too!\\c\\n",
  "I'm sorry to have to ask, but will you\\n",
  "cancel the mission and come and rescue me?$",
]

[msg.section_0.entries.56]
text = [
  "Radio: ...\\n",
  "I'm sorry, but that's not possible.\\c\\n",
  "I was detected by a UFO, and\\n",
  "the decoy UFO was attacked...\\l\\n",
  "Don't think I...can hold on...much longer...$",
]

[msg.section_0.entries.57]
text = [
  "[VAR TRNAME(1)]: Oh no!$",
]

[msg.section_0.entries.58]
text = [
  "Radio: Sorry...\\c\\n",
  "The decoy plan was a failure...\\c\\n",
  "You must...\\c\\n",
  "Get away...from there...quickly...\\c\\n",
  "...$",
]

[msg.section_0.entries.59]
text = [
  "The decoy UFO was destroyed,\\n",
  "and E's energy was completely depleted.\\c\\n",
  "With the failure of the decoy plan,\\n",
  "humanity lost its battle against the UFOs...\\c\\n",
  "And the future of humanity reached its\\n",
  "ultimate end...$",
]

[msg.section_0.entries.60]
text = [
  "Radio: [VAR TRNAME(1)]...\\n",
  "It's me, E.$",
]

[msg.section_0.entries.61]
text = [
  "[VAR TRNAME(1)]: It's you, E...\\c\\n",
  "S-sorry...\\n",
  "I...can't move...anymore...$",
]

[msg.section_0.entries.62]
text = [
  "Radio: I understand.\\c\\n",
  "Then...\\n",
  "I'll carry out the rest of my plan alone.\\c\\n",
  "We'll soon see the mothership in the sky...\\c\\n",
  "But, with only my power, we have no chance.\\n",
  "I'll get inside the decoy UFO, and when\\l\\n",
  "the mothership takes it on board,\\l\\n",
  "I'll blow up the decoy UFO and destroy\\l\\n",
  "the mothership from the inside...$",
]

[msg.section_0.entries.63]
text = [
  "[VAR TRNAME(1)]: You're crazy!\\n",
  "It will never work!$",
]

[msg.section_0.entries.64]
text = [
  "Radio: I know.\\n",
  "But it's our only hope.$",
]

[msg.section_0.entries.65]
text = [
  "[VAR TRNAME(1)]: But, E, how will you get away?$",
]

[msg.section_0.entries.66]
text = [
  "Radio: If I put the decoy UFO on autopilot,\\n",
  "it will be shot down easily by convoy UFOs.\\c\\n",
  "I must stay in control of the decoy UFO\\n",
  "and take it into the mothership myself.\\c\\n",
  "...\\c\\n",
  "Farewell, [VAR TRNAME(1)].$",
]

[msg.section_0.entries.67]
text = [
  "[VAR TRNAME(1)]: No! E...$",
]

[msg.section_0.entries.68]
text = [
  "And so, E took over [VAR TRNAME(1)]'s mission\\n",
  "and piloted the decoy UFO into the heart\\l\\n",
  "of the mothership.\\c\\n",
  "The explosion--too distant to be heard...\\c\\n",
  "Debris from the mothership tumbled\\n",
  "to the ground.\\l\\n",
  "...And all the UFOs vanished from the sky.\\c\\n",
  "With humanity's battle won, people rejoiced.\\c\\n",
  "But... Forever absent from the celebration\\n",
  "was the mysterious woman...known as E.$",
]

[msg.section_0.entries.69]
text = [
  "Child: Waaaaugh!\\n",
  "My Pokémon!$",
]

[msg.section_0.entries.70]
text = [
  "[VAR TRNAME(1)]: Oh no...\\n",
  "I didn't know it was a citizen's Pokémon\\l\\n",
  "captured by the UFO...$",
]

[msg.section_0.entries.71]
text = [
  "Child: What have you done!\\n",
  "You're from the UFO, aren't you?\\l\\n",
  "Horrible alien!$",
]

[msg.section_0.entries.72]
text = [
  "[VAR TRNAME(1)]: No! No!\\n",
  "I didn't mean to!$",
]

[msg.section_0.entries.73]
text = [
  "UFO: ...!!$",
]

[msg.section_0.entries.74]
text = [
  "[VAR TRNAME(1)]: Argh!$",
]

[msg.section_0.entries.75]
text = [
  "A simple mistake by [VAR TRNAME(1)] that\\n",
  "hurt a citizen's Pokémon...\\c\\n",
  "In his shock and dismay, he was vulnerable.\\n",
  "The UFOs did not hesitate to strike!\\c\\n",
  "With [VAR TRNAME(1)] defeated,\\n",
  "the decoy plan failed...\\c\\n",
  "Humanity lost its battle against the UFOs...\\c\\n",
  "And the future of humanity reached its\\n",
  "ultimate end...$",
]

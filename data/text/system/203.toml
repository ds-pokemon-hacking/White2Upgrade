[msg.section_0.entries.0]
text = [
  "New Actress$",
]

[msg.section_0.entries.1]
text = [
  "Weird Light$",
]

[msg.section_0.entries.2]
text = [
  "???: ...$",
]

[msg.section_0.entries.3]
text = [
  "[VAR TRNAME(1)]: Hmm?\\n",
  "What is that strange light...?$",
]

[msg.section_0.entries.4]
text = [
  "Radio: Hey! Can you hear me?\\n",
  "Respond, [VAR TRNAME(1)]!\\c\\n",
  "Quickly, quickly!\\n",
  "Report the current situation!$",
]

[msg.section_0.entries.5]
text = [
  "[VAR TRNAME(1)]: Roger!\\c\\n",
  "I confirmed the existence of\\n",
  "a gigantic Tyranitar ahead!\\c\\n",
  "If it keeps approaching the town,\\n",
  "it's likely to cause extensive damage!$",
]

[msg.section_0.entries.6]
text = [
  "Radio: Roger, [VAR TRNAME(1)]!\\n",
  "From now on, we'll call it\\l\\n",
  "Titanic Tyranitar!\\c\\n",
  "Listen, [VAR TRNAME(1)]!\\n",
  "Prevent the Titanic Tyranitar\\l\\n",
  "from entering the town at all costs!$",
]

[msg.section_0.entries.7]
text = [
  "[VAR TRNAME(1)]: Roger!$",
]

[msg.section_0.entries.8]
text = [
  "Trapped Citizens: Run!\\n",
  "If that gigantic Tyranitar attacks us,\\l\\n",
  "we won't stand a chance!$",
]

[msg.section_0.entries.9]
text = [
  "[VAR TRNAME(1)]: As I suspected,\\n",
  "this is no ordinary Tyranitar...\\c\\n",
  "I have to stop it,\\n",
  "but there's no chance to win\\l\\n",
  "if I go head-to-head with it...\\c\\n",
  "First, I should prioritize the\\n",
  "evacuation of the citizens...$",
]

[msg.section_0.entries.10]
text = [
  "Trapped Citizens: Yeeeek!$",
]

[msg.section_0.entries.11]
text = [
  "[VAR TRNAME(1)]: Everyone! This way!$",
]

[msg.section_0.entries.12]
text = [
  "Trapped Citizens: Yay!\\n",
  "The Unova Defense Force\\l\\n",
  "came to rescue us!$",
]

[msg.section_0.entries.13]
text = [
  "[VAR TRNAME(1)]: You! You're in my way!$",
]

[msg.section_0.entries.14]
text = [
  "Trapped Citizens: Yeeeek!\\n",
  "Oh no! Why is this happening?$",
]

[msg.section_0.entries.15]
text = [
  "[VAR TRNAME(1)]: You'll be attacked!$",
]

[msg.section_0.entries.16]
text = [
  "Trapped Citizens: Yeeeeek!\\n",
  "We're done for!$",
]

[msg.section_0.entries.17]
text = [
  "Titanic Tyranitar: Grrooooo...$",
]

[msg.section_0.entries.18]
text = [
  "[VAR TRNAME(1)]: What's going on?\\n",
  "It won't move. It's just staring at me...\\c\\n",
  "Perhaps it's waiting for me.\\n",
  "Maybe I should speak to it...$",
]

[msg.section_0.entries.19]
text = [
  "Titanic Tyranitar: Grroooo...$",
]

[msg.section_0.entries.20]
text = [
  "[VAR TRNAME(1)]: I'm [VAR TRNAME(1)]!\\n",
  "I'm a member of the Unova Defense Force.\\l\\n",
  "We protect the peace of Unova!$",
]

[msg.section_0.entries.21]
text = [
  "Titanic Tyranitar: Grro! Grrroo!$",
]

[msg.section_0.entries.22]
text = [
  "[VAR TRNAME(1)]: There is a town ahead.\\n",
  "People are living there!\\c\\n",
  "If a giant Pokémon like you goes into town,\\n",
  "some kind of trouble will happen!\\c\\n",
  "So... Please just calm down, and\\n",
  "go back to the place\\l\\n",
  "where you lived for now.$",
]

[msg.section_0.entries.23]
text = [
  "Titanic Tyranitar: Grrooooon!$",
]

[msg.section_0.entries.24]
text = [
  "[VAR TRNAME(1)]: Didn't it work?\\n",
  "Did I make it upset...?$",
]

[msg.section_0.entries.25]
text = [
  "???: ...$",
]

[msg.section_0.entries.26]
text = [
  "[VAR TRNAME(1)]: Again...\\n",
  "What is this light...?\\c\\n",
  "Its shape is sort of human...$",
]

[msg.section_0.entries.27]
text = [
  "Titanic Tyranitar: Grrrooooon!$",
]

[msg.section_0.entries.28]
text = [
  "[VAR TRNAME(1)]: Ah!\\n",
  "The Titanic Tyranitar is going back\\l\\n",
  "to the sea...$",
]

[msg.section_0.entries.29]
text = [
  "[VAR TRNAME(1)]: Did it understand\\n",
  "what I said?\\c\\n",
  "Anyway, now the town will be safe...$",
]

[msg.section_0.entries.30]
text = [
  "[VAR TRNAME(1)]: But...\\c\\n",
  "Why did the Tyranitar appear by the sea?\\n",
  "A Tyranitar is weak against water...\\c\\n",
  "Besides, there's that strange light...\\n",
  "What is it...?$",
]

[msg.section_0.entries.31]
text = [
  "[VAR TRNAME(1)]: Oh no...\\n",
  "What power it has!$",
]

[msg.section_0.entries.32]
text = [
  "Radio: Hey! Can you hear me?\\n",
  "Respond, [VAR TRNAME(1)]!\\l\\n",
  "Report the current situation!$",
]

[msg.section_0.entries.33]
text = [
  "[VAR TRNAME(1)]: Captain...\\n",
  "The plan has failed...\\c\\n",
  "My Pokémon was defeated...\\c\\n",
  "The Titanic Tyranitar is going into the town.\\n",
  "There's nothing more I can do.$",
]

[msg.section_0.entries.34]
text = [
  "Radio: I can't believe this...\\n",
  "It's the end of Unova...$",
]

[msg.section_0.entries.35]
text = [
  "[VAR TRNAME(1)]: Ugh...\\n",
  "If I'd been more reliable...$",
]

[msg.section_0.entries.36]
text = [
  "[VAR TRNAME(1)]: Tee hee! Yay!\\n",
  "I beat the Titanic Tyranitar!$",
]

[msg.section_0.entries.37]
text = [
  "Titanic Tyranitar: ...$",
]

[msg.section_0.entries.38]
text = [
  "Radio: Well done, [VAR TRNAME(1)]!\\n",
  "Go back to HQ immediately.\\c\\n",
  "No, wait, [VAR TRNAME(1)]...\\c\\n",
  "There's an energy reaction\\n",
  "from the Titanic Tyranitar...\\c\\n",
  "The Titanic Tyranitar hasn't been beaten!\\n",
  "Be careful, [VAR TRNAME(1)]!$",
]

[msg.section_0.entries.39]
text = [
  "[VAR TRNAME(1)]: Tee hee! Tee hee hee!\\n",
  "I beat the big monster!\\l\\n",
  "This makes me famous!\\c\\n",
  "Now, I don't have to have a hard time\\n",
  "with such a dangerous job!\\l\\n",
  "I'll be treated as a heroine,\\l\\n",
  "and I can live a life of ease\\l\\n",
  "for the rest of my life!$",
]

[msg.section_0.entries.40]
text = [
  "???: Grroo...$",
]

[msg.section_0.entries.41]
text = [
  "Radio: Hey! [VAR TRNAME(1)]!\\n",
  "Can you hear me?$",
]

[msg.section_0.entries.42]
text = [
  "???: What a fool!\\c\\n",
  "I'll give a severe punishment\\n",
  "to a person like you...$",
]

[msg.section_0.entries.43]
text = [
  "???: Grroon!$",
]

[msg.section_0.entries.44]
text = [
  "[VAR TRNAME(1)]: ...Yeeeeek!$",
]

[msg.section_0.entries.45]
text = [
  "Radio: Hey! What happened?\\n",
  "[VAR TRNAME(1)]! Respond!\\c\\n",
  "[VAR TRNAME(1)]! [VAR TRNAME(1)]!$",
]

[msg.section_0.entries.0]
text = [
  "Suit Actor$",
]

[msg.section_0.entries.1]
text = [
  "Gatekeeper$",
]

[msg.section_0.entries.2]
text = [
  "Plush Toy: I don't think that'll work.\\c\\n",
  "You should just calm down\\n",
  "and stay here with me...$",
]

[msg.section_0.entries.3]
text = [
  "Plush Toy: Aaaah!\\n",
  "You're making such a racket\\l\\n",
  "that the magic world is creaking!\\l\\n",
  "Bellelba's going to be mad...$",
]

[msg.section_0.entries.4]
text = [
  "Prince [VAR TRNAME(1)]: The door won't open!\\n",
  "Somebody let me out of here!$",
]

[msg.section_0.entries.5]
text = [
  "Plush Toy: The gate is enchanted.\\n",
  "It can't be opened...$",
]

[msg.section_0.entries.6]
text = [
  "Prince [VAR TRNAME(1)]: Whoa!\\n",
  "The Plush Toy talked!\\c\\n",
  "Amaaazing! That's cool!$",
]

[msg.section_0.entries.7]
text = [
  "Plush Toy: Uhhh...\\c\\n",
  "Do you understand the situation you're in?\\c\\n",
  "Still, I don't think I've ever seen anyone\\n",
  "so happy when they saw me before.\\c\\n",
  "Well, I'm in a good mood today,\\n",
  "so I'll give you a little hint.\\c\\n",
  "That door gets weak when it's cold.\\n",
  "However...$",
]

[msg.section_0.entries.8]
text = [
  "Prince [VAR TRNAME(1)]: However?$",
]

[msg.section_0.entries.9]
text = [
  "Plush Toy: Ummm...\\n",
  "I can't say anything more.\\c\\n",
  "Figure out the rest on your own.$",
]

[msg.section_0.entries.10]
text = [
  "Plush Toy: You're trying hard!$",
]

[msg.section_0.entries.11]
text = [
  "Prince [VAR TRNAME(1)]: Plush Toy!\\c\\n",
  "If you don't have anything better to\\n",
  "do than sit there, give me a hand!$",
]

[msg.section_0.entries.12]
text = [
  "Plush Toy: In case you forgot,\\n",
  "I AM the gatekeeper here.\\l\\n",
  "My job is to watch you.\\c\\n",
  "Bellelba would get mad at me if I helped.\\n",
  "And besides...\\c\\n",
  "A long time ago, I tried to open the door,\\n",
  "but it didn't work.\\l\\n",
  "I failed...$",
]

[msg.section_0.entries.13]
text = [
  "Prince [VAR TRNAME(1)]: Why?$",
]

[msg.section_0.entries.14]
text = [
  "Plush Toy: I had the same problem as you.\\n",
  "I didn't know how to break the door.$",
]

[msg.section_0.entries.15]
text = [
  "Prince [VAR TRNAME(1)]: You, too?$",
]

[msg.section_0.entries.16]
text = [
  "Plush Toy: What?\\c\\n",
  "Do you feel sorry\\n",
  "for me?\\c\\n",
  "...$",
]

[msg.section_0.entries.17]
text = [
  "Prince [VAR TRNAME(1)]: *Snicker*$",
]

[msg.section_0.entries.18]
text = [
  "Plush Toy: Harrumph...\\n",
  "You know what? You're kind of a creep.$",
]

[msg.section_0.entries.19]
text = [
  "Black Door: Claaaang!$",
]

[msg.section_0.entries.20]
text = [
  "Prince [VAR TRNAME(1)]: All right!\\n",
  "I broke the door, didn't I?\\l\\n",
  "Now I can leave, right?$",
]

[msg.section_0.entries.21]
text = [
  "Plush Toy: No. I'm afraid not...$",
]

[msg.section_0.entries.22]
text = [
  "Prince [VAR TRNAME(1)]: Why not?\\n",
  "I broke the door like I was supposed to!$",
]

[msg.section_0.entries.23]
text = [
  "Plush Toy: Don't you get it?\\n",
  "You can't just break the\\l\\n",
  "door like you did.\\c\\n",
  "You can't just break something\\n",
  "made with magic by force.\\c\\n",
  "I'm sure Bellelba heard that\\n",
  "noise and will be on her way.\\l\\n",
  "I don't think she'll forgive you.\\c\\n",
  "Heh heh heh...\\c\\n",
  "Looks like I get people soup tonight.\\n",
  "It's been a long time.\\c\\n",
  "You're a prince, right?\\n",
  "I'm sure you've been eating well.\\l\\n",
  "You should make great broth!$",
]

[msg.section_0.entries.24]
text = [
  "Prince [VAR TRNAME(1)]: No...\\n",
  "Noooooo!$",
]

[msg.section_0.entries.25]
text = [
  "Were Plush Toy's words true?\\c\\n",
  "No one knows...\\c\\n",
  "There is no record of what happened\\n",
  "to the prince after that...$",
]

[msg.section_0.entries.26]
text = [
  "Prince [VAR TRNAME(1)]: Sigh...$",
]

[msg.section_0.entries.27]
text = [
  "Plush Toy: Hey...\\n",
  "How long are you going to keep that up?$",
]

[msg.section_0.entries.28]
text = [
  "Prince [VAR TRNAME(1)]: I can't help it!\\n",
  "This thing's tough!$",
]

[msg.section_0.entries.29]
text = [
  "Plush Toy: Yeah, it should be!\\n",
  "It's Bellelba's magic.\\c\\n",
  "Still, you're pretty tough\\n",
  "for a prince.\\c\\n",
  "I'm sure you'll be working\\n",
  "for her from tomorrow on,\\l\\n",
  "but you should be able to take it!$",
]

[msg.section_0.entries.30]
text = [
  "Prince [VAR TRNAME(1)]: Quiet, you!\\n",
  "I don't need compliments like that!\\c\\n",
  "What do you mean working?\\n",
  "What is she going to make me do?$",
]

[msg.section_0.entries.31]
text = [
  "Plush Toy: What will you do?\\n",
  "There's a pile of things to do.\\c\\n",
  "Cooking, laundry, cleaning...\\n",
  "Even that is really hard work.\\c\\n",
  "You also have to take care of\\n",
  "things like that door you were fighting.\\l\\n",
  "They are her pets!$",
]

[msg.section_0.entries.32]
text = [
  "Prince [VAR TRNAME(1)]: Uwagh!\\n",
  "That sounds like such a pain.\\c\\n",
  "That's the kind of work\\n",
  "for a servant!\\l\\n",
  "Not for a prince!$",
]

[msg.section_0.entries.33]
text = [
  "Plush Toy: Come on now...\\n",
  "Life isn't that easy.\\l\\n",
  "You are so spoiled.\\c\\n",
  "Maybe a person like you\\n",
  "should have been caught...$",
]

[msg.section_0.entries.34]
text = [
  "Prince [VAR TRNAME(1)]: Whaaa!\\n",
  "Father! Mother!\\l\\n",
  "Minister! Servants!\\l\\n",
  "Somebody! Save meee!$",
]

[msg.section_0.entries.35]
text = [
  "And so Prince [VAR TRNAME(1)],\\n",
  "shaking with fear about his\\l\\n",
  "work in the morning, finally\\l\\n",
  "fell asleep.\\c\\n",
  "He kept telling himself that\\n",
  "at least he was still alive...$",
]

[msg.section_0.entries.36]
text = [
  "Prince [VAR TRNAME(1)]: I've been beaten...$",
]

[msg.section_0.entries.37]
text = [
  "Plush Toy: Awww...\\n",
  "What a shame...\\c\\n",
  "Baaad stuff's going to happen to you...$",
]

[msg.section_0.entries.38]
text = [
  "Prince [VAR TRNAME(1)]: Huh?!$",
]

[msg.section_0.entries.39]
text = [
  "Plush Toy: Those who lose\\n",
  "to the magic door...\\c\\n",
  "...\\c\\n",
  "They are turned into doors by the\\n",
  "magic that was cast on that door!$",
]

[msg.section_0.entries.40]
text = [
  "Prince [VAR TRNAME(1)]: Hey!\\n",
  "What?$",
]

[msg.section_0.entries.41]
text = [
  "Plush Toy: It's just as I said--you're\\n",
  "going to change into a door.\\c\\n",
  "Since you're a prince, I'm sure it's\\n",
  "going to be an ornate door with\\l\\n",
  "lots of gorgeous decorations...\\l\\n",
  "I bet you'll fetch a good price...$",
]

[msg.section_0.entries.42]
text = [
  "Prince [VAR TRNAME(1)]: This is terrible!\\n",
  "I don't want to become a door!\\c\\n",
  "Each and every single day!\\n",
  "Shutting and closing.\\l\\n",
  "Shutting and closing.\\l\\n",
  "That's all I'd ever do!\\l\\n",
  "I can't stand it!$",
]

[msg.section_0.entries.43]
text = [
  "Plush Toy: ...\\c\\n",
  "So you never plan\\n",
  "on opening, then?\\c\\n",
  "Well, enjoy being able to\\n",
  "make dumb jokes while you can...$",
]

[msg.section_0.entries.44]
text = [
  "Prince [VAR TRNAME(1)]: ...$",
]

[msg.section_0.entries.45]
text = [
  "And so Prince [VAR TRNAME(1)],\\n",
  "who lost to the black door,\\l\\n",
  "became a door himself.\\c\\n",
  "Surely, he's working as the door\\n",
  "to some house now...$",
]

[msg.section_0.entries.46]
text = [
  "Prince [VAR TRNAME(1)]: Hey, Plush Toy.\\n",
  "Isn't it OK now?\\l\\n",
  "Would you just give me a hint already?$",
]

[msg.section_0.entries.47]
text = [
  "Plush Toy: Like I said, I'm the gatekeeper!\\n",
  "I can't!\\c\\n",
  "And what's more--there is no hint!\\c\\n",
  "Even if you somehow manage to get out,\\n",
  "you're going to end up a servant.\\c\\n",
  "There's no way you can get away\\n",
  "from Bellelba in her own world!$",
]

[msg.section_0.entries.48]
text = [
  "Prince [VAR TRNAME(1)]: Who cares!\\c\\n",
  "I hate just sitting here quietly\\n",
  "locked up in this cage!\\c\\n",
  "A dark, damp place like this isn't\\n",
  "suitable for a royal prince\\l\\n",
  "like myself, now is it?$",
]

[msg.section_0.entries.49]
text = [
  "Plush Toy: Sure... Whatever...\\c\\n",
  "Your pride is a little repulsive,\\n",
  "but I feel like you've got some guts.$",
]

[msg.section_0.entries.50]
text = [
  "Prince [VAR TRNAME(1)]: I'm gonna do it!\\c\\n",
  "I'm going to break down that door!\\n",
  "I'll put my pride as a prince at stake!$",
]

[msg.section_0.entries.51]
text = [
  "Plush Toy: You're sure fired up...\\n",
  "If you're that excited, you might\\l\\n",
  "be able to make something work. Maybe...$",
]

[msg.section_0.entries.52]
text = [
  "Prince [VAR TRNAME(1)]: But you know what...\\n",
  "This is just too much work for me...\\l\\n",
  "I don't care about the stupid door anymore.\\c\\n",
  "Hey, Plush Toy.\\n",
  "I'll give you my allowance.\\l\\n",
  "Would you please let me out?$",
]

[msg.section_0.entries.53]
text = [
  "Plush Toy: Really?! That's your plan?\\c\\n",
  "Bribing me? I tell you...\\n",
  "If you're the prince of a country,\\l\\n",
  "humanity's future is looking pretty dark.\\c\\n",
  "First of all, I'm a Plush Toy.\\n",
  "What am I supposed to do with money?!$",
]

[msg.section_0.entries.54]
text = [
  "Prince [VAR TRNAME(1)]: You shabby reject!\\c\\n",
  "For a stupid Plush Toy,\\n",
  "you've sure got a mouth!\\c\\n",
  "Whatever! I don't need you!\\n",
  "I'll break it myself!$",
]

[msg.section_0.entries.55]
text = [
  "Prince [VAR TRNAME(1)]: Hey...\\n",
  "Why were you caught?$",
]

[msg.section_0.entries.56]
text = [
  "Plush Toy: Um...\\n",
  "I don't really remember...\\c\\n",
  "I'm sure it was a reason\\n",
  "similar to yours though.$",
]

[msg.section_0.entries.57]
text = [
  "Prince [VAR TRNAME(1)]: Hmmm...\\c\\n",
  "You've sure had it hard\\n",
  "for a Plush Toy.\\l\\n",
  "That's why you're worn out and filthy...$",
]

[msg.section_0.entries.58]
text = [
  "Plush Toy: That's too much!\\c\\n",
  "And I wasn't born a Plush Toy, you know?!\\c\\n",
  "I used to be a person,\\n",
  "just like you.\\c\\n",
  "Bellelba's spell changed me into this,\\n",
  "and I have to be the gatekeeper forever...$",
]

[msg.section_0.entries.59]
text = [
  "Prince [VAR TRNAME(1)]: That's terrible!\\n",
  "Why don't you run away?$",
]

[msg.section_0.entries.60]
text = [
  "Plush Toy: I know...\\n",
  "I would like to, but...\\c\\n",
  "Unlike you, I don't have a Pokémon.\\c\\n",
  "Also, my body is made of cotton,\\n",
  "so I don't move very well.\\c\\n",
  "I don't really know how I\\n",
  "could get away from Bellelba!$",
]

[msg.section_0.entries.61]
text = [
  "Prince [VAR TRNAME(1)]: I don't care...$",
]

[msg.section_0.entries.62]
text = [
  "Plush Toy: Y-you're really cold...\\c\\n",
  "What's the deal? You were the one\\n",
  "who asked about me in the first place...$",
]

[msg.section_0.entries.63]
text = [
  "Prince [VAR TRNAME(1)]: Flee with me!$",
]

[msg.section_0.entries.64]
text = [
  "Plush Toy: Are you serious?$",
]

[msg.section_0.entries.65]
text = [
  "Prince [VAR TRNAME(1)]: How hopeless...$",
]

[msg.section_0.entries.66]
text = [
  "Plush Toy: Well, it's OK.\\n",
  "Your sympathy won't help me.\\l\\n",
  "It's not like it's your problem.$",
]

[msg.section_0.entries.67]
text = [
  "Prince [VAR TRNAME(1)]: Yeah! Yeah! Yeah!\\n",
  "It looks like it will break\\l\\n",
  "after just a little more!$",
]

[msg.section_0.entries.68]
text = [
  "Plush Toy: ...$",
]

[msg.section_0.entries.69]
text = [
  "Prince [VAR TRNAME(1)]: What's wrong?\\c\\n",
  "Are you worried because\\n",
  "I might get away?$",
]

[msg.section_0.entries.70]
text = [
  "Plush Toy: ...So...about the door...$",
]

[msg.section_0.entries.71]
text = [
  "Prince [VAR TRNAME(1)]: What about it?$",
]

[msg.section_0.entries.72]
text = [
  "Plush Toy: You can't just break\\n",
  "that door with force...\\c\\n",
  "When it looks like the door\\n",
  "is just about to break,\\l\\n",
  "you need to surprise it...\\c\\n",
  "If you do that,\\n",
  "it will run away without being broken...\\c\\n",
  "That's the only way\\n",
  "to get it out of the way.$",
]

[msg.section_0.entries.73]
text = [
  "Prince [VAR TRNAME(1)]: ...\\n",
  "Why did you tell me this?\\c\\n",
  "You're the gatekeeper, right?\\n",
  "Wasn't that the last hint\\l\\n",
  "a few minutes ago?$",
]

[msg.section_0.entries.74]
text = [
  "Plush Toy: I am the gatekeeper...\\c\\n",
  "But...\\n",
  "You invited me to run away with you, right?\\c\\n",
  "And even though you're grumbling,\\n",
  "you don't give up and keep working!$",
]

[msg.section_0.entries.75]
text = [
  "Prince [VAR TRNAME(1)]: Thank you!\\n",
  "We'll get out together, for sure!$",
]

[msg.section_0.entries.76]
text = [
  "Plush Toy: Hmmm...\\n",
  "You're better than I suspected.$",
]

[msg.section_0.entries.77]
text = [
  "Prince [VAR TRNAME(1)]: Huff... Puff...\\n",
  "I did it... The door's gone...$",
]

[msg.section_0.entries.78]
text = [
  "Plush Toy: Looks like it...\\n",
  "But you still can't leave...$",
]

[msg.section_0.entries.79]
text = [
  "Prince [VAR TRNAME(1)]: What's that mean?\\n",
  "If I break the door, I can get out!$",
]

[msg.section_0.entries.80]
text = [
  "Plush Toy: Heh heh heh...\\n",
  "You DID break the door,\\l\\n",
  "but the gatekeeper's still here!$",
]

[msg.section_0.entries.81]
text = [
  "Prince [VAR TRNAME(1)]: I see.\\n",
  "OK, Plush Toy! Out of the way!\\l\\n",
  "If you get in my way, I'll turn you into\\l\\n",
  "scraps of cloth and fluff balls!$",
]

[msg.section_0.entries.82]
text = [
  "Plush Toy: Oh. Big talk...\\c\\n",
  "I don't know what's gonna happen to you\\n",
  "if you think I'm just a ball of fluff!$",
]

[msg.section_0.entries.83]
text = [
  "Prince [VAR TRNAME(1)]: Bring it on!\\n",
  "I don't even need a Pokémon\\l\\n",
  "against a Plush Toy like you!\\c\\n",
  "I'll pulverize you with the prince-fu\\n",
  "I developed!$",
]

[msg.section_0.entries.84]
text = [
  "Plush Toy: Bring it on...$",
]

[msg.section_0.entries.85]
text = [
  "Prince [VAR TRNAME(1)]: Try on my\\n",
  "prince jump-kick for size!$",
]

[msg.section_0.entries.86]
text = [
  "Plush Toy: Ha...\\n",
  "Too slow...$",
]

[msg.section_0.entries.87]
text = [
  "Prince [VAR TRNAME(1)] broke the door of the\\n",
  "magic cage, but a Plush Toy stood in front\\l\\n",
  "of the celebrating prince, blocking the way.\\c\\n",
  "Prince [VAR TRNAME(1)] attacked, but the\\n",
  "blow was not enough to stop the Plush Toy.\\c\\n",
  "The Plush Toy found an opening and brought\\n",
  "down Prince [VAR TRNAME(1)] in an instant...$",
]

[msg.section_0.entries.88]
text = [
  "Plush Toy: Whoa! What a surprise!$",
]

[msg.section_0.entries.89]
text = [
  "Prince [VAR TRNAME(1)]: Huh?!\\n",
  "What's that all of the sudden?$",
]

[msg.section_0.entries.90]
text = [
  "Plush Toy: That Plush Toy...$",
]

[msg.section_0.entries.91]
text = [
  "Prince [VAR TRNAME(1)]: ...Oh, this?\\n",
  "The toy used for Substitute?\\c\\n",
  "Now that you mention it,\\n",
  "it does look just like you...$",
]

[msg.section_0.entries.92]
text = [
  "Plush Toy: It sure does...\\c\\n",
  "But, well, I didn't always look like this.$",
]

[msg.section_0.entries.93]
text = [
  "Prince [VAR TRNAME(1)]: Really?\\c\\n",
  "Oh! Could it be?!\\n",
  "My older brother went missing.\\l\\n",
  "Could you be him?!$",
]

[msg.section_0.entries.94]
text = [
  "Plush Toy: Ha ha... I doubt it.\\c\\n",
  "But, since I've been in this world,\\n",
  "I've kept forgetting about the past,\\l\\n",
  "so who knows?\\l\\n",
  "What was his name anyway?$",
]

[msg.section_0.entries.95]
text = [
  "Prince [VAR TRNAME(1)]: Um...\\n",
  "I think it was Kevin, or something like that?\\c\\n",
  "My father and mother don't want to\\n",
  "talk about it, so...\\c\\n",
  "The only reason I heard about the\\n",
  "name was the minister told me in secret.$",
]

[msg.section_0.entries.96]
text = [
  "Plush Toy: Kevin...\\n",
  "Hm... I see...$",
]

[msg.section_0.entries.97]
text = [
  "Prince [VAR TRNAME(1)]: Well, regardless...\\c\\n",
  "I hope you return to your old self someday!$",
]

[msg.section_0.entries.98]
text = [
  "Plush Toy: Ha ha ha...\\c\\n",
  "(...I see... [VAR TRNAME(1)]...\\n",
  "You sure got big fast...)$",
]

[msg.section_0.entries.99]
text = [
  "Plush Toy: Ha ha ha!\\c\\n",
  "You surprised the black door,\\n",
  "and it ran away!$",
]

[msg.section_0.entries.100]
text = [
  "Prince [VAR TRNAME(1)]: I did it!\\n",
  "The door's gone!\\c\\n",
  "Everything went as planned, right?$",
]

[msg.section_0.entries.101]
text = [
  "Plush Toy: Looks like it...\\n",
  "OK, get going then!$",
]

[msg.section_0.entries.102]
text = [
  "Prince [VAR TRNAME(1)]: What are you saying?\\n",
  "You're coming with me!\\l\\n",
  "We're running away together!\\c\\n",
  "If I get away while you stay here, as\\n",
  "the gatekeeper, you'll be punished, right?$",
]

[msg.section_0.entries.103]
text = [
  "Plush Toy: But...\\n",
  "Even if we get away,\\l\\n",
  "I don't have anywhere to go...\\c\\n",
  "Even if I leave the cage,\\n",
  "it's the magic world...\\c\\n",
  "Bellelba will catch me\\n",
  "and wipe me out!$",
]

[msg.section_0.entries.104]
text = [
  "Prince [VAR TRNAME(1)]: I know that!\\n",
  "We can't leave like this!\\l\\n",
  "We have to do something about Bellelba!\\c\\n",
  "That's why I will definitely need\\n",
  "your advice!\\c\\n",
  "So you absolutely must\\n",
  "come with me!\\c\\n",
  "If we make it back to our own world,\\n",
  "you can live in my castle!$",
]

[msg.section_0.entries.105]
text = [
  "Plush Toy: Ha ha ha...\\n",
  "Oh, “absolutely must,\\\" huh...\\c\\n",
  "You're really selfish...\\c\\n",
  "But, I agree...\\c\\n",
  "I'll go with you!\\n",
  "I'll help you win!\\c\\n",
  "I'll make myself small,\\n",
  "so put me in your pocket!$",
]

[msg.section_0.entries.106]
text = [
  "Prince [VAR TRNAME(1)]: Ah ha ha!\\n",
  "Hey! That tickles!$",
]

[msg.section_0.entries.107]
text = [
  "Prince [VAR TRNAME(1)] escaped\\n",
  "from the magic cage along with\\l\\n",
  "the Plush Toy gatekeeper.\\c\\n",
  "He's learned to be a little kinder\\n",
  "and become much stronger.\\l\\n",
  "He should be able to overcome\\l\\n",
  "his final obstacle.$",
]

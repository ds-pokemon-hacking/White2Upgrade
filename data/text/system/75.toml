[msg.section_0.entries.0]
text = [
  "This Marine Tube is also known as a walk-\\n",
  "through aquarium, meaning you can see\\n",
  "Pokémon living in the ocean as you walk.\\c\\n",
  "In the morning, you can observe Mantine\\n",
  "swimming elegantly. As the evening passes,\\n",
  "you'll see Frillish floating mysteriously.$",
]

[msg.section_0.entries.1]
text = [
  "The Marine Tube is an undersea tunnel,\\n",
  "built to commemorate the friendship\\n",
  "between Undella Town and Humilau City.\\c\\n",
  "It is made of hardened glass 9.8 inches\\n",
  "thick, which can withstand high water\\n",
  "pressure and contact with huge Pokémon.\\c\\n",
  "The Marine Tube was built using the best\\n",
  "technology in Unova. Please walk through\\n",
  "and contemplate the underwater scenery.$",
]

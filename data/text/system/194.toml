[msg]
trailing_data = "3636"

[msg.section_0.entries.0]
text = [
  "Movie Star$",
]

[msg.section_0.entries.1]
text = [
  "World Police$",
]

[msg.section_0.entries.2]
text = [
  "Radio: HQ to Mecha Cop.\\n",
  "HQ to Mecha Cop.\\l\\n",
  "Arrest the criminal\\l\\n",
  "as soon as possible.$",
]

[msg.section_0.entries.3]
text = [
  "Radio: HQ to Mecha Cop.\\n",
  "HQ to Mecha Cop.\\l\\n",
  "We have dispatched riot police.\\l\\n",
  "Cooperate with them, and\\l\\n",
  "carry out the mission.$",
]

[msg.section_0.entries.4]
text = [
  "Mecha Cop: Riot police have arrived...$",
]

[msg.section_0.entries.5]
text = [
  "The [VAR PKNICK(0)] Ninja: All I want\\n",
  "is to run through town tonight\\l\\n",
  "with [VAR PKNICK(0)].\\l\\n",
  "Just for the thrill of it!$",
]

[msg.section_0.entries.6]
text = [
  "Mecha Cop: The Birdlime Machine Gun!\\n",
  "Apunten, ¡fuego!$",
]

[msg.section_0.entries.7]
text = [
  "The [VAR PKNICK(0)] Ninja: Whoa!\\n",
  "A-again?\\c\\n",
  "You used a weapon again!\\n",
  "You're doing it on purpose, aren't you?$",
]

[msg.section_0.entries.8]
text = [
  "Mecha Cop: Argh, sorry about that.\\n",
  "I just wanted to try it out.$",
]

[msg.section_0.entries.9]
text = [
  "The [VAR PKNICK(0)] Ninja: (...A guy like that\\n",
  "is a champion of justice...)\\l\\n",
  "(...How appalling...)$",
]

[msg.section_0.entries.10]
text = [
  "Mecha Cop: I've got you cornered,\\n",
  "[VAR PKNICK(0)] Ninja!\\l\\n",
  "Surrender!$",
]

[msg.section_0.entries.11]
text = [
  "The [VAR PKNICK(0)] Ninja: Argh...sigh...\\c\\n",
  "Hey, Mecha Cop...\\n",
  "Yeah, you got me.\\l\\n",
  "So will you grant my last request?$",
]

[msg.section_0.entries.12]
text = [
  "Mecha Cop: Well, what is it?$",
]

[msg.section_0.entries.13]
text = [
  "The [VAR PKNICK(0)] Ninja: Battle me!$",
]

[msg.section_0.entries.14]
text = [
  "Mecha Cop: In recognition of you as\\n",
  "my archenemy, [VAR PKNICK(0)] Ninja...\\c\\n",
  "Challenge accepted!\\n",
  "Let's battle!\\l\\n",
  "Séquence d'activation... Action!$",
]

[msg.section_0.entries.15]
text = [
  "The [VAR PKNICK(0)] Ninja: Let me go!$",
]

[msg.section_0.entries.16]
text = [
  "Mecha Cop: Even if he is a villain,\\n",
  "reaching out to him\\l\\n",
  "if he asks for help...\\c\\n",
  "...may also be justice...$",
]

[msg.section_0.entries.17]
text = [
  "The [VAR PKNICK(0)] Ninja: Ready to rock,\\n",
  "Mecha Cop?$",
]

[msg.section_0.entries.18]
text = [
  "Mecha Cop: Bring it!\\n",
  "This battle is for keeps!$",
]

[msg.section_0.entries.19]
text = [
  "The [VAR PKNICK(0)] Ninja: Heh!\\n",
  "It's been a long time since\\l\\n",
  "I've had so much fun battling!$",
]

[msg.section_0.entries.20]
text = [
  "Mecha Cop: I labeled every criminal a villain.\\n",
  "Once someone has a label slapped on them,\\l\\n",
  "that label becomes a signpost of how to\\l\\n",
  "treat them. Thinking about it...\\c\\n",
  "Once I labeled you a villain, I no longer\\n",
  "treated you like a fellow human being.\\c\\n",
  "But criminals are still human beings.\\n",
  "Their crimes may be unforgivable, but\\l\\n",
  "their human dignity must still be respected,\\l\\n",
  "or there would be no way to tell the\\l\\n",
  "difference between justice and injustice.$",
]

[msg.section_0.entries.21]
text = [
  "The [VAR PKNICK(0)] Ninja: ...\\n",
  "Mecha Cop...?$",
]

[msg.section_0.entries.22]
text = [
  "Mecha Cop: Justice...\\n",
  "Real justice, that I can believe in...$",
]

[msg.section_0.entries.23]
text = [
  "The [VAR PKNICK(0)] Ninja: Mecha Cop...\\n",
  "By any chance, are you taking it easy on me?$",
]

[msg.section_0.entries.24]
text = [
  "Mecha Cop: Time will be the judge of that...$",
]

[msg.section_0.entries.25]
text = [
  "The [VAR PKNICK(0)] Ninja: Get hold of yourself!\\n",
  "You represent the World Police,\\l\\n",
  "and I'm a thief, a criminal, a villain!\\l\\n",
  "We...are...enemies!$",
]

[msg.section_0.entries.26]
text = [
  "Mecha Cop: [VAR PKNICK(0)] Ninja.\\n",
  "Our battles have made me question\\l\\n",
  "the definition of justice...\\c\\n",
  "As a secret detective, I'm a failure.\\n",
  "The last thing that I can do for you is...$",
]

[msg.section_0.entries.27]
text = [
  "The [VAR PKNICK(0)] Ninja: Get a grip, crybaby!\\n",
  "My archenemy, Mecha Cop,\\l\\n",
  "wouldn't show himself to be a pushover!$",
]

[msg.section_0.entries.28]
text = [
  "Mecha Cop: Protecting justice...\\c\\n",
  "...A concept I no longer believe in.\\n",
  "Nothing really matters anymore...$",
]

[msg.section_0.entries.29]
text = [
  "Mecha Cop: I was trapped in a mechanical\\n",
  "framework of justice.\\l\\n",
  "You've woken me up.\\l\\n",
  "[VAR PKNICK(0)] Ninja...$",
]

[msg.section_0.entries.30]
text = [
  "The [VAR PKNICK(0)] Ninja: Gulp...\\n",
  "What are you trying to say?$",
]

[msg.section_0.entries.31]
text = [
  "Mecha Cop: But you are a thief.\\n",
  "I cannot forgive your crimes...\\c\\n",
  "But...if you pay for your crimes,\\n",
  "then, together, we...$",
]

[msg.section_0.entries.32]
text = [
  "The [VAR PKNICK(0)] Ninja: Say no more!$",
]

[msg.section_0.entries.33]
text = [
  "The [VAR PKNICK(0)] Ninja: Wait...\\n",
  "What do you mean--nothing matters anymore?$",
]

[msg.section_0.entries.34]
text = [
  "Mecha Cop: Justice, evil...\\n",
  "A robot can't tell the difference.\\c\\n",
  "Push my buttons, and I recite the\\n",
  "code of the World Police.$",
]

[msg.section_0.entries.35]
text = [
  "The [VAR PKNICK(0)] Ninja: You...\\n",
  "You've changed...$",
]

[msg.section_0.entries.36]
text = [
  "Mecha Cop: Changed?\\n",
  "What do you mean?\\c\\n",
  "All I've ever been is a cog in the wheel,\\n",
  "a mouthpiece for the World Police...\\c\\n",
  "An antiseptic,\\n",
  "unemotional\\l\\n",
  "robot.$",
]

[msg.section_0.entries.37]
text = [
  "Riot Police: Calling all members!\\n",
  "Apprehend the [VAR PKNICK(0)] Ninja immediately!$",
]

[msg.section_0.entries.38]
text = [
  "Mecha Cop: Wait.\\n",
  "He won't run away anymore...\\l\\n",
  "Right? The...[VAR PKNICK(0)]...Ninja...$",
]

[msg.section_0.entries.39]
text = [
  "The [VAR PKNICK(0)] Ninja: Heh heh heh.\\n",
  "I lost, Mecha Cop...$",
]

[msg.section_0.entries.40]
text = [
  "Mecha Cop: Mission accomplie.\\c\\n",
  "Now, [VAR PKNICK(0)] Ninja,\\n",
  "it's time for you to pay for your crimes.\\l\\n",
  "Ready to turn over a new leaf...?$",
]

[msg.section_0.entries.41]
text = [
  "The [VAR PKNICK(0)] Ninja: ...\\c\\n",
  "...\\n",
  "Thanks...$",
]

[msg.section_0.entries.42]
text = [
  "Thus, the [VAR PKNICK(0)] Ninja, who escaped\\n",
  "prison so many times before, went to prison\\l\\n",
  "at the hands of Mecha Cop.\\c\\n",
  "And the [VAR PKNICK(0)] Ninja never again\\n",
  "attempted escape...so they say...$",
]

[msg.section_0.entries.43]
text = [
  "Then, several years later...\\c\\n",
  "The secret detective, Mecha Cop,\\n",
  "who protects citizens from crime,\\c\\n",
  "has a new partner at his side.\\n",
  "A partner by the name of...The [VAR PKNICK(0)]!\\c\\n",
  "Listen to your human side, Mecha Cop!\\n",
  "Condemn the crime, not the criminal.$",
]

[msg.section_0.entries.44]
text = [
  "Mecha Cop: I lost. I failed.\\n",
  "Schluss, aus, finito!\\l\\n",
  "Go! Run! Get away!$",
]

[msg.section_0.entries.45]
text = [
  "The [VAR PKNICK(0)] Ninja: Mecha Cop!\\n",
  "I'm disappointed in you.$",
]

[msg.section_0.entries.46]
text = [
  "Mecha Cop: After all, I'm just...\\n",
  "...a cyborg.\\l\\n",
  "I lost my heart a long time ago.\\c\\n",
  "What...?\\n",
  "...\\l\\n",
  "Tears, idle tears...\\l\\n",
  "I know not what they mean...$",
]

[msg.section_0.entries.47]
text = [
  "Thus, The [VAR PKNICK(0)] Ninja, who escaped\\n",
  "from prison so many times before...escaped\\l\\n",
  "from Mecha Cop's grasp once again.\\c\\n",
  "Soon after, Mecha Cop left the World Police,\\c\\n",
  "and The [VAR PKNICK(0)] Ninja\\n",
  "ceased his life of thievery.\\c\\n",
  "Is this what you wanted, Mecha Cop?\\n",
  "Someday, your heart will\\l\\n",
  "tell itself what to do.$",
]

[msg.section_0.entries.48]
text = [
  "The [VAR PKNICK(0)] Ninja: Sweet freedom!\\n",
  "As for the World Police--so predictable!\\c\\n",
  "No matter how many secret detectives\\n",
  "you send after me,\\l\\n",
  "you can't catch me!$",
]

[msg.section_0.entries.49]
text = [
  "Riot Police: There he is! Stop him!$",
]

[msg.section_0.entries.50]
text = [
  "The [VAR PKNICK(0)] Ninja: Farewell,\\n",
  "ladies and gentlemen of the World Police!$",
]

[msg.section_0.entries.51]
text = [
  "Riot Police: Wha... Amazing!\\n",
  "He flew! How did he do that?$",
]

[msg.section_0.entries.52]
text = [
  "Mecha Cop: [VAR PKNICK(0)] Ninja!\\n",
  "Wait! ...Wait!$",
]

[msg.section_0.entries.53]
text = [
  "The [VAR PKNICK(0)] Ninja, who escaped\\n",
  "from prison so many times before...\\l\\n",
  "escaped from Mecha Cop's grasp once more.$",
]

[msg.section_0.entries.54]
text = [
  "Fifty years pass...\\c\\n",
  "The spry [VAR PKNICK(0)] Ninja\\n",
  "is still running, and Mecha Cop, nearly ready\\l\\n",
  "for the scrap heap, is still chasing him,\\l\\n",
  "and running...and escaping...\\l\\n",
  "and chasing...and...\\c\\n",
  "Take a break already, Mecha Cop!\\n",
  "Somebody, make them stop!$",
]

[msg.section_0.entries.55]
text = [
  "Riot Police: Woot!\\n",
  "We'll catch the [VAR PKNICK(0)] Ninja!$",
]

[msg.section_0.entries.56]
text = [
  "The [VAR PKNICK(0)] Ninja: I think not...\\n",
  "I'll never be captured by the likes of you...$",
]

[msg.section_0.entries.57]
text = [
  "Mecha Cop: Stop!\\n",
  "Even when facing a villain,\\c\\n",
  "it's not fair to interrupt a\\n",
  "one-on-one Pokémon battle!\\l\\n",
  "For shame!$",
]

[msg.section_0.entries.58]
text = [
  "Riot Police: We're sorry,\\n",
  "Mecha Cop...$",
]

[msg.section_0.entries.59]
text = [
  "The [VAR PKNICK(0)] Ninja: Heh! No kidding!\\n",
  "Everybody wants a free pass to get\\l\\n",
  "away with unfair things like that.\\c\\n",
  "After all, what you call justice is...$",
]

[msg.section_0.entries.60]
text = [
  "The [VAR PKNICK(0)] Ninja: Obsolete.$",
]

[msg.section_0.entries.61]
text = [
  "Mecha Cop: That's not true!\\c\\n",
  "Whenever, wherever, and whoever\\n",
  "makes the effort to do the right thing--\\l\\n",
  "he or she can be a champion of justice!\\c\\n",
  "[VAR PKNICK(0)] Ninja!\\n",
  "Know what? You're no exception yourself.$",
]

[msg.section_0.entries.62]
text = [
  "The [VAR PKNICK(0)] Ninja: Old fashioned.$",
]

[msg.section_0.entries.63]
text = [
  "Mecha Cop: Wh-what?\\n",
  "A simple trench coat over a metal body--\\l\\n",
  "I'm as fashion forward as I can get.\\c\\n",
  "You're the one in need of a\\n",
  "costume intervention, [VAR PKNICK(0)] Ninja!$",
]

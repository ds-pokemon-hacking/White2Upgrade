  "himself on destroying the world.\\c\\n",
  "Then a day came when he stopped\\n",
  "trying to destroy everything.\\c\\n",
  "But why? Can you guess?$",
]

[msg.section_0.entries.15]
text = [
  "[VAR PKNICK(0)]: ...\\c\\n",
  "(...What is she trying to say?...)\\n",
  "(...Whatever... I'll answer her question...)\\l\\n",
  "(...That way, she won't get suspicious...)$",
]

[msg.section_0.entries.16]
text = [
  "[VAR PKNICK(0)]: Was he ashamed?$",

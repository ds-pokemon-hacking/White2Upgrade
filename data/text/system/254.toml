[msg.section_0.entries.14]
text = [
  "Girl: Listen, I want to tell you a story.\\n",
  "Can you guess how the story ends?\\c\\n",
  "A long, long time ago,\\n",
  "there was a malevolent being\\l\\n",
  "called the Majin of Mayhem.\\c\\n",

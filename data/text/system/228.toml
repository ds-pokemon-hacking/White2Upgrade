[msg]
trailing_data = "a4a4"

[msg.section_0.entries.0]
text = [
  "Movie Star$",
]

[msg.section_0.entries.1]
text = [
  "Magic Queen$",
]

[msg.section_0.entries.2]
text = [
  "Bellelba: Tch! This is bad.\\n",
  "The world's coming apart.\\l\\n",
  "My energy must be close to gone, too.\\c\\n",
  "I have to consume this\\n",
  "child's life force soon, or...$",
]

[msg.section_0.entries.3]
text = [
  "Bellelba: Tch! You!\\n",
  "How did you get out of the cage?\\c\\n",
  "My Plush Toy should have\\n",
  "been keeping an eye on you!$",
]

[msg.section_0.entries.4]
text = [
  "Prince [VAR TRNAME(1)]: Oh! That thing?\\n",
  "I gave it one little punch,\\l\\n",
  "and it ran away crying...\\c\\n",
  "Plush Toy: H-hey...\\n",
  "My reputation!\\c\\n",
  "Prince [VAR TRNAME(1)]: Shhh...\\n",
  "Don't talk!\\c\\n",
  "Prince [VAR TRNAME(1)]: More importantly,\\n",
  "I'm going back to my world!$",
]

[msg.section_0.entries.5]
text = [
  "Bellelba: Hm...\\n",
  "This could be fun.\\c\\n",
  "Well, if you can go back,\\n",
  "you should go, then.\\c\\n",
  "Here, look at this.\\n",
  "It's the door you came through.\\l\\n",
  "If you break it, maybe you can go back\\l\\n",
  "to your own world?$",
]

[msg.section_0.entries.6]
text = [
  "Prince [VAR TRNAME(1)]: Another door?\\c\\n",
  "But if that's the door I came through...\\n",
  "I might be able to get out if I win!$",
]

[msg.section_0.entries.7]
text = [
  "Bellelba: Eee hee hee!\\n",
  "Give it a try!$",
]

[msg.section_0.entries.8]
text = [
  "Prince [VAR TRNAME(1)]: OK!\\n",
  "I'll shatter it for sure!\\l\\n",
  "What's important is...$",
]

[msg.section_0.entries.9]
text = [
  "Prince [VAR TRNAME(1)]: ...Strategy!$",
]

[msg.section_0.entries.10]
text = [
  "Bellelba: Ha ha ha!\\n",
  "What does a child with\\l\\n",
  "no experience know?$",
]

[msg.section_0.entries.11]
text = [
  "Prince [VAR TRNAME(1)]: ...Coolness!$",
]

[msg.section_0.entries.12]
text = [
  "Bellelba: Quit goofing around!\\c\\n",
  "There's no doubt that I'm\\n",
  "way cooler than you!$",
]

[msg.section_0.entries.13]
text = [
  "Plush Toy: Hey! [VAR TRNAME(1)]!\\n",
  "There are two doors!\\l\\n",
  "And the one you came through\\l\\n",
  "was the white door, wasn't it?\\c\\n",
  "Prince [VAR TRNAME(1)]: That's true...\\c\\n",
  "Plush Toy: I would wait on defeating\\n",
  "the white door and focus on\\l\\n",
  "the black door first.\\c\\n",
  "Prince [VAR TRNAME(1)]: I see!\\n",
  "We have to leave that door\\l\\n",
  "so we can go back though it!$",
]

[msg.section_0.entries.14]
text = [
  "Bellelba: Oh my...\\n",
  "Why are you standing there\\l\\n",
  "muttering to yourself?$",
]

[msg.section_0.entries.15]
text = [
  "Prince [VAR TRNAME(1)]: I was just coming\\n",
  "up with a plan!$",
]

[msg.section_0.entries.16]
text = [
  "Bellelba: Eee hee hee!\\n",
  "Talking to yourself is a sign of trouble.\\l\\n",
  "Lonely people talk to themselves, right?$",
]

[msg.section_0.entries.17]
text = [
  "Prince [VAR TRNAME(1)]: Blast it!\\n",
  "I'll say it again,\\l\\n",
  "I'm definitely cooler than you!\\c\\n",
  "I mean, come on, I'm a prince!\\n",
  "I was born into the top rank. My lineage\\l\\n",
  "and my upbringing were completely different!\\c\\n",
  "I was brought up knowing only the best:\\n",
  "my clothes, my home, and even my meals!\\c\\n",
  "We're a completely different grade!$",
]

[msg.section_0.entries.18]
text = [
  "Bellelba: Aaaa!\\n",
  "That's enough from you!\\c\\n",
  "I'm a magic queen who got where\\n",
  "I am through hard work!\\l\\n",
  "Of course I'm more admirable and cooler\\l\\n",
  "than some spoiled little prince!\\c\\n",
  "And what's more, if all you get\\n",
  "from the fanciest kind of upbringing\\l\\n",
  "is idiots like you, then it's just\\l\\n",
  "a waste of money!$",
]

[msg.section_0.entries.19]
text = [
  "Prince [VAR TRNAME(1)]: What did you say?!$",
]

[msg.section_0.entries.20]
text = [
  "Bellelba: Got a problem with it?!$",
]

[msg.section_0.entries.21]
text = [
  "Plush Toy: Sheesh...\\n",
  "Two sides of the same coin...\\l\\n",
  "Man, they're obnoxious...\\c\\n",
  "I don't even care anymore.\\n",
  "I'm just a Plush Toy.\\l\\n",
  "Guess I'll just follow whoever wins...$",
]

[msg.section_0.entries.22]
text = [
  "Prince [VAR TRNAME(1)]: Hey, Bellelba!\\n",
  "What did you make those doors for anyway?$",
]

[msg.section_0.entries.23]
text = [
  "Bellelba: Well...\\n",
  "I suppose I could tell you.\\c\\n",
  "They're devices to connect the\\n",
  "magical world to your world.\\c\\n",
  "Many people wander into this\\n",
  "world through those doors...$",
]

[msg.section_0.entries.24]
text = [
  "Prince [VAR TRNAME(1)]: I see...\\n",
  "Then what happens to them?\\c\\n",
  "Do you lock them up like you did to me?$",
]

[msg.section_0.entries.25]
text = [
  "Bellelba: That's right.\\c\\n",
  "And then their life energy\\n",
  "is sucked up just by their\\l\\n",
  "being in this world.\\c\\n",
  "Then this life extract is\\n",
  "poured into me.$",
]

[msg.section_0.entries.26]
text = [
  "Prince [VAR TRNAME(1)]: What?$",
]

[msg.section_0.entries.27]
text = [
  "Bellelba: The people whose life energy\\n",
  "is drained forget about trying to escape,\\l\\n",
  "and they follow my every command...\\c\\n",
  "Soon, the balance between the two\\n",
  "worlds will reverse,\\l\\n",
  "and there will be no one left\\l\\n",
  "to stand against me... Ha ha ha...$",
]

[msg.section_0.entries.28]
text = [
  "Prince [VAR TRNAME(1)]: It can't be...\\n",
  "I never would've imagined those\\l\\n",
  "doors would have such terrible power...$",
]

[msg.section_0.entries.29]
text = [
  "Prince [VAR TRNAME(1)]: Unforgivable!$",
]

[msg.section_0.entries.30]
text = [
  "Bellelba: Whatever.\\c\\n",
  "I'm free to do whatever\\n",
  "I choose, am I not?\\c\\n",
  "More importantly, you should remember\\n",
  "that your life energy is being drained\\l\\n",
  "while you stand here talking to me!$",
]

[msg.section_0.entries.31]
text = [
  "Prince [VAR TRNAME(1)]: I'm scared...$",
]

[msg.section_0.entries.32]
text = [
  "Bellelba: Eee hee hee hee!\\n",
  "That's right! Be more afraid!\\l\\n",
  "Tremble before me!\\c\\n",
  "If you don't, it's no fun for me!$",
]

[msg.section_0.entries.33]
text = [
  "Prince [VAR TRNAME(1)]: Amazing!$",
]

[msg.section_0.entries.34]
text = [
  "Bellelba: Isn't it?\\c\\n",
  "It's a perfect plan befitting\\n",
  "a magic queen like me!$",
]

[msg.section_0.entries.35]
text = [
  "White Door: Claaaang!\\c\\n",
  "Prince [VAR TRNAME(1)]: Th-the white door!\\n",
  "I broke it, but...$",
]

[msg.section_0.entries.36]
text = [
  "Bellelba: Eee hee hee hee...\\n",
  "It looks like you noticed...\\c\\n",
  "That white door was the one\\n",
  "you went through to get here.\\l\\n",
  "Breaking it means that...$",
]

[msg.section_0.entries.37]
text = [
  "Prince [VAR TRNAME(1)]: I can't go back?$",
]

[msg.section_0.entries.38]
text = [
  "Bellelba: Ah ha ha ha! That's right!\\n",
  "You can only leave this world from\\l\\n",
  "the door you came in through.\\c\\n",
  "I can't even do anything about that rule,\\n",
  "and I'm the one who made the doors!$",
]

[msg.section_0.entries.39]
text = [
  "Prince [VAR TRNAME(1)]: That's...\\n",
  "Come on, Plush Toy!\\l\\n",
  "Isn't there anything we can do?\\c\\n",
  "Plush Toy: N-no...\\n",
  "Not even I can do anything...\\l\\n",
  "What to do...\\c\\n",
  "Prince [VAR TRNAME(1)]: S-so,\\n",
  "we can't leave this place?$",
]

[msg.section_0.entries.40]
text = [
  "Bellelba: Too bad for you,\\n",
  "my dear Prince [VAR TRNAME(1)]!\\c\\n",
  "I guess I'll just have you work\\n",
  "for me forever!$",
]

[msg.section_0.entries.41]
text = [
  "Prince [VAR TRNAME(1)]: And I got\\n",
  "this far...$",
]

[msg.section_0.entries.42]
text = [
  "And so Prince [VAR TRNAME(1)],\\n",
  "who'd put everything on the line to escape,\\l\\n",
  "met a sad fate.\\c\\n",
  "No one knows what happened to\\n",
  "Prince [VAR TRNAME(1)] after that...$",
]

[msg.section_0.entries.43]
text = [
  "Prince [VAR TRNAME(1)]: Huff...\\n",
  "Puff... Phew...\\c\\n",
  "Plush Toy: Wh-what's wrong?\\c\\n",
  "Prince [VAR TRNAME(1)]: For some\\n",
  "reason, I'm in a lot of pain...$",
]

[msg.section_0.entries.44]
text = [
  "Bellelba: Hee hee hee...\\n",
  "You've been in this world too long.\\l\\n",
  "Feeling weak, my dear?$",
]

[msg.section_0.entries.45]
text = [
  "Prince [VAR TRNAME(1)]: That's not it!$",
]

[msg.section_0.entries.46]
text = [
  "Bellelba: Oh, but I'm afraid it is.\\c\\n",
  "Anyone who enters this world\\n",
  "has their power stolen...$",
]

[msg.section_0.entries.47]
text = [
  "Prince [VAR TRNAME(1)]: That's not it!\\n",
  "This isn't an issue of strength!\\c\\n",
  "It's an issue of how I feel!$",
]

[msg.section_0.entries.48]
text = [
  "Bellelba: What?$",
]

[msg.section_0.entries.49]
text = [
  "Prince [VAR TRNAME(1)]: Bellelba!\\c\\n",
  "I mean, Ms. Bellelba!$",
]

[msg.section_0.entries.50]
text = [
  "Bellelba: ...?!$",
]

[msg.section_0.entries.51]
text = [
  "Prince [VAR TRNAME(1)]: I...\\n",
  "While we were fighting,\\l\\n",
  "I grew to love you!\\c\\n",
  "Plush Toy: What?!$",
]

[msg.section_0.entries.52]
text = [
  "Bellelba: What?\\n",
  "Huh? Ah?$",
]

[msg.section_0.entries.53]
text = [
  "Prince [VAR TRNAME(1)]: Bellelba!\\n",
  "I want to live here forever!\\c\\n",
  "No! I want to be with you!\\n",
  "Please, don't deny my feelings!\\c\\n",
  "Bellelba! I love you!$",
]

[msg.section_0.entries.54]
text = [
  "Bellelba: What's this all of a sudden?\\c\\n",
  "First of all, our ages are too far apart...\\c\\n",
  "Even though my beauty is overwhelming,\\n",
  "I'm going to be 108 years old this year.\\l\\n",
  "I'll be an old lady in a little bit.\\c\\n",
  "But I have been thinking about marriage.\\n",
  "Everyone will be talking about it.\\l\\n",
  "I don't know if you're my type, either...$",
]

[msg.section_0.entries.55]
text = [
  "Prince [VAR TRNAME(1)]: It doesn't matter!\\n",
  "If we have love, we'll be fine!\\l\\n",
  "Let's have a happy life together!\\c\\n",
  "Plush Toy: Man, he's sure not\\n",
  "thinking about the long term...$",
]

[msg.section_0.entries.56]
text = [
  "Bellelba: How bold...\\n",
  "But, I don't mind people like that.\\c\\n",
  "Fine... Let's start as friends...$",
]

[msg.section_0.entries.57]
text = [
  "Prince [VAR TRNAME(1)]: That's great!\\n",
  "Let's be happy, Bellelba!\\c\\n",
  "Mwa!$",
]

[msg.section_0.entries.58]
text = [
  "Bellelba: Hee hee...$",
]

[msg.section_0.entries.59]
text = [
  "Plush Toy: C-congratulations?$",
]

[msg.section_0.entries.60]
text = [
  "And so Prince [VAR TRNAME(1)] and\\n",
  "Bellelba were brought together.\\c\\n",
  "Their love was greater than\\n",
  "the difference in age,\\l\\n",
  "and they lived happily ever after...$",
]

[msg.section_0.entries.61]
text = [
  "Prince [VAR TRNAME(1)]: So strong...\\n",
  "I don't know if I can do it.\\l\\n",
  "And I've come this far, too...$",
]

[msg.section_0.entries.62]
text = [
  "Bellelba: Eee hee hee!\\n",
  "Too bad!\\c\\n",
  "Well then! It's back to the\\n",
  "cage for you, then!\\l\\n",
  "This time I'll assign\\l\\n",
  "more guards to you!$",
]

[msg.section_0.entries.63]
text = [
  "Prince [VAR TRNAME(1)]: I'm never\\n",
  "going to give up!\\l\\n",
  "I'll keep running out!\\c\\n",
  "I still have [VAR PKNICK(0)] with me!$",
]

[msg.section_0.entries.64]
text = [
  "Bellelba: Oh, sooo scary!\\n",
  "Well then, I'll just have to take\\l\\n",
  "care of your [VAR PKNICK(0)] for you.\\c\\n",
  "With a little magic, it might make\\n",
  "a nice table or chair!$",
]

[msg.section_0.entries.65]
text = [
  "Prince [VAR TRNAME(1)]: No way!\\n",
  "Leave [VAR PKNICK(0)] out of this!$",
]

[msg.section_0.entries.66]
text = [
  "Bellelba: Eee hee hee...\\n",
  "You really are a fool.\\c\\n",
  "You always say one word too many\\n",
  "or get tripped up!$",
]

[msg.section_0.entries.67]
text = [
  "Prince [VAR TRNAME(1)]: Sniff...\\n",
  "I should've listened to Father\\l\\n",
  "and just been good...$",
]

[msg.section_0.entries.68]
text = [
  "And so Prince [VAR TRNAME(1)]'s escape\\n",
  "attempt came to an end...\\c\\n",
  "No one knows what happened to\\n",
  "Prince [VAR TRNAME(1)] and [VAR PKNICK(0)]\\l\\n",
  "after that...$",
]

[msg.section_0.entries.69]
text = [
  "Prince [VAR TRNAME(1)]: Do you trap people\\n",
  "in this world and do mean things to\\l\\n",
  "them because you hate them?$",
]

[msg.section_0.entries.70]
text = [
  "Bellelba: Not really...\\n",
  "I just want the life energy\\l\\n",
  "that living things have.\\c\\n",
  "I just use humans as a basic\\n",
  "material to extract it from.$",
]

[msg.section_0.entries.71]
text = [
  "Prince [VAR TRNAME(1)]: That's terrible...\\n",
  "Using people like things...$",
]

[msg.section_0.entries.72]
text = [
  "Bellelba: Oh really.\\n",
  "Like your father doesn't\\l\\n",
  "use his people?\\c\\n",
  "That's what kings do.$",
]

[msg.section_0.entries.73]
text = [
  "Prince [VAR TRNAME(1)]: You're wrong!\\c\\n",
  "Father always spoke very\\n",
  "highly of the people in the kingdom!\\c\\n",
  "Kings exist for the people!\\n",
  "People aren't there for the king!\\c\\n",
  "It's completely different from you!\\c\\n",
  "But, I just now understood the meaning\\n",
  "of my father's words...$",
]

[msg.section_0.entries.74]
text = [
  "Bellelba: Hm...\\n",
  "Say whatever you'd like.$",
]

[msg.section_0.entries.75]
text = [
  "Prince [VAR TRNAME(1)]: Father!\\n",
  "Father!$",
]

[msg.section_0.entries.76]
text = [
  "Prince [VAR TRNAME(1)]: I'll do it!$",
]

[msg.section_0.entries.77]
text = [
  "Bellelba: You're still not giving up?\\n",
  "Well, give it your best shot.$",
]

[msg.section_0.entries.78]
text = [
  "Prince [VAR TRNAME(1)]: His name was?$",
]

[msg.section_0.entries.79]
text = [
  "Bellelba: You're an amazingly\\n",
  "dumb prince...$",
]

[msg.section_0.entries.80]
text = [
  "Prince [VAR TRNAME(1)]: And Mother!$",
]

[msg.section_0.entries.81]
text = [
  "Bellelba: What is with you?\\n",
  "Muttering to yourself over there!\\c\\n",
  "Don't you even understand the\\n",
  "situation you're in?$",
]

[msg.section_0.entries.82]
text = [
  "Black Door: Claaaang!\\c\\n",
  "Prince [VAR TRNAME(1)]: I did it!\\n",
  "I defeated the black door!\\c\\n",
  "Plush Toy: All right!$",
]

[msg.section_0.entries.83]
text = [
  "Bellelba: Eeeeeaaaaaugh!\\n",
  "That's impossible!\\c\\n",
  "Ah... Uuugggh...$",
]

[msg.section_0.entries.84]
text = [
  "Prince [VAR TRNAME(1)]: Wh-what's happening?\\c\\n",
  "Plush Toy: Bellelba put all of her\\n",
  "magic power into that door.\\c\\n",
  "When the door was broken,\\n",
  "it hurt her as well.$",
]

[msg.section_0.entries.85]
text = [
  "Bellelba: It hurts...\\n",
  "This shouldn't...\\l\\n",
  "have been...possible...$",
]

[msg.section_0.entries.86]
text = [
  "Prince [VAR TRNAME(1)]: Bellelba disappeared!\\c\\n",
  "Plush Toy: That means this world\\n",
  "will disappear soon, too...\\c\\n",
  "Prince [VAR TRNAME(1)]: What should we do?\\c\\n",
  "Plush Toy: Open the remaining\\n",
  "white door and go inside.\\l\\n",
  "It should connect to the other world!\\c\\n",
  "Prince [VAR TRNAME(1)]: OK! Let's go home!\\n",
  "To our own world!$",
]

[msg.section_0.entries.87]
text = [
  "...\\c\\n",
  "And so Prince [VAR TRNAME(1)] safely\\n",
  "returned to his own world...\\c\\n",
  "The experiences Prince [VAR TRNAME(1)]\\n",
  "had in the magical world\\l\\n",
  "made him much more mature.\\c\\n",
  "Later, Prince [VAR TRNAME(1)]\\n",
  "became the king and reigned\\l\\n",
  "over an era of peace and prosperity...$",
]

[msg.section_0.entries.88]
text = [
  "Bellelba: Ah! You're so stubborn!\\c\\n",
  "Would you just give up already?$",
]

[msg.section_0.entries.89]
text = [
  "Prince [VAR TRNAME(1)]: Ummm...$",
]

[msg.section_0.entries.90]
text = [
  "Bellelba: Enough already...\\n",
  "They say home is where you hang your hat.\\c\\n",
  "I'm sure you'll get used to\\n",
  "living in a dark, damp cage!$",
]

[msg.section_0.entries.91]
text = [
  "Prince [VAR TRNAME(1)]: Not yet!$",
]

[msg.section_0.entries.92]
text = [
  "Bellelba: Just give it up already!\\n",
  "I want to go home and\\l\\n",
  "take off my makeup...\\c\\n",
  "If you wear it too long,\\n",
  "it's bad for the condition\\l\\n",
  "of your skin, you know.$",
]

[msg.section_0.entries.93]
text = [
  "Prince [VAR TRNAME(1)]: You give up!$",
]

[msg.section_0.entries.94]
text = [
  "Bellelba: I'm so sorry,\\n",
  "but I can't do that!\\c\\n",
  "If I don't absorb some energy\\n",
  "from a young person,\\l\\n",
  "I won't be able to get rid of the wrinkles\\l\\n",
  "or the bags under my eyes...$",
]

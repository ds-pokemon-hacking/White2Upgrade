[msg.section_0.entries.0]
text = [
  "[CENTER]This is a story that starts\\n",
  "[CENTER]with a certain scientist...$",
]

[msg.section_0.entries.1]
text = [
  "[CENTER]With his magnificent mind,\\n",
  "[CENTER]he completed a robot that\\n",
  "[CENTER]people called marvelous...$",
]

[msg.section_0.entries.2]
text = [
  "[CENTER]But he still wasn't satisfied.\\n",
  "\\n",
  "[CENTER]He continued to tweak the\\n",
  "[CENTER]robot's programming and memory\\n",
  "[CENTER]so it was even closer to being human.$",
]


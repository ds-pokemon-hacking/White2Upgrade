[msg.section_0.entries.0]
text = [
  "Actress$",
]

[msg.section_0.entries.1]
text = [
  "Assistant$",
]

[msg.section_0.entries.2]
text = [
  "[VAR TRNAME(1)]: OK, F-00...\\n",
  "Let's have some fun!$",
]

[msg.section_0.entries.3]
text = [
  "F-00: FUN! I LIKE FUN!\\n",
  "WHAT DO WE DO FOR FUN, [VAR TRNAME(1)]?$",
]

[msg.section_0.entries.4]
text = [
  "[VAR TRNAME(1)]: I don't know...\\n",
  "What do you want to do for fun, F-00?$",
]

[msg.section_0.entries.5]
text = [
  "F-00: FUN! FUN! I WANT TO PLAY WITH\\n",
  "[VAR TRNAME(1)] AND POKÉMON!$",
]

[msg.section_0.entries.6]
text = [
  "Assistant: Professor [VAR TRNAME(1)]...\\c\\n",
  "Are you sure you have time to play with\\n",
  "the F-00?\\c\\n",
  "We're pretty backed up with research\\n",
  "work, you know...$",
]

[msg.section_0.entries.7]
text = [
  "[VAR TRNAME(1)]: Don't worry about all that!\\c\\n",
  "That kind of research can be done by\\n",
  "just about anyone...\\c\\n",
  "I'm much more interested in filling up F-00's\\n",
  "memory by teaching it lots and lots of\\l\\n",
  "new things...$",
]

[msg.section_0.entries.8]
text = [
  "[VAR TRNAME(1)]: Come on, F-00!\\c\\n",
  "You need to give your attacks more oomph\\n",
  "when going up against Pokémon!$",
]

[msg.section_0.entries.9]
text = [
  "F-00: ATTACKS...$",
]

[msg.section_0.entries.10]
text = [
  "[VAR TRNAME(1)]: That's right!\\c\\n",
  "You've got to use moves on your own, like\\n",
  "a Pokémon! You know what to do!\\c\\n",
  "F-00, you're equipped with a system\\n",
  "that lets you use moves, just like\\l\\n",
  "a Pokémon does!$",
]

[msg.section_0.entries.11]
text = [
  "F-00: ATTACKS...$",
]

[msg.section_0.entries.12]
text = [
  "[VAR TRNAME(1)]: What's wrong, F-00?$",
]

[msg.section_0.entries.13]
text = [
  "Assistant: Umm, Professor...\\n",
  "Maybe the F-00 doesn't want to hurt\\l\\n",
  "its opponents...$",
]

[msg.section_0.entries.14]
text = [
  "[VAR TRNAME(1)]: Listen to me, F-00.\\n",
  "Pokémon are creatures that just\\l\\n",
  "love to battle!\\c\\n",
  "Trust me, F-00! You have nothing\\n",
  "to worry about!$",
]

[msg.section_0.entries.15]
text = [
  "F-00: ...$",
]

[msg.section_0.entries.16]
text = [
  "[VAR TRNAME(1)]: Come on! It's fun!$",
]

[msg.section_0.entries.17]
text = [
  "F-00: FUN! FUN!$",
]

[msg.section_0.entries.18]
text = [
  "[VAR TRNAME(1)]: Hurry up!$",
]

[msg.section_0.entries.19]
text = [
  "F-00: ALL RIGHT...$",
]

[msg.section_0.entries.20]
text = [
  "[VAR TRNAME(1)]: You don't want to?$",
]

[msg.section_0.entries.21]
text = [
  "F-00: DO NOT LIKE...ATTACKS...$",
]

[msg.section_0.entries.22]
text = [
  "[VAR TRNAME(1)]: What do you think?\\n",
  "Battling with Pokémon is pretty fun,\\l\\n",
  "isn't it?$",
]

[msg.section_0.entries.23]
text = [
  "F-00: POKÉMON! FUN!\\n",
  "I LOVE [VAR TRNAME(1)]!$",
]

[msg.section_0.entries.24]
text = [
  "[VAR TRNAME(1)]: Hee hee hee...\\n",
  "Well, thank you, F-00!$",
]

[msg.section_0.entries.25]
text = [
  "F-00: I LOVE [VAR TRNAME(1)]!\\n",
  "DOES [VAR TRNAME(1)] LOVE ME?$",
]

[msg.section_0.entries.26]
text = [
  "[VAR TRNAME(1)]: Of course I do!$",
]

[msg.section_0.entries.27]
text = [
  "F-00: I LOVE [VAR TRNAME(1)]!\\n",
  "[VAR TRNAME(1)]! I AM HAVING FUN!$",
]

[msg.section_0.entries.28]
text = [
  "[VAR TRNAME(1)]: That's hard to say...$",
]

[msg.section_0.entries.29]
text = [
  "F-00: NOT LOVE ME...\\c\\n",
  "[VAR TRNAME(1)]...MUST HATE ME...\\n",
  "THEN I...HATE...[VAR TRNAME(1)]...$",
]

[msg.section_0.entries.30]
text = [
  "[VAR TRNAME(1)]: Aww, I'm blushing!$",
]

[msg.section_0.entries.31]
text = [
  "F-00: WHAT IS BLUSHING?$",
]

[msg.section_0.entries.32]
text = [
  "Assistant: Professor [VAR TRNAME(1)]...\\c\\n",
  "The F-00 is just about out of energy...$",
]

[msg.section_0.entries.33]
text = [
  "[VAR TRNAME(1)]: I guess this ends today's\\n",
  "session, then...\\c\\n",
  "I'd better give the F-00 a bigger battery\\n",
  "so I can spend more time with it.$",
]

[msg.section_0.entries.34]
text = [
  "Assistant: Professor...\\c\\n",
  "Why are you so particular about the F-00?\\c\\n",
  "I understand that it's your invention and\\n",
  "that it's important to you, but don't you\\l\\n",
  "think you might be taking it a bit too far?$",
]

[msg.section_0.entries.35]
text = [
  "[VAR TRNAME(1)]: You want to know?$",
]

[msg.section_0.entries.36]
text = [
  "Assistant: Well...yes, that's why I asked.$",
]

[msg.section_0.entries.37]
text = [
  "[VAR TRNAME(1)]: Ever since I was younger, I've\\n",
  "done nothing but study, all day every day...\\c\\n",
  "There's no one in my life I can truly call\\n",
  "a friend...\\c\\n",
  "And now I spend my days doing research with\\n",
  "adults like you...\\c\\n",
  "The F-00 is the only being in my life that\\n",
  "I have a chance to play with!$",
]

[msg.section_0.entries.38]
text = [
  "Assistant: I see...$",
]

[msg.section_0.entries.39]
text = [
  "[VAR TRNAME(1)]: All right, then...\\n",
  "Let's stop for today, F-00...$",
]

[msg.section_0.entries.40]
text = [
  "F-00: FUN! FUN!\\n",
  "[VAR TRNAME(1)]! FUN!$",
]

[msg.section_0.entries.41]
text = [
  "[VAR TRNAME(1)]: Thanks, F-00!\\n",
  "I'm having fun, too!$",
]

[msg.section_0.entries.42]
text = [
  "F-00: I LOVE [VAR TRNAME(1)]!\\c\\n",
  "[VAR TRNAME(1)] IS MY FRIEND!\\n",
  "PLAY WITH ME MORE!$",
]

[msg.section_0.entries.43]
text = [
  "[VAR TRNAME(1)]: I'm so sorry, F-00!\\c\\n",
  "Your battery is just about to run out...\\c\\n",
  "So, let's take a break now, OK?$",
]

[msg.section_0.entries.44]
text = [
  "Assistant: Hee hee... Ha ha...$",
]

[msg.section_0.entries.45]
text = [
  "[VAR TRNAME(1)]: What's so funny?$",
]

[msg.section_0.entries.46]
text = [
  "Assistant: Oh, sorry...\\c\\n",
  "It's just funny watching the two of you\\n",
  "play together. You look so happy!\\l\\n",
  "Like you're siblings or something!$",
]

[msg.section_0.entries.47]
text = [
  "[VAR TRNAME(1)]: Siblings...$",
]

[msg.section_0.entries.48]
text = [
  "Assistant: Listen! I'm sorry!\\n",
  "I didn't mean anything bad by it.$",
]

[msg.section_0.entries.49]
text = [
  "[VAR TRNAME(1)]: Siblings, huh?$",
]

[msg.section_0.entries.50]
text = [
  "It was just as my assistant said.\\n",
  "The F-00 had become my friend...\\c\\n",
  "Actually, that's not quite right.\\n",
  "Our relationship was more like that of a\\l\\n",
  "brother and sister who get along very well.\\c\\n",
  "However...\\c\\n",
  "Such happy days were not meant to last...$",
]

[msg.section_0.entries.51]
text = [
  "[VAR TRNAME(1)]: F-00! What's wrong?!$",
]

[msg.section_0.entries.52]
text = [
  "F-00: POKÉmon... FUn...\\n",
  "[VAR TRNAME(1)]... LOve...\\c\\n",
  "...$",
]

[msg.section_0.entries.53]
text = [
  "[VAR TRNAME(1)]: F-00! Come back!\\n",
  "F-00!$",
]

[msg.section_0.entries.54]
text = [
  "Assistant: It's no good...\\c\\n",
  "The F-00 has stopped functioning\\n",
  "completely... Its circuits appear to have\\l\\n",
  "shorted out.\\c\\n",
  "I'm afraid that its memory has been wiped\\n",
  "as well. Everything the F-00 has learned\\l\\n",
  "is now gone...$",
]

[msg.section_0.entries.55]
text = [
  "[VAR TRNAME(1)]: No way! It can't be!\\c\\n",
  "Didn't you back up its memory banks?$",
]

[msg.section_0.entries.56]
text = [
  "Assistant: I'm sorry, Professor...\\c\\n",
  "You wouldn't ever let me touch the F-00.\\n",
  "I never had a chance to back up its memory.$",
]

[msg.section_0.entries.57]
text = [
  "[VAR TRNAME(1)]: It can't be!\\c\\n",
  "I finally succeeded in creating a robot...\\n",
  "It was my friend!$",
]

[msg.section_0.entries.58]
text = [
  "I did my best to repair the F-00...\\c\\n",
  "As a result of my efforts, the F-00 was\\n",
  "rebuilt as a highly functional robot with\\l\\n",
  "great intelligence...\\c\\n",
  "However, the kind and playful heart I had\\n",
  "discovered inside my friend did not return\\l\\n",
  "to the new F-00...$",
]

[msg.section_0.entries.59]
text = [
  "[VAR TRNAME(1)]: Urgh...\\c\\n",
  "What incredible strength!$",
]

[msg.section_0.entries.60]
text = [
  "F-00: ATTACK! ATTACK!\\n",
  "[VAR TRNAME(1)], FUN!$",
]

[msg.section_0.entries.61]
text = [
  "[VAR TRNAME(1)]: Argh...$",
]

[msg.section_0.entries.62]
text = [
  "Assistant: Eek!!\\c\\n",
  "Professor [VAR TRNAME(1)]!\\n",
  "Are you OK?$",
]

[msg.section_0.entries.63]
text = [
  "[VAR TRNAME(1)]: Guh...ughh...\\c\\n",
  "F-00... You're so strong...$",
]

[msg.section_0.entries.64]
text = [
  "F-00: ATTACK! ATTACK!\\n",
  "[VAR TRNAME(1)], FUN!$",
]

[msg.section_0.entries.65]
text = [
  "Assistant: Professor!\\c\\n",
  "Oh no! Someone! Please, help!\\n",
  "The F-00 is attacking Professor [VAR TRNAME(1)]!\\c\\n",
  "This robot is simply too dangerous!$",
]

[msg.section_0.entries.66]
text = [
  "[VAR TRNAME(1)]: Ha ha ha...\\c\\n",
  "Come on... F-00...\\n",
  "Let's... Let's play some more...\\c\\n",
  "You... You're...my friend...\\c\\n",
  "...$",
]

[msg.section_0.entries.67]
text = [
  "Assaulted by the over-excited F-00,\\n",
  "I lost consciousness...\\c\\n",
  "I came to after a while, only to see that\\n",
  "the F-00 had been completely dismantled\\l\\n",
  "by my assistants...\\c\\n",
  "I gathered the pieces of scrap that once\\n",
  "made up the F-00 and hugged them close\\l\\n",
  "to me as I left the laboratory.\\c\\n",
  "After that, I quit robotics research and\\n",
  "never attempted to create another one.$",
]

[msg.section_0.entries.68]
text = [
  "F-00: FUN! FUN!\\n",
  "[VAR TRNAME(1)]! POKÉMON, FUN!$",
]

[msg.section_0.entries.69]
text = [
  "[VAR TRNAME(1)]: That's great, F-00...\\c\\n",
  "It makes me happy to see you having\\n",
  "so much fun!\\c\\n",
  "But, we're going to have to stop soon.\\n",
  "Your battery is about to run out.$",
]

[msg.section_0.entries.70]
text = [
  "F-00: NO! NO!\\n",
  "I WANT TO PLAY WITH [VAR TRNAME(1)] MORE!$",
]

[msg.section_0.entries.71]
text = [
  "[VAR TRNAME(1)]: Listen to me!$",
]

[msg.section_0.entries.72]
text = [
  "F-00: NO! WANT TO PLAY MORE!\\n",
  "MORE FUN WITH [VAR TRNAME(1)]!$",
]

[msg.section_0.entries.73]
text = [
  "[VAR TRNAME(1)]: Just be patient...$",
]

[msg.section_0.entries.74]
text = [
  "F-00: SORRY. MADE TROUBLE FOR [VAR TRNAME(1)].\\n",
  "WILL BE PATIENT.$",
]

[msg.section_0.entries.75]
text = [
  "[VAR TRNAME(1)]: Let's play again later!$",
]

[msg.section_0.entries.76]
text = [
  "F-00: YES! PLAY AGAIN LATER!\\n",
  "F-00 AND [VAR TRNAME(1)], FRIENDS!$",
]

[msg.section_0.entries.77]
text = [
  "F-00: THAT HURTS! OUCH!\\n",
  "[VAR TRNAME(1)]! DON'T HURT ME!$",
]

[msg.section_0.entries.78]
text = [
  "[VAR TRNAME(1)]: I'm so sorry!\\n",
  "Did it really hurt?$",
]

[msg.section_0.entries.79]
text = [
  "F-00: YES...\\c\\n",
  "BUT F-00 IS OK...\\n",
  "F-00 WON'T CRY!\\c\\n",
  "ACTUALLY, F-00 CANNOT CRY!\\n",
  "SO F-00 IS OK!$",
]

[msg.section_0.entries.80]
text = [
  "[VAR TRNAME(1)]: My poor F-00...$",
]

[msg.section_0.entries.81]
text = [
  "F-00: WHAT IS WRONG, [VAR TRNAME(1)]?$",
]

[msg.section_0.entries.82]
text = [
  "[VAR TRNAME(1)]: I'm so sorry...\\c\\n",
  "When you're in pain, or when you're feeling\\n",
  "sad...when things aren't going well...\\l\\n",
  "It's very important to be able to cry.\\c\\n",
  "But I never wanted to see you cry, so I\\n",
  "didn't program you with negative feelings...\\c\\n",
  "It's not just that...\\n",
  "I didn't want you to become like me...\\l\\n",
  "Always crying by myself...$",
]

[msg.section_0.entries.83]
text = [
  "F-00: ...\\c\\n",
  "[VAR TRNAME(1)], ALWAYS CRYING?\\n",
  "WHY? WHY? IS [VAR TRNAME(1)] SAD?$",
]

[msg.section_0.entries.84]
text = [
  "[VAR TRNAME(1)]: I guess you could say that...\\n",
  "I'm always all alone, so I guess\\l\\n",
  "I feel a little lonely at times...$",
]

[msg.section_0.entries.85]
text = [
  "F-00: NOT ALONE!\\n",
  "F-00 WITH YOU! F-00, FRIEND!$",
]

[msg.section_0.entries.86]
text = [
  "[VAR TRNAME(1)]: F-00...\\c\\n",
  "That's right... How could I forget that\\n",
  "I have you by my side...$",
]

[msg.section_0.entries.87]
text = [
  "F-00: FRIEND!\\n",
  "F-00 AND [VAR TRNAME(1)], FRIENDS!$",
]

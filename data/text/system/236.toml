  "Living forever as a monster!\\c\\n",
  "Just...touching the person I love,\\n",
  "I'll crush him.\\c\\n",
  "I'm a monster--a piteous monster!\\n",
  "I can't get married like this!\\c\\n",
  "What I'm saying, [VAR TRNAME(1)], is...\\n",

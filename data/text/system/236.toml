]

[msg.section_0.entries.45]
text = [
  "...\\c\\n",
  "As the seasons passed, she grew smaller,\\n",
  "little by little...\\c\\n",
  "Living with the giant-sized Monica sometimes\\n",
  "brought trouble along with it,\\l\\n",
  "but I never let it bother me...\\c\\n",
  "Eventually, after I had become an old man\\n",

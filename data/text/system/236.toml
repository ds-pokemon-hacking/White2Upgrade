]

[msg.section_0.entries.11]
text = [
  "River: We need a way to lift the curse\\n",
  "on that miserable Poké Ball...\\c\\n",
  "Let me think...\\c\\n",
  "At its core, a curse is a power of the mind.\\c\\n",
  "So, if you could show a power of the mind\\n",
  "with more strength than the curse\\l\\n",
  "affecting the Poké Ball...\\l\\n",
  "Surely, then, she will...$",

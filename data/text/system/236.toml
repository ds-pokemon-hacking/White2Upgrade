[msg.section_0.entries.42]
text = [
  "[VAR TRNAME(1)]: Oh, Monica...$",
]

[msg.section_0.entries.43]
text = [
  "Monica: [VAR TRNAME(1)]...$",
]

[msg.section_0.entries.44]
text = [
  "Even as Monica and I smiled at each other,\\n",

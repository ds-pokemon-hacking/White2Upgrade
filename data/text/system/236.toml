[msg.section_0.entries.28]
text = [
  "[VAR TRNAME(1)]: But--I'm thinking!$",
]

[msg.section_0.entries.29]
text = [
  "Monica: [VAR TRNAME(1)].\\n",
  "Thinking, talking, anything!\\c\\n",
  "When it comes to doing--nothing!\\c\\n",
  "Your words say nothing!\\n",
  "Your actions say it all!$",
]

[msg.section_0.entries.30]
text = [
  "[VAR TRNAME(1)]: Monica...$",
]

[msg.section_0.entries.31]
text = [
  "Monica: Ehhhhk!\\n",

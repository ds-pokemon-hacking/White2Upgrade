  "Like a strong feeling of love...\\c\\n",
  "[VAR TRNAME(1)]...\\n",
  "You may be the only one who can do this...$",
]

[msg.section_0.entries.14]
text = [
  "[VAR TRNAME(1)]: ...$",
]

[msg.section_0.entries.15]
text = [
  "Monica: Grrrr! Agggggghh!\\n",

[msg]
trailing_data = "3434"

[msg.section_0.entries.0]
text = [
  "Director: All I want is\\n",
  "interesting acting!$",
]

[msg.section_0.entries.1]
text = [
  "Director: There's no such thing\\n",
  "as a bad movie--just bad acting.$",
]

[msg.section_0.entries.2]
text = [
  "Director: Don't look away!\\n",
  "Think about the other actor!$",
]

[msg.section_0.entries.3]
text = [
  "Director: Act natural...\\n",
  "Just do what you'd do normally!$",
]

[msg.section_0.entries.4]
text = [
  "Director: Be more confident!\\n",
  "It's your film, right?$",
]

[msg.section_0.entries.5]
text = [
  "Director: Your eyes should be more intense.\\n",
  "Relax your body more.$",
]

[msg.section_0.entries.6]
text = [
  "Director: That line!\\n",
  "It's perfect for my film.$",
]

[msg.section_0.entries.7]
text = [
  "Director: Yeah, that line was like a meal\\n",
  "of toast without the jam!$",
]

[msg.section_0.entries.8]
text = [
  "Director: H-huh? What was that?\\n",
  "What was that line supposed to be?$",
]

[msg.section_0.entries.9]
text = [
  "Director: You're going on too long.\\n",
  "I'm going to run out of film!$",
]

[msg.section_0.entries.10]
text = [
  "Director: Yeah, that's better than normal.\\n",
  "This should be a good film.$",
]

[msg.section_0.entries.11]
text = [
  "Director: Aaaah! Cut!\\n",
  "It's done! It's finished! It's over!$",
]

[msg.section_0.entries.12]
text = [
  "Director: Er... Ahhh?\\n",
  "I guess this film is a little odd?$",
]

[msg.section_0.entries.13]
text = [
  "Director: The acting I want to see\\n",
  "is all written in the script. Got it?$",
]

[msg.section_0.entries.14]
text = [
  "Director: Whatever you do,\\n",
  "read the script first.$",
]

[msg.section_0.entries.15]
text = [
  "Director: Your brilliant acting!\\n",
  "That's the only thing I want!$",
]

[msg.section_0.entries.16]
text = [
  "Director: Your acting is addicting!\\n",
  "More! More! Give me more!$",
]

[msg.section_0.entries.17]
text = [
  "Director: Don't look away!\\n",
  "Everyone's watching! I'm watching!$",
]

[msg.section_0.entries.18]
text = [
  "Director: Yes, yes. Really good.\\n",
  "You are really good.$",
]

[msg.section_0.entries.19]
text = [
  "Director: Hold your head high!\\n",
  "This is our film!$",
]

[msg.section_0.entries.20]
text = [
  "Director: Put more intensity in your eyes!\\n",
  "You've got it! You've got it!$",
]

[msg.section_0.entries.21]
text = [
  "Director: That line!\\n",
  "It's a perfect match for our film!$",
]

[msg.section_0.entries.22]
text = [
  "Director: Yes, yes. That line.\\n",
  "It's plain, but you can make it work.$",
]

[msg.section_0.entries.23]
text = [
  "Director: Wh-what was that?!\\n",
  "What was that line you said?$",
]

[msg.section_0.entries.24]
text = [
  "Director: Let's bring things to a close!\\n",
  "I'm sure you know that already, but...$",
]

[msg.section_0.entries.25]
text = [
  "Director: Cuuut! Thanks to your acting,\\n",
  "this film is going to be incredible!$",
]

[msg.section_0.entries.26]
text = [
  "Director: ...Cut!\\n",
  "I don't want to hear any excuses!$",
]

[msg.section_0.entries.27]
text = [
  "Director: Huh? Uummm?\\n",
  "This won't be an ordinary film anyway.$",
]

[msg.section_0.entries.28]
text = [
  "Director: I know I don't have to say this,\\n",
  "but be sure to check the script, OK?$",
]

[msg.section_0.entries.29]
text = [
  "Director: You're reading the script, right?\\n",
  "Let's get the film rolling.$",
]

[msg.section_0.entries.30]
text = [
  "Director: Just your being here\\n",
  "makes the film progress!$",
]

[msg.section_0.entries.31]
text = [
  "Director: You're the best!$",
]

[msg.section_0.entries.32]
text = [
  "Director: Everyone in the world can't\\n",
  "take their eyes off your acting!$",
]

[msg.section_0.entries.33]
text = [
  "Director: Perfect acting...\\n",
  "Put me under your spell!$",
]

[msg.section_0.entries.34]
text = [
  "Director: This is your film!\\n",
  "I'll be sure you're captured perfectly!$",
]

[msg.section_0.entries.35]
text = [
  "Director: You fit my films better\\n",
  "than any other actor!$",
]

[msg.section_0.entries.36]
text = [
  "Director: Amazing! You're the best!\\n",
  "That line sent a shiver down my spine!$",
]

[msg.section_0.entries.37]
text = [
  "Director: Ordinary! It's so ordinary.\\n",
  "But, you can make it work.$",
]

[msg.section_0.entries.38]
text = [
  "Director: What! What was that?\\n",
  "Is that line OK?$",
]

[msg.section_0.entries.39]
text = [
  "Director: We're at the climax.\\n",
  "Put a capper on this one!$",
]

[msg.section_0.entries.40]
text = [
  "Director: Cut! Cuuut!\\n",
  "Got it! It's great! It's perfect!$",
]

[msg.section_0.entries.41]
text = [
  "Director: Cut... What a mess...\\n",
  "I'm going home for today...$",
]

[msg.section_0.entries.42]
text = [
  "Director: Huh? Umm...\\n",
  "This is a very strange film.$",
]

[msg.section_0.entries.43]
text = [
  "Director: I think this script\\n",
  "is perfect for you!$",
]

[msg.section_0.entries.44]
text = [
  "Director: Did you read the script?\\n",
  "I think it's perfect for you!$",
]

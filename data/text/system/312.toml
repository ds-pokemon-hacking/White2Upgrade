[msg.section_0.entries.0]
text = [
  "Director: Hey!\\n",
  "You all right?!$",
]

[msg.section_0.entries.1]
text = [
  "Director: Hey! Get your head in the game!\\n",
  "You've gotta nail this line! Be aggressive.$",
]

[msg.section_0.entries.2]
text = [
  "Director: What are you doing?!\\n",
  "Don't take your eyes off the other actor!$",
]

[msg.section_0.entries.3]
text = [
  "Director: OK! Just like that!\\n",
  "You're doing all right!$",
]

[msg.section_0.entries.4]
text = [
  "Director: Just relax!\\n",
  "Don't be scared of the camera!$",
]

[msg.section_0.entries.5]
text = [
  "Director: Hey! More!\\n",
  "Put more feeling into it!$",
]

[msg.section_0.entries.6]
text = [
  "Director: Mm... That sounds good!\\n",
  "That line gets me right here!$",
]

[msg.section_0.entries.7]
text = [
  "Director: I guess that's all right!\\n",
  "We'll use that line.$",
]

[msg.section_0.entries.8]
text = [
  "Director: What's with that line?!\\n",
  "Are you taking the viewer seriously?$",
]

[msg.section_0.entries.9]
text = [
  "Director: Hey! We're done!\\n",
  "Let's nail the ending!$",
]

[msg.section_0.entries.10]
text = [
  "Director: OK! Cut!\\n",
  "Good work! That was great!$",
]

[msg.section_0.entries.11]
text = [
  "Director: OK! OK! Cut!\\n",
  "I'm done. I'm going home!$",
]

[msg.section_0.entries.12]
text = [
  "Director: Cut, I guess?!\\n",
  "Even I don't know what's going on anymore!$",
]

[msg.section_0.entries.13]
text = [
  "Director: What you need\\n",
  "is to read the script!$",
]

[msg.section_0.entries.14]
text = [
  "Director: The script comes first!\\n",
  "Got it?$",
]

[msg.section_0.entries.15]
text = [
  "Director: Nice...\\n",
  "You've got a good look in your eyes!$",
]

[msg.section_0.entries.16]
text = [
  "Director: Still not there, huh?\\n",
  "Don't lose your concentration.$",
]

[msg.section_0.entries.17]
text = [
  "Director: All right!\\n",
  "That acting is a keeper!$",
]

[msg.section_0.entries.18]
text = [
  "Director: Ain't bad...\\n",
  "But I know you can do better!$",
]

[msg.section_0.entries.19]
text = [
  "Director: Huh...\\n",
  "How far can you go?$",
]

[msg.section_0.entries.20]
text = [
  "Director: Well...\\n",
  "What are you going to do now?$",
]

[msg.section_0.entries.21]
text = [
  "Director: Nice! OK!\\n",
  "That line's a keeper.$",
]

[msg.section_0.entries.22]
text = [
  "Director: Oh, I see...\\n",
  "That line's a cautious choice...$",
]

[msg.section_0.entries.23]
text = [
  "Director: Hey, hey!\\n",
  "That line's not gonna work!$",
]

[msg.section_0.entries.24]
text = [
  "Director: You know what to do, right?\\n",
  "Take us home!$",
]

[msg.section_0.entries.25]
text = [
  "Director: OK! Cut!\\n",
  "All right! This is gonna work!$",
]

[msg.section_0.entries.26]
text = [
  "Director: Cut! Cut!\\n",
  "I've seen enough! We're done!$",
]

[msg.section_0.entries.27]
text = [
  "Director: Cut! Cut!\\n",
  "Opinions will be divided on this one!$",
]

[msg.section_0.entries.28]
text = [
  "Director: You probably know already,\\n",
  "but read the script first...$",
]

[msg.section_0.entries.29]
text = [
  "Director: You've got the script, right?\\n",
  "We'll keep going with the shoot!$",
]

[msg.section_0.entries.30]
text = [
  "Director: Nice! Great!\\n",
  "I feel good watching this!$",
]

[msg.section_0.entries.31]
text = [
  "Director: Wheehoo! That's so cool!$",
]

[msg.section_0.entries.32]
text = [
  "Director: Nice! Nice! Nice!\\n",
  "You're the best!$",
]

[msg.section_0.entries.33]
text = [
  "Director: Heh heh...\\n",
  "You, my friend, are a real actor!$",
]

[msg.section_0.entries.34]
text = [
  "Director: Ha ha ha!\\n",
  "You've got it down!$",
]

[msg.section_0.entries.35]
text = [
  "Director: Niiiice.\\n",
  "Drew me right in.$",
]

[msg.section_0.entries.36]
text = [
  "Director: That sent shivers up my spine!\\n",
  "Now, that was the perfect line!$",
]

[msg.section_0.entries.37]
text = [
  "Director: Not a wasted move...\\n",
  "That line wasn't bad either...$",
]

[msg.section_0.entries.38]
text = [
  "Director: Hey! That OK?!\\n",
  "Is that line gonna be all right?$",
]

[msg.section_0.entries.39]
text = [
  "Director: Your acting decides how\\n",
  "good this film will be! You know that, right?!$",
]

[msg.section_0.entries.40]
text = [
  "Director: Cut!\\n",
  "That's the best! You're the best!$",
]

[msg.section_0.entries.41]
text = [
  "Director: OK! Cut!\\n",
  "Hmm... That might not work...$",
]

[msg.section_0.entries.42]
text = [
  "Director: Cut... I guess...\\n",
  "What's gonna happen with this movie?$",
]

[msg.section_0.entries.43]
text = [
  "Director: Hey! Make sure you're\\n",
  "on top of the script, all right?$",
]

[msg.section_0.entries.44]
text = [
  "Director: I'm talking to you! You got\\n",
  "the script up in that head of yours?$",
]

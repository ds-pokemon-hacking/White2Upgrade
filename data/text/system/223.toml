[msg]
trailing_data = "2e2e"

[msg.section_0.entries.0]
text = [
  "Movie Star$",
]

[msg.section_0.entries.1]
text = [
  "Strange Lady$",
]

[msg.section_0.entries.2]
text = [
  "Bellelba: Stop!$",
]

[msg.section_0.entries.3]
text = [
  "Princess [VAR TRNAME(1)]: H-huh?\\n",
  "Where could I be?\\l\\n",
  "It feels so strange here...\\c\\n",
  "What could that white door\\n",
  "I opened have been, anyway?$",
]

[msg.section_0.entries.4]
text = [
  "Strange Lady: My, my...\\c\\n",
  "It looks like a weak little child\\n",
  "wandered through the\\l\\n",
  "door I set up as a trap.\\c\\n",
  "Eeee hee hee... Great timing.\\n",
  "I need a new servant.$",
]

[msg.section_0.entries.5]
text = [
  "Princess [VAR TRNAME(1)]: Hm? Who are you?\\n",
  "Why are you in a place like this, woman?\\c$",
]

[msg.section_0.entries.6]
text = [
  "Strange Lady: Grr...\\c\\n",
  "Calling someone you just met “woman\\\"?\\n",
  "What a rude little brat!\\c\\n",
  "How can you look like that and\\n",
  "not know how to address people?$",
]

[msg.section_0.entries.7]
text = [
  "Princess [VAR TRNAME(1)]: What's with you?\\c\\n",
  "Ya know, lady? I'd really like\\n",
  "to get out of here soon.\\c\\n",
  "I'm the princess of this kingdom, so show\\n",
  "me how to get back to the castle already!$",
]

[msg.section_0.entries.8]
text = [
  "Strange Lady: I'm afraid that's impossible.\\c\\n",
  "And I'm not just some lady.\\n",
  "I'm the queen of the Land of Enchantment.\\l\\n",
  "My name is Bellelba!$",
]

[msg.section_0.entries.9]
text = [
  "Princess [VAR TRNAME(1)]: How about that...\\n",
  "Queen of the Land of Enchantment, huh?\\l\\n",
  "...\\c\\n",
  "Whoooooa! A w-witch!\\c\\n",
  "I h-have to hurry back\\n",
  "through that door!$",
]

[msg.section_0.entries.10]
text = [
  "Bellelba: Weee hee hee... Fool.\\n",
  "You can't run away.\\l\\n",
  "Have a look behind you.$",
]

[msg.section_0.entries.11]
text = [
  "Princess [VAR TRNAME(1)]: No! No! No!\\n",
  "A Pokémon is blocking the door!\\c\\n",
  "If one of my servants was here,\\n",
  "they'd give it a good wallop, too!$",
]

[msg.section_0.entries.12]
text = [
  "Bellelba: Ah ha ha!\\n",
  "Can't you do anything on your own?\\l\\n",
  "What a pitiful princess!$",
]

[msg.section_0.entries.13]
text = [
  "Princess [VAR TRNAME(1)]: That's right...\\n",
  "I'm alone right now...\\c\\n",
  "I guess if I don't want to be caught,\\n",
  "the only thing to do is fight for myself...$",
]

[msg.section_0.entries.14]
text = [
  "Princess [VAR TRNAME(1)]: I've had it with this!\\n",
  "Those Woobat are getting closer and closer!\\c\\n",
  "I have to hurry and...$",
]

[msg.section_0.entries.15]
text = [
  "Princess [VAR TRNAME(1)]: Defeat them!$",
]

[msg.section_0.entries.16]
text = [
  "Bellelba: Ah ha ha!\\n",
  "Try if you dare!$",
]

[msg.section_0.entries.17]
text = [
  "Princess [VAR TRNAME(1)]: Catch them!$",
]

[msg.section_0.entries.18]
text = [
  "Bellelba: Hey!\\c\\n",
  "Catching someone else's Pokémon\\n",
  "is stealing! That's common sense, right?!$",
]

[msg.section_0.entries.19]
text = [
  "Princess [VAR TRNAME(1)]: Use my Pokédex!$",
]

[msg.section_0.entries.20]
text = [
  "Bellelba: You've got to be kidding...\\n",
  "Woobat is a Bat Pokémon!\\c\\n",
  "And just so you know, Swoobat\\n",
  "is a Courting Pokémon!\\c\\n",
  "Sigh... Are you that confident?\\n",
  "Or that stupid?$",
]

[msg.section_0.entries.21]
text = [
  "Bellelba: You're wasting your time.\\n",
  "Once you pass through that door,\\l\\n",
  "you can't go back to your own world.\\c\\n",
  "Your destiny is to be caught by me\\n",
  "and to become my loyal servant.$",
]

[msg.section_0.entries.22]
text = [
  "Princess [VAR TRNAME(1)]: Well...\\n",
  "They're even closer than before!\\c\\n",
  "I don't want to be a servant!\\n",
  "Me serving someone else?!\\l\\n",
  "That's impossible!$",
]

[msg.section_0.entries.23]
text = [
  "Bellelba: Acting tough, are we?\\n",
  "You're worth pushing around, aren't you?\\l\\n",
  "Hah...$",
]

[msg.section_0.entries.24]
text = [
  "Bellelba: OK!\\n",
  "We've almost got you!\\c\\n",
  "Are you ready?\\n",
  "You'll be in my clutches soon!$",
]

[msg.section_0.entries.25]
text = [
  "Princess [VAR TRNAME(1)]: I won't quit!$",
]

[msg.section_0.entries.26]
text = [
  "Bellelba: Oh...\\n",
  "Feeling brave, huh?\\c\\n",
  "That just makes me want\\n",
  "to make you suffer more!\\c\\n",
  "Ah ha ha ha ha...$",
]

[msg.section_0.entries.27]
text = [
  "Princess [VAR TRNAME(1)]: I'm done for!$",
]

[msg.section_0.entries.28]
text = [
  "Bellelba: Oh, how pessimistic.\\c\\n",
  "Oh, the youth of today give up\\n",
  "so very easily...\\l\\n",
  "Well, time to join me, then!$",
]

[msg.section_0.entries.29]
text = [
  "Princess [VAR TRNAME(1)]: But I'm rich!$",
]

[msg.section_0.entries.30]
text = [
  "Bellelba: What? Money?\\n",
  "That's a weird thing for a brat to say!\\c\\n",
  "A-and it's not like I want\\n",
  "your money anyway!$",
]

[msg.section_0.entries.31]
text = [
  "Princess [VAR TRNAME(1)]: Oh...\\n",
  "If I'd only listened to Father,\\l\\n",
  "I wouldn't be in this mess.\\c\\n",
  "No one's going to come save me...\\n",
  "Guess I have to do something on my own...$",
]

[msg.section_0.entries.32]
text = [
  "Bellelba: Eee hee hee...\\n",
  "What are you mumbling about?!\\c\\n",
  "You're almost ours now!$",
]

[msg.section_0.entries.33]
text = [
  "Princess [VAR TRNAME(1)]: Oh...\\n",
  "I wonder if I can win...\\c\\n",
  "I don't even care anymore...$",
]

[msg.section_0.entries.34]
text = [
  "Bellelba: Eee hee hee... Wonderful...\\n",
  "I'll tell you something interesting.\\c\\n",
  "Breathing the air in this world\\n",
  "saps your will.\\c\\n",
  "I wonder how long you and your Pokémon\\n",
  "will have the desire to keep fighting.$",
]

[msg.section_0.entries.35]
text = [
  "Princess [VAR TRNAME(1)]: Sheesh...\\n",
  "This...is really stupid...\\l\\n",
  "But...if I don't beat you...\\l\\n",
  "I'll be made a servant...$",
]

[msg.section_0.entries.36]
text = [
  "Bellelba: Not bad at all.\\n",
  "B-by the way, what was that\\l\\n",
  "money you were talking about earlier?$",
]

[msg.section_0.entries.37]
text = [
  "Princess [VAR TRNAME(1)]: Ha ha haaa!\\n",
  "This is my allowance for ONE week!\\c\\n",
  "Don't you want it?\\n",
  "If you want to be rich,\\l\\n",
  "send me to my castle now!$",
]

[msg.section_0.entries.38]
text = [
  "Bellelba: Wh-whaaat?!\\n",
  "In one week, you get THIS much\\l\\n",
  "money for an allowance?!\\c\\n",
  "Wow! Is my fortune so small?$",
]

[msg.section_0.entries.39]
text = [
  "Princess [VAR TRNAME(1)]: Hee hee...\\n",
  "Poor peasant...\\l\\n",
  "I'm heiress to the throne!\\l\\n",
  "Of course there's a difference!$",
]

[msg.section_0.entries.40]
text = [
  "Bellelba: Gr...\\c\\n",
  "I'm going to take your money,\\n",
  "your crown, and everything else!$",
]

[msg.section_0.entries.41]
text = [
  "Bellelba: You're kidding!\\n",
  "You're so weak!$",
]

[msg.section_0.entries.42]
text = [
  "Princess [VAR TRNAME(1)]: No...\\n",
  "I lost...$",
]

[msg.section_0.entries.43]
text = [
  "Bellelba: Wow...\\n",
  "Wouldn't it be better if you\\l\\n",
  "trained in battle a little bit?$",
]

[msg.section_0.entries.44]
text = [
  "Princess [VAR TRNAME(1)]: Yes...\\n",
  "You're exactly right...$",
]

[msg.section_0.entries.45]
text = [
  "Bellelba: Good grief...\\n",
  "Instead of getting soft in the castle,\\l\\n",
  "how about going on a journey?\\c\\n",
  "Well... Actually, I know this guy--\\n",
  "his head is as smooth as a cue ball,\\l\\n",
  "and he's really tough.\\l\\n",
  "Shall I introduce him to you?$",
]

[msg.section_0.entries.46]
text = [
  "Princess [VAR TRNAME(1)]: What? Really?\\c\\n",
  "An older guy? Bald? Tough?\\n",
  "Sounds handsome--just my type!\\c\\n",
  "You don't mind?\\n",
  "I'd really, really like that!\\c\\n",
  "Yaaay! Yaaay!\\n",
  "Bald and handsome!$",
]

[msg.section_0.entries.47]
text = [
  "Bellelba: Wow...\\c\\n",
  "I don't want a brat like you\\n",
  "in my Land of Enchantment...$",
]

[msg.section_0.entries.48]
text = [
  "So Princess [VAR TRNAME(1)]\\n",
  "set off to train.\\c\\n",
  "Or better said, she set off\\n",
  "on a journey to meet the guy.\\c\\n",
  "At any rate, she got out\\n",
  "of the door safely,\\l\\n",
  "so that's probably for the best...$",
]

[msg.section_0.entries.49]
text = [
  "Princess [VAR TRNAME(1)]: Oh, I'm so tired...$",
]

[msg.section_0.entries.50]
text = [
  "Bellelba: Well now...\\n",
  "I'm all caught up!\\c\\n",
  "Are you ready?$",
]

[msg.section_0.entries.51]
text = [
  "Princess [VAR TRNAME(1)]: Help!\\n",
  "Father, save me!\\c\\n",
  "If I'd known this was going to happen,\\n",
  "I'd have listened and behaved better!$",
]

[msg.section_0.entries.52]
text = [
  "Bellelba: Eee hee heee...\\n",
  "I knew you were a princess\\l\\n",
  "from the very beginning.\\c\\n",
  "And that you are a vapid, foolish princess\\n",
  "who doesn't listen to her parents\\l\\n",
  "and does nothing more than goof off.\\c\\n",
  "I already anticipated\\n",
  "that you'd come here.\\c\\n",
  "And now, that foolish princess\\n",
  "is going to go missing.\\c\\n",
  "When that happens, it will cause\\n",
  "chaos in the country, and a war will begin.$",
]

[msg.section_0.entries.53]
text = [
  "Princess [VAR TRNAME(1)]: What's that about?\\n",
  "Something like that would never happen\\l\\n",
  "in a kingdom like mine!$",
]

[msg.section_0.entries.54]
text = [
  "Bellelba: I wonder about that...\\c\\n",
  "Do you think people can trust a king\\n",
  "who can't protect his heiress,\\l\\n",
  "even if it is an idiot like you?\\c\\n",
  "I also suspect that your father\\n",
  "will get worn out as he tears apart\\l\\n",
  "everything looking for you.\\c\\n",
  "Some nobleman might take advantage\\n",
  "of this and take his place.$",
]

[msg.section_0.entries.55]
text = [
  "Princess [VAR TRNAME(1)]: You...\\n",
  "You were hired by the nobleman!\\c\\n",
  "Father! Father!\\n",
  "[VAR TRNAME(1)] is here!$",
]

[msg.section_0.entries.56]
text = [
  "Bellelba: That's not going to work.\\n",
  "I don't think you have time to worry.\\c\\n",
  "From today on, you're my new servant.\\c\\n",
  "Let's go! Get walking!$",
]

[msg.section_0.entries.57]
text = [
  "The captured Princess [VAR TRNAME(1)]\\n",
  "is said to have worked in Bellelba's mansion\\l\\n",
  "until she died...\\c\\n",
  "As Bellelba said, the evil nobleman\\n",
  "stole the throne from the king\\l\\n",
  "and the country was destroyed...$",
]

[msg.section_0.entries.58]
text = [
  "Princess [VAR TRNAME(1)]: I did it!\\n",
  "I defeated the Swoobat!\\l\\n",
  "I can escape now...\\c\\n",
  "Huh?!$",
]

[msg.section_0.entries.59]
text = [
  "Princess [VAR TRNAME(1)]: Where is it?\\n",
  "Come on! Where's the exit?\\l\\n",
  "Where is that door?!$",
]

[msg.section_0.entries.60]
text = [
  "Bellelba: Oh my, didn't I say\\n",
  "that escape was impossible?\\c\\n",
  "The door back to your old world\\n",
  "isn't here anymore!$",
]

[msg.section_0.entries.61]
text = [
  "Princess [VAR TRNAME(1)]: What's that about!\\n",
  "What in the world is going on?$",
]

[msg.section_0.entries.62]
text = [
  "Bellelba: Good grief you're loud.\\n",
  "It would be a lot of trouble if you\\l\\n",
  "went on a rampage and found the real door.\\c\\n",
  "For now, I guess I'll just\\n",
  "shut you in this Magic Cage...$",
]

[msg.section_0.entries.63]
text = [
  "Magic Cage: Clank!\\c\\n",
  "Princess [VAR TRNAME(1)]: Whaaa!\\n",
  "Let go of me! Let me out of here!$",
]

[msg.section_0.entries.64]
text = [
  "The strange lady who calls herself\\n",
  "the magic queen, Bellelba,\\l\\n",
  "put Princess [VAR TRNAME(1)]\\l\\n",
  "in a Magic Cage after she'd\\l\\n",
  "wandered into this world.\\c\\n",
  "Can Princess [VAR TRNAME(1)]\\n",
  "safely return to her own world?\\c\\n",
  "All we can do is hope\\n",
  "for her safe return...$",
]

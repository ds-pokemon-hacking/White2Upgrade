[msg.section_0.entries.53]
text = [
  "Mystery Gift allows you\\n",
  "to receive great gifts\\l\\n",
  "through various communication modes.\\c\\n",
  "Once you have received a gift,\\n",
  "please go to any Pokémon Center and\\l\\n",
  "pick it up from the deliveryman.\\c$",
]

[msg.section_0.entries.54]
text = [
  "When you've received your Mystery Gift,\\n",
  "your Wonder Card will be displayed\\l\\n",
  "in the Card Album.\\c\\n",
  "You can check the card to see\\n",
  "if you've picked up the gift\\l\\n",
  "from a deliveryman.\\c\\n",
  "Make sure to pick up gifts\\n",
  "that are waiting for you.\\c\\n",
  "There is a limit to how many\\n",
  "cards you can save in the Album.\\c\\n",
  "You can store up to 12 cards if you\\n",
  "have previously saved your game.\\c\\n",
  "If you don't have a saved game yet,\\n",
  "you can store up to three cards.\\c\\n",
  "When the card slots are full, you will not\\n",
  "be able to receive any more. Please delete\\l\\n",
  "some from the Album.\\c$",
]

[msg.section_0.entries.55]
text = [
  "When the Card Album is full,\\n",
  "you cannot receive new cards.\\c\\n",
  "To receive new cards,\\n",
  "choose a Wonder Card and\\l\\n",
  "press the A Button to throw it away.\\c\\n",
  "If you have gifts waiting,\\n",
  "go to any Pokémon Center\\c\\n",
  "and pick up your gifts\\n",
  "from the deliveryman.\\c$",
]

[msg.section_0.entries.56]
text = [
  "When you've received a Mystery Gift,\\n",

[msg]
trailing_data = "0808"

[msg.section_0.entries.0]
text = [
  "Suit Actor$",
]

[msg.section_0.entries.1]
text = [
  "Midnight$",
]

[msg.section_0.entries.2]
text = [
  "[VAR TRNAME(1)]: (...Humanoids only cry and\\n",
  "roar, so they seem to be unintelligent\\l\\n",
  "and emotionless...\\c\\n",
  "But that monster is totally different!\\c\\n",
  "It's beyond human understanding...)$",
]

[msg.section_0.entries.3]
text = [
  "Monster in the Fog: Boofooaar...$",
]

[msg.section_0.entries.4]
text = [
  "[VAR TRNAME(1)]: The red fog has become\\n",
  "stagnant. It's surrounding the monster...\\l\\n",
  "As long as the fog exists...$",
]

[msg.section_0.entries.5]
text = [
  "Red Fog: Kerplunk...$",
]

[msg.section_0.entries.6]
text = [
  "[VAR TRNAME(1)]: Argh...\\n",
  "So strong...$",
]

[msg.section_0.entries.7]
text = [
  "Monster in the Fog: Boofooaar...\\n",
  "To face me and fight...\\l\\n",
  "Courage? Incomprehensible.\\l\\n",
  "Foolish...$",
]

[msg.section_0.entries.8]
text = [
  "[VAR TRNAME(1)]: I have to hurry...\\n",
  "I have to defeat the monster soon\\l\\n",
  "or the fog will keep growing\\l\\n",
  "and become too much to handle...$",
]

[msg.section_0.entries.9]
text = [
  "Monster in the Fog: Boofooar...\\n",
  "The end is near...$",
]

[msg.section_0.entries.10]
text = [
  "[VAR TRNAME(1)]: I don't have much time!$",
]

[msg.section_0.entries.11]
text = [
  "Monster in the Fog: Time...\\n",
  "has no meaning...\\l\\n",
  "I am eternal...$",
]

[msg.section_0.entries.12]
text = [
  "[VAR TRNAME(1)]: No!\\n",
  "I have to do something right this moment!$",
]

[msg.section_0.entries.13]
text = [
  "Monster in the Fog: All life-forms...\\n",
  "will be terminated...\\l\\n",
  "Everything will turn into nothing...$",
]

[msg.section_0.entries.14]
text = [
  "???: Boboaaaarr!$",
]

[msg.section_0.entries.15]
text = [
  "[VAR TRNAME(1)]: Huh?\\n",
  "I hear something...different...$",
]

[msg.section_0.entries.16]
text = [
  "???: Bewbaaar...\\n",
  "Babalooloo...$",
]

[msg.section_0.entries.17]
text = [
  "[VAR TRNAME(1)]: (...There it is again!\\n",
  "My ears aren't playing tricks on me!\\l\\n",
  "It doesn't sound like the humanoids, either.\\l\\n",
  "What could be making this noise?...)$",
]

[msg.section_0.entries.18]
text = [
  "???: Blublublub...$",
]

[msg.section_0.entries.19]
text = [
  "[VAR TRNAME(1)]: (...Could this be the voice\\n",
  "of the humanoids' big boss?...)$",
]

[msg.section_0.entries.20]
text = [
  "[VAR TRNAME(1)]: Argh...$",
]

[msg.section_0.entries.21]
text = [
  "Humanoid: Graagroan!\\n",
  "... ...\\c$",
]

[msg.section_0.entries.22]
text = [
  "[VAR TRNAME(1)]: Yikes!$",
]

[msg.section_0.entries.23]
text = [
  "[VAR TRNAME(1)]: That humanoid...\\n",
  "It looked like it used Selfdestruct!\\l\\n",
  "Was it trying to take down my Pokémon?$",
]

[msg.section_0.entries.24]
text = [
  "???: Boohaha! Booheehee!\\n",
  "Barhehe! Boowow!$",
]

[msg.section_0.entries.25]
text = [
  "[VAR TRNAME(1)]: That voice again! It's laughing!\\n",
  "How can it be laughing when its ally is down?\\c\\n",
  "This truly is...\\n",
  "a monster...$",
]

[msg.section_0.entries.26]
text = [
  "Monster: Blublublub...\\n",
  "Humans...\\l\\n",
  "will be my slaves...\\c\\n",
  "Blublubleh! Blubeaaar!$",
]

[msg.section_0.entries.27]
text = [
  "[VAR TRNAME(1)]: Its words...\\n",
  "Ugh! They're echoing in my head!\\c\\n",
  "Telepathy? No, it's something vile!\\c\\n",
  "It's making my head go crazy!\\n",
  "This is...$",
]

[msg.section_0.entries.28]
text = [
  "Monster: Boobleeeaah!$",
]

[msg.section_0.entries.29]
text = [
  "[VAR TRNAME(1)]: What in the world is it?$",
]

[msg.section_0.entries.30]
text = [
  "Monster: Boofoo...\\n",
  "The bottom of darkness...\\l\\n",
  "From the dust clouds...\\l\\n",
  "Boofooroar, boofat, blublub...$",
]

[msg.section_0.entries.31]
text = [
  "[VAR TRNAME(1)]: I won't forgive you!$",
]

[msg.section_0.entries.32]
text = [
  "Monster: Baafaarh!\\c\\n",
  "This is the spirit...\\n",
  "of a life-form on this planet...$",
]

[msg.section_0.entries.33]
text = [
  "[VAR TRNAME(1)]: The dawn has broken?$",
]

[msg.section_0.entries.34]
text = [
  "Monster: Light...\\n",
  "The power of the dust clouds\\l\\n",
  "will subside!$",
]

[msg.section_0.entries.35]
text = [
  "[VAR TRNAME(1)]: The monster seems\\n",
  "to be...suffering?$",
]

[msg.section_0.entries.36]
text = [
  "Monster: Spirit... How useless!$",
]

[msg.section_0.entries.37]
text = [
  "[VAR TRNAME(1)]: Bring it on!\\n",
  "I will never lose to you!$",
]

[msg.section_0.entries.38]
text = [
  "Monster: Boofoolooloo!\\n",
  "You are just a foolish life-form on a\\l\\n",
  "tiny planet!$",
]

[msg.section_0.entries.39]
text = [
  "[VAR TRNAME(1)]: Don't underestimate humans!$",
]

[msg.section_0.entries.40]
text = [
  "Monster: Boobleeeaah...$",
]

[msg.section_0.entries.41]
text = [
  "Monster: Blublah...\\c\\n",
  "The life-forms on this planet are\\n",
  "too fragile...$",
]

[msg.section_0.entries.42]
text = [
  "[VAR TRNAME(1)]: Argh...\\n",
  "My head hurts...\\l\\n",
  "so much...\\c\\n",
  "This is...so vile...\\n",
  "Is this the monster's true power?$",
]

[msg.section_0.entries.43]
text = [
  "Monster: Foolish of you to ask\\n",
  "me a question...\\c\\n",
  "The answer will engulf you to take you down\\n",
  "to the bottom of darkness...$",
]

[msg.section_0.entries.44]
text = [
  "[VAR TRNAME(1)]: What...what are you saying?$",
]

[msg.section_0.entries.45]
text = [
  "Monster: Boofoolooloo!\\c\\n",
  "Foolish life-form!\\n",
  "We shall never see each other again.$",
]

[msg.section_0.entries.46]
text = [
  "Monster: Booshoooah...\\c\\n",
  "...$",
]

[msg.section_0.entries.47]
text = [
  "[VAR TRNAME(1)]: The fog... It's cleared...\\c\\n",
  "What was that monster after all?$",
]

[msg.section_0.entries.48]
text = [
  "The red fog that brought\\n",
  "terror to people disappeared into the\\l\\n",
  "light of dawn as the screech\\l\\n",
  "of the monster subsided...\\c\\n",
  "Was everything a dream or an illusion?\\n",
  "No one knows the truth...$",
]

[msg.section_0.entries.49]
text = [
  "Monster: The beginning of the end...\\n",
  "The end of your usual days...$",
]

[msg.section_0.entries.50]
text = [
  "[VAR TRNAME(1)]: Argh!\\n",
  "I can't take this anymore...$",
]

[msg.section_0.entries.51]
text = [
  "Monster: Booheehee!\\n",
  "Booheehaha!\\c\\n",
  "The life-forms of this world...\\n",
  "Time for them to come to an end...$",
]

[msg.section_0.entries.52]
text = [
  "[VAR TRNAME(1)]: No, nooo!\\n",
  "Aiyeeeeeeeeeee...\\c\\n",
  "...!$",
]

[msg.section_0.entries.53]
text = [
  "Monster: Blublublub...\\c\\n",
  "All will be stained red...$",
]

[msg.section_0.entries.54]
text = [
  "That day, that time,\\n",
  "the red fog engulfed everything\\l\\n",
  "and all life-forms disappeared...\\c\\n",
  "No more hope, no more despair,\\n",
  "no light, no shadows remained.\\c\\n",
  "The world returned to nothingness...$",
]

[msg.section_0.entries.55]
text = [
  "Monster: How persistent...\\c\\n",
  "It seems your life force is comparable\\n",
  "to mine?$",
]

[msg.section_0.entries.56]
text = [
  "[VAR TRNAME(1)]: I don't care about\\n",
  "the dust clouds or the 11th dimension!\\l\\n",
  "But this is my planet!\\c\\n",
  "That's right! Only I can become the\\n",
  "absolute ruler beyond humans!\\c\\n",
  "You're just a gross thing with tentacles.\\n",
  "You aren't welcome here!\\c\\n",
  "Withdraw yourself into the\\n",
  "far end of the universe!$",
]

[msg.section_0.entries.57]
text = [
  "Monster: Aiyee!\\c\\n",
  "I'm done for!$",
]

[msg.section_0.entries.58]
text = [
  "[VAR TRNAME(1)]: The sheer power of my will\\n",
  "easily defeated that monster...\\c\\n",
  "I am indeed the most powerful life-form!\\n",
  "One day I will rule this world...and\\l\\n",
  "eventually become queen of the universe!$",
]

[msg.section_0.entries.59]
text = [
  "[VAR TRNAME(1)] defeated the unknown monster\\n",
  "with crushing might!\\c\\n",
  "Is she no longer human?\\n",
  "And what of her goal to become\\l\\n",
  "queen of the universe?$",
]

[msg.section_0.entries.60]
text = [
  "The identity of the monster in the fog\\n",
  "remains an unsolved mystery...\\c\\n",
  "The mysterious midnight phenomenon has\\n",
  "come to an end, but in the process,\\l\\n",
  "another mystery has come to light...$",
]

[msg.section_0.entries.61]
text = [
  "[VAR TRNAME(1)]: This fog...\\n",
  "Even a Pokémon using Defog can't clear it!$",
]

[msg.section_0.entries.62]
text = [
  "Monster: The red fog...\\n",
  "It is the same as me.\\l\\n",
  "We are from the 11th dimension.\\c\\n",
  "Third-dimension life-forms like yourself\\n",
  "cannot even touch it...$",
]

[msg.section_0.entries.63]
text = [
  "[VAR TRNAME(1)]: What can I do now...$",
]

[msg.section_0.entries.64]
text = [
  "Monster: You'll just waste time thinking.\\c\\n",
  "Third-dimension ideas could never defeat\\n",
  "a being from the 11th dimension.$",
]

[msg.section_0.entries.65]
text = [
  "[VAR TRNAME(1)]: You are wrong...\\n",
  "It's not a waste!$",
]

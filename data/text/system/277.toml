[msg.section_0.entries.0]
text = [
  "[CENTER]The Unova Defense Force (UDF)...\\n",
  "\\n",
  "[CENTER]This organization strives to keep\\n",
  "[CENTER]the Unova region at peace...\\n",
  "\\n",
  "[CENTER]This is the story of\\n",
  "[CENTER]their valiant struggle...$",
]

[msg.section_0.entries.1]
text = [
  "[CENTER]The future of humanity rested\\n",
  "[CENTER]on the decoy.\\n",
  "\\n",
  "[CENTER]The efforts of\\n",
  "[CENTER]the young recruit [VAR TRNAME(1)]\\n",
  "[CENTER]and the UFO researcher E\\n",
  "[CENTER]had the plan heading for success...$",
]

[msg.section_0.entries.2]
text = [
  "[CENTER]However...$",
]

[msg.section_0.entries.3]
text = [
  "[CENTER]Just when the plan\\n",
  "[CENTER]seemed likely to succeed,\\n",
  "[CENTER]E began to change...$",
]

[msg.section_0.entries.4]
text = [
  "[CENTER]The mystery of the UFO invasion...\\n",
  "[CENTER]The approaching mothership...\\n",
  "[CENTER]E's true identity...\\n",
  "\\n",
  "[CENTER]What is the future of humanity?$",
]


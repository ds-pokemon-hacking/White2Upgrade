[msg.section_0.entries.0]
text = [
  "Suit Actor$",
]

[msg.section_0.entries.1]
text = [
  "Mysterious$",
]

[msg.section_0.entries.2]
text = [
  "Crying Woman: Help! Someone!\\n",
  "Someone, please help me!$",
]

[msg.section_0.entries.3]
text = [
  "Pallid Man: Yeeek!\\n",
  "I'm finished! The UFO is...!$",
]

[msg.section_0.entries.4]
text = [
  "Panicking Woman: Get out of my way!\\n",
  "I'll escape first!$",
]

[msg.section_0.entries.5]
text = [
  "Trapped Man: Heeeelp!\\n",
  "Don't leave me here alone!$",
]

[msg.section_0.entries.6]
text = [
  "Wailing Child: Aieeee! No!\\n",
  "Waaaait for me!$",
]

[msg.section_0.entries.7]
text = [
  "Panicking Man: Arrrrgh! This is an outrage!\\n",
  "I refuse to be taken by a stinking UFO!$",
]

[msg.section_0.entries.8]
text = [
  "Exhausted Child: Pant...pant...\\n",
  "I...can't go on... Can't run...anymore...$",
]

[msg.section_0.entries.9]
text = [
  "Radio: All points! All points!\\n",
  "Do you copy, [VAR TRNAME(1)]?\\l\\n",
  "Report on the situation status!$",
]

[msg.section_0.entries.10]
text = [
  "[VAR TRNAME(1)]: Copy that.\\c\\n",
  "A Pokémon has appeared from\\n",
  "an enormous UFO!\\l\\n",
  "It's attacking people!\\c\\n",
  "The city is in total chaos from\\n",
  "everyone trying to get away!$",
]

[msg.section_0.entries.11]
text = [
  "Radio: We copy!\\c\\n",
  "Your first priority is to secure\\n",
  "people's safety!\\c\\n",
  "Rescue anyone under attack, and\\n",
  "get survivors to a safe place.\\l\\n",
  "Acknowledge!$",
]

[msg.section_0.entries.12]
text = [
  "[VAR TRNAME(1)]: I copy! Safety first!$",
]

[msg.section_0.entries.13]
text = [
  "Trapped Woman: Thank you!\\n",
  "I owe you my life!$",
]

[msg.section_0.entries.14]
text = [
  "[VAR TRNAME(1)]: It's too dangerous here!\\n",
  "Keep your head down and get out of here!$",
]

[msg.section_0.entries.15]
text = [
  "Trapped Woman: Yes!\\n",
  "You be careful, too!\\c\\n",
  "With my own eyes, I saw the UFO\\n",
  "abducting people and Pokémon!$",
]

[msg.section_0.entries.16]
text = [
  "[VAR TRNAME(1)]: What...?$",
]

[msg.section_0.entries.17]
text = [
  "[VAR TRNAME(1)]: Madam!\\n",
  "Are you all right?$",
]

[msg.section_0.entries.18]
text = [
  "Elderly Woman: I'm so sorry.\\n",
  "At my age, I can't run very fast.$",
]

[msg.section_0.entries.19]
text = [
  "[VAR TRNAME(1)]: It's too dangerous here!\\n",
  "Keep your head down and get out of here!$",
]

[msg.section_0.entries.20]
text = [
  "Elderly Woman: Yes. Yes.\\n",
  "I understand...\\c\\n",
  "Oh no!\\c\\n",
  "Aieee!\\n",
  "Behind you! Behind you!$",
]

[msg.section_0.entries.21]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.22]
text = [
  "[VAR TRNAME(1)]: Ugh. Not good.\\n",
  "It's heading in this direction...\\c\\n",
  "Wh-what is this thing?\\n",
  "The body of the UFO is starting\\l\\n",
  "to glow...$",
]

[msg.section_0.entries.23]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.24]
text = [
  "Elderly Woman: Aghhhhh...\\n",
  "I don't think I can stand...\\l\\n",
  "I think I'm paralyzed...$",
]

[msg.section_0.entries.25]
text = [
  "[VAR TRNAME(1)]: (...What'll I do?...)\\n",
  "(...If I leave here now,\\l\\n",
  "she'll be in danger...)$",
]

[msg.section_0.entries.26]
text = [
  "Elderly Woman: This is it...\\n",
  "Ah... My dear...\\l\\n",
  "I'm going to see you again at last...$",
]

[msg.section_0.entries.27]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.28]
text = [
  "[VAR TRNAME(1)]: I can't stand it! Run!$",
]

[msg.section_0.entries.29]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.30]
text = [
  "[VAR TRNAME(1)]: I'll block it here!$",
]

[msg.section_0.entries.31]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.32]
text = [
  "[VAR TRNAME(1)]: What can I do?$",
]

[msg.section_0.entries.33]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.34]
text = [
  "Woman: Eeeeeeek! Help me!$",
]

[msg.section_0.entries.35]
text = [
  "[VAR TRNAME(1)]: Argh...\\n",
  "Everyone was caught\\l\\n",
  "by the UFO...\\c\\n",
  "I may be the only one left...$",
]

[msg.section_0.entries.36]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.37]
text = [
  "[VAR TRNAME(1)]: Wha...\\n",
  "The UFO is emitting a bright light...\\l\\n",
  "Arrgh! Too bright...$",
]

[msg.section_0.entries.38]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.39]
text = [
  "Radio: All points! Can anyone hear me?!\\n",
  "[VAR TRNAME(1)], respond!\\l\\n",
  "Report on the situation status!$",
]

[msg.section_0.entries.40]
text = [
  "[VAR TRNAME(1)]: Cap... Captain...\\c\\n",
  "Ahhh... I can't...\\n",
  "The light is so bright...\\c\\n",
  "Sigh... It's kind of...comfortable...\\c\\n",
  "Getting...sleepy...$",
]

[msg.section_0.entries.41]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.42]
text = [
  "Radio: [VAR TRNAME(1)]!\\c\\n",
  "Hang on, [VAR TRNAME(1)]!\\n",
  "[VAR TRNAME(1)]! [VAR TRNAME(1)]!$",
]

[msg.section_0.entries.43]
text = [
  "[VAR TRNAME(1)]: Uhhh... I'm done!\\c\\n",
  "I'm helpless...\\n",
  "Need reinforcements...from HQ...$",
]

[msg.section_0.entries.44]
text = [
  "Radio: Come in, [VAR TRNAME(1)]...\\c\\n",
  "Respond, [VAR TRNAME(1)]!\\n",
  "Can you hear me?$",
]

[msg.section_0.entries.45]
text = [
  "[VAR TRNAME(1)]: Captain!\\n",
  "I'm sorry.\\c\\n",
  "All my Pokémon have been\\n",
  "wiped out by the UFO.\\l\\n",
  "We need reinforcements badly!$",
]

[msg.section_0.entries.46]
text = [
  "Radio: [VAR TRNAME(1)]...\\n",
  "I'm sorry. I'm afraid...\\c\\n",
  "That's not possible...$",
]

[msg.section_0.entries.47]
text = [
  "[VAR TRNAME(1)]: Wh-why?\\n",
  "As long as I have Pokémon at my side,\\l\\n",
  "I can still fight!$",
]

[msg.section_0.entries.48]
text = [
  "Radio: [VAR TRNAME(1)]...\\c\\n",
  "A report has been relayed to us...\\n",
  "The Unova Defense Force HQ has been\\l\\n",
  "destroyed by an additional gigantic UFO...\\l\\n",
  "Our team has been wiped out...\\c\\n",
  "[VAR TRNAME(1)]... Save yourself.\\c\\n",
  "Get away! Quickly!$",
]

[msg.section_0.entries.49]
text = [
  "[VAR TRNAME(1)]: It can't be true...\\n",
  "The Unova Defense Force...\\l\\n",
  "Wiped out?!$",
]

[msg.section_0.entries.50]
text = [
  "[VAR TRNAME(1)]: Well, I think I'll be safe here.\\n",
  "You know, don't sweat the small stuff.\\l\\n",
  "...But it's not all small stuff.\\c\\n",
  "Realistically, there's no use in trying\\n",
  "to fight a thing this size.$",
]

[msg.section_0.entries.51]
text = [
  "[VAR TRNAME(1)]: Tch!\\n",
  "Has it found me?!$",
]

[msg.section_0.entries.52]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.53]
text = [
  "[VAR TRNAME(1)]: ...\\n",
  "So, it comes to this...$",
]

[msg.section_0.entries.54]
text = [
  "[VAR TRNAME(1)]: Hey! UFO!\\n",
  "Listen up!$",
]

[msg.section_0.entries.55]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.56]
text = [
  "[VAR TRNAME(1)]: Hey, UFO!\\n",
  "What are you trying to do here?\\l\\n",
  "Are you planning to conquer this planet?\\c\\n",
  "In that case...\\n",
  "I can help!\\c\\n",
  "I'll cooperate with you, and\\n",
  "in return, you let me go.\\l\\n",
  "What do you say?$",
]

[msg.section_0.entries.57]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.58]
text = [
  "Terrorized by the UFO attacks,\\n",
  "[VAR TRNAME(1)] gave in to her fears.\\c\\n",
  "[VAR TRNAME(1)] betrayed humanity...\\c\\n",
  "In later times, [VAR TRNAME(1)] became the\\n",
  "mouthpiece and agent of the UFO...\\c\\n",
  "Her appearance...horrifyingly altered...$",
]

[msg.section_0.entries.59]
text = [
  "[VAR TRNAME(1)]: OK.\\n",
  "All civilians have been evacuated.\\c\\n",
  "Now to take care of that UFO!$",
]

[msg.section_0.entries.60]
text = [
  "UFO: ...$",
]

[msg.section_0.entries.61]
text = [
  "[VAR TRNAME(1)]: Wh-what?\\n",
  "The UFO is vanishing into space!$",
]

[msg.section_0.entries.62]
text = [
  "[VAR TRNAME(1)]: Did it give up?\\n",
  "Was it...retreating?$",
]

[msg.section_0.entries.63]
text = [
  "???: ...No.\\c\\n",
  "...The UFO did not retreat...$",
]

[msg.section_0.entries.64]
text = [
  "A mysterious UFO appeared out of nowhere\\n",
  "and started capturing human beings...\\c\\n",
  "[VAR TRNAME(1)] rescued many\\n",
  "people from this fearful situation.\\c\\n",
  "But who is this mysterious person who\\n",
  "has appeared before her?\\c\\n",
  "Humanity's continued existence is at stake.\\n",
  "And the battle has just begun...$",
]
